/ 영역: someSub 안 (지역)\n    ...                     // 생존 기간: 프로그램 실행 전체\n}<\/pre>\n<pre class=\"code\">void printheader() { ... }\nvoid compute() {\n    int sum;\n    printheader();          // printheader 실행 중 sum은 영역 밖(안 보임)\n}                           // 하지만 sum은 살아 있음(생존 기간 안)<\/pre><\/section>\n<section class=\"sec\" id=\"s-ref-env\"><h3>참조 환경<\/h3><p><b>참조 환경<\/b> (referencing environment): 어떤 문장에서 <b>가시적인 모든 이름의 집합<\/b>.<\/p>\n<ul><li><b>정적 영역 언어<\/b>: 지역 변수 + <b>모든 정적 조상<\/b>의 가시 변수<\/li><li><b>동적 영역 언어<\/b>: 지역 변수 + <b>현재 활성화된 모든 부프로그램<\/b>의 가시 변수<\/li><li><b>활성화<\/b>(active) 부프로그램: 실행을 시작했지만 아직 종료하지 않은 부프로그램<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-named-const\"><h3>이름 상수<\/h3><p><b>이름 상수<\/b> (named constant): 값에 <b>한 번만<\/b> 바인딩되는 변수.<\/p>\n<ul><li>장점: <b>판독성<\/b>(3.14159 대신 pi), <b>수정 용이성<\/b>(파라미터화: 상수 하나만 바꾸면 전체 반영)<\/li><li>값 바인딩: 정적(컴파일 시간, C++ <code>const<\/code>에 상수식, C# <code>const<\/code>) 또는 동적(실행 시간에 변수 포함식으로 초기화 가능, Java <code>final<\/code>, C# <code>readonly<\/code>)<\/li><\/ul><\/section>"}]}], "questions": [{"id": "1-why-1", "concept": "why", "type": "mc", "prompt": "언어 개념을 공부하는 이유 중 '구현을 이해하면 언어가 왜 그렇게 설계됐는지 알게 되고 더 효율적으로 쓸 수 있다'에 해당하는 것은?", "choices": ["표현 능력 증가", "구현의 중요성 이해", "새 언어 학습 능력 증가", "컴퓨팅 전반의 발전"], "answer": 1, "explain": "Better understanding of significance of implementation (구현의 중요성).", "lesson": "L1-1", "unit": "U1"}, {"id": "1-why-2", "concept": "why", "type": "ox", "prompt": "'언어 개념 학습은 이미 알고 있는 언어에서 몰랐던 기능을 발견해 더 잘 쓰게 해 준다'는 언어론을 공부하는 이유 중 하나이다.", "answer": true, "explain": "Better use of languages that are already known.", "lesson": "L1-1", "unit": "U1"}, {"id": "1-dom-1", "concept": "domain", "type": "mc", "prompt": "다음 중 도메인–언어 짝이 틀린 것은?", "choices": ["과학 응용 – Fortran", "사무 응용 – COBOL", "인공지능 – C", "시스템 프로그래밍 – C"], "answer": 2, "explain": "AI = LISP (기호 처리, 연결 리스트). C는 시스템 프로그래밍.", "lesson": "L1-1", "unit": "U1"}, {"id": "1-dom-2", "concept": "domain", "type": "blank", "prompt": "LISP는 숫자보다 (a) 를 처리하고 (b) 를 주로 사용하기 때문에 인공지능 도메인에 쓰였다.", "answer": "(a) 기호 / (b) 연결 리스트", "accept": [["기호", "symbol", "symbols", "심볼"], ["연결리스트", "리스트", "linkedlist", "linkedlists", "list"]], "explain": "Symbols rather than numbers manipulated; use of linked lists.", "lesson": "L1-1", "unit": "U1"}, {"id": "1-dom-3", "concept": "domain", "type": "short", "prompt": "과학 응용과 사무 응용 도메인의 특징과 대표 언어를 각각 쓰시오.", "answer": "과학 응용: 대량의 부동소수점 계산, 배열 사용 – Fortran\n사무 응용: 보고서 생성, 십진수와 문자 처리 – COBOL", "keys": ["과학: 부동소수점 계산·배열", "Fortran", "사무: 보고서·십진수·문자", "COBOL"], "lesson": "L1-1", "unit": "U1"}, {"id": "1-crit-1", "concept": "criteria", "type": "short", "prompt": "언어 평가 기준 4가지를 쓰고 각각을 한 줄로 설명하시오.", "answer": "판독성: 프로그램을 쉽게 읽고 이해할 수 있는 정도\n작성력: 주어진 도메인의 프로그램을 쉽게 작성할 수 있는 정도\n신뢰성: 모든 조건에서 명세대로 동작하는 정도\n비용: 교육·작성·컴파일·실행·유지보수 등 언어 사용의 총비용", "explain": "24 중간 1번과 같은 유형. 정의를 한 줄씩만 쓰면 된다.", "keys": ["판독성 정의", "작성력 정의", "신뢰성(명세대로 동작)", "비용(총비용)"], "slot": 1, "pts": 3, "lesson": "L1-2", "unit": "U1"}, {"id": "1-crit-2", "concept": "criteria", "type": "mc", "prompt": "'모든 조건에서 명세대로 수행하는 것(conformance to specifications)'은 어느 평가 기준의 정의인가?", "choices": ["판독성", "작성력", "신뢰성", "이식성"], "answer": 2, "lesson": "L1-2", "unit": "U1"}, {"id": "1-crit-3", "concept": "criteria", "type": "mc", "prompt": "교안 표에서 '타입 검사, 예외 처리, 제한된 별칭'이 영향을 주는 평가 기준은?", "choices": ["판독성만", "판독성과 작성력", "작성력과 신뢰성", "신뢰성만"], "answer": 3, "explain": "단순성·직교성·데이터 타입·구문 설계 → 판독/작성/신뢰 모두. 추상화·표현력 → 작성/신뢰. 타입 검사·예외 처리·별칭 → 신뢰성.", "lesson": "L1-2", "unit": "U1"}, {"id": "1-crit-4", "concept": "criteria", "type": "blank", "prompt": "언어 평가 기준 4가지: 판독성, 작성력, (a), (b)", "answer": "(a) 신뢰성 / (b) 비용", "accept": [["신뢰성", "reliability", "비용", "cost"], ["비용", "cost", "신뢰성", "reliability"]], "lesson": "L1-2", "unit": "U1"}, {"id": "1-rw-1", "concept": "read-why", "type": "short", "prompt": "판독성이 언어 평가에서 중요해진 이유를 쓰시오.", "answer": "유지보수가 SW 생명주기의 큰 부분으로 인식되었고, 유지보수의 용이성은 주로 판독성에 의해 결정되기 때문이다. (기계 중심에서 사람 중심으로 관점이 이동)", "keys": ["유지보수가 생명주기의 큰 부분", "유지보수 용이성은 판독성이 결정"], "lesson": "L1-2", "unit": "U1"}, {"id": "1-rw-2", "concept": "read-why", "type": "ox", "prompt": "판독성은 문제 도메인과 무관하게 언어만 보고 판단해야 한다.", "answer": false, "explain": "판독성은 그 언어의 문제 도메인 맥락에서 판단해야 한다.", "lesson": "L1-2", "unit": "U1"}, {"id": "1-simp-1", "concept": "simplicity", "type": "mc", "prompt": "`cnt=cnt+1; cnt+=1; cnt++; ++cnt;` 처럼 같은 일을 하는 방법이 여러 개인 것은 단순성을 해치는 무엇인가?", "choices": ["특징 다중성 (feature multiplicity)", "연산자 중복 (operator overloading)", "직교성 (orthogonality)", "별칭 (aliasing)"], "answer": 0, "lesson": "L1-2", "unit": "U1"}, {"id": "1-simp-2", "concept": "simplicity", "type": "blank", "prompt": "하나의 연산자 기호가 둘 이상의 의미를 갖는 것을 (a) 이라 하며, 이것이 많으면 판독성의 요소인 (b) 이 떨어진다.", "answer": "(a) 연산자 중복 / (b) 단순성", "accept": [["연산자중복", "연산자오버로딩", "operatoroverloading", "오버로딩"], ["단순성", "전반적단순성", "simplicity", "overallsimplicity"]], "lesson": "L1-2", "unit": "U1"}, {"id": "1-simp-3", "concept": "simplicity", "type": "short", "prompt": "전반적 단순성을 해치는 두 가지 특성을 예와 함께 쓰시오.", "answer": "특징 다중성: 같은 연산을 하는 방법이 여러 개 (cnt=cnt+1, cnt+=1, cnt++, ++cnt)\n연산자 중복: 하나의 연산자 기호가 여러 의미를 가짐 (예: +가 정수 덧셈·실수 덧셈·문자열 연결)", "keys": ["특징 다중성 + 예", "연산자 중복 + 예"], "slot": 1, "pts": 3, "lesson": "L1-2", "unit": "U1"}, {"id": "1-orth-1", "concept": "orthogonality", "type": "short", "prompt": "직교성(orthogonality)을 정의하고, C 언어에서 직교성이 부족한 예를 하나 드시오.", "answer": "직교성: 상대적으로 적은 수의 기본 구조들을 조합한 모든 경우가 합법적이고 의미가 있는 성질.\nC의 예: 구조체는 함수에서 반환할 수 있지만 배열은 반환할 수 없다. (또는 배열 원소는 void와 함수를 제외한 모든 타입이 될 수 있다)", "keys": ["적은 기본 구조의 모든 조합이 합법적이고 의미 있음", "C 예: 구조체 반환 O 배열 반환 X (또는 배열 원소 void 불가)"], "slot": 1, "pts": 3, "lesson": "L1-2", "unit": "U1"}, {"id": "1-orth-2", "concept": "orthogonality", "type": "ox", "prompt": "직교성은 높을수록 항상 좋다.", "answer": false, "explain": "너무 많은 직교성은 이상한 조합까지 합법이 되어 오류가 탐지되지 않고 오히려 복잡해진다. 예: x := (if a > b then a := b else b := a fi);", "lesson": "L1-2", "unit": "U1"}, {"id": "1-orth-3", "concept": "orthogonality", "type": "mc", "prompt": "직교성이 높을 때 생기는 연쇄로 옳은 것은?", "choices": ["규칙의 예외 증가 → 규칙성 감소 → 배우기 쉬움", "규칙의 예외 감소 → 규칙성 증가 → 배우기·읽기 쉬움", "기능 수 증가 → 표현력 증가 → 판독성 감소", "연산자 중복 증가 → 단순성 증가"], "answer": 1, "lesson": "L1-2", "unit": "U1"}, {"id": "1-orth-4", "concept": "orthogonality", "type": "mc", "prompt": "교안에서 '직교적 설계'의 예로 든 것은?", "choices": ["C의 struct 반환", "APL의 연산자", "VAX의 ADDL 명령 (피연산자가 레지스터·메모리 어느 쪽이든 가능)", "Java의 배열 인덱스 검사"], "answer": 2, "lesson": "L1-2", "unit": "U1"}, {"id": "1-syn-1", "concept": "syntax-design", "type": "short", "prompt": "구문 설계 중 '형식과 의미(form and meaning)' 원칙을 설명하고 C에서 이를 위반하는 예를 드시오.", "answer": "의미가 구문(형식)에서 바로 드러나야 한다는 원칙.\n위반 예: C의 static은 함수 안에 선언되면 컴파일 시간에 생성되는 변수(호출마다 생성 X), 함수 밖에 선언되면 그 파일에서만 보이는 변수로, 같은 예약어가 위치에 따라 다른 의미를 갖는다.", "keys": ["의미가 형식에서 바로 드러나야 함", "C static: 위치(함수 안/밖)에 따라 의미가 다름"], "slot": 2, "pts": 3, "lesson": "L1-2", "unit": "U1"}, {"id": "1-syn-2", "concept": "syntax-design", "type": "mc", "prompt": "판독성 관점에서 Boolean 타입이 없으면 생기는 문제를 보여주는 교안 예는?", "choices": ["timeOut = 1 vs timeOut = false", "cnt++ vs cnt = cnt + 1", "{ } vs end if", "#define max(A,B)"], "answer": 0, "explain": "데이터 타입: 적절한 타입 정의 장치가 있어야 읽기 쉽다. C89에는 bool이 없었고 C99 stdbool.h에서 생김.", "lesson": "L1-2", "unit": "U1"}, {"id": "1-syn-3", "concept": "syntax-design", "type": "ox", "prompt": "복합문을 C처럼 { } 로 끝내는 것보다 Ada처럼 end if, end loop 로 끝내는 것이 판독성 면에서 유리하다.", "answer": true, "explain": "특수어(special words)와 복합문 형성 방법 – 어떤 블록이 끝나는지 명확.", "lesson": "L1-2", "unit": "U1"}, {"id": "1-wr-1", "concept": "writability", "type": "short", "prompt": "작성력에 영향을 주는 특성 3가지를 쓰시오.", "answer": "단순성과 직교성, 추상화 지원, 표현력", "keys": ["단순성과 직교성", "추상화 지원", "표현력"], "slot": 1, "pts": 3, "lesson": "L1-3", "unit": "U1"}, {"id": "1-wr-2", "concept": "writability", "type": "mc", "prompt": "APL의 `A+.×B`, C의 `count++` 는 작성력의 어떤 특성의 예인가?", "choices": ["직교성", "추상화 지원", "표현력 (expressivity)", "특징 다중성"], "answer": 2, "lesson": "L1-3", "unit": "U1"}, {"id": "1-wr-3", "concept": "writability", "type": "ox", "prompt": "단순성과 직교성은 작성력을 높이지만, 직교성이 지나치면 프로그램의 오류가 탐지되지 않을 수 있다.", "answer": true, "lesson": "L1-3", "unit": "U1"}, {"id": "1-rel-1", "concept": "reliability", "type": "short", "prompt": "신뢰성에 영향을 주는 언어 특성 4가지를 쓰시오.", "answer": "타입 검사, 예외 처리, 별칭(aliasing), 판독성과 작성력", "keys": ["타입 검사", "예외 처리", "별칭", "판독성과 작성력"], "slot": 1, "pts": 3, "lesson": "L1-3", "unit": "U1"}, {"id": "1-rel-2", "concept": "reliability", "type": "blank", "prompt": "같은 메모리 위치를 둘 이상의 서로 다른 이름(참조 방법)으로 접근할 수 있는 것을 (a) 이라 하며, 이는 (b) 을 떨어뜨린다.", "answer": "(a) 별칭 / (b) 신뢰성", "accept": [["별칭", "aliasing", "alias", "에일리어싱"], ["신뢰성", "reliability"]], "lesson": "L1-3", "unit": "U1"}, {"id": "1-rel-3", "concept": "reliability", "type": "mc", "prompt": "타입 검사가 신뢰성에 중요한 이유로 가장 알맞은 것은?", "choices": ["실행 속도가 빨라지므로", "오류를 일찍 발견할수록 수정 비용이 싸므로", "코드가 짧아지므로", "이식성이 높아지므로"], "answer": 1, "explain": "The earlier errors are detected, the less expensive the repairs. 컴파일 시간 검사가 실행 시간 검사보다 바람직.", "lesson": "L1-3", "unit": "U1"}, {"id": "1-rel-4", "concept": "reliability", "type": "ox", "prompt": "예외 처리는 실행 시간 오류를 가로채 시정 조치를 취할 수 있게 하여 신뢰성을 높인다.", "answer": true, "lesson": "L1-3", "unit": "U1"}, {"id": "1-cost-1", "concept": "cost", "type": "short", "prompt": "언어의 비용(cost)을 구성하는 요소를 4가지 이상 쓰시오.", "answer": "프로그래머 교육 비용, 프로그램 작성 비용, 컴파일 비용, 실행 비용, 언어 구현 시스템 비용, 신뢰성 부족에 따른 비용, 유지보수 비용", "keys": ["교육", "작성", "컴파일", "실행", "유지보수/신뢰성 부족 중 4개 이상"], "lesson": "L1-3", "unit": "U1"}, {"id": "1-cost-2", "concept": "cost", "type": "mc", "prompt": "교안에서 '신뢰성이 낮으면 비용이 커진다'의 예로 든 사건은?", "choices": ["Mars Pathfinder 우선순위 역전", "Y2K 문제", "Heartbleed", "Ariane 5 오버플로"], "answer": 0, "lesson": "L1-3", "unit": "U1"}, {"id": "1-oth-1", "concept": "other-criteria", "type": "mc", "prompt": "'프로그램을 한 구현에서 다른 구현으로 옮기기 쉬운 정도'이며 언어의 표준화 정도에 가장 큰 영향을 받는 기준은?", "choices": ["일반성", "이식성", "분명성", "작성력"], "answer": 1, "lesson": "L1-3", "unit": "U1"}, {"id": "1-oth-2", "concept": "other-criteria", "type": "blank", "prompt": "언어 공식 정의의 완전성과 정밀성을 (a), 넓은 범위의 응용에 적용 가능한 정도를 (b) 이라 한다.", "answer": "(a) 분명성 / (b) 일반성", "accept": [["분명성", "well-definedness", "welldefinedness"], ["일반성", "generality"]], "lesson": "L1-3", "unit": "U1"}, {"id": "1-inf-1", "concept": "influences", "type": "short", "prompt": "언어 설계에 영향을 준 두 가지 주요 요인을 쓰시오.", "answer": "컴퓨터 구조(폰 노이만 구조)와 프로그래밍 설계 방법론", "keys": ["컴퓨터 구조(폰 노이만)", "프로그래밍(설계) 방법론"], "lesson": "L1-4", "unit": "U1"}, {"id": "1-inf-2", "concept": "influences", "type": "short", "prompt": "폰 노이만 구조의 특징이 명령형 언어의 어떤 요소와 대응되는지 3가지를 쓰시오.", "answer": "변수 ↔ 메모리 셀, 배정문 ↔ 메모리와 CPU 사이의 파이핑(데이터 이동), 반복 ↔ 명령어가 인접 메모리에 있어 반복이 효율적", "keys": ["변수 = 메모리 셀", "배정문 = 파이핑", "반복이 효율적"], "lesson": "L1-4", "unit": "U1"}, {"id": "1-inf-3", "concept": "influences", "type": "mc", "prompt": "폰 노이만 병목(von Neumann bottleneck)의 원인은?", "choices": ["CPU 내부 레지스터 수 부족", "컴파일러 최적화 부족", "메모리와 프로세서 사이 버스의 전송 속도가 명령 실행 속도보다 느림", "디스크 입출력"], "answer": 2, "lesson": "L1-4", "unit": "U1"}, {"id": "1-inf-4", "concept": "influences", "type": "mc", "prompt": "프로그래밍 방법론의 변화 순서로 옳은 것은?", "choices": ["기계 효율 → 구조적 프로그래밍(사람 효율) → 데이터 지향(데이터 추상화) → 객체 지향", "객체 지향 → 데이터 지향 → 절차 지향", "구조적 → 기계 효율 → 객체 지향 → 데이터 지향", "데이터 지향 → 구조적 → 객체 지향"], "answer": 0, "lesson": "L1-4", "unit": "U1"}, {"id": "1-inf-5", "concept": "influences", "type": "blank", "prompt": "객체 지향 = 데이터 추상화 + (a) + (b)", "answer": "(a) 상속 / (b) 다형성", "accept": [["상속", "inheritance", "다형성", "polymorphism", "동적바인딩", "동적메소드바인딩"], ["다형성", "polymorphism", "동적바인딩", "동적메소드바인딩", "상속", "inheritance"]], "lesson": "L1-4", "unit": "U1"}, {"id": "1-cat-1", "concept": "categories", "type": "mc", "prompt": "다음 중 명령형(imperative) 언어 범주에 포함되지 '않는' 것은?", "choices": ["객체 지향 언어 (C++, Java)", "스크립트 언어 (Perl, JavaScript)", "비주얼 언어 (Visual BASIC .NET)", "Prolog"], "answer": 3, "explain": "Prolog는 논리형. OOP·스크립트·비주얼 언어는 명령형에 포함.", "lesson": "L1-4", "unit": "U1"}, {"id": "1-cat-2", "concept": "categories", "type": "blank", "prompt": "함수형 언어의 두 핵심은 (a) 과 (b) 이다.", "answer": "(a) 불변성 / (b) 순수 함수", "accept": [["불변성", "immutability", "순수함수", "purefunction"], ["순수함수", "purefunction", "불변성", "immutability"]], "lesson": "L1-4", "unit": "U1"}, {"id": "1-cat-3", "concept": "categories", "type": "short", "prompt": "명령형, 함수형, 논리형 언어의 핵심 특징을 각각 쓰고 예를 하나씩 드시오.", "answer": "명령형: 변수, 배정문, 반복이 핵심 – C, Java\n함수형: 주어진 매개변수에 함수를 적용해 계산 (불변성, 순수 함수) – LISP, Scheme, ML\n논리형: 규칙 기반, 규칙은 특정 순서 없이 기술 – Prolog", "keys": ["명령형: 변수·배정·반복 + 예", "함수형: 함수 적용 + 예", "논리형: 규칙 기반(순서 없음) + Prolog"], "lesson": "L1-4", "unit": "U1"}, {"id": "1-cat-4", "concept": "categories", "type": "mc", "prompt": "JSTL, XSLT는 어느 범주인가?", "choices": ["함수형", "마크업/프로그래밍 혼합", "논리형", "순수 마크업"], "answer": 1, "lesson": "L1-4", "unit": "U1"}, {"id": "1-trade-1", "concept": "tradeoffs", "type": "short", "prompt": "언어 설계 절충에서 '신뢰성과 실행 비용'이 상충하는 예를 드시오.", "answer": "Java는 모든 배열 원소 참조에 대해 인덱스 범위를 검사한다. 신뢰성은 높아지지만 실행 비용이 증가한다.", "keys": ["Java 배열 인덱스 범위 검사", "신뢰성↑ 실행 비용↑"], "slot": 2, "pts": 3, "lesson": "L1-4", "unit": "U1"}, {"id": "1-trade-2", "concept": "tradeoffs", "type": "short", "prompt": "언어 설계 절충에서 '판독성과 작성력'이 상충하는 예를 드시오.", "answer": "APL은 강력한 연산자와 많은 새 기호를 제공해 복잡한 계산을 짧게 작성할 수 있지만(작성력↑), 판독성이 나쁘다.", "keys": ["APL", "강력한 연산자로 짧게 작성(작성력↑)", "판독성↓"], "slot": 2, "pts": 3, "lesson": "L1-4", "unit": "U1"}, {"id": "1-trade-3", "concept": "tradeoffs", "type": "short", "prompt": "언어 설계 절충에서 '작성력(유연성)과 신뢰성'이 상충하는 예를 드시오.", "answer": "C++의 포인터는 강력하고 매우 유연해서 작성력이 높지만, 잘못 사용하기 쉬워 신뢰성이 낮다.", "keys": ["C++ 포인터", "유연·강력(작성력↑)", "신뢰성↓"], "slot": 2, "pts": 3, "lesson": "L1-4", "unit": "U1"}, {"id": "1-trade-4", "concept": "tradeoffs", "type": "mc", "prompt": "'C++ 포인터'가 예로 쓰이는 상충 관계는?", "choices": ["신뢰성 vs 실행 비용", "판독성 vs 작성력", "작성력(유연성) vs 신뢰성", "이식성 vs 효율성"], "answer": 2, "lesson": "L1-4", "unit": "U1"}, {"id": "1-trade-5", "concept": "tradeoffs", "type": "mc", "prompt": "'Java의 배열 인덱스 범위 검사'가 예로 쓰이는 상충 관계는?", "choices": ["신뢰성 vs 실행 비용", "판독성 vs 작성력", "작성력 vs 신뢰성", "일반성 vs 단순성"], "answer": 0, "lesson": "L1-4", "unit": "U1"}, {"id": "1-impl-1", "concept": "impl-methods", "type": "short", "prompt": "프로그래밍 언어를 구현하는 세 가지 일반적인 방법을 쓰고 각각을 간략히 설명하시오.", "answer": "컴파일: 고급 언어 프로그램을 기계어로 번역 후 실행. 번역은 느리지만 실행이 빠름.\n순수 해석: 번역 없이 인터프리터 프로그램이 원시 프로그램을 직접 해석·실행. 구현이 쉽고 오류 표시가 쉽지만 실행이 느림(10~100배).\n혼합형 구현: 고급 언어를 해석하기 쉬운 중간 언어로 번역한 뒤 그 중간 언어를 해석. 순수 해석보다 빠름 (예: Java 바이트코드).", "keys": ["컴파일: 기계어 번역, 실행 빠름", "순수 해석: 번역 없이 해석, 느림", "혼합형: 중간 언어로 번역 후 해석"], "slot": 3, "pts": 3, "lesson": "L1-5", "unit": "U1"}, {"id": "1-impl-2", "concept": "impl-methods", "type": "mc", "prompt": "'번역은 느리지만 실행은 빠르다'는 어느 구현 방법의 특징인가?", "choices": ["컴파일", "순수 해석", "혼합형", "전처리"], "answer": 0, "lesson": "L1-5", "unit": "U1"}, {"id": "1-impl-3", "concept": "impl-methods", "type": "mc", "prompt": "대형 상용 응용에 주로 쓰이는 구현 방법은?", "choices": ["컴파일", "순수 해석", "혼합형", "JIT 없는 해석"], "answer": 0, "lesson": "L1-5", "unit": "U1"}, {"id": "1-impl-4", "concept": "impl-methods", "type": "ox", "prompt": "순수 해석은 번역 과정이 없어 실행 속도가 컴파일 방식보다 빠르다.", "answer": false, "explain": "순수 해석은 컴파일된 프로그램보다 10~100배 느리고 공간도 더 필요하다.", "lesson": "L1-5", "unit": "U1"}, {"id": "1-phase-1", "concept": "compile-phases", "type": "short", "prompt": "컴파일 과정의 단계 4가지를 순서대로 쓰고 각 단계의 입력/출력을 쓰시오.", "answer": "어휘 분석: 문자 → 어휘 단위\n구문 분석: 어휘 단위 → 파스 트리\n의미 분석(중간 코드 생성): 파스 트리 → 중간 코드\n코드 생성: 중간 코드 → 기계어\n(모든 단계가 심볼 테이블 사용, 중간에 최적화 가능)", "keys": ["어휘 분석: 문자→어휘단위", "구문 분석: →파스 트리", "의미 분석: →중간 코드", "코드 생성: →기계어"], "slot": 3, "pts": 3, "lesson": "L1-5", "unit": "U1"}, {"id": "1-phase-2", "concept": "compile-phases", "type": "mc", "prompt": "어휘 단위들을 받아 프로그램의 구문 구조를 나타내는 파스 트리로 변환하는 단계는?", "choices": ["어휘 분석", "구문 분석", "의미 분석", "코드 생성"], "answer": 1, "lesson": "L1-5", "unit": "U1"}, {"id": "1-phase-3", "concept": "compile-phases", "type": "blank", "prompt": "시스템 프로그램(라이브러리)을 모아 사용자 목적 코드에 연결하는 과정을 (a) 이라 하고, 그 결과로 실행을 위해 메모리에 적재되는 것을 (b) 이라 한다.", "answer": "(a) 링킹과 적재 / (b) 적재 모듈", "accept": [["링킹과적재", "링킹", "linking", "linkingandloading", "링킹및적재"], ["적재모듈", "loadmodule", "실행가능이미지", "executableimage", "실행이미지"]], "lesson": "L1-5", "unit": "U1"}, {"id": "1-hyb-1", "concept": "interp-hybrid", "type": "short", "prompt": "JIT(Just-in-Time) 구현 시스템의 동작 방식을 설명하시오.", "answer": "프로그램을 먼저 중간 언어로 번역하고, 실행 중 부프로그램이 호출될 때 그 중간 코드를 기계어로 컴파일한다. 컴파일된 기계어는 이후 호출을 위해 보관한다. 본질적으로 지연된 컴파일러이며 Java, .NET에서 쓰인다.", "keys": ["중간 언어로 먼저 번역", "호출될 때 기계어로 컴파일", "이후 호출 위해 보관(지연된 컴파일러)"], "slot": 3, "pts": 3, "lesson": "L1-5", "unit": "U1"}, {"id": "1-hyb-2", "concept": "interp-hybrid", "type": "mc", "prompt": "Java 초기 구현에서 바이트코드 인터프리터와 런타임 시스템을 합쳐 부르는 이름은?", "choices": ["JIT", "CLR", "JVM", "IDE"], "answer": 2, "lesson": "L1-5", "unit": "U1"}, {"id": "1-hyb-3", "concept": "interp-hybrid", "type": "ox", "prompt": "순수 해석은 전통적 고급 언어에서는 드물지만 JavaScript, PHP 같은 웹 스크립트 언어에서 다시 쓰이게 되었다.", "answer": true, "lesson": "L1-5", "unit": "U1"}, {"id": "1-hyb-4", "concept": "interp-hybrid", "type": "mc", "prompt": "Perl이 '해석 전에 부분 컴파일해서 오류를 탐지'하는 것은 어느 구현 방식에 해당하는가?", "choices": ["순수 컴파일", "순수 해석", "혼합형 구현", "전처리기"], "answer": 2, "lesson": "L1-5", "unit": "U1"}, {"id": "1-pre-1", "concept": "preproc-env", "type": "mc", "prompt": "컴파일 직전에 프로그램을 처리해 #include, #define 같은 매크로를 확장하는 것은?", "choices": ["링커", "전처리기", "로더", "인터프리터"], "answer": 1, "lesson": "L1-5", "unit": "U1"}, {"id": "1-pre-2", "concept": "preproc-env", "type": "ox", "prompt": "프로그래밍 환경은 편집기, 디버거, 빌드 도구, 라이브러리 등 SW 개발에 쓰이는 도구들의 모음이다.", "answer": true, "lesson": "L1-5", "unit": "U1"}, {"id": "2-ss-1", "concept": "syn-sem", "type": "short", "prompt": "구문(syntax)과 의미론(semantics)에 대해 간략히 서술하시오.", "answer": "구문: 식, 문장, 프로그램 단위의 형식 또는 구조.\n의미론: 그 식, 문장, 프로그램 단위의 의미.\n예) while (bool_expr) statement 라는 형태가 구문이고, bool_expr가 참이면 statement를 실행하고 거짓이면 while 다음 문장으로 제어가 넘어간다는 것이 의미.", "keys": ["구문 = 형식/구조", "의미론 = 의미", "(예시가 있으면 좋음)"], "slot": 4, "pts": 3, "lesson": "L2-1", "unit": "U2"}, {"id": "2-ss-2", "concept": "syn-sem", "type": "mc", "prompt": "Java의 `while (bool_expr) statement`에 대해 '조건식이 거짓이면 while 다음 문장으로 제어가 넘어간다'는 설명은?", "choices": ["구문", "의미론", "정적 의미론", "어휘 구조"], "answer": 1, "lesson": "L2-1", "unit": "U2"}, {"id": "2-ss-3", "concept": "syn-sem", "type": "mc", "prompt": "언어 정의(구문+의미)를 사용하는 사람 중, '모호성·비일관성·설계 결함을 찾기 위해' 쓰는 사람은?", "choices": ["다른 언어 설계자", "구현자", "프로그래머", "사용자 매뉴얼 작성자"], "answer": 0, "lesson": "L2-1", "unit": "U2"}, {"id": "2-lt-1", "concept": "lexeme-token", "type": "short", "prompt": "어휘항목(lexeme)과 토큰(token)을 간략히 서술하시오.", "answer": "어휘항목: 언어의 가장 낮은 수준의 구문 단위 (예: *, sum, begin).\n토큰: 어휘항목들의 범주(category) (예: identifier). 여러 어휘항목이 같은 토큰에 속할 수 있다.", "keys": ["어휘항목 = 가장 낮은 수준의 구문 단위", "토큰 = 어휘항목의 범주"], "slot": 6, "pts": 3, "lesson": "L2-1", "unit": "U2"}, {"id": "2-lt-2", "concept": "lexeme-token", "type": "short", "prompt": "`total = price * 3 - tax;` 를 어휘항목과 토큰으로 나누시오.", "answer": "total – identifier\n= – equal_sign(assign_op)\nprice – identifier\n* – mult_op\n3 – int_literal\n- – minus_op(sub_op)\ntax – identifier\n; – semicolon", "keys": ["8개 어휘항목을 빠짐없이", "total/price/tax → identifier", "3 → int_literal", "연산자·세미콜론 토큰"], "slot": 6, "pts": 3, "lesson": "L2-1", "unit": "U2"}, {"id": "2-lt-3", "concept": "lexeme-token", "type": "mc", "prompt": "`count = count + 1;` 에서 서로 다른 '토큰'의 개수는? (토큰: identifier, equal_sign, plus_op, int_literal, semicolon)", "choices": ["3", "4", "5", "6"], "answer": 2, "explain": "어휘항목은 6개(count, =, count, +, 1, ;)지만 토큰 종류는 identifier, equal_sign, plus_op, int_literal, semicolon = 5개.", "lesson": "L2-1", "unit": "U2"}, {"id": "2-lt-4", "concept": "lexeme-token", "type": "ox", "prompt": "sum 과 index 는 서로 다른 어휘항목이지만 같은 토큰(identifier)에 속한다.", "answer": true, "lesson": "L2-1", "unit": "U2"}, {"id": "2-lt-5", "concept": "lexeme-token", "type": "blank", "prompt": "어떤 알파벳 위의 문자열을 (a), 그것들의 집합을 (b) 라고 한다.", "answer": "(a) 문장 / (b) 언어", "accept": [["문장", "sentence"], ["언어", "language"]], "lesson": "L2-1", "unit": "U2"}, {"id": "2-rg-1", "concept": "recognizer-generator", "type": "mc", "prompt": "입력 문자열을 읽어 그 언어에 속하는지 판단하는 장치로, 컴파일러의 구문 분석기가 그 예인 것은?", "choices": ["언어 인식기", "언어 생성기", "메타언어", "속성 문법"], "answer": 0, "lesson": "L2-1", "unit": "U2"}, {"id": "2-rg-2", "concept": "recognizer-generator", "type": "short", "prompt": "언어 인식기와 언어 생성기의 차이를 쓰시오.", "answer": "인식기: 입력 문자열이 그 언어에 속하는지 판단하는 장치 (예: 컴파일러의 구문 분석기).\n생성기: 그 언어의 문장을 생성하는 장치. 어떤 문장이 구문적으로 올바른지 생성기의 구조와 비교해 판단 (예: BNF 문법).", "keys": ["인식기: 속하는지 판단(구문 분석기)", "생성기: 문장을 생성(문법)"], "lesson": "L2-1", "unit": "U2"}, {"id": "2-bnf-1", "concept": "bnf", "type": "mc", "prompt": "BNF에 대한 설명으로 틀린 것은?", "choices": ["John Backus가 ALGOL 58을 기술하려고 만들었다", "문맥 자유 문법과 동등하다", "프로그래밍 언어를 위한 메타언어이다", "문맥 자유 문법보다 표현력이 강하다"], "answer": 3, "lesson": "L2-2", "unit": "U2"}, {"id": "2-bnf-2", "concept": "bnf", "type": "blank", "prompt": "BNF 규칙의 왼쪽(LHS)은 하나의 (a) 이고, 오른쪽(RHS)은 단말과 비단말로 된 문자열이다. 유도는 특별한 비단말인 (b) 에서 시작한다.", "answer": "(a) 비단말 / (b) 시작 기호", "accept": [["비단말", "비단말기호", "nonterminal", "추상화"], ["시작기호", "startsymbol", "시작심볼"]], "lesson": "L2-2", "unit": "U2"}, {"id": "2-bnf-3", "concept": "bnf", "type": "short", "prompt": "식별자 목록 `a, b, c` 같은 가변 길이 리스트를 BNF로 어떻게 표현하는지 규칙을 쓰고 설명하시오.", "answer": "<ident_list> → ident | ident , <ident_list>\n재귀 규칙(LHS가 RHS에 다시 나타나는 규칙)을 사용해 가변 길이 리스트를 표현한다.", "keys": ["재귀 규칙", "<ident_list> → ident | ident , <ident_list> (또는 동등한 좌순환 형태)"], "lesson": "L2-2", "unit": "U2"}, {"id": "2-bnf-4", "concept": "bnf", "type": "ox", "prompt": "문맥 자유 문법은 1950년대 중반 Noam Chomsky가 자연어의 구문을 기술하기 위해 개발했다.", "answer": true, "lesson": "L2-2", "unit": "U2"}, {"id": "2-bnf-5", "concept": "bnf", "type": "mc", "prompt": "BNF에서 단말 기호(terminal)에 해당하는 것은?", "choices": ["<expr> 같은 추상화", "어휘항목 또는 토큰", "규칙(production)", "시작 기호"], "answer": 1, "lesson": "L2-2", "unit": "U2"}, {"id": "2-der-1", "concept": "derivation", "type": "calc", "prompt": "다음 문법으로 `begin c = d - a end` 의 최좌단 유도를 쓰시오.", "answer": "<program> ⇒ begin <stmts> end\n⇒ begin <stmt> end\n⇒ begin <var> = <expr> end\n⇒ begin c = <expr> end\n⇒ begin c = <var> - <var> end\n⇒ begin c = d - <var> end\n⇒ begin c = d - a end", "code": "<program> → begin <stmts> end\n<stmts>   → <stmt> | <stmt> ; <stmts>\n<stmt>    → <var> = <expr>\n<var>     → a | b | c | d\n<expr>    → <var> + <var> | <var> - <var> | <var>", "keys": ["<stmts> ⇒ <stmt> 선택", "매 단계 가장 왼쪽 비단말 하나만 전개", "<expr> ⇒ <var> - <var>"], "lesson": "L2-2", "unit": "U2"}, {"id": "2-der-2", "concept": "derivation", "type": "calc", "prompt": "같은 문법(`<program> → begin <stmts> end` …)으로 `begin a = b ; c = a + d end` 의 최좌단 유도를 쓰시오.", "answer": "<program> ⇒ begin <stmts> end\n⇒ begin <stmt> ; <stmts> end\n⇒ begin <var> = <expr> ; <stmts> end\n⇒ begin a = <expr> ; <stmts> end\n⇒ begin a = <var> ; <stmts> end\n⇒ begin a = b ; <stmts> end\n⇒ begin a = b ; <stmt> end\n⇒ begin a = b ; <var> = <expr> end\n⇒ begin a = b ; c = <expr> end\n⇒ begin a = b ; c = <var> + <var> end\n⇒ begin a = b ; c = a + <var> end\n⇒ begin a = b ; c = a + d end", "code": "<program> → begin <stmts> end\n<stmts>   → <stmt> | <stmt> ; <stmts>\n<stmt>    → <var> = <expr>\n<var>     → a | b | c | d\n<expr>    → <var> + <var> | <var> - <var> | <var>", "keys": ["첫 문장 다 끝낸 뒤 두 번째 <stmts> 전개", "<expr> ⇒ <var> (첫 문장)", "매 줄 비단말 하나만"], "lesson": "L2-2", "unit": "U2"}, {"id": "2-der-3", "concept": "derivation", "type": "mc", "prompt": "유도 과정에서 나오는 모든 기호열을 무엇이라 하는가?", "choices": ["문장 (sentence)", "문장 형태 (sentential form)", "어휘항목", "핸들"], "answer": 1, "lesson": "L2-2", "unit": "U2"}, {"id": "2-der-4", "concept": "derivation", "type": "ox", "prompt": "최좌단 유도를 쓰느냐 최우단 유도를 쓰느냐에 따라 문법이 생성하는 언어가 달라진다.", "answer": false, "explain": "유도 순서는 생성되는 언어에 영향을 주지 않는다.", "lesson": "L2-2", "unit": "U2"}, {"id": "2-der-5", "concept": "derivation", "type": "mc", "prompt": "`A = <id> + <term> * <factor>` 에서 최좌단 유도의 다음 단계로 전개할 비단말은?", "choices": ["<id>", "<term>", "<factor>", "아무거나"], "answer": 0, "lesson": "L2-2", "unit": "U2"}, {"id": "2-pt-1", "concept": "parse-tree", "type": "calc", "prompt": "다음 문법을 사용하여 `B = C * (A + B)` 의 파스 트리와 최좌단 유도를 보이시오.", "answer": "<assign> ⇒ <id> = <expr>\n⇒ B = <expr>\n⇒ B = <term>\n⇒ B = <term> * <factor>\n⇒ B = <factor> * <factor>\n⇒ B = <id> * <fac  연산자일수록 파스 트리에서 더 낮은 곳에 나타나도록 문법을 구성한다(예: *는 <term>, +는 <expr>).", "keys": ["별도 비단말 사용", "높은 우선순위 = 트리의 낮은 곳"], "lesson": "L2-4", "unit": "U2"}, {"id": "2-prec-2", "concept": "precedence", "type": "mc", "prompt": "모호하지 않은 식 문법(<expr>/<term>/<factor>)에서 `*`가 `+`보다 먼저 계산되는 이유는?", "choices": ["*가 문법에서 먼저 나오므로", "*가 <term> 수준에 있어 파스 트리에서 항상 +보다 아래에 오므로", "*가 좌결합이므로", "*가 단말이므로"], "answer": 1, "lesson": "L2-4", "unit": "U2"}, {"id": "2-prec-3", "concept": "precedence", "type": "calc", "prompt": "나눗셈 `/`를 곱셈과 같은 우선순위, 뺄셈 `-`를 덧셈과 같은 우선순위로 추가하도록 아래 문법을 수정하시오.\n<expr> → <expr> + <term> | <term>\n<term> → <term> * <factor> | <factor>\n<factor> → ( <expr> ) | <id>", "answer": "<expr> → <expr> + <term> | <expr> - <term> | <term>\n<term> → <term> * <factor> | <term> / <factor> | <factor>\n<factor> → ( <expr> ) | <id>", "keys": ["- 는 <expr> 수준에 추가", "/ 는 <term> 수준에 추가", "좌순환 형태 유지(좌결합)"], "lesson": "L2-4", "unit": "U2"}, {"id": "2-assoc-1", "concept": "associativity", "type": "mc", "prompt": "`<expr> → <expr> + const | const` 는 + 를 어떻게 결합시키는가?", "choices": ["좌결합", "우결합", "결합성 없음", "모호함"], "answer": 0, "explain": "LHS가 RHS의 맨 왼쪽에 나오는 좌순환 → 좌결합.", "lesson": "L2-4", "unit": "U2"}, {"id": "2-assoc-2", "concept": "associativity", "type": "short", "prompt": "거듭제곱 연산자 ** 를 우결합으로 만드는 문법 규칙을 쓰고 이유를 설명하시오.", "answer": "<factor> → <exp> ** <factor> | <exp>\n<exp> → ( <expr> ) | id\n우순환(LHS가 RHS의 맨 오른쪽에 나타남)으로 만들면 오른쪽 피연산자 쪽으로 트리가 깊어져 a ** b ** c = a ** (b ** c)가 된다.", "keys": ["우순환 규칙 (<factor> → <exp> ** <factor> | <exp>)", "우순환 → 우결합"], "lesson": "L2-4", "unit": "U2"}, {"id": "2-assoc-3", "concept": "associativity", "type": "mc", "prompt": "`<expr> → <expr> + <expr> | const` 의 문제점은?", "choices": ["좌결합만 표현됨", "우결합만 표현됨", "모호함 (결합 방향이 정해지지 않음)", "const를 생성할 수 없음"], "answer": 2, "lesson": "L2-4", "unit": "U2"}, {"id": "2-assoc-4", "concept": "associativity", "type": "ox", "prompt": "좌순환 규칙은 좌결합을 표현하기 좋지만, 하향식 파서의 기반으로는 사용할 수 없다.", "answer": true, "lesson": "L2-4", "unit": "U2"}, {"id": "2-de-1", "concept": "dangling-else", "type": "short", "prompt": "if-then-else 문법이 모호해지는 이유를 예를 들어 설명하고, 대부분 언어의 해결 규칙을 쓰시오.", "answer": "<if_stmt> → if (<logic_expr>) then <stmt> | if (<logic_expr>) then <stmt> else <stmt> 일 때, if C1 then if C2 then S1 else S2 에서 else가 바깥 if와 짝인지 안쪽 if와 짝인지 두 가지 파스 트리가 생긴다(모호).\n해결 규칙: else는 가장 가까운 짝 없는(unmatched) then과 짝지어진다. 문법적으로는 <matched>/<unmatched> 비단말을 나눠 then과 else 사이에는 matched 문장만 오게 한다.", "keys": ["중첩 if에서 else의 짝이 두 가지", "else는 가장 가까운 짝 없는 then과", "matched/unmatched 문법"], "lesson": "L2-4", "unit": "U2"}, {"id": "2-de-2", "concept": "dangling-else", "type": "mc", "prompt": "모호하지 않은 if 문법에서 `then`과 `else` 사이에 올 수 있는 것은?", "choices": ["<unmatched>", "<matched>", "<stmt>", "아무 문장"], "answer": 1, "lesson": "L2-4", "unit": "U2"}, {"id": "2-de-3", "concept": "dangling-else", "type": "blank", "prompt": "<matched> → if (<logic_expr>) then (a) else (b) | a non-if statement", "answer": "(a) <matched> / (b) <matched>", "accept": [["<matched>", "matched"], ["<matched>", "matched"]], "lesson": "L2-4", "unit": "U2"}, {"id": "2-ebnf-1", "concept": "ebnf", "type": "calc", "prompt": "다음 BNF를 EBNF로 바꾸시오.\n<expr> → <expr> + <term> | <expr> - <term> | <term>\n<term> → <term> * <factor> | <term> / <factor> | <factor>", "answer": "<expr> → <term> {(+ | -) <term>}\n<term> → <factor> {(* | /) <factor>}", "keys": ["{ } 반복 사용", "( | ) 대안 사용", "좌순환 제거된 형태"], "lesson": "L2-5", "unit": "U2"}, {"id": "2-ebnf-2", "concept": "ebnf", "type": "mc", "prompt": "EBNF에서 0번 이상 반복을 나타내는 기호는?", "choices": ["[ ]", "( )", "{ }", "< >"], "answer": 2, "lesson": "L2-5", "unit": "U2"}, {"id": "2-ebnf-3", "concept": "ebnf", "type": "mc", "prompt": "`<if_stmt> → if (<expr>) <stmt> [else <stmt>]` 에서 [ ] 의 의미는?", "choices": ["선택적 부분 (0 또는 1번)", "0번 이상 반복", "대안 중 하나", "비단말"], "answer": 0, "lesson": "L2-5", "unit": "U2"}, {"id": "2-ebnf-4", "concept": "ebnf", "type": "calc", "prompt": "다음 EBNF를 BNF로 바꾸시오.\n<ident> → letter {letter | digit}", "answer": "<ident> → letter | letter <rest>\n<rest> → <char> | <char> <rest>\n<char> → letter | digit\n(또는 <ident> → letter | <ident> letter | <ident> digit)", "keys": ["반복을 재귀 규칙으로", "letter로 시작", "letter/digit 반복"], "lesson": "L2-5", "unit": "U2"}, {"id": "2-ebnf-5", "concept": "ebnf", "type": "ox", "prompt": "EBNF는 BNF보다 표현할 수 있는 언어의 범위가 넓다.", "answer": false, "explain": "EBNF는 가독성·간결성을 위한 확장일 뿐 표현력은 BNF와 같다.", "lesson": "L2-5", "unit": "U2"}, {"id": "2-ebv-1", "concept": "ebnf-variants", "type": "mc", "prompt": "최근 EBNF 변형에서 `AssignmentOperator → one of = *= /= %=` 의 'one of'는?", "choices": ["선택적 부분", "나열된 것 중 하나를 선택", "반복", "단말 기호 표시"], "answer": 1, "lesson": "L2-5", "unit": "U2"}, {"id": "2-ebv-2", "concept": "ebnf-variants", "type": "mc", "prompt": "`SimpleName (FormalParameterList_opt)` 의 opt 아래첨자의 의미는?", "choices": ["선택적(생략 가능)", "최적화", "연산자", "반복"], "answer": 0, "lesson": "L2-5", "unit": "U2"}, {"id": "3-ss-1", "concept": "static-semantics", "type": "short", "prompt": "정적 의미론이 필요한 이유를, CFG(BNF)로 기술하기 어려운 구조 두 부류를 들어 설명하시오.", "answer": "CFG로는 언어 구문을 전부 기술할 수 없다.\n① 문맥 자유지만 기술이 번거로운 것: 식에서 피연산자의 타입 규칙\n② 문맥 자유가 아닌 것: 변수는 사용 전에 선언되어야 한다\n정적 의미론은 이런 프로그램의 적법한 형식(주로 타입 제약)에 대한 규칙이며, 컴파일 시간에 검사할 수 있다.", "keys": ["CFG로 다 기술 불가", "번거로운 것: 피연산자 타입", "문맥 자유 아님: 사용 전 선언", "적법한 형식/컴파일 시간 검사"], "slot": 4, "pts": 3, "lesson": "L3-1", "unit": "U3"}, {"id": "3-ss-2", "concept": "static-semantics", "type": "mc", "prompt": "'변수는 사용하기 전에 선언되어야 한다'는 규칙에 대한 설명으로 옳은 것은?", "choices": ["BNF로 쉽게 기술된다", "동적 의미론에 속한다", "문맥 자유가 아니라 BNF로 기술할 수 없다", "어휘 분석기가 검사한다"], "answer": 2, "lesson": "L3-1", "unit": "U3"}, {"id": "3-ss-3", "concept": "static-semantics", "type": "ox", "prompt": "정적 의미론은 프로그램의 실행 의미와 직접 관련이 있고 실행 시간에 검사된다.", "answer": false, "explain": "정적 의미론은 의미와 간접적으로만 관련되며(적법한 형식), 컴파일 시간에 검사한다.", "lesson": "L3-1", "unit": "U3"}, {"id": "3-ag-1", "concept": "ag-def", "type": "short", "prompt": "속성 문법(attribute grammar)을 정의하고 주된 용도 두 가지를 쓰시오.", "answer": "속성 문법: 문맥 자유 문법에 속성, 의미 함수(속성 계산 함수), 술어 함수를 추가하여 파스 트리 노드에 의미 정보를 담을 수 있게 한 문법.\n용도: 정적 의미론 명세, 컴파일러 설계(정적 의미 검사).", "keys": ["CFG + 속성/의미 함수/술어 함수", "정적 의미론 명세", "컴파일러 설계(정적 의미 검사)"], "slot": 4, "pts": 3, "lesson": "L3-1", "unit": "U3"}, {"id": "3-ag-2", "concept": "ag-def", "type": "mc", "prompt": "속성 문법에서 '속성들과 리터럴 값에 대한 불리언 식'으로, 거짓이면 규칙 위반을 뜻하는 것은?", "choices": ["의미 함수", "술어 함수", "내장 속성", "생성 규칙"], "answer": 1, "lesson": "L3-1", "unit": "U3"}, {"id": "3-ag-3", "concept": "ag-def", "type": "blank", "prompt": "모든 속성 값이 계산된 파스 트리를 (a) 파스 트리라고 한다.", "answer": "(a) 완전히 속성화된", "accept": [["완전히속성화된", "fullyattributed", "완전속성화된", "완전히속성화"]], "lesson": "L3-1", "unit": "U3"}, {"id": "3-ak-1", "concept": "ag-attr-kinds", "type": "mc", "prompt": "규칙 X0 → X1 … Xn 에서 S(X0) = f(A(X1), …, A(Xn)) 형태로 정의되는 속성은?", "choices": ["합성 속성", "상속 속성", "내장 속성", "술어 속성"], "answer": 0, "explain": "자식들의 속성으로 부모(X0)의 속성을 계산 → 정보가 위로 흐름 → 합성.", "lesson": "L3-1", "unit": "U3"}, {"id": "3-ak-2", "concept": "ag-attr-kinds", "type": "short", "prompt": "합성 속성, 상속 속성, 내장 속성을 각각 설명하시오.", "answer": "합성 속성: 자식 노드들의 속성 값으로 부모 노드의 속성을 계산 (정보가 아래→위로).\n상속 속성: 부모(와 형제) 노드의 속성으로 자식 노드의 속성을 계산 (정보가 위→아래).\n내장 속성: 잎 노드에 처음부터 정해져 있는 속성 (예: 심볼 테이블에서 찾은 변수의 타입).", "keys": ["합성: 자식→부모", "상속: 부모/형제→자식", "내장: 잎의 초기 값"], "lesson": "L3-1", "unit": "U3"}, {"id": "3-ak-3", "concept": "ag-attr-kinds", "type": "mc", "prompt": "모든 속성이 합성 속성이라면 파스 트리를 어떤 순서로 장식할 수 있는가?", "choices": ["하향식", "상향식", "왼쪽에서 오른쪽만", "순서를 정할 수 없음"], "answer": 1, "lesson": "L3-1", "unit": "U3"}, {"id": "3-ak-4", "concept": "ag-attr-kinds", "type": "ox", "prompt": "대부분의 실제 속성 문법은 합성·상속 속성을 모두 사용하므로 하향식과 상향식을 조합한 순서로 계산해야 한다.", "answer": true, "lesson": "L3-1", "unit": "U3"}, {"id": "3-age-1", "concept": "ag-example", "type": "mc", "prompt": "교안 예제에서 <expr>.expected_type 은 어떤 종류의 속성인가?", "choices": ["합성", "상속", "내장", "술어"], "answer": 1, "explain": "부모 <assign>의 <var>.actual_type 에서 물려받음 → 상속.", "lesson": "L3-1", "unit": "U3"}, {"id": "3-age-2", "concept": "ag-example", "type": "short", "prompt": "규칙 <expr> → <var>[1] + <var>[2] 에 붙는 의미 규칙과 술어를 쓰시오.", "answer": "의미 규칙: <expr>.actual_type ← <var>[1].actual_type\n술어: <var>[1].actual_type == <var>[2].actual_type\n      <expr>.expected_type == <expr>.actual_type", "keys": ["actual_type ← <var>[1].actual_type", "술어: 두 피연산자 타입 같음", "술어: expected == actual"], "lesson": "L3-1", "unit": "U3"}, {"id": "3-age-3", "concept": "ag-example", "type": "mc", "prompt": "규칙 <var> → A | B | C 의 의미 규칙 `<var>.actual_type ← lookup(<var>.string)` 에서 lookup이 하는 일은?", "choices": ["토큰을 반환", "다음 문자를 읽음", "심볼 테이블에서 변수 이름을 찾아 그 타입을 반환", "예약어인지 검사"], "answer": 2, "lesson": "L3-1", "unit": "U3"}, {"id": "3-age-4", "concept": "ag-example", "type": "calc", "prompt": "`A = A + B` 에 대해 교안 속성 문법으로 속성이 계산되는 순서를 쓰시오.", "answer": "1. <var>.actual_type ← lookup(A)  (좌변)\n2. <expr>.expected_type ← <var>.actual_type  (상속)\n3. <var>[1].actual_type ← lookup(A), <var>[2].actual_type ← lookup(B)\n4. 술어: <var>[1].actual_type == <var>[2].actual_type\n5. <expr>.actual_type ← <var>[1].actual_type  (합성)\n6. 술어: <expr>.actual_type == <expr>.expected_type", "keys": ["좌변 lookup → expected_type 상속", "우변 두 변수 lookup", "타입 비교 술어", "actual_type 합성 후 expected와 비교"], "lesson": "L3-1", "unit": "U3"}, {"id": "3-sw-1", "concept": "sem-why", "type": "mc", "prompt": "의미론을 형식적으로 기술할 필요가 있는 이유로 교안에 나오지 '않는' 것은?", "choices": ["컴파일러 작성자가 구조의 정확한 동작을 알아야 함", "정확성 증명이 가능해짐", "컴파일러 생성기가 가능해짐", "실행 속도가 빨라짐"], "answer": 3, "lesson": "L3-2", "unit": "U3"}, {"id": "3-sw-2", "concept": "sem-why", "type": "ox", "prompt": "의미론을 기술하는 데에는 널리 받아들여지는 단 하나의 표기법이 있다.", "answer": false, "explain": "There is no single widely acceptable notation or formalism.", "lesson": "L3-2", "unit": "U3"}, {"id": "3-st-1", "concept": "sem-three", "type": "short", "prompt": "동적 의미론을 기술하는 세 가지 방법을 쓰고 각각을 간략히 설명하시오.", "answer": "연산 의미론: 이상적인(가상) 기계에서 실행했을 때 기계 상태의 변화로 의미를 기술.\n표기 의미론: 구문 요소를 수학적 객체(재귀 함수)로 사상해 의미를 기술.\n공리 의미론: 형식 논리에 기반해 각 문장에 공리와 추론 규칙(전조건·후조건)을 정의하여 정확성을 증명.", "keys": ["연산: 기계 상태 변화", "표기: 수학적 객체/재귀 함수로 사상", "공리: 형식 논리, 전/후조건, 정확성 증명"], "slot": 4, "pts": 3, "lesson": "L3-2", "unit": "U3"}, {"id": "3-st-2", "concept": "sem-three", "type": "mc", "prompt": "'형식 논리에 기반해 전조건과 후조건으로 프로그램의 정확성을 증명'하는 의미론은?", "choices": ["연산 의미론", "표기 의미론", "공리 의미론", "정적 의미론"], "answer": 2, "lesson": "L3-2", "unit": "U3"}, {"id": "3-st-3", "concept": "sem-three", "type": "mc", "prompt": "'재귀 함수 이론'에 기반한 의미론은?", "choices": ["연산 의미론", "표기 의미론", "공리 의미론", "속성 문법"], "answer": 1, "lesson": "L3-2", "unit": "U3"}, {"id": "3-st-4", "concept": "sem-three", "type": "mc", "prompt": "연산 의미론과 표기 의미론의 차이로 옳은 것은?", "choices": ["연산은 상태 변화를 코딩된 알고리즘으로, 표기는 엄밀한 수학 함수로 정의", "연산은 수학 함수로, 표기는 알고리즘으로 정의", "둘 다 전조건/후조건을 사용", "둘은 같은 것"], "answer": 0, "lesson": "L3-2", "unit": "U3"}, {"id": "3-op-1", "concept": "operational", "type": "short", "prompt": "연산 의미론의 특징과 평가를 쓰시오.", "answer": "프로그램을 (시뮬레이션된 또는 실제) 기계에서 실행했을 때 기계 상태(메모리, 레지스터 등)의 변화로 의미를 정의한다. 수학이 아니라 더 낮은 수준의 언어의 문장으로 기술하며, 고급 언어에 쓰려면 가상 기계가 필요하다.\n평가: 비형식적으로 쓰면(언어 매뉴얼 등) 좋지만, 형식적으로 쓰면 매우 복잡하다(VDL로 PL/I 기술).", "keys": ["기계 상태 변화", "저수준 언어로 기술/가상 기계", "비형식적: 좋음, 형식적: 매우 복잡"], "lesson": "L3-2", "unit": "U3"}, {"id": "3-op-2", "concept": "operational", "type": "calc", "prompt": "C의 `for (expr1; expr2; expr3) { body }` 의 의미를 연산 의미론(저수준 문장)으로 쓰시오.", "answer": "      expr1;\nloop: if expr2 == 0 goto out\n      body\n      expr3;\n      goto loop\nout:  ...", "keys": ["expr1 먼저 1번", "expr2 거짓이면 out으로 탈출", "body 후 expr3", "goto loop"], "lesson": "L3-2", "unit": "U3"}, {"id": "3-op-3", "concept": "operational", "type": "ox", "prompt": "연산 의미론에서 문장의 의미는 수학적 함수가 아니라 더 낮은 수준의 프로그래밍 언어로 기술된다.", "answer": true, "lesson": "L3-2", "unit": "U3"}, {"id": "3-den-1", "concept": "denotational", "type": "calc", "prompt": "교안의 표기 의미론 Mdec 함수로 Mdec('305')를 단계별로 계산하시오.", "answer": "Mdec('305') = 10 * Mdec('30') + 5\n            = 10 * (10 * Mdec('3') + 0) + 5\n            = 10 * (10 * 3 + 0) + 5\n            = 10 * 30 + 5 = 305", "keys": ["Mdec(<dec_num> 'd') = 10*Mdec(<dec_num>) + d 적용", "재귀적으로 '3'까지", "결과 305"], "lesson": "L3-2", "unit": "U3"}, {"id": "3-den-2", "concept": "denotational", "type": "blank", "prompt": "표기 의미론에서 구문 요소를 사상하는 함수의 정의역을 (a), 치역을 (b) 이라 한다.", "answer": "(a) 구문 정의역 / (b) 의미 정의역", "accept": [["구문정의역", "syntacticdomain"], ["의미정의역", "semanticdomain"]], "lesson": "L3-2", "unit": "U3"}, {"id": "3-den-3", "concept": "denotational", "type": "mc", "prompt": "표기 의미론에서 프로그램의 상태(state)란?", "choices": ["프로그램 카운터 값", "모든 현재 변수의 값들의 집합 {<i1,v1>, …}", "스택의 내용", "파스 트리"], "answer": 1, "lesson": "L3-2", "unit": "U3"}, {"id": "3-den-4", "concept": "denotational", "type": "short", "prompt": "표기 의미론에서 while 루프 Ml(while B do L, s)의 정의를 쓰고, 루프가 어떻게 표현되는지 설명하시오.", "answer": "Ml(while B do L, s) =\n  if Mb(B, s) == undef then error\n  else if Mb(B, s) == false then s\n  else if Msl(L, s) == error then error\n  else Ml(while B do L, Msl(L, s))\n루프는 반복이 아니라 재귀로 표현된다: 몸체를 실행한 새 상태로 Ml을 다시 호출.", "keys": ["B undef → error", "B false → s", "몸체 error → error", "else 재귀 호출 Ml(..., Msl(L,s))"], "lesson": "L3-2", "unit": "U3"}, {"id": "3-den-5", "concept": "denotational", "type": "mc", "prompt": "표기 의미론의 평가로 옳은 것은?", "choices": ["언어 사용자에게 가장 유용", "비형식적으로 쓸 때만 유용", "언어를 정밀하게 기술하는 훌륭한 방법이지만 복잡해서 사용자에게는 거의 쓸모없음", "정확성 증명이 주 목적"], "answer": 2, "lesson": "L3-2", "unit": "U3"}, {"id": "3-asr-1", "concept": "assertions", "type": "blank", "prompt": "공리 의미론에서 문장 앞의 단언을 (a), 뒤의 단언을 (b) 이라 하고, 후조건을 보장하는 가장 덜 제한적인 전조건을 (c) 이라 한다.", "answer": "(a) 전조건 / (b) 후조건 / (c) 최약 전조건", "accept": [["전조건", "precondition"], ["후조건", "postcondition"], ["최약전조건", "weakestprecondition", "wp"]], "lesson": "L3-3", "unit": "U3"}, {"id": "3-asr-2", "concept": "assertions", "type": "mc", "prompt": "`a = b + 1 {a > 1}` 에 대해 {b > 10}과 {b > 0}의 관계로 옳은 것은?", "choices": ["둘 다 전조건이 아니다", "둘 다 전조건이지만 최약 전조건은 {b > 0}", "최약 전조건은 {b > 10}", "{b > 0}만 전조건"], "answer": 1, "lesson": "L3-3", "unit": "U3"}, {"id": "3-asr-3", "concept": "assertions", "type": "short", "prompt": "공리 의미론으로 프로그램의 정확성을 증명하는 과정을 설명하시오.", "answer": "프로그램 전체의 후조건(원하는 결과)에서 시작해, 마지막 문장부터 첫 문장까지 거꾸로 전조건(최약 전조건)을 계산한다. 첫 문장의 전조건이 프로그램 명세(입력 조건)와 같으면(또는 명세가 그것을 함의하면) 프로그램은 올바르다.", "keys": ["후조건에서 시작", "거꾸로 전조건 계산", "첫 문장 전조건 = 명세 → 정확"], "lesson": "L3-3", "unit": "U3"}, {"id": "3-wpa-1", "concept": "wp-assign", "type": "calc", "prompt": "다음 배정문과 후조건에 대해 최약 전조건을 계산하시오.\n  a = 3 * (b - 2) + 1 {a > 4}", "answer": "3(b - 2) + 1 > 4\n3b - 6 + 1 > 4\n3b > 9\n최약 전조건: {b > 3}", "keys": ["a를 3(b-2)+1로 치환", "전개·정리", "{b > 3}"], "slot": 9, "pts": 3, "lesson": "L3-3", "unit": "U3"}, {"id": "3-wpa-2", "concept": "wp-assign", "type": "calc", "prompt": "다음 배정문과 후조건에 대해 최약 전조건을 계산하시오.\n  a = a - 2 * b + 1 {a > 3}", "answer": "a - 2b + 1 > 3\na - 2b > 2\n최약 전조건: {a > 2b + 2}  (= {a - 2b > 2})", "keys": ["우변의 a도 그대로 둔 채 치환", "{a > 2b + 2}"], "slot": 9, "pts": 3, "lesson": "L3-3", "unit": "U3"}, {"id": "3-wpa-3", "concept": "wp-assign", "type": "calc", "prompt": "다음 배정문과 후조건에 대해 최약 전조건을 계산하시오.\n  x = 4 - 2 * x {x > 0}", "answer": "4 - 2x > 0\n-2x > -4\nx < 2   (음수로 나눠서 부등호 방향이 바뀜)\n최약 전조건: {x < 2}", "keys": ["치환", "음수로 나눌 때 부등호 반전", "{x < 2}"], "slot": 9, "pts": 3, "lesson": "L3-3", "unit": "U3"}, {"id": "3-wpa-4", "concept": "wp-assign", "type": "calc", "prompt": "다음 배정문과 후조건에 대해 최약 전조건을 계산하시오.\n  y = 2 * (x + 1) - 4 {y >= 0}", "answer": "2(x + 1) - 4 >= 0\n2x - 2 >= 0\nx >= 1\n최약 전조건: {x >= 1}", "keys": ["치환·괄호 전개", "{x >= 1}"], "slot": 9, "pts": 3, "lesson": "L3-3", "unit": "U3"}, {"id": "3-wpa-5", "concept": "wp-assign", "type": "calc", "prompt": "다음 배정문과 후조건에 대해 최약 전조건을 계산하시오.\n  x = 3 * y - 1 {x < 11}", "answer": "3y - 1 < 11\n3y < 12\n최약 전조건: {y < 4}", "keys": ["치환", "{y < 4}"], "slot": 9, "pts": 3, "lesson": "L3-3", "unit": "U3"}, {"id": "3-wpa-6", "concept": "wp-assign", "type": "calc", "prompt": "다음 배정문과 후조건에 대해 최약 전조건을 계산하시오.\n  b = a / 3 + 2 {b <= 5}", "answer": "a/3 + 2 <= 5\na/3 <= 3\n최약 전조건: {a <= 9}", "keys": ["치환", "{a <= 9}"], "slot": 9, "pts": 3, "lesson": "L3-3", "unit": "U3"}, {"id": "3-wpa-7", "concept": "wp-assign", "type": "mc", "prompt": "`x = x + y - 3 {x > 10}` 의 최약 전조건은?", "choices": ["{x > 13}", "{y > 13}", "{x + y > 13}", "{x + y > 7}"], "answer": 2, "lesson": "L3-3", "unit": "U3"}, {"id": "3-wpa-8", "concept": "wp-assign", "type": "mc", "prompt": "배정 공리 `{Q_x→E} x = E {Q}` 의 의미는?", "choices": ["후조건 Q에서 x를 모두 E로 치환한 것이 전조건", "전조건에서 E를 x로 치환한 것이 후조건", "Q와 E를 AND한 것이 전조건", "x = E 가 참이면 Q도 참"], "answer": 0, "lesson": "L3-3", "unit": "U3"}, {"id": "3-wpt-1", "concept": "wp-theorem", "type": "calc", "prompt": "다음이 참인 정리인지 배정 공리로 판정하시오.\n  {y > 4} x = 2 * y - 3 {x > 5}", "answer": "wp(x = 2y - 3, x > 5) = (2y - 3 > 5) = {y > 4}\n주어진 전조건 {y > 4}와 같으므로 정리는 증명된다(참).", "keys": ["wp 계산 = {y > 4}", "주어진 전조건과 일치 → 참"], "lesson": "L3-3", "unit": "U3"}, {"id": "3-wpt-2", "concept": "wp-theorem", "type": "calc", "prompt": "다음을 증명하시오. (배정 공리만으로 안 되면 필요한 규칙을 쓰시오)\n  {x > 10} x = x - 4 {x > 3}", "answer": "wp(x = x - 4, x > 3) = {x - 4 > 3} = {x > 7}\n배정 공리: {x > 7} x = x - 4 {x > 3}\nx > 10 ⇒ x > 7 이므로 결과 규칙에 의해 {x > 10} x = x - 4 {x > 3} 이 성립.", "keys": ["wp = {x > 7}", "x > 10 ⇒ x > 7", "결과 규칙 적용"], "lesson": "L3-3", "unit": "U3"}, {"id": "3-wpt-3", "concept": "wp-theorem", "type": "ox", "prompt": "{x > 3} x = x - 3 {x > 0} 은 배정 공리만으로 증명된다.", "answer": true, "explain": "wp(x = x - 3, x > 0) = {x > 3}으로 주어진 전조건과 정확히 같다.", "lesson": "L3-3", "unit": "U3"}, {"id": "3-con-1", "concept": "consequence", "type": "mc", "prompt": "결과 규칙 {P} S {Q}, P' ⇒ P, Q ⇒ Q' ⊢ {P'} S {Q'} 이 말하는 것은?", "choices": ["전조건은 약하게, 후조건은 강하게 바꿀 수 있다", "전조건은 강하게, 후조건은 약하게 바꿀 수 있다", "전조건과 후조건을 바꿀 수 있다", "S를 다른 문장으로 바꿀 수 있다"], "answer": 1, "lesson": "L3-4", "unit": "U3"}, {"id": "3-con-2", "concept": "consequence", "type": "calc", "prompt": "결과 규칙을 써서 다음을 증명하시오.\n  {a > 8} a = a - 5 {a > 2}", "answer": "배정 공리: wp(a = a - 5, a > 2) = {a > 7}, 즉 {a > 7} a = a - 5 {a > 2}\na > 8 ⇒ a > 7 이므로 결과 규칙에 의해\n{a > 8} a = a - 5 {a > 2}", "keys": ["배정 공리로 {a > 7}", "a > 8 ⇒ a > 7", "결과 규칙 결론"], "lesson": "L3-4", "unit": "U3"}, {"id": "3-con-3", "concept": "consequence", "type": "blank", "prompt": "추론 규칙에서 선 위의 것들을 (a), 선 아래의 것을 (b) 이라 볼 수 있다.", "answer": "(a) 전제 / (b) 결론", "accept": [["전제", "가정", "antecedent", "전건"], ["결론", "consequent", "후건"]], "lesson": "L3-4", "unit": "U3"}, {"id": "3-seq-1", "concept": "wp-seq", "type": "calc", "prompt": "다음 시퀀스와 후조건에 대해 최약 전조건을 계산하시오.\n  a = 3 * b - 2;\n  b = a + 4;\n  {b > 10}", "answer": "① b = a + 4 {b > 10}: a + 4 > 10 → {a > 6}\n② a = 3b - 2 {a > 6}: 3b - 2 > 6 → 3b > 8 → {b > 8/3}\n최약 전조건: {b > 8/3}  (정수라면 {b >= 3})", "keys": ["마지막 문장부터 거꾸로", "① {a > 6}", "② {b > 8/3}"], "slot": 11, "pts": 5, "lesson": "L3-4", "unit": "U3"}, {"id": "3-seq-2", "concept": "wp-seq", "type": "calc", "prompt": "다음 시퀀스와 후조건에 대해 최약 전조건을 계산하시오.\n  x = 2 * y + 1;\n  y = x - 5;\n  {y > 0}", "answer": "① y = x - 5 {y > 0}: x - 5 > 0 → {x > 5}\n② x = 2y + 1 {x > 5}: 2y + 1 > 5 → {y > 2}\n최약 전조건: {y > 2}", "keys": ["거꾸로 계산", "① {x > 5}", "② {y > 2}"], "slot": 11, "pts": 5, "lesson": "L3-4", "unit": "U3"}, {"id": "3-seq-3", "concept": "wp-seq", "type": "calc", "prompt": "다음 시퀀스와 후조건에 대해 최약 전조건을 계산하시오.\n  a = b + 2;\n  b = 2 * a - 1;\n  {b < 9}", "answer": "① b = 2a - 1 {b < 9}: 2a - 1 < 9 → {a < 5}\n② a = b + 2 {a < 5}: b + 2 < 5 → {b < 3}\n최약 전조건: {b < 3}", "keys": ["거꾸로", "① {a < 5}", "② {b < 3}"], "slot": 11, "pts": 5, "lesson": "L3-4", "unit": "U3"}, {"id": "3-seq-4", "concept": "wp-seq", "type": "calc", "prompt": "다음 시퀀스와 후조건에 대해 최약 전조건을 계산하시오.\n  x = x + 1;\n  y = 2 * x;\n  {y > 6}", "answer": "① y = 2x {y > 6}: 2x > 6 → {x > 3}\n② x = x + 1 {x > 3}: x + 1 > 3 → {x > 2}\n최약 전조건: {x > 2}", "keys": ["거꾸로", "① {x > 3}", "② {x > 2}"], "slot": 11, "pts": 5, "lesson": "L3-4", "unit": "U3"}, {"id": "3-seq-5", "concept": "wp-seq", "type": "calc", "prompt": "다음 시퀀스와 후조건에 대해 최약 전조건을 계산하시오.\n  c = a + b;\n  a = c - 2 * b;\n  {a > 1}", "answer": "① a = c - 2b {a > 1}: c - 2b > 1 → {c - 2b > 1}\n② c = a + b {c - 2b > 1}: (a + b) - 2b > 1 → a - b > 1\n최약 전조건: {a - b > 1}  (= {a > b + 1})", "keys": ["두 변수가 남아도 그대로 치환", "① {c - 2b > 1}", "② {a - b > 1}"], "slot": 11, "pts": 5, "lesson": "L3-4", "unit": "U3"}, {"id": "3-seq-6", "concept": "wp-seq", "type": "mc", "prompt": "시퀀스 S1; S2 의 최약 전조건을 구하는 올바른 순서는?", "choices": ["S1의 wp를 먼저 구한 뒤 S2에 넣는다", "S2의 wp를 먼저 구하고, 그것을 S1의 후조건으로 써서 S1의 wp를 구한다", "S1과 S2의 wp를 각각 구해 AND한다", "순서는 상관없다"], "answer": 1, "lesson": "L3-4", "unit": "U3"}, {"id": "3-sel-1", "concept": "wp-select", "type": "calc", "prompt": "다음 선택문과 후조건에 대해 최약 전조건을 계산하시오.\n  if (a > b)\n      b = a - 1\n  else\n      b = a + 2;\n  {b > 3}", "answer": "then: b = a - 1 {b > 3} → a - 1 > 3 → {a > 4}\nelse: b = a + 2 {b > 3} → a + 2 > 3 → {a > 1}\na > 4 ⇒ a > 1 이므로 (교재 방식) 최약 전조건: {a > 4}\n(정밀하게는 {(a > b and a > 4) or (a <= b and a > 1)})", "keys": ["then 쪽 {a > 4}", "else 쪽 {a > 1}", "합침: {a > 4} (또는 정밀형)"], "slot": 12, "pts": 5, "lesson": "L3-4", "unit": "U3"}, {"id": "3-sel-2", "concept": "wp-select", "type": "calc", "prompt": "다음 선택문과 후조건에 대해 최약 전조건을 계산하시오.\n  if (x < y)\n      x = x - 2\n  else\n      x = 2 * x;\n  {x > 4}", "answer": "then: x - 2 > 4 → {x > 6}\nelse: 2x > 4 → {x > 2}\nx > 6 ⇒ x > 2 이므로 최약 전조건: {x > 6}\n(정밀하게는 {(x < y and x > 6) or (x >= y and x > 2)})", "keys": ["then {x > 6}", "else {x > 2}", "결론 {x > 6}"], "slot": 12, "pts": 5, "lesson": "L3-4", "unit": "U3"}, {"id": "3-sel-3", "concept": "wp-select", "type": "calc", "prompt": "다음 선택문과 후조건에 대해 최약 전조건을 계산하시오.\n  if (a == b)\n      b = 3 * a - 3\n  else\n      b = a + 1;\n  {b > 3}", "answer": "then: 3a - 3 > 3 → {a > 2}\nelse: a + 1 > 3 → {a > 2}\n두 분기의 전조건이 같으므로 최약 전조건: {a > 2}", "keys": ["then {a > 2}", "else {a > 2}", "결론 {a > 2}"], "slot": 12, "pts": 5, "lesson": "L3-4", "unit": "U3"}, {"id": "3-sel-4", "concept": "wp-select", "type": "calc", "prompt": "다음 선택문과 후조건에 대해 최약 전조건을 계산하시오.\n  if (y > 0)\n      x = y + 1\n  else\n      x = 1 - y;\n  {x > 2}", "answer": "then: y + 1 > 2 → {y > 1}\nelse: 1 - y > 2 → -y > 1 → {y < -1}\n두 전조건은 서로를 함의하지 p = 2(n - k), k ≠ 0(k >= 1)일 때 p = p + 2 → p = 2(n - k) + 2 = 2(n - (k - 1)), k = k - 1 → p = 2(n - k) 다시 성립, k >= 0 유지 ✓\n3. (I and not B) ⇒ Q: k = 0 이면 p = 2(n - 0) = 2n ✓\n4. 종료: k는 n >= 0에서 매번 1씩 감소 → 0에 도달", "keys": ["I = (p = 2(n-k)) and k >= 0", "P ⇒ I", "몸체가 I 유지", "k = 0 → p = 2n", "종료"], "slot": 19, "pts": 10, "lesson": "L3-5", "unit": "U3"}, {"id": "3-lp-3", "concept": "loop-proof", "type": "calc", "prompt": "다음 프로그램이 올바름을 증명하시오.\n{n >= 0}\ni = 0;\ns = 0;\nwhile i <> n do\n    i = i + 1;\n    s = s + i;\nend\n{s = 1 + 2 + … + n}", "answer": "불변자 I = (s = 1 + 2 + … + i) and (i <= n)   (i = 0이면 빈 합 = 0)\n1. P ⇒ I: 루프 직전 i = 0, s = 0 = 빈 합, 0 <= n ✓\n2. {I and B} S {I}: i ≠ n 이고 i <= n 이므로 i < n. i = i + 1 후 i <= n, s = s + i → s = 1 + … + (i-1) + i ✓\n3. (I and not B) ⇒ Q: i = n 이면 s = 1 + 2 + … + n ✓\n4. 종료: i는 0에서 매번 1씩 증가하고 i <= n 이므로 n에 도달해 종료", "keys": ["I = (s = 1+…+i) and i <= n", "P ⇒ I", "몸체 유지", "i = n → Q", "종료"], "slot": 19, "pts": 10, "lesson": "L3-5", "unit": "U3"}, {"id": "3-lp-4", "concept": "loop-proof", "type": "mc", "prompt": "24 중간 19번 같은 루프 정확성 증명 답안에 반드시 들어가야 하는 것이 '아닌' 것은?", "choices": ["루프 불변자", "P ⇒ I 확인", "(I and not B) ⇒ Q 확인", "표기 의미론 함수 Ml의 정의"], "answer": 3, "lesson": "L3-5", "unit": "U3"}, {"id": "3-ae-1", "concept": "axiomatic-eval", "type": "short", "prompt": "공리 의미론의 장단점을 쓰시오.", "answer": "장점: 정확성 증명에 좋은 도구이고, 프로그램에 대해 추론하는 훌륭한 틀이다.\n단점: 언어의 모든 문장에 대한 공리·추론 규칙을 만드는 것이 어렵고, 언어 사용자와 컴파일러 작성자에게는 그다지 유용하지 않다.", "keys": ["장점: 정확성 증명·추론 틀", "단점: 모든 문장의 공리 만들기 어려움", "사용자·컴파일러 작성자에겐 덜 유용"], "lesson": "L3-5", "unit": "U3"}, {"id": "3-ae-2", "concept": "axiomatic-eval", "type": "mc", "prompt": "공리 의미론의 원래 목적은?", "choices": ["형식적 프로그램 검증", "컴파일러 생성", "언어 매뉴얼 작성", "가상 기계 설계"], "answer": 0, "lesson": "L3-5", "unit": "U3"}, {"id": "4-sab-1", "concept": "sa-bnf", "type": "short", "prompt": "구문을 BNF로 기술하는 것의 장점 3가지(구문 분석기 관점)를 쓰시오.", "answer": "1. 명확하고 간결한 구문 기술을 제공\n2. 파서를 BNF에 직접 기반하여 만들 수 있음\n3. BNF 기반 파서는 유지보수가 쉬움(모듈성)", "keys": ["명확·간결", "파서를 직접 기반", "유지보수 쉬움"], "lesson": "L4-1", "unit": "U4"}, {"id": "4-sab-2", "concept": "sa-bnf", "type": "ox", "prompt": "컴파일, 해석, 혼합형 등 구현 방식과 상관없이 언어 구현 시스템은 원시 코드를 분석해야 한다.", "answer": true, "lesson": "L4-1", "unit": "U4"}, {"id": "4-lp-1", "concept": "lex-vs-parser", "type": "mc", "prompt": "어휘 분석기의 수학적 모델은?", "choices": ["정규 문법 기반 유한 오토마타", "문맥 자유 문법 기반 푸시다운 오토마타", "튜링 기계", "속성 문법"], "answer": 0, "lesson": "L4-1", "unit": "U4"}, {"id": "4-lp-2", "concept": "lex-vs-parser", "type": "blank", "prompt": "구문 분석기(파서)는 수학적으로 (a) 문법에 기반한 (b) 오토마타이다.", "answer": "(a) 문맥 자유 / (b) 푸시다운", "accept": [["문맥자유", "contextfree", "cfg", "bnf"], ["푸시다운", "pushdown", "pda"]], "lesson": "L4-1", "unit": "U4"}, {"id": "4-lp-3", "concept": "lex-vs-parser", "type": "ox", "prompt": "어휘 분석기는 고수준 부분, 파서는 저수준 부분이다.", "answer": false, "explain": "어휘 분석기 = 저수준(문자 단위), 파서 = 고수준(토큰 → 구조).", "lesson": "L4-1", "unit": "U4"}, {"id": "4-sep-1", "concept": "separate-why", "type": "short", "prompt": "어휘 분석과 구문 분석을 분리하는 이유 3가지를 쓰시오.", "answer": "1. 단순성: 어휘 분석에는 덜 복잡한 기법을 쓸 수 있고, 분리하면 파서가 단순해진다.\n2. 효율성: 분리하면 어휘 분석기를 따로 최적화할 수 있다.\n3. 이식성: 어휘 분석기 일부는 이식이 어려울 수 있지만 파서는 항상 이식 가능하다.", "keys": ["단순성", "효율성(어휘 분석기 최적화)", "이식성(파서는 항상 이식 가능)"], "slot": 6, "pts": 3, "lesson": "L4-1", "unit": "U4"}, {"id": "4-sep-2", "concept": "separate-why", "type": "mc", "prompt": "어휘 분석과 구문 분석을 분리하는 이유 중 '파서는 항상 이식 가능하다'와 관련된 것은?", "choices": ["단순성", "효율성", "이식성", "신뢰성"], "answer": 2, "lesson": "L4-1", "unit": "U4"}, {"id": "4-sep-3", "concept": "separate-why", "type": "mc", "prompt": "어휘 분석기만 따로 최적화할 수 있다는 장점은?", "choices": ["단순성", "효율성", "이식성", "모듈성"], "answer": 1, "lesson": "L4-1", "unit": "U4"}, {"id": "4-lr-1", "concept": "lexer-role", "type": "mc", "prompt": "어휘 분석기에 대한 설명으로 틀린 것은?", "choices": ["문자열에 대한 패턴 매처이다", "파서의 전단부(front-end)이다", "보통 파서가 다음 토큰이 필요할 때 호출하는 함수이다", "파스 트리를 생성한다"], "answer": 3, "lesson": "L4-2", "unit": "U4"}, {"id": "4-lr-2", "concept": "lexer-role", "type": "short", "prompt": "`result = oldsum - value / 100;` 을 어휘 분석했을 때의 (토큰, 어휘항목) 쌍을 모두 쓰시오.", "answer": "IDENT result / ASSIGN_OP = / IDENT oldsum / SUB_OP - / IDENT value / DIV_OP / / INT_LIT 100 / SEMICOLON ;", "keys": ["8쌍", "IDENT 3개", "INT_LIT 100", "연산자 토큰 구분"], "lesson": "L4-2", "unit": "U4"}, {"id": "4-lr-3", "concept": "lexer-role", "type": "short", "prompt": "`if (cnt >= 10) x = y;` 를 어휘 분석했을 때 어휘항목을 순서대로 모두 쓰고 각 토큰 범주를 쓰시오.", "answer": "if – 예약어(IF) / ( – LEFT_PAREN / cnt – IDENT / >= – 관계 연산자(GE_OP) / 10 – INT_LIT / ) – RIGHT_PAREN / x – IDENT / = – ASSIGN_OP / y – IDENT / ; – SEMICOLON", "keys": ["if는 예약어 토큰", ">= 는 하나의 어휘항목", "총 10개 어휘항목"], "lesson": "L4-2", "unit": "U4"}, {"id": "4-lb-1", "concept": "lexer-build", "type": "short", "prompt": "어휘 분석기를 만드는 세 가지 접근 방법을 쓰시오.", "answer": "1. 토큰을 형식적으로 기술하고, 그 기술로부터 표 기반 어휘 분석기를 생성하는 SW 도구를 사용 (예: lex)\n2. 토큰을 기술하는 상태 다이어그램을 설계하고, 그 다이어그램을 구현하는 프로그램을 작성\n3. 상태 다이어그램을 설계하고, 그것의 표 기반 구현을 손으로 작성", "keys": ["도구(lex) 사용", "상태 다이어그램 → 프로그램 작성", "상태 다이어그램 → 표 기반 손 구현"], "lesson": "L4-2", "unit": "U4"}, {"id": "4-lb-2", "concept": "lexer-build", "type": "mc", "prompt": "front.c는 어휘 분석기를 만드는 세 방법 중 어느 것인가?", "choices": ["도구로 표 기반 분석기 생성", "상태 다이어그램을 구현하는 프로그램 작성", "표 기반 구현을 손으로 작성", "정규식 엔진 사용"], "answer": 1, "lesson": "L4-2", "unit": "U4"}, {"id": "4-sd-1", "concept": "state-diagram", "type": "short", "prompt": "어휘 분석기 상태 다이어그램을 단순화하는 두 가지 방법을 쓰시오.", "answer": "1. 문자 클래스 사용: 식별자 인식 시 모든 글자를 LETTER, 정수 인식 시 모든 숫자를 DIGIT 클래스로 묶어 전이를 합친다.\n2. 예약어와 식별자를 함께 인식: 예약어마다 다이어그램을 만들지 않고, 식별자로 인식한 뒤 테이블 탐색(lookup)으로 예약어인지 판별한다.", "keys": ["문자 클래스(LETTER/DIGIT)", "예약어·식별자 함께 인식 + 테이블 탐색"], "lesson": "L4-2", "unit": "U4"}, {"id": "4-sd-2", "concept": "state-diagram", "type": "ox", "prompt": "순진한 상태 다이어그램은 모든 상태에서 모든 문자에 대한 전이가 필요해 매우 커진다.", "answer": true, "lesson": "L4-2", "unit": "U4"}, {"id": "4-sd-3", "concept": "state-diagram", "type": "mc", "prompt": "예약어 while을 식별자와 구분하는 일반적인 방법은?", "choices": ["while 전용 상태 다이어그램을 따로 만든다", "파서가 판단한다", "식별자로 인식한 후 테이블 탐색으로 예약어인지 확인한다", "w로 시작하면 예약어로 본다"], "answer": 2, "lesson": "L4-2", "unit": "U4"}, {"id": "4-ut-1", "concept": "lexer-utils", "type": "mc", "prompt": "다음 입력 문자를 nextChar에 넣고 그 문자 클래스를 charClass에 저장하는 함수는?", "choices": ["getChar", "addChar", "lookup", "getNonBlank"], "answer": 0, "lesson": "L4-2", "unit": "U4"}, {"id": "4-ut-2", "concept": "lexer-utils", "type": "mc", "prompt": "nextChar의 문자를 lexeme 배열에 덧붙이는 함수는?", "choices": ["getChar", "addChar", "lookup", "lex"], "answer": 1, "lesson": "L4-2", "unit": "U4"}, {"id": "4-ut-3", "concept": "lexer-utils", "type": "short", "prompt": "getChar, addChar, lookup 의 역할을 각각 쓰시오.", "answer": "getChar: 입력의 다음 문자를 nextChar에 넣고, 그 문자의 클래스를 판단해 charClass에 넣는다.\naddChar: nextChar의 문자를 어휘항목을 모으는 곳(lexeme)에 추가한다.\nlookup: lexeme(문자)가 예약어/연산자인지 판단해 해당 토큰 코드를 반환한다.", "keys": ["getChar: 다음 문자 + 클래스", "addChar: lexeme에 추가", "lookup: 예약어/연산자 판단 → 코드"], "slot": 6, "pts": 3, "lesson": "L4-2", "unit": "U4"}, {"id": "4-fc-1", "concept": "front-codes", "type": "mc", "prompt": "front.c에서 `(sum + 47) / total` 의 출력 중 `Next token is: 24` 에 해당하는 어휘항목은?", "choices": ["(", "+", "/", ")"], "answer": 2, "explain": "DIV_OP = 24. ( = 25, ) = 26, + = 21.", "lesson": "L4-3", "unit": "U4"}, {"id": "4-fc-2", "concept": "front-codes", "type": "calc", "prompt": "front.c로 `count = a1 * 25` 를 분석할 때 출력되는 'Next token is: … Next lexeme is …' 줄들을 모두 쓰시오.", "answer": "Next token is: 11 Next lexeme is count\nNext token is: 20 Next lexeme is =\nNext token is: 11 Next lexeme is a1\nNext token is: 23 Next lexeme is *\nNext token is: 10 Next lexeme is 25\nNext token is: -1 Next lexeme is EOF", "keys": ["IDENT 11", "ASSIGN_OP 20", "a1은 LETTER로 시작 → IDENT", "MULT_OP 23", "INT_LIT 10", "EOF -1"], "lesson": "L4-3", "unit": "U4"}, {"id": "4-fc-3", "concept": "front-codes", "type": "mc", "prompt": "front.c에서 `a1`이 하나의 IDENT로 인식되는 이유는?", "choices": ["숫자가 무시되므로", "LETTER로 시작한 뒤 while (charClass == LETTER || charClass == DIGIT) 동안 계속 addChar 하므로", "lookup이 a1을 예약어로 보므로", "getNonBlank가 1을 건너뛰므로"], "answer": 1, "lesson": "L4-3", "unit": "U4"}, {"id": "4-fc-4", "concept": "front-codes", "type": "mc", "prompt": "front.c에서 `12abc` 를 분석하면 어떻게 되는가?", "choices": ["INT_LIT 12 다음 IDENT abc", "IDENT 12abc", "INT_LIT 12abc", "오류 후 종료"], "answer": 0, "explain": "DIGIT로 시작 → while (charClass == DIGIT) → 'a'에서 멈춤 → INT_LIT 12. 다음 lex()에서 abc는 IDENT.", "lesson": "L4-3", "unit": "U4"}, {"id": "4-ft-1", "concept": "front-trace", "type": "calc", "prompt": "front.c의 lex()가 `(sum + 47)` 에서 두 번째 토큰 sum을 인식하는 과정을 getChar/addChar 호출과 lexeme, nextChar 변화로 쓰시오. (첫 토큰 처리 후 nextChar = 's', charClass = LETTER 상태)", "answer": "lexLen = 0, getNonBlank() (s는 공백 아님)\nswitch(LETTER): addChar() → lexeme = \"s\"; getChar() → nextChar = 'u', LETTER\nwhile: addChar() → \"su\"; getChar() → 'm', LETTER\n       addChar() → \"sum\"; getChar() → ' ', UNKNOWN → while 종료\nnextToken = IDENT(11), printf \"Next token is: 11 Next lexeme is sum\"", "keys": ["addChar/getChar 교대", "lexeme s → su → sum", "공백에서 UNKNOWN으로 while 종료", "IDENT 11 출력"], "lesson": "L4-3", "unit": "U4"}, {"id": "4-ft-2", "concept": "front-trace", "type": "mc", "prompt": "front.c의 lex()가 토큰 하나를 끝낸 직후의 nextChar는?", "choices": ["방금 인식한 토큰의 마지막 문자", "방금 인식한 토큰 바로 다음 문자 (미리 읽혀 있음)", "항상 공백", "EOF"], "answer": 1, "lesson": "L4-3", "unit": "U4"}, {"id": "4-ft-3", "concept": "front-trace", "type": "mc", "prompt": "front.c에서 `(` 를 처리할 때 lex()의 switch는 어느 case로 가는가?", "choices": ["LETTER", "DIGIT", "UNKNOWN (lookup 호출)", "EOF"], "answer": 2, "lesson": "L4-3", "unit": "U4"}, {"id": "5-pg-1", "concept": "parser-goals", "type": "short", "prompt": "구문 분석기(파서)의 두 가지 목표를 쓰시오.", "answer": "1. 모든 구문 오류를 찾아 각각 적절한 진단 메시지를 내고 빨리 복구한다.\n2. 프로그램의 파스 트리(또는 최소한 파스 트리의 흔적)를 생성한다.", "keys": ["구문 오류 탐지·진단·복구", "파스 트리 생성"], "lesson": "L5-1", "unit": "U5"}, {"id": "5-pg-2", "concept": "parser-goals", "type": "ox", "prompt": "파서는 첫 번째 구문 오류를 만나면 즉시 분석을 멈추는 것이 목표다.", "answer": false, "explain": "모든 구문 오류를 찾고, 오류마다 진단 후 빨리 복구해서 계속 분석하는 것이 목표.", "lesson": "L5-1", "unit": "U5"}, {"id": "5-tb-1", "concept": "topdown-bottomup", "type": "short", "prompt": "하향식(top-down) 파싱과 상향식(bottom-up) 파싱에 대해 간략히 서술하시오.", "answer": "하향식: 루트(시작 기호)부터 잎 방향으로 파스 트리를 만든다. 최좌단 유도 순서를 따르며(전위 순회), 다음 입력 토큰을 보고 적용할 규칙을 선택한다. 예: 재귀 하강 파서, LL 파서.\n상향식: 잎부터 루트 방향으로 파스 트리를 만든다. 최우단 유도의 역순을 따르며, 우문장 형태에서 핸들을 찾아 LHS로 환원(reduce)한다. 예: LR 파서(shift-reduce).", "keys": ["하향식: 루트부터, 최좌단 유도", "상향식: 잎부터, 최우단 유도의 역순", "대표 알고리즘(재귀 하강/LL vs LR)"], "slot": 7, "pts": 3, "lesson": "L5-1", "unit": "U5"}, {"id": "5-tb-2", "concept": "topdown-bottomup", "type": "mc", "prompt": "상향식 파서가 따르는 유도 순서는?", "choices": ["최좌단 유도", "최좌단 유도의 역순", "최우단 유도", "최우단 유도의 역순"], "answer": 3, "lesson": "L5-1", "unit": "U5"}, {"id": "5-tb-3", "concept": "topdown-bottomup", "type": "mc", "prompt": "하향식 파서가 문장 형태 xAα 에서 A-규칙을 고를 때 사용하는 정보는?", "choices": ["입력 전체", "A가 생성하는 첫 토큰(다음 입력 토큰 하나)", "스택의 상태 이력", "GOTO 테이블"], "answer": 1, "lesson": "L5-1", "unit": "U5"}, {"id": "5-tb-4", "concept": "topdown-bottomup", "type": "mc", "prompt": "다음 중 하향식 파싱 알고리즘이 아닌 것은?", "choices": ["재귀 하강", "LL 파서", "LR 파서", "테이블 기반 LL(1)"], "answer": 2, "lesson": "L5-1", "unit": "U5"}, {"id": "5-tb-5", "concept": "topdown-bottomup", "type": "calc", "prompt": "S → aAc, A → aA | b 일 때 입력 aabc를 상향식으로 파싱하는 과정(환원 순서)을 쓰고, 이것이 어떤 유도의 역순인지 쓰시오.", "answer": "aabc → (b를 A로 환원) aaAc → (aA를 A로 환원) aAc → (aAc를 S로 환원) S\n이는 최우단 유도 S ⇒ aAc ⇒ aaAc ⇒ aabc 의 역순이다.", "keys": ["b → A", "aA → A", "aAc → S", "최우단 유도의 역순"], "lesson": "L5-1", "unit": "U5"}, {"id": "5-pc-1", "concept": "parse-complexity", "type": "mc", "prompt": "모든 모호하지 않은 문법에 대해 동작하는 일반 파서의 시간 복잡도는?", "choices": ["O(n)", "O(n log n)", "O(n³)", "O(2ⁿ)"], "answer": 2, "lesson": "L5-1", "unit": "U5"}, {"id": "5-pc-2", "concept": "parse-complexity", "type": "short", "prompt": "컴파일러가 모든 문법에 동작하는 파서 대신 일부 문법에만 동작하는 파서를 쓰는 이유를 쓰시오.", "answer": "모든 모호하지 않은 문법에 동작하는 파서는 복잡하고 비효율적(O(n³))이다. 컴파일러는 문법의 부분 집합(LL, LR 등)에서만 동작하지만 선형 시간 O(n)에 파싱하는 파서를 사용한다.", "keys": ["일반 파서 O(n³)", "부분 집합만 지원하지만 O(n)"], "lesson": "L5-1", "unit": "U5"}, {"id": "5-rds-1", "concept": "rd-structure", "type": "short", "prompt": "재귀 하강 파서의 구조를 설명하고, EBNF가 재귀 하강 파서에 적합한 이유를 쓰시오.", "answer": "문법의 각 비단말마다 그 비단말이 생성하는 문장을 파싱하는 부프로그램을 하나씩 둔, 재귀적 부프로그램들의 모음이다. 파스 트리를 하향식으로 만든다.\nEBNF는 비단말의 수를 최소화하므로(반복을 {}로 표현) 재귀 하강 파서의 기반으로 적합하다.", "keys": ["비단말마다 부프로그램", "재귀적, 하향식", "EBNF는 비단말 수 최소화"], "slot": 7, "pts": 3, "lesson": "L5-2", "unit": "U5"}, {"id": "5-rds-2", "concept": "rd-structure", "type": "mc", "prompt": "재귀 하강 파서에 재귀가 쓰이는 이유로 교안이 든 것은?", "choices": ["프로그래밍 언어의 중첩 구조를 반영", "속도가 빠르므로", "스택이 필요 없으므로", "좌순환을 처리하기 위해"], "answer": 0, "lesson": "L5-2", "unit": "U5"}, {"id": "5-rds-3", "concept": "rd-structure", "type": "ox", "prompt": "재귀 하강 파서는 LL 파서의 일종이다.", "answer": true, "lesson": "L5-2", "unit": "U5"}, {"id": "5-rdc-1", "concept": "rd-coding", "type": "short", "prompt": "재귀 하강 파서에서 RHS가 하나인 규칙의 파싱 부프로그램을 코딩하는 규칙 2가지를 쓰시오.", "answer": "1. RHS의 각 단말 기호는 다음 입력 토큰과 비교해 같으면 계속(lex 호출), 다르면 오류.\n2. RHS의 각 비단말 기호는 그 비단말의 파싱 부프로그램을 호출.", "keys": ["단말: 다음 토큰과 비교", "비단말: 해당 부프로그램 호출"], "lesson": "L5-2", "unit": "U5"}, {"id": "5-rdc-2", "concept": "rd-coding", "type": "mc", "prompt": "재귀 하강 파서의 관례로 옳은 것은?", "choices": ["각 파싱 루틴은 시작할 때 lex()를 호출한다", "모든 파싱 루틴은 끝날 때 다음 토큰을 nextToken에 남겨둔다", "factor는 expr을 호출하지 않는다", "오류 시 항상 프로그램을 종료한다"], "answer": 1, "lesson": "L5-2", "unit": "U5"}, {"id": "5-rdc-3", "concept": "rd-coding", "type": "calc", "prompt": "재귀 하강 파서에서 `<term> → <factor> {(* | /) <factor>}` 에 대한 함수 term()을 C로 작성하시오.", "answer": "void term() {\n    printf(\"Enter <term>\\n\");\n    factor();\n    while (nextToken == MULT_OP || nextToken == DIV_OP) {\n        lex();\n        factor();\n    }\n    printf(\"Exit <term>\\n\");\n}", "keys": ["factor() 먼저 호출", "while (MULT_OP || DIV_OP)", "루프 안에서 lex() 후 factor()"], "lesson": "L5-2", "unit": "U5"}, {"id": "5-rdc-4", "concept": "rd-coding", "type": "mc", "prompt": "RHS가 여러 개인 비단말(<factor>)의 파싱 함수가 RHS를 고르는 방법은?", "choices": ["모두 시도해 보고 되돌아감(backtracking)", "항상 첫 번째 RHS", "다음 입력 토큰(lookahead)을 각 RHS가 생성할 수 있는 첫 토큰과 비교", "GOTO 테이블 참조"], "answer": 2, "lesson": "L5-2", "unit": "U5"}, {"id": "5-rdt-1", "concept": "rd-trace", "type": "calc", "prompt": "교안의 재귀 하강 파서(expr/term/factor + lex)로 `x * (y - 2)` 를 파싱할 때의 출력(Next token… / Enter… / Exit…)을 순서대로 쓰시오.", "answer": "Next token is: 11 Next lexeme is x\nEnter <expr>\nEnter <term>\nEnter <factor>\nNext token is: 23 Next lexeme is *\nExit <factor>\nNext token is: 25 Next lexeme is (\nEnter <factor>\nNext token is: 11 Next lexeme is y\nEnter <expr>\nEnter <term>\nEnter <factor>\nNext token is: 22 Next lexeme is -\nExit <factor>\nExit <term>\nNext token is: 10 Next lexeme is 2\nEnter <term>\nEnter <factor>\nNext token is: 26 Next lexeme is )\nExit <factor>\nExit <term>\nExit <expr>\nNext token is: -1 Next lexeme is EOF\nExit <factor>\nExit <term>\nExit <expr>", "keys": ["x에서 factor 즉시 Exit", "* 보고 term이 factor 다시 호출", "( 에서 expr 재귀 진입", "EOF 후 Exit 순서"], "lesson": "L5-2", "unit": "U5"}, {"id": "5-rdt-2", "concept": "rd-trace", "type": "calc", "prompt": "교안의 재귀 하강 파서(expr/term/factor + lex)로 `a + b * 3` 를 파싱할 때의 출력(Next token… / Enter… / Exit…)을 순서대로 쓰시오.", "answer": "Next token is: 11 Next lexeme is a\nEnter <expr>\nEnter <term>\nEnter <factor>\nNext token is: 21 Next lexeme is +\nExit <factor>\nExit <term>\nNext token is: 11 Next lexeme is b\nEnter <term>\nEnter <factor>\nNext token is: 23 Next lexeme is *\nExit <factor>\nNext token is: 10 Next lexeme is 3\nEnter <factor>\nNext token is: -1 Next lexeme is EOF\nExit <factor>\nExit <term>\nExit <expr>", "keys": ["a 후 Exit <factor>, Exit <term>", "+ 후 Enter <term>", "* 처리는 term 안에서", "마지막 Exit 3개"], "lesson": "L5-2", "unit": "U5"}, {"id": "5-rdt-3", "concept": "rd-trace", "type": "mc", "prompt": "`(sum + 47) / total` 파싱에서 `)` 를 확인한 뒤 바로 다음 출력은?", "choices": ["Exit <expr>", "Next token is: 24 Next lexeme is /", "Enter <factor>", "Exit <term>"], "answer": 1, "explain": "factor가 ) 를 확인하면 lex()를 호출해 다음 토큰 /(24)를 읽는다. 그 다음 Exit <factor>.", "lesson": "L5-2", "unit": "U5"}, {"id": "5-rdt-4", "concept": "rd-trace", "type": "mc", "prompt": "`a + b * 3` 파싱에서 `Enter <term>` 은 총 몇 번 출력되는가?", "choices": ["1번", "2번", "3번", "4번"], "answer": 1, "explain": "expr에서 a 쪽 term 1번, + 뒤 b * 3 쪽 term 1번 = 2번.", "lesson": "L5-2", "unit": "U5"}, {"id": "5-ll-1", "concept": "ll-parsing", "type": "blank", "prompt": "LL 파싱의 첫 L은 입력을 (a)에서 (b)로 스캔한다는 뜻이고, 두 번째 L은 (c) 유도를 구성한다는 뜻이다.", "answer": "(a) 왼쪽 / (b) 오른쪽 / (c) 최좌단", "accept": [["왼쪽", "left", "좌"], ["오른쪽", "right", "우"], ["최좌단", "leftmost", "좌단"]], "lesson": "L5-3", "unit": "U5"}, {"id": "5-ll-2", "concept": "ll-parsing", "type": "mc", "prompt": "교안의 LL(1) 테이블(S → aAB, A → bA | ε, B → c)에서 A 행, c 열의 항목은?", "choices": ["A → bA", "error", "A → ε", "B → c"], "answer": 2, "explain": "A 다음에 B가 오고 B는 c로 시작 → A가 ε이 되어야 c를 만날 수 있음.", "lesson": "L5-3", "unit": "U5"}, {"id": "5-ll-3", "concept": "ll-parsing", "type": "calc", "prompt": "S → aAB, A → bA | ε, B → c 와 LL(1) 테이블로 입력 abbc를 파싱할 때 적용되는 규칙을 순서대로 쓰시오.", "answer": "S → aAB (a 매치) → A → bA (b 매치) → A → bA (b 매치) → A → ε (다음 토큰 c) → B → c (c 매치) → 성공\n최좌단 유도: S ⇒ aAB ⇒ abAB ⇒ abbAB ⇒ abbB ⇒ abbc", "keys": ["S → aAB", "A → bA 두 번", "c를 보고 A → ε", "B → c"], "lesson": "L5-3", "unit": "U5"}, {"id": "5-lrc-1", "concept": "left-recursion", "type": "calc", "prompt": "다음 문법에서 좌순환을 제거하시오.\nE → E + T | T\nT → T * F | F\nF → (E) | id", "answer": "E  → T E'\nE' → + T E' | ε\nT  → F T'\nT' → * F T' | ε\nF  → (E) | id", "keys": ["E → T E'", "E' → + T E' | ε", "T → F T'", "T' → * F T' | ε", "F 그대로"], "lesson": "L5-3", "unit": "U5"}, {"id": "5-lrc-2", "concept": "left-recursion", "type": "calc", "prompt": "다음 규칙에서 직접 좌순환을 제거하시오.\nA → Aa | Ab | c | d", "answer": "A  → cA' | dA'\nA' → aA' | bA' | ε", "keys": ["β(c, d)에 A' 붙이기", "α(a, b)는 A' → αA'", "A' → ε 포함"], "lesson": "L5-3", "unit": "U5"}, {"id": "5-lrc-3", "concept": "left-recursion", "type": "mc", "prompt": "좌순환 문법이 하향식 파서의 기반이 될 수 없는 이유는?", "choices": ["모호하기 때문", "A의 파싱 함수가 토큰을 소비하지 않고 자기 자신을 다시 호출해 무한 재귀에 빠지므로", "FIRST 집합이 비어서", "상향식으로만 표현되므로"], "answer": 1, "lesson": "L5-3", "unit": "U5"}, {"id": "5-lrc-4", "concept": "left-recursion", "type": "calc", "prompt": "다음 규칙에서 직접 좌순환을 제거하시오.\nS → S , x | S ; y | z", "answer": "S  → z S'\nS' → , x S' | ; y S' | ε", "keys": ["S → z S'", "S' → , x S' | ; y S' | ε"], "lesson": "L5-3", "unit": "U5"}, {"id": "5-lrc-5", "concept": "left-recursion", "type": "ox", "prompt": "간접 좌순환(A → Bα, B → Aβ)이 있어도 하향식 파서의 기반이 될 수 있다.", "answer": false, "explain": "직접이든 간접이든 좌순환이 있으면 하향식 파서의 기반이 될 수 없다.", "lesson": "L5-3", "unit": "U5"}, {"id": "5-pd-1", "concept": "pairwise", "type": "calc", "prompt": "다음 문법 규칙들에 대해 집합쌍 공통 테스트(pairwise disjointness test)를 수행하시오.\na. A → aB | bAb | Bb   (B → cB | d)\nb. B → bA | cB | Ac   (A → aB | b)\nc. S → aSb | bAA   (A → b | cA)", "answer": "a. A: FIRST(aB) = {a}, FIRST(bAb) = {b}, FIRST(Bb) = {c, d}\n   → 모든 쌍의 교집합이 공집합 → 통과\nB: FIRST(cB) = {c}, FIRST(d) = {d}\n   → 모든 쌍의 교집합이 공집합 → 통과\n\nb. B: FIRST(bA) = {b}, FIRST(cB) = {c}, FIRST(Ac) = {a, b}\n   → FIRST(bA) ∩ FIRST(Ac) = {b} → 실패\nA: FIRST(aB) = {a}, FIRST(b) = {b}\n   → 모든 쌍의 교집합이 공집합 → 통과\n\nc. S: FIRST(aSb) = {a}, FIRST(bAA) = {b}\n   → 모든 쌍의 교집합이 공집합 → 통과\nA: FIRST(b) = {b}, FIRST(cA) = {c}\n   → 모든 쌍의 교집합이 공집합 → 통과", "keys": ["각 RHS의 FIRST 집합 명시", "비단말로 시작하는 RHS는 그 비단말의 FIRST 사용", "교집합 → 통과/실패 판정"], "slot": 13, "pts": 5, "lesson": "L5-3", "unit": "U5"}, {"id": "5-pd-2", "concept": "pairwise", "type": "calc", "prompt": "다음 문법 규칙들에 대해 집합쌍 공통 테스트(pairwise disjointness test)를 수행하시오.\nd. S → Ab | Bc   (A → aA | d, B → bB | a)\ne. X → abY | bX | Yc   (Y → cY | e)\nf. A → aB | aAb   (B → b)", "answer": "d. S: FIRST(Ab) = {a, d}, FIRST(Bc) = {a, b}\n   → FIRST(Ab) ∩ FIRST(Bc) = {a} → 실패\nA: FIRST(aA) = {a}, FIRST(d) = {d}\n   → 모든 쌍의 교집합이 공집합 → 통과\nB: FIRST(bB) = {b}, FIRST(a) = {a}\n   → 모든 쌍의 교집합이 공집합 → 통과\n\ne. X: FIRST(abY) = {a}, FIRST(bX) = {b}, FIRST(Yc) = {c, e}\n   → 모든 쌍의 교집합이 공집합 → 통과\nY: FIRST(cY) = {c}, FIRST(e) = {e}\n   → 모든 쌍의 교집합이 공집합 → 통과\n\nf. A: FIRST(aB) = {a}, FIRST(aAb) = {a}\n   → FIRST(aB) ∩ FIRST(aAb) = {a} → 실패", "keys": ["각 RHS의 FIRST 집합 명시", "비단말로 시작하는 RHS는 그 비단말의 FIRST 사용", "교집합 → 통과/실패 판정"], "slot": 13, "pts": 5, "lesson": "L5-3", "unit": "U5"}, {"id": "5-pd-3", "concept": "pairwise", "type": "calc", "prompt": "다음 문법 규칙들에 대해 집합쌍 공통 테스트(pairwise disjointness test)를 수행하시오.\nb. B → bA | cB | Ac   (A → aB | b)\nd. S → Ab | Bc   (A → aA | d, B → bB | a)\ne. X → abY | bX | Yc   (Y → cY | e)", "answer": "b. B: FIRST(bA) = {b}, FIRST(cB) = {c}, FIRST(Ac) = {a, b}\n   → FIRST(bA) ∩ FIRST(Ac) = {b} → 실패\nA: FIRST(aB) = {a}, FIRST(b) = {b}\n   → 모든 쌍의 교집합이 공집합 → 통과\n\nd. S: FIRST(Ab) = {a, d}, FIRST(Bc) = {a, b}\n   → FIRST(Ab) ∩ FIRST(Bc) = {a} → 실패\nA: FIRST(aA) = {a}, FIRST(d) = {d}\n   → 모든 쌍의 교집합이 공집합 → 통과\nB: FIRST(bB) = {b}, FIRST(a) = {a}\n   → 모든 쌍의 교집합이 공집합 → 통과\n\ne. X: FIRST(abY) = {a}, FIRST(bX) = {b}, FIRST(Yc) = {c, e}\n   → 모든 쌍의 교집합이 공집합 → 통과\nY: FIRST(cY) = {c}, FIRST(e) = {e}\n   → 모든 쌍의 교집합이 공집합 → 통과", "keys": ["각 RHS의 FIRST 집합 명시", "비단말로 시작하는 RHS는 그 비단말의 FIRST 사용", "교집합 → 통과/실패 판정"], "slot": 13, "pts": 5, "lesson": "L5-3", "unit": "U5"}, {"id": "5-pd-4", "concept": "pairwise", "type": "calc", "prompt": "다음 문법 규칙들에 대해 집합쌍 공통 테스트(pairwise disjointness test)를 수행하시오.\na. A → aB | bAb | Bb   (B → cB | d)\nf. A → aB | aAb   (B → b)\nc. S → aSb | bAA   (A → b | cA)", "answer": "a. A: FIRST(aB) = {a}, FIRST(bAb) = {b}, FIRST(Bb) = {c, d}\n   → 모든 쌍의 교집합이 공집합 → 통과\nB: FIRST(cB) = {c}, FIRST(d) = {d}\n   → 모든 쌍의 교집합이 공집합 → 통과\n\nf. A: FIRST(aB) = {a}, FIRST(aAb) = {a}\n   → FIRST(aB) ∩ FIRST(aAb) = {a} → 실패\n\nc. S: FIRST(aSb) = {a}, FIRST(bAA) = {b}\n   → 모든 쌍의 교집합이 공집합 → 통과\nA: FIRST(b) = {b}, FIRST(cA) = {c}\n   → 모든 쌍의 교집합이 공집합 → 통과", "keys": ["각 RHS의 FIRST 집합 명시", "비단말로 시작하는 RHS는 그 비단말의 FIRST 사용", "교집합 → 통과/실패 판정"], "slot": 13, "pts": 5, "lesson": "L5-3", "unit": "U5"}, {"id": "5-pd-5", "concept": "pairwise", "type": "mc", "prompt": "A → aB | bC | aD 의 집합쌍 공통 테스트 결과는?", "choices": ["통과", "실패 (FIRST(aB) ∩ FIRST(aD) = {a})", "실패 (FIRST(bC) ∩ FIRST(aD) = {b})", "판단 불가"], "answer": 1, "lesson": "L5-3", "unit": "U5"}, {"id": "5-pd-6", "concept": "pairwise", "type": "mc", "prompt": "FIRST(α)의 정의는?", "choices": ["α로부터 유도되는 문자열의 첫 단말들의 집합 {a | α ⇒* aβ}", "α의 첫 번째 기호", "α 다음에 올 수 있는 단말들의 집합", "α가 유도하는 모든 단말"], "answer": 0, "lesson": "L5-3", "unit": "U5"}, {"id": "5-pd-7", "concept": "pairwise", "type": "mc", "prompt": "A → Bx | y, B → yz | w 일 때 FIRST(Bx)는?", "choices": ["{x}", "{B}", "{y, w}", "{y, w, x}"], "answer": 2, "lesson": "L5-3", "unit": "U5"}, {"id": "5-pd-8", "concept": "pairwise", "type": "ox", "prompt": "집합쌍 공통 테스트는 RHS가 하나뿐인 비단말에도 적용해야 한다.", "answer": false, "explain": "둘 이상의 RHS를 가진 비단말의 각 규칙 쌍에 대해서만 검사.", "lesson": "L5-3", "unit": "U5"}, {"id": "5-lf-1", "concept": "left-factoring", "type": "calc", "prompt": "다음 규칙을 좌추출(left factoring)하여 집합쌍 공통 테스트를 통과하게 만드시오.\n<stmt> → if <cond> then <stmt> | if <cond> then <stmt> else <stmt>", "answer": "<stmt> → if <cond> then <stmt> <rest>\n<rest> → ε | else <stmt>\n(EBNF: <stmt> → if <cond> then <stmt> [else <stmt>])", "keys": ["공통 접두부 추출", "새 비단말 → ε | else <stmt>"], "lesson": "L5-3", "unit": "U5"}, {"id": "5-lf-2", "concept": "left-factoring", "type": "calc", "prompt": "다음 규칙을 좌추출하시오.\nA → abC | abD | e", "answer": "A  → abA' | e\nA' → C | D", "keys": ["공통 접두부 ab", "A' → C | D", "e는 그대로"], "lesson": "L5-3", "unit": "U5"}, {"id": "5-lf-3", "concept": "left-factoring", "type": "mc", "prompt": "좌추출이 해결하는 문제는?", "choices": ["좌순환", "집합쌍 공통 테스트 실패(공통 접두부)", "모호성", "결합성"], "answer": 1, "lesson": "L5-3", "unit": "U5"}, {"id": "6-bp-1", "concept": "bu-problem", "type": "mc", "prompt": "상향식 파싱의 '파싱 문제'란?", "choices": ["다음 토큰 하나로 적용할 규칙 선택", "좌순환 제거", "우문장 형태에서 환원하면 이전 우문장 형태가 되는 RHS 부분 문자열(핸들)을 찾는 것", "FIRST 집합 계산"], "answer": 2, "lesson": "L6-1", "unit": "U6"}, {"id": "6-bp-2", "concept": "bu-problem", "type": "calc", "prompt": "E → E + T | T, T → T * F | F, F → (E) | id 에서 id * id + id 의 최우단 유도를 쓰시오.", "answer": "E ⇒ E + T ⇒ E + F ⇒ E + id ⇒ T + id ⇒ T * F + id ⇒ T * id + id ⇒ F * id + id ⇒ id * id + id", "keys": ["매 단계 가장 오른쪽 비단말 전개", "E + T가 최상위", "T * F는 왼쪽 E 안에서"], "lesson": "L6-1", "unit": "U6"}, {"id": "6-hd-1", "concept": "handle-def", "type": "short", "prompt": "핸들(handle), 어구(phrase), 단순 어구(simple phrase)를 정의하시오.", "answer": "어구: 파스 트리에서 어떤 내부 노드를 루트로 하는 부분 트리의 잎들 (S ⇒* α1Aα2 ⇒+ α1βα2 일 때 β).\n단순 어구: 한 단계 유도로 생긴 어구, 즉 자식이 모두 잎인 내부 노드의 자식들 (S ⇒* α1Aα2 ⇒ α1βα2).\n핸들: 최우단 유도에서 바로 직전에 전개된 부분 (S ⇒*rm αAw ⇒rm αβw 일 때 β). 우문장 형태의 가장 왼쪽 단순 어구.", "keys": ["어구: 부분 트리의 잎", "단순 어구: 한 단계(자식이 모두 잎)", "핸들 = 가장 왼쪽 단순 어구"], "lesson": "L6-1", "unit": "U6"}, {"id": "6-hd-2", "concept": "handle-def", "type": "mc", "prompt": "핸들과 단순 어구의 관계로 옳은 것은?", "choices": ["핸들은 가장 왼쪽의 단순 어구", "핸들은 가장 긴 어구", "핸들은 가장 오른쪽 단순 어구", "핸들은 시작 기호의 어구"], "answer": 0, "lesson": "L6-1", "unit": "U6"}, {"id": "6-hd-3", "concept": "handle-def", "type": "ox", "prompt": "상향식 파싱은 핸들 가지치기(handle pruning)로 볼 수 있다.", "answer": true, "lesson": "L6-1", "unit": "U6"}, {"id": "6-hd-4", "concept": "handle-def", "type": "ox", "prompt": "우문장 형태 전체(시작 기호 노드가 덮는 문자열)도 어구에 포함된다.", "answer": true, "lesson": "L6-1", "unit": "U6"}, {"id": "6-hh-1", "concept": "handle-howto", "type": "calc", "prompt": "문법 S → aAb | bBA,  A → ab | aAB,  B → aB | b 과 우문장 형태 aaAbb 가 주어졌을 때, 파스 트리를 그리고 어구, 단순 어구, 핸들을 보이시오.", "answer": "파스 트리: S(a, A(a, A, B(b)), b)\n어구: aaAbb (S), aAb (A), b (B, 네 번째 기호)\n단순 어구: b\n핸들: b", "keys": ["올바른 파스 트리", "어구 전부(루트 포함)", "단순 어구", "핸들"], "slot": 14, "pts": 5, "lesson": "L6-1", "unit": "U6"}, {"id": "6-hh-2", "concept": "handle-howto", "type": "calc", "prompt": "문법 S → aAb | bBA,  A → ab | aAB,  B → aB | b 과 우문장 형태 bBab 가 주어졌을 때, 파스 트리를 그리고 어구, 단순 어구, 핸들을 보이시오.", "answer": "파스 트리: S(b, B, A(a, b))\n어구: bBab (S), ab (A)\n단순 어구: ab\n핸들: ab", "keys": ["올바른 파스 트리", "어구 전부(루트 포함)", "단순 어구", "핸들"], "slot": 14, "pts": 5, "lesson": "L6-1", "unit": "U6"}, {"id": "6-hh-3", "concept": "handle-howto", "type": "calc", "prompt": "문법 S → aAb | bBA,  A → ab | aAB,  B → aB | b 과 우문장 형태 aaAaBb 가 주어졌을 때, 파스 트리를 그리고 어구, 단순 어구, 핸들을 보이시오.", "answer": "파스 트리: S(a, A(a, A, B(a, B)), b)\n어구: aaAaBb (S), aAaB (A), aB (B)\n단순 어구: aB\n핸들: aB", "keys": ["올바른 파스 트리", "어구 전부(루트 포함)", "단순 어구", "핸들"], "slot": 14, "pts": 5, "lesson": "L6-1", "unit": "U6"}, {"id": "6-hh-4", "concept": "handle-howto", "type": "calc", "prompt": "문법 S → aAb | bBA,  A → ab | aAB,  B → aB | b 과 우문장 형태 bBaAab 가 주어졌을 때, 파스 트리를 그리고 어구, 단순 어구, 핸들을 보이시오.", "answer": "파스 트리: S(b, B, A(a, A, B(a, B(b))))\n어구: bBaAab (S), aAab (A), ab (B), b (B, 마지막 기호)\n단순 어구: b (마지막)\n핸들: b", "keys": ["올바른 파스 트리", "어구 전부(루트 포함)", "단순 어구", "핸들"], "slot": 14, "pts": 5, "lesson": "L6-1", "unit": "U6"}, {"id": "6-hh-5", "concept": "handle-howto", "type": "calc", "prompt": "문법 S → aAb | bBA,  A → ab | aAB,  B → aB | b 과 우문장 형태 baBab 가 주어졌을 때, 파스 트리를 그리고 어구, 단순 어구, 핸들을 보이시오.", "answer": "파스 트리: S(b, B(a, B), A(a, b))\n어구: baBab (S), aB (B), ab (A)\n단순 어구: aB, ab\n핸들: aB (가장 왼쪽 단순 어구)", "keys": ["올바른 파스 트리", "어구 전부(루트 포함)", "단순 어구", "핸들"], "slot": 14, "pts": 5, "lesson": "L6-1", "unit": "U6"}, {"id": "6-hh-6", "concept": "handle-howto", "type": "calc", "prompt": "문법 S → aBc | cA,  A → Ab | bB,  B → aB | c 과 우문장 형태 cAbb 가 주어졌을 때, 파스 트리를 그리고 어구, 단순 어구, 핸들을 보이시오.", "answer": "파스 트리: S(c, A(A(A, b), b))\n어구: cAbb (S), Abb (바깥 A), Ab (안쪽 A)\n단순 어구: Ab\n핸들: Ab", "keys": ["올바른 파스 트리", "어구 전부(루트 포함)", "단순 어구", "핸들"], "slot": 14, "pts": 5, "lesson": "L6-1", "unit": "U6"}, {"id": "6-hh-7", "concept": "handle-howto", "type": "calc", "prompt": "문법 S → aBc | cA,  A → Ab | bB,  B → aB | c 과 우문장 형태 cbaBb 가 주어졌을 때, 파스 트리를 그리고 어구, 단순 어구, 핸들을 보이시오.", "answer": "파스 트리: S(c, A(A(b, B(a, B)), b))\n어구: cbaBb (S), baBb (바깥 A), baB (안쪽 A), aB (B)\n단순 어구: aB\n핸들: aB", "keys": ["올바른 파스 트리", "어구 전부(루트 포함)", "단순 어구", "핸들"], "slot": 14, "pts": 5, "lesson": "L6-1", "unit": "U6"}, {"id": "6-hh-8", "concept": "handle-howto", "type": "calc", "prompt": "문법 S → aBc | cA,  A → Ab | bB,  B → aB | c 과 우문장 형태 aacc 가 주어졌을 때, 파스 트리를 그리고 어구, 단순 어구, 핸들을 보이시오.", "answer": "파스 트리: S(a, B(a, B(c)), c)\n어구: aacc (S), ac (B), c (안쪽 B, 세 번째 기호)\n단순 어구: c (세 번째 기호)\n핸들: c (세 번째 기호, 마지막 c 아님)", "keys": ["올바른 파스 트리", "어구 전부(루트 포함)", "단순 어구", "핸들"], "slot": 14, "pts": 5, "lesson": "L6-1", "unit": "U6"}, {"id": "6-hh-9", "concept": "handle-howto", "type": "mc", "prompt": "E → E + T | T, T → T * F | F, F → (E) | id 에서 우문장 형태 E + T * id 의 핸들은?", "choices": ["E + T", "T", "id", "T * id"], "answer": 2, "lesson": "L6-1", "unit": "U6"}, {"id": "6-hh-10", "concept": "handle-howto", "type": "mc", "prompt": "같은 식 문법에서 우문장 형태 E + F * id 의 핸들은?", "choices": ["E + F", "F", "id", "F * id"], "answer": 1, "explain": "트리: E(E, +, T(T(F), *, F(id))). 단순 어구: F(T의 자식), id(F의 자식). 가장 왼쪽 = F.", "lesson": "L6-1", "unit": "U6"}, {"id": "6-hh-11", "concept": "handle-howto", "type": "mc", "prompt": "같은 식 문법에서 우문장 형태 T * (E + id) 의 단순 어구를 모두 고른 것은?", "choices": ["T", "E + id", "T * (E + id)", "id"], "answer": 3, "explain": "트리: E(T(T, *, F((, E(E, +, T(F(id))), )))). 자식이 모두 잎인 내부 노드는 F → id 하나뿐 → 단순 어구 = 핸들 = id.", "lesson": "L6-1", "unit": "U6"}, {"id": "6-sr-1", "concept": "shift-reduce", "type": "short", "prompt": "shift-reduce 알고리즘의 shift와 reduce 행동을 설명하시오.", "answer": "Shift: 다음 입력 토큰을 파스 스택의 top으로 옮긴다.\nReduce: 스택 top에 있는 핸들을 그에 대응하는 규칙의 LHS로 교체한다.", "keys": ["shift: 입력 토큰을 스택으로", "reduce: 스택 top의 핸들 → LHS"], "lesson": "L6-2", "unit": "U6"}, {"id": "6-sr-2", "concept": "shift-reduce", "type": "mc", "prompt": "reduce 행동에서 스택 top에서 LHS로 바뀌는 것은?", "choices": ["다음 입력 토큰", "핸들", "시작 기호", "상태 0"], "answer": 1, "lesson": "L6-2", "unit": "U6"}, {"id": "6-adv-1", "concept": "lr-advantages", "type": "short", "prompt": "LR 파서의 장점 4가지를 쓰시오.", "answer": "1. 프로그래밍 언어를 기술하는 거의 모든 문법에 대해 동작한다.\n2. 다른 상향식 알고리즘보다 넓은 문법 클래스에서 동작하면서도 다른 상향식 파서만큼 효율적이다.\n3. 구문 오류를 가능한 한 빨리 탐지한다.\n4. LR 문법 클래스는 LL 파서로 파싱 가능한 클래스의 상위 집합이다.", "keys": ["거의 모든 PL 문법", "넓은 클래스 + 효율", "오류를 가능한 빨리 탐지", "LR ⊃ LL"], "slot": 7, "pts": 3, "lesson": "L6-2", "unit": "U6"}, {"id": "6-adv-2", "concept": "lr-advantages", "type": "mc", "prompt": "LR 문법 클래스와 LL 문법 클래스의 관계는?", "choices": ["LR이 LL의 상위 집합", "LL이 LR의 상위 집합", "서로 같다", "서로 무관"], "answer": 0, "lesson": "L6-2", "unit": "U6"}, {"id": "6-adv-3", "concept": "lr-advantages", "type": "mc", "prompt": "LR 파싱 테이블을 만드는 방법으로 교안이 말한 것은?", "choices": ["손으로 쉽게 만든다", "FIRST 집합만으로 만든다", "yacc, bison 같은 도구로 생성한다", "재귀 하강 파서에서 변환한다"], "answer": 2, "lesson": "L6-2", "unit": "U6"}, {"id": "6-adv-4", "concept": "lr-advantages", "type": "short", "prompt": "LR 파싱에 대한 Knuth의 통찰을 설명하시오.", "answer": "상향식 파서는 현재까지의 파싱 이력 전체를 이용해 파싱 결정을 내릴 수 있다. 가능한 파싱 상황의 수는 유한하고 비교적 작으므로, 이 이력을 파서 상태(state)로 파스 스택에 저장할 수 있다.", "keys": ["파싱 이력 전체 활용", "상황 수가 유한·작음", "이력을 상태로 스택에 저장"], "lesson": "L6-2", "unit": "U6"}, {"id": "6-ls-1", "concept": "lr-structure", "type": "mc", "prompt": "ACTION 테이블의 열은?", "choices": ["비단말", "단말", "상태", "규칙 번호"], "answer": 1, "lesson": "L6-2", "unit": "U6"}, {"id": "6-ls-2", "concept": "lr-structure", "type": "short", "prompt": "LR 파싱 테이블의 ACTION 테이블과 GOTO 테이블을 각각 설명하시오.", "answer": "ACTION 테이블: 파서 상태(행)와 다음 입력 토큰(열, 단말)이 주어졌을 때 파서의 행동(shift/reduce/accept/error)을 지정한다.\nGOTO 테이블: reduce 후에 파스 스택 top에 넣을 상태를 지정한다. 행은 상태, 열은 비단말.", "keys": ["ACTION: 상태×단말 → 행동", "GOTO: 상태×비단말 → reduce 후 push할 상태"], "slot": 7, "pts": 3, "lesson": "L6-2", "unit": "U6"}, {"id": "6-ls-3", "concept": "lr-structure", "type": "blank", "prompt": "LR 구성(configuration)은 (S0 X1 S1 … Xm Sm, ai … an $) 형태로, 왼쪽은 (a) 내용, 오른쪽은 남은 (b) 이다.", "answer": "(a) 스택 / (b) 입력", "accept": [["스택", "파스스택", "stack"], ["입력", "입력문자열", "input"]], "lesson": "L6-2", "unit": "U6"}, {"id": "6-la-1", "concept": "lr-actions", "type": "mc", "prompt": "reduce 후 GOTO 테이블을 찾을 때 사용하는 상태는?", "choices": ["reduce 직전 스택 top의 상태", "항상 상태 0", "핸들을 pop한 뒤 남은 스택 top의 상태", "다음 입력 토큰"], "answer": 2, "lesson": "L6-2", "unit": "U6"}, {"id": "6-la-2", "concept": "lr-actions", "type": "mc", "prompt": "규칙 T → T * F 로 reduce 할 때 스택에서 pop하는 항목 수(기호+상태)는?", "choices": ["1", "2", "3", "6"], "answer": 3, "lesson": "L6-2", "unit": "U6"}, {"id": "6-la-3", "concept": "lr-actions", "type": "short", "prompt": "LR 파서의 Shift와 Reduce 행동을 스택 관점에서 정확히 설명하시오.", "answer": "Shift(Sn): 다음 입력 기호와 상태 n을 스택에 push하고 입력에서 그 기호를 제거한다.\nReduce(Rn): 규칙 n의 RHS(핸들)를 상태 기호와 함께 스택에서 제거(RHS 길이×2개 pop)하고, LHS를 push한 뒤, 새 LHS 바로 아래 상태와 LHS로 GOTO 테이블을 찾아 그 상태를 push한다. 입력은 변하지 않는다.", "keys": ["Shift: 기호+상태 push, 입력 소비", "Reduce: RHS×2 pop", "LHS push 후 GOTO[아래 상태, LHS] push", "입력 불변"], "lesson": "L6-2", "unit": "U6"}, {"id": "6-lt-1", "concept": "lr-trace", "type": "calc", "prompt": "다음 문법과 LR 파싱 테이블을 사용하여 문자열 (id + id) * id 에 대해 파서 스택 내용, 입력 문자열, 행동을 포함한 파싱 과정 전체를 보이시오.\n(교안 p.78의 파싱 테이블 사용)\n1. E → E + T   2. E → T   3. T → T * F\n4. T → F       5. F → (E)  6. F → id", "answer": "0           | ( id + id ) * id $  | Shift 4\n0(4         | id + id ) * id $    | Shift 5\n0(4id5      | + id ) * id $       | Reduce 6 (F→id), goto[4,F]=3\n0(4F3       | + id ) * id $       | Reduce 4 (T→F), goto[4,T]=2\n0(4T2       | + id ) * id $       | Reduce 2 (E→T), goto[4,E]=8\n0(4E8       | + id ) * id $       | Shift 6\n0(4E8+6     | id ) * id $         | Shift 5\n0(4E8+6id5  | ) * id $            | Reduce 6 (F→id), goto[6,F]=3\n0(4E8+6F3   | ) * id $            | Reduce 4 (T→F), goto[6,T]=9\n0(4E8+6T9   | ) * id $            | Reduce 1 (E→E+T), goto[4,E]=8\n0(4E8       | ) * id $            | Shift 11\n0(4E8)11    | * id $              | Reduce 5 (F→(E)), goto[0,F]=3\n0F3         | * id $              | Reduce 4 (T→F), goto[0,T]=2\n0T2         | * id $              | Shift 7\n0T2*7       | id $                | Shift 5\n0T2*7id5    | $                   | Reduce 6 (F→id), goto[7,F]=10\n0T2*7F10    | $                   | Reduce 3 (T→T*F), goto[0,T]=2\n0T2         | $                   | Reduce 2 (E→T), goto[0,E]=1\n0E1         | $                   | accept", "keys": ["매 줄 ACTION[상태,
