": "lr-table", "type": "mc", "prompt": "교안 LR 테이블에서 ACTION[0, id]는?", "choices": ["S5", "S4", "R6", "accept"], "answer": 0, "lesson": "L6-3", "unit": "U6"}, {"id": "6-tb-2", "concept": "lr-table", "type": "mc", "prompt": "교안 LR 테이블에서 GOTO[6, T]는?", "choices": ["2", "3", "9", "10"], "answer": 2, "lesson": "L6-3", "unit": "U6"}, {"id": "6-tb-3", "concept": "lr-table", "type": "mc", "prompt": "교안 LR 테이블에서 ACTION[8, )]는?", "choices": ["R2", "S6", "R5", "S11"], "answer": 3, "lesson": "L6-3", "unit": "U6"}, {"id": "7-nm-1", "concept": "names", "type": "short", "prompt": "이름(name)의 설계 이슈 두 가지를 쓰고 각각 설명하시오.", "answer": "1. 대소문자 구분 여부: C 계열처럼 구분하면 rose, ROSE, Rose가 서로 다른 이름이 되어 판독성이 떨어진다.\n2. 특수어가 예약어인가 키워드인가: 예약어는 이름으로 사용할 수 없고, 키워드는 특정 문맥에서만 특별한 의미를 가진다. 예약어가 너무 많으면 이름 짓기가 어렵다(COBOL).", "keys": ["대소문자 구분 → 판독성", "예약어 vs 키워드"], "lesson": "L7-1", "unit": "U7"}, {"id": "7-nm-2", "concept": "names", "type": "mc", "prompt": "예약어(reserved word)와 키워드(keyword)의 차이로 옳은 것은?", "choices": ["예약어는 이름으로 사용할 수 없고, 키워드는 특정 문맥에서만 특별한 의미", "키워드는 이름으로 사용할 수 없고, 예약어는 문맥에 따라 다름", "둘은 같다", "예약어는 컴파일러만, 키워드는 인터프리터만 사용"], "answer": 0, "lesson": "L7-1", "unit": "U7"}, {"id": "7-nm-3", "concept": "names", "type": "ox", "prompt": "C 계열 언어에서 이름의 대소문자를 구분하는 것은 판독성을 떨어뜨린다는 비판을 받는다.", "answer": true, "lesson": "L7-1", "unit": "U7"}, {"id": "7-va-1", "concept": "var-attrs", "type": "short", "prompt": "변수의 6가지 속성을 쓰시오.", "answer": "이름(name), 주소(address), 값(value), 타입(type), 생존 기간(lifetime), 영역(scope)", "keys": ["이름", "주소", "값", "타입", "생존 기간", "영역"], "slot": 5, "pts": 3, "lesson": "L7-1", "unit": "U7"}, {"id": "7-va-2", "concept": "var-attrs", "type": "mc", "prompt": "변수의 l-value는?", "choices": ["값", "주소", "타입", "이름"], "answer": 1, "lesson": "L7-1", "unit": "U7"}, {"id": "7-va-3", "concept": "var-attrs", "type": "mc", "prompt": "'변수가 특정 메모리 셀에 바인딩되어 있는 기간'은?", "choices": ["영역", "바인딩 시간", "생존 기간", "세련화"], "answer": 2, "lesson": "L7-1", "unit": "U7"}, {"id": "7-va-4", "concept": "var-attrs", "type": "short", "prompt": "별칭(alias)이란 무엇이며, 어떻게 생기고, 왜 해로운지 쓰시오.", "answer": "별칭: 둘 이상의 변수 이름이 같은 메모리 주소에 접근할 수 있는 것.\n생기는 경우: 포인터, 참조 변수, C/C++ 공용체(union).\n해로운 이유: 한 이름으로 값을 바꾸면 다른 이름의 값도 바뀌어 프로그래머가 모든 별칭을 기억해야 하므로 판독성·신뢰성이 떨어진다.", "keys": ["같은 주소를 여러 이름으로", "포인터/참조/union", "판독성·신뢰성↓"], "lesson": "L7-1", "unit": "U7"}, {"id": "7-va-5", "concept": "var-attrs", "type": "blank", "prompt": "변수의 값은 (a) 이라고도 하며, 변수의 타입은 변수가 가질 수 있는 값의 (b) 와 그 타입에 정의된 연산의 집합을 결정한다.", "answer": "(a) r-value / (b) 범위", "accept": [["rvalue", "r-value", "우측값"], ["범위", "range", "집합"]], "lesson": "L7-1", "unit": "U7"}, {"id": "7-bt-1", "concept": "binding-time", "type": "short", "prompt": "`count = count + 5;` (C)에서 다음 각각의 바인딩 시간을 쓰시오. (1) count의 타입 (2) * 와 + 같은 연산자 기호의 가능한 의미 집합 (3) + 의 실제 의미 (4) 리터럴 5의 내부 표현 (5) count의 값", "answer": "(1) 컴파일 시간\n(2) 언어 설계 시간\n(3) 컴파일 시간 (피연산자 타입이 결정될 때)\n(4) 컴파일러(언어) 설계/구현 시간\n(5) 실행 시간 (이 문장 실행 시)", "keys": ["타입: 컴파일", "가능한 의미: 언어 설계", "실제 의미: 컴파일", "내부 표현: 구현 시간", "값: 실행"], "lesson": "L7-2", "unit": "U7"}, {"id": "7-bt-2", "concept": "binding-time", "type": "mc", "prompt": "C/C++의 static 변수가 메모리 셀에 바인딩되는 시간은?", "choices": ["언어 설계 시간", "컴파일 시간", "적재(load) 시간", "실행 시간"], "answer": 2, "lesson": "L7-2", "unit": "U7"}, {"id": "7-bt-3", "concept": "binding-time", "type": "mc", "prompt": "C 함수의 비정적 지역 변수가 메모리 셀에 바인딩되는 시간은?", "choices": ["언어 설계 시간", "컴파일 시간", "적재 시간", "실행 시간"], "answer": 3, "lesson": "L7-2", "unit": "U7"}, {"id": "7-bt-4", "concept": "binding-time", "type": "mc", "prompt": "'*' 기호를 곱셈 연산에 바인딩하는 시간은?", "choices": ["언어 설계 시간", "언어 구현 시간", "컴파일 시간", "실행 시간"], "answer": 0, "lesson": "L7-2", "unit": "U7"}, {"id": "7-sdb-1", "concept": "static-dynamic-binding", "type": "short", "prompt": "정적 바인딩과 동적 바인딩을 정의하시오.", "answer": "정적 바인딩: 실행 시간 이전에 처음 일어나고 프로그램 실행 동안 변하지 않는 바인딩.\n동적 바인딩: 실행 중에 처음 일어나거나 실행 중에 변할 수 있는 바인딩.", "keys": ["정적: 실행 전, 변하지 않음", "동적: 실행 중 발생 또는 변경 가능"], "slot": 5, "pts": 3, "lesson": "L7-2", "unit": "U7"}, {"id": "7-sdb-2", "concept": "static-dynamic-binding", "type": "ox", "prompt": "실행 중에 한 번만 일어나고 그 뒤로 변하지 않는 바인딩은 정적 바인딩이다.", "answer": false, "explain": "실행 중에 '처음' 일어나면 동적 바인딩이다. 정적 = 실행 전에 처음 일어나고 불변.", "lesson": "L7-2", "unit": "U7"}, {"id": "7-tb-1", "concept": "type-binding", "type": "short", "prompt": "명시적 선언과 묵시적 선언을 설명하고 묵시적 선언의 예와 단점을 쓰시오.", "answer": "명시적 선언: 변수 이름과 타입을 나열하는 선언문 (int count;).\n묵시적 선언: 선언문 없이 기본 관례로 타입을 정함. 예) Fortran은 I~N으로 시작하는 이름은 정수, Perl은 $(스칼라) @(배열) %(해시), C#의 var(타입 추론).\n단점: 오타가 새 변수로 처리되어 오류가 탐지되지 않을 수 있어 신뢰성이 떨어진다.", "keys": ["명시적: 선언문", "묵시적: 관례/추론 + 예", "단점: 오류 미탐지(신뢰성↓)"], "lesson": "L7-2", "unit": "U7"}, {"id": "7-tb-2", "concept": "type-binding", "type": "short", "prompt": "동적 타입 바인딩의 장점과 단점을 쓰시오.", "answer": "변수의 타입이 배정문에서 배정되는 값에 의해 정해진다(JavaScript, Python).\n장점: 유연성 (generic 프로그램 작성 용이).\n단점: 비용이 큼(실행 시간 타입 검사, 보통 순수 해석으로 구현), 타입 오류 탐지가 어려움(잘못된 타입의 값을 배정해도 오류가 아님) → 신뢰성↓.", "keys": ["배정 시 타입 결정", "장점: 유연성", "단점: 비용(실행 시간 검사/해석)", "단점: 오류 탐지 어려움"], "slot": 5, "pts": 3, "lesson": "L7-2", "unit": "U7"}, {"id": "7-tb-3", "concept": "type-binding", "type": "mc", "prompt": "Perl에서 변수 이름이 @로 시작하면 배열이 되는 것은 어떤 타입 바인딩인가?", "choices": ["명시적 선언", "묵시적 선언(이름 관례)", "동적 타입 바인딩", "타입 추론"], "answer": 1, "lesson": "L7-2", "unit": "U7"}, {"id": "7-tb-4", "concept": "type-binding", "type": "mc", "prompt": "C#의 `var sum = 0;` 은?", "choices": ["명시적 선언", "동적 타입 바인딩", "이름 관례", "타입 추론(문맥으로 타입 결정, 정적)"], "answer": 3, "lesson": "L7-2", "unit": "U7"}, {"id": "7-tb-5", "concept": "type-binding", "type": "ox", "prompt": "JavaScript에서 list = [2, 4.33]; 다음에 list = 17.3; 이 오류 없이 실행되는 것은 동적 타입 바인딩 때문이다.", "answer": true, "lesson": "L7-2", "unit": "U7"}, {"id": "7-lt-1", "concept": "lifetime-def", "type": "blank", "prompt": "가용 메모리 풀에서 셀을 가져와 변수에 바인딩하는 것을 (a), 바인딩을 끊고 풀로 돌려주는 것을 (b) 라고 한다.", "answer": "(a) 할당 / (b) 해제", "accept": [["할당", "allocation"], ["해제", "deallocation", "반환"]], "lesson": "L7-3", "unit": "U7"}, {"id": "7-lt-2", "concept": "lifetime-def", "type": "mc", "prompt": "생존 기간(lifetime)의 정의는?", "choices": ["변수가 특정 메모리 셀에 바인딩되어 있는 시간", "변수가 가시적인 문장의 범위", "변수의 타입이 유지되는 시간", "프로그램 전체 실행 시간"], "answer": 0, "lesson": "L7-3", "unit": "U7"}, {"id": "7-vc-1", "concept": "var-categories", "type": "short", "prompt": "생존 기간에 따른 변수의 4가지 종류를 쓰고 각각 간략히 설명하시오.", "answer": "정적 변수: 실행 전에 메모리 셀에 바인딩되어 종료까지 유지 (C의 static).\n스택-동적 변수: 선언문이 세련화(실행)될 때 기억장소가 바인딩, 타입은 정적 (C 함수의 지역 변수).\n명시적 힙-동적 변수: 프로그래머의 명시적 명령(new/delete)으로 할당·해제되는 이름 없는 셀, 포인터/참조로 접근.\n묵시적 힙-동적 변수: 값이 배정될 때마다 힙에 할당 (JavaScript 배열·문자열).", "keys": ["정적", "스택-동적(세련화)", "명시적 힙-동적(new/delete)", "묵시적 힙-동적(배정 시)"], "slot": 5, "pts": 3, "lesson": "L7-3", "unit": "U7"}, {"id": "7-vc-2", "concept": "var-categories", "type": "mc", "prompt": "재귀를 지원할 수 없는 변수 종류는?", "choices": ["정적 변수", "스택-동적 변수", "명시적 힙-동적 변수", "묵시적 힙-동적 변수"], "answer": 0, "lesson": "L7-3", "unit": "U7"}, {"id": "7-vc-3", "concept": "var-categories", "type": "short", "prompt": "정적 변수의 장점과 단점을 쓰시오.", "answer": "장점: 효율적(직접 주소 지정, 할당/해제 오버헤드 없음), 이력 민감(history-sensitive) 부프로그램 지원.\n단점: 유연성 감소, 재귀를 지원할 수 없음, 변수 간에 저장 공간을 공유할 수 없음.", "keys": ["효율(직접 주소)", "이력 민감", "재귀 불가", "공간 공유 불가"], "lesson": "L7-3", "unit": "U7"}, {"id": "7-vc-4", "concept": "var-categories", "type": "short", "prompt": "스택-동적 변수의 장점과 단점을 쓰시오.", "answer": "장점: 재귀 지원, 부프로그램들이 같은 메모리 공간을 공유할 수 있음.\n단점: 할당/해제 실행 시간 오버헤드, 간접 주소 지정으로 느린 접근, 이력 민감하지 않음.", "keys": ["재귀 지원", "메모리 공유", "할당/해제 오버헤드", "이력 민감 X"], "lesson": "L7-3", "unit": "U7"}, {"id": "7-vc-5", "concept": "var-categories", "type": "mc", "prompt": "C++의 `int *p = new int;` 로 만들어진 셀은?", "choices": ["정적 변수", "스택-동적 변수", "명시적 힙-동적 변수", "묵시적 힙-동적 변수"], "answer": 2, "lesson": "L7-3", "unit": "U7"}, {"id": "7-vc-6", "concept": "var-categories", "type": "mc", "prompt": "JavaScript에서 `highs = [74, 84, 86];` 처럼 배정될 때 힙에 할당되는 변수는?", "choices": ["정적", "스택-동적", "명시적 힙-동적", "묵시적 힙-동적"], "answer": 3, "lesson": "L7-3", "unit": "U7"}, {"id": "7-vc-7", "concept": "var-categories", "type": "blank", "prompt": "선언문이 실행 시간에 처리되어 기억장소를 할당하고 바인딩하는 것을 (a) 라고 한다.", "answer": "(a) 세련화", "accept": [["세련화", "elaboration", "정교화"]], "lesson": "L7-3", "unit": "U7"}, {"id": "7-st-1", "concept": "scope-terms", "type": "short", "prompt": "변수의 영역, 지역 변수, 비지역 변수를 정의하시오.", "answer": "영역: 변수가 가시적인(참조 가능한) 문장들의 범위.\n지역 변수: 그 프로그램 단위/블록 안에서 선언된 변수.\n비지역 변수: 그 프로그램 단위에서 가시적이지만 그 안에서 선언되지 않은 변수.", "keys": ["영역 = 가시적인 문장 범위", "지역: 안에서 선언", "비지역: 보이지만 밖에서 선언"], "lesson": "L7-4", "unit": "U7"}, {"id": "7-st-2", "concept": "scope-terms", "type": "ox", "prompt": "전역 변수는 비지역 변수의 특수한 경우이다.", "answer": true, "lesson": "L7-4", "unit": "U7"}, {"id": "7-ss-1", "concept": "static-scope", "type": "calc", "prompt": "다음 JavaScript 골격 프로그램에서 실행 순서가 main → sub3 → sub1 → sub2 라고 하자.\n(a) 정적 영역을 가정할 때 sub1, sub2, sub3 각각에서 x에 대한 참조는 어느 선언인가?\n(b) 동적 영역을 가정할 때 다시 답하시오.", "answer": "(a) 정적 영역: 선언을 프로그램 텍스트(정적 부모)로 찾음\n  sub1: sub1의 x (3행)\n  sub2: 정적 부모 sub1의 x (3행)\n  sub3: 정적 부모 main의 x (1행)\n(b) 동적 영역: 호출 체인 main → sub3 → sub1 → sub2 를 거꾸로 찾음\n  sub1: sub1의 x (지역)\n  sub2: 지역 x 없음 → 호출자 sub1의 x\n  sub3: 지역 x 없음 → 호출자 main의 x\n(이 호출 순서에서는 두 방식의 답이 같다)", "code": "1   var x;                 // main의 x\n2   function sub1() {\n3       var x;             // sub1의 x\n4       function sub2() {\n5           ...\n6       }\n7   }\n8   function sub3() {\n9       ...\n10  }", "keys": ["정적: sub1→sub1, sub2→sub1, sub3→main", "동적: 호출 체인 역순 탐색", "각 답에 선언 위치 명시"], "slot": 16, "pts": 10, "lesson": "L7-4", "unit": "U7"}, {"id": "7-ss-2", "concept": "static-scope", "type": "calc", "prompt": "다음 프로그램에서 실행 순서가 main → sub2 → sub1 → sub3 일 때(sub1이 sub3을 호출할 수 있다고 가정), sub3의 x 참조는 (a) 정적 영역 (b) 동적 영역에서 각각 어느 선언인가?", "answer": "(a) 정적 영역: sub3의 정적 부모는 sub2 → sub2의 x (7행)\n(b) 동적 영역: 호출 체인 sub3 ← sub1 ← sub2 ← main. sub3에 x 없음 → 가장 최근 호출자 sub1의 x (3행)", "code": "1   var x;                 // main의 x\n2   function sub1() {\n3       var x;             // sub1의 x\n4       sub3();\n5   }\n6   function sub2() {\n7       var x;             // sub2의 x\n8       function sub3() {\n9           ... x ...      // 이 x는?\n10      }\n11      sub1();\n12  }", "keys": ["정적: 정적 부모 sub2의 x", "동적: 호출자 sub1의 x"], "slot": 16, "pts": 10, "lesson": "L7-4", "unit": "U7"}, {"id": "7-ss-3", "concept": "static-scope", "type": "mc", "prompt": "정적 영역에서 비지역 변수의 선언을 찾는 순서는?", "choices": ["호출한 함수 → 그 호출자 → …", "지역 → 정적 부모 → 정적 조상 → … → 전역", "전역 → 지역", "가장 최근에 선언된 것부터"], "answer": 1, "lesson": "L7-4", "unit": "U7"}, {"id": "7-ss-4", "concept": "static-scope", "type": "mc", "prompt": "정적 영역에 대한 설명으로 틀린 것은?", "choices": ["프로그램 텍스트로 영역이 결정된다", "실행 전에 결정할 수 있다", "ALGOL 60에서 도입되었다", "부프로그램의 호출 순서에 따라 참조 대상이 달라진다"], "answer": 3, "lesson": "L7-4", "unit": "U7"}, {"id": "7-ss-5", "concept": "static-scope", "type": "blank", "prompt": "C++에서 지역 변수에 가려진 전역 변수 x에 접근하려면 (a) 를 쓴다.", "answer": "(a) ::x", "accept": [["::x", "::"]], "lesson": "L7-4", "unit": "U7"}, {"id": "7-bl-1", "concept": "blocks", "type": "calc", "prompt": "다음 C 함수에서 화살표로 표시된 각 지점에 대해, 가시적인 변수와 그 변수를 정의하는 정의문 번호를 나열하시오.", "answer": "(1) x(1), y(1)\n(2) x(1), y(2), z(2)\n(3) x(3), w(3), y(2), z(2)\n(4) x(1), y(2), z(2)\n(5) x(1), y(1)", "code": "1   void f(void) {\n2       int x, y;            /* 정의 1 */\n3       ...  <------------------- (1)\n4       for (...) {\n5           int y, z;        /* 정의 2 */\n6           ...  <--------------- (2)\n7           while (...) {\n8               int x, w;    /* 정의 3 */\n9               ...  <----------- (3)\n10          }\n11          ...  <--------------- (4)\n12      }\n13      ...  <------------------- (5)\n14  }", "keys": ["(1) x1 y1", "(2) x1 y2 z2", "(3) x3 w3 y2 z2", "(4) x1 y2 z2", "(5) x1 y1"], "slot": 17, "pts": 10, "lesson": "L7-4", "unit": "U7"}, {"id": "7-bl-2", "concept": "blocks", "type": "calc", "prompt": "다음 C 함수에서 화살표로 표시된 각 지점에 대해, 가시적인 변수와 그 변수를 정의하는 정의문 번호를 나열하시오.", "answer": "(1) a(1), b(1), c(2), d(2)\n(2) a(3), d(3), e(3), b(1), c(2)\n(3) a(1), b(1), c(2), d(2)\n(4) a(1), c(1), b(4), f(4)   ← while 블록은 이미 닫혔으므로 정의 2는 안 보임", "code": "1   void g(void) {\n2       int a, b, c;          /* 정의 1 */\n3       while (...) {\n4           int c, d;         /* 정의 2 */\n5           ...  <------------- (1)\n6           if (...) {\n7               int a, d, e;  /* 정의 3 */\n8               ...  <--------- (2)\n9           }\n10          ...  <------------- (3)\n11      }\n12      if (...) {\n13          int b, f;         /* 정의 4 */\n14          ...  <------------- (4)\n15      }\n16  }", "keys": ["(1) a1 b1 c2 d2", "(2) a3 d3 e3 b1 c2", "(3) a1 b1 c2 d2", "(4) a1 c1 b4 f4 (닫힌 블록 제외)"], "slot": 17, "pts": 10, "lesson": "L7-4", "unit": "U7"}, {"id": "7-bl-3", "concept": "blocks", "type": "mc", "prompt": "중첩 블록에서 바깥 블록의 변수와 같은 이름의 변수를 선언하는 것을 금지하는 언어는?", "choices": ["C", "C++", "Java와 C#", "Pascal"], "answer": 2, "lesson": "L7-4", "unit": "U7"}, {"id": "7-bl-4", "concept": "blocks", "type": "mc", "prompt": "C#에서 블록 중간에 선언된 변수의 영역은?", "choices": ["선언 지점부터 블록 끝까지", "블록 전체 (단, 사용 전에 선언돼야 함)", "함수 전체", "전역"], "answer": 1, "lesson": "L7-4", "unit": "U7"}, {"id": "7-bl-5", "concept": "blocks", "type": "ox", "prompt": "C++/Java에서 `for (int i = 0; …)` 로 선언된 i의 영역은 for문 안으로 한정된다.", "answer": true, "lesson": "L7-4", "unit": "U7"}, {"id": "7-bl-6", "concept": "blocks", "type": "mc", "prompt": "블록 안에서 선언된 C 변수(static 아님)의 기억장소 종류는?", "choices": ["정적", "스택-동적", "명시적 힙-동적", "묵시적 힙-동적"], "answer": 1, "lesson": "L7-4", "unit": "U7"}, {"id": "7-gs-1", "concept": "global-scope", "type": "short", "prompt": "C에서 전역 변수의 '선언'과 '정의'의 차이를 쓰시오.", "answer": "정의(definition): 타입 등 속성을 지정하고 기억장소 할당을 일으킨다 (int sum;).\n선언(declaration): 타입 등 속성만 지정하고 기억장소를 할당하지 않는다. 다른 곳에 정의된 변수를 쓰기 위해 사용 (extern int sum;).", "keys": ["정의: 기억장소 할당", "선언: 속성만, 할당 X (extern)"], "lesson": "L7-4", "unit": "U7"}, {"id": "7-gs-2", "concept": "global-scope", "type": "mc", "prompt": "Python에서 함수 안에서 전역 변수에 값을 배정하려면?", "choices": ["아무것도 필요 없다", "extern 선언", "global 선언", "$GLOBALS 사용"], "answer": 2, "lesson": "L7-4", "unit": "U7"}, {"id": "7-gs-3", "concept": "global-scope", "type": "mc", "prompt": "PHP 함수 안에서 전역 변수 $day에 접근하는 방법은?", "choices": ["$GLOBALS['day'] 또는 global $day", "::day", "extern $day", "불가능"], "answer": 0, "lesson": "L7-4", "unit": "U7"}, {"id": "7-sse-1", "concept": "static-scope-eval", "type": "short", "prompt": "정적 영역의 문제점을 쓰시오.", "answer": "대부분의 경우 잘 동작하지만, 변수와 부프로그램에 필요 이상으로 많은 접근이 허용되고, 프로그램이 진화(수정)하면서 초기 구조가 무너져 전역 변수가 늘어나는 경향이 있다. 대안은 캡슐화 구조이다.", "keys": ["필요 이상의 접근 허용", "프로그램 진화로 구조 붕괴/전역 증가"], "lesson": "L7-4", "unit": "U7"}, {"id": "7-ds-1", "concept": "dynamic-scope", "type": "calc", "prompt": "다음 프로그램에서 동적 영역 규칙을 사용한다고 할 때, 각 호출 순서에서 마지막으로 활성화된 부프로그램이 실행되는 동안 가시적인 변수를 그 변수가 정의된 함수 이름과 함께 쓰시오.\na. main이 sub1를 호출; sub1이 sub2를 호출; sub2이 sub3를 호출\nb. main이 sub3를 호출; sub3이 sub1를 호출\nc. main이 sub2를 호출; sub2이 sub1를 호출; sub1이 sub3를 호출", "answer": "a. a(sub3), e(sub3), f(sub3), c(sub2), d(sub2), b(sub1)\nb. b(sub1), d(sub1), a(sub3), e(sub3), f(sub3), c(main)\nc. a(sub3), e(sub3), f(sub3), b(sub1), d(sub1), c(sub2)", "code": "1   // main\n2   var a, b, c;\n3   function sub1() {\n4       var b, d;\n5       ...\n6   }\n7   function sub2() {\n8       var c, d, e;\n9       ...\n10  }\n11  function sub3() {\n12      var a, e, f;\n13      ...\n14  }", "keys": ["마지막 함수부터 호출 체인 역순", "이미 나온 이름은 가려짐", "각 변수에 정의 함수 표기"], "slot": 18, "pts": 10, "lesson": "L7-5", "unit": "U7"}, {"id": "7-ds-2", "concept": "dynamic-scope", "type": "calc", "prompt": "다음 프로그램에서 동적 영역 규칙을 사용한다고 할 때, 각 호출 순서에서 마지막으로 활성화된 부프로그램이 실행되는 동안 가시적인 변수를 그 변수가 정의된 함수 이름과 함께 쓰시오.\na. main이 sub1를 호출; sub1이 sub3를 호출; sub3이 sub2를 호출\nb. main이 sub3를 호출; sub3이 sub2를 호출; sub2이 sub1를 호출\nc. main이 sub2를 호출; sub2이 sub3를 호출", "answer": "a. c(sub2), d(sub2), e(sub2), a(sub3), f(sub3), b(sub1)\nb. b(sub1), d(sub1), c(sub2), e(sub2), a(sub3), f(sub3)\nc. a(sub3), e(sub3), f(sub3), c(sub2), d(sub2), b(main)", "code": "1   // main\n2   var a, b, c;\n3   function sub1() {\n4       var b, d;\n5       ...\n6   }\n7   function sub2() {\n8       var c, d, e;\n9       ...\n10  }\n11  function sub3() {\n12      var a, e, f;\n13      ...\n14  }", "keys": ["마지막 함수부터 호출 체인 역순", "이미 나온 이름은 가려짐", "각 변수에 정의 함수 표기"], "slot": 18, "pts": 10, "lesson": "L7-5", "unit": "U7"}, {"id": "7-ds-3", "concept": "dynamic-scope", "type": "short", "prompt": "동적 영역의 장점과 단점을 쓰시오.", "answer": "장점: 편리함 – 호출된 부프로그램이 호출자의 변수를 매개변수 없이 사용할 수 있다.\n단점: ① 부프로그램이 실행되는 동안 그 지역 변수가 실행 중인 다른 모든 부프로그램에 보여 신뢰성이 떨어진다 ② 비지역 변수에 대한 정적 타입 검사가 불가능 ③ 호출 순서를 알아야 참조를 알 수 있어 판독성이 나쁨 ④ 비지역 변수 접근이 느림", "keys": ["장점: 편리(매개변수 없이 전달)", "지역 변수가 다른 부프로그램에 노출", "정적 타입 검사 불가", "판독성↓", "접근 느림"], "lesson": "L7-5", "unit": "U7"}, {"id": "7-ds-4", "concept": "dynamic-scope", "type": "mc", "prompt": "동적 영역에서 비지역 변수 참조를 해석하는 방법은?", "choices": ["정적 부모를 따라 찾는다", "가장 최근에 활성화된 호출자부터 호출 체인을 거꾸로 따라 찾는다", "전역에서만 찾는다", "컴파일 시간에 결정된다"], "answer": 1, "lesson": "L7-5", "unit": "U7"}, {"id": "7-ds-5", "concept": "dynamic-scope", "type": "ox", "prompt": "동적 영역에서는 같은 비지역 참조라도 호출 순서에 따라 다른 변수를 가리킬 수 있다.", "answer": true, "lesson": "L7-5", "unit": "U7"}, {"id": "7-sl-1", "concept": "scope-vs-lifetime", "type": "short", "prompt": "영역과 생존 기간이 다르다는 것을 보여주는 예를 C에서 들고 설명하시오.", "answer": "void f() { static int count = 0; … } 에서 count의 영역은 함수 f 안(지역)이지만, 생존 기간은 프로그램 실행 전체이다.\n또는: compute()가 지역 변수 sum을 선언하고 printheader()를 호출하면, printheader 실행 중 sum은 영역 밖(보이지 않음)이지만 생존 기간 안(살아 있음)이다.", "keys": ["static 지역 변수 또는 호출된 함수 예", "영역(공간적·텍스트) vs 생존 기간(시간적) 구분"], "lesson": "L7-5", "unit": "U7"}, {"id": "7-sl-2", "concept": "scope-vs-lifetime", "type": "mc", "prompt": "영역과 생존 기간에 대한 설명으로 옳은 것은?", "choices": ["영역은 공간적(텍스트) 개념, 생존 기간은 시간적 개념", "둘은 항상 같다", "생존 기간은 항상 영역보다 짧다", "영역은 실행 시간에만 결정된다"], "answer": 0, "lesson": "L7-5", "unit": "U7"}, {"id": "7-re-1", "concept": "ref-env", "type": "short", "prompt": "참조 환경(referencing environment)을 정의하고, 정적 영역 언어와 동적 영역 언어에서 각각 무엇으로 구성되는지 쓰시오.", "answer": "참조 환경: 어떤 문장에서 가시적인 모든 이름의 집합.\n정적 영역 언어: 지역 변수 + 모든 정적 조상(감싸는 영역)에서 가시적인 변수.\n동적 영역 언어: 지역 변수 + 현재 활성화된 모든 부프로그램에서 가시적인 변수.", "keys": ["가시적인 모든 이름의 집합", "정적: 지역 + 정적 조상", "동적: 지역 + 활성 부프로그램"], "lesson": "L7-5", "unit": "U7"}, {"id": "7-re-2", "concept": "ref-env", "type": "mc", "prompt": "'활성화된(active)' 부프로그램이란?", "choices": ["컴파일된 부프로그램", "한 번이라도 호출된 부프로그램", "실행을 시작했지만 아직 종료하지 않은 부프로그램", "main 함수"], "answer": 2, "lesson": "L7-5", "unit": "U7"}, {"id": "7-nc-1", "concept": "named-const", "type": "short", "prompt": "이름 상수(named constant)를 정의하고 장점 두 가지를 쓰시오.", "answer": "이름 상수: 값에 한 번만 바인딩되는 변수.\n장점: 판독성 향상(3.14159 대신 pi), 수정 용이성/프로그램 신뢰성(파라미터화 – 상수 하나만 바꾸면 전체에 반영).", "keys": ["한 번만 값에 바인딩", "판독성", "수정 용이성(파라미터화)"], "lesson": "L7-5", "unit": "U7"}, {"id": "7-nc-2", "concept": "named-const", "type": "mc", "prompt": "실행 시간에 변수를 포함한 식으로 초기화할 수 있는(동적 값 바인딩) 이름 상수는?", "choices": ["C#의 const", "Java의 final / C#의 readonly", "C의 #define", "리터럴"], "answer": 1, "lesson": "L7-5", "unit": "U7"}, {"id": "7-sse-2", "concept": "static-scope-eval", "type": "ox", "prompt": "정적 영역은 프로그램이 수정·진화하면서 초기 구조가 무너져 전역 변수가 늘어나는 경향이 있다는 비판을 받는다.", "answer": true, "lesson": "L7-4", "unit": "U7"}, {"id": "1-dom-4", "concept": "domain", "type": "mc", "prompt": "'계속 실행되므로 효율이 중요하다'는 특징을 가진 도메인과 대표 언어는?", "choices": ["과학 응용 – Fortran", "사무 응용 – COBOL", "웹 – PHP", "시스템 프로그래밍 – C"], "answer": 3, "lesson": "L1-1", "unit": "U1"}, {"id": "1-crit-5", "concept": "criteria", "type": "mc", "prompt": "다음 중 언어 평가 기준 4가지에 들어가지 '않는' 것은?", "choices": ["판독성", "비용", "이식성", "작성력"], "answer": 2, "explain": "이식성·일반성·분명성은 '기타 기준'. 핵심 4가지 = 판독성, 작성력, 신뢰성, 비용.", "lesson": "L1-2", "unit": "U1"}, {"id": "1-crit-6", "concept": "criteria", "type": "mc", "prompt": "교안 표에서 '추상화 지원'과 '표현력'이 영향을 주는 기준의 조합은?", "choices": ["판독성만", "작성력과 신뢰성", "판독성과 비용", "신뢰성만"], "answer": 1, "lesson": "L1-2", "unit": "U1"}, {"id": "1-crit-7", "concept": "criteria", "type": "ox", "prompt": "단순성과 직교성은 판독성, 작성력, 신뢰성 세 기준 모두에 영향을 준다.", "answer": true, "lesson": "L1-2", "unit": "U1"}, {"id": "1-simp-4", "concept": "simplicity", "type": "ox", "prompt": "같은 연산을 하는 방법이 여러 개 있으면 작성할 때는 편할 수 있지만 판독성 측면의 단순성을 해친다.", "answer": true, "lesson": "L1-2", "unit": "U1"}, {"id": "1-orth-5", "concept": "orthogonality", "type": "blank", "prompt": "직교성이 높으면 규칙의 (a) 가 적어지고 규칙성이 높아져 배우고 읽기 쉽다. C에서 구조체는 반환할 수 있지만 (b) 은 반환할 수 없는 것은 직교성이 부족한 예이다.", "answer": "(a) 예외 / (b) 배열", "accept": [["예외", "exception", "exceptions", "예외사항"], ["배열", "array", "arrays"]], "lesson": "L1-2", "unit": "U1"}, {"id": "1-orth-6", "concept": "orthogonality", "type": "short", "prompt": "'너무 많은 직교성'이 왜 문제가 되는지 예와 함께 설명하시오.", "answer": "모든 조합이 합법이 되면 이상한 조합도 허용되어 오히려 복잡해지고 오류가 탐지되지 않는다. 예) 모든 것이 값을 갖는 식이 되면 x := (if a > b then a := b else b := a fi); 같은 코드도 합법이 되어 읽기 어렵다.", "keys": ["이상한 조합까지 합법", "오류 미탐지/복잡", "예: if 식 안의 배정"], "lesson": "L1-2", "unit": "U1"}, {"id": "1-syn-4", "concept": "syntax-design", "type": "mc", "prompt": "'의미가 구문에서 바로 드러나야 한다'는 원칙을 위반하는 C의 예약어는?", "choices": ["while", "static", "return", "int"], "answer": 1, "lesson": "L1-2", "unit": "U1"}, {"id": "1-wr-4", "concept": "writability", "type": "mc", "prompt": "작성력을 '높이는' 특성이 아닌 것은?", "choices": ["추상화 지원", "표현력", "단순성과 직교성", "별칭 허용"], "answer": 3, "explain": "별칭은 신뢰성을 낮추는 요인으로 교안에 나온다.", "lesson": "L1-3", "unit": "U1"}, {"id": "1-trade-6", "concept": "tradeoffs", "type": "ox", "prompt": "APL은 강력한 연산자로 프로그램을 짧게 쓸 수 있어 판독성과 작성력이 모두 높다.", "answer": false, "explain": "작성력은 높지만 판독성은 나쁘다 → 판독성 vs 작성력의 상충 예.", "lesson": "L1-4", "unit": "U1"}, {"id": "1-impl-5", "concept": "impl-methods", "type": "mc", "prompt": "'고급 언어를 해석하기 쉬운 중간 언어로 번역한 뒤 그것을 해석'하는 방식은?", "choices": ["컴파일", "순수 해석", "혼합형 구현", "전처리"], "answer": 2, "lesson": "L1-5", "unit": "U1"}, {"id": "1-impl-6", "concept": "impl-methods", "type": "blank", "prompt": "순수 해석은 컴파일된 프로그램보다 실행이 (a) 배 느리고, 대신 실행 시간 오류를 (b) 수준에서 바로 보여주기 쉽다.", "answer": "(a) 10~100 / (b) 소스", "accept": [["10~100", "10-100", "10~100배", "10에서100", "10~100배느림"], ["소스", "원시", "원시코드", "소스코드", "source"]], "lesson": "L1-5", "unit": "U1"}, {"id": "1-phase-4", "concept": "compile-phases", "type": "mc", "prompt": "컴파일 과정에서 '모든 단계가 공통으로 참조하는' 것은?", "choices": ["심볼 테이블", "파스 트리", "중간 코드", "적재 모듈"], "answer": 0, "lesson": "L1-5", "unit": "U1"}, {"id": "2-ss-4", "concept": "syn-sem", "type": "ox", "prompt": "'변수 이름은 문자로 시작해야 한다'는 규칙은 의미론이 아니라 구문에 속한다.", "answer": true, "lesson": "L2-1", "unit": "U2"}, {"id": "2-lt-6", "concept": "lexeme-token", "type": "mc", "prompt": "`x1 = x1 * 10;` 의 어휘항목 수와 토큰 종류 수는? (토큰: identifier, equal_sign, mult_op, int_literal, semicolon)", "choices": ["6개 / 6종류", "6개 / 5종류", "5개 / 5종류", "7개 / 5종류"], "answer": 1, "explain": "어휘항목: x1, =, x1, *, 10, ; = 6개. 토큰 종류: identifier, equal_sign, mult_op, int_literal, semicolon = 5종류.", "lesson": "L2-1", "unit": "U2"}, {"id": "2-der-6", "concept": "derivation", "type": "mc", "prompt": "문법 `<expr> → <var> + <var> | <var>`, `<var> → a | b` 에서 `a + <var>` 다음의 최좌단 유도 단계로 가능한 것은?", "choices": ["a + b", "<var> + b", "a + <var> + <var>", "a + b + b"], "answer": 0, "lesson": "L2-2", "unit": "U2"}, {"id": "2-der-7", "concept": "derivation", "type": "calc", "prompt": "다음 문법으로 `begin d = a + b ; a = c end` 의 최좌단 유도를 쓰시오.\n<program> → begin <stmts> end\n<stmts> → <stmt> | <stmt> ; <stmts>\n<stmt> → <var> = <expr>\n<var> → a | b | c | d\n<expr> → <var> + <var> | <var> - <var> | <var>", "answer": "<program> ⇒ begin <stmts> end\n⇒ begin <stmt> ; <stmts> end\n⇒ begin <var> = <expr> ; <stmts> end\n⇒ begin d = <expr> ; <stmts> end\n⇒ begin d = <var> + <var> ; <stmts> end\n⇒ begin d = a + <var> ; <stmts> end\n⇒ begin d = a + b ; <stmts> end\n⇒ begin d = a + b ; <stmt> end\n⇒ begin d = a + b ; <var> = <expr> end\n⇒ begin d = a + b ; a = <expr> end\n⇒ begin d = a + b ; a = <var> end\n⇒ begin d = a + b ; a = c end", "keys": ["<stmts> ⇒ <stmt> ; <stmts>", "첫 문장 끝까지 먼저", "매 단계 비단말 하나"], "lesson": "L2-2", "unit": "U2"}, {"id": "2-pt-6", "concept": "parse-tree", "type": "mc", "prompt": "식 문법(<expr>/<term>/<factor>)으로 만든 `A = B * C + A` 의 파스 트리에서 루트 아래 <expr>의 자식은?", "choices": ["<expr> + <term>", "<term>", "<term> * <factor>", "<expr> * <term>"], "answer": 0, "explain": "+ 가 가장 낮은 우선순위라 최상위 <expr> → <expr> + <term>. B * C는 왼쪽 <expr> ⇒ <term> 안에 들어감.", "lesson": "L2-3", "unit": "U2"}, {"id": "2-amb-6", "concept": "ambiguity", "type": "mc", "prompt": "다음 중 모호한 문법은?", "choices": ["<E> → <E> + <T> | <T>,  <T> → id", "<E> → <T> + <E> | <T>,  <T> → id", "<E> → <E> + <E> | id", "<E> → id + <E> | id"], "answer": 2, "lesson": "L2-3", "unit": "U2"}, {"id": "2-prec-4", "concept": "precedence", "type": "mc", "prompt": "모호하지 않은 식 문법에서 `A = B + C * A`의 파스 트리를 그리면 트리에서 더 아래(잎 쪽)에 있는 연산자는?", "choices": ["+", "*", "둘이 같은 높이", "괄호에 따라 다름"], "answer": 1, "lesson": "L2-4", "unit": "U2"}, {"id": "2-prec-5", "concept": "precedence", "type": "ox", "prompt": "우선순위가 높은 연산자일수록 파스 트리에서 루트에 가까워야 한다.", "answer": false, "explain": "높은 우선순위 = 먼저 계산 = 트리에서 더 낮은 곳(잎 쪽).", "lesson": "L2-4", "unit": "U2"}, {"id": "2-prec-6", "concept": "precedence", "type": "calc", "prompt": "다음 문법에 거듭제곱 연산자 ^ 를 * 보다 높은 우선순위로, 우결합이 되게 추가하시오.\n<expr> → <expr> + <term> | <term>\n<term> → <term> * <factor> | <factor>\n<factor> → ( <expr> ) | <id>", "answer": "<expr> → <expr> + <term> | <term>\n<term> → <term> * <pow> | <pow>\n<pow> → <factor> ^ <pow> | <factor>\n<factor> → ( <expr> ) | <id>", "keys": ["새 비단말을 <term>과 <factor> 사이에", "우순환 형태(<factor> ^ <pow>)로 우결합", "<term>이 새 비단말을 참조"], "lesson": "L2-4", "unit": "U2"}, {"id": "2-de-4", "concept": "dangling-else", "type": "ox", "prompt": "대부분의 언어에서 else는 가장 바깥쪽 if와 짝지어진다.", "answer": false, "explain": "else는 가장 가까운 짝 없는(unmatched) then과 짝지어진다.", "lesson": "L2-4", "unit": "U2"}, {"id": "3-ss-4", "concept": "static-semantics", "type": "mc", "prompt": "정적 의미론에 대한 설명으로 옳은 것은?", "choices": ["프로그램 실행 중의 상태 변화를 기술", "프로그램의 적법한 형식(주로 타입 제약)에 관한 규칙으로 컴파일 시간에 검사 가능", "파스 트리를 생성하는 규칙", "정확성 증명을 위한 규칙"], "answer": 1, "lesson": "L3-1", "unit": "U3"}, {"id": "3-ag-4", "concept": "ag-def", "type": "ox", "prompt": "속성 문법은 문맥 자유 문법에 속성, 의미 함수, 술어 함수를 추가한 것이다.", "answer": true, "lesson": "L3-1", "unit": "U3"}, {"id": "3-ak-5", "concept": " answer": 2, "explain": "마지막 문장부터 거꾸로:\n① 2x < 8 → {x < 4}\n② y - 3 < 4 → {y < 7}", "lesson": "L3-4", "unit": "U3"}, {"id": "3-seq-g3", "concept": "wp-seq", "type": "mc", "prompt": "다음 시퀀스의 최약 전조건은?\n  m = n + 2;\n  n = 3 * m - 1;\n  {n > 11}", "choices": ["{n > 2}", "{n > 4}", "{m > 4}", "{n > 6}"], "answer": 0, "explain": "마지막 문장부터 거꾸로:\n① 3m - 1 > 11 → {m > 4}\n② n + 2 > 4 → {n > 2}", "lesson": "L3-4", "unit": "U3"}, {"id": "3-sel-7", "concept": "wp-select", "type": "mc", "prompt": "`if (a > 0) b = a + 1 else b = 1 - a; {b > 3}` 에서 then 쪽과 else 쪽의 전조건은?", "choices": ["then {a > 2}, else {a < -2}", "then {a > 2}, else {a > -2}", "then {a > 4}, else {a < -4}", "then {a > 3}, else {a < 3}"], "answer": 0, "explain": "then: a + 1 > 3 → a > 2 / else: 1 - a > 3 → -a > 2 → a < -2", "lesson": "L3-4", "unit": "U3"}, {"id": "3-sel-8", "concept": "wp-select", "type": "calc", "prompt": "다음 선택문과 후조건에 대해 최약 전조건을 계산하시오.\n  if (x > y)\n      y = x + 3\n  else\n      y = 2 * x + 1;\n  {y > 7}", "answer": "then: x + 3 > 7 → {x > 4}\nelse: 2x + 1 > 7 → {x > 3}\nx > 4 ⇒ x > 3 이므로 (교재 방식) 최약 전조건: {x > 4}\n(정밀하게는 {(x > y and x > 4) or (x <= y and x > 3)})", "keys": ["then {x > 4}", "else {x > 3}", "결론 {x > 4}"], "slot": 12, "pts": 5, "lesson": "L3-4", "unit": "U3"}, {"id": "3-lr-4", "concept": "loop-rule", "type": "mc", "prompt": "불변자 조건 중 '루프 몸체를 한 번 실행해도 I가 유지된다'를 나타내는 것은?", "choices": ["P ⇒ I", "{I and B} S {I}", "(I and not B) ⇒ Q", "루프 종료"], "answer": 1, "lesson": "L3-5", "unit": "U3"}, {"id": "3-inv-5", "concept": "invariant", "type": "mc", "prompt": "`while i <> n do i = i + 1 end {i = n}` (시작 시 i = 0, n >= 0) 의 적절한 루프 불변자는?", "choices": ["{i = n}", "{i >= n}", "{i <= n}", "{i > 0}"], "answer": 2, "lesson": "L3-5", "unit": "U3"}, {"id": "3-inv-6", "concept": "invariant", "type": "mc", "prompt": "`while k > 0 do k = k - 2 end` 의 후조건이 {k <= 0} 일 때, I and not B ⇒ Q 를 만족하는 불변자로 가장 알맞은 것은? (k의 초기값은 정수)", "choices": ["{k > 0}", "{k = 0}", "{k < 0}", "{true} (아무 조건 없음)"], "answer": 3, "explain": "not B = k <= 0 자체가 Q이므로 I는 아무 조건이어도 (I and k <= 0) ⇒ k <= 0 이 성립. 가장 약한 I = true.", "lesson": "L3-5", "unit": "U3"}, {"id": "3-lp-5", "concept": "loop-proof", "type": "calc", "prompt": "다음 프로그램이 올바름을 증명하시오.\n{n >= 0}\nc = 0;\nr = 1;\nwhile c <> n do\n    c = c + 1;\n    r = r * 2;\nend\n{r = 2^n}", "answer": "불변자 I = (r = 2^c) and (c <= n)\n1. P ⇒ I: 루프 직전 c = 0, r = 1 = 2^0, 0 <= n ✓\n2. {I and B} S {I}: c ≠ n 이고 c <= n 이므로 c < n. c = c + 1 → c <= n, r = r * 2 = 2^(c-1) * 2 = 2^c ✓\n3. (I and not B) ⇒ Q: c = n 이면 r = 2^n ✓\n4. 종료: c는 0에서 1씩 증가하고 c <= n 이므로 n에 도달", "keys": ["I = (r = 2^c) and c <= n", "P ⇒ I", "몸체 유지", "c = n → Q", "종료"], "slot": 19, "pts": 10, "lesson": "L3-5", "unit": "U3"}, {"id": "3-lp-6", "concept": "loop-proof", "type": "mc", "prompt": "팩토리얼 증명에서 불변자 I = (fact = (count+1)*…*n) and (count >= 0) 일 때, (I and not B) ⇒ Q 를 확인하는 방법은? (B: count <> 0)", "choices": ["count = 0을 대입하면 fact = 1*2*…*n = n!", "count = n을 대입하면 fact = 1", "fact = 1이므로 Q 성립", "count가 감소하므로 종료"], "answer": 0, "lesson": "L3-5", "unit": "U3"}, {"id": "4-lp-4", "concept": "lex-vs-parser", "type": "mc", "prompt": "어휘 분석기와 구문 분석기의 짝으로 옳은 것은?", "choices": ["어휘: 정규 문법·유한 오토마타 / 구문: CFG·푸시다운 오토마타", "어휘: CFG / 구문: 정규 문법", "둘 다 튜링 기계", "어휘: 푸시다운 / 구문: 유한 오토마타"], "answer": 0, "lesson": "L4-1", "unit": "U4"}, {"id": "4-sep-4", "concept": "separate-why", "type": "ox", "prompt": "어휘 분석과 구문 분석을 분리하면 파서가 공백·주석 같은 세부를 다루지 않아도 되므로 단순해진다.", "answer": true, "lesson": "L4-1", "unit": "U4"}, {"id": "4-lr-4", "concept": "lexer-role", "type": "mc", "prompt": "어휘 분석기가 하는 일이 '아닌' 것은?", "choices": ["주석과 공백 건너뛰기", "사용자 정의 이름을 심볼 테이블에 넣기", "어휘 오류 탐지", "모호한 문법 검출"], "answer": 3, "lesson": "L4-2", "unit": "U4"}, {"id": "4-sd-4", "concept": "state-diagram", "type": "mc", "prompt": "상태 다이어그램에서 'LETTER', 'DIGIT' 클래스를 쓰는 목적은?", "choices": ["예약어 구분", "같은 전이를 하는 문자들을 묶어 다이어그램을 단순화", "토큰 코드 결정", "오류 복구"], "answer": 1, "lesson": "L4-2", "unit": "U4"}, {"id": "4-ut-4", "concept": "lexer-utils", "type": "mc ces": ["{c}, 통과", "{a, b}, 실패 (b 공통)", "{a}, 통과", "{a, b, c}, 실패"], "answer": 1, "lesson": "L5-3", "unit": "U5"}, {"id": "5-lf-4", "concept": "left-factoring", "type": "mc", "prompt": "A → xyB | xyC 를 좌추출한 결과는?", "choices": ["A → xyA',  A' → B | C", "A → xA',  A' → yB | yC 만 가능", "A → B | C", "A → xyBC"], "answer": 0, "explain": "공통 접두부 xy 전체를 뽑는 게 일반형. (x만 뽑으면 A' 에서 다시 공통 y가 남음)", "lesson": "L5-3", "unit": "U5"}, {"id": "6-bp-3", "concept": "bu-problem", "type": "mc", "prompt": "상향식 파서가 우문장 형태에서 찾아 LHS로 환원해야 하는 부분 문자열을 무엇이라 하는가?", "choices": ["핸들", "어구", "토큰", "FIRST"], "answer": 0, "lesson": "L6-1", "unit": "U6"}, {"id": "6-bp-4", "concept": "bu-problem", "type": "ox", "prompt": "상향식 파서는 최좌단 유도를 처음부터 순서대로 재현한다.", "answer": false, "explain": "최우단 유도를 역순으로 재현한다.", "lesson": "L6-1", "unit": "U6"}, {"id": "6-sr-3", "concept": "shift-reduce", "type": "mc", "prompt": "입력 `id + id` 에서 첫 id를 스택에 옮기는 행동은?", "choices": ["shift", "reduce", "accept", "goto"], "answer": 0, "lesson": "L6-2", "unit": "U6"}, {"id": "6-sr-4", "concept": "shift-reduce", "type": "ox", "prompt": "reduce 행동은 입력 문자열을 하나 소비한다.", "answer": false, "explain": "reduce는 스택만 바꾸고 입력은 그대로.", "lesson": "L6-2", "unit": "U6"}, {"id": "6-ls-4", "concept": "lr-structure", "type": "mc", "prompt": "GOTO 테이블은 언제 참조하는가?", "choices": ["shift 직후", "파싱 시작 시", "reduce 직후 LHS를 push한 다음", "accept 시"], "answer": 2, "lesson": "L6-2", "unit": "U6"}, {"id": "6-tb-4", "concept": "lr-table", "type": "mc", "prompt": "교안 LR 테이블에서 ACTION[9, *]와 ACTION[9, +]는?", "choices": ["둘 다 R1", "S7 / R1", "R1 / S6", "S7 / S6"], "answer": 1, "explain": "상태 9 = E+T 를 본 상태. *가 오면 T*F를 위해 shift, +가 오면 E+T를 먼저 환원.", "lesson": "L6-3", "unit": "U6"}, {"id": "6-la-g1", "concept": "lr-actions", "type": "mc", "prompt": "LR 파싱(교안 테이블) 중\n스택: 0T2*7F10\n입력: + id $\n행동: Reduce 3\n이 행동을 수행한 뒤의 스택은?", "choices": ["0T9", "0T2*T2", "0T2", "0T"], "answer": 2, "explain": "Reduce 3 (T→T*F), goto[0,T]=2. RHS 기호 3개(상태 포함 6칸)를 pop하고 LHS와 GOTO 상태를 push.", "lesson": "L6-2", "unit": "U6"}, {"id": "6-la-g2", "concept": "lr-actions", "type": "mc", "prompt": "LR 파싱(교안 테이블) 중\n스택: 0E1+6T9\n입력: $\n행동: Reduce 1\n이 행동을 수행한 뒤의 스택은?", "choices": ["0E8", "0E", "0E1E1", "0E1"], "answer": 3, "explain": "Reduce 1 (E→E+T), goto[0,E]=1. RHS 기호 3개(상태 포함 6칸)를 pop하고 LHS와 GOTO 상태를 push.", "lesson": "L6-2", "unit": "U6"}, {"id": "6-la-g3", "concept": "lr-actions", "type": "mc", "prompt": "LR 파싱(교안 테이블) 중\n스택: 0(4E8+6T9\n입력: ) * id $\n행동: Reduce 1\n이 행동을 수행한 뒤의 스택은?", "choices": ["0(4EE8", "0(4E1", "0(4E", "0(4E8"], "answer": 3, "explain": "Reduce 1 (E→E+T), goto[4,E]=8. RHS 기호 3개(상태 포함 6칸)를 pop하고 LHS와 GOTO 상태를 push.", "lesson": "L6-2", "unit": "U6"}, {"id": "6-la-g4", "concept": "lr-actions", "type": "mc", "prompt": "LR 파싱(교안 테이블) 중\n스택: 0(4E8)11\n입력: * id $\n행동: Reduce 5\n이 행동을 수행한 뒤의 스택은?", "choices": ["0(4EF3", "0F", "0F3", "0F10"], "answer": 2, "explain": "Reduce 5 (F→(E)), goto[0,F]=3. RHS 기호 3개(상태 포함 6칸)를 pop하고 LHS와 GOTO 상태를 push.", "lesson": "L6-2", "unit": "U6"}, {"id": "7-nm-4", "concept": "names", "type": "mc", "prompt": "COBOL이 이름 짓기가 어렵다는 비판을 받는 이유는?", "choices": ["대소문자를 구분해서", "이름 길이가 1자로 제한돼서", "예약어가 300개 정도로 너무 많아서", "특수 문자가 필요해서"], "answer": 2, "lesson": "L7-1", "unit": "U7"}, {"id": "7-va-6", "concept": "var-attrs", "type": "mc", "prompt": "재귀 함수의 지역 변수처럼 '같은 이름이 실행 중 다른 시점에 다른 주소'를 가질 수 있는 속성은?", "choices": ["이름", "주소", "타입", "영역"], "answer": 1, "lesson": "L7-1", "unit": "U7"}, {"id": "7-sdb-3", "concept": "static-dynamic-binding", "type": "mc", "prompt": "C 변수의 타입 바인딩은 어떤 종류인가?", "choices": ["정적 바인딩 (컴파일 시간)", "동적 바인딩", "적재 시간 동적 바인딩", "실행 시간 바인딩"], "answer": 0, "lesson": "L7-2", "unit": "U7"}, {"id": "7-sdb-4", "concept": "static-dynamic-binding", "type": "mc", "prompt": "Python 변수의 타입 바인딩은?", "choices": ["정적 바인딩", "동적 바인딩", "언어 설계 시간 바인딩", "명시적 선언"], "answer": 1, "lesson": "L7-2", "unit": "U7"}, {"id": "7-st-3", "concept": "scope-terms", "type": "mc", "prompt": "함수 안에서 사용되지만 그 함수 밖에서 선언된, 가시적인 변수는?", "choices": ["지역 변수", "정적 변수", "비 : 2, "lexer-role": 2, "lexer-build": 1, "state-diagram": 2, "lexer-utils": 2, "front-codes": 2, "front-trace": 2, "parser-goals": 1, "topdown-bottomup": 3, "parse-complexity": 1, "rd-structure": 2, "rd-coding": 2, "rd-trace": 2, "ll-parsing": 2, "left-recursion": 3, "pairwise": 3, "left-factoring": 2, "bu-problem": 2, "handle-def": 2, "handle-howto": 3, "shift-reduce": 2, "lr-advantages": 2, "lr-structure": 2, "lr-actions": 3, "lr-table": 2, "lr-trace": 1, "lr-routine": 3, "names": 2, "var-attrs": 3, "binding-time": 2, "static-dynamic-binding": 2, "type-binding": 2, "lifetime-def": 1, "var-categories": 3, "scope-terms": 2, "static-scope": 3, "blocks": 3, "global-scope": 2, "static-scope-eval": 1, "dynamic-scope": 3, "scope-vs-lifetime": 2, "ref-env": 2, "named-const": 1}}</script>
<script>
(() => {
const DATA = JSON.parse(document.getElementById("pl-data").textContent);
const UNITS = DATA.units;
const LESSONS = UNITS.flatMap(u => u.lessons.map(l => ({ ...l, unit:u.id, unitTitle:u.title })));
const LES = Object.fromEntries(LESSONS.map(l => [l.id, l]));
const SEC = {};  // concept id -> {id,title,lesson}
for (const l of LESSONS) for (const s of l.secs) SEC[s.id] = { ...s, lesson:l.id };
const TYPE = { mc:"객관식", ox:"OX", blank:"빈칸", short:"서술", calc:"풀이" };
const PASS = 0.7;
const WEIGHT = DATA.weights || {};
const wOf = c => WEIGHT[c] || 2;
const QUICK = t => t === "mc" || t === "ox" || t === "blank";
const EXAM_DAY = new Date(2026, 9, 20);
const MOCK_MIN = 75;
const BOOT = Date.now();  // 이 페이지를 연 시각: quiz.start가 없는 예전 퀴즈는 이 시각 이전 기록만 자동 통과
// 24 중간 문항 → 레슨 (배점)
const EXAM24 = [["L1-2",1,3],["L1-4",2,3],["L1-5",3,3],["L2-1",4,3],["L7-1",5,3],["L2-1",6,3],["L5-1",7,3],["L2-3",8,3],["L3-3",9,3],["L2-3",10,3],["L3-4",11,5],["L3-4",12,5],["L5-3",13,5],["L6-1",14,5],["L6-3",15,10],["L7-4",16,10],["L7-4",17,10],["L7-5",18,10],["L3-5",19,10]];
const SLOT_PTS = {1:3,2:3,3:3,4:3,5:3,6:3,7:3,8:3,9:3,10:3,11:5,12:5,13:5,14:5,15:10,16:10,17:10,18:10,19:10};

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const norm = s => String(s ?? "").toLowerCase().replace(/[\s()（）.,'"“”‘’·\-_]/g, "");

let extra = [], attempts = [], progress = {};
let db = null, sample = null;
let view = ls.get("pl-view", "learn");
let L = ls.get("pl-learn", { lesson:null, mode:"home", quiz:null, review:null });  // learn state
let filters = ls.get("pl-filters", { unit:"", concept:"", type:"", status:"" });
let curId = ls.get("pl-cur", null);
let mock = ls.get("pl-mock", null);
const results = {};   // practice: qid -> result
const saveL = () => ls.set("pl-learn", L);

/* ── derived ───────────────────────── */
const allQ = () => DATA.questions.concat(extra);
const qById = id => allQ().find(q => q.id === id);
function latestBy(key){
  const m = {};
  for (const a of attempts){ const k = a[key]; if (k && (!m[k] || a.at > m[k].at)) m[k] = a; }
  return m;
}
const latestQ = () => latestBy("qid");
const latestC = () => latestBy("concept");
function level(score){ if (score == null) return "none"; return score >= .85 ? "good" : score >= PASS ? "mid" : "weak"; }
const LV = { none:"미시도", weak:"약점", mid:"보통", good:"숙달" };
const lessonConcepts = lid => LES[lid].secs.filter(s => allQ().some(q => q.concept === s.id)).map(s => s.id);
const lessonDone = lid => !!progress[lid]?.done;
function lessonUnlocked(lid){
  const i = LESSONS.findIndex(l => l.id === lid);
  return i <= 0 || lessonDone(LESSONS[i-1].id) || lessonDone(lid);
}
function lessonWeak(lid){ const lc = latestC(); return lessonConcepts(lid).filter(c => lc[c] && lc[c].score < PASS); }
function nextLesson(){ return LESSONS.find(l => !lessonDone(l.id)) || null; }
function srcOf(concept){ const s = SEC[concept]; if (!s) return ""; const l = LES[s.lesson]; return `${l.id} §${s.title} · ${l.src}`; }

/* ── storage ───────────────────────── */
function setStoreChip(){ const el = $("#store"); el.textContent = db ? "기록 저장: 클라우드" : "기록 저장: 이 브라우저만"; el.className = "chip " + (db ? "live" : "local"); }
function setGraderChip(){ $("#grader").textContent = sample ? "채점: Claude + 자동/자가" : "채점: 자동 + 자가채점"; }
function toastErr(msg){ const el = document.createElement("div"); el.className = "err"; el.textContent = msg; $("main").prepend(el); setTimeout(()=>el.remove(), 6000); }
async function saveAttempt(a){
  a.at = Date.now(); a.answer = String(a.answer || "").slice(0, 6000);
  const q = qById(a.qid); a.concept = q?.concept || ""; a.lesson = q?.lesson || "";
  const id = a.at + "-" + Math.random().toString(36).slice(2,8);
  if (db){
    try { await db.collection("attempts").doc(id).set(a); if (!attempts.find(x => x._id === id)) attempts.push({ ...a, _id:id }); return id; }
    catch(e){ toastErr("기록을 클라우드에 저장하지 못했어 (" + (e.code||"error") + "). 이 브라우저에만 남겨둘게."); }
  }
  const loc = ls.get("pl-attempts", []); loc.push({ ...a, _id:id }); ls.set("pl-attempts", loc);
  attempts.push({ ...a, _id:id }); return id;
}
async function updateAttempt(id, patch){
  const j = attempts.findIndex(x => x._id === id); if (j >= 0) Object.assign(attempts[j], patch);
  if (db){ try { await db.collection("attempts").doc(id).update(patch); return; } catch {} }
  const loc = ls.get("pl-attempts", []); const i = loc.findIndex(x => x._id === id);
  if (i >= 0){ Object.assign(loc[i], patch); ls.set("pl-attempts", loc); }
}
async function saveProgress(lid, passedPatch){
  const prev = progress[lid] || {};
  const passed = { ...(prev.passed || {}), ...passedPatch };
  const done = prev.done || lessonConcepts(lid).every(c => passed[c]);

/* ── grading ───────────────────────── */
function autoGrade(q, ans){
  if (q.type === "mc"){ const ok = Number(ans) === q.answer; return { score: ok ? 1 : 0, feedback: ok ? "정답!" : `정답은 ${q.answer+1}번.` }; }
  if (q.type === "ox"){ const ok = ans === q.answer; return { score: ok ? 1 : 0, feedback: ok ? "정답!" : `정답은 ${q.answer ? "O" : "X"}.` }; }
  if (q.type === "blank"){
    const arr = Array.isArray(ans) ? ans : [];
    let hit = 0; const missed = [];
    q.accept.forEach((alts, i) => {
      const v = norm(arr[i]);
      if (v && alts.some(a => norm(a) === v)) hit++; else missed.push(`(${String.fromCharCode(97+i)}) 정답: ${alts[0]}`);
    });
    const score = hit / q.accept.length;
    return { score, missed, feedback: score === 1 ? "빈칸 전부 맞았어." : `${q.accept.length}칸 중 ${hit}칸 맞음. 표현이 달라서 틀린 거면 아래 버튼으로 고쳐.` };
  }
  return null;
}
function gradingPrompt(q, ans){
  return `You grade one answer from a midterm in Principles of Programming Languages (프로그래밍언어론, Chung-Ang University, Sebesta textbook). The exam is written and answered in Korean; English technical terms are fine.

Grade the student's answer against the model answer and key points.
- Accept synonyms, Korean/English term equivalents, and mathematically equivalent forms (e.g. {b > 8/3} = {3b > 8}; {a > 2b+2} = {a - 2b > 2}).
- Short answer: credit each key point proportionally. Brevity is fine ("간략히 서술" exam).
- Calculations (weakest precondition, derivations, parse trees, FIRST sets, LR parse traces, scope tables): check each step; give partial credit for correct method with arithmetic slips; a missing required component (e.g. no parse tree when asked, no loop invariant) loses that part.
- For weakest precondition of if-then-else, accept either the textbook answer (stronger of the two branch preconditions when one implies the other) or the precise disjunction.
- Parse trees may be drawn as indented text; judge structure, not formatting.
- An empty or "모르겠다"-style answer scores 0.

Question type: ${q.type}
Question: ${q.prompt}
${q.code ? "Code/grammar given:\n" + q.code + "\n" : ""}
Model answer:
${q.answer}
${q.keys ? "Key points: " + q.keys.join(" | ") + "\n" : ""}${q.explain ? "Note: " + q.explain + "\n" : ""}
Student answer:
<<<
${ans}
>>>

Reply with only this JSON:
{"score": <number 0..1>, "verdict": "correct" | "partial" | "wrong", "feedback": "<Korean, casual 반말, 1-3 sentences, concrete: what was right/wrong>", "missed": ["<short Korean item the student missed or got wrong>", ...]}`;
}
async function claudeGrade(q, ans){
  const r = await sample.json(gradingPrompt(q, ans), { modelTier: q.type === "calc" ? "default" : "quick" });
  let score = Number(r?.score); if (!isFinite(score)) score = 0; score = Math.max(0, Math.min(1, score));
  return { score, feedback:String(r?.feedback || ""), missed: Array.isArray(r?.missed) ? r.missed.map(String).slice(0,6) : [] };
}
function sampleErrMsg(e){
  const c = e?.code;
  if (c === "not_granted") return "Claude 채점이 허용되지 않았어. 답 보고 자가채점해줘.";
  if (c === "rate_limited") return "채점 요청이 몰렸어. 잠깐 뒤에 다시 눌러줘.";
  return "채점에 실패했어 (" + (c || "error") + "). 자가채점으로 기록할 수 있어.";
}

async function gradeAny(q, d){
  const auto = autoGrade(q, d);

function rankQs(list){
  const lq = latestQ();
  return list.map(q => ({ q, k: attempts.filter(a => a.qid === q.id).length * 10 + (lq[q.id] ? lq[q.id].score * 3 : 0) + Math.random() * 2 }))
    .sort((a,b) => a.k - b.k).map(x => x.q);
}
// n questions for one concept: one written (short/calc) when n >= 2 and available, rest quick; quick ones first
function pickN(concept, n, avoid){
  const cand = allQ().filter(q => q.concept === concept);
  let pool = cand.filter(q => !avoid.has(q.id)); if (pool.length < n) pool = pool.concat(rankQs(cand.filter(q => avoid.has(q.id))));
  const quick = rankQs(pool.filter(q => QUICK(q.type))), written = rankQs(pool.filter(q => !QUICK(q.type)));
  let out = [];
  if (n === 1) out = rankQs(pool).slice(0, 1);
  else {
    const w = written.length ? 1 : 0;
    out = quick.slice(0, n - w).concat(written.slice(0, w));
    for (const q of rankQs(pool)) if (out.length < n && !out.includes(q)) out.push(q);
  }
  out = [...new Set(out)].slice(0, n);
  return out.filter(q => QUICK(q.type)).concat(out.filter(q => !QUICK(q.type)));
}

  L.quiz = { lessonId:lid, round, items, idx:0, res:{}, drafts:{}, used:[...used], start:Date.now() };
  L.mode = "quiz"; L.lesson = lid; saveL(); renderLearn(); window.scrollTo({ top:0 });
}

function autoCarry(z){

    if (z.res[it.qid]) continue;

function recommendations(n){
  const lq = latestQ();
  const studied = lid => lessonDone(lid) || attempts.some(a => a.lesson === lid);
  return allQ().map(q => {
    const l = lq[q.id];
    if (l && l.score >= .85) return null;
    const need = l ? 1 - l.score : 1.1;
    const s = need * (1 + wOf(q.concept)) * (q.slot ? 1.6 : 1) * (studied(q.lesson) ? 1 : .25) * (0.9 + Math.random() * 0.2);
    return { q, s };
  }).filter(Boolean).sort((a,b) => b.s - a.s).slice(0, n).map(x => x.q);
}

/* ── PRACTICE view ───────────────────────── */
function filteredQs(){
  const lq = latestQ();
  return allQ().filter(q => {
    if (filters.lesson && q.lesson !== filters.lesson) return false;
    if (filters.unit && q.unit !== filters.unit) return false;
    if (filters.concept && q.concept !== filters.concept) return false;
    if (filters.type && q.type !== filters.type) return false;
    const l = lq[q.id];
    if (filters.status === "new" && l) return false;
    if (filters.status === "wrong" && !(l && l.score < PASS)) return false;
    if (filters.status === "notgood" && l && l.score >= .85) return false;
    if (filters.status === "exam" && !q.slot) return false;
    return true;
  });
}
function renderPractice(){

function buildMock(){

    if (!c.length) continue;
    c.sort((a,b) => (lq[a.id] ? 1 : 0) - (lq[b.id] ? 1 : 0) || Math.random() - .5);
    items.push({ slot:s, qid:c[0].id, pts:SLOT_PTS[s] });
  }
  return { start:Date.now(), items, answers:{}, done:false, results:{} };
}

async function bkMergeList(name, incoming, cur){
  const have = new Set(cur.map(bkKey)); const add = incoming.filter(a => a && a.qid && !have.has(bkKey(a)));

  for (const a of add){
    const id = a._id && a._id !== "local" ? a._id : (a.at || Date.now()) + "-" + Math.random().toString(36).slice(2,8);
    const { _id, ...doc } = a;
    if (db){ try { await db.collection(name).doc(id).set(doc); cloud++; cur.push({ ...doc, _id:id }); continue; } catch {} }
    const loc = ls.get(BK_PFX + name, []); loc.push({ ...doc, _id:id }); ls.set(BK_PFX + name, loc); cur.push({ ...doc, _id:id });

}
async function bkImport(file){
  let d; try { d = JSON.parse(await file.text()); } catch { return bkMsg("JSON 파일이 아니야.", true); }
  if (d.app !== BK_PFX) return bkMsg(`다른 과목 기록이야 (${d.name || d.app || "?"}). ${BK_NAME} 기록 파일을 골라줘.`, true);
  bkMsg("가져오는 중…");
  const na = await bkMergeList("attempts", d.attempts || [], attempts);
  let nc = 0; if (typeof checks !== "undefined" && d.checks) nc = await bkMergeList("checks", d.checks, checks);
  let np = 0; const lp = ls.get(BK_PFX + "progress", {});
  for (const [lid, p] of Object.entries(d.progress || {})){
    const cur = progress[lid] || {};
    if (!p || (cur.done && !p.done)) continue;
    const merged = { ...cur, ...p, passed:{ ...(cur.passed || {}), ...(p.passed || {}) }, done:!!(cur.done || p.done) };
    if (JSON.stringify(merged) === JSON.stringify(cur)) continue;
    progress[lid] = merged; lp[lid] = merged; np++;
    if (db){ try { await db.collection("progress").doc(lid).set(merged); } catch {} }
  }
  ls.set(BK_PFX + "progress", lp);
  renderAll(true);
  bkMsg(`가져왔어: 새 문항 기록 ${na}개 · 레슨 진행 ${np}개${nc ? ` · 점검 ${nc}개` : ""}${db ? " (클라우드에도 저장)" : " (이 브라우저에 저장)"}.`);
}
function bkPanel(){
  return `<div class="sheet" id="bk" style="padding:12px 14px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center">
    <b style="margin-right:4px">기록 백업</b>
    <button class="btn sm" data-bkexp="1">기록 내보내기 (.json)</button>
    <label class="btn sm" style="cursor:pointer">기록 가져오기<input type="file" accept=".json,application/json" data-bkimp="1" hidden></label>
    <span class="note" id="bk-msg">Claude 앱 ↔ 볼트의 html 파일 사이에 기록을 옮길 때. 가져오기는 합치기라 기존 기록은 안 지워져.</span></div>`;
}
{ const _rh = renderHist; renderHist = function(...a){ const r = _rh.apply(this, a); const v = document.getElementById("v-hist"); if (v && !v.querySelector("#bk")) v.insertAdjacentHTML("afterbegin", bkPanel()); return r; }; }
document.addEventListener("click", e => { if (e.target.closest?.("[data-bkexp]")) bkExport(); });
document.addEventListener("change", e => { if (e.target.matches?.("[data-bkimp]") && e.target.files[0]){ bkImport(e.target.files[0]); e.target.value = ""; } });

boot();
})();
</script>
