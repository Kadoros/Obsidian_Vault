tton class=\"zoom\" data-zoom=\"img/L03b-p13.jpg\" aria-label=\"크게 보기\"><img src=\"img/L03b-p13.jpg\" alt=\"03-02 p.13 · C의 for문을 저수준 문장으로 기술한 연산 의미론\" loading=\"lazy\"><\/button><figcaption>03-02 p.13 · C의 for문을 저수준 문장으로 기술한 연산 의미론<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-denotational\"><h3>표기 의미론<\/h3><ul><li><b>재귀 함수 이론<\/b>에 기반.<\/li><li>명세 만드는 과정: (1) 각 언어 개체에 대응하는 <b>수학적 객체<\/b>를 정의 → (2) 언어 개체의 인스턴스를 수학적 객체의 인스턴스로 사상하는 <b>함수<\/b>를 정의.<ul><li>함수의 정의역 = <b>구문 정의역<\/b> (syntactic domain), 치역 = <b>의미 정의역<\/b> (semantic domain)<\/li><\/ul><\/li><li>언어 구조의 의미는 <b>프로그램 변수들의 값만으로<\/b> 정의된다.<\/li><li><b>프로그램 상태<\/b>: <code>s = {&lt;i1,v1&gt;, &lt;i2,v2&gt;, …, &lt;in,vn&gt;}<\/code> (모든 현재 변수의 값)<\/li><li><code>VARMAP(ij, s) = vj<\/code> : 변수 이름과 상태를 받아 현재 값을 돌려줌<\/li><\/ul>\n<p>십진수 예:<\/p>\n<pre class=\"code\">&lt;dec_num&gt; → &#x27;0&#x27; | &#x27;1&#x27; | … | &#x27;9&#x27; | &lt;dec_num&gt; (&#x27;0&#x27; | &#x27;1&#x27; | … | &#x27;9&#x27;)\n\nMdec(&#x27;0&#x27;) = 0, Mdec(&#x27;1&#x27;) = 1, …, Mdec(&#x27;9&#x27;) = 9\nMdec(&lt;dec_num&gt; &#x27;0&#x27;) = 10 * Mdec(&lt;dec_num&gt;)\nMdec(&lt;dec_num&gt; &#x27;1&#x27;) = 10 * Mdec(&lt;dec_num&gt;) + 1\n…\nMdec(&lt;dec_num&gt; &#x27;9&#x27;) = 10 * Mdec(&lt;dec_num&gt;) + 9<\/pre>\n<p>예) <code>Mdec('47') = 10 * Mdec('4') + 7 = 47<\/code><\/p>\n<p>논리 사전검사 루프 (상태 집합 → 상태 집합 ∪ {error}):<\/p>\n<pre class=\"code\">Ml(while B do L, s) =\n    if Mb(B, s) == undef then error\n    else if Mb(B, s) == false then s\n    else if Msl(L, s) == error then error\n    else Ml(while B do L, Msl(L, s))<\/pre>\n<p>루프가 <b>재귀<\/b>로 표현된다는 게 핵심.<\/p>\n<p>평가: 언어를 정밀하게 기술하는 훌륭한 방법, 언어 설계에 도움. 복잡해서 언어 사용자에게는 거의 쓸모없음.<\/p>\n<p><b>연산 vs 표기<\/b>: 연산 의미론은 상태 변화를 <b>코딩된 알고리즘<\/b>으로, 표기 의미론은 <b>엄밀한 수학 함수<\/b>로 정의.<\/p><\/section>"}, {"id": "L3-3", "title": "공리 의미론 · 배정문의 최약 전조건", "src": "03-02 p.20–26", "secs": [{"id": "assertions", "title": "단언 · 전조건 · 후조건"}, {"id": "wp-assign", "title": "배정문 공리"}, {"id": "wp-theorem", "title": "정리(theorem)로서의 배정문"}], "md": "## 단언 · 전조건 · 후조건 {#assertions}\n\n- 공리 의미론은 **형식 논리(술어 계산)** 에 기반. 원래 목적: **형식적 프로그램 검증**.\n- **단언** (assertion): 공리 의미론에서 쓰는 논리식(술어).\n- **전조건** (precondition): 문장 **앞**의 단언. 그 실행 지점에서 참인 변수 간 관계·제약.\n- **후조건** (postcondition): 문장 **뒤**의 단언.\n- 표기: `{P} statement {Q}`  (Hoare triple)\n- **최약 전조건** (weakest precondition): 후조건을 보장하는 **가장 덜 제한적인** 전조건.\n\n예) `a = b + 1 {a > 1}`\n- 가능한 전조건: `{b > 10}` (맞지만 너무 강함)\n- 최약 전조건: `{b > 0}`\n\n표기: `wp(문장, 후조건) = 전조건`\n\n**증명 과정**: 프로그램 전체의 후조건(원하는 결과)에서 시작해 **거꾸로** 첫 문장까지 전조건을 계산. 그 결과가 프로그램 명세(입력 조건)와 같으면(또는 명세가 그것을 함의하면) 프로그램은 정확하다.\n\n## 배정문 공리 {#wp-assign}\n\n`x = E` 의 후조건이 Q일 때:\n**전조건 P = Q에서 x를 모두 E로 치환한 것** (`P = Q_{x→E}`)\n\n푸는 법은 딱 하나야: **후조건의 변수를 우변 식으로 바꿔 끼우고, 부등식을 정리.**\n\n예 1) `a = b / 2 - 1 {a < 10}`\n```\nb / 2 - 1 < 10  →  b / 2 < 11  →  b < 22\nwp = {b < 22}\n```\n예 2) `x = x + y - 3 {x > 10}`\n```\nx + y - 3 > 10  →  x + y > 13\nwp = {x + y > 13}     ← 우변에 x 자신이 있어도 그냥 치환하면 됨\n```\n예 3) `sum = 2 * x + 1 {sum > 1}`\n```\n2x + 1 > 1  →  2x > 0  →  x > 0\n```\n\n> 실수 주의: (1) 치환은 후조건의 변수 **전부**에. (2) 괄호 분배 `2 * (b - 1)` = `2b - 2`. (3) 음수로 나누면 부등호 방향이 뒤집힘. 예) `-2x > 4` → `x < -2`.\n\n## 정리(theorem)로서의 배정문 {#wp-theorem}\n\n전조건과 후조건이 **둘 다 주어진** 배정문은 하나의 논리 문장(정리)이다.\n배정 공리를 후조건에 적용해서 **주어진 전조건이 나오면** 증명 끝.\n\n예) `{x > 3} x = x - 3 {x > 0}`\n```\nwp = (x - 3 > 0) = {x > 3}  → 주어진 전조건과 같음 → 참(증명됨)\n```\n예) `{x > 5} x = x - 3 {x > 0}` : wp는 `{x > 3}`라서 배정 공리만으로는 안 나온다 → **결과 규칙**이 필요 (다음 레슨).", "html": "<section class=\"sec\" id=\"s-assertions\"><h3>단언 · 전조건 · 후조건<\/h3><ul><li>공리 의미론은 <b>형식 논리(술어 계산)<\/b> 에 기반. 원래 목적: <b>형식적 프로그램 검증<\/b>.<\/li><li><b>단언<\/b> (assertion): 공리 의미론에서 쓰는 논리식(술어).<\/li><li><b>전조건<\/b> (precondition): 문장 <b>앞<\/b>의 단언. 그 실행 지점에서 참인 변수 간 관계·제약.<\/li><li><b>후조건<\/b> (postcondition): 문장 <b>뒤<\/b>의 단언.<\/li><li>표기: <code>{P} statement {Q}<\/code>  (Hoare triple)<\/li><li><b>최약 전조건<\/b> (weakest precondition): 후조건을 보장하는 <b>가장 덜 제한적인<\/b> 전조건.<\/li><\/ul>\n<p>예) <code>a = b + 1 {a &gt; 1}<\/code><\/p>\n<ul><li>가능한 전조건: <code>{b &gt; 10}<\/code> (맞지만 너무 강함)<\/li><li>최약 전조건: <code>{b &gt; 0}<\/code><\/li><\/ul>\n<p>표기: <code>wp(문장, 후조건) = 전조건<\/code><\/p>\n<p><b>증명 과정<\/b>: 프로그램 전체의 후조건(원하는 결과)에서 시작해 <b>거꾸로<\/b> 첫 문장까지 전조건을 계산. 그 결과가 프로그램 명세(입력 조건)와 같으면(또는 명세가 그것을 함의하면) 프로그램은 정확하다.<\/p><\/section>\n<section class=\"sec\" id=\"s-wp-assign\"><h3>배정문 공리<\/h3><p><code>x = E<\/code> 의 후조건이 Q일 때:<br><b>전조건 P = Q에서 x를 모두 E로 치환한 것<\/b> (<code>P = Q_{x→E}<\/code>)<\/p>\n<p>푸는 법은 딱 하나야: <b>후조건의 변수를 우변 식으로 바꿔 끼우고, 부등식을 정리.<\/b><\/p>\n<p>예 1) <code>a = b / 2 - 1 {a &lt; 10}<\/code><\/p>\n<pre class=\"code\">b / 2 - 1 &lt; 10  →  b / 2 &lt; 11  →  b &lt; 22\nwp = {b &lt; 22}<\/pre>\n<p>예 2) <code>x = x + y - 3 {x &gt; 10}<\/code><\/p>\n<pre class=\"code\">x + y - 3 &gt; 10  →  x + y &gt; 13\nwp = {x + y &gt; 13}     ← 우변에 x 자신이 있어도 그냥 치환하면 됨<\/pre>\n<p>예 3) <code>sum = 2 * x + 1 {sum &gt; 1}<\/code><\/p>\n<pre class=\"code\">2x + 1 &gt; 1  →  2x &gt; 0  →  x &gt; 0<\/pre>\n<div class=\"callout trap\">실수 주의: (1) 치환은 후조건의 변수 <b>전부<\/b>에. (2) 괄호 분배 <code>2 * (b - 1)<\/code> = <code>2b - 2<\/code>. (3) 음수로 나누면 부등호 방향이 뒤집힘. 예) <code>-2x &gt; 4<\/code> → <code>x &lt; -2<\/code>.<\/div><\/section>\n<section class=\"sec\" id=\"s-wp-theorem\"><h3>정리(theorem)로서의 배정문<\/h3><p>전조건과 후조건이 <b>둘 다 주어진<\/b> 배정문은 하나의 논리 문장(정리)이다.<br>배정 공리를 후조건에 적용해서 <b>주어진 전조건이 나오면<\/b> 증명 끝.<\/p>\n<p>예) <code>{x &gt; 3} x = x - 3 {x &gt; 0}<\/code><\/p>\n<pre class=\"code\">wp = (x - 3 &gt; 0) = {x &gt; 3}  → 주어진 전조건과 같음 → 참(증명됨)<\/pre>\n<p>예) <code>{x &gt; 5} x = x - 3 {x &gt; 0}<\/code> : wp는 <code>{x &gt; 3}<\/code>라서 배정 공리만으로는 안 나온다 → <b>결과 규칙<\/b>이 필요 (다음 레슨).<\/p><\/section>"}, {"id": "L3-4", "title": "결과 규칙 · 시퀀스 · 선택문", "src": "03-02 p.27–31", "secs": [{"id": "consequence", "title": "추론 규칙과 결과 규칙"}, {"id": "wp-seq", "title": "시퀀스의 최약 전조건"}, {"id": "wp-select", "title": "선택문의 최약 전조건"}], "md": "## 추론 규칙과 결과 규칙 {#consequence}\n\n**추론 규칙** (inference rule): 다른 단언들의 참을 근거로 한 단언의 참을 추론.\n```\nS1, S2, …, Sn      (위: 전제들)\n─────────────\n      S            (아래: 결론)\n```\n\n**결과 규칙** (rule of consequence):\n```\n{P} S {Q},   P' ⇒ P,   Q ⇒ Q'\n──────────────────────────────\n         {P'} S {Q'}\n```\n뜻: 전조건은 **더 강하게**(P'⇒P), 후조건은 **더 약하게**(Q⇒Q') 바꿔도 여전히 성립.\n\n예) `{x > 5} x = x - 3 {x > 0}` 증명:\n```\n{x > 3} x = x - 3 {x > 0}   (배정 공리)\n(x > 5) ⇒ (x > 3)           (참)\n────────────────────────────\n{x > 5} x = x - 3 {x > 0}\n```\n\n## 시퀀스의 최약 전조건 {#wp-seq}\n\n```\n{P1} S1 {P2},  {P2} S2 {P3}\n────────────────────────────\n     {P1} S1; S2 {P3}\n```\n**푸는 법: 마지막 문장부터 거꾸로.** S2의 wp를 구하고, 그걸 S1의 후조건으로 써서 S1의 wp를 구한다.\n\n예) `y = 3 * x + 1; x = y + 3; {x < 10}`\n```\n1) x = y + 3 {x < 10}       → y + 3 < 10  → {y < 7}\n2) y = 3 * x + 1 {y < 7}    → 3x + 1 < 7  → 3x < 6 → {x < 2}\nwp = {x < 2}\n```\n\n> 실수 주의: **위에서부터 풀면 틀린다.** 항상 맨 아래 후조건 → 마지막 문장 → … → 첫 문장.\n\n## 선택문의 최약 전조건 {#wp-select}\n\n```\n{B and P} S1 {Q},   {(not B) and P} S2 {Q}\n──────────────────────────────────────────\n      {P} if B then S1 else S2 {Q}\n```\n**푸는 법**:\n1. then 쪽: `wp(S1, Q)` 구하기\n2. else 쪽: `wp(S2, Q)` 구하기\n3. 두 전조건을 합친다.\n\n예) `if x > 0 then y = y - 1 else y = y + 1 {y > 0}`\n```\nthen: y - 1 > 0 → {y > 1}\nelse: y + 1 > 0 → {y > -1}\n```\n합치는 방법 두 가지 — 둘 다 알아둬:\n- **교재(Sebesta)/교안 방식**: 두 전조건 모두를 만족시키는 하나를 고른다. `y > 1 ⇒ y > -1` 이므로 **`{y > 1}`**. (결과 규칙으로 else 쪽 전조건을 강화)\n- **정밀한 최약 전조건**: `{(x > 0 and y > 1) or (x <= 0 and y > -1)}`\n\n> 시험 답안: 교재 방식 `{y > 1}`를 결론으로 쓰고, then/else 각각의 계산 과정을 꼭 보여. 24 중간 12번(5점)이 이 유형. a == b 같은 조건이 있으면 그 조건을 대입해 정리할 수도 있다는 걸 기억 (예: B가 `a == b`면 then 쪽에서 b를 a로 볼 수 있음).", "html": "<section class=\"sec\" id=\"s-consequence\"><h3>추론 규칙과 결과 규칙<\/h3><p><b>추론 규칙<\/b> (inference rule): 다른 단언들의 참을 근거로 한 단언의 참을 추론.<\/p>\n<pre class=\"code\">S1, S2, …, Sn      (위: 전제들)\n─────────────\n      S            (아래: 결론)<\/pre>\n<p><b>결과 규칙<\/b> (rule of consequence):<\/p>\n<pre class=\"code\">{P} S {Q},   P&#x27; ⇒ P,   Q ⇒ Q&#x27;\n──────────────────────────────\n         {P&#x27;} S {Q&#x27;}<\/pre>\n<p>뜻: 전조건은 <b>더 강하게<\/b>(P'⇒P), 후조건은 <b>더 약하게<\/b>(Q⇒Q') 바꿔도 여전히 성립.<\/p>\n<p>예) <code>{x &gt; 5} x = x - 3 {x &gt; 0}<\/code> 증명:<\/p>\n<pre class=\"code\">{x &gt; 3} x = x - 3 {x &gt; 0}   (배정 공리)\n(x &gt; 5) ⇒ (x &gt; 3)           (참)\n────────────────────────────\n{x &gt; 5} x = x - 3 {x &gt; 0}<\/pre><\/section>\n<section class=\"sec\" id=\"s-wp-seq\"><h3>시퀀스의 최약 전조건<\/h3><pre class=\"code\">{P1} S1 {P2},  {P2} S2 {P3}\n────────────────────────────\n     {P1} S1; S2 {P3}<\/pre>\n<p><b>푸는 법: 마지막 문장부터 거꾸로.<\/b> S2의 wp를 구하고, 그걸 S1의 후조건으로 써서 S1의 wp를 구한다.<\/p>\n<p>예) <code>y = 3 * x + 1; x = y + 3; {x &lt; 10}<\/code><\/p>\n<pre class=\"code\">1) x = y + 3 {x &lt; 10}       → y + 3 &lt; 10  → {y &lt; 7}\n2) y = 3 * x + 1 {y &lt; 7}    → 3x + 1 &lt; 7  → 3x &lt; 6 → {x &lt; 2}\nwp = {x &lt; 2}<\/pre>\n<div class=\"callout trap\">실수 주의: <b>위에서부터 풀면 틀린다.<\/b> 항상 맨 아래 후조건 → 마지막 문장 → … → 첫 문장.<\/div><\/section>\n<section class=\"sec\" id=\"s-wp-select\"><h3>선택문의 최약 전조건<\/h3><pre class=\"code\">{B and P} S1 {Q},   {(not B) and P} S2 {Q}\n──────────────────────────────────────────\n      {P} if B then S1 else S2 {Q}<\/pre>\n<p><b>푸는 법<\/b>:<\/p>\n<ol><li>then 쪽: <code>wp(S1, Q)<\/code> 구하기<\/li><li>else 쪽: <code>wp(S2, Q)<\/code> 구하기<\/li><li>두 전조건을 합친다.<\/li><\/ol>\n<p>예) <code>if x &gt; 0 then y = y - 1 else y = y + 1 {y &gt; 0}<\/code><\/p>\n<pre class=\"code\">then: y - 1 &gt; 0 → {y &gt; 1}\nelse: y + 1 &gt; 0 → {y &gt; -1}<\/pre>\n<p>합치는 방법 두 가지 — 둘 다 알아둬:<\/p>\n<ul><li><b>교재(Sebesta)/교안 방식<\/b>: 두 전조건 모두를 만족시키는 하나를 고른다. <code>y &gt; 1 ⇒ y &gt; -1<\/code> 이므로 <b><code>{y &gt; 1}<\/code><\/b>. (결과 규칙으로 else 쪽 전조건을 강화)<\/li><li><b>정밀한 최약 전조건<\/b>: <code>{(x &gt; 0 and y &gt; 1) or (x &lt;= 0 and y &gt; -1)}<\/code><\/li><\/ul>\n<div class=\"callout exam\">시험 답안: 교재 방식 <code>{y &gt; 1}<\/code>를 결론으로 쓰고, then/else 각각의 계산 과정을 꼭 보여. 24 중간 12번(5점)이 이 유형. a == b 같은 조건이 있으면 그 조건을 대입해 정리할 수도 있다는 걸 기억 (예: B가 <code>a == b<\/code>면 then 쪽에서 b를 a로 볼 수 있음).<\/div><\/section>"}, {"id": "L3-5", "title": "루프 불변자 · 정확성 증명", "src": "03-02 p.32–36", "secs": [{"id": "loop-rule", "title": "논리 사전검사 루프의 추론 규칙"}, {"id": "invariant", "title": "루프 불변자 찾기"}, {"id": "loop-proof", "title": "정확성 증명 답안 형식"}, {"id": "axiomatic-eval", "title": "공리 의미론 평가"}], "md": "## 논리 사전검사 루프의 추론 규칙 {#loop-rule}\n\n```\n     {I and B} S {I}\n──────────────────────────────────\n{I} while B do S end {I and (not B)}\n```\n**I = 루프 불변자** (loop invariant). 귀납 가설 역할.\n\n`{P} while B do S end {Q}` 를 증명하려면 I가 다음 4가지를 만족해야 함:\n\n1. **P ⇒ I** : 루프 시작 전에 I가 참\n2. **{I and B} S {I}** : 몸체를 한 번 실행해도 I가 유지됨\n3. **(I and (not B)) ⇒ Q** : 루프가 끝났을 때(B 거짓) I가 참이면 Q가 함의됨\n4. **루프가 종료함** : 증명이 어려울 수 있음\n\n- 1~3만 증명 = **부분 정확성** (partial correctness)\n- 4(종료)까지 증명 = **전체 정확성** (total correctness)\n\n## 루프 불변자 찾기 {#invariant}\n\n- 불변자 I는 루프 **후조건의 약화된 버전**이면서 **전조건**이기도 하다.\n- 루프 시작 전에 만족될 만큼 **약해야** 하고, 종료 조건(not B)과 합쳐졌을 때 후조건을 강제할 만큼 **강해야** 한다.\n\n예) `while y <> x do y = y + 1 end {y = x}`\n반복 횟수 0, 1, 2…에 대해 wp를 구해 보면:\n```\n0회: {y = x}\n1회: {y = x - 1}\n2회: {y = x - 2}\n…\n→ 패턴: {y <= x}  ← 이게 불변자 I이자 전조건 P\n```\n확인: `I and not B` = `y <= x and y = x` ⇒ `y = x` ✓\n\n## 정확성 증명 답안 형식 {#loop-proof}\n\n예) 팩토리얼\n```\n{n >= 0}\ncount = n;\nfact = 1;\nwhile count <> 0 do\n    fact = fact * count;\n    count = count - 1;\nend\n{fact = n!}\n```\n불변자: `I = (fact = (count+1) * (count+2) * … * n) and (count >= 0)`\n(count = n일 때 빈 곱 = 1)\n\n1. **P ⇒ I**: 루프 직전 count = n, fact = 1. 빈 곱 = 1이므로 I 성립, count = n ≥ 0 ✓\n2. **{I and B} S {I}**: count ≠ 0인 상태에서 `fact = fact * count` 하면 fact = count * (count+1) * … * n, 그 다음 `count = count - 1` 하면 fact = (count+1) * … * n 이 다시 성립. count ≥ 1 이었으므로 count ≥ 0 유지 ✓\n3. **(I and not B) ⇒ Q**: count = 0이면 fact = 1 * 2 * … * n = n! ✓\n4. **종료**: count는 n ≥ 0에서 시작해 매번 1씩 감소 → 언젠가 0 → 종료 ✓\n\n> 시험 포인트: 24 중간 19번(10점)이 합(sum) 버전이었어. 답안 = ① 불변자 제시 ② 위 4가지를 하나씩 확인. 구조만 지키면 부분 점수가 크게 나온다.\n\n## 공리 의미론 평가 {#axiomatic-eval}\n\n- 언어의 모든 문장에 대해 공리·추론 규칙을 만드는 것은 **어렵다**.\n- **정확성 증명**에는 좋은 도구, 프로그램 추론에 훌륭한 틀.\n- 하지만 언어 사용자와 컴파일러 작성자에게는 그다지 유용하지 않음.", "html": "<section class=\"sec\" id=\"s-loop-rule\"><h3>논리 사전검사 루프의 추론 규칙<\/h3><pre class=\"code\">     {I and B} S {I}\n──────────────────────────────────\n{I} while B do S end {I and (not B)}<\/pre>\n<p><b>I = 루프 불변자<\/b> (loop invariant). 귀납 가설 역할.<\/p>\n<p><code>{P} while B do S end {Q}<\/code> 를 증명하려면 I가 다음 4가지를 만족해야 함:<\/p>\n<ol><li><b>P ⇒ I<\/b> : 루프 시작 전에 I가 참<\/li><li><b>{I and B} S {I}<\/b> : 몸체를 한 번 실행해도 I가 유지됨<\/li><li><b>(I and (not B)) ⇒ Q<\/b> : 루프가 끝났을 때(B 거짓) I가 참이면 Q가 함의됨<\/li><li><b>루프가 종료함<\/b> : 증명이 어려울 수 있음<\/li><\/ol>\n<ul><li>1~3만 증명 = <b>부분 정확성<\/b> (partial correctness)<\/li><li>4(종료)까지 증명 = <b>전체 정확성<\/b> (total correctness)<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-invariant\"><h3>루프 불변자 찾기<\/h3><ul><li>불변자 I는 루프 <b>후조건의 약화된 버전<\/b>이면서 <b>전조건<\/b>이기도 하다.<\/li><li>루프 시작 전에 만족될 만큼 <b>약해야<\/b> 하고, 종료 조건(not B)과 합쳐졌을 때 후조건을 강제할 만큼 <b>강해야<\/b> 한다.<\/li><\/ul>\n<p>예) <code>while y &lt;&gt; x do y = y + 1 end {y = x}<\/code><br>반복 횟수 0, 1, 2…에 대해 wp를 구해 보면:<\/p>\n<pre class=\"code\">0회: {y = x}\n1회: {y = x - 1}\n2회: {y = x - 2}\n…\n→ 패턴: {y &lt;= x}  ← 이게 불변자 I이자 전조건 P<\/pre>\n<p>확인: <code>I and not B<\/code> = <code>y &lt;= x and y = x<\/code> ⇒ <code>y = x<\/code> ✓<\/p><\/section>\n<section class=\"sec\" id=\"s-loop-proof\"><h3>정확성 증명 답안 형식<\/h3><p>예) 팩토리얼<\/p>\n<pre class=\"code\">{n &gt;= 0}\ncount = n;\nfact = 1;\nwhile count &lt;&gt; 0 do\n    fact = fact * count;\n    count = count - 1;\nend\n{fact = n!}<\/pre>\n<p>불변자: <code>I = (fact = (count+1) * (count+2) * … * n) and (count &gt;= 0)<\/code><br>(count = n일 때 빈 곱 = 1)<\/p>\n<ol><li><b>P ⇒ I<\/b>: 루프 직전 count = n, fact = 1. 빈 곱 = 1이므로 I 성립, count = n ≥ 0 ✓<\/li><li><b>{I and B} S {I}<\/b>: count ≠ 0인 상태에서 <code>fact = fact * count<\/code> 하면 fact = count * (count+1) * … * n, 그 다음 <code>count = count - 1<\/code> 하면 fact = (count+1) * … * n 이 다시 성립. count ≥ 1 이었으므로 count ≥ 0 유지 ✓<\/li><li><b>(I and not B) ⇒ Q<\/b>: count = 0이면 fact = 1 * 2 * … * n = n! ✓<\/li><li><b>종료<\/b>: count는 n ≥ 0에서 시작해 매번 1씩 감소 → 언젠가 0 → 종료 ✓<\/li><\/ol>\n<div class=\"callout exam\">시험 포인트: 24 중간 19번(10점)이 합(sum) 버전이었어. 답안 = ① 불변자 제시 ② 위 4가지를 하나씩 확인. 구조만 지키면 부분 점수가 크게 나온다.<\/div><\/section>\n<section class=\"sec\" id=\"s-axiomatic-eval\"><h3>공리 의미론 평가<\/h3><ul><li>언어의 모든 문장에 대해 공리·추론 규칙을 만드는 것은 <b>어렵다<\/b>.<\/li><li><b>정확성 증명<\/b>에는 좋은 도구, 프로그램 추론에 훌륭한 틀.<\/li><li>하지만 언어 사용자와 컴파일러 작성자에게는 그다지 유용하지 않음.<\/li><\/ul><\/section>"}]}, {"id": "U4", "title": "Ch.4 어휘 분석", "src": "L04 Lexical and Syntax Analysis.pdf (p.1–31) · 04_code.pptx", "intro": "어휘 분석기 = 패턴 매처. front.c가 (sum + 47) / total을 어떻게 토큰으로 자르는지 손으로 따라갈 수 있으면 끝.", "lessons": [{"id": "L4-1", "title": "구문 분석의 두 부분 · 분리하는 이유", "src": "L04 p.3–7", "secs": [{"id": "sa-bnf", "title": "BNF 기반 구문 분석"}, {"id": "lex-vs-parser", "title": "어휘 분석기 vs 구문 분석기"}, {"id": "separate-why", "title": "어휘 분석과 구문 분석을 분리하는 이유"}], "md": "## BNF 기반 구문 분석 {#sa-bnf}\n\n언어 구현 시스템은 구현 방식(컴파일/해석/혼합)과 상관없이 **원시 코드를 분석**해야 하고, 거의 모든 구문 분석은 **BNF**에 기반한다.\n\nBNF로 구문을 기술하는 장점:\n- 명확하고 간결한 구문 기술\n- 파서를 BNF에 **직접** 기반해서 만들 수 있음\n- BNF 기반 파서는 유지보수가 쉬움 (모듈성)\n\n## 어휘 분석기 vs 구문 분석기 {#lex-vs-parser}\n\n구문 분석 부분은 거의 항상 두 부분으로 나뉜다:\n\n| 부분 | 역할 | 수학적 모델 |\n|---|---|---|\n| **어휘 분석기** (lexical analyzer) | 저수준: 문자 → 어휘항목/토큰 | **유한 오토마타** (정규 문법 기반) |\n| **구문 분석기 = 파서** (syntax analyzer, parser) | 고수준: 토큰 → 파스 트리 | **푸시다운 오토마타** (CFG/BNF 기반) |\n\n> 짝 외우기: 어휘 = 정규 문법 = 유한 오토마타 / 구문 = 문맥 자유 문법 = 푸시다운 오토마타.\n\n## 어휘 분석과 구문 분석을 분리하는 이유 {#separate-why}\n\n1. **단순성** (Simplicity): 어휘 분석엔 덜 복잡한 기법으로 충분. 분리하면 파서가 단순해진다(공백·주석 같은 세부를 파서가 신경 안 씀).\n2. **효율성** (Efficiency): 어휘 분석이 컴파일 시간의 큰 부분이라, 분리하면 어휘 분석기만 따로 **최적화**할 수 있다.\n3. **이식성** (Portability): 어휘 분석기는 입력 파일·버퍼링 등을 다뤄서 플랫폼 의존적일 수 있지만, **파서는 항상 이식 가능**.\n\n> 시험 대비: \"분리 이유 3가지\" = 단순성·효율성·이식성. 각 한 줄.", "html": "<section class=\"sec\" id=\"s-sa-bnf\"><h3>BNF 기반 구문 분석<\/h3><p>언어 구현 시스템은 구현 방식(컴파일/해석/혼합)과 상관없이 <b>원시 코드를 분석<\/b>해야 하고, 거의 모든 구문 분석은 <b>BNF<\/b>에 기반한다.<\/p>\n<p>BNF로 구문을 기술하는 장점:<\/p>\n<ul><li>명확하고 간결한 구문 기술<\/li><li>파서를 BNF에 <b>직접<\/b> 기반해서 만들 수 있음<\/li><li>BNF 기반 파서는 유지보수가 쉬움 (모듈성)<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-lex-vs-parser\"><h3>어휘 분석기 vs 구문 분석기<\/h3><p>구문 분석 부분은 거의 항상 두 부분으로 나뉜다:<\/p>\n<div class=\"tblw\"><table><thead><tr><th>부분<\/th><th>역할<\/th><th>수학적 모델<\/th><\/tr><\/thead><tbody><tr><td><b>어휘 분석기<\/b> (lexical analyzer)<\/td><td>저수준: 문자 → 어휘항목/토큰<\/td><td><b>유한 오토마타<\/b> (정규 문법 기반)<\/td><\/tr><tr><td><b>구문 분석기 = 파서<\/b> (syntax analyzer, parser)<\/td><td>고수준: 토큰 → 파스 트리<\/td><td><b>푸시다운 오토마타<\/b> (CFG/BNF 기반)<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout\">짝 외우기: 어휘 = 정규 문법 = 유한 오토마타 / 구문 = 문맥 자유 문법 = 푸시다운 오토마타.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>예전 컴파일러는 어휘 분석 결과를 토큰 파일로 출력하고 파서가 그 파일을 읽었다. 요즘은 파서가 토큰이 필요할 때 어휘 분석기 함수(lex)를 호출해서 하나씩 받아간다. 어휘 분석의 정규 문법 = 정규 표현식.<\/div><\/section>\n<section class=\"sec\" id=\"s-separate-why\"><h3>어휘 분석과 구문 분석을 분리하는 이유<\/h3><ol><li><b>단순성<\/b> (Simplicity): 어휘 분석엔 덜 복잡한 기법으로 충분. 분리하면 파서가 단순해진다(공백·주석 같은 세부를 파서가 신경 안 씀).<\/li><li><b>효율성<\/b> (Efficiency): 어휘 분석이 컴파일 시간의 큰 부분이라, 분리하면 어휘 분석기만 따로 <b>최적화<\/b>할 수 있다.<\/li><li><b>이식성<\/b> (Portability): 어휘 분석기는 입력 파일·버퍼링 등을 다뤄서 플랫폼 의존적일 수 있지만, <b>파서는 항상 이식 가능<\/b>.<\/li><\/ol>\n<div class=\"callout exam\">시험 대비: \"분리 이유 3가지\" = 단순성·효율성·이식성. 각 한 줄.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>이식성 설명: 어휘 분석기는 파일 입출력·버퍼를 다뤄서 플랫폼에 의존적이다. 둘을 나눠두면 플랫폼이 바뀌어도 어휘 분석기만 고치면 되고 파서는 그대로 쓸 수 있다.<\/div><\/section>"}, {"id": "L4-2", "title": "어휘 분석기 · 상태 다이어그램", "src": "L04 p.8–16", "secs": [{"id": "lexer-role", "title": "어휘 분석기의 역할"}, {"id": "lexer-build", "title": "어휘 분석기를 만드는 3가지 방법"}, {"id": "state-diagram", "title": "상태 다이어그램 단순화"}, {"id": "lexer-utils", "title": "유틸리티 부프로그램"}], "md": "## 어휘 분석기의 역할 {#lexer-role}\n\n- 문자열에 대한 **패턴 매처** (pattern matcher)\n- 파서의 **전단부** (front-end)\n- 원시 프로그램에서 같이 묶이는 부분 문자열(**어휘항목**)을 찾아내고, 그 어휘항목이 매칭된 패턴의 범주(**토큰**)를 정한다. 예) `sum`은 lexeme, 토큰은 `IDENT`.\n- 보통 **파서가 다음 토큰이 필요할 때 호출하는 함수**로 구현된다.\n- 부가 역할: 주석·공백 건너뛰기, 사용자 정의 이름을 심볼 테이블에 넣기, 어휘 오류 탐지.\n\n`result = oldsum - value / 100;` →\n\n| 토큰 | 어휘항목 |\n|---|---|\n| IDENT | result |\n| ASSIGN_OP | = |\n| IDENT | oldsum |\n| SUB_OP | - |\n| IDENT | value |\n| DIV_OP | / |\n| INT_LIT | 100 |\n| SEMICOLON | ; |\n\n## 어휘 분석기를 만드는 3가지 방법 {#lexer-build}\n\n1. 토큰을 **형식적으로 기술**(정규식)하고, 이 기술로부터 **표 기반** 어휘 분석기를 만들어주는 **SW 도구**를 사용 (예: lex)\n2. 토큰을 기술하는 **상태 다이어그램**을 설계하고, 그 다이어그램을 **구현하는 프로그램**을 작성\n3. 상태 다이어그램을 설계하고, 그것의 **표 기반 구현을 손으로** 작성\n\n## 상태 다이어그램 단순화 {#state-diagram}\n\n순진하게 그리면 모든 상태에서 모든 문자에 대한 전이가 있어야 해서 **너무 크다**. 단순화 방법:\n\n- **문자 클래스**: 식별자 인식 중엔 대소문자 모든 글자가 동등 → `LETTER` 클래스 하나로. 정수 리터럴은 모든 숫자가 동등 → `DIGIT` 클래스.\n- **예약어와 식별자를 함께 인식**: 예약어마다 다이어그램을 따로 그리지 않고, 식별자처럼 인식한 다음 **테이블 탐색(lookup)** 으로 예약어인지 판별.\n\n## 유틸리티 부프로그램 {#lexer-utils}\n\n| 함수 | 하는 일 |\n|---|---|\n| `getChar` | 입력의 다음 문자를 `nextChar`에 넣고, 그 문자의 클래스를 판단해 `charClass`에 넣음 |\n| `addChar` | `nextChar`의 문자를 어휘항목을 모으는 곳(`lexeme`)에 추가 |\n| `lookup` | `lexeme`(또는 문자)가 예약어/연산자인지 판단해 토큰 코드를 돌려줌 |\n| `getNonBlank` | 공백이 아닌 문자가 나올 때까지 `getChar` 호출 |\n\n> 함정: 클래스를 정하는 건 `getChar`, 문자를 이어붙이는 건 `addChar`.", "html": "<section class=\"sec\" id=\"s-lexer-role\"><h3>어휘 분석기의 역할<\/h3><ul><li>문자열에 대한 <b>패턴 매처<\/b> (pattern matcher)<\/li><li>파서의 <b>전단부<\/b> (front-end)<\/li><li>원시 프로그램에서 같이 묶이는 부분 문자열(<b>어휘항목<\/b>)을 찾아내고, 그 어휘항목이 매칭된 패턴의 범주(<b>토큰<\/b>)를 정한다. 예) <code>sum<\/code>은 lexeme, 토큰은 <code>IDENT<\/code>.<\/li><li>보통 <b>파서가 다음 토큰이 필요할 때 호출하는 함수<\/b>로 구현된다.<\/li><li>부가 역할: 주석·공백 건너뛰기, 사용자 정의 이름을 심볼 테이블에 넣기, 어휘 오류 탐지.<\/li><\/ul>\n<p><code>result = oldsum - value / 100;<\/code> →<\/p>\n<div class=\"tblw\"><table><thead><tr><th>토큰<\/th><th>어휘항목<\/th><\/tr><\/thead><tbody><tr><td>IDENT<\/td><td>result<\/td><\/tr><tr><td>ASSIGN_OP<\/td><td>=<\/td><\/tr><tr><td>IDENT<\/td><td>oldsum<\/td><\/tr><tr><td>SUB_OP<\/td><td>-<\/td><\/tr><tr><td>IDENT<\/td><td>value<\/td><\/tr><tr><td>DIV_OP<\/td><td>/<\/td><\/tr><tr><td>INT_LIT<\/td><td>100<\/td><\/tr><tr><td>SEMICOLON<\/td><td>;<\/td><\/tr><\/tbody><\/table><\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>공백으로 어휘항목을 쪼개면 안 된다. 실제 코드에선 a+b 처럼 공백 없이도 쓰기 때문. 패턴(첫 글자가 숫자면 식별자가 될 수 없음 등)으로 판단해야 한다.<\/div><\/section>\n<section class=\"sec\" id=\"s-lexer-build\"><h3>어휘 분석기를 만드는 3가지 방법<\/h3><ol><li>토큰을 <b>형식적으로 기술<\/b>(정규식)하고, 이 기술로부터 <b>표 기반<\/b> 어휘 분석기를 만들어주는 <b>SW 도구<\/b>를 사용 (예: lex)<\/li><li>토큰을 기술하는 <b>상태 다이어그램<\/b>을 설계하고, 그 다이어그램을 <b>구현하는 프로그램<\/b>을 작성<\/li><li>상태 다이어그램을 설계하고, 그것의 <b>표 기반 구현을 손으로<\/b> 작성<\/li><\/ol><\/section>\n<section class=\"sec\" id=\"s-state-diagram\"><h3>상태 다이어그램 단순화<\/h3><p>순진하게 그리면 모든 상태에서 모든 문자에 대한 전이가 있어야 해서 <b>너무 크다<\/b>. 단순화 방법:<\/p>\n<ul><li><b>문자 클래스<\/b>: 식별자 인식 중엔 대소문자 모든 글자가 동등 → <code>LETTER<\/code> 클래스 하나로. 정수 리터럴은 모든 숫자가 동등 → <code>DIGIT<\/code> 클래스.<\/li><li><b>예약어와 식별자를 함께 인식<\/b>: 예약어마다 다이어그램을 따로 그리지 않고, 식별자처럼 인식한 다음 <b>테이블 탐색(lookup)<\/b> 으로 예약어인지 판별.<\/li><\/ul><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>예약어용 다이어그램을 따로 만들 필요 없이, 식별자로 인식한 뒤 예약어 테이블을 lookup해서 있으면 예약어, 없으면 식별자. 이중 원은 종료(final) 상태.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L04-p16.jpg\" aria-label=\"크게 보기\"><img src=\"img/L04-p16.jpg\" alt=\"L04 p.16 · 식별자·정수 리터럴을 인식하는 상태 다이어그램\" loading=\"lazy\"><\/button><figcaption>L04 p.16 · 식별자·정수 리터럴을 인식하는 상태 다이어그램<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-lexer-utils\"><h3>유틸리티 부프로그램<\/h3><div class=\"tblw\"><table><thead><tr><th>함수<\/th><th>하는 일<\/th><\/tr><\/thead><tbody><tr><td><code>getChar<\/code><\/td><td>입력의 다음 문자를 <code>nextChar<\/code>에 넣고, 그 문자의 클래스를 판단해 <code>charClass<\/code>에 넣음<\/td><\/tr><tr><td><code>addChar<\/code><\/td><td><code>nextChar<\/code>의 문자를 어휘항목을 모으는 곳(<code>lexeme<\/code>)에 추가<\/td><\/tr><tr><td><code>lookup<\/code><\/td><td><code>lexeme<\/code>(또는 문자)가 예약어/연산자인지 판단해 토큰 코드를 돌려줌<\/td><\/tr><tr><td><code>getNonBlank<\/code><\/td><td>공백이 아닌 문자가 나올 때까지 <code>getChar<\/code> 호출<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout trap\">함정: 클래스를 정하는 건 <code>getChar<\/code>, 문자를 이어붙이는 건 <code>addChar<\/code>.<\/div><\/section>"}, {"id": "L4-3", "title": "front.c 따라가기", "src": "L04 p.17–31 · 04_code.pptx", "secs": [{"id": "front-codes", "title": "front.c의 토큰 코드"}, {"id": "front-trace", "title": "(sum + 47) / total 추적"}], "md": "## front.c의 토큰 코드 {#front-codes}\n\n```\n#define LETTER 0        #define INT_LIT 10       #define ADD_OP 21\n#define DIGIT 1         #define IDENT 11         #define SUB_OP 22\n#define UNKNOWN 99      #define ASSIGN_OP 20     #define MULT_OP 23\n                                                 #define DIV_OP 24\n                                                 #define LEFT_PAREN 25\n                                                 #define RIGHT_PAREN 26\nEOF = -1\n```\n\n`lex()` 의 구조:\n```\nint lex() {\n    lexLen = 0;\n    getNonBlank();\n    switch (charClass) {\n        case LETTER:                 /* 식별자 */\n            addChar(); getChar();\n            while (charClass == LETTER || charClass == DIGIT) {\n                addChar(); getChar();\n            }\n            nextToken = IDENT; break;\n        case DIGIT:                  /* 정수 리터럴 */\n            addChar(); getChar();\n            while (charClass == DIGIT) { addChar(); getChar(); }\n            nextToken = INT_LIT; break;\n        case UNKNOWN:                /* 괄호와 연산자 */\n            lookup(nextChar); getChar(); break;\n        case EOF:\n            nextToken = EOF; lexeme = \"EOF\"; break;\n    }\n    printf(\"Next token is: %d, Next lexeme is %s\\n\", nextToken, lexeme);\n    return nextToken;\n}\n```\n\n## (sum + 47) / total 추적 {#front-trace}\n\n출력:\n```\nNext token is: 25 Next lexeme is (\nNext token is: 11 Next lexeme is sum\nNext token is: 21 Next lexeme is +\nNext token is: 10 Next lexeme is 47\nNext token is: 26 Next lexeme is )\nNext token is: 24 Next lexeme is /\nNext token is: 11 Next lexeme is total\nNext token is: -1 Next lexeme is EOF\n```\n\n첫 두 토큰을 변수 단위로 따라가면 (04_code.pptx):\n```\n[처음 getChar()]  nextChar='('  isalpha F, isdigit F → charClass=UNKNOWN\n[lex() #1] lexLen=0, getNonBlank()\n           switch(UNKNOWN) → lookup('(') → addChar(): lexeme=\"(\" , nextToken=LEFT_PAREN(25)\n           getChar(): nextChar='s' → charClass=LETTER\n           printf → \"25 (\", \n[lex() #2] lexLen=0, getNonBlank()\n           switch(LETTER) → addChar(): lexeme=\"s\"; getChar(): nextChar='u' LETTER\n           while: addChar() \"su\"; getChar() 'm' LETTER\n                  addChar() \"sum\"; getChar() ' ' → UNKNOWN → while 종료\n           nextToken=IDENT(11) → printf \"11 sum\"\n[lex() #3] getNonBlank(): ' '는 공백 → getChar() → nextChar='+' UNKNOWN\n           lookup('+') → ADD_OP(21) ...\n```\n\n> 포인트: `lex()`는 항상 **다음 문자를 하나 미리 읽어 둔 상태**(nextChar)로 끝난다. 그래서 식별자 끝을 알 수 있음(공백이나 연산자가 나오면 멈춤). 예약어 판별은 front.c에선 생략됨.", "html": "<section class=\"sec\" id=\"s-front-codes\"><h3>front.c의 토큰 코드<\/h3><pre class=\"code\">#define LETTER 0        #define INT_LIT 10       #define ADD_OP 21\n#define DIGIT 1         #define IDENT 11         #define SUB_OP 22\n#define UNKNOWN 99      #define ASSIGN_OP 20     #define MULT_OP 23\n                                                 #define DIV_OP 24\n                                                 #define LEFT_PAREN 25\n                                                 #define RIGHT_PAREN 26\nEOF = -1<\/pre>\n<p><code>lex()<\/code> 의 구조:<\/p>\n<pre class=\"code\">int lex() {\n    lexLen = 0;\n    getNonBlank();\n    switch (charClass) {\n        case LETTER:                 /* 식별자 */\n            addChar(); getChar();\n            while (charClass == LETTER || charClass == DIGIT) {\n                addChar(); getChar();\n            }\n            nextToken = IDENT; break;\n        case DIGIT:                  /* 정수 리터럴 */\n            addChar(); getChar();\n            while (charClass == DIGIT) { addChar(); getChar(); }\n            nextToken = INT_LIT; break;\n        case UNKNOWN:                /* 괄호와 연산자 */\n            lookup(nextChar); getChar(); break;\n        case EOF:\n            nextToken = EOF; lexeme = &quot;EOF&quot;; break;\n    }\n    printf(&quot;Next token is: %d, Next lexeme is %s\\n&quot;, nextToken, lexeme);\n    return nextToken;\n}<\/pre><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L04-p21.jpg\" aria-label=\"크게 보기\"><img src=\"img/L04-p21.jpg\" alt=\"L04 p.21 · front.c: addChar, getChar\" loading=\"lazy\"><\/button><figcaption>L04 p.21 · front.c: addChar, getChar<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L04-p22.jpg\" aria-label=\"크게 보기\"><img src=\"img/L04-p22.jpg\" alt=\"L04 p.22 · front.c: getNonBlank, lex\" loading=\"lazy\"><\/button><figcaption>L04 p.22 · front.c: getNonBlank, lex<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-front-trace\"><h3>(sum + 47) / total 추적<\/h3><p>출력:<\/p>\n<pre class=\"code\">Next token is: 25 Next lexeme is (\nNext token is: 11 Next lexeme is sum\nNext token is: 21 Next lexeme is +\nNext token is: 10 Next lexeme is 47\nNext token is: 26 Next lexeme is )\nNext token is: 24 Next lexeme is /\nNext token is: 11 Next lexeme is total\nNext token is: -1 Next lexeme is EOF<\/pre>\n<p>첫 두 토큰을 변수 단위로 따라가면 (04_code.pptx):<\/p>\n<pre class=\"code\">[처음 getChar()]  nextChar=&#x27;(&#x27;  isalpha F, isdigit F → charClass=UNKNOWN\n[lex() #1] lexLen=0, getNonBlank()\n           switch(UNKNOWN) → lookup(&#x27;(&#x27;) → addChar(): lexeme=&quot;(&quot; , nextToken=LEFT_PAREN(25)\n           getChar(): nextChar=&#x27;s&#x27; → charClass=LETTER\n           printf → &quot;25 (&quot;, \n[lex() #2] lexLen=0, getNonBlank()\n           switch(LETTER) → addChar(): lexeme=&quot;s&quot;; getChar(): nextChar=&#x27;u&#x27; LETTER\n           while: addChar() &quot;su&quot;; getChar() &#x27;m&#x27; LETTER\n                  addChar() &quot;sum&quot;; getChar() &#x27; &#x27; → UNKNOWN → while 종료\n           nextToken=IDENT(11) → printf &quot;11 sum&quot;\n[lex() #3] getNonBlank(): &#x27; &#x27;는 공백 → getChar() → nextChar=&#x27;+&#x27; UNKNOWN\n           lookup(&#x27;+&#x27;) → ADD_OP(21) ...<\/pre>\n<div class=\"callout\">포인트: <code>lex()<\/code>는 항상 <b>다음 문자를 하나 미리 읽어 둔 상태<\/b>(nextChar)로 끝난다. 그래서 식별자 끝을 알 수 있음(공백이나 연산자가 나오면 멈춤). 예약어 판별은 front.c에선 생략됨.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>과제 관련 공지: 과제는 C/C++로만. front.c처럼 입력 파일을 \"front.in\"으로 하드코딩하지 말고 main(int argc, char** argv)로 파일 이름을 받아서 처리할 것.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L04-p30.jpg\" aria-label=\"크게 보기\"><img src=\"img/L04-p30.jpg\" alt=\"L04 p.30 · (sum + 47) / total 첫 토큰 처리 중 변수 상태\" loading=\"lazy\"><\/button><figcaption>L04 p.30 · (sum + 47) / total 첫 토큰 처리 중 변수 상태<\/figcaption><\/figure><\/section>"}]}, {"id": "U5", "title": "Ch.4 파싱 문제 · 하향식 파싱", "src": "L04 p.32–62", "intro": "하향식 = 최좌단 유도 = 재귀 하강/LL. 시험 13번(집합쌍 공통 테스트)과 7번(하향식 vs 상향식)이 여기서 나와.", "lessons": [{"id": "L5-1", "title": "파싱 문제 · 하향식 vs 상향식", "src": "L04 p.32–42", "secs": [{"id": "parser-goals", "title": "파서의 목표"}, {"id": "topdown-bottomup", "title": "하향식 vs 상향식"}, {"id": "parse-complexity", "title": "파싱의 복잡도"}], "md": "## 파서의 목표 {#parser-goals}\n\n**파싱**: 토큰 열이 언어의 문법에 맞는지 분석하는 과정.\n파서의 두 목표:\n1. **모든 구문 오류를 찾는다.** 각각에 적절한 진단 메시지를 내고 빨리 **복구**한다.\n2. **파스 트리**(또는 최소한 파스 트리의 흔적)를 만든다.\n\n## 하향식 vs 상향식 {#topdown-bottomup}\n\n| | 하향식 (Top-down) | 상향식 (Bottom-up) |\n|---|---|---|\n| 트리 생성 | **루트**부터 잎 방향으로 | **잎**부터 루트 방향으로 |\n| 유도 순서 | **최좌단 유도** 순서 | **최우단 유도의 역순** |\n| 순회 | 전위 순회(preorder)로 추적/생성 | |\n| 결정할 것 | 문장 형태 `xAα`에서 **다음 토큰 하나만 보고** 올바른 A-규칙 선택 | 우문장 형태에서 **어떤 부분 문자열(핸들)을 LHS로 환원**할지 |\n| 대표 알고리즘 | **재귀 하강**(코드 구현), **LL** 파서(표 기반) | **LR** 계열 (shift-reduce) |\n\n> 시험 포인트: 24 중간 7번. \"하향식: 루트부터, 최좌단 유도 순서, 재귀하강/LL / 상향식: 잎부터, 최우단 유도의 역순, LR(shift-reduce)\" 이 정도면 만점.\n\n표기 관례 (Ch.4 전체에서 사용):\n- 단말: 알파벳 앞쪽 소문자 `a, b, …`\n- 비단말: 알파벳 앞쪽 대문자 `A, B, …`\n- 단말 또는 비단말: 뒤쪽 대문자 `W, X, Y, Z`\n- 단말 문자열: 뒤쪽 소문자 `w, x, y, z`\n- 혼합 문자열: 그리스 소문자 `α, β, γ, δ`\n\n예) 하향식: 문장 형태 `xAα`, 규칙 `A → bB | cBb | a`. 다음 토큰이 `c`면 `A → cBb` 선택.\n예) 상향식: `S → aAc`, `A → aA | b`. 입력 `aabc`에서 `b`를 A로 환원 → `aaAc` → `aA`를 A로 → `aAc` → S. 이건 `S ⇒ aAc ⇒ aaAc ⇒ aabc` (최우단 유도)를 거꾸로 한 것.\n\n## 파싱의 복잡도 {#parse-complexity}\n\n- **모든** 모호하지 않은 문법에 작동하는 파서는 복잡하고 비효율적: **O(n³)**.\n- 그래서 컴파일러는 모호하지 않은 문법의 **부분 집합**에서만 동작하지만 **선형 시간 O(n)** 에 끝나는 파서를 쓴다.", "html": "<section class=\"sec\" id=\"s-parser-goals\"><h3>파서의 목표<\/h3><p><b>파싱<\/b>: 토큰 열이 언어의 문법에 맞는지 분석하는 과정.<br>파서의 두 목표:<\/p>\n<ol><li><b>모든 구문 오류를 찾는다.<\/b> 각각에 적절한 진단 메시지를 내고 빨리 <b>복구<\/b>한다.<\/li><li><b>파스 트리<\/b>(또는 최소한 파스 트리의 흔적)를 만든다.<\/li><\/ol><\/section>\n<section class=\"sec\" id=\"s-topdown-bottomup\"><h3>하향식 vs 상향식<\/h3><div class=\"tblw\"><table><thead><tr><th><\/th><th>하향식 (Top-down)<\/th><th>상향식 (Bottom-up)<\/th><\/tr><\/thead><tbody><tr><td>트리 생성<\/td><td><b>루트<\/b>부터 잎 방향으로<\/td><td><b>잎<\/b>부터 루트 방향으로<\/td><\/tr><tr><td>유도 순서<\/td><td><b>최좌단 유도<\/b> 순서<\/td><td><b>최우단 유도의 역순<\/b><\/td><\/tr><tr><td>순회<\/td><td>전위 순회(preorder)로 추적/생성<\/td><td><\/td><\/tr><tr><td>결정할 것<\/td><td>문장 형태 <code>xAα<\/code>에서 <b>다음 토큰 하나만 보고<\/b> 올바른 A-규칙 선택<\/td><td>우문장 형태에서 <b>어떤 부분 문자열(핸들)을 LHS로 환원<\/b>할지<\/td><\/tr><tr><td>대표 알고리즘<\/td><td><b>재귀 하강<\/b>(코드 구현), <b>LL<\/b> 파서(표 기반)<\/td><td><b>LR<\/b> 계열 (shift-reduce)<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout exam\">시험 포인트: 24 중간 7번. \"하향식: 루트부터, 최좌단 유도 순서, 재귀하강/LL / 상향식: 잎부터, 최우단 유도의 역순, LR(shift-reduce)\" 이 정도면 만점.<\/div>\n<p>표기 관례 (Ch.4 전체에서 사용):<\/p>\n<ul><li>단말: 알파벳 앞쪽 소문자 <code>a, b, …<\/code><\/li><li>비단말: 알파벳 앞쪽 대문자 <code>A, B, …<\/code><\/li><li>단말 또는 비단말: 뒤쪽 대문자 <code>W, X, Y, Z<\/code><\/li><li>단말 문자열: 뒤쪽 소문자 <code>w, x, y, z<\/code><\/li><li>혼합 문자열: 그리스 소문자 <code>α, β, γ, δ<\/code><\/li><\/ul>\n<p>예) 하향식: 문장 형태 <code>xAα<\/code>, 규칙 <code>A → bB | cBb | a<\/code>. 다음 토큰이 <code>c<\/code>면 <code>A → cBb<\/code> 선택.<br>예) 상향식: <code>S → aAc<\/code>, <code>A → aA | b<\/code>. 입력 <code>aabc<\/code>에서 <code>b<\/code>를 A로 환원 → <code>aaAc<\/code> → <code>aA<\/code>를 A로 → <code>aAc<\/code> → S. 이건 <code>S ⇒ aAc ⇒ aaAc ⇒ aabc<\/code> (최우단 유도)를 거꾸로 한 것.<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1 · 05주-2<\/span><br>하향식은 루트에서 출발해 최좌단 유도 순서 = 전위 순회(root, left, right). 상향식은 입력에서 거꾸로 올라가므로 자연스럽게 최우단 유도의 역순이 된다.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L04-p34.jpg\" aria-label=\"크게 보기\"><img src=\"img/L04-p34.jpg\" alt=\"L04 p.34 · 트리 순회 복습 (하향식 파서는 전위 순회 순서)\" loading=\"lazy\"><\/button><figcaption>L04 p.34 · 트리 순회 복습 (하향식 파서는 전위 순회 순서)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-parse-complexity\"><h3>파싱의 복잡도<\/h3><ul><li><b>모든<\/b> 모호하지 않은 문법에 작동하는 파서는 복잡하고 비효율적: <b>O(n³)<\/b>.<\/li><li>그래서 컴파일러는 모호하지 않은 문법의 <b>부분 집합<\/b>에서만 동작하지만 <b>선형 시간 O(n)<\/b> 에 끝나는 파서를 쓴다.<\/li><\/ul><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>일반적인 파서는 주어진 토큰열에서 환원할 부분 문자열의 시작·끝 위치 후보가 너무 많아서 비효율적. 그래서 문법을 제한하고 선형 시간에 도는 파서를 쓴다.<\/div><\/section>"}, {"id": "L5-2", "title": "재귀 하강 파서", "src": "L04 p.43–55", "secs": [{"id": "rd-structure", "title": "재귀 하강 파서의 구조"}, {"id": "rd-coding", "title": "코딩 규칙"}, {"id": "rd-trace", "title": "(sum + 47) / total 추적"}], "md": "## 재귀 하강 파서의 구조 {#rd-structure}\n\n- 부프로그램들의 모음. 재귀적이고, **하향식** 순서로 파스 트리를 만든다.\n- 재귀는 프로그래밍 언어의 **중첩 구조**를 반영한 것.\n- **문법의 비단말 하나당 부프로그램 하나.** 그 부프로그램은 그 비단말이 생성할 수 있는 문장을 파싱.\n- **EBNF가 재귀 하강 파서의 기반으로 이상적**: EBNF는 비단말 수를 최소화하므로.\n\n```\n<expr>   → <term> {(+ | -) <term>}\n<term>   → <factor> {(* | /) <factor>}\n<factor> → id | int_constant | ( <expr> )\n```\n\n## 코딩 규칙 {#rd-coding}\n\n어휘 분석기 `lex`가 다음 토큰 코드를 `nextToken`에 넣는다고 가정.\n\nRHS가 하나일 때:\n- RHS의 **단말**: 다음 입력 토큰과 비교 → 같으면 계속(lex 호출), 다르면 오류\n- RHS의 **비단말**: 그 비단말의 파싱 부프로그램을 호출\n\n```\nvoid expr() {\n    printf(\"Enter <expr>\\n\");\n    term();\n    while (nextToken == ADD_OP || nextToken == SUB_OP) {\n        lex();\n        term();\n    }\n    printf(\"Exit <expr>\\n\");\n}\n```\n**관례**: 모든 파싱 루틴은 끝날 때 **다음 토큰을 nextToken에 남겨둔다.**\n\nRHS가 여러 개인 비단말(예: `<factor>`): 다음 토큰(**lookahead**)을 각 RHS가 생성할 수 있는 **첫 토큰**과 비교해서 고른다. 맞는 게 없으면 구문 오류.\n```\nvoid factor() {\n    printf(\"Enter <factor>\\n\");\n    if (nextToken == IDENT || nextToken == INT_LIT)\n        lex();\n    else if (nextToken == LEFT_PAREN) {\n        lex();\n        expr();\n        if (nextToken == RIGHT_PAREN) lex();\n        else error();\n    }\n    else error();\n    printf(\"Exit <factor>\\n\");\n}\n```\n\n## (sum + 47) / total 추적 {#rd-trace}\n\n```\nNext token is: 25 Next lexeme is (\nEnter <expr>\nEnter <term>\nEnter <factor>\nNext token is: 11 Next lexeme is sum\nEnter <expr>\nEnter <term>\nEnter <factor>\nNext token is: 21 Next lexeme is +\nExit <factor>\nExit <term>\nNext token is: 10 Next lexeme is 47\nEnter <term>\nEnter <factor>\nNext token is: 26 Next lexeme is )\nExit <factor>\nExit <term>\nExit <expr>\nNext token is: 24 Next lexeme is /\nExit <factor>\nNext token is: 11 Next lexeme is total\nEnter <factor>\nNext token is: -1 Next lexeme is EOF\nExit <factor>\nExit <term>\nExit <expr>\n```\n읽는 법: `(`를 본 factor가 `lex()` 후 `expr()`을 재귀 호출 → 괄호 안을 다 파싱 → `)` 확인 후 `lex()` → `/`가 남아 있으니 term의 while이 한 번 더 돌아 factor 호출(total).\n\n> 재귀 하강 파서는 **LL 파서**의 한 종류다 (Summary).", "html": "<section class=\"sec\" id=\"s-rd-structure\"><h3>재귀 하강 파서의 구조<\/h3><ul><li>부프로그램들의 모음. 재귀적이고, <b>하향식<\/b> 순서로 파스 트리를 만든다.<\/li><li>재귀는 프로그래밍 언어의 <b>중첩 구조<\/b>를 반영한 것.<\/li><li><b>문법의 비단말 하나당 부프로그램 하나.<\/b> 그 부프로그램은 그 비단말이 생성할 수 있는 문장을 파싱.<\/li><li><b>EBNF가 재귀 하강 파서의 기반으로 이상적<\/b>: EBNF는 비단말 수를 최소화하므로.<\/li><\/ul>\n<pre class=\"code\">&lt;expr&gt;   → &lt;term&gt; {(+ | -) &lt;term&gt;}\n&lt;term&gt;   → &lt;factor&gt; {(* | /) &lt;factor&gt;}\n&lt;factor&gt; → id | int_constant | ( &lt;expr&gt; )<\/pre><\/section>\n<section class=\"sec\" id=\"s-rd-coding\"><h3>코딩 규칙<\/h3><p>어휘 분석기 <code>lex<\/code>가 다음 토큰 코드를 <code>nextToken<\/code>에 넣는다고 가정.<\/p>\n<p>RHS가 하나일 때:<\/p>\n<ul><li>RHS의 <b>단말<\/b>: 다음 입력 토큰과 비교 → 같으면 계속(lex 호출), 다르면 오류<\/li><li>RHS의 <b>비단말<\/b>: 그 비단말의 파싱 부프로그램을 호출<\/li><\/ul>\n<pre class=\"code\">void expr() {\n    printf(&quot;Enter &lt;expr&gt;\\n&quot;);\n    term();\n    while (nextToken == ADD_OP || nextToken == SUB_OP) {\n        lex();\n        term();\n    }\n    printf(&quot;Exit &lt;expr&gt;\\n&quot;);\n}<\/pre>\n<p><b>관례<\/b>: 모든 파싱 루틴은 끝날 때 <b>다음 토큰을 nextToken에 남겨둔다.<\/b><\/p>\n<p>RHS가 여러 개인 비단말(예: <code>&lt;factor&gt;<\/code>): 다음 토큰(<b>lookahead<\/b>)을 각 RHS가 생성할 수 있는 <b>첫 토큰<\/b>과 비교해서 고른다. 맞는 게 없으면 구문 오류.<\/p>\n<pre class=\"code\">void factor() {\n    printf(&quot;Enter &lt;factor&gt;\\n&quot;);\n    if (nextToken == IDENT || nextToken == INT_LIT)\n        lex();\n    else if (nextToken == LEFT_PAREN) {\n        lex();\n        expr();\n        if (nextToken == RIGHT_PAREN) lex();\n        else error();\n    }\n    else error();\n    printf(&quot;Exit &lt;factor&gt;\\n&quot;);\n}<\/pre><\/section>\n<section class=\"sec\" id=\"s-rd-trace\"><h3>(sum + 47) / total 추적<\/h3><pre class=\"code\">Next token is: 25 Next lexeme is (\nEnter &lt;expr&gt;\nEnter &lt;term&gt;\nEnter &lt;factor&gt;\nNext token is: 11 Next lexeme is sum\nEnter &lt;expr&gt;\nEnter &lt;term&gt;\nEnter &lt;factor&gt;\nNext token is: 21 Next lexeme is +\nExit &lt;factor&gt;\nExit &lt;term&gt;\nNext token is: 10 Next lexeme is 47\nEnter &lt;term&gt;\nEnter &lt;factor&gt;\nNext token is: 26 Next lexeme is )\nExit &lt;factor&gt;\nExit &lt;term&gt;\nExit &lt;expr&gt;\nNext token is: 24 Next lexeme is /\nExit &lt;factor&gt;\nNext token is: 11 Next lexeme is total\nEnter &lt;factor&gt;\nNext token is: -1 Next lexeme is EOF\nExit &lt;factor&gt;\nExit &lt;term&gt;\nExit &lt;expr&gt;<\/pre>\n<p>읽는 법: <code>(<\/code>를 본 factor가 <code>lex()<\/code> 후 <code>expr()<\/code>을 재귀 호출 → 괄호 안을 다 파싱 → <code>)<\/code> 확인 후 <code>lex()<\/code> → <code>/<\/code>가 남아 있으니 term의 while이 한 번 더 돌아 factor 호출(total).<\/p>\n<div class=\"callout\">재귀 하강 파서는 <b>LL 파서<\/b>의 한 종류다 (Summary).<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L04-p55.jpg\" aria-label=\"크게 보기\"><img src=\"img/L04-p55.jpg\" alt=\"L04 p.55 · (sum + 47) / total 의 파스 트리\" loading=\"lazy\"><\/button><figcaption>L04 p.55 · (sum + 47) / total 의 파스 트리<\/figcaption><\/figure><\/section>"}, {"id": "L5-3", "title": "LL 문법: 좌순환 · 집합쌍 공통 · 좌추출", "src": "L04 p.56–62", "secs": [{"id": "ll-parsing", "title": "LL 파싱"}, {"id": "left-recursion", "title": "좌순환 문제와 제거"}, {"id": "pairwise", "title": "집합쌍 공통 테스트 (Pairwise Disjointness Test)"}, {"id": "left-factoring", "title": "좌추출 (Left factoring)"}], "md": "## LL 파싱 {#ll-parsing}\n\n- **L**eft-to-right 스캔 + **L**eftmost derivation. lookahead 토큰으로 생성 규칙 선택.\n- **LL 문법**: 왼→오로 읽으며 최좌단 유도를 구성하는 방식으로 파싱 가능한 CFG.\n- LL(1) 파싱 테이블 예:\n```\nS → aAB     A → bA | ε     B → c\n\n         a          b         c\nS    S → aAB      error     error\nA    error        A → bA    A → ε\nB    error        error     B → c\n```\n\n하향식 파싱을 막는 문법의 두 가지 특성: **① 좌순환 ② 집합쌍 공통 테스트 실패**\n\n## 좌순환 문제와 제거 {#left-recursion}\n\n**좌순환이 있으면(직접이든 간접이든) 하향식 파서의 기반이 될 수 없다.**\n이유: `A → A + B` 에서 A()가 아무 토큰도 소비하지 않고 바로 A()를 또 호출 → 무한 재귀.\n\n**직접 좌순환 제거**:\n```\nA → Aα1 | … | Aαm | β1 | β2 | … | βn     (β들은 A로 시작하지 않음)\n⇓\nA  → β1A' | β2A' | … | βnA'\nA' → α1A' | α2A' | … | αmA' | ε\n```\n예)\n```\nE → E + T | T            ⇒   E  → T E'\n                             E' → + T E' | ε\nT → T * F | F            ⇒   T  → F T'\n                             T' → * F T' | ε\nF → (E) | id             ⇒   그대로\n```\n요령: **좌순환 대안의 꼬리(α)는 A'로, 좌순환이 아닌 대안(β)은 뒤에 A'를 붙여서 A로.**\n\n## 집합쌍 공통 테스트 (Pairwise Disjointness Test) {#pairwise}\n\n하향식 파싱을 막는 다른 특성 = 다음 토큰 하나로 올바른 RHS를 고를 수 없는 것.\n\n**FIRST(α) = { a | α ⇒* aβ }** : α에서 유도되는 문자열의 첫 단말들의 집합. (α ⇒* ε 이면 ε도 포함)\n\n**테스트**: 둘 이상의 RHS를 가진 각 비단말 A에 대해, 모든 규칙 쌍 `A → αi`, `A → αj` 에 대해\n**FIRST(αi) ∩ FIRST(αj) = ∅** 이어야 통과.\n\n예)\n```\nA → a | bB | cAb\n  FIRST(a) = {a}, FIRST(bB) = {b}, FIRST(cAb) = {c}  → 모두 서로소 → 통과\nA → a | aB\n  FIRST(a) = {a}, FIRST(aB) = {a}  → 공통 a → 실패\n```\nRHS가 **비단말로 시작**하면 그 비단말의 FIRST를 구해서 넣어야 한다:\n```\nA → aB | Bb ,  B → aC | d\n  FIRST(aB) = {a},  FIRST(Bb) = FIRST(B) = {a, d}  → 공통 a → 실패\n```\n\n> 시험 포인트: 24 중간 13번(5점). 답안 형식 = **각 RHS의 FIRST 집합을 모두 쓰고 → 교집합 → 통과/실패 판정**. 결론만 쓰면 감점.\n\n## 좌추출 (Left factoring) {#left-factoring}\n\n집합쌍 공통 테스트 실패를 해결할 수 있는 경우가 있다: 공통 접두부를 뽑아낸다.\n```\n<variable> → identifier | identifier [<expression>]\n⇓\n<variable> → identifier <new>\n<new>      → ε | [<expression>]\n또는 (EBNF)\n<variable> → identifier [[<expression>]]     (바깥 [ ]는 EBNF 메타기호)\n```\n일반형: `A → αβ1 | αβ2` ⇒ `A → αA'`, `A' → β1 | β2`", "html": "<section class=\"sec\" id=\"s-ll-parsing\"><h3>LL 파싱<\/h3><ul><li><b>L<\/b>eft-to-right 스캔 + <b>L<\/b>eftmost derivation. lookahead 토큰으로 생성 규칙 선택.<\/li><li><b>LL 문법<\/b>: 왼→오로 읽으며 최좌단 유도를 구성하는 방식으로 파싱 가능한 CFG.<\/li><li>LL(1) 파싱 테이블 예:<\/li><\/ul>\n<pre class=\"code\">S → aAB     A → bA | ε     B → c\n\n         a          b         c\nS    S → aAB      error     error\nA    error        A → bA    A → ε\nB    error        error     B → c<\/pre>\n<p>하향식 파싱을 막는 문법의 두 가지 특성: <b>① 좌순환 ② 집합쌍 공통 테스트 실패<\/b><\/p><\/section>\n<section class=\"sec\" id=\"s-left-recursion\"><h3>좌순환 문제와 제거<\/h3><p><b>좌순환이 있으면(직접이든 간접이든) 하향식 파서의 기반이 될 수 없다.<\/b><br>이유: <code>A → A + B<\/code> 에서 A()가 아무 토큰도 소비하지 않고 바로 A()를 또 호출 → 무한 재귀.<\/p>\n<p><b>직접 좌순환 제거<\/b>:<\/p>\n<pre class=\"code\">A → Aα1 | … | Aαm | β1 | β2 | … | βn     (β들은 A로 시작하지 않음)\n⇓\nA  → β1A&#x27; | β2A&#x27; | … | βnA&#x27;\nA&#x27; → α1A&#x27; | α2A&#x27; | … | αmA&#x27; | ε<\/pre>\n<p>예)<\/p>\n<pre class=\"code\">E → E + T | T            ⇒   E  → T E&#x27;\n                             E&#x27; → + T E&#x27; | ε\nT → T * F | F            ⇒   T  → F T&#x27;\n                             T&#x27; → * F T&#x27; | ε\nF → (E) | id             ⇒   그대로<\/pre>\n<p>요령: <b>좌순환 대안의 꼬리(α)는 A'로, 좌순환이 아닌 대안(β)은 뒤에 A'를 붙여서 A로.<\/b><\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L04-p58.jpg\" aria-label=\"크게 보기\"><img src=\"img/L04-p58.jpg\" alt=\"L04 p.58 · 좌순환 제거 예 (E → TE&#x27;, E&#x27; → +TE&#x27; | ε …)와 LL 테이블\" loading=\"lazy\"><\/button><figcaption>L04 p.58 · 좌순환 제거 예 (E → TE&#x27;, E&#x27; → +TE&#x27; | ε …)와 LL 테이블<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-pairwise\"><h3>집합쌍 공통 테스트 (Pairwise Disjointness Test)<\/h3><p>하향식 파싱을 막는 다른 특성 = 다음 토큰 하나로 올바른 RHS를 고를 수 없는 것.<\/p>\n<p><b>FIRST(α) = { a | α ⇒* aβ }<\/b> : α에서 유도되는 문자열의 첫 단말들의 집합. (α ⇒* ε 이면 ε도 포함)<\/p>\n<p><b>테스트<\/b>: 둘 이상의 RHS를 가진 각 비단말 A에 대해, 모든 규칙 쌍 <code>A → αi<\/code>, <code>A → αj<\/code> 에 대해<br><b>FIRST(αi) ∩ FIRST(αj) = ∅<\/b> 이어야 통과.<\/p>\n<p>예)<\/p>\n<pre class=\"code\">A → a | bB | cAb\n  FIRST(a) = {a}, FIRST(bB) = {b}, FIRST(cAb) = {c}  → 모두 서로소 → 통과\nA → a | aB\n  FIRST(a) = {a}, FIRST(aB) = {a}  → 공통 a → 실패<\/pre>\n<p>RHS가 <b>비단말로 시작<\/b>하면 그 비단말의 FIRST를 구해서 넣어야 한다:<\/p>\n<pre class=\"code\">A → aB | Bb ,  B → aC | d\n  FIRST(aB) = {a},  FIRST(Bb) = FIRST(B) = {a, d}  → 공통 a → 실패<\/pre>\n<div class=\"callout exam\">시험 포인트: 24 중간 13번(5점). 답안 형식 = <b>각 RHS의 FIRST 집합을 모두 쓰고 → 교집합 → 통과/실패 판정<\/b>. 결론만 쓰면 감점.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-2<\/span><br>FIRST가 겹친다 = 같은 첫 토큰으로 시작하는 유도가 둘 이상 있다는 뜻 → 다음 토큰 하나만 보고 규칙을 고를 수 없다. 해결책 중 하나가 좌추출.<\/div><\/section>\n<section class=\"sec\" id=\"s-left-factoring\"><h3>좌추출 (Left factoring)<\/h3><p>집합쌍 공통 테스트 실패를 해결할 수 있는 경우가 있다: 공통 접두부를 뽑아낸다.<\/p>\n<pre class=\"code\">&lt;variable&gt; → identifier | identifier [&lt;expression&gt;]\n⇓\n&lt;variable&gt; → identifier &lt;new&gt;\n&lt;new&gt;      → ε | [&lt;expression&gt;]\n또는 (EBNF)\n&lt;variable&gt; → identifier [[&lt;expression&gt;]]     (바깥 [ ]는 EBNF 메타기호)<\/pre>\n<p>일반형: <code>A → αβ1 | αβ2<\/code> ⇒ <code>A → αA'<\/code>, <code>A' → β1 | β2<\/code><\/p><\/section>"}]}, {"id": "U6", "title": "Ch.4 상향식 파싱 (핸들 · LR)", "src": "L04 p.63–79", "intro": "24 중간 14번(핸들·어구·단순어구 5점)과 15번(LR 파싱 추적 10점). LR 추적은 손이 기억해야 하니 퀴즈에서 단계별로 계속 시킬 거야.", "lessons": [{"id": "L6-1", "title": "핸들 · 어구 · 단순 어구", "src": "L04 p.63–67", "secs": [{"id": "bu-problem", "title": "상향식 파싱의 문제"}, {"id": "handle-def", "title": "정의 3개"}, {"id": "handle-howto", "title": "파스 트리로 푸는 법"}], "md": "## 상향식 파싱의 문제 {#bu-problem}\n\n**우문장 형태**(right sentential form, 최우단 유도에서 나오는 문장 형태)에서, 환원하면 **바로 이전 우문장 형태**가 되는 RHS 부분 문자열을 찾는 것.\n\n```\nE → E + T | T       T → T * F | F       F → (E) | id\n입력: id + id * id\n\n최우단 유도:  E ⇒ E + T ⇒ E + T * F ⇒ E + T * id ⇒ E + F * id\n              ⇒ E + id * id ⇒ T + id * id ⇒ F + id * id ⇒ id + id * id\n상향식 파서는 이걸 아래에서 위로 거슬러 올라간다.\n```\n예) `E + T * id` 에서 환원할 수 있는 RHS 후보: `E + T`(→E), `T`(→E), `id`(→F).\n그런데 이전 우문장 형태 `E + T * F`가 되려면 **`id`** 를 F로 환원해야 함. 이 `id`가 **핸들**.\n\n## 정의 3개 {#handle-def}\n\n우문장 형태 γ에 대해:\n- **핸들** (handle): β가 γ = αβw 의 핸들 ⟺ `S ⇒*rm αAw ⇒rm αβw`\n  → 최우단 유도에서 **바로 직전 단계에 A가 β로 전개된 바로 그 부분**.\n- **어구** (phrase): β가 γ의 어구 ⟺ `S ⇒* γ = α1Aα2 ⇒+ α1βα2`\n  → 파스 트리에서 **어떤 내부 노드 하나를 루트로 하는 부분 트리의 잎들** (1단계 이상).\n- **단순 어구** (simple phrase): `S ⇒* α1Aα2 ⇒ α1βα2` (**한 단계**)\n  → 내부 노드 A의 자식들이 **전부 잎**인 경우, 그 자식들.\n\n핵심 관계:\n- **핸들 = 가장 왼쪽의 단순 어구** (the leftmost simple phrase)\n- 파스 트리가 있으면 핸들 찾기는 쉽다.\n- 상향식 파싱 = **핸들 가지치기** (handle pruning)\n\n## 파스 트리로 푸는 법 {#handle-howto}\n\n`E + T * id` 의 파스 트리:\n```\n          E\n        / | \\\n       E  +  T\n           / | \\\n          T  *  F\n                |\n                id\n```\n1. 내부 노드마다 그 아래 **잎들을 왼→오로 읽은 것** = 어구\n   - E(루트): `E + T * id`   - T: `T * id`   - F: `id`\n2. 자식이 **전부 잎**인 내부 노드 = 단순 어구 → F의 자식 `id`만 해당 (T의 자식 중 F는 내부 노드라 X)\n3. 단순 어구 중 **가장 왼쪽** = 핸들 → `id`\n\n답: 어구 = {E + T * id, T * id, id}, 단순 어구 = {id}, 핸들 = id\n\n> 실수 주의: 루트(시작 기호) 전체 문자열도 **어구**에 포함. 잎이 비단말이어도(예: 위 트리의 E, T) 그건 잎이다 — \"잎\"은 트리에서 자식이 없는 노드. 시험 답안엔 **파스 트리를 반드시 그려**.\n\n연습 예) `S → aAb | bBA`, `A → ab | aAB`, `B → aB | b`, 우문장 형태 `aaAbb`:\n```\n        S\n      / | \\\n     a  A  b\n      / | \\\n     a  A  B\n           |\n           b\n```\n어구: `aaAbb`(S), `aAb`(A), `b`(B의 자식, 4번째 글자) / 단순 어구: `b` / 핸들: `b`", "html": "<section class=\"sec\" id=\"s-bu-problem\"><h3>상향식 파싱의 문제<\/h3><p><b>우문장 형태<\/b>(right sentential form, 최우단 유도에서 나오는 문장 형태)에서, 환원하면 <b>바로 이전 우문장 형태<\/b>가 되는 RHS 부분 문자열을 찾는 것.<\/p>\n<pre class=\"code\">E → E + T | T       T → T * F | F       F → (E) | id\n입력: id + id * id\n\n최우단 유도:  E ⇒ E + T ⇒ E + T * F ⇒ E + T * id ⇒ E + F * id\n              ⇒ E + id * id ⇒ T + id * id ⇒ F + id * id ⇒ id + id * id\n상향식 파서는 이걸 아래에서 위로 거슬러 올라간다.<\/pre>\n<p>예) <code>E + T * id<\/code> 에서 환원할 수 있는 RHS 후보: <code>E + T<\/code>(→E), <code>T<\/code>(→E), <code>id<\/code>(→F).<br>그런데 이전 우문장 형태 <code>E + T * F<\/code>가 되려면 <b><code>id<\/code><\/b> 를 F로 환원해야 함. 이 <code>id<\/code>가 <b>핸들<\/b>.<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L04-p64.jpg\" aria-label=\"크게 보기\"><img src=\"img/L04-p64.jpg\" alt=\"L04 p.64 · id + id * id 의 최우단 유도와 각 단계에서 환원할 핸들\" loading=\"lazy\"><\/button><figcaption>L04 p.64 · id + id * id 의 최우단 유도와 각 단계에서 환원할 핸들<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-handle-def\"><h3>정의 3개<\/h3><p>우문장 형태 γ에 대해:<\/p>\n<ul><li><b>핸들<\/b> (handle): β가 γ = αβw 의 핸들 ⟺ <code>S ⇒*rm αAw ⇒rm αβw<\/code><div class=\"sub\">→ 최우단 유도에서 <b>바로 직전 단계에 A가 β로 전개된 바로 그 부분<\/b>.<\/div><\/li><li><b>어구<\/b> (phrase): β가 γ의 어구 ⟺ <code>S ⇒* γ = α1Aα2 ⇒+ α1βα2<\/code><div class=\"sub\">→ 파스 트리에서 <b>어떤 내부 노드 하나를 루트로 하는 부분 트리의 잎들<\/b> (1단계 이상).<\/div><\/li><li><b>단순 어구<\/b> (simple phrase): <code>S ⇒* α1Aα2 ⇒ α1βα2<\/code> (<b>한 단계<\/b>)<div class=\"sub\">→ 내부 노드 A의 자식들이 <b>전부 잎<\/b>인 경우, 그 자식들.<\/div><\/li><\/ul>\n<p>핵심 관계:<\/p>\n<ul><li><b>핸들 = 가장 왼쪽의 단순 어구<\/b> (the leftmost simple phrase)<\/li><li>파스 트리가 있으면 핸들 찾기는 쉽다.<\/li><li>상향식 파싱 = <b>핸들 가지치기<\/b> (handle pruning)<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-handle-howto\"><h3>파스 트리로 푸는 법<\/h3><p><code>E + T * id<\/code> 의 파스 트리:<\/p>\n<pre class=\"code\">          E\n        / | \\\n       E  +  T\n           / | \\\n          T  *  F\n                |\n                id<\/pre>\n<ol><li>내부 노드마다 그 아래 <b>잎들을 왼→오로 읽은 것<\/b> = 어구<ul><li>E(루트): <code>E + T * id<\/code>   - T: <code>T * id<\/code>   - F: <code>id<\/code><\/li><\/ul><\/li><li>자식이 <b>전부 잎<\/b>인 내부 노드 = 단순 어구 → F의 자식 <code>id<\/code>만 해당 (T의 자식 중 F는 내부 노드라 X)<\/li><li>단순 어구 중 <b>가장 왼쪽<\/b> = 핸들 → <code>id<\/code><\/li><\/ol>\n<p>답: 어구 = {E + T * id, T * id, id}, 단순 어구 = {id}, 핸들 = id<\/p>\n<div class=\"callout trap\">실수 주의: 루트(시작 기호) 전체 문자열도 <b>어구<\/b>에 포함. 잎이 비단말이어도(예: 위 트리의 E, T) 그건 잎이다 — \"잎\"은 트리에서 자식이 없는 노드. 시험 답안엔 <b>파스 트리를 반드시 그려<\/b>.<\/div>\n<p>연습 예) <code>S → aAb | bBA<\/code>, <code>A → ab | aAB<\/code>, <code>B → aB | b<\/code>, 우문장 형태 <code>aaAbb<\/code>:<\/p>\n<pre class=\"code\">        S\n      / | \\\n     a  A  b\n      / | \\\n     a  A  B\n           |\n           b<\/pre>\n<p>어구: <code>aaAbb<\/code>(S), <code>aAb<\/code>(A), <code>b<\/code>(B의 자식, 4번째 글자) / 단순 어구: <code>b<\/code> / 핸들: <code>b<\/code><\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">06주-2<\/span><br>단순 어구를 답할 때 같은 기호가 여러 번 나오면(예: id가 두 개) 어느 위치의 것인지 반드시 명시하라고 함. 핸들은 단순 어구 중 가장 왼쪽 것 = 최우단 유도에서 마지막으로 전개된 부분.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L04-p66.jpg\" aria-label=\"크게 보기\"><img src=\"img/L04-p66.jpg\" alt=\"L04 p.66 · 우문장 형태 E + T * id 의 파스 트리\" loading=\"lazy\"><\/button><figcaption>L04 p.66 · 우문장 형태 E + T * id 의 파스 트리<\/figcaption><\/figure><\/section>"}, {"id": "L6-2", "title": "Shift-Reduce · LR 파서 구조", "src": "L04 p.68–76", "secs": [{"id": "shift-reduce", "title": "Shift와 Reduce"}, {"id": "lr-advantages", "title": "LR 파서의 장점"}, {"id": "lr-structure", "title": "LR 파서의 구성"}, {"id": "lr-actions", "title": "파서 행동 4가지"}], "md": "## Shift와 Reduce {#shift-reduce}\n\n상향식 파서 = **shift-reduce 알고리즘**:\n- **Shift**: 다음 입력 토큰을 파스 스택의 top으로 옮김\n- **Reduce**: 스택 top에 있는 **핸들**을 대응하는 LHS로 교체\n\n## LR 파서의 장점 {#lr-advantages}\n\n1. 프로그래밍 언어를 기술하는 **거의 모든 문법**에 대해 동작\n2. 다른 상향식 알고리즘보다 **더 넓은 문법 클래스**에서 동작하면서도 **다른 상향식 파서만큼 효율적**\n3. 구문 오류를 **가능한 한 빨리** 탐지\n4. **LR 문법 클래스는 LL 파서로 파싱 가능한 클래스의 상위 집합**\n\n단점(교안): LR 파싱 테이블은 손으로 만들기 어려워 **도구**로 생성 (yacc, bison).\n\n**Knuth의 통찰**: 상향식 파서는 현재까지의 **파싱 이력 전체**를 써서 결정할 수 있다. 가능한 파싱 상황의 수는 유한하고 비교적 작아서, 이력을 **파서 상태**로 스택에 저장할 수 있다.\n\n## LR 파서의 구성 {#lr-structure}\n\n- 파스 스택: 상태 기호와 문법 기호를 번갈아 저장\n- **LR 구성** (configuration): `(S0 X1 S1 X2 S2 … Xm Sm,  ai ai+1 … an $)`\n  왼쪽 = 스택, 오른쪽 = 남은 입력\n- 초기 구성: `(S0, a1 … an $)`\n- 파싱 테이블 = **ACTION 테이블 + GOTO 테이블**\n\n| 테이블 | 행 | 열 | 내용 |\n|---|---|---|---|\n| **ACTION** | 상태 | **단말** | 주어진 상태와 다음 토큰에서 할 행동 (Shift/Reduce/Accept/Error) |\n| **GOTO** | 상태 | **비단말** | **reduce 후** 스택에 넣을 상태 |\n\n## 파서 행동 4가지 {#lr-actions}\n\n- **Shift (Sn)**: 다음 입력 기호와, Shift에 적힌 상태 n을 스택에 push.\n- **Reduce (Rn)**: 규칙 n의 핸들(RHS)을 스택에서 제거 — **RHS 기호 수 × 2개**(기호+상태)를 pop. 그다음 LHS를 push하고, **새 LHS 바로 밑에 있는 상태**와 **LHS**로 GOTO 테이블을 찾아 그 상태를 push.\n- **Accept**: 파싱 완료, 오류 없음.\n- **Error**: 오류 처리 루틴 호출.\n\n> 시험에서 가장 많이 틀리는 곳: Reduce 후 GOTO를 찾을 때 쓰는 상태는 **pop하고 남은 스택 top의 상태**다. reduce 전 상태가 아님.", "html": "<section class=\"sec\" id=\"s-shift-reduce\"><h3>Shift와 Reduce<\/h3><p>상향식 파서 = <b>shift-reduce 알고리즘<\/b>:<\/p>\n<ul><li><b>Shift<\/b>: 다음 입력 토큰을 파스 스택의 top으로 옮김<\/li><li><b>Reduce<\/b>: 스택 top에 있는 <b>핸들<\/b>을 대응하는 LHS로 교체<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-lr-advantages\"><h3>LR 파서의 장점<\/h3><ol><li>프로그래밍 언어를 기술하는 <b>거의 모든 문법<\/b>에 대해 동작<\/li><li>다른 상향식 알고리즘보다 <b>더 넓은 문법 클래스<\/b>에서 동작하면서도 <b>다른 상향식 파서만큼 효율적<\/b><\/li><li>구문 오류를 <b>가능한 한 빨리<\/b> 탐지<\/li><li><b>LR 문법 클래스는 LL 파서로 파싱 가능한 클래스의 상위 집합<\/b><\/li><\/ol>\n<p>단점(교안): LR 파싱 테이블은 손으로 만들기 어려워 <b>도구<\/b>로 생성 (yacc, bison).<\/p>\n<p><b>Knuth의 통찰<\/b>: 상향식 파서는 현재까지의 <b>파싱 이력 전체<\/b>를 써서 결정할 수 있다. 가능한 파싱 상황의 수는 유한하고 비교적 작아서, 이력을 <b>파서 상태<\/b>로 스택에 저장할 수 있다.<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-2<\/span><br>LR은 지금까지 읽은 이력을 스택(상태)에 누적해서 판단하기 때문에 LL보다 넓은 범위의 CFG를 다룰 수 있다 (좌순환이나 집합쌍 테스트 실패 문법도 처리 가능).<\/div><\/section>\n<section class=\"sec\" id=\"s-lr-structure\"><h3>LR 파서의 구성<\/h3><ul><li>파스 스택: 상태 기호와 문법 기호를 번갈아 저장<\/li><li><b>LR 구성<\/b> (configuration): <code>(S0 X1 S1 X2 S2 … Xm Sm,  ai ai+1 … an $)<\/code><div class=\"sub\">왼쪽 = 스택, 오른쪽 = 남은 입력<\/div><\/li><li>초기 구성: <code>(S0, a1 … an $)<\/code><\/li><li>파싱 테이블 = <b>ACTION 테이블 + GOTO 테이블<\/b><\/li><\/ul>\n<div class=\"tblw\"><table><thead><tr><th>테이블<\/th><th>행<\/th><th>열<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td><b>ACTION<\/b><\/td><td>상태<\/td><td><b>단말<\/b><\/td><td>주어진 상태와 다음 토큰에서 할 행동 (Shift/Reduce/Accept/Error)<\/td><\/tr><tr><td><b>GOTO<\/b><\/td><td>상태<\/td><td><b>비단말<\/b><\/td><td><b>reduce 후<\/b> 스택에 넣을 상태<\/td><\/tr><\/tbody><\/table><\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L04-p72.jpg\" aria-label=\"크게 보기\"><img src=\"img/L04-p72.jpg\" alt=\"L04 p.72 · LR 파서의 구조 (파스 스택 + 입력 + 파서 코드 + 파싱 테이블)\" loading=\"lazy\"><\/button><figcaption>L04 p.72 · LR 파서의 구조 (파스 스택 + 입력 + 파서 코드 + 파싱 테이블)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-lr-actions\"><h3>파서 행동 4가지<\/h3><ul><li><b>Shift (Sn)<\/b>: 다음 입력 기호와, Shift에 적힌 상태 n을 스택에 push.<\/li><li><b>Reduce (Rn)<\/b>: 규칙 n의 핸들(RHS)을 스택에서 제거 — <b>RHS 기호 수 × 2개<\/b>(기호+상태)를 pop. 그다음 LHS를 push하고, <b>새 LHS 바로 밑에 있는 상태<\/b>와 <b>LHS<\/b>로 GOTO 테이블을 찾아 그 상태를 push.<\/li><li><b>Accept<\/b>: 파싱 완료, 오류 없음.<\/li><li><b>Error<\/b>: 오류 처리 루틴 호출.<\/li><\/ul>\n<div class=\"callout exam\">시험에서 가장 많이 틀리는 곳: Reduce 후 GOTO를 찾을 때 쓰는 상태는 <b>pop하고 남은 스택 top의 상태<\/b>다. reduce 전 상태가 아님.<\/div><\/section>"}, {"id": "L6-3", "title": "LR 파싱 추적 연습", "src": "L04 p.77–78", "secs": [{"id": "lr-table", "title": "시험에 주어지는 문법과 파싱 테이블"}, {"id": "lr-trace", "title": "교안 예제: id + id * id"}, {"id": "lr-routine", "title": "한 줄씩 푸는 루틴"}], "md": "## 시험에 주어지는 문법과 파싱 테이블 {#lr-table}\n\n```\n1. E → E + T      4. T → F\n2. E → T          5. F → (E)\n3. T → T * F      6. F → id\n```\n(교안 p.78 규칙 5가 `F → E`로 오타가 나 있는데 실제로는 `F → (E)`. 24 중간 시험지는 `(E)`로 맞게 나왔어.)\n\n| 상태 | id | + | * | ( | ) | $ | E | T | F |\n|---|---|---|---|---|---|---|---|---|---|\n| 0 | S5 | | | S4 | | | 1 | 2 | 3 |\n| 1 | | S6 | | | | accept | | | |\n| 2 | | R2 | S7 | | R2 | R2 | | | |\n| 3 | | R4 | R4 | | R4 | R4 | | | |\n| 4 | S5 | | | S4 | | | 8 | 2 | 3 |\n| 5 | | R6 | R6 | | R6 | R6 | | | |\n| 6 | S5 | | | S4 | | | | 9 | 3 |\n| 7 | S5 | | | S4 | | | | | 10 |\n| 8 | | S6 | | | S11 | | | | |\n| 9 | | R1 | S7 | | R1 | R1 | | | |\n| 10 | | R3 | R3 | | R3 | R3 | | | |\n| 11 | | R5 | R5 | | R5 | R5 | | | |\n\n## 교안 예제: id + id * id {#lr-trace}\n\n| 스택 | 입력 | 행동 |\n|---|---|---|\n| 0 | id + id * id $ | Shift 5 |\n| 0id5 | + id * id $ | Reduce 6 (F→id), GOTO[0,F]=3 |\n| 0F3 | + id * id $ | Reduce 4 (T→F), GOTO[0,T]=2 |\n| 0T2 | + id * id $ | Reduce 2 (E→T), GOTO[0,E]=1 |\n| 0E1 | + id * id $ | Shift 6 |\n| 0E1+6 | id * id $ | Shift 5 |\n| 0E1+6id5 | * id $ | Reduce 6, GOTO[6,F]=3 |\n| 0E1+6F3 | * id $ | Reduce 4, GOTO[6,T]=9 |\n| 0E1+6T9 | * id $ | Shift 7 |\n| 0E1+6T9*7 | id $ | Shift 5 |\n| 0E1+6T9*7id5 | $ | Reduce 6, GOTO[7,F]=10 |\n| 0E1+6T9*7F10 | $ | Reduce 3 (T→T*F), GOTO[6,T]=9 |\n| 0E1+6T9 | $ | Reduce 1 (E→E+T), GOTO[0,E]=1 |\n| 0E1 | $ | Accept |\n\n## 한 줄씩 푸는 루틴 {#lr-routine}\n\n매 줄마다 이것만 반복:\n1. 스택 **맨 오른쪽 상태 번호**와 입력 **맨 앞 토큰**으로 ACTION 칸을 본다.\n2. `Sn` → 토큰과 n을 스택 끝에 붙이고, 입력에서 토큰을 지운다.\n3. `Rn` → 규칙 n의 RHS 길이 k만큼 (기호, 상태) 쌍을 스택 끝에서 지운다 → 남은 스택 끝 상태 s와 LHS로 GOTO[s, LHS] → `LHS` + 그 상태를 붙인다. **입력은 그대로.**\n4. `accept` → 끝.\n\n체크 포인트:\n- `R3 (T→T*F)`은 **3개 기호**(T, *, F) = 6칸 pop. `R1 (E→E+T)`도 3개. `R5 (F→(E))`도 3개(`(`, E, `)`).\n- `R2, R4, R6`는 1개 기호 = 2칸 pop.\n- 상태 2에서 `*`를 보면 **S7**(곱셈이 우선), `+`를 보면 **R2**. 상태 9도 같다. → 이게 우선순위가 표에 녹아 있는 방식.", "html": "<section class=\"sec\" id=\"s-lr-table\"><h3>시험에 주어지는 문법과 파싱 테이블<\/h3><pre class=\"code\">1. E → E + T      4. T → F\n2. E → T          5. F → (E)\n3. T → T * F      6. F → id<\/pre>\n<p>(교안 p.78 규칙 5가 <code>F → E<\/code>로 오타가 나 있는데 실제로는 <code>F → (E)<\/code>. 24 중간 시험지는 <code>(E)<\/code>로 맞게 나왔어.)<\/p>\n<div class=\"tblw\"><table><thead><tr><th>상태<\/th><th>id<\/th><th>+<\/th><th>*<\/th><th>(<\/th><th>)<\/th><th>$<\/th><th>E<\/th><th>T<\/th><th>F<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>S5<\/td><td><\/td><td><\/td><td>S4<\/td><td><\/td><td><\/td><td>1<\/td><td>2<\/td><td>3<\/td><\/tr><tr><td>1<\/td><td><\/td><td>S6<\/td><td><\/td><td><\/td><td><\/td><td>accept<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>2<\/td><td><\/td><td>R2<\/td><td>S7<\/td><td><\/td><td>R2<\/td><td>R2<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>3<\/td><td><\/td><td>R4<\/td><td>R4<\/td><td><\/td><td>R4<\/td><td>R4<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>4<\/td><td>S5<\/td><td><\/td><td><\/td><td>S4<\/td><td><\/td><td><\/td><td>8<\/td><td>2<\/td><td>3<\/td><\/tr><tr><td>5<\/td><td><\/td><td>R6<\/td><td>R6<\/td><td><\/td><td>R6<\/td><td>R6<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>6<\/td><td>S5<\/td><td><\/td><td><\/td><td>S4<\/td><td><\/td><td><\/td><td><\/td><td>9<\/td><td>3<\/td><\/tr><tr><td>7<\/td><td>S5<\/td><td><\/td><td><\/td><td>S4<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>10<\/td><\/tr><tr><td>8<\/td><td><\/td><td>S6<\/td><td><\/td><td><\/td><td>S11<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>9<\/td><td><\/td><td>R1<\/td><td>S7<\/td><td><\/td><td>R1<\/td><td>R1<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>10<\/td><td><\/td><td>R3<\/td><td>R3<\/td><td><\/td><td>R3<\/td><td>R3<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>11<\/td><td><\/td><td>R5<\/td><td>R5<\/td><td><\/td><td>R5<\/td><td>R5<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/tbody><\/table><\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">06주-2<\/span><br>ACTION/GOTO 테이블은 시험에서 주어진다. 이 수업은 컴파일러 수업이 아니라 테이블을 만드는 법은 다루지 않고 (yacc 같은 도구가 만들어 줌), 테이블을 읽어서 파싱 과정을 따라가는 것만 하면 된다.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L04-p77.jpg\" aria-label=\"크게 보기\"><img src=\"img/L04-p77.jpg\" alt=\"L04 p.77 · LR 파싱 테이블 (ACTION / GOTO)\" loading=\"lazy\"><\/button><figcaption>L04 p.77 · LR 파싱 테이블 (ACTION / GOTO)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-lr-trace\"><h3>교안 예제: id + id * id<\/h3><div class=\"tblw\"><table><thead><tr><th>스택<\/th><th>입력<\/th><th>행동<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>id + id * id $<\/td><td>Shift 5<\/td><\/tr><tr><td>0id5<\/td><td>+ id * id $<\/td><td>Reduce 6 (F→id), GOTO[0,F]=3<\/td><\/tr><tr><td>0F3<\/td><td>+ id * id $<\/td><td>Reduce 4 (T→F), GOTO[0,T]=2<\/td><\/tr><tr><td>0T2<\/td><td>+ id * id $<\/td><td>Reduce 2 (E→T), GOTO[0,E]=1<\/td><\/tr><tr><td>0E1<\/td><td>+ id * id $<\/td><td>Shift 6<\/td><\/tr><tr><td>0E1+6<\/td><td>id * id $<\/td><td>Shift 5<\/td><\/tr><tr><td>0E1+6id5<\/td><td>* id $<\/td><td>Reduce 6, GOTO[6,F]=3<\/td><\/tr><tr><td>0E1+6F3<\/td><td>* id $<\/td><td>Reduce 4, GOTO[6,T]=9<\/td><\/tr><tr><td>0E1+6T9<\/td><td>* id $<\/td><td>Shift 7<\/td><\/tr><tr><td>0E1+6T9*7<\/td><td>id $<\/td><td>Shift 5<\/td><\/tr><tr><td>0E1+6T9*7id5<\/td><td>$<\/td><td>Reduce 6, GOTO[7,F]=10<\/td><\/tr><tr><td>0E1+6T9*7F10<\/td><td>$<\/td><td>Reduce 3 (T→T*F), GOTO[6,T]=9<\/td><\/tr><tr><td>0E1+6T9<\/td><td>$<\/td><td>Reduce 1 (E→E+T), GOTO[0,E]=1<\/td><\/tr><tr><td>0E1<\/td><td>$<\/td><td>Accept<\/td><\/tr><\/tbody><\/table><\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">06주-2<\/span><br>수업에서 id + id * id를 칠판에 한 줄씩 따라감: 스택 맨 위 상태와 입력 첫 토큰으로 ACTION을 보고, Reduce 후엔 남은 스택 top 상태와 LHS로 GOTO를 본다. 상태 1에서 $를 만나면 accept, 테이블에 없는 칸은 전부 error.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L04-p78.jpg\" aria-label=\"크게 보기\"><img src=\"img/L04-p78.jpg\" alt=\"L04 p.78 · id + id * id 의 LR 파싱 과정 (규칙 5는 F → (E) 가 맞음)\" loading=\"lazy\"><\/button><figcaption>L04 p.78 · id + id * id 의 LR 파싱 과정 (규칙 5는 F → (E) 가 맞음)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-lr-routine\"><h3>한 줄씩 푸는 루틴<\/h3><p>매 줄마다 이것만 반복:<\/p>\n<ol><li>스택 <b>맨 오른쪽 상태 번호<\/b>와 입력 <b>맨 앞 토큰<\/b>으로 ACTION 칸을 본다.<\/li><li><code>Sn<\/code> → 토큰과 n을 스택 끝에 붙이고, 입력에서 토큰을 지운다.<\/li><li><code>Rn<\/code> → 규칙 n의 RHS 길이 k만큼 (기호, 상태) 쌍을 스택 끝에서 지운다 → 남은 스택 끝 상태 s와 LHS로 GOTO[s, LHS] → <code>LHS<\/code> + 그 상태를 붙인다. <b>입력은 그대로.<\/b><\/li><li><code>accept<\/code> → 끝.<\/li><\/ol>\n<p>체크 포인트:<\/p>\n<ul><li><code>R3 (T→T*F)<\/code>은 <b>3개 기호<\/b>(T, *, F) = 6칸 pop. <code>R1 (E→E+T)<\/code>도 3개. <code>R5 (F→(E))<\/code>도 3개(<code>(<\/code>, E, <code>)<\/code>).<\/li><li><code>R2, R4, R6<\/code>는 1개 기호 = 2칸 pop.<\/li><li>상태 2에서 <code>*<\/code>를 보면 <b>S7<\/b>(곱셈이 우선), <code>+<\/code>를 보면 <b>R2<\/b>. 상태 9도 같다. → 이게 우선순위가 표에 녹아 있는 방식.<\/li><\/ul><\/section>"}]}, {"id": "U7", "title": "Ch.5 이름 · 바인딩 · 영역", "src": "교안 미배포 (10/13 수업 예정) · Sebesta Ch.5 기준", "intro": "다음 주 화요일에 나갈 범위인데 24 중간 5·16·17·18번(33점)이 전부 여기였어. 교재(Sebesta) 기준으로 정리해 뒀고, 수업 교안이 나오면 맞춰서 고칠게.", "lessons": [{"id": "L7-1", "title": "이름 · 변수의 6가지 속성", "src": "Sebesta 5.2–5.3", "secs": [{"id": "names", "title": "이름 (Names)"}, {"id": "var-attrs", "title": "변수의 6가지 속성"}], "md": "## 이름 (Names) {#names}\n\n설계 이슈:\n- **대소문자 구분**(case sensitivity)? C 계열은 구분 → `rose`, `ROSE`, `Rose`가 다른 이름 → 판독성 저하.\n- **특수어**(special words)가 **예약어**(reserved word)인가 **키워드**(keyword)인가?\n  - 키워드: 특정 문맥에서만 특별한 의미 (Fortran의 `Integer`는 변수 이름도 될 수 있었음)\n  - 예약어: 이름으로 **사용 불가**. 예약어가 너무 많으면 이름 짓기 곤란 (COBOL 300개)\n- 이름 길이 제한, 허용 문자 (PHP 변수는 `$`로 시작, Perl은 `$ @ %`로 타입 표시, Ruby `@`, `@@`)\n\n## 변수의 6가지 속성 {#var-attrs}\n\n변수 = 메모리 셀(들)의 추상화. 6개 속성의 **6-tuple**로 특징지어짐:\n\n| 속성 | 설명 |\n|---|---|\n| **이름** (name) | 변수를 가리키는 식별자. 모든 변수가 이름을 갖진 않음(힙의 익명 변수) |\n| **주소** (address) | 변수와 연관된 메모리 주소 = **l-value**. 실행 중 다른 시점에 다른 주소일 수 있음(재귀 호출의 지역 변수) |\n| **값** (value) | 변수 메모리 셀의 내용 = **r-value** |\n| **타입** (type) | 변수 값의 범위와 그 타입에 정의된 연산의 집합을 결정 |\n| **생존 기간** (lifetime) | 변수가 특정 메모리 셀에 **바인딩되어 있는 기간** |\n| **영역** (scope) | 변수가 **가시적인**(참조 가능한) 문장들의 범위 |\n\n> 시험 포인트: 24 중간 5번 = 6가지 속성 적기(3점). 외우는 법: **이주값타생영** (이름·주소·값·타입·생존기간·영역).\n\n**별칭** (aliases): 둘 이상의 변수 이름이 **같은 메모리 주소**에 접근할 때. 포인터, 참조 변수, C/C++ union으로 생김. 판독성·신뢰성에 해롭다(한 이름으로 값을 바꾸면 다른 이름의 값도 바뀜).", "html": "<section class=\"sec\" id=\"s-names\"><h3>이름 (Names)<\/h3><p>설계 이슈:<\/p>\n<ul><li><b>대소문자 구분<\/b>(case sensitivity)? C 계열은 구분 → <code>rose<\/code>, <code>ROSE<\/code>, <code>Rose<\/code>가 다른 이름 → 판독성 저하.<\/li><li><b>특수어<\/b>(special words)가 <b>예약어<\/b>(reserved word)인가 <b>키워드<\/b>(keyword)인가?<ul><li>키워드: 특정 문맥에서만 특별한 의미 (Fortran의 <code>Integer<\/code>는 변수 이름도 될 수 있었음)<\/li><li>예약어: 이름으로 <b>사용 불가<\/b>. 예약어가 너무 많으면 이름 짓기 곤란 (COBOL 300개)<\/li><\/ul><\/li><li>이름 길이 제한, 허용 문자 (PHP 변수는 <code>$<\/code>로 시작, Perl은 <code>$ @ %<\/code>로 타입 표시, Ruby <code>@<\/code>, <code>@@<\/code>)<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-var-attrs\"><h3>변수의 6가지 속성<\/h3><p>변수 = 메모리 셀(들)의 추상화. 6개 속성의 <b>6-tuple<\/b>로 특징지어짐:<\/p>\n<div class=\"tblw\"><table><thead><tr><th>속성<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td><b>이름<\/b> (name)<\/td><td>변수를 가리키는 식별자. 모든 변수가 이름을 갖진 않음(힙의 익명 변수)<\/td><\/tr><tr><td><b>주소<\/b> (address)<\/td><td>변수와 연관된 메모리 주소 = <b>l-value<\/b>. 실행 중 다른 시점에 다른 주소일 수 있음(재귀 호출의 지역 변수)<\/td><\/tr><tr><td><b>값<\/b> (value)<\/td><td>변수 메모리 셀의 내용 = <b>r-value<\/b><\/td><\/tr><tr><td><b>타입<\/b> (type)<\/td><td>변수 값의 범위와 그 타입에 정의된 연산의 집합을 결정<\/td><\/tr><tr><td><b>생존 기간<\/b> (lifetime)<\/td><td>변수가 특정 메모리 셀에 <b>바인딩되어 있는 기간<\/b><\/td><\/tr><tr><td><b>영역<\/b> (scope)<\/td><td>변수가 <b>가시적인<\/b>(참조 가능한) 문장들의 범위<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout exam\">시험 포인트: 24 중간 5번 = 6가지 속성 적기(3점). 외우는 법: <b>이주값타생영<\/b> (이름·주소·값·타입·생존기간·영역).<\/div>\n<p><b>별칭<\/b> (aliases): 둘 이상의 변수 이름이 <b>같은 메모리 주소<\/b>에 접근할 때. 포인터, 참조 변수, C/C++ union으로 생김. 판독성·신뢰성에 해롭다(한 이름으로 값을 바꾸면 다른 이름의 값도 바뀜).<\/p><\/section>"}, {"id": "L7-2", "title": "바인딩 · 바인딩 시간 · 타입 바인딩", "src": "Sebesta 5.4.1–5.4.2", "secs": [{"id": "binding-time", "title": "바인딩과 바인딩 시간"}, {"id": "static-dynamic-binding", "title": "정적 바인딩 vs 동적 바인딩"}, {"id": "type-binding", "title": "타입 바인딩"}], "md": "## 바인딩과 바인딩 시간 {#binding-time}\n\n**바인딩** (binding): 속성과 개체 사이의 연관 (예: 변수와 그 타입/값, 연산과 기호).\n**바인딩 시간**: 바인딩이 일어나는 시점.\n\n| 바인딩 시간 | 예 |\n|---|---|\n| 언어 설계 시간 | `*` 기호를 곱셈 연산에 바인딩 |\n| 언어 구현 시간 | C의 `int` 같은 부동소수점/정수 타입을 표현 방식에 바인딩 |\n| 컴파일 시간 | C/Java 변수를 특정 데이터 타입에 바인딩 |\n| 적재(load) 시간 | C/C++ `static` 변수를 메모리 셀에 바인딩 |\n| 링크 시간 | 라이브러리 부프로그램 호출을 그 코드에 바인딩 |\n| 실행 시간 | 비정적 지역 변수를 메모리 셀에 바인딩 |\n\n`count = count + 5;` 에서: count의 타입 → 컴파일 시간 / `+`의 가능한 의미 → 언어 설계 시간 / `+`의 실제 의미 → 컴파일 시간(피연산자 타입이 정해지면) / 5의 내부 표현 → 구현 시간 / count의 값 → 실행 시간.\n\n## 정적 바인딩 vs 동적 바인딩 {#static-dynamic-binding}\n\n- **정적 바인딩**: **실행 시간 이전**에 처음 일어나고 실행 내내 **변하지 않음**.\n- **동적 바인딩**: **실행 중**에 처음 일어나거나 실행 중에 **변할 수 있음**.\n\n## 타입 바인딩 {#type-binding}\n\n정적 타입 바인딩 방법:\n- **명시적 선언** (explicit declaration): 변수 이름과 타입을 나열하는 문장. `int count;`\n- **묵시적 선언** (implicit declaration): 선언문 없이 **기본 관례**로 타입을 정함.\n  - 이름 관례: Fortran은 I, J, K, L, M, N으로 시작하면 정수, 나머지는 실수. Perl은 `$`(스칼라) `@`(배열) `%`(해시).\n  - **타입 추론**(type inference): 문맥으로 추론. C#의 `var sum = 0;`, ML, Haskell.\n  - 단점: 오타가 새 변수가 되어 오류가 안 잡힐 수 있음 → **신뢰성 저하** (이름 관례 방식은 덜 심함).\n\n**동적 타입 바인딩** (JavaScript, Python, Ruby, PHP):\n```\nlist = [2, 4.33, 6, 8];   // list는 배열\nlist = 17.3;              // 이제 list는 스칼라\n```\n- 배정문으로 타입이 정해짐 (배정되는 값의 타입)\n- 장점: **유연성** (generic 프로그램 작성 쉬움)\n- 단점: **비용이 큼** (실행 시간 타입 검사, 보통 순수 해석으로 구현), **타입 오류 탐지가 어려움** (잘못된 타입의 값이 배정돼도 오류가 아님 → 신뢰성↓)", "html": "<section class=\"sec\" id=\"s-binding-time\"><h3>바인딩과 바인딩 시간<\/h3><p><b>바인딩<\/b> (binding): 속성과 개체 사이의 연관 (예: 변수와 그 타입/값, 연산과 기호).<br><b>바인딩 시간<\/b>: 바인딩이 일어나는 시점.<\/p>\n<div class=\"tblw\"><table><thead><tr><th>바인딩 시간<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>언어 설계 시간<\/td><td><code>*<\/code> 기호를 곱셈 연산에 바인딩<\/td><\/tr><tr><td>언어 구현 시간<\/td><td>C의 <code>int<\/code> 같은 부동소수점/정수 타입을 표현 방식에 바인딩<\/td><\/tr><tr><td>컴파일 시간<\/td><td>C/Java 변수를 특정 데이터 타입에 바인딩<\/td><\/tr><tr><td>적재(load) 시간<\/td><td>C/C++ <code>static<\/code> 변수를 메모리 셀에 바인딩<\/td><\/tr><tr><td>링크 시간<\/td><td>라이브러리 부프로그램 호출을 그 코드에 바인딩<\/td><\/tr><tr><td>실행 시간<\/td><td>비정적 지역 변수를 메모리 셀에 바인딩<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>count = count + 5;<\/code> 에서: count의 타입 → 컴파일 시간 / <code>+<\/code>의 가능한 의미 → 언어 설계 시간 / <code>+<\/code>의 실제 의미 → 컴파일 시간(피연산자 타입이 정해지면) / 5의 내부 표현 → 구현 시간 / count의 값 → 실행 시간.<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">06주-2<\/span><br>10/8 예고: 다음 주(7주차)에 Ch.5 이름·바인딩·영역. 바인딩 = 변수를 선언할 때 식별자와 타입 등 속성을 연결하는 것. 형식 매개변수(함수 정의의 매개변수)도 영역 관점에서 다룰 예정.<\/div><\/section>\n<section class=\"sec\" id=\"s-static-dynamic-binding\"><h3>정적 바인딩 vs 동적 바인딩<\/h3><ul><li><b>정적 바인딩<\/b>: <b>실행 시간 이전<\/b>에 처음 일어나고 실행 내내 <b>변하지 않음<\/b>.<\/li><li><b>동적 바인딩<\/b>: <b>실행 중<\/b>에 처음 일어나거나 실행 중에 <b>변할 수 있음<\/b>.<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-type-binding\"><h3>타입 바인딩<\/h3><p>정적 타입 바인딩 방법:<\/p>\n<ul><li><b>명시적 선언<\/b> (explicit declaration): 변수 이름과 타입을 나열하는 문장. <code>int count;<\/code><\/li><li><b>묵시적 선언<\/b> (implicit declaration): 선언문 없이 <b>기본 관례<\/b>로 타입을 정함.<ul><li>이름 관례: Fortran은 I, J, K, L, M, N으로 시작하면 정수, 나머지는 실수. Perl은 <code>$<\/code>(스칼라) <code>@<\/code>(배열) <code>%<\/code>(해시).<\/li><li><b>타입 추론<\/b>(type inference): 문맥으로 추론. C#의 <code>var sum = 0;<\/code>, ML, Haskell.<\/li><li>단점: 오타가 새 변수가 되어 오류가 안 잡힐 수 있음 → <b>신뢰성 저하<\/b> (이름 관례 방식은 덜 심함).<\/li><\/ul><\/li><\/ul>\n<p><b>동적 타입 바인딩<\/b> (JavaScript, Python, Ruby, PHP):<\/p>\n<pre class=\"code\">list = [2, 4.33, 6, 8];   // list는 배열\nlist = 17.3;              // 이제 list는 스칼라<\/pre>\n<ul><li>배정문으로 타입이 정해짐 (배정되는 값의 타입)<\/li><li>장점: <b>유연성<\/b> (generic 프로그램 작성 쉬움)<\/li><li>단점: <b>비용이 큼<\/b> (실행 시간 타입 검사, 보통 순수 해석으로 구현), <b>타입 오류 탐지가 어려움<\/b> (잘못된 타입의 값이 배정돼도 오류가 아님 → 신뢰성↓)<\/li><\/ul><\/section>"}, {"id": "L7-3", "title": "기억장소 바인딩과 생존 기간", "src": "Sebesta 5.4.3", "secs": [{"id": "lifetime-def", "title": "할당 · 해제 · 생존 기간"}, {"id": "var-categories", "title": "생존 기간에 따른 변수 4종류"}], "md": "## 할당 · 해제 · 생존 기간 {#lifetime-def}\n\n- **할당** (allocation): 가용 메모리 풀에서 셀을 가져와 변수에 바인딩\n- **해제** (deallocation): 바인딩을 끊고 셀을 풀로 돌려줌\n- **생존 기간** (lifetime): 변수가 특정 메모리 셀에 바인딩되어 있는 시간\n\n## 생존 기간에 따른 변수 4종류 {#var-categories}\n\n| 종류 | 바인딩 시점 | 예 | 장점 | 단점 |\n|---|---|---|---|---|\n| **정적** (static) | 실행 **전**에 메모리에 바인딩, 종료까지 유지 | C/C++ `static` 변수, 전역 변수 | 효율적(직접 주소 지정), **이력 민감**(history-sensitive) 부프로그램 지원 | 유연성↓, **재귀 불가**, 변수 간 저장 공간 공유 불가 |\n| **스택-동적** (stack-dynamic) | 선언문이 **세련화(elaboration)** 될 때(실행 시간) 바인딩. 타입은 정적 | C/Java 메소드의 지역 변수 | **재귀** 지원, 부프로그램 간 메모리 공유 | 할당/해제 오버헤드, 간접 주소 지정, 이력 민감 X |\n| **명시적 힙-동적** (explicit heap-dynamic) | 프로그래머가 **명시적 명령**(new/delete, malloc/free)으로 할당·해제. **포인터/참조**로만 접근 | C++ `new int`, Java 객체 | 동적 자료 구조(연결 리스트, 트리) | 포인터 사용이 어렵고 **신뢰성↓**, 힙 관리 비용 |\n| **묵시적 힙-동적** (implicit heap-dynamic) | **배정될 때** 힙에 할당 (모든 속성이 매번 새로 바인딩) | JavaScript 배열·문자열, Perl | 유연성 최고 | 비효율(모든 속성이 동적), 오류 탐지 상실 |\n\n**세련화** (elaboration): 선언문이 실행 시간에 처리되어 기억장소를 할당하고 바인딩하는 것. 보통 함수 진입 시 일어남.\n\n> 함정: Java의 객체는 **명시적** 힙-동적 (new로 만듦, 해제는 GC가 묵시적으로). C++의 `static` 지역 변수는 영역은 지역이지만 생존 기간은 프로그램 전체 → 다음 레슨의 \"영역 vs 생존 기간\"과 연결.", "html": "<section class=\"sec\" id=\"s-lifetime-def\"><h3>할당 · 해제 · 생존 기간<\/h3><ul><li><b>할당<\/b> (allocation): 가용 메모리 풀에서 셀을 가져와 변수에 바인딩<\/li><li><b>해제<\/b> (deallocation): 바인딩을 끊고 셀을 풀로 돌려줌<\/li><li><b>생존 기간<\/b> (lifetime): 변수가 특정 메모리 셀에 바인딩되어 있는 시간<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-var-categories\"><h3>생존 기간에 따른 변수 4종류<\/h3><div class=\"tblw\"><table><thead><tr><th>종류<\/th><th>바인딩 시점<\/th><th>예<\/th><th>장점<\/th><th>단점<\/th><\/tr><\/thead><tbody><tr><td><b>정적<\/b> (static)<\/td><td>실행 <b>전<\/b>에 메모리에 바인딩, 종료까지 유지<\/td><td>C/C++ <code>static<\/code> 변수, 전역 변수<\/td><td>효율적(직접 주소 지정), <b>이력 민감<\/b>(history-sensitive) 부프로그램 지원<\/td><td>유연성↓, <b>재귀 불가<\/b>, 변수 간 저장 공간 공유 불가<\/td><\/tr><tr><td><b>스택-동적<\/b> (stack-dynamic)<\/td><td>선언문이 <b>세련화(elaboration)<\/b> 될 때(실행 시간) 바인딩. 타입은 정적<\/td><td>C/Java 메소드의 지역 변수<\/td><td><b>재귀<\/b> 지원, 부프로그램 간 메모리 공유<\/td><td>할당/해제 오버헤드, 간접 주소 지정, 이력 민감 X<\/td><\/tr><tr><td><b>명시적 힙-동적<\/b> (explicit heap-dynamic)<\/td><td>프로그래머가 <b>명시적 명령<\/b>(new/delete, malloc/free)으로 할당·해제. <b>포인터/참조<\/b>로만 접근<\/td><td>C++ <code>new int<\/code>, Java 객체<\/td><td>동적 자료 구조(연결 리스트, 트리)<\/td><td>포인터 사용이 어렵고 <b>신뢰성↓<\/b>, 힙 관리 비용<\/td><\/tr><tr><td><b>묵시적 힙-동적<\/b> (implicit heap-dynamic)<\/td><td><b>배정될 때<\/b> 힙에 할당 (모든 속성이 매번 새로 바인딩)<\/td><td>JavaScript 배열·문자열, Perl<\/td><td>유연성 최고<\/td><td>비효율(모든 속성이 동적), 오류 탐지 상실<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>세련화<\/b> (elaboration): 선언문이 실행 시간에 처리되어 기억장소를 할당하고 바인딩하는 것. 보통 함수 진입 시 일어남.<\/p>\n<div class=\"callout trap\">함정: Java의 객체는 <b>명시적<\/b> 힙-동적 (new로 만듦, 해제는 GC가 묵시적으로). C++의 <code>static<\/code> 지역 변수는 영역은 지역이지만 생존 기간은 프로그램 전체 → 다음 레슨의 \"영역 vs 생존 기간\"과 연결.<\/div><\/section>"}, {"id": "L7-4", "title": "정적 영역 · 블록 · 전역 영역", "src": "Sebesta 5.5.1–5.5.4", "secs": [{"id": "scope-terms", "title": "영역 기본 용어"}, {"id": "static-scope", "title": "정적 영역 (Static scoping)"}, {"id": "blocks", "title": "블록과 선언 순서"}, {"id": "global-scope", "title": "전역 영역"}, {"id": "static-scope-eval", "title": "정적 영역 평가"}], "md": "## 영역 기본 용어 {#scope-terms}\n\n- **영역** (scope): 변수가 **가시적인**(visible) 문장들의 범위. 문장에서 참조할 수 있으면 가시적.\n- **지역 변수** (local): 그 프로그램 단위/블록 안에서 선언된 변수\n- **비지역 변수** (nonlocal): 가시적이지만 그 단위 안에서 선언되지 않은 변수\n- **전역 변수** (global): 비지역 변수의 특수한 경우\n\n## 정적 영역 (Static scoping) {#static-scope}\n\n- 영역이 **프로그램 텍스트(구조)** 로 결정 → **실행 전**(컴파일 시간)에 결정 가능. ALGOL 60에서 도입.\n- 참조된 이름의 선언을 찾는 순서: **지역 → 정적 부모(static parent, 자신을 감싸는 단위) → 그 부모 → … → 전역**\n- **정적 조상** (static ancestors): 정적 부모들의 연쇄\n- 가까운 영역의 같은 이름이 바깥 선언을 **가린다** (hidden). C++은 `::x`로 가려진 전역 접근, Ada는 `unit.x`.\n\n예) (JavaScript, 함수 중첩)\n```\nfunction big() {\n    function sub1() {\n        var x = 7;\n        sub2();\n    }\n    function sub2() {\n        var y = x;     // 이 x는?\n    }\n    var x = 3;\n    sub1();\n}\n```\n정적 영역: sub2의 정적 부모는 **big** → `x`는 **big의 x (= 3)**. (sub1이 sub2를 호출했어도 상관없음)\n\n## 블록과 선언 순서 {#blocks}\n\n**블록** (block): 코드 중간에 새로운 정적 영역을 만드는 방법 (ALGOL 60). C 계열의 `{ }`.\n```\nvoid sub() {\n    int count;\n    while (...) {\n        int count;     // 바깥 count를 가림\n        count++;       // 안쪽 count\n    }\n    ...                // 바깥 count\n}\n```\n- C/C++: 중첩 블록에서 같은 이름 재선언 **허용**(가림). **Java, C#은 금지**(오류 가능성이 높아서).\n- 블록 안 변수는 보통 **스택-동적** (블록 진입 시 할당, 나올 때 해제).\n\n**선언 순서**: C99, C++, Java는 블록 어디서나 선언 가능 → 영역은 **선언부터 블록 끝까지**. C#은 블록 **어디서 선언하든 블록 전체**가 영역(단 사용 전에 선언돼야 함).\n`for (int i = 0; …)` 의 i: C++/Java/C#에서 영역은 **for문 안**으로 한정.\n\n**블록 가시성 문제 푸는 법** (24 중간 17번 유형): 각 지점에서 **안쪽 블록 → 바깥 블록** 순서로 선언을 찾되, 같은 이름은 **가장 안쪽 것만** 보인다. 이미 닫힌 블록의 변수는 안 보인다.\n\n## 전역 영역 {#global-scope}\n\n- C/C++/PHP/Python/JavaScript: 함수 바깥에 변수 정의를 둘 수 있음 → 전역.\n- C: **선언**(declaration, 타입·속성만, 기억장소 X: `extern int sum;`) vs **정의**(definition, 기억장소 할당).\n- PHP: 함수 안에서 전역 변수를 쓰려면 `global $x;` 또는 `$GLOBALS['x']`.\n- Python: 전역 변수를 함수 안에서 **배정**하려면 `global x` 선언 필요 (안 하면 지역 변수로 간주 → 배정 전 참조 시 오류).\n\n## 정적 영역 평가 {#static-scope-eval}\n\n대부분의 경우 잘 동작하지만:\n- 변수·부프로그램에 **필요 이상으로 많은 접근**이 허용됨\n- 프로그램이 진화하면서 초기 구조가 무너짐 → 전역 변수가 늘어나는 경향\n- 대안: **캡슐화 구조** (Ch.11)", "html": "<section class=\"sec\" id=\"s-scope-terms\"><h3>영역 기본 용어<\/h3><ul><li><b>영역<\/b> (scope): 변수가 <b>가시적인<\/b>(visible) 문장들의 범위. 문장에서 참조할 수 있으면 가시적.<\/li><li><b>지역 변수<\/b> (local): 그 프로그램 단위/블록 안에서 선언된 변수<\/li><li><b>비지역 변수<\/b> (nonlocal): 가시적이지만 그 단위 안에서 선언되지 않은 변수<\/li><li><b>전역 변수<\/b> (global): 비지역 변수의 특수한 경우<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-static-scope\"><h3>정적 영역 (Static scoping)<\/h3><ul><li>영역이 <b>프로그램 텍스트(구조)<\/b> 로 결정 → <b>실행 전<\/b>(컴파일 시간)에 결정 가능. ALGOL 60에서 도입.<\/li><li>참조된 이름의 선언을 찾는 순서: <b>지역 → 정적 부모(static parent, 자신을 감싸는 단위) → 그 부모 → … → 전역<\/b><\/li><li><b>정적 조상<\/b> (static ancestors): 정적 부모들의 연쇄<\/li><li>가까운 영역의 같은 이름이 바깥 선언을 <b>가린다<\/b> (hidden). C++은 <code>::x<\/code>로 가려진 전역 접근, Ada는 <code>unit.x<\/code>.<\/li><\/ul>\n<p>예) (JavaScript, 함수 중첩)<\/p>\n<pre class=\"code\">function big() {\n    function sub1() {\n        var x = 7;\n        sub2();\n    }\n    function sub2() {\n        var y = x;     // 이 x는?\n    }\n    var x = 3;\n    sub1();\n}<\/pre>\n<p>정적 영역: sub2의 정적 부모는 <b>big<\/b> → <code>x<\/code>는 <b>big의 x (= 3)<\/b>. (sub1이 sub2를 호출했어도 상관없음)<\/p><\/section>\n<section class=\"sec\" id=\"s-blocks\"><h3>블록과 선언 순서<\/h3><p><b>블록<\/b> (block): 코드 중간에 새로운 정적 영역을 만드는 방법 (ALGOL 60). C 계열의 <code>{ }<\/code>.<\/p>\n<pre class=\"code\">void sub() {\n    int count;\n    while (...) {\n        int count;     // 바깥 count를 가림\n        count++;       // 안쪽 count\n    }\n    ...                // 바깥 count\n}<\/pre>\n<ul><li>C/C++: 중첩 블록에서 같은 이름 재선언 <b>허용<\/b>(가림). <b>Java, C#은 금지<\/b>(오류 가능성이 높아서).<\/li><li>블록 안 변수는 보통 <b>스택-동적<\/b> (블록 진입 시 할당, 나올 때 해제).<\/li><\/ul>\n<p><b>선언 순서<\/b>: C99, C++, Java는 블록 어디서나 선언 가능 → 영역은 <b>선언부터 블록 끝까지<\/b>. C#은 블록 <b>어디서 선언하든 블록 전체<\/b>가 영역(단 사용 전에 선언돼야 함).<br><code>for (int i = 0; …)<\/code> 의 i: C++/Java/C#에서 영역은 <b>for문 안<\/b>으로 한정.<\/p>\n<p><b>블록 가시성 문제 푸는 법<\/b> (24 중간 17번 유형): 각 지점에서 <b>안쪽 블록 → 바깥 블록<\/b> 순서로 선언을 찾되, 같은 이름은 <b>가장 안쪽 것만<\/b> 보인다. 이미 닫힌 블록의 변수는 안 보인다.<\/p><\/section>\n<section class=\"sec\" id=\"s-global-scope\"><h3>전역 영역<\/h3><ul><li>C/C++/PHP/Python/JavaScript: 함수 바깥에 변수 정의를 둘 수 있음 → 전역.<\/li><li>C: <b>선언<\/b>(declaration, 타입·속성만, 기억장소 X: <code>extern int sum;<\/code>) vs <b>정의<\/b>(definition, 기억장소 할당).<\/li><li>PHP: 함수 안에서 전역 변수를 쓰려면 <code>global $x;<\/code> 또는 <code>$GLOBALS['x']<\/code>.<\/li><li>Python: 전역 변수를 함수 안에서 <b>배정<\/b>하려면 <code>global x<\/code> 선언 필요 (안 하면 지역 변수로 간주 → 배정 전 참조 시 오류).<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-static-scope-eval\"><h3>정적 영역 평가<\/h3><p>대부분의 경우 잘 동작하지만:<\/p>\n<ul><li>변수·부프로그램에 <b>필요 이상으로 많은 접근<\/b>이 허용됨<\/li><li>프로그램이 진화하면서 초기 구조가 무너짐 → 전역 변수가 늘어나는 경향<\/li><li>대안: <b>캡슐화 구조<\/b> (Ch.11)<\/li><\/ul><\/section>"}, {"id": "L7-5", "title": "동적 영역 · 영역 vs 생존 기간 · 참조 환경", "src": "Sebesta 5.5.5–5.8", "secs": [{"id": "dynamic-scope", "title": "동적 영역 (Dynamic scoping)"}, {"id": "scope-vs-lifetime", "title": "영역 vs 생존 기간"}, {"id": "ref-env", "title": "참조 환경"}, {"id": "named-const", "title": "이름 상수"}], "md": "## 동적 영역 (Dynamic scoping) {#dynamic-scope}\n\n- 영역이 프로그램 텍스트가 아니라 **부프로그램의 호출 순서**(calling sequence)로 결정 → **실행 시간**에만 결정 가능. (APL, SNOBOL4, 초기 LISP, Perl의 `local`)\n- 비지역 참조는 **가장 최근에 호출되어 아직 활성화된 부프로그램**부터 **호출 체인을 거꾸로** 따라가며 찾는다.\n\n앞 레슨의 big/sub1/sub2 예:\n- 호출 순서 big → sub1 → sub2 : sub2에 x 없음 → 호출자 **sub1의 x (= 7)**\n- 호출 순서 big → sub2 : sub2에 x 없음 → 호출자 **big의 x (= 3)**\n\n**동적 영역 가시성 푸는 법** (24 중간 18번 유형):\n1. 호출 체인의 **마지막 함수부터 main 쪽으로** 거슬러 올라가며\n2. 각 함수의 지역 변수를 적되, **이미 적은 이름은 건너뛴다** (가려짐)\n\n예) `main: var a, b;  sub1: var b, c;  sub2: var c, d;  sub3: var a, d, e`\nmain → sub1 → sub2 → sub3 일 때 마지막(sub3) 실행 중 가시 변수:\n```\nsub3: a, d, e           (sub3 것)\nsub2: c                 (d는 sub3이 가림)\nsub1: b                 (c는 이미 있음)\nmain: (a, b 다 가려짐) → 없음\n답: a(sub3), d(sub3), e(sub3), c(sub2), b(sub1)\n```\n\n동적 영역 평가:\n- 장점: **편리함** (호출된 부프로그램에 매개변수 없이 변수 전달)\n- 단점:\n  1. 부프로그램 실행 중 그 지역 변수가 **실행 중인 다른 모든 부프로그램에 보인다** → 신뢰성↓\n  2. 비지역 변수에 대한 **정적 타입 검사 불가능**\n  3. **판독성 나쁨**: 호출 순서를 알아야 참조 대상을 알 수 있음\n  4. 비지역 변수 접근이 정적 영역보다 **느림**\n\n## 영역 vs 생존 기간 {#scope-vs-lifetime}\n\n둘은 관련 있어 보이지만 **다른 개념**:\n- 영역 = **공간적**(텍스트) 개념, 생존 기간 = **시간적** 개념.\n\n```\nvoid someSub() {\n    static int count = 0;   // 영역: someSub 안 (지역)\n    ...                     // 생존 기간: 프로그램 실행 전체\n}\n```\n```\nvoid printheader() { ... }\nvoid compute() {\n    int sum;\n    printheader();          // printheader 실행 중 sum은 영역 밖(안 보임)\n}                           // 하지만 sum은 살아 있음(생존 기간 안)\n```\n\n## 참조 환경 {#ref-env}\n\n**참조 환경** (referencing environment): 어떤 문장에서 **가시적인 모든 이름의 집합**.\n- **정적 영역 언어**: 지역 변수 + **모든 정적 조상**의 가시 변수\n- **동적 영역 언어**: 지역 변수 + **현재 활성화된 모든 부프로그램**의 가시 변수\n- **활성화**(active) 부프로그램: 실행을 시작했지만 아직 종료하지 않은 부프로그램\n\n## 이름 상수 {#named-const}\n\n**이름 상수** (named constant): 값에 **한 번만** 바인딩되는 변수.\n- 장점: **판독성**(3.14159 대신 pi), **수정 용이성**(파라미터화: 상수 하나만 바꾸면 전체 반영)\n- 값 바인딩: 정적(컴파일 시간, C++ `const`에 상수식, C# `const`) 또는 동적(실행 시간에 변수 포함식으로 초기화 가능, Java `final`, C# `readonly`)", "html": "<section class=\"sec\" id=\"s-dynamic-scope\"><h3>동적 영역 (Dynamic scoping)<\/h3><ul><li>영역이 프로그램 텍스트가 아니라 <b>부프로그램의 호출 순서<\/b>(calling sequence)로 결정 → <b>실행 시간<\/b>에만 결정 가능. (APL, SNOBOL4, 초기 LISP, Perl의 <code>local<\/code>)<\/li><li>비지역 참조는 <b>가장 최근에 호출되어 아직 활성화된 부프로그램<\/b>부터 <b>호출 체인을 거꾸로<\/b> 따라가며 찾는다.<\/li><\/ul>\n<p>앞 레슨의 big/sub1/sub2 예:<\/p>\n<ul><li>호출 순서 big → sub1 → sub2 : sub2에 x 없음 → 호출자 <b>sub1의 x (= 7)<\/b><\/li><li>호출 순서 big → sub2 : sub2에 x 없음 → 호출자 <b>big의 x (= 3)<\/b><\/li><\/ul>\n<p><b>동적 영역 가시성 푸는 법<\/b> (24 중간 18번 유형):<\/p>\n<ol><li>호출 체인의 <b>마지막 함수부터 main 쪽으로<\/b> 거슬러 올라가며<\/li><li>각 함수의 지역 변수를 적되, <b>이미 적은 이름은 건너뛴다<\/b> (가려짐)<\/li><\/ol>\n<p>예) <code>main: var a, b;  sub1: var b, c;  sub2: var c, d;  sub3: var a, d, e<\/code><br>main → sub1 → sub2 → sub3 일 때 마지막(sub3) 실행 중 가시 변수:<\/p>\n<pre class=\"code\">sub3: a, d, e           (sub3 것)\nsub2: c                 (d는 sub3이 가림)\nsub1: b                 (c는 이미 있음)\nmain: (a, b 다 가려짐) → 없음\n답: a(sub3), d(sub3), e(sub3), c(sub2), b(sub1)<\/pre>\n<p>동적 영역 평가:<\/p>\n<ul><li>장점: <b>편리함<\/b> (호출된 부프로그램에 매개변수 없이 변수 전달)<\/li><li>단점:<ul><li>부프로그램 실행 중 그 지역 변수가 <b>실행 중인 다른 모든 부프로그램에 보인다<\/b> → 신뢰성↓<\/li><li>비지역 변수에 대한 <b>정적 타입 검사 불가능<\/b><\/li><li><b>판독성 나쁨<\/b>: 호출 순서를 알아야 참조 대상을 알 수 있음<\/li><li>비지역 변수 접근이 정적 영역보다 <b>느림<\/b><\/li><\/ul><\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-scope-vs-lifetime\"><h3>영역 vs 생존 기간<\/h3><p>둘은 관련 있어 보이지만 <b>다른 개념<\/b>:<\/p>\n<ul><li>영역 = <b>공간적<\/b>(텍스트) 개념, 생존 기간 = <b>시간적<\/b> 개념.<\/li><\/ul>\n<pre class=\"code\">void someSub() {\n    static int count = 0;   /
