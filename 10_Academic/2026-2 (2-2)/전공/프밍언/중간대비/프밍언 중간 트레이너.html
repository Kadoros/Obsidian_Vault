<meta charset="utf-8">
<title>프밍언 중간 트레이너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: grammar notebook — faint ruled paper, teal "derivation" accent, red-pen grading. Left course tree + right reading/quiz pane; stacks on phones. */
:root{
  --paper:#f2f5f5; --sheet:#ffffff; --ink:#152225; --muted:#56676b; --line:#d8e1e2;
  --rule:rgba(11,114,133,.06); --accent:#0b7285; --accent-weak:#e2f1f3; --accent-ink:#ffffff;
  --pen:#d1372b; --ok:#2b8a3e; --ok-weak:#e4f3e7; --warn:#a8670d; --warn-weak:#fbefd9; --bad:#c3352b; --bad-weak:#fbe6e4;
  --code-bg:#f0f4f4; --hl:#fff3bf;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-pen:"Nanum Pen Script","Apple SD Gothic Neo",cursive;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0d1416; --sheet:#141d20; --ink:#e3ecee; --muted:#93a6aa; --line:#24333a;
  --rule:rgba(102,205,222,.05); --accent:#5fc3d6; --accent-weak:#16303a; --accent-ink:#0d1416;
  --pen:#ff6d5f; --ok:#5cc278; --ok-weak:#15301d; --warn:#e2a84b; --warn-weak:#33270f; --bad:#ff6d5f; --bad-weak:#3a1a18;
  --code-bg:#10181b; --hl:#3a3410; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0d1416; --sheet:#141d20; --ink:#e3ecee; --muted:#93a6aa; --line:#24333a;
  --rule:rgba(102,205,222,.05); --accent:#5fc3d6; --accent-weak:#16303a; --accent-ink:#0d1416;
  --pen:#ff6d5f; --ok:#5cc278; --ok-weak:#15301d; --warn:#e2a84b; --warn-weak:#33270f; --bad:#ff6d5f; --bad-weak:#3a1a18;
  --code-bg:#10181b; --hl:#3a3410; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 28px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand .course{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{font-family:var(--f-mono);font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);color:var(--muted);white-space:nowrap}
.chip.dday{color:var(--pen);border-color:color-mix(in srgb,var(--pen) 40%,var(--line));font-weight:600}
.chip.live{color:var(--ok)} .chip.local{color:var(--warn)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font:inherit;font-size:14px;font-weight:500;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 12px 9px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.view{padding-top:20px}
h2{font-size:16px;margin:0 0 10px;font-weight:700;text-wrap:balance}
h3{font-size:15px;margin:0 0 8px;font-weight:700;text-wrap:balance}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .note{font-size:12.5px;color:var(--muted)} .err{font-size:13px;color:var(--bad)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
.btn{font:inherit;font-size:13.5px;font-weight:500;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.sm{font-size:12.5px;padding:4px 9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.st{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
.st.none{background:var(--line);color:var(--muted)} .st.weak{background:var(--bad-weak);color:var(--bad)}
.st.mid{background:var(--warn-weak);color:var(--warn)} .st.good{background:var(--ok-weak);color:var(--ok)}
.st.lock{background:none;color:var(--muted);border:1px dashed var(--line)}
.tag{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--accent-weak);color:var(--accent);font-weight:500}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
pre.code{margin:0;font-family:var(--f-mono);font-size:12.5px;line-height:1.55;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre}
code{font-family:var(--f-mono);font-size:.88em;background:var(--code-bg);border:1px solid var(--line);border-radius:4px;padding:0 4px}
select,input[type=text]{font:inherit;font-size:13.5px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);max-width:100%}
textarea{width:100%;min-height:150px;font-family:var(--f-mono);font-size:13px;line-height:1.55;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);resize:vertical}
/* learn layout */
.learn{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.learn{grid-template-columns:minmax(0,1fr)}}
.tree{position:sticky;top:118px;max-height:calc(100vh - 140px);overflow:auto;padding:10px 0}
@media (max-width:900px){.tree{position:static;max-height:none}}
.tree details{border-bottom:1px solid var(--line)} .tree details:last-child{border-bottom:0}
.tree summary{list-style:none;cursor:pointer;padding:9px 14px;display:flex;flex-direction:column;gap:4px}
.tree summary::-webkit-details-marker{display:none}
.tree .ut{font-size:13.5px;font-weight:600;line-height:1.35}
.ubar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}.ubar>b{display:block;height:100%;background:var(--accent)}
.lrow{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:6px 14px 6px 18px;border:0;background:none;color:inherit;font:inherit;font-size:13px;text-align:left;cursor:pointer;line-height:1.35}
.lrow:hover{background:var(--accent-weak)} .lrow.cur{background:var(--accent-weak);box-shadow:inset 3px 0 0 var(--accent)}
.lrow[disabled]{cursor:not-allowed;opacity:.55}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.dot.done{background:var(--ok);border-color:var(--ok)} .dot.weak{background:var(--bad-weak);border-color:var(--bad)} .dot.cur{border-color:var(--accent)}
.lnum{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
/* reader */
.reader{padding:22px 26px;min-width:0}
@media (max-width:600px){.reader{padding:16px}}
.rhead{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.rhead h2{font-size:21px;margin:0}
.body{max-width:72ch}
.sec{padding:14px 0 6px;border-bottom:1px dashed var(--line);scroll-margin-top:130px}
.sec:last-child{border-bottom:0}
.sec h3{font-size:16.5px;margin:0 0 10px;display:flex;gap:8px;align-items:baseline}
.sec h3::before{content:"§";font-family:var(--f-mono);color:var(--accent);font-weight:600}
.sec.review{background:linear-gradient(90deg,var(--hl),transparent 85%);margin-inline:-14px;padding-inline:14px;border-radius:8px}
.sec p,.sec ul,.sec ol{margin:0 0 10px} .sec ul,.sec ol{padding-left:20px} .sec li{margin:2px 0}
.sec .sub{font-size:14px;color:var(--muted)}
.sec pre.code{margin:4px 0 12px}
.tblw{overflow-x:auto;margin:4px 0 12px}
.tblw table{border-collapse:collapse;font-size:13.5px;min-width:100%}
.tblw th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:7px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.tblw td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.callout{font-size:14px;background:var(--accent-weak);border-radius:8px;padding:9px 12px;margin:4px 0 12px}
.callout.exam{background:var(--warn-weak)} .callout.exam::before{content:"시험 ";font-weight:700;color:var(--warn)}
.callout.trap{background:var(--bad-weak)}
.callout.prof{background:var(--sheet);border:1px solid var(--line);border-left:3px solid var(--accent)} .callout.prof b{color:var(--accent)} .callout.prof .src{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.rfoot{margin-top:20px;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-weak);border-radius:var(--r)}
.banner{position:sticky;top:112px;z-index:4;margin-bottom:14px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--warn-weak);border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-radius:var(--r);font-size:13.5px}
/* quiz */
.qwrap{padding:20px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:600px){.qwrap{padding:16px}}
.qtop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.pips{display:flex;gap:4px}.pips i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--accent)} .pips i.ok{background:var(--ok)} .pips i.no{background:var(--bad)}
.prompt{font-size:15.5px;white-space:pre-wrap;max-width:75ch}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{font:inherit;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);cursor:pointer;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
.choice:hover{border-color:var(--accent)} .choice.sel{border-color:var(--accent);background:var(--accent-weak)}
.choice.right{border-color:var(--ok);background:var(--ok-weak)} .choice.wrongc{border-color:var(--bad);background:var(--bad-weak)}
.choice .k{font-family:var(--f-mono);color:var(--muted)}
.ox{display:flex;gap:10px}.ox .choice{grid-template-columns:1fr;text-align:center;font-size:22px;font-weight:700;min-width:90px}
.blanks{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;align-items:center;max-width:520px}
.blanks label{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.result{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.mark{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pen{font-family:var(--f-pen);color:var(--pen);font-size:44px;line-height:1;transform:rotate(-4deg);display:inline-block;min-width:60px}
.pen small{font-size:26px}
.fb{font-size:14px;max-width:70ch}
.missed{margin:0;padding-left:18px;font-size:13.5px;color:var(--bad)}
.tip{font-size:13.5px;background:var(--warn-weak);border-radius:8px;padding:9px 12px;max-width:75ch;white-space:pre-wrap}
.tip b{color:var(--warn)}
.goto{font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sumrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sumrow:last-child{border-bottom:0}
.revcard{padding:14px 16px;display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--bad)}
/* home */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.stat{padding:12px 14px}.stat .v{font-family:var(--f-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}.stat .s{font-size:12px;color:var(--muted)}
.cta{padding:18px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:20px}
.cta .t{font-size:17px;font-weight:700}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ucard{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.ucard .ul{display:flex;flex-direction:column}
.ucard .li{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding:5px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font-family:inherit;text-align:left;cursor:pointer}
.ucard .li[disabled]{cursor:not-allowed;opacity:.55}
.weaklist{display:flex;flex-direction:column}
.wk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.wk:last-child{border-bottom:0}
/* practice etc */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.practice{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.practice{grid-template-columns:minmax(0,1fr)}}
.qlist{max-height:calc(100vh - 220px);overflow:auto;position:sticky;top:118px}
@media (max-width:900px){.qlist{max-height:260px;position:static}}
.qrow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:8px 12px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.qrow:hover{background:var(--accent-weak)} .qrow.cur{background:var(--accent-weak);box-shadow:inset 3px 0 0 var(--accent)}
.qrow .t{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd{width:9px;height:9px;border-radius:50%;background:var(--line)}
.sd.good{background:var(--ok)} .sd.mid{background:var(--warn)} .sd.weak{background:var(--bad)}
.yr{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.mockhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;margin-bottom:14px;position:sticky;top:112px;z-index:3}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}.timer.low{color:var(--pen)}
.mockq{margin-bottom:12px}
.chart{width:100%;height:auto;display:block}
.hist{width:100%;border-collapse:collapse;font-size:13px}
.hist td,.hist th{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
.hist th{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:700px){.cols{grid-template-columns:minmax(0,1fr)}}
.cols pre{white-space:pre-wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
figure.slide{margin:6px 0 14px;display:flex;flex-direction:column;gap:6px}
figure.slide .zoom{padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:zoom-in;overflow:hidden;display:block;max-width:100%}
figure.slide img{display:block;width:100%;height:auto}
figure.slide figcaption{font-size:12.5px;color:var(--muted)}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(8,14,16,.86);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px;background:#fff}
.lightbox .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:14px;font:inherit;font-size:13px;color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 10px;cursor:pointer}
.tbl-wrap{overflow-x:auto}
table.topics{width:100%;border-collapse:collapse;font-size:13.5px}
table.topics th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:10px 10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.topics td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.topics tr.ugrp td{background:var(--code-bg);font-weight:600;font-size:12.5px;color:var(--muted)}
table.topics tr.dim td{opacity:.55}
.tname{font-weight:500}.tsub{font-size:11.5px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:70px}.bar>b{display:block;height:100%;background:var(--accent);border-radius:4px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.pts{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--warn-weak);color:var(--warn);white-space:nowrap}
.recs{display:flex;flex-direction:column}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;font:inherit;color:inherit;text-align:left;width:100%}
.rec:last-child{border-bottom:0}.rec:hover{background:var(--accent-weak)}
.rec .q{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.why{font-size:11.5px;color:var(--muted);white-space:nowrap}
.prev{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.prev.ok{background:var(--ok-weak);color:var(--ok)} .prev.no{background:var(--bad-weak);color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>프밍언 중간 트레이너</h1>
      <div class="chips" hidden>
        <span class="chip dday" id="dday">중간고사 8주차 (10/20 주)</span>
        <span class="chip" id="store">저장소 연결 중…</span>
        <span class="chip" id="grader">채점: 확인 중…</span>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-v="dash" aria-selected="false">대시보드</button>
      <button role="tab" data-v="learn" aria-selected="true">학습</button>
      <button role="tab" data-v="practice" aria-selected="false">문제 풀기</button>
      <button role="tab" data-v="mock" aria-selected="false">모의고사</button>
      <button role="tab" data-v="wrong" aria-selected="false">오답노트</button>
      <button role="tab" data-v="hist" aria-selected="false">기록</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-dash" hidden></section>
  <section class="view" id="v-learn"></section>
  <section class="view" id="v-practice" hidden></section>
  <section class="view" id="v-mock" hidden></section>
  <section class="view" id="v-wrong" hidden></section>

<script id="pl-data" type="application/json">{"units": [{"id": "U1", "title": "Ch.1 기본사항 (Preliminaries)", "src": "L02 Preliminaries.pdf", "intro": "언어를 \"평가\"하는 기준과 언어를 \"구현\"하는 방법. 서술형 3점짜리가 여기서 줄줄이 나와. 영어 용어 ↔ 한글 용어(판독성·작성력·신뢰성·비용)를 짝으로 외워.", "lessons": [{"id": "L1-1", "title": "왜 언어론을 배우나 · 프로그래밍 도메인", "src": "L02 p.3–7", "secs": [{"id": "why", "title": "언어 개념을 공부하는 이유"}, {"id": "domain", "title": "프로그래밍 도메인"}], "md": "## 언어 개념을 공부하는 이유 {#why}\n\n교안에 6+2개가 나와. 시험에 통째로 나올 확률은 낮지만, 키워드는 알아둬.\n\n- **표현 능력 증가** (Increased ability to express ideas): 아는 언어가 생각의 한계를 정한다. 다른 언어의 기능을 알면 지금 언어에서도 흉내 낼 수 있다.\n- **적절한 언어 선택 능력** (Improved background for choosing appropriate languages)\n- **새 언어 학습 능력 증가** (Increased ability to learn new languages)\n- **구현의 중요성 이해** (Better understanding of significance of implementation): 구현을 알면 언어가 *왜* 그렇게 설계됐는지 보이고, 더 효율적으로 쓴다.\n- **이미 아는 언어를 더 잘 쓰기** (Better use of languages already known)\n- **컴퓨팅 전반의 발전** (Overall advancement of computing)\n- (추가) 언어 설계·컴파일러 구조에 대한 깊은 이해, 코드 유지보수성 향상\n\n> 한 줄 요약(교안 Summary): 다양한 구문을 쓰는 능력↑, 언어를 똑똑하게 고름, 새 언어 배우기 쉬움.\n\n## 프로그래밍 도메인 {#domain}\n\n도메인 ↔ 대표 언어 ↔ 핵심 특징을 한 세트로 외우면 돼.\n\n| 도메인 | 대표 언어 | 특징 |\n|---|---|---|\n| 과학 응용 (Scientific) | **Fortran** (FORmula TRANslation) | 대량의 부동소수점 계산, 배열 |\n| 사무 응용 (Business) | **COBOL** | 보고서 생성, 십진수·문자 처리 |\n| 인공지능 (AI) | **LISP** (LISt Processing) | 숫자보다 기호(symbol) 처리, 연결 리스트, 코드=데이터(homoiconicity) |\n| 시스템 프로그래밍 | **C** | 계속 실행되므로 효율이 중요 |\n| 웹 소프트웨어 | HTML, PHP, Java 등 | 마크업 + 스크립팅 + 범용 언어의 잡다한 조합 |\n\n> 함정: LISP의 핵심은 \"기호 처리 + 리스트\". 수치 계산 = Fortran, 십진수 = COBOL.", "html": "<section class=\"sec\" id=\"s-why\"><h3>언어 개념을 공부하는 이유<\/h3><p>교안에 6+2개가 나와. 시험에 통째로 나올 확률은 낮지만, 키워드는 알아둬.<\/p>\n<ul><li><b>표현 능력 증가<\/b> (Increased ability to express ideas): 아는 언어가 생각의 한계를 정한다. 다른 언어의 기능을 알면 지금 언어에서도 흉내 낼 수 있다.<\/li><li><b>적절한 언어 선택 능력<\/b> (Improved background for choosing appropriate languages)<\/li><li><b>새 언어 학습 능력 증가<\/b> (Increased ability to learn new languages)<\/li><li><b>구현의 중요성 이해<\/b> (Better understanding of significance of implementation): 구현을 알면 언어가 *왜* 그렇게 설계됐는지 보이고, 더 효율적으로 쓴다.<\/li><li><b>이미 아는 언어를 더 잘 쓰기<\/b> (Better use of languages already known)<\/li><li><b>컴퓨팅 전반의 발전<\/b> (Overall advancement of computing)<\/li><li>(추가) 언어 설계·컴파일러 구조에 대한 깊은 이해, 코드 유지보수성 향상<\/li><\/ul>\n<div class=\"callout\">한 줄 요약(교안 Summary): 다양한 구문을 쓰는 능력↑, 언어를 똑똑하게 고름, 새 언어 배우기 쉬움.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">02주-1<\/span><br>생성형 AI 시대라 코드를 정확히 '읽고 분석하는' 능력이 더 중요해졌다고 강조. 구현 이해의 예로 C 2차원 배열을 들었음: C는 행 우선(row-major)이라 행 순서로 돌면 연속된 메모리를 캐시로 읽어 빠르고, 열 순서로 돌면 메모리를 더 자주 읽어 느리다.<\/div><\/section>\n<section class=\"sec\" id=\"s-domain\"><h3>프로그래밍 도메인<\/h3><p>도메인 ↔ 대표 언어 ↔ 핵심 특징을 한 세트로 외우면 돼.<\/p>\n<div class=\"tblw\"><table><thead><tr><th>도메인<\/th><th>대표 언어<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>과학 응용 (Scientific)<\/td><td><b>Fortran<\/b> (FORmula TRANslation)<\/td><td>대량의 부동소수점 계산, 배열<\/td><\/tr><tr><td>사무 응용 (Business)<\/td><td><b>COBOL<\/b><\/td><td>보고서 생성, 십진수·문자 처리<\/td><\/tr><tr><td>인공지능 (AI)<\/td><td><b>LISP<\/b> (LISt Processing)<\/td><td>숫자보다 기호(symbol) 처리, 연결 리스트, 코드=데이터(homoiconicity)<\/td><\/tr><tr><td>시스템 프로그래밍<\/td><td><b>C<\/b><\/td><td>계속 실행되므로 효율이 중요<\/td><\/tr><tr><td>웹 소프트웨어<\/td><td>HTML, PHP, Java 등<\/td><td>마크업 + 스크립팅 + 범용 언어의 잡다한 조합<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout trap\">함정: LISP의 핵심은 \"기호 처리 + 리스트\". 수치 계산 = Fortran, 십진수 = COBOL.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">02주-1<\/span><br>COBOL: 부동소수점은 근사치인데, COBOL은 십진수를 자리별로 그대로 인코딩해서 정확하게 다룬다 (사무용이라 돈 계산이 정확해야 함). LISP의 동형성: (A B C D) 같은 리스트가 데이터일 수도 있고 코드(함수 호출)일 수도 있어서, 코드로 코드를 만들 수 있다. 시스템 프로그래밍: C는 배열 범위를 실행 시간에 검사하지 않아 오버헤드가 없다 (Java는 검사함).<\/div><\/section>"}, {"id": "L1-2", "title": "평가 기준 ① 판독성", "src": "L02 p.8–13", "secs": [{"id": "criteria", "title": "언어 평가 기준 4가지"}, {"id": "read-why", "title": "판독성이 왜 중요해졌나"}, {"id": "simplicity", "title": "전반적 단순성 (Overall simplicity)"}, {"id": "orthogonality", "title": "직교성 (Orthogonality)"}, {"id": "syntax-design", "title": "데이터 타입과 구문 설계"}], "md": "## 언어 평가 기준 4가지 {#criteria}\n\n| 기준 | 한글 | 한 줄 정의 |\n|---|---|---|\n| Readability | **판독성** | 프로그램을 얼마나 쉽게 읽고 이해할 수 있나 |\n| Writability | **작성력** | 주어진 도메인의 프로그램을 얼마나 쉽게 작성할 수 있나 |\n| Reliability | **신뢰성** | 모든 조건에서 명세대로 동작하나 (conformance to specifications) |\n| Cost | **비용** | 교육·작성·컴파일·실행·유지보수 등의 총비용 |\n\n> 시험 포인트: 24 중간 1번이 정확히 \"평가 기준 4가지와 각 기준을 간략히\". 정의 한 줄씩만 쓰면 3점.\n\n교안 표(p.9)의 관계: **단순성, 직교성, 데이터 타입, 구문 설계**는 판독성·작성력·신뢰성에 모두 영향. **추상화 지원, 표현력**은 작성력·신뢰성. **타입 검사, 예외 처리, 제한된 별칭**은 신뢰성만.\n\n## 판독성이 왜 중요해졌나 {#read-why}\n\n- 유지보수가 SW 생명주기의 큰 부분으로 인식됨 → 유지보수 용이성은 판독성이 좌우.\n- 관점이 **기계 중심 → 사람 중심**으로 바뀜.\n- 판독성은 그 언어의 문제 도메인 맥락에서 판단해야 한다.\n\n## 전반적 단순성 (Overall simplicity) {#simplicity}\n\n기능·구조가 적은 언어가 읽기 쉽다. 단순성을 해치는 두 가지:\n\n- **특징 다중성** (feature multiplicity): 같은 일을 하는 방법이 여러 개.\n  예) `cnt = cnt + 1;` `cnt += 1;` `cnt++;` `++cnt;`\n- **연산자 중복** (operator overloading): 하나의 연산자 기호가 여러 의미.\n\n## 직교성 (Orthogonality) {#orthogonality}\n\n**적은 수의 기본 구조를 조합한 모든 경우가 합법적이고 의미가 있는 성질.**\n직교성↑ → 규칙의 예외↓ → 규칙성↑ → 배우기·읽기 쉬움.\n\nC의 비직교적 예:\n- 구조체(record)는 함수에서 반환할 수 있지만 배열은 못 한다.\n- 배열 원소는 void나 함수를 제외한 모든 타입이 될 수 있다.\n\n직교적 예: VAX의 `ADDL op1, op2` (피연산자가 레지스터든 메모리든 다 됨).\n\n**너무 많은 직교성도 문제**: 모든 것이 값을 갖는 식이 되면\n```\nx := (if a > b then a := b else b := a fi);\n```\n같은 이상한 조합도 합법이 되어 오히려 읽기 어렵고, 오류가 안 잡힌다.\n\n> 시험 포인트: \"직교성이란?\" → \"적은 기본 구조들의 모든 조합이 합법적이고 의미 있음\" + C 배열 반환 불가 예.\n\n## 데이터 타입과 구문 설계 {#syntax-design}\n\n**데이터 타입**: 타입·자료구조를 정의할 충분한 장치가 있으면 읽기 쉽다.\n예) Boolean이 없으면 `timeOut = 1` (뭔 뜻?) vs `timeOut = false` (명확). C89엔 bool이 없었고 C99의 `stdbool.h`에서 생김.\n\n**구문 설계**가 판독성에 주는 영향 3가지:\n- **특수어** (special words): `while`, `for` 같은 단어. 복합문 형성 방법도 포함 (C는 `{}`, Ada는 `end if`, `end loop` → Ada가 더 읽기 쉬움).\n- **형식과 의미** (form and meaning): 의미가 형식(구문)에서 바로 드러나야 한다.\n  반례: C의 `static`은 위치에 따라 의미가 다르다. 함수 안 → 컴파일 시간에 생성(호출마다 새로 안 생김). 함수 밖 → 그 파일에서만 보임.", "html": "<section class=\"sec\" id=\"s-criteria\"><h3>언어 평가 기준 4가지<\/h3><div class=\"tblw\"><table><thead><tr><th>기준<\/th><th>한글<\/th><th>한 줄 정의<\/th><\/tr><\/thead><tbody><tr><td>Readability<\/td><td><b>판독성<\/b><\/td><td>프로그램을 얼마나 쉽게 읽고 이해할 수 있나<\/td><\/tr><tr><td>Writability<\/td><td><b>작성력<\/b><\/td><td>주어진 도메인의 프로그램을 얼마나 쉽게 작성할 수 있나<\/td><\/tr><tr><td>Reliability<\/td><td><b>신뢰성<\/b><\/td><td>모든 조건에서 명세대로 동작하나 (conformance to specifications)<\/td><\/tr><tr><td>Cost<\/td><td><b>비용<\/b><\/td><td>교육·작성·컴파일·실행·유지보수 등의 총비용<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout exam\">시험 포인트: 24 중간 1번이 정확히 \"평가 기준 4가지와 각 기준을 간략히\". 정의 한 줄씩만 쓰면 3점.<\/div>\n<p>교안 표(p.9)의 관계: <b>단순성, 직교성, 데이터 타입, 구문 설계<\/b>는 판독성·작성력·신뢰성에 모두 영향. <b>추상화 지원, 표현력<\/b>은 작성력·신뢰성. <b>타입 검사, 예외 처리, 제한된 별칭<\/b>은 신뢰성만.<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">02주-1<\/span><br>평가 기준은 언어를 쓰는 목적(도메인)에 따라 달라진다고 강조. 예: GUI 코딩엔 Visual Basic이 편하고, 시스템 프로그래밍에 Python은 실행 오버헤드 때문에 고르지 않는다. 4가지 중 앞의 3개(판독성·작성력·신뢰성)가 언어 특성과 직접 연결되는 기준이다.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L02-p9.jpg\" aria-label=\"크게 보기\"><img src=\"img/L02-p9.jpg\" alt=\"L02 p.9 · 언어 평가 기준과 영향을 주는 특성 (표 1.1)\" loading=\"lazy\"><\/button><figcaption>L02 p.9 · 언어 평가 기준과 영향을 주는 특성 (표 1.1)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-read-why\"><h3>판독성이 왜 중요해졌나<\/h3><ul><li>유지보수가 SW 생명주기의 큰 부분으로 인식됨 → 유지보수 용이성은 판독성이 좌우.<\/li><li>관점이 <b>기계 중심 → 사람 중심<\/b>으로 바뀜.<\/li><li>판독성은 그 언어의 문제 도메인 맥락에서 판단해야 한다.<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-simplicity\"><h3>전반적 단순성 (Overall simplicity)<\/h3><p>기능·구조가 적은 언어가 읽기 쉽다. 단순성을 해치는 두 가지:<\/p>\n<ul><li><b>특징 다중성<\/b> (feature multiplicity): 같은 일을 하는 방법이 여러 개.<div class=\"sub\">예) <code>cnt = cnt + 1;<\/code> <code>cnt += 1;<\/code> <code>cnt++;<\/code> <code>++cnt;<\/code><\/div><\/li><li><b>연산자 중복<\/b> (operator overloading): 하나의 연산자 기호가 여러 의미.<\/li><\/ul><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">02주-1<\/span><br>판독성에 가장 큰 영향을 주는 게 전반적 단순성. 언어가 크면 사람마다 아는 부분집합이 달라서 남이 쓴 코드를 이해하기 어렵다. 연산자 중복 예: C의 &amp;는 비트 AND이면서 주소 연산자, +는 정수+정수와 실수+실수에서 실제 연산이 다름, C++에서 벡터에 + 를 오버로딩해 이상하게 쓰면 읽기 어려워짐.<\/div><\/section>\n<section class=\"sec\" id=\"s-orthogonality\"><h3>직교성 (Orthogonality)<\/h3><p><b>적은 수의 기본 구조를 조합한 모든 경우가 합법적이고 의미가 있는 성질.<\/b><br>직교성↑ → 규칙의 예외↓ → 규칙성↑ → 배우기·읽기 쉬움.<\/p>\n<p>C의 비직교적 예:<\/p>\n<ul><li>구조체(record)는 함수에서 반환할 수 있지만 배열은 못 한다.<\/li><li>배열 원소는 void나 함수를 제외한 모든 타입이 될 수 있다.<\/li><\/ul>\n<p>직교적 예: VAX의 <code>ADDL op1, op2<\/code> (피연산자가 레지스터든 메모리든 다 됨).<\/p>\n<p><b>너무 많은 직교성도 문제<\/b>: 모든 것이 값을 갖는 식이 되면<\/p>\n<pre class=\"code\">x := (if a &gt; b then a := b else b := a fi);<\/pre>\n<p>같은 이상한 조합도 합법이 되어 오히려 읽기 어렵고, 오류가 안 잡힌다.<\/p>\n<div class=\"callout exam\">시험 포인트: \"직교성이란?\" → \"적은 기본 구조들의 모든 조합이 합법적이고 의미 있음\" + C 배열 반환 불가 예.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">02주-1<\/span><br>좌표축(x, y가 서로 독립이라 아무 조합이나 가능)에 비유. VAX의 ADDL은 레지스터·메모리 모든 조합을 한 명령으로 지원(직교적)인데, IBM 계열은 레지스터+메모리, 레지스터+레지스터를 다른 명령(A, AR)으로 나눠야 해서 예외가 생긴다(비직교적). C에서 구조체는 반환되지만 배열은 안 되는 것도 '예외'의 예.<\/div><\/section>\n<section class=\"sec\" id=\"s-syntax-design\"><h3>데이터 타입과 구문 설계<\/h3><p><b>데이터 타입<\/b>: 타입·자료구조를 정의할 충분한 장치가 있으면 읽기 쉽다.<br>예) Boolean이 없으면 <code>timeOut = 1<\/code> (뭔 뜻?) vs <code>timeOut = false<\/code> (명확). C89엔 bool이 없었고 C99의 <code>stdbool.h<\/code>에서 생김.<\/p>\n<p><b>구문 설계<\/b>가 판독성에 주는 영향 3가지:<\/p>\n<ul><li><b>특수어<\/b> (special words): <code>while<\/code>, <code>for<\/code> 같은 단어. 복합문 형성 방법도 포함 (C는 <code>{}<\/code>, Ada는 <code>end if<\/code>, <code>end loop<\/code> → Ada가 더 읽기 쉬움).<\/li><li><b>형식과 의미<\/b> (form and meaning): 의미가 형식(구문)에서 바로 드러나야 한다.<div class=\"sub\">반례: C의 <code>static<\/code>은 위치에 따라 의미가 다르다. 함수 안 → 컴파일 시간에 생성(호출마다 새로 안 생김). 함수 밖 → 그 파일에서만 보임.<\/div><\/li><\/ul><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">02주-1<\/span><br>C의 static: 함수 안에 선언하면 다시 호출돼도 값이 유지되고, 함수 밖에 선언하면 그 파일 안에서만 보인다. 같은 예약어가 위치에 따라 뜻이 달라서 '형식과 의미' 원칙 위반.<\/div><\/section>"}, {"id": "L1-3", "title": "평가 기준 ② 작성력 · 신뢰성 · 비용", "src": "L02 p.14–18", "secs": [{"id": "writability", "title": "작성력 (Writability)"}, {"id": "reliability", "title": "신뢰성 (Reliability)"}, {"id": "cost", "title": "비용 (Cost)"}, {"id": "other-criteria", "title": "기타 기준"}], "md": "## 작성력 (Writability) {#writability}\n\n판독성에 영향 주는 특성 대부분이 작성력에도 영향. 도메인 맥락 중요.\n\n- **단순성과 직교성**: 적은 기본 구조 + 적은 조합 규칙. 장점: 단순한 집합만 배우면 됨. 단점: 직교성이 너무 크면 오류가 탐지 안 됨.\n- **추상화 지원**: 세부를 무시하고 복잡한 구조를 정의·사용.\n- **표현력** (Expressivity): 강력한 연산자로 작은 프로그램이 많은 계산을 함. 예) APL의 `A+.×B`, C의 `count++`가 `count = count + 1`보다 편함.\n\n## 신뢰성 (Reliability) {#reliability}\n\n모든 조건에서 명세대로 수행하면 신뢰성이 있다. 영향 주는 특성:\n\n- **타입 검사** (type checking): 오류는 일찍 발견할수록 고치는 비용이 싸다. 컴파일 시간 검사 > 실행 시간 검사. Java는 거의 모든 변수·식의 타입을 컴파일 시간에 검사.\n- **예외 처리** (exception handling): 실행 시간 오류를 가로채 시정 조치.\n- **별칭** (aliasing): 같은 메모리 위치를 두 개 이상의 이름(참조 방법)으로 접근 → 신뢰성 저하.\n- **판독성과 작성력**: 읽고 쓰기 쉬울수록 맞게 짤 가능성이 높다.\n\n> 함정: \"별칭\"은 신뢰성을 *낮추는* 요인. 별칭 = 같은 메모리 셀에 대한 둘 이상의 참조 방법.\n\n## 비용 (Cost) {#cost}\n\n1. 프로그래머 교육 비용\n2. 프로그램 작성 비용\n3. 컴파일 비용\n4. 실행 비용 (최적화 정도와 trade-off)\n5. 언어 구현 시스템 비용\n6. 신뢰성 부족에 따른 비용 (예: 핵발전소, Mars Pathfinder 우선순위 역전)\n7. **유지보수 비용** (수정 + 기능 추가)\n\n## 기타 기준 {#other-criteria}\n\n- **이식성** (Portability): 한 구현에서 다른 구현으로 옮기기 쉬움. 표준화 정도가 가장 큰 영향.\n- **일반성** (Generality): 넓은 범위의 응용에 적용 가능.\n- **분명성** (Well-definedness): 공식 정의의 완전성과 정밀성.", "html": "<section class=\"sec\" id=\"s-writability\"><h3>작성력 (Writability)<\/h3><p>판독성에 영향 주는 특성 대부분이 작성력에도 영향. 도메인 맥락 중요.<\/p>\n<ul><li><b>단순성과 직교성<\/b>: 적은 기본 구조 + 적은 조합 규칙. 장점: 단순한 집합만 배우면 됨. 단점: 직교성이 너무 크면 오류가 탐지 안 됨.<\/li><li><b>추상화 지원<\/b>: 세부를 무시하고 복잡한 구조를 정의·사용.<\/li><li><b>표현력<\/b> (Expressivity): 강력한 연산자로 작은 프로그램이 많은 계산을 함. 예) APL의 <code>A+.×B<\/code>, C의 <code>count++<\/code>가 <code>count = count + 1<\/code>보다 편함.<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-reliability\"><h3>신뢰성 (Reliability)<\/h3><p>모든 조건에서 명세대로 수행하면 신뢰성이 있다. 영향 주는 특성:<\/p>\n<ul><li><b>타입 검사<\/b> (type checking): 오류는 일찍 발견할수록 고치는 비용이 싸다. 컴파일 시간 검사 &gt; 실행 시간 검사. Java는 거의 모든 변수·식의 타입을 컴파일 시간에 검사.<\/li><li><b>예외 처리<\/b> (exception handling): 실행 시간 오류를 가로채 시정 조치.<\/li><li><b>별칭<\/b> (aliasing): 같은 메모리 위치를 두 개 이상의 이름(참조 방법)으로 접근 → 신뢰성 저하.<\/li><li><b>판독성과 작성력<\/b>: 읽고 쓰기 쉬울수록 맞게 짤 가능성이 높다.<\/li><\/ul>\n<div class=\"callout trap\">함정: \"별칭\"은 신뢰성을 *낮추는* 요인. 별칭 = 같은 메모리 셀에 대한 둘 이상의 참조 방법.<\/div><\/section>\n<section class=\"sec\" id=\"s-cost\"><h3>비용 (Cost)<\/h3><ol><li>프로그래머 교육 비용<\/li><li>프로그램 작성 비용<\/li><li>컴파일 비용<\/li><li>실행 비용 (최적화 정도와 trade-off)<\/li><li>언어 구현 시스템 비용<\/li><li>신뢰성 부족에 따른 비용 (예: 핵발전소, Mars Pathfinder 우선순위 역전)<\/li><li><b>유지보수 비용<\/b> (수정 + 기능 추가)<\/li><\/ol><\/section>\n<section class=\"sec\" id=\"s-other-criteria\"><h3>기타 기준<\/h3><ul><li><b>이식성<\/b> (Portability): 한 구현에서 다른 구현으로 옮기기 쉬움. 표준화 정도가 가장 큰 영향.<\/li><li><b>일반성<\/b> (Generality): 넓은 범위의 응용에 적용 가능.<\/li><li><b>분명성<\/b> (Well-definedness): 공식 정의의 완전성과 정밀성.<\/li><\/ul><\/section>"}, {"id": "L1-4", "title": "설계에 대한 영향 · 언어 범주 · 설계 절충", "src": "L02 p.19–27", "secs": [{"id": "influences", "title": "언어 설계에 영향을 준 두 요인"}, {"id": "categories", "title": "언어 범주"}, {"id": "tradeoffs", "title": "언어 설계 절충 (Trade-offs)"}], "md": "## 언어 설계에 영향을 준 두 요인 {#influences}\n\n1. **컴퓨터 구조** (폰 노이만 구조) → **명령형 언어**\n2. **프로그래밍 설계 방법론** → 새 패러다임\n\n**폰 노이만 구조**: 데이터와 프로그램이 같은 메모리에, 메모리는 CPU와 분리, 명령어·데이터가 메모리→CPU로 파이프됨.\n명령형 언어와의 대응:\n- **변수** ↔ 메모리 셀\n- **배정문** ↔ 파이핑(데이터 이동)\n- **반복** 이 효율적 (명령어가 인접 메모리에 있으므로)\n\n**폰 노이만 병목**: 메모리↔CPU 버스 전송 속도가 명령 실행 속도보다 느려서 컴퓨터 속도의 주된 제한 요인이 됨.\n\n**Fetch-execute cycle**:\n```\ninitialize the program counter\nrepeat forever\n    fetch the instruction pointed by the counter\n    increment the counter\n    decode the instruction\n    execute the instruction\nend repeat\n```\n\n**방법론 변화**: 1950s~60s 초 기계 효율 → 60s 후반 사람 효율(구조적 프로그래밍, 하향식 설계, 단계적 세분화) → 70s 후반 절차 지향→**데이터 지향**(데이터 추상화) → 80s 중반 **객체 지향**(데이터 추상화 + 상속 + 다형성/동적 바인딩).\n\n## 언어 범주 {#categories}\n\n| 범주 | 핵심 | 예 |\n|---|---|---|\n| 명령형 (Imperative) | 변수, 배정문, 반복. OOP·스크립트·비주얼 언어 포함 | C, Java, Perl, JavaScript, C++ |\n| 함수형 (Functional) | 주어진 매개변수에 함수를 적용해 계산. **불변성, 순수 함수** | LISP, Scheme, ML, F# |\n| 논리형 (Logic) | 규칙 기반, 규칙에 특정 순서가 없음 | Prolog |\n| 마크업/프로그래밍 혼합 | 마크업 언어에 프로그래밍 기능 일부 추가 | JSTL, XSLT |\n\n> 함정: 객체지향 언어와 스크립트 언어는 별도 범주가 아니라 **명령형에 포함**.\n\n## 언어 설계 절충 (Trade-offs) {#tradeoffs}\n\n\"상충하는 기준을 절충하는 것이 주요 공학 과제\" (Hoare). 교안의 3쌍과 예:\n\n| 상충 | 예 |\n|---|---|\n| **신뢰성 vs 실행 비용** | Java는 모든 배열 참조의 인덱스 범위를 검사 → 신뢰성↑ 실행 비용↑ |\n| **판독성 vs 작성력** | APL은 강력한 연산자·새 기호가 많아 짧게 쓰지만(작성력↑) 읽기 어려움(판독성↓) |\n| **작성력(유연성) vs 신뢰성** | C++ 포인터는 강력·유연하지만 신뢰성이 낮음 |\n\n> 시험 포인트: 24 중간 2번 = \"세 쌍 중 하나 골라 간단한 예\". 위 표의 예를 그대로 쓰면 된다. 쌍과 예를 섞어 외우지 마 (APL = 판독/작성, Java 배열 = 신뢰/비용, C++ 포인터 = 작성/신뢰).", "html": "<section class=\"sec\" id=\"s-influences\"><h3>언어 설계에 영향을 준 두 요인<\/h3><ol><li><b>컴퓨터 구조<\/b> (폰 노이만 구조) → <b>명령형 언어<\/b><\/li><li><b>프로그래밍 설계 방법론<\/b> → 새 패러다임<\/li><\/ol>\n<p><b>폰 노이만 구조<\/b>: 데이터와 프로그램이 같은 메모리에, 메모리는 CPU와 분리, 명령어·데이터가 메모리→CPU로 파이프됨.<br>명령형 언어와의 대응:<\/p>\n<ul><li><b>변수<\/b> ↔ 메모리 셀<\/li><li><b>배정문<\/b> ↔ 파이핑(데이터 이동)<\/li><li><b>반복<\/b> 이 효율적 (명령어가 인접 메모리에 있으므로)<\/li><\/ul>\n<p><b>폰 노이만 병목<\/b>: 메모리↔CPU 버스 전송 속도가 명령 실행 속도보다 느려서 컴퓨터 속도의 주된 제한 요인이 됨.<\/p>\n<p><b>Fetch-execute cycle<\/b>:<\/p>\n<pre class=\"code\">initialize the program counter\nrepeat forever\n    fetch the instruction pointed by the counter\n    increment the counter\n    decode the instruction\n    execute the instruction\nend repeat<\/pre>\n<p><b>방법론 변화<\/b>: 1950s~60s 초 기계 효율 → 60s 후반 사람 효율(구조적 프로그래밍, 하향식 설계, 단계적 세분화) → 70s 후반 절차 지향→<b>데이터 지향<\/b>(데이터 추상화) → 80s 중반 <b>객체 지향<\/b>(데이터 추상화 + 상속 + 다형성/동적 바인딩).<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L02-p21.jpg\" aria-label=\"크게 보기\"><img src=\"img/L02-p21.jpg\" alt=\"L02 p.21 · 폰 노이만 구조: 메모리와 CPU가 분리, 명령어·데이터가 버스로 이동\" loading=\"lazy\"><\/button><figcaption>L02 p.21 · 폰 노이만 구조: 메모리와 CPU가 분리, 명령어·데이터가 버스로 이동<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-categories\"><h3>언어 범주<\/h3><div class=\"tblw\"><table><thead><tr><th>범주<\/th><th>핵심<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>명령형 (Imperative)<\/td><td>변수, 배정문, 반복. OOP·스크립트·비주얼 언어 포함<\/td><td>C, Java, Perl, JavaScript, C++<\/td><\/tr><tr><td>함수형 (Functional)<\/td><td>주어진 매개변수에 함수를 적용해 계산. <b>불변성, 순수 함수<\/b><\/td><td>LISP, Scheme, ML, F#<\/td><\/tr><tr><td>논리형 (Logic)<\/td><td>규칙 기반, 규칙에 특정 순서가 없음<\/td><td>Prolog<\/td><\/tr><tr><td>마크업/프로그래밍 혼합<\/td><td>마크업 언어에 프로그래밍 기능 일부 추가<\/td><td>JSTL, XSLT<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout trap\">함정: 객체지향 언어와 스크립트 언어는 별도 범주가 아니라 <b>명령형에 포함<\/b>.<\/div><\/section>\n<section class=\"sec\" id=\"s-tradeoffs\"><h3>언어 설계 절충 (Trade-offs)<\/h3><p>\"상충하는 기준을 절충하는 것이 주요 공학 과제\" (Hoare). 교안의 3쌍과 예:<\/p>\n<div class=\"tblw\"><table><thead><tr><th>상충<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td><b>신뢰성 vs 실행 비용<\/b><\/td><td>Java는 모든 배열 참조의 인덱스 범위를 검사 → 신뢰성↑ 실행 비용↑<\/td><\/tr><tr><td><b>판독성 vs 작성력<\/b><\/td><td>APL은 강력한 연산자·새 기호가 많아 짧게 쓰지만(작성력↑) 읽기 어려움(판독성↓)<\/td><\/tr><tr><td><b>작성력(유연성) vs 신뢰성<\/b><\/td><td>C++ 포인터는 강력·유연하지만 신뢰성이 낮음<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout exam\">시험 포인트: 24 중간 2번 = \"세 쌍 중 하나 골라 간단한 예\". 위 표의 예를 그대로 쓰면 된다. 쌍과 예를 섞어 외우지 마 (APL = 판독/작성, Java 배열 = 신뢰/비용, C++ 포인터 = 작성/신뢰).<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">02주-2<\/span><br>평가 기준들 사이에서 언어 설계자가 어떤 판단을 했는지를 보는 것이 절충. Java 배열 인덱스 검사는 실행 시간에 하므로 신뢰성은 올라가지만 실행 비용이 든다.<\/div><\/section>"}, {"id": "L1-5", "title": "구현 방법 · 전처리기 · 프로그래밍 환경", "src": "L02 p.28–40", "secs": [{"id": "impl-methods", "title": "구현 방법 3가지"}, {"id": "compile-phases", "title": "컴파일 과정"}, {"id": "interp-hybrid", "title": "순수 해석 · 혼합형 · JIT"}, {"id": "preproc-env", "title": "전처리기와 프로그래밍 환경"}], "md": "## 구현 방법 3가지 {#impl-methods}\n\n| 방법 | 핵심 | 속도 | 용도 |\n|---|---|---|---|\n| **컴파일** (Compilation) | 고급 언어 → 기계어로 번역 (JIT 포함) | 번역 느림, **실행 빠름** | 대형 상용 응용 |\n| **순수 해석** (Pure interpretation) | 번역 없이 인터프리터가 직접 해석·실행 | 실행 10~100배 느림, 공간 더 필요 | 작은 프로그램, 효율이 중요치 않을 때 |\n| **혼합형** (Hybrid) | 중간 언어로 번역 후 그것을 해석 | 순수 해석보다 빠름 | 효율이 최우선이 아닌 중소 시스템 |\n\n> 시험 포인트: 24 중간 3번 = \"세 가지 방법과 각각 간략히\". 위 표의 \"핵심\" + 속도 특징 한 마디.\n\n## 컴파일 과정 {#compile-phases}\n\n```\n원시 프로그램 → [어휘 분석기] → 어휘 단위들\n              → [구문 분석기] → 파스 트리\n              → [중간 코드 생성기 + 의미 분석기] → 중간 코드\n              → (최적화) → [코드 생성기] → 기계어\n   (모든 단계가 심볼 테이블을 참조)\n```\n\n- **어휘 분석** (lexical analysis): 문자 → 어휘 단위(lexical units)\n- **구문 분석** (syntax analysis): 어휘 단위 → 파스 트리 (구문 구조)\n- **의미 분석**: 중간 코드 생성 (타입 오류 등 검사)\n- **코드 생성**: 기계어 생성\n\n용어:\n- **링킹과 적재** (linking and loading): 시스템 프로그램(라이브러리)을 모아 사용자 프로그램(목적 코드)에 연결하는 과정.\n- **적재 모듈** (load module, executable image): 링킹 결과물로 실행을 위해 메모리에 적재되는 것.\n\n## 순수 해석 · 혼합형 · JIT {#interp-hybrid}\n\n**순수 해석**: 번역 없음. 실행 시간 오류를 즉시 소스 수준에서 보여주기 쉬움. 느리고 공간이 더 필요. 전통 고급 언어에선 드물지만 웹 스크립트(JavaScript, PHP)로 부활.\n\n**혼합형**: 고급 언어 → 해석하기 쉬운 **중간 언어**로 번역 → 해석.\n- Perl: 해석 전에 부분 컴파일해 오류 탐지.\n- 초기 Java: 중간 형태 = **바이트 코드**. 바이트코드 인터프리터 + 런타임 시스템 = **JVM** → 이식성.\n\n**JIT (Just-in-Time)**: 먼저 중간 언어로 번역 → 부프로그램이 **호출될 때** 그 중간 코드를 기계어로 컴파일 → 기계어 버전은 이후 호출을 위해 보관. Java, .NET이 사용. 본질적으로 **지연된 컴파일러** (delayed compiler).\n\n## 전처리기와 프로그래밍 환경 {#preproc-env}\n\n**전처리기** (preprocessor): 컴파일 직전에 프로그램을 처리해 내장된 전처리기 매크로를 확장.\n- `#include \"myLib.h\"` → 그 위치에 파일 내용을 복사\n- `#define max(A, B) ((A) > (B) ? (A) : (B))`\n\n**프로그래밍 환경**: SW 개발 도구 모음 (언어 처리기, 편집기, 디버거, 빌드 도구, 라이브러리, IDE). 예: UNIX, Microsoft Visual Studio.NET, NetBeans(Java).", "html": "<section class=\"sec\" id=\"s-impl-methods\"><h3>구현 방법 3가지<\/h3><div class=\"tblw\"><table><thead><tr><th>방법<\/th><th>핵심<\/th><th>속도<\/th><th>용도<\/th><\/tr><\/thead><tbody><tr><td><b>컴파일<\/b> (Compilation)<\/td><td>고급 언어 → 기계어로 번역 (JIT 포함)<\/td><td>번역 느림, <b>실행 빠름<\/b><\/td><td>대형 상용 응용<\/td><\/tr><tr><td><b>순수 해석<\/b> (Pure interpretation)<\/td><td>번역 없이 인터프리터가 직접 해석·실행<\/td><td>실행 10~100배 느림, 공간 더 필요<\/td><td>작은 프로그램, 효율이 중요치 않을 때<\/td><\/tr><tr><td><b>혼합형<\/b> (Hybrid)<\/td><td>중간 언어로 번역 후 그것을 해석<\/td><td>순수 해석보다 빠름<\/td><td>효율이 최우선이 아닌 중소 시스템<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout exam\">시험 포인트: 24 중간 3번 = \"세 가지 방법과 각각 간략히\". 위 표의 \"핵심\" + 속도 특징 한 마디.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L02-p28.jpg\" aria-label=\"크게 보기\"><img src=\"img/L02-p28.jpg\" alt=\"L02 p.28 · 컴퓨터의 계층적 관점: OS와 언어 구현 시스템이 기계 위에 층으로 쌓임\" loading=\"lazy\"><\/button><figcaption>L02 p.28 · 컴퓨터의 계층적 관점: OS와 언어 구현 시스템이 기계 위에 층으로 쌓임<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-compile-phases\"><h3>컴파일 과정<\/h3><pre class=\"code\">원시 프로그램 → [어휘 분석기] → 어휘 단위들\n              → [구문 분석기] → 파스 트리\n              → [중간 코드 생성기 + 의미 분석기] → 중간 코드\n              → (최적화) → [코드 생성기] → 기계어\n   (모든 단계가 심볼 테이블을 참조)<\/pre>\n<ul><li><b>어휘 분석<\/b> (lexical analysis): 문자 → 어휘 단위(lexical units)<\/li><li><b>구문 분석<\/b> (syntax analysis): 어휘 단위 → 파스 트리 (구문 구조)<\/li><li><b>의미 분석<\/b>: 중간 코드 생성 (타입 오류 등 검사)<\/li><li><b>코드 생성<\/b>: 기계어 생성<\/li><\/ul>\n<p>용어:<\/p>\n<ul><li><b>링킹과 적재<\/b> (linking and loading): 시스템 프로그램(라이브러리)을 모아 사용자 프로그램(목적 코드)에 연결하는 과정.<\/li><li><b>적재 모듈<\/b> (load module, executable image): 링킹 결과물로 실행을 위해 메모리에 적재되는 것.<\/li><\/ul><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">02주-2 · 05주-1<\/span><br>의미 분석의 예: 문법(구문)은 맞지만 대입하는 양쪽 타입이 안 맞는 경우를 여기서 잡는다. 이 수업에서 다루는 핵심은 가운데 부분(어휘·구문·의미 분석). 실제 컴파일러는 파스 트리에 정보를 더한 AST를 만들지만 수업에선 파스 트리까지만.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L02-p32.jpg\" aria-label=\"크게 보기\"><img src=\"img/L02-p32.jpg\" alt=\"L02 p.32 · 컴파일 과정 (어휘 분석기 → 구문 분석기 → 중간 코드 생성기/의미 분석기 → 코드 생성기)\" loading=\"lazy\"><\/button><figcaption>L02 p.32 · 컴파일 과정 (어휘 분석기 → 구문 분석기 → 중간 코드 생성기/의미 분석기 → 코드 생성기)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-interp-hybrid\"><h3>순수 해석 · 혼합형 · JIT<\/h3><p><b>순수 해석<\/b>: 번역 없음. 실행 시간 오류를 즉시 소스 수준에서 보여주기 쉬움. 느리고 공간이 더 필요. 전통 고급 언어에선 드물지만 웹 스크립트(JavaScript, PHP)로 부활.<\/p>\n<p><b>혼합형<\/b>: 고급 언어 → 해석하기 쉬운 <b>중간 언어<\/b>로 번역 → 해석.<\/p>\n<ul><li>Perl: 해석 전에 부분 컴파일해 오류 탐지.<\/li><li>초기 Java: 중간 형태 = <b>바이트 코드<\/b>. 바이트코드 인터프리터 + 런타임 시스템 = <b>JVM<\/b> → 이식성.<\/li><\/ul>\n<p><b>JIT (Just-in-Time)<\/b>: 먼저 중간 언어로 번역 → 부프로그램이 <b>호출될 때<\/b> 그 중간 코드를 기계어로 컴파일 → 기계어 버전은 이후 호출을 위해 보관. Java, .NET이 사용. 본질적으로 <b>지연된 컴파일러<\/b> (delayed compiler).<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">02주-2<\/span><br>순수 해석은 한 줄씩 실행하니까 에러가 난 줄 번호·변수 이름을 바로 알려주기 쉽다 (컴파일된 기계어는 변수 이름을 기억하지 않음). 대신 실행 중에 변수 이름·타입 정보를 계속 들고 있어야 해서 공간이 더 필요하다. JIT: 중간 코드를 두고, 호출될 때 그 부분을 기계어로 컴파일해서 보관.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L02-p35.jpg\" aria-label=\"크게 보기\"><img src=\"img/L02-p35.jpg\" alt=\"L02 p.35 · 순수 해석 과정\" loading=\"lazy\"><\/button><figcaption>L02 p.35 · 순수 해석 과정<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L02-p37.jpg\" aria-label=\"크게 보기\"><img src=\"img/L02-p37.jpg\" alt=\"L02 p.37 · 혼합형 구현 과정 (중간 코드 → 인터프리터)\" loading=\"lazy\"><\/button><figcaption>L02 p.37 · 혼합형 구현 과정 (중간 코드 → 인터프리터)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-preproc-env\"><h3>전처리기와 프로그래밍 환경<\/h3><p><b>전처리기<\/b> (preprocessor): 컴파일 직전에 프로그램을 처리해 내장된 전처리기 매크로를 확장.<\/p>\n<ul><li><code>#include \"myLib.h\"<\/code> → 그 위치에 파일 내용을 복사<\/li><li><code>#define max(A, B) ((A) &gt; (B) ? (A) : (B))<\/code><\/li><\/ul>\n<p><b>프로그래밍 환경<\/b>: SW 개발 도구 모음 (언어 처리기, 편집기, 디버거, 빌드 도구, 라이브러리, IDE). 예: UNIX, Microsoft Visual Studio.NET, NetBeans(Java).<\/p><\/section>"}]}, {"id": "U2", "title": "Ch.3 구문 기술 (BNF · 파스 트리 · 모호성)", "src": "L03 Describing Syntax and Semantics.pdf (p.1–30)", "intro": "시험에서 손으로 그려야 하는 파트. 최좌단 유도, 파스 트리, 모호성 증명은 \"읽기\"보다 \"직접 써보기\"로 익혀. 퀴즈에서 실제로 유도를 쓰게 할 거야.", "lessons": [{"id": "L2-1", "title": "구문 vs 의미론 · 기본 용어", "src": "L03 p.3–8", "secs": [{"id": "syn-sem", "title": "구문과 의미론"}, {"id": "lexeme-token", "title": "문장 · 언어 · 어휘항목 · 토큰"}, {"id": "recognizer-generator", "title": "인식기와 생성기"}], "md": "## 구문과 의미론 {#syn-sem}\n\n- **구문** (syntax): 식(expression), 문장(statement), 프로그램 단위(program unit)의 **형식 또는 구조**.\n- **의미론** (semantics): 그 식·문장·프로그램 단위의 **의미**.\n\n예) Java `while (bool_expr) statement`\n- 구문: 위와 같은 형태로 써야 한다.\n- 의미: bool_expr의 현재 값이 참이면 내포된 문장을 실행하고, 거짓이면 while 다음 문장으로 제어가 넘어간다.\n\n언어 정의(구문+의미)를 쓰는 사람: **다른 언어 설계자**(모호성·비일관성 발견), **구현자**(올바른 구현), **프로그래머**(올바르게 사용).\n\n> 시험 포인트: 24 중간 4번 \"구문과 의미론을 간략히\". 형식/구조 vs 의미, 그리고 while 예 하나면 충분.\n\n## 문장 · 언어 · 어휘항목 · 토큰 {#lexeme-token}\n\n- **문장** (sentence): 어떤 알파벳(Σ) 위의 문자열\n- **언어** (language): 문장들의 집합\n- **어휘항목** (lexeme): 언어의 **가장 낮은 수준의 구문 단위**. 예) `*`, `sum`, `begin`\n- **토큰** (token): **어휘항목들의 범주(category)**. 예) identifier\n\n`index = 2 * count + 17;` 를 쪼개면:\n\n| 어휘항목 (lexeme) | 토큰 (token) |\n|---|---|\n| index | identifier |\n| = | equal_sign |\n| 2 | int_literal |\n| * | mult_op |\n| count | identifier |\n| + | plus_op |\n| 17 | int_literal |\n| ; | semicolon |\n\n> 시험 포인트: 24 중간 6번. \"어휘항목 = 가장 낮은 수준의 구문 단위(실제 문자열), 토큰 = 어휘항목의 범주(종류)\". `index`와 `count`는 다른 lexeme인데 같은 token.\n\n## 인식기와 생성기 {#recognizer-generator}\n\n언어를 형식적으로 정의하는 두 방법:\n\n- **언어 인식기** (recognizer): 입력 문자열을 읽고 그 언어에 속하는지 판단하는 장치. 예) 컴파일러의 **구문 분석기** (Ch.4).\n- **언어 생성기** (generator): 언어의 문장을 생성하는 장치. 어떤 문장이 구문적으로 맞는지를 생성기의 구조와 비교해 판단. (BNF 문법이 생성기 역할)", "html": "<section class=\"sec\" id=\"s-syn-sem\"><h3>구문과 의미론<\/h3><ul><li><b>구문<\/b> (syntax): 식(expression), 문장(statement), 프로그램 단위(program unit)의 <b>형식 또는 구조<\/b>.<\/li><li><b>의미론<\/b> (semantics): 그 식·문장·프로그램 단위의 <b>의미<\/b>.<\/li><\/ul>\n<p>예) Java <code>while (bool_expr) statement<\/code><\/p>\n<ul><li>구문: 위와 같은 형태로 써야 한다.<\/li><li>의미: bool_expr의 현재 값이 참이면 내포된 문장을 실행하고, 거짓이면 while 다음 문장으로 제어가 넘어간다.<\/li><\/ul>\n<p>언어 정의(구문+의미)를 쓰는 사람: <b>다른 언어 설계자<\/b>(모호성·비일관성 발견), <b>구현자<\/b>(올바른 구현), <b>프로그래머<\/b>(올바르게 사용).<\/p>\n<div class=\"callout exam\">시험 포인트: 24 중간 4번 \"구문과 의미론을 간략히\". 형식/구조 vs 의미, 그리고 while 예 하나면 충분.<\/div><\/section>\n<section class=\"sec\" id=\"s-lexeme-token\"><h3>문장 · 언어 · 어휘항목 · 토큰<\/h3><ul><li><b>문장<\/b> (sentence): 어떤 알파벳(Σ) 위의 문자열<\/li><li><b>언어<\/b> (language): 문장들의 집합<\/li><li><b>어휘항목<\/b> (lexeme): 언어의 <b>가장 낮은 수준의 구문 단위<\/b>. 예) <code>*<\/code>, <code>sum<\/code>, <code>begin<\/code><\/li><li><b>토큰<\/b> (token): <b>어휘항목들의 범주(category)<\/b>. 예) identifier<\/li><\/ul>\n<p><code>index = 2 * count + 17;<\/code> 를 쪼개면:<\/p>\n<div class=\"tblw\"><table><thead><tr><th>어휘항목 (lexeme)<\/th><th>토큰 (token)<\/th><\/tr><\/thead><tbody><tr><td>index<\/td><td>identifier<\/td><\/tr><tr><td>=<\/td><td>equal_sign<\/td><\/tr><tr><td>2<\/td><td>int_literal<\/td><\/tr><tr><td>*<\/td><td>mult_op<\/td><\/tr><tr><td>count<\/td><td>identifier<\/td><\/tr><tr><td>+<\/td><td>plus_op<\/td><\/tr><tr><td>17<\/td><td>int_literal<\/td><\/tr><tr><td>;<\/td><td>semicolon<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout exam\">시험 포인트: 24 중간 6번. \"어휘항목 = 가장 낮은 수준의 구문 단위(실제 문자열), 토큰 = 어휘항목의 범주(종류)\". <code>index<\/code>와 <code>count<\/code>는 다른 lexeme인데 같은 token.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L03-p6.jpg\" aria-label=\"크게 보기\"><img src=\"img/L03-p6.jpg\" alt=\"L03 p.6 · index = 2 * count + 17; 의 어휘항목과 토큰\" loading=\"lazy\"><\/button><figcaption>L03 p.6 · index = 2 * count + 17; 의 어휘항목과 토큰<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-recognizer-generator\"><h3>인식기와 생성기<\/h3><p>언어를 형식적으로 정의하는 두 방법:<\/p>\n<ul><li><b>언어 인식기<\/b> (recognizer): 입력 문자열을 읽고 그 언어에 속하는지 판단하는 장치. 예) 컴파일러의 <b>구문 분석기<\/b> (Ch.4).<\/li><li><b>언어 생성기<\/b> (generator): 언어의 문장을 생성하는 장치. 어떤 문장이 구문적으로 맞는지를 생성기의 구조와 비교해 판단. (BNF 문법이 생성기 역할)<\/li><\/ul><\/section>"}, {"id": "L2-2", "title": "BNF와 유도", "src": "L03 p.8–15", "secs": [{"id": "bnf", "title": "BNF와 문맥 자유 문법"}, {"id": "derivation", "title": "유도 · 문장 형태 · 최좌단 유도"}], "md": "## BNF와 문맥 자유 문법 {#bnf}\n\n- **문맥 자유 문법 (CFG)**: Noam Chomsky, 1950년대 중반. 자연어 구문 기술용 언어 생성기. 문맥 자유 언어 클래스를 정의.\n- **BNF** (Backus-Naur Form): John Backus, 1959, ALGOL 58 기술용. **BNF는 CFG와 동등**하다.\n- **메타언어** (metalanguage): 다른 언어를 기술하는 언어. BNF는 프로그래밍 언어를 위한 메타언어.\n\nBNF 구성 요소:\n- **추상화 = 비단말 기호** (nonterminal): 구문 구조의 클래스, `<assign>`처럼 꺾쇠로 감쌈\n- **단말 기호** (terminal): 어휘항목 또는 토큰\n- **규칙 / 생성 규칙** (rule, production): `LHS → RHS`. LHS는 비단말 하나, RHS는 단말·비단말 문자열\n- 한 비단말이 여러 RHS를 가지면 `|`로 묶음\n- **문법** (grammar): 규칙들의 유한·비어있지 않은 집합\n- **시작 기호** (start symbol): 유도를 시작하는 특별한 비단말\n\n```\n<if_stmt> → if (<logic_expr>) <stmt>\n          | if (<logic_expr>) <stmt> else <stmt>\n```\n\n**리스트는 재귀로** 표현: LHS가 RHS에 다시 나오면 재귀 규칙.\n```\n<ident_list> → ident\n             | ident , <ident_list>\n```\n\n## 유도 · 문장 형태 · 최좌단 유도 {#derivation}\n\n- **유도** (derivation): 시작 기호에서 출발해 규칙을 반복 적용, 단말로만 된 문장에서 끝남.\n- **문장 형태** (sentential form): 유도 중에 나오는 모든 기호열.\n- **문장** (sentence): 단말 기호만 있는 문장 형태.\n- **최좌단 유도** (leftmost derivation): 매 단계에서 **가장 왼쪽 비단말**을 전개.\n- 유도 순서(최좌단/최우단/그 외)는 **생성되는 언어에 영향 없음**.\n\n예제 문법:\n```\n<program> → begin <stmts> end\n<stmts>   → <stmt> | <stmt> ; <stmts>\n<stmt>    → <var> = <expr>\n<var>     → a | b | c | d\n<expr>    → <var> + <var> | <var> - <var> | <var>\n```\n`begin a = b + c; b = c end` 의 최좌단 유도:\n```\n<program> ⇒ begin <stmts> end\n          ⇒ begin <stmt> ; <stmts> end\n          ⇒ begin <var> = <expr> ; <stmts> end\n          ⇒ begin a = <expr> ; <stmts> end\n          ⇒ begin a = <var> + <var> ; <stmts> end\n          ⇒ begin a = b + <var> ; <stmts> end\n          ⇒ begin a = b + c ; <stmts> end\n          ⇒ begin a = b + c ; <stmt> end\n          ⇒ begin a = b + c ; <var> = <expr> end\n          ⇒ begin a = b + c ; b = <expr> end\n          ⇒ begin a = b + c ; b = <var> end\n          ⇒ begin a = b + c ; b = c end\n```\n\n> 쓰는 요령: 매 줄마다 \"지금 가장 왼쪽 비단말이 뭐지?\"만 보고 그거 하나만 바꿔. 두 개 동시에 바꾸면 감점.", "html": "<section class=\"sec\" id=\"s-bnf\"><h3>BNF와 문맥 자유 문법<\/h3><ul><li><b>문맥 자유 문법 (CFG)<\/b>: Noam Chomsky, 1950년대 중반. 자연어 구문 기술용 언어 생성기. 문맥 자유 언어 클래스를 정의.<\/li><li><b>BNF<\/b> (Backus-Naur Form): John Backus, 1959, ALGOL 58 기술용. <b>BNF는 CFG와 동등<\/b>하다.<\/li><li><b>메타언어<\/b> (metalanguage): 다른 언어를 기술하는 언어. BNF는 프로그래밍 언어를 위한 메타언어.<\/li><\/ul>\n<p>BNF 구성 요소:<\/p>\n<ul><li><b>추상화 = 비단말 기호<\/b> (nonterminal): 구문 구조의 클래스, <code>&lt;assign&gt;<\/code>처럼 꺾쇠로 감쌈<\/li><li><b>단말 기호<\/b> (terminal): 어휘항목 또는 토큰<\/li><li><b>규칙 / 생성 규칙<\/b> (rule, production): <code>LHS → RHS<\/code>. LHS는 비단말 하나, RHS는 단말·비단말 문자열<\/li><li>한 비단말이 여러 RHS를 가지면 <code>|<\/code>로 묶음<\/li><li><b>문법<\/b> (grammar): 규칙들의 유한·비어있지 않은 집합<\/li><li><b>시작 기호<\/b> (start symbol): 유도를 시작하는 특별한 비단말<\/li><\/ul>\n<pre class=\"code\">&lt;if_stmt&gt; → if (&lt;logic_expr&gt;) &lt;stmt&gt;\n          | if (&lt;logic_expr&gt;) &lt;stmt&gt; else &lt;stmt&gt;<\/pre>\n<p><b>리스트는 재귀로<\/b> 표현: LHS가 RHS에 다시 나오면 재귀 규칙.<\/p>\n<pre class=\"code\">&lt;ident_list&gt; → ident\n             | ident , &lt;ident_list&gt;<\/pre><\/section>\n<section class=\"sec\" id=\"s-derivation\"><h3>유도 · 문장 형태 · 최좌단 유도<\/h3><ul><li><b>유도<\/b> (derivation): 시작 기호에서 출발해 규칙을 반복 적용, 단말로만 된 문장에서 끝남.<\/li><li><b>문장 형태<\/b> (sentential form): 유도 중에 나오는 모든 기호열.<\/li><li><b>문장<\/b> (sentence): 단말 기호만 있는 문장 형태.<\/li><li><b>최좌단 유도<\/b> (leftmost derivation): 매 단계에서 <b>가장 왼쪽 비단말<\/b>을 전개.<\/li><li>유도 순서(최좌단/최우단/그 외)는 <b>생성되는 언어에 영향 없음<\/b>.<\/li><\/ul>\n<p>예제 문법:<\/p>\n<pre class=\"code\">&lt;program&gt; → begin &lt;stmts&gt; end\n&lt;stmts&gt;   → &lt;stmt&gt; | &lt;stmt&gt; ; &lt;stmts&gt;\n&lt;stmt&gt;    → &lt;var&gt; = &lt;expr&gt;\n&lt;var&gt;     → a | b | c | d\n&lt;expr&gt;    → &lt;var&gt; + &lt;var&gt; | &lt;var&gt; - &lt;var&gt; | &lt;var&gt;<\/pre>\n<p><code>begin a = b + c; b = c end<\/code> 의 최좌단 유도:<\/p>\n<pre class=\"code\">&lt;program&gt; ⇒ begin &lt;stmts&gt; end\n          ⇒ begin &lt;stmt&gt; ; &lt;stmts&gt; end\n          ⇒ begin &lt;var&gt; = &lt;expr&gt; ; &lt;stmts&gt; end\n          ⇒ begin a = &lt;expr&gt; ; &lt;stmts&gt; end\n          ⇒ begin a = &lt;var&gt; + &lt;var&gt; ; &lt;stmts&gt; end\n          ⇒ begin a = b + &lt;var&gt; ; &lt;stmts&gt; end\n          ⇒ begin a = b + c ; &lt;stmts&gt; end\n          ⇒ begin a = b + c ; &lt;stmt&gt; end\n          ⇒ begin a = b + c ; &lt;var&gt; = &lt;expr&gt; end\n          ⇒ begin a = b + c ; b = &lt;expr&gt; end\n          ⇒ begin a = b + c ; b = &lt;var&gt; end\n          ⇒ begin a = b + c ; b = c end<\/pre>\n<div class=\"callout\">쓰는 요령: 매 줄마다 \"지금 가장 왼쪽 비단말이 뭐지?\"만 보고 그거 하나만 바꿔. 두 개 동시에 바꾸면 감점.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">03주-1<\/span><br>최좌단으로 유도하든 최우단으로 유도하든 마지막에 나오는 문장은 같다(유도 순서는 언어에 영향 없음). 시험에서 '최좌단 유도'라고 하면 그 순서를 지켜서 써야 한다.<\/div><\/section>"}, {"id": "L2-3", "title": "파스 트리 · 모호성", "src": "L03 p.16–22", "secs": [{"id": "parse-tree", "title": "파스 트리"}, {"id": "ambiguity", "title": "모호성 (Ambiguity)"}], "md": "## 파스 트리 {#parse-tree}\n\n**파스 트리**: 문장이 시작 기호에서 어떻게 유도되는지를 계층 구조(트리)로 보여줌.\n- 내부 노드 = 비단말, 잎 = 단말, 루트 = 시작 기호\n- 노드의 자식들 = 그 노드에 적용한 규칙의 RHS (왼→오 순서)\n\n문법 (교안 p.17):\n```\n<assign> → <id> = <expr>\n<id>     → A | B | C\n<expr>   → <id> + <expr> | <id> * <expr> | ( <expr> ) | <id>\n```\n`A = B * (A + C)` 의 파스 트리:\n```\n            <assign>\n         /     |      \\\n      <id>     =      <expr>\n       |            /   |    \\\n       A         <id>   *    <expr>\n                  |        /   |   \\\n                  B       (  <expr>  )\n                           /   |   \\\n                        <id>   +   <expr>\n                         |           |\n                         A         <id>\n                                     |\n                                     C\n```\n\n## 모호성 (Ambiguity) {#ambiguity}\n\n**문법이 모호하다 ⟺ 어떤 문장 형태에 대해 서로 다른 파스 트리가 2개 이상 존재.**\n동치 조건: 어떤 문장에 대해 **최좌단 유도가 2개 이상** (또는 최우단 유도가 2개 이상).\n\n모호한 문법:\n```\n<assign> → <id> = <expr>\n<id>     → A | B | C\n<expr>   → <expr> + <expr> | <expr> * <expr> | ( <expr> ) | <id>\n```\n`A = B + C * A` 에 대해 두 트리가 생긴다:\n```\n(1) + 가 위:  <expr> ⇒ <expr> + <expr>, 오른쪽 <expr> ⇒ <expr> * <expr>    → B + (C * A)\n(2) * 가 위:  <expr> ⇒ <expr> * <expr>, 왼쪽  <expr> ⇒ <expr> + <expr>    → (B + C) * A\n```\n\n**모호성 증명하는 법 (시험 답안 형식)**:\n1. 문장 하나를 고른다 (짧을수록 좋음).\n2. 그 문장에 대한 **서로 다른 최좌단 유도 2개** (또는 파스 트리 2개)를 쓴다.\n3. \"같은 문장에 대해 서로 다른 파스 트리가 2개 존재하므로 모호하다\"로 마무리.\n\n예) `<S> → <A>`, `<A> → <A> + <A> | <id>`, `<id> → a | b | c` 에서 `a + b + c`:\n```\n유도 1: <S> ⇒ <A> ⇒ <A> + <A> ⇒ <A> + <A> + <A> ⇒ <id> + <A> + <A>\n        ⇒ a + <A> + <A> ⇒ a + <id> + <A> ⇒ a + b + <A> ⇒ a + b + <id> ⇒ a + b + c\n        (첫 <A> + <A> 중 \"왼쪽\" <A>를 다시 <A> + <A>로 전개 → (a+b)+c)\n유도 2: <S> ⇒ <A> ⇒ <A> + <A> ⇒ <id> + <A> ⇒ a + <A> ⇒ a + <A> + <A>\n        ⇒ a + <id> + <A> ⇒ a + b + <A> ⇒ a + b + <id> ⇒ a + b + c\n        (오른쪽 <A>를 전개 → a+(b+c))\n```\n\n> 시험 포인트: 24 중간 8번이 이 유형(3점). \"두 개의 서로 다른 최좌단 유도 또는 파스 트리\"를 반드시 보여야 함. 말로만 \"두 가지로 해석된다\"는 감점.", "html": "<section class=\"sec\" id=\"s-parse-tree\"><h3>파스 트리<\/h3><p><b>파스 트리<\/b>: 문장이 시작 기호에서 어떻게 유도되는지를 계층 구조(트리)로 보여줌.<\/p>\n<ul><li>내부 노드 = 비단말, 잎 = 단말, 루트 = 시작 기호<\/li><li>노드의 자식들 = 그 노드에 적용한 규칙의 RHS (왼→오 순서)<\/li><\/ul>\n<p>문법 (교안 p.17):<\/p>\n<pre class=\"code\">&lt;assign&gt; → &lt;id&gt; = &lt;expr&gt;\n&lt;id&gt;     → A | B | C\n&lt;expr&gt;   → &lt;id&gt; + &lt;expr&gt; | &lt;id&gt; * &lt;expr&gt; | ( &lt;expr&gt; ) | &lt;id&gt;<\/pre>\n<p><code>A = B * (A + C)<\/code> 의 파스 트리:<\/p>\n<pre class=\"code\">            &lt;assign&gt;\n         /     |      \\\n      &lt;id&gt;     =      &lt;expr&gt;\n       |            /   |    \\\n       A         &lt;id&gt;   *    &lt;expr&gt;\n                  |        /   |   \\\n                  B       (  &lt;expr&gt;  )\n                           /   |   \\\n                        &lt;id&gt;   +   &lt;expr&gt;\n                         |           |\n                         A         &lt;id&gt;\n                                     |\n                                     C<\/pre><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L03-p18.jpg\" aria-label=\"크게 보기\"><img src=\"img/L03-p18.jpg\" alt=\"L03 p.18 · A = B * (A + C) 의 파스 트리\" loading=\"lazy\"><\/button><figcaption>L03 p.18 · A = B * (A + C) 의 파스 트리<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-ambiguity\"><h3>모호성 (Ambiguity)<\/h3><p><b>문법이 모호하다 ⟺ 어떤 문장 형태에 대해 서로 다른 파스 트리가 2개 이상 존재.<\/b><br>동치 조건: 어떤 문장에 대해 <b>최좌단 유도가 2개 이상<\/b> (또는 최우단 유도가 2개 이상).<\/p>\n<p>모호한 문법:<\/p>\n<pre class=\"code\">&lt;assign&gt; → &lt;id&gt; = &lt;expr&gt;\n&lt;id&gt;     → A | B | C\n&lt;expr&gt;   → &lt;expr&gt; + &lt;expr&gt; | &lt;expr&gt; * &lt;expr&gt; | ( &lt;expr&gt; ) | &lt;id&gt;<\/pre>\n<p><code>A = B + C * A<\/code> 에 대해 두 트리가 생긴다:<\/p>\n<pre class=\"code\">(1) + 가 위:  &lt;expr&gt; ⇒ &lt;expr&gt; + &lt;expr&gt;, 오른쪽 &lt;expr&gt; ⇒ &lt;expr&gt; * &lt;expr&gt;    → B + (C * A)\n(2) * 가 위:  &lt;expr&gt; ⇒ &lt;expr&gt; * &lt;expr&gt;, 왼쪽  &lt;expr&gt; ⇒ &lt;expr&gt; + &lt;expr&gt;    → (B + C) * A<\/pre>\n<p><b>모호성 증명하는 법 (시험 답안 형식)<\/b>:<\/p>\n<ol><li>문장 하나를 고른다 (짧을수록 좋음).<\/li><li>그 문장에 대한 <b>서로 다른 최좌단 유도 2개<\/b> (또는 파스 트리 2개)를 쓴다.<\/li><li>\"같은 문장에 대해 서로 다른 파스 트리가 2개 존재하므로 모호하다\"로 마무리.<\/li><\/ol>\n<p>예) <code>&lt;S&gt; → &lt;A&gt;<\/code>, <code>&lt;A&gt; → &lt;A&gt; + &lt;A&gt; | &lt;id&gt;<\/code>, <code>&lt;id&gt; → a | b | c<\/code> 에서 <code>a + b + c<\/code>:<\/p>\n<pre class=\"code\">유도 1: &lt;S&gt; ⇒ &lt;A&gt; ⇒ &lt;A&gt; + &lt;A&gt; ⇒ &lt;A&gt; + &lt;A&gt; + &lt;A&gt; ⇒ &lt;id&gt; + &lt;A&gt; + &lt;A&gt;\n        ⇒ a + &lt;A&gt; + &lt;A&gt; ⇒ a + &lt;id&gt; + &lt;A&gt; ⇒ a + b + &lt;A&gt; ⇒ a + b + &lt;id&gt; ⇒ a + b + c\n        (첫 &lt;A&gt; + &lt;A&gt; 중 &quot;왼쪽&quot; &lt;A&gt;를 다시 &lt;A&gt; + &lt;A&gt;로 전개 → (a+b)+c)\n유도 2: &lt;S&gt; ⇒ &lt;A&gt; ⇒ &lt;A&gt; + &lt;A&gt; ⇒ &lt;id&gt; + &lt;A&gt; ⇒ a + &lt;A&gt; ⇒ a + &lt;A&gt; + &lt;A&gt;\n        ⇒ a + &lt;id&gt; + &lt;A&gt; ⇒ a + b + &lt;A&gt; ⇒ a + b + &lt;id&gt; ⇒ a + b + c\n        (오른쪽 &lt;A&gt;를 전개 → a+(b+c))<\/pre>\n<div class=\"callout exam\">시험 포인트: 24 중간 8번이 이 유형(3점). \"두 개의 서로 다른 최좌단 유도 또는 파스 트리\"를 반드시 보여야 함. 말로만 \"두 가지로 해석된다\"는 감점.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">03주-1<\/span><br>모호성 = 같은 문장에 파스 트리가 2개 이상. 모호하면 컴파일러가 하나로 결정(deterministic)할 수 없어서 문제가 된다.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L03-p22.jpg\" aria-label=\"크게 보기\"><img src=\"img/L03-p22.jpg\" alt=\"L03 p.22 · A = B + C * A 의 서로 다른 두 파스 트리 (오른쪽 트리 2층의 &lt;id&gt;는 교안 오타, &lt;expr&gt;가 맞음)\" loading=\"lazy\"><\/button><figcaption>L03 p.22 · A = B + C * A 의 서로 다른 두 파스 트리 (오른쪽 트리 2층의 &lt;id&gt;는 교안 오타, &lt;expr&gt;가 맞음)<\/figcaption><\/figure><\/section>"}, {"id": "L2-4", "title": "우선순위 · 결합성 · if-else 모호성", "src": "L03 p.23–27", "secs": [{"id": "precedence", "title": "연산자 우선순위를 문법으로"}, {"id": "associativity", "title": "결합성 (Associativity)"}, {"id": "dangling-else", "title": "if-then-else 모호성 (dangling else)"}], "md": "## 연산자 우선순위를 문법으로 {#precedence}\n\n연산자마다 **별도의 비단말**을 두면 모호성이 사라진다.\n규칙: **우선순위가 높은 연산자일수록 파스 트리에서 더 낮은 곳(잎 쪽)** 에 나타나야 한다.\n\n모호하지 않은 식 문법 (**시험에 자주 주어지는 문법**):\n```\n<assign> → <id> = <expr>\n<id>     → A | B | C\n<expr>   → <expr> + <term>   | <term>\n<term>   → <term> * <factor> | <factor>\n<factor> → ( <expr> )        | <id>\n```\n`*`는 `<term>` 단계, `+`는 `<expr>` 단계 → `*`가 항상 아래 → 먼저 계산.\n\n`A = B + C * A` 의 최좌단 유도 (L04 p.37에도 나옴):\n```\n<assign> ⇒ <id> = <expr>\n         ⇒ A = <expr>\n         ⇒ A = <expr> + <term>\n         ⇒ A = <term> + <term>\n         ⇒ A = <factor> + <term>\n         ⇒ A = <id> + <term>\n         ⇒ A = B + <term>\n         ⇒ A = B + <term> * <factor>\n         ⇒ A = B + <factor> * <factor>\n         ⇒ A = B + <id> * <factor>\n         ⇒ A = B + C * <factor>\n         ⇒ A = B + C * <id>\n         ⇒ A = B + C * A\n```\n파스 트리:\n```\n          <assign>\n        /    |     \\\n     <id>    =     <expr>\n      |          /   |    \\\n      A      <expr>  +    <term>\n               |         /  |   \\\n            <term>   <term> *  <factor>\n               |        |         |\n           <factor>  <factor>   <id>\n               |        |         |\n             <id>     <id>        A\n               |        |\n               B        C\n```\n\n> 괄호가 있으면 `<factor> → ( <expr> )`를 써서 다시 `<expr>`로 올라간다. 24 중간 10번이 이 문법으로 괄호 있는 문장 2개를 유도하는 문제였어.\n\n## 결합성 (Associativity) {#associativity}\n\n같은 우선순위 연산자가 연속될 때 어느 쪽부터 묶을지도 문법으로 표현한다.\n\n```\n<expr> → <expr> + <expr> | const    (모호)\n<expr> → <expr> + const  | const    (모호하지 않음)\n```\n- **좌순환** 규칙 (LHS가 RHS의 **맨 왼쪽**에 나옴) → **좌결합**. `const + const + const` = `(const + const) + const`.\n- **우순환** 규칙 (LHS가 RHS의 맨 오른쪽) → **우결합**. 예) 거듭제곱 `<factor> → <exp> ** <factor> | <exp>`.\n\n> 함정: 좌순환 = 좌결합에 좋지만, Ch.4에서 배우는 **하향식 파서는 좌순환을 못 다룬다**. 이 연결고리가 시험에 나오기 좋다.\n\n## if-then-else 모호성 (dangling else) {#dangling-else}\n\n```\n<if_stmt> → if (<logic_expr>) then <stmt>\n          | if (<logic_expr>) then <stmt> else <stmt>\n```\n`if C1 then if C2 then S1 else S2` 에서 `else`가 바깥 if에 붙는지 안쪽 if에 붙는지 두 트리가 생김 → **모호**.\n\n대부분의 언어 규칙: **else는 가장 가까운 짝 없는 then과 짝지어진다.**\n모호하지 않은 문법:\n```\n<stmt>      → <matched> | <unmatched>\n<matched>   → if (<logic_expr>) then <matched> else <matched>\n            | a non-if statement\n<unmatched> → if (<logic_expr>) then <stmt>\n            | if (<logic_expr>) then <matched> else <unmatched>\n```\n핵심 아이디어: then과 else 사이에는 **matched**(else까지 짝이 다 맞은) 문장만 올 수 있다.", "html": "<section class=\"sec\" id=\"s-precedence\"><h3>연산자 우선순위를 문법으로<\/h3><p>연산자마다 <b>별도의 비단말<\/b>을 두면 모호성이 사라진다.<br>규칙: <b>우선순위가 높은 연산자일수록 파스 트리에서 더 낮은 곳(잎 쪽)<\/b> 에 나타나야 한다.<\/p>\n<p>모호하지 않은 식 문법 (<b>시험에 자주 주어지는 문법<\/b>):<\/p>\n<pre class=\"code\">&lt;assign&gt; → &lt;id&gt; = &lt;expr&gt;\n&lt;id&gt;     → A | B | C\n&lt;expr&gt;   → &lt;expr&gt; + &lt;term&gt;   | &lt;term&gt;\n&lt;term&gt;   → &lt;term&gt; * &lt;factor&gt; | &lt;factor&gt;\n&lt;factor&gt; → ( &lt;expr&gt; )        | &lt;id&gt;<\/pre>\n<p><code>*<\/code>는 <code>&lt;term&gt;<\/code> 단계, <code>+<\/code>는 <code>&lt;expr&gt;<\/code> 단계 → <code>*<\/code>가 항상 아래 → 먼저 계산.<\/p>\n<p><code>A = B + C * A<\/code> 의 최좌단 유도 (L04 p.37에도 나옴):<\/p>\n<pre class=\"code\">&lt;assign&gt; ⇒ &lt;id&gt; = &lt;expr&gt;\n         ⇒ A = &lt;expr&gt;\n         ⇒ A = &lt;expr&gt; + &lt;term&gt;\n         ⇒ A = &lt;term&gt; + &lt;term&gt;\n         ⇒ A = &lt;factor&gt; + &lt;term&gt;\n         ⇒ A = &lt;id&gt; + &lt;term&gt;\n         ⇒ A = B + &lt;term&gt;\n         ⇒ A = B + &lt;term&gt; * &lt;factor&gt;\n         ⇒ A = B + &lt;factor&gt; * &lt;factor&gt;\n         ⇒ A = B + &lt;id&gt; * &lt;factor&gt;\n         ⇒ A = B + C * &lt;factor&gt;\n         ⇒ A = B + C * &lt;id&gt;\n         ⇒ A = B + C * A<\/pre>\n<p>파스 트리:<\/p>\n<pre class=\"code\">          &lt;assign&gt;\n        /    |     \\\n     &lt;id&gt;    =     &lt;expr&gt;\n      |          /   |    \\\n      A      &lt;expr&gt;  +    &lt;term&gt;\n               |         /  |   \\\n            &lt;term&gt;   &lt;term&gt; *  &lt;factor&gt;\n               |        |         |\n           &lt;factor&gt;  &lt;factor&gt;   &lt;id&gt;\n               |        |         |\n             &lt;id&gt;     &lt;id&gt;        A\n               |        |\n               B        C<\/pre>\n<div class=\"callout\">괄호가 있으면 <code>&lt;factor&gt; → ( &lt;expr&gt; )<\/code>를 써서 다시 <code>&lt;expr&gt;<\/code>로 올라간다. 24 중간 10번이 이 문법으로 괄호 있는 문장 2개를 유도하는 문제였어.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">03주-1<\/span><br>파스 트리는 잎에서부터 위로 평가된다. 그래서 먼저 계산돼야 하는(우선순위 높은) 연산자가 트리 아래쪽에 있어야 한다. 그래서 우선순위가 낮은 + 를 &lt;expr&gt;에서 먼저(위에서) 전개하고, * 는 &lt;term&gt;에서 전개한다.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L03-p24.jpg\" aria-label=\"크게 보기\"><img src=\"img/L03-p24.jpg\" alt=\"L03 p.24 · 모호하지 않은 문법으로 만든 A = B + C * A 의 파스 트리 (*가 더 아래)\" loading=\"lazy\"><\/button><figcaption>L03 p.24 · 모호하지 않은 문법으로 만든 A = B + C * A 의 파스 트리 (*가 더 아래)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-associativity\"><h3>결합성 (Associativity)<\/h3><p>같은 우선순위 연산자가 연속될 때 어느 쪽부터 묶을지도 문법으로 표현한다.<\/p>\n<pre class=\"code\">&lt;expr&gt; → &lt;expr&gt; + &lt;expr&gt; | const    (모호)\n&lt;expr&gt; → &lt;expr&gt; + const  | const    (모호하지 않음)<\/pre>\n<ul><li><b>좌순환<\/b> 규칙 (LHS가 RHS의 <b>맨 왼쪽<\/b>에 나옴) → <b>좌결합<\/b>. <code>const + const + const<\/code> = <code>(const + const) + const<\/code>.<\/li><li><b>우순환<\/b> 규칙 (LHS가 RHS의 맨 오른쪽) → <b>우결합<\/b>. 예) 거듭제곱 <code>&lt;factor&gt; → &lt;exp&gt; ** &lt;factor&gt; | &lt;exp&gt;<\/code>.<\/li><\/ul>\n<div class=\"callout trap\">함정: 좌순환 = 좌결합에 좋지만, Ch.4에서 배우는 <b>하향식 파서는 좌순환을 못 다룬다<\/b>. 이 연결고리가 시험에 나오기 좋다.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L03-p25.jpg\" aria-label=\"크게 보기\"><img src=\"img/L03-p25.jpg\" alt=\"L03 p.25 · 좌순환 규칙 &lt;expr&gt; → &lt;expr&gt; + const 의 파스 트리 (왼쪽으로 깊어짐 = 좌결합)\" loading=\"lazy\"><\/button><figcaption>L03 p.25 · 좌순환 규칙 &lt;expr&gt; → &lt;expr&gt; + const 의 파스 트리 (왼쪽으로 깊어짐 = 좌결합)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-dangling-else\"><h3>if-then-else 모호성 (dangling else)<\/h3><pre class=\"code\">&lt;if_stmt&gt; → if (&lt;logic_expr&gt;) then &lt;stmt&gt;\n          | if (&lt;logic_expr&gt;) then &lt;stmt&gt; else &lt;stmt&gt;<\/pre>\n<p><code>if C1 then if C2 then S1 else S2<\/code> 에서 <code>else<\/code>가 바깥 if에 붙는지 안쪽 if에 붙는지 두 트리가 생김 → <b>모호<\/b>.<\/p>\n<p>대부분의 언어 규칙: <b>else는 가장 가까운 짝 없는 then과 짝지어진다.<\/b><br>모호하지 않은 문법:<\/p>\n<pre class=\"code\">&lt;stmt&gt;      → &lt;matched&gt; | &lt;unmatched&gt;\n&lt;matched&gt;   → if (&lt;logic_expr&gt;) then &lt;matched&gt; else &lt;matched&gt;\n            | a non-if statement\n&lt;unmatched&gt; → if (&lt;logic_expr&gt;) then &lt;stmt&gt;\n            | if (&lt;logic_expr&gt;) then &lt;matched&gt; else &lt;unmatched&gt;<\/pre>\n<p>핵심 아이디어: then과 else 사이에는 <b>matched<\/b>(else까지 짝이 다 맞은) 문장만 올 수 있다.<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">03주-1<\/span><br>else는 매칭되지 않은 가장 가까운 then(if)과 짝지어진다는 규칙을 문법으로 표현한 게 matched/unmatched 문법.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L03-p26.jpg\" aria-label=\"크게 보기\"><img src=\"img/L03-p26.jpg\" alt=\"L03 p.26 · if-then-else 문법의 모호성: 같은 문장의 두 파스 트리\" loading=\"lazy\"><\/button><figcaption>L03 p.26 · if-then-else 문법의 모호성: 같은 문장의 두 파스 트리<\/figcaption><\/figure><\/section>"}, {"id": "L2-5", "title": "EBNF", "src": "L03 p.28–30", "secs": [{"id": "ebnf", "title": "EBNF 확장 3가지"}, {"id": "ebnf-variants", "title": "최근의 EBNF 변형"}], "md": "## EBNF 확장 3가지 {#ebnf}\n\nBNF를 짧게 쓰기 위한 확장. 표현력은 BNF와 같다.\n\n| 표기 | 의미 | 예 |\n|---|---|---|\n| `[ ]` | 선택(0 또는 1번) | `<if_stmt> → if (<expr>) <stmt> [else <stmt>]` |\n| `{ }` | 0번 이상 반복 | `<ident> → letter {letter | digit}` |\n| `( | )` | 여러 대안 중 하나 | `<term> → <term> (+ | -) const` |\n\nBNF → EBNF 변환:\n```\nBNF:  <expr> → <expr> + <term> | <expr> - <term> | <term>\n      <term> → <term> * <factor> | <term> / <factor> | <factor>\nEBNF: <expr> → <term> {(+ | -) <term>}\n      <term> → <factor> {(* | /) <factor>}\n```\n변환 요령: `A → A α | β` 꼴(좌순환)은 `A → β {α}` 로 바꾼다.\n\n> 주의: EBNF로 바꾸면 좌순환이 `{}` 반복으로 사라지므로 결합성 정보가 문법에서 안 보인다 → 파서(구현)가 좌결합을 맞춰줘야 한다. 그리고 비단말 수가 줄어서 **재귀 하강 파서의 기반으로 딱 좋다** (Ch.4).\n\n## 최근의 EBNF 변형 {#ebnf-variants}\n\n- RHS 대안들을 각각 다른 줄에 씀, `→` 대신 `:` 사용\n- 선택 부분에 아래첨자 `opt`: `ConstructorDeclarator → SimpleName (FormalParameterList_opt)`\n- 선택지에 `one of`: `AssignmentOperator → one of = *= /= %= += -= ...`", "html": "<section class=\"sec\" id=\"s-ebnf\"><h3>EBNF 확장 3가지<\/h3><p>BNF를 짧게 쓰기 위한 확장. 표현력은 BNF와 같다.<\/p>\n<div class=\"tblw\"><table><thead><tr><th>표기<\/th><th>의미<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td><code>[ ]<\/code><\/td><td>선택(0 또는 1번)<\/td><td><code>&lt;if_stmt&gt; → if (&lt;expr&gt;) &lt;stmt&gt; [else &lt;stmt&gt;]<\/code><\/td><\/tr><tr><td><code>{ }<\/code><\/td><td>0번 이상 반복<\/td><td>`&lt;ident&gt; → letter {letter<\/td><td>digit}`<\/td><\/tr><tr><td>`(<\/td><td>)`<\/td><td>여러 대안 중 하나<\/td><td>`&lt;term&gt; → &lt;term&gt; (+<\/td><td>-) const`<\/td><\/tr><\/tbody><\/table><\/div>\n<p>BNF → EBNF 변환:<\/p>\n<pre class=\"code\">BNF:  &lt;expr&gt; → &lt;expr&gt; + &lt;term&gt; | &lt;expr&gt; - &lt;term&gt; | &lt;term&gt;\n      &lt;term&gt; → &lt;term&gt; * &lt;factor&gt; | &lt;term&gt; / &lt;factor&gt; | &lt;factor&gt;\nEBNF: &lt;expr&gt; → &lt;term&gt; {(+ | -) &lt;term&gt;}\n      &lt;term&gt; → &lt;factor&gt; {(* | /) &lt;factor&gt;}<\/pre>\n<p>변환 요령: <code>A → A α | β<\/code> 꼴(좌순환)은 <code>A → β {α}<\/code> 로 바꾼다.<\/p>\n<div class=\"callout trap\">주의: EBNF로 바꾸면 좌순환이 <code>{}<\/code> 반복으로 사라지므로 결합성 정보가 문법에서 안 보인다 → 파서(구현)가 좌결합을 맞춰줘야 한다. 그리고 비단말 수가 줄어서 <b>재귀 하강 파서의 기반으로 딱 좋다<\/b> (Ch.4).<\/div><\/section>\n<section class=\"sec\" id=\"s-ebnf-variants\"><h3>최근의 EBNF 변형<\/h3><ul><li>RHS 대안들을 각각 다른 줄에 씀, <code>→<\/code> 대신 <code>:<\/code> 사용<\/li><li>선택 부분에 아래첨자 <code>opt<\/code>: <code>ConstructorDeclarator → SimpleName (FormalParameterList_opt)<\/code><\/li><li>선택지에 <code>one of<\/code>: <code>AssignmentOperator → one of = *= /= %= += -= ...<\/code><\/li><\/ul><\/section>"}]}, {"id": "U3", "title": "Ch.3 속성 문법 · 의미론 (최약 전조건)", "src": "L03 p.31–38 + 2026-02, PL, 03-02.pdf", "intro": "24 중간에서 9·11·12·19번, 합쳐서 23점이 공리 의미론이었어. 최약 전조건 계산은 기계적으로 풀리니까 여기서 점수를 확실히 챙겨.", "lessons": [{"id": "L3-1", "title": "정적 의미론 · 속성 문법", "src": "L03 p.31–38 (= 03-02 p.2–9)", "secs": [{"id": "static-semantics", "title": "정적 의미론 (Static semantics)"}, {"id": "ag-def", "title": "속성 문법의 정의"}, {"id": "ag-attr-kinds", "title": "합성 · 상속 · 내장 속성"}, {"id": "ag-example", "title": "속성 문법 예제"}], "md": "## 정적 의미론 (Static semantics) {#static-semantics}\n\n**CFG(BNF)로는 언어의 구문을 전부 기술할 수 없다.** 문제가 되는 두 부류:\n- 문맥 자유지만 **번거로운** 것: 식에서 피연산자의 타입 규칙 (모든 타입 조합을 규칙으로 쓰면 문법이 폭발)\n- **문맥 자유가 아닌** 것: \"변수는 사용 전에 선언돼야 한다\"\n\n정적 의미론:\n- 이름과 달리 \"의미\"와는 거의 관계없음. 프로그램의 의미와 **간접적으로** 관련.\n- 프로그램의 **적법한 형식** (legal forms)에 대한 규칙. 대부분 타입 제약.\n- \"정적\" = **컴파일 시간**에 검사 가능.\n\n## 속성 문법의 정의 {#ag-def}\n\n**속성 문법 (AG)** = CFG + 파스 트리 노드에 의미 정보(속성)를 붙이는 장치.\n주된 용도: **정적 의미론 명세**, **컴파일러 설계**(정적 의미 검사).\n\nCFG G = (S, N, T, P)에 다음을 추가:\n- 각 문법 기호 X에 **속성 집합 A(X)**\n- 각 규칙에 **의미 함수** (semantic function) 집합 + (비어 있을 수 있는) **술어 함수** (predicate function) 집합\n- 술어 함수 = 속성들과 리터럴 값에 대한 **불리언 식**. 거짓이면 규칙 위반(오류).\n- 모든 속성 값이 계산된 파스 트리를 **완전히 속성화된** (fully attributed) 트리라고 함.\n\n## 합성 · 상속 · 내장 속성 {#ag-attr-kinds}\n\n규칙 `X0 → X1 … Xn` 에 대해:\n\n| 종류 | 형태 | 정보 흐름 |\n|---|---|---|\n| **합성 속성** (synthesized) | `S(X0) = f(A(X1), …, A(Xn))` | 자식 → 부모 (**위로**) |\n| **상속 속성** (inherited) | `I(Xj) = f(A(X0), …, A(Xn))`, 1 ≤ j ≤ n | 부모·형제 → 자식 (**아래로/옆으로**) |\n| **내장 속성** (intrinsic) | 잎(leaf) 노드에 처음부터 있는 값 | 예) 심볼 테이블에서 찾은 변수 타입 |\n\n계산 순서:\n- 모두 상속 속성이면 → **하향식** 순서로 트리를 장식할 수 있음\n- 모두 합성 속성이면 → **상향식** 순서\n- 보통은 둘 다 써서 하향식 + 상향식을 섞어야 함\n\n> 외우는 법: **합성 = 아래에서 모아 올림(Synthesize)**, **상속 = 부모에게 물려받음(Inherit)**.\n\n## 속성 문법 예제 {#ag-example}\n\n```\n<assign> → <var> = <expr>\n<expr>   → <var> + <var> | <var>\n<var>    → A | B | C\n```\n- `actual_type`: `<var>`, `<expr>`의 **합성** 속성 (실제 타입)\n- `expected_type`: `<expr>`의 **상속** 속성 (기대 타입, 부모가 정해줌)\n\n규칙별 의미 함수 / 술어:\n```\n1. <assign> → <var> = <expr>\n   의미 규칙: <expr>.expected_type ← <var>.actual_type\n2. <expr> → <var>[1] + <var>[2]\n   의미 규칙: <expr>.actual_type ← <var>[1].actual_type\n   술어:     <var>[1].actual_type == <var>[2].actual_type\n             <expr>.expected_type == <expr>.actual_type\n3. <expr> → <var>\n   의미 규칙: <expr>.actual_type ← <var>.actual_type\n   술어:     <expr>.expected_type == <expr>.actual_type\n4. <var> → A | B | C\n   의미 규칙: <var>.actual_type ← lookup(<var>.string)\n```\n`A = A + B` 를 장식하는 순서:\n1. `<var>.actual_type ← lookup(A)` (좌변 A)\n2. `<expr>.expected_type ← <var>.actual_type` (상속: 위→아래)\n3. `<var>[1].actual_type ← lookup(A)`, `<var>[2].actual_type ← lookup(B)` (내장/잎)\n4. `<var>[1].actual_type =? <var>[2].actual_type` (술어)\n5. `<expr>.actual_type ← <var>[1].actual_type` (합성: 아래→위)\n6. `<expr>.actual_type =? <expr>.expected_type` (술어)", "html": "<section class=\"sec\" id=\"s-static-semantics\"><h3>정적 의미론 (Static semantics)<\/h3><p><b>CFG(BNF)로는 언어의 구문을 전부 기술할 수 없다.<\/b> 문제가 되는 두 부류:<\/p>\n<ul><li>문맥 자유지만 <b>번거로운<\/b> 것: 식에서 피연산자의 타입 규칙 (모든 타입 조합을 규칙으로 쓰면 문법이 폭발)<\/li><li><b>문맥 자유가 아닌<\/b> 것: \"변수는 사용 전에 선언돼야 한다\"<\/li><\/ul>\n<p>정적 의미론:<\/p>\n<ul><li>이름과 달리 \"의미\"와는 거의 관계없음. 프로그램의 의미와 <b>간접적으로<\/b> 관련.<\/li><li>프로그램의 <b>적법한 형식<\/b> (legal forms)에 대한 규칙. 대부분 타입 제약.<\/li><li>\"정적\" = <b>컴파일 시간<\/b>에 검사 가능.<\/li><\/ul><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">03주-2<\/span><br>예: A = A + 3 에서 A가 정수면 그냥 덧셈이지만 포인터면 주소 연산이 된다 → 타입 정보가 필요. '변수가 미리 선언됐는가'도 BNF만으로는 확인 못 한다. 이런 추가 정보를 붙이는 게 속성 문법.<\/div><\/section>\n<section class=\"sec\" id=\"s-ag-def\"><h3>속성 문법의 정의<\/h3><p><b>속성 문법 (AG)<\/b> = CFG + 파스 트리 노드에 의미 정보(속성)를 붙이는 장치.<br>주된 용도: <b>정적 의미론 명세<\/b>, <b>컴파일러 설계<\/b>(정적 의미 검사).<\/p>\n<p>CFG G = (S, N, T, P)에 다음을 추가:<\/p>\n<ul><li>각 문법 기호 X에 <b>속성 집합 A(X)<\/b><\/li><li>각 규칙에 <b>의미 함수<\/b> (semantic function) 집합 + (비어 있을 수 있는) <b>술어 함수<\/b> (predicate function) 집합<\/li><li>술어 함수 = 속성들과 리터럴 값에 대한 <b>불리언 식<\/b>. 거짓이면 규칙 위반(오류).<\/li><li>모든 속성 값이 계산된 파스 트리를 <b>완전히 속성화된<\/b> (fully attributed) 트리라고 함.<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-ag-attr-kinds\"><h3>합성 · 상속 · 내장 속성<\/h3><p>규칙 <code>X0 → X1 … Xn<\/code> 에 대해:<\/p>\n<div class=\"tblw\"><table><thead><tr><th>종류<\/th><th>형태<\/th><th>정보 흐름<\/th><\/tr><\/thead><tbody><tr><td><b>합성 속성<\/b> (synthesized)<\/td><td><code>S(X0) = f(A(X1), …, A(Xn))<\/code><\/td><td>자식 → 부모 (<b>위로<\/b>)<\/td><\/tr><tr><td><b>상속 속성<\/b> (inherited)<\/td><td><code>I(Xj) = f(A(X0), …, A(Xn))<\/code>, 1 ≤ j ≤ n<\/td><td>부모·형제 → 자식 (<b>아래로/옆으로<\/b>)<\/td><\/tr><tr><td><b>내장 속성<\/b> (intrinsic)<\/td><td>잎(leaf) 노드에 처음부터 있는 값<\/td><td>예) 심볼 테이블에서 찾은 변수 타입<\/td><\/tr><\/tbody><\/table><\/div>\n<p>계산 순서:<\/p>\n<ul><li>모두 상속 속성이면 → <b>하향식<\/b> 순서로 트리를 장식할 수 있음<\/li><li>모두 합성 속성이면 → <b>상향식<\/b> 순서<\/li><li>보통은 둘 다 써서 하향식 + 상향식을 섞어야 함<\/li><\/ul>\n<div class=\"callout\">외우는 법: <b>합성 = 아래에서 모아 올림(Synthesize)<\/b>, <b>상속 = 부모에게 물려받음(Inherit)<\/b>.<\/div><\/section>\n<section class=\"sec\" id=\"s-ag-example\"><h3>속성 문법 예제<\/h3><pre class=\"code\">&lt;assign&gt; → &lt;var&gt; = &lt;expr&gt;\n&lt;expr&gt;   → &lt;var&gt; + &lt;var&gt; | &lt;var&gt;\n&lt;var&gt;    → A | B | C<\/pre>\n<ul><li><code>actual_type<\/code>: <code>&lt;var&gt;<\/code>, <code>&lt;expr&gt;<\/code>의 <b>합성<\/b> 속성 (실제 타입)<\/li><li><code>expected_type<\/code>: <code>&lt;expr&gt;<\/code>의 <b>상속<\/b> 속성 (기대 타입, 부모가 정해줌)<\/li><\/ul>\n<p>규칙별 의미 함수 / 술어:<\/p>\n<pre class=\"code\">1. &lt;assign&gt; → &lt;var&gt; = &lt;expr&gt;\n   의미 규칙: &lt;expr&gt;.expected_type ← &lt;var&gt;.actual_type\n2. &lt;expr&gt; → &lt;var&gt;[1] + &lt;var&gt;[2]\n   의미 규칙: &lt;expr&gt;.actual_type ← &lt;var&gt;[1].actual_type\n   술어:     &lt;var&gt;[1].actual_type == &lt;var&gt;[2].actual_type\n             &lt;expr&gt;.expected_type == &lt;expr&gt;.actual_type\n3. &lt;expr&gt; → &lt;var&gt;\n   의미 규칙: &lt;expr&gt;.actual_type ← &lt;var&gt;.actual_type\n   술어:     &lt;expr&gt;.expected_type == &lt;expr&gt;.actual_type\n4. &lt;var&gt; → A | B | C\n   의미 규칙: &lt;var&gt;.actual_type ← lookup(&lt;var&gt;.string)<\/pre>\n<p><code>A = A + B<\/code> 를 장식하는 순서:<\/p>\n<ol><li><code>&lt;var&gt;.actual_type ← lookup(A)<\/code> (좌변 A)<\/li><li><code>&lt;expr&gt;.expected_type ← &lt;var&gt;.actual_type<\/code> (상속: 위→아래)<\/li><li><code>&lt;var&gt;[1].actual_type ← lookup(A)<\/code>, <code>&lt;var&gt;[2].actual_type ← lookup(B)<\/code> (내장/잎)<\/li><li><code>&lt;var&gt;[1].actual_type =? &lt;var&gt;[2].actual_type<\/code> (술어)<\/li><li><code>&lt;expr&gt;.actual_type ← &lt;var&gt;[1].actual_type<\/code> (합성: 아래→위)<\/li><li><code>&lt;expr&gt;.actual_type =? &lt;expr&gt;.expected_type<\/code> (술어)<\/li><\/ol><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">03주-2<\/span><br>속성 값을 계산하는 순서 자체는 중요하지 않다. 어느 쪽부터 가든 결국 잎(터미널)의 내장 속성(심볼 테이블 lookup)까지 따라가서 값을 가져오면 된다.<\/div><\/section>"}, {"id": "L3-2", "title": "동적 의미론 3가지 · 연산 · 표기 의미론", "src": "03-02 p.10–19, 37", "secs": [{"id": "sem-why", "title": "왜 의미론을 형식적으로 기술하나"}, {"id": "sem-three", "title": "세 가지 방법 비교"}, {"id": "operational", "title": "연산 의미론"}, {"id": "denotational", "title": "표기 의미론"}], "md": "## 왜 의미론을 형식적으로 기술하나 {#sem-why}\n\n의미를 기술하는 단 하나의 표준 표기법은 없다. 그래도 필요한 이유:\n- 프로그래머가 문장의 의미를 정확히 알아야 함\n- 컴파일러 작성자가 구조가 정확히 뭘 하는지 알아야 함\n- **정확성 증명**이 가능해짐 (공리 의미론)\n- 컴파일러 생성기(compiler generator)가 가능해짐\n- 설계자가 모호성·비일관성을 발견\n\n## 세 가지 방법 비교 {#sem-three}\n\n| 방법 | 핵심 아이디어 | 기반 |\n|---|---|---|\n| **연산 의미론** (Operational) | 이상적/가상 기계에서 실행했을 때 **기계 상태의 변화**로 의미를 정의 | 저수준 언어(가상 기계) |\n| **표기 의미론** (Denotational) | 구문 요소를 **수학적 객체(재귀 함수)** 로 사상해 의미를 정의 | 재귀 함수 이론 |\n| **공리 의미론** (Axiomatic) | 각 문장에 **공리·추론 규칙(전조건/후조건)** 을 정의해 정확성을 증명 | 형식 논리(술어 계산) |\n\n> 시험 대비: \"세 의미론을 각각 한 줄로\" 문제를 대비해 위 표의 \"핵심 아이디어\"를 그대로 외워.\n\n## 연산 의미론 {#operational}\n\n- 문장을 (시뮬레이션된 혹은 실제) 기계에서 실행해서 **기계 상태(메모리, 레지스터 등)의 변화**로 의미를 정의.\n- 수학이 아니라 **더 낮은 수준의 프로그래밍 언어**의 문장으로 기술 → 고급 언어에 쓰려면 **가상 기계**가 필요.\n- 예) C의 for문을 저수준 문장으로:\n```\nfor (expr1; expr2; expr3) { ... }\n\n        expr1;\nloop:   if expr2 == 0 goto out\n        ...\n        expr3;\n        goto loop\nout:    ...\n```\n- 평가: 비형식적으로 쓰면 좋음(언어 매뉴얼 등). 형식적으로 쓰면 매우 복잡(VDL로 PL/I 기술).\n\n## 표기 의미론 {#denotational}\n\n- **재귀 함수 이론**에 기반.\n- 명세 만드는 과정: (1) 각 언어 개체에 대응하는 **수학적 객체**를 정의 → (2) 언어 개체의 인스턴스를 수학적 객체의 인스턴스로 사상하는 **함수**를 정의.\n  - 함수의 정의역 = **구문 정의역** (syntactic domain), 치역 = **의미 정의역** (semantic domain)\n- 언어 구조의 의미는 **프로그램 변수들의 값만으로** 정의된다.\n- **프로그램 상태**: `s = {<i1,v1>, <i2,v2>, …, <in,vn>}` (모든 현재 변수의 값)\n- `VARMAP(ij, s) = vj` : 변수 이름과 상태를 받아 현재 값을 돌려줌\n\n십진수 예:\n```\n<dec_num> → '0' | '1' | … | '9' | <dec_num> ('0' | '1' | … | '9')\n\nMdec('0') = 0, Mdec('1') = 1, …, Mdec('9') = 9\nMdec(<dec_num> '0') = 10 * Mdec(<dec_num>)\nMdec(<dec_num> '1') = 10 * Mdec(<dec_num>) + 1\n…\nMdec(<dec_num> '9') = 10 * Mdec(<dec_num>) + 9\n```\n예) `Mdec('47') = 10 * Mdec('4') + 7 = 47`\n\n논리 사전검사 루프 (상태 집합 → 상태 집합 ∪ {error}):\n```\nMl(while B do L, s) =\n    if Mb(B, s) == undef then error\n    else if Mb(B, s) == false then s\n    else if Msl(L, s) == error then error\n    else Ml(while B do L, Msl(L, s))\n```\n루프가 **재귀**로 표현된다는 게 핵심.\n\n평가: 언어를 정밀하게 기술하는 훌륭한 방법, 언어 설계에 도움. 복잡해서 언어 사용자에게는 거의 쓸모없음.\n\n**연산 vs 표기**: 연산 의미론은 상태 변화를 **코딩된 알고리즘**으로, 표기 의미론은 **엄밀한 수학 함수**로 정의.", "html": "<section class=\"sec\" id=\"s-sem-why\"><h3>왜 의미론을 형식적으로 기술하나<\/h3><p>의미를 기술하는 단 하나의 표준 표기법은 없다. 그래도 필요한 이유:<\/p>\n<ul><li>프로그래머가 문장의 의미를 정확히 알아야 함<\/li><li>컴파일러 작성자가 구조가 정확히 뭘 하는지 알아야 함<\/li><li><b>정확성 증명<\/b>이 가능해짐 (공리 의미론)<\/li><li>컴파일러 생성기(compiler generator)가 가능해짐<\/li><li>설계자가 모호성·비일관성을 발견<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-sem-three\"><h3>세 가지 방법 비교<\/h3><div class=\"tblw\"><table><thead><tr><th>방법<\/th><th>핵심 아이디어<\/th><th>기반<\/th><\/tr><\/thead><tbody><tr><td><b>연산 의미론<\/b> (Operational)<\/td><td>이상적/가상 기계에서 실행했을 때 <b>기계 상태의 변화<\/b>로 의미를 정의<\/td><td>저수준 언어(가상 기계)<\/td><\/tr><tr><td><b>표기 의미론<\/b> (Denotational)<\/td><td>구문 요소를 <b>수학적 객체(재귀 함수)<\/b> 로 사상해 의미를 정의<\/td><td>재귀 함수 이론<\/td><\/tr><tr><td><b>공리 의미론<\/b> (Axiomatic)<\/td><td>각 문장에 <b>공리·추론 규칙(전조건/후조건)<\/b> 을 정의해 정확성을 증명<\/td><td>형식 논리(술어 계산)<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout exam\">시험 대비: \"세 의미론을 각각 한 줄로\" 문제를 대비해 위 표의 \"핵심 아이디어\"를 그대로 외워.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">03주-2<\/span><br>세 가지 의미론 중 공리 의미론이 가장 중요하고 난이도도 있다고 강조 (계산 문제로 나옴). 연산·표기 의미론은 개념 위주로.<\/div><\/section>\n<section class=\"sec\" id=\"s-operational\"><h3>연산 의미론<\/h3><ul><li>문장을 (시뮬레이션된 혹은 실제) 기계에서 실행해서 <b>기계 상태(메모리, 레지스터 등)의 변화<\/b>로 의미를 정의.<\/li><li>수학이 아니라 <b>더 낮은 수준의 프로그래밍 언어<\/b>의 문장으로 기술 → 고급 언어에 쓰려면 <b>가상 기계<\/b>가 필요.<\/li><li>예) C의 for문을 저수준 문장으로:<\/li><\/ul>\n<pre class=\"code\">for (expr1; expr2; expr3) { ... }\n\n        expr1;\nloop:   if expr2 == 0 goto out\n        ...\n        expr3;\n        goto loop\nout:    ...<\/pre>\n<ul><li>평가: 비형식적으로 쓰면 좋음(언어 매뉴얼 등). 형식적으로 쓰면 매우 복잡(VDL로 PL/I 기술).<\/li><\/ul><figure class=\"slide\"><bu
