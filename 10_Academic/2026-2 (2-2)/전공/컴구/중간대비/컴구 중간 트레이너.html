w: RegWrite, MemRead, rt가 destination<\/button><\/div><\/section>\n<section class=\"sec\" id=\"s-dp-sw\"><h3>sw ($t0, offset($s1))<\/h3><ul><li>주소 계산은 lw와 같음 → <b>ALUSrc = 1<\/b>, ALUOp = 00.<\/li><li>rt의 값(Read data 2)이 data memory의 <b>Write data<\/b>로 → <b>MemWrite = 1<\/b>.<\/li><li>레지스터에 쓰지 않음 → <b>RegWrite = 0<\/b>, 그래서 RegDst와 MemtoReg는 <b>X (don't care)<\/b>.<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-dp-beq\"><h3>beq (rs, rt, offset)<\/h3><ul><li>opcode → Control이 <b>Branch = 1<\/b>.<\/li><li>두 레지스터를 <b>빼서<\/b> 비교 → ALU 입력 둘 다 레지스터 → <b>ALUSrc = 0<\/b>, ALUOp = 01 (빼기).<\/li><li>같으면 ALU <b>Zero = 1<\/b> → <b>AND(Branch, Zero) = 1<\/b> → PC MUX가 <b>branch target(1번)<\/b> 선택. 다르면 0 → <b>PC + 4(0번)<\/b>.<\/li><li>분기 대상: offset sign-extend → shift left 2 → (PC + 4)에 더함.<\/li><li>레지스터 쓰기 없음 → RegWrite = 0, RegDst = X, MemtoReg = X. 메모리 접근 없음.<\/li><\/ul><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-1:34\">▶ 06주-1 28:29 전체 회로에서: 분기 대상 계산<\/button><button class=\"btn sm ghost\" data-walk=\"w6-1:35\">▶ 06주-1 29:14 Control의 Branch 신호 → AND<\/button><button class=\"btn sm ghost\" data-walk=\"w6-1:36\">▶ 06주-1 29:51 ALU Zero → AND → 분기<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:14\">▶ 06주-2 19:30 beq: opcode → Branch = 1 → AND<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:15\">▶ 06주-2 20:55 ALU로 빼서 Zero 확인<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:16\">▶ 06주-2 21:58 beq: 레지스터 안 씀, ALUSrc = 0<\/button><\/div><\/section>\n<section class=\"sec\" id=\"s-mux-trap\"><h3>MUX 숫자 함정 (p.3 MemtoReg)<\/h3><p>p.3 그림의 MUX 3개는 <b>0이 위<\/b>인데, 맨 오른쪽 <b>MemtoReg MUX는 1이 위<\/b>(Read data), <b>0이 아래<\/b>(ALU result).<\/p>\n<ul><li>교수님 설명: \"ALU 결과를 고르려면 0, data memory 값을 고르려면 1\" → 그림 숫자와 일치. 위/아래가 아니라 <b>숫자<\/b>를 봐야 함.<\/li><li>교수님: \"if I flip the numbers on your multiplexer … you will have to generate a total opposite signal\". 시험 그림에서 숫자가 바뀌면 답도 바뀜.<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: MUX 문제를 풀 땐 ① 원하는 입력선 찾기 ② 그 선에 적힌 숫자 = 신호값. 표를 외워서 쓰지 말 것.<\/div><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-2:8\">▶ 06주-2 14:17 MUX 숫자가 뒤집히면 신호도 반대<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:12\">▶ 06주-2 17:39 세 번째 MUX: MemtoReg (1이 위!)<\/button><\/div><\/section>\n<section class=\"sec\" id=\"s-branch-calc\"><h3>분기 오프셋 계산 (판서 예제)<\/h3><p><b>Offset = (Target − (PC + 4)) / 4<\/b>, <b>Target = (PC + 4) + Offset × 4<\/b><\/p>\n<p>6주-2 판서: PC = 108 → PC + 4 = 112, 목표 = 124<\/p>\n<pre class=\"code\">(124 − 112) / 4 = 3          → beq rs, rt, 3\n3 (16-bit) → sign-extend → 0000 … 0011 (32-bit)\nshift left 2 → 12\n112 + 12 = 124  ✓<\/pre>\n<p>6주-1 판서: 100번지의 beq, 목표 180 → (180 − 104) / 4 = 76 / 4 = <b>19<\/b>.<\/p>\n<ul><li>목표가 위쪽(이전 코드)이면 <b>음수 오프셋<\/b> → sign extension으로 위 비트가 1로 채워짐.<\/li><\/ul><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-1:32\">▶ 06주-1 26:19 판서: 100번 줄 → 180번 줄 = 19<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:18\">▶ 06주-2 23:23 분기 상수는 &#x27;줄 수 차이&#x27;<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:19\">▶ 06주-2 24:23 판서: PC 108 → 목표 124 = 3<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:21\">▶ 06주-2 26:05 Shift left 2 = ×4 → 12, 112 + 12 = 124<\/button><\/div><\/section>", "title_en": "Tracing the Full Datapath (R-type · lw · sw · beq)", "exam_en": "Signal values and MUX numbers", "html_en": "<section class=\"sec\" id=\"s-dp-fields\"><h3>Where the Instruction Fields Go<\/h3><p>Where the 32-bit instruction is split in the p.3 figure:<\/p>\n<div class=\"tblw\"><table><thead><tr><th>Field<\/th><th>Bits<\/th><th>Goes to<\/th><\/tr><\/thead><tbody><tr><td>opcode<\/td><td>[31–26]<\/td><td><b>Control<\/b><\/td><\/tr><tr><td>rs<\/td><td>[25–21]<\/td><td>Read register 1 (always read)<\/td><\/tr><tr><td>rt<\/td><td>[20–16]<\/td><td>Read register 2 <b>and<\/b> input 0 of the RegDst MUX<\/td><\/tr><tr><td>rd<\/td><td>[15–11]<\/td><td>Input 1 of the RegDst MUX<\/td><\/tr><tr><td>imm<\/td><td>[15–0]<\/td><td><b>Sign-extend<\/b> (16 → 32)<\/td><\/tr><tr><td>funct<\/td><td>[5–0]<\/td><td><b>ALU control<\/b><\/td><\/tr><\/tbody><\/table><\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p03.jpg\" aria-label=\"Enlarge\"><img src=\"img/w6-p03.jpg\" alt=\"week6 p.3 · A Simplified Version of CPU (the slide the professor said to understand &#x27;completely, this one page&#x27;)\" loading=\"lazy\"><\/button><figcaption>week6 p.3 · A Simplified Version of CPU (the slide the professor said to understand &#x27;completely, this one page&#x27;)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-dp-rtype\"><h3>R-type (add $t0, $s1, $s2)<\/h3><ul><li>opcode 000000 → Control outputs the R-type signals.<\/li><li>Read rs and rt → both ALU inputs are <b>registers<\/b> → <b>ALUSrc = 0<\/b>.<\/li><li>Write the result to <b>rd (the third register)<\/b> → the RegDst MUX selects [15–11] → <b>RegDst = 1<\/b> (on p.3, input 1 is rd).<\/li><li>The write data is the <b>ALU result<\/b> → <b>MemtoReg = 0<\/b>. <b>RegWrite = 1<\/b>.<\/li><li>No memory access → MemRead = MemWrite = 0. Branch = 0. ALUOp = 10 (funct determines the operation).<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-dp-lw\"><h3>lw ($t0, offset($s1))<\/h3><ul><li>Read rs = base, sign-extend the constant offset → the second ALU input is the <b>constant<\/b> → <b>ALUSrc = 1<\/b>.<\/li><li>The ALU <b>adds<\/b> to compute the address (ALUOp = 00). The ALU result is an <b>address<\/b>, not a value.<\/li><li>Read data memory → <b>MemRead = 1<\/b>.<\/li><li>Write the loaded value to a register → <b>MemtoReg = 1<\/b>, <b>RegWrite = 1<\/b>.<\/li><li>The register written is <b>rt (the second one)<\/b> → <b>RegDst = 0<\/b>.<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-dp-sw\"><h3>sw ($t0, offset($s1))<\/h3><ul><li>Address calculation is the same as lw → <b>ALUSrc = 1<\/b>, ALUOp = 00.<\/li><li>The value of rt (Read data 2) goes to the data memory's <b>Write data<\/b> → <b>MemWrite = 1<\/b>.<\/li><li>No register is written → <b>RegWrite = 0<\/b>, so RegDst and MemtoReg are <b>X (don't care)<\/b>.<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-dp-beq\"><h3>beq (rs, rt, offset)<\/h3><ul><li>opcode → Control sets <b>Branch = 1<\/b>.<\/li><li>Compare the two registers by <b>subtracting<\/b> → both ALU inputs are registers → <b>ALUSrc = 0<\/b>, ALUOp = 01 (subtract).<\/li><li>If equal, ALU <b>Zero = 1<\/b> → <b>AND(Branch, Zero) = 1<\/b> → the PC MUX selects the <b>branch target (input 1)<\/b>. Otherwise 0 → <b>PC + 4 (input 0)<\/b>.<\/li><li>Branch target: sign-extend the offset → shift left 2 → add to (PC + 4).<\/li><li>No register write → RegWrite = 0, RegDst = X, MemtoReg = X. No memory access.<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-mux-trap\"><h3>The MUX Number Trap (p.3 MemtoReg)<\/h3><p>In the p.3 figure, three of the MUXes have <b>0 on top<\/b>, but the rightmost <b>MemtoReg MUX has 1 on top<\/b> (Read data) and <b>0 on the bottom<\/b> (ALU result).<\/p>\n<ul><li>The professor explained: \"0 to select the ALU result, 1 to select the data memory value\" → matches the numbers in the figure. Look at the <b>numbers<\/b>, not top/bottom.<\/li><li>The professor: \"if I flip the numbers on your multiplexer … you will have to generate a total opposite signal\". If the exam figure swaps the numbers, the answer changes too.<\/li><\/ul>\n<div class=\"callout exam\">Exam point: For a MUX question: ① find the input wire you want ② the number written on that wire = the signal value. Do not just write down a memorized table.<\/div><\/section>\n<section class=\"sec\" id=\"s-branch-calc\"><h3>Branch Offset Calculation (board example)<\/h3><p><b>Offset = (Target − (PC + 4)) / 4<\/b>, <b>Target = (PC + 4) + Offset × 4<\/b><\/p>\n<p>Week 6-2 board: PC = 108 → PC + 4 = 112, target = 124<\/p>\n<pre class=\"code\">(124 − 112) / 4 = 3          → beq rs, rt, 3\n3 (16-bit) → sign-extend → 0000 … 0011 (32-bit)\nshift left 2 → 12\n112 + 12 = 124  ✓<\/pre>\n<p>Week 6-1 board: beq at address 100, target 180 → (180 − 104) / 4 = 76 / 4 = <b>19<\/b>.<\/p>\n<ul><li>If the target is above (earlier code), the offset is <b>negative<\/b> → sign extension fills the upper bits with 1s.<\/li><\/ul><\/section>"}, {"id": "L4-5", "title": "ALU control", "src": "week6 p.27–30", "exam": "ALUOp 표 읽기", "secs": [{"id": "alu-uses", "title": "ALU의 쓰임과 ALU control 코드", "title_en": "Uses of the ALU and the ALU Control Codes"}, {"id": "aluop", "title": "ALUOp와 funct로 ALU control 만들기", "title_en": "Generating ALU Control from ALUOp and funct"}, {"id": "kmap", "title": "K-map으로 구한 ALU control 논리", "title_en": "ALU Control Logic from the K-map"}], "md": "## ALU의 쓰임과 ALU control 코드 {#alu-uses}\n\n- Load/Store: F = **add** (주소 계산)\n- Branch: F = **subtract** (같은지 비교)\n- R-type: F는 **funct 필드**에 따라\n\n| ALU control | Function |\n|---|---|\n| 0000 | AND |\n| 0001 | OR |\n| 0010 | add |\n| 0110 | subtract |\n| 0111 | set-on-less-than |\n| 1100 | NOR |\n\n> 시험 포인트: 교수님 \"이 표는 외울 필요 없다. 시험에 주어진다. 대신 **읽고 회로에 적용**할 줄 알아야 한다.\" (6주-2 37:31, 어느 표를 가리켰는지는 녹음상 추정)\n\n## ALUOp와 funct로 ALU control 만들기 {#aluop}\n\n2-bit **ALUOp**는 opcode에서 (Main control이) 만들고, ALU control 유닛이 **ALUOp + funct(6 bit)**로 4-bit ALU control을 만든다 (조합 논리).\n\n| opcode | ALUOp | Operation | funct | ALU function | ALU control |\n|---|---|---|---|---|---|\n| lw | 00 | load word | XXXXXX | add | 0010 |\n| sw | 00 | store word | XXXXXX | add | 0010 |\n| beq | 01 | branch equal | XXXXXX | subtract | 0110 |\n| R-type | 10 | add | 100000 | add | 0010 |\n| | | subtract | 100010 | subtract | 0110 |\n| | | AND | 100100 | AND | 0000 |\n| | | OR | 100101 | OR | 0001 |\n| | | set-on-less-than | 101010 | set-on-less-than | 0111 |\n\n- lw/sw/beq는 I-type이라 **funct가 없음** → ALUOp만 보고 결정 (00 → 더하기, 01 → 빼기).\n- ALUOp = 10이면 ALU control이 **funct를 기다렸다가** 결정 (add = 32 = 100000).\n\n> 함정: R-type funct들은 전부 `10`으로 시작(100000, 100010, …)해서 R-type ALUOp `10`과 앞 두 비트가 같다. 교수님이 \"헷갈리지 말라\"고 짚은 부분 (6주-2 42:08).\n\n## K-map으로 구한 ALU control 논리 {#kmap}\n\nALU control 표를 진리표로 놓고 K-map으로 간단히 하면:\n```\nOp3 = 0\nOp2 = ALUOp0 + ALUOp1·F1\nOp1 = ¬ALUOp1 + ¬F2\nOp0 = ALUOp1·(F3 + F0)\n```\n> 함정: 교안 p.30에는 NOT 표시가 빠져서 `Op1 = ALUOp1 + F2`로 적혀 있음 (Op3 줄의 `APUOp0`도 오타). 그대로 쓰면 lw(ALUOp 00)에서 Op1 = 0이 나와 표(0010)와 안 맞는다. 위 식은 표의 8행 전부와 일치하는지 검산한 것.", "html": "<section class=\"sec\" id=\"s-alu-uses\"><h3>ALU의 쓰임과 ALU control 코드<\/h3><ul><li>Load/Store: F = <b>add<\/b> (주소 계산)<\/li><li>Branch: F = <b>subtract<\/b> (같은지 비교)<\/li><li>R-type: F는 <b>funct 필드<\/b>에 따라<\/li><\/ul>\n<div class=\"tblw\"><table><thead><tr><th>ALU control<\/th><th>Function<\/th><\/tr><\/thead><tbody><tr><td>0000<\/td><td>AND<\/td><\/tr><tr><td>0001<\/td><td>OR<\/td><\/tr><tr><td>0010<\/td><td>add<\/td><\/tr><tr><td>0110<\/td><td>subtract<\/td><\/tr><tr><td>0111<\/td><td>set-on-less-than<\/td><\/tr><tr><td>1100<\/td><td>NOR<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout exam\">시험 포인트: 교수님 \"이 표는 외울 필요 없다. 시험에 주어진다. 대신 <b>읽고 회로에 적용<\/b>할 줄 알아야 한다.\" (6주-2 37:31, 어느 표를 가리켰는지는 녹음상 추정)<\/div><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-2:32\">▶ 06주-2 37:15 이 표는 외우지 마라, 시험에 준다<\/button><\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p27.jpg\" aria-label=\"크게 보기\"><img src=\"img/w6-p27.jpg\" alt=\"week6 p.27 · ALU control 코드\" loading=\"lazy\"><\/button><figcaption>week6 p.27 · ALU control 코드<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-aluop\"><h3>ALUOp와 funct로 ALU control 만들기<\/h3><p>2-bit <b>ALUOp<\/b>는 opcode에서 (Main control이) 만들고, ALU control 유닛이 <b>ALUOp + funct(6 bit)<\/b>로 4-bit ALU control을 만든다 (조합 논리).<\/p>\n<div class=\"tblw\"><table><thead><tr><th>opcode<\/th><th>ALUOp<\/th><th>Operation<\/th><th>funct<\/th><th>ALU function<\/th><th>ALU control<\/th><\/tr><\/thead><tbody><tr><td>lw<\/td><td>00<\/td><td>load word<\/td><td>XXXXXX<\/td><td>add<\/td><td>0010<\/td><\/tr><tr><td>sw<\/td><td>00<\/td><td>store word<\/td><td>XXXXXX<\/td><td>add<\/td><td>0010<\/td><\/tr><tr><td>beq<\/td><td>01<\/td><td>branch equal<\/td><td>XXXXXX<\/td><td>subtract<\/td><td>0110<\/td><\/tr><tr><td>R-type<\/td><td>10<\/td><td>add<\/td><td>100000<\/td><td>add<\/td><td>0010<\/td><\/tr><tr><td><\/td><td><\/td><td>subtract<\/td><td>100010<\/td><td>subtract<\/td><td>0110<\/td><\/tr><tr><td><\/td><td><\/td><td>AND<\/td><td>100100<\/td><td>AND<\/td><td>0000<\/td><\/tr><tr><td><\/td><td><\/td><td>OR<\/td><td>100101<\/td><td>OR<\/td><td>0001<\/td><\/tr><tr><td><\/td><td><\/td><td>set-on-less-than<\/td><td>101010<\/td><td>set-on-less-than<\/td><td>0111<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>lw/sw/beq는 I-type이라 <b>funct가 없음<\/b> → ALUOp만 보고 결정 (00 → 더하기, 01 → 빼기).<\/li><li>ALUOp = 10이면 ALU control이 <b>funct를 기다렸다가<\/b> 결정 (add = 32 = 100000).<\/li><\/ul>\n<div class=\"callout trap\">함정: R-type funct들은 전부 <code>10<\/code>으로 시작(100000, 100010, …)해서 R-type ALUOp <code>10<\/code>과 앞 두 비트가 같다. 교수님이 \"헷갈리지 말라\"고 짚은 부분 (6주-2 42:08).<\/div><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-2:33\">▶ 06주-2 37:42 ALU control = ALUOp(2) + funct(6)<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:34\">▶ 06주-2 38:43 lw/sw: ALUOp = 00 → 더하기<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:36\">▶ 06주-2 40:35 beq: ALUOp = 01 → 빼기<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:37\">▶ 06주-2 41:29 R-type: ALUOp = 10 → funct가 결정<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:38\">▶ 06주-2 42:08 funct 앞 두 비트 &#x27;10&#x27; = ALUOp &#x27;10&#x27;<\/button><\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p29.jpg\" aria-label=\"크게 보기\"><img src=\"img/w6-p29.jpg\" alt=\"week6 p.29 · ALUOp + funct → ALU control\" loading=\"lazy\"><\/button><figcaption>week6 p.29 · ALUOp + funct → ALU control<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-kmap\"><h3>K-map으로 구한 ALU control 논리<\/h3><p>ALU control 표를 진리표로 놓고 K-map으로 간단히 하면:<\/p>\n<pre class=\"code\">Op3 = 0\nOp2 = ALUOp0 + ALUOp1·F1\nOp1 = ¬ALUOp1 + ¬F2\nOp0 = ALUOp1·(F3 + F0)<\/pre>\n<div class=\"callout trap\">함정: 교안 p.30에는 NOT 표시가 빠져서 <code>Op1 = ALUOp1 + F2<\/code>로 적혀 있음 (Op3 줄의 <code>APUOp0<\/code>도 오타). 그대로 쓰면 lw(ALUOp 00)에서 Op1 = 0이 나와 표(0010)와 안 맞는다. 위 식은 표의 8행 전부와 일치하는지 검산한 것.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p30.jpg\" aria-label=\"크게 보기\"><img src=\"img/w6-p30.jpg\" alt=\"week6 p.30 · K-map (식의 NOT 표시 누락에 주의)\" loading=\"lazy\"><\/button><figcaption>week6 p.30 · K-map (식의 NOT 표시 누락에 주의)<\/figcaption><\/figure><\/section>", "title_en": "ALU Control", "exam_en": "Reading the ALUOp table", "html_en": "<section class=\"sec\" id=\"s-alu-uses\"><h3>Uses of the ALU and the ALU Control Codes<\/h3><ul><li>Load/Store: F = <b>add<\/b> (address calculation)<\/li><li>Branch: F = <b>subtract<\/b> (equality test)<\/li><li>R-type: F depends on the <b>funct field<\/b><\/li><\/ul>\n<div class=\"tblw\"><table><thead><tr><th>ALU control<\/th><th>Function<\/th><\/tr><\/thead><tbody><tr><td>0000<\/td><td>AND<\/td><\/tr><tr><td>0001<\/td><td>OR<\/td><\/tr><tr><td>0010<\/td><td>add<\/td><\/tr><tr><td>0110<\/td><td>subtract<\/td><\/tr><tr><td>0111<\/td><td>set-on-less-than<\/td><\/tr><tr><td>1100<\/td><td>NOR<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout exam\">Exam point: The professor said \"you do not need to memorize this table. It will be given on the exam. But you must be able to <b>read it and apply it to the circuit<\/b>.\" (Week 6-2 37:31; which table he pointed to is inferred from the recording.)<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p27.jpg\" aria-label=\"Enlarge\"><img src=\"img/w6-p27.jpg\" alt=\"week6 p.27 · ALU control codes\" loading=\"lazy\"><\/button><figcaption>week6 p.27 · ALU control codes<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-aluop\"><h3>Generating ALU Control from ALUOp and funct<\/h3><p>The 2-bit <b>ALUOp<\/b> is derived from the opcode (by the Main control), and the ALU control unit uses <b>ALUOp + funct (6 bits)<\/b> to produce the 4-bit ALU control (combinational logic).<\/p>\n<div class=\"tblw\"><table><thead><tr><th>opcode<\/th><th>ALUOp<\/th><th>Operation<\/th><th>funct<\/th><th>ALU function<\/th><th>ALU control<\/th><\/tr><\/thead><tbody><tr><td>lw<\/td><td>00<\/td><td>load word<\/td><td>XXXXXX<\/td><td>add<\/td><td>0010<\/td><\/tr><tr><td>sw<\/td><td>00<\/td><td>store word<\/td><td>XXXXXX<\/td><td>add<\/td><td>0010<\/td><\/tr><tr><td>beq<\/td><td>01<\/td><td>branch equal<\/td><td>XXXXXX<\/td><td>subtract<\/td><td>0110<\/td><\/tr><tr><td>R-type<\/td><td>10<\/td><td>add<\/td><td>100000<\/td><td>add<\/td><td>0010<\/td><\/tr><tr><td><\/td><td><\/td><td>subtract<\/td><td>100010<\/td><td>subtract<\/td><td>0110<\/td><\/tr><tr><td><\/td><td><\/td><td>AND<\/td><td>100100<\/td><td>AND<\/td><td>0000<\/td><\/tr><tr><td><\/td><td><\/td><td>OR<\/td><td>100101<\/td><td>OR<\/td><td>0001<\/td><\/tr><tr><td><\/td><td><\/td><td>set-on-less-than<\/td><td>101010<\/td><td>set-on-less-than<\/td><td>0111<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>lw/sw/beq are I-type, so they <b>have no funct<\/b> → decided by ALUOp alone (00 → add, 01 → subtract).<\/li><li>When ALUOp = 10, the ALU control <b>waits for funct<\/b> to decide (add = 32 = 100000).<\/li><\/ul>\n<div class=\"callout trap\">Trap: All R-type funct codes start with <code>10<\/code> (100000, 100010, …), the same first two bits as the R-type ALUOp <code>10<\/code>. The professor pointed this out: \"don't get confused\" (Week 6-2 42:08).<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p29.jpg\" aria-label=\"Enlarge\"><img src=\"img/w6-p29.jpg\" alt=\"week6 p.29 · ALUOp + funct → ALU control\" loading=\"lazy\"><\/button><figcaption>week6 p.29 · ALUOp + funct → ALU control<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-kmap\"><h3>ALU Control Logic from the K-map<\/h3><p>Treating the ALU control table as a truth table and simplifying with a K-map gives:<\/p>\n<pre class=\"code\">Op3 = 0\nOp2 = ALUOp0 + ALUOp1·F1\nOp1 = ¬ALUOp1 + ¬F2\nOp0 = ALUOp1·(F3 + F0)<\/pre>\n<div class=\"callout trap\">Trap: Slide p.30 is missing the NOT bars, so it reads <code>Op1 = ALUOp1 + F2<\/code> (and <code>APUOp0<\/code> in the Op3 line is also a typo). Used as written, lw (ALUOp 00) gives Op1 = 0, which does not match the table (0010). The equations above were checked against all 8 rows of the table.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p30.jpg\" aria-label=\"Enlarge\"><img src=\"img/w6-p30.jpg\" alt=\"week6 p.30 · K-map (watch for the missing NOT bars in the equations)\" loading=\"lazy\"><\/button><figcaption>week6 p.30 · K-map (watch for the missing NOT bars in the equations)<\/figcaption><\/figure><\/section>"}, {"id": "L4-6", "title": "Main control unit · 제어 신호 표", "src": "week6 p.31–33", "exam": "제어 신호 표", "secs": [{"id": "main-control", "title": "명령어 형식과 제어의 관계", "title_en": "Instruction Formats and Control"}, {"id": "control-table", "title": "제어 신호 표", "title_en": "The Control Signal Table"}, {"id": "control-logic", "title": "제어 유닛 회로 (p.33)", "title_en": "The Control Unit Circuit (p.33)"}, {"id": "offset-const", "title": "lw/sw offset은 상수 (교수님 반복 강조)", "title_en": "The lw/sw Offset Is a Constant (repeated by the professor)"}], "md": "## 명령어 형식과 제어의 관계 {#main-control}\n\n| | [31:26] | [25:21] | [20:16] | [15:11] | [10:6] | [5:0] |\n|---|---|---|---|---|---|---|\n| R-type | 0 | rs | rt | rd | shamt | funct |\n| Load/Store | 35 or 43 | rs | rt | address (15:0) | | |\n| Branch | 4 | rs | rt | address (15:0) | | |\n\n- **opcode** → Control 입력\n- **rs: 항상 읽음** (Always read)\n- **rt: 읽음, 단 load에서는 쓰기 대상** (read, except for load)\n- **rd: R-type에서 쓰기 대상** (write for R-type)… load는 rt에 씀 → RegDst MUX\n- **address: sign-extend 후 더함**\n\n## 제어 신호 표 {#control-table}\n\n| 신호 | R-format | lw | sw | beq |\n|---|---|---|---|---|\n| RegDst | 1 | 0 | X | X |\n| ALUSrc | 0 | 1 | 1 | 0 |\n| MemtoReg | 0 | 1 | X | X |\n| RegWrite | 1 | 1 | 0 | 0 |\n| MemRead | 0 | 1 | 0 | 0 |\n| MemWrite | 0 | 0 | 1 | 0 |\n| Branch | 0 | 0 | 0 | 1 |\n| ALUOp1 | 1 | 0 | 0 | 0 |\n| ALUOp0 | 0 | 0 | 0 | 1 |\n\n입력(opcode Op5–Op0): R-format 000000, lw 100011 (35), sw 101011 (43), beq 000100 (4).\n\n외우지 말고 **이유로** 맞히기:\n- **X가 나오는 곳 = 레지스터에 안 쓰는 명령어(sw, beq)의 RegDst·MemtoReg**. 쓰지 않으니 어떤 레지스터·어떤 데이터든 상관없음.\n- ALUSrc = 1 ⇔ 상수(offset)를 쓰는 lw, sw.\n- RegWrite = 1 ⇔ 결과를 레지스터에 쓰는 R-type, lw.\n\n## 제어 유닛 회로 (p.33) {#control-logic}\n\nOpcode 비트 6개(Op5–Op0)를 AND 게이트 4개가 각각 **R-format / lw / sw / beq**로 디코딩하고, OR 게이트로 출력 신호를 만든다. 예: ALUSrc = lw OR sw, RegWrite = R-format OR lw. RegDst = R-format, MemtoReg = lw, MemRead = lw, MemWrite = sw, Branch = beq, ALUOp1 = R-format, ALUOp0 = beq.\n\n## lw/sw offset은 상수 (교수님 반복 강조) {#offset-const}\n\n- lw/sw는 **I-type**이라 offset은 반드시 **상수**.\n- 시험에서 offset을 레지스터 값으로 준 문장 → **False**.\n- 레지스터에 든 offset을 쓰려면: 먼저 base + offset을 계산해서 레지스터에 넣고, `lw $t0, 0($t1)`처럼 **상수 0**을 offset으로.\n\n> 시험 포인트: 3주·4주·6주에 걸쳐 같은 경고. \"you can never just provide your offset which is contained inside the register directly into an I-type instruction\".", "html": "<section class=\"sec\" id=\"s-main-control\"><h3>명령어 형식과 제어의 관계<\/h3><div class=\"tblw\"><table><thead><tr><th><\/th><th>[31:26]<\/th><th>[25:21]<\/th><th>[20:16]<\/th><th>[15:11]<\/th><th>[10:6]<\/th><th>[5:0]<\/th><\/tr><\/thead><tbody><tr><td>R-type<\/td><td>0<\/td><td>rs<\/td><td>rt<\/td><td>rd<\/td><td>shamt<\/td><td>funct<\/td><\/tr><tr><td>Load/Store<\/td><td>35 or 43<\/td><td>rs<\/td><td>rt<\/td><td>address (15:0)<\/td><td><\/td><td><\/td><\/tr><tr><td>Branch<\/td><td>4<\/td><td>rs<\/td><td>rt<\/td><td>address (15:0)<\/td><td><\/td><td><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><b>opcode<\/b> → Control 입력<\/li><li><b>rs: 항상 읽음<\/b> (Always read)<\/li><li><b>rt: 읽음, 단 load에서는 쓰기 대상<\/b> (read, except for load)<\/li><li><b>rd: R-type에서 쓰기 대상<\/b> (write for R-type)… load는 rt에 씀 → RegDst MUX<\/li><li><b>address: sign-extend 후 더함<\/b><\/li><\/ul><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-2:39\">▶ 06주-2 42:22 명령어 수준에서 본 R-type · Load · Branch<\/button><\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p31.jpg\" aria-label=\"크게 보기\"><img src=\"img/w6-p31.jpg\" alt=\"week6 p.31 · The Main Control Unit\" loading=\"lazy\"><\/button><figcaption>week6 p.31 · The Main Control Unit<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-control-table\"><h3>제어 신호 표<\/h3><div class=\"tblw\"><table><thead><tr><th>신호<\/th><th>R-format<\/th><th>lw<\/th><th>sw<\/th><th>beq<\/th><\/tr><\/thead><tbody><tr><td>RegDst<\/td><td>1<\/td><td>0<\/td><td>X<\/td><td>X<\/td><\/tr><tr><td>ALUSrc<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td>0<\/td><\/tr><tr><td>MemtoReg<\/td><td>0<\/td><td>1<\/td><td>X<\/td><td>X<\/td><\/tr><tr><td>RegWrite<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>MemRead<\/td><td>0<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>MemWrite<\/td><td>0<\/td><td>0<\/td><td>1<\/td><td>0<\/td><\/tr><tr><td>Branch<\/td><td>0<\/td><td>0<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>ALUOp1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>ALUOp0<\/td><td>0<\/td><td>0<\/td><td>0<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>입력(opcode Op5–Op0): R-format 000000, lw 100011 (35), sw 101011 (43), beq 000100 (4).<\/p>\n<p>외우지 말고 <b>이유로<\/b> 맞히기:<\/p>\n<ul><li><b>X가 나오는 곳 = 레지스터에 안 쓰는 명령어(sw, beq)의 RegDst·MemtoReg<\/b>. 쓰지 않으니 어떤 레지스터·어떤 데이터든 상관없음.<\/li><li>ALUSrc = 1 ⇔ 상수(offset)를 쓰는 lw, sw.<\/li><li>RegWrite = 1 ⇔ 결과를 레지스터에 쓰는 R-type, lw.<\/li><\/ul><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-1:3\">▶ 06주-1 5:06 이게 제어 신호들<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:40\">▶ 06주-2 42:50 형식별 제어 신호 표 · 여기까지 중간 범위<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:41\">▶ 06주-2 43:05 오피스 아워<\/button><\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p32.jpg\" aria-label=\"크게 보기\"><img src=\"img/w6-p32.jpg\" alt=\"week6 p.32 · 제어 신호 표\" loading=\"lazy\"><\/button><figcaption>week6 p.32 · 제어 신호 표<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-control-logic\"><h3>제어 유닛 회로 (p.33)<\/h3><p>Opcode 비트 6개(Op5–Op0)를 AND 게이트 4개가 각각 <b>R-format / lw / sw / beq<\/b>로 디코딩하고, OR 게이트로 출력 신호를 만든다. 예: ALUSrc = lw OR sw, RegWrite = R-format OR lw. RegDst = R-format, MemtoReg = lw, MemRead = lw, MemWrite = sw, Branch = beq, ALUOp1 = R-format, ALUOp0 = beq.<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p33.jpg\" aria-label=\"크게 보기\"><img src=\"img/w6-p33.jpg\" alt=\"week6 p.33 · 제어 유닛 회로\" loading=\"lazy\"><\/button><figcaption>week6 p.33 · 제어 유닛 회로<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-offset-const\"><h3>lw/sw offset은 상수 (교수님 반복 강조)<\/h3><ul><li>lw/sw는 <b>I-type<\/b>이라 offset은 반드시 <b>상수<\/b>.<\/li><li>시험에서 offset을 레지스터 값으로 준 문장 → <b>False<\/b>.<\/li><li>레지스터에 든 offset을 쓰려면: 먼저 base + offset을 계산해서 레지스터에 넣고, <code>lw $t0, 0($t1)<\/code>처럼 <b>상수 0<\/b>을 offset으로.<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 3주·4주·6주에 걸쳐 같은 경고. \"you can never just provide your offset which is contained inside the register directly into an I-type instruction\".<\/div><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-2:35\">▶ 06주-2 39:41 lw offset은 반드시 상수 (여러 번 강조)<\/button><\/div><\/section>", "title_en": "The Main Control Unit · Control Signal Table", "exam_en": "Control signal table", "html_en": "<section class=\"sec\" id=\"s-main-control\"><h3>Instruction Formats and Control<\/h3><div class=\"tblw\"><table><thead><tr><th><\/th><th>[31:26]<\/th><th>[25:21]<\/th><th>[20:16]<\/th><th>[15:11]<\/th><th>[10:6]<\/th><th>[5:0]<\/th><\/tr><\/thead><tbody><tr><td>R-type<\/td><td>0<\/td><td>rs<\/td><td>rt<\/td><td>rd<\/td><td>shamt<\/td><td>funct<\/td><\/tr><tr><td>Load/Store<\/td><td>35 or 43<\/td><td>rs<\/td><td>rt<\/td><td>address (15:0)<\/td><td><\/td><td><\/td><\/tr><tr><td>Branch<\/td><td>4<\/td><td>rs<\/td><td>rt<\/td><td>address (15:0)<\/td><td><\/td><td><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><b>opcode<\/b> → input to Control<\/li><li><b>rs: always read<\/b><\/li><li><b>rt: read, except for load<\/b> (where it is the write destination)<\/li><li><b>rd: write for R-type<\/b>… load writes to rt → RegDst MUX<\/li><li><b>address: sign-extend and add<\/b><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p31.jpg\" aria-label=\"Enlarge\"><img src=\"img/w6-p31.jpg\" alt=\"week6 p.31 · The Main Control Unit\" loading=\"lazy\"><\/button><figcaption>week6 p.31 · The Main Control Unit<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-control-table\"><h3>The Control Signal Table<\/h3><div class=\"tblw\"><table><thead><tr><th>Signal<\/th><th>R-format<\/th><th>lw<\/th><th>sw<\/th><th>beq<\/th><\/tr><\/thead><tbody><tr><td>RegDst<\/td><td>1<\/td><td>0<\/td><td>X<\/td><td>X<\/td><\/tr><tr><td>ALUSrc<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td>0<\/td><\/tr><tr><td>MemtoReg<\/td><td>0<\/td><td>1<\/td><td>X<\/td><td>X<\/td><\/tr><tr><td>RegWrite<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>MemRead<\/td><td>0<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>MemWrite<\/td><td>0<\/td><td>0<\/td><td>1<\/td><td>0<\/td><\/tr><tr><td>Branch<\/td><td>0<\/td><td>0<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>ALUOp1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>ALUOp0<\/td><td>0<\/td><td>0<\/td><td>0<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Inputs (opcode Op5–Op0): R-format 000000, lw 100011 (35), sw 101011 (43), beq 000100 (4).<\/p>\n<p>Don't memorize; derive each value <b>from the reason<\/b>:<\/p>\n<ul><li><b>X appears in RegDst and MemtoReg of instructions that do not write a register (sw, beq)<\/b>. Since nothing is written, which register or which data does not matter.<\/li><li>ALUSrc = 1 ⇔ lw, sw, which use a constant (offset).<\/li><li>RegWrite = 1 ⇔ R-type, lw, which write their result to a register.<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p32.jpg\" aria-label=\"Enlarge\"><img src=\"img/w6-p32.jpg\" alt=\"week6 p.32 · Control signal table\" loading=\"lazy\"><\/button><figcaption>week6 p.32 · Control signal table<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-control-logic\"><h3>The Control Unit Circuit (p.33)<\/h3><p>Four AND gates each decode the 6 opcode bits (Op5–Op0) into <b>R-format / lw / sw / beq<\/b>, and OR gates form the output signals. E.g., ALUSrc = lw OR sw, RegWrite = R-format OR lw. RegDst = R-format, MemtoReg = lw, MemRead = lw, MemWrite = sw, Branch = beq, ALUOp1 = R-format, ALUOp0 = beq.<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p33.jpg\" aria-label=\"Enlarge\"><img src=\"img/w6-p33.jpg\" alt=\"week6 p.33 · Control unit circuit\" loading=\"lazy\"><\/button><figcaption>week6 p.33 · Control unit circuit<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-offset-const\"><h3>The lw/sw Offset Is a Constant (repeated by the professor)<\/h3><ul><li>lw/sw are <b>I-type<\/b>, so the offset must be a <b>constant<\/b>.<\/li><li>On the exam, a statement that gives the offset as a register value → <b>False<\/b>.<\/li><li>To use an offset held in a register: first compute base + offset into a register, then use <b>constant 0<\/b> as the offset, as in <code>lw $t0, 0($t1)<\/code>.<\/li><\/ul>\n<div class=\"callout exam\">Exam point: The same warning in Weeks 3, 4 and 6: \"you can never just provide your offset which is contained inside the register directly into an I-type instruction\".<\/div><\/section>"}], "title_en": "Ch.4 The Processor: Datapath and Control (Simplified Version)", "intro_en": "In Week 6-2 the professor said \"today's goal is to completely understand this one slide (p.3, the simplified CPU)\". The key is which wires the data flows through for each instruction, and whether each MUX gets 0 or 1. After reading the concepts, use the '수업 따라가기' (Follow the Lecture) tab to see the professor's explanation scene by scene, and the '데이터패스 놀이터' (Datapath Playground) to check the path for each instruction."}], "questions": [{"id": "1-ci-1", "concept": "course-info", "type": "mc", "prompt": "이 수업의 중간·기말 답안 작성 언어는?", "choices": ["한국어만", "영어만", "한국어·영어 자유", "시험지에 따라 다름"], "answer": 1, "explain": "모든 수업·시험이 영어, 답도 영어로 (01주-1).", "lesson": "L1-1", "unit": "U1", "prompt_en": "In which language must midterm and final exam answers be written in this course?", "explain_en": "All lectures and exams are in English, and answers must be in English too (Week 1-1).", "choices_en": ["Korean only", "English only", "Either Korean or English", "Depends on the exam paper"]}, {"id": "1-ci-2", "concept": "course-info", "type": "ox", "prompt": "중간고사 범위에는 파이프라인 구현이 포함된다.", "answer": false, "explain": "중간 = 단순(single-cycle) 버전까지. 파이프라인은 기말.", "lesson": "L1-1", "unit": "U1", "prompt_en": "The midterm scope includes the pipelined implementation.", "explain_en": "Midterm = up to the simplified (single-cycle) version. Pipelining is on the final."}, {"id": "1-ci-3", "concept": "course-info", "type": "blank", "prompt": "평가 비율: 출석 (a)%, 중간 (b)%, 기말 45%", "answer": "(a) 10 / (b) 45", "accept": [["10"], ["45"]], "lesson": "L1-1", "unit": "U1", "prompt_en": "Grading: attendance (a)%, midterm (b)%, final 45%"}, {"id": "1-cl-1", "concept": "classes-ideas", "type": "mc", "prompt": "슈퍼컴퓨터의 성능 지표로 슬라이드가 든 것은?", "choices": ["MIPS", "CPI", "FLOPS", "Clock rate"], "answer": 2, "explain": "FLOPS(floating-point operations per second) > MIPS.", "lesson": "L1-1", "unit": "U1", "prompt_en": "Which performance metric does the slide give for supercomputers?"}, {"id": "1-cl-2", "concept": "classes-ideas", "type": "mc", "prompt": "전력·성능·비용 제약이 가장 엄격한 컴퓨터 종류는?", "choices": ["Supercomputer", "Server", "Personal computer", "Embedded computer"], "answer": 3, "lesson": "L1-1", "unit": "U1", "prompt_en": "Which class of computer has the strictest power, performance and cost constraints?"}, {"id": "1-cl-3", "concept": "classes-ideas", "type": "mc", "prompt": "Eight Great Ideas에 들어가지 '않는' 것은?", "choices": ["Make the common case fast", "Performance via pipelining", "Smaller is faster", "Hierarchy of memories"], "answer": 2, "explain": "'Smaller is faster'는 MIPS 설계 원칙 2. 8가지 아이디어엔 없음.", "lesson": "L1-1", "unit": "U1", "prompt_en": "Which of the following is NOT one of the Eight Great Ideas?", "explain_en": "'Smaller is faster' is MIPS Design Principle 2. It is not one of the eight great ideas."}, {"id": "1-bp-1", "concept": "below-program", "type": "mc", "prompt": "System software에 속하는 두 가지는?", "choices": ["Web browser와 Compiler", "Compiler와 Operating System", "OS와 Processor", "Assembler와 Memory"], "answer": 1, "lesson": "L1-1", "unit": "U1", "prompt_en": "Which two belong to system software?", "choices_en": ["Web browser and Compiler", "Compiler and Operating System", "OS and Processor", "Assembler and Memory"]}, {"id": "1-bp-2", "concept": "below-program", "type": "ox", "prompt": "Assembly language는 사람이 읽을 수 있으면서 기계어와 거의 일대일로 대응하는 언어다.", "answer": true, "lesson": "L1-1", "unit": "U1", "prompt_en": "Assembly language is human-readable and corresponds almost one-to-one with machine language."}, {"id": "1-co-1", "concept": "components", "type": "mc", "prompt": "Processor를 구성하는 두 요소는?", "choices": ["Datapath와 Control unit", "ALU와 Memory", "Register와 Cache", "Bus와 I/O"], "answer": 0, "lesson": "L1-1", "unit": "U1", "prompt_en": "What are the two components of a processor?", "choices_en": ["Datapath and Control unit", "ALU and Memory", "Register and Cache", "Bus and I/O"]}, {"id": "1-co-2", "concept": "components", "type": "ox", "prompt": "LAN·Wi-Fi 같은 네트워크 어댑터는 I/O 장치에 포함된다.", "answer": true, "explain": "교수님: 많이 헷갈리는 부분.", "lesson": "L1-1", "unit": "U1", "prompt_en": "Network adapters such as LAN and Wi-Fi are I/O devices.", "explain_en": "The professor said this is a commonly confused point."}, {"id": "1-co-3", "concept": "components", "type": "short", "prompt": "Processor의 두 구성 요소를 쓰고 각각의 역할을 한 줄로 설명하시오. (영어로)", "answer": "Datapath: performs the actual data processing (arithmetic, logical, and memory access operations) using ALU, registers, MUXes and buses.\nControl unit: interprets (decodes) instructions fetched from memory and generates control signals that direct the datapath.", "keys": ["Datapath: actual data processing (arithmetic/logical/memory access)", "Control unit: interprets instructions", "generates control signals for the datapath"], "lesson": "L1-1", "unit": "U1", "prompt_en": "Name the two components of a processor and explain the role of each in one line. (Answer in English.)"}, {"id": "1-co-4", "concept": "components", "type": "mc", "prompt": "RAM과 ROM에 대한 설명으로 옳은 것은?", "choices": ["RAM은 비휘발성, ROM은 휘발성", "둘 다 휘발성", "RAM은 휘발성, ROM은 부팅용 펌웨어를 저장하는 비휘발성", "캐시는 보통 DRAM으로 만든다"], "answer": 2, "explain": "캐시는 보통 SRAM.", "lesson": "L1-1", "unit": "U1", "prompt_en": "Which statement about RAM and ROM is correct?", "explain_en": "Cache is usually SRAM.", "choices_en": ["RAM is non-volatile, ROM is volatile", "Both are volatile", "RAM is volatile; ROM is non-volatile and stores boot firmware", "Cache is usually made of DRAM"]}, {"id": "1-isa-1", "concept": "isa", "type": "short", "prompt": "ISA(Instruction Set Architecture)란 무엇이며 가장 중요한 이점은? (영어로)", "answer": "ISA is the interface (contract) between hardware and low-level software: it defines how instructions are executed, which registers are available, and how data is accessed and manipulated. It lets developers write software without knowing hardware details; key benefit: portability (hardware can evolve without changing software).", "keys": ["interface between hardware and low-level software", "defines instructions/registers/data access (contract)", "hides hardware detail (abstraction)", "portability"], "lesson": "L1-1", "unit": "U1", "prompt_en": "What is an ISA (Instruction Set Architecture), and what is its most important benefit? (Answer in English.)"}, {"id": "1-isa-2", "concept": "isa", "type": "ox", "prompt": "ISA 덕분에 하드웨어가 바뀌어도 소프트웨어를 고치지 않고 실행할 수 있다(portability).", "answer": true, "lesson": "L1-1", "unit": "U1", "prompt_en": "Thanks to the ISA, software can run without modification even when the hardware changes (portability)."}, {"id": "1-isa-3", "concept": "isa", "type": "mc", "prompt": "컴퓨터 시스템에서 가장 빠른 메모리로 프로세서 안에 있는 것은?", "choices": ["Cache", "Register", "DRAM", "SSD"], "answer": 1, "lesson": "L1-1", "unit": "U1", "prompt_en": "What is the fastest memory in a computer system, located inside the processor?"}, {"id": "1-pf-1", "concept": "perf-factors", "type": "mc", "prompt": "'연산당 실행되는 기계 명령어 수'를 결정하는 요소가 '아닌' 것은?", "choices": ["Programming language", "Compiler", "Architecture(ISA)", "Algorithm의 연산 수"], "answer": 3, "explain": "알고리즘은 연산 수를 결정. 연산당 명령어 수는 언어·컴파일러·아키텍처.", "lesson": "L1-2", "unit": "U1", "prompt_en": "Which of the following does NOT determine the number of machine instructions executed per operation?", "explain_en": "The algorithm determines the number of operations. The number of instructions per operation is determined by the language, compiler and architecture.", "choices_en": ["Programming language", "Compiler", "Architecture (ISA)", "The algorithm's number of operations"]}, {"id": "1-pf-2", "concept": "perf-factors", "type": "ox", "prompt": "Moore's Law에 따르면 IC capacity가 18–24개월마다 두 배가 되므로 단일 프로세서 성능도 제한 없이 계속 오른다.", "answer": false, "explain": "전력 제약(power wall) 때문에 막힘.", "lesson": "L1-2", "unit": "U1", "prompt_en": "According to Moore's Law, IC capacity doubles every 18–24 months, so single-processor performance will keep rising without limit.", "explain_en": "It is stalled by power constraints (the power wall)."}, {"id": "1-pf-3", "concept": "perf-factors", "type": "mc", "prompt": "같은 정렬 작업에서 bubble sort(n²) 대신 merge sort(n log n)를 쓰면 주로 줄어드는 것은?", "choices": ["실행되는 연산의 수", "CPI", "Clock rate", "Clock period"], "answer": 0, "lesson": "L1-2", "unit": "U1", "prompt_en": "For the same sorting task, what is mainly reduced by using merge sort (n log n) instead of bubble sort (n²)?", "choices_en": ["The number of operations executed", "CPI", "Clock rate", "Clock period"]}, {"id": "1-rt-1", "concept": "response-throughput", "type": "mc", "prompt": "Throughput의 정의는?", "choices": ["한 작업이 끝나는 데 걸리는 시간", "단위 시간당 처리하는 작업량", "클럭 한 사이클의 길이", "명령어당 사이클 수"], "answer": 1, "lesson": "L1-2", "unit": "U1", "prompt_en": "What is the definition of throughput?", "choices_en": ["The time it takes to complete one task", "Total work done per unit time", "The duration of one clock cycle", "Cycles per instruction"]}, {"id": "1-rt-2", "concept": "response-throughput", "type": "blank", "prompt": "Response time은 (a) 또는 execution time이라고도 부른다.", "answer": "(a) latency", "accept": [["latency", "레이턴시", "지연시간"]], "lesson": "L1-2", "unit": "U1", "prompt_en": "Response time is also called (a) or execution time."}, {"id": "1-rt-3", "concept": "response-throughput", "type": "short", "prompt": "Response time과 throughput을 각각 정의하시오. (영어로)", "answer": "Response time (latency, execution time): how long it takes to complete one task/job.\nThroughput: total work done per unit time (e.g., tasks or transactions per hour).", "keys": ["response time = time to do one task", "throughput = work per unit time"], "lesson": "L1-2", "unit": "U1", "prompt_en": "Define response time and throughput. (Answer in English.)"}, {"id": "1-pr-1", "concept": "perf-ratio", "type": "calc", "prompt": "같은 프로그램이 시스템 A에서 12 s, B에서 30 s 걸린다. A는 B보다 몇 배 빠른가? 과정을 쓰시오.", "answer": "Perf_A / Perf_B = Time_B / Time_A = 30 / 12 = 2.5\nA is 2.5 times faster than B.", "keys": ["성능 비 = 시간의 역비", "30/12", "2.5"], "slot": 3, "pts": 6, "lesson": "L1-2", "unit": "U1", "prompt_en": "The same program takes 12 s on system A and 30 s on system B. How many times faster is A than B? Show your work.", "keys_en": ["Performance ratio = inverse of the time ratio", "30/12", "2.5"]}, {"id": "1-pr-2", "concept": "perf-ratio", "type": "mc", "prompt": "Performance_X / Performance_Y = n 일 때 같은 값은?", "choices": ["Time_X / Time_Y", "Time_X × Time_Y", "Time_Y / Time_X", "1 / (Time_X + Time_Y)"], "answer": 2, "lesson": "L1-2", "unit": "U1", "prompt_en": "If Performance_X / Performance_Y = n, which of the following equals n?"}, {"id": "1-pr-3", "concept": "perf-ratio", "type": "ox", "prompt": "X의 실행 시간이 Y의 실행 시간의 2배이면, X가 Y보다 2배 빠르다.", "answer": false, "explain": "실행 시간이 길면 느림. Y가 2배 빠름.", "lesson": "L1-2", "unit": "U1", "prompt_en": "If X's execution time is twice Y's execution time, then X is 2 times faster than Y.", "explain_en": "Longer execution time means slower. Y is 2 times faster."}, {"id": "1-pr-4", "concept": "perf-ratio", "type": "calc", "prompt": "컴퓨터 P는 어떤 프로그램을 8 s에, Q는 같은 프로그램을 10 s에 실행한다. 'P is n times faster than Q'의 n은?", "answer": "n = Time_Q / Time_P = 10 / 8 = 1.25", "keys": ["Time_Q / Time_P", "1.25"], "slot": 3, "pts": 6, "lesson": "L1-2", "unit": "U1", "prompt_en": "Computer P runs a program in 8 s, and Q runs the same program in 10 s. What is n in 'P is n times faster than Q'?"}, {"id": "1-pr-5", "concept": "perf-ratio", "type": "blank", "prompt": "Performance_X = 1 / (a)", "answer": "(a) Execution time_X", "accept": [["executiontimex", "executiontime", "실행시간", "responsetime", "cputime"]], "lesson": "L1-2", "unit": "U1"}, {"id": "1-pr-6", "concept": "perf-ratio", "type": "calc", "prompt": "시스템 A가 B보다 4배 빠르다. B의 실행 시간이 20 s일 때 A의 실행 시간은?", "answer": "Time_B / Time_A = 4 → Time_A = 20 / 4 = 5 s", "keys": ["Time_B/Time_A = 4", "5 s"], "lesson": "L1-2", "unit": "U1", "prompt_en": "System A is 4 times faster than B. If B's execution time is 20 s, what is A's execution time?"}, {"id": "1-ctd-1", "concept": "cpu-time-def", "type": "mc", "prompt": "수업에서 'execution time'이라고 하면 무엇을 뜻하나?", "choices": ["Elapsed time", "System CPU time", "User CPU time", "I/O time"], "answer": 2, "lesson": "L1-2", "unit": "U1", "prompt_en": "In this course, what does 'execution time' refer to?"}, {"id": "1-ctd-2", "concept": "cpu-time-def", "type": "blank", "prompt": "CPU time = (a) CPU time + (b) CPU time", "answer": "(a) user / (b) system", "accept": [["user", "유저", "사용자"], ["system", "kernel", "시스템"]], "lesson": "L1-2", "unit": "U1"}, {"id": "1-ctd-3", "concept": "cpu-time-def", "type": "calc", "prompt": "Clock rate가 2.5 GHz일 때 clock period는?", "answer": "Clock period = 1 / 2.5×10⁹ Hz = 0.4×10⁻⁹ s = 0.4 ns = 400 ps", "keys": ["역수", "400 ps (0.4 ns)"], "lesson": "L1-2", "unit": "U1", "prompt_en": "If the clock rate is 2.5 GHz, what is the clock period?", "keys_en": ["Reciprocal", "400 ps (0.4 ns)"]}, {"id": "1-ctd-4", "concept": "cpu-time-def", "type": "ox", "prompt": "Elapsed time은 I/O·OS 오버헤드까지 포함하므로 CPU 성능만 비교하기에는 부정확하다.", "answer": true, "lesson": "L1-2", "unit": "U1", "prompt_en": "Elapsed time includes I/O and OS overhead, so it is inaccurate for comparing CPU performance alone."}, {"id": "1-ctd-5", "concept": "cpu-time-def", "type": "mc", "prompt": "Clock period가 250 ps면 clock rate는?", "choices": ["2 GHz", "4 GHz", "250 MHz", "25 GHz"], "answer": 1, "lesson": "L1-2", "unit": "U1", "prompt_en": "If the clock period is 250 ps, what is the clock rate?"}, {"id": "1-ct-1", "concept": "cpu-time", "type": "calc", "prompt": "Computer A는 2 GHz에서 프로그램을 10 s에 실행한다. 6 s에 실행하는 Computer B를 설계하려는데, B는 clock rate를 올리는 대가로 A보다 1.2배 많은 clock cycle이 필요하다. B의 clock rate는?", "answer": "Clock cycles_A = CPU time_A × Clock rate_A = 10 s × 2×10⁹ Hz = 20×10⁹\nClock cycles_B = 1.2 × 20×10⁹ = 24×10⁹\nClock rate_B = Clock cycles_B / CPU time_B = 24×10⁹ / 6 s = 4×10⁹ Hz = 4 GHz", "keys": ["Cycles_A = 20×10⁹", "Cycles_B = 1.2 × Cycles_A = 24×10⁹", "Rate_B = 24×10⁹ / 6", "4 GHz"], "slot": 3, "pts": 6, "lesson": "L1-2", "unit": "U1", "prompt_en": "Computer A runs a program in 10 s at 2 GHz. We want to design Computer B that runs it in 6 s; B can increase the clock rate, but at the cost of needing 1.2 times as many clock cycles as A. What is B's clock rate?"}, {"id": "1-ct-2", "concept": "cpu-time", "type": "calc", "prompt": "Computer A는 3 GHz에서 15 s 걸린다. Computer B로 같은 프로그램을 10 s에 돌리고 싶은데, B는 A보다 1.5배의 clock cycle이 필요하다. B의 clock rate는?", "answer": "Cycles_A = 15 × 3×10⁹ = 45×10⁹\nCycles_B = 1.5 × 45×10⁹ = 67.5×10⁹\nRate_B = 67.5×10⁹ / 10 = 6.75 GHz", "keys": ["45×10⁹", "67.5×10⁹", "6.75 GHz"], "slot": 3, "pts": 6, "lesson": "L1-2", "unit": "U1", "prompt_en": "Computer A takes 15 s at 3 GHz. We want Computer B to run the same program in 10 s, but B needs 1.5 times as many clock cycles as A. What is B's clock rate?"}, {"id": "1-ct-3", "concept": "cpu-time", "type": "mc", "prompt": "CPU Time과 같지 '않은' 식은?", "choices": ["CPU clock cycles × Clock cycle time", "CPU clock cycles / Clock rate", "IC × CPI / Clock rate", "Clock rate / CPU clock cycles"], "answer": 3, "lesson": "L1-2", "unit": "U1", "prompt_en": "Which expression is NOT equal to CPU Time?"}, {"id": "1-ct-4", "concept": "cpu-time", "type": "ox", "prompt": "Clock rate를 높이면 CPU clock cycle 수가 늘어나는 trade-off가 흔히 있다.", "answer": true, "lesson": "L1-2", "unit": "U1", "prompt_en": "There is often a trade-off in which increasing the clock rate increases the number of CPU clock cycles."}, {"id": "1-ct-5", "concept": "cpu-time", "type": "calc", "prompt": "어떤 프로그램이 4×10⁹ clock cycle을 쓰고 clock rate가 2 GHz다. CPU time은?", "answer": "CPU time = cycles / rate = 4×10⁹ / 2×10⁹ = 2 s", "keys": ["cycles / rate", "2 s"], "lesson": "L1-2", "unit": "U1", "prompt_en": "A program uses 4×10⁹ clock cycles and the clock rate is 2 GHz. What is the CPU time?"}, {"id": "1-ct-6", "concept": "cpu-time", "type": "blank", "prompt": "성능을 높이려면 clock cycle 수를 (a)거나 clock rate를 (b)야 한다.", "answer": "(a) 줄이 / (b) 높여", "accept": [["줄이", "줄", "감소", "decrease", "reduce", "줄여", "lower", "decreasing", "reducing"], ["높이", "높여", "올려", "증가", "increase", "raise", "increasing", "raising"]], "lesson": "L1-2", "unit": "U1", "prompt_en": "To improve performance, (a) the number of clock cycles or (b) the clock rate.", "answer_en": "(a) reduce / (b) increase"}, {"id": "1-cpi-1", "concept": "cpi", "type": "calc", "prompt": "Computer A: cycle time 250 ps, CPI 2.0. Computer B: cycle time 500 ps, CPI 1.2. 같은 ISA·같은 프로그램일 때 어느 쪽이 몇 배 빠른가?", "answer": "Let IC = I.\nCPU time_A = I × 2.0 × 250 ps = 500·I ps\nCPU time_B = I × 1.2 × 500 ps = 600·I ps\nPerf_A / Perf_B = 600I / 500I = 1.2 → A is 1.2 times faster than B", "keys": ["IC를 I로 둠", "A = 500I ps", "B = 600I ps", "A가 1.2배 빠름"], "slot": 4, "pts": 6, "lesson": "L1-3", "unit": "U1", "prompt_en": "Computer A: cycle time 250 ps, CPI 2.0. Computer B: cycle time 500 ps, CPI 1.2. Same ISA and same program. Which is faster, and by how much?", "keys_en": ["Let IC = I", "A = 500I ps", "B = 600I ps", "A is 1.2 times faster"]}, {"id": "1-cpi-2", "concept": "cpi", "type": "calc", "prompt": "Computer A: clock 2 GHz, CPI 1.5. Computer B: clock 3 GHz, CPI 2.4. 같은 프로그램에서 어느 쪽이 몇 배 빠른가?", "answer": "CPU time_A = I × 1.5 / 2×10⁹ = 0.75·I ns\nCPU time_B = I × 2.4 / 3×10⁹ = 0.8·I ns\nPerf_A / Perf_B = 0.8 / 0.75 ≈ 1.067 → A is about 1.07 times faster", "keys": ["IC×CPI/rate", "A 0.75I ns, B 0.8I ns", "A가 약 1.07배 빠름"], "slot": 4, "pts": 6, "lesson": "L1-3", "unit": "U1", "prompt_en": "Computer A: clock 2 GHz, CPI 1.5. Computer B: clock 3 GHz, CPI 2.4. For the same program, which is faster, and by how much?", "keys_en": ["IC×CPI/rate", "A 0.75I ns, B 0.8I ns", "A is about 1.07 times faster"]}, {"id": "1-cpi-3", "concept": "cpi", "type": "mc", "prompt": "CPI를 주로 결정하는 것은?", "choices": ["Program만", "CPU hardware (organization)", "Technology만", "Clock rate"], "answer": 1, "explain": "슬라이드: CPI는 CPU hardware가 결정. 요약표에선 program·language·compiler·ISA·organization 모두 영향.", "lesson": "L1-3", "unit": "U1", "prompt_en": "What mainly determines CPI?", "explain_en": "Slide: CPI is determined by the CPU hardware. In the summary table, program, language, compiler, ISA and organization all affect it.", "choices_en": ["The program only", "CPU hardware (organization)", "Technology only", "Clock rate"]}, {"id": "1-cpi-4", "concept": "cpi", "type": "blank", "prompt": "Clock Cycles = (a) × (b)", "answer": "(a) Instruction Count / (b) CPI", "accept": [["instructioncount", "ic", "명령어수", "instructions"], ["cpi", "cyclesperinstruction"]], "lesson": "L1-3", "unit": "U1"}, {"id": "1-cpi-5", "concept": "cpi", "type": "calc", "prompt": "IC = 2×10⁹, CPI = 1.5, clock rate = 3 GHz인 프로그램의 CPU time은?", "answer": "CPU time = IC × CPI / rate = 2×10⁹ × 1.5 / 3×10⁹ = 1 s", "keys": ["IC×CPI/rate", "1 s"], "lesson": "L1-3", "unit": "U1", "prompt_en": "What is the CPU time of a program with IC = 2×10⁹, CPI = 1.5 and clock rate = 3 GHz?"}, {"id": "1-cpi-6", "concept": "cpi", "type": "ox", "prompt": "두 컴퓨터를 같은 프로그램으로 비교할 때 IC를 몰라도 성능 비는 구할 수 있다.", "answer": true, "explain": "같은 IC는 비율에서 약분 (교수님 풀이 방식).", "lesson": "L1-3", "unit": "U1", "prompt_en": "When comparing two computers on the same program, the performance ratio can be found even without knowing the IC.", "explain_en": "The same IC cancels out in the ratio (the method the professor used)."}, {"id": "1-wc-1", "concept": "weighted-cpi", "type": "calc", "prompt": "클래스 A, B, C의 CPI가 1, 2, 3이다. Sequence 1은 A 2개, B 1개, C 2개, Sequence 2는 A 4개, B 1개, C 1개를 실행한다. 각 sequence의 평균 CPI와 더 빠른 쪽은?", "answer": "Seq 1: IC = 5, cycles = 2×1 + 1×2 + 2×3 = 10 → CPI = 10/5 = 2.0\nSeq 2: IC = 6, cycles = 4×1 + 1×2 + 1×3 = 9 → CPI = 9/6 = 1.5\nSeq 2 uses fewer cycles (9 < 10), so it is faster (same clock).", "keys": ["seq1 10 cycles / 5", "CPI 2.0", "seq2 9 cycles / 6", "CPI 1.5", "seq2가 빠름(사이클 적음)"], "slot": 4, "pts": 6, "lesson": "L1-3", "unit": "U1", "prompt_en": "Classes A, B and C have CPIs of 1, 2 and 3. Sequence 1 executes 2 of A, 1 of B and 2 of C; Sequence 2 executes 4 of A, 1 of B and 1 of C. What is the average CPI of each sequence, and which is faster?", "keys_en": ["seq1 10 cycles / 5", "CPI 2.0", "seq2 9 cycles / 6", "CPI 1.5", "seq2 is faster (fewer cycles)"]}, {"id": "1-wc-2", "concept": "weighted-cpi", "type": "calc", "prompt": "CPI가 A=1, B=3, C=4인 클래스로, 프로그램이 A 50%, B 30%, C 20%로 구성된다. 평균 CPI는?", "answer": "CPI = 1×0.5 + 3×0.3 + 4×0.2 = 0.5 + 0.9 + 0.8 = 2.2", "keys": ["relative frequency 가중", "2.2"], "slot": 4, "pts": 6, "lesson": "L1-3", "unit": "U1", "prompt_en": "With instruction classes of CPI A=1, B=3, C=4, a program consists of 50% A, 30% B and 20% C. What is the average CPI?", "keys_en": ["Weighted by relative frequency", "2.2"]}, {"id": "1-wc-3", "concept": "weighted-cpi", "type": "ox", "prompt": "명령어 수가 더 많은 코드 sequence는 항상 더 느리다.", "answer": false, "explain": "예제에서 Seq 2가 명령어는 6개로 많지만 사이클 9로 더 빠름.", "lesson": "L1-3", "unit": "U1", "prompt_en": "A code sequence with more instructions is always slower.", "explain_en": "In the example, Sequence 2 has more instructions (6) but only 9 cycles, so it is faster."}, {"id": "1-wc-4", "concept": "weighted-cpi", "type": "blank", "prompt": "가중 평균 CPI = Σ CPI_i × (IC_i / IC)에서 IC_i / IC를 (a)라고 한다.", "answer": "(a) relative frequency", "accept": [["relativefrequency", "상대빈도", "상대도수"]], "lesson": "L1-3", "unit": "U1", "prompt_en": "In the weighted average CPI = Σ CPI_i × (IC_i / IC), IC_i / IC is called the (a)."}, {"id": "1-wc-5", "concept": "weighted-cpi", "type": "calc", "prompt": "CPI: A=2, B=4. 프로그램 X는 A 300개·B 100개, 프로그램 Y는 A 100개·B 200개. 각각의 총 cycle과 평균 CPI는?", "answer": "X: cycles = 300×2 + 100×4 = 1000, IC = 400, CPI = 2.5\nY: cycles = 100×2 + 200×4 = 1000, IC = 300, CPI ≈ 3.33", "keys": ["X 1000 cycles, CPI 2.5", "Y 1000 cycles, CPI 3.33"], "lesson": "L1-3", "unit": "U1", "prompt_en": "CPI: A=2, B=4. Program X has 300 A and 100 B instructions; program Y has 100 A and 200 B instructions. What are the total cycles and average CPI of each?"}, {"id": "1-ps-1", "concept": "perf-summary", "type": "mc", "prompt": "Clock rate에 영향을 주는 것만 고른 것은?", "choices": ["Algorithm, Compiler", "Programming language, ISA", "Hardware organization, Technology", "Compiler, Technology"], "answer": 2, "lesson": "L1-3", "unit": "U1", "prompt_en": "Which choice lists only factors that affect the clock rate?"}, {"id": "1-ps-2", "concept": "perf-summary", "type": "ox", "prompt": "Compiler는 instruction count와 CPI 모두에 영향을 준다.", "answer": true, "lesson": "L1-3", "unit": "U1", "prompt_en": "The compiler affects both the instruction count and the CPI."}, {"id": "1-ps-3", "concept": "perf-summary", "type": "blank", "prompt": "CPU Time = (Instructions / Program) × ((a) / Instruction) × (Seconds / (b))", "answer": "(a) Clock cycles / (b) Clock cycle", "accept": [["clockcycles", "cycles", "clockcycle"], ["clockcycle", "cycle", "clockcycles"]], "lesson": "L1-3", "unit": "U1"}, {"id": "1-pw-1", "concept": "power", "type": "calc", "prompt": "새 CPU가 capacitive load는 옛 CPU의 85%, voltage와 frequency는 각각 15% 낮다. 전력 비 P_new / P_old는?", "answer": "P ∝ C × V² × F\nP_new/P_old = 0.85 × 0.85² × 0.85 = 0.85⁴ ≈ 0.52", "keys": ["P ∝ C·V²·F", "0.85⁴", "≈ 0.52"], "slot": 5, "pts": 5, "lesson": "L1-4", "unit": "U1", "prompt_en": "A new CPU has 85% of the capacitive load of the old CPU, and its voltage and frequency are each 15% lower. What is the power ratio P_new / P_old?"}, {"id": "1-pw-2", "concept": "power", "type": "mc", "prompt": "Power wall의 원인으로 옳은 것은?", "choices": ["전압을 더 낮출 수 없고 열을 더 제거할 수 없음", "트랜지스터 수가 줄어듦", "클럭이 너무 느림", "메모리가 부족함"], "answer": 0, "lesson": "L1-4", "unit": "U1", "prompt_en": "Which is a correct cause of the power wall?", "choices_en": ["We cannot reduce the voltage further or remove more heat", "The number of transistors decreases", "The clock is too slow", "There is not enough memory"]}, {"id": "1-pw-3", "concept": "power", "type": "ox", "prompt": "Power wall 때문에 업계는 multicore로 방향을 바꿨고, 이는 programmer의 명시적 병렬 프로그래밍을 요구한다.", "answer": true, "lesson": "L1-4", "unit": "U1", "prompt_en": "Because of the power wall, the industry shifted to multicore, which requires explicit parallel programming by the programmer."}, {"id": "1-am-1", "concept": "amdahl", "type": "calc", "prompt": "100 s 프로그램 중 곱셈이 80 s다. 전체를 5배 빠르게 하려면 곱셈을 몇 배 빨리 해야 하나?", "answer": "T_improved = 80/n + 20, 목표 20 s (100/5)\n20 = 80/n + 20 → 80/n = 0 → 불가능. 곱셈을 무한히 빠르게 해도 최대 5배.", "keys": ["T = 80/n + 20", "목표 20 s", "불가능 (n → ∞)"], "slot": 5, "pts": 5, "lesson": "L1-4", "unit": "U1", "prompt_en": "Of a 100 s program, multiplication takes 80 s. How much must multiplication be improved to make the whole program 5 times faster?", "answer_en": "T_improved = 80/n + 20, target 20 s (100/5)\n20 = 80/n + 20 → 80/n = 0 → impossible. Even with infinitely fast multiplication, the speedup is at most 5×.", "keys_en": ["T = 80/n + 20", "Target 20 s", "Impossible (n → ∞)"]}, {"id": "1-am-2", "concept": "amdahl", "type": "calc", "prompt": "100 s 프로그램 중 곱셈이 80 s다. 전체를 4배 빠르게 하려면 곱셈을 몇 배 빨리 해야 하나?", "answer": "목표 100/4 = 25 s\n25 = 80/n + 20 → 80/n = 5 → n = 16", "keys": ["목표 25 s", "80/n = 5", "16배"], "slot": 5, "pts": 5, "lesson": "L1-4", "unit": "U1", "prompt_en": "Of a 100 s program, multiplication takes 80 s. How much must multiplication be improved to make the whole program 4 times faster?", "answer_en": "Target 100/4 = 25 s\n25 = 80/n + 20 → 80/n = 5 → n = 16", "keys_en": ["Target 25 s", "80/n = 5", "16 times"]}, {"id": "1-am-3", "concept": "amdahl", "type": "blank", "prompt": "T_improved = T_affected / (a) + T_(b)", "answer": "(a) improvement factor / (b) unaffected", "accept": [["improvementfactor", "개선배수", "speedup", "개선율", "improvement"], ["unaffected", "영향받지않는부분"]], "lesson": "L1-4", "unit": "U1"}, {"id": "1-am-4", "concept": "amdahl", "type": "ox", "prompt": "Amdahl's Law의 pitfall: 한 부분을 n배 개선하면 전체 성능도 n배 좋아진다고 기대하는 것.", "answer": true, "lesson": "L1-4", "unit": "U1", "prompt_en": "The pitfall of Amdahl's Law: expecting that improving one part n times will improve overall performance n times."}, {"id": "1-am-5", "concept": "amdahl", "type": "calc", "prompt": "실행 시간 50 s 중 메모리 접근이 30 s다. 메모리 접근을 3배 빠르게 하면 새 실행 시간과 speedup은?", "answer": "T = 30/3 + 20 = 30 s\nSpeedup = 50 / 30 ≈ 1.67", "keys": ["30/3 + 20", "30 s", "약 1.67배"], "lesson": "L1-4", "unit": "U1", "prompt_en": "Of an execution time of 50 s, memory access takes 30 s. If memory access is made 3 times faster, what are the new execution time and the speedup?", "keys_en": ["30/3 + 20", "30 s", "About 1.67 times"]}, {"id": "1-am-6", "concept": "amdahl", "type": "mc", "prompt": "Amdahl's Law가 주는 설계 교훈과 가장 가까운 것은?", "choices": ["Smaller is faster", "Make the common case fast", "Simplicity favors regularity", "Hierarchy of memories"], "answer": 1, "lesson": "L1-4", "unit": "U1", "prompt_en": "Which design lesson is closest to what Amdahl's Law teaches?"}, {"id": "1-mi-1", "concept": "mips-metric", "type": "calc", "prompt": "A와 B는 둘 다 4 GHz. IC는 A 10 billion, B 8 billion, CPI는 A 1.0, B 1.1. 각각의 MIPS와 CPU time을 구하고 어느 쪽이 실제로 빠른지 쓰시오.", "answer": "MIPS = Clock rate / (CPI × 10⁶)\nMIPS_A = 4×10⁹ / (1.0×10⁶) = 4000, MIPS_B = 4×10⁹ / (1.1×10⁶) ≈ 3636\nCPU time_A = 10×10⁹ × 1.0 / 4×10⁹ = 2.5 s\nCPU time_B = 8×10⁹ × 1.1 / 4×10⁹ = 2.2 s\nMIPS says A, but B is actually faster (Perf_A/Perf_B = 2.2/2.5 = 0.88).", "keys": ["MIPS_A 4000", "MIPS_B ≈ 3636", "time A 2.5 s", "time B 2.2 s", "B가 실제로 빠름"], "slot": 5, "pts": 5, "lesson": "L1-4", "unit": "U1", "prompt_en": "A and B both run at 4 GHz. IC: A 10 billion, B 8 billion; CPI: A 1.0, B 1.1. Calculate the MIPS and CPU time of each, and state which one is actually faster.", "keys_en": ["MIPS_A 4000", "MIPS_B ≈ 3636", "time A 2.5 s", "time B 2.2 s", "B is actually faster"]}, {"id": "1-mi-2", "concept": "mips-metric", "type": "short", "prompt": "MIPS가 성능 지표로 부적절한 이유를 쓰시오. (영어로)", "answer": "MIPS = IC / (Execution time × 10⁶) = Clock rate / (CPI × 10⁶), so the instruction count cancels out. It does not account for differences in ISAs between computers or differences in instruction complexity, and CPI varies between programs on the same CPU.", "keys": ["instruction count가 빠짐(약분)", "ISA 차이 반영 못 함", "명령어 복잡도 차이 반영 못 함", "CPI가 프로그램마다 다름"], "slot": 2, "pts": 3, "lesson": "L1-4", "unit": "U1", "prompt_en": "Explain why MIPS is a poor performance metric. (Answer in English.)", "keys_en": ["Instruction count drops out (cancels)", "Does not account for ISA differences", "Does not account for differences in instruction complexity", "CPI varies between programs"]}, {"id": "1-mi-3", "concept": "mips-metric", "type": "ox", "prompt": "MIPS 값이 높은 컴퓨터가 항상 같은 프로그램을 더 빨리 실행한다.", "answer": false, "lesson": "L1-4", "unit": "U1", "prompt_en": "A computer with a higher MIPS value always runs the same program faster."}, {"id": "1-mi-4", "concept": "mips-metric", "type": "blank", "prompt": "MIPS = Clock rate / ((a) × 10⁶)", "answer": "(a) CPI", "accept": [["cpi"]], "lesson": "L1-4", "unit": "U1"}, {"id": "1-mi-5", "concept": "mips-metric", "type": "calc", "prompt": "3 GHz, CPI 1.5인 컴퓨터의 MIPS rating은?", "answer": "MIPS = 3×10⁹ / (1.5 × 10⁶) = 2000", "keys": ["rate/(CPI×10⁶)", "2000"], "lesson": "L1-4", "unit": "U1", "prompt_en": "What is the MIPS rating of a computer at 3 GHz with CPI 1.5?"}, {"id": "1-sp-1", "concept": "spec-idle", "type": "mc", "prompt": "SPEC CPU 벤치마크에 대한 설명으로 옳은 것은?", "choices": ["I/O가 거의 없는 프로그램들의 elapsed time으로 CPU 성능을 본다", "서버 전력만 측정한다", "MIPS 값을 비교한다", "CPI만 측정한다"], "answer": 0, "lesson": "L1-4", "unit": "U1", "prompt_en": "Which statement about the SPEC CPU benchmark is correct?", "choices_en": ["It measures CPU performance by the elapsed time of programs with negligible I/O", "It measures only server power", "It compares MIPS values", "It measures only CPI"]}, {"id": "1-sp-2", "concept": "spec-idle", "type": "ox", "prompt": "슬라이드의 i7은 10% 부하에서도 최대 전력의 약 절반(47%)을 쓴다 → 저부하에서도 전력이 많이 든다.", "answer": true, "lesson": "L1-4", "unit": "U1", "prompt_en": "The i7 on the slide uses about half (47%) of its peak power even at 10% load → power consumption stays high even at low load."}, {"id": "1-rc-1", "concept": "risc-cisc", "type": "short", "prompt": "RISC와 CISC를 비교하시오 (예시 아키텍처, 장점, 단점). (영어로)", "answer": "RISC (e.g., MIPS, ARM, PowerPC): small, simple instruction set → faster execution, power-efficient, scalable (easier parallelism); but needs more instructions for complex tasks (larger programs).\nCISC (e.g., x86, x86-64): large, complex instructions to minimize instructions per program → smaller program size, backward compatibility; but slower execution and higher power consumption.", "keys": ["RISC 예: MIPS/ARM", "CISC 예: x86", "RISC 장점: 빠름·전력 효율·확장성", "RISC 단점: 명령어 수 많음", "CISC 장점: 프로그램 작음·호환성", "CISC 단점: 느림·전력 큼"], "slot": 2, "pts": 3, "lesson": "L1-4", "unit": "U1", "prompt_en": "Compare RISC and CISC (example architectures, advantages, disadvantages). (Answer in English.)", "keys_en": ["RISC examples: MIPS/ARM", "CISC example: x86", "RISC advantages: fast, power-efficient, scalable", "RISC disadvantage: more instructions needed", "CISC advantages: smaller programs, compatibility", "CISC disadvantages: slower, higher power"]}, {"id": "1-rc-2", "concept": "risc-cisc", "type": "mc", "prompt": "x86-64는 어느 쪽인가?", "choices": ["RISC", "CISC", "VLIW", "둘 다 아님"], "answer": 1, "lesson": "L1-4", "unit": "U1", "prompt_en": "Which category does x86-64 belong to?", "choices_en": ["RISC", "CISC", "VLIW", "Neither"]}, {"id": "1-rc-3", "concept": "risc-cisc", "type": "ox", "prompt": "RISC의 단점은 복잡한 작업에 더 많은 명령어가 필요해 프로그램 크기가 커질 수 있다는 것이다.", "answer": true, "lesson": "L1-4", "unit": "U1", "prompt_en": "A disadvantage of RISC is that complex tasks need more instructions, which can make programs larger."}, {"id": "1-rc-4", "concept": "risc-cisc", "type": "mc", "prompt": "MIPS architecture의 'MIPS'가 뜻하는 것은?", "choices": ["Millions of Instructions Per Second", "Multiple Instruction Pipeline System", "Microprocessor without Interlocked Pipeline Stages", "Memory Instruction Processing Set"], "answer": 2, "lesson": "L1-4", "unit": "U1", "prompt_en": "What does 'MIPS' stand for in the MIPS architecture?"}, {"id": "2-mc-1", "concept": "mips-classes", "type": "mc", "prompt": "MIPS 명령어 '형식(format)' 분류가 아닌 것은?", "choices": ["R-format", "I-format", "J-format", "B-format"], "answer": 3, "lesson": "L2-1", "unit": "U2", "prompt_en": "Which of the following is NOT a MIPS instruction format (classification by format)?"}, {"id": "2-mc-2", "concept": "mips-classes", "type": "ox", "prompt": "MIPS는 RISC ISA의 전형적인 예다.", "answer": true, "lesson": "L2-1", "unit": "U2", "prompt_en": "MIPS is a typical example of a RISC ISA."}, {"id": "2-af-1", "concept": "arith-format", "type": "calc", "prompt": "C 코드 `a = b + c + d;`를 MIPS 산술 명령어로 쓰시오 (변수 이름을 그대로 피연산자로 써도 됨).", "answer": "add a, b, c\nadd a, a, d", "keys": ["두 줄로 분해", "add a, b, c", "add a, a, d"], "lesson": "L2-1", "unit": "U2", "prompt_en": "Write the C code `a = b + c + d;` using MIPS arithmetic instructions (you may use the variable names directly as operands).", "keys_en": ["Split into two lines", "add a, b, c", "add a, a, d"]}, {"id": "2-af-2", "concept": "arith-format", "type": "mc", "prompt": "`add a, b, c`의 의미는?", "choices": ["b = a + c", "a = b + c", "c = a + b", "a = a + b + c"], "answer": 1, "lesson": "L2-1", "unit": "U2", "prompt_en": "What does `add a, b, c` mean?"}, {"id": "2-af-3", "concept": "arith-format", "type": "blank", "prompt": "Design Principle 1: (a) favors (b)", "answer": "(a) Simplicity / (b) regularity", "accept": [["simplicity", "단순성"], ["regularity", "규칙성"]], "lesson": "L2-1", "unit": "U2"}, {"id": "2-af-4", "concept": "arith-format", "type": "ox", "prompt": "MIPS 산술 명령어는 모두 destination 1개와 source 2개의 형식을 따른다.", "answer": true, "lesson": "L2-1", "unit": "U2", "prompt_en": "All MIPS arithmetic instructions have the form of one destination and two sources."}, {"id": "2-rg-1", "concept": "registers", "type": "calc", "prompt": "`f = (g + h) - (i + j);`를 MIPS로 쓰시오. f, g, h, i, j는 각각 $s0, $s1, $s2, $s3, $s4에 있다.", "answer": "add $t0, $s1, $s2   # g + h\nadd $t1, $s3, $s4   # i + j\nsub $s0, $t0, $t1   # f = (g+h) - (i+j)", "keys": ["add $t0, $s1, $s2", "add $t1, $s3, $s4", "sub $s0, $t0, $t1 (결과는 $s0)"], "slot": 7, "pts": 6, "lesson": "L2-1", "unit": "U2", "prompt_en": "Write `f = (g + h) - (i + j);` in MIPS. f, g, h, i and j are in $s0, $s1, $s2, $s3 and $s4, respectively.", "keys_en": ["add $t0, $s1, $s2", "add $t1, $s3, $s4", "sub $s0, $t0, $t1 (result in $s0)"]}, {"id": "2-rg-2", "concept": "registers", "type": "mc", "prompt": "MIPS 레지스터의 개수와 크기는?", "choices": ["16개 × 32 bit", "32개 × 64 bit", "32개 × 32 bit", "64개 × 32 bit"], "answer": 2, "lesson": "L2-1", "unit": "U2", "prompt_en": "What are the number and size of MIPS registers?", "choices_en": ["16 × 32-bit", "32 × 64-bit", "32 × 32-bit", "64 × 32-bit"]}, {"id": "2-rg-3", "concept": "registers", "type": "blank", "prompt": "Design Principle 2: (a) is faster", "answer": "(a) Smaller", "accept": [["smaller", "작을수록", "small"]], "lesson": "L2-1", "unit": "U2"}, {"id": "2-rg-4", "concept": "registers", "type": "ox", "prompt": "MIPS 산술 명령어는 메모리에 있는 피연산자로 직접 연산할 수 있다.", "answer": false, "explain": "레지스터 피연산자만. 메모리는 lw/sw로.", "lesson": "L2-1", "unit": "U2", "prompt_en": "MIPS arithmetic instructions can operate directly on operands in memory.", "explain_en": "Register operands only. Memory is accessed with lw/sw."}, {"id": "2-rg-5", "concept": "registers", "type": "calc", "prompt": "`x = y - (z + 5);`를 MIPS로 쓰시오. x, y, z는 $s0, $s1, $s2.", "answer": "addi $t0, $s2, 5     # z + 5\nsub  $s0, $s1, $t0   # x = y - (z+5)", "keys": ["addi로 z+5", "sub $s0, $s1, $t0"], "lesson": "L2-1", "unit": "U2", "prompt_en": "Write `x = y - (z + 5);` in MIPS. x, y and z are in $s0, $s1 and $s2.", "keys_en": ["z+5 with addi", "sub $s0, $s1, $t0"]}, {"id": "2-mb-1", "concept": "memory-basics", "type": "mc", "prompt": "MIPS 메모리 주소에 대한 설명으로 옳은 것은?", "choices": ["word 단위로 주소가 붙는다", "byte 단위로 주소가 붙고 word 주소는 4의 배수", "주소는 항상 홀수", "레지스터와 같은 주소 공간"], "answer": 1, "lesson": "L2-2", "unit": "U2", "prompt_en": "Which statement about MIPS memory addresses is correct?", "choices_en": ["Memory is addressed in words", "Memory is byte addressed, and word addresses are multiples of 4", "Addresses are always odd", "Memory shares the same address space as the registers"]}, {"id": "2-mb-2", "concept": "memory-basics", "type": "calc", "prompt": "int 배열 A의 base address가 0x1000이다. A[5]의 주소는?", "answer": "0x1000 + 5 × 4 = 0x1000 + 20 = 0x1014", "keys": ["base + index × 4", "0x1014"], "lesson": "L2-2", "unit": "U2", "prompt_en": "The base address of int array A is 0x1000. What is the address of A[5]?"}, {"id": "2-mb-3", "concept": "memory-basics", "type": "ox", "prompt": "레지스터가 32개뿐이라 배열·구조체 같은 composite data는 메모리에 둔다.", "answer": true, "lesson": "L2-2", "unit": "U2", "prompt_en": "Because there are only 32 registers, composite data such as arrays and structures is kept in memory."}, {"id": "2-en-1", "concept": "endian", "type": "calc", "prompt": "32-bit 값 0x12345678을 주소 0–3에 저장한다. Big endian과 little endian에서 각 주소의 값을 쓰시오.", "answer": "Big endian:    0: 12, 1: 34, 2: 56, 3: 78\nLittle endian: 0: 78, 1: 56, 2: 34, 3: 12", "keys": ["big: MSB(12)가 0번지", "little: LSB(78)가 0번지", "byte 안 자리 순서 유지"], "slot": 6, "pts": 5, "lesson": "L2-2", "unit": "U2", "prompt_en": "The 32-bit value 0x12345678 is stored at addresses 0–3. Write the value at each address in big endian and in little endian.", "keys_en": ["big: MSB (12) at address 0", "little: LSB (78) at address 0", "Digit order within a byte is preserved"]}, {"id": "2-en-2", "concept": "endian", "type": "calc", "prompt": "32-bit 값 0x34125678을 주소 0–3에 저장한다. Big endian과 little endian에서 각 주소의 값은?", "answer": "Big endian:    0: 34, 1: 12, 2: 56, 3: 78\nLittle endian: 0: 78, 1: 56, 2: 12, 3: 34", "keys": ["big 34 12 56 78", "little 78 56 12 34"], "slot": 6, "pts": 5, "lesson": "L2-2", "unit": "U2", "prompt_en": "The 32-bit value 0x34125678 is stored at addresses 0–3. What is the value at each address in big endian and in little endian?"}, {"id": "2-en-3", "concept": "endian", "type": "mc", "prompt": "0xA1B2C3D4를 little endian으로 저장할 때 주소 0의 값은?", "choices": ["A1", "1A", "4D", "D4"], "answer": 3, "explain": "LSB byte = D4. 두 자리 순서는 뒤집지 않음.", "lesson": "L2-2", "unit": "U2", "prompt_en": "When 0xA1B2C3D4 is stored in little endian, what is the value at address 0?", "explain_en": "The LSB byte = D4. Do not reverse the two digits."}, {"id": "2-en-4", "concept": "endian", "type": "ox", "prompt": "Little endian에서는 0x12345678의 마지막 byte 78을 0번지에 87로 저장한다.", "answer": false, "explain": "byte 안의 두 자리 순서는 바꾸지 않는다 → 78.", "lesson": "L2-2", "unit": "U2", "prompt_en": "In little endian, the last byte 78 of 0x12345678 is stored at address 0 as 87.", "explain_en": "The order of the two digits within a byte is not changed → 78."}, {"id": "2-en-5", "concept": "endian", "type": "blank", "prompt": "Big endian은 (a)를 가장 낮은 주소에, little endian은 (b)를 가장 낮은 주소에 저장한다.", "answer": "(a) MSB / (b) LSB", "accept": [["msb", "mostsignificantbyte", "최상위바이트"], ["lsb", "leastsignificantbyte", "최하위바이트"]], "lesson": "L2-2", "unit": "U2", "prompt_en": "Big endian stores the (a) at the lowest address; little endian stores the (b) at the lowest address."}, {"id": "2-en-6", "concept": "endian", "type": "calc", "prompt": "0xCAFE0012를 주소 100–103에 big endian과 little endian으로 저장할 때 각 주소의 값은?", "answer": "Big:    100: CA, 101: FE, 102: 00, 103: 12\nLittle: 100: 12, 101: 00, 102: FE, 103: CA", "keys": ["big CA FE 00 12", "little 12 00 FE CA"], "lesson": "L2-2", "unit": "U2", "prompt_en": "When 0xCAFE0012 is stored at addresses 100–103 in big endian and in little endian, what is the value at each address?"}, {"id": "2-lw-1", "concept": "lw-sw", "type": "calc", "prompt": "`g = h + A[8];`을 MIPS로 쓰시오. g는 $s1, h는 $s2, A의 base address는 $s3.", "answer": "lw  $t0, 32($s3)     # A[8], offset = 8 × 4\nadd $s1, $s2, $t0", "keys": ["offset 32", "lw $t0, 32($s3)", "add $s1, $s2, $t0"], "slot": 7, "pts": 6, "lesson": "L2-2", "unit": "U2", "prompt_en": "Write `g = h + A[8];` in MIPS. g is in $s1, h is in $s2, and the base address of A is in $s3."}, {"id": "2-lw-2", "concept": "lw-sw", "type": "calc", "prompt": "`A[12] = h + A[8];`을 MIPS로 쓰시오. h는 $s2, A의 base address는 $s3.", "answer": "lw  $t0, 32($s3)\nadd $t0, $s2, $t0\nsw  $t0, 48($s3)     # 12 × 4 = 48", "keys": ["lw offset 32", "add", "sw $t0, 48($s3)"], "slot": 7, "pts": 6, "lesson": "L2-2", "unit": "U2", "prompt_en": "Write `A[12] = h + A[8];` in MIPS. h is in $s2, and the base address of A is in $s3."}, {"id": "2-lw-3", "concept": "lw-sw", "type": "mc", "prompt": "`sw $t0, 8($s1)`에서 $t0의 역할은?", "choices": ["메모리에 쓸 값(source)", "읽어 온 값을 받을 destination", "base address", "offset"], "answer": 0, "lesson": "L2-2", "unit": "U2", "prompt_en": "In `sw $t0, 8($s1)`, what is the role of $t0?", "choices_en": ["The value to write to memory (source)", "The destination that receives the loaded value", "The base address", "The offset"]}, {"id": "2-lw-4", "concept": "lw-sw", "type": "ox", "prompt": "`lw $t0, $t1($s3)`처럼 offset 자리에 레지스터를 쓸 수 있다.", "answer": false, "explain": "offset은 상수만. 시험 OX에서 무조건 False, 코드에 쓰면 0점.", "lesson": "L2-2", "unit": "U2", "prompt_en": "A register can be used in the offset position, as in `lw $t0, $t1($s3)`.", "explain_en": "The offset must be a constant. In a True/False question this is always False; writing it in code gets zero points."}, {"id": "2-lw-5", "concept": "lw-sw", "type": "calc", "prompt": "`B[3] = B[1] + B[2];`를 MIPS로 쓰시오. B의 base address는 $s4 (int 배열).", "answer": "lw  $t0, 4($s4)\nlw  $t1, 8($s4)\nadd $t0, $t0, $t1\nsw  $t0, 12($s4)", "keys": ["offset 4, 8", "add", "sw offset 12"], "slot": 7, "pts": 6, "lesson": "L2-2", "unit": "U2", "prompt_en": "Write `B[3] = B[1] + B[2];` in MIPS. The base address of B is in $s4 (int array)."}, {"id": "2-lw-6", "concept": "lw-sw", "type": "blank", "prompt": "`lw dest, (a)(base)` — 괄호 앞에는 (a)가, 괄호 안에는 (b)가 들어간다.", "answer": "(a) offset / (b) base address", "accept": [["offset", "상수offset", "오프셋", "상수", "constant offset", "immediate"], ["baseaddress", "base", "베이스주소", "기준주소", "레지스터", "base register", "register"]], "lesson": "L2-2", "unit": "U2", "prompt_en": "`lw dest, (a)(base)` — the (a) goes before the parentheses, and the (b) goes inside the parentheses."}, {"id": "2-lw-7", "concept": "lw-sw", "type": "calc", "prompt": "`x = A[i];`를 MIPS로 쓰시오. x는 $s0, i는 $s1, A의 base는 $s2. (offset에 레지스터를 쓰지 말 것)", "answer": "sll $t1, $s1, 2      # i * 4\nadd $t1, $t1, $s2    # &A[i]\nlw  $s0, 0($t1)", "keys": ["sll로 ×4", "base와 add", "lw $s0, 0($t1)"], "slot": 7, "pts": 6, "lesson": "L2-2", "unit": "U2", "prompt_en": "Write `x = A[i];` in MIPS. x is in $s0, i is in $s1, and the base of A is in $s2. (Do not use a register as the offset.)", "keys_en": ["×4 with sll", "add to the base", "lw $s0, 0($t1)"]}, {"id": "2-rm-1", "concept": "reg-vs-mem", "type": "mc", "prompt": "레지스터 대신 메모리에 변수를 두면 생기는 일은?", "choices": ["CPI가 0이 된다", "명령어 수가 줄어든다", "load/store가 필요해 실행 명령어 수가 늘어난다", "클럭이 빨라진다"], "answer": 2, "lesson": "L2-2", "unit": "U2", "prompt_en": "What happens if variables are kept in memory instead of registers?", "choices_en": ["CPI becomes 0", "The instruction count decreases", "Loads/stores are needed, so more instructions are executed", "The clock gets faster"]}, {"id": "2-rm-2", "concept": "reg-vs-mem", "type": "blank", "prompt": "자주 쓰지 않는 변수만 메모리로 내보내는 것을 (a)이라고 한다.", "answer": "(a) spill", "accept": [["spill", "spilling", "스필"]], "lesson": "L2-2", "unit": "U2", "prompt_en": "Moving only the less frequently used variables out to memory is called (a)."}, {"id": "2-im-1", "concept": "immediate", "type": "calc", "prompt": "레지스터 $s1의 값을 $s2로 복사하는 MIPS 명령어를 쓰시오 (교수님 기준).", "answer": "add $s2, $s1, $zero", "explain": "addi에 $zero를 넣으면 0점 (교수님 4주-2).", "keys": ["add 사용", "$zero와 더함"], "lesson": "L2-3", "unit": "U2", "prompt_en": "Write a MIPS instruction that copies the value of register $s1 into $s2 (as the professor requires).", "explain_en": "Using addi with $zero gets zero points (the professor, Week 4-2).", "keys_en": ["Uses add", "Adds $zero"]}, {"id": "2-im-2", "concept": "immediate", "type": "mc", "prompt": "`$s2 = $s1 - 1`을 하는 올바른 MIPS 명령어는?", "choices": ["subi $s2, $s1, 1", "sub $s2, $s1, 1", "addi $s2, $s1, -1", "addi $s2, $s1, $zero"], "answer": 2, "explain": "subtract immediate는 없다.", "lesson": "L2-3", "unit": "U2", "prompt_en": "Which is the correct MIPS instruction for `$s2 = $s1 - 1`?", "explain_en": "There is no subtract immediate."}, {"id": "2-im-3", "concept": "immediate", "type": "ox", "prompt": "$zero 레지스터에 값을 쓰면 그 값으로 바뀐다.", "answer": false, "lesson": "L2-3", "unit": "U2", "prompt_en": "Writing a value to the $zero register changes it to that value."}, {"id": "2-im-4", "concept": "immediate", "type": "blank", "prompt": "Design Principle 3: Make the (a) case fast", "answer": "(a) common", "accept": [["common", "흔한", "일반적인"]], "lesson": "L2-3", "unit": "U2"}, {"id": "2-im-5", "concept": "immediate", "type": "ox", "prompt": "교수님 기준으로 `addi $v0, $s0, $zero`는 레지스터 복사로 올바른 코드다.", "answer": false, "explain": "$zero는 레지스터라 immediate 자리에 못 씀 → add $v0, $s0, $zero.", "lesson": "L2-3", "unit": "U2", "prompt_en": "According to the professor, `addi $v0, $s0, $zero` is a correct way to copy a register.", "explain_en": "$zero is a register, so it cannot go in the immediate position → add $v0, $s0, $zero."}, {"id": "2-tw-1", "concept": "twos", "type": "mc", "prompt": "32-bit 2의 보수로 표현할 수 있는 범위는?", "choices": ["0 ~ 2³²−1", "−2³¹ ~ 2³¹−1", "−2³² ~ 2³²", "−(2³¹−1) ~ 2³¹"], "answer": 1, "lesson": "L2-3", "unit": "U2", "prompt_en": "What is the range that can be represented in 32-bit two's complement?"}, {"id": "2-tw-2", "concept": "twos", "type": "calc", "prompt": "8-bit 2의 보수 `11111010`의 10진수 값은?", "answer": "−1×2⁷ + 1×2⁶ + 1×2⁵ + 1×2⁴ + 1×2³ + 0 + 1×2¹ + 0 = −128 + 122 = −6\n(또는 반전+1 → 00000110 = 6 → −6)", "keys": ["sign bit 1 → 음수", "−6"], "slot": 6, "pts": 5, "lesson": "L2-3", "unit": "U2", "prompt_en": "What is the decimal value of the 8-bit two's complement number `11111010`?", "answer_en": "−1×2⁷ + 1×2⁶ + 1×2⁵ + 1×2⁴ + 1×2³ + 0 + 1×2¹ + 0 = −128 + 122 = −6\n(Or invert + 1 → 00000110 = 6 → −6)", "keys_en": ["Sign bit 1 → negative", "−6"]}, {"id": "2-tw-3", "concept": "twos", "type": "mc", "prompt": "32-bit `1111 … 1111` (모두 1)의 2의 보수 값은?", "choices": ["−1", "−2,147,483,648", "4,294,967,295", "0"], "answer": 0, "lesson": "L2-3", "unit": "U2", "prompt_en": "What is the two's complement value of 32-bit `1111 … 1111` (all ones)?"}, {"id": "2-tw-4", "concept": "twos", "type": "ox", "prompt": "음이 아닌 수는 unsigned와 2의 보수에서 표현이 같다.", "answer": true, "lesson": "L2-3", "unit": "U2", "prompt_en": "Non-negative numbers have the same representation in unsigned and in two's complement."}, {"id": "2-tw-5", "concept": "twos", "type": "blank", "prompt": "n-bit unsigned 범위는 0 ~ (a), 2의 보수 범위는 (b) ~ 2^(n−1) − 1", "answer": "(a) 2^n − 1 / (b) −2^(n−1)", "accept": [["2^n1", "2n1", "2^n−1", "2ⁿ1"], ["2^n1", "2^(n1)", "2n1", "−2^(n−1)"]], "lesson": "L2-3", "unit": "U2", "prompt_en": "The n-bit unsigned range is 0 to (a); the two's complement range is (b) to 2^(n−1) − 1"}, {"id": "2-tw-6", "concept": "twos", "type": "calc", "prompt": "8-bit 2의 보수로 표현 가능한 최솟값과 최댓값을 이진수와 10진수로 쓰시오.", "answer": "최솟값: 1000 0000 = −128\n최댓값: 0111 1111 = +127", "keys": ["10000000 = −128", "01111111 = 127"], "lesson": "L2-3", "unit": "U2", "prompt_en": "Write the minimum and maximum values representable in 8-bit two's complement, in binary and decimal.", "answer_en": "Minimum: 1000 0000 = −128\nMaximum: 0111 1111 = +127"}, {"id": "2-ng-1", "concept": "negation", "type": "calc", "prompt": "−10을 32-bit 2의 보수로 쓰시오 (과정 포함).", "answer": "+10 = 0000 0000 0000 0000 0000 0000 0000 1010\ninvert = 1111 1111 1111 1111 1111 1111 1111 0101\n+1 = 1111 1111 1111 1111 1111 1111 1111 0110 (0xFFFFFFF6)", "keys": ["+10 이진", "비트 반전", "+1", "…1111 0110"], "slot": 6, "pts": 5, "lesson": "L2-3", "unit": "U2", "prompt_en": "Write −10 in 32-bit two's complement (show your work).", "keys_en": ["+10 in binary", "Invert the bits", "+1", "…1111 0110"]}, {"id": "2-ng-2", "concept": "negation", "type": "calc", "prompt": "−5를 32-bit 2의 보수(16진수)로 쓰시오.", "answer": "+5 = 0…0101 → 반전 1…1010 → +1 = 1…1011 = 0xFFFFFFFB", "keys": ["반전 + 1", "0xFFFFFFFB"], "lesson": "L2-3", "unit": "U2", "prompt_en": "Write −5 in 32-bit two's complement (hexadecimal).", "answer_en": "+5 = 0…0101 → invert 1…1010 → +1 = 1…1011 = 0xFFFFFFFB", "keys_en": ["Invert + 1", "0xFFFFFFFB"]}, {"id": "2-ng-3", "concept": "negation", "type": "blank", "prompt": "Signed negation: (a) and add 1", "answer": "(a) Complement", "accept": [["complement", "invert", "반전", "비트반전", "보수", "inversion", "complementing", "negate", "flip"]], "lesson": "L2-3", "unit": "U2"}, {"id": "2-ng-4", "concept": "negation", "type": "ox", "prompt": "x + x̄ (x의 모든 비트를 반전한 값) = −1 이므로 −x = x̄ + 1 이다.", "answer": true, "lesson": "L2-3", "unit": "U2", "prompt_en": "Since x + x̄ (x with all bits inverted) = −1, −x = x̄ + 1."}, {"id": "2-se-1", "concept": "sign-ext", "type": "calc", "prompt": "8-bit 값 +2 (`0000 0010`)와 −2 (`1111 1110`)를 16-bit로 sign extension하시오.", "answer": "+2: 0000 0000 0000 0010\n−2: 1111 1111 1111 1110", "explain": "교안 p.21의 '1111 1111 1000 0010'은 오타.", "keys": ["+2는 위를 0으로", "−2는 위를 1로", "1111 1111 1111 1110"], "slot": 6, "pts": 5, "lesson": "L2-3", "unit": "U2", "prompt_en": "Sign-extend the 8-bit values +2 (`0000 0010`) and −2 (`1111 1110`) to 16 bits.", "explain_en": "The '1111 1111 1000 0010' on slide p.21 is a typo.", "keys_en": ["+2: fill the upper bits with 0", "−2: fill the upper bits with 1", "1111 1111 1111 1110"]}, {"id": "2-se-2", "concept": "sign-ext", "type": "mc", "prompt": "MIPS에서 sign extension이 일어나지 '않는' 경우는?", "choices": ["addi의 immediate", "lb로 읽은 byte", "beq의 변위(offset)", "lbu로 읽은 byte"], "answer": 3, "explain": "lbu·lhu는 zero extension.", "lesson": "L2-3", "unit": "U2",
