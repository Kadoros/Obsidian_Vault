re class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w4-p15.jpg\" aria-label=\"크게 보기\"><img src=\"img/w4-p15.jpg\" alt=\"week4 p.15 · 원래 곱셈기와 흐름도\" loading=\"lazy\"><\/button><figcaption>week4 p.15 · 원래 곱셈기와 흐름도<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w4-p16.jpg\" aria-label=\"크게 보기\"><img src=\"img/w4-p16.jpg\" alt=\"week4 p.16 · 1000 × 1001: LSB 검사\" loading=\"lazy\"><\/button><figcaption>week4 p.16 · 1000 × 1001: LSB 검사<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-mult-v2\"><h3>개선된 곱셈기 (refined version)<\/h3><p>구성: <b>Multiplicand 32-bit (shift 안 함)<\/b>, <b>32-bit ALU<\/b>, <b>Product 64-bit (Shift right)<\/b>. Multiplier 레지스터가 따로 없음.<\/p>\n<p>알고리즘:<\/p>\n<ol><li>Product의 <b>아래 절반에 multiplier<\/b>를 넣고 위 절반은 0.<\/li><li>Product의 <b>LSB 검사<\/b>: 1이면 Product의 <b>위 절반에 multiplicand를 더함<\/b>.<\/li><li>매 반복: Product 전체를 <b>오른쪽 shift<\/b>.<\/li><li>종료: <b>shift 횟수 = multiplier 비트 수<\/b> (shift counter).<\/li><\/ol>\n<div class=\"callout trap\">함정: 종료 조건의 기준은 <b>multiplier<\/b>의 비트 수. multiplicand 아님 (교수님: \"be extremely careful it is not the multiplicand\").<\/div>\n<p>1000 × 1001:<\/p>\n<div class=\"tblw\"><table><thead><tr><th>반복<\/th><th>단계<\/th><th>Product<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>초기값 (아래 = multiplier)<\/td><td>0000 1001<\/td><\/tr><tr><td>1<\/td><td>LSB=1 → 위 절반 += 1000<\/td><td>1000 1001<\/td><\/tr><tr><td>1<\/td><td>&gt;&gt; 1<\/td><td>0100 0100<\/td><\/tr><tr><td>2<\/td><td>LSB=0, &gt;&gt; 1<\/td><td>0010 0010<\/td><\/tr><tr><td>3<\/td><td>LSB=0, &gt;&gt; 1<\/td><td>0001 0001<\/td><\/tr><tr><td>4<\/td><td>LSB=1 → 위 절반 += 1000<\/td><td>1001 0001<\/td><\/tr><tr><td>4<\/td><td>&gt;&gt; 1<\/td><td><b>0100 1000<\/b> (= 72)<\/td><\/tr><\/tbody><\/table><\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>'I will actually provide you a circuit and ask you what to do for the operation … there will be minor tweaks within the circuit'. 종료는 shift 횟수 = <b>multiplier<\/b> 비트 수 (multiplicand 아님).<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w4-p17.jpg\" aria-label=\"크게 보기\"><img src=\"img/w4-p17.jpg\" alt=\"week4 p.17 · 개선된 곱셈기 (Product shift right)\" loading=\"lazy\"><\/button><figcaption>week4 p.17 · 개선된 곱셈기 (Product shift right)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-mult-examples\"><h3>수업 예제 1·2 (week5)<\/h3><p><b>Example 1: 1010 × 0010 (원래 곱셈기)<\/b> → 10 × 2 = 20<\/p>\n<div class=\"tblw\"><table><thead><tr><th>반복<\/th><th>LSB<\/th><th>동작<\/th><th>Multiplier (shift 후)<\/th><th>Multiplicand (shift 후)<\/th><th>Product<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td><\/td><td>초기값<\/td><td>0010<\/td><td>0000 1010<\/td><td>0000 0000<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td>덧셈 없음<\/td><td>0001<\/td><td>0001 0100<\/td><td>0000 0000<\/td><\/tr><tr><td>2<\/td><td>1<\/td><td>Prod += 0001 0100<\/td><td>0000<\/td><td>0010 1000<\/td><td>0001 0100<\/td><\/tr><tr><td>3<\/td><td>0<\/td><td>덧셈 없음<\/td><td>0000<\/td><td>0101 0000<\/td><td>0001 0100<\/td><\/tr><tr><td>4<\/td><td>0<\/td><td>덧셈 없음<\/td><td>0000<\/td><td>1010 0000<\/td><td><b>0001 0100<\/b> (= 20)<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Example 2: 1010 × 1100 (개선 곱셈기)<\/b> → 10 × 12 = 120<\/p>\n<div class=\"tblw\"><table><thead><tr><th>반복<\/th><th>LSB<\/th><th>동작<\/th><th>Product (동작 후)<\/th><th>Product (&gt;&gt;1 후)<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td><\/td><td>초기값<\/td><td>0000 1100<\/td><td><\/td><\/tr><tr><td>1<\/td><td>0<\/td><td>덧셈 없음<\/td><td>0000 1100<\/td><td>0000 0110<\/td><\/tr><tr><td>2<\/td><td>0<\/td><td>덧셈 없음<\/td><td>0000 0110<\/td><td>0000 0011<\/td><\/tr><tr><td>3<\/td><td>1<\/td><td>위 절반 += 1010<\/td><td>1010 0011<\/td><td>0101 0001<\/td><\/tr><tr><td>4<\/td><td>1<\/td><td>위 절반 += 1010<\/td><td>1111 0001<\/td><td><b>0111 1000<\/b> (= 120)<\/td><\/tr><\/tbody><\/table><\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>시험 형식 예고: 명령어와 설명을 주고 박스를 채우거나 올바른 MIPS 표현을 쓰는 문제. 곱셈·나눗셈은 회로를 주고 과정을 묻는다.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w5-p14.jpg\" aria-label=\"크게 보기\"><img src=\"img/w5-p14.jpg\" alt=\"week5 p.14 · Example 1 (원래 곱셈기)\" loading=\"lazy\"><\/button><figcaption>week5 p.14 · Example 1 (원래 곱셈기)<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w5-p15.jpg\" aria-label=\"크게 보기\"><img src=\"img/w5-p15.jpg\" alt=\"week5 p.15 · Example 2 (개선 곱셈기)\" loading=\"lazy\"><\/button><figcaption>week5 p.15 · Example 2 (개선 곱셈기)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-mult-instr\"><h3>MIPS 곱셈 명령어<\/h3><ul><li>64-bit 곱 결과용 레지스터 2개: <b>HI<\/b> (위 32 bit), <b>LO<\/b> (아래 32 bit).<\/li><li><code>mult rs, rt<\/code> / <code>multu rs, rt<\/code>: 64-bit 곱을 HI/LO에.<\/li><li><code>mfhi rd<\/code> / <code>mflo rd<\/code>: HI/LO를 rd로 옮김. HI를 보면 32 bit 오버플로 여부를 알 수 있음.<\/li><li><code>mul rd, rs, rt<\/code>: 곱의 아래 32 bit만 rd에.<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w4-p18.jpg\" aria-label=\"크게 보기\"><img src=\"img/w4-p18.jpg\" alt=\"week4 p.18 · HI/LO, mult, mfhi, mflo, mul\" loading=\"lazy\"><\/button><figcaption>week4 p.18 · HI/LO, mult, mfhi, mflo, mul<\/figcaption><\/figure><\/section>", "title_en": "Multiplication Hardware", "exam_en": "Multiplication step table", "html_en": "<section class=\"sec\" id=\"s-mult-basic\"><h3>How Multiplication Works<\/h3><p>Same as long multiplication on paper: look at each digit of the multiplier; if it is 1, add the multiplicand (shifted by that position); if it is 0, add nothing.<\/p>\n<pre class=\"code\">   multiplicand     1000\n × multiplier     × 1001\n                    1000\n                   0000\n                  0000\n                 1000\n   product       1001000      (8 × 9 = 72)<\/pre>\n<p>n-bit × n-bit → the product is up to <b>2n bits<\/b> long.<\/p><\/section>\n<section class=\"sec\" id=\"s-mult-v1\"><h3>The Original Multiplier (first version)<\/h3><p>Components: <b>Multiplicand 64-bit (Shift left)<\/b>, <b>Multiplier 32-bit (Shift right)<\/b>, <b>64-bit ALU<\/b>, <b>Product 64-bit<\/b>, Control test. (Scaled down to 8-bit / 4-bit / 8-bit on the midterm.)<\/p>\n<p>Algorithm:<\/p>\n<ol><li>Initialize <b>Product = 0<\/b>.<\/li><li><b>Test the LSB<\/b> of the Multiplier: if 1, <code>Product = Product + Multiplicand<\/code> (send an add signal to the ALU); if 0, do nothing.<\/li><li><b>Every iteration<\/b>, regardless of the result: shift the Multiplicand <b>left<\/b> and the Multiplier <b>right<\/b>.<\/li><li>Done after 32 repetitions (4 at midterm size). (As the professor explained: it ends when the multiplier becomes 0.)<\/li><\/ol>\n<p>1000 × 1001:<\/p>\n<div class=\"tblw\"><table><thead><tr><th>Iteration<\/th><th>Step<\/th><th>Multiplier<\/th><th>Multiplicand<\/th><th>Product<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>Initial values<\/td><td>1001<\/td><td>0000 1000<\/td><td>0000 0000<\/td><\/tr><tr><td>1<\/td><td>LSB=1 → Prod += Mcand<\/td><td>1001<\/td><td>0000 1000<\/td><td>0000 1000<\/td><\/tr><tr><td>1<\/td><td>Mcand &lt;&lt;1, Mplier &gt;&gt;1<\/td><td>0100<\/td><td>0001 0000<\/td><td>0000 1000<\/td><\/tr><tr><td>2<\/td><td>LSB=0 → no add, shift<\/td><td>0010<\/td><td>0010 0000<\/td><td>0000 1000<\/td><\/tr><tr><td>3<\/td><td>LSB=0 → no add, shift<\/td><td>0001<\/td><td>0100 0000<\/td><td>0000 1000<\/td><\/tr><tr><td>4<\/td><td>LSB=1 → Prod += Mcand<\/td><td>0001<\/td><td>0100 0000<\/td><td>0100 1000<\/td><\/tr><tr><td>4<\/td><td>shift<\/td><td>0000<\/td><td>1000 0000<\/td><td><b>0100 1000<\/b> (= 72)<\/td><\/tr><\/tbody><\/table><\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 4-2 · Week 5-1<\/span><br>On the midterm it only appears with an 8-bit product and multiplicand and a 4-bit multiplier. Regardless of the LSB result, <b>shift twice every iteration<\/b> (multiplier right, multiplicand left).<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w4-p15.jpg\" aria-label=\"Enlarge\"><img src=\"img/w4-p15.jpg\" alt=\"week4 p.15 · The original multiplier and its flowchart\" loading=\"lazy\"><\/button><figcaption>week4 p.15 · The original multiplier and its flowchart<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w4-p16.jpg\" aria-label=\"Enlarge\"><img src=\"img/w4-p16.jpg\" alt=\"week4 p.16 · 1000 × 1001: testing the LSB\" loading=\"lazy\"><\/button><figcaption>week4 p.16 · 1000 × 1001: testing the LSB<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-mult-v2\"><h3>The Refined Multiplier (refined version)<\/h3><p>Components: <b>Multiplicand 32-bit (not shifted)<\/b>, <b>32-bit ALU<\/b>, <b>Product 64-bit (Shift right)<\/b>. There is no separate Multiplier register.<\/p>\n<p>Algorithm:<\/p>\n<ol><li>Put the <b>multiplier in the lower half<\/b> of Product and 0 in the upper half.<\/li><li><b>Test the LSB<\/b> of Product: if 1, <b>add the multiplicand to the upper half<\/b> of Product.<\/li><li>Every iteration: <b>shift the whole Product right<\/b>.<\/li><li>Termination: <b>number of shifts = number of bits in the multiplier<\/b> (shift counter).<\/li><\/ol>\n<div class=\"callout trap\">Trap: The termination condition counts the bits of the <b>multiplier<\/b>, not the multiplicand (the professor: \"be extremely careful it is not the multiplicand\").<\/div>\n<p>1000 × 1001:<\/p>\n<div class=\"tblw\"><table><thead><tr><th>Iteration<\/th><th>Step<\/th><th>Product<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>Initial value (lower half = multiplier)<\/td><td>0000 1001<\/td><\/tr><tr><td>1<\/td><td>LSB=1 → upper half += 1000<\/td><td>1000 1001<\/td><\/tr><tr><td>1<\/td><td>&gt;&gt; 1<\/td><td>0100 0100<\/td><\/tr><tr><td>2<\/td><td>LSB=0, &gt;&gt; 1<\/td><td>0010 0010<\/td><\/tr><tr><td>3<\/td><td>LSB=0, &gt;&gt; 1<\/td><td>0001 0001<\/td><\/tr><tr><td>4<\/td><td>LSB=1 → upper half += 1000<\/td><td>1001 0001<\/td><\/tr><tr><td>4<\/td><td>&gt;&gt; 1<\/td><td><b>0100 1000<\/b> (= 72)<\/td><\/tr><\/tbody><\/table><\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 5-1<\/span><br>'I will actually provide you a circuit and ask you what to do for the operation … there will be minor tweaks within the circuit'. It terminates when the number of shifts = the number of bits of the <b>multiplier<\/b> (not the multiplicand).<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w4-p17.jpg\" aria-label=\"Enlarge\"><img src=\"img/w4-p17.jpg\" alt=\"week4 p.17 · The refined multiplier (Product shifts right)\" loading=\"lazy\"><\/button><figcaption>week4 p.17 · The refined multiplier (Product shifts right)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-mult-examples\"><h3>Class Examples 1 and 2 (Week 5)<\/h3><p><b>Example 1: 1010 × 0010 (original multiplier)<\/b> → 10 × 2 = 20<\/p>\n<div class=\"tblw\"><table><thead><tr><th>Iteration<\/th><th>LSB<\/th><th>Action<\/th><th>Multiplier (after shift)<\/th><th>Multiplicand (after shift)<\/th><th>Product<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td><\/td><td>Initial values<\/td><td>0010<\/td><td>0000 1010<\/td><td>0000 0000<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td>No add<\/td><td>0001<\/td><td>0001 0100<\/td><td>0000 0000<\/td><\/tr><tr><td>2<\/td><td>1<\/td><td>Prod += 0001 0100<\/td><td>0000<\/td><td>0010 1000<\/td><td>0001 0100<\/td><\/tr><tr><td>3<\/td><td>0<\/td><td>No add<\/td><td>0000<\/td><td>0101 0000<\/td><td>0001 0100<\/td><\/tr><tr><td>4<\/td><td>0<\/td><td>No add<\/td><td>0000<\/td><td>1010 0000<\/td><td><b>0001 0100<\/b> (= 20)<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Example 2: 1010 × 1100 (refined multiplier)<\/b> → 10 × 12 = 120<\/p>\n<div class=\"tblw\"><table><thead><tr><th>Iteration<\/th><th>LSB<\/th><th>Action<\/th><th>Product (after action)<\/th><th>Product (after &gt;&gt;1)<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td><\/td><td>Initial value<\/td><td>0000 1100<\/td><td><\/td><\/tr><tr><td>1<\/td><td>0<\/td><td>No add<\/td><td>0000 1100<\/td><td>0000 0110<\/td><\/tr><tr><td>2<\/td><td>0<\/td><td>No add<\/td><td>0000 0110<\/td><td>0000 0011<\/td><\/tr><tr><td>3<\/td><td>1<\/td><td>Upper half += 1010<\/td><td>1010 0011<\/td><td>0101 0001<\/td><\/tr><tr><td>4<\/td><td>1<\/td><td>Upper half += 1010<\/td><td>1111 0001<\/td><td><b>0111 1000<\/b> (= 120)<\/td><\/tr><\/tbody><\/table><\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 5-1<\/span><br>Exam format preview: given an instruction and a description, fill in the boxes or write the correct MIPS expression. For multiplication and division, a circuit is given and you are asked for the process.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w5-p14.jpg\" aria-label=\"Enlarge\"><img src=\"img/w5-p14.jpg\" alt=\"week5 p.14 · Example 1 (original multiplier)\" loading=\"lazy\"><\/button><figcaption>week5 p.14 · Example 1 (original multiplier)<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w5-p15.jpg\" aria-label=\"Enlarge\"><img src=\"img/w5-p15.jpg\" alt=\"week5 p.15 · Example 2 (refined multiplier)\" loading=\"lazy\"><\/button><figcaption>week5 p.15 · Example 2 (refined multiplier)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-mult-instr\"><h3>MIPS Multiplication Instructions<\/h3><ul><li>Two registers hold the 64-bit product: <b>HI<\/b> (upper 32 bits) and <b>LO<\/b> (lower 32 bits).<\/li><li><code>mult rs, rt<\/code> / <code>multu rs, rt<\/code>: 64-bit product into HI/LO.<\/li><li><code>mfhi rd<\/code> / <code>mflo rd<\/code>: move HI/LO to rd. Checking HI tells you whether the product overflows 32 bits.<\/li><li><code>mul rd, rs, rt<\/code>: only the lower 32 bits of the product go to rd.<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w4-p18.jpg\" aria-label=\"Enlarge\"><img src=\"img/w4-p18.jpg\" alt=\"week4 p.18 · HI/LO, mult, mfhi, mflo, mul\" loading=\"lazy\"><\/button><figcaption>week4 p.18 · HI/LO, mult, mfhi, mflo, mul<\/figcaption><\/figure><\/section>"}, {"id": "L3-3", "title": "나눗셈 하드웨어", "src": "week4 p.19–21 · week5 p.9–13, 16", "exam": "나눗셈 과정 표", "secs": [{"id": "div-basic", "title": "나눗셈의 원리", "title_en": "How Division Works"}, {"id": "div-v1", "title": "나눗셈기 (first version)", "title_en": "The Divider (first version)"}, {"id": "div-example", "title": "수업 예제 3: 0001 0100 ÷ 0010", "title_en": "Class Example 3: 0001 0100 ÷ 0010"}, {"id": "div-v2", "title": "개선된 나눗셈기", "title_en": "The Refined Divider"}], "md": "## 나눗셈의 원리 {#div-basic}\n\n`Dividend = Quotient × Divisor + Remainder`. n-bit 피연산자 → n-bit 몫과 나머지.\n\n- **0으로 나누는지 먼저 검사** (교안: \"Always check for 0 divisor!!\").\n- Long division: divisor ≤ 지금 보고 있는 dividend 비트들이면 몫에 1 쓰고 빼기, 아니면 몫에 0 쓰고 다음 비트를 내림.\n- **Restoring division**: 일단 빼 보고, 나머지가 **음수(<0)면 divisor를 다시 더해 원상 복구**.\n- Signed division: 절댓값으로 나누고 몫·나머지 부호를 조정. **Dividend와 remainder는 같은 부호.**\n\n교안 예: 1001010 ÷ 1000 = 몫 **1001**, 나머지 **10** (74 ÷ 8 = 9 … 2).\n\n## 나눗셈기 (first version) {#div-v1}\n\n구성: **Divisor 64-bit (Shift right, 처음엔 왼쪽 절반에)**, **64-bit ALU**, **Remainder 64-bit (처음엔 dividend)**, **Quotient 32-bit (Shift left)**.\n\n알고리즘 (n+1번 반복):\n1. `Remainder = Remainder − Divisor`\n2. 결과 검사:\n   - **≥ 0**: Quotient 왼쪽 shift, 새 LSB = **1**\n   - **< 0**: `Remainder = Remainder + Divisor`로 **복구**, Quotient 왼쪽 shift, 새 LSB = **0**\n3. Divisor **오른쪽 shift**.\n\n> 함정: 음수인지는 결과의 **첫 비트(sign bit)**로 판단 (2의 보수). 음수면 반드시 다시 더해서(add back) 원래 값으로 되돌린 뒤 다음 자리로.\n\n## 수업 예제 3: 0001 0100 ÷ 0010 {#div-example}\n\n20 ÷ 2 = 10 … 0. 4-bit 나눗셈이라 **5번** 반복. Divisor 초기값 = 0010을 왼쪽 절반에 → `0010 0000`.\n\n| 반복 | Rem − Div | 판정 | Quotient | Divisor (>>1 후) | Remainder |\n|---|---|---|---|---|---|\n| 0 | | 초기값 | 0000 | 0010 0000 | 0001 0100 |\n| 1 | 1111 0100 | < 0 → 복구, 0 | 0000 | 0001 0000 | 0001 0100 |\n| 2 | 0000 0100 | ≥ 0 → 1 | 0001 | 0000 1000 | 0000 0100 |\n| 3 | 1111 1100 | < 0 → 복구, 0 | 0010 | 0000 0100 | 0000 0100 |\n| 4 | 0000 0000 | ≥ 0 → 1 | 0101 | 0000 0010 | 0000 0000 |\n| 5 | 1111 1110 | < 0 → 복구, 0 | **1010** | 0000 0001 | **0000 0000** |\n\n결과: Quotient = 1010 (10), Remainder = 0.\n\n## 개선된 나눗셈기 {#div-v2}\n\n교안 week5 p.13: **Divisor 32-bit (shift 안 함)**, **32-bit ALU**, **Remainder 64-bit (Shift right / Shift left / Write)**. 몫이 Remainder 레지스터의 아래 절반에 쌓이고 나머지는 위 절반에 남음 (곱셈 개선판과 같은 아이디어: 레지스터 하나로 합치기).", "html": "<section class=\"sec\" id=\"s-div-basic\"><h3>나눗셈의 원리<\/h3><p><code>Dividend = Quotient × Divisor + Remainder<\/code>. n-bit 피연산자 → n-bit 몫과 나머지.<\/p>\n<ul><li><b>0으로 나누는지 먼저 검사<\/b> (교안: \"Always check for 0 divisor!!\").<\/li><li>Long division: divisor ≤ 지금 보고 있는 dividend 비트들이면 몫에 1 쓰고 빼기, 아니면 몫에 0 쓰고 다음 비트를 내림.<\/li><li><b>Restoring division<\/b>: 일단 빼 보고, 나머지가 <b>음수(&lt;0)면 divisor를 다시 더해 원상 복구<\/b>.<\/li><li>Signed division: 절댓값으로 나누고 몫·나머지 부호를 조정. <b>Dividend와 remainder는 같은 부호.<\/b><\/li><\/ul>\n<p>교안 예: 1001010 ÷ 1000 = 몫 <b>1001<\/b>, 나머지 <b>10<\/b> (74 ÷ 8 = 9 … 2).<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">04주-2 · 05주-1<\/span><br>십진 나눗셈 728 ÷ 8로 설명: 먼저 빼 보고 음수면 다시 더해서(plus back) 원상 복구한 뒤 다음 자리로.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w4-p19.jpg\" aria-label=\"크게 보기\"><img src=\"img/w4-p19.jpg\" alt=\"week4 p.19 · 나눗셈 원리와 restoring division\" loading=\"lazy\"><\/button><figcaption>week4 p.19 · 나눗셈 원리와 restoring division<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-div-v1\"><h3>나눗셈기 (first version)<\/h3><p>구성: <b>Divisor 64-bit (Shift right, 처음엔 왼쪽 절반에)<\/b>, <b>64-bit ALU<\/b>, <b>Remainder 64-bit (처음엔 dividend)<\/b>, <b>Quotient 32-bit (Shift left)<\/b>.<\/p>\n<p>알고리즘 (n+1번 반복):<\/p>\n<ol><li><code>Remainder = Remainder − Divisor<\/code><\/li><li>결과 검사:<ul><li><b>≥ 0<\/b>: Quotient 왼쪽 shift, 새 LSB = <b>1<\/b><\/li><li><b>&lt; 0<\/b>: <code>Remainder = Remainder + Divisor<\/code>로 <b>복구<\/b>, Quotient 왼쪽 shift, 새 LSB = <b>0<\/b><\/li><\/ul><\/li><li>Divisor <b>오른쪽 shift<\/b>.<\/li><\/ol>\n<div class=\"callout trap\">함정: 음수인지는 결과의 <b>첫 비트(sign bit)<\/b>로 판단 (2의 보수). 음수면 반드시 다시 더해서(add back) 원래 값으로 되돌린 뒤 다음 자리로.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>음수인지는 2의 보수 첫 비트로 안다. 음수면 몫을 붙일 수 없고, 같은 값을 다음 자리와 이어 붙여야 하니 반드시 더해서 원래 값으로 복구.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w5-p10.jpg\" aria-label=\"크게 보기\"><img src=\"img/w5-p10.jpg\" alt=\"week5 p.10 · 나눗셈기와 흐름도\" loading=\"lazy\"><\/button><figcaption>week5 p.10 · 나눗셈기와 흐름도<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w5-p12.jpg\" aria-label=\"크게 보기\"><img src=\"img/w5-p12.jpg\" alt=\"week5 p.12 · 01001010 ÷ 1000 빼기·복구 과정\" loading=\"lazy\"><\/button><figcaption>week5 p.12 · 01001010 ÷ 1000 빼기·복구 과정<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-div-example\"><h3>수업 예제 3: 0001 0100 ÷ 0010<\/h3><p>20 ÷ 2 = 10 … 0. 4-bit 나눗셈이라 <b>5번<\/b> 반복. Divisor 초기값 = 0010을 왼쪽 절반에 → <code>0010 0000<\/code>.<\/p>\n<div class=\"tblw\"><table><thead><tr><th>반복<\/th><th>Rem − Div<\/th><th>판정<\/th><th>Quotient<\/th><th>Divisor (&gt;&gt;1 후)<\/th><th>Remainder<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td><\/td><td>초기값<\/td><td>0000<\/td><td>0010 0000<\/td><td>0001 0100<\/td><\/tr><tr><td>1<\/td><td>1111 0100<\/td><td>&lt; 0 → 복구, 0<\/td><td>0000<\/td><td>0001 0000<\/td><td>0001 0100<\/td><\/tr><tr><td>2<\/td><td>0000 0100<\/td><td>≥ 0 → 1<\/td><td>0001<\/td><td>0000 1000<\/td><td>0000 0100<\/td><\/tr><tr><td>3<\/td><td>1111 1100<\/td><td>&lt; 0 → 복구, 0<\/td><td>0010<\/td><td>0000 0100<\/td><td>0000 0100<\/td><\/tr><tr><td>4<\/td><td>0000 0000<\/td><td>≥ 0 → 1<\/td><td>0101<\/td><td>0000 0010<\/td><td>0000 0000<\/td><\/tr><tr><td>5<\/td><td>1111 1110<\/td><td>&lt; 0 → 복구, 0<\/td><td><b>1010<\/b><\/td><td>0000 0001<\/td><td><b>0000 0000<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<p>결과: Quotient = 1010 (10), Remainder = 0.<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w5-p16.jpg\" aria-label=\"크게 보기\"><img src=\"img/w5-p16.jpg\" alt=\"week5 p.16 · Example 3 (나눗셈기)\" loading=\"lazy\"><\/button><figcaption>week5 p.16 · Example 3 (나눗셈기)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-div-v2\"><h3>개선된 나눗셈기<\/h3><p>교안 week5 p.13: <b>Divisor 32-bit (shift 안 함)<\/b>, <b>32-bit ALU<\/b>, <b>Remainder 64-bit (Shift right / Shift left / Write)<\/b>. 몫이 Remainder 레지스터의 아래 절반에 쌓이고 나머지는 위 절반에 남음 (곱셈 개선판과 같은 아이디어: 레지스터 하나로 합치기).<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w5-p13.jpg\" aria-label=\"크게 보기\"><img src=\"img/w5-p13.jpg\" alt=\"week5 p.13 · 개선된 나눗셈기\" loading=\"lazy\"><\/button><figcaption>week5 p.13 · 개선된 나눗셈기<\/figcaption><\/figure><\/section>", "title_en": "Division Hardware", "exam_en": "Division step table", "html_en": "<section class=\"sec\" id=\"s-div-basic\"><h3>How Division Works<\/h3><p><code>Dividend = Quotient × Divisor + Remainder<\/code>. n-bit operands yield an n-bit quotient and remainder.<\/p>\n<ul><li><b>Check for a 0 divisor first<\/b> (slide: \"Always check for 0 divisor!!\").<\/li><li>Long division approach: if divisor ≤ the dividend bits currently being examined, put 1 in the quotient and subtract; otherwise put 0 in the quotient and bring down the next dividend bit.<\/li><li><b>Restoring division<\/b>: do the subtract, and if the remainder goes <b>negative (&lt; 0), add the divisor back<\/b> to restore it.<\/li><li>Signed division: divide using absolute values, then adjust the signs of the quotient and remainder as required. <b>The dividend and remainder must have the same sign.<\/b><\/li><\/ul>\n<p>Slide example: 1001010 ÷ 1000 = quotient <b>1001<\/b>, remainder <b>10<\/b> (74 ÷ 8 = 9 remainder 2).<\/p><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 4-2 · Week 5-1<\/span><br>Explained with the decimal division 728 ÷ 8: subtract first, and if it goes negative, add it back (plus back) to restore it, then move to the next digit.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w4-p19.jpg\" aria-label=\"Enlarge\"><img src=\"img/w4-p19.jpg\" alt=\"week4 p.19 · How division works and restoring division\" loading=\"lazy\"><\/button><figcaption>week4 p.19 · How division works and restoring division<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-div-v1\"><h3>The Divider (first version)<\/h3><p>Components: <b>Divisor 64-bit (Shift right, initially in the left half)<\/b>, <b>64-bit ALU<\/b>, <b>Remainder 64-bit (initially the dividend)<\/b>, <b>Quotient 32-bit (Shift left)<\/b>.<\/p>\n<p>Algorithm (repeat n+1 times):<\/p>\n<ol><li><code>Remainder = Remainder − Divisor<\/code><\/li><li>Test the result:<ul><li><b>≥ 0<\/b>: shift Quotient left, new LSB = <b>1<\/b><\/li><li><b>&lt; 0<\/b>: <b>restore<\/b> with <code>Remainder = Remainder + Divisor<\/code>, shift Quotient left, new LSB = <b>0<\/b><\/li><\/ul><\/li><li>Shift Divisor <b>right<\/b>.<\/li><\/ol>\n<div class=\"callout trap\">Trap: Whether the result is negative is decided by its <b>first bit (sign bit)<\/b> (two's complement). If it is negative, you must add the divisor back to restore the original value before moving on to the next bit.<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 5-1<\/span><br>Whether it is negative is known from the first bit of the two's complement. If it is negative you cannot append a quotient bit, and the same value has to be joined with the next digit, so you must add back to restore the original value.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w5-p10.jpg\" aria-label=\"Enlarge\"><img src=\"img/w5-p10.jpg\" alt=\"week5 p.10 · The divider and its flowchart\" loading=\"lazy\"><\/button><figcaption>week5 p.10 · The divider and its flowchart<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w5-p12.jpg\" aria-label=\"Enlarge\"><img src=\"img/w5-p12.jpg\" alt=\"week5 p.12 · 01001010 ÷ 1000: subtract and restore steps\" loading=\"lazy\"><\/button><figcaption>week5 p.12 · 01001010 ÷ 1000: subtract and restore steps<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-div-example\"><h3>Class Example 3: 0001 0100 ÷ 0010<\/h3><p>20 ÷ 2 = 10 remainder 0. A 4-bit division, so <b>5<\/b> iterations. Initial Divisor = 0010 in the left half → <code>0010 0000<\/code>.<\/p>\n<div class=\"tblw\"><table><thead><tr><th>Iteration<\/th><th>Rem − Div<\/th><th>Decision<\/th><th>Quotient<\/th><th>Divisor (after &gt;&gt;1)<\/th><th>Remainder<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td><\/td><td>Initial values<\/td><td>0000<\/td><td>0010 0000<\/td><td>0001 0100<\/td><\/tr><tr><td>1<\/td><td>1111 0100<\/td><td>&lt; 0 → restore, 0<\/td><td>0000<\/td><td>0001 0000<\/td><td>0001 0100<\/td><\/tr><tr><td>2<\/td><td>0000 0100<\/td><td>≥ 0 → 1<\/td><td>0001<\/td><td>0000 1000<\/td><td>0000 0100<\/td><\/tr><tr><td>3<\/td><td>1111 1100<\/td><td>&lt; 0 → restore, 0<\/td><td>0010<\/td><td>0000 0100<\/td><td>0000 0100<\/td><\/tr><tr><td>4<\/td><td>0000 0000<\/td><td>≥ 0 → 1<\/td><td>0101<\/td><td>0000 0010<\/td><td>0000 0000<\/td><\/tr><tr><td>5<\/td><td>1111 1110<\/td><td>&lt; 0 → restore, 0<\/td><td><b>1010<\/b><\/td><td>0000 0001<\/td><td><b>0000 0000<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<p>Result: Quotient = 1010 (10), Remainder = 0.<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w5-p16.jpg\" aria-label=\"Enlarge\"><img src=\"img/w5-p16.jpg\" alt=\"week5 p.16 · Example 3 (divider)\" loading=\"lazy\"><\/button><figcaption>week5 p.16 · Example 3 (divider)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-div-v2\"><h3>The Refined Divider<\/h3><p>Slide week5 p.13: <b>Divisor 32-bit (not shifted)<\/b>, <b>32-bit ALU<\/b>, <b>Remainder 64-bit (Shift right / Shift left / Write)<\/b>. The quotient accumulates in the lower half of the Remainder register and the remainder stays in the upper half (same idea as the refined multiplier: merge into one register).<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w5-p13.jpg\" aria-label=\"Enlarge\"><img src=\"img/w5-p13.jpg\" alt=\"week5 p.13 · The refined divider\" loading=\"lazy\"><\/button><figcaption>week5 p.13 · The refined divider<\/figcaption><\/figure><\/section>"}, {"id": "L3-4", "title": "IEEE 754 부동소수점 표현", "src": "week5 p.17–26", "exam": "32-bit 표현 쓰기", "secs": [{"id": "ieee-format", "title": "IEEE 754 형식", "title_en": "The IEEE 754 Format"}, {"id": "ieee-examples", "title": "변환 예제", "title_en": "Conversion Examples"}, {"id": "ieee-range", "title": "범위 · 특수값 · 정밀도", "title_en": "Range · Special Values · Precision"}], "md": "## IEEE 754 형식 {#ieee-format}\n\n| | S | Exponent | Fraction | Bias |\n|---|---|---|---|---|\n| Single (float) | 1 | **8 bits** | **23 bits** | **127** |\n| Double (double) | 1 | **11 bits** | **52 bits** | **1023** |\n\n`x = (−1)^S × (1 + Fraction) × 2^(Exponent − Bias)`\n\n- **S**: 0 = 음이 아님, 1 = 음수.\n- **Normalized significand**: 1.0 ≤ |significand| < 2.0. 앞의 \"1.\"은 항상 있으니 **저장하지 않음 (hidden bit)**.\n- **Exponent는 excess(bias) 표현**: 저장값 = 실제 지수 + Bias. 그래서 exponent는 항상 unsigned.\n\n> 함정: 필드 비트 수(1/8/23, 1/11/52)를 하나라도 틀리면 다른 필드까지 밀려서 **전부 0점** (교수님 5주).\n\n## 변환 예제 {#ieee-examples}\n\n**−0.75**: 0.75 = 0.11₂ = **1.1₂ × 2⁻¹** → S = 1, Exponent = −1 + 127 = 126 = `01111110`, Fraction = `1000…0`\n```\n1 01111110 10000000000000000000000   = 0xBF400000\n```\nDouble: Exponent = −1 + 1023 = 1022 = `01111111110`, Fraction = `1000…0` (52 bit).\n\n**0.625**: 0.101₂ = **1.01₂ × 2⁻¹** → S = 0, E = 126, F = `01000…0` → `0 01111110 01000000000000000000000` = 0x3F200000\n\n**−3.75**: 11.11₂ = **1.111₂ × 2¹** → S = 1, E = 1 + 127 = 128 = `10000000`, F = `111000…0` → `1 10000000 11100000000000000000000` = 0xC0700000\n\n순서: ① 부호 결정 ② 이진 소수로 변환 ③ 1.xxx × 2^e로 정규화 ④ e + bias ⑤ 소수점 뒤 비트를 fraction에 (나머지 0).\n\n## 범위 · 특수값 · 정밀도 {#ieee-range}\n\nSingle에서 exponent `00000000`과 `11111111`은 **예약**:\n\n| Exponent | Fraction | 의미 |\n|---|---|---|\n| 0 | 0 | **0** |\n| 0 | ≠ 0 | **Denormal** (hidden bit = 0, `(0 + F) × 2^(−bias)`) |\n| 255 | 0 | **±∞** |\n| 255 | ≠ 0 | **NaN** (0.0/0.0 같은 정의 안 된 결과) |\n\n- Single 최소(정규): exponent 1 → 1 − 127 = −126, ±1.0 × 2⁻¹²⁶ ≈ ±1.2 × 10⁻³⁸\n- Single 최대: exponent 254 → +127, ≈ ±2.0 × 2¹²⁷ ≈ ±3.4 × 10³⁸\n- Double: −1022 ~ +1023, ≈ ±2.2 × 10⁻³⁰⁸ ~ ±1.8 × 10³⁰⁸\n- 정밀도: single ≈ 2⁻²³ → 약 **6자리** 십진 정밀도, double ≈ 2⁻⁵² → 약 **16자리**.\n- Denormal은 정규화 수보다 작은 값을 표현해 **gradual underflow** 허용.", "html": "<section class=\"sec\" id=\"s-ieee-format\"><h3>IEEE 754 형식<\/h3><div class=\"tblw\"><table><thead><tr><th><\/th><th>S<\/th><th>Exponent<\/th><th>Fraction<\/th><th>Bias<\/th><\/tr><\/thead><tbody><tr><td>Single (float)<\/td><td>1<\/td><td><b>8 bits<\/b><\/td><td><b>23 bits<\/b><\/td><td><b>127<\/b><\/td><\/tr><tr><td>Double (double)<\/td><td>1<\/td><td><b>11 bits<\/b><\/td><td><b>52 bits<\/b><\/td><td><b>1023<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>x = (−1)^S × (1 + Fraction) × 2^(Exponent − Bias)<\/code><\/p>\n<ul><li><b>S<\/b>: 0 = 음이 아님, 1 = 음수.<\/li><li><b>Normalized significand<\/b>: 1.0 ≤ |significand| &lt; 2.0. 앞의 \"1.\"은 항상 있으니 <b>저장하지 않음 (hidden bit)<\/b>.<\/li><li><b>Exponent는 excess(bias) 표현<\/b>: 저장값 = 실제 지수 + Bias. 그래서 exponent는 항상 unsigned.<\/li><\/ul>\n<div class=\"callout trap\">함정: 필드 비트 수(1/8/23, 1/11/52)를 하나라도 틀리면 다른 필드까지 밀려서 <b>전부 0점<\/b> (교수님 5주).<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>필드 비트 수를 하나라도 놓치면 필드끼리 섞여서 <b>0점<\/b>. 전체 표현을 다 써야 한다.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w5-p20.jpg\" aria-label=\"크게 보기\"><img src=\"img/w5-p20.jpg\" alt=\"week5 p.20 · IEEE 754 형식\" loading=\"lazy\"><\/button><figcaption>week5 p.20 · IEEE 754 형식<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-ieee-examples\"><h3>변환 예제<\/h3><p><b>−0.75<\/b>: 0.75 = 0.11₂ = <b>1.1₂ × 2⁻¹<\/b> → S = 1, Exponent = −1 + 127 = 126 = <code>01111110<\/code>, Fraction = <code>1000…0<\/code><\/p>\n<pre class=\"code\">1 01111110 10000000000000000000000   = 0xBF400000<\/pre>\n<p>Double: Exponent = −1 + 1023 = 1022 = <code>01111111110<\/code>, Fraction = <code>1000…0<\/code> (52 bit).<\/p>\n<p><b>0.625<\/b>: 0.101₂ = <b>1.01₂ × 2⁻¹<\/b> → S = 0, E = 126, F = <code>01000…0<\/code> → <code>0 01111110 01000000000000000000000<\/code> = 0x3F200000<\/p>\n<p><b>−3.75<\/b>: 11.11₂ = <b>1.111₂ × 2¹<\/b> → S = 1, E = 1 + 127 = 128 = <code>10000000<\/code>, F = <code>111000…0<\/code> → <code>1 10000000 11100000000000000000000<\/code> = 0xC0700000<\/p>\n<p>순서: ① 부호 결정 ② 이진 소수로 변환 ③ 1.xxx × 2^e로 정규화 ④ e + bias ⑤ 소수점 뒤 비트를 fraction에 (나머지 0).<\/p><\/section>\n<section class=\"sec\" id=\"s-ieee-range\"><h3>범위 · 특수값 · 정밀도<\/h3><p>Single에서 exponent <code>00000000<\/code>과 <code>11111111<\/code>은 <b>예약<\/b>:<\/p>\n<div class=\"tblw\"><table><thead><tr><th>Exponent<\/th><th>Fraction<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td><b>0<\/b><\/td><\/tr><tr><td>0<\/td><td>≠ 0<\/td><td><b>Denormal<\/b> (hidden bit = 0, <code>(0 + F) × 2^(−bias)<\/code>)<\/td><\/tr><tr><td>255<\/td><td>0<\/td><td><b>±∞<\/b><\/td><\/tr><tr><td>255<\/td><td>≠ 0<\/td><td><b>NaN<\/b> (0.0/0.0 같은 정의 안 된 결과)<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Single 최소(정규): exponent 1 → 1 − 127 = −126, ±1.0 × 2⁻¹²⁶ ≈ ±1.2 × 10⁻³⁸<\/li><li>Single 최대: exponent 254 → +127, ≈ ±2.0 × 2¹²⁷ ≈ ±3.4 × 10³⁸<\/li><li>Double: −1022 ~ +1023, ≈ ±2.2 × 10⁻³⁰⁸ ~ ±1.8 × 10³⁰⁸<\/li><li>정밀도: single ≈ 2⁻²³ → 약 <b>6자리<\/b> 십진 정밀도, double ≈ 2⁻⁵² → 약 <b>16자리<\/b>.<\/li><li>Denormal은 정규화 수보다 작은 값을 표현해 <b>gradual underflow<\/b> 허용.<\/li><\/ul><\/section>", "title_en": "IEEE 754 Floating-Point Representation", "exam_en": "Writing the 32-bit representation", "html_en": "<section class=\"sec\" id=\"s-ieee-format\"><h3>The IEEE 754 Format<\/h3><div class=\"tblw\"><table><thead><tr><th><\/th><th>S<\/th><th>Exponent<\/th><th>Fraction<\/th><th>Bias<\/th><\/tr><\/thead><tbody><tr><td>Single (float)<\/td><td>1<\/td><td><b>8 bits<\/b><\/td><td><b>23 bits<\/b><\/td><td><b>127<\/b><\/td><\/tr><tr><td>Double (double)<\/td><td>1<\/td><td><b>11 bits<\/b><\/td><td><b>52 bits<\/b><\/td><td><b>1023<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>x = (−1)^S × (1 + Fraction) × 2^(Exponent − Bias)<\/code><\/p>\n<ul><li><b>S<\/b>: 0 = non-negative, 1 = negative.<\/li><li><b>Normalized significand<\/b>: 1.0 ≤ |significand| &lt; 2.0. The leading \"1.\" is always there, so it is <b>not stored (hidden bit)<\/b>.<\/li><li><b>The exponent uses excess (biased) representation<\/b>: stored value = actual exponent + Bias. So the stored exponent is always unsigned.<\/li><\/ul>\n<div class=\"callout trap\">Trap: If you get any field width wrong (1/8/23, 1/11/52), the other fields shift too and the <b>whole answer gets zero points<\/b> (the professor, Week 5).<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 5-1<\/span><br>If you miss even one field's bit count, the fields get mixed up and you get <b>zero points<\/b>. You must write out the whole representation.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w5-p20.jpg\" aria-label=\"Enlarge\"><img src=\"img/w5-p20.jpg\" alt=\"week5 p.20 · IEEE 754 format\" loading=\"lazy\"><\/button><figcaption>week5 p.20 · IEEE 754 format<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-ieee-examples\"><h3>Conversion Examples<\/h3><p><b>−0.75<\/b>: 0.75 = 0.11₂ = <b>1.1₂ × 2⁻¹<\/b> → S = 1, Exponent = −1 + 127 = 126 = <code>01111110<\/code>, Fraction = <code>1000…0<\/code><\/p>\n<pre class=\"code\">1 01111110 10000000000000000000000   = 0xBF400000<\/pre>\n<p>Double: Exponent = −1 + 1023 = 1022 = <code>01111111110<\/code>, Fraction = <code>1000…0<\/code> (52 bits).<\/p>\n<p><b>0.625<\/b>: 0.101₂ = <b>1.01₂ × 2⁻¹<\/b> → S = 0, E = 126, F = <code>01000…0<\/code> → <code>0 01111110 01000000000000000000000<\/code> = 0x3F200000<\/p>\n<p><b>−3.75<\/b>: 11.11₂ = <b>1.111₂ × 2¹<\/b> → S = 1, E = 1 + 127 = 128 = <code>10000000<\/code>, F = <code>111000…0<\/code> → <code>1 10000000 11100000000000000000000<\/code> = 0xC0700000<\/p>\n<p>Steps: ① determine the sign ② convert to a binary fraction ③ normalize to 1.xxx × 2^e ④ e + bias ⑤ put the bits after the binary point into the fraction (rest 0).<\/p><\/section>\n<section class=\"sec\" id=\"s-ieee-range\"><h3>Range · Special Values · Precision<\/h3><p>In single precision, exponents <code>00000000<\/code> and <code>11111111<\/code> are <b>reserved<\/b>:<\/p>\n<div class=\"tblw\"><table><thead><tr><th>Exponent<\/th><th>Fraction<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td><b>0<\/b><\/td><\/tr><tr><td>0<\/td><td>≠ 0<\/td><td><b>Denormal<\/b> (hidden bit = 0, <code>(0 + F) × 2^(−bias)<\/code>)<\/td><\/tr><tr><td>255<\/td><td>0<\/td><td><b>±∞<\/b><\/td><\/tr><tr><td>255<\/td><td>≠ 0<\/td><td><b>NaN<\/b> (undefined result such as 0.0/0.0)<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Single smallest (normalized): exponent 1 → 1 − 127 = −126, ±1.0 × 2⁻¹²⁶ ≈ ±1.2 × 10⁻³⁸<\/li><li>Single largest: exponent 254 → +127, ≈ ±2.0 × 2¹²⁷ ≈ ±3.4 × 10³⁸<\/li><li>Double: −1022 to +1023, ≈ ±2.2 × 10⁻³⁰⁸ to ±1.8 × 10³⁰⁸<\/li><li>Precision: single ≈ 2⁻²³ → about <b>6 decimal digits<\/b>; double ≈ 2⁻⁵² → about <b>16 digits<\/b>.<\/li><li>Denormals represent values smaller than the normalized numbers, allowing <b>gradual underflow<\/b>.<\/li><\/ul><\/section>"}, {"id": "L3-5", "title": "부동소수점 덧셈 · 곱셈 · FP 명령어", "src": "week5 p.27–31", "exam": "FP 연산 단계", "secs": [{"id": "fp-add", "title": "FP 덧셈 4단계", "title_en": "FP Addition in 4 Steps"}, {"id": "fp-mul", "title": "FP 곱셈 5단계", "title_en": "FP Multiplication in 5 Steps"}, {"id": "fp-instr", "title": "FP 하드웨어와 명령어", "title_en": "FP Hardware and Instructions"}], "md": "## FP 덧셈 4단계 {#fp-add}\n\n1. **Align**: 지수가 작은 쪽을 shift해서 큰 지수에 맞춤.\n2. **Add significands**.\n3. **Normalize** 하고 over/underflow 검사.\n4. **Round**, 필요하면 다시 normalize.\n\n십진 예: 9.999×10¹ + 1.610×10⁻¹ → 9.999×10¹ + 0.016×10¹ → 10.015×10¹ → 1.0015×10² → **1.002×10²**\n\n이진 예: 0.5 + (−0.4375) = 1.000₂×2⁻¹ + (−1.110₂×2⁻²)\n```\n1. 1.000×2⁻¹ + (−0.111×2⁻¹)\n2. 0.001×2⁻¹\n3. 1.000×2⁻⁴  (over/underflow 없음)\n4. 1.000×2⁻⁴ = 0.0625\n```\n\n## FP 곱셈 5단계 {#fp-mul}\n\n1. **Add exponents** (biased면 합에서 bias를 한 번 빼기).\n2. **Multiply significands**.\n3. **Normalize**, over/underflow 검사.\n4. **Round**, 필요하면 renormalize.\n5. **부호 결정** (피연산자 부호로).\n\n이진 예: 0.5 × (−0.4375) = 1.000₂×2⁻¹ × (−1.110₂×2⁻²)\n```\n1. 지수: −1 + −2 = −3   (biased: (−1+127) + (−2+127) − 127 = −3 + 127)\n2. 1.000 × 1.110 = 1.110  → 1.110×2⁻³\n3. 정규화 그대로, over/underflow 없음\n4. 반올림 그대로\n5. +ve × −ve → −ve :  −1.110×2⁻³ = −0.21875\n```\n> 함정: biased 지수끼리 더하면 bias가 두 번 들어가니까 **127을 한 번 빼야** 한다.\n\n## FP 하드웨어와 명령어 {#fp-instr}\n\n- 보통 FP 전용 하드웨어(여러 사이클): 덧셈·뺄셈·곱셈·나눗셈·역수·제곱근, FP ↔ 정수 변환.\n- **별도의 FP 레지스터**: single 32개 `$f0–$f31`, double은 짝으로 `$f0/$f1`, `$f2/$f3`…\n- FP 명령어는 FP 레지스터에서만 동작 (정수 연산을 FP 데이터에 하지 않음) → 코드 크기 영향 적게 레지스터를 늘림.", "html": "<section class=\"sec\" id=\"s-fp-add\"><h3>FP 덧셈 4단계<\/h3><ol><li><b>Align<\/b>: 지수가 작은 쪽을 shift해서 큰 지수에 맞춤.<\/li><li><b>Add significands<\/b>.<\/li><li><b>Normalize<\/b> 하고 over/underflow 검사.<\/li><li><b>Round<\/b>, 필요하면 다시 normalize.<\/li><\/ol>\n<p>십진 예: 9.999×10¹ + 1.610×10⁻¹ → 9.999×10¹ + 0.016×10¹ → 10.015×10¹ → 1.0015×10² → <b>1.002×10²<\/b><\/p>\n<p>이진 예: 0.5 + (−0.4375) = 1.000₂×2⁻¹ + (−1.110₂×2⁻²)<\/p>\n<pre class=\"code\">1. 1.000×2⁻¹ + (−0.111×2⁻¹)\n2. 0.001×2⁻¹\n3. 1.000×2⁻⁴  (over/underflow 없음)\n4. 1.000×2⁻⁴ = 0.0625<\/pre><\/section>\n<section class=\"sec\" id=\"s-fp-mul\"><h3>FP 곱셈 5단계<\/h3><ol><li><b>Add exponents<\/b> (biased면 합에서 bias를 한 번 빼기).<\/li><li><b>Multiply significands<\/b>.<\/li><li><b>Normalize<\/b>, over/underflow 검사.<\/li><li><b>Round<\/b>, 필요하면 renormalize.<\/li><li><b>부호 결정<\/b> (피연산자 부호로).<\/li><\/ol>\n<p>이진 예: 0.5 × (−0.4375) = 1.000₂×2⁻¹ × (−1.110₂×2⁻²)<\/p>\n<pre class=\"code\">1. 지수: −1 + −2 = −3   (biased: (−1+127) + (−2+127) − 127 = −3 + 127)\n2. 1.000 × 1.110 = 1.110  → 1.110×2⁻³\n3. 정규화 그대로, over/underflow 없음\n4. 반올림 그대로\n5. +ve × −ve → −ve :  −1.110×2⁻³ = −0.21875<\/pre>\n<div class=\"callout trap\">함정: biased 지수끼리 더하면 bias가 두 번 들어가니까 <b>127을 한 번 빼야<\/b> 한다.<\/div><\/section>\n<section class=\"sec\" id=\"s-fp-instr\"><h3>FP 하드웨어와 명령어<\/h3><ul><li>보통 FP 전용 하드웨어(여러 사이클): 덧셈·뺄셈·곱셈·나눗셈·역수·제곱근, FP ↔ 정수 변환.<\/li><li><b>별도의 FP 레지스터<\/b>: single 32개 <code>$f0–$f31<\/code>, double은 짝으로 <code>$f0/$f1<\/code>, <code>$f2/$f3<\/code>…<\/li><li>FP 명령어는 FP 레지스터에서만 동작 (정수 연산을 FP 데이터에 하지 않음) → 코드 크기 영향 적게 레지스터를 늘림.<\/li><\/ul><\/section>", "title_en": "Floating-Point Addition · Multiplication · FP Instructions", "exam_en": "FP operation steps", "html_en": "<section class=\"sec\" id=\"s-fp-add\"><h3>FP Addition in 4 Steps<\/h3><ol><li><b>Align<\/b>: shift the number with the smaller exponent to match the larger exponent.<\/li><li><b>Add significands<\/b>.<\/li><li><b>Normalize<\/b> the result and check for over/underflow.<\/li><li><b>Round<\/b>, and renormalize if necessary.<\/li><\/ol>\n<p>Decimal example: 9.999×10¹ + 1.610×10⁻¹ → 9.999×10¹ + 0.016×10¹ → 10.015×10¹ → 1.0015×10² → <b>1.002×10²<\/b><\/p>\n<p>Binary example: 0.5 + (−0.4375) = 1.000₂×2⁻¹ + (−1.110₂×2⁻²)<\/p>\n<pre class=\"code\">1. 1.000×2⁻¹ + (−0.111×2⁻¹)\n2. 0.001×2⁻¹\n3. 1.000×2⁻⁴  (no over/underflow)\n4. 1.000×2⁻⁴ = 0.0625<\/pre><\/section>\n<section class=\"sec\" id=\"s-fp-mul\"><h3>FP Multiplication in 5 Steps<\/h3><ol><li><b>Add exponents<\/b> (for biased exponents, subtract the bias once from the sum).<\/li><li><b>Multiply significands<\/b>.<\/li><li><b>Normalize<\/b>, check for over/underflow.<\/li><li><b>Round<\/b>, renormalize if necessary.<\/li><li><b>Determine the sign<\/b> (from the operands' signs).<\/li><\/ol>\n<p>Binary example: 0.5 × (−0.4375) = 1.000₂×2⁻¹ × (−1.110₂×2⁻²)<\/p>\n<pre class=\"code\">1. exponent: −1 + −2 = −3   (biased: (−1+127) + (−2+127) − 127 = −3 + 127)\n2. 1.000 × 1.110 = 1.110  → 1.110×2⁻³\n3. already normalized, no over/underflow\n4. rounding leaves it unchanged\n5. +ve × −ve → −ve :  −1.110×2⁻³ = −0.21875<\/pre>\n<div class=\"callout trap\">Trap: Adding two biased exponents counts the bias twice, so you must <b>subtract 127 once<\/b>.<\/div><\/section>\n<section class=\"sec\" id=\"s-fp-instr\"><h3>FP Hardware and Instructions<\/h3><ul><li>Usually dedicated FP hardware (multi-cycle): addition, subtraction, multiplication, division, reciprocal, square root, FP ↔ integer conversion.<\/li><li><b>Separate FP registers<\/b>: 32 single-precision <code>$f0–$f31<\/code>; doubles use pairs <code>$f0/$f1<\/code>, <code>$f2/$f3<\/code>, …<\/li><li>FP instructions operate only on FP registers (integer operations are not applied to FP data) → more registers with minimal impact on code size.<\/li><\/ul><\/section>"}], "title_en": "Ch.3 Arithmetic for Computers (Integer · Floating Point)", "intro_en": "Multiplication and division come as \"given the circuit, show the process\". The professor said \"there may be small changes in the circuit, so look carefully\". On the midterm the sizes are only product/multiplicand 8 bits and multiplier 4 bits. In floating point, getting even one field's bit count wrong gets zero points."}, {"id": "U4", "title": "Ch.4 프로세서: 데이터패스와 제어 (단순 버전)", "src": "week6-수업.pdf", "intro": "교수님이 6주-2에서 \"오늘 목표는 이 슬라이드 한 장(p.3 단순 CPU)을 완벽히 이해하는 것\"이라고 함. 명령어마다 어떤 선으로 데이터가 흐르고, 각 MUX에 0/1 중 뭘 줘야 하는지가 핵심. 개념을 읽은 다음 '수업 따라가기' 탭에서 교수님 설명을 장면별로 보고, '데이터패스 놀이터'에서 명령어별 경로를 확인해.", "lessons": [{"id": "L4-1", "title": "프로세서 개요 · 명령어 실행 단계", "src": "week6 p.2–7", "exam": "7개 명령어만", "secs": [{"id": "proc-intro", "title": "두 가지 구현과 명령어 부분집합", "title_en": "Two Implementations and the Instruction Subset"}, {"id": "exec-steps", "title": "명령어 실행 단계", "title_en": "Instruction Execution Steps"}, {"id": "cpu-overview", "title": "CPU 개요와 MUX가 필요한 이유", "title_en": "CPU Overview and Why MUXes Are Needed"}], "md": "## 두 가지 구현과 명령어 부분집합 {#proc-intro}\n\n- CPU 성능 요소: Instruction Count, **CPI와 Cycle Time** (이 단원은 CPI·cycle time을 결정하는 구현).\n- 두 가지 MIPS 구현: **단순 버전 (중간고사)**, 파이프라인 버전 (기말).\n- 다루는 명령어: 메모리 `lw, sw` · 산술/논리 `add, sub, and, or` · 제어 `beq, j` (p.4엔 `slt`도 포함).\n\n> 시험 포인트: 교수님 \"중간에서는 이 명령어들만 써야 한다. 다른 명령어를 쓰면 0점.\" 수업에서는 \"seven instructions\"라고 말했는데, 슬라이드 목록은 lw, sw, add, sub, and, or, beq, j. 단순 데이터패스에서 실제로 다룬 건 R-type, lw, sw, beq.\n\n## 명령어 실행 단계 {#exec-steps}\n\n1. **PC → instruction memory**, 명령어 fetch.\n2. **Register numbers → register file**, 레지스터 읽기.\n3. 명령어 종류에 따라:\n   - **ALU**로 계산: 산술 결과 / load·store용 **메모리 주소** / **분기 대상 주소**\n   - load·store면 **data memory** 접근\n   - **PC ← 분기 대상 주소 또는 PC + 4**\n\n명령어는 1 word = **32 bit = 4 byte** → 다음 줄로 가려면 **PC + 4**.\n\n> 함정: 6주-1 녹음에서 \"word = 32 bytes\"라고 말한 부분이 있는데 말실수. 32 **bits** = 4 bytes.\n\n## CPU 개요와 MUX가 필요한 이유 {#cpu-overview}\n\np.5 개요도: PC → Instruction memory → Registers → ALU → Data memory, 그리고 PC+4 adder와 branch adder.\n\np.6: **\"Can't just join wires together: Use multiplexers\"** — 서로 다른 출처의 선을 그냥 합칠 수 없으니 선택기가 필요한 곳 3군데:\n1. **PC 입력**: PC + 4 또는 branch target\n2. **ALU 두 번째 입력**: 레지스터 값 또는 명령어의 16-bit 상수(sign-extended)\n3. **레지스터 쓰기 데이터**: ALU 결과 또는 data memory에서 읽은 값\n\np.7: 여기에 **Control** 유닛이 붙어서 MUX 선택 신호, RegWrite, MemRead/MemWrite, ALU operation, Branch를 만든다.\n\n> 교수님 설명: R-format이면 ALU 결과가 원하는 값이지만, lw면 ALU 결과는 **주소일 뿐**이고 실제 원하는 건 그 주소의 메모리 값. 그래서 쓰기 데이터 MUX가 필요.", "html": "<section class=\"sec\" id=\"s-proc-intro\"><h3>두 가지 구현과 명령어 부분집합<\/h3><ul><li>CPU 성능 요소: Instruction Count, <b>CPI와 Cycle Time<\/b> (이 단원은 CPI·cycle time을 결정하는 구현).<\/li><li>두 가지 MIPS 구현: <b>단순 버전 (중간고사)<\/b>, 파이프라인 버전 (기말).<\/li><li>다루는 명령어: 메모리 <code>lw, sw<\/code> · 산술/논리 <code>add, sub, and, or<\/code> · 제어 <code>beq, j<\/code> (p.4엔 <code>slt<\/code>도 포함).<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 교수님 \"중간에서는 이 명령어들만 써야 한다. 다른 명령어를 쓰면 0점.\" 수업에서는 \"seven instructions\"라고 말했는데, 슬라이드 목록은 lw, sw, add, sub, and, or, beq, j. 단순 데이터패스에서 실제로 다룬 건 R-type, lw, sw, beq.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">06주-1<\/span><br>'before midterm, you will actually deal with the simplified version of the CPU, and for your final, you will deal with the pipeline version'. 중간엔 수업에서 정한 명령어만 쓰고, 다른 걸 쓰면 0점.<\/div><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-1:0\">▶ 06주-1 3:09 오늘 주제: 데이터패스와 제어<\/button><button class=\"btn sm ghost\" data-walk=\"w6-1:1\">▶ 06주-1 3:55 중간엔 이 명령어들만 써라<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:26\">▶ 06주-2 30:53 중간엔 이 명령어들만<\/button><\/div><\/section>\n<section class=\"sec\" id=\"s-exec-steps\"><h3>명령어 실행 단계<\/h3><ol><li><b>PC → instruction memory<\/b>, 명령어 fetch.<\/li><li><b>Register numbers → register file<\/b>, 레지스터 읽기.<\/li><li>명령어 종류에 따라:<ul><li><b>ALU<\/b>로 계산: 산술 결과 / load·store용 <b>메모리 주소<\/b> / <b>분기 대상 주소<\/b><\/li><li>load·store면 <b>data memory<\/b> 접근<\/li><li><b>PC ← 분기 대상 주소 또는 PC + 4<\/b><\/li><\/ul><\/li><\/ol>\n<p>명령어는 1 word = <b>32 bit = 4 byte<\/b> → 다음 줄로 가려면 <b>PC + 4<\/b>.<\/p>\n<div class=\"callout trap\">함정: 6주-1 녹음에서 \"word = 32 bytes\"라고 말한 부분이 있는데 말실수. 32 <b>bits<\/b> = 4 bytes.<\/div><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-1:4\">▶ 06주-1 5:21 PC와 PC + 4<\/button><button class=\"btn sm ghost\" data-walk=\"w6-1:5\">▶ 06주-1 6:26 레지스터 번호 → 레지스터 파일<\/button><button class=\"btn sm ghost\" data-walk=\"w6-1:6\">▶ 06주-1 6:48 ALU가 계산하는 세 가지<\/button><\/div><\/section>\n<section class=\"sec\" id=\"s-cpu-overview\"><h3>CPU 개요와 MUX가 필요한 이유<\/h3><p>p.5 개요도: PC → Instruction memory → Registers → ALU → Data memory, 그리고 PC+4 adder와 branch adder.<\/p>\n<p>p.6: <b>\"Can't just join wires together: Use multiplexers\"<\/b> — 서로 다른 출처의 선을 그냥 합칠 수 없으니 선택기가 필요한 곳 3군데:<\/p>\n<ol><li><b>PC 입력<\/b>: PC + 4 또는 branch target<\/li><li><b>ALU 두 번째 입력<\/b>: 레지스터 값 또는 명령어의 16-bit 상수(sign-extended)<\/li><li><b>레지스터 쓰기 데이터<\/b>: ALU 결과 또는 data memory에서 읽은 값<\/li><\/ol>\n<p>p.7: 여기에 <b>Control<\/b> 유닛이 붙어서 MUX 선택 신호, RegWrite, MemRead/MemWrite, ALU operation, Branch를 만든다.<\/p>\n<div class=\"callout\">교수님 설명: R-format이면 ALU 결과가 원하는 값이지만, lw면 ALU 결과는 <b>주소일 뿐<\/b>이고 실제 원하는 건 그 주소의 메모리 값. 그래서 쓰기 데이터 MUX가 필요.<\/div><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-1:8\">▶ 06주-1 8:12 baby PC와 adder<\/button><button class=\"btn sm ghost\" data-walk=\"w6-1:11\">▶ 06주-1 10:29 ALU 입력: 레지스터 두 개 또는 레지스터 + 상수<\/button><button class=\"btn sm ghost\" data-walk=\"w6-1:13\">▶ 06주-1 12:04 여기가 까다로운 부분: MUX<\/button><\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p05.jpg\" aria-label=\"크게 보기\"><img src=\"img/w6-p05.jpg\" alt=\"week6 p.5 · CPU Overview\" loading=\"lazy\"><\/button><figcaption>week6 p.5 · CPU Overview<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p06.jpg\" aria-label=\"크게 보기\"><img src=\"img/w6-p06.jpg\" alt=\"week6 p.6 · Can&#x27;t just join wires together: MUX가 필요한 3곳\" loading=\"lazy\"><\/button><figcaption>week6 p.6 · Can&#x27;t just join wires together: MUX가 필요한 3곳<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p07.jpg\" aria-label=\"크게 보기\"><img src=\"img/w6-p07.jpg\" alt=\"week6 p.7 · CPU Overview: Control\" loading=\"lazy\"><\/button><figcaption>week6 p.7 · CPU Overview: Control<\/figcaption><\/figure><\/section>", "title_en": "Processor Overview · Instruction Execution Steps", "exam_en": "Only these instructions", "html_en": "<section class=\"sec\" id=\"s-proc-intro\"><h3>Two Implementations and the Instruction Subset<\/h3><ul><li>CPU performance factors: Instruction Count, <b>CPI and Cycle Time<\/b> (this unit covers the implementation, which determines CPI and cycle time).<\/li><li>Two MIPS implementations: <b>a simplified version (midterm)<\/b> and a more realistic pipelined version (final).<\/li><li>Instructions covered: memory reference <code>lw, sw<\/code> · arithmetic/logical <code>add, sub, and, or<\/code> · control transfer <code>beq, j<\/code> (p.4 also includes <code>slt<\/code>).<\/li><\/ul>\n<div class=\"callout exam\">Exam point: The professor said \"on the midterm you must use only these instructions. Using any other instruction gets zero points.\" In class he said \"seven instructions\", but the slide list is lw, sw, add, sub, and, or, beq, j. The simplified datapath actually covered R-type, lw, sw and beq.<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 6-1<\/span><br>'before midterm, you will actually deal with the simplified version of the CPU, and for your final, you will deal with the pipeline version'. On the midterm use only the instructions defined in class; using any other gets zero points.<\/div><\/section>\n<section class=\"sec\" id=\"s-exec-steps\"><h3>Instruction Execution Steps<\/h3><ol><li><b>PC → instruction memory<\/b>, fetch the instruction.<\/li><li><b>Register numbers → register file<\/b>, read the registers.<\/li><li>Depending on the instruction class:<ul><li>Use the <b>ALU<\/b> to calculate: the arithmetic result / the <b>memory address<\/b> for load/store / the <b>branch target address<\/b><\/li><li>Access <b>data memory<\/b> for load/store<\/li><li><b>PC ← branch target address or PC + 4<\/b><\/li><\/ul><\/li><\/ol>\n<p>An instruction is 1 word = <b>32 bits = 4 bytes<\/b> → to go to the next line, <b>PC + 4<\/b>.<\/p>\n<div class=\"callout trap\">Trap: In the Week 6-1 recording the professor said \"word = 32 bytes\"; that was a slip of the tongue. It is 32 <b>bits<\/b> = 4 bytes.<\/div><\/section>\n<section class=\"sec\" id=\"s-cpu-overview\"><h3>CPU Overview and Why MUXes Are Needed<\/h3><p>p.5 overview: PC → Instruction memory → Registers → ALU → Data memory, plus the PC+4 adder and the branch adder.<\/p>\n<p>p.6: <b>\"Can't just join wires together: Use multiplexers\"<\/b> — wires from different sources cannot simply be joined, so a selector is needed in 3 places:<\/p>\n<ol><li><b>PC input<\/b>: PC + 4 or the branch target<\/li><li><b>Second ALU input<\/b>: a register value or the instruction's 16-bit constant (sign-extended)<\/li><li><b>Register write data<\/b>: the ALU result or the value read from data memory<\/li><\/ol>\n<p>p.7: a <b>Control<\/b> unit is added, which generates the MUX select signals, RegWrite, MemRead/MemWrite, the ALU operation, and Branch.<\/p>\n<div class=\"callout\">The professor explained: for R-format, the ALU result is the value we want; but for lw the ALU result is <b>only an address<\/b>, and what we actually want is the memory value at that address. That is why the write-data MUX is needed.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p05.jpg\" aria-label=\"Enlarge\"><img src=\"img/w6-p05.jpg\" alt=\"week6 p.5 · CPU Overview\" loading=\"lazy\"><\/button><figcaption>week6 p.5 · CPU Overview<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p06.jpg\" aria-label=\"Enlarge\"><img src=\"img/w6-p06.jpg\" alt=\"week6 p.6 · Can&#x27;t just join wires together: the 3 places that need a MUX\" loading=\"lazy\"><\/button><figcaption>week6 p.6 · Can&#x27;t just join wires together: the 3 places that need a MUX<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p07.jpg\" aria-label=\"Enlarge\"><img src=\"img/w6-p07.jpg\" alt=\"week6 p.7 · CPU Overview: Control\" loading=\"lazy\"><\/button><figcaption>week6 p.7 · CPU Overview: Control<\/figcaption><\/figure><\/section>"}, {"id": "L4-2", "title": "논리 설계 기초 · 클럭", "src": "week6 p.8–15", "exam": "MUX 0/1 읽기", "secs": [{"id": "comb-elements", "title": "정보 표현과 조합 회로", "title_en": "Information Encoding and Combinational Elements"}, {"id": "mux-basic", "title": "Multiplexer 읽는 법", "title_en": "How to Read a Multiplexer"}, {"id": "seq-elements", "title": "순차 소자: 레지스터", "title_en": "Sequential Elements: Registers"}, {"id": "clocking", "title": "Clocking methodology", "title_en": "Clocking Methodology"}], "md": "## 정보 표현과 조합 회로 {#comb-elements}\n\n- 이진 표현: low voltage = 0, high = 1. **선 하나 = 1 bit**, 여러 bit는 multi-wire bus (32-bit면 선 32개).\n- **Combinational element**: 데이터에 연산. **출력이 입력만의 함수** (기억 없음).\n\n| 소자 | 식 |\n|---|---|\n| AND gate | Y = A & B |\n| **Multiplexer** | **Y = S ? I1 : I0** |\n| Adder | Y = A + B |\n| ALU | Y = F(A, B), F = 수행할 함수 |\n\nALU는 adder의 확장판. R-format이면 F는 명령어의 맨 아래 6 bit(**funct**)로 결정됨.\n\n## Multiplexer 읽는 법 {#mux-basic}\n\n- 입력선마다 번호가 붙어 있음 (I0, I1).\n- **선택선 S = 0 → I0, S = 1 → I1**.\n- 시험에서는 **어떤 선이 0이고 어떤 선이 1인지 그림에 표시돼서** 나옴. 교수님이 판서로 0과 1을 직접 써서 설명.\n\n> 시험 포인트: 신호값은 \"위/아래\"가 아니라 **MUX에 적힌 숫자**로 정해. 숫자가 뒤집혀 있으면 신호도 반대 (6주-2 \"be extremely careful on what is actually written on the multiplexer\").\n\n## 순차 소자: 레지스터 {#seq-elements}\n\n- **State (sequential) element**: 정보를 **저장**.\n- **Register**: 회로에 데이터를 저장. **clock**으로 언제 값을 갱신할지 결정.\n- **Edge-triggered**: Clk이 **0 → 1로 바뀔 때(rising edge)** 갱신.\n- **Register with write control**: clock edge이면서 **write control 입력이 1일 때만** 갱신. 나중에 값이 필요할 때 사용. (레지스터 파일의 RegWrite가 이것)\n\n> 함정: 6주-1에서 \"0 to 1 or 1 to 0\"이라고 말했지만 슬라이드와 6주-2 설명은 **0 → 1**. 시험은 슬라이드 기준.\n\n## Clocking methodology {#clocking}\n\n- 조합 회로는 **클럭 사이클 동안(클럭 edge 사이)** 데이터를 변환.\n- 입력은 state element에서 오고, 출력은 state element로 감.\n- **가장 긴 지연이 clock period를 결정**.", "html": "<section class=\"sec\" id=\"s-comb-elements\"><h3>정보 표현과 조합 회로<\/h3><ul><li>이진 표현: low voltage = 0, high = 1. <b>선 하나 = 1 bit<\/b>, 여러 bit는 multi-wire bus (32-bit면 선 32개).<\/li><li><b>Combinational element<\/b>: 데이터에 연산. <b>출력이 입력만의 함수<\/b> (기억 없음).<\/li><\/ul>\n<div class=\"tblw\"><table><thead><tr><th>소자<\/th><th>식<\/th><\/tr><\/thead><tbody><tr><td>AND gate<\/td><td>Y = A &amp; B<\/td><\/tr><tr><td><b>Multiplexer<\/b><\/td><td><b>Y = S ? I1 : I0<\/b><\/td><\/tr><tr><td>Adder<\/td><td>Y = A + B<\/td><\/tr><tr><td>ALU<\/td><td>Y = F(A, B), F = 수행할 함수<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ALU는 adder의 확장판. R-format이면 F는 명령어의 맨 아래 6 bit(<b>funct<\/b>)로 결정됨.<\/p><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-1:16\">▶ 06주-1 15:10 선 하나 = 1비트<\/button><button class=\"btn sm ghost\" data-walk=\"w6-1:17\">▶ 06주-1 15:39 조합 소자: AND 게이트<\/button><button class=\"btn sm ghost\" data-walk=\"w6-1:19\">▶ 06주-1 16:34 Adder와 ALU (F = funct)<\/button><\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p10.jpg\" aria-label=\"크게 보기\"><img src=\"img/w6-p10.jpg\" alt=\"week6 p.10 · AND, MUX, Adder, ALU\" loading=\"lazy\"><\/button><figcaption>week6 p.10 · AND, MUX, Adder, ALU<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-mux-basic\"><h3>Multiplexer 읽는 법<\/h3><ul><li>입력선마다 번호가 붙어 있음 (I0, I1).<\/li><li><b>선택선 S = 0 → I0, S = 1 → I1<\/b>.<\/li><li>시험에서는 <b>어떤 선이 0이고 어떤 선이 1인지 그림에 표시돼서<\/b> 나옴. 교수님이 판서로 0과 1을 직접 써서 설명.<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 신호값은 \"위/아래\"가 아니라 <b>MUX에 적힌 숫자<\/b>로 정해. 숫자가 뒤집혀 있으면 신호도 반대 (6주-2 \"be extremely careful on what is actually written on the multiplexer\").<\/div><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-1:18\">▶ 06주-1 16:01 MUX: 0과 1을 직접 써서 설명<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:6\">▶ 06주-2 12:04 MUX: 파란 선이 0번/1번을 고른다<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:24\">▶ 06주-2 29:54 MUX = 조합 소자<\/button><\/div><\/section>\n<section class=\"sec\" id=\"s-seq-elements\"><h3>순차 소자: 레지스터<\/h3><ul><li><b>State (sequential) element<\/b>: 정보를 <b>저장<\/b>.<\/li><li><b>Register<\/b>: 회로에 데이터를 저장. <b>clock<\/b>으로 언제 값을 갱신할지 결정.<\/li><li><b>Edge-triggered<\/b>: Clk이 <b>0 → 1로 바뀔 때(rising edge)<\/b> 갱신.<\/li><li><b>Register with write control<\/b>: clock edge이면서 <b>write control 입력이 1일 때만<\/b> 갱신. 나중에 값이 필요할 때 사용. (레지스터 파일의 RegWrite가 이것)<\/li><\/ul>\n<div class=\"callout trap\">함정: 6주-1에서 \"0 to 1 or 1 to 0\"이라고 말했지만 슬라이드와 6주-2 설명은 <b>0 → 1<\/b>. 시험은 슬라이드 기준.<\/div><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-1:20\">▶ 06주-1 17:14 클럭과 edge-triggered<\/button><button class=\"btn sm ghost\" data-walk=\"w6-1:21\">▶ 06주-1 18:34 write control이 있는 레지스터<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:25\">▶ 06주-2 30:15 Clock, edge-triggered (0 → 1)<\/button><\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p13.jpg\" aria-label=\"크게 보기\"><img src=\"img/w6-p13.jpg\" alt=\"week6 p.13 · Edge-triggered register\" loading=\"lazy\"><\/button><figcaption>week6 p.13 · Edge-triggered register<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p14.jpg\" aria-label=\"크게 보기\"><img src=\"img/w6-p14.jpg\" alt=\"week6 p.14 · Register with write control\" loading=\"lazy\"><\/button><figcaption>week6 p.14 · Register with write control<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-clocking\"><h3>Clocking methodology<\/h3><ul><li>조합 회로는 <b>클럭 사이클 동안(클럭 edge 사이)<\/b> 데이터를 변환.<\/li><li>입력은 state element에서 오고, 출력은 state element로 감.<\/li><li><b>가장 긴 지연이 clock period를 결정<\/b>.<\/li><\/ul><\/section>", "title_en": "Logic Design Basics · Clocking", "exam_en": "Reading MUX 0/1", "html_en": "<section class=\"sec\" id=\"s-comb-elements\"><h3>Information Encoding and Combinational Elements<\/h3><ul><li>Information encoded in binary: low voltage = 0, high voltage = 1. <b>One wire per bit<\/b>; multi-bit data is encoded on multi-wire buses (32 bits = 32 wires).<\/li><li><b>Combinational element<\/b>: operates on data. <b>The output is a function of the input only<\/b> (no memory).<\/li><\/ul>\n<div class=\"tblw\"><table><thead><tr><th>Element<\/th><th>Expression<\/th><\/tr><\/thead><tbody><tr><td>AND gate<\/td><td>Y = A &amp; B<\/td><\/tr><tr><td><b>Multiplexer<\/b><\/td><td><b>Y = S ? I1 : I0<\/b><\/td><\/tr><tr><td>Adder<\/td><td>Y = A + B<\/td><\/tr><tr><td>ALU<\/td><td>Y = F(A, B), F = the function to perform<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The ALU is an extension of the adder. For R-format, F is determined by the lowest 6 bits of the instruction (<b>funct<\/b>).<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p10.jpg\" aria-label=\"Enlarge\"><img src=\"img/w6-p10.jpg\" alt=\"week6 p.10 · AND, MUX, Adder, ALU\" loading=\"lazy\"><\/button><figcaption>week6 p.10 · AND, MUX, Adder, ALU<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-mux-basic\"><h3>How to Read a Multiplexer<\/h3><ul><li>Each input wire is numbered (I0, I1).<\/li><li><b>Select line S = 0 → I0, S = 1 → I1<\/b>.<\/li><li>On the exam, <b>the figure shows which wire is 0 and which is 1<\/b>. The professor wrote the 0s and 1s on the board when explaining.<\/li><\/ul>\n<div class=\"callout exam\">Exam point: Decide the signal value by <b>the number written on the MUX<\/b>, not by \"top/bottom\". If the numbers are swapped, the signal is reversed too (Week 6-2: \"be extremely careful on what is actually written on the multiplexer\").<\/div><\/section>\n<section class=\"sec\" id=\"s-seq-elements\"><h3>Sequential Elements: Registers<\/h3><ul><li><b>State (sequential) element<\/b>: <b>stores<\/b> information.<\/li><li><b>Register<\/b>: stores data in a circuit. Uses a <b>clock<\/b> signal to determine when to update the stored value.<\/li><li><b>Edge-triggered<\/b>: updates when Clk changes <b>from 0 to 1 (rising edge)<\/b>.<\/li><li><b>Register with write control<\/b>: only updates on a clock edge <b>when the write control input is 1<\/b>. Used when the stored value is required later. (The register file's RegWrite is this.)<\/li><\/ul>\n<div class=\"callout trap\">Trap: In Week 6-1 the professor said \"0 to 1 or 1 to 0\", but the slide and the Week 6-2 explanation say <b>0 → 1<\/b>. The exam follows the slide.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p13.jpg\" aria-label=\"Enlarge\"><img src=\"img/w6-p13.jpg\" alt=\"week6 p.13 · Edge-triggered register\" loading=\"lazy\"><\/button><figcaption>week6 p.13 · Edge-triggered register<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p14.jpg\" aria-label=\"Enlarge\"><img src=\"img/w6-p14.jpg\" alt=\"week6 p.14 · Register with write control\" loading=\"lazy\"><\/button><figcaption>week6 p.14 · Register with write control<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-clocking\"><h3>Clocking Methodology<\/h3><ul><li>Combinational logic transforms data during clock cycles (<b>between clock edges<\/b>).<\/li><li>Input comes from state elements; output goes to a state element.<\/li><li><b>The longest delay determines the clock period<\/b>.<\/li><\/ul><\/section>"}, {"id": "L4-3", "title": "데이터패스 구성 요소", "src": "week6 p.16–24", "exam": "4개의 MUX", "secs": [{"id": "fetch", "title": "데이터패스 만들기 · Instruction fetch", "title_en": "Building a Datapath · Instruction Fetch"}, {"id": "r-datapath", "title": "R-format 데이터패스", "title_en": "The R-format Datapath"}, {"id": "ls-datapath", "title": "Load/Store 데이터패스", "title_en": "The Load/Store Datapath"}, {"id": "br-datapath", "title": "Branch 데이터패스", "title_en": "The Branch Datapath"}, {"id": "composing", "title": "요소 합치기: 4개의 MUX", "title_en": "Composing the Elements: The Four MUXes"}], "md": "## 데이터패스 만들기 · Instruction fetch {#fetch}\n\n- **Datapath**: CPU에서 데이터·주소를 처리하는 요소들 (레지스터, ALU, MUX, 메모리…). 명령어 부분집합에 맞춰 단계적으로 만든다.\n- **Instruction fetch**: **PC(32-bit register)**가 instruction memory의 read address로 → 명령어 출력. 동시에 PC가 **Add**에 들어가서 **+4** → 다음 명령어 주소가 다시 PC로.\n\n## R-format 데이터패스 {#r-datapath}\n\nR-format(add, sub, and, or, slt): opcode = 000000, **funct(5:0)**가 연산 결정.\n1. 레지스터 피연산자 **2개 읽기** (Read register 1 = rs, Read register 2 = rt, 각 5 bit)\n2. 산술/논리 연산 (ALU, ALU operation 4 bit)\n3. 결과를 레지스터에 **쓰기** (Write register = rd, Write data, **RegWrite = 1**)\n\n예 `add $t0, $s1, $s2` → op 0 | rs 17 | rt 18 | rd 8 | shamt 0 | funct 32.\n\n## Load/Store 데이터패스 {#ls-datapath}\n\n1. 레지스터 읽기 (rs = base)\n2. 16-bit offset으로 주소 계산: ALU 사용, offset은 **sign-extend (16 → 32)**\n3. **Load**: 메모리 읽고 레지스터 갱신 (**MemRead = 1, RegWrite = 1**)\n4. **Store**: 레지스터 값을 메모리에 쓰기 (**MemWrite = 1**)\n\nSign extension: 위 16 bit를 상수의 sign bit로 채움 (양수 0, 음수 1).\n\n> 함정: 6주-1 23:18에 lw 설명하면서 \"memory write field를 켠다\"고 말했는데 말실수. lw는 **MemRead**와 RegWrite, MemWrite는 sw. 바로 뒤(24:50)에 정정함.\n\n## Branch 데이터패스 {#br-datapath}\n\nbeq:\n1. 레지스터 피연산자 읽기 (rs, rt)\n2. ALU로 **빼기** → **Zero 출력** 확인 (같으면 Zero = 1)\n3. 분기 대상 주소 계산:\n   - 변위(16 bit)를 **sign-extend**\n   - **Shift left 2** (word 변위 → byte, ×4)\n   - **PC + 4**에 더함 (PC + 4는 fetch에서 이미 계산됨)\n\n> 시험 포인트: 분기 상수는 주소가 아니라 **(PC + 4)부터 몇 줄(명령어) 떨어졌나**. byte가 아니라 줄 수로 주는 이유는 4로 안 나눠지는 값이 들어가면 심각한 오류가 나기 때문.\n\n## 요소 합치기: 4개의 MUX {#composing}\n\n- 단순 데이터패스는 **명령어 하나를 한 클럭 사이클에** 실행.\n- 각 요소는 한 번에 한 기능만 → **instruction memory와 data memory를 분리**.\n- 출처가 둘인 곳마다 MUX:\n  1. ALU 입력: 레지스터 vs 명령어의 immediate → **ALUSrc**\n  2. 레지스터 쓰기 데이터: ALU 출력 vs data memory → **MemtoReg**\n  3. 다음 PC: PC + 4 vs branch target → **Branch AND Zero** (PCSrc)\n  4. 쓰기 레지스터 번호: **Rt vs Rd** → **RegDst**", "html": "<section class=\"sec\" id=\"s-fetch\"><h3>데이터패스 만들기 · Instruction fetch<\/h3><ul><li><b>Datapath<\/b>: CPU에서 데이터·주소를 처리하는 요소들 (레지스터, ALU, MUX, 메모리…). 명령어 부분집합에 맞춰 단계적으로 만든다.<\/li><li><b>Instruction fetch<\/b>: <b>PC(32-bit register)<\/b>가 instruction memory의 read address로 → 명령어 출력. 동시에 PC가 <b>Add<\/b>에 들어가서 <b>+4<\/b> → 다음 명령어 주소가 다시 PC로.<\/li><\/ul><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-1:22\">▶ 06주-1 19:11 이 명령어들로 데이터패스를 만든다<\/button><button class=\"btn sm ghost\" data-walk=\"w6-1:23\">▶ 06주-1 19:29 Instruction fetch<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:2\">▶ 06주-2 6:54 PC와 위쪽 adder: PC + 4<\/button><\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p18.jpg\" aria-label=\"크게 보기\"><img src=\"img/w6-p18.jpg\" alt=\"week6 p.18 · Instruction Fetch\" loading=\"lazy\"><\/button><figcaption>week6 p.18 · Instruction Fetch<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-r-datapath\"><h3>R-format 데이터패스<\/h3><p>R-format(add, sub, and, or, slt): opcode = 000000, <b>funct(5:0)<\/b>가 연산 결정.<\/p>\n<ol><li>레지스터 피연산자 <b>2개 읽기<\/b> (Read register 1 = rs, Read register 2 = rt, 각 5 bit)<\/li><li>산술/논리 연산 (ALU, ALU operation 4 bit)<\/li><li>결과를 레지스터에 <b>쓰기<\/b> (Write register = rd, Write data, <b>RegWrite = 1<\/b>)<\/li><\/ol>\n<p>예 <code>add $t0, $s1, $s2<\/code> → op 0 | rs 17 | rt 18 | rd 8 | shamt 0 | funct 32.<\/p><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-1:9\">▶ 06주-1 8:45 명령어 → 레지스터 (R-type은 3개)<\/button><button class=\"btn sm ghost\" data-walk=\"w6-1:26\">▶ 06주-1 21:45 R-format 데이터패스: 레지스터 3개 + RegWrite<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:28\">▶ 06주-2 32:59 R-format: RegWrite, funct로 ALU 신호<\/button><\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p20.jpg\" aria-label=\"크게 보기\"><img src=\"img/w6-p20.jpg\" alt=\"week6 p.20 · Registers와 ALU\" loading=\"lazy\"><\/button><figcaption>week6 p.20 · Registers와 ALU<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-ls-datapath\"><h3>Load/Store 데이터패스<\/h3><ol><li>레지스터 읽기 (rs = base)<\/li><li>16-bit offset으로 주소 계산: ALU 사용, offset은 <b>sign-extend (16 → 32)<\/b><\/li><li><b>Load<\/b>: 메모리 읽고 레지스터 갱신 (<b>MemRead = 1, RegWrite = 1<\/b>)<\/li><li><b>Store<\/b>: 레지스터 값을 메모리에 쓰기 (<b>MemWrite = 1<\/b>)<\/li><\/ol>\n<p>Sign extension: 위 16 bit를 상수의 sign bit로 채움 (양수 0, 음수 1).<\/p>\n<div class=\"callout trap\">함정: 6주-1 23:18에 lw 설명하면서 \"memory write field를 켠다\"고 말했는데 말실수. lw는 <b>MemRead<\/b>와 RegWrite, MemWrite는 sw. 바로 뒤(24:50)에 정정함.<\/div><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-1:10\">▶ 06주-1 9:46 lw는 base + offset<\/button><button class=\"btn sm ghost\" data-walk=\"w6-1:28\">▶ 06주-1 23:02 lw: MemRead + RegWrite<\/button><button class=\"btn sm ghost\" data-walk=\"w6-1:29\">▶ 06주-1 23:57 16비트 → 32비트 sign extension<\/button><button class=\"btn sm ghost\" data-walk=\"w6-1:30\">▶ 06주-1 24:50 sw는 MemWrite, lw는 MemRead·RegWrite<\/button><\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p22.jpg\" aria-label=\"크게 보기\"><img src=\"img/w6-p22.jpg\" alt=\"week6 p.22 · Data memory와 Sign-extend\" loading=\"lazy\"><\/button><figcaption>week6 p.22 · Data memory와 Sign-extend<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-br-datapath\"><h3>Branch 데이터패스<\/h3><p>beq:<\/p>\n<ol><li>레지스터 피연산자 읽기 (rs, rt)<\/li><li>ALU로 <b>빼기<\/b> → <b>Zero 출력<\/b> 확인 (같으면 Zero = 1)<\/li><li>분기 대상 주소 계산:<ul><li>변위(16 bit)를 <b>sign-extend<\/b><\/li><li><b>Shift left 2<\/b> (word 변위 → byte, ×4)<\/li><li><b>PC + 4<\/b>에 더함 (PC + 4는 fetch에서 이미 계산됨)<\/li><\/ul><\/li><\/ol>\n<div class=\"callout exam\">시험 포인트: 분기 상수는 주소가 아니라 <b>(PC + 4)부터 몇 줄(명령어) 떨어졌나<\/b>. byte가 아니라 줄 수로 주는 이유는 4로 안 나눠지는 값이 들어가면 심각한 오류가 나기 때문.<\/div><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-1:31\">▶ 06주-1 25:15 beq: 두 레지스터 비교<\/button><button class=\"btn sm ghost\" data-walk=\"w6-1:33\">▶ 06주-1 27:37 PC + 4 + (offset &lt;&lt; 2)<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:20\">▶ 06주-2 25:17 3을 32비트로 sign extend (음수일 수도)<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:31\">▶ 06주-2 34:45 beq 정리: 빼기, ALUSrc 0, ×4, AND<\/button><\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p23.jpg\" aria-label=\"크게 보기\"><img src=\"img/w6-p23.jpg\" alt=\"week6 p.23 · Branch datapath\" loading=\"lazy\"><\/button><figcaption>week6 p.23 · Branch datapath<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-composing\"><h3>요소 합치기: 4개의 MUX<\/h3><ul><li>단순 데이터패스는 <b>명령어 하나를 한 클럭 사이클에<\/b> 실행.<\/li><li>각 요소는 한 번에 한 기능만 → <b>instruction memory와 data memory를 분리<\/b>.<\/li><li>출처가 둘인 곳마다 MUX:<ul><li>ALU 입력: 레지스터 vs 명령어의 immediate → <b>ALUSrc<\/b><\/li><li>레지스터 쓰기 데이터: ALU 출력 vs data memory → <b>MemtoReg<\/b><\/li><li>다음 PC: PC + 4 vs branch target → <b>Branch AND Zero<\/b> (PCSrc)<\/li><li>쓰기 레지스터 번호: <b>Rt vs Rd<\/b> → <b>RegDst<\/b><\/li><\/ul><\/li><\/ul><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-1:7\">▶ 06주-1 7:30 instruction memory와 data memory를 나눈다<\/button><button class=\"btn sm ghost\" data-walk=\"w6-1:14\">▶ 06주-1 12:57 ① ALU 입력 MUX: 레지스터 vs 16비트 상수<\/button><button class=\"btn sm ghost\" data-walk=\"w6-1:15\">▶ 06주-1 13:52 ② 쓰기 데이터 MUX: 메모리 값 vs ALU 결과<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:30\">▶ 06주-2 34:04 addi는 MemtoReg로 ALU 결과를 고른다<\/button><\/div><\/section>", "title_en": "Datapath Elements", "exam_en": "The four MUXes", "html_en": "<section class=\"sec\" id=\"s-fetch\"><h3>Building a Datapath · Instruction Fetch<\/h3><ul><li><b>Datapath<\/b>: the elements that process data and addresses in the CPU (registers, ALUs, MUXes, memories, …). We build it incrementally for a simple subset of instructions.<\/li><li><b>Instruction fetch<\/b>: the <b>PC (a 32-bit register)<\/b> feeds the read address of the instruction memory → the instruction comes out. At the same time the PC goes into an <b>Add<\/b> unit, <b>+4<\/b> → the next instruction address goes back into the PC.<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p18.jpg\" aria-label=\"Enlarge\"><img src=\"img/w6-p18.jpg\" alt=\"week6 p.18 · Instruction Fetch\" loading=\"lazy\"><\/button><figcaption>week6 p.18 · Instruction Fetch<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-r-datapath\"><h3>The R-format Datapath<\/h3><p>R-format (add, sub, and, or, slt): opcode = 000000, <b>funct (5:0)<\/b> selects the operation.<\/p>\n<ol><li><b>Read two<\/b> register operands (Read register 1 = rs, Read register 2 = rt, 5 bits each)<\/li><li>Perform the arithmetic/logical operation (ALU, ALU operation 4 bits)<\/li><li><b>Write<\/b> the result to a register (Write register = rd, Write data, <b>RegWrite = 1<\/b>)<\/li><\/ol>\n<p>Example <code>add $t0, $s1, $s2<\/code> → op 0 | rs 17 | rt 18 | rd 8 | shamt 0 | funct 32.<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p20.jpg\" aria-label=\"Enlarge\"><img src=\"img/w6-p20.jpg\" alt=\"week6 p.20 · Registers and ALU\" loading=\"lazy\"><\/button><figcaption>week6 p.20 · Registers and ALU<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-ls-datapath\"><h3>The Load/Store Datapath<\/h3><ol><li>Read the register operand (rs = base)<\/li><li>Calculate the address using the 16-bit offset: use the ALU, but <b>sign-extend the offset (16 → 32)<\/b><\/li><li><b>Load<\/b>: read memory and update the register (<b>MemRead = 1, RegWrite = 1<\/b>)<\/li><li><b>Store<\/b>: write the register value to memory (<b>MemWrite = 1<\/b>)<\/li><\/ol>\n<p>Sign extension: fill the upper 16 bits with the constant's sign bit (0 for positive, 1 for negative).<\/p>\n<div class=\"callout trap\">Trap: At 23:18 in Week 6-1, while explaining lw, the professor said \"turn on the memory write field\"; that was a slip. lw uses <b>MemRead<\/b> and RegWrite; MemWrite is for sw. He corrected it right after (24:50).<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p22.jpg\" aria-label=\"Enlarge\"><img src=\"img/w6-p22.jpg\" alt=\"week6 p.22 · Data memory and Sign-extend\" loading=\"lazy\"><\/button><figcaption>week6 p.22 · Data memory and Sign-extend<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-br-datapath\"><h3>The Branch Datapath<\/h3><p>beq:<\/p>\n<ol><li>Read the register operands (rs, rt)<\/li><li><b>Subtract<\/b> with the ALU → check the <b>Zero output<\/b> (Zero = 1 if equal)<\/li><li>Calculate the target address:<ul><li><b>Sign-extend<\/b> the displacement (16 bits)<\/li><li><b>Shift left 2<\/b> (word displacement → bytes, ×4)<\/li><li>Add to <b>PC + 4<\/b> (PC + 4 was already calculated during instruction fetch)<\/li><\/ul><\/li><\/ol>\n<div class=\"callout exam\">Exam point: The branch constant is not an address but <b>how many lines (instructions) away from (PC + 4)<\/b> the target is. It is given in lines rather than bytes because a value not divisible by 4 would cause a serious error.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p23.jpg\" aria-label=\"Enlarge\"><img src=\"img/w6-p23.jpg\" alt=\"week6 p.23 · Branch datapath\" loading=\"lazy\"><\/button><figcaption>week6 p.23 · Branch datapath<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-composing\"><h3>Composing the Elements: The Four MUXes<\/h3><ul><li>The simplified datapath executes <b>one instruction in one clock cycle<\/b>.<\/li><li>Each element can do only one function at a time → <b>separate instruction memory and data memory<\/b>.<\/li><li>A MUX wherever there are two sources:<ul><li>ALU input: register vs. the instruction's immediate → <b>ALUSrc<\/b><\/li><li>Register write data: ALU output vs. data memory → <b>MemtoReg<\/b><\/li><li>Next PC: PC + 4 vs. branch target → <b>Branch AND Zero<\/b> (PCSrc)<\/li><li>Write register number: <b>Rt vs Rd<\/b> → <b>RegDst<\/b><\/li><\/ul><\/li><\/ul><\/section>"}, {"id": "L4-4", "title": "전체 데이터패스 따라가기 (R-type · lw · sw · beq)", "src": "week6 p.3, p.26, p.34–37", "exam": "신호값·MUX 숫자", "secs": [{"id": "dp-fields", "title": "명령어 필드가 가는 곳", "title_en": "Where the Instruction Fields Go"}, {"id": "dp-rtype", "title": "R-type (add $t0, $s1, $s2)", "title_en": "R-type (add $t0, $s1, $s2)"}, {"id": "dp-lw", "title": "lw ($t0, offset($s1))", "title_en": "lw ($t0, offset($s1))"}, {"id": "dp-sw", "title": "sw ($t0, offset($s1))", "title_en": "sw ($t0, offset($s1))"}, {"id": "dp-beq", "title": "beq (rs, rt, offset)", "title_en": "beq (rs, rt, offset)"}, {"id": "mux-trap", "title": "MUX 숫자 함정 (p.3 MemtoReg)", "title_en": "The MUX Number Trap (p.3 MemtoReg)"}, {"id": "branch-calc", "title": "분기 오프셋 계산 (판서 예제)", "title_en": "Branch Offset Calculation (board example)"}], "md": "## 명령어 필드가 가는 곳 {#dp-fields}\n\np.3 그림에서 32-bit 명령어가 쪼개지는 곳:\n\n| 필드 | 비트 | 가는 곳 |\n|---|---|---|\n| opcode | [31–26] | **Control** |\n| rs | [25–21] | Read register 1 (항상 읽음) |\n| rt | [20–16] | Read register 2 **그리고** RegDst MUX의 0번 입력 |\n| rd | [15–11] | RegDst MUX의 1번 입력 |\n| imm | [15–0] | **Sign-extend** (16 → 32) |\n| funct | [5–0] | **ALU control** |\n\n## R-type (add $t0, $s1, $s2) {#dp-rtype}\n\n- opcode 000000 → Control이 R-type 신호를 냄.\n- rs, rt 읽기 → ALU의 두 입력 모두 **레지스터** → **ALUSrc = 0**.\n- 결과를 **rd(세 번째 레지스터)**에 씀 → RegDst MUX에서 [15–11]을 고름 → **RegDst = 1** (p.3에선 1번 입력이 rd).\n- 쓰기 데이터는 **ALU 결과** → **MemtoReg = 0**. **RegWrite = 1**.\n- 메모리 접근 없음 → MemRead = MemWrite = 0. Branch = 0. ALUOp = 10 (funct가 연산 결정).\n\n## lw ($t0, offset($s1)) {#dp-lw}\n\n- rs = base 읽기, 상수 offset을 sign-extend → ALU 두 번째 입력은 **상수** → **ALUSrc = 1**.\n- ALU는 **덧셈**으로 주소 계산 (ALUOp = 00). ALU 결과는 값이 아니라 **주소**.\n- Data memory 읽기 → **MemRead = 1**.\n- 읽은 값을 레지스터에 → **MemtoReg = 1**, **RegWrite = 1**.\n- 쓰는 레지스터는 **rt(두 번째)** → **RegDst = 0**.\n\n## sw ($t0, offset($s1)) {#dp-sw}\n\n- 주소 계산은 lw와 같음 → **ALUSrc = 1**, ALUOp = 00.\n- rt의 값(Read data 2)이 data memory의 **Write data**로 → **MemWrite = 1**.\n- 레지스터에 쓰지 않음 → **RegWrite = 0**, 그래서 RegDst와 MemtoReg는 **X (don't care)**.\n\n## beq (rs, rt, offset) {#dp-beq}\n\n- opcode → Control이 **Branch = 1**.\n- 두 레지스터를 **빼서** 비교 → ALU 입력 둘 다 레지스터 → **ALUSrc = 0**, ALUOp = 01 (빼기).\n- 같으면 ALU **Zero = 1** → **AND(Branch, Zero) = 1** → PC MUX가 **branch target(1번)** 선택. 다르면 0 → **PC + 4(0번)**.\n- 분기 대상: offset sign-extend → shift left 2 → (PC + 4)에 더함.\n- 레지스터 쓰기 없음 → RegWrite = 0, RegDst = X, MemtoReg = X. 메모리 접근 없음.\n\n## MUX 숫자 함정 (p.3 MemtoReg) {#mux-trap}\n\np.3 그림의 MUX 3개는 **0이 위**인데, 맨 오른쪽 **MemtoReg MUX는 1이 위**(Read data), **0이 아래**(ALU result).\n\n- 교수님 설명: \"ALU 결과를 고르려면 0, data memory 값을 고르려면 1\" → 그림 숫자와 일치. 위/아래가 아니라 **숫자**를 봐야 함.\n- 교수님: \"if I flip the numbers on your multiplexer … you will have to generate a total opposite signal\". 시험 그림에서 숫자가 바뀌면 답도 바뀜.\n\n> 시험 포인트: MUX 문제를 풀 땐 ① 원하는 입력선 찾기 ② 그 선에 적힌 숫자 = 신호값. 표를 외워서 쓰지 말 것.\n\n## 분기 오프셋 계산 (판서 예제) {#branch-calc}\n\n**Offset = (Target − (PC + 4)) / 4**, **Target = (PC + 4) + Offset × 4**\n\n6주-2 판서: PC = 108 → PC + 4 = 112, 목표 = 124\n```\n(124 − 112) / 4 = 3          → beq rs, rt, 3\n3 (16-bit) → sign-extend → 0000 … 0011 (32-bit)\nshift left 2 → 12\n112 + 12 = 124  ✓\n```\n6주-1 판서: 100번지의 beq, 목표 180 → (180 − 104) / 4 = 76 / 4 = **19**.\n\n- 목표가 위쪽(이전 코드)이면 **음수 오프셋** → sign extension으로 위 비트가 1로 채워짐.", "html": "<section class=\"sec\" id=\"s-dp-fields\"><h3>명령어 필드가 가는 곳<\/h3><p>p.3 그림에서 32-bit 명령어가 쪼개지는 곳:<\/p>\n<div class=\"tblw\"><table><thead><tr><th>필드<\/th><th>비트<\/th><th>가는 곳<\/th><\/tr><\/thead><tbody><tr><td>opcode<\/td><td>[31–26]<\/td><td><b>Control<\/b><\/td><\/tr><tr><td>rs<\/td><td>[25–21]<\/td><td>Read register 1 (항상 읽음)<\/td><\/tr><tr><td>rt<\/td><td>[20–16]<\/td><td>Read register 2 <b>그리고<\/b> RegDst MUX의 0번 입력<\/td><\/tr><tr><td>rd<\/td><td>[15–11]<\/td><td>RegDst MUX의 1번 입력<\/td><\/tr><tr><td>imm<\/td><td>[15–0]<\/td><td><b>Sign-extend<\/b> (16 → 32)<\/td><\/tr><tr><td>funct<\/td><td>[5–0]<\/td><td><b>ALU control<\/b><\/td><\/tr><\/tbody><\/table><\/div><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-1:2\">▶ 06주-1 4:17 opcode 6비트가 Control로<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:1\">▶ 06주-2 5:52 오늘 목표: 이 슬라이드 한 장 완벽히<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:3\">▶ 06주-2 8:25 Fetch → opcode는 Control로<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:4\">▶ 06주-2 9:58 예: R-type add의 필드<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:5\">▶ 06주-2 11:18 rs는 Read register 1, rt·rd는 MUX로<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:23\">▶ 06주-2 28:08 빠른 복습: 컴포넌트 하나씩<\/button><\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w6-p03.jpg\" aria-label=\"크게 보기\"><img src=\"img/w6-p03.jpg\" alt=\"week6 p.3 · A Simplified Version of CPU (교수님이 &#x27;이 한 장을 완벽히&#x27; 이해하라고 한 슬라이드)\" loading=\"lazy\"><\/button><figcaption>week6 p.3 · A Simplified Version of CPU (교수님이 &#x27;이 한 장을 완벽히&#x27; 이해하라고 한 슬라이드)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-dp-rtype\"><h3>R-type (add $t0, $s1, $s2)<\/h3><ul><li>opcode 000000 → Control이 R-type 신호를 냄.<\/li><li>rs, rt 읽기 → ALU의 두 입력 모두 <b>레지스터<\/b> → <b>ALUSrc = 0<\/b>.<\/li><li>결과를 <b>rd(세 번째 레지스터)<\/b>에 씀 → RegDst MUX에서 [15–11]을 고름 → <b>RegDst = 1<\/b> (p.3에선 1번 입력이 rd).<\/li><li>쓰기 데이터는 <b>ALU 결과<\/b> → <b>MemtoReg = 0<\/b>. <b>RegWrite = 1<\/b>.<\/li><li>메모리 접근 없음 → MemRead = MemWrite = 0. Branch = 0. ALUOp = 10 (funct가 연산 결정).<\/li><\/ul><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-1:37\">▶ 06주-1 31:07 다음 주 예고<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:7\">▶ 06주-2 12:42 R-type은 RegDst = 1 (rd에 씀)<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:9\">▶ 06주-2 14:42 ALU 입력: R-type은 둘 다 레지스터<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:10\">▶ 06주-2 15:37 ALUSrc: R-type = 0<\/button><\/div><\/section>\n<section class=\"sec\" id=\"s-dp-lw\"><h3>lw ($t0, offset($s1))<\/h3><ul><li>rs = base 읽기, 상수 offset을 sign-extend → ALU 두 번째 입력은 <b>상수<\/b> → <b>ALUSrc = 1<\/b>.<\/li><li>ALU는 <b>덧셈<\/b>으로 주소 계산 (ALUOp = 00). ALU 결과는 값이 아니라 <b>주소<\/b>.<\/li><li>Data memory 읽기 → <b>MemRead = 1<\/b>.<\/li><li>읽은 값을 레지스터에 → <b>MemtoReg = 1<\/b>, <b>RegWrite = 1<\/b>.<\/li><li>쓰는 레지스터는 <b>rt(두 번째)<\/b> → <b>RegDst = 0<\/b>.<\/li><\/ul><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-1:12\">▶ 06주-1 11:07 I-format에서 ALU 결과는 주소<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:11\">▶ 06주-2 16:53 ALU 결과: R-type은 값, lw는 주소<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:13\">▶ 06주-2 18:54 R-type MemtoReg = 0, lw MemtoReg = 1<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:29\">▶ 06주-2 33:28 l
