"], "focus": [[13, 38, 60, 74]], "say": "**이 표는 외울 필요 없다. 시험에 주어진다.** 대신 표를 **읽고 회로에 적용**할 줄 알아야 한다.", "quote": "you don't have to actually memorize this table. This table will be given to you, but you will have to know how to read this table", "stitle": "p.27 ALU Control (어느 표였는지는 녹음상 추정: 바로 뒤에 ALU control 설명이 이어짐)", "img": "img/w6-p27.jpg", "paths": [], "marks": []}, {"t": "37:42", "t2": "38:43", "h": "ALU control = ALUOp(2) + funct(6)", "concept": "aluop", "focus": [[52.8, 77.5, 58.2, 88.2], [40.8, 45, 47.5, 47.2], [38.5, 88, 52, 91.5], [35.5, 35.5, 40.6, 55]], "paths": [[[47.5, 47.1], [49.9, 47.1], [49.9, 92.1], [55.4, 92.1], [55.4, 87.7]], [[38.9, 81.9], [38.9, 90.8], [51.5, 90.8], [51.5, 82.7], [52.8, 82.7]], [[57.9, 80.3], [58.9, 80.3], [58.9, 70.5]]], "say": "전체 회로에 **ALU controller**가 있다. 입력 ① Control이 opcode로 만든 **ALUOp(2비트)**, ② 아래 6비트 선(**funct**, R-type일 때). 둘을 합쳐 ALU가 어떻게 동작할지 최종 신호를 만든다.", "img": "img/w6-p03.jpg", "stitle": "p.3 A Simplified Version of CPU", "marks": [], "flags": []}, {"t": "38:43", "t2": "39:41", "h": "lw/sw: ALUOp = 00 → 더하기", "concept": "aluop", "focus": [[6, 30.5, 85, 39.1]], "say": "lw·sw면 ALUOp = **00**. I-type에는 **funct가 없다** → ALUOp가 00이면 ALU는 기본으로 **덧셈**. base address(레지스터) + 16비트 상수 offset.", "img": "img/w6-p28.jpg", "stitle": "p.28 ALU Control (ALUOp 표)", "paths": [], "marks": [], "flags": []}, {"t": "39:41", "t2": "40:35", "h": "lw offset은 반드시 상수 (여러 번 강조)", "concept": "offset-const", "flags": ["exam", "board"], "focus": [[6, 30.5, 85, 39.1]], "say": "**여러 번 강조**: lw는 I-type이라 offset은 **반드시 상수**. 시험에서 offset을 레지스터 값으로 준 문장이 나오면 **틀린 문장**. 레지스터에 든 offset을 쓰려면 먼저 base에 더해 두고 **상수 0**을 offset으로.", "quote": "you can never just provide your offset which is contained inside the register directly into an I-type instruction", "board": "lw $t0, $t2($t1)   ✗\nadd $t1, $t1, $t2\nlw  $t0, 0($t1)    ✓", "img": "img/w6-p28.jpg", "stitle": "p.28 ALU Control (ALUOp 표)", "paths": [], "marks": []}, {"t": "40:35", "t2": "41:29", "h": "beq: ALUOp = 01 → 빼기", "concept": "aluop", "focus": [[6, 40.5, 85, 44]], "say": "beq는 ALUOp = **01**로 ALU가 **빼기**를 하게 함. beq도 I-type이라 funct 없음 → 디코더가 01을 읽자마자 빼기. 같으면 결과 0.", "img": "img/w6-p28.jpg", "stitle": "p.28 ALU Control (ALUOp 표)", "paths": [], "marks": [], "flags": []}, {"t": "41:29", "t2": "42:08", "h": "R-type: ALUOp = 10 → funct가 결정", "concept": "aluop", "focus": [[6, 45.5, 85, 68.5]], "say": "R-type은 ALUOp = **10**. 디코더가 10을 읽으면 **남은 6비트 funct를 기다렸다가** 동작 결정. add면 funct = **32**(100000).", "img": "img/w6-p28.jpg", "stitle": "p.28 ALU Control (ALUOp 표)", "paths": [], "marks": [], "flags": []}, {"t": "42:08", "t2": "42:22", "h": "funct 앞 두 비트 '10' = ALUOp '10'", "concept": "aluop", "flags": ["exam"], "focus": [[25.5, 25.5, 33.5, 67], [49.5, 25.5, 59, 67]], "marks": [{"x": 54, "y": 74, "text": "10|0000  10|0010  10|0100 …", "c": "sig", "ax": 54, "ay": 48}], "say": "참고로 헷갈리지 말라고: R-type funct들은 **앞 두 비트가 모두 10**이라서 R-type의 ALUOp(10)와 같아 보인다. 둘은 다른 신호.", "note": "녹음은 'the first two bits of the functional code is actually unified to the ALU operation code'. 표를 보면 R-type funct가 전부 10으로 시작한다는 뜻.", "img": "img/w6-p29.jpg", "stitle": "p.29 ALU Control (input/output)", "paths": []}, {"t": "42:22", "t2": "42:50", "h": "명령어 수준에서 본 R-type · Load · Branch", "concept": "main-control", "focus": [[6, 23, 88, 82]], "say": "R-type, load, branch가 **명령어 수준**에서 어떻게 생겼는지의 직접 예시. 아래 상자: opcode → Control, rs는 항상 읽음, rt는 읽음(load는 예외), rd는 R-type의 쓰기 대상, address는 sign extend 후 더함.", "img": "img/w6-p31.jpg", "stitle": "p.31 The Main Control Unit", "paths": [], "marks": [], "flags": []}, {"t": "42:50", "t2": "43:05", "h": "형식별 제어 신호 표 · 여기까지 중간 범위", "concept": "control-table", "flags": ["exam"], "focus": [[9.1, 19.6, 83.1, 79]], "say": "**각 형식별 상세 제어 신호**. 그리고 **여기까지가 중간고사 범위**.", "quote": "up to here will be your midterm", "img": "img/w6-p32.jpg", "stitle": "p.32 Control (신호 표)", "paths": [], "marks": []}, {"t": "43:05", "t2": "43:35", "h": "오피스 아워", "concept": "control-table", "say": "  형식 예고: 명령어·설명을 주고 빈칸/MIPS 표현 채우기 (05주-1).", "ALU control 표 같은 표는 시험에 주어짐. 읽고 회로에 적용할 줄 알면 됨 (06주-2).", "10/14(수) 수업에서 시험 유형 안내 예정 → 녹음 들어오면 모의고사 구성 갱신."], "homeNotes": ["교안 week1–6 전부 + 수업 녹음 전사 10개 기반. 교수님이 든 예시·강조는 각 섹션의 **수업 메모** 박스에 넣었어.", "6주(데이터패스)는 **수업 따라가기** 탭에서 녹음 타임스탬프별로 슬라이드의 해당 부분만 밝혀서 볼 수 있어. 판서·말실수도 표시.", "계산 문제 정답(곱셈·나눗셈 단계표, IEEE 754, 인코딩, ALU control)은 전부 코드로 검산한 값.", "교안 오타 3개: week3 p.21 부호 확장 예, week6 p.30 K-map 식(NOT 누락), week3 p.47 fact의 `return f`.", "03주-2(9/21)는 결석으로 녹음 없음, 05주-2는 대체공휴일."]}</script>
<script>
(() => {
const DATA = JSON.parse(document.getElementById("pl-data").textContent);
const UNITS = DATA.units;
const LESSONS = UNITS.flatMap(u => u.lessons.map(l => ({ ...l, unit:u.id, unitTitle:u.title, unitTitle_en:u.title_en })));
const LES = Object.fromEntries(LESSONS.map(l => [l.id, l]));
const SEC = {};  // concept id -> {id,title,lesson}
for (const l of LESSONS) for (const s of l.secs) SEC[s.id] = { ...s, lesson:l.id };
const TYPE = { mc:"객관식", ox:"OX", blank:"빈칸", short:"서술", calc:"풀이", sig:"제어신호" };
const PASS = 0.7;
const WEIGHT = DATA.weights || {};
const wOf = c => WEIGHT[c] || 2;
const QUICK = t => t === "mc" || t === "ox" || t === "blank" || t === "sig";
const EXAM_DAY = new Date(2026, 9, 20);
const MOCK = DATA.mock || { mins:120, slots:[] };
const MOCK_MIN = MOCK.mins;
const BOOT = Date.now();  // 이 페이지를 연 시각: quiz.start가 없는 예전 퀴즈는 이 시각 이전 기록만 자동 통과
const SLOT_PTS = Object.fromEntries(MOCK.slots.map(x => [x.slot, x.pts]));
const SIGS = ["RegDst","ALUSrc","MemtoReg","RegWrite","MemRead","MemWrite","Branch","ALUOp1","ALUOp0"];

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let LANG = "ko"; try { LANG = JSON.parse(localStorage.getItem("ca-lang")) || "ko"; } catch {}
function syncLang(){ document.querySelectorAll("[data-lang]").forEach(b => { b.classList.toggle("on", b.dataset.lang === LANG); b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)); }); document.documentElement.lang = LANG; }
setTimeout(syncLang, 0);
const T = (o, k) => (!o ? "" : (LANG === "en" && o[k + "_en"] != null) ? o[k + "_en"] : (o[k] ?? ""));  // 학습 탭 한/영
const ls = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const md1 = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const norm = s => String(s ?? "").toLowerCase().replace(/[\s()（）.,'"“”‘’·\-_]/g, "");

let extra = [], attempts = [], progress = {};
let db = null, sample = null;
let view = ls.get("ca-view", "learn");
let L = ls.get("ca-learn", { lesson:null, mode:"home", quiz:null, review:null });  // learn state
let filters = ls.get("ca-filters", { unit:"", concept:"", type:"", status:"" });
let curId = ls.get("ca-cur", null);
let mock = ls.get("ca-mock", null);
const results = {};   // practice: qid -> result
const saveL = () => ls.set("ca-learn", L);

/* ── derived ───────────────────────── */
const allQ = () => DATA.questions.concat(extra);
const qById = id => allQ().find(q => q.id === id);
function latestBy(key){
  const m = {};
  for (const a of attempts){ const k = a[key]; if (k && (!m[k] || a.at > m[k].at)) m[k] = a; }
  return m;
}
const latestQ = () => latestBy("qid");
const latestC = () => latestBy("concept");
function level(score){ if (score == null) return "none"; return score >= .85 ? "good" : score >= PASS ? "mid" : "weak"; }
const LV = { none:"미시도", weak:"약점", mid:"보통", good:"숙달" };
const lessonConcepts = lid => LES[lid].secs.filter(s => allQ().some(q => q.concept === s.id)).map(s => s.id);
const lessonDone = lid => !!progress[lid]?.done;
// 잠금 없음: 어느 레슨이든 바로 읽고 점검할 수 있음 (완료 표시는 점검 통과로만)
function lessonUnlocked(lid){ return true; }
function lessonWeak(lid){ const lc = latestC(); return lessonConcepts(lid).filter(c => lc[c] && lc[c].score < PASS); }
function nextLesson(){ return LESSONS.find(l => !lessonDone(l.id)) || null; }
function srcOf(concept){ const s = SEC[concept]; if (!s) return ""; const l = LES[s.lesson]; return `${l.id} §${T(s,"title")} · ${l.src}`; }

/* ── storage ───────────────────────── */
function setStoreChip(){ const el = $("#store"); el.textContent = db ? "기록 저장: 클라우드" : "기록 저장: 이 브라우저만"; el.className = "chip " + (db ? "live" : "local"); }
function setGraderChip(){ $("#grader").textContent = sample ? "채점: Claude + 자동/자가" : "채점: 자동 + 자가채점"; }
function toastErr(msg){ const el = document.createElement("div"); el.className = "err"; el.textContent = msg; $("main").prepend(el); setTimeout(()=>el.remove(), 6000); }
async function saveAttempt(a){
  a.at = Date.now(); a.answer = String(a.answer || "").slice(0, 6000);
  const q = qById(a.qid); a.concept = q?.concept || ""; a.lesson = q?.lesson || "";
  const id = a.at + "-" + Math.random().toString(36).slice(2,8);
  if (db){
    try { await db.collection("attempts").doc(id).set(a); if (!attempts.find(x => x._id === id)) attempts.push({ ...a, _id:id }); return id; }
    catch(e){ toastErr("기록을 클라우드에 저장하지 못했어 (" + (e.code||"error") + "). 이 브라우저에만 남겨둘게."); }
  }
  const loc = ls.get("ca-attempts", []); loc.push({ ...a, _id:id }); ls.set("ca-attempts", loc);
  attempts.push({ ...a, _id:id }); return id;
}
async function updateAttempt(id, patch){
  const j = attempts.findIndex(x => x._id === id); if (j >= 0) Object.assign(attempts[j], patch);
  if (db){ try { await db.collection("attempts").doc(id).update(patch); return; } catch {} }
  const loc = ls.get("ca-attempts", []); const i = loc.findIndex(x => x._id === id);
  if (i >= 0){ Object.assign(loc[i], patch); ls.set("ca-attempts", loc); }
}
async function saveProgress(lid, passedPatch){
  const prev = progress[lid] || {};
  const passed = { ...(prev.passed || {}), ...passedPatch };
  const done = prev.done || lessonConcepts(lid).every(c => passed[c]);
  progress[lid] = { ...prev, passed, done, at:Date.now() };
  const loc = ls.get("ca-progress", {}); loc[lid] = progress[lid]; ls.set("ca-progress", loc);
  if (db){ try { await db.collection("progress").doc(lid).set(progress[lid]); } catch {} }
}

/* ── grading ───────────────────────── */
function autoGrade(q, ans){
  if (q.type === "mc"){ const ok = Number(ans) === q.answer; return { score: ok ? 1 : 0, feedback: ok ? "정답!" : `정답은 ${q.answer+1}번.` }; }
  if (q.type === "ox"){ const ok = ans === q.answer; return { score: ok ? 1 : 0, feedback: ok ? "정답!" : `정답은 ${q.answer ? "O" : "X"}.` }; }
  if (q.type === "blank"){
    const arr = Array.isArray(ans) ? ans : [];
    let hit = 0; const missed = [];
    q.accept.forEach((alts, i) => {
      const v = norm(arr[i]);
      if (v && alts.some(a => norm(a) === v)) hit++; else missed.push(`(${String.fromCharCode(97+i)}) 정답: ${alts[0]}`);
    });
    const score = hit / q.accept.length;
    return { score, missed, feedback: score === 1 ? "빈칸 전부 맞았어." : `${q.accept.length}칸 중 ${hit}칸 맞음. 표현이 달라서 틀린 거면 아래 버튼으로 고쳐.` };
  }
  if (q.type === "sig"){
    const d = ans && typeof ans === "object" ? ans : {};
    const keys = Object.keys(q.sig); let hit = 0; const missed = [];
    for (const k of keys){ const v = String(d[k] ?? "").toUpperCase(); if (v === String(q.sig[k])) hit++; else missed.push(`${k}: ${q.sig[k]} (내 답 ${v || "빈칸"})`); }
    const score = hit / keys.length;
    return { score, missed, feedback: score === 1 ? "신호 전부 맞았어." : `${keys.length}개 중 ${hit}개 맞음. 틀린 신호는 아래에.` };
  }
  return null;
}
function gradingPrompt(q, ans){
  return `You grade one answer from a Computer Architecture midterm (컴퓨터구조, Chung-Ang University, Prof. Bumsoo Kim; MIPS, Patterson & Hennessy style slides). The real exam is written and answered in English.

Grade the student's answer against the model answer and key points.
- Accept synonyms and equivalent forms (e.g. 0x00AF = 0000 0000 1010 1111; "1.2 times faster" = "performance ratio 1.2"; register names vs numbers when unambiguous).
- Short answer: credit each key point proportionally. Brevity is fine. If written in Korean, grade the content but cap the score at 0.85 and mention in feedback that the exam needs English.
- Calculations (CPU time, CPI, Amdahl, MIPS rating, binary/hex, 2's complement, sign extension, instruction encoding, multiply/divide hardware steps, IEEE 754, branch offsets): check each step; give partial credit for correct method with arithmetic slips; a wrong final value loses the final-answer part.
- MIPS code: only the instruction subset taught in class; lw/sw offsets must be constants (a register used as an offset is wrong); copying a register uses add rd, rs, $zero; stack save/restore order must match. Equivalent correct code is fine.
- Datapath/control: a signal value must match the model answer; X (don't care) in the model answer accepts X.
- An empty or "모르겠다"-style answer scores 0.

Question type: ${q.type}
Question: ${q.prompt}${q.prompt_en ? "\n(English version) " + q.prompt_en : ""}
${q.code ? "Code/table given:\\n" + q.code + "\\n" : ""}
Model answer:
${q.answer}${q.answer_en ? "\n(English version) " + q.answer_en : ""}
${q.keys ? "Key points: " + q.keys.join(" | ") + (q.keys_en ? " || (English) " + q.keys_en.join(" | ") : "") + "\\n" : ""}${q.explain ? "Note: " + q.explain + "\\n" : ""}
Student answer:
<<<
${ans}
>>>

Reply with only this JSON:
{"score": <number 0..1>, "verdict": "correct" | "partial" | "wrong", "feedback": "<Korean, casual 반말, 1-3 sentences, concrete: what was right/wrong>", "missed": ["<short Korean item the student missed or got wrong>", ...]}`;
}
async function claudeGrade(q, ans){
  const r = await sample.json(gradingPrompt(q, ans), { modelTier: q.type === "calc" ? "default" : "quick" });
  let score = Number(r?.score); if (!isFinite(score)) score = 0; score = Math.max(0, Math.min(1, score));
  return { score, feedback:String(r?.feedback || ""), missed: Array.isArray(r?.missed) ? r.missed.map(String).slice(0,6) : [] };
}
function sampleErrMsg(e){

  return "채점에 실패했어 (" + (c || "error") + "). 자가채점으로 기록할 수 있어.";
}

function rankQs(list){
  const lq = latestQ();
  return list.map(q => ({ q, k: attempts.filter(a => a.qid === q.id).length * 10 + (lq[q.id] ? lq[q.id].score * 3 : 0) + Math.random() * 2 }))
    .sort((a,b) => a.k - b.k).map(x => x.q);
}
// n questions for one concept: one written (short/calc) when n >= 2 and available, rest quick; quick ones first
function pickN(concept, n, avoid){
  const cand = allQ().filter(q => q.concept === concept);
  let pool = cand.filter(q => !avoid.has(q.id)); if (pool.length < n) pool = pool.concat(rankQs(cand.filter(q => avoid.has(q.id))));
  const quick = rankQs(pool.filter(q => QUICK(q.type))), written = rankQs(pool.filter(q => !QUICK(q.type)));
  let out = [];
  if (n === 1) out = rankQs(pool).slice(0, 1);
  else {
    const w = written.length ? 1 : 0;
    out = quick.slice(0, n - w).concat(written.slice(0, w));
    for (const q of rankQs(pool)) if (out.length < n && !out.includes(q)) out.push(q);
  }
  out = [...new Set(out)].slice(0, n);
  return out.filter(q => QUICK(q.type)).concat(out.filter(q => !QUICK(q.type)));
}
function quizCount(concepts){ return concepts.reduce((s,c) => s + Math.min(wOf(c), allQ().filter(q => q.concept === c).length), 0); }
function startQuiz(lid, concepts, round){

  const items = [];
  for (const c of concepts) for (const q of pickN(c, wOf(c), used)){ used.add(q.id); items.push({ qid:q.id, concept:c }); }
  L.quiz = { lessonId:lid, round, items, idx:0, res:{}, drafts:{}, used:[...used], start:Date.now() };
  L.mode = "quiz"; L.lesson = lid; saveL(); renderLearn(); window.scrollTo({ top:0 });
}

}
function prevBadge(qid, exclude){
  const prev = attempts.filter(a => a.qid === qid && a._id !== exclude).sort((a,b) => b.at - a.at);
  if (!prev.length) return "";
  const p = prev[0], ok = p.score >= PASS;

// 전에 맞힌 문제는 다시 풀지 않고 통과로 채워 둔다 (퀴즈 시작 전 기록만: 방금 낸 답이 db 스냅샷으로 먼저 들어와도 건너뛰지 않게)
function autoCarry(z){
  const lq = latestQ();
  for (const it of z.items){
    if (z.res[it.qid]) continue;
    const l = lq[it.qid];
    if (l && l.score >= PASS && l.at < (z.start || BOOT)) z.res[it.qid] = { score:l.score, carried:true, feedback:"전에 맞힌 문제라 통과로 처리했어." };
  }
}
function nextOpen(z, from){
  for (let i = from; i < z.items.length; i++){ const r = z.res[z.items[i].qid]; if (!r || !r.carried) return i; }

function recommendations(n){
  const lq = latestQ();
  const studied = lid => lessonDone(lid) || attempts.some(a => a.lesson === lid);
  return allQ().map(q => {
    const l = lq[q.id];
    if (l && l.score >= .85) return null;
    const need = l ? 1 - l.score : 1.1;
    const s = need * (1 + wOf(q.concept)) * (q.slot ? 1.6 : 1) * (studied(q.lesson) ? 1 : .25) * (0.9 + Math.random() * 0.2);
    return { q, s };
  }).filter(Boolean).sort((a,b) => b.s - a.s).slice(0, n).map(x => x.q);
}

function filteredQs(){
  const lq = latestQ();
  return allQ().filter(q => {
    if (filters.lesson && q.lesson !== filters.lesson) return false;
    if (filters.unit && q.unit !== filters.unit) return false;
    if (filters.concept && q.concept !== filters.concept) return false;
    if (filters.type && q.type !== filters.type) return false;
    const l = lq[q.id];
    if (filters.status === "new" && l) return false;
    if (filters.status === "wrong" && !(l && l.score < PASS)) return false;
    if (filters.status === "notgood" && l && l.score >= .85) return false;
    if (filters.status === "exam" && !q.slot) return false;
    return true;
  });
}

    c.sort((a,b) => (lq[a.id] ? 1 : 0) - (lq[b.id] ? 1 : 0) || Math.random() - .5);

    if (key.startsWith("p-")){ ls.set("ca-draft-" + key.slice(2), v); return renderPractice(); }
    if (key.startsWith("m")){ const i = Number(key.slice(1)); mock.answers[mock.items[i].qid] = v; ls.set("ca-mock", mock);
      t.parentElement.querySelectorAll(".choice").forEach(b => b.classList.toggle("sel", b === t)); return; }
  }
  if (ds.submit){ t.disabled = true; return quizSubmit(ds.submit); }
  if (ds.reveal){ const z = L.quiz; const it = z.items[z.idx]; const q = qById(it.qid); z.drafts[it.qid] = readDraft(q, ds.reveal); z.res[it.qid] = { score:null }; saveL(); return renderLearn(); }
  if (ds.skipq){ const z = L.quiz; const it = z.items[z.idx]; const q = qById(it.qid);
    const id = await saveAttempt({ qid:q.id, score:0, grader:"self", answer:"(모르겠음)", feedback:"", missed:[], mode:"check" });
    z.res[it.qid] = { score:0, feedback:"모른다고 표시했어. 모범답안 보고, 결과 화면에서 교안 위치로 가자.", attemptId:id }; saveL(); return renderLearn(); }
  if (ds.self != null){ const k = ds.k; if (k.startsWith("z")) return quizSelf(Number(ds.self)); if (k.startsWith("p-")) return practiceSelf(k.slice(2), Number(ds.self)); }
  if (ds.regrade){ const k = ds.regrade;
    if (k.startsWith("z")){ const z = L.quiz; const it = z.items[z.idx]; const q = qById(it.qid); const r0 = z.res[it.qid];
      t.disabled = true; try { const r = await claudeGrade(q, answerText(q, z.drafts[it.qid])); if (r0.attemptId) await updateAttempt(r0.attemptId, { score:r.score, grader:"claude" }); z.res[it.qid] = { ...r0, ...r, grader:"claude" }; } catch(err){ z.res[it.qid] = { ...r0, error:sampleErrMsg(err) }; }
      saveL(); return renderLearn(); }
    if (k.startsWith("p-")){ const qid = k.slice(2); const q = qById(qid); const r0 = results[qid];
      t.disabled = true; try { const r = await claudeGrade(q, answerText(q, drafts[k])); if (r0.attemptId) await updateAttempt(r0.attemptId, { score:r.score, grader:"claude" }); results[qid] = { ...r0, ...r, grader:"claude" }; } catch(err){ results[qid] = { ...r0, error:sampleErrMsg(err) }; }
      return renderPractice(); } }
  if (ds.qnext){ const z = L.quiz; const j = nextOpen(z, z.idx + 1); if (j >= 0){ z.idx = j; saveL(); renderLearn(); window.scrollTo({ top:0 }); } else quizFinish(); return; }
  if (ds.q && (t.classList.contains("qrow") || t.classList.contains("ghost"))){ curId = ds.q; ls.set("ca-cur", curId); return renderPractice(); }
  if (ds.go){ curId = ds.go; ls.set("ca-cur", curId); const q = qById(curId); if (q && !filteredQs().find(x => x.id === curId)){ filters = { unit:"", concept:"", type:"", status:"" }; ls.set("ca-filters", filters); } return show("practice"); }
  if (ds.psubmit){ t.disabled = true; return practiceSubmit(ds.psubmit); }
  if (ds.preveal){ const q = qById(ds.preveal); drafts["p-"+q.id] = readDraft(q, "p-"+q.id); results[q.id] = { score:null }; return renderPractice(); }
  if (ds.pretry){ delete results[ds.pretry]; drafts["p-"+ds.pretry] = undefined; return renderPractice(); }
  if (ds.mockstart){ mock = buildMock(); ls.set("ca-mock", mock); Object.keys(drafts).filter(k => /^m\d/.test(k)).forEach(k => delete drafts[k]); return renderMock(); }
  if (ds.mocksubmit) return submitMock();
  if (ds.mockexit){ mock = null; ls.set("ca-mock", null); clearInterval(timerHandle); Object.keys(drafts).filter(k => /^m\d/.test(k)).forEach(k => delete drafts[k]); return renderMock(); }
});
document.addEventListener("input", e => {
  const t = e.target; const k = t.dataset.k; if (!k) return;
  if (k.startsWith("p-")){ const q = qById(k.slice(2)); if (q){ drafts[k] = readDraft(q, k); ls.set("ca-draft-" + q.id, drafts[k]); } }
  else if (k.startsWith("z") && L.quiz){ const z = L.quiz; const q = qById(z.items[z.idx].qid); z.drafts[q.id] = readDraft(q, k); saveL(); }
  else if (k.startsWith("m") && mock){ const i = Number(k.slice(1)); const q = qById(mock.items[i].qid); mock.answers[q.id] = readDraft(q, k); ls.set("ca-mock", mock); }
});
document.addEventListener("change", e => {
  if (e.target.id === "wsel"){ W.idx = Number(e.target.value); (W.pos ||= {})[W.lec] = W.idx; saveW(); return renderWalk(); }
  const t = e.target; const map = { "f-unit":"unit", "f-concept":"concept", "f-type":"type", "f-status":"status" };
  if (!map[t.id]) return; filters[map[t.id]] = t.value; filters.lesson = ""; if (t.id === "f-unit") filters.concept = "";
  ls.set("ca-filters", filters); curId = null; renderPractice();
});

/* ── boot ───────────────────────── */
async function boot(){
  attempts = ls.get("ca-attempts", []).map(a => ({ ...a, _id:a._id || "local" }));
  progress = ls.get("ca-progress", {});
  if (L.mode === "quiz" && !L.quiz) L.mode = "home";
  show(view); setStoreChip(); setGraderChip();
  if (!window.claude?.use) return;
  claude.use("sample").then(s => { sample = s; setGraderChip(); renderAll(); }).catch(() => {});
  const d = await claude.use("db").catch(() => null);
  if (!d) return;
  db = d; setStoreChip();
  db.collection("attempts").orderBy("at","desc").limit(2000).onSnapshot(snap => {
    const remote = snap.docs.map(x => ({ ...x.data(), _id:x.id }));
    const local = ls.get("ca-attempts", []).map(a => ({ ...a, _id:a._id || "local" }));
    attempts = remote.concat(local.filter(l => !remote.find(r => r._id === l._id)));
    renderAll();
  }, () => { db = null; setStoreChip(); });
  db.collection("progress").onSnapshot(snap => {
    const remote = Object.fromEntries(snap.docs.map(x => [x.id, x.data()]));
    progress = { ...ls.get("ca-progress", {}), ...remote };
    renderAll();
  }, () => {});
  db.collection("extra_questions").onSnapshot(snap => {
    extra = snap.docs.map(x => ({ id:x.id, type:"short", prompt:"", answer:"", ...x.data() }))
      .filter(q => SEC[q.concept]).map(q => ({ ...q, lesson:SEC[q.concept].lesson, unit:LES[SEC[q.concept].lesson].unit, extra:true }));
    renderAll();
  }, () => {});
}
const BK_PFX = "ca-", BK_NAME = "컴구";
/* ── 기록 백업: 내보내기(.json) / 가져오기 ─────────── 클라우드·이 브라우저 기록을 파일로 옮긴다 (Claude 앱 ↔ 로컬 html). */
function bkKey(a){ return a._id && a._id !== "local" ? a._id : a.at + "|" + a.qid; }
function bkData(){
  const out = { app:BK_PFX, name:BK_NAME, at:Date.now(), attempts:attempts.map(a => ({ ...a })), progress:{ ...progress } };
  if (typeof checks !== "undefined") out.checks = checks.map(a => ({ ...a }));
  return out;
}
function bkMsg(t, bad){ const el = document.getElementById("bk-msg"); if (el){ el.textContent = t; el.style.color = bad ? "var(--bad)" : ""; } }
async function bkExport(){
  const d = bkData(), txt = JSON.stringify(d);
  const name = `${BK_PFX}backup-${new Date().toISOString().slice(0,10)}.json`;  // 한글 파일명은 브라우저가 버리는 경우가 있어서 ASCII
  const n = `문항 기록 ${d.attempts.length}개 · 레슨 ${Object.keys(d.progress).length}개${d.checks ? ` · 점검 ${d.checks.length}개` : ""}`;
  const dl = window.claude?.use ? await claude.use("downloads").catch(() => null) : null;
  if (dl){
    try { await dl.save({ filename:name, data:txt }); return bkMsg("저장했어 (" + n + ")."); }
    catch(e){ if (e?.code === "declined") return bkMsg("저장을 취소했어."); if (e?.code === "rate_limited") return bkMsg("저장 창이 이미 열려 있어.", true); }
  }
  try {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type:"application/json" })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    bkMsg("다운로드했어 (" + n + ").");
  } catch { bkMsg("이 화면에선 파일 저장이 안 돼.", true); }
}
async function bkMergeList(name, incoming, cur){
  const have = new Set(cur.map(bkKey)); const add = incoming.filter(a => a && a.qid && !have.has(bkKey(a)));
  let cloud = 0;
  for (const a of add){
    const id = a._id && a._id !== "local" ? a._id : (a.at || Date.now()) + "-" + Math.random().toString(36).slice(2,8);
    const { _id, ...doc } = a;
    if (db){ try { await db.collection(name).doc(id).set(doc); cloud++; cur.push({ ...doc, _id:id }); continue; } catch {} }
    const loc = ls.get(BK_PFX + name, []); loc.push({ ...doc, _id:id }); ls.set(BK_PFX + name, loc); cur.push({ ...doc, _id:id });
  }
  return add.length;
}
async function bkImport(file){
  let d; try { d = JSON.parse(await file.text()); } catch { return bkMsg("JSON 파일이 아니야.", true); }
  if (d.app !== BK_PFX) return bkMsg(`다른 과목 기록이야 (${d.name || d.app || "?"}). ${BK_NAME} 기록 파일을 골라줘.`, true);
  bkMsg("가져오는 중…");
  const na = await bkMergeList("attempts", d.attempts || [], attempts);
  let nc = 0; if (typeof checks !== "undefined" && d.checks) nc = await bkMergeList("checks", d.checks, checks);
  let np = 0; const lp = ls.get(BK_PFX + "progress", {});
  for (const [lid, p] of Object.entries(d.progress || {})){
    const cur = progress[lid] || {};
    if (!p || (cur.done && !p.done)) continue;
    const merged = { ...cur, ...p, passed:{ ...(cur.passed || {}), ...(p.passed || {}) }, done:!!(cur.done || p.done) };
    if (JSON.stringify(merged) === JSON.stringify(cur)) continue;
    progress[lid] = merged; lp[lid] = merged; np++;
    if (db){ try { await db.collection("progress").doc(lid).set(merged); } catch {} }
  }
  ls.set(BK_PFX + "progress", lp);
  renderAll(true);
  bkMsg(`가져왔어: 새 문항 기록 ${na}개 · 레슨 진행 ${np}개${nc ? ` · 점검 ${nc}개` : ""}${db ? " (클라우드에도 저장)" : " (이 브라우저에 저장)"}.`);
}
function bkPanel(){
  return `<div class="sheet" id="bk" style="padding:12px 14px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center">
    <b style="margin-right:4px">기록 백업</b>
    <button class="btn sm" data-bkexp="1">기록 내보내기 (.json)</button>
    <label class="btn sm" style="cursor:pointer">기록 가져오기<input type="file" accept=".json,application/json" data-bkimp="1" hidden></label>
    <span class="note" id="bk-msg">Claude 앱 ↔ 볼트의 html 파일 사이에 기록을 옮길 때. 가져오기는 합치기라 기존 기록은 안 지워져.</span></div>`;
}
{ const _rh = renderHist; renderHist = function(...a){ const r = _rh.apply(this, a); const v = document.getElementById("v-hist"); if (v && !v.querySelector("#bk")) v.insertAdjacentHTML("afterbegin", bkPanel()); return r; }; }
document.addEventListener("click", e => { if (e.target.closest?.("[data-bkexp]")) bkExport(); });
document.addEventListener("change", e => { if (e.target.matches?.("[data-bkimp]") && e.target.files[0]){ bkImport(e.target.files[0]); e.target.value = ""; } });

boot();
})();
