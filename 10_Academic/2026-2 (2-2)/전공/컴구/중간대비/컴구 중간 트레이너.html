"prompt_en": "In which case does sign extension NOT occur in MIPS?", "explain_en": "lbu and lhu use zero extension.", "choices_en": ["The immediate of addi", "A byte loaded with lb", "The displacement (offset) of beq", "A byte loaded with lbu"]}, {"id": "2-se-3", "concept": "sign-ext", "type": "calc", "prompt": "16-bit −3 (`1111 1111 1111 1101`)을 32-bit로 확장하면? 16진수로도 쓰시오.", "answer": "1111 1111 1111 1111 1111 1111 1111 1101 = 0xFFFFFFFD", "keys": ["위 16 bit를 1로", "0xFFFFFFFD"], "lesson": "L2-3", "unit": "U2", "prompt_en": "What is 16-bit −3 (`1111 1111 1111 1101`) extended to 32 bits? Also write it in hexadecimal.", "keys_en": ["Upper 16 bits filled with 1", "0xFFFFFFFD"]}, {"id": "2-se-4", "concept": "sign-ext", "type": "ox", "prompt": "Sign extension은 값을 보존하기 위해 sign bit를 왼쪽으로 복제한다.", "answer": true, "lesson": "L2-3", "unit": "U2", "prompt_en": "Sign extension replicates the sign bit to the left to preserve the value."}, {"id": "2-se-5", "concept": "sign-ext", "type": "ox", "prompt": "교안 p.21의 예 '−2 = 1111 1110 → 1111 1111 1000 0010'은 올바른 sign extension이다.", "answer": false, "explain": "오타. 1111 1111 1111 1110이 맞음.", "lesson": "L2-3", "unit": "U2", "prompt_en": "The example on slide p.21, '−2 = 1111 1110 → 1111 1111 1000 0010', is a correct sign extension.", "explain_en": "It is a typo. The correct value is 1111 1111 1111 1110."}, {"id": "2-se-6", "concept": "sign-ext", "type": "calc", "prompt": "8-bit −6 (`1111 1010`)을 16-bit로 sign extension하면?", "answer": "1111 1111 1111 1010", "keys": ["위 8 bit를 1로", "1111 1111 1111 1010"], "lesson": "L2-3", "unit": "U2", "prompt_en": "What is 8-bit −6 (`1111 1010`) sign-extended to 16 bits?", "keys_en": ["Upper 8 bits filled with 1", "1111 1111 1111 1010"]}, {"id": "2-hx-1", "concept": "hex", "type": "calc", "prompt": "16진수 `eca8 6420`을 이진수로 바꾸시오.", "answer": "1110 1100 1010 1000 0110 0100 0010 0000", "keys": ["자리당 4 bit", "1110 1100 1010 1000 0110 0100 0010 0000"], "lesson": "L2-3", "unit": "U2", "prompt_en": "Convert the hexadecimal `eca8 6420` to binary.", "keys_en": ["4 bits per digit", "1110 1100 1010 1000 0110 0100 0010 0000"]}, {"id": "2-hx-2", "concept": "hex", "type": "mc", "prompt": "이진 `0011 1100`의 16진수는?", "choices": ["0x3A", "0x3C", "0xC3", "0x60"], "answer": 1, "lesson": "L2-3", "unit": "U2", "prompt_en": "What is binary `0011 1100` in hexadecimal?"}, {"id": "2-eb-1", "concept": "encoding-basics", "type": "mc", "prompt": "$t0, $s0, $sp의 레지스터 번호는?", "choices": ["0, 8, 31", "8, 17, 30", "8, 16, 29", "16, 8, 29"], "answer": 2, "lesson": "L2-4", "unit": "U2", "prompt_en": "What are the register numbers of $t0, $s0 and $sp?"}, {"id": "2-eb-2", "concept": "encoding-basics", "type": "blank", "prompt": "MIPS 명령어는 (a)-bit로 인코딩되고, 맨 앞 (b) bit가 opcode다.", "answer": "(a) 32 / (b) 6", "accept": [["32"], ["6"]], "lesson": "L2-4", "unit": "U2", "prompt_en": "MIPS instructions are encoded in (a) bits, and the first (b) bits are the opcode."}, {"id": "2-eb-3", "concept": "encoding-basics", "type": "mc", "prompt": "$t8, $t9의 레지스터 번호는?", "choices": ["16, 17", "8, 9", "26, 27", "24, 25"], "answer": 3, "lesson": "L2-4", "unit": "U2", "prompt_en": "What are the register numbers of $t8 and $t9?"}, {"id": "2-rf-1", "concept": "r-format", "type": "calc", "prompt": "`add $t0, $s1, $s2`를 R-format 필드(10진수)와 이진수, 16진수로 쓰시오. ($s0–$s7 = 16–23, $t0–$t7 = 8–15, $zero = 0, $sp = 29, $ra = 31, $a0–$a3 = 4–7, $v0 = 2, add의 funct = 32)", "answer": "op 0 | rs 17 | rt 18 | rd 8 | shamt 0 | funct 32\n000000 10001 10010 01000 00000 100000\n= 0x02324020", "keys": ["rs=$s1(17), rt=$s2(18), rd=$t0(8)", "순서: rs rt rd", "funct 32", "0x02324020"], "slot": 8, "pts": 6, "lesson": "L2-4", "unit": "U2", "prompt_en": "Write `add $t0, $s1, $s2` as R-format fields (decimal), in binary, and in hexadecimal. ($s0–$s7 = 16–23, $t0–$t7 = 8–15, $zero = 0, $sp = 29, $ra = 31, $a0–$a3 = 4–7, $v0 = 2, funct of add = 32)", "keys_en": ["rs=$s1(17), rt=$s2(18), rd=$t0(8)", "Order: rs rt rd", "funct 32", "0x02324020"]}, {"id": "2-rf-2", "concept": "r-format", "type": "calc", "prompt": "`sub $s0, $t0, $t1`의 기계어를 이진수와 16진수로 쓰시오. ($s0–$s7 = 16–23, $t0–$t7 = 8–15, $zero = 0, $sp = 29, $ra = 31, $a0–$a3 = 4–7, $v0 = 2, sub의 funct = 34)", "answer": "op 0 | rs 8 | rt 9 | rd 16 | shamt 0 | funct 34\n000000 01000 01001 10000 00000 100010\n= 0x01098022", "keys": ["rs=$t0(8)", "rt=$t1(9)", "rd=$s0(16)", "0x01098022"], "slot": 8, "pts": 6, "lesson": "L2-4", "unit": "U2", "prompt_en": "Write the machine code of `sub $s0, $t0, $t1` in binary and hexadecimal. ($s0–$s7 = 16–23, $t0–$t7 = 8–15, $zero = 0, $sp = 29, $ra = 31, $a0–$a3 = 4–7, $v0 = 2, funct of sub = 34)"}, {"id": "2-rf-3", "concept": "r-format", "type": "mc", "prompt": "R-format 필드의 순서로 옳은 것은?", "choices": ["op rd rs rt shamt funct", "op rs rd rt shamt funct", "op rs rt rd shamt funct", "op rt rs rd funct shamt"], "answer": 2, "lesson": "L2-4", "unit": "U2", "prompt_en": "Which is the correct order of the R-format fields?"}, {"id": "2-rf-4", "concept": "r-format", "type": "ox", "prompt": "R-format 명령어의 opcode는 항상 0이고 연산 종류는 funct가 정한다.", "answer": true, "lesson": "L2-4", "unit": "U2", "prompt_en": "The opcode of an R-format instruction is always 0, and the funct field determines the operation."}, {"id": "2-rf-5", "concept": "r-format", "type": "blank", "prompt": "어셈블리 `add rd, rs, rt`에서 destination은 맨 (a)에 오지만, 기계어에서 rd는 rs, rt (b)에 온다.", "answer": "(a) 앞 / (b) 뒤", "accept": [["앞", "처음", "첫번째", "first", "front", "beginning", "at the front"], ["뒤", "다음", "나중", "after", "뒤에", "behind", "later"]], "lesson": "L2-4", "unit": "U2", "prompt_en": "In assembly `add rd, rs, rt`, the destination comes (a), but in machine code rd comes (b) rs and rt.", "answer_en": "(a) first / (b) after"}, {"id": "2-rf-6", "concept": "r-format", "type": "calc", "prompt": "기계어 `000000 10001 10010 01000 00000 101010`을 어셈블리로 바꾸시오. (funct 42 = slt, $s0–$s7 = 16–23, $t0–$t7 = 8–15, $zero = 0, $sp = 29, $ra = 31, $a0–$a3 = 4–7, $v0 = 2)", "answer": "slt $t0, $s1, $s2", "keys": ["rs=17 → $s1", "rt=18 → $s2", "rd=8 → $t0", "slt"], "slot": 8, "pts": 6, "lesson": "L2-4", "unit": "U2", "prompt_en": "Convert the machine code `000000 10001 10010 01000 00000 101010` to assembly. (funct 42 = slt, $s0–$s7 = 16–23, $t0–$t7 = 8–15, $zero = 0, $sp = 29, $ra = 31, $a0–$a3 = 4–7, $v0 = 2)"}, {"id": "2-rf-7", "concept": "r-format", "type": "calc", "prompt": "`and $t0, $t1, $t2`의 기계어를 16진수로 쓰시오. (and의 funct = 36, $s0–$s7 = 16–23, $t0–$t7 = 8–15, $zero = 0, $sp = 29, $ra = 31, $a0–$a3 = 4–7, $v0 = 2)", "answer": "000000 01001 01010 01000 00000 100100 = 0x012A4024", "keys": ["rs 9, rt 10, rd 8", "funct 100100", "0x012A4024"], "lesson": "L2-4", "unit": "U2", "prompt_en": "Write the machine code of `and $t0, $t1, $t2` in hexadecimal. (funct of and = 36, $s0–$s7 = 16–23, $t0–$t7 = 8–15, $zero = 0, $sp = 29, $ra = 31, $a0–$a3 = 4–7, $v0 = 2)"}, {"id": "2-if-1", "concept": "i-format", "type": "mc", "prompt": "I-format의 필드 구성은?", "choices": ["op(6) rs(5) rt(5) rd(5) shamt(5) funct(6)", "op(6) rs(5) rt(5) constant(16)", "op(6) address(26)", "op(6) rt(5) constant(21)"], "answer": 1, "lesson": "L2-4", "unit": "U2", "prompt_en": "What are the fields of the I-format?"}, {"id": "2-if-2", "concept": "i-format", "type": "mc", "prompt": "`lw $t0, 32($s3)`에서 rt 필드에 들어가는 레지스터는?", "choices": ["$t0 (destination)", "$s3 (base)", "32", "rt 필드는 쓰지 않음"], "answer": 0, "lesson": "L2-4", "unit": "U2", "prompt_en": "In `lw $t0, 32($s3)`, which register goes in the rt field?", "choices_en": ["$t0 (destination)", "$s3 (base)", "32", "The rt field is not used"]}, {"id": "2-if-3", "concept": "i-format", "type": "calc", "prompt": "`lw $t0, 32($s3)`의 기계어를 이진수와 16진수로 쓰시오. (lw opcode = 35, $s0–$s7 = 16–23, $t0–$t7 = 8–15, $zero = 0, $sp = 29, $ra = 31, $a0–$a3 = 4–7, $v0 = 2)", "answer": "op 35 | rs 19 | rt 8 | 32\n100011 10011 01000 0000 0000 0010 0000 = 0x8E680020", "keys": ["rs = base $s3(19)", "rt = $t0(8)", "imm 32", "0x8E680020"], "slot": 8, "pts": 6, "lesson": "L2-4", "unit": "U2", "prompt_en": "Write the machine code of `lw $t0, 32($s3)` in binary and hexadecimal. (lw opcode = 35, $s0–$s7 = 16–23, $t0–$t7 = 8–15, $zero = 0, $sp = 29, $ra = 31, $a0–$a3 = 4–7, $v0 = 2)"}, {"id": "2-if-4", "concept": "i-format", "type": "blank", "prompt": "Design Principle 4: Good design demands good (a)", "answer": "(a) compromises", "accept": [["compromises", "compromise", "절충", "타협"]], "lesson": "L2-4", "unit": "U2"}, {"id": "2-if-5", "concept": "i-format", "type": "ox", "prompt": "I-format의 상수 필드는 16 bit라서 −2¹⁵ ~ 2¹⁵ − 1 범위를 표현한다.", "answer": true, "lesson": "L2-4", "unit": "U2", "prompt_en": "The constant field of the I-format is 16 bits, so it represents the range −2¹⁵ to 2¹⁵ − 1."}, {"id": "2-if-6", "concept": "i-format", "type": "calc", "prompt": "`addi $s3, $s3, -1`의 기계어를 16진수로 쓰시오. (addi opcode = 8, $s0–$s7 = 16–23, $t0–$t7 = 8–15, $zero = 0, $sp = 29, $ra = 31, $a0–$a3 = 4–7, $v0 = 2)", "answer": "001000 10011 10011 1111 1111 1111 1111 = 0x2273FFFF", "keys": ["rs = rt = 19", "−1 = 0xFFFF", "0x2273FFFF"], "lesson": "L2-4", "unit": "U2", "prompt_en": "Write the machine code of `addi $s3, $s3, -1` in hexadecimal. (addi opcode = 8, $s0–$s7 = 16–23, $t0–$t7 = 8–15, $zero = 0, $sp = 29, $ra = 31, $a0–$a3 = 4–7, $v0 = 2)"}, {"id": "2-ex-1", "concept": "encode-example", "type": "calc", "prompt": "C 코드 `A[300] = h + A[300];`을 MIPS로 쓰고 각 명령어의 필드를 10진수로 쓰시오. $t1 = A의 base address, $s2 = h. (lw = 35, sw = 43, add funct = 32)", "answer": "lw  $t0, 1200($t1)    → 35 | 9 | 8 | 1200\nadd $t0, $s2, $t0     → 0 | 18 | 8 | 8 | 0 | 32\nsw  $t0, 1200($t1)    → 43 | 9 | 8 | 1200", "keys": ["offset 300×4 = 1200", "lw 35 9 8 1200", "add 0 18 8 8 0 32", "sw 43 9 8 1200"], "slot": 8, "pts": 6, "lesson": "L2-4", "unit": "U2", "prompt_en": "Write the C code `A[300] = h + A[300];` in MIPS, and write the fields of each instruction in decimal. $t1 = base address of A, $s2 = h. (lw = 35, sw = 43, add funct = 32)"}, {"id": "2-ex-2", "concept": "encode-example", "type": "mc", "prompt": "A[300]의 byte offset은? (int 배열)", "choices": ["300", "600", "1200", "2400"], "answer": 2, "lesson": "L2-4", "unit": "U2", "prompt_en": "What is the byte offset of A[300]? (int array)"}, {"id": "2-ex-3", "concept": "encode-example", "type": "calc", "prompt": "`lw $t0, 1200($t1)`의 이진 표현을 쓰시오. ($t0 = 8, $t1 = 9)", "answer": "100011 01001 01000 0000 0100 1011 0000  (= 0x8D2804B0)", "keys": ["op 100011", "rs 01001", "rt 01000", "1200 = 0000 0100 1011 0000"], "lesson": "L2-4", "unit": "U2", "prompt_en": "Write the binary representation of `lw $t0, 1200($t1)`. ($t0 = 8, $t1 = 9)"}, {"id": "2-ex-4", "concept": "encode-example", "type": "calc", "prompt": "`sw $t0, 48($s3)`의 16진수 기계어는? (sw = 43, $t0 = 8, $s3 = 19)", "answer": "101011 10011 01000 0000 0000 0011 0000 = 0xAE680030", "keys": ["op 43", "rs 19", "rt 8", "0xAE680030"], "lesson": "L2-4", "unit": "U2", "prompt_en": "What is the hexadecimal machine code of `sw $t0, 48($s3)`? (sw = 43, $t0 = 8, $s3 = 19)"}, {"id": "2-sh-1", "concept": "shift", "type": "mc", "prompt": "`sll $t2, $s0, 4`의 효과는?", "choices": ["$s0 / 16", "$s0 + 4", "$s0 × 16", "$s0 × 4"], "answer": 2, "lesson": "L2-5", "unit": "U2", "prompt_en": "What is the effect of `sll $t2, $s0, 4`?"}, {"id": "2-sh-2", "concept": "shift", "type": "ox", "prompt": "srl은 왼쪽을 0으로 채우므로 음수(2의 보수)를 2^i로 나누는 데 그대로 쓸 수 있다.", "answer": false, "lesson": "L2-5", "unit": "U2", "prompt_en": "srl fills the left with 0s, so it can be used as-is to divide a negative (two's complement) number by 2^i."}, {"id": "2-sh-3", "concept": "shift", "type": "blank", "prompt": "R-format에서 shift할 칸 수는 (a) 필드에 들어간다.", "answer": "(a) shamt", "accept": [["shamt", "shiftamount"]], "lesson": "L2-5", "unit": "U2", "prompt_en": "In R-format, the number of positions to shift goes in the (a) field."}, {"id": "2-sh-4", "concept": "shift", "type": "calc", "prompt": "$s0 = 0000 … 0000 1001 (9)일 때 `sll $t2, $s0, 4`의 결과를 이진수와 10진수로 쓰시오.", "answer": "0000 … 1001 0000 = 144", "keys": ["왼쪽 4칸, 오른쪽 0 채움", "144"], "lesson": "L2-5", "unit": "U2", "prompt_en": "If $s0 = 0000 … 0000 1001 (9), write the result of `sll $t2, $s0, 4` in binary and decimal.", "keys_en": ["Shift left 4, fill the right with 0", "144"]}, {"id": "2-ao-1", "concept": "and-or-nor", "type": "calc", "prompt": "$t1 = 0000 0000 0000 0000 0011 1100 0000 0000, $t2 = 0000 0000 0000 0000 0000 1101 1100 0000일 때 `and $t0, $t1, $t2`와 `or $t0, $t1, $t2`의 결과는?", "answer": "and: 0000 0000 0000 0000 0000 1100 0000 0000\nor:  0000 0000 0000 0000 0011 1101 1100 0000", "keys": ["and 결과", "or 결과"], "lesson": "L2-5", "unit": "U2", "prompt_en": "If $t1 = 0000 0000 0000 0000 0011 1100 0000 0000 and $t2 = 0000 0000 0000 0000 0000 1101 1100 0000, what are the results of `and $t0, $t1, $t2` and `or $t0, $t1, $t2`?", "keys_en": ["and result", "or result"]}, {"id": "2-ao-2", "concept": "and-or-nor", "type": "mc", "prompt": "MIPS에서 $t1의 모든 비트를 반전(NOT)하는 방법은?", "choices": ["not $t0, $t1", "nor $t0, $t1, $zero", "xor $t0, $t1, $zero", "sub $t0, $zero, $t1"], "answer": 1, "lesson": "L2-5", "unit": "U2", "prompt_en": "How do you invert all bits of $t1 (NOT) in MIPS?"}, {"id": "2-ao-3", "concept": "and-or-nor", "type": "ox", "prompt": "AND는 원하는 비트만 남기고 나머지를 0으로 만드는 마스킹에 쓴다.", "answer": true, "lesson": "L2-5", "unit": "U2", "prompt_en": "AND is used for masking: keeping only the selected bits and clearing the rest to 0."}, {"id": "2-bi-1", "concept": "branch-instr", "type": "mc", "prompt": "`bne rs, rt, L1`의 동작은?", "choices": ["rs == rt면 L1로", "rs != rt면 L1로", "항상 L1로", "rs < rt면 L1로"], "answer": 1, "lesson": "L2-5", "unit": "U2", "prompt_en": "What does `bne rs, rt, L1` do?", "choices_en": ["Branch to L1 if rs == rt", "Branch to L1 if rs != rt", "Always branch to L1", "Branch to L1 if rs < rt"]}, {"id": "2-bi-2", "concept": "branch-instr", "type": "ox", "prompt": "`j L1`은 조건 없이 L1로 점프한다.", "answer": true, "lesson": "L2-5", "unit": "U2", "prompt_en": "`j L1` jumps to L1 unconditionally."}, {"id": "2-ie-1", "concept": "if-else", "type": "calc", "prompt": "`if (i == j) f = g + h; else f = g - h;`를 MIPS로 쓰시오. f, g, h, i, j = $s0, $s1, $s2, $s3, $s4.", "answer": "      bne $s3, $s4, Else\n      add $s0, $s1, $s2\n      j   Exit\nElse: sub $s0, $s1, $s2\nExit:", "keys": ["bne로 반대 조건 검사", "add $s0, $s1, $s2", "j Exit", "Else: sub", "Exit 레이블"], "slot": 9, "pts": 8, "lesson": "L2-5", "unit": "U2", "prompt_en": "Write `if (i == j) f = g + h; else f = g - h;` in MIPS. f, g, h, i, j = $s0, $s1, $s2, $s3, $s4.", "keys_en": ["Test the opposite condition with bne", "add $s0, $s1, $s2", "j Exit", "Else: sub", "Exit label"]}, {"id": "2-ie-2", "concept": "if-else", "type": "calc", "prompt": "`if (a != b) x = x + 1;`을 MIPS로 쓰시오. a, b, x = $s0, $s1, $s2.", "answer": "      beq  $s0, $s1, Skip\n      addi $s2, $s2, 1\nSkip:", "keys": ["beq로 반대 조건", "addi $s2, $s2, 1", "Skip 레이블"], "slot": 9, "pts": 8, "lesson": "L2-5", "unit": "U2", "prompt_en": "Write `if (a != b) x = x + 1;` in MIPS. a, b, x = $s0, $s1, $s2.", "keys_en": ["Opposite condition with beq", "addi $s2, $s2, 1", "Skip label"]}, {"id": "2-ie-3", "concept": "if-else", "type": "mc", "prompt": "if-else 컴파일에서 if 블록 끝에 `j Exit`가 필요한 이유는?", "choices": ["else 블록을 건너뛰려고", "루프를 반복하려고", "레지스터를 저장하려고", "함수에서 복귀하려고"], "answer": 0, "lesson": "L2-5", "unit": "U2", "prompt_en": "When compiling if-else, why is `j Exit` needed at the end of the if-block?", "choices_en": ["To skip the else-block", "To repeat the loop", "To save registers", "To return from the function"]}, {"id": "2-ie-4", "concept": "if-else", "type": "calc", "prompt": "`if (i < j) f = 1; else f = 0;`을 slt를 써서 MIPS로 쓰시오 (분기 없이 가능하면 그렇게). i, j, f = $s3, $s4, $s0.", "answer": "slt $s0, $s3, $s4", "keys": ["slt 한 줄로 끝", "rs = i, rt = j"], "lesson": "L2-5", "unit": "U2", "prompt_en": "Write `if (i < j) f = 1; else f = 0;` in MIPS using slt (without a branch if possible). i, j, f = $s3, $s4, $s0.", "keys_en": ["Done in one slt instruction", "rs = i, rt = j"]}, {"id": "2-ie-5", "concept": "if-else", "type": "calc", "prompt": "`if (x == 0) y = y - 5; else y = y + 5;`를 MIPS로 쓰시오. x, y = $s0, $s1.", "answer": "      bne  $s0, $zero, Else\n      addi $s1, $s1, -5\n      j    Exit\nElse: addi $s1, $s1, 5\nExit:", "keys": ["bne $s0, $zero", "addi -5 (subi 없음)", "j Exit", "Else: addi 5"], "slot": 9, "pts": 8, "lesson": "L2-5", "unit": "U2", "prompt_en": "Write `if (x == 0) y = y - 5; else y = y + 5;` in MIPS. x, y = $s0, $s1.", "keys_en": ["bne $s0, $zero", "addi -5 (there is no subi)", "j Exit", "Else: addi 5"]}, {"id": "2-wl-1", "concept": "while-loop", "type": "calc", "prompt": "`while (save[i] == k) i += 1;`을 MIPS로 쓰시오. i = $s3, k = $s5, save의 base = $s6.", "answer": "Loop: sll  $t1, $s3, 2\n      add  $t1, $t1, $s6\n      lw   $t0, 0($t1)\n      bne  $t0, $s5, Exit\n      addi $s3, $s3, 1\n      j    Loop\nExit:", "keys": ["sll ×4", "add base", "lw offset 0", "bne로 탈출", "addi i+1", "j Loop"], "slot": 9, "pts": 8, "lesson": "L2-5", "unit": "U2", "prompt_en": "Write `while (save[i] == k) i += 1;` in MIPS. i = $s3, k = $s5, base of save = $s6.", "keys_en": ["sll ×4", "add base", "lw offset 0", "Exit with bne", "addi i+1", "j Loop"]}, {"id": "2-wl-2", "concept": "while-loop", "type": "ox", "prompt": "while 루프에서 `lw $t0, $s3($s6)`처럼 인덱스 레지스터를 offset에 바로 쓸 수 있다.", "answer": false, "lesson": "L2-5", "unit": "U2", "prompt_en": "In a while loop, the index register can be used directly as the offset, as in `lw $t0, $s3($s6)`."}, {"id": "2-wl-3", "concept": "while-loop", "type": "calc", "prompt": "`while (A[i] != 0) i++;`을 MIPS로 쓰시오. i = $s0, A의 base = $s1 (int 배열).", "answer": "Loop: sll  $t1, $s0, 2\n      add  $t1, $t1, $s1\n      lw   $t0, 0($t1)\n      beq  $t0, $zero, Exit\n      addi $s0, $s0, 1\n      j    Loop\nExit:", "keys": ["주소 계산", "lw 0($t1)", "beq $t0, $zero, Exit", "j Loop"], "slot": 9, "pts": 8, "lesson": "L2-5", "unit": "U2", "prompt_en": "Write `while (A[i] != 0) i++;` in MIPS. i = $s0, base of A = $s1 (int array).", "keys_en": ["Address calculation", "lw 0($t1)", "beq $t0, $zero, Exit", "j Loop"]}, {"id": "2-wl-4", "concept": "while-loop", "type": "mc", "prompt": "`sll $t1, $s3, 2`를 쓰는 이유는?", "choices": ["i를 2배 하려고", "int 배열 원소가 4 byte라서 index × 4", "부호를 확장하려고", "루프를 끝내려고"], "answer": 1, "lesson": "L2-5", "unit": "U2", "prompt_en": "Why is `sll $t1, $s3, 2` used?", "choices_en": ["To double i", "Because int array elements are 4 bytes, so index × 4", "To sign-extend", "To end the loop"]}, {"id": "2-wl-5", "concept": "while-loop", "type": "calc", "prompt": "`sum = 0; for (i = 0; i < 10; i++) sum += i;`을 MIPS로 쓰시오. sum = $s0, i = $s1.", "answer": "      add  $s0, $zero, $zero\n      add  $s1, $zero, $zero\nLoop: slti $t0, $s1, 10\n      beq  $t0, $zero, Exit\n      add  $s0, $s0, $s1\n      addi $s1, $s1, 1\n      j    Loop\nExit:", "keys": ["초기화", "slti로 i<10", "beq로 탈출", "sum += i", "i++", "j Loop"], "lesson": "L2-5", "unit": "U2", "prompt_en": "Write `sum = 0; for (i = 0; i < 10; i++) sum += i;` in MIPS. sum = $s0, i = $s1.", "keys_en": ["Initialization", "i<10 with slti", "Exit with beq", "sum += i", "i++", "j Loop"]}, {"id": "2-sl-1", "concept": "slt", "type": "calc", "prompt": "$s0 = 1111 … 1111, $s1 = 0000 … 0001일 때 `slt $t0, $s0, $s1`과 `sltu $t0, $s0, $s1`의 결과는?", "answer": "slt (signed): −1 < +1 → $t0 = 1\nsltu (unsigned): 4,294,967,295 > 1 → $t0 = 0", "keys": ["slt → 1", "sltu → 0", "signed/unsigned 해석"], "lesson": "L2-5", "unit": "U2", "prompt_en": "If $s0 = 1111 … 1111 and $s1 = 0000 … 0001, what are the results of `slt $t0, $s0, $s1` and `sltu $t0, $s0, $s1`?", "keys_en": ["slt → 1", "sltu → 0", "Signed vs unsigned interpretation"]}, {"id": "2-sl-2", "concept": "slt", "type": "mc", "prompt": "`slti $t0, $a0, 1`에서 $a0 = 1이면 $t0는?", "choices": ["0", "1", "−1", "변하지 않음"], "answer": 0, "explain": "1 < 1은 거짓.", "lesson": "L2-5", "unit": "U2", "prompt_en": "In `slti $t0, $a0, 1`, if $a0 = 1, what is $t0?", "explain_en": "1 < 1 is false.", "choices_en": ["0", "1", "−1", "Unchanged"]}, {"id": "2-sl-3", "concept": "slt", "type": "calc", "prompt": "`if ($s1 < $s2) goto L;`을 MIPS 두 줄로 쓰시오.", "answer": "slt $t0, $s1, $s2\nbne $t0, $zero, L", "keys": ["slt", "bne $t0, $zero"], "lesson": "L2-5", "unit": "U2", "prompt_en": "Write `if ($s1 < $s2) goto L;` in two lines of MIPS."}, {"id": "2-sl-4", "concept": "slt", "type": "ox", "prompt": "`blt`는 MIPS의 진짜 명령어가 아니라 slt + bne로 바뀌는 pseudo-instruction이다.", "answer": true, "lesson": "L2-5", "unit": "U2", "prompt_en": "`blt` is not a real MIPS instruction but a pseudo-instruction that becomes slt + bne."}, {"id": "2-bd-1", "concept": "branch-design", "type": "short", "prompt": "MIPS가 blt, bge 같은 명령어 대신 beq, bne + slt를 쓰는 이유는? (영어로)", "answer": "Hardware for <, ≥ is slower than for =, ≠. Combining comparison with branching would do more work per instruction and require a slower clock, penalizing all instructions. beq/bne (with slt) is a good design compromise.", "keys": ["<,> 비교 하드웨어가 느림", "명령어당 일 증가 → 클럭 느려짐", "모든 명령어 손해", "beq/bne = 좋은 절충"], "slot": 2, "pts": 3, "lesson": "L2-5", "unit": "U2", "prompt_en": "Why does MIPS use beq, bne + slt instead of instructions such as blt and bge? (Answer in English.)", "keys_en": ["Hardware for <, > comparison is slower", "More work per instruction → slower clock", "All instructions are penalized", "beq/bne = a good compromise"]}, {"id": "2-bd-2", "concept": "branch-design", "type": "ox", "prompt": "blt를 하드웨어 명령어로 넣으면 그 명령어만 느려지고 다른 명령어는 영향이 없다.", "answer": false, "lesson": "L2-5", "unit": "U2", "prompt_en": "If blt were added as a hardware instruction, only that instruction would become slower and other instructions would not be affected."}, {"id": "2-jj-1", "concept": "jal-jr", "type": "mc", "prompt": "100번지의 `jal Proc`(Proc는 388번지)를 실행한 직후 $ra와 PC는?", "choices": ["$ra = 100, PC = 388", "$ra = 388, PC = 104", "$ra = 104, PC = 388", "$ra = 104, PC = 104"], "answer": 2, "lesson": "L2-6", "unit": "U2", "prompt_en": "Immediately after executing `jal Proc` at address 100 (Proc is at address 388), what are $ra and PC?"}, {"id": "2-jj-2", "concept": "jal-jr", "type": "blank", "prompt": "프로시저에서 복귀하는 명령어는 (a) $ra 이다.", "answer": "(a) jr", "accept": [["jr", "jumpregister"]], "lesson": "L2-6", "unit": "U2", "prompt_en": "The instruction that returns from a procedure is (a) $ra."}, {"id": "2-jj-3", "concept": "jal-jr", "type": "ox", "prompt": "jal은 다음 명령어의 주소(PC + 4)를 $ra에 저장한다.", "answer": true, "lesson": "L2-6", "unit": "U2", "prompt_en": "jal stores the address of the next instruction (PC + 4) in $ra."}, {"id": "2-ru-1", "concept": "reg-usage", "type": "mc", "prompt": "callee가 사용하려면 저장·복원해야 하는 레지스터는?", "choices": ["$t0–$t9", "$s0–$s7", "$a0–$a3", "$zero"], "answer": 1, "lesson": "L2-6", "unit": "U2", "prompt_en": "Which registers must the callee save and restore if it uses them?"}, {"id": "2-ru-2", "concept": "reg-usage", "type": "mc", "prompt": "MIPS 스택에서 4 byte 공간을 확보하는 명령어는?", "choices": ["addi $sp, $sp, -4", "addi $sp, $sp, 4", "subi $sp, 4", "lw $sp, 4($sp)"], "answer": 0, "lesson": "L2-6", "unit": "U2", "prompt_en": "Which instruction allocates 4 bytes of space on the MIPS stack?"}, {"id": "2-ru-3", "concept": "reg-usage", "type": "blank", "prompt": "$a0–$a3는 (a), $v0–$v1은 (b)용 레지스터다.", "answer": "(a) 인자 / (b) 결과값", "accept": [["인자", "argument", "arguments", "인수", "매개변수", "parameters", "parameter"], ["결과값", "결과", "result", "results", "returnvalue", "반환값", "result values", "return values", "result value"]], "lesson": "L2-6", "unit": "U2", "prompt_en": "$a0–$a3 are registers for (a), and $v0–$v1 are registers for (b).", "answer_en": "(a) arguments / (b) result values"}, {"id": "2-ru-4", "concept": "reg-usage", "type": "ox", "prompt": "스택은 높은 주소에서 낮은 주소 방향으로 자란다.", "answer": true, "lesson": "L2-6", "unit": "U2", "prompt_en": "The stack grows from high addresses toward low addresses."}, {"id": "2-lf-1", "concept": "leaf", "type": "calc", "prompt": "`int leaf_example(int g, h, i, j) { int f; f = (g + h) - (i + j); return f; }`를 MIPS로 쓰시오. 인자는 $a0–$a3, f는 $s0, 결과는 $v0.", "answer": "leaf_example:\n  addi $sp, $sp, -4\n  sw   $s0, 0($sp)\n  add  $t0, $a0, $a1\n  add  $t1, $a2, $a3\n  sub  $s0, $t0, $t1\n  add  $v0, $s0, $zero\n  lw   $s0, 0($sp)\n  addi $sp, $sp, 4\n  jr   $ra", "keys": ["$sp −4, sw $s0", "g+h, i+j", "sub $s0", "add $v0, $s0, $zero", "lw $s0 복원", "$sp +4", "jr $ra"], "slot": 10, "pts": 8, "lesson": "L2-6", "unit": "U2", "prompt_en": "Write `int leaf_example(int g, h, i, j) { int f; f = (g + h) - (i + j); return f; }` in MIPS. Arguments are in $a0–$a3, f is in $s0, and the result goes in $v0.", "keys_en": ["$sp −4, sw $s0", "g+h, i+j", "sub $s0", "add $v0, $s0, $zero", "Restore $s0 with lw", "$sp +4", "jr $ra"]}, {"id": "2-lf-2", "concept": "leaf", "type": "mc", "prompt": "leaf_example에서 $s0을 스택에 저장하는 이유는?", "choices": ["$s0이 인자라서", "$s0이 $ra라서", "$s0은 saved 레지스터라 callee가 원래 값을 보존해야 해서", "스택 포인터라서"], "answer": 2, "lesson": "L2-6", "unit": "U2", "prompt_en": "Why is $s0 saved on the stack in leaf_example?", "choices_en": ["Because $s0 is an argument", "Because $s0 is $ra", "Because $s0 is a saved register, so the callee must preserve its original value", "Because it is the stack pointer"]}, {"id": "2-lf-3", "concept": "leaf", "type": "ox", "prompt": "Leaf procedure는 다른 프로시저를 호출하지 않는 프로시저다.", "answer": true, "lesson": "L2-6", "unit": "U2", "prompt_en": "A leaf procedure is a procedure that does not call other procedures."}, {"id": "2-lf-4", "concept": "leaf", "type": "calc", "prompt": "`int sum3(int a, int b, int c) { return a + b + c; }`를 MIPS로 쓰시오 (saved 레지스터 사용 안 함). 인자 $a0–$a2, 결과 $v0.", "answer": "sum3:\n  add $t0, $a0, $a1\n  add $v0, $t0, $a2\n  jr  $ra", "keys": ["임시 레지스터만 사용 → 스택 불필요", "add 두 번", "jr $ra"], "lesson": "L2-6", "unit": "U2", "prompt_en": "Write `int sum3(int a, int b, int c) { return a + b + c; }` in MIPS (without using saved registers). Arguments in $a0–$a2, result in $v0.", "keys_en": ["Only temporary registers used → no stack needed", "Two adds", "jr $ra"]}, {"id": "2-lf-5", "concept": "leaf", "type": "calc", "prompt": "leaf_example에서 f를 $s0, $s1 두 saved 레지스터에 나눠 쓴다면 프롤로그(스택 저장)는 어떻게 바뀌나?", "answer": "addi $sp, $sp, -8\nsw   $s1, 4($sp)\nsw   $s0, 0($sp)\n(에필로그는 같은 offset에서 lw 후 addi $sp, $sp, 8)", "keys": ["−8 확보", "각각 다른 offset에 sw", "복원 offset 일치"], "lesson": "L2-6", "unit": "U2", "prompt_en": "If leaf_example used two saved registers, $s0 and $s1, for f, how would the prologue (saving to the stack) change?", "answer_en": "addi $sp, $sp, -8\nsw   $s1, 4($sp)\nsw   $s0, 0($sp)\n(The epilogue does lw from the same offsets, then addi $sp, $sp, 8)", "keys_en": ["Allocate −8", "sw each to a different offset", "Restore offsets match"]}, {"id": "2-nl-1", "concept": "nonleaf", "type": "calc", "prompt": "재귀 `int fact(int n) { if (n < 1) return 1; else return n * fact(n - 1); }`를 MIPS로 쓰시오. 인자 $a0, 결과 $v0.", "answer": "fact:\n  addi $sp, $sp, -8\n  sw   $ra, 4($sp)\n  sw   $a0, 0($sp)\n  slti $t0, $a0, 1\n  beq  $t0, $zero, L1\n  addi $v0, $zero, 1\n  addi $sp, $sp, 8\n  jr   $ra\nL1:\n  addi $a0, $a0, -1\n  jal  fact\n  lw   $a0, 0($sp)\n  lw   $ra, 4($sp)\n  addi $sp, $sp, 8\n  mul  $v0, $a0, $v0\n  jr   $ra", "keys": ["$sp −8, $ra·$a0 저장", "slti + beq", "base case $v0 = 1", "n−1, jal fact", "같은 offset에서 복원", "mul", "jr $ra"], "slot": 10, "pts": 8, "lesson": "L2-6", "unit": "U2", "prompt_en": "Write the recursive `int fact(int n) { if (n < 1) return 1; else return n * fact(n - 1); }` in MIPS. Argument in $a0, result in $v0.", "keys_en": ["$sp −8, save $ra and $a0", "slti + beq", "Base case $v0 = 1", "n−1, jal fact", "Restore from the same offsets", "mul", "jr $ra"]}, {"id": "2-nl-2", "concept": "nonleaf", "type": "mc", "prompt": "Non-leaf procedure가 호출 전에 스택에 반드시 저장해야 하는 것은?", "choices": ["$zero", "$t 레지스터 전부", "$sp", "$ra와 호출 뒤에 필요한 인자·임시값"], "answer": 3, "lesson": "L2-6", "unit": "U2", "prompt_en": "What must a non-leaf procedure save on the stack before a call?", "choices_en": ["$zero", "All $t registers", "$sp", "$ra and any arguments/temporaries needed after the call"]}, {"id": "2-nl-3", "concept": "nonleaf", "type": "ox", "prompt": "fact에서 $a0를 0($sp)에, $ra를 4($sp)에 저장했다면 복원할 때 $a0를 4($sp)에서 읽어도 된다.", "answer": false, "explain": "반대로 복원하면 0점 (교수님 4주-1).", "lesson": "L2-6", "unit": "U2", "prompt_en": "In fact, if $a0 was saved at 0($sp) and $ra at 4($sp), it is fine to restore $a0 from 4($sp).", "explain_en": "Restoring them in the opposite order gets zero points (the professor, Week 4-1)."}, {"id": "2-nl-4", "concept": "nonleaf", "type": "short", "prompt": "Non-leaf procedure에서 $ra를 스택에 저장해야 하는 이유를 쓰시오. (영어로)", "answer": "Because the procedure itself calls another procedure with jal, which overwrites $ra with a new return address. Without saving it on the stack, the original return address to the caller would be lost.", "keys": ["jal이 $ra를 덮어씀", "원래 복귀 주소를 잃음"], "lesson": "L2-6", "unit": "U2", "prompt_en": "Explain why a non-leaf procedure must save $ra on the stack. (Answer in English.)", "keys_en": ["jal overwrites $ra", "The original return address would be lost"]}, {"id": "2-nl-5", "concept": "nonleaf", "type": "blank", "prompt": "fact에서 n < 1 검사는 `slti $t0, $a0, 1` 다음 `(a) $t0, $zero, L1`으로 한다.", "answer": "(a) beq", "accept": [["beq"]], "lesson": "L2-6", "unit": "U2", "prompt_en": "In fact, the n < 1 test is done with `slti $t0, $a0, 1` followed by `(a) $t0, $zero, L1`."}, {"id": "2-ft-1", "concept": "fact-trace", "type": "calc", "prompt": "100번지에서 `jal fact`로 fact(3)을 호출한다. $sp 초기값은 500. 재귀가 가장 깊어졌을 때까지 각 단계의 $sp와 스택에 저장된 (a0, ra)를 쓰시오.", "answer": "fact(3): $sp 492, 0($sp) = 3, 4($sp) = 104\nfact(2): $sp 484, 0($sp) = 2, 4($sp) = L1+8\nfact(1): $sp 476, 0($sp) = 1, 4($sp) = L1+8\nfact(0): $sp 468, 0($sp) = 0, 4($sp) = L1+8\n(fact(0)에서 slti → $t0 = 1 → $v0 = 1 반환)", "keys": ["492/484/476/468", "첫 ra = 104", "이후 ra = L1+8", "a0 = 3,2,1,0"], "slot": 10, "pts": 8, "lesson": "L2-6", "unit": "U2", "prompt_en": "fact(3) is called with `jal fact` at address 100. The initial value of $sp is 500. Up to the deepest point of the recursion, write $sp and the values (a0, ra) saved on the stack at each step.", "answer_en": "fact(3): $sp 492, 0($sp) = 3, 4($sp) = 104\nfact(2): $sp 484, 0($sp) = 2, 4($sp) = L1+8\nfact(1): $sp 476, 0($sp) = 1, 4($sp) = L1+8\nfact(0): $sp 468, 0($sp) = 0, 4($sp) = L1+8\n(In fact(0), slti → $t0 = 1 → returns $v0 = 1)", "keys_en": ["492/484/476/468", "First ra = 104", "Subsequent ra = L1+8", "a0 = 3,2,1,0"]}, {"id": "2-ft-2", "concept": "fact-trace", "type": "mc", "prompt": "fact(1) 실행 중 `slti $t0, $a0, 1`의 결과와 그 다음 동작은?", "choices": ["$t0 = 1, base case로 1 반환", "$t0 = 0, beq가 L1로 분기해 fact(0) 호출", "$t0 = 1, L1로 분기", "$t0 = 0, 바로 jr $ra"], "answer": 1, "lesson": "L2-6", "unit": "U2", "prompt_en": "While executing fact(1), what is the result of `slti $t0, $a0, 1`, and what happens next?", "choices_en": ["$t0 = 1, returns 1 as the base case", "$t0 = 0, beq branches to L1 and calls fact(0)", "$t0 = 1, branches to L1", "$t0 = 0, immediately jr $ra"]}, {"id": "2-ft-3", "concept": "fact-trace", "type": "calc", "prompt": "fact(3)이 모두 끝나면 $v0와 $sp, 마지막 jr이 가는 주소는?", "answer": "$v0 = 6 (1 → 1×1 → 2×1 → 3×2), $sp = 500 (원래대로), jr $ra → 104", "keys": ["$v0 = 6", "$sp = 500", "104로 복귀"], "lesson": "L2-6", "unit": "U2", "prompt_en": "When fact(3) is completely finished, what are $v0, $sp, and the address the last jr goes to?", "answer_en": "$v0 = 6 (1 → 1×1 → 2×1 → 3×2), $sp = 500 (restored), jr $ra → 104", "keys_en": ["$v0 = 6", "$sp = 500", "Returns to 104"]}, {"id": "2-ft-4", "concept": "fact-trace", "type": "ox", "prompt": "fact(3) 호출 시 스택은 총 4개의 frame(각 8 byte)이 쌓였다가 모두 해제된다.", "answer": true, "explain": "fact(3), (2), (1), (0) — 500 → 468.", "lesson": "L2-6", "unit": "U2", "prompt_en": "When fact(3) is called, a total of 4 frames (8 bytes each) are pushed onto the stack and then all released."}, {"id": "2-ss-1", "concept": "stack-size", "type": "mc", "prompt": "교수님 기준으로, char 인자 2개를 받는 재귀 함수가 $ra와 인자를 저장할 스택 크기는?", "choices": ["4 byte", "6 byte", "8 byte", "12 byte"], "answer": 1, "explain": "$ra 4 + char 1 + char 1 = 6.", "lesson": "L2-6", "unit": "U2", "prompt_en": "According to the professor, what stack size does a recursive function with two char arguments need to save $ra and its arguments?"}, {"id": "2-ss-2", "concept": "stack-size", "type": "mc", "prompt": "int 인자 1개를 받는 재귀 함수가 $ra와 인자를 저장할 스택 크기는?", "choices": ["4", "6", "8", "16"], "answer": 2, "lesson": "L2-6", "unit": "U2", "prompt_en": "What stack size does a recursive function with one int argument need to save $ra and its argument?"}, {"id": "2-ss-3", "concept": "stack-size", "type": "ox", "prompt": "strcpy처럼 char 배열을 다뤄도 스택에 저장하는 값이 int(i)라면 $sp는 4만큼 움직인다.", "answer": true, "lesson": "L2-6", "unit": "U2", "prompt_en": "Even when handling a char array, as in strcpy, if the value saved on the stack is an int (i), $sp moves by 4."}, {"id": "2-by-1", "concept": "byte-ops", "type": "calc", "prompt": "`void strcpy(char x[], char y[]) { int i = 0; while ((x[i] = y[i]) != '\\0') i += 1; }`를 MIPS로 쓰시오. x, y는 $a0, $a1, i는 $s0.", "answer": "strcpy:\n  addi $sp, $sp, -4\n  sw   $s0, 0($sp)\n  add  $s0, $zero, $zero\nL1: add  $t1, $s0, $a1\n  lbu  $t2, 0($t1)\n  add  $t3, $s0, $a0\n  sb   $t2, 0($t3)\n  beq  $t2, $zero, L2\n  addi $s0, $s0, 1\n  j    L1\nL2: lw   $s0, 0($sp)\n  addi $sp, $sp, 4\n  jr   $ra", "keys": ["$s0 저장", "i = 0", "주소 = i + base (×4 없음)", "lbu / sb", "beq로 '\\0' 검사", "i++, j L1", "복원, jr"], "slot": 10, "pts": 8, "lesson": "L2-6", "unit": "U2", "prompt_en": "Write `void strcpy(char x[], char y[]) { int i = 0; while ((x[i] = y[i]) != '\\0') i += 1; }` in MIPS. x and y are in $a0 and $a1, and i is in $s0.", "keys_en": ["Save $s0", "i = 0", "Address = i + base (no ×4)", "lbu / sb", "Test for '\\0' with beq", "i++, j L1", "Restore, jr"]}, {"id": "2-by-2", "concept": "byte-ops", "type": "mc", "prompt": "char 배열 x[i]의 주소 계산이 int 배열과 다른 점은?", "choices": ["원소가 1 byte라서 index에 4를 곱하지 않는다", "index에 8을 곱한다", "base address가 필요 없다", "offset에 레지스터를 쓸 수 있다"], "answer": 0, "lesson": "L2-6", "unit": "U2", "prompt_en": "How does the address calculation for char array x[i] differ from that of an int array?", "choices_en": ["Elements are 1 byte, so the index is not multiplied by 4", "The index is multiplied by 8", "No base address is needed", "A register can be used as the offset"]}, {"id": "2-by-3", "concept": "byte-ops", "type": "mc", "prompt": "1 byte를 읽어 32-bit로 zero extend하는 명령어는?", "choices": ["lw", "lb", "lbu", "sb"], "answer": 2, "lesson": "L2-6", "unit": "U2", "prompt_en": "Which instruction loads 1 byte and zero-extends it to 32 bits?"}, {"id": "2-lu-1", "concept": "lui-ori", "type": "calc", "prompt": "32-bit 상수 0x007D0900을 $s0에 넣는 MIPS 코드를 쓰시오 (0x007D = 125, 0x0900 = 2304).", "answer": "lui $s0, 125         # 0x007D → upper 16 bits\nori $s0, $s0, 2304   # 0x0900 → lower 16 bits", "keys": ["lui로 위 16 bit", "ori로 아래 16 bit"], "lesson": "L2-7", "unit": "U2", "prompt_en": "Write MIPS code that puts the 32-bit constant 0x007D0900 into $s0 (0x007D = 125, 0x0900 = 2304).", "keys_en": ["Upper 16 bits with lui", "Lower 16 bits with ori"]}, {"id": "2-lu-2", "concept": "lui-ori", "type": "ox", "prompt": "아래 16 bit를 채울 때 addi 대신 ori를 쓰는 이유는 addi가 immediate를 sign extend하기 때문이다.", "answer": true, "lesson": "L2-7", "unit": "U2", "prompt_en": "The reason ori is used instead of addi to fill the lower 16 bits is that addi sign-extends its immediate."}, {"id": "2-ba-1", "concept": "branch-addr", "type": "blank", "prompt": "Branch target address = (PC + (a)) + offset × (b)", "answer": "(a) 4 / (b) 4", "accept": [["4"], ["4"]], "lesson": "L2-7", "unit": "U2"}, {"id": "2-ba-2", "concept": "branch-addr", "type": "calc", "prompt": "beq가 108번지에 있고 분기 대상이 124번지다. beq의 offset 필드 값은?", "answer": "offset = (124 − (108 + 4)) / 4 = 12 / 4 = 3", "keys": ["PC + 4 = 112", "(124 − 112)/4", "3"], "slot": 15, "pts": 6, "lesson": "L2-7", "unit": "U2", "prompt_en": "A beq is at address 108 and the branch target is at address 124. What is the value of the beq's offset field?"}, {"id": "2-ba-3", "concept": "branch-addr", "type": "calc", "prompt": "beq가 1000번지에 있고 offset 필드가 −3이다. 분기 대상 주소는?", "answer": "(1000 + 4) + (−3) × 4 = 1004 − 12 = 992", "keys": ["PC+4 = 1004", "−3 × 4 = −12", "992"], "slot": 15, "pts": 6, "lesson": "L2-7", "unit": "U2", "prompt_en": "A beq is at address 1000 and its offset field is −3. What is the branch target address?"}, {"id": "2-ba-4", "concept": "branch-addr", "type": "mc", "prompt": "PC-relative branch가 도달할 수 있는 범위는?", "choices": ["±2¹⁵ bytes", "±2¹⁵ words(명령어)", "±2²⁶ words", "전체 메모리"], "answer": 1, "lesson": "L2-7", "unit": "U2", "prompt_en": "What range can a PC-relative branch reach?", "choices_en": ["±2¹⁵ bytes", "±2¹⁵ words (instructions)", "±2²⁶ words", "All of memory"]}, {"id": "2-ba-5", "concept": "branch-addr", "type": "calc", "prompt": "분기 대상이 너무 멀어 16-bit offset으로 표현할 수 없을 때 assembler는 `beq $s0, $s1, L1`을 어떻게 바꾸나?", "answer": "    bne $s0, $s1, L2\n    j   L1\nL2: …", "keys": ["조건 반전 bne", "j L1", "L2 레이블"], "lesson": "L2-7", "unit": "U2", "prompt_en": "When the branch target is too far to be represented by a 16-bit offset, how does the assembler rewrite `beq $s0, $s1, L1`?", "keys_en": ["Inverted condition with bne", "j L1", "L2 label"]}, {"id": "2-ba-6", "concept": "branch-addr", "type": "ox", "prompt": "beq의 offset 필드에는 분기 대상의 byte 주소 차이가 그대로 들어간다.", "answer": false, "explain": "명령어(word) 개수 차이. ×4는 하드웨어(shift left 2)가 함.", "lesson": "L2-7", "unit": "U2", "prompt_en": "The offset field of beq holds the byte-address difference to the branch target as-is.", "explain_en": "It is the difference in number of instructions (words). The ×4 is done by the hardware (shift left 2)."}, {"id": "2-ja-1", "concept": "jump-addr", "type": "mc", "prompt": "J-format에서 address 필드는 몇 bit인가?", "choices": ["16", "5", "26", "32"], "answer": 2, "lesson": "L2-7", "unit": "U2", "prompt_en": "How many bits is the address field in the J-format?"}, {"id": "2-ja-2", "concept": "jump-addr", "type": "calc", "prompt": "Loop가 80000번지, `j Loop`의 address 필드 값은?", "answer": "80000 / 4 = 20000", "keys": ["Target = address × 4", "20000"], "lesson": "L2-7", "unit": "U2", "prompt_en": "Loop is at address 80000. What is the value of the address field of `j Loop`?"}, {"id": "2-ja-3", "concept": "jump-addr", "type": "calc", "prompt": "80012번지의 `bne $t0, $s5, Exit`에서 offset 필드가 2일 때 Exit의 주소는?", "answer": "(80012 + 4) + 2 × 4 = 80024", "keys": ["PC+4 = 80016", "+8", "80024"], "lesson": "L2-7", "unit": "U2", "prompt_en": "In `bne $t0, $s5, Exit` at address 80012, the offset field is 2. What is the address of Exit?"}, {"id": "2-ja-4", "concept": "jump-addr", "type": "mc", "prompt": "jr은 어느 형식인가?", "choices": ["R-format", "I-format", "J-format", "FP format"], "answer": 0, "lesson": "L2-7", "unit": "U2", "prompt_en": "Which format is jr?"}, {"id": "2-am-1", "concept": "addr-modes", "type": "mc", "prompt": "lw, sw가 쓰는 addressing mode는?", "choices": ["PC-relative", "Pseudo-direct", "Base (displacement)", "Immediate"], "answer": 2, "lesson": "L2-7", "unit": "U2", "prompt_en": "Which addressing mode do lw and sw use?"}, {"id": "2-am-2", "concept": "addr-modes", "type": "mc", "prompt": "beq, bne가 쓰는 addressing mode는?", "choices": ["PC-relative", "Register", "Base", "Pseudo-direct"], "answer": 0, "lesson": "L2-7", "unit": "U2", "prompt_en": "Which addressing mode do beq and bne use?"}, {"id": "2-tr-1", "concept": "translate", "type": "mc", "prompt": "Linker가 하는 일이 '아닌' 것은?", "choices": ["segment 병합", "레이블 주소 결정", "위치 의존·외부 참조 수정", "가상 주소 공간 생성 후 프로그램을 메모리에 복사"], "answer": 3, "explain": "마지막은 loader.", "lesson": "L2-7", "unit": "U2", "prompt_en": "Which of the following is NOT done by the linker?", "explain_en": "The last one is done by the loader.", "choices_en": ["Merging segments", "Resolving label addresses", "Patching location-dependent and external references", "Creating the virtual address space and copying the program into memory"]}, {"id": "2-tr-2", "concept": "translate", "type": "calc", "prompt": "pseudo-instruction `move $t0, $t1`과 `blt $t0, $t1, L`을 실제 MIPS 명령어로 바꾸시오.", "answer": "move $t0, $t1 → add $t0, $zero, $t1\nblt $t0, $t1, L → slt $at, $t0, $t1\n                  bne $at, $zero, L", "keys": ["add $t0, $zero, $t1", "slt $at", "bne $at, $zero, L"], "lesson": "L2-7", "unit": "U2", "prompt_en": "Convert the pseudo-instructions `move $t0, $t1` and `blt $t0, $t1, L` into real MIPS instructions."}, {"id": "2-tr-3", "concept": "translate", "type": "ox", "prompt": "Dynamic linking은 라이브러리 프로시저가 호출될 때만 링크·로드한다.", "answer": true, "lesson": "L2-7", "unit": "U2", "prompt_en": "Dynamic linking links and loads a library procedure only when it is called."}, {"id": "2-fa-1", "concept": "fallacies", "type": "ox", "prompt": "강력한(복잡한) 명령어를 쓰면 항상 성능이 높아진다.", "answer": false, "lesson": "L2-7", "unit": "U2", "prompt_en": "Using powerful (complex) instructions always increases performance."}, {"id": "2-fa-2", "concept": "fallacies", "type": "mc", "prompt": "MIPS 설계 원칙 4개에 들어가지 '않는' 것은?", "choices": ["Simplicity favors regularity", "Smaller is faster", "Hierarchy of memories", "Good design demands good compromises"], "answer": 2, "lesson": "L2-7", "unit": "U2", "prompt_en": "Which is NOT one of the four MIPS design principles?"}, {"id": "3-ad-1", "concept": "int-add", "type": "calc", "prompt": "4-bit로 7 + 6과 7 − 6을 계산하시오 (뺄셈은 2의 보수 덧셈으로).", "answer": "7 + 6: 0111 + 0110 = 1101 (13, unsigned)\n7 − 6 = 7 + (−6): −6 = 1010 → 0111 + 1010 = 1 0001 → carry 버림 → 0001 = 1", "keys": ["0111+0110", "−6 = 1010", "결과 0001"], "lesson": "L3-1", "unit": "U3", "prompt_en": "Calculate 7 + 6 and 7 − 6 in 4 bits (do the subtraction as two's complement addition).", "answer_en": "7 + 6: 0111 + 0110 = 1101 (13, unsigned)\n7 − 6 = 7 + (−6): −6 = 1010 → 0111 + 1010 = 1 0001 → discard the carry → 0001 = 1", "keys_en": ["0111+0110", "−6 = 1010", "Result 0001"]}, {"id": "3-ad-2", "concept": "int-add", "type": "ox", "prompt": "뺄셈은 빼는 수의 2의 보수를 더하는 것으로 처리할 수 있다.", "answer": true, "lesson": "L3-1", "unit": "U3", "prompt_en": "Subtraction can be done by adding the two's complement of the subtrahend."}, {"id": "3-of-1", "concept": "overflow", "type": "mc", "prompt": "오버플로가 '절대' 일어나지 않는 경우는?", "choices": ["양수 + 양수", "음수 + 음수", "양수 + 음수", "음수 − 양수"], "answer": 2, "lesson": "L3-1", "unit": "U3", "prompt_en": "In which case can overflow NEVER occur?", "choices_en": ["Positive + positive", "Negative + negative", "Positive + negative", "Negative − positive"]}, {"id": "3-of-2", "concept": "overflow", "type": "calc", "prompt": "4-bit 2의 보수에서 0110 (6) + 0101 (5)를 계산하고 오버플로 여부를 판정하시오.", "answer": "0110 + 0101 = 1011 → sign bit 1 (음수). 양수 + 양수가 음수 → overflow.", "keys": ["1011", "양+양인데 sign 1", "overflow"], "slot": 6, "pts": 5, "lesson": "L3-1", "unit": "U3", "prompt_en": "In 4-bit two's complement, calculate 0110 (6) + 0101 (5) and determine whether overflow occurs.", "answer_en": "0110 + 0101 = 1011 → sign bit 1 (negative). Positive + positive gave a negative → overflow.", "keys_en": ["1011", "Positive + positive but sign 1", "overflow"]}, {"id": "3-of-3", "concept": "overflow", "type": "calc", "prompt": "4-bit 2의 보수에서 1100 (−4) + 1011 (−5)을 계산하고 오버플로 여부를 판정하시오.", "answer": "1100 + 1011 = 1 0111 → 4 bit = 0111 → sign 0 (양수). 음수 + 음수가 양수 → overflow.", "keys": ["0111", "음+음인데 sign 0", "overflow"], "lesson": "L3-1", "unit": "U3", "prompt_en": "In 4-bit two's complement, calculate 1100 (−4) + 1011 (−5) and determine whether overflow occurs.", "answer_en": "1100 + 1011 = 1 0111 → 4 bits = 0111 → sign 0 (positive). Negative + negative gave a positive → overflow.", "keys_en": ["0111", "Negative + negative but sign 0", "overflow"]}, {"id": "3-of-4", "concept": "overflow", "type": "blank", "prompt": "양수 − 음수에서 결과 sign bit가 (a)이면 오버플로, 음수 − 양수에서 결과 sign bit가 (b)이면 오버플로.", "answer": "(a) 1 / (b) 0", "accept": [["1"], ["0"]], "lesson": "L3-1", "unit": "U3", "prompt_en": "For positive − negative, overflow occurs if the result sign bit is (a); for negative − positive, overflow occurs if the result sign bit is (b)."}, {"id": "3-of-5", "concept": "overflow", "type": "ox", "prompt": "4-bit에서 0011 + 1110 (3 + (−2))은 결과에 carry가 나오므로 오버플로다.", "answer": false, "explain": "양수+음수는 오버플로 없음. carry out ≠ overflow.", "lesson": "L3-1", "unit": "U3", "prompt_en": "In 4 bits, 0011 + 1110 (3 + (−2)) overflows because a carry comes out of the result.", "explain_en": "Positive + negative never overflows. Carry out ≠ overflow."}, {"id": "3-of-6", "concept": "overflow", "type": "mc", "prompt": "현대 CPU가 정수 오버플로를 처리하는 방식으로 수업에서 말한 것은?", "choices": ["무시한다", "exception으로 처리", "항상 0으로 만든다", "결과를 64 bit로 확장"], "answer": 1, "lesson": "L3-1", "unit": "U3", "prompt_en": "According to the lecture, how do modern CPUs handle integer overflow?", "choices_en": ["Ignore it", "Handle it as an exception", "Always set the result to 0", "Extend the result to 64 bits"]}, {"id": "3-mb-1", "concept": "mult-basic", "type": "mc", "prompt": "n-bit × n-bit 곱셈 결과는 최대 몇 bit?", "choices": ["n", "n+1", "2n", "n²"], "answer": 2, "lesson": "L3-2", "unit": "U3", "prompt_en": "At most how many bits long is the product of an n-bit × n-bit multiplication?"}, {"id": "3-mb-2", "concept": "mult-basic", "type": "calc", "prompt": "종이 곱셈으로 1000 × 1001을 계산하고 10진수로 확인하시오.", "answer": "1000 + 0000(shift) + 0000(shift) + 1000(3칸 shift) = 1001000 = 72 (8 × 9)", "keys": ["부분곱", "1001000", "72"], "lesson": "L3-2", "unit": "U3", "prompt_en": "Calculate 1000 × 1001 by long multiplication on paper, and check the result in decimal.", "answer_en": "1000 + 0000 (shifted) + 0000 (shifted) + 1000 (shifted 3 places) = 1001000 = 72 (8 × 9)", "keys_en": ["Partial products", "1001000", "72"]}, {"id": "3-m1-1", "concept": "mult-v1", "type": "calc", "prompt": "원래 곱셈기(Multiplicand 8-bit shift left, Multiplier 4-bit shift right, Product 8-bit)로 0110 × 0011을 계산하시오. 각 반복의 Multiplier, Multiplicand, Product를 쓰시오.", "answer": "0: Mplier 0011, Mcand 0000 0110, Prod 0000 0000\n1: LSB=1 → Prod = 0000 0110; shift → Mplier 0001, Mcand 0000 1100\n2: LSB=1 → Prod = 0001 0010; shift → Mplier 0000, Mcand 0001 1000\n3: LSB=0 → no add; shift → 0000, 0011 0000\n4: LSB=0 → no add; shift → 0000, 0110 0000\nProduct = 0001 0010 (18)", "keys": ["매 반복 LSB 검사", "LSB=1일 때만 덧셈", "매 반복 두 번 shift", "결과 0001 0010 = 18"], "slot": 11, "pts": 8, "lesson": "L3-2", "unit": "U3", "prompt_en": "Using the original multiplier (Multiplicand 8-bit shift left, Multiplier 4-bit shift right, Product 8-bit), calculate 0110 × 0011. Write the Multiplier, Multiplicand and Product at each iteration.", "keys_en": ["Test the LSB every iteration", "Add only when LSB=1", "Two shifts every iteration", "Result 0001 0010 = 18"]}, {"id": "3-m1-2", "concept": "mult-v1", "type": "calc", "prompt": "원래 곱셈기로 0111 × 0101을 계산하시오 (반복마다 Product 값).", "answer": "1: LSB=1 → Prod 0000 0111 (Mcand → 0000 1110)\n2: LSB=0 → Prod 0000 0111 (Mcand → 0001 1100)\n3: LSB=1 → Prod 0010 0011 (Mcand → 0011 1000)\n4: LSB=0 → Prod 0010 0011\n= 35", "keys": ["0000 0111", "0010 0011", "35"], "slot": 11, "pts": 8, "lesson": "L3-2", "unit": "U3", "prompt_en": "Using the original multiplier, calculate 0111 × 0101 (Product value at each iteration)."}, {"id": "3-m1-3", "concept": "mult-v1", "type": "mc", "prompt": "원래 곱셈기에서 매 반복 Multiplicand와 Multiplier가 하는 shift는?", "choices": ["Multiplicand 왼쪽, Multiplier 오른쪽", "둘 다 왼쪽", "Multiplicand 오른쪽, Multiplier 왼쪽", "LSB가 1일 때만 shift"], "answer": 0, "lesson": "L3-2", "unit": "U3", "prompt_en": "In the original multiplier, how are the Multiplicand and Multiplier shifted every iteration?", "choices_en": ["Multiplicand left, Multiplier right", "Both left", "Multiplicand right, Multiplier left", "Shifted only when the LSB is 1"]}, {"id": "3-m1-4", "concept": "mult-v1", "type": "ox", "prompt": "원래 곱셈기에서 Product 레지스터는 처음에 0으로 초기화한다.", "answer": true, "lesson": "L3-2", "unit": "U3", "prompt_en": "In the original multiplier, the Product register is initialized to 0."}, {"id": "3-m1-5", "concept": "mult-v1", "type": "mc", "prompt": "원래 곱셈기(32-bit)에서 Multiplicand 레지스터와 ALU의 크기는?", "choices": ["32-bit, 32-bit", "32-bit, 64-bit", "64-bit, 32-bit", "64-bit, 64-bit"], "answer": 3, "lesson": "L3-2", "unit": "U3", "prompt_en": "In the original (32-bit) multiplier, what are the sizes of the Multiplicand register and the ALU?"}, {"id": "3-m1-6", "concept": "mult-v1", "type": "ox", "prompt": "원래 곱셈기에서 Multiplier의 LSB가 0이면 그 반복에서는 shift도 하지 않는다.", "answer": false, "explain": "LSB와 상관없이 매 반복 shift.", "lesson": "L3-2", "unit": "U3", "prompt_en": "In the original multiplier, if the LSB of the Multiplier is 0, no shift is done in that iteration either.", "explain_en": "Shift every iteration, regardless of the LSB."}, {"id": "3-m2-1", "concept": "mult-v2", "type": "calc", "prompt": "개선된 곱셈기(Multiplicand 4-bit, Product 8-bit shift right)로 0011 × 0101을 계산하시오. 각 반복의 Product를 쓰시오.", "answer": "0: Product = 0000 0101 (아래 절반 = multiplier)\n1: LSB=1 → 위 += 0011 → 0011 0101 → >>1 → 0001 1010\n2: LSB=0 → >>1 → 0000 1101\n3: LSB=1 → 위 += 0011 → 0011 1101 → >>1 → 0001 1110\n4: LSB=0 → >>1 → 0000 1111\n= 15", "keys": ["초기: 아래 절반 = multiplier", "LSB=1이면 위 절반에 더함", "매 반복 >>1", "0000 1111 = 15"], "slot": 11, "pts": 8, "lesson": "L3-2", "unit": "U3", "prompt_en": "Using the refined multiplier (Multiplicand 4-bit, Product 8-bit shift right), calculate 0011 × 0101. Write the Product at each iteration.", "answer_en": "0: Product = 0000 0101 (lower half = multiplier)\n1: LSB=1 → upper += 0011 → 0011 0101 → >>1 → 0001 1010\n2: LSB=0 → >>1 → 0000 1101\n3: LSB=1 → upper += 0011 → 0011 1101 → >>1 → 0001 1110\n4: LSB=0 → >>1 → 0000 1111\n= 15", "keys_en": ["Initial: lower half = multiplier", "If LSB=1, add to the upper half", ">>1 every iteration", "0000 1111 = 15"]}, {"id": "3-m2-2", "concept": "mult-v2", "type": "calc", "prompt": "개선된 곱셈기로 1001 × 0110을 계산하시오 (반복마다 Product).", "answer": "0: 0000 0110\n1: LSB=0 → >>1 → 0000 0011\n2: LSB=1 → 1001 0011 → >>1 → 0100 1001\n3: LSB=1 → 1101 1001 → >>1 → 0110 1100\n4: LSB=0 → >>1 → 0011 0110 = 54", "keys": ["0100 1001", "0110 1100", "0011 0110 = 54"], "slot": 11, "pts": 8, "lesson": "L3-2", "unit": "U3", "prompt_en": "Using the refined multiplier, calculate 1001 × 0110 (Product at each iteration)."}, {"id": "3-m2-3", "concept": "mult-v2", "type": "mc", "prompt": "개선된 곱셈기의 종료 조건은?", "choices": ["Product가 0", "shift 횟수 = multiplier 비트 수", "shift 횟수 = multiplicand 비트 수", "Multiplicand가 0"], "answer": 1, "lesson": "L3-2", "unit": "U3", "prompt_en": "What is the termination condition of the refined multiplier?", "choices_en": ["Product is 0", "Number of shifts = number of bits in the multiplier", "Number of shifts = number of bits in the multiplicand", "Multiplicand is 0"]}, {"id": "3-m2-4", "concept": "mult-v2", "type": "ox", "prompt": "개선된 곱셈기에는 별도의 Multiplier 레지스터가 없고, multiplier는 Product 레지스터의 아래 절반에 들어간다.", "answer": true, "lesson": "L3-2", "unit": "U3", "prompt_en": "The refined multiplier has no separate Multiplier register; the multiplier is placed in the lower half of the Product register."}, {"id": "3-m2-5", "concept": "mult-v2", "type": "short", "prompt": "개선된 곱셈기가 원래 곱셈기보다 나은 점을 하드웨어 크기 관점에서 쓰시오. (영어로)", "answer": "The multiplicand register and ALU only need to be 32 bits (not 64), and the multiplier shares the product register's lower half, so no separate multiplier register is needed; only the product shifts right.", "keys": ["Multiplicand·ALU가 32-bit", "multiplier가 Product 아래 절반을 공유", "Product만 shift right"], "lesson": "L3-2", "unit": "U3", "prompt_en": "Explain how the refined multiplier improves on the original multiplier in terms of hardware size. (Answer in English.)", "keys_en": ["Multiplicand and ALU are 32-bit", "The multiplier shares the lower half of Product", "Only Product shifts right"]}, {"id": "3-m2-6", "concept": "mult-v2", "type": "blank", "prompt": "개선된 곱셈기에서 LSB가 1이면 multiplicand를 Product의 (a) 절반에 더하고, 매 반복 Product를 (b)쪽으로 shift한다.", "answer": "(a) 위 / (b) 오른", "accept": [["위", "upper", "상위", "왼쪽", "top", "high", "higher", "left"], ["오른", "오른쪽", "right", "우"]], "lesson": "L3-2", "unit": "U3", "prompt_en": "In the refined multiplier, if the LSB is 1, the multiplicand is added to the (a) half of Product, and every iteration Product is shifted to the (b).", "answer_en": "(a) upper / (b) right"}, {"id": "3-me-1", "concept": "mult-examples", "type": "calc", "prompt": "week5 Example 1: 원래 곱셈기로 1010 × 0010의 과정을 보이시오.", "answer": "0: Mplier 0010, Mcand 0000 1010, Prod 0000 0000\n1: LSB=0 → no add; Mplier 0001, Mcand 0001 0100\n2: LSB=1 → Prod = 0001 0100; Mplier 0000, Mcand 0010 1000\n3: LSB=0; Mcand 0101 0000\n4: LSB=0; Mcand 1010 0000\nProduct = 0001 0100 (20)", "keys": ["1회차 덧셈 없음", "2회차 Prod = 0001 0100", "결과 20"], "slot": 11, "pts": 8, "lesson": "L3-2", "unit": "U3", "prompt_en": "Week 5 Example 1: Show the process of 1010 × 0010 using the original multiplier.", "keys_en": ["No add in iteration 1", "Iteration 2: Prod = 0001 0100", "Result 20"]}, {"id": "3-me-2", "concept": "mult-examples", "type": "calc", "prompt": "week5 Example 2: 개선된 곱셈기로 1010 × 1100의 과정을 보이시오.", "answer": "0: 0000 1100\n1: LSB=0 → >>1 → 0000 0110\n2: LSB=0 → >>1 → 0000 0011\n3: LSB=1 → 1010 0011 → >>1 → 0101 0001\n4: LSB=1 → 1111 0001 → >>1 → 0111 1000 (120)", "keys": ["0000 0011", "0101 0001", "0111 1000 = 120"], "slot": 11, "pts": 8, "lesson": "L3-2", "unit": "U3", "prompt_en": "Week 5 Example 2: Show the process of 1010 × 1100 using the refined multiplier."}, {"id": "3-me-3", "concept": "mult-examples", "type": "mc", "prompt": "Example 2의 3회차에서 위 절반에 1010을 더하기 직전 Product가 0000 0011이다. 더한 직후 값은?", "choices": ["0000 1101", "1010 0000", "1010 0011", "0101 0001"], "answer": 2, "lesson": "L3-2", "unit": "U3", "prompt_en": "In iteration 3 of Example 2, Product is 0000 0011 just before 1010 is added to the upper half. What is the value right after the add?"}, {"id": "3-mi-1", "concept": "mult-instr", "type": "mc", "prompt": "64-bit 곱 결과의 위 32 bit가 저장되는 레지스터는?", "choices": ["HI", "LO", "$v0", "$ra"], "answer": 0, "lesson": "L3-2", "unit": "U3", "prompt_en": "Which register holds the upper 32 bits of a 64-bit product?"}, {"id": "3-mi-2", "concept": "mult-instr", "type": "ox", "prompt": "`mul rd, rs, rt`는 64-bit 곱의 아래 32 bit만 rd에 넣는다.", "answer": true, "lesson": "L3-2", "unit": "U3", "prompt_en": "`mul rd, rs, rt` puts only the lower 32 bits of the 64-bit product into rd."}, {"id": "3-db-1", "concept": "div-basic", "type": "blank", "prompt": "Dividend = (a) × Divisor + (b)", "answer": "(a) Quotient / (b) Remainder", "accept": [["quotient", "몫"], ["remainder", "나머지"]], "lesson": "L3-3", "unit": "U3"}, {"id": "3-db-2", "concept": "div-basic", "type": "mc", "prompt": "Restoring division에서 빼기 결과가 음수일 때 하는 일은?", "choices": ["몫에 1을 넣는다", "divisor를 다시 더해 원래 값으로 복구하고 몫에 0", "나눗셈을 중단한다", "divisor를 2배 한다"], "answer": 1, "lesson": "L3-3", "unit": "U3", "prompt_en": "In restoring division, what is done when the result of the subtraction is negative?", "choices_en": ["Put 1 in the quotient", "Add the divisor back to restore the original value, and put 0 in the quotient", "Stop the division", "Double the divisor"]}, {"id": "3-db-3", "concept": "div-basic", "type": "ox", "prompt": "Signed division에서 나머지(remainder)는 dividend와 같은 부호를 가진다.", "answer": true, "lesson": "L3-3", "unit": "U3", "prompt_en": "In signed division, the remainder has the same sign as the dividend (Dividend = Quotient × Divisor + Remainder)."}, {"id": "3-db-4", "concept": "div-basic", "type": "calc", "prompt": "1001010 ÷ 1000의 몫과 나머지를 이진수와 10진수로 쓰시오.", "answer": "몫 1001 (9), 나머지 10 (2) — 74 = 9 × 8 + 2", "keys": ["몫 1001", "나머지 10", "74 = 9×8 + 2"], "lesson": "L3-3", "unit": "U3", "prompt_en": "Write the quotient and remainder of 1001010 ÷ 1000 in binary and decimal.", "answer_en": "Quotient 1001 (9), remainder 10 (2) — 74 = 9 × 8 + 2", "keys_en": ["Quotient 1001", "Remainder 10", "74 = 9×8 + 2"]}, {"id": "3-d1-1", "concept": "div-v1", "type": "calc", "prompt": "나눗셈기(Divisor 8-bit shift right, 처음엔 왼쪽 절반 / Remainder 8-bit / Quotient 4-bit shift left)로 0000 0111 ÷ 0010을 계산하시오. 각 반복의 판정과 Quotient, Remainder를 쓰시오.", "answer": "Divisor 초기 0010 0000, Rem 0000 0111\n1: Rem−Div < 0 → 복구, Q 0000, Div → 0001 0000\n2: < 0 → 복구, Q 0000, Div → 0000 1000\n3: 0000 0111 − 0000 1000 < 0 → 복구, Q 0000, Div → 0000 0100\n4: 0000 0111 − 0000 0100 = 0000 0011 ≥ 0 → Q 0001, Div → 0000 0010\n5: 0000 0011 − 0000 0010 = 0000 0001 ≥ 0 → Q 0011\nQuotient = 0011 (3), Remainder = 0000 0001 (1)", "keys": ["Divisor 초기 0010 0000", "n+1 = 5회", "음수면 add back + 0", "Q = 0011 (3)", "R = 1"], "slot": 12, "pts": 7, "lesson": "L3-3", "unit": "U3", "prompt_en": "Using the divider (Divisor 8-bit shift right, initially in the left half / Remainder 8-bit / Quotient 4-bit shift left), calculate 0000 0111 ÷ 0010. Write the decision, Quotient and Remainder at each iteration.", "answer_en": "Initial Divisor 0010 0000, Rem 0000 0111\n1: Rem−Div < 0 → restore, Q 0000, Div → 0001 0000\n2: < 0 → restore, Q 0000, Div → 0000 1000\n3: 0000 0111 − 0000 1000 < 0 → restore, Q 0000, Div → 0000 0100\n4: 0000 0111 − 0000 0100 = 0000 0011 ≥ 0 → Q 0001, Div → 0000 0010\n5: 0000 0011 − 0000 0010 = 0000 0001 ≥ 0 → Q 0011\nQuotient = 0011 (3), Remainder = 0000 0001 (1)", "keys_en": ["Initial Divisor 0010 0000", "n+1 = 5 iterations", "If negative, add back + 0", "Q = 0011 (3)", "R = 1"]}, {"id": "3-d1-2", "concept": "div-v1", "type": "calc", "prompt": "같은 나눗셈기로 0000 1101 ÷ 0011을 계산하시오 (몫·나머지와 ≥0이 된 반복).", "answer": "Divisor 0011 0000에서 시작.\n1, 2회: 음수 → 복구\n3회: 0000 1101 − 0000 1100 = 0000 0001 ≥ 0 → Q 0001\n4회: 0000 0001 − 0000 0110 < 0 → Q 0010\n5회: 0000 0001 − 0000 0011 < 0 → Q 0100\nQ = 0100 (4), R = 1", "keys": ["3회차만 ≥ 0", "Q = 0100 = 4", "R = 1"], "slot": 12, "pts": 7, "lesson": "L3-3", "unit": "U3", "prompt_en": "Using the same divider, calculate 0000 1101 ÷ 0011 (quotient, remainder, and the iteration where the result became ≥ 0).", "answer_en": "Start with Divisor 0011 0000.\nIterations 1, 2: negative → restore\nIteration 3: 0000 1101 − 0000 1100 = 0000 0001 ≥ 0 → Q 0001\nIteration 4: 0000 0001 − 0000 0110 < 0 → Q 0010\nIteration 5: 0000 0001 − 0000 0011 < 0 → Q 0100\nQ = 0100 (4), R = 1", "keys_en": ["Only iteration 3 is ≥ 0", "Q = 0100 = 4", "R = 1"]}, {"id": "3-d1-3", "concept": "div-v1", "type": "mc", "prompt": "4-bit 나눗셈기는 몇 번 반복하나?", "choices": ["3", "4", "5", "8"], "answer": 2, "explain": "n + 1 = 5 (32-bit면 33번).", "lesson": "L3-3", "unit": "U3", "prompt_en": "How many iterations does a 4-bit divider take?", "explain_en": "n + 1 = 5 (33 for 32 bits)."}, {"id": "3-d1-4", "concept": "div-v1", "type": "ox", "prompt": "나눗셈기에서 Divisor는 처음에 Divisor 레지스터의 왼쪽(위) 절반에 놓인다.", "answer": true, "lesson": "L3-3", "unit": "U3", "prompt_en": "In the divider, the Divisor is initially placed in the left (upper) half of the Divisor register."}, {"id": "3-d1-5", "concept": "div-v1", "type": "mc", "prompt": "Rem − Div가 음수인지 판단하는 방법은?", "choices": ["결과의 첫 비트(sign bit)가 1인지", "결과가 짝수인지", "Quotient의 LSB", "Divisor의 MSB"], "answer": 0, "lesson": "L3-3", "unit": "U3", "prompt_en": "How do you decide whether Rem − Div is negative?", "choices_en": ["Whether the first bit (sign bit) of the result is 1", "Whether the result is even", "The LSB of the Quotient", "The MSB of the Divisor"]}, {"id": "3-d1-6", "concept": "div-v1", "type": "blank", "prompt": "Rem ≥ 0이면 Quotient를 왼쪽 shift하고 새 LSB에 (a), Rem < 0이면 Divisor를 (b) 복구하고 LSB에 0.", "answer": "(a) 1 / (b) 더해", "accept": [["1"], ["더해", "더해서", "다시더해", "addback", "add", "plusback", "더함", "adding back", "adding", "added back", "adding the divisor back"]], "lesson": "L3-3", "unit": "U3", "prompt_en": "If Rem ≥ 0, shift the Quotient left and set the new LSB to (a); if Rem < 0, restore by (b) the Divisor and set the LSB to 0.", "answer_en": "(a) 1 / (b) adding back"}, {"id": "3-dx-1", "concept": "div-example", "type": "calc", "prompt": "week5 Example 3: 0001 0100 ÷ 0010을 나눗셈기로 계산하시오.", "answer": "Div 0010 0000, Rem 0001 0100\n1: 1111 0100 <0 → 복구, Q 0000, Div 0001 0000\n2: 0000 0100 ≥0 → Q 0001, Div 0000 1000\n3: 1111 1100 <0 → 복구, Q 0010, Div 0000 0100\n4: 0000 0000 ≥0 → Q 0101, Div 0000 0010\n5: 1111 1110 <0 → 복구, Q 1010\nQuotient 1010 (10), Remainder 0", "keys": ["2회 ≥0", "4회 ≥0", "Q = 1010 = 10", "R = 0"], "slot": 12, "pts": 7, "lesson": "L3-3", "unit": "U3", "prompt_en": "Week 5 Example 3: Calculate 0001 0100 ÷ 0010 using the divider.", "answer_en": "Div 0010 0000, Rem 0001 0100\n1: 1111 0100 <0 → restore, Q 0000, Div 0001 0000\n2: 0000 0100 ≥0 → Q 0001, Div 0000 1000\n3: 1111 1100 <0 → restore, Q 0010, Div 0000 0100\n4: 0000 0000 ≥0 → Q 0101, Div 0000 0010\n5: 1111 1110 <0 → restore, Q 1010\nQuotient 1010 (10), Remainder 0", "keys_en": ["Iteration 2 ≥0", "Iteration 4 ≥0", "Q = 1010 = 10", "R = 0"]}, {"id": "3-dx-2", "concept": "div-example", "type": "mc", "prompt": "Example 3의 1회차에서 0001 0100 − 0010 0000의 결과는?", "choices": ["0000 0100", "1111 0100", "0001 0100", "1110 1100"], "answer": 1, "lesson": "L3-3", "unit": "U3", "prompt_en": "In iteration 1 of Example 3, what is the result of 0001 0100 − 0010 0000?"}, {"id": "3-d2-1", "concept": "div-v2", "type": "mc", "prompt": "개선된 나눗셈기의 특징은?", "choices": ["Divisor·ALU를 32-bit로 줄이고 몫을 Remainder 레지스터에 함께 넣는다", "Divisor를 64-bit로 늘린다", "Quotient 레지스터를 두 개 쓴다", "곱셈기와 같은 회로를 쓴다"], "answer": 0, "lesson": "L3-3", "unit": "U3", "prompt_en": "What is a characteristic of the refined divider?", "choices_en": ["The Divisor and ALU are reduced to 32 bits, and the quotient is kept in the Remainder register as well", "The Divisor is increased to 64 bits", "It uses two Quotient registers", "It uses the same circuit as the multiplier"]}, {"id": "3-d2-2", "concept": "div-v2", "type": "ox", "prompt": "0으로 나누는지(divisor = 0) 먼저 검사해야 한다.", "answer": true, "lesson": "L3-3", "unit": "U3", "prompt_en": "You must first check for division by 0 (divisor = 0)."}, {"id": "3-if-1", "concept": "ieee-format", "type": "mc", "prompt": "IEEE 754 single precision의 sign, exponent, fraction 비트 수는?", "choices": ["1, 11, 52", "1, 8, 23", "1, 7, 24", "2, 8, 22"], "answer": 1, "lesson": "L3-4", "unit": "U3", "prompt_en": "How many bits are the sign, exponent and fraction in IEEE 754 single precision?"}, {"id": "3-if-2", "concept": "ieee-format", "type": "mc", "prompt": "Double precision의 bias는?", "choices": ["127", "128", "1024", "1023"], "answer": 3, "lesson": "L3-4", "unit": "U3", "prompt_en": "What is the bias in double precision?"}, {"id": "3-if-3", "concept": "ieee-format", "type": "blank", "prompt": "x = (−1)^S × ((a) + Fraction) × 2^(Exponent − (b))", "answer": "(a) 1 / (b) Bias", "accept": [["1"], ["bias", "127", "바이어스"]], "lesson": "L3-4", "unit": "U3"}, {"id": "3-if-4", "concept": "ieee-format", "type": "ox", "prompt": "정규화된 수의 맨 앞 '1.'은 항상 1이라 저장하지 않는다 (hidden bit).", "answer": true, "lesson": "L3-4", "unit": "U3", "prompt_en": "The leading '1.' of a normalized number is always 1, so it is not stored (hidden bit)."}, {"id": "3-if-5", "concept": "ieee-format", "type": "short", "prompt": "IEEE 754에서 exponent를 bias(excess) 표현으로 저장하는 이유와 single에서 bias 값을 쓰시오. (영어로)", "answer": "Exponent is stored as actual exponent + bias so that the stored exponent is always unsigned (easy to compare/sort). Single precision bias = 127 (double = 1023).", "keys": ["stored = actual + bias", "exponent가 unsigned", "single bias 127"], "lesson": "L3-4", "unit": "U3", "prompt_en": "Explain why IEEE 754 stores the exponent in biased (excess) representation, and give the bias value for single precision. (Answer in English.)", "keys_en": ["stored = actual + bias", "The exponent is unsigned", "Single bias 127"]}, {"id": "3-if-6", "concept": "ieee-format", "type": "calc", "prompt": "Single precision에서 exponent 필드가 1000 0010이면 실제 지수는?", "answer": "130 − 127 = 3", "keys": ["130", "−127", "3"], "lesson": "L3-4", "unit": "U3", "prompt_en": "In single precision, if the exponent field is 1000 0010, what is the actual exponent?"}, {"id": "3-ie-1", "concept": "ieee-examples", "type": "calc", "prompt": "−0.75를 IEEE 754 single precision으로 표현하시오 (S, Exponent, Fraction, 16진수).", "answer": "0.75 = 0.11₂ = 1.1₂ × 2⁻¹\nS = 1, Exponent = −1 + 127 = 126 = 0111 1110, Fraction = 1000…0\n1 01111110 10000000000000000000000 = 0xBF400000", "keys": ["1.1 × 2⁻¹", "S = 1", "E = 126 = 01111110", "F = 100…0", "0xBF400000"], "slot": 13, "pts": 6, "lesson": "L3-4", "unit": "U3", "prompt_en": "Represent −0.75 in IEEE 754 single precision (S, Exponent, Fraction, hexadecimal)."}, {"id": "3-ie-2", "concept": "ieee-examples", "type": "calc", "prompt": "0.625를 IEEE 754 single precision으로 표현하시오.", "answer": "0.625 = 0.101₂ = 1.01₂ × 2⁻¹\nS = 0, E = 126 = 0111 1110, F = 0100…0\n0 01111110 01000000000000000000000 = 0x3F200000", "keys": ["1.01 × 2⁻¹", "E = 126", "F = 0100…", "0x3F200000"], "slot": 13, "pts": 6, "lesson": "L3-4", "unit": "U3", "prompt_en": "Represent 0.625 in IEEE 754 single precision."}, {"id": "3-ie-3", "concept": "ieee-examples", "type": "calc", "prompt": "−3.75를 IEEE 754 single precision으로 표현하시오.", "answer": "3.75 = 11.11₂ = 1.111₂ × 2¹\nS = 1, E = 1 + 127 = 128 = 1000 0000, F = 1110…0\n1 10000000 11100000000000000000000 = 0xC0700000", "keys": ["1.111 × 2¹", "E = 128 = 10000000", "F = 111000…", "0xC0700000"], "slot": 13, "pts": 6, "lesson": "L3-4", "unit": "U3", "prompt_en": "Represent −3.75 in IEEE 754 single precision."}, {"id": "3-ie-4", "concept": "ieee-examples", "type": "calc", "prompt": "−12.5를 IEEE 754 single precision으로 표현하시오.", "answer": "12.5 = 1100.1₂ = 1.1001₂ × 2³\nS = 1, E = 3 + 127 = 130 = 1000 0010, F = 1001 0…0\n1 10000010 10010000000000000000000 = 0xC1480000", "keys": ["1.1001 × 2³", "E = 130", "F = 1001…", "0xC1480000"], "slot": 13, "pts": 6, "lesson": "L3-4", "unit": "U3", "prompt_en": "Represent −12.5 in IEEE 754 single precision."}, {"id": "3-ie-5", "concept": "ieee-examples", "type": "calc", "prompt": "−0.75를 IEEE 754 double precision으로 표현하시오 (exponent·fraction 비트 수 주의).", "answer": "S = 1, Exponent = −1 + 1023 = 1022 = 011 1111 1110 (11 bit), Fraction = 1000…0 (52 bit)\n= 0xBFE8000000000000", "keys": ["E = 1022 (11 bit)", "F 52 bit", "0xBFE8000000000000"], "lesson": "L3-4", "unit": "U3", "prompt_en": "Represent −0.75 in IEEE 754 double precision (watch the number of exponent and fraction bits)."}, {"id": "3-ie-6", "concept": "ieee-examples", "type": "calc", "prompt": "single precision `0 01111111 10000000000000000000000`의 10진수 값은?", "answer": "E = 127 → 2⁰, significand 1.1₂ = 1.5 → 1.5", "keys": ["E−127 = 0", "1.1₂", "1.5"], "lesson": "L3-4", "unit": "U3", "prompt_en": "What is the decimal value of the single-precision `0 01111111 10000000000000000000000`?"}, {"id": "3-ie-7", "concept": "ieee-examples", "type": "calc", "prompt": "−2.25를 IEEE 754 single precision 16진수로 쓰시오.", "answer": "2.25 = 10.01₂ = 1.001₂ × 2¹ → S 1, E 128, F 0010…0 → 1 10000000 00100000000000000000000 = 0xC0100000", "keys": ["1.001 × 2¹", "E 128", "0xC0100000"], "lesson": "L3-4", "unit": "U3", "prompt_en": "Write −2.25 in IEEE 754 single precision, in hexadecimal."}, {"id": "3-ir-1", "concept": "ieee-range", "type": "mc", "prompt": "Single precision에서 exponent = 255, fraction ≠ 0이 뜻하는 것은?", "choices": ["0", "±∞", "Denormal", "NaN"], "answer": 3, "lesson": "L3-4", "unit": "U3", "prompt_en": "In single precision, what does exponent = 255 with fraction ≠ 0 mean?"}, {"id": "3-ir-2", "concept": "ieee-range", "type": "mc", "prompt": "Single precision의 대략적인 십진 정밀도는?", "choices": ["6자리", "16자리", "23자리", "3자리"], "answer": 0, "lesson": "L3-4", "unit": "U3", "prompt_en": "What is the approximate decimal precision of single precision?", "choices_en": ["6 digits", "16 digits", "23 digits", "3 digits"]}, {"id": "3-ir-3", "concept": "ieee-range", "type": "ox", "prompt": "Exponent = 0이고 fraction ≠ 0이면 denormal number이며 hidden bit는 0이다.", "answer": true, "lesson": "L3-4", "unit": "U3", "prompt_en": "If exponent = 0 and fraction ≠ 0, the number is a denormal and the hidden bit is 0."}, {"id": "3-ir-4", "concept": "ieee-range", "type": "calc", "prompt": "Single precision에서 가장 작은 정규화 양수와 가장 큰 수의 exponent 필드 값과 실제 지수는?", "answer": "최소: exponent 0000 0001 → 1 − 127 = −126 (1.0 × 2⁻¹²⁶)\n최대: exponent 1111 1110 → 254 − 127 = +127 (≈ 2.0 × 2¹²⁷)", "keys": ["00000001 → −126", "11111110 → +127", "00000000·11111111은 예약"], "lesson": "L3-4", "unit": "U3", "prompt_en": "In single precision, what are the exponent field values and actual exponents of the smallest normalized positive number and the largest number?", "answer_en": "Smallest: exponent 0000 0001 → 1 − 127 = −126 (1.0 × 2⁻¹²⁶)\nLargest: exponent 1111 1110 → 254 − 127 = +127 (≈ 2.0 × 2¹²⁷)", "keys_en": ["00000001 → −126", "11111110 → +127", "00000000 and 11111111 are reserved"]}, {"id": "3-fa-1", "concept": "fp-add", "type": "calc", "prompt": "4자리 이진 FP로 0.5 + (−0.4375)를 4단계로 계산하시오.", "answer": "1.000×2⁻¹ + (−1.110×2⁻²)\n1. Align: −1.110×2⁻² → −0.111×2⁻¹\n2. Add: 1.000 − 0.111 = 0.001 × 2⁻¹\n3. Normalize: 1.000×2⁻⁴ (no over/underflow)\n4. Round: 1.000×2⁻⁴ = 0.0625", "keys": ["작은 지수를 큰 쪽에 맞춤", "0.001 × 2⁻¹", "1.000 × 2⁻⁴", "0.0625"], "slot": 13, "pts": 6, "lesson": "L3-5", "unit": "U3", "prompt_en": "Using 4-digit binary FP, calculate 0.5 + (−0.4375) in 4 steps.", "keys_en": ["Align the smaller exponent to the larger", "0.001 × 2⁻¹", "1.000 × 2⁻⁴", "0.0625"]}, {"id": "3-fa-2", "concept": "fp-add", "type": "mc", "prompt": "FP 덧셈의 첫 단계는?", "choices": ["지수가 작은 쪽 significand를 shift해 지수를 맞춘다", "significand를 곱한다", "지수를 더한다", "부호를 정한다"], "answer": 0, "lesson": "L3-5", "unit": "U3", "prompt_en": "What is the first step of FP addition?", "choices_en": ["Shift the significand of the number with the smaller exponent to align the exponents", "Multiply the significands", "Add the exponents", "Determine the sign"]}, {"id": "3-fa-3", "concept": "fp-add", "type": "calc", "prompt": "4자리 십진 FP로 9.999×10¹ + 1.610×10⁻¹을 계산하시오.", "answer": "1. 1.610×10⁻¹ → 0.016×10¹\n2. 9.999 + 0.016 = 10.015 ×10¹\n3. 1.0015×10²\n4. round → 1.002×10²", "keys": ["align 0.016×10¹", "10.015", "1.0015×10²", "1.002×10²"], "lesson": "L3-5", "unit": "U3", "prompt_en": "Using 4-digit decimal FP, calculate 9.999×10¹ + 1.610×10⁻¹."}, {"id": "3-fm-1", "concept": "fp-mul", "type": "calc", "prompt": "4자리 이진 FP로 0.5 × (−0.4375)를 5단계로 계산하시오 (biased exponent도 쓰시오).", "answer": "1.000×2⁻¹ × −1.110×2⁻²\n1. Exponent: −1 + −2 = −3 (biased: 126 + 125 − 127 = 124 = −3 + 127)\n2. 1.000 × 1.110 = 1.110 → 1.110×2⁻³\n3. Normalized, no over/underflow\n4. Round: no change\n5. Sign: + × − = − → −1.110×2⁻³ = −0.21875", "keys": ["지수 −3", "bias 한 번 빼기", "1.110 × 2⁻³", "부호 −", "−0.21875"], "slot": 13, "pts": 6, "lesson": "L3-5", "unit": "U3", "prompt_en": "Using 4-digit binary FP, calculate 0.5 × (−0.4375) in 5 steps (also write the biased exponents).", "keys_en": ["Exponent −3", "Subtract the bias once", "1.110 × 2⁻³", "Sign −", "−0.21875"]}, {"id": "3-fm-2", "concept": "fp-mul", "type": "ox", "prompt": "biased exponent 두 개를 더하면 bias가 두 번 들어가므로 bias를 한 번 빼야 한다.", "answer": true, "lesson": "L3-5", "unit": "U3", "prompt_en": "Adding two biased exponents counts the bias twice, so the bias must be subtracted once."}, {"id": "3-fm-3", "concept": "fp-mul", "type": "mc", "prompt": "FP 곱셈에서 결과의 부호는 언제 정하나 (슬라이드 순서)?", "choices": ["1단계", "2단계", "3단계", "5단계 (마지막)"], "answer": 3, "lesson": "L3-5", "unit": "U3", "prompt_en": "In FP multiplication, when is the sign of the result determined (in the slide's order)?", "choices_en": ["Step 1", "Step 2", "Step 3", "Step 5 (last)"]}, {"id": "3-fi-1", "concept": "fp-instr", "type": "mc", "prompt": "MIPS single precision FP 레지스터는?", "choices": ["$t0–$t9", "$f0–$f31", "$s0–$s7", "HI/LO"], "answer": 1, "lesson": "L3-5", "unit": "U3", "prompt_en": "What are the MIPS single-precision FP registers?"}, {"id": "3-fi-2", "concept": "fp-instr", "type": "ox", "prompt": "Double precision은 FP 레지스터 두 개($f0/$f1)를 짝지어 쓴다.", "answer": true, "lesson": "L3-5", "unit": "U3", "prompt_en": "Double precision uses a pair of FP registers ($f0/$f1)."}, {"id": "4-pi-1", "concept": "proc-intro", "type": "mc", "prompt": "중간고사 범위의 프로세서 구현은?", "choices": ["단순(single-cycle) 버전", "파이프라인 버전", "멀티사이클 버전", "슈퍼스칼라"], "answer": 0, "lesson": "L4-1", "unit": "U4", "prompt_en": "Which processor implementation is in the midterm scope?", "choices_en": ["The simplified (single-cycle) version", "The pipelined version", "The multicycle version", "Superscalar"]}, {"id": "4-pi-2", "concept": "proc-intro", "type": "ox", "prompt": "중간고사 답안에 수업에서 정한 명령어 집합 밖의 명령어를 쓰면 0점 처리된다고 공지됐다.", "answer": true, "lesson": "L4-1", "unit": "U4", "prompt_en": "It was announced that using any instruction outside the instruction set specified in class on the midterm gets zero points."}, {"id": "4-pi-3", "concept": "proc-intro", "type": "mc", "prompt": "week6 p.2의 'Simple subset of instructions'에 '없는' 것은?", "choices": ["lw", "beq", "or", "addi"], "answer": 3, "lesson": "L4-1", "unit": "U4", "prompt_en": "Which is NOT in the 'Simple subset of instructions' on week6 p.2?"}, {"id": "4-es-1", "concept": "exec-steps", "type": "mc", "prompt": "명령어 실행에서 ALU가 계산하는 것이 '아닌' 것은?", "choices": ["산술 결과", "load/store용 메모리 주소", "instruction memory에서 읽은 명령어", "분기 대상 주소"], "answer": 2, "lesson": "L4-1", "unit": "U4", "prompt_en": "In instruction execution, which of the following is NOT calculated by the ALU?", "choices_en": ["The arithmetic result", "The memory address for load/store", "The instruction read from instruction memory", "The branch target address"]}, {"id": "4-es-2", "concept": "exec-steps", "type": "blank", "prompt": "분기하지 않으면 PC ← PC + (a). 명령어 하나는 (b) bit다.", "answer": "(a) 4 / (b) 32", "accept": [["4"], ["32"]], "lesson": "L4-1", "unit": "U4", "prompt_en": "If there is no branch, PC ← PC + (a). One instruction is (b) bits."}, {"id": "4-es-3", "concept": "exec-steps", "type": "ox", "prompt": "명령어 하나(1 word)는 32 byte다.", "answer": false, "explain": "32 bit = 4 byte. 녹음의 '32 bytes'는 말실수.", "lesson": "L4-1", "unit": "U4", "prompt_en": "One instruction (1 word) is 32 bytes.", "explain_en": "32 bits = 4 bytes. The '32 bytes' in the recording was a slip of the tongue."}, {"id": "4-co-1", "concept": "cpu-overview", "type": "short", "prompt": "week6 p.6 'Can't just join wires together'에서 MUX가 필요한 세 곳과 각 MUX가 고르는 두 입력을 쓰시오. (영어로)", "answer": "1. PC input: PC + 4 vs. branch target address\n2. ALU second input: register (Read data 2) vs. sign-extended immediate from the instruction\n3. Register write data: ALU result vs. data read from data memory", "keys": ["PC: PC+4 vs branch target", "ALU 입력: register vs immediate", "쓰기 데이터: ALU vs memory"], "slot": 16, "pts": 9, "lesson": "L4-1", "unit": "U4", "prompt_en": "For week6 p.6 'Can't just join wires together', name the three places where a MUX is needed and the two inputs each MUX selects between. (Answer in English.)", "keys_en": ["PC: PC+4 vs branch target", "ALU input: register vs immediate", "Write data: ALU vs memory"]}, {"id": "4-co-2", "concept": "cpu-overview", "type": "mc", "prompt": "lw에서 ALU 결과는 무엇인가?", "choices": ["레지스터에 쓸 최종 값", "data memory에 접근할 주소", "다음 PC", "분기 오프셋"], "answer": 1, "lesson": "L4-1", "unit": "U4", "prompt_en": "In lw, what is the ALU result?", "choices_en": ["The final value to write to the register", "The address used to access data memory", "The next PC", "The branch offset"]}, {"id": "4-co-3", "concept": "cpu-overview", "type": "ox", "prompt": "서로 다른 출처의 선은 그냥 하나로 연결(join)하면 된다.", "answer": false, "lesson": "L4-1", "unit": "U4", "prompt_en": "Wires from different sources can simply be joined together into one (no selector needed)."}, {"id": "4-ce-1", "concept": "comb-elements", "type": "mc", "prompt": "조합 소자(combinational element)의 특징은?", "choices": ["출력이 현재 입력만의 함수", "값을 저장한다", "클럭 edge에만 바뀐다", "write 신호가 필요하다"], "answer": 0, "lesson": "L4-2", "unit": "U4", "prompt_en": "What is a characteristic of a combinational element (combinational logic)?", "choices_en": ["The output is a function of the current input only", "It stores a value", "It changes only on a clock edge", "It needs a write signal"]}, {"id": "4-ce-2", "concept": "comb-elements", "type": "mc", "prompt": "다음 중 상태(sequential) 소자는?", "choices": ["AND gate", "Multiplexer", "ALU", "Register"], "answer": 3, "lesson": "L4-2", "unit": "U4", "prompt_en": "Which of the following is a state (sequential) element?"}, {"id": "4-ce-3", "concept": "comb-elements", "type": "blank", "prompt": "ALU는 Y = F(A, B)이고, R-format에서 F는 명령어의 맨 아래 6 bit인 (a)로 정해진다.", "answer": "(a) funct", "accept": [["funct", "function", "functioncode", "펑션코드", "funct필드", "funct field"]], "lesson": "L4-2", "unit": "U4", "prompt_en": "The ALU computes Y = F(A, B); for R-format, F is determined by the lowest 6 bits of the instruction, the (a) field."}, {"id": "4-ce-4", "concept": "comb-elements", "type": "ox", "prompt": "32-bit 데이터는 데이터패스에서 선 32개(bus)로 전달된다.", "answer": true, "lesson": "L4-2", "unit": "U4", "prompt_en": "32-bit data is carried in the datapath on 32 wires (a bus)."}, {"id": "4-mx-1", "concept": "mux-basic", "type": "blank", "prompt": "Multiplexer: Y = S ? (a) : (b)", "answer": "(a) I1 / (b) I0", "accept": [["i1"], ["i0"]], "lesson": "L4-2", "unit": "U4"}, {"id": "4-mx-2", "concept": "mux-basic", "type": "mc", "prompt": "MUX의 선택선 S = 0이면?", "choices": ["0번(I0)으로 표시된 입력이 출력", "1번 입력이 출력", "두 입력의 AND", "출력 없음"], "answer": 0, "lesson": "L4-2", "unit": "U4", "prompt_en": "If a MUX's select line S = 0, what happens?", "choices_en": ["The input marked 0 (I0) is the output", "Input 1 is the output", "The AND of the two inputs", "No output"]}, {"id": "4-mx-3", "concept": "mux-basic", "type": "ox", "prompt": "MUX 신호값은 입력선의 위·아래 위치가 아니라 그림에 표시된 번호(0/1)로 정해진다.", "answer": true, "lesson": "L4-2", "unit": "U4", "prompt_en": "A MUX signal value is determined by the number (0/1) marked in the figure, not by whether the input wire is on top or bottom."}, {"id": "4-mx-4", "concept": "mux-basic", "type": "mc", "prompt": "시험의 MUX 그림에서 원하는 입력선 옆에 '1'이 적혀 있다. 선택 신호는?", "choices": ["0", "1", "X", "위치에 따라 다름"], "answer": 1, "lesson": "L4-2", "unit": "U4", "prompt_en": "In a MUX figure on the exam, a '1' is written next to the input wire you want. What is the select signal?", "choices_en": ["0", "1", "X", "Depends on the position"]}, {"id": "4-mx-5", "concept": "mux-basic", "type": "short", "prompt": "MUX의 역할과 데이터패스에 MUX가 필요한 이유를 쓰시오. (영어로)", "answer": "A multiplexer selects one of several inputs according to a select signal (Y = S ? I1 : I0). The datapath needs MUXes because the same component (e.g., ALU input, register write data, next PC) gets data from different sources for different instructions, and wires cannot simply be joined together.", "keys": ["select signal로 입력 하나 선택", "명령어마다 출처가 다름", "선을 그냥 합칠 수 없음"], "slot": 1, "pts": 3, "lesson": "L4-2", "unit": "U4", "prompt_en": "Explain the role of a MUX and why the datapath needs MUXes. (Answer in English.)", "keys_en": ["Selects one input by the select signal", "Different sources for different instructions", "Wires cannot simply be joined"]}, {"id": "4-mx-6", "concept": "mux-basic", "type": "ox", "prompt": "MUX는 조합 소자(combinational element)다.", "answer": true, "lesson": "L4-2", "unit": "U4", "prompt_en": "A MUX is a combinational element (not a state element)."}, {"id": "4-se-1", "concept": "seq-elements", "type": "mc", "prompt": "Edge-triggered register가 값을 갱신하는 시점은 (슬라이드 기준)?", "choices": ["Clk이 1인 동안 계속", "Clk이 0 → 1로 바뀔 때", "Clk이 1 → 0으로 바뀔 때만", "Write가 0일 때"], "answer": 1, "lesson": "L4-2", "unit": "U4", "prompt_en": "When does an edge-triggered register update its value (according to the slide)?", "choices_en": ["Continuously while Clk is 1", "When Clk changes from 0 → 1", "Only when Clk changes from 1 → 0", "When Write is 0"]}, {"id": "4-se-2", "concept": "seq-elements", "type": "ox", "prompt": "Write control이 있는 레지스터는 clock edge이면서 write 입력이 1일 때만 값을 바꾼다.", "answer": true, "lesson": "L4-2", "unit": "U4", "prompt_en": "A register with write control changes its value only on a clock edge when the write input is 1."}, {"id": "4-se-3", "concept": "seq-elements", "type": "blank", "prompt": "레지스터 파일의 write contr
