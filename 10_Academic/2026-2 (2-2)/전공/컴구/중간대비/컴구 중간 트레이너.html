<\/ul><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 2-2<\/span><br>Memory is aligned, so think of it like an array: desired address = base + index × 4.<\/div><\/section>\n<section class=\"sec\" id=\"s-endian\"><h3>Big Endian vs Little Endian<\/h3><ul><li><b>Big endian<\/b>: the MSB (most significant byte) is stored at the <b>lowest memory address<\/b>.<\/li><li><b>Little endian<\/b>: the LSB (least significant byte) is stored at the <b>lowest memory address<\/b>.<\/li><\/ul>\n<p>0x12345678 stored at addresses 0–3:<\/p>\n<div class=\"tblw\"><table><thead><tr><th>Address<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><\/tr><\/thead><tbody><tr><td>Big endian<\/td><td>12<\/td><td>34<\/td><td>56<\/td><td>78<\/td><\/tr><tr><td>Little endian<\/td><td>78<\/td><td>56<\/td><td>34<\/td><td>12<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout trap\">Trap: Two hex digits are <b>1 byte<\/b>. Even in little endian, do not reverse the two digits inside a byte (writing 78 as 87 is wrong). The professor stressed this twice.<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 2-2<\/span><br>Two hex digits make one number (byte). Even in little endian, <b>never swap the order of the two digits<\/b> (writing 78 as 87 is wrong).<\/div><\/section>\n<section class=\"sec\" id=\"s-lw-sw\"><h3>lw / sw<\/h3><p><code>lw dest, offset(base)<\/code>  ·  <code>sw src, offset(base)<\/code><\/p>\n<ul><li>Three operands: a register, an <b>offset (constant, in bytes)<\/b>, and a base address (register).<\/li><li>In sw the first register is the <b>source<\/b> (the value written to memory).<\/li><\/ul>\n<p>Slide example 1: <code>g = h + A[8];<\/code> (g:$s1, h:$s2, base of A:$s3)<\/p>\n<pre class=\"code\">lw  $t0, 32($s3)      # offset = 8 × 4 = 32\nadd $s1, $s2, $t0<\/pre>\n<p>Slide example 2: <code>A[12] = h + A[8];<\/code><\/p>\n<pre class=\"code\">lw  $t0, 32($s3)\nadd $t0, $s2, $t0\nsw  $t0, 48($s3)      # 12 × 4 = 48<\/pre>\n<div class=\"callout trap\">Trap: <b>The offset must be a constant.<\/b> Putting a register in the offset position gets <b>zero points<\/b> even if the logic is right, and in a True/False question it is always False. If the index is a variable, compute the address first (<code>sll<\/code>, <code>add<\/code>), then use <code>lw $t0, 0($t1)<\/code>.<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 2-2 · Week 3-1<\/span><br>In lw the first variable is the destination; in sw the first variable is the <b>source<\/b>. offset = index × word size (4).<\/div><\/section>\n<section class=\"sec\" id=\"s-reg-vs-mem\"><h3>Registers vs Memory<\/h3><ul><li>Registers are much faster than memory and easier to use.<\/li><li>Operating on memory data requires loads and stores → more instructions executed.<\/li><li>The compiler must use registers for variables as much as possible and only <b>spill<\/b> to memory for less frequently used variables. Register optimization is important for efficiency.<\/li><\/ul><\/section>"}, {"id": "L2-3", "title": "상수 · 2의 보수 · 부호 확장 · 16진수", "src": "week3 p.15–23", "exam": "2의 보수·부호확장", "secs": [{"id": "immediate", "title": "Immediate 피연산자와 $zero", "title_en": "Immediate Operands and $zero"}, {"id": "twos", "title": "Unsigned와 2의 보수", "title_en": "Unsigned and Two's Complement"}, {"id": "negation", "title": "부호 반전: Complement and add 1", "title_en": "Signed Negation: Complement and Add 1"}, {"id": "sign-ext", "title": "부호 확장 (Sign extension)", "title_en": "Sign Extension"}, {"id": "hex", "title": "16진수", "title_en": "Hexadecimal"}], "md": "## Immediate 피연산자와 $zero {#immediate}\n\n`addi $s3, $s3, 4` — 명령어 안에 상수를 직접 넣음.\n\n- **subtract immediate는 없다** → 음수 상수로 addi: `addi $s2, $s1, -1`.\n- **Design Principle 3: Make the common case fast** — 작은 상수가 흔하므로, immediate가 load를 없애 준다.\n- **$zero (레지스터 0)** = 항상 상수 0, **덮어쓸 수 없음**.\n- 레지스터 복사(move): `add $t2, $s1, $zero`\n\n> 함정: 복사는 **`add` + `$zero`**. `addi`에 `$zero`(레지스터)를 상수 자리처럼 넣으면 0점 (교수님 4주-2). `$zero`는 상수가 아니라 레지스터.\n\n## Unsigned와 2의 보수 {#twos}\n\n- **Unsigned** n-bit: `x = x_{n-1}2^{n-1} + … + x_0 2^0`, 범위 **0 ~ 2ⁿ − 1** (32-bit 최대 4,294,967,295).\n- **2's complement** n-bit: `x = −x_{n-1}2^{n-1} + x_{n-2}2^{n-2} + … + x_0 2^0`, 범위 **−2^{n−1} ~ 2^{n−1} − 1**.\n  - bit 31 = sign bit (1 음수, 0 음이 아님). 음이 아닌 수는 unsigned와 표현이 같음.\n  - `1111…1111` = −1, `1000…0000` = −2,147,483,648, `0111…1111` = 2,147,483,647.\n\n## 부호 반전: Complement and add 1 {#negation}\n\n`x + x̄ = 1111…1111₂ = −1` 이므로 `x̄ + 1 = −x`.\n\n예: +2 = `0000 … 0010` → 반전 `1111 … 1101` → +1 → `1111 … 1110` = −2.\n\n수업 예제: −10 (32-bit)\n```\n+10 = 0000 0000 0000 0000 0000 0000 0000 1010\n반전 = 1111 1111 1111 1111 1111 1111 1111 0101\n +1  = 1111 1111 1111 1111 1111 1111 1111 0110   (= 0xFFFFFFF6)\n```\n\n## 부호 확장 (Sign extension) {#sign-ext}\n\n더 많은 비트로 표현할 때 **값을 보존**: **sign bit를 왼쪽으로 복제**.\n\n- MIPS에서 쓰는 곳: `addi`(immediate 확장), `lb`·`lh`(로드한 byte/halfword), **`beq`·`bne`(변위 확장)**.\n- 8-bit → 16-bit: +2 = `0000 0010` → `0000 0000 0000 0010`, −2 = `1111 1110` → `1111 1111 1111 1110`.\n\n> 함정: 교안 p.21에는 −2의 확장 결과가 `1111 1111 1000 0010`으로 적혀 있는데 **오타**. 올바른 값은 `1111 1111 1111 1110`.\n\n## 16진수 {#hex}\n\n16진수 한 자리 = 4 bit. 표: 0=0000 … 9=1001, a=1010, b=1011, c=1100, d=1101, e=1110, f=1111.\n\n예: `eca8 6420` → `1110 1100 1010 1000 0110 0100 0010 0000`", "html": "<section class=\"sec\" id=\"s-immediate\"><h3>Immediate 피연산자와 $zero<\/h3><p><code>addi $s3, $s3, 4<\/code> — 명령어 안에 상수를 직접 넣음.<\/p>\n<ul><li><b>subtract immediate는 없다<\/b> → 음수 상수로 addi: <code>addi $s2, $s1, -1<\/code>.<\/li><li><b>Design Principle 3: Make the common case fast<\/b> — 작은 상수가 흔하므로, immediate가 load를 없애 준다.<\/li><li><b>$zero (레지스터 0)<\/b> = 항상 상수 0, <b>덮어쓸 수 없음<\/b>.<\/li><li>레지스터 복사(move): <code>add $t2, $s1, $zero<\/code><\/li><\/ul>\n<div class=\"callout trap\">함정: 복사는 <b><code>add<\/code> + <code>$zero<\/code><\/b>. <code>addi<\/code>에 <code>$zero<\/code>(레지스터)를 상수 자리처럼 넣으면 0점 (교수님 4주-2). <code>$zero<\/code>는 상수가 아니라 레지스터.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">03주-1 · 04주-2<\/span><br>subtract immediate는 없고 음수 상수로 addi. $zero는 덮어쓸 수 없다. 레지스터 복사는 add + $zero이고, 'you should never use the addition immediate when adding zero … you will get zero points'.<\/div><\/section>\n<section class=\"sec\" id=\"s-twos\"><h3>Unsigned와 2의 보수<\/h3><ul><li><b>Unsigned<\/b> n-bit: <code>x = x_{n-1}2^{n-1} + … + x_0 2^0<\/code>, 범위 <b>0 ~ 2ⁿ − 1<\/b> (32-bit 최대 4,294,967,295).<\/li><li><b>2's complement<\/b> n-bit: <code>x = −x_{n-1}2^{n-1} + x_{n-2}2^{n-2} + … + x_0 2^0<\/code>, 범위 <b>−2^{n−1} ~ 2^{n−1} − 1<\/b>.<ul><li>bit 31 = sign bit (1 음수, 0 음이 아님). 음이 아닌 수는 unsigned와 표현이 같음.<\/li><li><code>1111…1111<\/code> = −1, <code>1000…0000<\/code> = −2,147,483,648, <code>0111…1111<\/code> = 2,147,483,647.<\/li><\/ul><\/li><\/ul><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">03주-1<\/span><br>첫 비트가 부호: 0이면 양수, 1이면 음수. x와 x̄를 더하면 모든 비트가 1 = −1이라서 −x = x̄ + 1.<\/div><\/section>\n<section class=\"sec\" id=\"s-negation\"><h3>부호 반전: Complement and add 1<\/h3><p><code>x + x̄ = 1111…1111₂ = −1<\/code> 이므로 <code>x̄ + 1 = −x<\/code>.<\/p>\n<p>예: +2 = <code>0000 … 0010<\/code> → 반전 <code>1111 … 1101<\/code> → +1 → <code>1111 … 1110<\/code> = −2.<\/p>\n<p>수업 예제: −10 (32-bit)<\/p>\n<pre class=\"code\">+10 = 0000 0000 0000 0000 0000 0000 0000 1010\n반전 = 1111 1111 1111 1111 1111 1111 1111 0101\n +1  = 1111 1111 1111 1111 1111 1111 1111 0110   (= 0xFFFFFFF6)<\/pre><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">03주-1<\/span><br>−10 예제: +10을 32비트로 쓰고 → 0과 1을 전부 뒤집고 → 1을 더한다. 결과가 1로 시작하니 음수임을 확인.<\/div><\/section>\n<section class=\"sec\" id=\"s-sign-ext\"><h3>부호 확장 (Sign extension)<\/h3><p>더 많은 비트로 표현할 때 <b>값을 보존<\/b>: <b>sign bit를 왼쪽으로 복제<\/b>.<\/p>\n<ul><li>MIPS에서 쓰는 곳: <code>addi<\/code>(immediate 확장), <code>lb<\/code>·<code>lh<\/code>(로드한 byte/halfword), <b><code>beq<\/code>·<code>bne<\/code>(변위 확장)<\/b>.<\/li><li>8-bit → 16-bit: +2 = <code>0000 0010<\/code> → <code>0000 0000 0000 0010<\/code>, −2 = <code>1111 1110<\/code> → <code>1111 1111 1111 1110<\/code>.<\/li><\/ul>\n<div class=\"callout trap\">함정: 교안 p.21에는 −2의 확장 결과가 <code>1111 1111 1000 0010<\/code>으로 적혀 있는데 <b>오타<\/b>. 올바른 값은 <code>1111 1111 1111 1110<\/code>.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">03주-1<\/span><br>작은 비트를 큰 비트로 늘릴 때 위쪽을 부호로 채운다. '학기 후반에 더 중요해진다'고 예고 → 6주 데이터패스(lw offset, beq)에서 실제로 사용.<\/div><\/section>\n<section class=\"sec\" id=\"s-hex\"><h3>16진수<\/h3><p>16진수 한 자리 = 4 bit. 표: 0=0000 … 9=1001, a=1010, b=1011, c=1100, d=1101, e=1110, f=1111.<\/p>\n<p>예: <code>eca8 6420<\/code> → <code>1110 1100 1010 1000 0110 0100 0010 0000<\/code><\/p><\/section>", "title_en": "Constants · Two's Complement · Sign Extension · Hexadecimal", "exam_en": "Two's complement and sign extension", "html_en": "<section class=\"sec\" id=\"s-immediate\"><h3>Immediate Operands and $zero<\/h3><p><code>addi $s3, $s3, 4<\/code> — the constant is placed directly in the instruction.<\/p>\n<ul><li><b>There is no subtract immediate<\/b> → use addi with a negative constant: <code>addi $s2, $s1, -1<\/code>.<\/li><li><b>Design Principle 3: Make the common case fast<\/b> — small constants are common, and an immediate operand avoids a load instruction.<\/li><li><b>$zero (register 0)<\/b> = always the constant 0, <b>cannot be overwritten<\/b>.<\/li><li>Copying a register (move): <code>add $t2, $s1, $zero<\/code><\/li><\/ul>\n<div class=\"callout trap\">Trap: A copy is <b><code>add<\/code> + <code>$zero<\/code><\/b>. Using <code>addi<\/code> with <code>$zero<\/code> (a register) as if it were the constant gets zero points (the professor, Week 4-2). <code>$zero<\/code> is a register, not a constant.<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 3-1 · Week 4-2<\/span><br>There is no subtract immediate; use addi with a negative constant. $zero cannot be overwritten. Copying a register is add + $zero, and 'you should never use the addition immediate when adding zero … you will get zero points'.<\/div><\/section>\n<section class=\"sec\" id=\"s-twos\"><h3>Unsigned and Two's Complement<\/h3><ul><li><b>Unsigned<\/b> n-bit: <code>x = x_{n-1}2^{n-1} + … + x_0 2^0<\/code>, range <b>0 to 2ⁿ − 1<\/b> (32-bit max 4,294,967,295).<\/li><li><b>2's complement<\/b> n-bit: <code>x = −x_{n-1}2^{n-1} + x_{n-2}2^{n-2} + … + x_0 2^0<\/code>, range <b>−2^{n−1} to 2^{n−1} − 1<\/b>.<ul><li>bit 31 = sign bit (1 = negative, 0 = non-negative). Non-negative numbers have the same representation as unsigned.<\/li><li><code>1111…1111<\/code> = −1, <code>1000…0000<\/code> = −2,147,483,648, <code>0111…1111<\/code> = 2,147,483,647.<\/li><\/ul><\/li><\/ul><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 3-1<\/span><br>The first bit is the sign: 0 means positive, 1 means negative. Adding x and x̄ gives all 1s = −1, so −x = x̄ + 1.<\/div><\/section>\n<section class=\"sec\" id=\"s-negation\"><h3>Signed Negation: Complement and Add 1<\/h3><p>Since <code>x + x̄ = 1111…1111₂ = −1<\/code>, we get <code>x̄ + 1 = −x<\/code>.<\/p>\n<p>Example: +2 = <code>0000 … 0010<\/code> → invert <code>1111 … 1101<\/code> → +1 → <code>1111 … 1110<\/code> = −2.<\/p>\n<p>Class example: −10 (32-bit)<\/p>\n<pre class=\"code\">+10 = 0000 0000 0000 0000 0000 0000 0000 1010\ninv = 1111 1111 1111 1111 1111 1111 1111 0101\n +1  = 1111 1111 1111 1111 1111 1111 1111 0110   (= 0xFFFFFFF6)<\/pre><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 3-1<\/span><br>−10 example: write +10 in 32 bits → flip every 0 and 1 → add 1. The result starts with 1, confirming it is negative.<\/div><\/section>\n<section class=\"sec\" id=\"s-sign-ext\"><h3>Sign Extension<\/h3><p>Representing a number using more bits while <b>preserving its value<\/b>: <b>replicate the sign bit to the left<\/b>.<\/p>\n<ul><li>Used in MIPS by: <code>addi<\/code> (extends the immediate), <code>lb<\/code>·<code>lh<\/code> (extend the loaded byte/halfword), <b><code>beq<\/code>·<code>bne<\/code> (extend the displacement)<\/b>.<\/li><li>8-bit → 16-bit: +2 = <code>0000 0010<\/code> → <code>0000 0000 0000 0010<\/code>, −2 = <code>1111 1110<\/code> → <code>1111 1111 1111 1110<\/code>.<\/li><\/ul>\n<div class=\"callout trap\">Trap: Slide p.21 shows the extended −2 as <code>1111 1111 1000 0010<\/code>; that is a <b>typo<\/b>. The correct value is <code>1111 1111 1111 1110<\/code>.<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 3-1<\/span><br>When extending a smaller bit width to a larger one, fill the upper bits with the sign. He foreshadowed that 'this becomes more important later in the semester' → actually used in the Week 6 datapath (lw offset, beq).<\/div><\/section>\n<section class=\"sec\" id=\"s-hex\"><h3>Hexadecimal<\/h3><p>One hex digit = 4 bits. Table: 0=0000 … 9=1001, a=1010, b=1011, c=1100, d=1101, e=1110, f=1111.<\/p>\n<p>Example: <code>eca8 6420<\/code> → <code>1110 1100 1010 1000 0110 0100 0010 0000<\/code><\/p><\/section>"}, {"id": "L2-4", "title": "명령어 인코딩: R-format · I-format", "src": "week3 p.22–28", "exam": "명령어 → 이진/16진", "secs": [{"id": "encoding-basics", "title": "명령어 표현의 기본", "title_en": "Representing Instructions"}, {"id": "r-format", "title": "R-format", "title_en": "R-format"}, {"id": "i-format", "title": "I-format", "title_en": "I-format"}, {"id": "encode-example", "title": "인코딩 예제: A[300] = h + A[300]", "title_en": "Encoding Example: A[300] = h + A[300]"}], "md": "## 명령어 표현의 기본 {#encoding-basics}\n\n- 명령어는 **32-bit 이진수(machine code)**로 인코딩. 형식 수를 적게 → **Regularity**.\n- **opcode**: 앞 6 bit. 어떤 형식의 명령어인지 알려 줘서 나머지를 해석할 준비를 시킴.\n- 레지스터 번호: `$t0–$t7` = 8–15, `$s0–$s7` = 16–23, `$t8–$t9` = 24–25 (그 외: $zero 0, $v0–$v1 2–3, $a0–$a3 4–7, $gp 28, $sp 29, $fp 30, $ra 31).\n\n## R-format {#r-format}\n\n| op | rs | rt | rd | shamt | funct |\n|---|---|---|---|---|---|\n| 6 bits | 5 | 5 | 5 | 5 | 6 bits |\n\n- **op = 항상 0** (연산 종류는 funct가 결정).\n- rs: 첫 번째 source, rt: 두 번째 source, **rd: destination**, shamt: shift amount (지금은 0), funct: function code (opcode 확장).\n- funct 값은 시험에서 **주어짐** (외울 필요 없음). 참고: add 32, sub 34, and 36, or 37, slt 42.\n\n예: `add $t0, $s1, $s2`\n```\nop      rs     rt     rd     shamt  funct\n000000  10001  10010  01000  00000  100000\n0       17     18     8      0      32\n= 0000 0010 0011 0010 0100 0000 0010 0000₂ = 0x02324020\n```\n\n> 함정: 어셈블리는 **dest, src, src** 순서, 기계어는 **rs, rt, rd** (source 먼저, destination 나중). 교수님이 3주·6주 두 번 다 강조.\n\n## I-format {#i-format}\n\n| op | rs | rt | constant or address |\n|---|---|---|---|\n| 6 bits | 5 | 5 | 16 bits |\n\n- immediate 산술과 load/store. **rt = destination(lw, addi) 또는 source(sw)**.\n- constant: −2¹⁵ ~ +2¹⁵ − 1. address: rs의 base address에 더해지는 offset.\n- 예: addi, lw, sw, beq, bne, slti, andi, ori, lui. opcode 참고: lw 35, sw 43, beq 4, bne 5, addi 8.\n- **Design Principle 4: Good design demands good compromises** — 형식이 여러 개면 해석이 복잡하지만 모든 명령어를 32-bit로 통일할 수 있음. 형식은 최대한 비슷하게.\n\n## 인코딩 예제: A[300] = h + A[300] {#encode-example}\n\n`$t1` = A의 base, `$s2` = h.\n```\nlw  $t0, 1200($t1)     # 300 × 4 = 1200\nadd $t0, $s2, $t0\nsw  $t0, 1200($t1)\n```\n\n| 명령어 | op | rs | rt | rd | shamt | funct / address |\n|---|---|---|---|---|---|---|\n| lw | 35 | 9 | 8 | | | 1200 |\n| add | 0 | 18 | 8 | 8 | 0 | 32 |\n| sw | 43 | 9 | 8 | | | 1200 |\n\n이진: lw = `100011 01001 01000 0000 0100 1011 0000`, sw는 op만 `101011`.", "html": "<section class=\"sec\" id=\"s-encoding-basics\"><h3>명령어 표현의 기본<\/h3><ul><li>명령어는 <b>32-bit 이진수(machine code)<\/b>로 인코딩. 형식 수를 적게 → <b>Regularity<\/b>.<\/li><li><b>opcode<\/b>: 앞 6 bit. 어떤 형식의 명령어인지 알려 줘서 나머지를 해석할 준비를 시킴.<\/li><li>레지스터 번호: <code>$t0–$t7<\/code> = 8–15, <code>$s0–$s7<\/code> = 16–23, <code>$t8–$t9<\/code> = 24–25 (그 외: $zero 0, $v0–$v1 2–3, $a0–$a3 4–7, $gp 28, $sp 29, $fp 30, $ra 31).<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-r-format\"><h3>R-format<\/h3><div class=\"tblw\"><table><thead><tr><th>op<\/th><th>rs<\/th><th>rt<\/th><th>rd<\/th><th>shamt<\/th><th>funct<\/th><\/tr><\/thead><tbody><tr><td>6 bits<\/td><td>5<\/td><td>5<\/td><td>5<\/td><td>5<\/td><td>6 bits<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><b>op = 항상 0<\/b> (연산 종류는 funct가 결정).<\/li><li>rs: 첫 번째 source, rt: 두 번째 source, <b>rd: destination<\/b>, shamt: shift amount (지금은 0), funct: function code (opcode 확장).<\/li><li>funct 값은 시험에서 <b>주어짐<\/b> (외울 필요 없음). 참고: add 32, sub 34, and 36, or 37, slt 42.<\/li><\/ul>\n<p>예: <code>add $t0, $s1, $s2<\/code><\/p>\n<pre class=\"code\">op      rs     rt     rd     shamt  funct\n000000  10001  10010  01000  00000  100000\n0       17     18     8      0      32\n= 0000 0010 0011 0010 0100 0000 0010 0000₂ = 0x02324020<\/pre>\n<div class=\"callout trap\">함정: 어셈블리는 <b>dest, src, src<\/b> 순서, 기계어는 <b>rs, rt, rd<\/b> (source 먼저, destination 나중). 교수님이 3주·6주 두 번 다 강조.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">03주-1<\/span><br>'You should mind that the order is twisted' — 어셈블리는 dest 먼저, 기계어는 rs, rt, rd. funct 값은 시험에서 주어지니 외울 필요 없다.<\/div><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-1:24\">▶ 06주-1 19:54 R-format 필드<\/button><button class=\"btn sm ghost\" data-walk=\"w6-1:25\">▶ 06주-1 20:32 add $t0, $s1, $s2 인코딩<\/button><button class=\"btn sm ghost\" data-walk=\"w6-2:27\">▶ 06주-2 31:16 R-format 다시: 순서 주의, add = 32<\/button><\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w3-p25.jpg\" aria-label=\"크게 보기\"><img src=\"img/w3-p25.jpg\" alt=\"week3 p.25 · R-format 필드와 add $t0,$s1,$s2 인코딩\" loading=\"lazy\"><\/button><figcaption>week3 p.25 · R-format 필드와 add $t0,$s1,$s2 인코딩<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-i-format\"><h3>I-format<\/h3><div class=\"tblw\"><table><thead><tr><th>op<\/th><th>rs<\/th><th>rt<\/th><th>constant or address<\/th><\/tr><\/thead><tbody><tr><td>6 bits<\/td><td>5<\/td><td>5<\/td><td>16 bits<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>immediate 산술과 load/store. <b>rt = destination(lw, addi) 또는 source(sw)<\/b>.<\/li><li>constant: −2¹⁵ ~ +2¹⁵ − 1. address: rs의 base address에 더해지는 offset.<\/li><li>예: addi, lw, sw, beq, bne, slti, andi, ori, lui. opcode 참고: lw 35, sw 43, beq 4, bne 5, addi 8.<\/li><li><b>Design Principle 4: Good design demands good compromises<\/b> — 형식이 여러 개면 해석이 복잡하지만 모든 명령어를 32-bit로 통일할 수 있음. 형식은 최대한 비슷하게.<\/li><\/ul><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">03주-1<\/span><br>I-format은 rd·shamt가 없어서 상수에 16비트를 쓸 수 있다. 그래서 32비트와 맞추는 sign extension이 필요.<\/div><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-1:27\">▶ 06주-1 22:24 I-format 필드<\/button><\/div><\/section>\n<section class=\"sec\" id=\"s-encode-example\"><h3>인코딩 예제: A[300] = h + A[300]<\/h3><p><code>$t1<\/code> = A의 base, <code>$s2<\/code> = h.<\/p>\n<pre class=\"code\">lw  $t0, 1200($t1)     # 300 × 4 = 1200\nadd $t0, $s2, $t0\nsw  $t0, 1200($t1)<\/pre>\n<div class=\"tblw\"><table><thead><tr><th>명령어<\/th><th>op<\/th><th>rs<\/th><th>rt<\/th><th>rd<\/th><th>shamt<\/th><th>funct / address<\/th><\/tr><\/thead><tbody><tr><td>lw<\/td><td>35<\/td><td>9<\/td><td>8<\/td><td><\/td><td><\/td><td>1200<\/td><\/tr><tr><td>add<\/td><td>0<\/td><td>18<\/td><td>8<\/td><td>8<\/td><td>0<\/td><td>32<\/td><\/tr><tr><td>sw<\/td><td>43<\/td><td>9<\/td><td>8<\/td><td><\/td><td><\/td><td>1200<\/td><\/tr><\/tbody><\/table><\/div>\n<p>이진: lw = <code>100011 01001 01000 0000 0100 1011 0000<\/code>, sw는 op만 <code>101011<\/code>.<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">03주-1<\/span><br>A[300] 예제: 300 × 4 = 1200. lw opcode 35, sw opcode 43(10진수). 이렇게 어셈블리가 기계어로 인코딩된다.<\/div><\/section>", "title_en": "Instruction Encoding: R-format · I-format", "exam_en": "Instruction → binary/hex", "html_en": "<section class=\"sec\" id=\"s-encoding-basics\"><h3>Representing Instructions<\/h3><ul><li>Instructions are encoded as <b>32-bit binary numbers (machine code)<\/b>. Keep the number of formats small → <b>regularity<\/b>.<\/li><li><b>opcode<\/b>: the first 6 bits. It tells which format the instruction has, so the rest can be interpreted.<\/li><li>Register numbers: <code>$t0–$t7<\/code> = 8–15, <code>$s0–$s7<\/code> = 16–23, <code>$t8–$t9<\/code> = 24–25 (others: $zero 0, $v0–$v1 2–3, $a0–$a3 4–7, $gp 28, $sp 29, $fp 30, $ra 31).<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-r-format\"><h3>R-format<\/h3><div class=\"tblw\"><table><thead><tr><th>op<\/th><th>rs<\/th><th>rt<\/th><th>rd<\/th><th>shamt<\/th><th>funct<\/th><\/tr><\/thead><tbody><tr><td>6 bits<\/td><td>5<\/td><td>5<\/td><td>5<\/td><td>5<\/td><td>6 bits<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><b>op = always 0<\/b> (the funct field selects the operation).<\/li><li>rs: first source register, rt: second source register, <b>rd: destination register<\/b>, shamt: shift amount (0 for now), funct: function code (extends the opcode).<\/li><li>funct values are <b>given<\/b> in the exam (no need to memorize). For reference: add 32, sub 34, and 36, or 37, slt 42.<\/li><\/ul>\n<p>Example: <code>add $t0, $s1, $s2<\/code><\/p>\n<pre class=\"code\">op      rs     rt     rd     shamt  funct\n000000  10001  10010  01000  00000  100000\n0       17     18     8      0      32\n= 0000 0010 0011 0010 0100 0000 0010 0000₂ = 0x02324020<\/pre>\n<div class=\"callout trap\">Trap: Assembly order is <b>dest, src, src<\/b>, but machine code order is <b>rs, rt, rd<\/b> (sources first, destination last). The professor stressed this in both Week 3 and Week 6.<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 3-1<\/span><br>'You should mind that the order is twisted' — assembly puts dest first; machine code is rs, rt, rd. funct values are given on the exam, so no need to memorize them.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w3-p25.jpg\" aria-label=\"Enlarge\"><img src=\"img/w3-p25.jpg\" alt=\"week3 p.25 · R-format fields and the encoding of add $t0,$s1,$s2\" loading=\"lazy\"><\/button><figcaption>week3 p.25 · R-format fields and the encoding of add $t0,$s1,$s2<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-i-format\"><h3>I-format<\/h3><div class=\"tblw\"><table><thead><tr><th>op<\/th><th>rs<\/th><th>rt<\/th><th>constant or address<\/th><\/tr><\/thead><tbody><tr><td>6 bits<\/td><td>5<\/td><td>5<\/td><td>16 bits<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Immediate arithmetic and load/store. <b>rt = destination (lw, addi) or source (sw)<\/b>.<\/li><li>constant: −2¹⁵ to +2¹⁵ − 1. address: an offset added to the base address in rs.<\/li><li>Examples: addi, lw, sw, beq, bne, slti, andi, ori, lui. Opcodes for reference: lw 35, sw 43, beq 4, bne 5, addi 8.<\/li><li><b>Design Principle 4: Good design demands good compromises<\/b> — different formats complicate decoding, but allow all instructions to be 32 bits uniformly. Keep formats as similar as possible.<\/li><\/ul><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 3-1<\/span><br>I-format has no rd or shamt, so 16 bits can be used for the constant. That is why sign extension is needed to match 32 bits.<\/div><\/section>\n<section class=\"sec\" id=\"s-encode-example\"><h3>Encoding Example: A[300] = h + A[300]<\/h3><p><code>$t1<\/code> = base of A, <code>$s2<\/code> = h.<\/p>\n<pre class=\"code\">lw  $t0, 1200($t1)     # 300 × 4 = 1200\nadd $t0, $s2, $t0\nsw  $t0, 1200($t1)<\/pre>\n<div class=\"tblw\"><table><thead><tr><th>Instruction<\/th><th>op<\/th><th>rs<\/th><th>rt<\/th><th>rd<\/th><th>shamt<\/th><th>funct / address<\/th><\/tr><\/thead><tbody><tr><td>lw<\/td><td>35<\/td><td>9<\/td><td>8<\/td><td><\/td><td><\/td><td>1200<\/td><\/tr><tr><td>add<\/td><td>0<\/td><td>18<\/td><td>8<\/td><td>8<\/td><td>0<\/td><td>32<\/td><\/tr><tr><td>sw<\/td><td>43<\/td><td>9<\/td><td>8<\/td><td><\/td><td><\/td><td>1200<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Binary: lw = <code>100011 01001 01000 0000 0100 1011 0000<\/code>; sw differs only in op, <code>101011<\/code>.<\/p><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 3-1<\/span><br>A[300] example: 300 × 4 = 1200. lw opcode 35, sw opcode 43 (decimal). This is how assembly is encoded into machine code.<\/div><\/section>"}, {"id": "L2-5", "title": "논리 연산 · 조건 분기 · if/while", "src": "week3 p.30–40 · week4 p.2", "exam": "if·while 컴파일", "secs": [{"id": "shift", "title": "Shift 연산", "title_en": "Shift Operations"}, {"id": "and-or-nor", "title": "AND · OR · NOR", "title_en": "AND · OR · NOR"}, {"id": "branch-instr", "title": "분기 명령어", "title_en": "Branch Instructions"}, {"id": "if-else", "title": "if-else 컴파일", "title_en": "Compiling if-else"}, {"id": "while-loop", "title": "while 루프 컴파일", "title_en": "Compiling a while Loop"}, {"id": "slt", "title": "slt / slti / sltu", "title_en": "slt / slti / sltu"}, {"id": "branch-design", "title": "왜 blt, bge가 없나", "title_en": "Why There Is No blt or bge"}], "md": "## Shift 연산 {#shift}\n\n| 연산 | C | Java | MIPS |\n|---|---|---|---|\n| Shift left | << | << | **sll** |\n| Shift right | >> | >>> | **srl** |\n| Bitwise AND/OR/NOT | & \\| ~ | & \\| ~ | and, andi / or, ori / **nor** |\n\n- R-format의 **shamt**에 몇 칸 밀지 들어감.\n- **sll i** = 2^i 곱하기 (오른쪽을 0으로 채움). **srl i** = 2^i 나누기, **unsigned만**.\n\n> 함정: srl은 왼쪽을 0으로 채우므로 음수(2의 보수)에 쓰면 부호가 깨진다 (교수님: \"you should not just perform this operation on a signed number\").\n\n## AND · OR · NOR {#and-or-nor}\n\n- **AND**: 마스킹. 원하는 비트만 남기고 나머지 0.\n- **OR**: 원하는 비트를 1로, 나머지 유지.\n- **NOT**은 MIPS에 없음 → **NOR 3-operand**: `nor $t0, $t1, $zero` = NOT $t1.\n\n예 ($t1 = 0…0011 1100 0000 0000, $t2 = 0…0000 1101 1100 0000):\n- `and $t0,$t1,$t2` → 0…0000 1100 0000 0000\n- `or $t0,$t1,$t2` → 0…0011 1101 1100 0000\n\n## 분기 명령어 {#branch-instr}\n\n- `beq rs, rt, L1`: rs == rt면 L1로.\n- `bne rs, rt, L1`: rs != rt면 L1로.\n- `j L1`: 무조건 L1로 점프.\n\n## if-else 컴파일 {#if-else}\n\n`if (i == j) f = g + h; else f = g - h;` (f, g, h, i, j = $s0–$s4)\n```\n      bne $s3, $s4, Else    # i != j 이면 else로\n      add $s0, $s1, $s2     # f = g + h\n      j   Exit\nElse: sub $s0, $s1, $s2     # f = g - h\nExit:\n```\n조건을 **반대로** 검사해서 else로 건너뛰는 게 요령 (i == j면 bne가 안 걸려서 if 블록 실행).\n\n## while 루프 컴파일 {#while-loop}\n\n`while (save[i] == k) i += 1;` (i: $s3, k: $s5, save의 base: $s6)\n```\nLoop: sll  $t1, $s3, 2      # t1 = i * 4\n      add  $t1, $t1, $s6    # t1 = &save[i]\n      lw   $t0, 0($t1)      # t0 = save[i]\n      bne  $t0, $s5, Exit   # save[i] != k 이면 탈출\n      addi $s3, $s3, 1      # i += 1\n      j    Loop\nExit:\n```\n> 함정: 인덱스가 변수(i)라서 `lw $t0, $t1($s6)`처럼 쓰고 싶어도 **안 됨**. 주소를 먼저 계산하고 offset은 0. OX에서 \"offset에 레지스터\" = False.\n\n## slt / slti / sltu {#slt}\n\n- `slt rd, rs, rt`: rs < rt면 rd = 1, 아니면 0.\n- `slti rt, rs, constant`: rs < constant면 rt = 1.\n- beq/bne와 조합해서 모든 비교(==, !=, <, <=, >, >=)를 만든다.\n```\nslt $t0, $s1, $s2       # $s1 < $s2 면 $t0 = 1\nbne $t0, $zero, L       # 1 != 0 이면 L로\n```\n- **Signed vs Unsigned**: slt/slti = signed, sltu/sltiu = unsigned.\n  $s0 = 1111…1111, $s1 = 0000…0001일 때 `slt` → −1 < +1 → $t0 = 1, `sltu` → 4,294,967,295 > 1 → $t0 = 0.\n\n## 왜 blt, bge가 없나 {#branch-design}\n\n- 하드웨어에서 <, > 비교는 =, ≠보다 느림.\n- 분기와 합치면 명령어당 일이 많아져 **클럭이 느려짐 → 모든 명령어가 손해**.\n- 좋은 절충: **beq, bne** + slt 조합. (`blt`는 assembler의 pseudo-instruction으로 `slt` + `bne`로 바뀜.)", "html": "<section class=\"sec\" id=\"s-shift\"><h3>Shift 연산<\/h3><div class=\"tblw\"><table><thead><tr><th>연산<\/th><th>C<\/th><th>Java<\/th><th>MIPS<\/th><\/tr><\/thead><tbody><tr><td>Shift left<\/td><td>&lt;&lt;<\/td><td>&lt;&lt;<\/td><td><b>sll<\/b><\/td><\/tr><tr><td>Shift right<\/td><td>&gt;&gt;<\/td><td>&gt;&gt;&gt;<\/td><td><b>srl<\/b><\/td><\/tr><tr><td>Bitwise AND/OR/NOT<\/td><td>&amp; \\<\/td><td>~<\/td><td>&amp; \\<\/td><td>~<\/td><td>and, andi / or, ori / <b>nor<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>R-format의 <b>shamt<\/b>에 몇 칸 밀지 들어감.<\/li><li><b>sll i<\/b> = 2^i 곱하기 (오른쪽을 0으로 채움). <b>srl i<\/b> = 2^i 나누기, <b>unsigned만<\/b>.<\/li><\/ul>\n<div class=\"callout trap\">함정: srl은 왼쪽을 0으로 채우므로 음수(2의 보수)에 쓰면 부호가 깨진다 (교수님: \"you should not just perform this operation on a signed number\").<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">03주-1<\/span><br>오른쪽 shift는 0으로 채우니까 부호 있는 수(2의 보수)에 쓰면 부호가 깨진다.<\/div><\/section>\n<section class=\"sec\" id=\"s-and-or-nor\"><h3>AND · OR · NOR<\/h3><ul><li><b>AND<\/b>: 마스킹. 원하는 비트만 남기고 나머지 0.<\/li><li><b>OR<\/b>: 원하는 비트를 1로, 나머지 유지.<\/li><li><b>NOT<\/b>은 MIPS에 없음 → <b>NOR 3-operand<\/b>: <code>nor $t0, $t1, $zero<\/code> = NOT $t1.<\/li><\/ul>\n<p>예 ($t1 = 0…0011 1100 0000 0000, $t2 = 0…0000 1101 1100 0000):<\/p>\n<ul><li><code>and $t0,$t1,$t2<\/code> → 0…0000 1100 0000 0000<\/li><li><code>or $t0,$t1,$t2<\/code> → 0…0011 1101 1100 0000<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-branch-instr\"><h3>분기 명령어<\/h3><ul><li><code>beq rs, rt, L1<\/code>: rs == rt면 L1로.<\/li><li><code>bne rs, rt, L1<\/code>: rs != rt면 L1로.<\/li><li><code>j L1<\/code>: 무조건 L1로 점프.<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-if-else\"><h3>if-else 컴파일<\/h3><p><code>if (i == j) f = g + h; else f = g - h;<\/code> (f, g, h, i, j = $s0–$s4)<\/p>\n<pre class=\"code\">      bne $s3, $s4, Else    # i != j 이면 else로\n      add $s0, $s1, $s2     # f = g + h\n      j   Exit\nElse: sub $s0, $s1, $s2     # f = g - h\nExit:<\/pre>\n<p>조건을 <b>반대로<\/b> 검사해서 else로 건너뛰는 게 요령 (i == j면 bne가 안 걸려서 if 블록 실행).<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">04주-1<\/span><br>i == j면 bne가 안 걸려서 if 블록 수행 후 무조건 j Exit. bne가 걸리면(i ≠ j) else 블록의 sub.<\/div><\/section>\n<section class=\"sec\" id=\"s-while-loop\"><h3>while 루프 컴파일<\/h3><p><code>while (save[i] == k) i += 1;<\/code> (i: $s3, k: $s5, save의 base: $s6)<\/p>\n<pre class=\"code\">Loop: sll  $t1, $s3, 2      # t1 = i * 4\n      add  $t1, $t1, $s6    # t1 = &amp;save[i]\n      lw   $t0, 0($t1)      # t0 = save[i]\n      bne  $t0, $s5, Exit   # save[i] != k 이면 탈출\n      addi $s3, $s3, 1      # i += 1\n      j    Loop\nExit:<\/pre>\n<div class=\"callout trap\">함정: 인덱스가 변수(i)라서 <code>lw $t0, $t1($s6)<\/code>처럼 쓰고 싶어도 <b>안 됨<\/b>. 주소를 먼저 계산하고 offset은 0. OX에서 \"offset에 레지스터\" = False.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">04주-1<\/span><br>'if you face a true or false question where the offset is provided as a register, then you must put false' — 그래서 sll·add로 주소를 먼저 계산하고 lw의 offset은 0.<\/div><\/section>\n<section class=\"sec\" id=\"s-slt\"><h3>slt / slti / sltu<\/h3><ul><li><code>slt rd, rs, rt<\/code>: rs &lt; rt면 rd = 1, 아니면 0.<\/li><li><code>slti rt, rs, constant<\/code>: rs &lt; constant면 rt = 1.<\/li><li>beq/bne와 조합해서 모든 비교(==, !=, &lt;, &lt;=, &gt;, &gt;=)를 만든다.<\/li><\/ul>\n<pre class=\"code\">slt $t0, $s1, $s2       # $s1 &lt; $s2 면 $t0 = 1\nbne $t0, $zero, L       # 1 != 0 이면 L로<\/pre>\n<ul><li><b>Signed vs Unsigned<\/b>: slt/slti = signed, sltu/sltiu = unsigned.<div class=\"sub\">$s0 = 1111…1111, $s1 = 0000…0001일 때 <code>slt<\/code> → −1 &lt; +1 → $t0 = 1, <code>sltu<\/code> → 4,294,967,295 &gt; 1 → $t0 = 0.<\/div><\/li><\/ul><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">04주-1<\/span><br>slt/slti는 뒤의 값이 더 크면 1, 아니면 0.<\/div><\/section>\n<section class=\"sec\" id=\"s-branch-design\"><h3>왜 blt, bge가 없나<\/h3><ul><li>하드웨어에서 &lt;, &gt; 비교는 =, ≠보다 느림.<\/li><li>분기와 합치면 명령어당 일이 많아져 <b>클럭이 느려짐 → 모든 명령어가 손해<\/b>.<\/li><li>좋은 절충: <b>beq, bne<\/b> + slt 조합. (<code>blt<\/code>는 assembler의 pseudo-instruction으로 <code>slt<\/code> + <code>bne<\/code>로 바뀜.)<\/li><\/ul><\/section>", "title_en": "Logical Operations · Conditional Branches · if/while", "exam_en": "Compiling if and while", "html_en": "<section class=\"sec\" id=\"s-shift\"><h3>Shift Operations<\/h3><div class=\"tblw\"><table><thead><tr><th>Operation<\/th><th>C<\/th><th>Java<\/th><th>MIPS<\/th><\/tr><\/thead><tbody><tr><td>Shift left<\/td><td>&lt;&lt;<\/td><td>&lt;&lt;<\/td><td><b>sll<\/b><\/td><\/tr><tr><td>Shift right<\/td><td>&gt;&gt;<\/td><td>&gt;&gt;&gt;<\/td><td><b>srl<\/b><\/td><\/tr><tr><td>Bitwise AND/OR/NOT<\/td><td>&amp; \\<\/td><td>~<\/td><td>&amp; \\<\/td><td>~<\/td><td>and, andi / or, ori / <b>nor<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>The number of positions to shift goes in the R-format <b>shamt<\/b> field.<\/li><li><b>sll by i<\/b> = multiply by 2^i (fills the right with 0s). <b>srl by i<\/b> = divide by 2^i, <b>unsigned only<\/b>.<\/li><\/ul>\n<div class=\"callout trap\">Trap: srl fills the left with 0s, so using it on a negative (two's complement) number destroys the sign (the professor: \"you should not just perform this operation on a signed number\").<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 3-1<\/span><br>A right shift fills with 0s, so using it on signed (two's complement) numbers breaks the sign.<\/div><\/section>\n<section class=\"sec\" id=\"s-and-or-nor\"><h3>AND · OR · NOR<\/h3><ul><li><b>AND<\/b>: masking. Keeps the selected bits and clears the rest to 0.<\/li><li><b>OR<\/b>: sets the selected bits to 1 and leaves the rest unchanged.<\/li><li>MIPS has no <b>NOT<\/b> → use <b>3-operand NOR<\/b>: <code>nor $t0, $t1, $zero<\/code> = NOT $t1.<\/li><\/ul>\n<p>Example ($t1 = 0…0011 1100 0000 0000, $t2 = 0…0000 1101 1100 0000):<\/p>\n<ul><li><code>and $t0,$t1,$t2<\/code> → 0…0000 1100 0000 0000<\/li><li><code>or $t0,$t1,$t2<\/code> → 0…0011 1101 1100 0000<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-branch-instr\"><h3>Branch Instructions<\/h3><ul><li><code>beq rs, rt, L1<\/code>: if rs == rt, branch to L1.<\/li><li><code>bne rs, rt, L1<\/code>: if rs != rt, branch to L1.<\/li><li><code>j L1<\/code>: unconditional jump to L1.<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-if-else\"><h3>Compiling if-else<\/h3><p><code>if (i == j) f = g + h; else f = g - h;<\/code> (f, g, h, i, j = $s0–$s4)<\/p>\n<pre class=\"code\">      bne $s3, $s4, Else    # if i != j, go to Else\n      add $s0, $s1, $s2     # f = g + h\n      j   Exit\nElse: sub $s0, $s1, $s2     # f = g - h\nExit:<\/pre>\n<p>The trick is to test the <b>opposite<\/b> condition and skip to Else (if i == j, bne is not taken, so the if-block runs).<\/p><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 4-1<\/span><br>If i == j, bne is not taken, so the if-block runs and then unconditionally j Exit. If bne is taken (i ≠ j), the else-block's sub runs.<\/div><\/section>\n<section class=\"sec\" id=\"s-while-loop\"><h3>Compiling a while Loop<\/h3><p><code>while (save[i] == k) i += 1;<\/code> (i: $s3, k: $s5, base of save: $s6)<\/p>\n<pre class=\"code\">Loop: sll  $t1, $s3, 2      # t1 = i * 4\n      add  $t1, $t1, $s6    # t1 = &amp;save[i]\n      lw   $t0, 0($t1)      # t0 = save[i]\n      bne  $t0, $s5, Exit   # exit if save[i] != k\n      addi $s3, $s3, 1      # i += 1\n      j    Loop\nExit:<\/pre>\n<div class=\"callout trap\">Trap: Because the index i is a variable, you might want to write <code>lw $t0, $t1($s6)<\/code>, but that is <b>not allowed<\/b>. Compute the address first and use offset 0. In True/False, \"a register as the offset\" = False.<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 4-1<\/span><br>'if you face a true or false question where the offset is provided as a register, then you must put false' — that is why the address is computed first with sll and add, and the lw offset is 0.<\/div><\/section>\n<section class=\"sec\" id=\"s-slt\"><h3>slt / slti / sltu<\/h3><ul><li><code>slt rd, rs, rt<\/code>: if rs &lt; rt then rd = 1, else 0.<\/li><li><code>slti rt, rs, constant<\/code>: if rs &lt; constant then rt = 1.<\/li><li>Combined with beq/bne, they build every comparison (==, !=, &lt;, &lt;=, &gt;, &gt;=).<\/li><\/ul>\n<pre class=\"code\">slt $t0, $s1, $s2       # $t0 = 1 if $s1 &lt; $s2\nbne $t0, $zero, L       # branch to L if 1 != 0<\/pre>\n<ul><li><b>Signed vs Unsigned<\/b>: slt/slti = signed, sltu/sltiu = unsigned.<div class=\"sub\">With $s0 = 1111…1111 and $s1 = 0000…0001: <code>slt<\/code> → −1 &lt; +1 → $t0 = 1; <code>sltu<\/code> → 4,294,967,295 &gt; 1 → $t0 = 0.<\/div><\/li><\/ul><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 4-1<\/span><br>slt/slti give 1 if the latter value is larger, otherwise 0.<\/div><\/section>\n<section class=\"sec\" id=\"s-branch-design\"><h3>Why There Is No blt or bge<\/h3><ul><li>In hardware, &lt; and &gt; comparisons are slower than = and ≠.<\/li><li>Combining them with a branch means more work per instruction → <b>slower clock → every instruction is penalized<\/b>.<\/li><li>A good compromise: <b>beq, bne<\/b> + slt. (<code>blt<\/code> is an assembler pseudo-instruction that becomes <code>slt<\/code> + <code>bne<\/code>.)<\/li><\/ul><\/section>"}, {"id": "L2-6", "title": "프로시저 호출 · 스택", "src": "week3 p.42–51 · week4 p.2–5", "exam": "스택 저장/복원 순서", "secs": [{"id": "jal-jr", "title": "프로시저 호출 단계 · jal / jr", "title_en": "Procedure Call Steps · jal / jr"}, {"id": "reg-usage", "title": "레지스터 사용 규약과 스택", "title_en": "Register Usage Conventions and the Stack"}, {"id": "leaf", "title": "Leaf procedure 예제", "title_en": "Leaf Procedure Example"}, {"id": "nonleaf", "title": "Non-leaf (재귀) 예제: fact", "title_en": "Non-leaf (Recursive) Example: fact"}, {"id": "fact-trace", "title": "fact(3) 스택 추적", "title_en": "Tracing the Stack for fact(3)"}, {"id": "stack-size", "title": "인자 타입별 스택 크기 (교수님 기준)", "title_en": "Stack Size by Argument Type (as taught by the professor)"}, {"id": "byte-ops", "title": "Byte 연산 · strcpy", "title_en": "Byte Operations · strcpy"}], "md": "## 프로시저 호출 단계 · jal / jr {#jal-jr}\n\n1. 인자를 레지스터에 둔다 → 2. 프로시저로 제어 이동 → 3. 저장 공간 확보 → 4. 연산 수행 → 5. 결과를 레지스터에 → 6. 호출한 곳으로 복귀.\n\n- `jal ProcedureLabel` (jump-and-link): **다음 명령어 주소(PC+4)를 $ra에 저장**하고 타깃으로 점프.\n- `jr $ra` (jump register): $ra를 PC에 복사 → 복귀. 계산된 점프에도 사용.\n- PC: 현재 실행 중인 명령어의 주소를 담은 레지스터.\n\n예: 100번지에서 `jal`, 함수는 388번지 → $ra = 104, PC = 388. 함수 끝의 `jr $ra`로 104로 복귀.\n\n## 레지스터 사용 규약과 스택 {#reg-usage}\n\n| 레지스터 | 번호 | 용도 |\n|---|---|---|\n| $a0–$a3 | 4–7 | 인자 |\n| $v0, $v1 | 2–3 | 결과값 |\n| $t0–$t9 | 8–15, 24–25 | 임시 (**보존 안 됨**) |\n| $s0–$s7 | 16–23 | saved (**callee가 저장·복원**) |\n| $gp / $sp / $fp / $ra | 28 / 29 / 30 / 31 | global ptr / **stack ptr** / frame ptr / **return address** |\n\n- **Stack**: 레지스터를 spill하는 LIFO 구조. **$sp**는 가장 최근에 할당한 주소.\n- **스택은 아래로 자란다** (높은 주소 → 낮은 주소): 공간 확보 = `addi $sp, $sp, -N`.\n- Procedure frame (activation record): callee가 할당한 지역 데이터.\n\n## Leaf procedure 예제 {#leaf}\n\n다른 함수를 부르지 않는 함수. `int leaf_example(int g, h, i, j) { int f; f = (g+h) - (i+j); return f; }` (인자 $a0–$a3, f는 $s0)\n```\nleaf_example:\n  addi $sp, $sp, -4      # int 하나(4 byte) 공간\n  sw   $s0, 0($sp)       # 원래 $s0 저장\n  add  $t0, $a0, $a1     # g + h\n  add  $t1, $a2, $a3     # i + j\n  sub  $s0, $t0, $t1     # f\n  add  $v0, $s0, $zero   # 결과를 $v0로 복사\n  lw   $s0, 0($sp)       # $s0 복원\n  addi $sp, $sp, 4\n  jr   $ra\n```\n\n## Non-leaf (재귀) 예제: fact {#nonleaf}\n\n다른 함수를 부르는 함수는 호출 전에 **$ra와 이후에 필요한 인자**를 스택에 저장, 호출 후 복원.\n```\nfact:\n  addi $sp, $sp, -8      # 2칸: 인자, 복귀주소\n  sw   $ra, 4($sp)\n  sw   $a0, 0($sp)\n  slti $t0, $a0, 1       # n < 1 ?\n  beq  $t0, $zero, L1    # 아니면 L1\n  addi $v0, $zero, 1     # return 1\n  addi $sp, $sp, 8\n  jr   $ra\nL1:\n  addi $a0, $a0, -1      # n - 1\n  jal  fact\n  lw   $a0, 0($sp)       # 저장한 그 자리에서 복원\n  lw   $ra, 4($sp)\n  addi $sp, $sp, 8\n  mul  $v0, $a0, $v0     # n * fact(n-1)\n  jr   $ra\n```\n> 함정: **저장한 offset과 복원하는 offset이 같아야** 한다. 인자를 0에, $ra를 4에 넣었으면 복원도 그대로. 반대로 꺼내면 0점 (교수님 4주-1).\n\n> 함정: 교안 week3 슬라이드의 C 코드는 `return f`로 오타. week5 슬라이드에서 `return 1`로 고쳐짐.\n\n## fact(3) 스택 추적 {#fact-trace}\n\n호출한 곳: 100번지 `jal fact` → $ra = 104, $a0 = 3. $sp 초기값 500.\n\n| 단계 | $sp | 0($sp)에 저장 | 4($sp)에 저장 |\n|---|---|---|---|\n| fact(3) 진입 | 492 | a0 = 3 | ra = 104 |\n| fact(2) 진입 | 484 | a0 = 2 | ra = L1+8 |\n| fact(1) 진입 | 476 | a0 = 1 | ra = L1+8 |\n| fact(0) 진입 | 468 | a0 = 0 | ra = L1+8 |\n\nfact(0): slti → 0 < 1 이므로 $t0 = 1 → beq 안 걸림 → $v0 = 1, $sp = 476, jr → L1+8.\n되돌아오며 `lw`로 a0을 1, 2, 3으로 복원하고 $v0 = 1 → 1 → 2 → 6. 마지막 jr은 **104**로.\n\n> 함정: `slti $t0, $a0, 1`에서 a0 = 1이면 1 < 1이 거짓 → $t0 = 0 (재귀 계속). 교수님이 \"be extremely careful\"이라고 짚은 곳.\n\n## 인자 타입별 스택 크기 (교수님 기준) {#stack-size}\n\n- int 인자 1개 + $ra → 4 + 4 = **8 byte**.\n- **교수님 설명**: char 인자는 1 byte씩. 예) char 인자 2개 + $ra → 4 + 1 + 1 = **6 byte**, char 3개면 4 + 3 = 7.\n- 저장하는 값이 int면 char 배열을 다뤄도 4씩 움직인다 (strcpy에서 저장하는 건 int i).\n\n> 주의: 실제 MIPS 컴파일러는 정렬 때문에 보통 4의 배수로 잡지만, 수업에서는 위처럼 설명했어. 시험에선 수업 기준으로.\n\n## Byte 연산 · strcpy {#byte-ops}\n\n- `lb rt, offset(rs)` / `lh`: sign extend해서 32-bit로. `lbu` / `lhu`: zero extend.\n- `sb` / `sh`: 가장 오른쪽 byte/halfword만 저장.\n\n`void strcpy(char x[], char y[])` (x, y 주소는 $a0, $a1, i는 $s0)\n```\nstrcpy:\n  addi $sp, $sp, -4\n  sw   $s0, 0($sp)\n  add  $s0, $zero, $zero   # i = 0\nL1: add  $t1, $s0, $a1     # &y[i]  (char라서 ×4 없음)\n  lbu  $t2, 0($t1)\n  add  $t3, $s0, $a0       # &x[i]\n  sb   $t2, 0($t3)\n  beq  $t2, $zero, L2      # '\\0' 이면 끝\n  addi $s0, $s0, 1\n  j    L1\nL2: lw   $s0, 0($sp)\n  addi $sp, $sp, 4\n  jr   $ra\n```\n> 함정: char 배열은 원소가 1 byte라서 **sll로 ×4 하지 않는다**. int 배열과 다른 점.", "html": "<section class=\"sec\" id=\"s-jal-jr\"><h3>프로시저 호출 단계 · jal / jr<\/h3><ol><li>인자를 레지스터에 둔다 → 2. 프로시저로 제어 이동 → 3. 저장 공간 확보 → 4. 연산 수행 → 5. 결과를 레지스터에 → 6. 호출한 곳으로 복귀.<\/li><\/ol>\n<ul><li><code>jal ProcedureLabel<\/code> (jump-and-link): <b>다음 명령어 주소(PC+4)를 $ra에 저장<\/b>하고 타깃으로 점프.<\/li><li><code>jr $ra<\/code> (jump register): $ra를 PC에 복사 → 복귀. 계산된 점프에도 사용.<\/li><li>PC: 현재 실행 중인 명령어의 주소를 담은 레지스터.<\/li><\/ul>\n<p>예: 100번지에서 <code>jal<\/code>, 함수는 388번지 → $ra = 104, PC = 388. 함수 끝의 <code>jr $ra<\/code>로 104로 복귀.<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">04주-1<\/span><br>100번 줄에서 jal → $ra = 104(다음 줄), PC = 함수가 정의된 줄(예: 388). 함수의 jr $ra로 104로 돌아온다.<\/div><\/section>\n<section class=\"sec\" id=\"s-reg-usage\"><h3>레지스터 사용 규약과 스택<\/h3><div class=\"tblw\"><table><thead><tr><th>레지스터<\/th><th>번호<\/th><th>용도<\/th><\/tr><\/thead><tbody><tr><td>$a0–$a3<\/td><td>4–7<\/td><td>인자<\/td><\/tr><tr><td>$v0, $v1<\/td><td>2–3<\/td><td>결과값<\/td><\/tr><tr><td>$t0–$t9<\/td><td>8–15, 24–25<\/td><td>임시 (<b>보존 안 됨<\/b>)<\/td><\/tr><tr><td>$s0–$s7<\/td><td>16–23<\/td><td>saved (<b>callee가 저장·복원<\/b>)<\/td><\/tr><tr><td>$gp / $sp / $fp / $ra<\/td><td>28 / 29 / 30 / 31<\/td><td>global ptr / <b>stack ptr<\/b> / frame ptr / <b>return address<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><b>Stack<\/b>: 레지스터를 spill하는 LIFO 구조. <b>$sp<\/b>는 가장 최근에 할당한 주소.<\/li><li><b>스택은 아래로 자란다<\/b> (높은 주소 → 낮은 주소): 공간 확보 = <code>addi $sp, $sp, -N<\/code>.<\/li><li>Procedure frame (activation record): callee가 할당한 지역 데이터.<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w3-p43.jpg\" aria-label=\"크게 보기\"><img src=\"img/w3-p43.jpg\" alt=\"week3 p.43 · Register Usage와 스택\" loading=\"lazy\"><\/button><figcaption>week3 p.43 · Register Usage와 스택<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-leaf\"><h3>Leaf procedure 예제<\/h3><p>다른 함수를 부르지 않는 함수. <code>int leaf_example(int g, h, i, j) { int f; f = (g+h) - (i+j); return f; }<\/code> (인자 $a0–$a3, f는 $s0)<\/p>\n<pre class=\"code\">leaf_example:\n  addi $sp, $sp, -4      # int 하나(4 byte) 공간\n  sw   $s0, 0($sp)       # 원래 $s0 저장\n  add  $t0, $a0, $a1     # g + h\n  add  $t1, $a2, $a3     # i + j\n  sub  $s0, $t0, $t1     # f\n  add  $v0, $s0, $zero   # 결과를 $v0로 복사\n  lw   $s0, 0($sp)       # $s0 복원\n  addi $sp, $sp, 4\n  jr   $ra<\/pre><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">04주-1 · 04주-2<\/span><br>$s0이 다른 곳에서 쓰던 레지스터일 수 있으니 스택에 저장했다가 나갈 때 복원. int 하나라 $sp를 4만큼. 결과를 $v0로 옮길 땐 add + $zero.<\/div><\/section>\n<section class=\"sec\" id=\"s-nonleaf\"><h3>Non-leaf (재귀) 예제: fact<\/h3><p>다른 함수를 부르는 함수는 호출 전에 <b>$ra와 이후에 필요한 인자<\/b>를 스택에 저장, 호출 후 복원.<\/p>\n<pre class=\"code\">fact:\n  addi $sp, $sp, -8      # 2칸: 인자, 복귀주소\n  sw   $ra, 4($sp)\n  sw   $a0, 0($sp)\n  slti $t0, $a0, 1       # n &lt; 1 ?\n  beq  $t0, $zero, L1    # 아니면 L1\n  addi $v0, $zero, 1     # return 1\n  addi $sp, $sp, 8\n  jr   $ra\nL1:\n  addi $a0, $a0, -1      # n - 1\n  jal  fact\n  lw   $a0, 0($sp)       # 저장한 그 자리에서 복원\n  lw   $ra, 4($sp)\n  addi $sp, $sp, 8\n  mul  $v0, $a0, $v0     # n * fact(n-1)\n  jr   $ra<\/pre>\n<div class=\"callout trap\">함정: <b>저장한 offset과 복원하는 offset이 같아야<\/b> 한다. 인자를 0에, $ra를 4에 넣었으면 복원도 그대로. 반대로 꺼내면 0점 (교수님 4주-1).<\/div>\n<div class=\"callout trap\">함정: 교안 week3 슬라이드의 C 코드는 <code>return f<\/code>로 오타. week5 슬라이드에서 <code>return 1<\/code>로 고쳐짐.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">04주-1<\/span><br>인자를 offset 0, $ra를 offset 4에 저장했으면 복원도 같은 자리에서. 'if you … load this on the opposite order, then you will get a zero point in your midterm'.<\/div><\/section>\n<section class=\"sec\" id=\"s-fact-trace\"><h3>fact(3) 스택 추적<\/h3><p>호출한 곳: 100번지 <code>jal fact<\/code> → $ra = 104, $a0 = 3. $sp 초기값 500.<\/p>\n<div class=\"tblw\"><table><thead><tr><th>단계<\/th><th>$sp<\/th><th>0($sp)에 저장<\/th><th>4($sp)에 저장<\/th><\/tr><\/thead><tbody><tr><td>fact(3) 진입<\/td><td>492<\/td><td>a0 = 3<\/td><td>ra = 104<\/td><\/tr><tr><td>fact(2) 진입<\/td><td>484<\/td><td>a0 = 2<\/td><td>ra = L1+8<\/td><\/tr><tr><td>fact(1) 진입<\/td><td>476<\/td><td>a0 = 1<\/td><td>ra = L1+8<\/td><\/tr><tr><td>fact(0) 진입<\/td><td>468<\/td><td>a0 = 0<\/td><td>ra = L1+8<\/td><\/tr><\/tbody><\/table><\/div>\n<p>fact(0): slti → 0 &lt; 1 이므로 $t0 = 1 → beq 안 걸림 → $v0 = 1, $sp = 476, jr → L1+8.<br>되돌아오며 <code>lw<\/code>로 a0을 1, 2, 3으로 복원하고 $v0 = 1 → 1 → 2 → 6. 마지막 jr은 <b>104<\/b>로.<\/p>\n<div class=\"callout trap\">함정: <code>slti $t0, $a0, 1<\/code>에서 a0 = 1이면 1 &lt; 1이 거짓 → $t0 = 0 (재귀 계속). 교수님이 \"be extremely careful\"이라고 짚은 곳.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">04주-1<\/span><br>fact(3)을 $sp 500에서 시작해 한 줄씩 추적: 492 → 484 → 476 → 468. slti에서 1 &lt; 1은 거짓이라 한 번 더 재귀 — 'be extremely careful'.<\/div><\/section>\n<section class=\"sec\" id=\"s-stack-size\"><h3>인자 타입별 스택 크기 (교수님 기준)<\/h3><ul><li>int 인자 1개 + $ra → 4 + 4 = <b>8 byte<\/b>.<\/li><li><b>교수님 설명<\/b>: char 인자는 1 byte씩. 예) char 인자 2개 + $ra → 4 + 1 + 1 = <b>6 byte<\/b>, char 3개면 4 + 3 = 7.<\/li><li>저장하는 값이 int면 char 배열을 다뤄도 4씩 움직인다 (strcpy에서 저장하는 건 int i).<\/li><\/ul>\n<div class=\"callout trap\">주의: 실제 MIPS 컴파일러는 정렬 때문에 보통 4의 배수로 잡지만, 수업에서는 위처럼 설명했어. 시험에선 수업 기준으로.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">04주-2 · 05주-1<\/span><br>인자 타입을 꼭 보라: char 인자는 1 byte씩이라 char 2개 + $ra = 6 byte, char 3개면 7 byte. 'when actually facing your midterm, be especially careful about this format'.<\/div><\/section>\n<section class=\"sec\" id=\"s-byte-ops\"><h3>Byte 연산 · strcpy<\/h3><ul><li><code>lb rt, offset(rs)<\/code> / <code>lh<\/code>: sign extend해서 32-bit로. <code>lbu<\/code> / <code>lhu<\/code>: zero extend.<\/li><li><code>sb<\/code> / <code>sh<\/code>: 가장 오른쪽 byte/halfword만 저장.<\/li><\/ul>\n<p><code>void strcpy(char x[], char y[])<\/code> (x, y 주소는 $a0, $a1, i는 $s0)<\/p>\n<pre class=\"code\">strcpy:\n  addi $sp, $sp, -4\n  sw   $s0, 0($sp)\n  add  $s0, $zero, $zero   # i = 0\nL1: add  $t1, $s0, $a1     # &amp;y[i]  (char라서 ×4 없음)\n  lbu  $t2, 0($t1)\n  add  $t3, $s0, $a0       # &amp;x[i]\n  sb   $t2, 0($t3)\n  beq  $t2, $zero, L2      # &#x27;\\0&#x27; 이면 끝\n  addi $s0, $s0, 1\n  j    L1\nL2: lw   $s0, 0($sp)\n  addi $sp, $sp, 4\n  jr   $ra<\/pre>\n<div class=\"callout trap\">함정: char 배열은 원소가 1 byte라서 <b>sll로 ×4 하지 않는다<\/b>. int 배열과 다른 점.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">04주-2<\/span><br>char 배열은 인덱스에 ×4(sll)를 하지 않는다. lbu로 1 byte만 읽는다. lbu도 I-type이라 offset은 상수 — 레지스터를 넣으면 '정답이든 아니든 0점'.<\/div><\/section>", "title_en": "Procedure Calls · The Stack", "exam_en": "Stack save/restore order", "html_en": "<section class=\"sec\" id=\"s-jal-jr\"><h3>Procedure Call Steps · jal / jr<\/h3><ol><li>Place parameters in registers → 2. Transfer control to the procedure → 3. Acquire storage → 4. Perform the operations → 5. Place the result in a register → 6. Return to the place of the call.<\/li><\/ol>\n<ul><li><code>jal ProcedureLabel<\/code> (jump-and-link): <b>stores the address of the next instruction (PC+4) in $ra<\/b> and jumps to the target.<\/li><li><code>jr $ra<\/code> (jump register): copies $ra into the PC → return. Also used for computed jumps.<\/li><li>PC: the register holding the address of the instruction currently being executed.<\/li><\/ul>\n<p>Example: <code>jal<\/code> at address 100, function at address 388 → $ra = 104, PC = 388. The <code>jr $ra<\/code> at the end of the function returns to 104.<\/p><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 4-1<\/span><br>jal on line 100 → $ra = 104 (the next line), PC = the line where the function is defined (e.g., 388). The function's jr $ra returns to 104.<\/div><\/section>\n<section class=\"sec\" id=\"s-reg-usage\"><h3>Register Usage Conventions and the Stack<\/h3><div class=\"tblw\"><table><thead><tr><th>Register<\/th><th>Number<\/th><th>Use<\/th><\/tr><\/thead><tbody><tr><td>$a0–$a3<\/td><td>4–7<\/td><td>Arguments<\/td><\/tr><tr><td>$v0, $v1<\/td><td>2–3<\/td><td>Result values<\/td><\/tr><tr><td>$t0–$t9<\/td><td>8–15, 24–25<\/td><td>Temporaries (<b>not preserved<\/b>)<\/td><\/tr><tr><td>$s0–$s7<\/td><td>16–23<\/td><td>Saved (<b>callee saves and restores<\/b>)<\/td><\/tr><tr><td>$gp / $sp / $fp / $ra<\/td><td>28 / 29 / 30 / 31<\/td><td>global ptr / <b>stack ptr<\/b> / frame ptr / <b>return address<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><b>Stack<\/b>: a data structure for spilling registers, organized as a last-in-first-out (LIFO) queue. <b>$sp<\/b> holds the most recently allocated address in the stack.<\/li><li><b>The stack grows \"down\"<\/b> (from high memory address to low memory address): allocate space with <code>addi $sp, $sp, -N<\/code>.<\/li><li>Procedure frame (activation record): local data allocated by the callee.<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w3-p43.jpg\" aria-label=\"Enlarge\"><img src=\"img/w3-p43.jpg\" alt=\"week3 p.43 · Register Usage and the stack\" loading=\"lazy\"><\/button><figcaption>week3 p.43 · Register Usage and the stack<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-leaf\"><h3>Leaf Procedure Example<\/h3><p>A procedure that does not call other procedures. <code>int leaf_example(int g, h, i, j) { int f; f = (g+h) - (i+j); return f; }<\/code> (arguments in $a0–$a3, f in $s0)<\/p>\n<pre class=\"code\">leaf_example:\n  addi $sp, $sp, -4      # space for one int (4 bytes)\n  sw   $s0, 0($sp)       # save original $s0\n  add  $t0, $a0, $a1     # g + h\n  add  $t1, $a2, $a3     # i + j\n  sub  $s0, $t0, $t1     # f\n  add  $v0, $s0, $zero   # copy result to $v0\n  lw   $s0, 0($sp)       # restore $s0\n  addi $sp, $sp, 4\n  jr   $ra<\/pre><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 4-1 · Week 4-2<\/span><br>$s0 might be a register used elsewhere, so save it on the stack and restore it when leaving. One int, so $sp moves by 4. Moving the result into $v0 uses add + $zero.<\/div><\/section>\n<section class=\"sec\" id=\"s-nonleaf\"><h3>Non-leaf (Recursive) Example: fact<\/h3><p>A procedure that calls another procedure must save <b>$ra and any arguments needed afterwards<\/b> on the stack before the call, and restore them after the call.<\/p>\n<pre class=\"code\">fact:\n  addi $sp, $sp, -8      # 2 slots: argument, return address\n  sw   $ra, 4($sp)\n  sw   $a0, 0($sp)\n  slti $t0, $a0, 1       # n &lt; 1 ?\n  beq  $t0, $zero, L1    # if not, go to L1\n  addi $v0, $zero, 1     # return 1\n  addi $sp, $sp, 8\n  jr   $ra\nL1:\n  addi $a0, $a0, -1      # n - 1\n  jal  fact\n  lw   $a0, 0($sp)       # restore from the same slot it was saved in\n  lw   $ra, 4($sp)\n  addi $sp, $sp, 8\n  mul  $v0, $a0, $v0     # n * fact(n-1)\n  jr   $ra<\/pre>\n<div class=\"callout trap\">Trap: <b>The offset you save to and the offset you restore from must match.<\/b> If you saved the argument at 0 and $ra at 4, restore them the same way. Restoring them in the opposite order gets zero points (the professor, Week 4-1).<\/div>\n<div class=\"callout trap\">Trap: The C code on the Week 3 slide has a typo, <code>return f<\/code>. It is corrected to <code>return 1<\/code> on the Week 5 slide.<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 4-1<\/span><br>If you saved the argument at offset 0 and $ra at offset 4, restore from the same slots. 'if you … load this on the opposite order, then you will get a zero point in your midterm'.<\/div><\/section>\n<section class=\"sec\" id=\"s-fact-trace\"><h3>Tracing the Stack for fact(3)<\/h3><p>Caller: <code>jal fact<\/code> at address 100 → $ra = 104, $a0 = 3. Initial $sp = 500.<\/p>\n<div class=\"tblw\"><table><thead><tr><th>Step<\/th><th>$sp<\/th><th>Saved at 0($sp)<\/th><th>Saved at 4($sp)<\/th><\/tr><\/thead><tbody><tr><td>Enter fact(3)<\/td><td>492<\/td><td>a0 = 3<\/td><td>ra = 104<\/td><\/tr><tr><td>Enter fact(2)<\/td><td>484<\/td><td>a0 = 2<\/td><td>ra = L1+8<\/td><\/tr><tr><td>Enter fact(1)<\/td><td>476<\/td><td>a0 = 1<\/td><td>ra = L1+8<\/td><\/tr><tr><td>Enter fact(0)<\/td><td>468<\/td><td>a0 = 0<\/td><td>ra = L1+8<\/td><\/tr><\/tbody><\/table><\/div>\n<p>fact(0): slti → 0 &lt; 1, so $t0 = 1 → beq not taken → $v0 = 1, $sp = 476, jr → L1+8.<br>On the way back, each <code>lw<\/code> restores a0 to 1, 2, 3 and $v0 goes 1 → 1 → 2 → 6. The last jr returns to <b>104<\/b>.<\/p>\n<div class=\"callout trap\">Trap: In <code>slti $t0, $a0, 1<\/code>, when a0 = 1, 1 &lt; 1 is false → $t0 = 0 (recursion continues). This is the spot where the professor said \"be extremely careful\".<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 4-1<\/span><br>Traced fact(3) line by line starting from $sp 500: 492 → 484 → 476 → 468. At slti, 1 &lt; 1 is false, so it recurses once more — 'be extremely careful'.<\/div><\/section>\n<section class=\"sec\" id=\"s-stack-size\"><h3>Stack Size by Argument Type (as taught by the professor)<\/h3><ul><li>One int argument + $ra → 4 + 4 = <b>8 bytes<\/b>.<\/li><li><b>As the professor explained<\/b>: each char argument takes 1 byte. E.g., two char arguments + $ra → 4 + 1 + 1 = <b>6 bytes<\/b>; three chars → 4 + 3 = 7.<\/li><li>If the value being saved is an int, you still move by 4 even when handling a char array (in strcpy the saved value is int i).<\/li><\/ul>\n<div class=\"callout trap\">Caution: Real MIPS compilers usually round up to a multiple of 4 for alignment, but this is how it was explained in class. On the exam, follow the class rule.<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 4-2 · Week 5-1<\/span><br>Always check the argument types: char arguments take 1 byte each, so 2 chars + $ra = 6 bytes, 3 chars = 7 bytes. 'when actually facing your midterm, be especially careful about this format'.<\/div><\/section>\n<section class=\"sec\" id=\"s-byte-ops\"><h3>Byte Operations · strcpy<\/h3><ul><li><code>lb rt, offset(rs)<\/code> / <code>lh<\/code>: sign-extend to 32 bits. <code>lbu<\/code> / <code>lhu<\/code>: zero-extend.<\/li><li><code>sb<\/code> / <code>sh<\/code>: store just the rightmost byte/halfword.<\/li><\/ul>\n<p><code>void strcpy(char x[], char y[])<\/code> (addresses of x, y in $a0, $a1; i in $s0)<\/p>\n<pre class=\"code\">strcpy:\n  addi $sp, $sp, -4\n  sw   $s0, 0($sp)\n  add  $s0, $zero, $zero   # i = 0\nL1: add  $t1, $s0, $a1     # &amp;y[i]  (char, so no ×4)\n  lbu  $t2, 0($t1)\n  add  $t3, $s0, $a0       # &amp;x[i]\n  sb   $t2, 0($t3)\n  beq  $t2, $zero, L2      # stop at &#x27;\\0&#x27;\n  addi $s0, $s0, 1\n  j    L1\nL2: lw   $s0, 0($sp)\n  addi $sp, $sp, 4\n  jr   $ra<\/pre>\n<div class=\"callout trap\">Trap: Elements of a char array are 1 byte, so <b>do not multiply by 4 with sll<\/b>. This is the difference from an int array.<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 4-2<\/span><br>For a char array, do not multiply the index by 4 (sll). lbu reads just 1 byte. lbu is also I-type, so the offset is a constant — putting a register there gets 'zero points whether the answer is right or not'.<\/div><\/section>"}, {"id": "L2-7", "title": "주소 지정 · 32-bit 상수 · 번역과 링크", "src": "week3 p.49–67", "exam": "분기 주소 계산", "secs": [{"id": "lui-ori", "title": "32-bit 상수: lui + ori", "title_en": "32-bit Constants: lui + ori"}, {"id": "branch-addr", "title": "Branch addressing (PC-relative)", "title_en": "Branch Addressing (PC-relative)"}, {"id": "jump-addr", "title": "Jump addressing (J-format)", "title_en": "Jump Addressing (J-format)"}, {"id": "addr-modes", "title": "Addressing modes 요약", "title_en": "Addressing Mode Summary"}, {"id": "translate", "title": "Pseudo-instruction · 번역 · 링크", "title_en": "Pseudo-instructions · Translation · Linking"}, {"id": "fallacies", "title": "Fallacies와 설계 원칙 정리", "title_en": "Fallacies and Design Principles Summary"}], "md": "## 32-bit 상수: lui + ori {#lui-ori}\n\n대부분 상수는 16-bit immediate로 충분. 가끔 32-bit 상수가 필요하면:\n\n- `lui rt, constant`: 16-bit 상수를 rt의 **위 16 bit**에, 아래 16 bit는 0.\n- 아래 16 bit는 **ori**로 채움 (addi 쓰지 말 것: 부호 확장 때문).\n```\nlui $s0, 61          # 0000 0000 0111 1101 0000 0000 0000 0000\nori $s0, $s0, 2304   # 0000 0000 0111 1101 0000 1001 0000 0000\n```\n\n## Branch addressing (PC-relative) {#branch-addr}\n\n| op | rs | rt | constant or address (16) |\n|---|---|---|---|\n\n- beq/bne는 I-format. 대부분 분기 대상은 가까움(루프, if).\n- **Target address = (PC + 4) + offset × 4**\n- offset은 **명령어(word) 개수 차이**, 부호 있음 → **±2¹⁵ words** (= ±2¹⁷ bytes) 범위.\n- 너무 멀면 assembler가 조건을 뒤집고 j로 우회하게 다시 씀:\n```\nbeq $s0, $s1, L1      →      bne $s0, $s1, L2\n                             j   L1\n                         L2: …\n```\n\n> 시험 포인트: 6주에 교수님이 판서로 다시 설명: offset = (target − (PC + 4)) / 4. 예) PC 108, target 124 → (124 − 112)/4 = **3**. (4주-2 미리보기 설명은 대략적이었고 6주 설명이 정확한 규칙.)\n\n## Jump addressing (J-format) {#jump-addr}\n\n| op (6) | address (26) |\n|---|---|\n\n- j, jal: 대상이 text segment 어디든 될 수 있음 → 절대 주소를 인코딩.\n- (Pseudo) direct jump: **Target = address × 4** (위 4 bit는 PC에서). 2²⁶ words = 2²⁸ bytes 범위.\n- `jr`: 32-bit 전체 주소가 레지스터에 → R-format.\n\n슬라이드 예제 (Loop가 80000번지):\n```\n80000 Loop: sll  $t1,$s3,2     0  0 19  9 2  0\n80004       add  $t1,$t1,$s6   0  9 22  9 0 32\n80008       lw   $t0,0($t1)   35  9  8   0\n80012       bne  $t0,$s5,Exit  5  8 21   2      → (80012+4) + 2×4 = 80024 = Exit\n80016       addi $s3,$s3,1     8 19 19   1\n80020       j    Loop          2   20000        → 20000 × 4 = 80000 = Loop\n80024 Exit:\n```\n\n## Addressing modes 요약 {#addr-modes}\n\n1. Immediate (addi), 2. Register (add, jr), 3. Base/displacement (**lw, sw**), 4. PC-relative (**beq, bne**), 5. Pseudo-direct (**j, jal**).\n\n## Pseudo-instruction · 번역 · 링크 {#translate}\n\n- **Pseudo-instruction**: 어셈블러가 진짜 명령어로 바꿔 주는 가짜 명령어. `move $t0,$t1` → `add $t0,$zero,$t1`, `blt $t0,$t1,L` → `slt $at,$t0,$t1` + `bne $at,$zero,L`.\n- 오브젝트 모듈: header, text segment, static data, relocation info, symbol table, debug info.\n- **Linker**: 세그먼트 병합 → 레이블 주소 결정 → 위치 의존·외부 참조 수정 → executable.\n- **Loader**: header 읽기 → 가상 주소 공간 생성 → text·data 복사 → 스택에 인자 → 레지스터 초기화($sp, $fp, $gp) → startup routine으로 점프.\n- **Dynamic linking**: 호출될 때만 라이브러리를 링크/로드. relocatable 코드 필요, 이미지 비대 방지, 새 버전 자동 반영.\n- **Memory layout**: Text(코드) → Static data(전역, $gp) → Dynamic data(heap, malloc) → Stack(자동 저장).\n\n## Fallacies와 설계 원칙 정리 {#fallacies}\n\n- Fallacy: 강력한 명령어 = 높은 성능 (복잡한 명령어는 구현이 어려워 단순한 것까지 느려짐).\n- Fallacy: 고성능을 위해 어셈블리로 작성 (현대 컴파일러가 더 잘함).\n- x86은 명령어 집합을 바꾸지 않고 계속 추가 (backward compatibility).\n- **설계 원칙 4개**: 1. Simplicity favors regularity, 2. Smaller is faster, 3. Make the common case fast, 4. Good design demands good compromises.", "html": "<section class=\"sec\" id=\"s-lui-ori\"><h3>32-bit 상수: lui + ori<\/h3><p>대부분 상수는 16-bit immediate로 충분. 가끔 32-bit 상수가 필요하면:<\/p>\n<ul><li><code>lui rt, constant<\/code>: 16-bit 상수를 rt의 <b>위 16 bit<\/b>에, 아래 16 bit는 0.<\/li><li>아래 16 bit는 <b>ori<\/b>로 채움 (addi 쓰지 말 것: 부호 확장 때문).<\/li><\/ul>\n<pre class=\"code\">lui $s0, 61          # 0000 0000 0111 1101 0000 0000 0000 0000\nori $s0, $s0, 2304   # 0000 0000 0111 1101 0000 1001 0000 0000<\/pre><\/section>\n<section class=\"sec\" id=\"s-branch-addr\"><h3>Branch addressing (PC-relative)<\/h3><div class=\"tblw\"><table><thead><tr><th>op<\/th><th>rs<\/th><th>rt<\/th><th>constant or address (16)<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<ul><li>beq/bne는 I-format. 대부분 분기 대상은 가까움(루프, if).<\/li><li><b>Target address = (PC + 4) + offset × 4<\/b><\/li><li>offset은 <b>명령어(word) 개수 차이<\/b>, 부호 있음 → <b>±2¹⁵ words<\/b> (= ±2¹⁷ bytes) 범위.<\/li><li>너무 멀면 assembler가 조건을 뒤집고 j로 우회하게 다시 씀:<\/li><\/ul>\n<pre class=\"code\">beq $s0, $s1, L1      →      bne $s0, $s1, L2\n                             j   L1\n                         L2: …<\/pre>\n<div class=\"callout exam\">시험 포인트: 6주에 교수님이 판서로 다시 설명: offset = (target − (PC + 4)) / 4. 예) PC 108, target 124 → (124 − 112)/4 = <b>3<\/b>. (4주-2 미리보기 설명은 대략적이었고 6주 설명이 정확한 규칙.)<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">04주-2<\/span><br>분기 대상이 16비트로 표현 못 할 만큼 멀면 중간 지점을 두고 두 번 뛴다. 자세한 건 기말에. (정확한 오프셋 규칙은 6주 판서 참고)<\/div><\/section>\n<section class=\"sec\" id=\"s-jump-addr\"><h3>Jump addressing (J-format)<\/h3><div class=\"tblw\"><table><thead><tr><th>op (6)<\/th><th>address (26)<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<ul><li>j, jal: 대상이 text segment 어디든 될 수 있음 → 절대 주소를 인코딩.<\/li><li>(Pseudo) direct jump: <b>Target = address × 4<\/b> (위 4 bit는 PC에서). 2²⁶ words = 2²⁸ bytes 범위.<\/li><li><code>jr<\/code>: 32-bit 전체 주소가 레지스터에 → R-format.<\/li><\/ul>\n<p>슬라이드 예제 (Loop가 80000번지):<\/p>\n<pre class=\"code\">80000 Loop: sll  $t1,$s3,2     0  0 19  9 2  0\n80004       add  $t1,$t1,$s6   0  9 22  9 0 32\n80008       lw   $t0,0($t1)   35  9  8   0\n80012       bne  $t0,$s5,Exit  5  8 21   2      → (80012+4) + 2×4 = 80024 = Exit\n80016       addi $s3,$s3,1     8 19 19   1\n80020       j    Loop          2   20000        → 20000 × 4 = 80000 = Loop\n80024 Exit:<\/pre><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w3-p56.jpg\" aria-label=\"크게 보기\"><img src=\"img/w3-p56.jpg\" alt=\"week3 p.56 · Target Addressing Example (80000번지 루프)\" loading=\"lazy\"><\/button><figcaption>week3 p.56 · Target Addressing Example (80000번지 루프)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-addr-modes\"><h3>Addressing modes 요약<\/h3><ol><li>Immediate (addi), 2. Register (add, jr), 3. Base/displacement (<b>lw, sw<\/b>), 4. PC-relative (<b>beq, bne<\/b>), 5. Pseudo-direct (<b>j, jal<\/b>).<\/li><\/ol><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w3-p57.jpg\" aria-label=\"크게 보기\"><img src=\"img/w3-p57.jpg\" alt=\"week3 p.57 · Addressing Mode Summary\" loading=\"lazy\"><\/button><figcaption>week3 p.57 · Addressing Mode Summary<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-translate\"><h3>Pseudo-instruction · 번역 · 링크<\/h3><ul><li><b>Pseudo-instruction<\/b>: 어셈블러가 진짜 명령어로 바꿔 주는 가짜 명령어. <code>move $t0,$t1<\/code> → <code>add $t0,$zero,$t1<\/code>, <code>blt $t0,$t1,L<\/code> → <code>slt $at,$t0,$t1<\/code> + <code>bne $at,$zero,L<\/code>.<\/li><li>오브젝트 모듈: header, text segment, static data, relocation info, symbol table, debug info.<\/li><li><b>Linker<\/b>: 세그먼트 병합 → 레이블 주소 결정 → 위치 의존·외부 참조 수정 → executable.<\/li><li><b>Loader<\/b>: header 읽기 → 가상 주소 공간 생성 → text·data 복사 → 스택에 인자 → 레지스터 초기화($sp, $fp, $gp) → startup routine으로 점프.<\/li><li><b>Dynamic linking<\/b>: 호출될 때만 라이브러리를 링크/로드. relocatable 코드 필요, 이미지 비대 방지, 새 버전 자동 반영.<\/li><li><b>Memory layout<\/b>: Text(코드) → Static data(전역, $gp) → Dynamic data(heap, malloc) → Stack(자동 저장).<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-fallacies\"><h3>Fallacies와 설계 원칙 정리<\/h3><ul><li>Fallacy: 강력한 명령어 = 높은 성능 (복잡한 명령어는 구현이 어려워 단순한 것까지 느려짐).<\/li><li>Fallacy: 고성능을 위해 어셈블리로 작성 (현대 컴파일러가 더 잘함).<\/li><li>x86은 명령어 집합을 바꾸지 않고 계속 추가 (backward compatibility).<\/li><li><b>설계 원칙 4개<\/b>: 1. Simplicity favors regularity, 2. Smaller is faster, 3. Make the common case fast, 4. Good design demands good compromises.<\/li><\/ul><\/section>", "title_en": "Addressing · 32-bit Constants · Translating and Linking", "exam_en": "Branch address calculation", "html_en": "<section class=\"sec\" id=\"s-lui-ori\"><h3>32-bit Constants: lui + ori<\/h3><p>Most constants fit in a 16-bit immediate. When a 32-bit constant is occasionally needed:<\/p>\n<ul><li><code>lui rt, constant<\/code>: copies the 16-bit constant into the <b>upper 16 bits<\/b> of rt and clears the lower 16 bits to 0.<\/li><li>Fill the lower 16 bits with <b>ori<\/b> (do not use addi, because of sign extension).<\/li><\/ul>\n<pre class=\"code\">lui $s0, 61          # 0000 0000 0111 1101 0000 0000 0000 0000\nori $s0, $s0, 2304   # 0000 0000 0111 1101 0000 1001 0000 0000<\/pre><\/section>\n<section class=\"sec\" id=\"s-branch-addr\"><h3>Branch Addressing (PC-relative)<\/h3><div class=\"tblw\"><table><thead><tr><th>op<\/th><th>rs<\/th><th>rt<\/th><th>constant or address (16)<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<ul><li>beq/bne are I-format. Most branch targets are near the branch (loops, ifs).<\/li><li><b>Target address = (PC + 4) + offset × 4<\/b><\/li><li>The offset is the <b>difference in number of instructions (words)<\/b>, signed → range <b>±2¹⁵ words<\/b> (= ±2¹⁷ bytes).<\/li><li>If the target is too far, the assembler rewrites the branch by inverting the condition and using j:<\/li><\/ul>\n<pre class=\"code\">beq $s0, $s1, L1      →      bne $s0, $s1, L2\n                             j   L1\n                         L2: …<\/pre>\n<div class=\"callout exam\">Exam point: In Week 6 the professor explained it again on the board: offset = (target − (PC + 4)) / 4. E.g., PC 108, target 124 → (124 − 112)/4 = <b>3<\/b>. (The Week 4-2 preview was rough; the Week 6 explanation is the exact rule.)<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 4-2<\/span><br>If the branch target is too far to be represented in 16 bits, place an intermediate point and jump twice. Details on the final. (For the exact offset rule, see the Week 6 board notes.)<\/div><\/section>\n<section class=\"sec\" id=\"s-jump-addr\"><h3>Jump Addressing (J-format)<\/h3><div class=\"tblw\"><table><thead><tr><th>op (6)<\/th><th>address (26)<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<ul><li>j, jal: the target can be anywhere in the text segment → encode the absolute address.<\/li><li>(Pseudo) direct jump addressing: <b>Target = address × 4<\/b> (upper 4 bits come from the PC). Range 2²⁶ words = 2²⁸ bytes.<\/li><li><code>jr<\/code>: the full 32-bit address is in a register → R-format.<\/li><\/ul>\n<p>Slide example (Loop at address 80000):<\/p>\n<pre class=\"code\">80000 Loop: sll  $t1,$s3,2     0  0 19  9 2  0\n80004       add  $t1,$t1,$s6   0  9 22  9 0 32\n80008       lw   $t0,0($t1)   35  9  8   0\n80012       bne  $t0,$s5,Exit  5  8 21   2      → (80012+4) + 2×4 = 80024 = Exit\n80016       addi $s3,$s3,1     8 19 19   1\n80020       j    Loop          2   20000        → 20000 × 4 = 80000 = Loop\n80024 Exit:<\/pre><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w3-p56.jpg\" aria-label=\"Enlarge\"><img src=\"img/w3-p56.jpg\" alt=\"week3 p.56 · Target Addressing Example (loop at address 80000)\" loading=\"lazy\"><\/button><figcaption>week3 p.56 · Target Addressing Example (loop at address 80000)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-addr-modes\"><h3>Addressing Mode Summary<\/h3><ol><li>Immediate (addi), 2. Register (add, jr), 3. Base/displacement (<b>lw, sw<\/b>), 4. PC-relative (<b>beq, bne<\/b>), 5. Pseudo-direct (<b>j, jal<\/b>).<\/li><\/ol><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w3-p57.jpg\" aria-label=\"Enlarge\"><img src=\"img/w3-p57.jpg\" alt=\"week3 p.57 · Addressing Mode Summary\" loading=\"lazy\"><\/button><figcaption>week3 p.57 · Addressing Mode Summary<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-translate\"><h3>Pseudo-instructions · Translation · Linking<\/h3><ul><li><b>Pseudo-instruction<\/b>: \"figments of the assembler's imagination\" that the assembler turns into real instructions. <code>move $t0,$t1<\/code> → <code>add $t0,$zero,$t1<\/code>, <code>blt $t0,$t1,L<\/code> → <code>slt $at,$t0,$t1<\/code> + <code>bne $at,$zero,L<\/code>.<\/li><li>Object module: header, text segment, static data, relocation info, symbol table, debug info.<\/li><li><b>Linker<\/b>: merges segments → resolves label addresses → patches location-dependent and external references → executable.<\/li><li><b>Loader<\/b>: reads the header → creates the virtual address space → copies text and data → puts arguments on the stack → initializes registers ($sp, $fp, $gp) → jumps to the startup routine.<\/li><li><b>Dynamic linking<\/b>: link/load a library procedure only when it is called. Requires relocatable code; avoids image bloat; automatically picks up new library versions.<\/li><li><b>Memory layout<\/b>: Text (code) → Static data (globals, $gp) → Dynamic data (heap, malloc) → Stack (automatic storage).<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-fallacies\"><h3>Fallacies and Design Principles Summary<\/h3><ul><li>Fallacy: powerful instructions = higher performance (complex instructions are hard to implement and may slow down even the simple ones).<\/li><li>Fallacy: use assembly code for high performance (modern compilers do better).<\/li><li>x86 never changes its instruction set, it only keeps adding (backward compatibility).<\/li><li><b>The four design principles<\/b>: 1. Simplicity favors regularity, 2. Smaller is faster, 3. Make the common case fast, 4. Good design demands good compromises.<\/li><\/ul><\/section>"}], "title_en": "Ch.2 Instructions: Language of the Computer (MIPS)", "intro_en": "The biggest chunk of the exam. The announced format is \"given an instruction and a description, fill in the blank or write the MIPS expression\". This unit has many rules the professor warned would get zero points, so be sure to read the Trap boxes."}, {"id": "U3", "title": "Ch.3 컴퓨터 연산 (정수 · 부동소수점)", "src": "week4-수업.pdf p.6–21 · week5-수업.pdf", "intro": "곱셈·나눗셈은 \"회로를 주고 과정을 보여라\" 형식. 교수님이 \"회로에 작은 변화가 있을 수 있으니 잘 보라\"고 했어. 중간엔 product·multiplicand 8 bit, multiplier 4 bit 크기로만 나옴. 부동소수점은 필드 비트 수를 하나라도 틀리면 0점.", "lessons": [{"id": "L3-1", "title": "덧셈 · 뺄셈 · 오버플로", "src": "week4 p.6–13", "exam": "오버플로 판정", "secs": [{"id": "int-add", "title": "정수 덧셈과 뺄셈", "title_en": "Integer Addition and Subtraction"}, {"id": "overflow", "title": "오버플로 판정", "title_en": "Detecting Overflow"}], "md": "## 정수 덧셈과 뺄셈 {#int-add}\n\n- 덧셈은 십진수와 같음: 자리마다 더하고 2 이상이면 carry를 다음 자리로.\n- 예: 7 + 6 = `0111 + 0110 = 1101` (13).\n- **뺄셈 = 음수 더하기**: 7 − 6 = 7 + (−6). −6은 2의 보수(반전 + 1)로 만든다.\n\n## 오버플로 판정 {#overflow}\n\n결과가 표현 범위(예: 32-bit)를 넘으면 overflow.\n\n| 연산 | 오버플로 조건 |\n|---|---|\n| 양수 + 음수 | **절대 없음** |\n| 양수 + 양수 | 결과의 sign bit가 **1** |\n| 음수 + 음수 | 결과의 sign bit가 **0** |\n| 양수 − 양수, 음수 − 음수 | 없음 |\n| 음수 − 양수 | 결과 sign이 **0** |\n| 양수 − 음수 | 결과 sign이 **1** |\n\n원리: 2의 보수에서 첫 비트가 부호. 양수 둘을 더해 음수가 나올 수 없으니 sign이 1이면 오버플로. 현대 CPU는 오버플로를 **exception**으로 처리.", "html": "<section class=\"sec\" id=\"s-int-add\"><h3>정수 덧셈과 뺄셈<\/h3><ul><li>덧셈은 십진수와 같음: 자리마다 더하고 2 이상이면 carry를 다음 자리로.<\/li><li>예: 7 + 6 = <code>0111 + 0110 = 1101<\/code> (13).<\/li><li><b>뺄셈 = 음수 더하기<\/b>: 7 − 6 = 7 + (−6). −6은 2의 보수(반전 + 1)로 만든다.<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-overflow\"><h3>오버플로 판정<\/h3><p>결과가 표현 범위(예: 32-bit)를 넘으면 overflow.<\/p>\n<div class=\"tblw\"><table><thead><tr><th>연산<\/th><th>오버플로 조건<\/th><\/tr><\/thead><tbody><tr><td>양수 + 음수<\/td><td><b>절대 없음<\/b><\/td><\/tr><tr><td>양수 + 양수<\/td><td>결과의 sign bit가 <b>1<\/b><\/td><\/tr><tr><td>음수 + 음수<\/td><td>결과의 sign bit가 <b>0<\/b><\/td><\/tr><tr><td>양수 − 양수, 음수 − 음수<\/td><td>없음<\/td><\/tr><tr><td>음수 − 양수<\/td><td>결과 sign이 <b>0<\/b><\/td><\/tr><tr><td>양수 − 음수<\/td><td>결과 sign이 <b>1<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<p>원리: 2의 보수에서 첫 비트가 부호. 양수 둘을 더해 음수가 나올 수 없으니 sign이 1이면 오버플로. 현대 CPU는 오버플로를 <b>exception<\/b>으로 처리.<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">04주-2<\/span><br>양수 + 음수는 절대 오버플로가 없다. 첫 비트(부호)만 보면 판정된다. 현대 CPU는 오버플로를 exception으로 처리해 회로를 보호.<\/div><\/section>", "title_en": "Addition · Subtraction · Overflow", "exam_en": "Detecting overflow", "html_en": "<section class=\"sec\" id=\"s-int-add\"><h3>Integer Addition and Subtraction<\/h3><ul><li>Addition works like decimal: add digit by digit, and if a column reaches 2 or more, carry to the next column.<\/li><li>Example: 7 + 6 = <code>0111 + 0110 = 1101<\/code> (13).<\/li><li><b>Subtraction = adding the negative<\/b>: 7 − 6 = 7 + (−6). Make −6 using two's complement (invert + 1).<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-overflow\"><h3>Detecting Overflow<\/h3><p>Overflow occurs if the result is out of range (e.g., 32 bits).<\/p>\n<div class=\"tblw\"><table><thead><tr><th>Operation<\/th><th>Overflow condition<\/th><\/tr><\/thead><tbody><tr><td>Positive + negative<\/td><td><b>None<\/b><\/td><\/tr><tr><td>Positive + positive<\/td><td>Result sign bit is <b>1<\/b><\/td><\/tr><tr><td>Negative + negative<\/td><td>Result sign bit is <b>0<\/b><\/td><\/tr><tr><td>Positive − positive, negative − negative<\/td><td>None<\/td><\/tr><tr><td>Negative − positive<\/td><td>Result sign is <b>0<\/b><\/td><\/tr><tr><td>Positive − negative<\/td><td>Result sign is <b>1<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<p>Why: in two's complement the first bit is the sign. Adding two positives cannot give a negative, so a sign bit of 1 means overflow. Modern CPUs handle overflow as an <b>exception<\/b>.<\/p><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 4-2<\/span><br>Positive + negative never overflows. Looking at the first bit (sign) alone is enough to decide. Modern CPUs handle overflow as an exception to protect the circuit.<\/div><\/section>"}, {"id": "L3-2", "title": "곱셈 하드웨어", "src": "week4 p.14–18 · week5 p.5–8, 14–15", "exam": "곱셈 과정 표", "secs": [{"id": "mult-basic", "title": "곱셈의 원리", "title_en": "How Multiplication Works"}, {"id": "mult-v1", "title": "원래 곱셈기 (first version)", "title_en": "The Original Multiplier (first version)"}, {"id": "mult-v2", "title": "개선된 곱셈기 (refined version)", "title_en": "The Refined Multiplier (refined version)"}, {"id": "mult-examples", "title": "수업 예제 1·2 (week5)", "title_en": "Class Examples 1 and 2 (Week 5)"}, {"id": "mult-instr", "title": "MIPS 곱셈 명령어", "title_en": "MIPS Multiplication Instructions"}], "md": "## 곱셈의 원리 {#mult-basic}\n\n종이 곱셈과 같다: multiplier의 각 자리를 보고 1이면 multiplicand를 (자리만큼 shift해서) 더하고, 0이면 더하지 않음.\n```\n   multiplicand     1000\n × multiplier     × 1001\n                    1000\n                   0000\n                  0000\n                 1000\n   product       1001000      (8 × 9 = 72)\n```\nn-bit × n-bit → 결과는 최대 **2n bit**.\n\n## 원래 곱셈기 (first version) {#mult-v1}\n\n구성: **Multiplicand 64-bit (Shift left)**, **Multiplier 32-bit (Shift right)**, **64-bit ALU**, **Product 64-bit**, Control test. (중간엔 8-bit / 4-bit / 8-bit로 축소)\n\n알고리즘:\n1. **Product = 0**으로 초기화.\n2. Multiplier의 **LSB 검사**: 1이면 `Product = Product + Multiplicand` (ALU에 덧셈 신호), 0이면 아무것도 안 함.\n3. 결과와 상관없이 **매 반복**: Multiplicand **왼쪽 shift**, Multiplier **오른쪽 shift**.\n4. 32번(중간 크기에선 4번) 반복하면 끝. (교수님 설명: multiplier가 0이 되면 종료)\n\n1000 × 1001:\n\n| 반복 | 단계 | Multiplier | Multiplicand | Product |\n|---|---|---|---|---|\n| 0 | 초기값 | 1001 | 0000 1000 | 0000 0000 |\n| 1 | LSB=1 → Prod += Mcand | 1001 | 0000 1000 | 0000 1000 |\n| 1 | Mcand <<1, Mplier >>1 | 0100 | 0001 0000 | 0000 1000 |\n| 2 | LSB=0 → 덧셈 없음, shift | 0010 | 0010 0000 | 0000 1000 |\n| 3 | LSB=0 → 덧셈 없음, shift | 0001 | 0100 0000 | 0000 1000 |\n| 4 | LSB=1 → Prod += Mcand | 0001 | 0100 0000 | 0100 1000 |\n| 4 | shift | 0000 | 1000 0000 | **0100 1000** (= 72) |\n\n## 개선된 곱셈기 (refined version) {#mult-v2}\n\n구성: **Multiplicand 32-bit (shift 안 함)**, **32-bit ALU**, **Product 64-bit (Shift right)**. Multiplier 레지스터가 따로 없음.\n\n알고리즘:\n1. Product의 **아래 절반에 multiplier**를 넣고 위 절반은 0.\n2. Product의 **LSB 검사**: 1이면 Product의 **위 절반에 multiplicand를 더함**.\n3. 매 반복: Product 전체를 **오른쪽 shift**.\n4. 종료: **shift 횟수 = multiplier 비트 수** (shift counter).\n\n> 함정: 종료 조건의 기준은 **multiplier**의 비트 수. multiplicand 아님 (교수님: \"be extremely careful it is not the multiplicand\").\n\n1000 × 1001:\n\n| 반복 | 단계 | Product |\n|---|---|---|\n| 0 | 초기값 (아래 = multiplier) | 0000 1001 |\n| 1 | LSB=1 → 위 절반 += 1000 | 1000 1001 |\n| 1 | >> 1 | 0100 0100 |\n| 2 | LSB=0, >> 1 | 0010 0010 |\n| 3 | LSB=0, >> 1 | 0001 0001 |\n| 4 | LSB=1 → 위 절반 += 1000 | 1001 0001 |\n| 4 | >> 1 | **0100 1000** (= 72) |\n\n## 수업 예제 1·2 (week5) {#mult-examples}\n\n**Example 1: 1010 × 0010 (원래 곱셈기)** → 10 × 2 = 20\n\n| 반복 | LSB | 동작 | Multiplier (shift 후) | Multiplicand (shift 후) | Product |\n|---|---|---|---|---|---|\n| 0 | | 초기값 | 0010 | 0000 1010 | 0000 0000 |\n| 1 | 0 | 덧셈 없음 | 0001 | 0001 0100 | 0000 0000 |\n| 2 | 1 | Prod += 0001 0100 | 0000 | 0010 1000 | 0001 0100 |\n| 3 | 0 | 덧셈 없음 | 0000 | 0101 0000 | 0001 0100 |\n| 4 | 0 | 덧셈 없음 | 0000 | 1010 0000 | **0001 0100** (= 20) |\n\n**Example 2: 1010 × 1100 (개선 곱셈기)** → 10 × 12 = 120\n\n| 반복 | LSB | 동작 | Product (동작 후) | Product (>>1 후) |\n|---|---|---|---|---|\n| 0 | | 초기값 | 0000 1100 | |\n| 1 | 0 | 덧셈 없음 | 0000 1100 | 0000 0110 |\n| 2 | 0 | 덧셈 없음 | 0000 0110 | 0000 0011 |\n| 3 | 1 | 위 절반 += 1010 | 1010 0011 | 0101 0001 |\n| 4 | 1 | 위 절반 += 1010 | 1111 0001 | **0111 1000** (= 120) |\n\n## MIPS 곱셈 명령어 {#mult-instr}\n\n- 64-bit 곱 결과용 레지스터 2개: **HI** (위 32 bit), **LO** (아래 32 bit).\n- `mult rs, rt` / `multu rs, rt`: 64-bit 곱을 HI/LO에.\n- `mfhi rd` / `mflo rd`: HI/LO를 rd로 옮김. HI를 보면 32 bit 오버플로 여부를 알 수 있음.\n- `mul rd, rs, rt`: 곱의 아래 32 bit만 rd에.", "html": "<section class=\"sec\" id=\"s-mult-basic\"><h3>곱셈의 원리<\/h3><p>종이 곱셈과 같다: multiplier의 각 자리를 보고 1이면 multiplicand를 (자리만큼 shift해서) 더하고, 0이면 더하지 않음.<\/p>\n<pre class=\"code\">   multiplicand     1000\n × multiplier     × 1001\n                    1000\n                   0000\n                  0000\n                 1000\n   product       1001000      (8 × 9 = 72)<\/pre>\n<p>n-bit × n-bit → 결과는 최대 <b>2n bit<\/b>.<\/p><\/section>\n<section class=\"sec\" id=\"s-mult-v1\"><h3>원래 곱셈기 (first version)<\/h3><p>구성: <b>Multiplicand 64-bit (Shift left)<\/b>, <b>Multiplier 32-bit (Shift right)<\/b>, <b>64-bit ALU<\/b>, <b>Product 64-bit<\/b>, Control test. (중간엔 8-bit / 4-bit / 8-bit로 축소)<\/p>\n<p>알고리즘:<\/p>\n<ol><li><b>Product = 0<\/b>으로 초기화.<\/li><li>Multiplier의 <b>LSB 검사<\/b>: 1이면 <code>Product = Product + Multiplicand<\/code> (ALU에 덧셈 신호), 0이면 아무것도 안 함.<\/li><li>결과와 상관없이 <b>매 반복<\/b>: Multiplicand <b>왼쪽 shift<\/b>, Multiplier <b>오른쪽 shift<\/b>.<\/li><li>32번(중간 크기에선 4번) 반복하면 끝. (교수님 설명: multiplier가 0이 되면 종료)<\/li><\/ol>\n<p>1000 × 1001:<\/p>\n<div class=\"tblw\"><table><thead><tr><th>반복<\/th><th>단계<\/th><th>Multiplier<\/th><th>Multiplicand<\/th><th>Product<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>초기값<\/td><td>1001<\/td><td>0000 1000<\/td><td>0000 0000<\/td><\/tr><tr><td>1<\/td><td>LSB=1 → Prod += Mcand<\/td><td>1001<\/td><td>0000 1000<\/td><td>0000 1000<\/td><\/tr><tr><td>1<\/td><td>Mcand &lt;&lt;1, Mplier &gt;&gt;1<\/td><td>0100<\/td><td>0001 0000<\/td><td>0000 1000<\/td><\/tr><tr><td>2<\/td><td>LSB=0 → 덧셈 없음, shift<\/td><td>0010<\/td><td>0010 0000<\/td><td>0000 1000<\/td><\/tr><tr><td>3<\/td><td>LSB=0 → 덧셈 없음, shift<\/td><td>0001<\/td><td>0100 0000<\/td><td>0000 1000<\/td><\/tr><tr><td>4<\/td><td>LSB=1 → Prod += Mcand<\/td><td>0001<\/td><td>0100 0000<\/td><td>0100 1000<\/td><\/tr><tr><td>4<\/td><td>shift<\/td><td>0000<\/td><td>1000 0000<\/td><td><b>0100 1000<\/b> (= 72)<\/td><\/tr><\/tbody><\/table><\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">04주-2 · 05주-1<\/span><br>중간에서는 product·multiplicand 8 bit, multiplier 4 bit로만 나온다. LSB 결과와 상관없이 <b>매 반복 두 번 shift<\/b> (multiplier 오른쪽, multiplicand 왼쪽).<\/div><figu
