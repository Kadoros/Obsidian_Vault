<meta charset="utf-8">
<title>컴구 중간 트레이너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: lab notebook — faint ruled paper, indigo "datapath" accent, orange signal highlight, red-pen grading. Left course tree + right reading/quiz pane; stacks on phones. */
:root{
  --paper:#f2f5f5; --sheet:#ffffff; --ink:#152225; --muted:#56676b; --line:#d8e1e2;
  --rule:rgba(76,59,207,.06); --accent:#4c3bcf; --accent-weak:#ecebfd; --accent-ink:#ffffff; --sig:#f08c00; --chalk:#20302a; --chalk-ink:#eef5ea;
  --pen:#d1372b; --ok:#2b8a3e; --ok-weak:#e4f3e7; --warn:#a8670d; --warn-weak:#fbefd9; --bad:#c3352b; --bad-weak:#fbe6e4;
  --code-bg:#f0f4f4; --hl:#fff3bf;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-pen:"Nanum Pen Script","Apple SD Gothic Neo",cursive;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0d1416; --sheet:#141d20; --ink:#e3ecee; --muted:#93a6aa; --line:#24333a;
  --rule:rgba(169,155,255,.05); --accent:#a99bff; --accent-weak:#25214a; --accent-ink:#0d1416; --sig:#ffa94d; --chalk:#1b2a24; --chalk-ink:#e4efe0;
  --pen:#ff6d5f; --ok:#5cc278; --ok-weak:#15301d; --warn:#e2a84b; --warn-weak:#33270f; --bad:#ff6d5f; --bad-weak:#3a1a18;
  --code-bg:#10181b; --hl:#3a3410; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0d1416; --sheet:#141d20; --ink:#e3ecee; --muted:#93a6aa; --line:#24333a;
  --rule:rgba(169,155,255,.05); --accent:#a99bff; --accent-weak:#25214a; --accent-ink:#0d1416; --sig:#ffa94d; --chalk:#1b2a24; --chalk-ink:#e4efe0;
  --pen:#ff6d5f; --ok:#5cc278; --ok-weak:#15301d; --warn:#e2a84b; --warn-weak:#33270f; --bad:#ff6d5f; --bad-weak:#3a1a18;
  --code-bg:#10181b; --hl:#3a3410; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 28px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand .course{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{font-family:var(--f-mono);font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);color:var(--muted);white-space:nowrap}
.chip.dday{color:var(--pen);border-color:color-mix(in srgb,var(--pen) 40%,var(--line));font-weight:600}
.chip.live{color:var(--ok)} .chip.local{color:var(--warn)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font:inherit;font-size:14px;font-weight:500;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 12px 9px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.view{padding-top:20px}
h2{font-size:16px;margin:0 0 10px;font-weight:700;text-wrap:balance}
h3{font-size:15px;margin:0 0 8px;font-weight:700;text-wrap:balance}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .note{font-size:12.5px;color:var(--muted)} .err{font-size:13px;color:var(--bad)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
.btn{font:inherit;font-size:13.5px;font-weight:500;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.sm{font-size:12.5px;padding:4px 9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.st{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
.st.none{background:var(--line);color:var(--muted)} .st.weak{background:var(--bad-weak);color:var(--bad)}
.st.mid{background:var(--warn-weak);color:var(--warn)} .st.good{background:var(--ok-weak);color:var(--ok)}
.st.lock{background:none;color:var(--muted);border:1px dashed var(--line)}
.tag{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--accent-weak);color:var(--accent);font-weight:500}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
pre.code{margin:0;font-family:var(--f-mono);font-size:12.5px;line-height:1.55;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre}
code{font-family:var(--f-mono);font-size:.88em;background:var(--code-bg);border:1px solid var(--line);border-radius:4px;padding:0 4px}
select,input[type=text]{font:inherit;font-size:13.5px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);max-width:100%}
textarea{width:100%;min-height:150px;font-family:var(--f-mono);font-size:13px;line-height:1.55;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);resize:vertical}
/* learn layout */
.learn{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.learn{grid-template-columns:minmax(0,1fr)}}
.tree{position:sticky;top:118px;max-height:calc(100vh - 140px);overflow:auto;padding:10px 0}
@media (max-width:900px){.tree{position:static;max-height:none}}
.tree details{border-bottom:1px solid var(--line)} .tree details:last-child{border-bottom:0}
.tree summary{list-style:none;cursor:pointer;padding:9px 14px;display:flex;flex-direction:column;gap:4px}
.tree summary::-webkit-details-marker{display:none}
.tree .ut{font-size:13.5px;font-weight:600;line-height:1.35}
.ubar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}.ubar>b{display:block;height:100%;background:var(--accent)}
.lrow{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:6px 14px 6px 18px;border:0;background:none;color:inherit;font:inherit;font-size:13px;text-align:left;cursor:pointer;line-height:1.35}
.lrow:hover{background:var(--accent-weak)} .lrow.cur{background:var(--accent-weak);box-shadow:inset 3px 0 0 var(--accent)}
.lrow[disabled]{cursor:not-allowed;opacity:.55}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.dot.done{background:var(--ok);border-color:var(--ok)} .dot.weak{background:var(--bad-weak);border-color:var(--bad)} .dot.cur{border-color:var(--accent)}
.lnum{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
/* reader */
.reader{padding:22px 26px;min-width:0}
@media (max-width:600px){.reader{padding:16px}}
.rhead{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.rhead h2{font-size:21px;margin:0}
.body{max-width:72ch}
.sec{padding:14px 0 6px;border-bottom:1px dashed var(--line);scroll-margin-top:130px}
.sec:last-child{border-bottom:0}
.sec h3{font-size:16.5px;margin:0 0 10px;display:flex;gap:8px;align-items:baseline}
.sec h3::before{content:"§";font-family:var(--f-mono);color:var(--accent);font-weight:600}
.sec.review{background:linear-gradient(90deg,var(--hl),transparent 85%);margin-inline:-14px;padding-inline:14px;border-radius:8px}
.sec p,.sec ul,.sec ol{margin:0 0 10px} .sec ul,.sec ol{padding-left:20px} .sec li{margin:2px 0}
.sec .sub{font-size:14px;color:var(--muted)}
.sec pre.code{margin:4px 0 12px}
.tblw{overflow-x:auto;margin:4px 0 12px}
.tblw table{border-collapse:collapse;font-size:13.5px;min-width:100%}
.tblw th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:7px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.tblw td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.callout{font-size:14px;background:var(--accent-weak);border-radius:8px;padding:9px 12px;margin:4px 0 12px}
.callout.exam{background:var(--warn-weak)} .callout.exam::before{content:"시험 ";font-weight:700;color:var(--warn)} [lang="en"] .callout.exam::before{content:none}
.langsw{display:flex;gap:4px;align-items:center;padding:4px 14px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}.hlang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.hlang button{font:inherit;font-family:var(--f-mono,monospace);font-size:11.5px;padding:3px 9px;border:0;background:var(--sheet);color:var(--muted);cursor:pointer}.hlang button.on{background:var(--accent);color:var(--accent-ink,#fff)}
.langsw .note{margin-right:auto}.langsw button{font:inherit;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}.langsw button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink,#fff)}
.callout.trap{background:var(--bad-weak)}
.callout.prof{background:var(--sheet);border:1px solid var(--line);border-left:3px solid var(--accent)} .callout.prof b{color:var(--accent)} .callout.prof .src{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.rfoot{margin-top:20px;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-weak);border-radius:var(--r)}
.banner{position:sticky;top:112px;z-index:4;margin-bottom:14px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--warn-weak);border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-radius:var(--r);font-size:13.5px}
/* quiz */
.qwrap{padding:20px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:600px){.qwrap{padding:16px}}
.qtop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.pips{display:flex;gap:4px}.pips i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--accent)} .pips i.ok{background:var(--ok)} .pips i.no{background:var(--bad)}
.prompt{font-size:15.5px;white-space:pre-wrap;max-width:75ch}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{font:inherit;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);cursor:pointer;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
.choice:hover{border-color:var(--accent)} .choice.sel{border-color:var(--accent);background:var(--accent-weak)}
.choice.right{border-color:var(--ok);background:var(--ok-weak)} .choice.wrongc{border-color:var(--bad);background:var(--bad-weak)}
.choice .k{font-family:var(--f-mono);color:var(--muted)}
.ox{display:flex;gap:10px}.ox .choice{grid-template-columns:1fr;text-align:center;font-size:22px;font-weight:700;min-width:90px}
.blanks{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;align-items:center;max-width:520px}
.blanks label{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.result{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.mark{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pen{font-family:var(--f-pen);color:var(--pen);font-size:44px;line-height:1;transform:rotate(-4deg);display:inline-block;min-width:60px}
.pen small{font-size:26px}
.fb{font-size:14px;max-width:70ch}
.missed{margin:0;padding-left:18px;font-size:13.5px;color:var(--bad)}
.tip{font-size:13.5px;background:var(--warn-weak);border-radius:8px;padding:9px 12px;max-width:75ch;white-space:pre-wrap}
.tip b{color:var(--warn)}
.goto{font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sumrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sumrow:last-child{border-bottom:0}
.revcard{padding:14px 16px;display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--bad)}
/* home */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.stat{padding:12px 14px}.stat .v{font-family:var(--f-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}.stat .s{font-size:12px;color:var(--muted)}
.cta{padding:18px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:20px}
.cta .t{font-size:17px;font-weight:700}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ucard{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.ucard .ul{display:flex;flex-direction:column}
.ucard .li{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding:5px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font-family:inherit;text-align:left;cursor:pointer}
.ucard .li[disabled]{cursor:not-allowed;opacity:.55}
.weaklist{display:flex;flex-direction:column}
.wk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.wk:last-child{border-bottom:0}
/* practice etc */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.practice{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.practice{grid-template-columns:minmax(0,1fr)}}
.qlist{max-height:calc(100vh - 220px);overflow:auto;position:sticky;top:118px}
@media (max-width:900px){.qlist{max-height:260px;position:static}}
.qrow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:8px 12px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.qrow:hover{background:var(--accent-weak)} .qrow.cur{background:var(--accent-weak);box-shadow:inset 3px 0 0 var(--accent)}
.qrow .t{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd{width:9px;height:9px;border-radius:50%;background:var(--line)}
.sd.good{background:var(--ok)} .sd.mid{background:var(--warn)} .sd.weak{background:var(--bad)}
.yr{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.mockhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;margin-bottom:14px;position:sticky;top:112px;z-index:3}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}.timer.low{color:var(--pen)}
.mockq{margin-bottom:12px}
.chart{width:100%;height:auto;display:block}
.hist{width:100%;border-collapse:collapse;font-size:13px}
.hist td,.hist th{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
.hist th{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:700px){.cols{grid-template-columns:minmax(0,1fr)}}
.cols pre{white-space:pre-wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
figure.slide{margin:6px 0 14px;display:flex;flex-direction:column;gap:6px}
figure.slide .zoom{padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:zoom-in;overflow:hidden;display:block;max-width:100%}
figure.slide img{display:block;width:100%;height:auto}
figure.slide figcaption{font-size:12.5px;color:var(--muted)}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(8,14,16,.86);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px;background:#fff}
.lightbox .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:14px;font:inherit;font-size:13px;color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 10px;cursor:pointer}
.tbl-wrap{overflow-x:auto}
table.topics{width:100%;border-collapse:collapse;font-size:13.5px}
table.topics th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:10px 10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.topics td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.topics tr.ugrp td{background:var(--code-bg);font-weight:600;font-size:12.5px;color:var(--muted)}
table.topics tr.dim td{opacity:.55}
.tname{font-weight:500}.tsub{font-size:11.5px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:70px}.bar>b{display:block;height:100%;background:var(--accent);border-radius:4px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.pts{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--warn-weak);color:var(--warn);white-space:nowrap}
.recs{display:flex;flex-direction:column}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;font:inherit;color:inherit;text-align:left;width:100%}
.rec:last-child{border-bottom:0}.rec:hover{background:var(--accent-weak)}
.rec .q{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.why{font-size:11.5px;color:var(--muted);white-space:nowrap}
.prev{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.prev.ok{background:var(--ok-weak);color:var(--ok)} .prev.no{background:var(--bad-weak);color:var(--bad)}

/* sig table */
.sigtbl{display:grid;grid-template-columns:auto auto;gap:6px 14px;align-items:center;justify-content:start}
.sigtbl label{font-family:var(--f-mono);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sv{font:inherit;font-family:var(--f-mono);font-size:13px;min-width:38px;padding:5px 0;border:0;border-right:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer}
.sv:last-child{border-right:0} .sv:hover{background:var(--accent-weak)}
.sv.sel{background:var(--accent);color:var(--accent-ink)} .sv.right{background:var(--ok-weak);color:var(--ok);font-weight:700} .sv.wrongc{background:var(--bad-weak);color:var(--bad)}
/* walk */
.wtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.wtab{font:inherit;font-size:13.5px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);color:var(--muted);cursor:pointer}

<script id="pl-data" type="application/json">{"units": [{"id": "U1", "title": "Ch.1 컴퓨터 개요와 성능", "src": "week1-orientation.pdf · W02 Performance.pdf", "intro": "시험은 영어로 쓰고 영어로 답해. 이 단원은 서술형(용어 정의)과 계산형(CPU time · CPI · Amdahl · MIPS)이 반반. 계산 문제는 교수님이 \"수업 예제랑 거의 똑같이 나온다\"고 했으니 슬라이드 예제를 손으로 다 풀 수 있어야 해.", "lessons": [{"id": "L1-1", "title": "컴퓨터 구성 요소 · 추상화 · ISA", "src": "W02 p.2–16", "exam": "구성요소 서술", "secs": [{"id": "course-info", "title": "수업 범위와 시험 방식", "title_en": "Course Scope and Exam Format"}, {"id": "classes-ideas", "title": "컴퓨터의 종류와 8가지 아이디어", "title_en": "Classes of Computers and the Eight Great Ideas"}, {"id": "below-program", "title": "프로그램 아래의 계층 · 번역 단계", "title_en": "Below Your Program · Translation Steps"}, {"id": "components", "title": "컴퓨터의 구성 요소", "title_en": "Components of a Computer"}, {"id": "isa", "title": "추상화와 ISA", "title_en": "Abstraction and ISA"}], "md": "## 수업 범위와 시험 방식 {#course-info}\n\n- 교재: Computer Organization and Design (MIPS). 하지만 **수업 자료만으로** 출제.\n- **모든 수업·시험이 영어. 답도 영어로 써야 함.**\n- 평가: 출석(랜덤 호명) 10%, **중간 45%**, 기말 45%. 중간·기말 모두 closed book, 오프라인.\n- 중간 범위: Performance → Instructions → Arithmetic → Processor(단순 버전, single-cycle). 파이프라인은 기말.\n\n> 시험 포인트: 중간은 10/20(화) 17:00–19:00. 못 오면 교수님께 이메일.\n\n## 컴퓨터의 종류와 8가지 아이디어 {#classes-ideas}\n\n| 종류 | 목적 | 특징 |\n|---|---|---|\n| Supercomputer | 고성능 과학·공학 계산 | 성능 지표 **FLOPS** (> MIPS), ~10^17 |\n| Server | 네트워크 기반 고성능 처리 | 용량·성능·신뢰성 |\n| Personal computer | 범용 | 비용/성능 trade-off |\n| Embedded | 시스템 안에 숨어 있음 | 전력·성능·비용 제약이 가장 엄격 |\n\n**Eight Great Ideas**: Design for Moore's Law · Use abstraction to simplify design · **Make the common case fast** · Hierarchy of memories · Dependability via redundancy · Performance via parallelism · Performance via pipelining · Performance via prediction.\n\n## 프로그램 아래의 계층 · 번역 단계 {#below-program}\n\n- **Application software**: 고급 언어(HLL)로 작성 (브라우저, 앱, Office).\n- **System software**: **Compiler** (HLL → 기계어, 예: GCC) + **Operating System** (입출력, 메모리·저장장치 관리, 작업 스케줄링·자원 공유).\n- **Hardware**: processor, memory, I/O controllers.\n\n번역: `A+B` (HLL) → `add A, B` (assembly, 사람도 읽음) → 이진 machine language.\n\nOS가 앱에 해 주는 것: loading·process creation, **system call**, resource management(메모리·CPU 스케줄링·I/O), IPC, event handling, error handling. 슬라이드 내용을 외울 필요는 없고 \"OS가 앱 흐름에서 무엇을 하는지\"만.\n\n## 컴퓨터의 구성 요소 {#components}\n\n- **Input/Output**: 사용자 장치(키보드·마우스), 저장 장치(HDD·Flash), **네트워크 어댑터도 I/O** (LAN·Wi-Fi·Bluetooth).\n- **Memory**: Primary(RAM: DRAM/SRAM, 휘발성), Secondary(HDD·SSD), **Cache**(작고 빠름, 보통 SRAM). ROM = 비휘발, 부팅용 펌웨어(BIOS).\n- **Processor = Datapath + Control unit**\n  - **Datapath**: 실제 데이터 처리(산술·논리·메모리 접근). 구성: ALU, Registers, MUX, Buses.\n  - **Control unit**: 메모리에서 가져온 명령어를 해석해 **control signals**를 만들어 datapath를 지휘.\n- 장치끼리는 **bus**(address bus, data bus, control bus)로 통신.\n\n> 시험 포인트: \"Processor의 두 구성 요소와 역할\" → Datapath(데이터를 실제로 처리), Control unit(명령어 해석 → 제어 신호 생성).\n\n## 추상화와 ISA {#isa}\n\n**ISA (Instruction Set Architecture)**: 하드웨어와 저수준 소프트웨어 사이의 **인터페이스**. 프로세서가 명령어를 어떻게 해석·실행하는지, 어떤 레지스터가 있는지, 데이터에 어떻게 접근하는지에 대한 **계약(contract)**.\n\n- 개발자가 하드웨어 내부를 몰라도 소프트웨어를 쓸 수 있게 해 줌 (abstraction = hide lower-level detail).\n- **Portability**: 하드웨어가 바뀌어도 소프트웨어를 고칠 필요가 없음. 교수님이 가장 중요하다고 한 성질.\n- Register = 프로세서 안에 있는 가장 빠른 메모리.\n\n> 한 줄 답안: ISA is the interface between hardware and low-level software; it defines how instructions are executed, which registers exist, and how data is accessed, so software can run without knowing hardware details (portability).", "html": "<section class=\"sec\" id=\"s-course-info\"><h3>수업 범위와 시험 방식<\/h3><ul><li>교재: Computer Organization and Design (MIPS). 하지만 <b>수업 자료만으로<\/b> 출제.<\/li><li><b>모든 수업·시험이 영어. 답도 영어로 써야 함.<\/b><\/li><li>평가: 출석(랜덤 호명) 10%, <b>중간 45%<\/b>, 기말 45%. 중간·기말 모두 closed book, 오프라인.<\/li><li>중간 범위: Performance → Instructions → Arithmetic → Processor(단순 버전, single-cycle). 파이프라인은 기말.<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 중간은 10/20(화) 17:00–19:00. 못 오면 교수님께 이메일.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">01주-1<\/span><br>모든 수업과 시험이 영어고 <b>답도 영어로<\/b> 써야 한다. 중간·기말 모두 closed book·오프라인. '중간 전까지는 비교적 쉽고, 중간 이후 파이프라인부터 어려워진다.' 출석은 매번 안 부르고 랜덤 호명.<\/div><div class=\"actions\" style=\"margin:4px 0 10px\"><button class=\"btn sm ghost\" data-walk=\"w6-2:0\">▶ 06주-2 3:45 중간고사 공지<\/button><\/div><\/section>\n<section class=\"sec\" id=\"s-classes-ideas\"><h3>컴퓨터의 종류와 8가지 아이디어<\/h3><div class=\"tblw\"><table><thead><tr><th>종류<\/th><th>목적<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>Supercomputer<\/td><td>고성능 과학·공학 계산<\/td><td>성능 지표 <b>FLOPS<\/b> (&gt; MIPS), ~10^17<\/td><\/tr><tr><td>Server<\/td><td>네트워크 기반 고성능 처리<\/td><td>용량·성능·신뢰성<\/td><\/tr><tr><td>Personal computer<\/td><td>범용<\/td><td>비용/성능 trade-off<\/td><\/tr><tr><td>Embedded<\/td><td>시스템 안에 숨어 있음<\/td><td>전력·성능·비용 제약이 가장 엄격<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Eight Great Ideas<\/b>: Design for Moore's Law · Use abstraction to simplify design · <b>Make the common case fast<\/b> · Hierarchy of memories · Dependability via redundancy · Performance via parallelism · Performance via pipelining · Performance via prediction.<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">01주-2<\/span><br>슈퍼컴퓨터는 FLOPS로 재고 일반 데스크톱보다 약 1만 배 빠르다. 8가지 아이디어 중 memory hierarchy·prediction은 기말 쪽, parallelism·pipelining은 파이프라인과 연결.<\/div><\/section>\n<section class=\"sec\" id=\"s-below-program\"><h3>프로그램 아래의 계층 · 번역 단계<\/h3><ul><li><b>Application software<\/b>: 고급 언어(HLL)로 작성 (브라우저, 앱, Office).<\/li><li><b>System software<\/b>: <b>Compiler<\/b> (HLL → 기계어, 예: GCC) + <b>Operating System<\/b> (입출력, 메모리·저장장치 관리, 작업 스케줄링·자원 공유).<\/li><li><b>Hardware<\/b>: processor, memory, I/O controllers.<\/li><\/ul>\n<p>번역: <code>A+B<\/code> (HLL) → <code>add A, B<\/code> (assembly, 사람도 읽음) → 이진 machine language.<\/p>\n<p>OS가 앱에 해 주는 것: loading·process creation, <b>system call<\/b>, resource management(메모리·CPU 스케줄링·I/O), IPC, event handling, error handling. 슬라이드 내용을 외울 필요는 없고 \"OS가 앱 흐름에서 무엇을 하는지\"만.<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">01주-2<\/span><br>OS 슬라이드는 외울 필요 없고 'OS가 앱 흐름에서 무엇을 하는지'만. 예: 카톡에서 사진 보낼 때 '접근 허용하시겠습니까?'가 뜨는 게 OS의 일(system call).<\/div><\/section>\n<section class=\"sec\" id=\"s-components\"><h3>컴퓨터의 구성 요소<\/h3><ul><li><b>Input/Output<\/b>: 사용자 장치(키보드·마우스), 저장 장치(HDD·Flash), <b>네트워크 어댑터도 I/O<\/b> (LAN·Wi-Fi·Bluetooth).<\/li><li><b>Memory<\/b>: Primary(RAM: DRAM/SRAM, 휘발성), Secondary(HDD·SSD), <b>Cache<\/b>(작고 빠름, 보통 SRAM). ROM = 비휘발, 부팅용 펌웨어(BIOS).<\/li><li><b>Processor = Datapath + Control unit<\/b><ul><li><b>Datapath<\/b>: 실제 데이터 처리(산술·논리·메모리 접근). 구성: ALU, Registers, MUX, Buses.<\/li><li><b>Control unit<\/b>: 메모리에서 가져온 명령어를 해석해 <b>control signals<\/b>를 만들어 datapath를 지휘.<\/li><\/ul><\/li><li>장치끼리는 <b>bus<\/b>(address bus, data bus, control bus)로 통신.<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: \"Processor의 두 구성 요소와 역할\" → Datapath(데이터를 실제로 처리), Control unit(명령어 해석 → 제어 신호 생성).<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">01주-2<\/span><br>네트워크 장치도 I/O라는 걸 많이 헷갈린다. Control unit이 명령어(예: 덧셈)를 읽으면 datapath의 ALU가 동작하도록 신호를 보낸다. 캐시는 이 수업에서 가장 주의할 메모리(기말).<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w2-p13.jpg\" aria-label=\"크게 보기\"><img src=\"img/w2-p13.jpg\" alt=\"W02 p.13 · Components of Computer: I/O, Memory, Processor(Datapath + Control)\" loading=\"lazy\"><\/button><figcaption>W02 p.13 · Components of Computer: I/O, Memory, Processor(Datapath + Control)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-isa\"><h3>추상화와 ISA<\/h3><p><b>ISA (Instruction Set Architecture)<\/b>: 하드웨어와 저수준 소프트웨어 사이의 <b>인터페이스<\/b>. 프로세서가 명령어를 어떻게 해석·실행하는지, 어떤 레지스터가 있는지, 데이터에 어떻게 접근하는지에 대한 <b>계약(contract)<\/b>.<\/p>\n<ul><li>개발자가 하드웨어 내부를 몰라도 소프트웨어를 쓸 수 있게 해 줌 (abstraction = hide lower-level detail).<\/li><li><b>Portability<\/b>: 하드웨어가 바뀌어도 소프트웨어를 고칠 필요가 없음. 교수님이 가장 중요하다고 한 성질.<\/li><li>Register = 프로세서 안에 있는 가장 빠른 메모리.<\/li><\/ul>\n<div class=\"callout\">한 줄 답안: ISA is the interface between hardware and low-level software; it defines how instructions are executed, which registers exist, and how data is accessed, so software can run without knowing hardware details (portability).<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">01주-2<\/span><br>커피 심부름 비유: '커피 사 와' 한마디 안에 '문 열고 → 엘리베이터 → 1층 → 주문 → 결제 → 다시 올라오기'가 다 숨어 있다. ISA가 그런 하드웨어 세부를 숨겨 준다. 가장 중요한 성질은 <b>portability<\/b>.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w2-p16.jpg\" aria-label=\"크게 보기\"><img src=\"img/w2-p16.jpg\" alt=\"W02 p.16 · Abstractions and ISA\" loading=\"lazy\"><\/button><figcaption>W02 p.16 · Abstractions and ISA<\/figcaption><\/figure><\/section>", "title_en": "Computer Components · Abstraction · ISA", "exam_en": "Describe the components", "html_en": "<section class=\"sec\" id=\"s-course-info\"><h3>Course Scope and Exam Format<\/h3><ul><li>Textbook: Computer Organization and Design (MIPS). But questions come <b>only from the lecture materials<\/b>.<\/li><li><b>All lectures and exams are in English. You must answer in English too.<\/b><\/li><li>Grading: attendance (random roll call) 10%, <b>midterm 45%<\/b>, final 45%. Both midterm and final are closed book and offline.<\/li><li>Midterm scope: Performance → Instructions → Arithmetic → Processor (simplified, single-cycle version). Pipelining is on the final.<\/li><\/ul>\n<div class=\"callout exam\">Exam point: The midterm is Tue 10/20, 17:00–19:00. If you cannot attend, email the professor.<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 1-1<\/span><br>All lectures and exams are in English, and you must <b>answer in English<\/b> too. Both midterm and final are closed book and offline. 'Up to the midterm it is relatively easy; after the midterm, from pipelining on, it gets harder.' Attendance is not called every time; it is a random roll call.<\/div><\/section>\n<section class=\"sec\" id=\"s-classes-ideas\"><h3>Classes of Computers and the Eight Great Ideas<\/h3><div class=\"tblw\"><table><thead><tr><th>Class<\/th><th>Purpose<\/th><th>Characteristics<\/th><\/tr><\/thead><tbody><tr><td>Supercomputer<\/td><td>High-end scientific and engineering computation<\/td><td>Measured in <b>FLOPS<\/b> (&gt; MIPS), ~10^17<\/td><\/tr><tr><td>Server<\/td><td>Network-based, high-performance processing<\/td><td>Capacity, performance, reliability<\/td><\/tr><tr><td>Personal computer<\/td><td>General purpose<\/td><td>Cost/performance trade-off<\/td><\/tr><tr><td>Embedded<\/td><td>Hidden inside a system<\/td><td>Strictest power, performance and cost constraints<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Eight Great Ideas<\/b>: Design for Moore's Law · Use abstraction to simplify design · <b>Make the common case fast<\/b> · Hierarchy of memories · Dependability via redundancy · Performance via parallelism · Performance via pipelining · Performance via prediction.<\/p><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 1-2<\/span><br>Supercomputers are measured in FLOPS and are about 10,000 times faster than an ordinary desktop. Of the eight great ideas, memory hierarchy and prediction belong to the final; parallelism and pipelining connect to pipelining.<\/div><\/section>\n<section class=\"sec\" id=\"s-below-program\"><h3>Below Your Program · Translation Steps<\/h3><ul><li><b>Application software<\/b>: written in a high-level language (HLL) (browsers, apps, Office).<\/li><li><b>System software<\/b>: <b>Compiler<\/b> (translates HLL into machine code, e.g., GCC) + <b>Operating System<\/b> (handles input/output, manages memory and storage, schedules tasks and shares resources).<\/li><li><b>Hardware<\/b>: processor, memory, I/O controllers.<\/li><\/ul>\n<p>Translation: <code>A+B<\/code> (HLL) → <code>add A, B<\/code> (assembly, still human-readable) → binary machine language.<\/p>\n<p>What the OS does for an application: loading and process creation, <b>system call<\/b>, resource management (memory, CPU scheduling, I/O), IPC, event handling, error handling. You do not need to memorize the slide; just know \"what the OS does in the flow of an application\".<\/p><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 1-2<\/span><br>No need to memorize the OS slides; just know 'what the OS does in the flow of an application'. Example: when you send a photo in KakaoTalk and the 'Allow access?' prompt appears, that is the OS's job (a system call).<\/div><\/section>\n<section class=\"sec\" id=\"s-components\"><h3>Components of a Computer<\/h3><ul><li><b>Input/Output<\/b>: user devices (keyboard, mouse), storage devices (HDD, Flash), and <b>network adapters are also I/O<\/b> (LAN, Wi-Fi, Bluetooth).<\/li><li><b>Memory<\/b>: Primary (RAM: DRAM/SRAM, volatile), Secondary (HDD, SSD), <b>Cache<\/b> (small and fast, usually SRAM). ROM = non-volatile, holds boot firmware (BIOS).<\/li><li><b>Processor = Datapath + Control unit<\/b><ul><li><b>Datapath<\/b>: actual data processing (arithmetic, logical, and memory access operations). Components: ALU, Registers, MUX, Buses.<\/li><li><b>Control unit<\/b>: directs the operation of the datapath by interpreting the instructions fetched from memory and generating <b>control signals<\/b>.<\/li><\/ul><\/li><li>Devices communicate over a <b>bus<\/b> (address bus, data bus, control bus).<\/li><\/ul>\n<div class=\"callout exam\">Exam point: \"The two components of a processor and their roles\" → Datapath (performs the actual data processing), Control unit (interprets instructions → generates control signals).<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 1-2<\/span><br>Many students get confused that network devices are also I/O. When the Control unit reads an instruction (e.g., an addition), it sends signals so that the ALU in the datapath operates. Cache is the memory to watch most carefully in this course (final).<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w2-p13.jpg\" aria-label=\"Enlarge\"><img src=\"img/w2-p13.jpg\" alt=\"W02 p.13 · Components of Computer: I/O, Memory, Processor (Datapath + Control)\" loading=\"lazy\"><\/button><figcaption>W02 p.13 · Components of Computer: I/O, Memory, Processor (Datapath + Control)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-isa\"><h3>Abstraction and ISA<\/h3><p><b>ISA (Instruction Set Architecture)<\/b>: the <b>interface<\/b> between hardware and low-level software. A <b>contract<\/b> that specifies how the processor interprets and executes instructions, which registers exist, and how data is accessed.<\/p>\n<ul><li>Allows developers to write software without needing to understand the detailed inner workings of the hardware (abstraction = hide lower-level detail).<\/li><li><b>Portability<\/b>: software does not need to change when the hardware changes. The professor called this the most important property.<\/li><li>Register = the fastest memory, located inside the processor.<\/li><\/ul>\n<div class=\"callout\">One-line answer: ISA is the interface between hardware and low-level software; it defines how instructions are executed, which registers exist, and how data is accessed, so software can run without knowing hardware details (portability).<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 1-2<\/span><br>Coffee-errand analogy: the single request 'go buy me a coffee' hides 'open the door → elevator → 1st floor → order → pay → come back up'. The ISA hides hardware details in the same way. The most important property is <b>portability<\/b>.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w2-p16.jpg\" aria-label=\"Enlarge\"><img src=\"img/w2-p16.jpg\" alt=\"W02 p.16 · Abstractions and ISA\" loading=\"lazy\"><\/button><figcaption>W02 p.16 · Abstractions and ISA<\/figcaption><\/figure><\/section>"}, {"id": "L1-2", "title": "성능 정의 · 실행 시간 · 클럭", "src": "W02 p.17–26", "exam": "성능 비교 계산", "secs": [{"id": "perf-factors", "title": "성능을 좌우하는 요소", "title_en": "Factors That Affect Performance"}, {"id": "response-throughput", "title": "Response time vs Throughput", "title_en": "Response Time vs Throughput"}, {"id": "perf-ratio", "title": "성능 비교: X is n times faster than Y", "title_en": "Comparing Performance: X Is n Times Faster Than Y"}, {"id": "cpu-time-def", "title": "Elapsed time · CPU time · Clock", "title_en": "Elapsed Time · CPU Time · Clock"}, {"id": "cpu-time", "title": "CPU Time 공식과 예제", "title_en": "The CPU Time Formula and Example"}], "md": "## 성능을 좌우하는 요소 {#perf-factors}\n\n| 요소 | 영향 |\n|---|---|\n| Algorithm | 실행할 **연산 수** (예: bubble sort n² vs merge sort n log n) |\n| Programming language, compiler, architecture | 연산당 **기계 명령어 수** |\n| Processor & memory system | 명령어가 얼마나 빨리 실행되나 |\n| I/O system (OS 포함) | I/O 연산이 얼마나 빨리 실행되나 |\n\n**Moore's Law**: IC capacity가 18–24개월마다 두 배. 하지만 전력 제약(power wall) 때문에 성능이 무한히 오르진 않음.\n\n## Response time vs Throughput {#response-throughput}\n\n- **Response time** (= latency = execution time): 한 작업을 끝내는 데 걸리는 시간.\n- **Throughput**: 단위 시간당 처리하는 작업량 (tasks/hour).\n- 수업에서는 **response time 기준으로 통일**.\n\n## 성능 비교: X is n times faster than Y {#perf-ratio}\n\n`Performance_X = 1 / Execution time_X`\n\n`Performance_X / Performance_Y = Execution time_Y / Execution time_X = n` → \"X is n times faster than Y\".\n\n예제(슬라이드): 같은 프로그램이 A에서 7s, B에서 21s → Perf_A/Perf_B = 21/7 = **3**, A가 B보다 3배 빠름.\n\n> 함정: 비율을 뒤집지 마. 성능 비 = 시간 비의 **역수**. 교수님이 \"많은 학생이 시험에서 이걸 틀린다\"고 두 번 강조함.\n\n## Elapsed time · CPU time · Clock {#cpu-time-def}\n\n- **Elapsed time**: 전체 응답 시간 (I/O 대기, OS 오버헤드 포함). 시스템 성능을 보여 주지만 비교용으로는 부정확.\n- **CPU time** = user CPU time + system CPU time.\n  - **User CPU time**: 우리 프로그램의 명령어를 실제로 실행한 시간 (user mode). **수업에서 execution time = user CPU time.**\n  - System CPU time: kernel mode (하드웨어 접근, I/O, 메모리 관리).\n- **Clock**: 0→1→0으로 일정 주기로 바뀌는 내부 신호.\n  - **Clock period** (cycle time): 한 사이클 길이, 예) 250 ps.\n  - **Clock rate** (frequency): 초당 사이클 수, 예) 4.0 GHz = 4.0×10⁹ Hz. **둘은 역수 관계** (4 GHz ↔ 250 ps).\n\n## CPU Time 공식과 예제 {#cpu-time}\n\n`CPU Time = CPU Clock Cycles × Clock Cycle Time = CPU Clock Cycles / Clock Rate`\n\n성능을 올리려면: clock cycle 수를 줄이거나, clock rate를 올림. 둘은 trade-off.\n\n슬라이드 예제: A는 2 GHz에서 10 s. B는 6 s가 목표, 대신 clock cycle이 A의 1.2배.\n```\nCycles_A = 10 s × 2×10⁹ Hz = 20×10⁹\nCycles_B = 1.2 × 20×10⁹ = 24×10⁹\nClock rate_B = 24×10⁹ / 6 s = 4×10⁹ Hz = 4 GHz\n```\n\n> 시험 포인트: 교수님 말 그대로 \"the examples that I provided during class will resemble very much your midterm\". 식을 변형해서 모르는 값을 구하는 연습.", "html": "<section class=\"sec\" id=\"s-perf-factors\"><h3>성능을 좌우하는 요소<\/h3><div class=\"tblw\"><table><thead><tr><th>요소<\/th><th>영향<\/th><\/tr><\/thead><tbody><tr><td>Algorithm<\/td><td>실행할 <b>연산 수<\/b> (예: bubble sort n² vs merge sort n log n)<\/td><\/tr><tr><td>Programming language, compiler, architecture<\/td><td>연산당 <b>기계 명령어 수<\/b><\/td><\/tr><tr><td>Processor &amp; memory system<\/td><td>명령어가 얼마나 빨리 실행되나<\/td><\/tr><tr><td>I/O system (OS 포함)<\/td><td>I/O 연산이 얼마나 빨리 실행되나<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Moore's Law<\/b>: IC capacity가 18–24개월마다 두 배. 하지만 전력 제약(power wall) 때문에 성능이 무한히 오르진 않음.<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">01주-2 · 02주-1<\/span><br>n log n 알고리즘을 n²로 바꾸면 프로세서가 아무리 빨라도 느려진다. 총 기계 명령어 수 = 연산 수 × 연산당 기계 명령어 수. 같은 코드도 보통 C가 Python보다 빠르다.<\/div><\/section>\n<section class=\"sec\" id=\"s-response-throughput\"><h3>Response time vs Throughput<\/h3><ul><li><b>Response time<\/b> (= latency = execution time): 한 작업을 끝내는 데 걸리는 시간.<\/li><li><b>Throughput<\/b>: 단위 시간당 처리하는 작업량 (tasks/hour).<\/li><li>수업에서는 <b>response time 기준으로 통일<\/b>.<\/li><\/ul><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">01주-2<\/span><br>response time은 스톱워치로 한 작업이 끝날 때까지 재는 것, throughput은 단위 시간 동안 몇 개를 처리하나. 수업은 response time으로 통일.<\/div><\/section>\n<section class=\"sec\" id=\"s-perf-ratio\"><h3>성능 비교: X is n times faster than Y<\/h3><p><code>Performance_X = 1 / Execution time_X<\/code><\/p>\n<p><code>Performance_X / Performance_Y = Execution time_Y / Execution time_X = n<\/code> → \"X is n times faster than Y\".<\/p>\n<p>예제(슬라이드): 같은 프로그램이 A에서 7s, B에서 21s → Perf_A/Perf_B = 21/7 = <b>3<\/b>, A가 B보다 3배 빠름.<\/p>\n<div class=\"callout trap\">함정: 비율을 뒤집지 마. 성능 비 = 시간 비의 <b>역수<\/b>. 교수님이 \"많은 학생이 시험에서 이걸 틀린다\"고 두 번 강조함.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">01주-2 · 02주-1<\/span><br>'many students miss this in their midterm exams' — 성능 비는 실행 시간 비의 <b>역수<\/b>. 7 s vs 21 s 예제를 2분 동안 직접 풀게 하고 답 3을 확인.<\/div><\/section>\n<section class=\"sec\" id=\"s-cpu-time-def\"><h3>Elapsed time · CPU time · Clock<\/h3><ul><li><b>Elapsed time<\/b>: 전체 응답 시간 (I/O 대기, OS 오버헤드 포함). 시스템 성능을 보여 주지만 비교용으로는 부정확.<\/li><li><b>CPU time<\/b> = user CPU time + system CPU time.<ul><li><b>User CPU time<\/b>: 우리 프로그램의 명령어를 실제로 실행한 시간 (user mode). <b>수업에서 execution time = user CPU time.<\/b><\/li><li>System CPU time: kernel mode (하드웨어 접근, I/O, 메모리 관리).<\/li><\/ul><\/li><li><b>Clock<\/b>: 0→1→0으로 일정 주기로 바뀌는 내부 신호.<ul><li><b>Clock period<\/b> (cycle time): 한 사이클 길이, 예) 250 ps.<\/li><li><b>Clock rate<\/b> (frequency): 초당 사이클 수, 예) 4.0 GHz = 4.0×10⁹ Hz. <b>둘은 역수 관계<\/b> (4 GHz ↔ 250 ps).<\/li><\/ul><\/li><\/ul><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">02주-1<\/span><br>elapsed time은 I/O 지연, 메모리→프로세서 이동 지연까지 들어가서 비교에 부정확. 그래서 CPU 시간, 그중 <b>user CPU time<\/b>만 본다. 앞으로 '실행 시간'이라고 하면 user CPU time.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w2-p24.jpg\" aria-label=\"크게 보기\"><img src=\"img/w2-p24.jpg\" alt=\"W02 p.24 · CPU Clocking: clock period와 clock rate\" loading=\"lazy\"><\/button><figcaption>W02 p.24 · CPU Clocking: clock period와 clock rate<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-cpu-time\"><h3>CPU Time 공식과 예제<\/h3><p><code>CPU Time = CPU Clock Cycles × Clock Cycle Time = CPU Clock Cycles / Clock Rate<\/code><\/p>\n<p>성능을 올리려면: clock cycle 수를 줄이거나, clock rate를 올림. 둘은 trade-off.<\/p>\n<p>슬라이드 예제: A는 2 GHz에서 10 s. B는 6 s가 목표, 대신 clock cycle이 A의 1.2배.<\/p>\n<pre class=\"code\">Cycles_A = 10 s × 2×10⁹ Hz = 20×10⁹\nCycles_B = 1.2 × 20×10⁹ = 24×10⁹\nClock rate_B = 24×10⁹ / 6 s = 4×10⁹ Hz = 4 GHz<\/pre>\n<div class=\"callout exam\">시험 포인트: 교수님 말 그대로 \"the examples that I provided during class will resemble very much your midterm\". 식을 변형해서 모르는 값을 구하는 연습.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">02주-1<\/span><br>'the examples that I provided during class will resemble very much your midterm or your final exam' — 예제를 풀 줄 알면 시험 문제도 풀 수 있다고 함. clock rate = cycles / CPU time으로 식을 돌려서 풀이.<\/div><\/section>", "title_en": "Defining Performance · Execution Time · Clock", "exam_en": "Performance comparison calculations", "html_en": "<section class=\"sec\" id=\"s-perf-factors\"><h3>Factors That Affect Performance<\/h3><div class=\"tblw\"><table><thead><tr><th>Component<\/th><th>What it affects<\/th><\/tr><\/thead><tbody><tr><td>Algorithm<\/td><td><b>Number of operations<\/b> executed (e.g., bubble sort n² vs merge sort n log n)<\/td><\/tr><tr><td>Programming language, compiler, architecture<\/td><td>Number of <b>machine instructions per operation<\/b><\/td><\/tr><tr><td>Processor &amp; memory system<\/td><td>How fast instructions are executed<\/td><\/tr><tr><td>I/O system (including OS)<\/td><td>How fast I/O operations are executed<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Moore's Law<\/b>: IC capacity doubles every 18–24 months. But because of power constraints (the power wall), performance cannot rise forever.<\/p><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 1-2 · Week 2-1<\/span><br>If you replace an n log n algorithm with an n² one, it becomes slower no matter how fast the processor is. Total machine instructions = number of operations × machine instructions per operation. The same code usually runs faster in C than in Python.<\/div><\/section>\n<section class=\"sec\" id=\"s-response-throughput\"><h3>Response Time vs Throughput<\/h3><ul><li><b>Response time<\/b> (= latency = execution time): how long it takes to do a task/job.<\/li><li><b>Throughput<\/b>: total work done per unit time (e.g., tasks/hour).<\/li><li>In this course we <b>focus on response time<\/b>.<\/li><\/ul><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 1-2<\/span><br>Response time is measuring with a stopwatch until one task finishes; throughput is how many tasks are processed per unit time. The course uses response time throughout.<\/div><\/section>\n<section class=\"sec\" id=\"s-perf-ratio\"><h3>Comparing Performance: X Is n Times Faster Than Y<\/h3><p><code>Performance_X = 1 / Execution time_X<\/code><\/p>\n<p><code>Performance_X / Performance_Y = Execution time_Y / Execution time_X = n<\/code> → \"X is n times faster than Y\".<\/p>\n<p>Example (slide): the same program takes 7 s on A and 21 s on B → Perf_A/Perf_B = 21/7 = <b>3<\/b>, so A is 3 times faster than B.<\/p>\n<div class=\"callout trap\">Trap: Do not flip the ratio. The performance ratio is the <b>inverse<\/b> of the time ratio. The professor stressed twice that \"many students miss this in their midterm exams\".<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 1-2 · Week 2-1<\/span><br>'many students miss this in their midterm exams' — the performance ratio is the <b>inverse<\/b> of the execution-time ratio. He had students solve the 7 s vs 21 s example themselves for 2 minutes and confirmed the answer 3.<\/div><\/section>\n<section class=\"sec\" id=\"s-cpu-time-def\"><h3>Elapsed Time · CPU Time · Clock<\/h3><ul><li><b>Elapsed time<\/b>: total response time, including all aspects (I/O waits, OS overhead). Determines system performance, but often not good for comparison purposes.<\/li><li><b>CPU time<\/b> = user CPU time + system CPU time.<ul><li><b>User CPU time<\/b>: time spent actually running the instructions of our program (user mode). <b>In this course, execution time = user CPU time.<\/b><\/li><li>System CPU time: kernel mode (hardware access, I/O, memory management).<\/li><\/ul><\/li><li><b>Clock<\/b>: an internal signal that toggles 0→1→0 at a fixed period.<ul><li><b>Clock period<\/b> (cycle time): duration of one clock cycle, e.g., 250 ps.<\/li><li><b>Clock rate<\/b> (frequency): cycles per second, e.g., 4.0 GHz = 4.0×10⁹ Hz. <b>The two are reciprocals<\/b> (4 GHz ↔ 250 ps).<\/li><\/ul><\/li><\/ul><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 2-1<\/span><br>Elapsed time includes I/O delays and the delay of moving data from memory to the processor, so it is inaccurate for comparison. That is why we look at CPU time, and only the <b>user CPU time<\/b> within it. From now on, 'execution time' means user CPU time.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w2-p24.jpg\" aria-label=\"Enlarge\"><img src=\"img/w2-p24.jpg\" alt=\"W02 p.24 · CPU Clocking: clock period and clock rate\" loading=\"lazy\"><\/button><figcaption>W02 p.24 · CPU Clocking: clock period and clock rate<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-cpu-time\"><h3>The CPU Time Formula and Example<\/h3><p><code>CPU Time = CPU Clock Cycles × Clock Cycle Time = CPU Clock Cycles / Clock Rate<\/code><\/p>\n<p>To improve performance: reduce the number of clock cycles or increase the clock rate. There is often a trade-off between the two.<\/p>\n<p>Slide example: A runs in 10 s at 2 GHz. B should run in 6 s, but needs 1.2 times as many clock cycles as A.<\/p>\n<pre class=\"code\">Cycles_A = 10 s × 2×10⁹ Hz = 20×10⁹\nCycles_B = 1.2 × 20×10⁹ = 24×10⁹\nClock rate_B = 24×10⁹ / 6 s = 4×10⁹ Hz = 4 GHz<\/pre>\n<div class=\"callout exam\">Exam point: In the professor's own words, \"the examples that I provided during class will resemble very much your midterm\". Practice rearranging the formula to solve for the unknown.<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 2-1<\/span><br>'the examples that I provided during class will resemble very much your midterm or your final exam' — he said if you can solve the examples, you can solve the exam problems. He solved it by rearranging the formula to clock rate = cycles / CPU time.<\/div><\/section>"}, {"id": "L1-3", "title": "Instruction Count · CPI · 성능 식", "src": "W02 p.27–31", "exam": "CPI 계산", "secs": [{"id": "cpi", "title": "IC · CPI · 세 요소 공식", "title_en": "IC · CPI · The Three-Factor Formula"}, {"id": "weighted-cpi", "title": "가중 평균 CPI", "title_en": "Weighted Average CPI"}, {"id": "perf-summary", "title": "성능 요약표", "title_en": "Performance Summary Table"}], "md": "## IC · CPI · 세 요소 공식 {#cpi}\n\n- **Instruction Count (IC)**: 프로그램이 실행하는 명령어 수. program, ISA, compiler가 결정.\n- **CPI (Cycles Per Instruction)**: 명령어당 평균 클럭 사이클. CPU 하드웨어가 결정. 명령어마다 다르면 평균 CPI.\n\n`Clock Cycles = IC × CPI`\n\n`CPU Time = IC × CPI × Clock Cycle Time = (IC × CPI) / Clock Rate`\n\n슬라이드 예제: A는 cycle 250 ps·CPI 2.0, B는 500 ps·CPI 1.2, 같은 프로그램(IC = I).\n```\nCPU time_A = I × 2.0 × 250 ps = 500·I ps\nCPU time_B = I × 1.2 × 500 ps = 600·I ps\nPerf_A / Perf_B = 600I / 500I = 1.2  → A is 1.2 times faster than B\n```\n\n> 시험 포인트: 모르는 IC는 변수 I로 두면 비율에서 약분된다. 교수님이 풀이에서 그대로 쓴 방법.\n\n## 가중 평균 CPI {#weighted-cpi}\n\n명령어 클래스마다 CPI가 다르면:\n\n`Clock Cycles = Σ (CPI_i × IC_i)`\n\n`Average CPI = Clock Cycles / IC = Σ CPI_i × (IC_i / IC)` (IC_i / IC = relative frequency)\n\n슬라이드 예제 (CPI: A=1, B=2, C=3):\n\n| | A | B | C | 총 IC | Cycles | 평균 CPI |\n|---|---|---|---|---|---|---|\n| Sequence 1 | 2 | 1 | 2 | 5 | 2+2+6 = 10 | **2.0** |\n| Sequence 2 | 4 | 1 | 1 | 6 | 4+2+3 = 9 | **1.5** |\n\nSequence 2가 명령어는 더 많지만 사이클은 더 적어서 빠르다.\n\n## 성능 요약표 {#perf-summary}\n\n`CPU Time = (Instructions / Program) × (Clock cycles / Instruction) × (Seconds / Clock cycle)`\n\n| | IC | CPI | Clock rate |\n|---|---|---|---|\n| Algorithm/Program | ✔ | ✔ | |\n| Programming language | ✔ | ✔ | |\n| Compiler | ✔ | ✔ | |\n| ISA | ✔ | ✔ | |\n| Hardware organization | | ✔ | ✔ |\n| Technology | | | ✔ |\n\n> 함정: Hardware organization은 CPI와 clock rate에 영향, IC에는 영향 없음. Technology는 clock rate만.", "html": "<section class=\"sec\" id=\"s-cpi\"><h3>IC · CPI · 세 요소 공식<\/h3><ul><li><b>Instruction Count (IC)<\/b>: 프로그램이 실행하는 명령어 수. program, ISA, compiler가 결정.<\/li><li><b>CPI (Cycles Per Instruction)<\/b>: 명령어당 평균 클럭 사이클. CPU 하드웨어가 결정. 명령어마다 다르면 평균 CPI.<\/li><\/ul>\n<p><code>Clock Cycles = IC × CPI<\/code><\/p>\n<p><code>CPU Time = IC × CPI × Clock Cycle Time = (IC × CPI) / Clock Rate<\/code><\/p>\n<p>슬라이드 예제: A는 cycle 250 ps·CPI 2.0, B는 500 ps·CPI 1.2, 같은 프로그램(IC = I).<\/p>\n<pre class=\"code\">CPU time_A = I × 2.0 × 250 ps = 500·I ps\nCPU time_B = I × 1.2 × 500 ps = 600·I ps\nPerf_A / Perf_B = 600I / 500I = 1.2  → A is 1.2 times faster than B<\/pre>\n<div class=\"callout exam\">시험 포인트: 모르는 IC는 변수 I로 두면 비율에서 약분된다. 교수님이 풀이에서 그대로 쓴 방법.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">02주-1<\/span><br>IC를 모르면 같은 변수 i로 두면 두 컴퓨터를 나눌 때 약분된다. CPI는 CPU 성능의 가장 직접적인 척도.<\/div><\/section>\n<section class=\"sec\" id=\"s-weighted-cpi\"><h3>가중 평균 CPI<\/h3><p>명령어 클래스마다 CPI가 다르면:<\/p>\n<p><code>Clock Cycles = Σ (CPI_i × IC_i)<\/code><\/p>\n<p><code>Average CPI = Clock Cycles / IC = Σ CPI_i × (IC_i / IC)<\/code> (IC_i / IC = relative frequency)<\/p>\n<p>슬라이드 예제 (CPI: A=1, B=2, C=3):<\/p>\n<div class=\"tblw\"><table><thead><tr><th><\/th><th>A<\/th><th>B<\/th><th>C<\/th><th>총 IC<\/th><th>Cycles<\/th><th>평균 CPI<\/th><\/tr><\/thead><tbody><tr><td>Sequence 1<\/td><td>2<\/td><td>1<\/td><td>2<\/td><td>5<\/td><td>2+2+6 = 10<\/td><td><b>2.0<\/b><\/td><\/tr><tr><td>Sequence 2<\/td><td>4<\/td><td>1<\/td><td>1<\/td><td>6<\/td><td>4+2+3 = 9<\/td><td><b>1.5<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<p>Sequence 2가 명령어는 더 많지만 사이클은 더 적어서 빠르다.<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">02주-1<\/span><br>풀이 순서: 총 명령어 수부터 세고 → 클래스별 CPI × IC를 더하고 → 총 명령어 수로 나눈다.<\/div><\/section>\n<section class=\"sec\" id=\"s-perf-summary\"><h3>성능 요약표<\/h3><p><code>CPU Time = (Instructions / Program) × (Clock cycles / Instruction) × (Seconds / Clock cycle)<\/code><\/p>\n<div class=\"tblw\"><table><thead><tr><th><\/th><th>IC<\/th><th>CPI<\/th><th>Clock rate<\/th><\/tr><\/thead><tbody><tr><td>Algorithm/Program<\/td><td>✔<\/td><td>✔<\/td><td><\/td><\/tr><tr><td>Programming language<\/td><td>✔<\/td><td>✔<\/td><td><\/td><\/tr><tr><td>Compiler<\/td><td>✔<\/td><td>✔<\/td><td><\/td><\/tr><tr><td>ISA<\/td><td>✔<\/td><td>✔<\/td><td><\/td><\/tr><tr><td>Hardware organization<\/td><td><\/td><td>✔<\/td><td>✔<\/td><\/tr><tr><td>Technology<\/td><td><\/td><td><\/td><td>✔<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout trap\">함정: Hardware organization은 CPI와 clock rate에 영향, IC에는 영향 없음. Technology는 clock rate만.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w2-p31.jpg\" aria-label=\"크게 보기\"><img src=\"img/w2-p31.jpg\" alt=\"W02 p.31 · Performance Summary 표\" loading=\"lazy\"><\/button><figcaption>W02 p.31 · Performance Summary 표<\/figcaption><\/figure><\/section>", "title_en": "Instruction Count · CPI · The Performance Equation", "exam_en": "CPI calculations", "html_en": "<section class=\"sec\" id=\"s-cpi\"><h3>IC · CPI · The Three-Factor Formula<\/h3><ul><li><b>Instruction Count (IC)<\/b>: number of instructions a program executes. Determined by the program, the ISA and the compiler.<\/li><li><b>CPI (Cycles Per Instruction)<\/b>: average number of clock cycles per instruction. Determined by the CPU hardware. If instructions have different CPIs, use the average CPI.<\/li><\/ul>\n<p><code>Clock Cycles = IC × CPI<\/code><\/p>\n<p><code>CPU Time = IC × CPI × Clock Cycle Time = (IC × CPI) / Clock Rate<\/code><\/p>\n<p>Slide example: A has cycle time 250 ps and CPI 2.0, B has 500 ps and CPI 1.2, same program (IC = I).<\/p>\n<pre class=\"code\">CPU time_A = I × 2.0 × 250 ps = 500·I ps\nCPU time_B = I × 1.2 × 500 ps = 600·I ps\nPerf_A / Perf_B = 600I / 500I = 1.2  → A is 1.2 times faster than B<\/pre>\n<div class=\"callout exam\">Exam point: If the IC is unknown, call it I; it cancels out in the ratio. This is exactly the method the professor used.<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 2-1<\/span><br>If the IC is unknown, use the same variable i for both, and it cancels when you divide the two computers. CPI is the most direct measure of CPU performance.<\/div><\/section>\n<section class=\"sec\" id=\"s-weighted-cpi\"><h3>Weighted Average CPI<\/h3><p>If different instruction classes have different CPIs:<\/p>\n<p><code>Clock Cycles = Σ (CPI_i × IC_i)<\/code><\/p>\n<p><code>Average CPI = Clock Cycles / IC = Σ CPI_i × (IC_i / IC)<\/code> (IC_i / IC = relative frequency)<\/p>\n<p>Slide example (CPI: A=1, B=2, C=3):<\/p>\n<div class=\"tblw\"><table><thead><tr><th><\/th><th>A<\/th><th>B<\/th><th>C<\/th><th>Total IC<\/th><th>Cycles<\/th><th>Avg. CPI<\/th><\/tr><\/thead><tbody><tr><td>Sequence 1<\/td><td>2<\/td><td>1<\/td><td>2<\/td><td>5<\/td><td>2+2+6 = 10<\/td><td><b>2.0<\/b><\/td><\/tr><tr><td>Sequence 2<\/td><td>4<\/td><td>1<\/td><td>1<\/td><td>6<\/td><td>4+2+3 = 9<\/td><td><b>1.5<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<p>Sequence 2 executes more instructions but fewer cycles, so it is faster.<\/p><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 2-1<\/span><br>Order of solution: first count the total number of instructions → add up CPI × IC for each class → divide by the total number of instructions.<\/div><\/section>\n<section class=\"sec\" id=\"s-perf-summary\"><h3>Performance Summary Table<\/h3><p><code>CPU Time = (Instructions / Program) × (Clock cycles / Instruction) × (Seconds / Clock cycle)<\/code><\/p>\n<div class=\"tblw\"><table><thead><tr><th><\/th><th>IC<\/th><th>CPI<\/th><th>Clock rate<\/th><\/tr><\/thead><tbody><tr><td>Algorithm/Program<\/td><td>✔<\/td><td>✔<\/td><td><\/td><\/tr><tr><td>Programming language<\/td><td>✔<\/td><td>✔<\/td><td><\/td><\/tr><tr><td>Compiler<\/td><td>✔<\/td><td>✔<\/td><td><\/td><\/tr><tr><td>ISA<\/td><td>✔<\/td><td>✔<\/td><td><\/td><\/tr><tr><td>Hardware organization<\/td><td><\/td><td>✔<\/td><td>✔<\/td><\/tr><tr><td>Technology<\/td><td><\/td><td><\/td><td>✔<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout trap\">Trap: Hardware organization affects CPI and clock rate, but not IC. Technology affects only the clock rate.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/w2-p31.jpg\" aria-label=\"Enlarge\"><img src=\"img/w2-p31.jpg\" alt=\"W02 p.31 · Performance Summary table\" loading=\"lazy\"><\/button><figcaption>W02 p.31 · Performance Summary table<\/figcaption><\/figure><\/section>"}, {"id": "L1-4", "title": "전력 · Amdahl · MIPS 함정 · RISC vs CISC", "src": "W02 p.32–41", "exam": "Amdahl·MIPS 계산", "secs": [{"id": "power", "title": "Power wall", "title_en": "The Power Wall"}, {"id": "amdahl", "title": "Amdahl's Law", "title_en": "Amdahl's Law"}, {"id": "mips-metric", "title": "MIPS는 성능 지표로 부적절", "title_en": "MIPS Is a Poor Performance Metric"}, {"id": "spec-idle", "title": "기타: SPEC · 유휴 전력", "title_en": "Other: SPEC · Power at Idle"}, {"id": "risc-cisc", "title": "RISC vs CISC", "title_en": "RISC vs CISC"}], "md": "## Power wall {#power}\n\nCMOS: `Power ∝ 1/2 × Capacitive load × Voltage² × Frequency`\n\n예: 새 CPU가 capacitive load 85%, voltage 15%↓, frequency 15%↓ → P_new/P_old = 0.85 × 0.85² × 0.85 = 0.85⁴ ≈ **0.52**.\n\n**Power wall**: 전압을 더 낮출 수 없고, 열을 더 뺄 수 없음 → 단일 프로세서 성능 향상이 막힘 → **multicore** (explicit parallel programming, load balancing 필요). 교수님: 식은 외울 필요 없고 \"전력 제약이 있다\"는 것만.\n\n## Amdahl's Law {#amdahl}\n\n> Pitfall: 컴퓨터의 한 부분을 개선하면 전체 성능도 그만큼 좋아질 거라고 기대하는 것.\n\n`T_improved = T_affected / improvement factor + T_unaffected`\n\n슬라이드 예제: 100 s 중 곱셈이 80 s. 전체를 5배 빠르게(20 s) 하려면?\n```\n20 = 80/n + 20  →  80/n = 0  → 불가능\n```\n곱셈을 무한히 빠르게 해도 나머지 20 s가 병목이라 최대 5배에 그친다. → **Make the common case fast**와 연결.\n\n## MIPS는 성능 지표로 부적절 {#mips-metric}\n\n`MIPS = IC / (Execution time × 10⁶) = Clock rate / (CPI × 10⁶)`\n\nMIPS는 (1) 컴퓨터마다 ISA가 다른 것, (2) 명령어 복잡도 차이를 반영 못 함. IC가 약분돼서 사라짐.\n\n슬라이드 예제 (둘 다 4 GHz):\n\n| | IC | CPI | MIPS | CPU time |\n|---|---|---|---|---|\n| A | 10 billion | 1.0 | 4000 | 10×10⁹×1.0 / 4×10⁹ = 2.5 s |\n| B | 8 billion | 1.1 | ≈3636 | 8×10⁹×1.1 / 4×10⁹ = 2.2 s |\n\nMIPS로는 A가 높지만, **실제로는 B가 빠름** (Perf_A/Perf_B = 2.2/2.5 = 0.88). 그래서 CPU time을 쓴다.\n\n## 기타: SPEC · 유휴 전력 {#spec-idle}\n\n- **SPEC** (Standard Performance Evaluation Corp.): CPU·I/O·Web 등의 표준 벤치마크 세트. SPEC CPU는 I/O가 거의 없는 프로그램의 elapsed time, SPEC Power는 부하 수준별 전력.\n- **Fallacy: low power at idle** — i7은 10% 부하에서도 121 W(최대의 47%). 데이터센터는 대부분 10–50% 부하 → 전력이 부하에 비례하도록 설계해야.\n\n## RISC vs CISC {#risc-cisc}\n\n| | RISC | CISC |\n|---|---|---|\n| 예 | **MIPS**, ARM, PowerPC | **x86, x86-64** (Intel, AMD) |\n| 전략 | 단순하고 작은 명령어 집합 | 크고 복잡한 명령어로 프로그램당 명령어 수 최소화 |\n| 장점 | 빠른 실행, 전력 효율, 확장성(병렬화 쉬움) | 프로그램 크기 감소, 옛 명령어와 호환 |\n| 단점 | 복잡한 작업에 명령어가 더 많이 필요 → 프로그램 커짐 | 느린 실행, 전력 소모 큼 |\n\nMIPS = Microprocessor without Interlocked Pipeline Stages. (성능 지표 MIPS와 이름만 같음!)", "html": "<section class=\"sec\" id=\"s-power\"><h3>Power wall<\/h3><p>CMOS: <code>Power ∝ 1/2 × Capacitive load × Voltage² × Frequency<\/code><\/p>\n<p>예: 새 CPU가 capacitive load 85%, voltage 15%↓, frequency 15%↓ → P_new/P_old = 0.85 × 0.85² × 0.85 = 0.85⁴ ≈ <b>0.52<\/b>.<\/p>\n<p><b>Power wall<\/b>: 전압을 더 낮출 수 없고, 열을 더 뺄 수 없음 → 단일 프로세서 성능 향상이 막힘 → <b>multicore<\/b> (explicit parallel programming, load balancing 필요). 교수님: 식은 외울 필요 없고 \"전력 제약이 있다\"는 것만.<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">02주-1 · 02주-2<\/span><br>식은 외울 필요 없고 '전력은 무한하지 않다'는 것만 가져가라. power wall: 전압을 더 못 낮추고, 열을 더 못 뺀다.<\/div><\/section>\n<section class=\"sec\" id=\"s-amdahl\"><h3>Amdahl's Law<\/h3><div class=\"callout trap\">Pitfall: 컴퓨터의 한 부분을 개선하면 전체 성능도 그만큼 좋아질 거라고 기대하는 것.<\/div>\n<p><code>T_improved = T_affected / improvement factor + T_unaffected<\/code><\/p>\n<p>슬라이드 예제: 100 s 중 곱셈이 80 s. 전체를 5배 빠르게(20 s) 하려면?<\/p>\n<pre class=\"code\">20 = 80/n + 20  →  80/n = 0  → 불가능<\/pre>\n<p>곱셈을 무한히 빠르게 해도 나머지 20 s가 병목이라 최대 5배에 그친다. → <b>Make the common case fast<\/b>와 연결.<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">02주-2<\/span><br>곱셈을 무한히 빠르게 해도 나머지 20초가 병목이라 최대 5배. 'this is why our computers are still very slow'.<\/div><\/section>\n<section class=\"sec\" id=\"s-mips-metric\"><h3>MIPS는 성능 지표로 부적절<\/h3><p><code>MIPS = IC / (Execution time × 10⁶) = Clock rate / (CPI × 10⁶)<\/code><\/p>\n<p>MIPS는 (1) 컴퓨터마다 ISA가 다른 것, (2) 명령어 복잡도 차이를 반영 못 함. IC가 약분돼서 사라짐.<\/p>\n<p>슬라이드 예제 (둘 다 4 GHz):<\/p>\n<div class=\"tblw\"><table><thead><tr><th><\/th><th>IC<\/th><th>CPI<\/th><th>MIPS<\/th><th>CPU time<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>10 billion<\/td><td>1.0<\/td><td>4000<\/td><td>10×10⁹×1.0 / 4×10⁹ = 2.5 s<\/td><\/tr><tr><td>B<\/td><td>8 billion<\/td><td>1.1<\/td><td>≈3636<\/td><td>8×10⁹×1.1 / 4×10⁹ = 2.2 s<\/td><\/tr><\/tbody><\/table><\/div>\n<p>MIPS로는 A가 높지만, <b>실제로는 B가 빠름<\/b> (Perf_A/Perf_B = 2.2/2.5 = 0.88). 그래서 CPU time을 쓴다.<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">02주-2<\/span><br>MIPS는 instruction count가 약분돼서 사라지니 비교가 틀어진다. 예제에서 MIPS는 A가 높지만 CPU time으로 보면 8.8/10 &lt; 1 → B가 빠름.<\/div><\/section>\n<section class=\"sec\" id=\"s-spec-idle\"><h3>기타: SPEC · 유휴 전력<\/h3><ul><li><b>SPEC<\/b> (Standard Performance Evaluation Corp.): CPU·I/O·Web 등의 표준 벤치마크 세트. SPEC CPU는 I/O가 거의 없는 프로그램의 elapsed time, SPEC Power는 부하 수준별 전력.<\/li><li><b>Fallacy: low power at idle<\/b> — i7은 10% 부하에서도 121 W(최대의 47%). 데이터센터는 대부분 10–50% 부하 → 전력이 부하에 비례하도록 설계해야.<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-risc-cisc\"><h3>RISC vs CISC<\/h3><div class=\"tblw\"><table><thead><tr><th><\/th><th>RISC<\/th><th>CISC<\/th><\/tr><\/thead><tbody><tr><td>예<\/td><td><b>MIPS<\/b>, ARM, PowerPC<\/td><td><b>x86, x86-64<\/b> (Intel, AMD)<\/td><\/tr><tr><td>전략<\/td><td>단순하고 작은 명령어 집합<\/td><td>크고 복잡한 명령어로 프로그램당 명령어 수 최소화<\/td><\/tr><tr><td>장점<\/td><td>빠른 실행, 전력 효율, 확장성(병렬화 쉬움)<\/td><td>프로그램 크기 감소, 옛 명령어와 호환<\/td><\/tr><tr><td>단점<\/td><td>복잡한 작업에 명령어가 더 많이 필요 → 프로그램 커짐<\/td><td>느린 실행, 전력 소모 큼<\/td><\/tr><\/tbody><\/table><\/div>\n<p>MIPS = Microprocessor without Interlocked Pipeline Stages. (성능 지표 MIPS와 이름만 같음!)<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">02주-2 · 03주-1<\/span><br>윈도우 시스템 정보의 x86/x64가 CISC라는 표시. RISC는 '문 열고 나가서, 엘리베이터 타고…'처럼 일일이 명령해야 하는 쪽, CISC는 그걸 큰 명령 하나로 묶는 쪽.<\/div><\/section>", "title_en": "Power · Amdahl · The MIPS Pitfall · RISC vs CISC", "exam_en": "Amdahl and MIPS calculations", "html_en": "<section class=\"sec\" id=\"s-power\"><h3>The Power Wall<\/h3><p>CMOS: <code>Power ∝ 1/2 × Capacitive load × Voltage² × Frequency<\/code><\/p>\n<p>Example: a new CPU has 85% of the capacitive load, 15% lower voltage and 15% lower frequency → P_new/P_old = 0.85 × 0.85² × 0.85 = 0.85⁴ ≈ <b>0.52<\/b>.<\/p>\n<p><b>Power wall<\/b>: we cannot reduce the voltage further and cannot remove more heat → single-processor performance improvement stalls → <b>multicore<\/b> (requires explicit parallel programming and load balancing). The professor said you do not need to memorize the formula; just know that \"power is constrained\".<\/p><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 2-1 · Week 2-2<\/span><br>No need to memorize the formula; just take away that 'power is not infinite'. Power wall: we cannot lower the voltage any further and cannot remove any more heat.<\/div><\/section>\n<section class=\"sec\" id=\"s-amdahl\"><h3>Amdahl's Law<\/h3><div class=\"callout trap\">Pitfall: Expecting the improvement of one aspect of a computer to increase overall performance by a proportional amount.<\/div>\n<p><code>T_improved = T_affected / improvement factor + T_unaffected<\/code><\/p>\n<p>Slide example: of 100 s, multiplication takes 80 s. How much must multiplication improve to make the whole program 5 times faster (20 s)?<\/p>\n<pre class=\"code\">20 = 80/n + 20  →  80/n = 0  → impossible<\/pre>\n<p>Even with infinitely fast multiplication, the remaining 20 s is the bottleneck, so the speedup is capped at 5×. → Connects to <b>Make the common case fast<\/b>.<\/p><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 2-2<\/span><br>Even if multiplication is made infinitely fast, the remaining 20 seconds are the bottleneck, so the maximum is 5×. 'this is why our computers are still very slow'.<\/div><\/section>\n<section class=\"sec\" id=\"s-mips-metric\"><h3>MIPS Is a Poor Performance Metric<\/h3><p><code>MIPS = IC / (Execution time × 10⁶) = Clock rate / (CPI × 10⁶)<\/code><\/p>\n<p>MIPS does not account for (1) differences in ISA between computers or (2) differences in instruction complexity. The IC cancels out and disappears.<\/p>\n<p>Slide example (both 4 GHz):<\/p>\n<div class=\"tblw\"><table><thead><tr><th><\/th><th>IC<\/th><th>CPI<\/th><th>MIPS<\/th><th>CPU time<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>10 billion<\/td><td>1.0<\/td><td>4000<\/td><td>10×10⁹×1.0 / 4×10⁹ = 2.5 s<\/td><\/tr><tr><td>B<\/td><td>8 billion<\/td><td>1.1<\/td><td>≈3636<\/td><td>8×10⁹×1.1 / 4×10⁹ = 2.2 s<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A has the higher MIPS, but <b>B is actually faster<\/b> (Perf_A/Perf_B = 2.2/2.5 = 0.88). That is why we use CPU time.<\/p><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 2-2<\/span><br>MIPS cancels out the instruction count, so the comparison goes wrong. In the example A has the higher MIPS, but by CPU time 8.8/10 &lt; 1 → B is faster.<\/div><\/section>\n<section class=\"sec\" id=\"s-spec-idle\"><h3>Other: SPEC · Power at Idle<\/h3><ul><li><b>SPEC<\/b> (Standard Performance Evaluation Corp.): standard benchmark suites for CPU, I/O, Web, etc. SPEC CPU measures the elapsed time of programs with negligible I/O; SPEC Power measures power at different load levels.<\/li><li><b>Fallacy: low power at idle<\/b> — an i7 draws 121 W (47% of peak) even at 10% load. Data centers mostly run at 10–50% load → processors should be designed so that power is proportional to load.<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-risc-cisc\"><h3>RISC vs CISC<\/h3><div class=\"tblw\"><table><thead><tr><th><\/th><th>RISC<\/th><th>CISC<\/th><\/tr><\/thead><tbody><tr><td>Examples<\/td><td><b>MIPS<\/b>, ARM, PowerPC<\/td><td><b>x86, x86-64<\/b> (Intel, AMD)<\/td><\/tr><tr><td>Strategy<\/td><td>Simple, small instruction set<\/td><td>Large, complex instructions that minimize instructions per program<\/td><\/tr><tr><td>Advantages<\/td><td>Fast execution, power efficiency, scalability (easy to parallelize)<\/td><td>Smaller programs, compatibility with old instructions<\/td><\/tr><tr><td>Disadvantages<\/td><td>Complex tasks need more instructions → larger programs<\/td><td>Slower execution, higher power consumption<\/td><\/tr><\/tbody><\/table><\/div>\n<p>MIPS = Microprocessor without Interlocked Pipeline Stages. (Same name as the MIPS performance metric, nothing else in common!)<\/p><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 2-2 · Week 3-1<\/span><br>The x86/x64 shown in Windows System Information indicates CISC. RISC is the side where you have to give every command one by one, like 'open the door, take the elevator…'; CISC bundles them into one big instruction.<\/div><\/section>"}], "title_en": "Ch.1 Computer Abstractions and Performance", "intro_en": "The exam is written in English and answered in English. This unit is half short-answer (defining terms) and half calculation (CPU time · CPI · Amdahl · MIPS). The professor said the calculation problems will be \"almost the same as the class examples\", so make sure you can solve every slide example by hand."}, {"id": "U2", "title": "Ch.2 명령어: 컴퓨터의 언어 (MIPS)", "src": "W02 p.41 · week3-수업.pdf · week4-수업.pdf p.2–5", "intro": "시험의 큰 덩어리. \"명령어와 설명을 주고 빈칸이나 MIPS 표현을 채우는\" 형식이 예고됐어. 교수님이 0점 처리한다고 경고한 규칙이 많은 단원이니 함정 박스를 꼭 읽어.", "lessons": [{"id": "L2-1", "title": "산술 명령어 · 레지스터 피연산자", "src": "week3 p.3–8", "exam": "C → MIPS 변환", "secs": [{"id": "mips-classes", "title": "MIPS 명령어 분류", "title_en": "Classes of MIPS Instructions"}, {"id": "arith-format", "title": "산술 명령어 형식", "title_en": "Arithmetic Instruction Format"}, {"id": "registers", "title": "레지스터 피연산자", "title_en": "Register Operands"}], "md": "## MIPS 명령어 분류 {#mips-classes}\n\nMIPS: Stanford에서 나온 RISC ISA, 임베디드 시장에서 큰 점유율, 현대 ISA의 전형.\n\n- **종류별**: Arithmetic · Memory(Data Transfer) · Logical · Conditional · Branch/Jump · Floating Point · Pseudo\n- **형식별**: **R-format · I-format · J-format** · FP format\n\n## 산술 명령어 형식 {#arith-format}\n\n`add a, b, c   # a = b + c`\n\n- **destination 1개 + source 2개**. 모든 산술 명령어가 이 형식.\n- **Design Principle 1: Simplicity favors regularity** — 규칙적이면 구현이 단순, 단순하면 저비용·고성능.\n\n슬라이드 예제:\n```\na = b + c + d;          f = (g + h) - (i + j);\nadd a, b, c             add t0, g, h\nadd a, a, d             add t1, i, j\n                        sub f, t0, t1\n```\n> 함정: 결과는 **사용자가 원한 변수**(여기선 f)에 넣어야 한다. 교수님이 \"must be very careful at this term\"이라고 강조.\n\n## 레지스터 피연산자 {#registers}\n\n- 산술 명령어는 **레지스터 피연산자만** 사용. 레지스터는 프로세서 안의 특별한 저장 위치.\n- MIPS: **32개 × 32-bit 레지스터** (번호 0–31). 32-bit = word size (설계 당시 표준, MIPS64에서도 호환성 때문에 유지).\n- 어셈블러 이름: `$t0–$t9` (임시), `$s0–$s7` (saved).\n- **Design Principle 2: Smaller is faster** — 레지스터를 작게 만들어 자주 쓰는 데이터를 빨리 처리.\n\n슬라이드 예제 (f, g, h, i, j가 $s0–$s4):\n```\nadd $t0, $s1, $s2     # g + h\nadd $t1, $s3, $s4     # i + j\nsub $s0, $t0, $t1     # f = (g+h) - (i+j)\n```\n> 함정: 연산 결과는 메모리로 바로 갈 수 없다. 항상 **레지스터에** 저장. (교안 이 슬라이드에 add/sub 오타가 있었고 수업에서 \"change this into subtraction\"이라고 고침)", "html": "<section class=\"sec\" id=\"s-mips-classes\"><h3>MIPS 명령어 분류<\/h3><p>MIPS: Stanford에서 나온 RISC ISA, 임베디드 시장에서 큰 점유율, 현대 ISA의 전형.<\/p>\n<ul><li><b>종류별<\/b>: Arithmetic · Memory(Data Transfer) · Logical · Conditional · Branch/Jump · Floating Point · Pseudo<\/li><li><b>형식별<\/b>: <b>R-format · I-format · J-format<\/b> · FP format<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-arith-format\"><h3>산술 명령어 형식<\/h3><p><code>add a, b, c   # a = b + c<\/code><\/p>\n<ul><li><b>destination 1개 + source 2개<\/b>. 모든 산술 명령어가 이 형식.<\/li><li><b>Design Principle 1: Simplicity favors regularity<\/b> — 규칙적이면 구현이 단순, 단순하면 저비용·고성능.<\/li><\/ul>\n<p>슬라이드 예제:<\/p>\n<pre class=\"code\">a = b + c + d;          f = (g + h) - (i + j);\nadd a, b, c             add t0, g, h\nadd a, a, d             add t1, i, j\n                        sub f, t0, t1<\/pre>\n<div class=\"callout trap\">함정: 결과는 <b>사용자가 원한 변수<\/b>(여기선 f)에 넣어야 한다. 교수님이 \"must be very careful at this term\"이라고 강조.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">02주-2<\/span><br>a = b + c + d를 add 하나로 쓰면 안 되고 두 줄로 나눈다. 결과는 반드시 사용자가 원한 변수에 — 'you must take a careful look at where to put your result'.<\/div><\/section>\n<section class=\"sec\" id=\"s-registers\"><h3>레지스터 피연산자<\/h3><ul><li>산술 명령어는 <b>레지스터 피연산자만<\/b> 사용. 레지스터는 프로세서 안의 특별한 저장 위치.<\/li><li>MIPS: <b>32개 × 32-bit 레지스터<\/b> (번호 0–31). 32-bit = word size (설계 당시 표준, MIPS64에서도 호환성 때문에 유지).<\/li><li>어셈블러 이름: <code>$t0–$t9<\/code> (임시), <code>$s0–$s7<\/code> (saved).<\/li><li><b>Design Principle 2: Smaller is faster<\/b> — 레지스터를 작게 만들어 자주 쓰는 데이터를 빨리 처리.<\/li><\/ul>\n<p>슬라이드 예제 (f, g, h, i, j가 $s0–$s4):<\/p>\n<pre class=\"code\">add $t0, $s1, $s2     # g + h\nadd $t1, $s3, $s4     # i + j\nsub $s0, $t0, $t1     # f = (g+h) - (i+j)<\/pre>\n<div class=\"callout trap\">함정: 연산 결과는 메모리로 바로 갈 수 없다. 항상 <b>레지스터에<\/b> 저장. (교안 이 슬라이드에 add/sub 오타가 있었고 수업에서 \"change this into subtraction\"이라고 고침)<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">02주-2<\/span><br>어떤 연산도 메모리의 데이터에 직접 하지 않는다: 레지스터로 load → 연산 → store. 결과도 레지스터에만 쓸 수 있다. 슬라이드의 마지막 add는 sub 오타.<\/div><\/section>", "title_en": "Arithmetic Instructions · Register Operands", "exam_en": "C → MIPS translation", "html_en": "<section class=\"sec\" id=\"s-mips-classes\"><h3>Classes of MIPS Instructions<\/h3><p>MIPS: a RISC ISA from Stanford, with a large share of the embedded market; typical of many modern ISAs.<\/p>\n<ul><li><b>By type<\/b>: Arithmetic · Memory (Data Transfer) · Logical · Conditional · Branch/Jump · Floating Point · Pseudo<\/li><li><b>By format<\/b>: <b>R-format · I-format · J-format<\/b> · FP format<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-arith-format\"><h3>Arithmetic Instruction Format<\/h3><p><code>add a, b, c   # a = b + c<\/code><\/p>\n<ul><li><b>One destination + two sources<\/b>. All arithmetic instructions have this form.<\/li><li><b>Design Principle 1: Simplicity favors regularity<\/b> — regularity makes implementation simpler; simplicity enables higher performance at lower cost.<\/li><\/ul>\n<p>Slide example:<\/p>\n<pre class=\"code\">a = b + c + d;          f = (g + h) - (i + j);\nadd a, b, c             add t0, g, h\nadd a, a, d             add t1, i, j\n                        sub f, t0, t1<\/pre>\n<div class=\"callout trap\">Trap: The result must go into <b>the variable the user asked for<\/b> (here, f). The professor stressed \"must be very careful at this term\".<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 2-2<\/span><br>a = b + c + d cannot be written as a single add; split it into two lines. The result must go into the variable the user wanted — 'you must take a careful look at where to put your result'.<\/div><\/section>\n<section class=\"sec\" id=\"s-registers\"><h3>Register Operands<\/h3><ul><li>Arithmetic instructions use <b>register operands only<\/b>. A register is a special storage location inside the processor.<\/li><li>MIPS has <b>32 × 32-bit registers<\/b> (numbered 0–31). 32-bit = word size (the standard when MIPS was designed, kept in MIPS64 for compatibility).<\/li><li>Assembler names: <code>$t0–$t9<\/code> (temporaries), <code>$s0–$s7<\/code> (saved).<\/li><li><b>Design Principle 2: Smaller is faster<\/b> — we design very small registers for faster operations on frequently accessed data.<\/li><\/ul>\n<p>Slide example (f, g, h, i, j in $s0–$s4):<\/p>\n<pre class=\"code\">add $t0, $s1, $s2     # g + h\nadd $t1, $s3, $s4     # i + j\nsub $s0, $t0, $t1     # f = (g+h) - (i+j)<\/pre>\n<div class=\"callout trap\">Trap: An operation's result cannot go directly to memory. It is always stored <b>in a register<\/b>. (This slide had an add/sub typo, which the professor corrected in class: \"change this into subtraction\".)<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 2-2<\/span><br>No operation works directly on data in memory: load into a register → operate → store. Results can only be written to registers. The last add on the slide is a typo for sub.<\/div><\/section>"}, {"id": "L2-2", "title": "메모리 피연산자 · 엔디안 · lw/sw", "src": "week3 p.10–14", "exam": "lw/sw 오프셋", "secs": [{"id": "memory-basics", "title": "메모리 기본", "title_en": "Memory Basics"}, {"id": "endian", "title": "Big Endian vs Little Endian", "title_en": "Big Endian vs Little Endian"}, {"id": "lw-sw", "title": "lw / sw", "title_en": "lw / sw"}, {"id": "reg-vs-mem", "title": "Registers vs Memory", "title_en": "Registers vs Memory"}], "md": "## 메모리 기본 {#memory-basics}\n\n- 메인 메모리는 배열·구조체·동적 데이터 같은 **composite data**용. 레지스터가 적어서 모든 변수를 담을 수 없음.\n- 산술 연산 전에 **load**(메모리 → 레지스터), 끝나면 **store**(레지스터 → 메모리).\n- **Byte addressed**: 주소 하나 = 8-bit byte 하나.\n- **Words are aligned**: word(32-bit)의 주소는 **4의 배수**.\n- 배열 원소 주소 = base address + index × 4 (int 배열).\n\n## Big Endian vs Little Endian {#endian}\n\n- **Big endian**: MSB(가장 큰 자리 byte)를 **가장 낮은 주소**에.\n- **Little endian**: LSB(가장 작은 자리 byte)를 **가장 낮은 주소**에.\n\n0x12345678을 주소 0–3에:\n\n| 주소 | 0 | 1 | 2 | 3 |\n|---|---|---|---|---|\n| Big endian | 12 | 34 | 56 | 78 |\n| Little endian | 78 | 56 | 34 | 12 |\n\n> 함정: 16진수 두 자리가 **1 byte**. Little endian에서도 byte 안의 두 자리 순서는 뒤집지 않는다 (78을 87로 쓰면 틀림). 교수님이 두 번 강조.\n\n## lw / sw {#lw-sw}\n\n`lw dest, offset(base)`  ·  `sw src, offset(base)`\n\n- 피연산자 3개: 레지스터, **offset(상수, byte 단위)**, base address(레지스터).\n- sw는 첫 번째 레지스터가 **source** (메모리에 쓸 값).\n\n슬라이드 예제 1: `g = h + A[8];` (g:$s1, h:$s2, A의 base:$s3)\n```\nlw  $t0, 32($s3)      # offset = 8 × 4 = 32\nadd $s1, $s2, $t0\n```\n슬라이드 예제 2: `A[12] = h + A[8];`\n```\nlw  $t0, 32($s3)\nadd $t0, $s2, $t0\nsw  $t0, 48($s3)      # 12 × 4 = 48\n```\n\n> 함정: **offset은 반드시 상수**. 레지스터를 offset 자리에 쓰면 정답이어도 **0점**, OX 문제면 무조건 False. 인덱스가 변수면 주소를 먼저 계산(`sll`, `add`)한 뒤 `lw $t0, 0($t1)`.\n\n## Registers vs Memory {#reg-vs-mem}\n\n- 레지스터가 메모리보다 훨씬 빠르고 쓰기 쉬움.\n- 메모리 데이터로 연산하려면 load/store가 필요 → 실행 명령어 수 증가.\n- 컴파일러는 변수를 최대한 레지스터에 두고, 덜 쓰는 변수만 메모리로 **spill**. 레지스터 최적화가 효율의 핵심.", "html": "<section class=\"sec\" id=\"s-memory-basics\"><h3>메모리 기본<\/h3><ul><li>메인 메모리는 배열·구조체·동적 데이터 같은 <b>composite data<\/b>용. 레지스터가 적어서 모든 변수를 담을 수 없음.<\/li><li>산술 연산 전에 <b>load<\/b>(메모리 → 레지스터), 끝나면 <b>store<\/b>(레지스터 → 메모리).<\/li><li><b>Byte addressed<\/b>: 주소 하나 = 8-bit byte 하나.<\/li><li><b>Words are aligned<\/b>: word(32-bit)의 주소는 <b>4의 배수<\/b>.<\/li><li>배열 원소 주소 = base address + index × 4 (int 배열).<\/li><\/ul><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">02주-2<\/span><br>메모리는 정렬돼 있으니 배열처럼 생각하면 된다: 원하는 주소 = base + index × 4.<\/div><\/section>\n<section class=\"sec\" id=\"s-endian\"><h3>Big Endian vs Little Endian<\/h3><ul><li><b>Big endian<\/b>: MSB(가장 큰 자리 byte)를 <b>가장 낮은 주소<\/b>에.<\/li><li><b>Little endian<\/b>: LSB(가장 작은 자리 byte)를 <b>가장 낮은 주소<\/b>에.<\/li><\/ul>\n<p>0x12345678을 주소 0–3에:<\/p>\n<div class=\"tblw\"><table><thead><tr><th>주소<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><\/tr><\/thead><tbody><tr><td>Big endian<\/td><td>12<\/td><td>34<\/td><td>56<\/td><td>78<\/td><\/tr><tr><td>Little endian<\/td><td>78<\/td><td>56<\/td><td>34<\/td><td>12<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout trap\">함정: 16진수 두 자리가 <b>1 byte<\/b>. Little endian에서도 byte 안의 두 자리 순서는 뒤집지 않는다 (78을 87로 쓰면 틀림). 교수님이 두 번 강조.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">02주-2<\/span><br>16진수 두 자리가 한 숫자(byte). little endian이어도 <b>두 자리 순서는 절대 바꾸지 말 것<\/b> (78을 87로 쓰면 틀림).<\/div><\/section>\n<section class=\"sec\" id=\"s-lw-sw\"><h3>lw / sw<\/h3><p><code>lw dest, offset(base)<\/code>  ·  <code>sw src, offset(base)<\/code><\/p>\n<ul><li>피연산자 3개: 레지스터, <b>offset(상수, byte 단위)<\/b>, base address(레지스터).<\/li><li>sw는 첫 번째 레지스터가 <b>source<\/b> (메모리에 쓸 값).<\/li><\/ul>\n<p>슬라이드 예제 1: <code>g = h + A[8];<\/code> (g:$s1, h:$s2, A의 base:$s3)<\/p>\n<pre class=\"code\">lw  $t0, 32($s3)      # offset = 8 × 4 = 32\nadd $s1, $s2, $t0<\/pre>\n<p>슬라이드 예제 2: <code>A[12] = h + A[8];<\/code><\/p>\n<pre class=\"code\">lw  $t0, 32($s3)\nadd $t0, $s2, $t0\nsw  $t0, 48($s3)      # 12 × 4 = 48<\/pre>\n<div class=\"callout trap\">함정: <b>offset은 반드시 상수<\/b>. 레지스터를 offset 자리에 쓰면 정답이어도 <b>0점<\/b>, OX 문제면 무조건 False. 인덱스가 변수면 주소를 먼저 계산(<code>sll<\/code>, <code>add<\/code>)한 뒤 <code>lw $t0, 0($t1)<\/code>.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">02주-2 · 03주-1<\/span><br>lw는 첫 변수가 destination, sw는 첫 변수가 <b>source<\/b>. offset = index × word 크기(4).<\/div><\/section>\n<section class=\"sec\" id=\"s-reg-vs-mem\"><h3>Registers vs Memory<\/h3><ul><li>레지스터가 메모리보다 훨씬 빠르고 쓰기 쉬움.<\/li><li>메모리 데이터로 연산하려면 load/store가 필요 → 실행 명령어 수 증가.<\/li><li>컴파일러는 변수를 최대한 레지스터에 두고, 덜 쓰는 변수만 메모리로 <b>spill<\/b>. 레지스터 최적화가 효율의 핵심.<\/li><\/ul><\/section>", "title_en": "Memory Operands · Endianness · lw/sw", "exam_en": "lw/sw offsets", "html_en": "<section class=\"sec\" id=\"s-memory-basics\"><h3>Memory Basics<\/h3><ul><li>Main memory is used for <b>composite data<\/b> such as arrays, structures and dynamic data. There are too few registers to hold every variable.<\/li><li>Before an arithmetic operation, <b>load<\/b> (memory → register); afterwards, <b>store<\/b> (register → memory).<\/li><li><b>Byte addressed<\/b>: each address identifies one 8-bit byte.<\/li><li><b>Words are aligned<\/b>: the address of a word (32-bit) must be a <b>multiple of 4<\/b>.<\/li><li>Address of an array element = base address + index × 4 (int array).<\/li>
