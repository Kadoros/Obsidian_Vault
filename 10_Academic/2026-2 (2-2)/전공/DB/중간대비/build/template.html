<title>DB 중간 트레이너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: query notebook — faint ruled paper, teal accent, red-pen grading. Left course tree + right reading/quiz pane; stacks on phones. */
:root{
  --paper:#f2f5f5; --sheet:#ffffff; --ink:#152225; --muted:#56676b; --line:#d8e1e2;
  --rule:rgba(11,114,133,.06); --accent:#0b7285; --accent-weak:#e2f1f3; --accent-ink:#ffffff;
  --pen:#d1372b; --ok:#2b8a3e; --ok-weak:#e4f3e7; --warn:#a8670d; --warn-weak:#fbefd9; --bad:#c3352b; --bad-weak:#fbe6e4;
  --code-bg:#f0f4f4; --hl:#fff3bf;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-pen:"Nanum Pen Script","Apple SD Gothic Neo",cursive;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0d1416; --sheet:#141d20; --ink:#e3ecee; --muted:#93a6aa; --line:#24333a;
  --rule:rgba(102,205,222,.05); --accent:#5fc3d6; --accent-weak:#16303a; --accent-ink:#0d1416;
  --pen:#ff6d5f; --ok:#5cc278; --ok-weak:#15301d; --warn:#e2a84b; --warn-weak:#33270f; --bad:#ff6d5f; --bad-weak:#3a1a18;
  --code-bg:#10181b; --hl:#3a3410; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0d1416; --sheet:#141d20; --ink:#e3ecee; --muted:#93a6aa; --line:#24333a;
  --rule:rgba(102,205,222,.05); --accent:#5fc3d6; --accent-weak:#16303a; --accent-ink:#0d1416;
  --pen:#ff6d5f; --ok:#5cc278; --ok-weak:#15301d; --warn:#e2a84b; --warn-weak:#33270f; --bad:#ff6d5f; --bad-weak:#3a1a18;
  --code-bg:#10181b; --hl:#3a3410; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 28px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand .course{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{font-family:var(--f-mono);font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);color:var(--muted);white-space:nowrap}
.chip.dday{color:var(--pen);border-color:color-mix(in srgb,var(--pen) 40%,var(--line));font-weight:600}
.chip.live{color:var(--ok)} .chip.local{color:var(--warn)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font:inherit;font-size:14px;font-weight:500;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 12px 9px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.view{padding-top:20px}
h2{font-size:16px;margin:0 0 10px;font-weight:700;text-wrap:balance}
h3{font-size:15px;margin:0 0 8px;font-weight:700;text-wrap:balance}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .note{font-size:12.5px;color:var(--muted)} .err{font-size:13px;color:var(--bad)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
.btn{font:inherit;font-size:13.5px;font-weight:500;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.sm{font-size:12.5px;padding:4px 9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.st{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
.st.none{background:var(--line);color:var(--muted)} .st.weak{background:var(--bad-weak);color:var(--bad)}
.st.mid{background:var(--warn-weak);color:var(--warn)} .st.good{background:var(--ok-weak);color:var(--ok)}
.st.lock{background:none;color:var(--muted);border:1px dashed var(--line)}
.tag{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--accent-weak);color:var(--accent);font-weight:500}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
pre.code{margin:0;font-family:var(--f-mono);font-size:12.5px;line-height:1.55;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre}
code{font-family:var(--f-mono);font-size:.88em;background:var(--code-bg);border:1px solid var(--line);border-radius:4px;padding:0 4px}
select,input[type=text]{font:inherit;font-size:13.5px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);max-width:100%}
textarea{width:100%;min-height:150px;font-family:var(--f-mono);font-size:13px;line-height:1.55;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);resize:vertical}
/* learn layout */
.learn{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.learn{grid-template-columns:minmax(0,1fr)}}
.tree{position:sticky;top:118px;max-height:calc(100vh - 140px);overflow:auto;padding:10px 0}
@media (max-width:900px){.tree{position:static;max-height:none}}
.tree details{border-bottom:1px solid var(--line)} .tree details:last-child{border-bottom:0}
.tree summary{list-style:none;cursor:pointer;padding:9px 14px;display:flex;flex-direction:column;gap:4px}
.tree summary::-webkit-details-marker{display:none}
.tree .ut{font-size:13.5px;font-weight:600;line-height:1.35}
.ubar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}.ubar>b{display:block;height:100%;background:var(--accent)}
.lrow{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:6px 14px 6px 18px;border:0;background:none;color:inherit;font:inherit;font-size:13px;text-align:left;cursor:pointer;line-height:1.35}
.lrow:hover{background:var(--accent-weak)} .lrow.cur{background:var(--accent-weak);box-shadow:inset 3px 0 0 var(--accent)}
.lrow[disabled]{cursor:not-allowed;opacity:.55}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.dot.done{background:var(--ok);border-color:var(--ok)} .dot.weak{background:var(--bad-weak);border-color:var(--bad)} .dot.cur{border-color:var(--accent)}
.lnum{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
/* reader */
.reader{padding:22px 26px;min-width:0}
@media (max-width:600px){.reader{padding:16px}}
.rhead{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.rhead h2{font-size:21px;margin:0}
.body{max-width:72ch}
.sec{padding:14px 0 6px;border-bottom:1px dashed var(--line);scroll-margin-top:130px}
.sec:last-child{border-bottom:0}
.sec h3{font-size:16.5px;margin:0 0 10px;display:flex;gap:8px;align-items:baseline}
.sec h3::before{content:"§";font-family:var(--f-mono);color:var(--accent);font-weight:600}
.sec.review{background:linear-gradient(90deg,var(--hl),transparent 85%);margin-inline:-14px;padding-inline:14px;border-radius:8px}
.sec p,.sec ul,.sec ol{margin:0 0 10px} .sec ul,.sec ol{padding-left:20px} .sec li{margin:2px 0}
.sec .sub{font-size:14px;color:var(--muted)}
.sec pre.code{margin:4px 0 12px}
.tblw{overflow-x:auto;margin:4px 0 12px}
.tblw table{border-collapse:collapse;font-size:13.5px;min-width:100%}
.tblw th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:7px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.tblw td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.callout{font-size:14px;background:var(--accent-weak);border-radius:8px;padding:9px 12px;margin:4px 0 12px}
.callout.exam{background:var(--warn-weak)} .callout.exam::before{content:"시험 ";font-weight:700;color:var(--warn)} [lang="en"] .callout.exam::before{content:none}
.langsw{display:flex;gap:4px;align-items:center;padding:4px 14px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}.langsw .note{margin-right:auto}.langsw button{font:inherit;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}.langsw button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink,#fff)}
.callout.trap{background:var(--bad-weak)}
.callout.prof{background:var(--sheet);border:1px solid var(--line);border-left:3px solid var(--accent)} .callout.prof b{color:var(--accent)} .callout.prof .src{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.rfoot{margin-top:20px;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-weak);border-radius:var(--r)}
.banner{position:sticky;top:112px;z-index:4;margin-bottom:14px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--warn-weak);border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-radius:var(--r);font-size:13.5px}
/* quiz */
.qwrap{padding:20px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:600px){.qwrap{padding:16px}}
.qtop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.pips{display:flex;gap:4px}.pips i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--accent)} .pips i.ok{background:var(--ok)} .pips i.no{background:var(--bad)}
.prompt{font-size:15.5px;white-space:pre-wrap;max-width:75ch}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{font:inherit;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);cursor:pointer;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
.choice:hover{border-color:var(--accent)} .choice.sel{border-color:var(--accent);background:var(--accent-weak)}
.choice.right{border-color:var(--ok);background:var(--ok-weak)} .choice.wrongc{border-color:var(--bad);background:var(--bad-weak)}
.choice .k{font-family:var(--f-mono);color:var(--muted)}
.ox{display:flex;gap:10px}.ox .choice{grid-template-columns:1fr;text-align:center;font-size:22px;font-weight:700;min-width:90px}
.blanks{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;align-items:center;max-width:520px}
.blanks label{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.result{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.mark{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pen{font-family:var(--f-pen);color:var(--pen);font-size:44px;line-height:1;transform:rotate(-4deg);display:inline-block;min-width:60px}
.pen small{font-size:26px}
.fb{font-size:14px;max-width:70ch}
.missed{margin:0;padding-left:18px;font-size:13.5px;color:var(--bad)}
.tip{font-size:13.5px;background:var(--warn-weak);border-radius:8px;padding:9px 12px;max-width:75ch;white-space:pre-wrap}
.tip b{color:var(--warn)}
.goto{font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sumrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sumrow:last-child{border-bottom:0}
.revcard{padding:14px 16px;display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--bad)}
/* home */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.stat{padding:12px 14px}.stat .v{font-family:var(--f-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}.stat .s{font-size:12px;color:var(--muted)}
.cta{padding:18px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:20px}
.cta .t{font-size:17px;font-weight:700}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ucard{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.ucard .ul{display:flex;flex-direction:column}
.ucard .li{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding:5px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font-family:inherit;text-align:left;cursor:pointer}
.ucard .li[disabled]{cursor:not-allowed;opacity:.55}
.weaklist{display:flex;flex-direction:column}
.wk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.wk:last-child{border-bottom:0}
/* practice etc */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.practice{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.practice{grid-template-columns:minmax(0,1fr)}}
.qlist{max-height:calc(100vh - 220px);overflow:auto;position:sticky;top:118px}
@media (max-width:900px){.qlist{max-height:260px;position:static}}
.qrow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:8px 12px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.qrow:hover{background:var(--accent-weak)} .qrow.cur{background:var(--accent-weak);box-shadow:inset 3px 0 0 var(--accent)}
.qrow .t{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd{width:9px;height:9px;border-radius:50%;background:var(--line)}
.sd.good{background:var(--ok)} .sd.mid{background:var(--warn)} .sd.weak{background:var(--bad)}
.yr{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.mockhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;margin-bottom:14px;position:sticky;top:112px;z-index:3}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}.timer.low{color:var(--pen)}
.mockq{margin-bottom:12px}
.chart{width:100%;height:auto;display:block}
.hist{width:100%;border-collapse:collapse;font-size:13px}
.hist td,.hist th{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
.hist th{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:700px){.cols{grid-template-columns:minmax(0,1fr)}}
.cols pre{white-space:pre-wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
figure.slide{margin:6px 0 14px;display:flex;flex-direction:column;gap:6px}
figure.slide .zoom{padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:zoom-in;overflow:hidden;display:block;max-width:100%}
figure.slide img{display:block;width:100%;height:auto}
figure.slide figcaption{font-size:12.5px;color:var(--muted)}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(8,14,16,.86);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px;background:#fff}
.lightbox .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:14px;font:inherit;font-size:13px;color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 10px;cursor:pointer}
.tbl-wrap{overflow-x:auto}
table.topics{width:100%;border-collapse:collapse;font-size:13.5px}
table.topics th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:10px 10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.topics td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.topics tr.ugrp td{background:var(--code-bg);font-weight:600;font-size:12.5px;color:var(--muted)}
table.topics tr.dim td{opacity:.55}
.tname{font-weight:500}.tsub{font-size:11.5px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:70px}.bar>b{display:block;height:100%;background:var(--accent);border-radius:4px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.pts{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--warn-weak);color:var(--warn);white-space:nowrap}
.recs{display:flex;flex-direction:column}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;font:inherit;color:inherit;text-align:left;width:100%}
.rec:last-child{border-bottom:0}.rec:hover{background:var(--accent-weak)}
.rec .q{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.why{font-size:11.5px;color:var(--muted);white-space:nowrap}
.prev{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.prev.ok{background:var(--ok-weak);color:var(--ok)} .prev.no{background:var(--bad-weak);color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>DB 중간 트레이너</h1>
      <div class="chips" hidden>
        <span class="chip dday" id="dday">중간고사 10/23 (금)</span>
        <span class="chip" id="store">저장소 연결 중…</span>
        <span class="chip" id="grader">채점: 확인 중…</span>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-v="dash" aria-selected="false">대시보드</button>
      <button role="tab" data-v="learn" aria-selected="true">학습</button>
      <button role="tab" data-v="practice" aria-selected="false">문제 풀기</button>
      <button role="tab" data-v="mock" aria-selected="false">모의고사</button>
      <button role="tab" data-v="wrong" aria-selected="false">오답노트</button>
      <button role="tab" data-v="hist" aria-selected="false">기록</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-dash" hidden></section>
  <section class="view" id="v-learn"></section>
  <section class="view" id="v-practice" hidden></section>
  <section class="view" id="v-mock" hidden></section>
  <section class="view" id="v-wrong" hidden></section>
  <section class="view" id="v-hist" hidden></section>
</main>

<script id="db-data" type="application/json">/*DATA*/</script>
<script>
(() => {
const DATA = JSON.parse(document.getElementById("db-data").textContent);
const UNITS = DATA.units;

/* ── derived ───────────────────────── */
const allQ = () => DATA.questions.concat(extra);
const qById = id => allQ().find(q => q.id === id);
function latestBy(key){
  const m = {};
  for (const a of attempts){ const k = a[key]; if (k && (!m[k] || a.at > m[k].at)) m[k] = a; }
  return m;
}
const latestQ = () => latestBy("qid");
const latestC = () => latestBy("concept");
function level(score){ if (score == null) return "none"; return score >= .85 ? "good" : score >= PASS ? "mid" : "weak"; }
const LV = { none:"미시도", weak:"약점", mid:"보통", good:"숙달" };
const lessonConcepts = lid => LES[lid].secs.filter(s => allQ().some(q => q.concept === s.id)).map(s => s.id);
const lessonDone = lid => !!progress[lid]?.done;
function lessonUnlocked(lid){
  const i = LESSONS.findIndex(l => l.id === lid);
  return i <= 0 || lessonDone(LESSONS[i-1].id) || lessonDone(lid);
}
function lessonWeak(lid){ const lc = latestC(); return lessonConcepts(lid).filter(c => lc[c] && lc[c].score < PASS); }
function nextLesson(){ return LESSONS.find(l => !lessonDone(l.id)) || null; }
function srcOf(concept){ const s = SEC[concept]; if (!s) return ""; const l = LES[s.lesson]; return `${l.id} §${T(s,"title")} · ${l.src}`; }

function setStoreChip(){ const el = $("#store"); el.textContent = db ? "기록 저장: 클라우드" : "기록 저장: 이 브라우저만"; el.className = "chip " + (db ? "live" : "local"); }

function toastErr(msg){ const el = document.createElement("div"); el.className = "err"; el.textContent = msg; $("main").prepend(el); setTimeout(()=>el.remove(), 6000); }
async function saveAttempt(a){
  a.at = Date.now(); a.answer = String(a.answer || "").slice(0, 6000);
  const q = qById(a.qid); a.concept = q?.concept || ""; a.lesson = q?.lesson || "";
  const id = a.at + "-" + Math.random().toString(36).slice(2,8);
  if (db){
    try { await db.collection("attempts").doc(id).set(a); if (!attempts.find(x => x._id === id)) attempts.push({ ...a, _id:id }); return id; }
    catch(e){ toastErr("기록을 클라우드에 저장하지 못했어 (" + (e.code||"error") + "). 이 브라우저에만 남겨둘게."); }
  }
  const loc = ls.get("db-attempts", []); loc.push({ ...a, _id:id }); ls.set("db-attempts", loc);
  attempts.push({ ...a, _id:id }); return id;
}
async function updateAttempt(id, patch){
  const j = attempts.findIndex(x => x._id === id); if (j >= 0) Object.assign(attempts[j], patch);
  if (db){ try { await db.collection("attempts").doc(id).update(patch); return; } catch {} }
  const loc = ls.get("db-attempts", []); const i = loc.findIndex(x => x._id === id);
  if (i >= 0){ Object.assign(loc[i], patch); ls.set("db-attempts", loc); }
}
async function saveProgress(lid, passedPatch){
  const prev = progress[lid] || {};
  const passed = { ...(prev.passed || {}), ...passedPatch };
  const done = prev.done || lessonConcepts(lid).every(c => passed[c]);
  progress[lid] = { ...prev, passed, done, at:Date.now() };
  const loc = ls.get("db-progress", {}); loc[lid] = progress[lid]; ls.set("db-progress", loc);
  if (db){ try { await db.collection("progress").doc(lid).set(progress[lid]); } catch {} }
}

/* ── grading ───────────────────────── */
function autoGrade(q, ans){
  if (q.type === "mc"){ const ok = Number(ans) === q.answer; return { score: ok ? 1 : 0, feedback: ok ? "정답!" : `정답은 ${q.answer+1}번.` }; }
  if (q.type === "ox"){ const ok = ans === q.answer; return { score: ok ? 1 : 0, feedback: ok ? "정답!" : `정답은 ${q.answer ? "O" : "X"}.` }; }
  if (q.type === "blank"){
    const arr = Array.isArray(ans) ? ans : [];
    let hit = 0; const missed = [];
    q.accept.forEach((alts, i) => {
      const v = norm(arr[i]);
      if (v && alts.some(a => norm(a) === v)) hit++; else missed.push(`(${String.fromCharCode(97+i)}) 정답: ${alts[0]}`);
    });
    const score = hit / q.accept.length;
    return { score, missed, feedback: score === 1 ? "빈칸 전부 맞았어." : `${q.accept.length}칸 중 ${hit}칸 맞음. 표현이 달라서 틀린 거면 아래 버튼으로 고쳐.` };
  }
  return null;
}
function gradingPrompt(q, ans){
  return `You grade one answer from a midterm in Databases (데이터베이스, Chung-Ang University, Elmasri & Navathe "Fundamentals of Database Systems" 7th ed.). The course is taught in English; the student may answer in Korean or English.

Grade the student's answer against the model answer and key points.
- Accept synonyms and Korean/English term equivalents (e.g. 참조 무결성 = referential integrity, 개체 = entity, 투플 = tuple).
- Short answer: credit each key point proportionally. Brevity is fine.
- SQL: judge by whether the query returns the correct result on the given schema, not by matching the model text. Accept any equivalent formulation (JOIN ... ON vs WHERE join condition, IN vs EXISTS vs = ANY, aliases or none, keyword case, missing final semicolon). Deduct for: a missing join condition (Cartesian product), a wrong or missing selection condition, wrong attributes in SELECT, non-grouped attribute in SELECT with GROUP BY, a group condition put in WHERE instead of HAVING, missing DISTINCT only when the question explicitly asks for distinct values. Minor syntax slips that a reader would fix immediately lose little.
- Relational algebra: accept Greek symbols (σ π ⋈ ρ ∪ ∩ − × ÷ ℑ) or words (SELECT, PROJECT, JOIN, RENAME, UNION, MINUS, DIVISION, FUNCTION), either a single nested expression or a sequence of named intermediate relations (TEMP ← ...). Judge correctness of the operations and conditions; the order of independent selections does not matter.
- ER design / ER-to-relational mapping: judge entities, keys, relationship cardinality and participation, and where foreign keys go (FK on the N-side for 1:N, separate relation with composite PK for M:N and multivalued attributes, owner PK + partial key for weak entities). Accept reasonable alternatives that the textbook also allows (e.g. 1:1 FK on either side, though the total-participation side is preferred).
- Constraint-violation questions: the student must name the violated constraint(s) correctly; extra wrong constraints lose credit.
- An empty or "모르겠다"-style answer scores 0.

Question type: ${q.type}
Question: ${q.prompt}
${q.code ? "Schema/data given:\n" + q.code + "\n" : ""}
Model answer:
${q.answer}
${q.keys ? "Key points: " + q.keys.join(" | ") + "\n" : ""}${q.explain ? "Note: " + q.explain + "\n" : ""}
Student answer:
<<<
${ans}
>>>

Reply with only this JSON:
{"score": <number 0..1>, "verdict": "correct" | "partial" | "wrong", "feedback": "<Korean, casual 반말, 1-3 sentences, concrete: what was right/wrong>", "missed": ["<short Korean item the student missed or got wrong>", ...]}`;
}
async function claudeGrade(q, ans){
  const r = await sample.json(gradingPrompt(q, ans), { modelTier: q.type === "calc" ? "default" : "quick" });
  let score = Number(r?.score); if (!isFinite(score)) score = 0; score = Math.max(0, Math.min(1, score));
  return { score, feedback:String(r?.feedback || ""), missed: Array.isArray(r?.missed) ? r.missed.map(String).slice(0,6) : [] };
}
function sampleErrMsg(e){
  const c = e?.code;
  if (c === "not_granted") return "Claude 채점이 허용되지 않았어. 답 보고 자가채점해줘.";
  if (c === "rate_limited") return "채점 요청이 몰렸어. 잠깐 뒤에 다시 눌러줘.";
  return "채점에 실패했어 (" + (c || "error") + "). 자가채점으로 기록할 수 있어.";
}

/* ── question UI (shared) ───────────────────────── */
function blankCount(q){ return q.accept ? q.accept.length : 0; }
function inputHTML(q, key, draft, locked){
  if (q.type === "mc") return `<div class="choices">${q.choices.map((c,i) => {
      let cls = "choice"; if (draft === i) cls += " sel";
      if (locked){ if (i === q.answer) cls += " right"; else if (draft === i) cls += " wrongc"; }
      return `<button class="${cls}" data-pick="${i}" data-k="${key}" ${locked?"disabled":""}><span class="k">${i+1}</span><span>${esc(c)}</span></button>`; }).join("")}</div>`;
  if (q.type === "ox") return `<div class="ox">${[true,false].map(v => {
      let cls = "choice"; if (draft === v) cls += " sel";
      if (locked){ if (v === q.answer) cls += " right"; else if (draft === v) cls += " wrongc"; }
      return `<button class="${cls}" data-pick="${v}" data-k="${key}" ${locked?"disabled":""}>${v ? "O" : "X"}</button>`; }).join("")}</div>`;
  if (q.type === "blank"){
    const d = Array.isArray(draft) ? draft : [];
    return `<div class="blanks">${q.accept.map((_,i) => `<label for="b-${key}-${i}">(${String.fromCharCode(97+i)})</label><input type="text" id="b-${key}-${i}" data-blank="${i}" data-k="${key}" value="${esc(d[i]||"")}" ${locked?"readonly":""} autocomplete="off">`).join("")}</div>`;
  }
  return `<textarea id="ta-${key}" data-k="${key}" spellcheck="false" ${locked?"readonly":""} placeholder="${q.type==="calc" ? "SQL·관계대수·스키마를 그대로 써. 관계대수는 σ π ⋈ ρ 대신 SELECT, PROJECT, JOIN, RENAME 같은 단어로 써도 돼." : "핵심만 간략히 (한국어·영어 아무거나)"}">${esc(typeof draft === "string" ? draft : "")}</textarea>`;
}
function resultHTML(q, r, opts={}){
  if (!r) return "";
  if (r.state === "loading") return `<div class="result"><div class="note">${q.type==="calc" ? "Claude가 풀이를 읽고 채점하는 중… (보통 10–40초)" : "Claude가 채점하는 중…"}</div></div>`;
  const pts = opts.pts || 1;
  const mark = r.score == null ? "" : `<span class="pen">${opts.pts ? Math.round(r.score*pts*10)/10 + `<small>/${pts}</small>` : Math.round(r.score*100)}</span>`;
  const sec = SEC[q.concept];

    ${r.missed?.length ? `<ul class="missed">${r.missed.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>` : ""}
    ${(q.type === "mc" || q.type === "ox") ? "" : `<div><div class="label" style="margin-bottom:6px">모범답안</div><pre class="code" style="white-space:pre-wrap">${esc(q.answer)}</pre></div>`}
    ${q.explain ? `<div class="tip"><b>해설</b> ${esc(q.explain)}</div>` : ""}
    ${sec ? `<div class="goto note">교안 위치: ${esc(srcOf(q.concept))} <button class="btn ghost sm" data-read="${esc(q.concept)}">이 부분 읽기 →</button></div>` : ""}
    ${opts.self ? `<div class="actions"><span class="note">${r.score == null ? "스스로 매겨서 기록:" : "채점이 이상하면 직접 고쳐:"}</span>
      <button class="btn sm" data-self="1" data-k="${opts.key}">맞음</button><button class="btn sm" data-self="0.5" data-k="${opts.key}">절반</button><button class="btn sm" data-self="0" data-k="${opts.key}">틀림</button>
      ${(q.type === "blank" && sample && r.score != null && r.score < 1) ? `<button class="btn sm ghost" data-regrade="${opts.key}">Claude에게 다시 채점</button>` : ""}</div>` : ""}
  </div>`;
}
const drafts = {};  // key -> draft value
function readDraft(q, key){
  if (q.type === "blank") return [...document.querySelectorAll(`[data-blank][data-k="${key}"]`)].map(i => i.value);
  if (q.type === "short" || q.type === "calc") return $(`#ta-${CSS.escape(key)}`)?.value ?? "";
  return drafts[key];
}
function answerText(q, d){
  if (q.type === "mc") return d == null ? "" : `${d+1}. ${q.choices[d]}`;
  if (q.type === "ox") return d == null ? "" : (d ? "O" : "X");
  if (q.type === "blank") return (d||[]).map((v,i)=>`(${String.fromCharCode(97+i)}) ${v}`).join("  ");
  return String(d || "");
}
async function gradeAny(q, d){
  const auto = autoGrade(q, d);
  if (auto) return { ...auto, grader:"auto" };
  const ans = String(d || "").trim();
  if (!ans) return { score:0, feedback:"빈 답으로 냈어.", grader:"blank" };
  if (!sample) return { score:null, grader:"self", feedback:"" };
  try { return { ...(await claudeGrade(q, ans)), grader:"claude" }; }
  catch(e){ return { score:null, error: sampleErrMsg(e), grader:"self" }; }
}

function rankQs(list){
  const lq = latestQ();
  return list.map(q => ({ q, k: attempts.filter(a => a.qid === q.id).length * 10 + (lq[q.id] ? lq[q.id].score * 3 : 0) + Math.random() * 2 }))
    .sort((a,b) => a.k - b.k).map(x => x.q);

// n questions for one concept: one written (short/calc) when n >= 2 and available, rest quick; quick ones first
function pickN(concept, n, avoid){
  const cand = allQ().filter(q => q.concept === concept);
  let pool = cand.filter(q => !avoid.has(q.id)); if (pool.length < n) pool = pool.concat(rankQs(cand.filter(q => avoid.has(q.id))));
  const quick = rankQs(pool.filter(q => QUICK(q.type))), written = rankQs(pool.filter(q => !QUICK(q.type)));
  let out = [];
  if (n === 1) out = rankQs(pool).slice(0, 1);
  else {
    const w = written.length ? 1 : 0;
    out = quick.slice(0, n - w).concat(written.slice(0, w));
    for (const q of rankQs(pool)) if (out.length < n && !out.includes(q)) out.push(q);
  }
  out = [...new Set(out)].slice(0, n);
  return out.filter(q => QUICK(q.type)).concat(out.filter(q => !QUICK(q.type)));
}

  L.quiz = { lessonId:lid, round, items, idx:0, res:{}, drafts:{}, used:[...used], start:Date.now() };
  L.mode = "quiz"; L.lesson = lid; saveL(); renderLearn(); window.scrollTo({ top:0 });
}

}

function recommendations(n){
  const lq = latestQ();
  const studied = lid => lessonDone(lid) || attempts.some(a => a.lesson === lid);
  return allQ().map(q => {
    const l = lq[q.id];
    if (l && l.score >= .85) return null;
    const need = l ? 1 - l.score : 1.1;
    const s = need * (1 + wOf(q.concept)) * (q.slot ? 1.6 : 1) * (studied(q.lesson) ? 1 : .25) * (0.9 + Math.random() * 0.2);
    return { q, s };
  }).filter(Boolean).sort((a,b) => b.s - a.s).slice(0, n).map(x => x.q);
}

function filteredQs(){
  const lq = latestQ();
  return allQ().filter(q => {
    if (filters.lesson && q.lesson !== filters.lesson) return false;
    if (filters.unit && q.unit !== filters.unit) return false;
    if (filters.concept && q.concept !== filters.concept) return false;
    if (filters.type && q.type !== filters.type) return false;
    const l = lq[q.id];
    if (filters.status === "new" && l) return false;
    if (filters.status === "wrong" && !(l && l.score < PASS)) return false;
    if (filters.status === "notgood" && l && l.score >= .85) return false;
    if (filters.status === "exam" && !q.slot) return false;
    return true;
  });
}

/* ── MOCK view ───────────────────────── */
function buildMock(){

let timerHandle = null;
function tickTimer(){

function collectMock(){ mock.items.forEach((x,i) => { const q = qById(x.qid); const d = readDraft(q, "m"+i); if (d !== undefined) mock.answers[x.qid] = d; }); ls.set("db-mock", mock); }

    const r = await gradeAny(q, d); mock.results[x.qid] = r;

  if (k.startsWith("p-")){ const q = qById(k.slice(2)); if (q){ drafts[k] = readDraft(q, k); ls.set("db-draft-" + q.id, drafts[k]); } }
  else if (k.startsWith("z") && L.quiz){ const z = L.quiz; const q = qById(z.items[z.idx].qid); z.drafts[q.id] = readDraft(q, k); saveL(); }
  else if (k.startsWith("m") && mock){ const i = Number(k.slice(1)); const q = qById(mock.items[i].qid); mock.answers[q.id] = readDraft(q, k); ls.set("db-mock", mock); }
});
document.addEventListener("change", e => {
  const t = e.target; const map = { "f-unit":"unit", "f-concept":"concept", "f-type":"type", "f-status":"status" };
  if (!map[t.id]) return; filters[map[t.id]] = t.value; filters.lesson = ""; if (t.id === "f-unit") filters.concept = "";
  ls.set("db-filters", filters); curId = null; renderPractice();
});

/* ── boot ───────────────────────── */
async function boot(){
  attempts = ls.get("db-attempts", []).map(a => ({ ...a, _id:a._id || "local" }));
  progress = ls.get("db-progress", {});
  if (L.mode === "quiz" && !L.quiz) L.mode = "home";
  show(view); setStoreChip(); setGraderChip();
  if (!window.claude?.use) return;
  claude.use("sample").then(s => { sample = s; setGraderChip(); renderAll(); }).catch(() => {});
  const d = await claude.use("db").catch(() => null);
  if (!d) return;
  db = d; setStoreChip();
  db.collection("attempts").orderBy("at","desc").limit(2000).onSnapshot(snap => {
    const remote = snap.docs.map(x => ({ ...x.data(), _id:x.id }));
    const local = ls.get("db-attempts", []).map(a => ({ ...a, _id:a._id || "local" }));
    attempts = remote.concat(local.filter(l => !remote.find(r => r._id === l._id)));
    renderAll();
  }, () => { db = null; setStoreChip(); });
  db.collection("progress").onSnapshot(snap => {
    const remote = Object.fromEntries(snap.docs.map(x => [x.id, x.data()]));
    progress = { ...ls.get("db-progress", {}), ...remote };
    renderAll();
  }, () => {});
  db.collection("extra_questions").onSnapshot(snap => {
    extra = snap.docs.map(x => ({ id:x.id, type:"short", prompt:"", answer:"", ...x.data() }))
      .filter(q => SEC[q.concept]).map(q => ({ ...q, lesson:SEC[q.concept].lesson, unit:LES[SEC[q.concept].lesson].unit, extra:true }));
    renderAll();
  }, () => {});
}
boot();
})();
</script>
