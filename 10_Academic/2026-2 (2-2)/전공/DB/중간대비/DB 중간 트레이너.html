= 'Research'", "Join condition Dnumber = Dno"]}, {"id": "4-sfw-5", "concept": "sfw", "type": "calc", "prompt": "5번 부서에서 일하고 'ProductX' 프로젝트에서 주 10시간 넘게 일하는 사원의 이름을 검색하시오. (교안 연습 2)", "answer": "SELECT E.Fname, E.Minit, E.Lname\nFROM   EMPLOYEE AS E, PROJECT AS P, WORKS_ON AS W\nWHERE  E.Dno = 5 AND P.Pname = 'ProductX' AND W.Hours > 10\n  AND  E.Ssn = W.Essn AND W.Pno = P.Pnumber;\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nFname | Minit | Lname\nJohn | B | Smith\nJoyce | A | English\n\n교안 풀이의 마지막 조인 조건은 E.Dno = P.Dnum으로 적혀 있지만, 사원이 그 프로젝트에서 일하는지를 잇는 조건은 W.Pno = P.Pnumber가 맞다.", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["세 테이블", "선택 조건 3개 (Dno=5, Pname, Hours>10)", "조인 조건 2개 (Ssn=Essn, Pno=Pnumber)"], "slot": 12, "pts": 10, "lesson": "L4-4", "unit": "U4", "prompt_en": "Retrieve the names of employees in department 5 who work more than 10 hours per week on the 'ProductX' project. (Slide exercise 2)", "answer_en": "SELECT E.Fname, E.Minit, E.Lname\nFROM   EMPLOYEE AS E, PROJECT AS P, WORKS_ON AS W\nWHERE  E.Dno = 5 AND P.Pname = 'ProductX' AND W.Hours > 10\n  AND  E.Ssn = W.Essn AND W.Pno = P.Pnumber;\n\n-- Result on the textbook COMPANY state (2 rows)\nFname | Minit | Lname\nJohn | B | Smith\nJoyce | A | English\n\nThe slide solution writes the last join condition as E.Dno = P.Dnum, but the condition that links an employee to the project they work on is W.Pno = P.Pnumber.", "keys_en": ["Three tables", "3 selection conditions (Dno=5, Pname, Hours>10)", "2 join conditions (Ssn=Essn, Pno=Pnumber)"]}, {"id": "4-sfw-6", "concept": "sfw", "type": "calc", "prompt": "'Stafford'에 있는 모든 프로젝트에 대해 프로젝트 번호, 통제 부서 번호, 부서 관리자의 성, 주소, 생일을 검색하시오.", "answer": "SELECT P.Pnumber, P.Dnum, E.Lname, E.Address, E.Bdate\nFROM   PROJECT AS P, DEPARTMENT AS D, EMPLOYEE AS E\nWHERE  P.Dnum = D.Dnumber AND D.Mgr_ssn = E.Ssn\n  AND  P.Plocation = 'Stafford';\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nPnumber | Dnum | Lname | Address | Bdate\n10 | 4 | Wallace | 291 Berry, Bellaire, TX | 1941-06-20\n30 | 4 | Wallace | 291 Berry, Bellaire, TX | 1941-06-20", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["조인 P.Dnum = D.Dnumber", "조인 D.Mgr_ssn = E.Ssn", "선택 Plocation = 'Stafford'"], "slot": 12, "pts": 10, "lesson": "L4-4", "unit": "U4", "prompt_en": "For every project located in 'Stafford', retrieve the project number, the controlling department number, and the department manager's last name, address and birth date.", "answer_en": "SELECT P.Pnumber, P.Dnum, E.Lname, E.Address, E.Bdate\nFROM   PROJECT AS P, DEPARTMENT AS D, EMPLOYEE AS E\nWHERE  P.Dnum = D.Dnumber AND D.Mgr_ssn = E.Ssn\n  AND  P.Plocation = 'Stafford';\n\n-- Result on the textbook COMPANY state (2 rows)\nPnumber | Dnum | Lname | Address | Bdate\n10 | 4 | Wallace | 291 Berry, Bellaire, TX | 1941-06-20\n30 | 4 | Wallace | 291 Berry, Bellaire, TX | 1941-06-20", "keys_en": ["Join P.Dnum = D.Dnumber", "Join D.Mgr_ssn = E.Ssn", "Selection Plocation = 'Stafford'"]}, {"id": "4-sfw-7", "concept": "sfw", "type": "calc", "prompt": "Houston에 사는 사원 중 급여가 30000 이상인 사원의 이름과 급여를 검색하시오. (Address에 'Houston'이 들어 있으면 Houston에 사는 것으로 본다)", "answer": "SELECT Fname, Lname, Salary\nFROM   EMPLOYEE\nWHERE  Address LIKE '%Houston%' AND Salary >= 30000;\n\n-- 교재 COMPANY 상태에서 실행 결과 (3행)\nFname | Lname | Salary\nJohn | Smith | 30000\nFranklin | Wong | 40000\nJames | Borg | 55000", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["LIKE '%Houston%'", "Salary >= 30000"], "lesson": "L4-4", "unit": "U4", "prompt_en": "Retrieve the names and salaries of employees who live in Houston and whose salary is 30000 or more. (Consider an employee to live in Houston if Address contains 'Houston'.)", "answer_en": "SELECT Fname, Lname, Salary\nFROM   EMPLOYEE\nWHERE  Address LIKE '%Houston%' AND Salary >= 30000;\n\n-- Result on the textbook COMPANY state (3 rows)\nFname | Lname | Salary\nJohn | Smith | 30000\nFranklin | Wong | 40000\nJames | Borg | 55000"}, {"id": "4-sfw-8", "concept": "sfw", "type": "calc", "prompt": "'Administration' 부서가 통제하는 프로젝트의 이름과 위치를 검색하시오.", "answer": "SELECT P.Pname, P.Plocation\nFROM   PROJECT AS P, DEPARTMENT AS D\nWHERE  P.Dnum = D.Dnumber AND D.Dname = 'Administration';\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nPname | Plocation\nComputerization | Stafford\nNewbenefits | Stafford", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["조인 Dnum = Dnumber", "선택 Dname = 'Administration'"], "lesson": "L4-4", "unit": "U4", "prompt_en": "Retrieve the names and locations of the projects controlled by the 'Administration' department.", "answer_en": "SELECT P.Pname, P.Plocation\nFROM   PROJECT AS P, DEPARTMENT AS D\nWHERE  P.Dnum = D.Dnumber AND D.Dname = 'Administration';\n\n-- Result on the textbook COMPANY state (2 rows)\nPname | Plocation\nComputerization | Stafford\nNewbenefits | Stafford", "keys_en": ["Join Dnum = Dnumber", "Selection Dname = 'Administration'"]}, {"id": "4-qa-1", "concept": "qualify-alias", "type": "mc", "prompt": "같은 릴레이션을 한 질의에서 두 역할(사원, 상사)로 참조하려면?", "choices": ["DISTINCT를 쓴다", "테이블을 두 번 만든다", "별칭(투플 변수)을 두 개 쓴다", "UNION을 쓴다"], "answer": 2, "lesson": "L4-4", "unit": "U4", "prompt_en": "How do you refer to the same relation in two roles (employee and supervisor) in one query?", "choices_en": ["Use DISTINCT", "Create the table twice", "Use two aliases (tuple variables)", "Use UNION"]}, {"id": "4-qa-2", "concept": "qualify-alias", "type": "ox", "prompt": "SELECT E.Fname, E.Lname, E.Fname, E.Lname FROM EMPLOYEE AS E WHERE E.Super_ssn = E.Ssn; 은 사원과 그 상사의 이름을 검색한다.", "answer": false, "explain": "별칭이 하나라 '자기 자신이 자기 상사'인 사원을 찾는 질의가 된다(0행). 상사용 별칭 S가 따로 필요.", "lesson": "L4-4", "unit": "U4", "prompt_en": "SELECT E.Fname, E.Lname, E.Fname, E.Lname FROM EMPLOYEE AS E WHERE E.Super_ssn = E.Ssn; retrieves the names of employees and their supervisors.", "explain_en": "With only one alias, it becomes a query for employees who are their own supervisor (0 rows). A separate alias S for the supervisor is needed."}, {"id": "4-qa-3", "concept": "qualify-alias", "type": "calc", "prompt": "각 사원의 이름(Fname, Lname)과 그 사원의 직속 상사의 이름(Fname, Lname)을 검색하시오.", "answer": "SELECT E.Fname, E.Lname, S.Fname, S.Lname\nFROM   EMPLOYEE AS E, EMPLOYEE AS S\nWHERE  E.Super_ssn = S.Ssn;\n\n-- 교재 COMPANY 상태에서 실행 결과 (7행)\nFname | Lname | Fname | Lname\nJohn | Smith | Franklin | Wong\nFranklin | Wong | James | Borg\nAlicia | Zelaya | Jennifer | Wallace\nJennifer | Wallace | James | Borg\nRamesh | Narayan | Franklin | Wong\nJoyce | English | Franklin | Wong\nAhmad | Jabbar | Jennifer | Wallace\n\n상사가 없는(Super_ssn NULL) Borg는 결과에 없다.", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["EMPLOYEE 별칭 두 개 (E, S)", "E.Super_ssn = S.Ssn", "E.이름, S.이름"], "slot": 12, "pts": 10, "lesson": "L4-4", "unit": "U4", "prompt_en": "For each employee, retrieve the employee's name (Fname, Lname) and the name (Fname, Lname) of his or her immediate supervisor.", "answer_en": "SELECT E.Fname, E.Lname, S.Fname, S.Lname\nFROM   EMPLOYEE AS E, EMPLOYEE AS S\nWHERE  E.Super_ssn = S.Ssn;\n\n-- Result on the textbook COMPANY state (7 rows)\nFname | Lname | Fname | Lname\nJohn | Smith | Franklin | Wong\nFranklin | Wong | James | Borg\nAlicia | Zelaya | Jennifer | Wallace\nJennifer | Wallace | James | Borg\nRamesh | Narayan | Franklin | Wong\nJoyce | English | Franklin | Wong\nAhmad | Jabbar | Jennifer | Wallace\n\nBorg, who has no supervisor (Super_ssn NULL), is not in the result.", "keys_en": ["Two aliases of EMPLOYEE (E, S)", "E.Super_ssn = S.Ssn", "E's name, S's name"]}, {"id": "4-qa-4", "concept": "qualify-alias", "type": "short", "prompt": "SQL에서 속성 이름에 릴레이션 이름을 붙여야(qualify) 하는 두 가지 경우를 쓰시오.", "answer": "1) 서로 다른 릴레이션에 같은 이름의 속성이 있을 때 (예: EMPLOYEE.Name과 DEPARTMENT.Name). 2) 같은 릴레이션을 한 질의에서 두 번 이상 참조할 때 → 별칭으로 구별 (EMPLOYEE AS E, EMPLOYEE AS S).", "keys": ["다른 릴레이션의 같은 이름 속성", "같은 릴레이션을 두 번 참조 (별칭)"], "lesson": "L4-4", "unit": "U4", "prompt_en": "Give the two cases in which an attribute name must be prefixed with the relation name (qualified) in SQL.", "answer_en": "1) When attributes in different relations have the same name (e.g., EMPLOYEE.Name and DEPARTMENT.Name). 2) When the same relation is referenced more than once in a query → distinguish them with aliases (EMPLOYEE AS E, EMPLOYEE AS S).", "keys_en": ["Same-named attributes in different relations", "Referring to the same relation twice (aliases)"]}, {"id": "4-qa-5", "concept": "qualify-alias", "type": "calc", "prompt": "직속 상사와 다른 부서에서 일하는 사원의 성과 부서 번호, 그 상사의 성과 부서 번호를 검색하시오.", "answer": "SELECT E.Lname, E.Dno, S.Lname, S.Dno\nFROM   EMPLOYEE AS E, EMPLOYEE AS S\nWHERE  E.Super_ssn = S.Ssn AND E.Dno <> S.Dno;\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nLname | Dno | Lname | Dno\nWong | 5 | Borg | 1\nWallace | 4 | Borg | 1", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["별칭 E, S", "E.Super_ssn = S.Ssn", "E.Dno <> S.Dno"], "slot": 12, "pts": 10, "lesson": "L4-4", "unit": "U4", "prompt_en": "Retrieve the last name and department number of each employee who works in a different department from his or her immediate supervisor, together with the supervisor's last name and department number.", "answer_en": "SELECT E.Lname, E.Dno, S.Lname, S.Dno\nFROM   EMPLOYEE AS E, EMPLOYEE AS S\nWHERE  E.Super_ssn = S.Ssn AND E.Dno <> S.Dno;\n\n-- Result on the textbook COMPANY state (2 rows)\nLname | Dno | Lname | Dno\nWong | 5 | Borg | 1\nWallace | 4 | Borg | 1", "keys_en": ["Aliases E, S", "E.Super_ssn = S.Ssn", "E.Dno <> S.Dno"]}, {"id": "4-mw-1", "concept": "missing-where-star", "type": "mc", "prompt": "SELECT Ssn, Dname FROM EMPLOYEE, DEPARTMENT; 의 결과 행 수는? (COMPANY 상태)", "choices": ["3", "8", "11", "24"], "answer": 3, "lesson": "L4-4", "unit": "U4", "prompt_en": "How many rows does SELECT Ssn, Dname FROM EMPLOYEE, DEPARTMENT; return? (COMPANY state)"}, {"id": "4-mw-2", "concept": "missing-where-star", "type": "ox", "prompt": "FROM에 테이블이 둘 이상인데 조인 조건을 빠뜨리면 카티션 곱이 나와 결과가 틀리고 매우 커진다.", "answer": true, "lesson": "L4-4", "unit": "U4", "prompt_en": "If FROM has two or more tables and the join condition is left out, the result is a Cartesian product, which is wrong and very large."}, {"id": "4-mw-3", "concept": "missing-where-star", "type": "calc", "prompt": "5번 부서에서 일하는 사원의 모든 속성을 검색하시오.", "answer": "SELECT *\nFROM   EMPLOYEE\nWHERE  Dno = 5;\n\n-- 교재 COMPANY 상태에서 실행 결과 (4행)\nFname | Minit | Lname | Ssn | Bdate | Address | Sex | Salary | Super_ssn | Dno\nJohn | B | Smith | 123456789 | 1965-01-09 | 731 Fondren, Houston, TX | M | 30000 | 333445555 | 5\nFranklin | T | Wong | 333445555 | 1955-12-08 | 638 Voss, Houston, TX | M | 40000 | 888665555 | 5\nRamesh | K | Narayan | 666884444 | 1962-09-15 | 975 Fire Oak, Humble, TX | M | 38000 | 333445555 | 5\nJoyce | A | English | 453453453 | 1972-07-31 | 5631 Rice, Houston, TX | F | 25000 | 333445555 | 5", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["SELECT *", "WHERE Dno = 5"], "lesson": "L4-4", "unit": "U4", "prompt_en": "Retrieve all attributes of the employees who work in department 5.", "answer_en": "SELECT *\nFROM   EMPLOYEE\nWHERE  Dno = 5;\n\n-- Result on the textbook COMPANY state (4 rows)\nFname | Minit | Lname | Ssn | Bdate | Address | Sex | Salary | Super_ssn | Dno\nJohn | B | Smith | 123456789 | 1965-01-09 | 731 Fondren, Houston, TX | M | 30000 | 333445555 | 5\nFranklin | T | Wong | 333445555 | 1955-12-08 | 638 Voss, Houston, TX | M | 40000 | 888665555 | 5\nRamesh | K | Narayan | 666884444 | 1962-09-15 | 975 Fire Oak, Humble, TX | M | 38000 | 333445555 | 5\nJoyce | A | English | 453453453 | 1972-07-31 | 5631 Rice, Houston, TX | F | 25000 | 333445555 | 5"}, {"id": "4-mw-4", "concept": "missing-where-star", "type": "short", "prompt": "SELECT 질의에서 WHERE 절을 생략하면 어떻게 되는지, FROM에 테이블이 하나일 때와 둘일 때로 나눠 쓰시오.", "answer": "투플 선택 조건이 없으므로 FROM에 있는 릴레이션의 투플을 모두 검색한다. 테이블이 하나면 그 테이블의 모든 투플, 둘 이상이면 가능한 모든 투플 조합(카티션 곱, 예: 8 × 3 = 24행)이 나온다.", "keys": ["조건 없음 → 모든 투플", "둘 이상이면 카티션 곱"], "lesson": "L4-4", "unit": "U4", "prompt_en": "Explain what happens when the WHERE clause is omitted from a SELECT query, separately for one table and for two tables in FROM.", "answer_en": "There is no tuple selection condition, so all tuples of the relations in FROM are retrieved. With one table, all tuples of that table; with two or more, all possible tuple combinations (the Cartesian product, e.g., 8 × 3 = 24 rows).", "keys_en": ["No condition → all tuples", "Two or more → Cartesian product"]}, {"id": "4-ms-1", "concept": "multiset-distinct", "type": "mc", "prompt": "SQL이 질의 결과에서 중복 투플을 자동으로 제거하지 않는 이유가 '아닌' 것은?", "choices": ["중복 제거는 비싼 연산이라서", "사용자가 중복을 보고 싶을 때가 있어서", "집계 함수에 중복이 필요해서", "SQL 테이블은 집합이라 중복이 원래 없어서"], "answer": 3, "lesson": "L4-5", "unit": "U4", "prompt_en": "Which is NOT a reason why SQL does not automatically eliminate duplicate tuples from query results?", "choices_en": ["Because duplicate elimination is an expensive operation", "Because the user may want to see duplicates", "Because duplicates are needed for aggregate functions", "Because SQL tables are sets, so there are no duplicates in the first place"]}, {"id": "4-ms-2", "concept": "multiset-distinct", "type": "mc", "prompt": "COMPANY 상태에서 SELECT DISTINCT Salary FROM EMPLOYEE; 의 결과 행 수는?", "choices": ["5", "6", "7", "8"], "answer": 1, "lesson": "L4-5", "unit": "U4", "prompt_en": "On the COMPANY state, how many rows does SELECT DISTINCT Salary FROM EMPLOYEE; return?"}, {"id": "4-ms-3", "concept": "multiset-distinct", "type": "ox", "prompt": "SQL은 테이블을 집합이 아니라 다중집합으로 취급한다.", "answer": true, "lesson": "L4-5", "unit": "U4", "prompt_en": "SQL treats a table not as a set but as a multiset."}, {"id": "4-ms-4", "concept": "multiset-distinct", "type": "short", "prompt": "SQL이 테이블을 다중집합으로 다루는 이유를 세 가지 쓰시오.", "answer": "1) 중복 제거는 비싼 연산이다 (투플을 정렬한 뒤 중복을 지워야 함). 2) 사용자가 결과에서 중복 투플을 보고 싶을 때가 있다. 3) 집계 함수를 적용할 때 중복이 필요하다 (예: 급여 합·평균).", "keys": ["중복 제거 비용", "사용자가 중복을 원할 수 있음", "집계 함수"], "lesson": "L4-5", "unit": "U4", "prompt_en": "Give three reasons why SQL treats tables as multisets.", "answer_en": "1) Duplicate elimination is an expensive operation (the tuples must be sorted first and then the duplicates removed). 2) The user may want to see duplicate tuples in the result. 3) Duplicates are needed when applying aggregate functions (e.g., sum or average of salaries).", "keys_en": ["Cost of duplicate elimination", "The user may want duplicates", "Aggregate functions"]}, {"id": "4-ms-5", "concept": "multiset-distinct", "type": "calc", "prompt": "사원들이 일하는 프로젝트 번호를 중복 없이 검색하시오.", "answer": "SELECT DISTINCT Pno\nFROM   WORKS_ON;\n\n-- 교재 COMPANY 상태에서 실행 결과 (6행)\nPno\n1\n2\n3\n10\n20\n30", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["DISTINCT", "WORKS_ON"], "lesson": "L4-5", "unit": "U4", "prompt_en": "Retrieve the project numbers that employees work on, without duplicates.", "answer_en": "SELECT DISTINCT Pno\nFROM   WORKS_ON;\n\n-- Result on the textbook COMPANY state (6 rows)\nPno\n1\n2\n3\n10\n20\n30"}, {"id": "4-ms-6", "concept": "multiset-distinct", "type": "blank", "prompt": "SELECT (a) Salary 는 중복을 유지하고(기본), SELECT (b) Salary 는 중복을 제거한다.", "answer": "(a) ALL / (b) DISTINCT", "accept": [["ALL", "all"], ["DISTINCT", "distinct"]], "lesson": "L4-5", "unit": "U4", "prompt_en": "SELECT (a) Salary keeps duplicates (the default), and SELECT (b) Salary eliminates duplicates."}, {"id": "4-so-1", "concept": "set-ops", "type": "mc", "prompt": "UNION, EXCEPT, INTERSECT의 결과에 대한 설명으로 옳은 것은?", "choices": ["중복이 제거된 집합", "항상 중복이 유지된 다중집합", "정렬된 리스트", "타입 호환이 아니어도 된다"], "answer": 0, "lesson": "L4-5", "unit": "U4", "prompt_en": "Which statement about the results of UNION, EXCEPT and INTERSECT is correct?", "choices_en": ["A set with duplicates eliminated", "Always a multiset that keeps duplicates", "A sorted list", "The relations need not be type compatible"]}, {"id": "4-so-2", "concept": "set-ops", "type": "calc", "prompt": "R(A) = {a1, a2, a2, a3}, S(A) = {a1, a2, a4, a5}일 때 다음 결과를 쓰시오.\n(1) R UNION ALL S  (2) R EXCEPT ALL S  (3) R INTERSECT ALL S  (4) R UNION S  (5) R EXCEPT S", "answer": "(1) {a1, a1, a2, a2, a2, a3, a4, a5}\n(2) {a2, a3}\n(3) {a1, a2}\n(4) {a1, a2, a3, a4, a5}\n(5) {a3}", "keys": ["(1) 8개 다중집합", "(2) {a2, a3}", "(3) {a1, a2}", "(4) 중복 제거 합집합", "(5) {a3}"], "slot": 16, "pts": 7, "lesson": "L4-5", "unit": "U4", "prompt_en": "Given R(A) = {a1, a2, a2, a3} and S(A) = {a1, a2, a4, a5}, give the following results.\n(1) R UNION ALL S  (2) R EXCEPT ALL S  (3) R INTERSECT ALL S  (4) R UNION S  (5) R EXCEPT S", "keys_en": ["(1) multiset of 8 elements", "(2) {a2, a3}", "(3) {a1, a2}", "(4) union with duplicates eliminated", "(5) {a3}"]}, {"id": "4-so-3", "concept": "set-ops", "type": "calc", "prompt": "성이 'Smith'인 사원이 일꾼으로 일하거나, 그 프로젝트를 통제하는 부서의 관리자인 프로젝트의 번호를 UNION으로 검색하시오.", "answer": "( SELECT DISTINCT Pnumber\n  FROM   PROJECT, DEPARTMENT, EMPLOYEE\n  WHERE  Dnum = Dnumber AND Mgr_ssn = Ssn AND Lname = 'Smith' )\nUNION\n( SELECT DISTINCT Pnumber\n  FROM   PROJECT, WORKS_ON, EMPLOYEE\n  WHERE  Pnumber = Pno AND Essn = Ssn AND Lname = 'Smith' );\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nPnumber\n1\n2", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["관리자 블록 (PROJECT–DEPARTMENT–EMPLOYEE)", "일꾼 블록 (PROJECT–WORKS_ON–EMPLOYEE)", "UNION"], "lesson": "L4-5", "unit": "U4", "prompt_en": "Using UNION, retrieve the numbers of projects that involve an employee whose last name is 'Smith', either as a worker or as a manager of the department that controls the project.", "answer_en": "( SELECT DISTINCT Pnumber\n  FROM   PROJECT, DEPARTMENT, EMPLOYEE\n  WHERE  Dnum = Dnumber AND Mgr_ssn = Ssn AND Lname = 'Smith' )\nUNION\n( SELECT DISTINCT Pnumber\n  FROM   PROJECT, WORKS_ON, EMPLOYEE\n  WHERE  Pnumber = Pno AND Essn = Ssn AND Lname = 'Smith' );\n\n-- Result on the textbook COMPANY state (2 rows)\nPnumber\n1\n2", "keys_en": ["Manager block (PROJECT–DEPARTMENT–EMPLOYEE)", "Worker block (PROJECT–WORKS_ON–EMPLOYEE)", "UNION"]}, {"id": "4-so-4", "concept": "set-ops", "type": "calc", "prompt": "프로젝트에서 일하기는 하지만 부양가족은 없는 사원의 Ssn을 EXCEPT로 검색하시오.", "answer": "( SELECT Essn FROM WORKS_ON )\nEXCEPT\n( SELECT Essn FROM DEPENDENT );\n\n-- 교재 COMPANY 상태에서 실행 결과 (5행)\nEssn\n453453453\n666884444\n888665555\n987987987\n999887777", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["WORKS_ON.Essn", "EXCEPT", "DEPENDENT.Essn"], "lesson": "L4-5", "unit": "U4", "prompt_en": "Using EXCEPT, retrieve the Ssn of employees who work on a project but have no dependents.", "answer_en": "( SELECT Essn FROM WORKS_ON )\nEXCEPT\n( SELECT Essn FROM DEPENDENT );\n\n-- Result on the textbook COMPANY state (5 rows)\nEssn\n453453453\n666884444\n888665555\n987987987\n999887777"}, {"id": "4-so-5", "concept": "set-ops", "type": "ox", "prompt": "SELECT Ssn FROM EMPLOYEE UNION SELECT Dname FROM DEPARTMENT; 는 타입 호환이 아니라서 의미상 잘못된 질의이다.", "answer": true, "explain": "대응 속성의 도메인이 다르다 (사원 번호 vs 부서 이름).", "lesson": "L4-5", "unit": "U4", "prompt_en": "SELECT Ssn FROM EMPLOYEE UNION SELECT Dname FROM DEPARTMENT; is semantically wrong because the relations are not type compatible.", "explain_en": "The corresponding attributes have different domains (employee number vs department name)."}, {"id": "4-ob-1", "concept": "order-arith", "type": "calc", "prompt": "사원과 그가 일하는 프로젝트 목록을 부서 이름 순, 같은 부서 안에서는 성·이름 순으로 정렬해 검색하시오 (부서 이름, 성, 이름, 프로젝트 이름).", "answer": "SELECT   D.Dname, E.Lname, E.Fname, P.Pname\nFROM     DEPARTMENT AS D, EMPLOYEE AS E, WORKS_ON AS W, PROJECT AS P\nWHERE    D.Dnumber = E.Dno AND E.Ssn = W.Essn AND W.Pno = P.Pnumber\nORDER BY D.Dname, E.Lname, E.Fname;\n\n-- 교재 COMPANY 상태에서 실행 결과 (16행)\nDname | Lname | Fname | Pname\nAdministration | Jabbar | Ahmad | Computerization\nAdministration | Jabbar | Ahmad | Newbenefits\nAdministration | Wallace | Jennifer | Reorganization\nAdministration | Wallace | Jennifer | Newbenefits\nAdministration | Zelaya | Alicia | Computerization\nAdministration | Zelaya | Alicia | Newbenefits\nHeadquarters | Borg | James | Reorganization\nResearch | English | Joyce | ProductX\nResearch | English | Joyce | ProductY\nResearch | Narayan | Ramesh | ProductZ\nResearch | Smith | John | ProductX\nResearch | Smith | John | ProductY\nResearch | Wong | Franklin | ProductY\nResearch | Wong | Franklin | ProductZ\nResearch | Wong | Franklin | Computerization\nResearch | Wong | Franklin | Reorganization", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["네 테이블 조인 조건 3개", "ORDER BY D.Dname, E.Lname, E.Fname"], "slot": 12, "pts": 10, "lesson": "L4-5", "unit": "U4", "prompt_en": "Retrieve a list of employees and the projects they work on, ordered by department name and, within each department, by last name and then first name (department name, last name, first name, project name).", "answer_en": "SELECT   D.Dname, E.Lname, E.Fname, P.Pname\nFROM     DEPARTMENT AS D, EMPLOYEE AS E, WORKS_ON AS W, PROJECT AS P\nWHERE    D.Dnumber = E.Dno AND E.Ssn = W.Essn AND W.Pno = P.Pnumber\nORDER BY D.Dname, E.Lname, E.Fname;\n\n-- Result on the textbook COMPANY state (16 rows)\nDname | Lname | Fname | Pname\nAdministration | Jabbar | Ahmad | Computerization\nAdministration | Jabbar | Ahmad | Newbenefits\nAdministration | Wallace | Jennifer | Reorganization\nAdministration | Wallace | Jennifer | Newbenefits\nAdministration | Zelaya | Alicia | Computerization\nAdministration | Zelaya | Alicia | Newbenefits\nHeadquarters | Borg | James | Reorganization\nResearch | English | Joyce | ProductX\nResearch | English | Joyce | ProductY\nResearch | Narayan | Ramesh | ProductZ\nResearch | Smith | John | ProductX\nResearch | Smith | John | ProductY\nResearch | Wong | Franklin | ProductY\nResearch | Wong | Franklin | ProductZ\nResearch | Wong | Franklin | Computerization\nResearch | Wong | Franklin | Reorganization", "keys_en": ["3 join conditions for the four tables", "ORDER BY D.Dname, E.Lname, E.Fname"]}, {"id": "4-ob-2", "concept": "order-arith", "type": "calc", "prompt": "'ProductX'에서 일하는 사원 모두에게 10% 인상을 해주면 급여가 얼마가 되는지 이름과 함께 보이시오 (릴레이션은 바꾸지 말 것).", "answer": "SELECT E.Fname, E.Lname, 1.1 * E.Salary AS Increased_sal\nFROM   EMPLOYEE AS E, WORKS_ON AS W, PROJECT AS P\nWHERE  E.Ssn = W.Essn AND W.Pno = P.Pnumber AND P.Pname = 'ProductX';\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nFname | Lname | Increased_sal\nJohn | Smith | 33000\nJoyce | English | 27500", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["1.1 * Salary (AS 별칭)", "조인 조건 2개 + Pname 조건", "UPDATE가 아니라 SELECT"], "lesson": "L4-5", "unit": "U4", "prompt_en": "Show the resulting salaries, with names, if every employee who works on 'ProductX' is given a 10% raise (do not change the relation).", "answer_en": "SELECT E.Fname, E.Lname, 1.1 * E.Salary AS Increased_sal\nFROM   EMPLOYEE AS E, WORKS_ON AS W, PROJECT AS P\nWHERE  E.Ssn = W.Essn AND W.Pno = P.Pnumber AND P.Pname = 'ProductX';\n\n-- Result on the textbook COMPANY state (2 rows)\nFname | Lname | Increased_sal\nJohn | Smith | 33000\nJoyce | English | 27500", "keys_en": ["1.1 * Salary (AS alias)", "2 join conditions + Pname condition", "SELECT, not UPDATE"]}, {"id": "4-ob-3", "concept": "order-arith", "type": "calc", "prompt": "5번 부서에서 급여가 30000 이상 40000 이하인 사원을 BETWEEN으로 검색하시오.", "answer": "SELECT *\nFROM   EMPLOYEE\nWHERE  (Salary BETWEEN 30000 AND 40000) AND Dno = 5;\n\n-- 교재 COMPANY 상태에서 실행 결과 (3행)\nFname | Minit | Lname | Ssn | Bdate | Address | Sex | Salary | Super_ssn | Dno\nJohn | B | Smith | 123456789 | 1965-01-09 | 731 Fondren, Houston, TX | M | 30000 | 333445555 | 5\nFranklin | T | Wong | 333445555 | 1955-12-08 | 638 Voss, Houston, TX | M | 40000 | 888665555 | 5\nRamesh | K | Narayan | 666884444 | 1962-09-15 | 975 Fire Oak, Humble, TX | M | 38000 | 333445555 | 5", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["BETWEEN 30000 AND 40000 (양 끝 포함)", "AND Dno = 5"], "lesson": "L4-5", "unit": "U4", "prompt_en": "Using BETWEEN, retrieve the employees in department 5 whose salary is between 30000 and 40000 inclusive.", "answer_en": "SELECT *\nFROM   EMPLOYEE\nWHERE  (Salary BETWEEN 30000 AND 40000) AND Dno = 5;\n\n-- Result on the textbook COMPANY state (3 rows)\nFname | Minit | Lname | Ssn | Bdate | Address | Sex | Salary | Super_ssn | Dno\nJohn | B | Smith | 123456789 | 1965-01-09 | 731 Fondren, Houston, TX | M | 30000 | 333445555 | 5\nFranklin | T | Wong | 333445555 | 1955-12-08 | 638 Voss, Houston, TX | M | 40000 | 888665555 | 5\nRamesh | K | Narayan | 666884444 | 1962-09-15 | 975 Fire Oak, Humble, TX | M | 38000 | 333445555 | 5", "keys_en": ["BETWEEN 30000 AND 40000 (both ends inclusive)", "AND Dno = 5"]}, {"id": "4-ob-4", "concept": "order-arith", "type": "mc", "prompt": "ORDER BY의 기본 정렬 순서는?", "choices": ["오름차순 (ASC)", "내림차순 (DESC)", "삽입 순서", "PK 순서"], "answer": 0, "lesson": "L4-5", "unit": "U4", "prompt_en": "What is the default sort order of ORDER BY?", "choices_en": ["Ascending (ASC)", "Descending (DESC)", "Insertion order", "PK order"]}, {"id": "4-ob-5", "concept": "order-arith", "type": "ox", "prompt": "SELECT 절에서 1.1 * Salary를 쓰면 EMPLOYEE 릴레이션의 Salary 값도 바뀐다.", "answer": false, "explain": "결과에만 반영되고 릴레이션 상태는 그대로. 바꾸려면 UPDATE.", "lesson": "L4-5", "unit": "U4", "prompt_en": "Writing 1.1 * Salary in the SELECT clause also changes the Salary values in the EMPLOYEE relation.", "explain_en": "It is reflected only in the result; the relation state stays the same. To change it, use UPDATE."}, {"id": "4-ob-6", "concept": "order-arith", "type": "calc", "prompt": "급여가 가장 높은 사원부터 차례로 이름과 급여를 검색하시오. 급여가 같으면 성의 알파벳 순.", "answer": "SELECT   Fname, Lname, Salary\nFROM     EMPLOYEE\nORDER BY Salary DESC, Lname ASC;\n\n-- 교재 COMPANY 상태에서 실행 결과 (8행)\nFname | Lname | Salary\nJames | Borg | 55000\nJennifer | Wallace | 43000\nFranklin | Wong | 40000\nRamesh | Narayan | 38000\nJohn | Smith | 30000\nJoyce | English | 25000\nAhmad | Jabbar | 25000\nAlicia | Zelaya | 25000", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["ORDER BY Salary DESC", "두 번째 기준 Lname ASC"], "lesson": "L4-5", "unit": "U4", "prompt_en": "Retrieve the names and salaries of employees, from the highest salary down. If salaries are equal, order by last name alphabetically.", "answer_en": "SELECT   Fname, Lname, Salary\nFROM     EMPLOYEE\nORDER BY Salary DESC, Lname ASC;\n\n-- Result on the textbook COMPANY state (8 rows)\nFname | Lname | Salary\nJames | Borg | 55000\nJennifer | Wallace | 43000\nFranklin | Wong | 40000\nRamesh | Narayan | 38000\nJohn | Smith | 30000\nJoyce | English | 25000\nAhmad | Jabbar | 25000\nAlicia | Zelaya | 25000", "keys_en": ["ORDER BY Salary DESC", "Second key Lname ASC"]}, {"id": "5-in-1", "concept": "nested-in", "type": "mc", "prompt": "중첩 질의(nested query)에 대한 설명으로 옳은 것은?", "choices": ["FROM 절에만 올 수 있다", "다른 질의의 WHERE 절 안에 들어간 완전한 SELECT-FROM-WHERE 블록이다", "결과는 항상 값 하나다", "SQL에서는 지원하지 않는다"], "answer": 1, "lesson": "L5-1", "unit": "U5", "prompt_en": "Which statement about a nested query (a query inside another query) is correct?", "choices_en": ["They can appear only in the FROM clause", "A nested query is a complete SELECT-FROM-WHERE block within the WHERE clause of another query", "The result is always a single value", "SQL does not support them"]}, {"id": "5-in-2", "concept": "nested-in", "type": "mc", "prompt": "v IN V 가 TRUE가 되는 경우는?", "choices": ["v가 V의 원소 중 하나일 때", "v가 V의 모든 원소와 같을 때", "V가 비어 있을 때", "v가 V의 최댓값보다 클 때"], "answer": 0, "lesson": "L5-1", "unit": "U5", "prompt_en": "When is v IN V TRUE?", "choices_en": ["When v is one of the elements in V", "When v equals every element in V", "When V is empty", "When v is greater than the maximum of V"]}, {"id": "5-in-3", "concept": "nested-in", "type": "ox", "prompt": "= ANY는 IN과 같은 뜻이다.", "answer": true, "lesson": "L5-1", "unit": "U5", "prompt_en": "= ANY means the same as IN."}, {"id": "5-in-4", "concept": "nested-in", "type": "calc", "prompt": "'Research' 부서에서 일하는 사원의 이름을 중첩 질의(IN)로 검색하시오.", "answer": "SELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  Dno IN ( SELECT Dnumber\n               FROM   DEPARTMENT\n               WHERE  Dname = 'Research' );\n\n-- 교재 COMPANY 상태에서 실행 결과 (4행)\nFname | Lname\nJohn | Smith\nFranklin | Wong\nRamesh | Narayan\nJoyce | English", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["바깥 EMPLOYEE", "Dno IN (안쪽 질의)", "안쪽: Dname = 'Research'인 Dnumber"], "lesson": "L5-1", "unit": "U5", "prompt_en": "Using a nested query (IN), retrieve the names of employees who work for the 'Research' department.", "answer_en": "SELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  Dno IN ( SELECT Dnumber\n               FROM   DEPARTMENT\n               WHERE  Dname = 'Research' );\n\n-- Result on the textbook COMPANY state (4 rows)\nFname | Lname\nJohn | Smith\nFranklin | Wong\nRamesh | Narayan\nJoyce | English", "keys_en": ["Outer EMPLOYEE", "Dno IN (inner query)", "Inner: Dnumber where Dname = 'Research'"]}, {"id": "5-in-5", "concept": "nested-in", "type": "calc", "prompt": "성이 'Smith'인 사원이 일꾼으로 일하거나 관리자로 있는 부서가 통제하는 프로젝트의 번호를 IN 두 개와 OR로 검색하시오.", "answer": "SELECT DISTINCT Pnumber\nFROM   PROJECT\nWHERE  Pnumber IN ( SELECT Pnumber\n                    FROM   PROJECT, DEPARTMENT, EMPLOYEE\n                    WHERE  Dnum = Dnumber AND Mgr_ssn = Ssn AND Lname = 'Smith' )\n   OR  Pnumber IN ( SELECT Pno\n                    FROM   WORKS_ON, EMPLOYEE\n                    WHERE  Essn = Ssn AND Lname = 'Smith' );\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nPnumber\n1\n2", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["IN (관리자 블록)", "OR", "IN (일꾼 블록)"], "lesson": "L5-1", "unit": "U5", "prompt_en": "Using two INs and OR, retrieve the numbers of projects that involve an employee whose last name is 'Smith', either as a worker or as a manager of the department that controls the project.", "answer_en": "SELECT DISTINCT Pnumber\nFROM   PROJECT\nWHERE  Pnumber IN ( SELECT Pnumber\n                    FROM   PROJECT, DEPARTMENT, EMPLOYEE\n                    WHERE  Dnum = Dnumber AND Mgr_ssn = Ssn AND Lname = 'Smith' )\n   OR  Pnumber IN ( SELECT Pno\n                    FROM   WORKS_ON, EMPLOYEE\n                    WHERE  Essn = Ssn AND Lname = 'Smith' );\n\n-- Result on the textbook COMPANY state (2 rows)\nPnumber\n1\n2", "keys_en": ["IN (manager block)", "OR", "IN (worker block)"]}, {"id": "5-in-6", "concept": "nested-in", "type": "calc", "prompt": "'Houston'에 위치한 프로젝트 중 하나라도 일하는 사원의 Ssn과 이름을 중첩 질의로 검색하시오.", "answer": "SELECT Ssn, Fname, Lname\nFROM   EMPLOYEE\nWHERE  Ssn IN ( SELECT W.Essn\n                FROM   WORKS_ON AS W, PROJECT AS P\n                WHERE  W.Pno = P.Pnumber AND P.Plocation = 'Houston' );\n\n-- 교재 COMPANY 상태에서 실행 결과 (4행)\nSsn | Fname | Lname\n333445555 | Franklin | Wong\n666884444 | Ramesh | Narayan\n888665555 | James | Borg\n987654321 | Jennifer | Wallace", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["Ssn IN (안쪽)", "안쪽: WORKS_ON–PROJECT 조인", "Plocation = 'Houston'"], "lesson": "L5-1", "unit": "U5", "prompt_en": "Using a nested query, retrieve the Ssn and name of employees who work on at least one project located in 'Houston'.", "answer_en": "SELECT Ssn, Fname, Lname\nFROM   EMPLOYEE\nWHERE  Ssn IN ( SELECT W.Essn\n                FROM   WORKS_ON AS W, PROJECT AS P\n                WHERE  W.Pno = P.Pnumber AND P.Plocation = 'Houston' );\n\n-- Result on the textbook COMPANY state (4 rows)\nSsn | Fname | Lname\n333445555 | Franklin | Wong\n666884444 | Ramesh | Narayan\n888665555 | James | Borg\n987654321 | Jennifer | Wallace", "keys_en": ["Ssn IN (inner)", "Inner: WORKS_ON–PROJECT join", "Plocation = 'Houston'"]}, {"id": "5-in-7", "concept": "nested-in", "type": "calc", "prompt": "급여가 가장 높은 사원이 일하는 부서의 모든 사원 이름을 검색하시오. (db-exercises Q1)", "answer": "SELECT Fname, Minit, Lname\nFROM   EMPLOYEE\nWHERE  Dno = ( SELECT Dno\n               FROM   EMPLOYEE\n               WHERE  Salary = ( SELECT MAX(Salary)\n                                 FROM   EMPLOYEE ) );\n\n-- 교재 COMPANY 상태에서 실행 결과 (1행)\nFname | Minit | Lname\nJames | E | Borg", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["가장 안쪽: MAX(Salary)", "그 급여를 받는 사원의 Dno", "그 Dno의 사원들"], "lesson": "L5-1", "unit": "U5", "prompt_en": "Retrieve the names of all employees in the department of the employee with the highest salary. (db-exercises Q1)", "answer_en": "SELECT Fname, Minit, Lname\nFROM   EMPLOYEE\nWHERE  Dno = ( SELECT Dno\n               FROM   EMPLOYEE\n               WHERE  Salary = ( SELECT MAX(Salary)\n                                 FROM   EMPLOYEE ) );\n\n-- Result on the textbook COMPANY state (1 row)\nFname | Minit | Lname\nJames | E | Borg", "keys_en": ["Innermost: MAX(Salary)", "Dno of the employee who earns that salary", "The employees in that Dno"]}, {"id": "5-in-8", "concept": "nested-in", "type": "calc", "prompt": "상사의 상사의 Ssn이 '888665555'인 사원의 이름을 검색하시오. (db-exercises Q2)", "answer": "SELECT Fname, Minit, Lname\nFROM   EMPLOYEE\nWHERE  Super_ssn IN ( SELECT Ssn\n                      FROM   EMPLOYEE\n                      WHERE  Super_ssn = '888665555' );\n\n-- 교재 COMPANY 상태에서 실행 결과 (5행)\nFname | Minit | Lname\nJohn | B | Smith\nAlicia | J | Zelaya\nRamesh | K | Narayan\nJoyce | A | English\nAhmad | V | Jabbar\n\n교안 풀이는 = 로 썼지만 안쪽 결과가 두 명(Wong, Wallace)이라 IN이 맞다.", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["안쪽: Super_ssn = '888665555'인 사원들 (Wong, Wallace)", "바깥: 그들을 상사로 둔 사원"], "lesson": "L5-1", "unit": "U5", "prompt_en": "Retrieve the names of employees whose supervisor's supervisor has Ssn '888665555'. (db-exercises Q2)", "answer_en": "SELECT Fname, Minit, Lname\nFROM   EMPLOYEE\nWHERE  Super_ssn IN ( SELECT Ssn\n                      FROM   EMPLOYEE\n                      WHERE  Super_ssn = '888665555' );\n\n-- Result on the textbook COMPANY state (5 rows)\nFname | Minit | Lname\nJohn | B | Smith\nAlicia | J | Zelaya\nRamesh | K | Narayan\nJoyce | A | English\nAhmad | V | Jabbar\n\nThe slide solution uses =, but the inner result has two employees (Wong, Wallace), so IN is correct.", "keys_en": ["Inner: employees with Super_ssn = '888665555' (Wong, Wallace)", "Outer: employees whose supervisor is one of them"]}, {"id": "5-aa-1", "concept": "all-any", "type": "mc", "prompt": "Salary > ALL (SELECT Salary FROM EMPLOYEE WHERE Dno = 5) 와 같은 뜻인 조건은?", "choices": ["Salary > (SELECT MIN(Salary) FROM EMPLOYEE WHERE Dno = 5)", "Salary > (SELECT AVG(Salary) FROM EMPLOYEE WHERE Dno = 5)", "Salary > (SELECT MAX(Salary) FROM EMPLOYEE WHERE Dno = 5)", "Salary IN (SELECT Salary FROM EMPLOYEE WHERE Dno = 5)"], "answer": 2, "lesson": "L5-1", "unit": "U5", "prompt_en": "Which condition means the same as Salary > ALL (SELECT Salary FROM EMPLOYEE WHERE Dno = 5)?"}, {"id": "5-aa-2", "concept": "all-any", "type": "mc", "prompt": "Salary > ANY (SELECT Salary FROM EMPLOYEE WHERE Dno = 5) 가 참이 되는 조건은? (5번 부서 급여 = 30000, 40000, 38000, 25000)", "choices": ["Salary > 25000", "Salary > 40000", "Salary > 33250", "Salary = 30000"], "answer": 0, "lesson": "L5-1", "unit": "U5", "prompt_en": "When is Salary > ANY (SELECT Salary FROM EMPLOYEE WHERE Dno = 5) true? (Department 5 salaries = 30000, 40000, 38000, 25000)"}, {"id": "5-aa-3", "concept": "all-any", "type": "calc", "prompt": "5번 부서 모든 사원보다 급여가 많은 사원의 이름을 ALL로 검색하시오.", "answer": "SELECT Lname, Fname\nFROM   EMPLOYEE\nWHERE  Salary > ALL ( SELECT Salary\n                      FROM   EMPLOYEE\n                      WHERE  Dno = 5 );\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nLname | Fname\nWallace | Jennifer\nBorg | James\n\nSQLite에는 ALL이 없어서 검산은 > (SELECT MAX(...))로 돌렸다.", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["Salary > ALL", "안쪽: Dno = 5인 급여"], "lesson": "L5-1", "unit": "U5", "prompt_en": "Using ALL, retrieve the names of employees whose salary is greater than the salary of all employees in department 5.", "answer_en": "SELECT Lname, Fname\nFROM   EMPLOYEE\nWHERE  Salary > ALL ( SELECT Salary\n                      FROM   EMPLOYEE\n                      WHERE  Dno = 5 );\n\n-- Result on the textbook COMPANY state (2 rows)\nLname | Fname\nWallace | Jennifer\nBorg | James\n\nSQLite has no ALL, so the check was run with > (SELECT MAX(...)).", "keys_en": ["Salary > ALL", "Inner: salaries where Dno = 5"]}, {"id": "5-aa-4", "concept": "all-any", "type": "ox", "prompt": "실습 환경의 SQLite는 ALL과 ANY를 지원하지 않는다.", "answer": true, "lesson": "L5-1", "unit": "U5", "prompt_en": "The lab's SQLite does not support ALL and ANY."}, {"id": "5-aa-5", "concept": "all-any", "type": "calc", "prompt": "4번 부서의 어떤 사원보다라도 급여가 많은 5번 부서 사원의 이름과 급여를 ANY로 검색하시오.", "answer": "SELECT Fname, Lname, Salary\nFROM   EMPLOYEE\nWHERE  Dno = 5\n  AND  Salary > ANY ( SELECT Salary FROM EMPLOYEE WHERE Dno = 4 );\n\n-- 교재 COMPANY 상태에서 실행 결과 (3행)\nFname | Lname | Salary\nJohn | Smith | 30000\nFranklin | Wong | 40000\nRamesh | Narayan | 38000\n\n> ANY = 최솟값(25000)보다 크면 참. SQLite 검산은 > (SELECT MIN(...)).", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["Dno = 5", "Salary > ANY (4번 부서 급여)"], "lesson": "L5-1", "unit": "U5", "prompt_en": "Using ANY, retrieve the names and salaries of employees in department 5 whose salary is greater than that of at least one employee in department 4.", "answer_en": "SELECT Fname, Lname, Salary\nFROM   EMPLOYEE\nWHERE  Dno = 5\n  AND  Salary > ANY ( SELECT Salary FROM EMPLOYEE WHERE Dno = 4 );\n\n-- Result on the textbook COMPANY state (3 rows)\nFname | Lname | Salary\nJohn | Smith | 30000\nFranklin | Wong | 40000\nRamesh | Narayan | 38000\n\n> ANY = true if greater than the minimum (25000). The SQLite check uses > (SELECT MIN(...)).", "keys_en": ["Dno = 5", "Salary > ANY (department 4 salaries)"]}, {"id": "5-aa-6", "concept": "all-any", "type": "blank", "prompt": "v > ALL V 는 v가 V의 (a) 보다 클 때, v > ANY V 는 v가 V의 (b) 보다 클 때 참이다.", "answer": "(a) 최댓값 / (b) 최솟값", "accept": [["최댓값", "최대", "max", "최대값", "maximum", "MAX(V)"], ["최솟값", "최소", "min", "최소값", "minimum", "MIN(V)"]], "lesson": "L5-1", "unit": "U5", "prompt_en": "v > ALL V is true when v is greater than the (a) of V, and v > ANY V is true when v is greater than the (b) of V.", "answer_en": "(a) maximum / (b) minimum"}, {"id": "5-co-1", "concept": "correlated", "type": "mc", "prompt": "상관 중첩 질의(correlated nested query)란?", "choices": ["안쪽 질의가 바깥과 무관하게 한 번만 평가되는 질의", "안쪽 질의가 바깥 질의의 속성(별칭)을 참조하는 질의", "FROM 절에 있는 질의", "UNION으로 연결된 질의"], "answer": 1, "lesson": "L5-1", "unit": "U5", "prompt_en": "What is a correlated nested query (correlated query)?", "choices_en": ["A query whose inner query is evaluated only once, independently of the outer query", "A query whose inner query references an attribute (alias) of the outer query", "A query in the FROM clause", "Queries connected by UNION"]}, {"id": "5-co-2", "concept": "correlated", "type": "ox", "prompt": "중첩 질의에서 안쪽에서 자격 없이 쓴 속성 이름은 가장 가까운(안쪽) FROM의 테이블 속성으로 해석된다.", "answer": true, "lesson": "L5-1", "unit": "U5", "prompt_en": "In a nested query, an unqualified attribute name used in the inner query refers to the attribute of the table in the nearest (innermost) FROM."}, {"id": "5-co-3", "concept": "correlated", "type": "short", "prompt": "중첩 질의에서 모호성이 생기는 경우와 해결 방법을 쓰시오.", "answer": "바깥 질의의 FROM과 안쪽 질의의 FROM에 같은 이름의 속성이 있으면 어느 테이블의 속성인지 모호해진다. 해결: 테이블마다 별칭(투플 변수)을 붙이고 E.Sex, D.Sex처럼 자격을 부여한다. 질의에 쓰는 모든 테이블에 별칭을 붙이는 것이 권장된다.", "keys": ["바깥·안쪽에 같은 이름 속성", "별칭으로 자격 부여", "모든 테이블에 별칭 권장"], "lesson": "L5-1", "unit": "U5", "prompt_en": "Explain when ambiguity arises in nested queries and how to resolve it.", "answer_en": "If the outer query's FROM and the inner query's FROM have attributes with the same name, it is ambiguous which table's attribute is meant. Solution: give each table an alias (tuple variable) and qualify attributes, as in E.Sex and D.Sex. It is advisable to create aliases for all the tables referenced in a query.", "keys_en": ["Same-named attributes in the outer and inner queries", "Qualify with aliases", "Aliases recommended for all tables"]}, {"id": "5-co-4", "concept": "correlated", "type": "calc", "prompt": "부양가족 중에 사원 자신과 이름(first name)과 성별이 같은 사람이 있는 사원의 이름을 검색하시오. (질의 16)", "answer": "SELECT E.Fname, E.Lname\nFROM   EMPLOYEE AS E\nWHERE  E.Ssn IN ( SELECT D.Essn\n                  FROM   DEPENDENT AS D\n                  WHERE  E.Fname = D.Dependent_name\n                    AND  E.Sex = D.Sex );\n\n-- 교재 COMPANY 상태에서 실행 결과 (0행)\nFname | Lname\n\nCOMPANY 상태에는 그런 부양가족이 없어 결과는 비어 있다.", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["안쪽이 바깥 E를 참조 (상관)", "E.Fname = D.Dependent_name", "E.Sex = D.Sex"], "lesson": "L5-1", "unit": "U5", "prompt_en": "Retrieve the name of each employee who has a dependent with the same name (first name) and the same sex as the employee. (Query 16)", "answer_en": "SELECT E.Fname, E.Lname\nFROM   EMPLOYEE AS E\nWHERE  E.Ssn IN ( SELECT D.Essn\n                  FROM   DEPENDENT AS D\n                  WHERE  E.Fname = D.Dependent_name\n                    AND  E.Sex = D.Sex );\n\n-- Result on the textbook COMPANY state (0 rows)\nFname | Lname\n\nThere is no such dependent in the COMPANY state, so the result is empty.", "keys_en": ["Inner query references the outer E (correlated)", "E.Fname = D.Dependent_name", "E.Sex = D.Sex"]}, {"id": "5-co-5", "concept": "correlated", "type": "calc", "prompt": "자기 부서의 평균 급여보다 급여가 많은 사원의 이름, 부서 번호, 급여를 상관 중첩 질의로 검색하시오.", "answer": "SELECT E.Fname, E.Lname, E.Dno, E.Salary\nFROM   EMPLOYEE AS E\nWHERE  E.Salary > ( SELECT AVG(E2.Salary)\n                    FROM   EMPLOYEE AS E2\n                    WHERE  E2.Dno = E.Dno );\n\n-- 교재 COMPANY 상태에서 실행 결과 (3행)\nFname | Lname | Dno | Salary\nFranklin | Wong | 5 | 40000\nJennifer | Wallace | 4 | 43000\nRamesh | Narayan | 5 | 38000", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["별칭 두 개 (E, E2)", "안쪽 E2.Dno = E.Dno (상관)", "AVG와 비교"], "lesson": "L5-1", "unit": "U5", "prompt_en": "Using a correlated nested query, retrieve the name, department number and salary of employees whose salary is greater than the average salary of their own department.", "answer_en": "SELECT E.Fname, E.Lname, E.Dno, E.Salary\nFROM   EMPLOYEE AS E\nWHERE  E.Salary > ( SELECT AVG(E2.Salary)\n                    FROM   EMPLOYEE AS E2\n                    WHERE  E2.Dno = E.Dno );\n\n-- Result on the textbook COMPANY state (3 rows)\nFname | Lname | Dno | Salary\nFranklin | Wong | 5 | 40000\nJennifer | Wallace | 4 | 43000\nRamesh | Narayan | 5 | 38000", "keys_en": ["Two aliases (E, E2)", "Inner E2.Dno = E.Dno (correlated)", "Compare with AVG"]}, {"id": "5-ex-1", "concept": "exists", "type": "mc", "prompt": "NOT EXISTS (Q) 가 TRUE인 경우는?", "choices": ["Q 결과에 투플이 하나라도 있을 때", "Q 결과가 NULL을 포함할 때", "Q 결과가 비어 있을 때", "Q가 집계 함수를 쓸 때"], "answer": 2, "lesson": "L5-2", "unit": "U5", "prompt_en": "When is NOT EXISTS (Q) TRUE?", "choices_en": ["When the result of Q has at least one tuple", "When the result of Q contains NULL", "When the result of Q is empty", "When Q uses an aggregate function"]}, {"id": "5-ex-2", "concept": "exists", "type": "ox", "prompt": "EXISTS는 안쪽 질의 결과의 값이 무엇인지가 아니라 결과가 비었는지만 본다.", "answer": true, "lesson": "L5-2", "unit": "U5", "prompt_en": "EXISTS checks only whether the result of the inner query is empty, not what values it contains."}, {"id": "5-ex-3", "concept": "exists", "type": "calc", "prompt": "부양가족이 없는 사원의 이름을 NOT EXISTS로 검색하시오. (질의 6)", "answer": "SELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  NOT EXISTS ( SELECT *\n                    FROM   DEPENDENT\n                    WHERE  Ssn = Essn );\n\n-- 교재 COMPANY 상태에서 실행 결과 (5행)\nFname | Lname\nAlicia | Zelaya\nRamesh | Narayan\nJoyce | English\nAhmad | Jabbar\nJames | Borg", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["NOT EXISTS", "안쪽: DEPENDENT WHERE Ssn = Essn (상관)"], "slot": 13, "pts": 10, "lesson": "L5-2", "unit": "U5", "prompt_en": "Using NOT EXISTS, retrieve the names of employees who have no dependents. (Query 6)", "answer_en": "SELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  NOT EXISTS ( SELECT *\n                    FROM   DEPENDENT\n                    WHERE  Ssn = Essn );\n\n-- Result on the textbook COMPANY state (5 rows)\nFname | Lname\nAlicia | Zelaya\nRamesh | Narayan\nJoyce | English\nAhmad | Jabbar\nJames | Borg", "keys_en": ["NOT EXISTS", "Inner: DEPENDENT WHERE Ssn = Essn (correlated)"]}, {"id": "5-ex-4", "concept": "exists", "type": "calc", "prompt": "부양가족이 하나 이상 있는 관리자의 이름을 EXISTS로 검색하시오.", "answer": "SELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  EXISTS ( SELECT * FROM DEPENDENT  WHERE Ssn = Essn )\n  AND  EXISTS ( SELECT * FROM DEPARTMENT WHERE Ssn = Mgr_ssn );\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nFname | Lname\nFranklin | Wong\nJennifer | Wallace", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["EXISTS (부양가족)", "AND", "EXISTS (관리하는 부서)"], "slot": 13, "pts": 10, "lesson": "L5-2", "unit": "U5", "prompt_en": "Using EXISTS, retrieve the names of managers who have at least one dependent.", "answer_en": "SELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  EXISTS ( SELECT * FROM DEPENDENT  WHERE Ssn = Essn )\n  AND  EXISTS ( SELECT * FROM DEPARTMENT WHERE Ssn = Mgr_ssn );\n\n-- Result on the textbook COMPANY state (2 rows)\nFname | Lname\nFranklin | Wong\nJennifer | Wallace", "keys_en": ["EXISTS (dependents)", "AND", "EXISTS (managed department)"]}, {"id": "5-ex-5", "concept": "exists", "type": "calc", "prompt": "어떤 프로젝트에서도 일하지 않는 부서 관리자가 있다면 그 관리자의 이름을 검색하시오.", "answer": "SELECT E.Fname, E.Lname\nFROM   EMPLOYEE AS E\nWHERE  EXISTS ( SELECT * FROM DEPARTMENT AS D WHERE D.Mgr_ssn = E.Ssn )\n  AND  NOT EXISTS ( SELECT * FROM WORKS_ON AS W WHERE W.Essn = E.Ssn );\n\n-- 교재 COMPANY 상태에서 실행 결과 (0행)\nFname | Lname\n\n관리자 셋(Wong, Wallace, Borg) 모두 WORKS_ON에 있다 (Borg는 Hours가 NULL인 투플). 결과 0행.", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["EXISTS (관리자)", "NOT EXISTS (WORKS_ON)"], "lesson": "L5-2", "unit": "U5", "prompt_en": "Retrieve the names of department managers who do not work on any project, if there are any.", "answer_en": "SELECT E.Fname, E.Lname\nFROM   EMPLOYEE AS E\nWHERE  EXISTS ( SELECT * FROM DEPARTMENT AS D WHERE D.Mgr_ssn = E.Ssn )\n  AND  NOT EXISTS ( SELECT * FROM WORKS_ON AS W WHERE W.Essn = E.Ssn );\n\n-- Result on the textbook COMPANY state (0 rows)\nFname | Lname\n\nAll three managers (Wong, Wallace, Borg) appear in WORKS_ON (Borg's tuple has Hours = NULL). Result: 0 rows.", "keys_en": ["EXISTS (manager)", "NOT EXISTS (WORKS_ON)"]}, {"id": "5-ex-6", "concept": "exists", "type": "calc", "prompt": "직접 감독하는 부하가 한 명이라도 있는 사원의 이름을 EXISTS로 검색하시오.", "answer": "SELECT S.Fname, S.Lname\nFROM   EMPLOYEE AS S\nWHERE  EXISTS ( SELECT *\n                FROM   EMPLOYEE AS E\n                WHERE  E.Super_ssn = S.Ssn );\n\n-- 교재 COMPANY 상태에서 실행 결과 (3행)\nFname | Lname\nFranklin | Wong\nJennifer | Wallace\nJames | Borg", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["EXISTS", "E.Super_ssn = S.Ssn (별칭 둘)"], "lesson": "L5-2", "unit": "U5", "prompt_en": "Using EXISTS, retrieve the names of employees who directly supervise at least one employee.", "answer_en": "SELECT S.Fname, S.Lname\nFROM   EMPLOYEE AS S\nWHERE  EXISTS ( SELECT *\n                FROM   EMPLOYEE AS E\n                WHERE  E.Super_ssn = S.Ssn );\n\n-- Result on the textbook COMPANY state (3 rows)\nFname | Lname\nFranklin | Wong\nJennifer | Wallace\nJames | Borg", "keys_en": ["EXISTS", "E.Super_ssn = S.Ssn (two aliases)"]}, {"id": "5-ex-7", "concept": "exists", "type": "calc", "prompt": "A 학점이 하나도 없는 학생의 이름과 전공을 검색하시오. (UNIVERSITY, db-exercises Q2-2)", "answer": "SELECT S.Name, S.Major\nFROM   STUDENT AS S\nWHERE  NOT EXISTS ( SELECT *\n                    FROM   GRADE_REPORT AS G\n                    WHERE  G.Student_number = S.Student_number\n                      AND  G.Grade = 'A' );\n\n-- 교재 UNIVERSITY 상태에서 실행 결과 (1행)\nName | Major\nSmith | CS", "code": "STUDENT(Name, Student_number, Class, Major)\nCOURSE(Course_name, Course_number, Credit_hours, Department)\nSECTION(Section_identifier, Course_number, Semester, Year, Instructor)\nGRADE_REPORT(Student_number, Section_identifier, Grade)\nPREREQUISITE(Course_number, Prerequisite_number)", "keys": ["NOT EXISTS", "G.Student_number = S.Student_number", "G.Grade = 'A'"], "lesson": "L5-2", "unit": "U5", "prompt_en": "Retrieve the names and majors of students who do not have any grade of A. (UNIVERSITY, db-exercises Q2-2)", "answer_en": "SELECT S.Name, S.Major\nFROM   STUDENT AS S\nWHERE  NOT EXISTS ( SELECT *\n                    FROM   GRADE_REPORT AS G\n                    WHERE  G.Student_number = S.Student_number\n                      AND  G.Grade = 'A' );\n\n-- Result on the textbook UNIVERSITY state (1 row)\nName | Major\nSmith | CS"}, {"id": "5-ex-8", "concept": "exists", "type": "calc", "prompt": "모든 과목에서 A를 받은(A가 아닌 학점이 없는) 학생의 이름과 전공을 검색하시오. (UNIVERSITY, db-exercises Q2-1)", "answer": "SELECT S.Name, S.Major\nFROM   STUDENT AS S\nWHERE  NOT EXISTS ( SELECT *\n                    FROM   GRADE_REPORT AS G\n                    WHERE  G.Student_number = S.Student_number\n                      AND  G.Grade <> 'A' );\n\n-- 교재 UNIVERSITY 상태에서 실행 결과 (0행)\nName | Major\n\nBrown도 B가 하나 있어서 결과는 비어 있다. (성적이 하나도 없는 학생이 있다면 그 학생도 나온다는 점 주의)", "code": "STUDENT(Name, Student_number, Class, Major)\nCOURSE(Course_name, Course_number, Credit_hours, Department)\nSECTION(Section_identifier, Course_number, Semester, Year, Instructor)\nGRADE_REPORT(Student_number, Section_identifier, Grade)\nPREREQUISITE(Course_number, Prerequisite_number)", "keys": ["NOT EXISTS", "G.Grade <> 'A'"], "lesson": "L5-2", "unit": "U5", "prompt_en": "Retrieve the names and majors of students who got an A in every course (who have no grade other than A). (UNIVERSITY, db-exercises Q2-1)", "answer_en": "SELECT S.Name, S.Major\nFROM   STUDENT AS S\nWHERE  NOT EXISTS ( SELECT *\n                    FROM   GRADE_REPORT AS G\n                    WHERE  G.Student_number = S.Student_number\n                      AND  G.Grade <> 'A' );\n\n-- Result on the textbook UNIVERSITY state (0 rows)\nName | Major\n\nBrown also has one B, so the result is empty. (Note that a student with no grades at all would also appear.)"}, {"id": "5-div-1", "concept": "division-sql", "type": "mc", "prompt": "'5번 부서가 통제하는 모든 프로젝트에서 일하는 사원'을 찾는 SQL 패턴은?", "choices": ["IN", "= ANY", "EXISTS 하나", "NOT EXISTS ((5번 부서 프로젝트) EXCEPT (그 사원의 프로젝트))"], "answer": 3, "lesson": "L5-2", "unit": "U5", "prompt_en": "Which SQL pattern finds 'employees who work on all projects controlled by department 5'?", "choices_en": ["IN", "= ANY", "A single EXISTS", "NOT EXISTS ((dept-5 projects) EXCEPT (that employee's projects))"]}, {"id": "5-div-2", "concept": "division-sql", "type": "short", "prompt": "NOT EXISTS ((SELECT Pnumber FROM PROJECT WHERE Dnum = 5) EXCEPT (SELECT Pno FROM WORKS_ON WHERE Ssn = Essn)) 가 무엇을 확인하는지 설명하시오.", "answer": "첫 집합은 5번 부서가 통제하는 프로젝트 전체, 둘째는 현재 사원이 일하는 프로젝트. 차집합은 5번 부서 프로젝트 중 이 사원이 안 하는 것. 이게 비어 있으면(NOT EXISTS가 참) 사원이 5번 부서 프로젝트를 전부 하고 있다는 뜻이다.", "keys": ["첫 집합 = 5번 부서 프로젝트 전체", "둘째 = 그 사원의 프로젝트", "차집합이 비면 전부 수행"], "lesson": "L5-2", "unit": "U5", "prompt_en": "Explain what NOT EXISTS ((SELECT Pnumber FROM PROJECT WHERE Dnum = 5) EXCEPT (SELECT Pno FROM WORKS_ON WHERE Ssn = Essn)) checks.", "answer_en": "The first set is all projects controlled by department 5; the second is the projects the current employee works on. The difference is the dept-5 projects this employee does not work on. If it is empty (NOT EXISTS is true), the employee works on all dept-5 projects.", "keys_en": ["First set = all dept-5 projects", "Second = that employee's projects", "Empty difference → works on all of them"]}, {"id": "5-div-3", "concept": "division-sql", "type": "calc", "prompt": "5번 부서 프로젝트 = {1, 2, 3}이다. 사원 A는 {1, 2, 4}, B는 {1, 2, 3, 4}, C는 {3}에서 일한다. NOT EXISTS + EXCEPT 나눗셈 질의 결과에 들어가는 사원과 이유를 쓰시오.", "answer": "A: {1,2,3} − {1,2,4} = {3} ≠ ∅ → 탈락\nB: {1,2,3} − {1,2,3,4} = ∅ → 선택\nC: {1,2,3} − {3} = {1,2} ≠ ∅ → 탈락\n결과: B만", "keys": ["A 탈락 ({3})", "B 선택 (∅)", "C 탈락 ({1,2})"], "lesson": "L5-2", "unit": "U5", "prompt_en": "The dept-5 projects are {1, 2, 3}. Employee A works on {1, 2, 4}, B on {1, 2, 3, 4}, and C on {3}. Which employees are in the result of the NOT EXISTS + EXCEPT division query, and why?", "answer_en": "A: {1,2,3} − {1,2,4} = {3} ≠ ∅ → out\nB: {1,2,3} − {1,2,3,4} = ∅ → selected\nC: {1,2,3} − {3} = {1,2} ≠ ∅ → out\nResult: B only", "keys_en": ["A out ({3})", "B selected (∅)", "C out ({1,2})"]}, {"id": "5-div-4", "concept": "division-sql", "type": "calc", "prompt": "5번 부서가 통제하는 모든 프로젝트에서 일하는 사원의 이름을 검색하시오. (교안 연습 1)", "answer": "SELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  NOT EXISTS ( ( SELECT Pnumber FROM PROJECT WHERE Dnum = 5 )\n                    EXCEPT\n                    ( SELECT Pno FROM WORKS_ON WHERE Ssn = Essn ) );\n\n-- 교재 COMPANY 상태에서 실행 결과 (0행)\nFname | Lname\n\nCOMPANY 상태에서는 1, 2, 3을 모두 하는 사원이 없어서 결과가 비어 있다. NOT EXISTS 두 번 방식으로도 같은 결과.", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["NOT EXISTS", "(5번 부서 프로젝트) EXCEPT (그 사원의 프로젝트)", "안쪽 Ssn = Essn (상관)"], "slot": 13, "pts": 10, "lesson": "L5-2", "unit": "U5", "prompt_en": "Retrieve the names of employees who work on all the projects controlled by department 5. (Slide exercise 1)", "answer_en": "SELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  NOT EXISTS ( ( SELECT Pnumber FROM PROJECT WHERE Dnum = 5 )\n                    EXCEPT\n                    ( SELECT Pno FROM WORKS_ON WHERE Ssn = Essn ) );\n\n-- Result on the textbook COMPANY state (0 rows)\nFname | Lname\n\nOn the COMPANY state no employee works on all of 1, 2 and 3, so the result is empty. The double NOT EXISTS version gives the same result.", "keys_en": ["NOT EXISTS", "(dept-5 projects) EXCEPT (that employee's projects)", "Inner Ssn = Essn (correlated)"]}, {"id": "5-div-5", "concept": "division-sql", "type": "calc", "prompt": "'John Smith'가 일하는 모든 프로젝트에서 일하는 사원의 이름을 검색하시오 (Smith 본인 포함).", "answer": "SELECT E.Fname, E.Lname\nFROM   EMPLOYEE AS E\nWHERE  NOT EXISTS ( SELECT W1.Pno\n                    FROM   WORKS_ON AS W1, EMPLOYEE AS S\n                    WHERE  W1.Essn = S.Ssn AND S.Fname = 'John' AND S.Lname = 'Smith'\n                      AND  NOT EXISTS ( SELECT *\n                                        FROM   WORKS_ON AS W2\n                                        WHERE  W2.Essn = E.Ssn AND W2.Pno = W1.Pno ) );\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nFname | Lname\nJohn | Smith\nJoyce | English", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["바깥 NOT EXISTS: Smith의 프로젝트 중", "안쪽 NOT EXISTS: 그 사원이 안 하는 것", "상관 W2.Essn = E.Ssn, W2.Pno = W1.Pno"], "slot": 13, "pts": 10, "lesson": "L5-2", "unit": "U5", "prompt_en": "Retrieve the names of employees who work on all the projects that 'John Smith' works on (including Smith himself).", "answer_en": "SELECT E.Fname, E.Lname\nFROM   EMPLOYEE AS E\nWHERE  NOT EXISTS ( SELECT W1.Pno\n                    FROM   WORKS_ON AS W1, EMPLOYEE AS S\n                    WHERE  W1.Essn = S.Ssn AND S.Fname = 'John' AND S.Lname = 'Smith'\n                      AND  NOT EXISTS ( SELECT *\n                                        FROM   WORKS_ON AS W2\n                                        WHERE  W2.Essn = E.Ssn AND W2.Pno = W1.Pno ) );\n\n-- Result on the textbook COMPANY state (2 rows)\nFname | Lname\nJohn | Smith\nJoyce | English", "keys_en": ["Outer NOT EXISTS: among Smith's projects", "Inner NOT EXISTS: those the employee does not work on", "Correlated W2.Essn = E.Ssn, W2.Pno = W1.Pno"]}, {"id": "5-div-6", "concept": "division-sql", "type": "calc", "prompt": "Stafford에 있는 모든 프로젝트에서 일하는 사원의 이름을 검색하시오.", "answer": "SELECT E.Fname, E.Lname\nFROM   EMPLOYEE AS E\nWHERE  NOT EXISTS ( SELECT *\n                    FROM   PROJECT AS P\n                    WHERE  P.Plocation = 'Stafford'\n                      AND  NOT EXISTS ( SELECT *\n                                        FROM   WORKS_ON AS W\n                                        WHERE  W.Essn = E.Ssn AND W.Pno = P.Pnumber ) );\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nFname | Lname\nAlicia | Zelaya\nAhmad | Jabbar\n\nStafford 프로젝트 = {10, 30}. 둘 다 하는 사원 = Zelaya, Jabbar.", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["이중 NOT EXISTS", "Plocation = 'Stafford'", "W.Essn = E.Ssn AND W.Pno = P.Pnumber"], "slot": 13, "pts": 10, "lesson": "L5-2", "unit": "U5", "prompt_en": "Retrieve the names of employees who work on all the projects located in Stafford.", "answer_en": "SELECT E.Fname, E.Lname\nFROM   EMPLOYEE AS E\nWHERE  NOT EXISTS ( SELECT *\n                    FROM   PROJECT AS P\n                    WHERE  P.Plocation = 'Stafford'\n                      AND  NOT EXISTS ( SELECT *\n                                        FROM   WORKS_ON AS W\n                                        WHERE  W.Essn = E.Ssn AND W.Pno = P.Pnumber ) );\n\n-- Result on the textbook COMPANY state (2 rows)\nFname | Lname\nAlicia | Zelaya\nAhmad | Jabbar\n\nStafford projects = {10, 30}. Employees who work on both = Zelaya, Jabbar.", "keys_en": ["Double NOT EXISTS", "Plocation = 'Stafford'", "W.Essn = E.Ssn AND W.Pno = P.Pnumber"]}, {"id": "5-jt-1", "concept": "joined-table", "type": "mc", "prompt": "조인 테이블(joined table)을 쓰는 곳은?", "choices": ["SELECT 절", "FROM 절", "WHERE 절", "GROUP BY 절"], "answer": 1, "lesson": "L5-3", "unit": "U5", "prompt_en": "Where (in which clause) is a joined table used?", "choices_en": ["SELECT clause", "FROM clause", "WHERE clause", "GROUP BY clause"]}, {"id": "5-jt-2", "concept": "joined-table", "type": "ox", "prompt": "FROM (EMPLOYEE JOIN DEPARTMENT ON Dno = Dnumber) WHERE Dname = 'Research' 는 FROM EMPLOYEE, DEPARTMENT WHERE Dname = 'Research' AND Dnumber = Dno 와 결과가 같다.", "answer": true, "lesson": "L5-3", "unit": "U5", "prompt_en": "FROM (EMPLOYEE JOIN DEPARTMENT ON Dno = Dnumber) WHERE Dname = 'Research' gives the same result as FROM EMPLOYEE, DEPARTMENT WHERE Dname = 'Research' AND Dnumber = Dno."}, {"id": "5-jt-3", "concept": "joined-table", "type": "calc", "prompt": "각 프로젝트 이름과 그 프로젝트를 통제하는 부서 이름을 JOIN ... ON으로 검색하시오.", "answer": "SELECT P.Pname, D.Dname\nFROM   (PROJECT AS P JOIN DEPARTMENT AS D ON P.Dnum = D.Dnumber);\n\n-- 교재 COMPANY 상태에서 실행 결과 (6행)\nPname | Dname\nProductX | Research\nProductY | Research\nProductZ | Research\nComputerization | Administration\nReorganization | Headquarters\nNewbenefits | Administration", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["FROM (PROJECT JOIN DEPARTMENT ON ...)", "P.Dnum = D.Dnumber"], "lesson": "L5-3", "unit": "U5", "prompt_en": "Using JOIN ... ON, retrieve each project name and the name of the department that controls it.", "answer_en": "SELECT P.Pname, D.Dname\nFROM   (PROJECT AS P JOIN DEPARTMENT AS D ON P.Dnum = D.Dnumber);\n\n-- Result on the textbook COMPANY state (6 rows)\nPname | Dname\nProductX | Research\nProductY | Research\nProductZ | Research\nComputerization | Administration\nReorganization | Headquarters\nNewbenefits | Administration"}, {"id": "5-jt-4", "concept": "joined-table", "type": "calc", "prompt": "'Houston'에 있는 부서 위치를 가진 부서에서 일하는 사원의 이름과 부서 이름을 JOIN으로 검색하시오.", "answer": "SELECT E.Fname, E.Lname, D.Dname\nFROM   ((EMPLOYEE AS E JOIN DEPARTMENT AS D ON E.Dno = D.Dnumber)\n        JOIN DEPT_LOCATIONS AS L ON D.Dnumber = L.Dnumber)\nWHERE  L.Dlocation = 'Houston';\n\n-- 교재 COMPANY 상태에서 실행 결과 (5행)\nFname | Lname | Dname\nJohn | Smith | Research\nFranklin | Wong | Research\nRamesh | Narayan | Research\nJoyce | English | Research\nJames | Borg | Headquarters", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["JOIN 두 번 (중첩)", "E.Dno = D.Dnumber, D.Dnumber = L.Dnumber", "WHERE Dlocation = 'Houston'"], "lesson": "L5-3", "unit": "U5", "prompt_en": "Using JOIN, retrieve the names of employees who work in a department that has a location in 'Houston', together with the department name.", "answer_en": "SELECT E.Fname, E.Lname, D.Dname\nFROM   ((EMPLOYEE AS E JOIN DEPARTMENT AS D ON E.Dno = D.Dnumber)\n        JOIN DEPT_LOCATIONS AS L ON D.Dnumber = L.Dnumber)\nWHERE  L.Dlocation = 'Houston';\n\n-- Result on the textbook COMPANY state (5 rows)\nFname | Lname | Dname\nJohn | Smith | Research\nFranklin | Wong | Research\nRamesh | Narayan | Research\nJoyce | English | Research\nJames | Borg | Headquarters", "keys_en": ["Two JOINs (nested)", "E.Dno = D.Dnumber, D.Dnumber = L.Dnumber", "WHERE Dlocation = 'Houston'"]}, {"id": "5-jt-5", "concept": "joined-table", "type": "short", "prompt": "조인 테이블을 쓰면 좋은 점을 쓰시오.", "answer": "조인 조건을 FROM 절에 명시해서, WHERE 절에 선택 조건과 조인 조건이 섞이는 것을 피할 수 있다. 질의 구조를 이해하기 쉬워지고 조인 조건을 빠뜨리는 실수가 줄어든다.", "keys": ["조인 조건을 FROM에 명시", "WHERE에 선택·조인 조건이 섞이지 않음"], "lesson": "L5-3", "unit": "U5", "prompt_en": "What are the advantages of using a joined table?", "answer_en": "The join condition is specified in the FROM clause, which avoids mixing selection conditions and join conditions in the WHERE clause. The structure of the query becomes easier to understand, and mistakes such as leaving out a join condition are less likely.", "keys_en": ["Join condition specified in FROM", "Selection and join conditions are not mixed in WHERE"]}, {"id": "5-nj-1", "concept": "natural-join-sql", "type": "mc", "prompt": "NATURAL JOIN의 조인 조건은?", "choices": ["직접 ON으로 써야 한다", "PK와 FK 쌍", "이름이 같은 속성 쌍마다 암묵적인 동등 조건", "조건 없이 카티션 곱"], "answer": 2, "lesson": "L5-3", "unit": "U5", "prompt_en": "What is the join condition of a NATURAL JOIN?", "choices_en": ["It must be written explicitly with ON", "PK–FK pairs", "An implicit equality condition for each pair of attributes with the same name", "No condition; a Cartesian product"]}, {"id": "5-nj-2", "concept": "natural-join-sql", "type": "short", "prompt": "EMPLOYEE NATURAL JOIN DEPARTMENT를 바로 쓰면 Dno와 Dnumber가 조인되지 않는 이유와 해결 방법을 쓰시오.", "answer": "NATURAL JOIN은 이름이 같은 속성끼리만 조인하는데 EMPLOYEE는 Dno, DEPARTMENT는 Dnumber로 이름이 다르다. 그래서 DEPARTMENT AS DEPT (Dname, Dno, Mssn, Msdate)처럼 이름을 바꿔 Dno로 맞춘 뒤 NATURAL JOIN한다.", "keys": ["이름이 달라서 안 걸림", "별칭으로 속성 이름 바꾸기 (Dnumber → Dno)"], "lesson": "L5-3", "unit": "U5", "prompt_en": "Explain why Dno and Dnumber are not joined if you simply write EMPLOYEE NATURAL JOIN DEPARTMENT, and how to fix it.", "answer_en": "NATURAL JOIN joins only attributes with the same name, but the names differ: Dno in EMPLOYEE and Dnumber in DEPARTMENT. So rename the attributes, as in DEPARTMENT AS DEPT (Dname, Dno, Mssn, Msdate), to match Dno, and then apply NATURAL JOIN.", "keys_en": ["Different names, so they are not matched", "Rename the attribute with an alias (Dnumber → Dno)"]}, {"id": "5-nj-3", "concept": "natural-join-sql", "type": "ox", "prompt": "NATURAL JOIN 결과에서 조인 속성은 한 번만 나온다.", "answer": true, "lesson": "L5-3", "unit": "U5", "prompt_en": "In the result of a NATURAL JOIN, the join attribute appears only once."}, {"id": "5-nj-4", "concept": "natural-join-sql", "type": "calc", "prompt": "부서 이름과 그 부서의 위치를 NATURAL JOIN으로 검색하시오.", "answer": "SELECT Dname, Dlocation\nFROM   (DEPARTMENT NATURAL JOIN DEPT_LOCATIONS);\n\n-- 교재 COMPANY 상태에서 실행 결과 (5행)\nDname | Dlocation\nHeadquarters | Houston\nAdministration | Stafford\nResearch | Bellaire\nResearch | Sugarland\nResearch | Houston", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["DEPARTMENT NATURAL JOIN DEPT_LOCATIONS", "공통 속성 Dnumber로 조인"], "lesson": "L5-3", "unit": "U5", "prompt_en": "Using NATURAL JOIN, retrieve each department name and its locations.", "answer_en": "SELECT Dname, Dlocation\nFROM   (DEPARTMENT NATURAL JOIN DEPT_LOCATIONS);\n\n-- Result on the textbook COMPANY state (5 rows)\nDname | Dlocation\nHeadquarters | Houston\nAdministration | Stafford\nResearch | Bellaire\nResearch | Sugarland\nResearch | Houston", "keys_en": ["DEPARTMENT NATURAL JOIN DEPT_LOCATIONS", "Joined on the common attribute Dnumber"]}, {"id": "5-io-1", "concept": "inner-outer", "type": "mc", "prompt": "SELECT E.Lname, S.Lname FROM EMPLOYEE AS E, EMPLOYEE AS S WHERE E.Super_ssn = S.Ssn; 결과에서 빠지는 사원은? (COMPANY 상태)", "choices": ["Wong", "Wallace", "Smith", "Borg (Super_ssn이 NULL)"], "answer": 3, "lesson": "L5-3", "unit": "U5", "pro
