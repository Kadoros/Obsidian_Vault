wo relations 'type compatible'?", "choices_en": ["They have the same number of tuples", "They have the same attribute names", "They have the same number of attributes and the corresponding attributes have the same domain", "They have the same PK"]}, {"id": "6-set-2", "concept": "ra-setops", "type": "ox", "prompt": "R − S = S − R 이다.", "answer": false, "explain": "차집합은 교환 법칙이 성립하지 않는다.", "lesson": "L6-3", "unit": "U6", "prompt_en": "R − S = S − R.", "explain_en": "Set difference is not commutative."}, {"id": "6-set-3", "concept": "ra-setops", "type": "ox", "prompt": "R ∪ S = S ∪ R, R ∩ S = S ∩ R 이다.", "answer": true, "lesson": "L6-3", "unit": "U6", "prompt_en": "R ∪ S = S ∪ R and R ∩ S = S ∩ R."}, {"id": "6-set-4", "concept": "ra-setops", "type": "calc", "prompt": "5번 부서에서 일하거나, 5번 부서에서 일하는 사원을 직접 감독하는 사원의 Ssn을 관계 대수로 쓰시오.", "answer": "DEP5_EMPS    ← σ Dno=5 (EMPLOYEE)\nRESULT1      ← π Ssn (DEP5_EMPS)\nRESULT2(Ssn) ← π Super_ssn (DEP5_EMPS)\nRESULT       ← RESULT1 ∪ RESULT2\n\n-- COMPANY 상태에서의 결과 (5행)\nSsn\n123456789\n333445555\n453453453\n666884444\n888665555", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["σ Dno=5", "π Ssn과 π Super_ssn", "이름 맞추기 RESULT2(Ssn)", "∪"], "lesson": "L6-3", "unit": "U6", "prompt_en": "In relational algebra, write the SSNs of all employees who either work in department 5 or directly supervise an employee who works in department 5.", "answer_en": "DEP5_EMPS    ← σ Dno=5 (EMPLOYEE)\nRESULT1      ← π Ssn (DEP5_EMPS)\nRESULT2(Ssn) ← π Super_ssn (DEP5_EMPS)\nRESULT       ← RESULT1 ∪ RESULT2\n\n-- Result on the COMPANY state (5 rows)\nSsn\n123456789\n333445555\n453453453\n666884444\n888665555", "keys_en": ["σ Dno=5", "π Ssn and π Super_ssn", "Matching names RESULT2(Ssn)", "∪"]}, {"id": "6-set-5", "concept": "ra-setops", "type": "calc", "prompt": "프로젝트에서 일하는 사원 중 부양가족이 있는 사원의 Ssn을 교집합으로 쓰시오.", "answer": "WORKERS(Ssn)  ← π Essn (WORKS_ON)\nWITH_DEPS(Ssn) ← π Essn (DEPENDENT)\nRESULT        ← WORKERS ∩ WITH_DEPS\n\n-- COMPANY 상태에서의 결과 (3행)\nEssn\n123456789\n333445555\n987654321", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["π Essn (WORKS_ON)", "π Essn (DEPENDENT)", "∩"], "lesson": "L6-3", "unit": "U6", "prompt_en": "Using intersection, write the Ssn of employees who work on a project and also have dependents.", "answer_en": "WORKERS(Ssn)  ← π Essn (WORKS_ON)\nWITH_DEPS(Ssn) ← π Essn (DEPENDENT)\nRESULT        ← WORKERS ∩ WITH_DEPS\n\n-- Result on the COMPANY state (3 rows)\nEssn\n123456789\n333445555\n987654321"}, {"id": "6-set-6", "concept": "ra-setops", "type": "calc", "prompt": "STUDENT(Fn, Ln) = {(Susan, Yao), (Ramesh, Shah), (Johnny, Kohler), (Barbara, Jones), (Amy, Ford), (Jimmy, Wang), (Ernest, Gilbert)}, INSTRUCTOR(Fname, Lname) = {(John, Smith), (Ricardo, Browne), (Susan, Yao), (Francis, Johnson), (Ramesh, Shah)}일 때 다음 결과의 투플 수를 쓰시오.\n(1) STUDENT ∪ INSTRUCTOR  (2) STUDENT ∩ INSTRUCTOR  (3) STUDENT − INSTRUCTOR  (4) INSTRUCTOR − STUDENT", "answer": "(1) 10 (7 + 5 − 겹치는 2)\n(2) 2 (Susan Yao, Ramesh Shah)\n(3) 5 (Johnny Kohler, Barbara Jones, Amy Ford, Jimmy Wang, Ernest Gilbert)\n(4) 3 (John Smith, Ricardo Browne, Francis Johnson)", "keys": ["(1) 10", "(2) 2", "(3) 5", "(4) 3"], "slot": 16, "pts": 7, "lesson": "L6-3", "unit": "U6", "prompt_en": "Given STUDENT(Fn, Ln) = {(Susan, Yao), (Ramesh, Shah), (Johnny, Kohler), (Barbara, Jones), (Amy, Ford), (Jimmy, Wang), (Ernest, Gilbert)} and INSTRUCTOR(Fname, Lname) = {(John, Smith), (Ricardo, Browne), (Susan, Yao), (Francis, Johnson), (Ramesh, Shah)}, give the number of tuples in each result.\n(1) STUDENT ∪ INSTRUCTOR  (2) STUDENT ∩ INSTRUCTOR  (3) STUDENT − INSTRUCTOR  (4) INSTRUCTOR − STUDENT", "answer_en": "(1) 10 (7 + 5 − 2 in common)\n(2) 2 (Susan Yao, Ramesh Shah)\n(3) 5 (Johnny Kohler, Barbara Jones, Amy Ford, Jimmy Wang, Ernest Gilbert)\n(4) 3 (John Smith, Ricardo Browne, Francis Johnson)"}, {"id": "6-set-7", "concept": "ra-setops", "type": "blank", "prompt": "합집합·교집합·차집합의 결과 속성 이름은 관례상 (a) 릴레이션을 따르고, 결과에서 (b) 은 제거된다.", "answer": "(a) 첫 번째 / (b) 중복", "accept": [["첫 번째", "첫번째", "왼쪽", "R", "앞", "first", "left"], ["중복", "중복 투플", "duplicate", "duplicates", "duplicate tuples"]], "lesson": "L6-3", "unit": "U6", "prompt_en": "By convention, the attribute names of the result of union, intersection and difference are those of the (a) relation, and (b) are eliminated from the result.", "answer_en": "(a) first / (b) duplicates"}, {"id": "6-cp-1", "concept": "ra-cartesian", "type": "mc", "prompt": "R(3개 속성, 4개 투플) × S(2개 속성, 5개 투플)의 결과는?", "choices": ["5개 속성, 9개 투플", "6개 속성, 20개 투플", "3개 속성, 4개 투플", "5개 속성, 20개 투플"], "answer": 3, "lesson": "L6-3", "unit": "U6", "prompt_en": "What is the result of R (3 attributes, 4 tuples) × S (2 attributes, 5 tuples)?", "choices_en": ["5 attributes, 9 tuples", "6 attributes, 20 tuples", "3 attributes, 4 tuples", "5 attributes, 20 tuples"]}, {"id": "6-cp-2", "concept": "ra-cartesian", "type": "ox", "prompt": "카티션 곱은 타입 호환이 아닌 릴레이션에도 적용할 수 있다.", "answer": true, "lesson": "L6-3", "unit": "U6", "prompt_en": "The Cartesian product can be applied even to relations that are not type compatible."}, {"id": "6-cp-3", "concept": "ra-cartesian", "type": "short", "prompt": "카티션 곱이 그 자체로는 대개 의미가 없는 이유와, 유용하게 쓰는 방법을 쓰시오.", "answer": "모든 투플 조합을 만들기 때문에 서로 관련 없는 투플까지 이어 붙여진다 (예: 여성 사원 3명 × 부양가족 7명 = 21행, 대부분 무관). 뒤에 SELECT로 관련 있는 투플(Ssn = Essn)만 고르면 유용하다 → 이것이 JOIN.", "keys": ["모든 조합 → 무관한 투플 포함", "뒤에 σ로 관련 투플 선택 = JOIN"], "lesson": "L6-3", "unit": "U6", "prompt_en": "Explain why the Cartesian product is usually meaningless by itself, and how it is used usefully.", "answer_en": "It produces every combination of tuples, so unrelated tuples are concatenated too (e.g., 3 female employees × 7 dependents = 21 rows, mostly unrelated). It becomes useful when followed by a SELECT that keeps only related tuples (Ssn = Essn) → this is JOIN.", "keys_en": ["Every combination → includes unrelated tuples", "Followed by σ to select related tuples = JOIN"]}, {"id": "6-cp-4", "concept": "ra-cartesian", "type": "calc", "prompt": "여성 사원의 부양가족 이름을, 사원 이름과 함께 카티션 곱과 σ를 써서 관계 대수로 쓰시오.", "answer": "FEMALE_EMPS       ← σ Sex='F' (EMPLOYEE)\nEMPNAMES          ← π Fname, Lname, Ssn (FEMALE_EMPS)\nEMP_DEPENDENTS    ← EMPNAMES × DEPENDENT\nACTUAL_DEPENDENTS ← σ Ssn=Essn (EMP_DEPENDENTS)\nRESULT            ← π Fname, Lname, Dependent_name (ACTUAL_DEPENDENTS)\n\n-- COMPANY 상태에서의 결과 (1행)\nFname | Lname | Dependent_name\nJennifer | Wallace | Abner", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["σ Sex='F'", "π로 필요한 속성만", "×", "σ Ssn=Essn", "π 결과"], "lesson": "L6-3", "unit": "U6", "prompt_en": "Using the Cartesian product and σ, write in relational algebra the names of the dependents of female employees, together with the employees' names.", "answer_en": "FEMALE_EMPS       ← σ Sex='F' (EMPLOYEE)\nEMPNAMES          ← π Fname, Lname, Ssn (FEMALE_EMPS)\nEMP_DEPENDENTS    ← EMPNAMES × DEPENDENT\nACTUAL_DEPENDENTS ← σ Ssn=Essn (EMP_DEPENDENTS)\nRESULT            ← π Fname, Lname, Dependent_name (ACTUAL_DEPENDENTS)\n\n-- Result on the COMPANY state (1 row)\nFname | Lname | Dependent_name\nJennifer | Wallace | Abner", "keys_en": ["σ Sex='F'", "π only the needed attributes", "×", "σ Ssn=Essn", "π result"]}, {"id": "6-cp-5", "concept": "ra-cartesian", "type": "mc", "prompt": "COMPANY 상태에서 EMPLOYEE × DEPARTMENT의 투플 수와 속성 수는?", "choices": ["11개, 14개", "24개, 14개", "24개, 10개", "8개, 4개"], "answer": 1, "lesson": "L6-3", "unit": "U6", "prompt_en": "On the COMPANY state, how many tuples and attributes does EMPLOYEE × DEPARTMENT have?", "choices_en": ["11, 14", "24, 14", "24, 10", "8, 4"]}, {"id": "6-jn-1", "concept": "ra-join", "type": "mc", "prompt": "R ⋈<조건> S 와 같은 식은?", "choices": ["σ<조건>(R × S)", "π<조건>(R × S)", "R ∪ S", "R − S"], "answer": 0, "lesson": "L6-4", "unit": "U6", "prompt_en": "Which expression is equivalent to R ⋈<condition> S?", "choices_en": ["σ<condition>(R × S)", "π<condition>(R × S)", "R ∪ S", "R − S"]}, {"id": "6-jn-2", "concept": "ra-join", "type": "calc", "prompt": "각 부서의 이름과 그 부서 관리자의 성, 이름을 관계 대수로 쓰시오.", "answer": "DEPT_MGR ← DEPARTMENT ⋈ Mgr_ssn=Ssn EMPLOYEE\nRESULT   ← π Dname, Lname, Fname (DEPT_MGR)\n\n-- COMPANY 상태에서의 결과 (3행)\nDname | Lname | Fname\nResearch | Wong | Franklin\nAdministration | Wallace | Jennifer\nHeadquarters | Borg | James", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["DEPARTMENT ⋈ Mgr_ssn=Ssn EMPLOYEE", "π Dname, Lname, Fname"], "lesson": "L6-4", "unit": "U6", "prompt_en": "In relational algebra, write the name of each department and the last and first name of its manager.", "answer_en": "DEPT_MGR ← DEPARTMENT ⋈ Mgr_ssn=Ssn EMPLOYEE\nRESULT   ← π Dname, Lname, Fname (DEPT_MGR)\n\n-- Result on the COMPANY state (3 rows)\nDname | Lname | Fname\nResearch | Wong | Franklin\nAdministration | Wallace | Jennifer\nHeadquarters | Borg | James"}, {"id": "6-jn-3", "concept": "ra-join", "type": "calc", "prompt": "'ProductX' 프로젝트에서 일하는 사원의 이름과 근무 시간을 관계 대수로 쓰시오.", "answer": "PX     ← σ Pname='ProductX' (PROJECT)\nPX_W   ← PX ⋈ Pnumber=Pno WORKS_ON\nPX_E   ← PX_W ⋈ Essn=Ssn EMPLOYEE\nRESULT ← π Fname, Lname, Hours (PX_E)\n\n-- COMPANY 상태에서의 결과 (2행)\nFname | Lname | Hours\nJohn | Smith | 32.5\nJoyce | English | 20", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["σ Pname='ProductX'", "⋈ Pnumber=Pno", "⋈ Essn=Ssn", "π"], "lesson": "L6-4", "unit": "U6", "prompt_en": "In relational algebra, write the names and hours of employees who work on the 'ProductX' project.", "answer_en": "PX     ← σ Pname='ProductX' (PROJECT)\nPX_W   ← PX ⋈ Pnumber=Pno WORKS_ON\nPX_E   ← PX_W ⋈ Essn=Ssn EMPLOYEE\nRESULT ← π Fname, Lname, Hours (PX_E)\n\n-- Result on the COMPANY state (2 rows)\nFname | Lname | Hours\nJohn | Smith | 32.5\nJoyce | English | 20"}, {"id": "6-jn-4", "concept": "ra-join", "type": "calc", "prompt": "'Houston'에 사는 사원이 일하는 프로젝트의 이름을 관계 대수로 쓰시오.", "answer": "HOU    ← σ Address LIKE '%Houston%' (EMPLOYEE)      (교재식: Address에 Houston이 들어간 사원)\nHOU_W  ← HOU ⋈ Ssn=Essn WORKS_ON\nHOU_P  ← HOU_W ⋈ Pno=Pnumber PROJECT\nRESULT ← π Pname (HOU_P)\n\n-- COMPANY 상태에서의 결과 (6행)\nPname\nProductX\nProductY\nProductZ\nComputerization\nReorganization\nNewbenefits", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["σ (Houston 사원)", "⋈ Ssn=Essn", "⋈ Pno=Pnumber", "π Pname (중복 제거)"], "lesson": "L6-4", "unit": "U6", "prompt_en": "In relational algebra, write the names of the projects that employees living in 'Houston' work on.", "answer_en": "HOU    ← σ Address LIKE '%Houston%' (EMPLOYEE)      (textbook style: employees whose Address contains Houston)\nHOU_W  ← HOU ⋈ Ssn=Essn WORKS_ON\nHOU_P  ← HOU_W ⋈ Pno=Pnumber PROJECT\nRESULT ← π Pname (HOU_P)\n\n-- Result on the COMPANY state (6 rows)\nPname\nProductX\nProductY\nProductZ\nComputerization\nReorganization\nNewbenefits", "keys_en": ["σ (Houston employees)", "⋈ Ssn=Essn", "⋈ Pno=Pnumber", "π Pname (duplicates eliminated)"]}, {"id": "6-jn-5", "concept": "ra-join", "type": "short", "prompt": "JOIN과 카티션 곱의 관계를 설명하시오.", "answer": "JOIN은 카티션 곱 다음에 SELECT를 적용한 것과 같다: R ⋈<조건> S = σ<조건>(R × S). 두 연산(×, σ)을 한 번의 JOIN으로 바꿀 수 있고, JOIN 결과에는 조건을 만족하는 투플 조합만 들어간다.", "keys": ["R ⋈ S = σ(R × S)", "조건 만족 조합만"], "slot": 5, "pts": 3, "lesson": "L6-4", "unit": "U6", "prompt_en": "Explain the relationship between JOIN and the Cartesian product.", "answer_en": "JOIN is equivalent to a Cartesian product followed by a SELECT: R ⋈<condition> S = σ<condition>(R × S). The two operations (×, σ) can be replaced by a single JOIN, and the JOIN result contains only the tuple combinations that satisfy the condition.", "keys_en": ["R ⋈ S = σ(R × S)", "Only combinations that satisfy the condition"]}, {"id": "6-jn-6", "concept": "ra-join", "type": "ox", "prompt": "JOIN 결과의 속성은 R의 속성 다음에 S의 속성이 이어진 것이다 (Q(A₁…Aₙ, B₁…Bₘ)).", "answer": true, "lesson": "L6-4", "unit": "U6", "prompt_en": "The attributes of a JOIN result are the attributes of R followed by the attributes of S (Q(A₁…Aₙ, B₁…Bₘ))."}, {"id": "6-jn-7", "concept": "ra-join", "type": "calc", "prompt": "'Research' 부서에서 일하는 모든 사원의 이름과 주소를 관계 대수로 쓰시오. (연습 1)", "answer": "RESEARCH_DEPT ← σ Dname='Research' (DEPARTMENT)\nRESEARCH_EMPS ← RESEARCH_DEPT ⋈ Dnumber=Dno EMPLOYEE\nRESULT        ← π Fname, Lname, Address (RESEARCH_EMPS)\n\n-- COMPANY 상태에서의 결과 (4행)\nFname | Lname | Address\nJohn | Smith | 731 Fondren, Houston, TX\nFranklin | Wong | 638 Voss, Houston, TX\nRamesh | Narayan | 975 Fire Oak, Humble, TX\nJoyce | English | 5631 Rice, Houston, TX", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["σ Dname='Research'", "⋈ Dnumber=Dno", "π Fname, Lname, Address"], "lesson": "L6-4", "unit": "U6", "prompt_en": "In relational algebra, write the name and address of all employees who work for the 'Research' department. (Exercise 1)", "answer_en": "RESEARCH_DEPT ← σ Dname='Research' (DEPARTMENT)\nRESEARCH_EMPS ← RESEARCH_DEPT ⋈ Dnumber=Dno EMPLOYEE\nRESULT        ← π Fname, Lname, Address (RESEARCH_EMPS)\n\n-- Result on the COMPANY state (4 rows)\nFname | Lname | Address\nJohn | Smith | 731 Fondren, Houston, TX\nFranklin | Wong | 638 Voss, Houston, TX\nRamesh | Narayan | 975 Fire Oak, Humble, TX\nJoyce | English | 5631 Rice, Houston, TX"}, {"id": "6-jv-1", "concept": "join-variants", "type": "mc", "prompt": "비교 연산자로 = 만 쓰는 조인은?", "choices": ["세타 조인", "동등 조인 (EQUIJOIN)", "외부 조인", "카티션 곱"], "answer": 1, "lesson": "L6-4", "unit": "U6", "prompt_en": "Which join uses only = as the comparison operator?", "choices_en": ["Theta join", "EQUIJOIN", "Outer join", "Cartesian product"]}, {"id": "6-jv-2", "concept": "join-variants", "type": "mc", "prompt": "자연 조인(*)에 대한 설명으로 옳은 것은?", "choices": ["조인 조건을 직접 써야 한다", "= 이외의 연산자도 쓴다", "이름이 같은 속성으로 동등 조인하고 중복 속성 하나를 없앤다", "짝이 없는 투플도 남긴다"], "answer": 2, "lesson": "L6-4", "unit": "U6", "prompt_en": "Which statement about the natural join (*) is correct?", "choices_en": ["The join condition must be written explicitly", "It also uses operators other than =", "It is an equijoin on the attributes with the same name, with one of each pair of duplicate attributes removed", "It also keeps unmatched tuples"]}, {"id": "6-jv-3", "concept": "join-variants", "type": "ox", "prompt": "동등 조인 결과에는 값이 똑같은 속성 쌍이 생기는데, 그중 하나는 불필요하다.", "answer": true, "lesson": "L6-4", "unit": "U6", "prompt_en": "An equijoin result has pairs of attributes with identical values, and one of each pair is superfluous."}, {"id": "6-jv-4", "concept": "join-variants", "type": "calc", "prompt": "PROJECT(Pname, Pnumber, Plocation, Dnum)와 DEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)를 자연 조인하려면 어떻게 해야 하는지 관계 대수로 쓰시오.", "answer": "DEPT      ← ρ (Dname, Dnum, Mgr_ssn, Mgr_start_date) (DEPARTMENT)\nPROJ_DEPT ← PROJECT * DEPT\n(조인 속성 이름이 Dnum과 Dnumber로 달라서 먼저 RENAME으로 맞춘다)", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["ρ로 Dnumber → Dnum", "PROJECT * DEPT"], "lesson": "L6-4", "unit": "U6", "prompt_en": "In relational algebra, show how to natural join PROJECT(Pname, Pnumber, Plocation, Dnum) and DEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date).", "answer_en": "DEPT      ← ρ (Dname, Dnum, Mgr_ssn, Mgr_start_date) (DEPARTMENT)\nPROJ_DEPT ← PROJECT * DEPT\n(The join attribute names differ, Dnum and Dnumber, so they are first matched with RENAME)", "keys_en": ["ρ: Dnumber → Dnum", "PROJECT * DEPT"]}, {"id": "6-jv-5", "concept": "join-variants", "type": "short", "prompt": "세타 조인, 동등 조인, 자연 조인을 구별해서 설명하시오.", "answer": "세타 조인: 일반 조인 조건 Aᵢ θ Bⱼ (θ ∈ {=, <, ≤, >, ≥, ≠})를 AND로 연결. 동등 조인: 비교 연산자로 = 만 쓴 세타 조인, 결과에 같은 값의 속성 쌍이 생김. 자연 조인(*): 이름이 같은 속성으로 동등 조인하고 중복 속성 하나를 제거, 이름이 다르면 먼저 RENAME.", "keys": ["세타 = 일반 비교 연산", "동등 = = 만", "자연 = 같은 이름 + 중복 제거"], "lesson": "L6-4", "unit": "U6", "prompt_en": "Explain and distinguish theta join, equijoin and natural join.", "answer_en": "Theta join: general join conditions Aᵢ θ Bⱼ (θ ∈ {=, <, ≤, >, ≥, ≠}) connected by AND. Equijoin: a theta join that uses only = as the comparison operator; the result has pairs of attributes with identical values. Natural join (*): an equijoin on the attributes with the same name with one of each duplicate pair removed; if the names differ, RENAME first.", "keys_en": ["Theta = general comparison operators", "Equi = only =", "Natural = same names + duplicate removed"]}, {"id": "6-jv-6", "concept": "join-variants", "type": "mc", "prompt": "DEPARTMENT * DEPT_LOCATIONS 의 조인 속성은?", "choices": ["Dnumber (두 릴레이션에 같은 이름)", "Dname", "Dlocation", "조인 속성 없음 → 카티션 곱"], "answer": 0, "lesson": "L6-4", "unit": "U6", "prompt_en": "What is the join attribute of DEPARTMENT * DEPT_LOCATIONS?", "choices_en": ["Dnumber (same name in both relations)", "Dname", "Dlocation", "No join attribute → Cartesian product"]}, {"id": "6-js-1", "concept": "join-size", "type": "mc", "prompt": "|R| = 8, |S| = 3일 때 R ⋈ S 결과 투플 수의 범위는?", "choices": ["정확히 8", "3 이상 8 이하", "0 이상 24 이하", "8 이상 24 이하"], "answer": 2, "lesson": "L6-4", "unit": "U6", "prompt_en": "If |R| = 8 and |S| = 3, what is the range of the number of tuples in R ⋈ S?", "choices_en": ["Exactly 8", "Between 3 and 8", "Between 0 and 24", "Between 8 and 24"]}, {"id": "6-js-2", "concept": "join-size", "type": "short", "prompt": "조인 선택도(join selectivity)를 정의하고 어디에 쓰는지 쓰시오.", "answer": "조인 선택도 = 예상 조인 결과 크기 / (|R| × |S|). 질의 최적화에서 질의 계획의 비용을 추정하는 데 쓴다.", "keys": ["예상 결과 크기 / (|R| × |S|)", "질의 계획 비용 추정"], "lesson": "L6-4", "unit": "U6", "prompt_en": "Define join selectivity (for R ⋈ S) and explain what it is used for.", "answer_en": "Join selectivity = expected size of the join result / (|R| × |S|). It is used in query optimization to estimate the cost of query plans.", "keys_en": ["Expected result size / (|R| × |S|)", "Estimating the cost of query plans"]}, {"id": "6-js-3", "concept": "join-size", "type": "ox", "prompt": "조인 조건이 없으면 조인 결과는 카티션 곱과 같다.", "answer": true, "lesson": "L6-4", "unit": "U6", "prompt_en": "If there is no join condition, the join result is the same as the Cartesian product."}, {"id": "6-div-1", "concept": "ra-division", "type": "mc", "prompt": "R(Z) ÷ S(X) = T(Y)에서 Y는?", "choices": ["X", "Z − X", "Z ∪ X", "Z ∩ X"], "answer": 1, "lesson": "L6-4", "unit": "U6", "prompt_en": "In R(Z) ÷ S(X) = T(Y), what is Y?"}, {"id": "6-div-2", "concept": "ra-division", "type": "calc", "prompt": "R(A, B) = {(a1,b1), (a2,b1), (a3,b1), (a4,b1), (a1,b2), (a3,b2), (a2,b3), (a3,b3), (a4,b3), (a1,b4), (a2,b4), (a3,b4)}, S(A) = {a1, a2, a3}일 때 T ← R ÷ S 를 구하시오.", "answer": "T(B) = {b1, b4}\nb1: a1, a2, a3 모두와 짝 → 포함\nb2: a1, a3만 → 제외\nb3: a2, a3만 (a1 없음) → 제외\nb4: a1, a2, a3 → 포함", "keys": ["T의 속성 = B", "b1 포함", "b4 포함", "b2, b3 제외"], "slot": 16, "pts": 7, "lesson": "L6-4", "unit": "U6", "prompt_en": "Given R(A, B) = {(a1,b1), (a2,b1), (a3,b1), (a4,b1), (a1,b2), (a3,b2), (a2,b3), (a3,b3), (a4,b3), (a1,b4), (a2,b4), (a3,b4)} and S(A) = {a1, a2, a3}, compute T ← R ÷ S.", "answer_en": "T(B) = {b1, b4}\nb1: paired with all of a1, a2, a3 → included\nb2: only a1, a3 → excluded\nb3: only a2, a3 (no a1) → excluded\nb4: a1, a2, a3 → included", "keys_en": ["Attribute of T = B", "b1 included", "b4 included", "b2, b3 excluded"]}, {"id": "6-div-3", "concept": "ra-division", "type": "calc", "prompt": "'John Smith'가 일하는 모든 프로젝트에서 일하는 사원의 이름을 DIVISION으로 쓰시오.", "answer": "SMITH      ← σ Fname='John' AND Lname='Smith' (EMPLOYEE)\nSMITH_PNOS ← π Pno (WORKS_ON ⋈ Essn=Ssn SMITH)\nSSN_PNOS   ← π Essn, Pno (WORKS_ON)\nSSNS(Ssn)  ← SSN_PNOS ÷ SMITH_PNOS\nRESULT     ← π Fname, Lname (SSNS * EMPLOYEE)\n\n-- COMPANY 상태에서의 결과 (2행)\nFname | Lname\nJohn | Smith\nJoyce | English", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["SMITH_PNOS (분모)", "SSN_PNOS(Essn, Pno) (분자)", "÷", "SSNS(Ssn)로 이름 바꿔 EMPLOYEE와 자연 조인"], "slot": 15, "pts": 10, "lesson": "L6-4", "unit": "U6", "prompt_en": "Using DIVISION, write the names of employees who work on all the projects that 'John Smith' works on.", "answer_en": "SMITH      ← σ Fname='John' AND Lname='Smith' (EMPLOYEE)\nSMITH_PNOS ← π Pno (WORKS_ON ⋈ Essn=Ssn SMITH)\nSSN_PNOS   ← π Essn, Pno (WORKS_ON)\nSSNS(Ssn)  ← SSN_PNOS ÷ SMITH_PNOS\nRESULT     ← π Fname, Lname (SSNS * EMPLOYEE)\n\n-- Result on the COMPANY state (2 rows)\nFname | Lname\nJohn | Smith\nJoyce | English", "keys_en": ["SMITH_PNOS (denominator)", "SSN_PNOS(Essn, Pno) (numerator)", "÷", "Rename to SSNS(Ssn) and natural join with EMPLOYEE"]}, {"id": "6-div-4", "concept": "ra-division", "type": "calc", "prompt": "Stafford에 있는 모든 프로젝트에서 일하는 사원의 Ssn을 DIVISION으로 쓰시오.", "answer": "STAFF_P(Pno) ← π Pnumber (σ Plocation='Stafford' (PROJECT))\nSSN_PNOS     ← π Essn, Pno (WORKS_ON)\nRESULT       ← SSN_PNOS ÷ STAFF_P\n\n-- COMPANY 상태에서의 결과 (2행)\nSsn\n987987987\n999887777", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["분모: Stafford 프로젝트 번호 (이름 Pno로)", "분자: π Essn, Pno (WORKS_ON)", "÷"], "lesson": "L6-4", "unit": "U6", "prompt_en": "Using DIVISION, write the Ssn of employees who work on all the projects located in Stafford.", "answer_en": "STAFF_P(Pno) ← π Pnumber (σ Plocation='Stafford' (PROJECT))\nSSN_PNOS     ← π Essn, Pno (WORKS_ON)\nRESULT       ← SSN_PNOS ÷ STAFF_P\n\n-- Result on the COMPANY state (2 rows)\nSsn\n987987987\n999887777", "keys_en": ["Denominator: Stafford project numbers (renamed Pno)", "Numerator: π Essn, Pno (WORKS_ON)", "÷"]}, {"id": "6-div-5", "concept": "ra-division", "type": "short", "prompt": "DIVISION 연산이 필요한 질의의 특징과 SQL에서의 대응 패턴을 쓰시오.", "answer": "'모든 ~에 대해'(all) 조건이 들어간 질의 (예: 어떤 사원이 일하는 '모든' 프로젝트에서 일하는 사원). SQL에는 ÷가 없어서 NOT EXISTS ((분모 집합) EXCEPT (그 투플의 집합)) 또는 이중 NOT EXISTS로 쓴다.", "keys": ["'모든(all)' 조건", "SQL: NOT EXISTS + EXCEPT 또는 이중 NOT EXISTS"], "lesson": "L6-4", "unit": "U6", "prompt_en": "Describe the kind of query that needs the DIVISION operation and the corresponding pattern in SQL.", "answer_en": "Queries with a 'for all …' (all) condition (e.g., employees who work on 'all' the projects that some employee works on). SQL has no ÷, so it is written as NOT EXISTS ((denominator set) EXCEPT (that tuple's set)) or with a double NOT EXISTS.", "keys_en": ["'All' condition", "SQL: NOT EXISTS + EXCEPT or double NOT EXISTS"]}, {"id": "6-div-6", "concept": "ra-division", "type": "ox", "prompt": "R(Z) ÷ S(X)에서 S의 속성 X는 R의 속성 Z의 부분집합이어야 한다.", "answer": true, "lesson": "L6-4", "unit": "U6", "prompt_en": "In R(Z) ÷ S(X), the attributes X of S must be a subset of the attributes Z of R."}, {"id": "6-cs-1", "concept": "ra-complete", "type": "mc", "prompt": "관계 대수 연산의 완전 집합은?", "choices": ["{σ, π, ⋈, ∩}", "{σ, π, ∪, ∩, ÷}", "{σ, π, ×, ⋈, ÷, ℑ}", "{σ, π, ∪, ρ, −, ×}"], "answer": 3, "lesson": "L6-4", "unit": "U6", "prompt_en": "Which is the complete set of relational algebra operations?"}, {"id": "6-cs-2", "concept": "ra-complete", "type": "blank", "prompt": "교집합은 R ∩ S ≡ (R ∪ S) − ((R − S) ∪ (S − R)) 로, 조인은 R ⋈<조건> S ≡ (a)<조건>(R (b) S) 로 표현할 수 있다.", "answer": "(a) σ / (b) ×", "accept": [["σ", "sigma", "SELECT", "시그마"], ["×", "x", "X", "CARTESIAN PRODUCT", "카티션 곱", "Cartesian product", "cross product"]], "lesson": "L6-4", "unit": "U6", "prompt_en": "Intersection can be expressed as R ∩ S ≡ (R ∪ S) − ((R − S) ∪ (S − R)), and join as R ⋈<condition> S ≡ (a)<condition>(R (b) S)."}, {"id": "6-cs-3", "concept": "ra-complete", "type": "short", "prompt": "∩와 ⋈가 완전 집합에 없는데도 별도 연산으로 두는 이유를 쓰시오.", "answer": "엄밀히는 ∩와 ⋈ 모두 완전 집합 {σ, π, ∪, ρ, −, ×}의 조합으로 표현할 수 있어 필요 없지만, DB 응용에서 아주 자주 쓰이기 때문에 편의상 별도 연산으로 둔다.", "keys": ["다른 연산으로 표현 가능", "자주 쓰여서 편의상"], "lesson": "L6-4", "unit": "U6", "prompt_en": "Explain why ∩ and ⋈ are kept as separate operations even though they are not in the complete set.", "answer_en": "Strictly, both ∩ and ⋈ can be expressed as combinations of the complete set {σ, π, ∪, ρ, −, ×}, so they are not needed, but they are used so often in database applications that they are kept as separate operations for convenience.", "keys_en": ["Expressible with other operations", "Kept for convenience because they are used so often"]}, {"id": "6-cs-4", "concept": "ra-complete", "type": "ox", "prompt": "자연 조인은 RENAME, 카티션 곱, SELECT, PROJECT의 조합으로 표현할 수 있다.", "answer": true, "lesson": "L6-4", "unit": "U6", "prompt_en": "A natural join can be expressed as a combination of RENAME, Cartesian product, SELECT and PROJECT."}, {"id": "6-agg-1", "concept": "ra-aggregate", "type": "mc", "prompt": "Dno ℑ COUNT Ssn, AVERAGE Salary (EMPLOYEE)의 결과 속성 이름은? (이름 바꾸기 없음)", "choices": ["Dno, COUNT, AVERAGE", "Dno, Ssn, Salary", "Dno, Count_ssn, Average_salary", "No_of_employees, Average_sal"], "answer": 2, "lesson": "L6-5", "unit": "U6", "prompt_en": "What are the attribute names of the result of Dno ℑ COUNT Ssn, AVERAGE Salary (EMPLOYEE)? (No renaming)"}, {"id": "6-agg-2", "concept": "ra-aggregate", "type": "mc", "prompt": "ℑ COUNT Ssn, AVERAGE Salary (EMPLOYEE) (그룹화 속성 없음)의 결과는? (COMPANY 상태)", "choices": ["투플 하나 (8, 35125)", "투플 세 개", "스칼라 숫자 두 개", "투플 8개"], "answer": 0, "lesson": "L6-5", "unit": "U6", "prompt_en": "What is the result of ℑ COUNT Ssn, AVERAGE Salary (EMPLOYEE) (no grouping attributes)? (COMPANY state)", "choices_en": ["One tuple (8, 35125)", "Three tuples", "Two scalar numbers", "8 tuples"]}, {"id": "6-agg-3", "concept": "ra-aggregate", "type": "calc", "prompt": "부서마다 부서 번호, 사원 수, 평균 급여를 구하고 결과 속성 이름을 Dno, No_of_employees, Average_sal로 바꾸는 관계 대수를 쓰시오.", "answer": "ρ R(Dno, No_of_employees, Average_sal) ( Dno ℑ COUNT Ssn, AVERAGE Salary (EMPLOYEE) )\n\n-- COMPANY 상태에서의 결과 (3행)\nDno | COUNT(Ssn) | AVG(Salary)\n1 | 1 | 55000\n4 | 3 | 31000\n5 | 4 | 33250", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["그룹화 속성 Dno (ℑ 왼쪽)", "함수 리스트 COUNT Ssn, AVERAGE Salary", "ρ로 이름 바꾸기"], "lesson": "L6-5", "unit": "U6", "prompt_en": "Write relational algebra that retrieves, for each department, the department number, number of employees and average salary, and renames the result attributes to Dno, No_of_employees, Average_sal.", "answer_en": "ρ R(Dno, No_of_employees, Average_sal) ( Dno ℑ COUNT Ssn, AVERAGE Salary (EMPLOYEE) )\n\n-- Result on the COMPANY state (3 rows)\nDno | COUNT(Ssn) | AVG(Salary)\n1 | 1 | 55000\n4 | 3 | 31000\n5 | 4 | 33250", "keys_en": ["Grouping attribute Dno (left of ℑ)", "Function list COUNT Ssn, AVERAGE Salary", "Renaming with ρ"]}, {"id": "6-agg-4", "concept": "ra-aggregate", "type": "calc", "prompt": "프로젝트마다 프로젝트 번호와 총 근무 시간을 관계 대수로 쓰시오.", "answer": "Pno ℑ SUM Hours (WORKS_ON)\n\n-- COMPANY 상태에서의 결과 (6행)\nPno | SUM(Hours)\n1 | 52.5\n2 | 37.5\n3 | 50\n10 | 55\n20 | 25\n30 | 55", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["그룹화 속성 Pno", "SUM Hours"], "lesson": "L6-5", "unit": "U6", "prompt_en": "In relational algebra, write the project number and total hours for each project.", "answer_en": "Pno ℑ SUM Hours (WORKS_ON)\n\n-- Result on the COMPANY state (6 rows)\nPno | SUM(Hours)\n1 | 52.5\n2 | 37.5\n3 | 50\n10 | 55\n20 | 25\n30 | 55", "keys_en": ["Grouping attribute Pno", "SUM Hours"]}, {"id": "6-agg-5", "concept": "ra-aggregate", "type": "short", "prompt": "기본 관계 대수 연산만으로 표현할 수 없는 요청 세 가지를 쓰시오.", "answer": "1) 집계 함수(SUM, AVERAGE, MAXIMUM, MINIMUM, COUNT)를 쓰는 요청. 2) 속성 값으로 투플을 그룹화하고 그룹마다 집계를 적용하는 요청. 3) 외부 조인 요청.", "keys": ["집계", "그룹별 집계", "외부 조인"], "lesson": "L6-5", "unit": "U6", "prompt_en": "Give three kinds of requests that cannot be expressed with the basic relational algebra operations alone.", "answer_en": "1) Requests that use aggregate functions (SUM, AVERAGE, MAXIMUM, MINIMUM, COUNT). 2) Requests that group tuples by attribute values and apply aggregates to each group. 3) Outer join requests.", "keys_en": ["Aggregation", "Aggregation per group", "Outer joins"]}, {"id": "6-agg-6", "concept": "ra-aggregate", "type": "blank", "prompt": "<그룹화 속성> ℑ <함수 리스트> (R)의 결과는 (a) 속성과 함수 리스트 원소마다 속성 하나로 이루어진다. 그룹화 속성이 없으면 결과는 투플 (b) 개다.", "answer": "(a) 그룹화 / (b) 1", "accept": [["그룹화", "grouping", "그룹화 속성", "그룹", "grouping attributes", "group"], ["1", "하나", "한", "one", "a single"]], "lesson": "L6-5", "unit": "U6", "prompt_en": "The result of <grouping attributes> ℑ <function list> (R) consists of the (a) attributes plus one attribute for each element of the function list. Without grouping attributes, the result has (b) tuple(s).", "answer_en": "(a) grouping / (b) 1"}, {"id": "6-ap-1", "concept": "ra-agg-props", "type": "ox", "prompt": "관계 대수의 집계 함수는 적용할 때 중복을 제거한다.", "answer": false, "explain": "중복을 제거하지 않는다 (급여 합·평균을 제대로 구하려고).", "lesson": "L6-5", "unit": "U6", "prompt_en": "Aggregate functions in relational algebra eliminate duplicates when applied.", "explain_en": "They do not eliminate duplicates (so that sums and averages of salaries come out right)."}, {"id": "6-ap-2", "concept": "ra-agg-props", "type": "mc", "prompt": "관계 대수 집계에서 NULL 값은?", "choices": ["0으로 취급", "고려하지 않는다", "오류를 낸다", "가장 작은 값으로 취급"], "answer": 1, "lesson": "L6-5", "unit": "U6", "prompt_en": "In relational algebra aggregation, what happens to NULL values?", "choices_en": ["Treated as 0", "Not considered", "Cause an error", "Treated as the smallest value"]}, {"id": "6-ap-3", "concept": "ra-agg-props", "type": "short", "prompt": "'관계 대수는 닫힌 수학 체계'라는 말이 집계 함수에 대해 뜻하는 바를 쓰시오.", "answer": "집계 결과도 스칼라 숫자가 아니라 릴레이션이다. 값이 하나, 투플이 하나뿐이어도 릴레이션이라서 다른 관계 대수 연산의 입력으로 쓸 수 있다.", "keys": ["결과도 릴레이션 (스칼라 아님)", "값·투플 하나여도"], "lesson": "L6-5", "unit": "U6", "prompt_en": "Explain what the statement 'relational algebra is a closed mathematical system' means for aggregate functions.", "answer_en": "The result of an aggregation is also a relation, not a scalar number. Even if it has only one value in one tuple, it is a relation and can be used as the input of other relational algebra operations.", "keys_en": ["The result is also a relation (not a scalar)", "Even with one value in one tuple"]}, {"id": "6-oj-1", "concept": "ra-outer", "type": "mc", "prompt": "EMPLOYEE ⟕ Ssn=Mgr_ssn DEPARTMENT 결과에 대한 설명으로 옳은 것은? (COMPANY 상태)", "choices": ["관리자 3명만 나온다", "부서 3개만 나온다", "사원 8명 모두 나오고, 관리하지 않는 사원의 부서 속성은 NULL", "결과가 비어 있다"], "answer": 2, "lesson": "L6-5", "unit": "U6", "prompt_en": "Which statement about the result of EMPLOYEE ⟕ Ssn=Mgr_ssn DEPARTMENT is correct? (COMPANY state)", "choices_en": ["Only the 3 managers appear", "Only the 3 departments appear", "All 8 employees appear, and the department attributes of employees who do not manage a department are NULL", "The result is empty"]}, {"id": "6-oj-2", "concept": "ra-outer", "type": "blank", "prompt": "⟕는 (a) 외부 조인, ⟖는 (b) 외부 조인, ⟗는 (c) 외부 조인이다.", "answer": "(a) LEFT / (b) RIGHT / (c) FULL", "accept": [["LEFT", "left", "왼쪽"], ["RIGHT", "right", "오른쪽"], ["FULL", "full", "완전", "양쪽"]], "lesson": "L6-5", "unit": "U6", "prompt_en": "⟕ is the (a) outer join, ⟖ is the (b) outer join, and ⟗ is the (c) outer join."}, {"id": "6-oj-3", "concept": "ra-outer", "type": "calc", "prompt": "모든 사원의 이름과, 그 사원이 부서를 관리하면 그 부서 이름(관리하지 않으면 NULL)을 관계 대수로 쓰시오.", "answer": "TEMP   ← EMPLOYEE ⟕ Ssn=Mgr_ssn DEPARTMENT\nRESULT ← π Fname, Minit, Lname, Dname (TEMP)\n\n-- COMPANY 상태에서의 결과 (8행)\nFname | Minit | Lname | Dname\nJohn | B | Smith | NULL\nFranklin | T | Wong | Research\nAlicia | J | Zelaya | NULL\nJennifer | S | Wallace | Administration\nRamesh | K | Narayan | NULL\nJoyce | A | English | NULL\nAhmad | V | Jabbar | NULL\nJames | E | Borg | Headquarters", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["⟕ (LEFT OUTER JOIN) Ssn=Mgr_ssn", "π Fname, Minit, Lname, Dname"], "lesson": "L6-5", "unit": "U6", "prompt_en": "In relational algebra, write the names of all employees and, if an employee manages a department, the name of that department (NULL if not).", "answer_en": "TEMP   ← EMPLOYEE ⟕ Ssn=Mgr_ssn DEPARTMENT\nRESULT ← π Fname, Minit, Lname, Dname (TEMP)\n\n-- Result on the COMPANY state (8 rows)\nFname | Minit | Lname | Dname\nJohn | B | Smith | NULL\nFranklin | T | Wong | Research\nAlicia | J | Zelaya | NULL\nJennifer | S | Wallace | Administration\nRamesh | K | Narayan | NULL\nJoyce | A | English | NULL\nAhmad | V | Jabbar | NULL\nJames | E | Borg | Headquarters"}, {"id": "6-oj-4", "concept": "ra-outer", "type": "short", "prompt": "내부 조인(EQUIJOIN, NATURAL JOIN)으로는 안 되고 외부 조인이 필요한 상황을 예와 함께 쓰시오.", "answer": "내부 조인은 조건을 만족하는 투플만 남겨서 짝이 없는 투플이 결과에서 빠진다. 짝이 없어도 한쪽 릴레이션의 투플을 모두 남기고 싶을 때 외부 조인을 쓴다. 예: 모든 사원 목록에 관리하는 부서 이름을 붙이되, 관리하지 않는 사원도 NULL로 포함.", "keys": ["내부 조인은 짝 없는 투플이 빠짐", "외부 조인은 모두 남기고 NULL로 채움", "예"], "lesson": "L6-5", "unit": "U6", "prompt_en": "Describe, with an example, a situation that needs an outer join rather than an inner join (EQUIJOIN, NATURAL JOIN).", "answer_en": "An inner join keeps only the tuples that satisfy the condition, so unmatched tuples are dropped from the result. An outer join is used when we want to keep all tuples of one relation even without a match. Example: a list of all employees with the name of the department each one manages, including employees who manage none, with NULL.", "keys_en": ["Inner joins drop unmatched tuples", "Outer joins keep them all, padded with NULL", "Example"]}, {"id": "6-oj-5", "concept": "ra-outer", "type": "calc", "prompt": "모든 부서의 이름과, 그 부서가 통제하는 프로젝트가 있으면 프로젝트 이름을 관계 대수로 쓰시오 (프로젝트가 없는 부서도 포함).", "answer": "TEMP   ← DEPARTMENT ⟕ Dnumber=Dnum PROJECT\nRESULT ← π Dname, Pname (TEMP)\n\n-- COMPANY 상태에서의 결과 (6행)\nDname | Pname\nResearch | ProductX\nResearch | ProductY\nResearch | ProductZ\nAdministration | Computerization\nAdministration | Newbenefits\nHeadquarters | Reorganization\n\nCOMPANY 상태에서는 모든 부서가 프로젝트를 통제해서 NULL 행이 없다.", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["DEPARTMENT ⟕ PROJECT", "Dnumber=Dnum", "π Dname, Pname"], "lesson": "L6-5", "unit": "U6", "prompt_en": "In relational algebra, write the name of every department and, if it controls projects, the project names (including departments with no projects).", "answer_en": "TEMP   ← DEPARTMENT ⟕ Dnumber=Dnum PROJECT\nRESULT ← π Dname, Pname (TEMP)\n\n-- Result on the COMPANY state (6 rows)\nDname | Pname\nResearch | ProductX\nResearch | ProductY\nResearch | ProductZ\nAdministration | Computerization\nAdministration | Newbenefits\nHeadquarters | Reorganization\n\nOn the COMPANY state every department controls a project, so there are no NULL rows."}, {"id": "6-pj-1", "concept": "ra-practice-join", "type": "calc", "prompt": "'Stafford'에 있는 모든 프로젝트에 대해 프로젝트 번호, 통제 부서 번호, 부서 관리자의 성, 주소, 생일을 관계 대수로 쓰시오. (연습 2)", "answer": "STAFFORD_PROJS ← σ Plocation='Stafford' (PROJECT)\nCONTR_DEPTS    ← STAFFORD_PROJS ⋈ Dnum=Dnumber DEPARTMENT\nPROJ_DEPT_MGRS ← CONTR_DEPTS ⋈ Mgr_ssn=Ssn EMPLOYEE\nRESULT         ← π Pnumber, Dnum, Lname, Address, Bdate (PROJ_DEPT_MGRS)\n\n-- COMPANY 상태에서의 결과 (2행)\nPnumber | Dnum | Lname | Address | Bdate\n10 | 4 | Wallace | 291 Berry, Bellaire, TX | 1941-06-20\n30 | 4 | Wallace | 291 Berry, Bellaire, TX | 1941-06-20", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["σ Plocation='Stafford'", "⋈ Dnum=Dnumber", "⋈ Mgr_ssn=Ssn", "π 5개 속성"], "slot": 15, "pts": 10, "lesson": "L6-6", "unit": "U6", "prompt_en": "In relational algebra, for every project located in 'Stafford', write the project number, the controlling department number, and the department manager's last name, address and birth date. (Exercise 2)", "answer_en": "STAFFORD_PROJS ← σ Plocation='Stafford' (PROJECT)\nCONTR_DEPTS    ← STAFFORD_PROJS ⋈ Dnum=Dnumber DEPARTMENT\nPROJ_DEPT_MGRS ← CONTR_DEPTS ⋈ Mgr_ssn=Ssn EMPLOYEE\nRESULT         ← π Pnumber, Dnum, Lname, Address, Bdate (PROJ_DEPT_MGRS)\n\n-- Result on the COMPANY state (2 rows)\nPnumber | Dnum | Lname | Address | Bdate\n10 | 4 | Wallace | 291 Berry, Bellaire, TX | 1941-06-20\n30 | 4 | Wallace | 291 Berry, Bellaire, TX | 1941-06-20", "keys_en": ["σ Plocation='Stafford'", "⋈ Dnum=Dnumber", "⋈ Mgr_ssn=Ssn", "π of 5 attributes"]}, {"id": "6-pj-2", "concept": "ra-practice-join", "type": "calc", "prompt": "'Administration' 부서에서 일하는 사원이 일하는 프로젝트의 이름과 그 사원의 성을 관계 대수로 쓰시오.", "answer": "ADMIN    ← σ Dname='Administration' (DEPARTMENT)\nADMIN_E  ← ADMIN ⋈ Dnumber=Dno EMPLOYEE\nADMIN_W  ← ADMIN_E ⋈ Ssn=Essn WORKS_ON\nADMIN_P  ← ADMIN_W ⋈ Pno=Pnumber PROJECT\nRESULT   ← π Lname, Pname (ADMIN_P)\n\n-- COMPANY 상태에서의 결과 (6행)\nLname | Pname\nWallace | Reorganization\nWallace | Newbenefits\nJabbar | Computerization\nJabbar | Newbenefits\nZelaya | Computerization\nZelaya | Newbenefits", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["σ Dname", "⋈ Dnumber=Dno", "⋈ Ssn=Essn", "⋈ Pno=Pnumber", "π"], "lesson": "L6-6", "unit": "U6", "prompt_en": "In relational algebra, write the names of the projects that employees of the 'Administration' department work on, together with the employees' last names.", "answer_en": "ADMIN    ← σ Dname='Administration' (DEPARTMENT)\nADMIN_E  ← ADMIN ⋈ Dnumber=Dno EMPLOYEE\nADMIN_W  ← ADMIN_E ⋈ Ssn=Essn WORKS_ON\nADMIN_P  ← ADMIN_W ⋈ Pno=Pnumber PROJECT\nRESULT   ← π Lname, Pname (ADMIN_P)\n\n-- Result on the COMPANY state (6 rows)\nLname | Pname\nWallace | Reorganization\nWallace | Newbenefits\nJabbar | Computerization\nJabbar | Newbenefits\nZelaya | Computerization\nZelaya | Newbenefits"}, {"id": "6-pj-3", "concept": "ra-practice-join", "type": "calc", "prompt": "부양가족 중 배우자(Relationship='Spouse')가 있는 사원의 이름과 배우자 이름을 관계 대수로 쓰시오.", "answer": "SPOUSES ← σ Relationship='Spouse' (DEPENDENT)\nES      ← EMPLOYEE ⋈ Ssn=Essn SPOUSES\nRESULT  ← π Fname, Lname, Dependent_name (ES)\n\n-- COMPANY 상태에서의 결과 (3행)\nFname | Lname | Dependent_name\nFranklin | Wong | Joy\nJennifer | Wallace | Abner\nJohn | Smith | Elizabeth", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["σ Relationship='Spouse'", "⋈ Ssn=Essn", "π"], "lesson": "L6-6", "unit": "U6", "prompt_en": "In relational algebra, write the names of employees who have a spouse among their dependents (Relationship='Spouse'), together with the spouse's name.", "answer_en": "SPOUSES ← σ Relationship='Spouse' (DEPENDENT)\nES      ← EMPLOYEE ⋈ Ssn=Essn SPOUSES\nRESULT  ← π Fname, Lname, Dependent_name (ES)\n\n-- Result on the COMPANY state (3 rows)\nFname | Lname | Dependent_name\nFranklin | Wong | Joy\nJennifer | Wallace | Abner\nJohn | Smith | Elizabeth"}, {"id": "6-pj-4", "concept": "ra-practice-join", "type": "calc", "prompt": "Houston에 위치(DEPT_LOCATIONS)가 있는 부서의 이름과 그 부서 관리자의 성을 관계 대수로 쓰시오.", "answer": "HLOC   ← σ Dlocation='Houston' (DEPT_LOCATIONS)\nHDEPT  ← HLOC * DEPARTMENT                    (공통 속성 Dnumber로 자연 조인)\nHMGR   ← HDEPT ⋈ Mgr_ssn=Ssn EMPLOYEE\nRESULT ← π Dname, Lname (HMGR)\n\n-- COMPANY 상태에서의 결과 (2행)\nDname | Lname\nHeadquarters | Borg\nResearch | Wong", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["σ Dlocation='Houston'", "* DEPARTMENT (Dnumber)", "⋈ Mgr_ssn=Ssn", "π Dname, Lname"], "lesson": "L6-6", "unit": "U6", "prompt_en": "In relational algebra, write the names of departments that have a location (DEPT_LOCATIONS) in Houston, together with the last name of each department's manager.", "answer_en": "HLOC   ← σ Dlocation='Houston' (DEPT_LOCATIONS)\nHDEPT  ← HLOC * DEPARTMENT                    (natural join on the common attribute Dnumber)\nHMGR   ← HDEPT ⋈ Mgr_ssn=Ssn EMPLOYEE\nRESULT ← π Dname, Lname (HMGR)\n\n-- Result on the COMPANY state (2 rows)\nDname | Lname\nHeadquarters | Borg\nResearch | Wong"}, {"id": "6-pj-5", "concept": "ra-practice-join", "type": "short", "prompt": "관계 대수 질의를 작성할 때의 일반적인 순서(요령)를 쓰시오.", "answer": "조건이 걸린 릴레이션에 먼저 σ를 적용해 투플 수를 줄이고, FK–PK 관계를 따라 ⋈로 필요한 릴레이션을 잇고, 마지막에 π로 원하는 속성만 남긴다. 각 단계를 중간 릴레이션 이름으로 나눠 쓴다.", "keys": ["σ 먼저", "FK–PK 따라 ⋈", "마지막에 π", "중간 릴레이션으로 나눔"], "lesson": "L6-6", "unit": "U6", "prompt_en": "Describe the general order (tips) for writing a relational algebra query.", "answer_en": "First apply σ to the relations that have conditions to reduce the number of tuples, then follow the FK–PK links with ⋈ to connect the needed relations, and finally keep only the desired attributes with π. Write each step as a named intermediate relation.", "keys_en": ["σ first", "⋈ following FK–PK links", "π last", "Split into intermediate relations"]}, {"id": "6-pj-6", "concept": "ra-practice-join", "type": "ox", "prompt": "관계 대수에서 σ를 조인보다 먼저 적용하면 중간 결과가 작아져 효율적이다.", "answer": true, "lesson": "L6-6", "unit": "U6", "prompt_en": "In relational algebra, applying σ before a join is more efficient because the intermediate results become smaller."}, {"id": "6-pu-1", "concept": "ra-practice-union", "type": "calc", "prompt": "성이 'Smith'인 사원이 일꾼으로든, 그 프로젝트를 통제하는 부서의 관리자로든 관련된 프로젝트 번호를 관계 대수로 쓰시오. (연습 3)", "answer": "SMITHS(Essn)             ← π Ssn (σ Lname='Smith' (EMPLOYEE))\nSMITH_WORKER_PROJS       ← π Pno (WORKS_ON * SMITHS)\nMGRS                     ← π Lname, Dnumber (EMPLOYEE ⋈ Ssn=Mgr_ssn DEPARTMENT)\nSMITH_MANAGED_DEPTS(Dnum) ← π Dnumber (σ Lname='Smith' (MGRS))\nSMITH_MGR_PROJS(Pno)     ← π Pnumber (SMITH_MANAGED_DEPTS * PROJECT)\nRESULT                   ← SMITH_WORKER_PROJS ∪ SMITH_MGR_PROJS\n\n-- COMPANY 상태에서의 결과 (2행)\nPno\n1\n2", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["일꾼 쪽: SMITHS(Essn) * WORKS_ON", "관리자 쪽: Mgr_ssn 조인 → Dnum → PROJECT", "속성 이름을 Pno로 맞춤", "∪"], "slot": 15, "pts": 10, "lesson": "L6-6", "unit": "U6", "prompt_en": "In relational algebra, write the project numbers of projects that involve an employee whose last name is 'Smith', either as a worker or as a manager of the department that controls the project. (Exercise 3)", "answer_en": "SMITHS(Essn)             ← π Ssn (σ Lname='Smith' (EMPLOYEE))\nSMITH_WORKER_PROJS       ← π Pno (WORKS_ON * SMITHS)\nMGRS                     ← π Lname, Dnumber (EMPLOYEE ⋈ Ssn=Mgr_ssn DEPARTMENT)\nSMITH_MANAGED_DEPTS(Dnum) ← π Dnumber (σ Lname='Smith' (MGRS))\nSMITH_MGR_PROJS(Pno)     ← π Pnumber (SMITH_MANAGED_DEPTS * PROJECT)\nRESULT                   ← SMITH_WORKER_PROJS ∪ SMITH_MGR_PROJS\n\n-- Result on the COMPANY state (2 rows)\nPno\n1\n2", "keys_en": ["Worker side: SMITHS(Essn) * WORKS_ON", "Manager side: join on Mgr_ssn → Dnum → PROJECT", "Attribute names made Pno", "∪"]}, {"id": "6-pu-2", "concept": "ra-practice-union", "type": "calc", "prompt": "4번 부서가 통제하는 프로젝트이거나, 'Wong'이 일하는 프로젝트의 번호를 관계 대수로 쓰시오.", "answer": "D4_PROJS(Pno) ← π Pnumber (σ Dnum=4 (PROJECT))\nWONG(Essn)    ← π Ssn (σ Lname='Wong' (EMPLOYEE))\nWONG_PROJS    ← π Pno (WORKS_ON * WONG)\nRESULT        ← D4_PROJS ∪ WONG_PROJS\n\n-- COMPANY 상태에서의 결과 (5행)\nPnumber\n2\n3\n10\n20\n30", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["σ Dnum=4 → π (이름 Pno)", "Wong의 프로젝트", "∪ (타입 호환)"], "lesson": "L6-6", "unit": "U6", "prompt_en": "In relational algebra, write the numbers of projects that are controlled by department 4 or that 'Wong' works on.", "answer_en": "D4_PROJS(Pno) ← π Pnumber (σ Dnum=4 (PROJECT))\nWONG(Essn)    ← π Ssn (σ Lname='Wong' (EMPLOYEE))\nWONG_PROJS    ← π Pno (WORKS_ON * WONG)\nRESULT        ← D4_PROJS ∪ WONG_PROJS\n\n-- Result on the COMPANY state (5 rows)\nPnumber\n2\n3\n10\n20\n30", "keys_en": ["σ Dnum=4 → π (renamed Pno)", "Wong's projects", "∪ (type compatible)"]}, {"id": "6-pu-3", "concept": "ra-practice-union", "type": "short", "prompt": "연습 3에서 SMITHS(Essn), SMITH_MGR_PROJS(Pno)처럼 속성 이름을 바꾸는 이유를 쓰시오.", "answer": "SMITHS(Essn)은 WORKS_ON과 자연 조인할 때 Essn으로 조인되게 하려고, SMITH_MGR_PROJS(Pno)는 SMITH_WORKER_PROJS(Pno)와 ∪할 때 두 결과의 속성 이름을 맞추려고(타입 호환, 결과 속성 이름 통일) 바꾼다.", "keys": ["자연 조인 속성 맞추기", "∪를 위한 이름 맞추기"], "lesson": "L6-6", "unit": "U6", "prompt_en": "In Exercise 3, explain why attributes are renamed, as in SMITHS(Essn) and SMITH_MGR_PROJS(Pno).", "answer_en": "SMITHS(Essn) is renamed so that the natural join with WORKS_ON matches on Essn, and SMITH_MGR_PROJS(Pno) is renamed so that the attribute names of the two results match when applying ∪ with SMITH_WORKER_PROJS(Pno) (type compatibility, uniform result attribute names).", "keys_en": ["Matching attributes for the natural join", "Matching names for ∪"]}, {"id": "6-pu-4", "concept": "ra-practice-union", "type": "calc", "prompt": "Houston에 사는 사원이거나 Houston에 있는 프로젝트에서 일하는 사원의 Ssn을 관계 대수로 쓰시오.", "answer": "LIVE(Ssn)  ← π Ssn (σ Address LIKE '%Houston%' (EMPLOYEE))\nHP(Pno)    ← π Pnumber (σ Plocation='Houston' (PROJECT))\nWORK(Ssn)  ← π Essn (WORKS_ON * HP)\nRESULT     ← LIVE ∪ WORK\n\n-- COMPANY 상태에서의 결과 (7행)\nSsn\n123456789\n333445555\n453453453\n666884444\n888665555\n987654321\n987987987", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["사는 곳 σ → π Ssn", "Houston 프로젝트 → WORKS_ON → π Essn (이름 Ssn)", "∪"], "lesson": "L6-6", "unit": "U6", "prompt_en": "In relational algebra, write the Ssn of employees who live in Houston or work on a project located in Houston.", "answer_en": "LIVE(Ssn)  ← π Ssn (σ Address LIKE '%Houston%' (EMPLOYEE))\nHP(Pno)    ← π Pnumber (σ Plocation='Houston' (PROJECT))\nWORK(Ssn)  ← π Essn (WORKS_ON * HP)\nRESULT     ← LIVE ∪ WORK\n\n-- Result on the COMPANY state (7 rows)\nSsn\n123456789\n333445555\n453453453\n666884444\n888665555\n987654321\n987987987", "keys_en": ["σ on where they live → π Ssn", "Houston projects → WORKS_ON → π Essn (renamed Ssn)", "∪"]}, {"id": "6-pd-1", "concept": "ra-practice-diff", "type": "calc", "prompt": "부양가족이 없는 사원의 이름을 관계 대수로 쓰시오. (연습 4)", "answer": "ALL_EMPS            ← π Ssn (EMPLOYEE)\nEMPS_WITH_DEPS(Ssn) ← π Essn (DEPENDENT)\nEMPS_WITHOUT_DEPS   ← ALL_EMPS − EMPS_WITH_DEPS\nRESULT              ← π Lname, Fname (EMPS_WITHOUT_DEPS * EMPLOYEE)\n\n-- COMPANY 상태에서의 결과 (5행)\nLname | Fname\nZelaya | Alicia\nNarayan | Ramesh\nEnglish | Joyce\nJabbar | Ahmad\nBorg | James", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["π Ssn (EMPLOYEE)", "π Essn (DEPENDENT), 이름 Ssn", "−", "EMPLOYEE와 자연 조인 후 π"], "slot": 15, "pts": 10, "lesson": "L6-6", "unit": "U6", "prompt_en": "In relational algebra, write the names of employees who have no dependents. (Exercise 4)", "answer_en": "ALL_EMPS            ← π Ssn (EMPLOYEE)\nEMPS_WITH_DEPS(Ssn) ← π Essn (DEPENDENT)\nEMPS_WITHOUT_DEPS   ← ALL_EMPS − EMPS_WITH_DEPS\nRESULT              ← π Lname, Fname (EMPS_WITHOUT_DEPS * EMPLOYEE)\n\n-- Result on the COMPANY state (5 rows)\nLname | Fname\nZelaya | Alicia\nNarayan | Ramesh\nEnglish | Joyce\nJabbar | Ahmad\nBorg | James", "keys_en": ["π Ssn (EMPLOYEE)", "π Essn (DEPENDENT), renamed Ssn", "−", "Natural join with EMPLOYEE, then π"]}, {"id": "6-pd-2", "concept": "ra-practice-diff", "type": "calc", "prompt": "부양가족이 하나 이상 있는 관리자의 이름을 관계 대수로 쓰시오. (연습 5)", "answer": "MGRS(Ssn)           ← π Mgr_ssn (DEPARTMENT)\nEMPS_WITH_DEPS(Ssn) ← π Essn (DEPENDENT)\nMGRS_WITH_DEPS      ← MGRS ∩ EMPS_WITH_DEPS\nRESULT              ← π Lname, Fname (MGRS_WITH_DEPS * EMPLOYEE)\n\n-- COMPANY 상태에서의 결과 (2행)\nLname | Fname\nWong | Franklin\nWallace | Jennifer", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["π Mgr_ssn → Ssn", "π Essn → Ssn", "∩", "자연 조인 후 π"], "slot": 15, "pts": 10, "lesson": "L6-6", "unit": "U6", "prompt_en": "In relational algebra, write the names of managers who have at least one dependent. (Exercise 5)", "answer_en": "MGRS(Ssn)           ← name, Lname (NON_SUPS * EMPLOYEE)\n\n-- COMPANY 상태에서의 결과 (5행)\nFname | Lname\nJohn | Smith\nAlicia | Zelaya\nRamesh | Narayan\nJoyce | English\nAhmad | Jabbar", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["π Super_ssn을 Ssn으로 이름 바꿈", "ALL_EMPS − SUPS", "자연 조인 후 π"], "lesson": "L6-6", "unit": "U6", "prompt_en": "In relational algebra, write the names of employees who have no subordinates (who supervise no one).", "answer_en": "ALL_EMPS   ← π Ssn (EMPLOYEE)\nSUPS(Ssn)  ← π Super_ssn (EMPLOYEE)\nNON_SUPS   ← ALL_EMPS − SUPS\nRESULT     ← π Fname, Lname (NON_SUPS * EMPLOYEE)\n\n-- Result on the COMPANY state (5 rows)\nFname | Lname\nJohn | Smith\nAlicia | Zelaya\nRamesh | Narayan\nJoyce | English\nAhmad | Jabbar", "keys_en": ["Rename π Super_ssn to Ssn", "ALL_EMPS − SUPS", "Natural join, then π"]}, {"id": "6-pd-5", "concept": "ra-practice-diff", "type": "calc", "prompt": "4번 부서 사원이면서 Stafford에 있는 프로젝트에서 일하는 사원의 Ssn을 교집합으로 쓰시오.", "answer": "D4(Ssn)     ← π Ssn (σ Dno=4 (EMPLOYEE))\nSP(Pno)     ← π Pnumber (σ Plocation='Stafford' (PROJECT))\nSW(Ssn)     ← π Essn (WORKS_ON * SP)\nRESULT      ← D4 ∩ SW\n\n-- COMPANY 상태에서의 결과 (3행)\nSsn\n987654321\n987987987\n999887777", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ss <script>
(() => {
const DATA = JSON.parse(document.getElementById("db-data").textContent);
const UNITS = DATA.units;
const LESSONS = UNITS.flatMap(u => u.lessons.map(l => ({ ...l, unit:u.id, unitTitle:u.title, unitTitle_en:u.title_en })));
const LES = Object.fromEntries(LESSONS.map(l => [l.id, l]));
const SEC = {};  // concept id -> {id,title,lesson}
for (const l of LESSONS) for (const s of l.secs) SEC[s.id] = { ...s, lesson:l.id };
const TYPE = { mc:"객관식", ox:"OX", blank:"빈칸", short:"서술", calc:"풀이" };
const PASS = 0.7;
const WEIGHT = DATA.weights || {};
const wOf = c => WEIGHT[c] || 2;
const QUICK = t => t === "mc" || t === "ox" || t === "blank";
const META = DATA.meta;
const EXAM_DAY = new Date(2026, 9, 23);
const MOCK_MIN = META.mockMin;
const BOOT = Date.now();  // 이 페이지를 연 시각: quiz.start가 없는 예전 퀴즈는 이 시각 이전 기록만 자동 통과
// 예상 시험지: [레슨, 슬롯, 배점]
const EXAM24 = META.blueprint;
const SLOT_PTS = Object.fromEntries(EXAM24.map(([,s,p]) => [s, p]));

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let LANG = "ko"; try { LANG = JSON.parse(localStorage.getItem("db-lang")) || "ko"; } catch {}
function syncLang(){ document.querySelectorAll("[data-lang]").forEach(b => { b.classList.toggle("on", b.dataset.lang === LANG); b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)); }); document.documentElement.lang = LANG; }
setTimeout(syncLang, 0);
const T = (o, k) => (!o ? "" : (LANG === "en" && o[k + "_en"] != null) ? o[k + "_en"] : (o[k] ?? ""));  // 학습 탭 한/영
const ls = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const norm = s => String(s ?? "").toLowerCase().replace(/[\s()（）.,'"“”‘’·\-_]/g, "");

let extra = [], attempts = [], progress = {};
let db = null, sample = null;
let view = ls.get("db-view", "learn");
let L = ls.get("db-learn", { lesson:null, mode:"home", quiz:null, review:null });  // learn state
let filters = ls.get("db-filters", { unit:"", concept:"", type:"", status:"" });
let curId = ls.get("db-cur", null);
let mock = ls.get("db-mock", null);
const results = {};   // practice: qid -> result
const saveL = () => ls.set("db-learn", L);

/* ── derived ───────────────────────── */
const allQ = () => DATA.questions.concat(extra);
const qById = id => allQ().find(q => q.id === id);
function latestBy(key){
  const m = {};
  for (const a of attempts){ const k = a[key]; if (k && (!m[k] || a.at > m[k].at)) m[k] = a; }
  return m;
}
const latestQ = () => latestBy("qid");
const latestC = () => latestBy("concept");
function level(score){ if (score == null) return "none"; return score >= .85 ? "good" : score >= PASS ? "mid" : "weak"; }
const LV = { none:"미시도", weak:"약점", mid:"보통", good:"숙달" };
const lessonConcepts = lid => LES[lid].secs.filter(s => allQ().some(q => q.concept === s.id)).map(s => s.id);
const lessonDone = lid => !!progress[lid]?.done;
function lessonUnlocked(lid){ return true; }  // 시험 직전이라 잠금 해제: 어느 레슨이든 바로 열림
function lessonWeak(lid){ const lc = latestC(); return lessonConcepts(lid).filter(c => lc[c] && lc[c].score < PASS); }
function nextLesson(){ return LESSONS.find(l => !lessonDone(l.id)) || null; }
function srcOf(concept){ const s = SEC[concept]; if (!s) return ""; const l = LES[s.lesson]; return `${l.id} §${T(s,"title")} · ${l.src}`; }

/* ── storage ───────────────────────── */
function setStoreChip(){ const el = $("#store"); el.textContent = db ? "기록 저장: 클라우드" : "기록 저장: 이 브라우저만"; el.className = "chip " + (db ? "live" : "local"); }
function setGraderChip(){ $("#grader").textContent = sample ? "채점: Claude + 자동/자가" : "채점: 자동 + 자가채점"; }
function toastErr(msg){ const el = document.createElement("div"); el.className = "err"; el.textContent = msg; $("main").prepend(el); setTimeout(()=>el.remove(), 6000); }
async function saveAttempt(a){
  a.at = Date.now(); a.answer = String(a.answer || "").slice(0, 6000);
  const q = qById(a.qid); a.concept = q?.concept || ""; a.lesson = q?.lesson || "";
  const id = a.at + "-" + Math.random().toString(36).slice(2,8);
  if (db){
    try { await db.collection("attempts").doc(id).set(a); if (!attempts.find(x => x._id === id)) attempts.push({ ...a, _id:id }); return id; }

  attempts.push({ ...a, _id:id }); return id;

async function updateAttempt(id, patch){
  const j = attempts.findIndex(x => x._id === id); if (j >= 0) Object.assign(attempts[j], patch);

  const loc = ls.get("db-attempts", []); const i = loc.findIndex(x => x._id === id);
  if (i >= 0){ Object.assign(loc[i], patch); ls.set("db-attempts", loc); }

async function saveProgress(lid, passedPatch){
  const prev = progress[lid] || {};
  const passed = { ...(prev.passed || {}), ...passedPatch };
  const done = prev.done || lessonConcepts(lid).every(c => passed[c]);
  progress[lid] = { ...prev, passed, done, at:Date.now() };
  const loc = ls.get("db-progress", {}); loc[lid] = progress[lid]; ls.set("db-progress", loc);
  if (db){ try { await db.collection("progress").doc(lid).set(progress[lid]); } catch {} }

/* ── grading ───────────────────────── */
function autoGrade(q, ans){
  if (q.type === "mc"){ const ok = Number(ans) === q.answer; return { score: ok ? 1 : 0, feedback: ok ? "정답!" : `정답은 ${q.answer+1}번.` }; }
  if (q.type === "ox"){ const ok = ans === q.answer; return { score: ok ? 1 : 0, feedback: ok ? "정답!" : `정답은 ${q.answer ? "O" : "X"}.` }; }
  if (q.type === "blank"){
    const arr = Array.isArray(ans) ? ans : [];
    let hit = 0; const missed = [];
    q.accept.forEach((alts, i) => {
      const v = norm(arr[i]);
      if (v && alts.some(a => norm(a) === v)) hit++; else missed.push(`(${String.fromCharCode(97+i)}) 정답: ${alts[0]}`);
    });
    const score = hit / q.accept.length;
    return { score, missed, feedback: score === 1 ? "빈칸 전부 맞았어." : `${q.accept.length}칸 중 ${hit}칸 맞음. 표현이 달라서 틀린 거면 아래 버튼으로 고쳐.` };
  }
  return null;
}
function gradingPrompt(q, ans){
  return `You grade one answer from a midterm in Databases (데이터베이스, Chung-Ang University, Elmasri & Navathe "Fundamentals of Database Systems" 7th ed.). The course is taught in English; the student may answer in Korean or English.

Grade the student's answer against the model answer and key points.
- Accept synonyms and Korean/English term equivalents (e.g. 참조 무결성 = referential integrity, 개체 = entity, 투플 = tuple).
- Short answer: credit each key point proportionally. Brevity is fine.
- SQL: judge by whether the query returns the correct result on the given schema, not by matching the model text. Accept any equivalent formulation (JOIN ... ON vs WHERE join condition, IN vs EXISTS vs = ANY, aliases or none, keyword case, missing final semicolon). Deduct for: a missing join condition (Cartesian product), a wrong or missing selection condition, wrong attributes in SELECT, non-grouped attribute in SELECT with GROUP BY, a group condition put in WHERE instead of HAVING, missing DISTINCT only when the question explicitly asks for distinct values. Minor syntax slips that a reader would fix immediately lose little.
- Relational algebra: accept Greek symbols (σ π ⋈ ρ ∪ ∩ − × ÷ ℑ) or words (SELECT, PROJECT, JOIN, RENAME, UNION, MINUS, DIVISION, FUNCTION), either a single nested expression or a sequence of named intermediate relations (TEMP ← ...). Judge correctness of the operations and conditions; the order of independent selections does not matter.
- ER design / ER-to-relational mapping: judge entities, keys, relationship cardinality and participation, and where foreign keys go (FK on the N-side for 1:N, separate relation with composite PK for M:N and multivalued attributes, owner PK + partial key for weak entities). Accept reasonable alternatives that the textbook also allows (e.g. 1:1 FK on either side, though the total-participation side is preferred).
- Constraint-violation questions: the student must name the violated constraint(s) correctly; extra wrong constraints lose credit.
- An empty or "모르겠다"-style answer scores 0.

Question type: ${q.type}
Question: ${q.prompt}${q.prompt_en ? "\n(English version) " + q.prompt_en : ""}
${q.code ? "Schema/data given:\n" + q.code + "\n" : ""}
Model answer:
${q.answer}${q.answer_en ? "\n(English version) " + q.answer_en : ""}
${q.keys ? "Key points: " + q.keys.join(" | ") + (q.keys_en ? " || (English) " + q.keys_en.join(" | ") : "") + "\n" : ""}${q.explain ? "Note: " + q.explain + "\n" : ""}
Student answer:
<<<
${ans}
>>>

Reply with only this JSON:
{"score": <number 0..1>, "verdict": "correct" | "partial" | "wrong", "feedback": "<Korean, casual 반말, 1-3 sentences, concrete: what was right/wrong>", "missed": ["<short Korean item the student missed or got wrong>", ...]}`;
}
async function claudeGrade(q, ans){
  const r = await sample.json(gradingPrompt(q, ans), { modelTier: q.type === "calc" ? "default" : "quick" });
  let score = Number(r?.score); if (!isFinite(score)) score = 0; score = Math.max(0, Math.min(1, score));
  return { score, feedback:String(r?.feedback || ""), missed: Array.isArray(r?.missed) ? r.missed.map(String).slice(0,6) : [] };
}
function sampleErrMsg(e){
  const c = e?.code;
  if (c === "not_granted") return "Claude 채점이 허용되지 않았어. 답 보고 자가채점해줘.";
  if (c === "rate_limited") return "채점 요청이 몰렸어. 잠깐 뒤에 다시 눌러줘.";
  return "채점에 실패했어 (" + (c || "error") + "). 자가채점으로 기록할 수 있어.";
}

function rankQs(list){
  const lq = latestQ();
  return list.map(q => ({ q, k: attempts.filter(a => a.qid === q.id).length * 10 + (lq[q.id] ? lq[q.id].score * 3 : 0) + Math.random() * 2 }))
    .sort((a,b) => a.k - b.k).map(x => x.q);
}
// n questions for one concept: one written (short/calc) when n >= 2 and available, rest quick; quick ones first
function pickN(concept, n, avoid){
  const cand = allQ().filter(q => q.concept === concept);
  let pool = cand.filter(q => !avoid.has(q.id)); if (pool.length < n) pool = pool.concat(rankQs(cand.filter(q => avoid.has(q.id))));
  const quick = rankQs(pool.filter(q => QUICK(q.type))), written = rankQs(pool.filter(q => !QUICK(q.type)));
  let out = [];
  if (n === 1) out = rankQs(pool).slice(0, 1);
  else {
    const w = written.length ? 1 : 0;
    out = quick.slice(0, n - w).concat(written.slice(0, w));
    for (const q of rankQs(pool)) if (out.length < n && !out.includes(q)) out.push(q);
  }
  out = [...new Set(out)].slice(0, n);
  return out.filter(q => QUICK(q.type)).concat(out.filter(q => !QUICK(q.type)));
}

function startQuiz(lid, concepts, round){

  const items = [];

  L.quiz = { lessonId:lid, round, items, idx:0, res:{}, drafts:{}, used:[...used], start:Date.now() };
  L.mode = "quiz"; L.lesson = lid; saveL(); renderLearn(); window.scrollTo({ top:0 });
}

}

function recommendations(n){
  const lq = latestQ();
  const studied = lid => lessonDone(lid) || attempts.some(a => a.lesson === lid);
  return allQ().map(q => {
    const l = lq[q.id];
    if (l && l.score >= .85) return null;
    const need = l ? 1 - l.score : 1.1;
    const s = need * (1 + wOf(q.concept)) * (q.slot ? 1.6 : 1) * (studied(q.lesson) ? 1 : .25) * (0.9 + Math.random() * 0.2);
    return { q, s };
  }).filter(Boolean).sort((a,b) => b.s - a.s).slice(0, n).map(x => x.q);
}

function filteredQs(){
  const lq = latestQ();
  return allQ().filter(q => {
    if (filters.lesson && q.lesson !== filters.lesson) return false;
    if (filters.unit && q.unit !== filters.unit) return false;
    if (filters.concept && q.concept !== filters.concept) return false;
    if (filters.type && q.type !== filters.type) return false;
    const l = lq[q.id];
    if (filters.status === "new" && l) return false;
    if (filters.status === "wrong" && !(l && l.score < PASS)) return false;
    if (filters.status === "notgood" && l && l.score >= .85) return false;
    if (filters.status === "exam" && !q.slot) return false;
    return true;
  });
}

let timerHandle = null;

document.addEventListener("change", e => {
  const t = e.target; const map = { "f-unit":"unit", "f-concept":"concept", "f-type":"type", "f-status":"status" };
  if (!map[t.id]) return; filters[map[t.id]] = t.value; filters.lesson = ""; if (t.id === "f-unit") filters.concept = "";
  ls.set("db-filters", filters); curId = null; renderPractice();
});

/* ── boot ───────────────────────── */
async function boot(){
  attempts = ls.get("db-attempts", []).map(a => ({ ...a, _id:a._id || "local" }));
  progress = ls.get("db-progress", {});
  if (L.mode === "quiz" && !L.quiz) L.mode = "home";
  show(view); setStoreChip(); setGraderChip();
  if (!window.claude?.use) return;
  claude.use("sample").then(s => { sample = s; setGraderChip(); renderAll(); }).catch(() => {});
  const d = await claude.use("db").catch(() => null);
  if (!d) return;
  db = d; setStoreChip();
  db.collection("attempts").orderBy("at","desc").limit(2000).onSnapshot(snap => {
    const remote = snap.docs.map(x => ({ ...x.data(), _id:x.id }));
    const local = ls.get("db-attempts", []).map(a => ({ ...a, _id:a._id || "local" }));
    attempts = remote.concat(local.filter(l => !remote.find(r => r._id === l._id)));
    renderAll();
  }, () => { db = null; setStoreChip(); });
  db.collection("progress").onSnapshot(snap => {
    const remote = Object.fromEntries(snap.docs.map(x => [x.id, x.data()]));
    progress = { ...ls.get("db-progress", {}), ...remote };
    renderAll();
  }, () => {});
  db.collection("extra_questions").onSnapshot(snap => {
    extra = snap.docs.map(x => ({ id:x.id, type:"short", prompt:"", answer:"", ...x.data() }))
      .filter(q => SEC[q.concept]).map(q => ({ ...q, lesson:SEC[q.concept].lesson, unit:LES[SEC[q.concept].lesson].unit, extra:true }));
    renderAll();
  }, () => {});
}
const BK_PFX = "db-", BK_NAME = "DB";
/* ── 기록 백업: 내보내기(.json) / 가져오기 ─────────── 클라우드·이 브라우저 기록을 파일로 옮긴다 (Claude 앱 ↔ 로컬 html). */
function bkKey(a){ return a._id && a._id !== "local" ? a._id : a.at + "|" + a.qid; }
function bkData(){
  const out = { app:BK_PFX, name:BK_NAME, at:Date.now(), attempts:attempts.map(a => ({ ...a })), progress:{ ...progress } };
  if (typeof checks !== "undefined") out.checks = checks.map(a => ({ ...a }));
  return out;
}
function bkMsg(t, bad){ const el = document.getElementById("bk-msg"); if (el){ el.textContent = t; el.style.color = bad ? "var(--bad)" : ""; } }
async function bkExport(){
  const d = bkData(), txt = JSON.stringify(d);
  const name = `${BK_PFX}backup-${new Date().toISOString().slice(0,10)}.json`;  // 한글 파일명은 브라우저가 버리는 경우가 있어서 ASCII
  const n = `문항 기록 ${d.attempts.length}개 · 레슨 ${Object.keys(d.progress).length}개${d.checks ? ` · 점검 ${d.checks.length}개` : ""}`;
  const dl = window.claude?.use ? await claude.use("downloads").catch(() => null) : null;
  if (dl){
    try { await dl.save({ filename:name, data:txt }); return bkMsg("저장했어 (" + n + ")."); }
    catch(e){ if (e?.code === "declined") return bkMsg("저장을 취소했어."); if (e?.code === "rate_limited") return bkMsg("저장 창이 이미 열려 있어.", true); }
  }
  try {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type:"application/json" })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    bkMsg("다운로드했어 (" + n + ").");
  } catch { bkMsg("이 화면에선 파일 저장이 안 돼.", true); }
}
async function bkMergeList(name, incoming, cur){
  const have = new Set(cur.map(bkKey)); const add = incoming.filter(a => a && a.qid && !have.has(bkKey(a)));
  let cloud = 0;
  for (const a of add){
    const id = a._id && a._id !== "local" ? a._id : (a.at || Date.now()) + "-" + Math.random().toString(36).slice(2,8);
    const { _id, ...doc } = a;
    if (db){ try { await db.collection(name).doc(id).set(doc); cloud++; cur.push({ ...doc, _id:id }); continue; } catch {} }
    const loc = ls.get(BK_PFX + name, []); loc.push({ ...doc, _id:id }); ls.set(BK_PFX + name, loc); cur.push({ ...doc, _id:id });
  }
  return add.length;
}
async function bkImport(file){
  let d; try { d = JSON.parse(await file.text()); } catch { return bkMsg("JSON 파일이 아니야.", true); }
  if (d.app !== BK_PFX) return bkMsg(`다른 과목 기록이야 (${d.name || d.app || "?"}). ${BK_NAME} 기록 파일을 골라줘.`, true);
  bkMsg("가져오는 중…");
  const na = await bkMergeList("attempts", d.attempts || [], attempts);
  let nc = 0; if (typeof checks !== "undefined" && d.checks) nc = await bkMergeList("checks", d.checks, checks);
  let np = 0; const lp = ls.get(BK_PFX + "progress", {});
  for (const [lid, p] of Object.entries(d.progress || {})){
    const cur = progress[lid] || {};
    if (!p || (cur.done && !p.done)) continue;
    const merged = { ...cur, ...p, passed:{ ...(cur.passed || {}), ...(p.passed || {}) }, done:!!(cur.done || p.done) };
    if (JSON.stringify(merged) === JSON.stringify(cur)) continue;
    progress[lid] = merged; lp[lid] = merged; np++;
    if (db){ try { await db.collection("progress").doc(lid).set(merged); } catch {} }
  }
  ls.set(BK_PFX + "progress", lp);
  renderAll(true);
  bkMsg(`가져왔어: 새 문항 기록 ${na}개 · 레슨 진행 ${np}개${nc ? ` · 점검 ${nc}개` : ""}${db ? " (클라우드에도 저장)" : " (이 브라우저에 저장)"}.`);
}
function bkPanel(){
  return `<div class="sheet" id="bk" style="padding:12px 14px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center">
    <b style="margin-right:4px">기록 백업</b>
    <button class="btn sm" data-bkexp="1">기록 내보내기 (.json)</button>
    <label class="btn sm" style="cursor:pointer">기록 가져오기<input type="file" accept=".json,application/json" data-bkimp="1" hidden></label>
    <span class="note" id="bk-msg">Claude 앱 ↔ 볼트의 html 파일 사이에 기록을 옮길 때. 가져오기는 합치기라 기존 기록은 안 지워져.</span></div>`;
}
{ const _rh = renderHist; renderHist = function(...a){ const r = _rh.apply(this, a); const v = document.getElementById("v-hist"); if (v && !v.querySelector("#bk")) v.insertAdjacentHTML("afterbegin", bkPanel()); return r; }; }
document.addEventListener("click", e => { if (e.target.closest?.("[data-bkexp]")) bkExport(); });
document.addEventListener("change", e => { if (e.target.matches?.("[data-bkimp]") && e.target.files[0]){ bkImport(e.target.files[0]); e.target.value = ""; } });

boot();
})();
</script>
