"title_en": "Refining the COMPANY design"}, {"id": "er-practice", "title": "실습: MOVIE / CONF_REVIEW", "title_en": "Practice: MOVIE / CONF_REVIEW"}], "md": "## COMPANY 설계 다듬기 {#refine}\n\n관계를 표현하던 속성을 **관계 타입으로** 바꾼다.\n\n| 관계 | 참여 | 카디널리티 | 참여 제약 | 속성 |\n|---|---|---|---|---|\n| **MANAGES** | EMPLOYEE, DEPARTMENT | 1:1 | EMPLOYEE 부분, DEPARTMENT 전체 | Start_date (Manager_start_date) |\n| **WORKS_FOR** | EMPLOYEE, DEPARTMENT | 1:N (DEPARTMENT 1, EMPLOYEE N) | 둘 다 전체 | 없음 |\n| **CONTROLS** | DEPARTMENT, PROJECT | 1:N (DEPARTMENT 1, PROJECT N) | PROJECT 전체, DEPARTMENT 부분 | 없음 |\n| **SUPERVISION** | EMPLOYEE (supervisor, supervisee) | 1:N (supervisor 1, supervisee N) | 둘 다 부분 | 없음 |\n| **WORKS_ON** | EMPLOYEE, PROJECT | M:N | 둘 다 전체 | Hours |\n| **DEPENDENTS_OF** | EMPLOYEE(식별), DEPENDENT(약한) | 1:N (EMPLOYEE 1) | EMPLOYEE 부분, DEPENDENT 전체 | 없음 (식별 관계) |\n\n옮겨진 것: DEPARTMENT의 Manager·Manager_start_date → MANAGES, PROJECT의 Controlling_department → CONTROLS, EMPLOYEE의 Department·Supervisor·Works_on → WORKS_FOR·SUPERVISION·WORKS_ON, DEPENDENT의 Employee → DEPENDENTS_OF.\n\n> 주의: 교안 p.42 SUPERVISION 설명은 1쪽/N쪽 역할이 뒤바뀌어 적혀 있어. 상사(supervisor) 한 명이 여러 부하(supervisee)를 두므로 **supervisor가 1쪽**이 맞고, 결과 다이어그램(p.45)의 (min,max)도 supervisor (0,N), supervisee (0,1)이야.\n\n**ER 스키마 설계 3단계 요약**: (1) 요구사항에서 개체 타입과 속성 기술 → (2) 관계 타입과 제약조건 지정 → (3) 관계를 표현하던 속성을 관계 타입으로 바꿈. 인스턴스가 아니라 **스키마**에 집중.\n\n## 실습: MOVIE / CONF_REVIEW {#er-practice}\n\n**MOVIE DB** (2-2 p.14–23)\n- MOVIE: 키 MKey(Title, Year) 복합, Length, Plot_outline, {Genre} 다중값\n- ACTOR, DIRECTOR: 키 (Name, Date_of_birth). PRODUCTION: 키 Name, Address\n- **PRODUCES** (PRODUCTION 1 : MOVIE N): 영화는 제작사 하나가 만든다. MOVIE 전체 참여\n- **ACTS** (ACTOR M : MOVIE N): 관계 속성 Role, {Quotes}(다중값). 양쪽 전체 참여\n- **DIRECTS** (DIRECTOR M : MOVIE N): MOVIE 전체 참여 (감독이 최소 1명)\n- **DIR_ACTS**: 감독도 영화에 출연할 수 있음 (Role, {Quotes})\n\n**CONF_REVIEW DB** (2-2 p.24–26, 풀이는 db-exercises)\n- AUTHOR(A_email 키, First_name, Last_name), PAPER(P_id 키, Title, Abstract, File_name), REVIEWER(R_email 키, 이름, Phone_no, Affiliation, {Interest_topic})\n- **SUBMITS** AUTHOR (1,N) – PAPER (1,M): 저자는 논문을 내야 기록되고, 논문은 여러 저자 가능 (M:N)\n- **IS_CONTACT** AUTHOR (0,N) – PAPER (1,1): 논문마다 연락 저자가 정확히 한 명. SUBMITS만으로는 이 요구를 못 나타내서 따로 둠\n- **REVIEWS** REVIEWER (1,N) – PAPER (2,4): 논문당 리뷰어 2~4명. 관계 속성 Recommendation, Comments(For_committee, Feedback) 복합, Rating(C1 Technical_merit, C2 Readability, C3 Originality, C4 Relevance) 복합\n\n> 시험 포인트: \"~마다 정확히 하나\" = (1,1), \"할 수도 안 할 수도\" = min 0, \"최소 a 최대 b\" = (a,b), \"여러 개\" = max N. 요구사항 문장에서 이 단어들을 찾아 표기로 옮기는 게 핵심.", "html": "<section class=\"sec\" id=\"s-refine\"><h3>COMPANY 설계 다듬기<\/h3><p>관계를 표현하던 속성을 <b>관계 타입으로<\/b> 바꾼다.<\/p>\n<div class=\"tblw\"><table><thead><tr><th>관계<\/th><th>참여<\/th><th>카디널리티<\/th><th>참여 제약<\/th><th>속성<\/th><\/tr><\/thead><tbody><tr><td><b>MANAGES<\/b><\/td><td>EMPLOYEE, DEPARTMENT<\/td><td>1:1<\/td><td>EMPLOYEE 부분, DEPARTMENT 전체<\/td><td>Start_date (Manager_start_date)<\/td><\/tr><tr><td><b>WORKS_FOR<\/b><\/td><td>EMPLOYEE, DEPARTMENT<\/td><td>1:N (DEPARTMENT 1, EMPLOYEE N)<\/td><td>둘 다 전체<\/td><td>없음<\/td><\/tr><tr><td><b>CONTROLS<\/b><\/td><td>DEPARTMENT, PROJECT<\/td><td>1:N (DEPARTMENT 1, PROJECT N)<\/td><td>PROJECT 전체, DEPARTMENT 부분<\/td><td>없음<\/td><\/tr><tr><td><b>SUPERVISION<\/b><\/td><td>EMPLOYEE (supervisor, supervisee)<\/td><td>1:N (supervisor 1, supervisee N)<\/td><td>둘 다 부분<\/td><td>없음<\/td><\/tr><tr><td><b>WORKS_ON<\/b><\/td><td>EMPLOYEE, PROJECT<\/td><td>M:N<\/td><td>둘 다 전체<\/td><td>Hours<\/td><\/tr><tr><td><b>DEPENDENTS_OF<\/b><\/td><td>EMPLOYEE(식별), DEPENDENT(약한)<\/td><td>1:N (EMPLOYEE 1)<\/td><td>EMPLOYEE 부분, DEPENDENT 전체<\/td><td>없음 (식별 관계)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>옮겨진 것: DEPARTMENT의 Manager·Manager_start_date → MANAGES, PROJECT의 Controlling_department → CONTROLS, EMPLOYEE의 Department·Supervisor·Works_on → WORKS_FOR·SUPERVISION·WORKS_ON, DEPENDENT의 Employee → DEPENDENTS_OF.<\/p>\n<div class=\"callout trap\">주의: 교안 p.42 SUPERVISION 설명은 1쪽/N쪽 역할이 뒤바뀌어 적혀 있어. 상사(supervisor) 한 명이 여러 부하(supervisee)를 두므로 <b>supervisor가 1쪽<\/b>이 맞고, 결과 다이어그램(p.45)의 (min,max)도 supervisor (0,N), supervisee (0,1)이야.<\/div>\n<p><b>ER 스키마 설계 3단계 요약<\/b>: (1) 요구사항에서 개체 타입과 속성 기술 → (2) 관계 타입과 제약조건 지정 → (3) 관계를 표현하던 속성을 관계 타입으로 바꿈. 인스턴스가 아니라 <b>스키마<\/b>에 집중.<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ER-p45.jpg\" aria-label=\"크게 보기\"><img src=\"img/ER-p45.jpg\" alt=\"02 p.45 · 다듬은 COMPANY ER 다이어그램 (관계 6개와 (min,max))\" loading=\"lazy\"><\/button><figcaption>02 p.45 · 다듬은 COMPANY ER 다이어그램 (관계 6개와 (min,max))<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-er-practice\"><h3>실습: MOVIE / CONF_REVIEW<\/h3><p><b>MOVIE DB<\/b> (2-2 p.14–23)<\/p>\n<ul><li>MOVIE: 키 MKey(Title, Year) 복합, Length, Plot_outline, {Genre} 다중값<\/li><li>ACTOR, DIRECTOR: 키 (Name, Date_of_birth). PRODUCTION: 키 Name, Address<\/li><li><b>PRODUCES<\/b> (PRODUCTION 1 : MOVIE N): 영화는 제작사 하나가 만든다. MOVIE 전체 참여<\/li><li><b>ACTS<\/b> (ACTOR M : MOVIE N): 관계 속성 Role, {Quotes}(다중값). 양쪽 전체 참여<\/li><li><b>DIRECTS<\/b> (DIRECTOR M : MOVIE N): MOVIE 전체 참여 (감독이 최소 1명)<\/li><li><b>DIR_ACTS<\/b>: 감독도 영화에 출연할 수 있음 (Role, {Quotes})<\/li><\/ul>\n<p><b>CONF_REVIEW DB<\/b> (2-2 p.24–26, 풀이는 db-exercises)<\/p>\n<ul><li>AUTHOR(A_email 키, First_name, Last_name), PAPER(P_id 키, Title, Abstract, File_name), REVIEWER(R_email 키, 이름, Phone_no, Affiliation, {Interest_topic})<\/li><li><b>SUBMITS<\/b> AUTHOR (1,N) – PAPER (1,M): 저자는 논문을 내야 기록되고, 논문은 여러 저자 가능 (M:N)<\/li><li><b>IS_CONTACT<\/b> AUTHOR (0,N) – PAPER (1,1): 논문마다 연락 저자가 정확히 한 명. SUBMITS만으로는 이 요구를 못 나타내서 따로 둠<\/li><li><b>REVIEWS<\/b> REVIEWER (1,N) – PAPER (2,4): 논문당 리뷰어 2~4명. 관계 속성 Recommendation, Comments(For_committee, Feedback) 복합, Rating(C1 Technical_merit, C2 Readability, C3 Originality, C4 Relevance) 복합<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: \"~마다 정확히 하나\" = (1,1), \"할 수도 안 할 수도\" = min 0, \"최소 a 최대 b\" = (a,b), \"여러 개\" = max N. 요구사항 문장에서 이 단어들을 찾아 표기로 옮기는 게 핵심.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ERP-p23.jpg\" aria-label=\"크게 보기\"><img src=\"img/ERP-p23.jpg\" alt=\"02-2 p.23 · MOVIE DB ER 다이어그램\" loading=\"lazy\"><\/button><figcaption>02-2 p.23 · MOVIE DB ER 다이어그램<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/EX-p9.jpg\" aria-label=\"크게 보기\"><img src=\"img/EX-p9.jpg\" alt=\"db-exercises p.36 · CONF_REVIEW DB ER 다이어그램 (SUBMITS, IS_CONTACT, REVIEWS)\" loading=\"lazy\"><\/button><figcaption>db-exercises p.36 · CONF_REVIEW DB ER 다이어그램 (SUBMITS, IS_CONTACT, REVIEWS)<\/figcaption><\/figure><\/section>", "title_en": "Refining the COMPANY Design, Practice (MOVIE, CONF_REVIEW)", "html_en": "<section class=\"sec\" id=\"s-refine\"><h3>Refining the COMPANY design<\/h3><p>Change attributes that represent relationships <b>into relationship types<\/b>.<\/p>\n<div class=\"tblw\"><table><thead><tr><th>Relationship<\/th><th>Participants<\/th><th>Cardinality<\/th><th>Participation<\/th><th>Attributes<\/th><\/tr><\/thead><tbody><tr><td><b>MANAGES<\/b><\/td><td>EMPLOYEE, DEPARTMENT<\/td><td>1:1<\/td><td>EMPLOYEE partial, DEPARTMENT total<\/td><td>Start_date (Manager_start_date)<\/td><\/tr><tr><td><b>WORKS_FOR<\/b><\/td><td>EMPLOYEE, DEPARTMENT<\/td><td>1:N (DEPARTMENT 1, EMPLOYEE N)<\/td><td>Both total<\/td><td>None<\/td><\/tr><tr><td><b>CONTROLS<\/b><\/td><td>DEPARTMENT, PROJECT<\/td><td>1:N (DEPARTMENT 1, PROJECT N)<\/td><td>PROJECT total, DEPARTMENT partial<\/td><td>None<\/td><\/tr><tr><td><b>SUPERVISION<\/b><\/td><td>EMPLOYEE (supervisor, supervisee)<\/td><td>1:N (supervisor 1, supervisee N)<\/td><td>Both partial<\/td><td>None<\/td><\/tr><tr><td><b>WORKS_ON<\/b><\/td><td>EMPLOYEE, PROJECT<\/td><td>M:N<\/td><td>Both total<\/td><td>Hours<\/td><\/tr><tr><td><b>DEPENDENTS_OF<\/b><\/td><td>EMPLOYEE (identifying), DEPENDENT (weak)<\/td><td>1:N (EMPLOYEE 1)<\/td><td>EMPLOYEE partial, DEPENDENT total<\/td><td>None (identifying relationship)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>What moved: DEPARTMENT's Manager and Manager_start_date → MANAGES; PROJECT's Controlling_department → CONTROLS; EMPLOYEE's Department, Supervisor, Works_on → WORKS_FOR, SUPERVISION, WORKS_ON; DEPENDENT's Employee → DEPENDENTS_OF.<\/p>\n<div class=\"callout trap\">Caution: the SUPERVISION description on slide p.42 has the 1-side/N-side roles swapped. One supervisor has many supervisees, so <b>the supervisor is the 1-side<\/b>, and the resulting diagram (p.45) also gives (min,max) supervisor (0,N), supervisee (0,1).<\/div>\n<p><b>Summary of the 3 steps of ER schema design<\/b>: (1) describe entity types and attributes from the requirements → (2) specify relationship types and constraints → (3) change attributes that represent relationships into relationship types. Focus on the <b>schema<\/b>, not instances.<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ER-p45.jpg\" aria-label=\"Enlarge\"><img src=\"img/ER-p45.jpg\" alt=\"02 p.45 · Refined COMPANY ER diagram (six relationships with (min,max))\" loading=\"lazy\"><\/button><figcaption>02 p.45 · Refined COMPANY ER diagram (six relationships with (min,max))<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-er-practice\"><h3>Practice: MOVIE / CONF_REVIEW<\/h3><p><b>MOVIE DB<\/b> (2-2 p.14–23)<\/p>\n<ul><li>MOVIE: composite key MKey(Title, Year), Length, Plot_outline, {Genre} multivalued<\/li><li>ACTOR, DIRECTOR: key (Name, Date_of_birth). PRODUCTION: key Name, Address<\/li><li><b>PRODUCES<\/b> (PRODUCTION 1 : MOVIE N): a movie is produced by one production company. MOVIE total participation<\/li><li><b>ACTS<\/b> (ACTOR M : MOVIE N): relationship attributes Role, {Quotes} (multivalued). Total participation on both sides<\/li><li><b>DIRECTS<\/b> (DIRECTOR M : MOVIE N): MOVIE total participation (at least one director)<\/li><li><b>DIR_ACTS<\/b>: a director may also act in a movie (Role, {Quotes})<\/li><\/ul>\n<p><b>CONF_REVIEW DB<\/b> (2-2 p.24–26, solution in db-exercises)<\/p>\n<ul><li>AUTHOR(A_email key, First_name, Last_name), PAPER(P_id key, Title, Abstract, File_name), REVIEWER(R_email key, name, Phone_no, Affiliation, {Interest_topic})<\/li><li><b>SUBMITS<\/b> AUTHOR (1,N) – PAPER (1,M): an author is recorded only after submitting a paper; a paper may have multiple authors (M:N)<\/li><li><b>IS_CONTACT<\/b> AUTHOR (0,N) – PAPER (1,1): each paper has exactly one contact author. SUBMITS alone cannot express this requirement, so it is a separate relationship<\/li><li><b>REVIEWS<\/b> REVIEWER (1,N) – PAPER (2,4): 2 to 4 reviewers per paper. Relationship attributes: Recommendation; Comments(For_committee, Feedback) composite; Rating(C1 Technical_merit, C2 Readability, C3 Originality, C4 Relevance) composite<\/li><\/ul>\n<div class=\"callout exam\">Exam point: \"exactly one per …\" = (1,1); \"may or may not\" = min 0; \"at least a, at most b\" = (a,b); \"many\" = max N. The key skill is spotting these words in a requirement sentence and turning them into notation.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ERP-p23.jpg\" aria-label=\"Enlarge\"><img src=\"img/ERP-p23.jpg\" alt=\"02-2 p.23 · MOVIE DB ER diagram\" loading=\"lazy\"><\/button><figcaption>02-2 p.23 · MOVIE DB ER diagram<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/EX-p9.jpg\" aria-label=\"Enlarge\"><img src=\"img/EX-p9.jpg\" alt=\"db-exercises p.36 · CONF_REVIEW DB ER diagram (SUBMITS, IS_CONTACT, REVIEWS)\" loading=\"lazy\"><\/button><figcaption>db-exercises p.36 · CONF_REVIEW DB ER diagram (SUBMITS, IS_CONTACT, REVIEWS)<\/figcaption><\/figure><\/section>"}], "title_en": "The ER Model (Conceptual Design)", "intro_en": "Requirements → entities and attributes → relationships and constraints → refinement. The exam is likely to give requirement sentences and ask you to draw an ER diagram or write (min, max), so practice turning \"a requirement sentence → the right notation\"."}, {"id": "U3", "title": "관계 데이터 모델 · ER→관계 매핑", "src": "3-1_RDB.pdf", "intro": "용어(릴레이션·투플·속성·도메인·차수), 키 계열(슈퍼키 ⊃ 키 = 후보 키 ∋ 기본 키), 무결성 제약 3가지, 삽입·삭제·갱신이 어떤 제약을 깨는지, 그리고 ER→관계 매핑. 매핑은 \"FK를 어디에 넣나\"만 정확하면 된다.", "lessons": [{"id": "L3-1", "title": "관계 모델 기본 개념", "src": "3-1 p.4–12", "secs": [{"id": "rel-model", "title": "관계 데이터 모델", "title_en": "The relational data model"}, {"id": "domain-schema", "title": "도메인 · 릴레이션 스키마 · 인스턴스", "title_en": "Domain, relation schema, instance"}, {"id": "rel-chars", "title": "릴레이션의 특성", "title_en": "Characteristics of relations"}, {"id": "db-schema-state", "title": "관계 DB 스키마와 상태", "title_en": "Relational database schema and state"}], "md": "## 관계 데이터 모델 {#rel-model}\n\n- 1970년 IBM의 **Ted Codd**가 제안\n- 데이터를 **릴레이션(relation, 테이블)** 으로 표현. 각 릴레이션은 **투플(tuple, 행)** 과 **속성(attribute, 열 헤더)** 으로 구성\n- 각 행 = 특정 개체에 대한 사실(관련된 데이터 값들의 모음), 속성 = 각 행의 값을 어떻게 해석할지 지정\n\n**장점 4가지**: **단순성** (평평한 테이블 구조), **데이터 무결성** (유효·일관·정확한 데이터 보장), **쉬운 데이터 조작** (SQL 같은 강력한 고급 언어로 복잡한 조건도 유연하게), **보안** (인증, 권한, 암호화)\n\n## 도메인 · 릴레이션 스키마 · 인스턴스 {#domain-schema}\n\n- **도메인 D**: 각 속성에 허용되는 **원자 값(atomic value)들의 집합**. 도메인 = 데이터 타입 + 제약조건\n  - 예) Usa_phone_numbers: (ddd)ddd-dddd 형식, Employee_ages: 15~80 사이 정수\n- **릴레이션 스키마 R(A₁, …, Aₙ)**: 릴레이션 이름 + 속성 리스트. 예) STUDENT(Name, Ssn, …, Gpa)\n- **차수 (degree)**: 릴레이션 스키마의 **속성 개수 n**. 예) STUDENT(Name, Ssn, Home_phone, Address, Office_phone, Age, Gpa)는 차수 7\n- **릴레이션 인스턴스(상태) r(R)**: n-투플들의 **집합** {t₁, …, tₘ}\n- **투플 t**: n개 값의 **순서 있는** 리스트 <v₁, …, vₙ>. 각 vᵢ는 dom(Aᵢ)의 원소이거나 특수값 **NULL**\n\n> 함정: 차수(degree) = 속성(열) 수. 투플(행) 수는 카디널리티(cardinality)라고 부른다. 섞지 마.\n\n## 릴레이션의 특성 {#rel-chars}\n\n- **투플의 값은 원자 값**이어야 함 (더 쪼개지지 않음)\n  - **복합 속성·다중값 속성은 허용 안 됨**\n  - 다중값 속성 → **별도 릴레이션**으로 표현\n  - 복합 속성 → **단순 구성 속성들**로만 표현\n- **NULL**: 값을 모르거나(unknown), 얻을 수 없거나(unavailable), 해당 투플에 적용되지 않는(undefined/not applicable) 경우\n- 릴레이션은 투플의 **집합**이므로 정의상 **투플끼리는 모두 달라야** 한다\n\n## 관계 DB 스키마와 상태 {#db-schema-state}\n\n- **관계 DB 스키마 S** = 릴레이션 스키마들의 집합 {R₁, …, Rₘ} + **무결성 제약조건 집합 IC**\n  - 예) COMPANY = {EMPLOYEE, DEPARTMENT, DEPT_LOCATIONS, PROJECT, WORKS_ON, DEPENDENT}\n  - 스키마 그림에서 **밑줄 = 기본 키**, **화살표 = 참조 무결성** (FK → 참조되는 PK)\n- **관계 DB 상태 DB** = 릴레이션 상태들의 집합 {r₁, …, rₘ}, rᵢ는 Rᵢ의 상태\n  - 모든 무결성 제약을 만족하면 **유효(valid) 상태**, 하나라도 어기면 **무효(invalid) 상태**", "html": "<section class=\"sec\" id=\"s-rel-model\"><h3>관계 데이터 모델<\/h3><ul><li>1970년 IBM의 <b>Ted Codd<\/b>가 제안<\/li><li>데이터를 <b>릴레이션(relation, 테이블)<\/b> 으로 표현. 각 릴레이션은 <b>투플(tuple, 행)<\/b> 과 <b>속성(attribute, 열 헤더)<\/b> 으로 구성<\/li><li>각 행 = 특정 개체에 대한 사실(관련된 데이터 값들의 모음), 속성 = 각 행의 값을 어떻게 해석할지 지정<\/li><\/ul>\n<p><b>장점 4가지<\/b>: <b>단순성<\/b> (평평한 테이블 구조), <b>데이터 무결성<\/b> (유효·일관·정확한 데이터 보장), <b>쉬운 데이터 조작<\/b> (SQL 같은 강력한 고급 언어로 복잡한 조건도 유연하게), <b>보안<\/b> (인증, 권한, 암호화)<\/p><\/section>\n<section class=\"sec\" id=\"s-domain-schema\"><h3>도메인 · 릴레이션 스키마 · 인스턴스<\/h3><ul><li><b>도메인 D<\/b>: 각 속성에 허용되는 <b>원자 값(atomic value)들의 집합<\/b>. 도메인 = 데이터 타입 + 제약조건<ul><li>예) Usa_phone_numbers: (ddd)ddd-dddd 형식, Employee_ages: 15~80 사이 정수<\/li><\/ul><\/li><li><b>릴레이션 스키마 R(A₁, …, Aₙ)<\/b>: 릴레이션 이름 + 속성 리스트. 예) STUDENT(Name, Ssn, …, Gpa)<\/li><li><b>차수 (degree)<\/b>: 릴레이션 스키마의 <b>속성 개수 n<\/b>. 예) STUDENT(Name, Ssn, Home_phone, Address, Office_phone, Age, Gpa)는 차수 7<\/li><li><b>릴레이션 인스턴스(상태) r(R)<\/b>: n-투플들의 <b>집합<\/b> {t₁, …, tₘ}<\/li><li><b>투플 t<\/b>: n개 값의 <b>순서 있는<\/b> 리스트 &lt;v₁, …, vₙ&gt;. 각 vᵢ는 dom(Aᵢ)의 원소이거나 특수값 <b>NULL<\/b><\/li><\/ul>\n<div class=\"callout trap\">함정: 차수(degree) = 속성(열) 수. 투플(행) 수는 카디널리티(cardinality)라고 부른다. 섞지 마.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p9.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p9.jpg\" alt=\"03 p.9 · 릴레이션 이름, 속성, 투플, 차수(7)\" loading=\"lazy\"><\/button><figcaption>03 p.9 · 릴레이션 이름, 속성, 투플, 차수(7)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-rel-chars\"><h3>릴레이션의 특성<\/h3><ul><li><b>투플의 값은 원자 값<\/b>이어야 함 (더 쪼개지지 않음)<ul><li><b>복합 속성·다중값 속성은 허용 안 됨<\/b><\/li><li>다중값 속성 → <b>별도 릴레이션<\/b>으로 표현<\/li><li>복합 속성 → <b>단순 구성 속성들<\/b>로만 표현<\/li><\/ul><\/li><li><b>NULL<\/b>: 값을 모르거나(unknown), 얻을 수 없거나(unavailable), 해당 투플에 적용되지 않는(undefined/not applicable) 경우<\/li><li>릴레이션은 투플의 <b>집합<\/b>이므로 정의상 <b>투플끼리는 모두 달라야<\/b> 한다<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-db-schema-state\"><h3>관계 DB 스키마와 상태<\/h3><ul><li><b>관계 DB 스키마 S<\/b> = 릴레이션 스키마들의 집합 {R₁, …, Rₘ} + <b>무결성 제약조건 집합 IC<\/b><ul><li>예) COMPANY = {EMPLOYEE, DEPARTMENT, DEPT_LOCATIONS, PROJECT, WORKS_ON, DEPENDENT}<\/li><li>스키마 그림에서 <b>밑줄 = 기본 키<\/b>, <b>화살표 = 참조 무결성<\/b> (FK → 참조되는 PK)<\/li><\/ul><\/li><li><b>관계 DB 상태 DB<\/b> = 릴레이션 상태들의 집합 {r₁, …, rₘ}, rᵢ는 Rᵢ의 상태<ul><li>모든 무결성 제약을 만족하면 <b>유효(valid) 상태<\/b>, 하나라도 어기면 <b>무효(invalid) 상태<\/b><\/li><\/ul><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p11.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p11.jpg\" alt=\"03 p.11 · COMPANY 관계 DB 스키마 (밑줄 = PK, 화살표 = 참조 무결성)\" loading=\"lazy\"><\/button><figcaption>03 p.11 · COMPANY 관계 DB 스키마 (밑줄 = PK, 화살표 = 참조 무결성)<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p12.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p12.jpg\" alt=\"03 p.12 · COMPANY DB 상태 (문제 풀이에 계속 쓰는 데이터)\" loading=\"lazy\"><\/button><figcaption>03 p.12 · COMPANY DB 상태 (문제 풀이에 계속 쓰는 데이터)<\/figcaption><\/figure><\/section>", "title_en": "Basic Concepts of the Relational Model", "html_en": "<section class=\"sec\" id=\"s-rel-model\"><h3>The relational data model<\/h3><ul><li>Proposed by <b>Ted Codd<\/b> of IBM in 1970<\/li><li>Represents data as <b>relations (tables)<\/b>. Each relation consists of <b>tuples (rows)<\/b> and <b>attributes (column headers)<\/b><\/li><li>Each row = a fact about a particular entity (a collection of related data values); attributes specify how to interpret the values in each row<\/li><\/ul>\n<p><b>Four advantages<\/b>: <b>Simplicity<\/b> (flat table structure), <b>Data integrity<\/b> (ensures valid, consistent and accurate data), <b>Ease of data manipulation<\/b> (powerful high-level languages such as SQL handle complex conditions flexibly), <b>Security<\/b> (authentication, authorization, encryption)<\/p><\/section>\n<section class=\"sec\" id=\"s-domain-schema\"><h3>Domain, relation schema, instance<\/h3><ul><li><b>Domain D<\/b>: a <b>set of atomic values<\/b> allowed for an attribute. Domain = data type + constraints<ul><li>e.g., Usa_phone_numbers: format (ddd)ddd-dddd; Employee_ages: integers between 15 and 80<\/li><\/ul><\/li><li><b>Relation schema R(A₁, …, Aₙ)<\/b>: relation name + list of attributes. e.g., STUDENT(Name, Ssn, …, Gpa)<\/li><li><b>Degree<\/b>: the <b>number of attributes n<\/b> of a relation schema. e.g., STUDENT(Name, Ssn, Home_phone, Address, Office_phone, Age, Gpa) has degree 7<\/li><li><b>Relation instance (state) r(R)<\/b>: a <b>set<\/b> of n-tuples {t₁, …, tₘ}<\/li><li><b>Tuple t<\/b>: an <b>ordered<\/b> list of n values &lt;v₁, …, vₙ&gt;. Each vᵢ is an element of dom(Aᵢ) or the special value <b>NULL<\/b><\/li><\/ul>\n<div class=\"callout trap\">Trap: degree = number of attributes (columns). The number of tuples (rows) is called the cardinality. Do not mix them up.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p9.jpg\" aria-label=\"Enlarge\"><img src=\"img/RDB-p9.jpg\" alt=\"03 p.9 · Relation name, attributes, tuples, degree (7)\" loading=\"lazy\"><\/button><figcaption>03 p.9 · Relation name, attributes, tuples, degree (7)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-rel-chars\"><h3>Characteristics of relations<\/h3><ul><li><b>Values in a tuple must be atomic<\/b> (not further divisible)<ul><li><b>Composite and multivalued attributes are not allowed<\/b><\/li><li>Multivalued attribute → represented by a <b>separate relation<\/b><\/li><li>Composite attribute → represented only by its <b>simple component attributes<\/b><\/li><\/ul><\/li><li><b>NULL<\/b>: used when a value is unknown, unavailable, or does not apply to that tuple (undefined/not applicable)<\/li><li>A relation is a <b>set<\/b> of tuples, so by definition <b>all tuples must be distinct<\/b><\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-db-schema-state\"><h3>Relational database schema and state<\/h3><ul><li><b>Relational database schema S<\/b> = a set of relation schemas {R₁, …, Rₘ} + a <b>set of integrity constraints IC<\/b><ul><li>e.g., COMPANY = {EMPLOYEE, DEPARTMENT, DEPT_LOCATIONS, PROJECT, WORKS_ON, DEPENDENT}<\/li><li>In the schema diagram, <b>underline = primary key<\/b>, <b>arrow = referential integrity<\/b> (FK → referenced PK)<\/li><\/ul><\/li><li><b>Relational database state DB<\/b> = a set of relation states {r₁, …, rₘ}, where rᵢ is a state of Rᵢ<ul><li>If it satisfies all integrity constraints it is a <b>valid state<\/b>; if it violates even one, it is an <b>invalid state<\/b><\/li><\/ul><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p11.jpg\" aria-label=\"Enlarge\"><img src=\"img/RDB-p11.jpg\" alt=\"03 p.11 · COMPANY relational database schema (underline = PK, arrow = referential integrity)\" loading=\"lazy\"><\/button><figcaption>03 p.11 · COMPANY relational database schema (underline = PK, arrow = referential integrity)<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p12.jpg\" aria-label=\"Enlarge\"><img src=\"img/RDB-p12.jpg\" alt=\"03 p.12 · COMPANY database state (the data used throughout the practice problems)\" loading=\"lazy\"><\/button><figcaption>03 p.12 · COMPANY database state (the data used throughout the practice problems)<\/figcaption><\/figure><\/section>"}, {"id": "L3-2", "title": "키 · 무결성 제약조건", "src": "3-1 p.13–21", "secs": [{"id": "superkey-key", "title": "슈퍼키와 키", "title_en": "Superkey and key"}, {"id": "candidate-pk", "title": "후보 키와 기본 키", "title_en": "Candidate key and primary key"}, {"id": "entity-integrity", "title": "개체 무결성 제약", "title_en": "Entity integrity constraint"}, {"id": "ref-integrity", "title": "참조 무결성 제약", "title_en": "Referential integrity constraint"}], "md": "## 슈퍼키와 키 {#superkey-key}\n\nDBMS는 제약조건을 정의하고 강제하는 기능을 제공해야 한다. 핵심 제약 3가지 = **키 제약, 개체 무결성, 참조 무결성**.\n\n**키 제약**: \"서로 다른 두 투플은 SK 속성들에 대해 같은 값을 가질 수 없다\" → 모든 상태 r에서 t₁[SK] ≠ t₂[SK].\n- **슈퍼키 (SK)**: 각 투플을 **유일하게 식별하는 속성 부분집합**. 모든 릴레이션은 최소 하나의 기본 슈퍼키(속성 전체)를 가진다\n- **키 (K)**: 슈퍼키이면서, 어떤 속성 A를 빼도 더 이상 슈퍼키가 아닌 것 = **최소(minimal) 슈퍼키**\n  - 최소성은 키에는 필수, 슈퍼키에는 선택\n  - 예) {Ssn, Home_phone}은 슈퍼키. Home_phone을 빼도 {Ssn}이 유일 → {Ssn, Home_phone}은 키가 아님, {Ssn}이 키\n\n> 함정: 키 ⊂ 슈퍼키. \"모든 키는 슈퍼키지만, 모든 슈퍼키가 키는 아니다\".\n\n## 후보 키와 기본 키 {#candidate-pk}\n\n- 릴레이션 스키마에 키가 여러 개면, 각각을 **후보 키 (candidate key)** 라고 부른다\n- 후보 키 중 하나를 **기본 키 (primary key)** 로 지정해 투플을 식별하는 데 쓴다. 스키마에서 **밑줄**\n- 예) CAR의 후보 키 = License_number, Engine_serial_number → License_number를 PK로 지정\n- 보통은 **속성 하나 또는 적은 수**로 된 키를 PK로 고르는 게 좋다\n\n## 개체 무결성 제약 {#entity-integrity}\n\n**\"기본 키 값은 NULL일 수 없다\"** → 모든 투플 t에 대해 t[PK] ≠ NULL.\n- 이유: PK가 NULL인 투플이 둘 이상이면, 다른 릴레이션에서 참조할 때 **서로 구별할 수 없다**\n- 예) Office_phone처럼 NULL이 있는 속성은 키가 될 수 없음\n- 복합 PK면 **PK의 어느 부분도** NULL이면 안 됨\n\n## 참조 무결성 제약 {#ref-integrity}\n\n**\"투플 t₁의 FK 값은 어떤 투플 t₂의 PK 값과 같거나, NULL이어야 한다\"**\n- **외래 키 (FK)**: 릴레이션 R₁의 속성 집합으로, R₂를 **참조**한다. t₁[FK] = t₂[PK]이면 t₁이 t₂를 참조\n- R₁의 FK는 R₂의 PK와 **같은 도메인**을 가진다\n- R₁ = **참조하는(referencing) 릴레이션**, R₂ = **참조되는(referenced) 릴레이션**\n- 예) EMPLOYEE.Dno → DEPARTMENT.Dnumber. 'John Smith'의 Dno=5 → 'Research' 부서 투플을 참조 = Smith는 Research에서 일함\n- 필요한 이유: 두 릴레이션 투플 사이의 **일관성** 유지. Dno=3인데 3번 부서가 없으면 그 값의 의미를 해석할 수 없다\n- FK는 **자기 자신의 릴레이션을 참조**할 수도 있다 (EMPLOYEE.Super_ssn → EMPLOYEE.Ssn)\n\n교안 연습 (FK 찾기):\n- SALESPERSON(Ssn, Name, Start_year, Dept_no), TRIP(Ssn, From_city, To_city, Departure_date, Return_date, Trip_id), EXPENSE(Trip_id, Account#, Amount)\n  → TRIP.Ssn → SALESPERSON, EXPENSE.Trip_id → TRIP\n- STUDENT(Ssn, …), COURSE(Course#, …), ENROLL(Ssn, Course#, Quarter, Grade), BOOK_ADOPTION(Course#, Quarter, Book_isbn), TEXT(Book_isbn, …)\n  → ENROLL.Ssn → STUDENT, ENROLL.Course# → COURSE, BOOK_ADOPTION.Course# → COURSE, BOOK_ADOPTION.Book_isbn → TEXT", "html": "<section class=\"sec\" id=\"s-superkey-key\"><h3>슈퍼키와 키<\/h3><p>DBMS는 제약조건을 정의하고 강제하는 기능을 제공해야 한다. 핵심 제약 3가지 = <b>키 제약, 개체 무결성, 참조 무결성<\/b>.<\/p>\n<p><b>키 제약<\/b>: \"서로 다른 두 투플은 SK 속성들에 대해 같은 값을 가질 수 없다\" → 모든 상태 r에서 t₁[SK] ≠ t₂[SK].<\/p>\n<ul><li><b>슈퍼키 (SK)<\/b>: 각 투플을 <b>유일하게 식별하는 속성 부분집합<\/b>. 모든 릴레이션은 최소 하나의 기본 슈퍼키(속성 전체)를 가진다<\/li><li><b>키 (K)<\/b>: 슈퍼키이면서, 어떤 속성 A를 빼도 더 이상 슈퍼키가 아닌 것 = <b>최소(minimal) 슈퍼키<\/b><ul><li>최소성은 키에는 필수, 슈퍼키에는 선택<\/li><li>예) {Ssn, Home_phone}은 슈퍼키. Home_phone을 빼도 {Ssn}이 유일 → {Ssn, Home_phone}은 키가 아님, {Ssn}이 키<\/li><\/ul><\/li><\/ul>\n<div class=\"callout trap\">함정: 키 ⊂ 슈퍼키. \"모든 키는 슈퍼키지만, 모든 슈퍼키가 키는 아니다\".<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p15.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p15.jpg\" alt=\"03 p.15 · 슈퍼키 {Ssn, Home_phone}에서 Home_phone을 빼면 키 {Ssn}\" loading=\"lazy\"><\/button><figcaption>03 p.15 · 슈퍼키 {Ssn, Home_phone}에서 Home_phone을 빼면 키 {Ssn}<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-candidate-pk\"><h3>후보 키와 기본 키<\/h3><ul><li>릴레이션 스키마에 키가 여러 개면, 각각을 <b>후보 키 (candidate key)<\/b> 라고 부른다<\/li><li>후보 키 중 하나를 <b>기본 키 (primary key)<\/b> 로 지정해 투플을 식별하는 데 쓴다. 스키마에서 <b>밑줄<\/b><\/li><li>예) CAR의 후보 키 = License_number, Engine_serial_number → License_number를 PK로 지정<\/li><li>보통은 <b>속성 하나 또는 적은 수<\/b>로 된 키를 PK로 고르는 게 좋다<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p16.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p16.jpg\" alt=\"03 p.16 · CAR의 후보 키 두 개 중 License_number를 PK로\" loading=\"lazy\"><\/button><figcaption>03 p.16 · CAR의 후보 키 두 개 중 License_number를 PK로<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-entity-integrity\"><h3>개체 무결성 제약<\/h3><p><b>\"기본 키 값은 NULL일 수 없다\"<\/b> → 모든 투플 t에 대해 t[PK] ≠ NULL.<\/p>\n<ul><li>이유: PK가 NULL인 투플이 둘 이상이면, 다른 릴레이션에서 참조할 때 <b>서로 구별할 수 없다<\/b><\/li><li>예) Office_phone처럼 NULL이 있는 속성은 키가 될 수 없음<\/li><li>복합 PK면 <b>PK의 어느 부분도<\/b> NULL이면 안 됨<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-ref-integrity\"><h3>참조 무결성 제약<\/h3><p><b>\"투플 t₁의 FK 값은 어떤 투플 t₂의 PK 값과 같거나, NULL이어야 한다\"<\/b><\/p>\n<ul><li><b>외래 키 (FK)<\/b>: 릴레이션 R₁의 속성 집합으로, R₂를 <b>참조<\/b>한다. t₁[FK] = t₂[PK]이면 t₁이 t₂를 참조<\/li><li>R₁의 FK는 R₂의 PK와 <b>같은 도메인<\/b>을 가진다<\/li><li>R₁ = <b>참조하는(referencing) 릴레이션<\/b>, R₂ = <b>참조되는(referenced) 릴레이션<\/b><\/li><li>예) EMPLOYEE.Dno → DEPARTMENT.Dnumber. 'John Smith'의 Dno=5 → 'Research' 부서 투플을 참조 = Smith는 Research에서 일함<\/li><li>필요한 이유: 두 릴레이션 투플 사이의 <b>일관성<\/b> 유지. Dno=3인데 3번 부서가 없으면 그 값의 의미를 해석할 수 없다<\/li><li>FK는 <b>자기 자신의 릴레이션을 참조<\/b>할 수도 있다 (EMPLOYEE.Super_ssn → EMPLOYEE.Ssn)<\/li><\/ul>\n<p>교안 연습 (FK 찾기):<\/p>\n<ul><li>SALESPERSON(Ssn, Name, Start_year, Dept_no), TRIP(Ssn, From_city, To_city, Departure_date, Return_date, Trip_id), EXPENSE(Trip_id, Account#, Amount)<div class=\"sub\">→ TRIP.Ssn → SALESPERSON, EXPENSE.Trip_id → TRIP<\/div><\/li><li>STUDENT(Ssn, …), COURSE(Course#, …), ENROLL(Ssn, Course#, Quarter, Grade), BOOK_ADOPTION(Course#, Quarter, Book_isbn), TEXT(Book_isbn, …)<div class=\"sub\">→ ENROLL.Ssn → STUDENT, ENROLL.Course# → COURSE, BOOK_ADOPTION.Course# → COURSE, BOOK_ADOPTION.Book_isbn → TEXT<\/div><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p18.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p18.jpg\" alt=\"03 p.18 · EMPLOYEE.Dno(FK) → DEPARTMENT.Dnumber(PK)\" loading=\"lazy\"><\/button><figcaption>03 p.18 · EMPLOYEE.Dno(FK) → DEPARTMENT.Dnumber(PK)<\/figcaption><\/figure><\/section>", "title_en": "Keys and Integrity Constraints", "html_en": "<section class=\"sec\" id=\"s-superkey-key\"><h3>Superkey and key<\/h3><p>A DBMS must provide ways to define and enforce constraints. The three core constraints = <b>key constraints, entity integrity, referential integrity<\/b>.<\/p>\n<p><b>Key constraint<\/b>: \"no two distinct tuples can have the same value for the SK attributes\" → in every state r, t₁[SK] ≠ t₂[SK].<\/p>\n<ul><li><b>Superkey (SK)<\/b>: a <b>subset of attributes that uniquely identifies each tuple<\/b>. Every relation has at least one default superkey (the set of all its attributes)<\/li><li><b>Key (K)<\/b>: a superkey such that removing any attribute A leaves a set that is no longer a superkey = a <b>minimal superkey<\/b><ul><li>Minimality is required for a key, optional for a superkey<\/li><li>e.g., {Ssn, Home_phone} is a superkey. Even after removing Home_phone, {Ssn} is unique → {Ssn, Home_phone} is not a key; {Ssn} is a key<\/li><\/ul><\/li><\/ul>\n<div class=\"callout trap\">Trap: key ⊂ superkey. \"Every key is a superkey, but not every superkey is a key.\"<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p15.jpg\" aria-label=\"Enlarge\"><img src=\"img/RDB-p15.jpg\" alt=\"03 p.15 · Removing Home_phone from superkey {Ssn, Home_phone} leaves key {Ssn}\" loading=\"lazy\"><\/button><figcaption>03 p.15 · Removing Home_phone from superkey {Ssn, Home_phone} leaves key {Ssn}<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-candidate-pk\"><h3>Candidate key and primary key<\/h3><ul><li>If a relation schema has more than one key, each is called a <b>candidate key<\/b><\/li><li>One of the candidate keys is designated as the <b>primary key<\/b> and used to identify tuples. <b>Underlined<\/b> in the schema<\/li><li>e.g., CAR's candidate keys = License_number, Engine_serial_number → License_number is chosen as the PK<\/li><li>It is usually better to choose a PK with <b>a single attribute or a small number of attributes<\/b><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p16.jpg\" aria-label=\"Enlarge\"><img src=\"img/RDB-p16.jpg\" alt=\"03 p.16 · Of CAR&#x27;s two candidate keys, License_number is chosen as the PK\" loading=\"lazy\"><\/button><figcaption>03 p.16 · Of CAR&#x27;s two candidate keys, License_number is chosen as the PK<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-entity-integrity\"><h3>Entity integrity constraint<\/h3><p><b>\"No primary key value can be NULL\"<\/b> → for every tuple t, t[PK] ≠ NULL.<\/p>\n<ul><li>Reason: if two or more tuples had NULL primary keys, we <b>could not distinguish them<\/b> when referencing them from other relations<\/li><li>e.g., an attribute that has NULLs, such as Office_phone, cannot be a key<\/li><li>For a composite PK, <b>no part of the PK<\/b> may be NULL<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-ref-integrity\"><h3>Referential integrity constraint<\/h3><p><b>\"The FK value of tuple t₁ must either equal the PK value of some tuple t₂, or be NULL\"<\/b><\/p>\n<ul><li><b>Foreign key (FK)<\/b>: a set of attributes in relation R₁ that <b>references<\/b> R₂. If t₁[FK] = t₂[PK], t₁ references t₂<\/li><li>The FK of R₁ has the <b>same domain<\/b> as the PK of R₂<\/li><li>R₁ = the <b>referencing relation<\/b>, R₂ = the <b>referenced relation<\/b><\/li><li>e.g., EMPLOYEE.Dno → DEPARTMENT.Dnumber. 'John Smith' has Dno=5 → references the 'Research' department tuple = Smith works for Research<\/li><li>Why it is needed: to maintain <b>consistency<\/b> among tuples of two relations. If Dno=3 but department 3 does not exist, the value cannot be interpreted<\/li><li>An FK can <b>reference its own relation<\/b> (EMPLOYEE.Super_ssn → EMPLOYEE.Ssn)<\/li><\/ul>\n<p>Slide exercise (find the FKs):<\/p>\n<ul><li>SALESPERSON(Ssn, Name, Start_year, Dept_no), TRIP(Ssn, From_city, To_city, Departure_date, Return_date, Trip_id), EXPENSE(Trip_id, Account#, Amount)<div class=\"sub\">→ TRIP.Ssn → SALESPERSON, EXPENSE.Trip_id → TRIP<\/div><\/li><li>STUDENT(Ssn, …), COURSE(Course#, …), ENROLL(Ssn, Course#, Quarter, Grade), BOOK_ADOPTION(Course#, Quarter, Book_isbn), TEXT(Book_isbn, …)<div class=\"sub\">→ ENROLL.Ssn → STUDENT, ENROLL.Course# → COURSE, BOOK_ADOPTION.Course# → COURSE, BOOK_ADOPTION.Book_isbn → TEXT<\/div><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p18.jpg\" aria-label=\"Enlarge\"><img src=\"img/RDB-p18.jpg\" alt=\"03 p.18 · EMPLOYEE.Dno (FK) → DEPARTMENT.Dnumber (PK)\" loading=\"lazy\"><\/button><figcaption>03 p.18 · EMPLOYEE.Dno (FK) → DEPARTMENT.Dnumber (PK)<\/figcaption><\/figure><\/section>"}, {"id": "L3-3", "title": "갱신 연산과 제약 위반", "src": "3-1 p.23–30", "secs": [{"id": "op-insert", "title": "삽입 (Insert)", "title_en": "Insert"}, {"id": "op-delete", "title": "삭제 (Delete)", "title_en": "Delete"}, {"id": "op-update", "title": "수정 (Update)", "title_en": "Update (Modify)"}], "md": "## 삽입 (Insert) {#op-insert}\n\n연산 종류: **검색(retrieval)** 과 **갱신(update)**. 기본 갱신 연산 = Insert, Delete, Update(Modify). 적용할 때마다 제약이 깨질 수 있다.\n\n**Insert**: 릴레이션에 투플 하나 추가. 릴레이션 이름 + 값 리스트(속성 순서대로).\n\n**Insert는 세 가지 제약을 다 어길 수 있다.**\n\n| 위반 | 원인 | 교안 예 (COMPANY 상태) |\n|---|---|---|\n| **키 제약** | 새 투플의 키 값이 이미 다른 투플에 있음 | <'Alicia', …, **'999887777'**, …, 4> → Ssn 999887777은 이미 Zelaya |\n| **개체 무결성** | 새 투플의 PK(의 일부)가 NULL | <'Cecilia', …, **NULL**, …, 4> |\n| **참조 무결성** | FK가 참조하는 투플이 없음 | <'Cecilia', …, '677678989', …, **7**> → Dnumber=7인 부서 없음 |\n\n<'Cecilia', 'F', 'Kolonsky', '677678989', …, NULL, 4> 는 **모든 제약을 만족** (Super_ssn이 NULL인 건 FK니까 허용).\n\n## 삭제 (Delete) {#op-delete}\n\n**Delete**: 릴레이션 이름 + 지울 투플의 PK 값 지정.\n\n**Delete는 참조 무결성만 어길 수 있다** (지운 투플을 다른 투플이 참조하고 있을 때).\n- EMPLOYEE에서 Ssn='999887777' 삭제 → WORKS_ON 투플 2개가 참조 → **위반**\n- EMPLOYEE에서 Ssn='333445555' 삭제 → WORKS_ON 4개 + EMPLOYEE 2개(Super_ssn)가 참조 → **위반** (실제로는 DEPARTMENT.Mgr_ssn, DEPENDENT.Essn도 참조함)\n- WORKS_ON에서 Essn='999887777' AND Pno=10 삭제 → 아무도 참조 안 함 → 만족\n\n## 수정 (Update) {#op-update}\n\n**Update**: 바꿀 속성과 새 값 지정.\n\n**Update는 키 제약과 참조 무결성을 어길 수 있다. PK나 FK 속성을 바꿀 때만 문제가 된다.**\n- Ssn='999887777'인 사원의 Dno를 **7**로 → 7번 부서 없음 → **참조 무결성** 위반\n- Ssn='999887777'을 **'987654321'** 로 → 이미 Wallace의 Ssn(키 제약) + WORKS_ON 등에서 999887777을 참조하던 투플이 고아가 됨(참조 무결성) → **둘 다** 위반\n- PK를 NULL로 바꾸면 개체 무결성도 깨진다 (교안 요약엔 키·참조만 나옴)\n\n> 시험 포인트: 요약표 그대로 — Insert = 키·개체·참조 **전부 가능**, Delete = **참조만**, Update = **키·참조** (PK/FK를 바꿀 때만).", "html": "<section class=\"sec\" id=\"s-op-insert\"><h3>삽입 (Insert)<\/h3><p>연산 종류: <b>검색(retrieval)<\/b> 과 <b>갱신(update)<\/b>. 기본 갱신 연산 = Insert, Delete, Update(Modify). 적용할 때마다 제약이 깨질 수 있다.<\/p>\n<p><b>Insert<\/b>: 릴레이션에 투플 하나 추가. 릴레이션 이름 + 값 리스트(속성 순서대로).<\/p>\n<p><b>Insert는 세 가지 제약을 다 어길 수 있다.<\/b><\/p>\n<div class=\"tblw\"><table><thead><tr><th>위반<\/th><th>원인<\/th><th>교안 예 (COMPANY 상태)<\/th><\/tr><\/thead><tbody><tr><td><b>키 제약<\/b><\/td><td>새 투플의 키 값이 이미 다른 투플에 있음<\/td><td>&lt;'Alicia', …, <b>'999887777'<\/b>, …, 4&gt; → Ssn 999887777은 이미 Zelaya<\/td><\/tr><tr><td><b>개체 무결성<\/b><\/td><td>새 투플의 PK(의 일부)가 NULL<\/td><td>&lt;'Cecilia', …, <b>NULL<\/b>, …, 4&gt;<\/td><\/tr><tr><td><b>참조 무결성<\/b><\/td><td>FK가 참조하는 투플이 없음<\/td><td>&lt;'Cecilia', …, '677678989', …, <b>7<\/b>&gt; → Dnumber=7인 부서 없음<\/td><\/tr><\/tbody><\/table><\/div>\n<p>&lt;'Cecilia', 'F', 'Kolonsky', '677678989', …, NULL, 4&gt; 는 <b>모든 제약을 만족<\/b> (Super_ssn이 NULL인 건 FK니까 허용).<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p25.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p25.jpg\" alt=\"03 p.25 · Insert의 키 제약 위반, 개체 무결성 위반\" loading=\"lazy\"><\/button><figcaption>03 p.25 · Insert의 키 제약 위반, 개체 무결성 위반<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p26.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p26.jpg\" alt=\"03 p.26 · Insert의 참조 무결성 위반 (Dno=7)과 모든 제약을 만족하는 경우\" loading=\"lazy\"><\/button><figcaption>03 p.26 · Insert의 참조 무결성 위반 (Dno=7)과 모든 제약을 만족하는 경우<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-op-delete\"><h3>삭제 (Delete)<\/h3><p><b>Delete<\/b>: 릴레이션 이름 + 지울 투플의 PK 값 지정.<\/p>\n<p><b>Delete는 참조 무결성만 어길 수 있다<\/b> (지운 투플을 다른 투플이 참조하고 있을 때).<\/p>\n<ul><li>EMPLOYEE에서 Ssn='999887777' 삭제 → WORKS_ON 투플 2개가 참조 → <b>위반<\/b><\/li><li>EMPLOYEE에서 Ssn='333445555' 삭제 → WORKS_ON 4개 + EMPLOYEE 2개(Super_ssn)가 참조 → <b>위반<\/b> (실제로는 DEPARTMENT.Mgr_ssn, DEPENDENT.Essn도 참조함)<\/li><li>WORKS_ON에서 Essn='999887777' AND Pno=10 삭제 → 아무도 참조 안 함 → 만족<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p28.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p28.jpg\" alt=\"03 p.28 · Delete의 참조 무결성 위반\" loading=\"lazy\"><\/button><figcaption>03 p.28 · Delete의 참조 무결성 위반<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-op-update\"><h3>수정 (Update)<\/h3><p><b>Update<\/b>: 바꿀 속성과 새 값 지정.<\/p>\n<p><b>Update는 키 제약과 참조 무결성을 어길 수 있다. PK나 FK 속성을 바꿀 때만 문제가 된다.<\/b><\/p>\n<ul><li>Ssn='999887777'인 사원의 Dno를 <b>7<\/b>로 → 7번 부서 없음 → <b>참조 무결성<\/b> 위반<\/li><li>Ssn='999887777'을 <b>'987654321'<\/b> 로 → 이미 Wallace의 Ssn(키 제약) + WORKS_ON 등에서 999887777을 참조하던 투플이 고아가 됨(참조 무결성) → <b>둘 다<\/b> 위반<\/li><li>PK를 NULL로 바꾸면 개체 무결성도 깨진다 (교안 요약엔 키·참조만 나옴)<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 요약표 그대로 — Insert = 키·개체·참조 <b>전부 가능<\/b>, Delete = <b>참조만<\/b>, Update = <b>키·참조<\/b> (PK/FK를 바꿀 때만).<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p30.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p30.jpg\" alt=\"03 p.30 · Update의 참조 무결성 위반, 키 + 참조 무결성 동시 위반\" loading=\"lazy\"><\/button><figcaption>03 p.30 · Update의 참조 무결성 위반, 키 + 참조 무결성 동시 위반<\/figcaption><\/figure><\/section>", "title_en": "Update Operations and Constraint Violations", "html_en": "<section class=\"sec\" id=\"s-op-insert\"><h3>Insert<\/h3><p>Kinds of operations: <b>retrievals<\/b> and <b>updates<\/b>. Basic update operations = Insert, Delete, Update (Modify). Each one may violate constraints when applied.<\/p>\n<p><b>Insert<\/b>: adds one tuple to a relation. Given the relation name + a list of values (in attribute order).<\/p>\n<p><b>Insert can violate all three constraints.<\/b><\/p>\n<div class=\"tblw\"><table><thead><tr><th>Violation<\/th><th>Cause<\/th><th>Slide example (COMPANY state)<\/th><\/tr><\/thead><tbody><tr><td><b>Key constraint<\/b><\/td><td>The new tuple's key value already exists in another tuple<\/td><td>&lt;'Alicia', …, <b>'999887777'<\/b>, …, 4&gt; → Ssn 999887777 already belongs to Zelaya<\/td><\/tr><tr><td><b>Entity integrity<\/b><\/td><td>The new tuple's PK (or part of it) is NULL<\/td><td>&lt;'Cecilia', …, <b>NULL<\/b>, …, 4&gt;<\/td><\/tr><tr><td><b>Referential integrity<\/b><\/td><td>The tuple referenced by the FK does not exist<\/td><td>&lt;'Cecilia', …, '677678989', …, <b>7<\/b>&gt; → no department with Dnumber=7<\/td><\/tr><\/tbody><\/table><\/div>\n<p>&lt;'Cecilia', 'F', 'Kolonsky', '677678989', …, NULL, 4&gt; <b>satisfies all constraints<\/b> (Super_ssn being NULL is allowed because it is an FK).<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p25.jpg\" aria-label=\"Enlarge\"><img src=\"img/RDB-p25.jpg\" alt=\"03 p.25 · Insert violating the key constraint and entity integrity\" loading=\"lazy\"><\/button><figcaption>03 p.25 · Insert violating the key constraint and entity integrity<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p26.jpg\" aria-label=\"Enlarge\"><img src=\"img/RDB-p26.jpg\" alt=\"03 p.26 · Insert violating referential integrity (Dno=7) and a case satisfying all constraints\" loading=\"lazy\"><\/button><figcaption>03 p.26 · Insert violating referential integrity (Dno=7) and a case satisfying all constraints<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-op-delete\"><h3>Delete<\/h3><p><b>Delete<\/b>: specify the relation name + the PK value of the tuple to delete.<\/p>\n<p><b>Delete can violate only referential integrity<\/b> (when the deleted tuple is referenced by other tuples).<\/p>\n<ul><li>Delete Ssn='999887777' from EMPLOYEE → referenced by 2 WORKS_ON tuples → <b>violation<\/b><\/li><li>Delete Ssn='333445555' from EMPLOYEE → referenced by 4 WORKS_ON tuples + 2 EMPLOYEE tuples (Super_ssn) → <b>violation<\/b> (in fact DEPARTMENT.Mgr_ssn and DEPENDENT.Essn also reference it)<\/li><li>Delete Essn='999887777' AND Pno=10 from WORKS_ON → nothing references it → OK<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p28.jpg\" aria-label=\"Enlarge\"><img src=\"img/RDB-p28.jpg\" alt=\"03 p.28 · Delete violating referential integrity\" loading=\"lazy\"><\/button><figcaption>03 p.28 · Delete violating referential integrity<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-op-update\"><h3>Update (Modify)<\/h3><p><b>Update<\/b>: specify the attribute(s) to change and the new value(s).<\/p>\n<p><b>Update can violate key constraints and referential integrity. It is a problem only when a PK or FK attribute is modified.<\/b><\/p>\n<ul><li>Change Dno of the employee with Ssn='999887777' to <b>7<\/b> → no department 7 → <b>referential integrity<\/b> violation<\/li><li>Change Ssn='999887777' to <b>'987654321'<\/b> → already Wallace's Ssn (key constraint) + tuples in WORKS_ON etc. that referenced 999887777 become orphans (referential integrity) → <b>both<\/b> violated<\/li><li>Changing a PK to NULL also violates entity integrity (the slide summary lists only key and referential)<\/li><\/ul>\n<div class=\"callout exam\">Exam point: exactly as in the summary table — Insert = key, entity and referential <b>all possible<\/b>; Delete = <b>referential only<\/b>; Update = <b>key and referential<\/b> (only when changing a PK/FK).<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p30.jpg\" aria-label=\"Enlarge\"><img src=\"img/RDB-p30.jpg\" alt=\"03 p.30 · Update violating referential integrity, and violating key + referential integrity at once\" loading=\"lazy\"><\/button><figcaption>03 p.30 · Update violating referential integrity, and violating key + referential integrity at once<\/figcaption><\/figure><\/section>"}, {"id": "L3-4", "title": "ER→관계 매핑 ① 개체 · 다중값 · 약한 개체", "src": "3-1 p.32–36", "secs": [{"id": "map-entity", "title": "정규 개체 타입 매핑", "title_en": "Mapping regular entity types"}, {"id": "map-multival", "title": "다중값 속성 매핑", "title_en": "Mapping multivalued attributes"}, {"id": "map-weak", "title": "약한 개체 타입 매핑", "title_en": "Mapping weak entity types"}], "md": "## 정규 개체 타입 매핑 {#map-entity}\n\n매핑 순서: 개체 타입(정규·약한) → 다중값 속성 → 관계 타입(1:1, 1:N, M:N, n진).\n\n**정규(regular) 개체 타입 E**\n1. E의 **단순 속성을 모두** 포함하는 릴레이션 R 생성. 복합 속성은 **단순 구성 속성만** 넣음 (Name → Fname, Minit, Lname)\n2. E의 키 속성 중 하나를 R의 **PK**로 지정 (나머지 키는 UNIQUE 후보 키)\n3. 다중값 속성은 여기서 넣지 않음 → 다음 단계\n\n예) DEPARTMENT(Dname, **Dnumber**) — Locations는 아직 빠짐.\n\n## 다중값 속성 매핑 {#map-multival}\n\n**다중값 속성 A** (릴레이션에서는 허용 안 됨)\n1. A마다 **별도 릴레이션 R** 생성\n2. R에 A와, 원래 릴레이션의 PK K를 넣는다. K는 R에서 **FK** (원래 릴레이션 참조). 키 값이 반복됨\n3. **(A, K) 조합을 PK**로\n\n예) DEPT_LOCATIONS(**Dnumber**, **Dlocation**), Dnumber → DEPARTMENT. (5, Seoul), (5, Incheon), (5, Suwon), (3, Seoul), (3, Daejeon)\n\n## 약한 개체 타입 매핑 {#map-weak}\n\n**약한 개체 타입 W**\n1. W의 단순 속성을 모두 포함하는 릴레이션 R 생성 (복합은 구성 속성만)\n2. **소유 개체 타입의 PK를 FK로** 포함 → 이게 **식별 관계 타입을 매핑**한 것\n3. **소유자 PK + 부분 키 조합을 PK**로\n\n예) DEPENDENT(**Essn**, **Dependent_name**, Sex, Bdate, Relationship), Essn → EMPLOYEE.Ssn\n\n> 함정: 식별 관계(DEPENDENTS_OF)는 별도 릴레이션을 만들지 않는다. 소유자 PK를 FK로 넣는 것 자체가 식별 관계의 매핑.", "html": "<section class=\"sec\" id=\"s-map-entity\"><h3>정규 개체 타입 매핑<\/h3><p>매핑 순서: 개체 타입(정규·약한) → 다중값 속성 → 관계 타입(1:1, 1:N, M:N, n진).<\/p>\n<p><b>정규(regular) 개체 타입 E<\/b><\/p>\n<ol><li>E의 <b>단순 속성을 모두<\/b> 포함하는 릴레이션 R 생성. 복합 속성은 <b>단순 구성 속성만<\/b> 넣음 (Name → Fname, Minit, Lname)<\/li><li>E의 키 속성 중 하나를 R의 <b>PK<\/b>로 지정 (나머지 키는 UNIQUE 후보 키)<\/li><li>다중값 속성은 여기서 넣지 않음 → 다음 단계<\/li><\/ol>\n<p>예) DEPARTMENT(Dname, <b>Dnumber<\/b>) — Locations는 아직 빠짐.<\/p><\/section>\n<section class=\"sec\" id=\"s-map-multival\"><h3>다중값 속성 매핑<\/h3><p><b>다중값 속성 A<\/b> (릴레이션에서는 허용 안 됨)<\/p>\n<ol><li>A마다 <b>별도 릴레이션 R<\/b> 생성<\/li><li>R에 A와, 원래 릴레이션의 PK K를 넣는다. K는 R에서 <b>FK<\/b> (원래 릴레이션 참조). 키 값이 반복됨<\/li><li><b>(A, K) 조합을 PK<\/b>로<\/li><\/ol>\n<p>예) DEPT_LOCATIONS(<b>Dnumber<\/b>, <b>Dlocation<\/b>), Dnumber → DEPARTMENT. (5, Seoul), (5, Incheon), (5, Suwon), (3, Seoul), (3, Daejeon)<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p35.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p35.jpg\" alt=\"03 p.35 · 다중값 속성 Locations → DEPT_LOCATIONS(Dnumber, Dlocation)\" loading=\"lazy\"><\/button><figcaption>03 p.35 · 다중값 속성 Locations → DEPT_LOCATIONS(Dnumber, Dlocation)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-map-weak\"><h3>약한 개체 타입 매핑<\/h3><p><b>약한 개체 타입 W<\/b><\/p>\n<ol><li>W의 단순 속성을 모두 포함하는 릴레이션 R 생성 (복합은 구성 속성만)<\/li><li><b>소유 개체 타입의 PK를 FK로<\/b> 포함 → 이게 <b>식별 관계 타입을 매핑<\/b>한 것<\/li><li><b>소유자 PK + 부분 키 조합을 PK<\/b>로<\/li><\/ol>\n<p>예) DEPENDENT(<b>Essn<\/b>, <b>Dependent_name<\/b>, Sex, Bdate, Relationship), Essn → EMPLOYEE.Ssn<\/p>\n<div class=\"callout trap\">함정: 식별 관계(DEPENDENTS_OF)는 별도 릴레이션을 만들지 않는다. 소유자 PK를 FK로 넣는 것 자체가 식별 관계의 매핑.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p36.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p36.jpg\" alt=\"03 p.36 · 약한 개체 DEPENDENT → PK (Essn, Dependent_name)\" loading=\"lazy\"><\/button><figcaption>03 p.36 · 약한 개체 DEPENDENT → PK (Essn, Dependent_name)<\/figcaption><\/figure><\/section>", "title_en": "ER-to-Relational Mapping ①: Entities, Multivalued Attributes, Weak Entities", "html_en": "<section class=\"sec\" id=\"s-map-entity\"><h3>Mapping regular entity types<\/h3><p>Mapping order: entity types (regular, weak) → multivalued attributes → relationship types (1:1, 1:N, M:N, n-ary).<\/p>\n<p><b>Regular entity type E<\/b><\/p>\n<ol><li>Create a relation R that includes <b>all simple attributes<\/b> of E. For a composite attribute include <b>only its simple component attributes<\/b> (Name → Fname, Minit, Lname)<\/li><li>Choose one of E's key attributes as the <b>PK<\/b> of R (other keys become UNIQUE candidate keys)<\/li><li>Multivalued attributes are not included here → next step<\/li><\/ol>\n<p>e.g., DEPARTMENT(Dname, <b>Dnumber<\/b>) — Locations is left out for now.<\/p><\/section>\n<section class=\"sec\" id=\"s-map-multival\"><h3>Mapping multivalued attributes<\/h3><p><b>Multivalued attribute A<\/b> (not allowed in a relation)<\/p>\n<ol><li>Create a <b>separate relation R<\/b> for each A<\/li><li>Put A and the PK K of the original relation into R. K is an <b>FK<\/b> in R (referencing the original relation). Key values repeat<\/li><li>The <b>combination (A, K) is the PK<\/b><\/li><\/ol>\n<p>e.g., DEPT_LOCATIONS(<b>Dnumber<\/b>, <b>Dlocation<\/b>), Dnumber → DEPARTMENT. (5, Seoul), (5, Incheon), (5, Suwon), (3, Seoul), (3, Daejeon)<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p35.jpg\" aria-label=\"Enlarge\"><img src=\"img/RDB-p35.jpg\" alt=\"03 p.35 · Multivalued attribute Locations → DEPT_LOCATIONS(Dnumber, Dlocation)\" loading=\"lazy\"><\/button><figcaption>03 p.35 · Multivalued attribute Locations → DEPT_LOCATIONS(Dnumber, Dlocation)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-map-weak\"><h3>Mapping weak entity types<\/h3><p><b>Weak entity type W<\/b><\/p>\n<ol><li>Create a relation R that includes all simple attributes of W (only component attributes of composites)<\/li><li>Include the <b>PK of the owner entity type as an FK<\/b> → this is the <b>mapping of the identifying relationship type<\/b><\/li><li>The <b>combination of the owner's PK + the partial key is the PK<\/b><\/li><\/ol>\n<p>e.g., DEPENDENT(<b>Essn<\/b>, <b>Dependent_name<\/b>, Sex, Bdate, Relationship), Essn → EMPLOYEE.Ssn<\/p>\n<div class=\"callout trap\">Trap: the identifying relationship (DEPENDENTS_OF) does not get its own relation. Putting the owner's PK in as an FK is itself the mapping of the identifying relationship.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p36.jpg\" aria-label=\"Enlarge\"><img src=\"img/RDB-p36.jpg\" alt=\"03 p.36 · Weak entity DEPENDENT → PK (Essn, Dependent_name)\" loading=\"lazy\"><\/button><figcaption>03 p.36 · Weak entity DEPENDENT → PK (Essn, Dependent_name)<\/figcaption><\/figure><\/section>"}, {"id": "L3-5", "title": "ER→관계 매핑 ② 관계 타입", "src": "3-1 p.37–49", "secs": [{"id": "map-11", "title": "1:1 관계 매핑", "title_en": "Mapping 1:1 relationships"}, {"id": "map-1n", "title": "1:N 관계 매핑", "title_en": "Mapping 1:N relationships"}, {"id": "map-mn", "title": "M:N 관계 매핑", "title_en": "Mapping M:N relationships"}, {"id": "map-nary", "title": "n진 관계 매핑", "title_en": "Mapping n-ary relationships"}, {"id": "map-summary", "title": "ER ↔ 관계 모델 대응", "title_en": "ER ↔ relational model correspondence"}], "md": "## 1:1 관계 매핑 {#map-11}\n\n방법 3가지: **외래 키 방식** (가장 많이 쓰고 유용), **합병 릴레이션 방식** (두 개체를 한 릴레이션으로), **교차 참조(관계 릴레이션) 방식**.\n\n**외래 키 방식**\n1. 참여 개체 타입 S, T 확인\n2. 한쪽(S)을 골라 **상대(T)의 PK를 FK로** 넣는다. **전체 참여 쪽을 S로** 고르는 게 낫다\n3. 관계의 단순 속성도 S에 넣는다\n\n예) MANAGES: DEPARTMENT(전체 참여)를 S로 → DEPARTMENT(Dname, **Dnumber**, Mgr_ssn, Mgr_start_date), Mgr_ssn → EMPLOYEE.\n\n**왜 전체 참여 쪽?** 반대로 EMPLOYEE(부분 참여)를 S로 하면 EMPLOYEE에 D_managed, Mgr_start_date가 들어가는데, 부서를 관리하지 않는 대부분의 사원은 이 값이 **NULL**이 된다. 전체 참여 쪽에 넣으면 NULL이 생기지 않는다.\n\n## 1:N 관계 매핑 {#map-1n}\n\n방법 2가지: **외래 키 방식** (릴레이션 수가 줄어서 선호), 교차 참조 방식.\n\n**외래 키 방식**\n1. **N쪽** 개체 타입을 나타내는 릴레이션 S 확인\n2. S에 상대(1쪽) 릴레이션 T의 **PK를 FK로** 넣는다\n3. 관계의 단순 속성도 S에 넣는다\n\n이유: N쪽 개체 인스턴스 하나는 1쪽 개체 **최대 하나**와 연결 → FK 값 하나로 표현 가능.\n- WORKS_FOR → EMPLOYEE에 **Dno** (→ DEPARTMENT)\n- SUPERVISION → EMPLOYEE에 **Super_ssn** (→ EMPLOYEE, 자기 참조)\n- CONTROLS → PROJECT에 **Dnum** (→ DEPARTMENT)\n\n> 함정: 1쪽에 FK를 넣으면 다중값이 돼서 원자성을 어긴다. FK는 **항상 N쪽**.\n\n## M:N 관계 매핑 {#map-mn}\n\n방법 **하나뿐**: **교차 참조 (관계 릴레이션) 방식**. M:N은 FK 하나로 표현할 수 없다.\n1. 관계 타입 R을 나타내는 **별도 릴레이션 S** 생성\n2. 참여 개체 릴레이션들의 **PK를 FK로** S에 넣는다\n3. **FK들의 조합을 PK**로\n4. M:N 관계의 단순 속성도 S에 넣는다\n\n예) WORKS_ON(**Essn**, **Pno**, Hours), Essn → EMPLOYEE, Pno → PROJECT. 관계 릴레이션 = lookup table.\n\n## n진 관계 매핑 {#map-nary}\n\n**교차 참조 방식** (M:N과 같은 절차)\n1. 별도 릴레이션 S 생성\n2. 참여하는 n개 개체 릴레이션의 PK를 FK로 넣음\n3. FK 전부의 조합을 PK로 (보통. 어느 참여에 max가 1이면 그 FK는 PK에서 빠질 수 있다)\n4. 관계의 단순 속성 포함\n\n예) SUPPLY(**Sname**, **Proj_name**, **Part_no**, Quantity) — SUPPLIER, PROJECT, PART 참조.\n\n## ER ↔ 관계 모델 대응 {#map-summary}\n\n| ER 모델 | 관계 모델 |\n|---|---|\n| 개체 타입 | 개체 릴레이션 |\n| 1:1 또는 1:N 관계 타입 | 외래 키 (또는 관계 릴레이션) |\n| M:N 관계 타입 | 관계 릴레이션 + FK **2개** |\n| n진 관계 타입 | 관계 릴레이션 + FK **n개** |\n| 단순 속성 | 속성 |\n| 복합 속성 | 단순 구성 속성들의 집합 |\n| 다중값 속성 | 릴레이션 + 외래 키 |\n| 값 집합 (value set) | 도메인 |\n| 키 속성 | 기본 키 (또는 보조 키) |\n\n교안 연습 3 (UNIVERSITY: COLLEGE, INSTRUCTOR, DEPT, STUDENT, COURSE, SECTION) 풀이 순서:\n1. 정규 개체 → COLLEGE(CName, COffice, CPhone), INSTRUCTOR(Id, Rank, IName, IOffice, IPhone), DEPT(DName, DCode, DOffice, DPhone), COURSE(CCode, Credits, CoName, Level, CDesc), SECTION(SecId, SecNo, Sem, Year, Bldg, RoomNo, DaysTime), STUDENT(Sid, DOB, FName, MName, LName, Addr, Phone, Major)\n2. 1:1 → DEAN: COLLEGE에 DeanId (COLLEGE가 (1,1) 전체 참여), CHAIR: DEPT에 ChairId, CStartDate\n3. 1:N → INSTRUCTOR.Employed(EMPLOYS), DEPT.Admined(ADMINS), COURSE.Offered(OFFERS), SECTION.Taught(TEACHES), SECTION.Belongs(SECS), STUDENT.Dept(HAS)\n4. M:N → TAKES(**Sid**, **SecId**, Grade)", "html": "<section class=\"sec\" id=\"s-map-11\"><h3>1:1 관계 매핑<\/h3><p>방법 3가지: <b>외래 키 방식<\/b> (가장 많이 쓰고 유용), <b>합병 릴레이션 방식<\/b> (두 개체를 한 릴레이션으로), <b>교차 참조(관계 릴레이션) 방식<\/b>.<\/p>\n<p><b>외래 키 방식<\/b><\/p>\n<ol><li>참여 개체 타입 S, T 확인<\/li><li>한쪽(S)을 골라 <b>상대(T)의 PK를 FK로<\/b> 넣는다. <b>전체 참여 쪽을 S로<\/b> 고르는 게 낫다<\/li><li>관계의 단순 속성도 S에 넣는다<\/li><\/ol>\n<p>예) MANAGES: DEPARTMENT(전체 참여)를 S로 → DEPARTMENT(Dname, <b>Dnumber<\/b>, Mgr_ssn, Mgr_start_date), Mgr_ssn → EMPLOYEE.<\/p>\n<p><b>왜 전체 참여 쪽?<\/b> 반대로 EMPLOYEE(부분 참여)를 S로 하면 EMPLOYEE에 D_managed, Mgr_start_date가 들어가는데, 부서를 관리하지 않는 대부분의 사원은 이 값이 <b>NULL<\/b>이 된다. 전체 참여 쪽에 넣으면 NULL이 생기지 않는다.<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p38.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p38.jpg\" alt=\"03 p.38 · 1:1 MANAGES: 전체 참여 쪽 DEPARTMENT에 Mgr_ssn, Mgr_start_date\" loading=\"lazy\"><\/button><figcaption>03 p.38 · 1:1 MANAGES: 전체 참여 쪽 DEPARTMENT에 Mgr_ssn, Mgr_start_date<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p39.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p39.jpg\" alt=\"03 p.39 · 부분 참여 쪽 EMPLOYEE를 고르면 NULL이 많아짐\" loading=\"lazy\"><\/button><figcaption>03 p.39 · 부분 참여 쪽 EMPLOYEE를 고르면 NULL이 많아짐<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-map-1n\"><h3>1:N 관계 매핑<\/h3><p>방법 2가지: <b>외래 키 방식<\/b> (릴레이션 수가 줄어서 선호), 교차 참조 방식.<\/p>\n<p><b>외래 키 방식<\/b><\/p>\n<ol><li><b>N쪽<\/b> 개체 타입을 나타내는 릴레이션 S 확인<\/li><li>S에 상대(1쪽) 릴레이션 T의 <b>PK를 FK로<\/b> 넣는다<\/li><li>관계의 단순 속성도 S에 넣는다<\/li><\/ol>\n<p>이유: N쪽 개체 인스턴스 하나는 1쪽 개체 <b>최대 하나<\/b>와 연결 → FK 값 하나로 표현 가능.<\/p>\n<ul><li>WORKS_FOR → EMPLOYEE에 <b>Dno<\/b> (→ DEPARTMENT)<\/li><li>SUPERVISION → EMPLOYEE에 <b>Super_ssn<\/b> (→ EMPLOYEE, 자기 참조)<\/li><li>CONTROLS → PROJECT에 <b>Dnum<\/b> (→ DEPARTMENT)<\/li><\/ul>\n<div class=\"callout trap\">함정: 1쪽에 FK를 넣으면 다중값이 돼서 원자성을 어긴다. FK는 <b>항상 N쪽<\/b>.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p41.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p41.jpg\" alt=\"03 p.41 · 1:N WORKS_FOR: N쪽 EMPLOYEE에 Dno\" loading=\"lazy\"><\/button><figcaption>03 p.41 · 1:N WORKS_FOR: N쪽 EMPLOYEE에 Dno<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p42.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p42.jpg\" alt=\"03 p.42 · SUPERVISION → Super_ssn, CONTROLS → Dnum\" loading=\"lazy\"><\/button><figcaption>03 p.42 · SUPERVISION → Super_ssn, CONTROLS → Dnum<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-map-mn\"><h3>M:N 관계 매핑<\/h3><p>방법 <b>하나뿐<\/b>: <b>교차 참조 (관계 릴레이션) 방식<\/b>. M:N은 FK 하나로 표현할 수 없다.<\/p>\n<ol><li>관계 타입 R을 나타내는 <b>별도 릴레이션 S<\/b> 생성<\/li><li>참여 개체 릴레이션들의 <b>PK를 FK로<\/b> S에 넣는다<\/li><li><b>FK들의 조합을 PK<\/b>로<\/li><li>M:N 관계의 단순 속성도 S에 넣는다<\/li><\/ol>\n<p>예) WORKS_ON(<b>Essn<\/b>, <b>Pno<\/b>, Hours), Essn → EMPLOYEE, Pno → PROJECT. 관계 릴레이션 = lookup table.<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p44.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p44.jpg\" alt=\"03 p.44 · M:N WORKS_ON → 관계 릴레이션 WORKS_ON(Essn, Pno, Hours)\" loading=\"lazy\"><\/button><figcaption>03 p.44 · M:N WORKS_ON → 관계 릴레이션 WORKS_ON(Essn, Pno, Hours)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-map-nary\"><h3>n진 관계 매핑<\/h3><p><b>교차 참조 방식<\/b> (M:N과 같은 절차)<\/p>\n<ol><li>별도 릴레이션 S 생성<\/li><li>참여하는 n개 개체 릴레이션의 PK를 FK로 넣음<\/li><li>FK 전부의 조합을 PK로 (보통. 어느 참여에 max가 1이면 그 FK는 PK에서 빠질 수 있다)<\/li><li>관계의 단순 속성 포함<\/li><\/ol>\n<p>예) SUPPLY(<b>Sname<\/b>, <b>Proj_name<\/b>, <b>Part_no<\/b>, Quantity) — SUPPLIER, PROJECT, PART 참조.<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p45.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p45.jpg\" alt=\"03 p.45 · 3진 SUPPLY → SUPPLY(Sname, Proj_name, Part_no, Quantity)\" loading=\"lazy\"><\/button><figcaption>03 p.45 · 3진 SUPPLY → SUPPLY(Sname, Proj_name, Part_no, Quantity)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-map-summary\"><h3>ER ↔ 관계 모델 대응<\/h3><div class=\"tblw\"><table><thead><tr><th>ER 모델<\/th><th>관계 모델<\/th><\/tr><\/thead><tbody><tr><td>개체 타입<\/td><td>개체 릴레이션<\/td><\/tr><tr><td>1:1 또는 1:N 관계 타입<\/td><td>외래 키 (또는 관계 릴레이션)<\/td><\/tr><tr><td>M:N 관계 타입<\/td><td>관계 릴레이션 + FK <b>2개<\/b><\/td><\/tr><tr><td>n진 관계 타입<\/td><td>관계 릴레이션 + FK <b>n개<\/b><\/td><\/tr><tr><td>단순 속성<\/td><td>속성<\/td><\/tr><tr><td>복합 속성<\/td><td>단순 구성 속성들의 집합<\/td><\/tr><tr><td>다중값 속성<\/td><td>릴레이션 + 외래 키<\/td><\/tr><tr><td>값 집합 (value set)<\/td><td>도메인<\/td><\/tr><tr><td>키 속성<\/td><td>기본 키 (또는 보조 키)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>교안 연습 3 (UNIVERSITY: COLLEGE, INSTRUCTOR, DEPT, STUDENT, COURSE, SECTION) 풀이 순서:<\/p>\n<ol><li>정규 개체 → COLLEGE(CName, COffice, CPhone), INSTRUCTOR(Id, Rank, IName, IOffice, IPhone), DEPT(DName, DCode, DOffice, DPhone), COURSE(CCode, Credits, CoName, Level, CDesc), SECTION(SecId, SecNo, Sem, Year, Bldg, RoomNo, DaysTime), STUDENT(Sid, DOB, FName, MName, LName, Addr, Phone, Major)<\/li><li>1:1 → DEAN: COLLEGE에 DeanId (COLLEGE가 (1,1) 전체 참여), CHAIR: DEPT에 ChairId, CStartDate<\/li><li>1:N → INSTRUCTOR.Employed(EMPLOYS), DEPT.Admined(ADMINS), COURSE.Offered(OFFERS), SECTION.Taught(TEACHES), SECTION.Belongs(SECS), STUDENT.Dept(HAS)<\/li><li>M:N → TAKES(<b>Sid<\/b>, <b>SecId<\/b>, Grade)<\/li><\/ol><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p49.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p49.jpg\" alt=\"03 p.49 · ER 모델과 관계 모델의 대응표\" loading=\"lazy\"><\/button><figcaption>03 p.49 · ER 모델과 관계 모델의 대응표<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p46.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p46.jpg\" alt=\"03 p.46 · 연습 3: UNIVERSITY ER 스키마\" loading=\"lazy\"><\/button><figcaption>03 p.46 · 연습 3: UNIVERSITY ER 스키마<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/EX-p16.jpg\" aria-label=\"크게 보기\"><img src=\"img/EX-p16.jpg\" alt=\"db-exercises p.57 · 연습 3 매핑 결과 (M:N TAKES까지)\" loading=\"lazy\"><\/button><figcaption>db-exercises p.57 · 연습 3 매핑 결과 (M:N TAKES까지)<\/figcaption><\/figure><\/section>", "title_en": "ER-to-Relational Mapping ②: Relationship Types", "html_en": "<section class=\"sec\" id=\"s-map-11\"><h3>Mapping 1:1 relationships<\/h3><p>Three approaches: <b>foreign key approach<\/b> (most common and useful), <b>merged relation approach<\/b> (combine the two entities into one relation), <b>cross-reference (relationship relation) approach<\/b>.<\/p>\n<p><b>Foreign key approach<\/b><\/p>\n<ol><li>Identify the participating entity types S and T<\/li><li>Choose one side (S) and include <b>the PK of the other side (T) as an FK<\/b>. It is better to choose <b>the side with total participation as S<\/b><\/li><li>Also include the simple attributes of the relationship in S<\/li><\/ol>\n<p>e.g., MANAGES: choose DEPARTMENT (total participation) as S → DEPARTMENT(Dname, <b>Dnumber<\/b>, Mgr_ssn, Mgr_start_date), Mgr_ssn → EMPLOYEE.<\/p>\n<p><b>Why the total-participation side?<\/b> If we instead choose EMPLOYEE (partial participation) as S, EMPLOYEE gets D_managed and Mgr_start_date, and for most employees, who do not manage a department, these values would be <b>NULL<\/b>. Putting them on the total-participation side produces no NULLs.<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p38.jpg\" aria-label=\"Enlarge\"><img src=\"img/RDB-p38.jpg\" alt=\"03 p.38 · 1:1 MANAGES: Mgr_ssn, Mgr_start_date in DEPARTMENT, the total-participation side\" loading=\"lazy\"><\/button><figcaption>03 p.38 · 1:1 MANAGES: Mgr_ssn, Mgr_start_date in DEPARTMENT, the total-participation side<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p39.jpg\" aria-label=\"Enlarge\"><img src=\"img/RDB-p39.jpg\" alt=\"03 p.39 · Choosing EMPLOYEE, the partial-participation side, produces many NULLs\" loading=\"lazy\"><\/button><figcaption>03 p.39 · Choosing EMPLOYEE, the partial-participation side, produces many NULLs<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-map-1n\"><h3>Mapping 1:N relationships<\/h3><p>Two approaches: <b>foreign key approach<\/b> (preferred because it reduces the number of relations), cross-reference approach.<\/p>\n<p><b>Foreign key approach<\/b><\/p>\n<ol><li>Identify the relation S that represents the entity type on the <b>N-side<\/b><\/li><li>Include in S the <b>PK of the other (1-side) relation T as an FK<\/b><\/li><li>Also include the simple attributes of the relationship in S<\/li><\/ol>\n<p>Reason: one N-side entity instance is related to <b>at most one<\/b> 1-side entity → can be represented by a single FK value.<\/p>\n<ul><li>WORKS_FOR → <b>Dno<\/b> in EMPLOYEE (→ DEPARTMENT)<\/li><li>SUPERVISION → <b>Super_ssn<\/b> in EMPLOYEE (→ EMPLOYEE, self-reference)<\/li><li>CONTROLS → <b>Dnum<\/b> in PROJECT (→ DEPARTMENT)<\/li><\/ul>\n<div class=\"callout trap\">Trap: putting the FK on the 1-side makes it multivalued, violating atomicity. The FK <b>always goes on the N-side<\/b>.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p41.jpg\" aria-label=\"Enlarge\"><img src=\"img/RDB-p41.jpg\" alt=\"03 p.41 · 1:N WORKS_FOR: Dno in EMPLOYEE, the N-side\" loading=\"lazy\"><\/button><figcaption>03 p.41 · 1:N WORKS_FOR: Dno in EMPLOYEE, the N-side<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p42.jpg\" aria-label=\"Enlarge\"><img src=\"img/RDB-p42.jpg\" alt=\"03 p.42 · SUPERVISION → Super_ssn, CONTROLS → Dnum\" loading=\"lazy\"><\/button><figcaption>03 p.42 · SUPERVISION → Super_ssn, CONTROLS → Dnum<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-map-mn\"><h3>Mapping M:N relationships<\/h3><p><b>Only one<\/b> approach: the <b>cross-reference (relationship relation) approach<\/b>. An M:N relationship cannot be represented by a single FK.<\/p>\n<ol><li>Create a <b>separate relation S<\/b> to represent relationship type R<\/li><li>Include the <b>PKs of the participating entity relations as FKs<\/b> in S<\/li><li>The <b>combination of the FKs is the PK<\/b><\/li><li>Also include the simple attributes of the M:N relationship in S<\/li><\/ol>\n<p>e.g., WORKS_ON(<b>Essn<\/b>, <b>Pno<\/b>, Hours), Essn → EMPLOYEE, Pno → PROJECT. Relationship relation = lookup table.<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p44.jpg\" aria-label=\"Enlarge\"><img src=\"img/RDB-p44.jpg\" alt=\"03 p.44 · M:N WORKS_ON → relationship relation WORKS_ON(Essn, Pno, Hours)\" loading=\"lazy\"><\/button><figcaption>03 p.44 · M:N WORKS_ON → relationship relation WORKS_ON(Essn, Pno, Hours)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-map-nary\"><h3>Mapping n-ary relationships<\/h3><p><b>Cross-reference approach<\/b> (same procedure as M:N)<\/p>\n<ol><li>Create a separate relation S<\/li><li>Include the PKs of the n participating entity relations as FKs<\/li><li>The combination of all FKs is the PK (usually; if some participation has max = 1, that FK can be left out of the PK)<\/li><li>Include the simple attributes of the relationship<\/li><\/ol>\n<p>e.g., SUPPLY(<b>Sname<\/b>, <b>Proj_name<\/b>, <b>Part_no<\/b>, Quantity) — references SUPPLIER, PROJECT, PART.<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p45.jpg\" aria-label=\"Enlarge\"><img src=\"img/RDB-p45.jpg\" alt=\"03 p.45 · Ternary SUPPLY → SUPPLY(Sname, Proj_name, Part_no, Quantity)\" loading=\"lazy\"><\/button><figcaption>03 p.45 · Ternary SUPPLY → SUPPLY(Sname, Proj_name, Part_no, Quantity)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-map-summary\"><h3>ER ↔ relational model correspondence<\/h3><div class=\"tblw\"><table><thead><tr><th>ER model<\/th><th>Relational model<\/th><\/tr><\/thead><tbody><tr><td>Entity type<\/td><td>Entity relation<\/td><\/tr><tr><td>1:1 or 1:N relationship type<\/td><td>Foreign key (or relationship relation)<\/td><\/tr><tr><td>M:N relationship type<\/td><td>Relationship relation + <b>two<\/b> FKs<\/td><\/tr><tr><td>n-ary relationship type<\/td><td>Relationship relation + <b>n<\/b> FKs<\/td><\/tr><tr><td>Simple attribute<\/td><td>Attribute<\/td><\/tr><tr><td>Composite attribute<\/td><td>Set of simple component attributes<\/td><\/tr><tr><td>Multivalued attribute<\/td><td>Relation + foreign key<\/td><\/tr><tr><td>Value set<\/td><td>Domain<\/td><\/tr><tr><td>Key attribute<\/td><td>Primary key (or secondary key)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Slide Exercise 3 (UNIVERSITY: COLLEGE, INSTRUCTOR, DEPT, STUDENT, COURSE, SECTION), solution order:<\/p>\n<ol><li>Regular entities → COLLEGE(CName, COffice, CPhone), INSTRUCTOR(Id, Rank, IName, IOffice, IPhone), DEPT(DName, DCode, DOffice, DPhone), COURSE(CCode, Credits, CoName, Level, CDesc), SECTION(SecId, SecNo, Sem, Year, Bldg, RoomNo, DaysTime), STUDENT(Sid, DOB, FName, MName, LName, Addr, Phone, Major)<\/li><li>1:1 → DEAN: DeanId in COLLEGE (COLLEGE has (1,1) total participation); CHAIR: ChairId, CStartDate in DEPT<\/li><li>1:N → INSTRUCTOR.Employed (EMPLOYS), DEPT.Admined (ADMINS), COURSE.Offered (OFFERS), SECTION.Taught (TEACHES), SECTION.Belongs (SECS), STUDENT.Dept (HAS)<\/li><li>M:N → TAKES(<b>Sid<\/b>, <b>SecId<\/b>, Grade)<\/li><\/ol><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p49.jpg\" aria-label=\"Enlarge\"><img src=\"img/RDB-p49.jpg\" alt=\"03 p.49 · Correspondence table between the ER model and the relational model\" loading=\"lazy\"><\/button><figcaption>03 p.49 · Correspondence table between the ER model and the relational model<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p46.jpg\" aria-label=\"Enlarge\"><img src=\"img/RDB-p46.jpg\" alt=\"03 p.46 · Exercise 3: UNIVERSITY ER schema\" loading=\"lazy\"><\/button><figcaption>03 p.46 · Exercise 3: UNIVERSITY ER schema<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/EX-p16.jpg\" aria-label=\"Enlarge\"><img src=\"img/EX-p16.jpg\" alt=\"db-exercises p.57 · Exercise 3 mapping result (including M:N TAKES)\" loading=\"lazy\"><\/button><figcaption>db-exercises p.57 · Exercise 3 mapping result (including M:N TAKES)<\/figcaption><\/figure><\/section>"}], "title_en": "The Relational Data Model and ER-to-Relational Mapping", "intro_en": "Terminology (relation, tuple, attribute, domain, degree), the key family (superkey ⊃ key = candidate key ∋ primary key), the three integrity constraints, which constraints insert/delete/update can violate, and ER-to-relational mapping. For mapping, all you really need is to get \"where does the FK go\" right."}, {"id": "U4", "title": "Basic SQL (DDL · DML · SELECT)", "src": "4-1_SQL.pdf + 3-2_setup-for-sql.pdf + SQL-week6-lab.pdf", "intro": "CREATE TABLE의 제약조건 문법, 참조 트리거 동작(ON DELETE/UPDATE), INSERT·DELETE·UPDATE가 무엇을 어기는지, 그리고 SELECT-FROM-WHERE. SQL은 직접 써봐야 늘어. 풀이 문제는 교재 COMPANY 상태(3-1 p.12)에서 실제로 돌려본 결과를 정답에 붙여놨어.", "lessons": [{"id": "L4-1", "title": "SQL 소개 · CREATE SCHEMA/TABLE · 제약조건", "src": "4-1 p.3–10", "secs": [{"id": "sql-intro", "title": "SQL과 NL2SQL", "title_en": "SQL and NL2SQL"}, {"id": "create-table", "title": "CREATE SCHEMA / CREATE TABLE", "title_en": "CREATE SCHEMA / CREATE TABLE"}, {"id": "attr-constraints", "title": "속성 제약: NOT NULL, DEFAULT", "title_en": "Attribute constraints: NOT NULL, DEFAULT"}, {"id": "key-clauses", "title": "키 제약: PRIMARY KEY, UNIQUE, FOREIGN KEY", "title_en": "Key constraints: PRIMARY KEY, UNIQUE, FOREIGN KEY"}], "md": "## SQL과 NL2SQL {#sql-intro}\n\n- **SQL (Structured Query Language)**: 특수 목적 **선언적(declarative)** 언어. IBM의 첫 DBMS용으로 설계, 원래 이름 **SEQUEL** (Structured English Query Language). 'S-Q-L' 또는 'SEQUEL'로 읽음\n- **DDL (Data Definition Language)**: DB와 **테이블**에 대한 명령. CREATE / ALTER / DROP (schema, table)\n- **DML (Data Manipulation Language)**: 테이블 안 **투플**에 대한 명령. 검색 SELECT, 수정 INSERT / DELETE / UPDATE\n- **NL2SQL**: 자연어 질의를 SQL로 바꾸는 기술. 어려움 = 자연어의 모호성, 스키마 이해·연결(schema linking), 처음 보는 DB로의 일반화, 복잡한 질의 생성. LLM 기반 방법도 아직 완벽과 거리가 멀다 → **SQL을 제대로 이해하는 게 중요**\n\n## CREATE SCHEMA / CREATE TABLE {#create-table}\n\n**SQL 스키마**: 테이블, 타입, 제약조건, 뷰, 도메인 등 스키마를 기술하는 요소들. 스키마 이름으로 식별.\n\n```\nCREATE SCHEMA COMPANY AUTHORIZATION 'Jsmith';\n```\n- **권한 식별자 (authorization identifier)**: 스키마를 소유한 사용자\n\n**CREATE TABLE**: 이름, 속성, 초기 제약조건을 지정해 새 릴레이션 생성.\n- 테이블 이름에 스키마 이름을 붙일 수 있음: `CREATE TABLE COMPANY.EMPLOYEE`\n- 속성 = <속성 이름, 데이터 타입> 쌍의 리스트\n- 초기 제약조건 = 속성 제약, 무결성 제약\n\n```\nCREATE TABLE EMPLOYEE\n( Fname      VARCHAR(15)    NOT NULL,\n  Minit      CHAR,\n  Lname      VARCHAR(15)    NOT NULL,\n  Ssn        CHAR(9)        NOT NULL,\n  Bdate      DATE,\n  Address    VARCHAR(30),\n  Sex        CHAR,\n  Salary     DECIMAL(10,2),\n  Super_ssn  CHAR(9),\n  Dno        INT            NOT NULL,\n  PRIMARY KEY (Ssn) );\n```\n\n## 속성 제약: NOT NULL, DEFAULT {#attr-constraints}\n\n- **NOT NULL**: 그 속성 값은 NULL이 될 수 없다. **PK 속성에는 항상 암묵적으로** 적용 (= 개체 무결성)\n- **DEFAULT <값>**: 새 투플에 그 속성 값을 명시하지 않으면 기본값이 들어감\n  - 예) 새 사원의 기본 부서: `Dno INT NOT NULL DEFAULT 1`, DEPARTMENT의 `Mgr_ssn CHAR(9) NOT NULL DEFAULT '888665555'`\n\n## 키 제약: PRIMARY KEY, UNIQUE, FOREIGN KEY {#key-clauses}\n\n```\nCREATE TABLE DEPARTMENT\n( Dname           VARCHAR(15)  NOT NULL,\n  Dnumber         INT          NOT NULL,\n  Mgr_ssn         CHAR(9)      NOT NULL,\n  Mgr_start_date  DATE,\n  PRIMARY KEY (Dnumber),\n  UNIQUE (Dname),\n  FOREIGN KEY (Mgr_ssn) REFERENCES EMPLOYEE(Ssn) );\nCREATE TABLE DEPT_LOCATIONS\n( Dnumber    INT          NOT NULL,\n  Dlocation  VARCHAR(15)  NOT NULL,\n  PRIMARY KEY (Dnumber, Dlocation),\n  FOREIGN KEY (Dnumber) REFERENCES DEPARTMENT(Dnumber) );\n```\n- **PRIMARY KEY**: PK를 이루는 속성(들). 복합이면 괄호 안에 여러 개\n- **UNIQUE**: 대체(alternate) 키 = **후보 키**\n- **FOREIGN KEY ... REFERENCES 테이블(속성)**: 다른 릴레이션의 PK를 참조하는 FK\n- 제약에 이름 붙이기: `CONSTRAINT DEPTPK PRIMARY KEY (Dnumber)` → 나중에 ALTER로 지울 때 이름이 필요\n\n> 시험 포인트: 참조되는 PK가 갱신·삭제되면 참조 무결성이 깨질 수 있는데, **SQL의 기본 동작은 그 연산을 거부(reject)** 하는 것. 다른 방법 = 참조 트리거 동작 (L4-2).", "html": "<section class=\"sec\" id=\"s-sql-intro\"><h3>SQL과 NL2SQL<\/h3><ul><li><b>SQL (Structured Query Language)<\/b>: 특수 목적 <b>선언적(declarative)<\/b> 언어. IBM의 첫 DBMS용으로 설계, 원래 이름 <b>SEQUEL<\/b> (Structured English Query Language). 'S-Q-L' 또는 'SEQUEL'로 읽음<\/li><li><b>DDL (Data Definition Language)<\/b>: DB와 <b>테이블<\/b>에 대한 명령. CREATE / ALTER / DROP (schema, table)<\/li><li><b>DML (Data Manipulation Language)<\/b>: 테이블 안 <b>투플<\/b>에 대한 명령. 검색 SELECT, 수정 INSERT / DELETE / UPDATE<\/li><li><b>NL2SQL<\/b>: 자연어 질의를 SQL로 바꾸는 기술. 어려움 = 자연어의 모호성, 스키마 이해·연결(schema linking), 처음 보는 DB로의 일반화, 복잡한 질의 생성. LLM 기반 방법도 아직 완벽과 거리가 멀다 → <b>SQL을 제대로 이해하는 게 중요<\/b><\/li><\/ul><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">03주-2 (조교)<\/span><br>실습 환경: VS Code + Python(3.11 정도), pip install pandas sqlglot. pandas는 SQL 실행 결과를 CSV로 저장, sqlglot은 SQL 문법 검사. test.py에서 'change me'를 학번으로 바꾸는 것 말고는 코드를 고치지 말 것. NL_queries.txt를 보고 mysql.py에 SQL을 쓰고 test.py를 돌리면 학번 이름의 폴더가 생기고, 그걸 압축해 e-class에 제출. 압축 파일 이름은 반드시 학번.<\/div><\/section>\n<section class=\"sec\" id=\"s-create-table\"><h3>CREATE SCHEMA / CREATE TABLE<\/h3><p><b>SQL 스키마<\/b>: 테이블, 타입, 제약조건, 뷰, 도메인 등 스키마를 기술하는 요소들. 스키마 이름으로 식별.<\/p>\n<pre class=\"code\">CREATE SCHEMA COMPANY AUTHORIZATION &#x27;Jsmith&#x27;;<\/pre>\n<ul><li><b>권한 식별자 (authorization identifier)<\/b>: 스키마를 소유한 사용자<\/li><\/ul>\n<p><b>CREATE TABLE<\/b>: 이름, 속성, 초기 제약조건을 지정해 새 릴레이션 생성.<\/p>\n<ul><li>테이블 이름에 스키마 이름을 붙일 수 있음: <code>CREATE TABLE COMPANY.EMPLOYEE<\/code><\/li><li>속성 = &lt;속성 이름, 데이터 타입&gt; 쌍의 리스트<\/li><li>초기 제약조건 = 속성 제약, 무결성 제약<\/li><\/ul>\n<pre class=\"code\">CREATE TABLE EMPLOYEE\n( Fname      VARCHAR(15)    NOT NULL,\n  Minit      CHAR,\n  Lname      VARCHAR(15)    NOT NULL,\n  Ssn        CHAR(9)        NOT NULL,\n  Bdate      DATE,\n  Address    VARCHAR(30),\n  Sex        CHAR,\n  Salary     DECIMAL(10,2),\n  Super_ssn  CHAR(9),\n  Dno        INT            NOT NULL,\n  PRIMARY KEY (Ssn) );<\/pre><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p7.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p7.jpg\" alt=\"04 p.7 · CREATE TABLE EMPLOYEE, DEPARTMENT, DEPT_LOCATIONS\" loading=\"lazy\"><\/button><figcaption>04 p.7 · CREATE TABLE EMPLOYEE, DEPARTMENT, DEPT_LOCATIONS<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-attr-constraints\"><h3>속성 제약: NOT NULL, DEFAULT<\/h3><ul><li><b>NOT NULL<\/b>: 그 속성 값은 NULL이 될 수 없다. <b>PK 속성에는 항상 암묵적으로<\/b> 적용 (= 개체 무결성)<\/li><li><b>DEFAULT &lt;값&gt;<\/b>: 새 투플에 그 속성 값을 명시하지 않으면 기본값이 들어감<ul><li>예) 새 사원의 기본 부서: <code>Dno INT NOT NULL DEFAULT 1<\/code>, DEPARTMENT의 <code>Mgr_ssn CHAR(9) NOT NULL DEFAULT '888665555'<\/code><\/li><\/ul><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p8.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p8.jpg\" alt=\"04 p.8 · NOT NULL과 DEFAULT\" loading=\"lazy\"><\/button><figcaption>04 p.8 · NOT NULL과 DEFAULT<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-key-clauses\"><h3>키 제약: PRIMARY KEY, UNIQUE, FOREIGN KEY<\/h3><pre class=\"code\">CREATE TABLE DEPARTMENT\n( Dname           VARCHAR(15)  NOT NULL,\n  Dnumber         INT          NOT NULL,\n  Mgr_ssn         CHAR(9)      NOT NULL,\n  Mgr_start_date  DATE,\n  PRIMARY KEY (Dnumber),\n  UNIQUE (Dname),\n  FOREIGN KEY (Mgr_ssn) REFERENCES EMPLOYEE(Ssn) );\nCREATE TABLE DEPT_LOCATIONS\n( Dnumber    INT          NOT NULL,\n  Dlocation  VARCHAR(15)  NOT NULL,\n  PRIMARY KEY (Dnumber, Dlocation),\n  FOREIGN KEY (Dnumber) REFERENCES DEPARTMENT(Dnumber) );<\/pre>\n<ul><li><b>PRIMARY KEY<\/b>: PK를 이루는 속성(들). 복합이면 괄호 안에 여러 개<\/li><li><b>UNIQUE<\/b>: 대체(alternate) 키 = <b>후보 키<\/b><\/li><li><b>FOREIGN KEY ... REFERENCES 테이블(속성)<\/b>: 다른 릴레이션의 PK를 참조하는 FK<\/li><li>제약에 이름 붙이기: <code>CONSTRAINT DEPTPK PRIMARY KEY (Dnumber)<\/code> → 나중에 ALTER로 지울 때 이름이 필요<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 참조되는 PK가 갱신·삭제되면 참조 무결성이 깨질 수 있는데, <b>SQL의 기본 동작은 그 연산을 거부(reject)<\/b> 하는 것. 다른 방법 = 참조 트리거 동작 (L4-2).<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p9.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p9.jpg\" alt=\"04 p.9 · PRIMARY KEY, UNIQUE, FOREIGN KEY\" loading=\"lazy\"><\/button><figcaption>04 p.9 · PRIMARY KEY, UNIQUE, FOREIGN KEY<\/figcaption><\/figure><\/section>", "title_en": "Introduction to SQL, CREATE SCHEMA/TABLE, Constraints", "html_en": "<section class=\"sec\" id=\"s-sql-intro\"><h3>SQL and NL2SQL<\/h3><ul><li><b>SQL (Structured Query Language)<\/b>: a special-purpose <b>declarative<\/b> language. Designed for IBM's first DBMS; originally called <b>SEQUEL<\/b> (Structured English Query Language). Pronounced 'S-Q-L' or 'SEQUEL'<\/li><li><b>DDL (Data Definition Language)<\/b>: commands on databases and <b>tables<\/b>. CREATE / ALTER / DROP (schema, table)<\/li><li><b>DML (Data Manipulation Language)<\/b>: commands on <b>tuples<\/b> in tables. Retrieval: SELECT; modification: INSERT / DELETE / UPDATE<\/li><li><b>NL2SQL<\/b>: technology that translates natural-language queries into SQL. Challenges = ambiguity of natural language, schema understanding and linking (schema linking), generalization to unseen databases, generating complex queries. Even LLM-based methods are still far from perfect → <b>understanding SQL properly matters<\/b><\/li><\/ul><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 3-2 (TA)<\/span><br>Lab environment: VS Code + Python (about 3.11), pip install pandas sqlglot. pandas saves SQL results as CSV; sqlglot checks SQL syntax. Do not modify the code in test.py except replacing 'change me' with your student ID. Read NL_queries.txt, write SQL in mysql.py and run test.py; a folder named with your student ID is created — zip it and submit it to e-class. The zip file name must be your student ID.<\/div><\/section>\n<section class=\"sec\" id=\"s-create-table\"><h3>CREATE SCHEMA / CREATE TABLE<\/h3><p><b>SQL schema<\/b>: the elements that describe a schema — tables, types, constraints, views, domains, etc. Identified by a schema name.<\/p>\n<pre class=\"code\">CREATE SCHEMA COMPANY AUTHORIZATION &#x27;Jsmith&#x27;;<\/pre>\n<ul><li><b>Authorization identifier<\/b>: the user who owns the schema<\/li><\/ul>\n<p><b>CREATE TABLE<\/b>: creates a new relation by giving its name, attributes and initial constraints.<\/p>\n<ul><li>The table name can be prefixed with the schema name: <code>CREATE TABLE COMPANY.EMPLOYEE<\/code><\/li><li>Attributes = a list of &lt;attribute name, data type&gt; pairs<\/li><li>Initial constraints = attribute constraints, integrity constraints<\/li><\/ul>\n<pre class=\"code\">CREATE TABLE EMPLOYEE\n( Fname      VARCHAR(15)    NOT NULL,\n  Minit      CHAR,\n  Lname      VARCHAR(15)    NOT NULL,\n  Ssn        CHAR(9)        NOT NULL,\n  Bdate      DATE,\n  Address    VARCHAR(30),\n  Sex        CHAR,\n  Salary     DECIMAL(10,2),\n  Super_ssn  CHAR(9),\n  Dno        INT            NOT NULL,\n  PRIMARY KEY (Ssn) );<\/pre><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p7.jpg\" aria-label=\"Enlarge\"><img src=\"img/SQL-p7.jpg\" alt=\"04 p.7 · CREATE TABLE EMPLOYEE, DEPARTMENT, DEPT_LOCATIONS\" loading=\"lazy\"><\/button><figcaption>04 p.7 · CREATE TABLE EMPLOYEE, DEPARTMENT, DEPT_LOCATIONS<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-attr-constraints\"><h3>Attribute constraints: NOT NULL, DEFAULT<\/h3><ul><li><b>NOT NULL<\/b>: the attribute's value cannot be NULL. <b>Always implicitly<\/b> applied to PK attributes (= entity integrity)<\/li><li><b>DEFAULT &lt;value&gt;<\/b>: if a new tuple does not give a value for the attribute, the default value is used<ul><li>e.g., a new employee's default department: <code>Dno INT NOT NULL DEFAULT 1<\/code>; in DEPARTMENT, <code>Mgr_ssn CHAR(9) NOT NULL DEFAULT '888665555'<\/code><\/li><\/ul><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p8.jpg\" aria-label=\"Enlarge\"><img src=\"img/SQL-p8.jpg\" alt=\"04 p.8 · NOT NULL and DEFAULT\" loading=\"lazy\"><\/button><figcaption>04 p.8 · NOT NULL and DEFAULT<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-key-clauses\"><h3>Key constraints: PRIMARY KEY, UNIQUE, FOREIGN KEY<\/h3><pre class=\"code\">CREATE TABLE DEPARTMENT\n( Dname           VARCHAR(15)  NOT NULL,\n  Dnumber         INT          NOT NULL,\n  Mgr_ssn         CHAR(9)      NOT NULL,\n  Mgr_start_date  DATE,\n  PRIMARY KEY (Dnumber),\n  UNIQUE (Dname),\n  FOREIGN KEY (Mgr_ssn) REFERENCES EMPLOYEE(Ssn) );\nCREATE TABLE DEPT_LOCATIONS\n( Dnumber    INT          NOT NULL,\n  Dlocation  VARCHAR(15)  NOT NULL,\n  PRIMARY KEY (Dnumber, Dlocation),\n  FOREIGN KEY (Dnumber) REFERENCES DEPARTMENT(Dnumber) );<\/pre>\n<ul><li><b>PRIMARY KEY<\/b>: the attribute(s) that make up the PK. If composite, list several inside the parentheses<\/li><li><b>UNIQUE<\/b>: an alternate key = a <b>candidate key<\/b><\/li><li><b>FOREIGN KEY ... REFERENCES table(attribute)<\/b>: an FK that references the PK of another relation<\/li><li>Naming a constraint: <code>CONSTRAINT DEPTPK PRIMARY KEY (Dnumber)<\/code> → the name is needed to drop it later with ALTER<\/li><\/ul>\n<div class=\"callout exam\">Exam point: referential integrity can be violated when a referenced PK is updated or deleted; <b>SQL's default action is to reject<\/b> the operation. The alternative = referential triggered actions (L4-2).<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p9.jpg\" aria-label=\"Enlarge\"><img src=\"img/SQL-p9.jpg\" alt=\"04 p.9 · PRIMARY KEY, UNIQUE, FOREIGN KEY\" loading=\"lazy\"><\/button><figcaption>04 p.9 · PRIMARY KEY, UNIQUE, FOREIGN KEY<\/figcaption><\/figure><\/section>"}, {"id": "L4-2", "title": "참조 트리거 동작 · DROP · ALTER", "src": "4-1 p.11–20", "secs": [{"id": "ref-actions", "title": "참조 트리거 동작 (Referential Triggered Actions)", "title_en": "Referential triggered actions"}, {"id": "drop", "title": "DROP SCHEMA / DROP TABLE", "title_en": "DROP SCHEMA / DROP TABLE"}, {"id": "alter", "title": "ALTER TABLE", "title_en": "ALTER TABLE"}], "md": "## 참조 트리거 동작 (Referential Triggered Actions) {#ref-actions}\n\n**\"다른 투플이 참조하는 투플이 삭제/갱신되면?\"** 에 대한 동작을 FK에 붙인다.\n- **트리거**: `ON DELETE`, `ON UPDATE`\n- **동작**: `SET NULL`, `CASCADE`, `SET DEFAULT` (지정 안 하면 기본 = 거부, 교안 연습에서는 REJECT라고 부름)\n\n| 동작 | 참조되던 투플이 삭제될 때 | 갱신될 때 |\n|---|---|---|\n| SET NULL | 참조하던 FK를 NULL로 | FK를 NULL로 |\n| SET DEFAULT | FK를 기본값으로 | FK를 기본값으로 |\n| CASCADE | **참조하던 투플도 삭제** | 참조하던 FK를 **새 값으로** 바꿈 |\n\n```\nCREATE TABLE EMPLOYEE\n( ...,\n  Dno INT NOT NULL DEFAULT 1,\n  CONSTRAINT EMPPK PRIMARY KEY (Ssn),\n  CONSTRAINT EMPSUPERFK FOREIGN KEY (Super_ssn) REFERENCES EMPLOYEE(Ssn)\n      ON DELETE SET NULL      ON UPDATE CASCADE,\n  CONSTRAINT EMPDEPTFK  FOREIGN KEY (Dno) REFERENCES DEPARTMENT(Dnumber)\n      ON DELETE SET DEFAULT   ON UPDATE CASCADE );\n```\n\n**교안 토론 (p.13)**: EMPSUPERFK의 ON DELETE를 **CASCADE**로 바꾸고 `DELETE FROM EMPLOYEE WHERE Lname = 'Borg';` 를 실행하면?\n- Borg(888665555)를 상사로 둔 Wong, Wallace가 같이 삭제 → 그들을 상사로 둔 Smith, Narayan, English, Zelaya, Jabbar도 연쇄 삭제 → **EMPLOYEE 투플 8개가 전부 사라진다**. CASCADE는 재귀적으로 전파된다는 점이 핵심\n- (EMPSUPERFK만 봤을 때 얘기. 실제로는 WORKS_ON.Essn, DEPENDENT.Essn 같은 다른 FK
