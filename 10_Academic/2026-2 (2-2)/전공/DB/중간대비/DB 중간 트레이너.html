><p><b>연습 1<\/b>: 'Research' 부서에서 일하는 모든 사원의 이름과 주소<\/p>\n<pre class=\"code\">RESEARCH_DEPT ← σ Dname=&#x27;Research&#x27; (DEPARTMENT)\nRESEARCH_EMPS ← RESEARCH_DEPT ⋈ Dnumber=Dno EMPLOYEE\nRESULT        ← π Fname, Lname, Address (RESEARCH_EMPS)<\/pre>\n<p><b>연습 2<\/b>: 'Stafford'에 있는 프로젝트마다 프로젝트 번호, 통제 부서 번호, 관리자의 성·주소·생일<\/p>\n<pre class=\"code\">STAFFORD_PROJS ← σ Plocation=&#x27;Stafford&#x27; (PROJECT)\nCONTR_DEPTS    ← STAFFORD_PROJS ⋈ Dnum=Dnumber DEPARTMENT\nPROJ_DEPT_MGRS ← CONTR_DEPTS ⋈ Mgr_ssn=Ssn EMPLOYEE\nRESULT         ← π Pnumber, Dnum, Lname, Address, Bdate (PROJ_DEPT_MGRS)<\/pre>\n<p>→ (10, 4, Wallace, 291 Berry, Bellaire, TX, 1941-06-20), (30, 4, Wallace, …)<\/p>\n<p>요령: 조건이 있는 릴레이션에서 <b>σ를 먼저<\/b> → FK–PK를 따라 <b>⋈<\/b> → 마지막에 <b>π<\/b>.<\/p><\/section>\n<section class=\"sec\" id=\"s-ra-practice-union\"><h3>연습 3: 합집합<\/h3><p>성이 'Smith'인 사원이 일꾼으로든, 프로젝트를 통제하는 부서의 관리자로든 관련된 프로젝트 번호<\/p>\n<pre class=\"code\">SMITHS(Essn)        ← π Ssn (σ Lname=&#x27;Smith&#x27; (EMPLOYEE))\nSMITH_WORKER_PROJS  ← π Pno (WORKS_ON * SMITHS)\nMGRS                ← π Lname, Dnumber (EMPLOYEE ⋈ Ssn=Mgr_ssn DEPARTMENT)\nSMITH_MANAGED_DEPTS(Dnum) ← π Dnumber (σ Lname=&#x27;Smith&#x27; (MGRS))\nSMITH_MGR_PROJS(Pno)      ← π Pnumber (SMITH_MANAGED_DEPTS * PROJECT)\nRESULT              ← SMITH_WORKER_PROJS ∪ SMITH_MGR_PROJS<\/pre>\n<ul><li>∪를 하려고 두 결과의 속성 이름을 <b>Pno로 맞춤<\/b> (타입 호환)<\/li><li>SMITHS(Essn)으로 이름을 바꿔서 WORKS_ON과 <b>자연 조인<\/b>이 Essn으로 걸리게 함<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-ra-practice-diff\"><h3>연습 4–5: 차집합과 교집합<\/h3><p><b>연습 4<\/b>: 부양가족이 <b>없는<\/b> 사원의 이름<\/p>\n<pre class=\"code\">ALL_EMPS             ← π Ssn (EMPLOYEE)\nEMPS_WITH_DEPS(Ssn)  ← π Essn (DEPENDENT)\nEMPS_WITHOUT_DEPS    ← ALL_EMPS − EMPS_WITH_DEPS\nRESULT               ← π Lname, Fname (EMPS_WITHOUT_DEPS * EMPLOYEE)<\/pre>\n<p><b>연습 5<\/b>: 부양가족이 <b>하나 이상 있는 관리자<\/b>의 이름<\/p>\n<pre class=\"code\">MGRS(Ssn)            ← π Mgr_ssn (DEPARTMENT)\nEMPS_WITH_DEPS(Ssn)  ← π Essn (DEPENDENT)\nMGRS_WITH_DEPS       ← MGRS ∩ EMPS_WITH_DEPS\nRESULT               ← π Lname, Fname (MGRS_WITH_DEPS * EMPLOYEE)<\/pre>\n<p>→ Wong, Wallace<\/p>\n<div class=\"callout exam\">시험 포인트: \"~가 없는\" = <b>차집합 (−)<\/b>, \"A이면서 B\" = <b>교집합 (∩)<\/b>, \"A이거나 B\" = <b>합집합 (∪)<\/b>, \"모든 ~\" = <b>나눗셈 (÷)<\/b>. SQL의 NOT EXISTS / EXISTS AND EXISTS / UNION / NOT EXISTS(EXCEPT)와 1:1로 대응시켜 외워.<\/div><\/section>", "title_en": "Relational Algebra Writing Practice", "html_en": "<section class=\"sec\" id=\"s-ra-practice-join\"><h3>Exercises 1–2: join paths<\/h3><p><b>Exercise 1<\/b>: the name and address of all employees who work for the 'Research' department<\/p>\n<pre class=\"code\">RESEARCH_DEPT ← σ Dname=&#x27;Research&#x27; (DEPARTMENT)\nRESEARCH_EMPS ← RESEARCH_DEPT ⋈ Dnumber=Dno EMPLOYEE\nRESULT        ← π Fname, Lname, Address (RESEARCH_EMPS)<\/pre>\n<p><b>Exercise 2<\/b>: for every project located in 'Stafford', the project number, the controlling department number, and the manager's last name, address and birth date<\/p>\n<pre class=\"code\">STAFFORD_PROJS ← σ Plocation=&#x27;Stafford&#x27; (PROJECT)\nCONTR_DEPTS    ← STAFFORD_PROJS ⋈ Dnum=Dnumber DEPARTMENT\nPROJ_DEPT_MGRS ← CONTR_DEPTS ⋈ Mgr_ssn=Ssn EMPLOYEE\nRESULT         ← π Pnumber, Dnum, Lname, Address, Bdate (PROJ_DEPT_MGRS)<\/pre>\n<p>→ (10, 4, Wallace, 291 Berry, Bellaire, TX, 1941-06-20), (30, 4, Wallace, …)<\/p>\n<p>Tip: apply <b>σ first<\/b> to the relation that has the condition → follow FK–PK links with <b>⋈<\/b> → finish with <b>π<\/b>.<\/p><\/section>\n<section class=\"sec\" id=\"s-ra-practice-union\"><h3>Exercise 3: union<\/h3><p>Project numbers of projects that involve an employee whose last name is 'Smith', either as a worker or as a manager of the department that controls the project<\/p>\n<pre class=\"code\">SMITHS(Essn)        ← π Ssn (σ Lname=&#x27;Smith&#x27; (EMPLOYEE))\nSMITH_WORKER_PROJS  ← π Pno (WORKS_ON * SMITHS)\nMGRS                ← π Lname, Dnumber (EMPLOYEE ⋈ Ssn=Mgr_ssn DEPARTMENT)\nSMITH_MANAGED_DEPTS(Dnum) ← π Dnumber (σ Lname=&#x27;Smith&#x27; (MGRS))\nSMITH_MGR_PROJS(Pno)      ← π Pnumber (SMITH_MANAGED_DEPTS * PROJECT)\nRESULT              ← SMITH_WORKER_PROJS ∪ SMITH_MGR_PROJS<\/pre>\n<ul><li>The two results' attribute names are <b>both made Pno<\/b> so ∪ can be applied (type compatibility)<\/li><li>Renaming to SMITHS(Essn) makes the <b>natural join<\/b> with WORKS_ON match on Essn<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-ra-practice-diff\"><h3>Exercises 4–5: difference and intersection<\/h3><p><b>Exercise 4<\/b>: names of employees who have <b>no<\/b> dependents<\/p>\n<pre class=\"code\">ALL_EMPS             ← π Ssn (EMPLOYEE)\nEMPS_WITH_DEPS(Ssn)  ← π Essn (DEPENDENT)\nEMPS_WITHOUT_DEPS    ← ALL_EMPS − EMPS_WITH_DEPS\nRESULT               ← π Lname, Fname (EMPS_WITHOUT_DEPS * EMPLOYEE)<\/pre>\n<p><b>Exercise 5<\/b>: names of <b>managers who have at least one dependent<\/b><\/p>\n<pre class=\"code\">MGRS(Ssn)            ← π Mgr_ssn (DEPARTMENT)\nEMPS_WITH_DEPS(Ssn)  ← π Essn (DEPENDENT)\nMGRS_WITH_DEPS       ← MGRS ∩ EMPS_WITH_DEPS\nRESULT               ← π Lname, Fname (MGRS_WITH_DEPS * EMPLOYEE)<\/pre>\n<p>→ Wong, Wallace<\/p>\n<div class=\"callout exam\">Exam point: \"has no …\" = <b>difference (−)<\/b>, \"A and also B\" = <b>intersection (∩)<\/b>, \"A or B\" = <b>union (∪)<\/b>, \"all …\" = <b>division (÷)<\/b>. Memorize them as one-to-one counterparts of SQL's NOT EXISTS / EXISTS AND EXISTS / UNION / NOT EXISTS (EXCEPT).<\/div><\/section>"}], "title_en": "Relational Algebra", "intro_en": "σ π ρ, set operations, ×, ⋈ (theta, equi, natural), ÷, ℑ (aggregation), outer joins. The key skill is breaking a query into steps of the form \"intermediate relation name ← operation\". In your answers you may write words such as SELECT, PROJECT, JOIN instead of the symbols and still get credit."}], "questions": [{"id": "1-def-1", "concept": "db-def", "type": "mc", "prompt": "'Database System'의 정의로 옳은 것은?", "choices": ["논리적으로 관련된 데이터의 모음", "데이터를 관리하는 소프트웨어", "DB + DBMS 소프트웨어", "DB를 설계하는 사람"], "answer": 2, "lesson": "L1-1", "unit": "U1", "prompt_en": "Which of the following is the correct definition of a 'Database System'?", "choices_en": ["A collection of logically related data", "Software that manages data", "DB + DBMS software", "A person who designs the DB"]}, {"id": "1-def-2", "concept": "db-def", "type": "blank", "prompt": "DBMS는 DB를 (a) 하고, 구축(construct)하고, (b) 하고, 공유(share)하는 소프트웨어이다.", "answer": "(a) 정의 / (b) 조작", "accept": [["정의", "define", "defining", "정의하", "defined", "definition"], ["조작", "manipulate", "manipulating", "조작하", "manipulation", "manipulated"]], "lesson": "L1-1", "unit": "U1", "prompt_en": "A DBMS is software used for (a) , constructing, (b) and sharing databases.", "answer_en": "(a) defining / (b) manipulating"}, {"id": "1-def-3", "concept": "db-def", "type": "ox", "prompt": "MySQL, SQLite, Oracle은 DB의 예이고, 그 안에 저장된 테이블들이 DBMS이다.", "answer": false, "explain": "MySQL, SQLite, Oracle은 DBMS(소프트웨어). 그 소프트웨어가 관리하는 데이터의 모음이 DB.", "lesson": "L1-1", "unit": "U1", "prompt_en": "MySQL, SQLite and Oracle are examples of DBs, and the tables stored in them are the DBMS.", "explain_en": "MySQL, SQLite and Oracle are DBMSs (software). The collection of data managed by that software is the DB."}, {"id": "1-def-4", "concept": "db-def", "type": "short", "prompt": "DB, DBMS, DB 시스템을 각각 한 줄로 정의하시오.", "answer": "DB: 논리적으로 일관된, 서로 관련된 데이터의 모음(DBMS가 관리). DBMS: 데이터를 구조화된 방식으로 효율적으로 관리(정의·구축·조작·공유)하는 소프트웨어. DB 시스템: DB + DBMS 소프트웨어.", "keys": ["DB = 관련 데이터의 모음", "DBMS = 관리 소프트웨어 (정의·구축·조작·공유)", "DB 시스템 = DB + DBMS"], "lesson": "L1-1", "unit": "U1", "prompt_en": "Define DB, DBMS and database system in one line each.", "answer_en": "DB: a logically coherent collection of related data (managed by a DBMS). DBMS: software that efficiently manages data in a structured way (defining, constructing, manipulating and sharing databases). Database system: DB + DBMS software.", "keys_en": ["DB = a collection of related data", "DBMS = management software (define, construct, manipulate, share)", "Database system = DB + DBMS"]}, {"id": "1-why-1", "concept": "why-dbms", "type": "mc", "prompt": "텍스트 파일로 메시지 앱 데이터를 관리할 때 '앱이 새 항목을 쓰는 중에 기계가 죽으면?'은 어떤 문제 묶음에 속하나?", "choices": ["데이터 무결성 (Integrity)", "데이터 관리 (Management)", "데이터 지속성 (Durability)", "데이터 추상화 (Abstraction)"], "answer": 2, "lesson": "L1-1", "unit": "U1", "prompt_en": "When a messaging app's data is managed in a text file, which group of problems does 'What if the machine crashes while the app is writing a new entry?' belong to?", "choices_en": ["Data Integrity", "Data Management", "Data Durability", "Data Abstraction"]}, {"id": "1-why-2", "concept": "why-dbms", "type": "mc", "prompt": "다음 중 '데이터 무결성' 문제의 예는?", "choices": ["특정 메시지를 빨리 찾으려면?", "친구 정보를 실수로 중복 입력하면?", "여러 사용자가 동시에 쓰면?", "크래시 후 복구는?"], "answer": 1, "explain": "무결성: 메시지 길이 제한, 중복 친구, 같은 이름. 관리: 빠른 검색, 동시 접근. 지속성: 크래시, 복구.", "lesson": "L1-1", "unit": "U1", "prompt_en": "Which of the following is an example of a 'data integrity' problem?", "explain_en": "Integrity: message length limit, duplicate friends, friends with the same name. Management: fast search, concurrent access. Durability: crashes, recovery.", "choices_en": ["How do we find a specific message quickly?", "What if a friend's info is entered twice by mistake?", "What if many users write at the same time?", "How do we recover after a crash?"]}, {"id": "1-when-1", "concept": "when-not", "type": "mc", "prompt": "DBMS 대신 맞춤형 DB를 쓰는 게 나은 경우가 '아닌' 것은?", "choices": ["절대 바뀌지 않는 단순한 응용", "엄격한 실시간 요구", "저장 용량이 제한된 임베디드 시스템", "여러 사용자가 동시에 같은 데이터를 갱신"], "answer": 3, "explain": "다중 사용자 동시 접근은 오히려 DBMS(동시성 제어)가 필요한 경우.", "lesson": "L1-1", "unit": "U1", "prompt_en": "Which of the following is NOT a case where a customized database is better than a DBMS?", "explain_en": "Concurrent multi-user access is exactly the case where a DBMS (concurrency control) is needed.", "choices_en": ["A simple application that is not expected to change at all", "Stringent real-time requirements", "An embedded system with limited storage capacity", "Multiple users updating the same data at the same time"]}, {"id": "1-when-2", "concept": "when-not", "type": "short", "prompt": "DBMS를 쓰면 생기는 오버헤드를 두 가지 이상 쓰시오.", "answer": "하드웨어·소프트웨어·교육에 드는 높은 초기 투자, 데이터를 정의·처리하는 범용성의 비용, 보안·동시성 제어·회복·무결성 기능의 부담.", "keys": ["높은 초기 투자 (HW·SW·교육)", "범용성(generality) 비용", "보안·동시성 제어·회복·무결성 기능 부담"], "lesson": "L1-1", "unit": "U1", "prompt_en": "List at least two kinds of overhead that come with using a DBMS.", "answer_en": "High initial investment in hardware, software and training; the cost of the generality a DBMS provides for defining and processing data; the overhead of security, concurrency control, recovery and integrity functions.", "keys_en": ["High initial investment (HW, SW, training)", "Cost of generality", "Overhead of security, concurrency control, recovery and integrity functions"]}, {"id": "1-char-1", "concept": "self-desc", "type": "mc", "prompt": "DB 구조와 제약조건의 정의(메타데이터)가 저장되는 곳은?", "choices": ["응용 프로그램 소스 코드", "DBMS 카탈로그", "외부 스키마", "트랜잭션 로그"], "answer": 1, "lesson": "L1-2", "unit": "U1", "prompt_en": "Where is the definition of the database structure and constraints (metadata) stored?", "choices_en": ["Application program source code", "DBMS catalog", "External schema", "Transaction log"]}, {"id": "1-char-2", "concept": "self-desc", "type": "short", "prompt": "DB 시스템의 '자기 기술성(self-describing nature)'이란 무엇인지 설명하시오.", "answer": "DB 시스템은 DB 자체뿐 아니라 DB의 구조와 제약조건을 정의한 메타데이터도 함께 담고 있다. 메타데이터는 DBMS 카탈로그에 저장되고 DB를 유지하는 데 필요하다.", "keys": ["DB + 메타데이터를 함께 포함", "메타데이터 = 구조·제약조건의 정의", "카탈로그에 저장"], "slot": 1, "pts": 3, "lesson": "L1-2", "unit": "U1", "prompt_en": "Explain the 'self-describing nature' of a database system.", "answer_en": "A database system contains not only the database itself but also metadata, i.e., the definition of the database structure and constraints. The metadata is stored in the DBMS catalog and is needed to maintain the database.", "keys_en": ["Contains the DB + metadata", "Metadata = definition of structure and constraints", "Stored in the catalog"]}, {"id": "1-char-3", "concept": "self-desc", "type": "ox", "prompt": "메타데이터는 SQL의 DDL로 정의한다.", "answer": true, "lesson": "L1-2", "unit": "U1", "prompt_en": "Metadata is defined using SQL DDL."}, {"id": "1-char-4", "concept": "self-desc", "type": "blank", "prompt": "메타데이터는 DB의 (a) 와 제약조건에 대한 정의이며, DBMS (b) 에 저장된다.", "answer": "(a) 구조 / (b) 카탈로그", "accept": [["구조", "structure"], ["카탈로그", "catalog", "catalogue"]], "lesson": "L1-2", "unit": "U1", "prompt_en": "Metadata is the definition of the database (a) and constraints, and it is stored in the DBMS (b) .", "answer_en": "(a) structure / (b) catalog"}, {"id": "1-abs-1", "concept": "abstraction", "type": "mc", "prompt": "'데이터 구조가 바뀌어도 프로그램은 영향을 받지 않는다'는 성질의 이름은?", "choices": ["프로그램-데이터 독립성", "자기 기술성", "다중 뷰", "동시성 제어"], "answer": 0, "lesson": "L1-2", "unit": "U1", "prompt_en": "What is the name of the property that 'programs are not affected even when the data structure changes'?", "choices_en": ["Program-data independence", "Self-describing nature", "Multiple views", "Concurrency control"]}, {"id": "1-abs-2", "concept": "abstraction", "type": "ox", "prompt": "데이터 추상화는 데이터의 물리 수준(저장 방식, 연산 구현)을 사용자에게 보여주고 논리 수준은 숨기는 것이다.", "answer": false, "explain": "반대. 개념적(논리) 표현을 제공하고 물리 수준 세부를 숨긴다.", "lesson": "L1-2", "unit": "U1", "prompt_en": "Data abstraction means showing users the physical level of data (how it is stored, how operations are implemented) while hiding the logical level.", "explain_en": "It is the opposite. It provides a conceptual (logical) representation and hides the physical-level details."}, {"id": "1-abs-3", "concept": "abstraction", "type": "short", "prompt": "DB 시스템의 '데이터 추상화' 특징을 설명하시오.", "answer": "프로그램과 데이터 사이를 절연한다. DB 시스템은 데이터의 개념적 표현(객체, 속성, 관계)을 제공하고, 저장 방식이나 연산 구현 같은 물리 수준의 복잡한 구조는 감춘다. 그래서 데이터 구조가 바뀌어도 프로그램이 영향을 받지 않는다(프로그램-데이터 독립성).", "keys": ["프로그램과 데이터의 절연", "개념적(논리) 표현 제공, 물리 세부 숨김", "프로그램-데이터 독립성"], "slot": 1, "pts": 3, "lesson": "L1-2", "unit": "U1", "prompt_en": "Explain the 'data abstraction' characteristic of a database system.", "answer_en": "It provides insulation between programs and data. A database system provides a conceptual representation of data (objects, their properties and their interrelationships) and hides the complex physical-level details, such as how data is stored and how operations are implemented. Therefore programs are not affected when the data structure changes (program-data independence).", "keys_en": ["Insulation between programs and data", "Provides a conceptual (logical) representation, hides physical details", "Program-data independence"]}, {"id": "1-abs-4", "concept": "abstraction", "type": "mc", "prompt": "다음 중 데이터 추상화에서 '숨기는' 것은?", "choices": ["객체", "객체의 속성", "객체 사이의 관계", "데이터가 디스크에 저장되는 방식"], "answer": 3, "lesson": "L1-2", "unit": "U1", "prompt_en": "Which of the following is 'hidden' by data abstraction?", "choices_en": ["Objects", "Properties of objects", "Relationships among objects", "How the data is stored on disk"]}, {"id": "1-view-1", "concept": "multi-views", "type": "mc", "prompt": "뷰(view)에 대한 설명으로 옳은 것은?", "choices": ["DB에 명시적으로 저장된 기본 테이블", "사용자마다 따로 만든 DB 사본", "DB에서 파생됐지만 명시적으로 저장되지 않은 가상 데이터", "물리 저장 구조를 기술한 스키마"], "answer": 2, "lesson": "L1-2", "unit": "U1", "prompt_en": "Which statement about a view is correct?", "choices_en": ["A base table explicitly stored in the DB", "A separate copy of the DB made for each user", "Virtual data that is derived from the database but not explicitly stored", "A schema that describes the physical storage structure"]}, {"id": "1-view-2", "concept": "multi-views", "type": "ox", "prompt": "다중 뷰 지원 덕분에 사용자는 보는 데이터가 저장된 것인지 파생된 것인지 알 필요가 없다.", "answer": true, "lesson": "L1-2", "unit": "U1", "prompt_en": "Thanks to the support of multiple views, users do not need to know whether the data they see is stored or derived."}, {"id": "1-view-3", "concept": "multi-views", "type": "short", "prompt": "대학 DB에서 '다중 뷰'의 예를 두 개 들고, 이 특징이 왜 필요한지 쓰시오.", "answer": "예: 학생별 성적표를 출력하는 뷰, 과목별 선수과목을 확인하는 뷰. 사용자마다 필요한 데이터 관점이 다르기 때문에, 같은 DB에서 각자에게 맞는 가상 데이터(뷰)를 제공한다.", "keys": ["예 2개 (성적표, 선수과목 등)", "사용자마다 필요한 관점이 다름"], "lesson": "L1-2", "unit": "U1", "prompt_en": "Give two examples of 'multiple views' in a university DB, and explain why this characteristic is needed.", "answer_en": "Examples: a view that prints each student's transcript, and a view that checks each course's prerequisites. Each user needs a different perspective of the data, so the same database provides each user with suitable virtual data (views).", "keys_en": ["Two examples (transcript, prerequisites, etc.)", "Each user needs a different perspective"]}, {"id": "1-view-4", "concept": "multi-views", "type": "blank", "prompt": "뷰는 DB에서 (a) 되었지만 명시적으로 (b) 되지 않은 가상 데이터이다.", "answer": "(a) 파생 / (b) 저장", "accept": [["파생", "유도", "derived", "derive"], ["저장", "stored", "store"]], "lesson": "L1-2", "unit": "U1", "prompt_en": "A view is virtual data that is (a) from the database but not explicitly (b) .", "answer_en": "(a) derived / (b) stored"}, {"id": "1-share-1", "concept": "sharing", "type": "blank", "prompt": "트랜잭션이 만족해야 하는 ACID는 원자성(Atomicity), (a) (Consistency), 고립성(Isolation), (b) (Durability)이다.", "answer": "(a) 일관성 / (b) 지속성", "accept": [["일관성", "consistency"], ["지속성", "durability", "영속성"]], "lesson": "L1-2", "unit": "U1", "prompt_en": "The ACID properties that a transaction must satisfy are Atomicity, (a) , Isolation and (b) .", "answer_en": "(a) Consistency / (b) Durability"}, {"id": "1-share-2", "concept": "sharing", "type": "mc", "prompt": "좌석이 하나 남은 항공편에 여러 예약 담당자가 동시에 배정하려 할 때 필요한 DBMS 기능은?", "choices": ["카탈로그", "동시성 제어", "뷰", "데이터 독립성"], "answer": 1, "lesson": "L1-2", "unit": "U1", "prompt_en": "Which DBMS function is needed when several reservation agents try to assign the last remaining seat on a flight at the same time?", "choices_en": ["Catalog", "Concurrency control", "View", "Data independence"]}, {"id": "1-share-3", "concept": "sharing", "type": "short", "prompt": "'트랜잭션'을 정의하고, 다중 사용자 환경에서 트랜잭션이 지켜야 할 성질의 이름을 쓰시오.", "answer": "트랜잭션은 하나의 논리적 기능을 수행하는 연산들의 모음이다. ACID(원자성, 일관성, 고립성, 지속성)를 만족해야 한다.", "keys": ["하나의 논리적 기능을 하는 연산 모음", "ACID 네 가지"], "slot": 1, "pts": 3, "lesson": "L1-2", "unit": "U1", "prompt_en": "Define a 'transaction', and name the properties a transaction must satisfy in a multiuser environment.", "answer_en": "A transaction is a collection of operations that performs a single logical function. It must satisfy ACID (Atomicity, Consistency, Isolation, Durability).", "keys_en": ["A collection of operations performing a single logical function", "The four ACID properties"]}, {"id": "1-share-4", "concept": "sharing", "type": "ox", "prompt": "데이터 공유 특징은 여러 응용의 데이터를 각자 별도의 DB에 나눠 관리하는 것을 말한다.", "answer": false, "explain": "여러 앱의 데이터를 '하나의 DB'에 통합해 관리하고 여러 사용자가 동시에 접근.", "lesson": "L1-2", "unit": "U1", "prompt_en": "The data-sharing characteristic means managing the data of different applications in separate databases.", "explain_en": "The data of many applications is integrated and managed in a 'single database', and multiple users access it at the same time."}, {"id": "1-char-5", "concept": "sharing", "type": "short", "prompt": "DB 시스템의 네 가지 특징을 쓰고 각각 한 줄로 설명하시오.", "answer": "1) 자기 기술성: DB와 메타데이터(카탈로그)를 함께 담음. 2) 데이터 추상화: 개념적 표현을 제공하고 물리 세부를 숨김(프로그램-데이터 독립성). 3) 다중 뷰 지원: 사용자마다 다른 가상 데이터(뷰) 제공. 4) 데이터 공유와 다중 사용자 트랜잭션 처리: 여러 사용자가 동시에 접근, 동시성 제어·ACID.", "keys": ["자기 기술성", "데이터 추상화", "다중 뷰", "데이터 공유·다중 사용자 트랜잭션"], "slot": 1, "pts": 3, "lesson": "L1-2", "unit": "U1", "prompt_en": "List the four characteristics of the database approach and explain each in one line.", "answer_en": "1) Self-describing nature: contains the DB together with metadata (in the catalog). 2) Data abstraction: provides a conceptual representation and hides physical details (program-data independence). 3) Support of multiple views: provides different virtual data (views) for each user. 4) Sharing of data and multiuser transaction processing: multiple users access the data at the same time; concurrency control and ACID.", "keys_en": ["Self-describing nature", "Data abstraction", "Multiple views", "Sharing of data and multiuser transaction processing"]}, {"id": "1-dm-1", "concept": "data-models", "type": "mc", "prompt": "ER 모델은 어느 범주의 데이터 모델인가?", "choices": ["개념적 (conceptual)", "표현적 (representational)", "물리적 (physical)", "외부적 (external)"], "answer": 0, "lesson": "L1-3", "unit": "U1", "prompt_en": "Which category of data model does the ER model belong to?", "choices_en": ["Conceptual", "Representational", "Physical", "External"]}, {"id": "1-dm-2", "concept": "data-models", "type": "mc", "prompt": "'레코드 형식, 순서, 접근 경로'를 표현하는 데이터 모델은?", "choices": ["개념적", "표현적", "물리적", "논리적"], "answer": 2, "lesson": "L1-3", "unit": "U1", "prompt_en": "Which data model describes 'record formats, record orderings and access paths'?", "choices_en": ["Conceptual", "Representational", "Physical", "Logical"]}, {"id": "1-dm-3", "concept": "data-models", "type": "ox", "prompt": "표현적 데이터 모델은 물리 저장의 세부를 숨기지만 컴퓨터 시스템에 바로 구현할 수 있다.", "answer": true, "lesson": "L1-3", "unit": "U1", "prompt_en": "A representational data model hides physical storage details but can be implemented directly on a computer system."}, {"id": "1-dm-4", "concept": "data-models", "type": "short", "prompt": "데이터 모델의 세 범주를 쓰고 각각을 한 줄로 설명하시오.", "answer": "개념적(high-level): 사용자가 데이터를 인식하는 방식에 가까운 개념 (ER 모델). 표현적: DBMS가 데이터를 관리하는 방식, 물리 세부는 숨기지만 바로 구현 가능 (관계 모델). 물리적(low-level): 레코드 형식·순서·접근 경로 등 저장 방식, 전문가용.", "keys": ["개념적 = 사용자 관점", "표현적 = 개념과 물리 사이, DBMS가 관리", "물리적 = 저장 방식·접근 경로"], "slot": 2, "pts": 3, "lesson": "L1-3", "unit": "U1", "prompt_en": "List the three categories of data models and explain each in one line.", "answer_en": "Conceptual (high-level): concepts close to the way users perceive data (the ER model). Representational: how the DBMS manages data; hides physical details but can be implemented directly (the relational model). Physical (low-level): how data is stored, e.g., record formats, record orderings and access paths; meant for specialists.", "keys_en": ["Conceptual = users' perspective", "Representational = between conceptual and physical, how the DBMS manages data", "Physical = storage details and access paths"]}, {"id": "1-3s-1", "concept": "three-schema", "type": "mc", "prompt": "3단계 스키마 구조에서 '특정 사용자 그룹이 관심 있는 DB 구조의 일부'를 기술하는 것은?", "choices": ["외부 스키마", "개념 스키마", "내부 스키마", "카탈로그"], "answer": 0, "lesson": "L1-3", "unit": "U1", "prompt_en": "In the three-schema architecture, which describes 'the part of the database that a particular user group is interested in'?", "choices_en": ["External schema", "Conceptual schema", "Internal schema", "Catalog"]}, {"id": "1-3s-2", "concept": "three-schema", "type": "mc", "prompt": "3단계 스키마 구조에서 실제 데이터가 저장되는 수준은?", "choices": ["외부 수준", "개념 수준", "물리(내부) 수준만", "세 수준 모두"], "answer": 2, "lesson": "L1-3", "unit": "U1", "prompt_en": "In the three-schema architecture, at which level is the actual data stored?", "choices_en": ["External level", "Conceptual level", "Only the physical (internal) level", "All three levels"]}, {"id": "1-3s-3", "concept": "three-schema", "type": "blank", "prompt": "개념 스키마는 (a) 데이터 모델로 DB의 논리 구조를 기술하고, 내부 스키마는 (b) 데이터 모델로 물리 저장 구조를 기술한다.", "answer": "(a) 표현적 / (b) 물리적", "accept": [["표현적", "표현", "representational"], ["물리적", "물리", "physical"]], "lesson": "L1-3", "unit": "U1", "prompt_en": "The conceptual schema describes the logical structure of the database using a (a) data model, and the internal schema describes the physical storage structure using a (b) data model.", "answer_en": "(a) representational / (b) physical"}, {"id": "1-3s-4", "concept": "three-schema", "type": "short", "prompt": "3단계 스키마 구조의 목표와 세 수준(스키마)을 설명하시오.", "answer": "목표: 사용자 응용을 물리적 DB에서 분리해 프로그램과 데이터의 독립성을 얻는 것. 외부 수준(외부 스키마/뷰): 특정 사용자 그룹이 관심 있는 부분. 개념 수준(개념 스키마): 전체 DB의 논리 구조를 표현적 모델로 기술, 물리 저장은 숨김. 내부 수준(내부 스키마): 물리 저장 구조와 접근 경로를 물리적 모델로 기술.", "keys": ["목표: 응용과 물리 DB 분리 (독립성)", "외부: 사용자 그룹 관점", "개념: 전체 논리 구조", "내부: 물리 저장 구조"], "slot": 2, "pts": 3, "lesson": "L1-3", "unit": "U1", "prompt_en": "Explain the goal of the three-schema architecture and its three levels (schemas).", "answer_en": "Goal: to separate user applications from the physical database, achieving independence between programs and data. External level (external schema / user view): the part of the database a particular user group is interested in. Conceptual level (conceptual schema): describes the logical structure of the whole database using a representational data model, hiding physical storage. Internal level (internal schema): describes the physical storage structure and access paths using a physical data model.", "keys_en": ["Goal: separate applications from the physical DB (independence)", "External: a user group's view", "Conceptual: logical structure of the whole DB", "Internal: physical storage structure"]}, {"id": "1-3s-5", "concept": "three-schema", "type": "ox", "prompt": "개념 스키마는 엔티티, 데이터 타입, 관계, 사용자 연산, 제약조건 같은 고수준 개념을 다룬다.", "answer": true, "lesson": "L1-3", "unit": "U1", "prompt_en": "The conceptual schema deals with high-level concepts such as entities, data types, relationships, user operations and constraints."}, {"id": "1-3s-6", "concept": "three-schema", "type": "mc", "prompt": "대학 DB에서 '저장소의 모든 세부와 접근 경로'를 기술하는 수준은?", "choices": ["외부 수준", "개념 수준", "내부 수준", "응용 수준"], "answer": 2, "lesson": "L1-3", "unit": "U1", "prompt_en": "In a university DB, which level describes 'all the details of storage and the access paths'?", "choices_en": ["External level", "Conceptual level", "Internal level", "Application level"]}, {"id": "1-map-1", "concept": "schema-mapping", "type": "short", "prompt": "실제 데이터는 내부 수준에만 있는데 DBMS는 외부 스키마로 들어온 요청을 어떻게 처리하는지 설명하시오.", "answer": "DBMS가 수준 사이의 사상(mapping)으로 요청을 변환한다. 외부 스키마의 요청을 개념 스키마로, 다시 내부 스키마의 요청으로 바꿔 저장된 DB에서 처리하고, 꺼낸 결과를 사용자의 외부 뷰에 맞게 다시 형식화한다. 사상 정보도 카탈로그에 저장된다.", "keys": ["외부→개념→내부로 요청 변환", "결과를 외부 뷰 형식으로 재구성", "사상 정보는 카탈로그에"], "lesson": "L1-3", "unit": "U1", "prompt_en": "Actual data exists only at the internal level. Explain how the DBMS processes a request specified on an external schema.", "answer_en": "The DBMS transforms the request using the mappings between levels. A request on the external schema is transformed into a request on the conceptual schema and then on the internal schema, and is processed over the stored database; the extracted result is reformatted to match the user's external view. The mapping information is also stored in the catalog.", "keys_en": ["Request transformed external → conceptual → internal", "Result reformatted to the external view", "Mapping information is in the catalog"]}, {"id": "1-map-2", "concept": "schema-mapping", "type": "ox", "prompt": "스키마 사이의 사상(mapping) 정보도 카탈로그에 저장된다.", "answer": true, "lesson": "L1-3", "unit": "U1", "prompt_en": "The mapping information between schemas is also stored in the catalog."}, {"id": "1-di-1", "concept": "data-indep", "type": "mc", "prompt": "개념 스키마에 새 데이터 항목을 추가해도 외부 스키마와 응용 프로그램을 바꿀 필요가 없는 성질은?", "choices": ["논리적 데이터 독립성", "물리적 데이터 독립성", "자기 기술성", "참조 무결성"], "answer": 0, "lesson": "L1-3", "unit": "U1", "prompt_en": "Which property means that adding a new data item to the conceptual schema does not require changing the external schemas or application programs?", "choices_en": ["Logical data independence", "Physical data independence", "Self-describing nature", "Referential integrity"]}, {"id": "1-di-2", "concept": "data-indep", "type": "mc", "prompt": "검색 속도를 높이려고 접근 경로(인덱스)를 추가해도 개념 스키마가 그대로인 성질은?", "choices": ["논리적 데이터 독립성", "물리적 데이터 독립성", "다중 뷰 지원", "데이터 공유"], "answer": 1, "lesson": "L1-3", "unit": "U1", "prompt_en": "Which property means that the conceptual schema stays the same even when an access path (index) is added to speed up retrieval?", "choices_en": ["Logical data independence", "Physical data independence", "Support of multiple views", "Data sharing"]}, {"id": "1-di-3", "concept": "data-indep", "type": "blank", "prompt": "데이터 독립성은 한 수준의 스키마를 바꿔도 바로 (a) 수준의 스키마를 바꿀 필요가 없는 능력이다. 논리적 독립성은 (b) 스키마를, 물리적 독립성은 (c) 스키마를 바꾸는 것과 관련된다.", "answer": "(a) 위 / (b) 개념 / (c) 내부", "accept": [["위", "상위", "higher", "윗", "upper", "higher-level"], ["개념", "conceptual"], ["내부", "internal", "물리", "physical"]], "lesson": "L1-3", "unit": "U1", "prompt_en": "Data independence is the capacity to change the schema at one level without having to change the schema at the next (a) level. Logical independence concerns changing the (b) schema, and physical independence concerns changing the (c) schema.", "answer_en": "(a) higher / (b) conceptual / (c) internal"}, {"id": "1-di-4", "concept": "data-indep", "type": "short", "prompt": "논리적 데이터 독립성과 물리적 데이터 독립성을 예와 함께 설명하시오.", "answer": "데이터 독립성: 한 수준의 스키마를 바꿔도 바로 위 수준 스키마를 바꿀 필요가 없는 능력. 논리적: 개념 스키마를 바꿔도(예: 새 데이터 추가·제거) 외부 스키마·응용 프로그램은 그대로. 물리적: 내부 스키마를 바꿔도(예: 저장 구조 변경, 인덱스 같은 접근 경로 추가) 개념 스키마는 그대로. 기존 응용 프로그램의 유지보수 부담을 줄인다.", "keys": ["정의: 하위 변경이 상위에 영향 없음", "논리 = 개념 스키마 변경 + 예", "물리 = 내부 스키마 변경 + 예"], "pts": 3, "slot": 2, "lesson": "L1-3", "unit": "U1", "prompt_en": "Explain logical data independence and physical data independence with examples.", "answer_en": "Data independence: the capacity to change the schema at one level without having to change the schema at the next higher level. Logical: the conceptual schema can be changed (e.g., adding or removing data) while the external schemas and application programs stay the same. Physical: the internal schema can be changed (e.g., reorganizing storage structures, adding an access path such as an index) while the conceptual schema stays the same. It reduces the maintenance burden on existing application programs.", "keys_en": ["Definition: a lower-level change does not affect the higher level", "Logical = change to the conceptual schema + example", "Physical = change to the internal schema + example"]}, {"id": "1-di-5", "concept": "data-indep", "type": "ox", "prompt": "물리적 데이터 독립성은 개념 스키마를 바꿔도 내부 스키마를 바꿀 필요가 없는 능력이다.", "answer": false, "explain": "방향이 반대. 내부 스키마를 바꿔도 개념 스키마(바로 위)를 바꿀 필요가 없는 능력.", "lesson": "L1-3", "unit": "U1", "prompt_en": "Physical data independence is the capacity to change the conceptual schema without having to change the internal schema.", "explain_en": "The direction is reversed. It is the capacity to change the internal schema without having to change the conceptual schema (the next higher level)."}, {"id": "1-di-6", "concept": "data-indep", "type": "mc", "prompt": "데이터 독립성이 주는 가장 큰 이점은?", "choices": ["저장 공간 절약", "질의 속도 향상", "기존 응용 프로그램의 유지보수 부담 감소", "보안 강화"], "answer": 2, "lesson": "L1-3", "unit": "U1", "prompt_en": "What is the greatest benefit of data independence?", "choices_en": ["Saving storage space", "Faster queries", "Reduced maintenance burden on existing application programs", "Stronger security"]}, {"id": "2-proc-1", "concept": "design-process", "type": "mc", "prompt": "DB 설계 과정에서 요구사항을 '개념 스키마'로 번역하는 단계는?", "choices": ["요구사항 수집·분석", "개념적 설계", "논리적 설계", "물리적 설계"], "answer": 1, "lesson": "L2-1", "unit": "U2", "prompt_en": "In the database design process, which step translates the requirements into a 'conceptual schema'?", "choices_en": ["Requirements collection and analysis", "Conceptual design", "Logical design", "Physical design"]}, {"id": "2-proc-2", "concept": "design-process", "type": "mc", "prompt": "구현 단계에 속하는 두 설계는?", "choices": ["요구사항 분석, 개념적 설계", "개념적 설계, 논리적 설계", "논리적 설계(DB 스키마), 물리적 설계(물리적 배치)", "ER 설계, 뷰 설계"], "answer": 2, "lesson": "L2-1", "unit": "U2", "prompt_en": "Which two designs belong to the implementation step?", "choices_en": ["Requirements analysis, conceptual design", "Conceptual design, logical design", "Logical design (database schema), physical design (physical layout)", "ER design, view design"]}, {"id": "2-ent-1", "concept": "entity-attr", "type": "mc", "prompt": "ER 모델에서 '현실 세계에서 독립적으로 존재하며 다른 것과 구별되는 것'은?", "choices": ["개체 (entity)", "속성 (attribute)", "관계 (relationship)", "도메인 (domain)"], "answer": 0, "lesson": "L2-1", "unit": "U2", "prompt_en": "In the ER model, what is 'a thing in the real world with an independent existence that is distinguishable from other things'?", "choices_en": ["Entity", "Attribute", "Relationship", "Domain"]}, {"id": "2-ent-2", "concept": "entity-attr", "type": "ox", "prompt": "회사(company)처럼 개념적으로만 존재하는 것도 개체가 될 수 있다.", "answer": true, "explain": "개체는 물리적 존재(사원)일 수도 개념적 존재(회사, 강좌)일 수도 있다.", "lesson": "L2-1", "unit": "U2", "prompt_en": "Something that exists only conceptually, such as a company, can also be an entity.", "explain_en": "An entity may be a physical object (an employee) or a conceptual one (a company, a course)."}, {"id": "2-ent-3", "concept": "entity-attr", "type": "short", "prompt": "ER 모델에서 개체, 속성, 관계를 각각 정의하시오.", "answer": "개체: 현실 세계에서 독립적으로 존재하고 다른 것과 구별되는 것(물리적 또는 개념적 존재). 속성: 개체를 기술하는 특정 성질. 관계: 여러 개체 사이의 연관.", "keys": ["개체 = 독립적 존재, 구별 가능", "속성 = 개체를 기술하는 성질", "관계 = 개체들 사이의 연관"], "lesson": "L2-1", "unit": "U2", "prompt_en": "Define entity, attribute and relationship in the ER model.", "answer_en": "Entity: a thing in the real world with an independent existence that is distinguishable from other things (a physical or conceptual object). Attribute: a particular property that describes an entity. Relationship: an association among several entities.", "keys_en": ["Entity = independent existence, distinguishable", "Attribute = property that describes an entity", "Relationship = association among entities"]}, {"id": "2-ent-4", "concept": "entity-attr", "type": "mc", "prompt": "다음 중 '속성'이 아닌 것은?", "choices": ["사원의 이름", "사원의 주소", "회사의 본사 위치", "사원이 일하는 부서와의 연관"], "answer": 3, "explain": "부서와의 연관은 관계(WORKS_FOR). 초기 설계에선 속성처럼 넣었다가 다듬기에서 관계로 바꾼다.", "lesson": "L2-1", "unit": "U2", "prompt_en": "Which of the following is NOT an 'attribute'?", "explain_en": "The association with a department is a relationship (WORKS_FOR). In the initial design it is included like an attribute, and in refinement it is changed into a relationship.", "choices_en": ["An employee's name", "An employee's address", "A company's headquarters location", "An employee's association with the department they work for"]}, {"id": "2-attr-1", "concept": "attr-types", "type": "mc", "prompt": "Address = (Street_address, City, State, Zip)는 어떤 속성인가?", "choices": ["복합 속성", "다중값 속성", "유도 속성", "키 속성"], "answer": 0, "lesson": "L2-1", "unit": "U2", "prompt_en": "What kind of attribute is Address = (Street_address, City, State, Zip)?", "choices_en": ["Composite attribute", "Multivalued attribute", "Derived attribute", "Key attribute"]}, {"id": "2-attr-2", "concept": "attr-types", "type": "mc", "prompt": "한 사원이 학위를 여러 개 가질 때 College_degrees는 어떤 속성인가?", "choices": ["복합 속성", "다중값 속성", "유도 속성", "단순 속성"], "answer": 1, "lesson": "L2-1", "unit": "U2", "prompt_en": "If an employee can have several degrees, what kind of attribute is College_degrees?", "choices_en": ["Composite attribute", "Multivalued attribute", "Derived attribute", "Simple attribute"]}, {"id": "2-attr-3", "concept": "attr-types", "type": "mc", "prompt": "Birth_date에서 계산할 수 있는 Age는?", "choices": ["복합 속성", "다중값 속성", "유도 속성", "키 속성"], "answer": 2, "lesson": "L2-1", "unit": "U2", "prompt_en": "Age, which can be computed from Birth_date, is a(n)?", "choices_en": ["Composite attribute", "Multivalued attribute", "Derived attribute", "Key attribute"]}, {"id": "2-attr-4", "concept": "attr-types", "type": "blank", "prompt": "ER 다이어그램에서 다중값 속성은 (a) 타원으로, 유도 속성은 (b) 타원으로 그린다.", "answer": "(a) 이중 / (b) 점선", "accept": [["이중", "두 줄", "이중선", "double", "double-lined", "double line"], ["점선", "dashed", "dotted"]], "lesson": "L2-1", "unit": "U2", "prompt_en": "In an ER diagram, a multivalued attribute is drawn as a (a) oval, and a derived attribute is drawn as a (b) oval.", "answer_en": "(a) double / (b) dashed"}, {"id": "2-attr-5", "concept": "attr-types", "type": "short", "prompt": "속성의 세 가지 분류 기준을 쓰고 각각 예를 하나씩 드시오.", "answer": "1) 복합 vs 단순: 복합은 더 작은 부분으로 나뉨(Address = Street, City, State, Zip), 단순(원자)은 안 나뉨(City). 2) 단일값 vs 다중값: 개체마다 값 하나(Age, SSN) vs 값의 집합(Phone numbers, College degrees). 3) 저장 vs 유도: DB에 저장(Birth_date) vs 다른 속성에서 계산(Age).", "keys": ["복합/단순 + 예", "단일값/다중값 + 예", "저장/유도 + 예"], "lesson": "L2-1", "unit": "U2", "prompt_en": "List the three ways of classifying attributes and give one example for each.", "answer_en": "1) Composite vs simple: a composite attribute can be divided into smaller parts (Address = Street, City, State, Zip); a simple (atomic) one cannot (City). 2) Single-valued vs multivalued: one value per entity (Age, SSN) vs a set of values (Phone numbers, College degrees). 3) Stored vs derived: stored in the DB (Birth_date) vs computed from other attributes (Age).", "keys_en": ["Composite/simple + example", "Single-valued/multivalued + example", "Stored/derived + example"]}, {"id": "2-attr-6", "concept": "attr-types", "type": "ox", "prompt": "DEPARTMENT의 Locations는 부서마다 위치가 여러 개일 수 있어서 복합 속성이다.", "answer": false, "explain": "여러 값 = 다중값 속성. 복합은 한 값이 여러 부분으로 나뉘는 것.", "lesson": "L2-1", "unit": "U2", "prompt_en": "DEPARTMENT's Locations is a composite attribute because a department can have several locations.", "explain_en": "Several values = a multivalued attribute. Composite means one value is divided into several parts."}, {"id": "2-attr-7", "concept": "attr-types", "type": "mc", "prompt": "EMPLOYEE의 Name = (Fname, Minit, Lname)은?", "choices": ["복합 속성", "다중값 속성", "유도 속성", "약한 속성"], "answer": 0, "lesson": "L2-1", "unit": "U2", "prompt_en": "EMPLOYEE's Name = (Fname, Minit, Lname) is a(n)?", "choices_en": ["Composite attribute", "Multivalued attribute", "Derived attribute", "Weak attribute"]}, {"id": "2-key-1", "concept": "key-attr", "type": "ox", "prompt": "한 개체 타입은 키 속성을 둘 이상 가질 수 있다.", "answer": true, "explain": "예: CAR의 키 = Registration, Vehicle_id.", "lesson": "L2-1", "unit": "U2", "prompt_en": "An entity type can have more than one key attribute.", "explain_en": "e.g., CAR's keys = Registration, Vehicle_id."}, {"id": "2-key-2", "concept": "key-attr", "type": "mc", "prompt": "CAR의 Registration(Number, State)에 대한 설명으로 옳은 것은?", "choices": ["다중값 키", "두 속성이 모여 하나의 키를 이루는 복합 키", "유도 키", "부분 키"], "answer": 1, "lesson": "L2-1", "unit": "U2", "prompt_en": "Which statement about CAR's Registration(Number, State) is correct?", "choices_en": ["A multivalued key", "A composite key in which two attributes together form one key", "A derived key", "A partial key"]}, {"id": "2-key-3", "concept": "key-attr", "type": "short", "prompt": "ER 모델의 키 속성이란 무엇이고 다이어그램에 어떻게 표시하는지 쓰시오.", "answer": "개체마다 값이 서로 다른 속성으로, 각 개체를 유일하게 식별한다. 여러 속성이 모여 키가 될 수도 있고 키가 여러 개일 수도 있다. 다이어그램에서는 속성 이름에 밑줄.", "keys": ["개체마다 값이 다름 → 유일 식별", "밑줄로 표시"], "lesson": "L2-1", "unit": "U2", "prompt_en": "What is a key attribute in the ER model, and how is it shown in the diagram?", "answer_en": "An attribute whose values are distinct for each entity, so it uniquely identifies each entity. Several attributes together can form a key, and an entity type can have more than one key. In the diagram the attribute name is underlined.", "keys_en": ["Distinct value for each entity → uniquely identifies it", "Shown underlined"]}, {"id": "2-key-4", "concept": "key-attr", "type": "blank", "prompt": "키 속성은 다이어그램에서 (a) 로 표시하고, 약한 개체의 부분 키는 (b) 밑줄로 표시한다.", "answer": "(a) 밑줄 / (b) 점선", "accept": [["밑줄", "underline", "실선 밑줄", "underlined", "solid underline"], ["점선", "dashed", "dotted"]], "lesson": "L2-1", "unit": "U2", "prompt_en": "In the diagram, a key attribute is shown with a(n) (a) , and the partial key of a weak entity is shown with a (b) underline.", "answer_en": "(a) underline / (b) dashed"}, {"id": "2-not-1", "concept": "er-notation", "type": "mc", "prompt": "ER 다이어그램에서 이중 마름모가 나타내는 것은?", "choices": ["약한 개체 타입", "다중값 속성", "식별 관계 타입", "M:N 관계"], "answer": 2, "lesson": "L2-1", "unit": "U2", "prompt_en": "What does a double diamond represent in an ER diagram?", "choices_en": ["Weak entity type", "Multivalued attribute", "Identifying relationship type", "M:N relationship"]}, {"id": "2-not-2", "concept": "er-notation", "type": "mc", "prompt": "E₁ — R ═ E₂ (E₂ 쪽만 이중선)의 의미는?", "choices": ["E₁이 R에 전체 참여", "E₂가 R에 전체 참여", "R이 1:N", "E₂가 약한 개체"], "answer": 1, "lesson": "L2-1", "unit": "U2", "prompt_en": "What does E₁ — R ═ E₂ (double line only on the E₂ side) mean?", "choices_en": ["E₁ has total participation in R", "E₂ has total participation in R", "R is 1:N", "E₂ is a weak entity"]}, {"id": "2-not-3", "concept": "er-notation", "type": "ox", "prompt": "이중 직사각형은 약한 개체 타입을 나타낸다.", "answer": true, "lesson": "L2-1", "unit": "U2", "prompt_en": "A double rectangle represents a weak entity type."}, {"id": "2-not-4", "concept": "er-notation", "type": "blank", "prompt": "ER 다이어그램에서 개체 타입은 (a), 관계 타입은 (b), 속성은 타원으로 그린다.", "answer": "(a) 직사각형 / (b) 마름모", "accept": [["직사각형", "사각형", "네모", "rectangle", "box"], ["마름모", "diamond", "다이아몬드", "rhombus"]], "lesson": "L2-1", "unit": "U2", "prompt_en": "In an ER diagram, an entity type is drawn as a (a) , a relationship type as a (b) , and an attribute as an oval.", "answer_en": "(a) rectangle / (b) diamond"}, {"id": "2-init-1", "concept": "initial-design", "type": "short", "prompt": "COMPANY 초기 설계에서 EMPLOYEE의 Department, Supervisor, Works_on 같은 속성은 어떤 문제가 있고, 어떻게 고치는지 쓰시오.", "answer": "이 속성들은 사실 다른 개체(부서, 다른 사원, 프로젝트)를 참조한다. 관계가 속성 형태로 암묵적으로 들어가 있는 것이므로, 명시적인 관계 타입(WORKS_FOR, SUPERVISION, WORKS_ON)으로 바꿔야 한다.", "keys": ["다른 개체를 참조하는 속성 = 암묵적 관계", "관계 타입으로 바꿈"], "lesson": "L2-1", "unit": "U2", "prompt_en": "In the initial COMPANY design, what is the problem with EMPLOYEE attributes such as Department, Supervisor and Works_on, and how is it fixed?", "answer_en": "These attributes actually refer to other entities (a department, another employee, projects). Relationships are hidden implicitly as attributes, so they must be changed into explicit relationship types (WORKS_FOR, SUPERVISION, WORKS_ON).", "keys_en": ["Attributes that refer to other entities = implicit relationships", "Change them into relationship types"]}, {"id": "2-init-2", "concept": "initial-design", "type": "mc", "prompt": "COMPANY 초기 설계에서 DEPARTMENT의 키 속성은?", "choices": ["Number만", "Name만", "Manager", "Name과 Number 둘 다 (각각 고유)"], "answer": 3, "lesson": "L2-1", "unit": "U2", "prompt_en": "In the initial COMPANY design, what are the key attributes of DEPARTMENT?", "choices_en": ["Only Number", "Only Name", "Manager", "Both Name and Number (each unique)"]}, {"id": "2-rel-1", "concept": "rel-type", "type": "mc", "prompt": "관계 타입의 '차수(degree)'란?", "choices": ["관계 인스턴스의 수", "참여하는 개체 타입의 수", "관계 속성의 수", "카디널리티 비의 최댓값"], "answer": 1, "lesson": "L2-2", "unit": "U2", "prompt_en": "What is the 'degree' of a relationship type?", "choices_en": ["The number of relationship instances", "The number of participating entity types", "The number of relationship attributes", "The maximum of the cardinality ratio"]}, {"id": "2-rel-2", "concept": "rel-type", "type": "mc", "prompt": "SUPPLY(SUPPLIER, PART, PROJECT)의 차수는?", "choices": ["1 (단항)", "2 (2진)", "3 (3진)", "M:N"], "answer": 2, "lesson": "L2-2", "unit": "U2", "prompt_en": "What is the degree of SUPPLY(SUPPLIER, PART, PROJECT)?", "choices_en": ["1 (unary)", "2 (binary)", "3 (ternary)", "M:N"]}, {"id": "2-rel-3", "concept": "rel-type", "type": "ox", "prompt": "DB 시스템에서 대부분의 관계는 2진 관계이다.", "answer": true, "lesson": "L2-2", "unit": "U2", "prompt_en": "Most relationships in database systems are binary."}, {"id": "2-rel-4", "concept": "rel-type", "type": "short", "prompt": "관계 타입의 '역할 이름(role name)'이 무엇이고 언제 꼭 필요한지 쓰시오.", "answer": "참여 개체가 관계 인스턴스에서 맡는 역할(예: WORKS_FOR에서 EMPLOYEE = worker, DEPARTMENT = employer). 관계의 의미를 이해하게 해준다. 같은 개체 타입이 두 번 이상 참여하는 순환 관계에서는 참여 개체를 구별하려고 꼭 필요하다.", "keys": ["참여 개체가 맡는 역할", "순환 관계에서 필수"], "lesson": "L2-2", "unit": "U2", "prompt_en": "What is a 'role name' of a relationship type, and when is it required?", "answer_en": "The role that a participating entity plays in each relationship instance (e.g., in WORKS_FOR, EMPLOYEE = worker, DEPARTMENT = employer). It helps explain what the relationship means. It is required in a recursive relationship, where the same entity type participates more than once, to distinguish the participants.", "keys_en": ["The role a participating entity plays", "Required in recursive relationships"]}, {"id": "2-rec-1", "concept": "recursive", "type": "mc", "prompt": "순환(recursive) 관계의 예는?", "choices": ["WORKS_FOR", "MANAGES", "SUPERVISION", "CONTROLS"], "answer": 2, "lesson": "L2-2", "unit": "U2", "prompt_en": "Which of the following is an example of a recursive relationship?"}, {"id": "2-rec-2", "concept": "recursive", "type": "ox", "prompt": "순환 관계에서는 같은 개체 타입이 두 번 이상 참여하므로 역할 이름을 명시해야 한다.", "answer": true, "lesson": "L2-2", "unit": "U2", "prompt_en": "In a recursive relationship the same entity type participates more than once, so role names must be specified."}, {"id": "2-rec-3", "concept": "recursive", "type": "short", "prompt": "SUPERVISION 관계가 순환 관계인 이유와, 인스턴스 r = (e₁, e₂)를 해석하는 데 필요한 정보를 쓰시오.", "answer": "EMPLOYEE 개체 타입이 supervisor와 supervisee 두 역할로 한 관계에 참여하기 때문. r = (e₁, e₂)에서 어느 쪽이 supervisor 역할이고 어느 쪽이 supervisee 역할인지(역할 이름)를 알아야 '누가 누구의 상사인지' 해석할 수 있다.", "keys": ["같은 개체 타입이 두 역할로 참여", "역할 이름으로 상사/부하 구별"], "lesson": "L2-2", "unit": "U2", "prompt_en": "Explain why SUPERVISION is a recursive relationship, and what information is needed to interpret an instance r = (e₁, e₂).", "answer_en": "Because the EMPLOYEE entity type participates in the same relationship in two roles, supervisor and supervisee. To interpret r = (e₁, e₂), i.e., 'who supervises whom', we must know which side plays the supervisor role and which plays the supervisee role (the role names).", "keys_en": ["The same entity type participates in two roles", "Role names distinguish supervisor/supervisee"]}, {"id": "2-rec-4", "concept": "recursive", "type": "blank", "prompt": "순환 관계 SUPERVISION에서 EMPLOYEE는 (a) 역할과 (b) 역할로 참여한다.", "answer": "(a) supervisor / (b) supervisee", "accept": [["supervisor", "상사", "감독자"], ["supervisee", "부하", "피감독자"]], "lesson": "L2-2", "unit": "U2", "prompt_en": "In the recursive relationship SUPERVISION, EMPLOYEE participates in the (a) role and the (b) role."}, {"id": "2-card-1", "concept": "cardinality", "type": "mc", "prompt": "'사원은 한 부서에서만 일하고, 부서는 사원을 몇 명이든 둘 수 있다'의 카디널리티 비는?", "choices": ["1:1", "DEPARTMENT 1 : EMPLOYEE N", "EMPLOYEE 1 : DEPARTMENT N", "M:N"], "answer": 1, "lesson": "L2-2", "unit": "U2", "prompt_en": "What is the cardinality ratio for 'an employee works for only one department, and a department can have any number of employees'?"}, {"id": "2-card-2", "concept": "cardinality", "type": "mc", "prompt": "WORKS_ON(사원은 여러 프로젝트, 프로젝트는 여러 사원)의 카디널리티 비는?", "choices": ["1:1", "1:N", "N:1", "M:N"], "answer": 3, "lesson": "L2-2", "unit": "U2", "prompt_en": "What is the cardinality ratio of WORKS_ON (an employee works on many projects, and a project has many employees)?"}, {"id": "2-card-3", "concept": "cardinality", "type": "mc", "prompt": "MANAGES(사원은 최대 한 부서를 관리, 부서는 관리자 최대 한 명)의 카디널리티 비는?", "choices": ["1:1", "1:N", "N:1", "M:N"], "answer": 0, "lesson": "L2-2", "unit": "U2", "prompt_en": "What is the cardinality ratio of MANAGES (an employee manages at most one department, and a department has at most one manager)?"}, {"id": "2-card-4", "concept": "cardinality", "type": "blank", "prompt": "카디널리티 비는 한 개체가 참여할 수 있는 관계 인스턴스의 (a) 개수를 지정하고, 참여 제약은 개체의 존재가 관계에 (b) 하는지를 지정한다.", "answer": "(a) 최대 / (b) 의존", "accept": [["최대", "maximum", "max"], ["의존", "depend", "dependent", "depends", "dependency", "existence dependency"]], "lesson": "L2-2", "unit": "U2", "prompt_en": "The cardinality ratio specifies the (a) number of relationship instances that an entity can participate in, and the participation constraint specifies whether the existence of an entity (b) on its being related to another entity through the relationship.", "answer_en": "(a) maximum / (b) depends"}, {"id": "2-card-5", "concept": "cardinality", "type": "ox", "prompt": "1:N 관계 WORKS_FOR에서 N쪽 개체(EMPLOYEE) 하나는 1쪽 개체(DEPARTMENT) 최대 하나와 연결된다.", "answer": true, "lesson": "L2-2", "unit": "U2", "prompt_en": "In the 1:N relationship WORKS_FOR, one entity on the N-side (EMPLOYEE) is related to at most one entity on the 1-side (DEPARTMENT)."}, {"id": "2-card-6", "concept": "cardinality", "type": "short", "prompt": "2진 관계의 카디널리티 비 세 가지를 COMPANY 예와 함께 설명하시오.", "answer": "1:1 — MANAGES: 사원은 최대 한 부서를 관리, 부서는 관리자가 최대 한 명. 1:N — WORKS_FOR: 부서(1)는 사원(N)을 몇 명이든, 사원은 한 부서에서만. M:N — WORKS_ON: 사원은 여러 프로젝트, 프로젝트도 여러 사원.", "keys": ["1:1 + MANAGES", "1:N + WORKS_FOR", "M:N + WORKS_ON"], "lesson": "L2-2", "unit": "U2", "prompt_en": "Explain the three cardinality ratios for binary relationships with COMPANY examples.", "answer_en": "1:1 — MANAGES: an employee manages at most one department, and a department has at most one manager. 1:N — WORKS_FOR: a department (1) can have any number of employees (N), and an employee works for only one department. M:N — WORKS_ON: an employee works on many projects, and a project has many employees."}, {"id": "2-part-1", "concept": "participation", "type": "mc", "prompt": "'모든 사원은 반드시 어떤 부서에서 일해야 한다'는 EMPLOYEE의 WORKS_FOR 참여는?", "choices": ["전체 참여", "부분 참여", "1:1 참여", "약한 참여"], "answer": 0, "lesson": "L2-2", "unit": "U2", "prompt_en": "'Every employee must work for some department.' What is EMPLOYEE's participation in WORKS_FOR?", "choices_en": ["Total participation", "Partial participation", "1:1 participation", "Weak participation"]}, {"id": "2-part-2", "concept": "participation", "type": "mc", "prompt": "EMPLOYEE의 MANAGES 참여가 부분 참여인 이유는?", "choices": ["부서마다 관리자가 한 명이라서", "관리자는 반드시 사원이라서", "모든 사원이 부서를 관리하지는 않아서", "MANAGES가 1:1이라서"], "answer": 2, "lesson": "L2-2", "unit": "U2", "prompt_en": "Why is EMPLOYEE's participation in MANAGES partial?", "choices_en": ["Because each department has one manager", "Because a manager must be an employee", "Because not every employee manages a department", "Because MANAGES is 1:1"]}, {"id": "2-part-3", "concept": "participation", "type": "ox", "prompt": "전체 참여는 ER 다이어그램에서 이중선으로 그린다.", "answer": true, "lesson": "L2-2", "unit": "U2", "prompt_en": "Total participation is drawn as a double line in an ER diagram."}, {"id": "2-part-4", "concept": "participation", "type": "short", "prompt": "전체 참여와 부분 참여를 정의하고 EMPLOYEE를 예로 각각 설명하시오.", "answer": "전체 참여: 모든 개체가 그 관계에 참여해야 함(존재 의존). 예) 모든 사원은 부서에서 일하므로 EMPLOYEE는 WORKS_FOR에 전체 참여. 부분 참여: 모든 개체가 참여할 필요는 없음. 예) 일부 사원만 부서를 관리하므로 EMPLOYEE는 MANAGES에 부분 참여.", "keys": ["전체 = 모든 개체 참여 + WORKS_FOR 예", "부분 = 일부만 + MANAGES 예"], "lesson": "L2-2", "unit": "U2", "prompt_en": "Define total participation and partial participation, and explain each using EMPLOYEE as an example.", "answer_en": "Total participation: every entity must participate in the relationship (existence dependency). e.g., every employee works for a department, so EMPLOYEE has total participation in WORKS_FOR. Partial participation: not every entity needs to participate. e.g., only some employees manage a department, so EMPLOYEE has partial participation in MANAGES.", "keys_en": ["Total = every entity participates + WORKS_FOR example", "Partial = only some + MANAGES example"]}, {"id": "2-part-5", "concept": "participation", "type": "mc", "prompt": "약한 개체 타입의 식별 관계 참여는 항상?", "choices": ["전체 참여", "부분 참여", "M:N", "1:1"], "answer": 0, "lesson": "L2-2", "unit": "U2", "prompt_en": "A weak entity type's participation in its identifying relationship is always?", "choices_en": ["Total participation", "Partial participation", "M:N", "1:1"]}, {"id": "2-part-6", "concept": "participation", "type": "ox", "prompt": "CONTROLS에서 DEPARTMENT는 전체 참여이고 PROJECT는 부분 참여이다.", "answer": false, "explain": "반대. 모든 프로젝트는 통제 부서가 있어야 하므로 PROJECT가 전체, 프로젝트가 없는 부서도 있으므로 DEPARTMENT가 부분.", "lesson": "L2-2", "unit": "U2", "prompt_en": "In CONTROLS, DEPARTMENT has total participation and PROJECT has partial participation.", "explain_en": "It is the opposite. Every project must have a controlling department, so PROJECT is total; some departments have no projects, so DEPARTMENT is partial."}, {"id": "2-mm-1", "concept": "minmax", "type": "mc", "prompt": "(min, max) 표기에서 min = 0이 뜻하는 것은?", "choices": ["전체 참여", "부분 참여", "1:1 관계", "약한 개체"], "answer": 1, "lesson": "L2-2", "unit": "U2", "prompt_en": "In (min, max) notation, what does min = 0 mean?", "choices_en": ["Total participation", "Partial participation", "1:1 relationship", "Weak entity"]}, {"id": "2-mm-2", "concept": "minmax", "type": "mc", "prompt": "'강의는 교재를 쓸 수도 안 쓸 수도 있고, 다섯 권을 넘게 쓰지는 않는다'일 때 COURSE의 USES 참여는?", "choices": ["(1, 5)", "(0, N)", "(0, 5)", "(5, N)"], "answer": 2, "lesson": "L2-2", "unit": "U2", "prompt_en": "'A course may or may not use a textbook, but not more than five.' What is COURSE's participation in USES?"}, {"id": "2-mm-3", "concept": "minmax", "type": "mc", "prompt": "'강사는 2개 이상 4개 이하의 강의를 가르친다'일 때 INSTRUCTOR의 TEACHES 참여는?", "choices": ["(0, 4)", "(1, 4)", "(2, N)", "(2, 4)"], "answer": 3, "lesson": "L2-2", "unit": "U2", "prompt_en": "'An instructor teaches 2 to 4 courses.' What is INSTRUCTOR's participation in TEACHES?"}, {"id": "2-mm-4", "concept": "minmax", "type": "blank", "prompt": "MANAGES 관계를 (min, max)로 나타내면 EMPLOYEE 쪽은 (a), DEPARTMENT 쪽은 (b) 이다.", "answer": "(a) (0,1) / (b) (1,1)", "accept": [["(0,1)", "0,1", "(0, 1)"], ["(1,1)", "1,1", "(1, 1)"]], "lesson": "L2-2", "unit": "U2", "prompt_en": "In (min, max) notation for the MANAGES relationship, the EMPLOYEE side is (a) and the DEPARTMENT side is (b) ."}, {"id": "2-mm-5", "concept": "minmax", "type": "calc", "prompt": "다음 요구사항을 보고 각 참여의 (min, max)를 쓰시오.\n• 강의(COURSE)는 교재를 쓸 수도 안 쓸 수도 있고, 다섯 권을 넘게 쓰지 않는다.\n• 강의는 최소 1명, 최대 4명의 강사가 가르친다.\n• 교재(TEXT)는 어떤 강의들에서 쓰인다 (안 쓰이는 교재는 기록 안 함).\n• 강사는 2~4개의 강의를 가르친다.\n\nINSTRUCTOR —(①)— TEACHES —(②)— COURSE —(③)— USES —(④)— TEXT", "answer": "① INSTRUCTOR의 TEACHES 참여: (2, 4)\n② COURSE의 TEACHES 참여: (1, 4)\n③ COURSE의 USES 참여: (0, 5)\n④ TEXT의 USES 참여: (1, N)", "explain": "(min,max)는 그 개체 하나가 관계에 몇 번 참여하는지. min 0 = 부분, min ≥ 1 = 전체.", "keys": ["① (2,4)", "② (1,4)", "③ (0,5)", "④ (1,N)"], "slot": 7, "pts": 5, "lesson": "L2-2", "unit": "U2", "prompt_en": "Given the following requirements, write the (min, max) of each participation.\n• A course (COURSE) may or may not use a textbook, but not more than five.\n• A course is taught by at least 1 and at most 4 instructors.\n• A textbook (TEXT) is used in some courses (textbooks that are not used are not recorded).\n• An instructor teaches 2 to 4 courses.\n\nINSTRUCTOR —(①)— TEACHES —(②)— COURSE —(③)— USES —(④)— TEXT", "answer_en": "① INSTRUCTOR's participation in TEACHES: (2, 4)\n② COURSE's participation in TEACHES: (1, 4)\n③ COURSE's participation in USES: (0, 5)\n④ TEXT's participation in USES: (1, N)", "explain_en": "(min,max) means how many times one such entity participates in the relationship. min 0 = partial, min ≥ 1 = total."}, {"id": "2-mm-6", "concept": "minmax", "type": "ox", "prompt": "WORKS_FOR(DEPARTMENT 1 : EMPLOYEE N)를 (min, max)로 나타내면 EMPLOYEE 쪽에 (1, 1)이 붙는다.", "answer": true, "explain": "사원 하나는 WORKS_FOR 인스턴스에 정확히 1번 참여. 1:N 표기의 '1'이 DEPARTMENT 쪽에 붙는 것과 위치가 반대로 보이는 게 함정.", "lesson": "L2-2", "unit": "U2", "prompt_en": "When WORKS_FOR (DEPARTMENT 1 : EMPLOYEE N) is written in (min, max) notation, (1, 1) is placed on the EMPLOYEE side.", "explain_en": "One employee participates in exactly one WORKS_FOR instance. The trap is that its position looks reversed compared with the '1' of 1:N notation, which is placed on the DEPARTMENT side."}, {"id": "2-mm-7", "concept": "minmax", "type": "calc", "prompt": "COMPANY 다듬은 ER 다이어그램에서 다음 참여의 (min, max)를 쓰시오.\n(1) EMPLOYEE의 WORKS_FOR 참여  (2) EMPLOYEE의 MANAGES 참여  (3) PROJECT의 CONTROLS 참여  (4) supervisee 역할 EMPLOYEE의 SUPERVISION 참여  (5) DEPENDENT의 DEPENDENTS_OF 참여", "answer": "(1) (1, 1)  (2) (0, 1)  (3) (1, 1)  (4) (0, 1)  (5) (1, 1)", "explain": "사원은 정확히 한 부서, 관리는 최대 한 부서(안 할 수도), 프로젝트는 정확히 한 통제 부서, 상사는 최대 한 명(Borg는 없음), 부양가족은 정확히 한 사원에 딸림.", "keys": ["(1) (1,1)", "(2) (0,1)", "(3) (1,1)", "(4) (0,1)", "(5) (1,1)"], "slot": 7, "pts": 5, "lesson": "L2-2", "unit": "U2", "prompt_en": "In the refined COMPANY ER diagram, write the (min, max) of the following participations.\n(1) EMPLOYEE's participation in WORKS_FOR  (2) EMPLOYEE's participation in MANAGES  (3) PROJECT's participation in CONTROLS  (4) the participation of EMPLOYEE in the supervisee role in SUPERVISION  (5) DEPENDENT's participation in DEPENDENTS_OF", "explain_en": "An employee works for exactly one department; manages at most one department (possibly none); a project has exactly one controlling department; an employee has at most one supervisor (Borg has none); a dependent belongs to exactly one employee."}, {"id": "2-ra-1", "concept": "rel-attr", "type": "mc", "prompt": "M:N 관계 WORKS_ON의 속성 Hours를 개체 타입으로 옮길 수 없는 이유는?", "choices": ["Hours가 다중값이라서", "Hours는 사원–프로젝트 조합으로만 결정되어서", "Hours가 유도 속성이라서", "WORKS_ON이 식별 관계라서"], "answer": 1, "lesson": "L2-3", "unit": "U2", "prompt_en": "Why can't the attribute Hours of the M:N relationship WORKS_ON be migrated to an entity type?", "choices_en": ["Because Hours is multivalued", "Because Hours is determined only by the employee–project combination", "Because Hours is a derived attribute", "Because WORKS_ON is an identifying relationship"]}, {"id": "2-ra-2", "concept": "rel-attr", "type": "mc", "prompt": "1:N 관계 WORKS_FOR의 속성 StartDate는 어디로 옮길 수 있나?", "choices": ["DEPARTMENT로만", "어느 쪽이든", "EMPLOYEE(N쪽)로만", "옮길 수 없음"], "answer": 2, "lesson": "L2-3", "unit": "U2", "prompt_en": "Where can the attribute StartDate of the 1:N relationship WORKS_FOR be migrated?", "choices_en": ["Only to DEPARTMENT", "To either side", "Only to EMPLOYEE (the N-side)", "It cannot be migrated"]}, {"id": "2-ra-3", "concept": "rel-attr", "type": "ox", "prompt": "1:1 관계 MANAGES의 StartDate는 EMPLOYEE와 DEPARTMENT 중 어느 쪽으로든 옮길 수 있다.", "answer": true, "lesson": "L2-3", "unit": "U2", "prompt_en": "The StartDate of the 1:1 relationship MANAGES can be migrated to either EMPLOYEE or DEPARTMENT."}, {"id": "2-ra-4", "concept": "rel-attr", "type": "short", "prompt": "관계 타입의 속성을 참여 개체로 옮길(migrate) 수 있는지를 1:1, 1:N, M:N 각각에 대해 설명하시오.", "answer": "1:1: 어느 참여 개체로든 옮길 수 있음 (MANAGES.StartDate). 1:N: N쪽 개체로만 옮길 수 있음. N쪽 개체 하나는 인스턴스에 최대 1번 참여해서 값이 하나로 정해지기 때문 (WORKS_FOR.StartDate → EMPLOYEE). M:N: 어느 개체로도 못 옮김. 속성 값이 참여 개체 조합으로만 결정되기 때문 (WORKS_ON.Hours).", "keys": ["1:1 = 어느 쪽이든", "1:N = N쪽만 (이유)", "M:N = 못 옮김 (조합으로 결정)"], "lesson": "L2-3", "unit": "U2", "prompt_en": "Explain whether an attribute of a relationship type can be migrated to a participating entity type, for each of 1:1, 1:N and M:N.", "answer_en": "1:1: it can be migrated to either participating entity type (MANAGES.StartDate). 1:N: it can be migrated only to the entity type on the N-side, because one N-side entity participates in at most one relationship instance, so its value is uniquely determined (WORKS_FOR.StartDate → EMPLOYEE). M:N: it cannot be migrated to either entity, because the value is determined only by the combination of participating entities (WORKS_ON.Hours).", "keys_en": ["1:1 = either side", "1:N = N-side only (with reason)", "M:N = cannot be migrated (determined by the combination)"]}, {"id": "2-ra-5", "concept": "rel-attr", "type": "blank", "prompt": "1:N 관계의 속성은 (a) 쪽 개체로만 옮길 수 있고, M:N 관계의 속성은 참여 개체의 (b) 으로 결정되어 옮길 수 없다.", "answer": "(a) N / (b) 조합", "accept": [["N", "n", "N쪽", "다(N)", "N-side", "many"], ["조합", "combination", "조합으로"]], "lesson": "L2-3", "unit": "U2", "prompt_en": "An attribute of a 1:N relationship can be migrated only to the entity on the (a) side, and an attribute of an M:N relationship cannot be migrated because it is determined by the (b) of participating entities.", "answer_en": "(a) N / (b) combination"}, {"id": "2-weak-1", "concept": "weak-entity", "type": "mc", "prompt": "약한 개체 타입의 정의로 옳은 것은?", "choices": ["자신의 키 속성이 없는 개체 타입", "속성이 하나뿐인 개체 타입", "부분 참여만 하는 개체 타입", "다른 개체가 참조하지 않는 개체 타입"], "answer": 0, "lesson": "L2-3", "unit": "U2", "prompt_en": "Which is the correct definition of a weak entity type?", "choices_en": ["An entity type that does not have key attributes of its own", "An entity type with only one attribute", "An entity type that has only partial participation", "An entity type that is not referenced by any other entity"]}, {"id": "2-weak-2", "concept": "weak-entity", "type": "mc", "prompt": "DEPENDENT의 Dependent_name 같은, 같은 소유자에 딸린 약한 개체끼리 구별하는 속성은?", "choices": ["기본 키", "후보 키", "부분 키", "외래 키"], "answer": 2, "lesson": "L2-3", "unit": "U2", "prompt_en": "Which attribute, such as DEPENDENT's Dependent_name, distinguishes weak entities related to the same owner?", "choices_en": ["Primary key", "Candidate key", "Partial key", "Foreign key"]}, {"id": "2-weak-3", "concept": "weak-entity", "type": "ox", "prompt": "부분 키만으로 약한 개체를 유일하게 식별할 수 있다.", "answer": false, "explain": "다른 사원에게도 같은 이름의 부양가족(Tom)이 있을 수 있다. 소유자의 키 + 부분 키로 식별.", "lesson": "L2-3", "unit": "U2", "prompt_en": "A weak entity can be uniquely identified by its partial key alone.", "explain_en": "Another employee may also have a dependent with the same name (Tom). It is identified by the owner's key + the partial key."}, {"id": "2-weak-4", "concept": "weak-entity", "type": "short", "prompt": "약한 개체 타입, 식별 관계, 부분 키를 DEPENDENT 예로 설명하시오.", "answer": "약한 개체 타입: 자기 키 속성이 없어 식별(소유) 개체 타입에 의존하는 개체 타입 (DEPENDENT는 EMPLOYEE에 의존). 식별 관계: 약한 개체와 소유 개체를 잇는 관계(DEPENDENTS_OF), 이중 마름모, 약한 개체는 항상 전체 참여. 부분 키: 같은 소유자에 딸린 약한 개체끼리 구별하는 속성(Dependent_name). 소유자 키(Ssn) + 부분 키로 식별.", "keys": ["약한 개체 = 자기 키 없음, 소유자에 의존", "식별 관계 = 소유자와 연결, 전체 참여", "부분 키 + 소유자 키로 식별"], "lesson": "L2-3", "unit": "U2", "prompt_en": "Explain weak entity type, identifying relationship and partial key using DEPENDENT as an example.", "answer_en": "Weak entity type: an entity type that has no key attributes of its own and depends on an identifying (owner) entity type (DEPENDENT depends on EMPLOYEE). Identifying relationship: the relationship that relates the weak entity type to its owner (DEPENDENTS_OF); drawn as a double diamond; the weak entity always has total participation in it. Partial key: the attribute that distinguishes weak entities related to the same owner (Dependent_name). Identified by the owner's key (Ssn) + the partial key.", "keys_en": ["Weak entity = no key of its own, depends on the owner", "Identifying relationship = links to the owner, total participation", "Identified by partial key + owner's key"]}, {"id": "2-weak-5", "concept": "weak-entity", "type": "blank", "prompt": "약한 개체는 (a) 관계를 통해 소유 개체와 연결되며, 이 관계에 항상 (b) 참여한다.", "answer": "(a) 식별 / (b) 전체", "accept": [["식별", "identifying"], ["전체", "total", "전체 참여", "total participation"]], "lesson": "L2-3", "unit": "U2", "prompt_en": "A weak entity is related to its owner entity through a(n) (a) relationship, and it always has (b) participation in this relationship.", "answer_en": "(a) identifying / (b) total"}, {"id": "2-weak-6", "concept": "weak-entity", "type": "mc", "prompt": "약한 개체 타입을 ER 다이어그램에 그리는 방법은?", "choices": ["점선 직사각형", "이중 직사각형 + 이중 마름모(식별 관계)", "타원", "이중 타원"], "answer": 1, "lesson": "L2-3", "unit": "U2", "prompt_en": "How is a weak entity type drawn in an ER diagram?", "choices_en": ["A dashed rectangle", "A double rectangle + a double diamond (identifying relationship)", "An oval", "A double oval"]}, {"id": "2-ref-1", "concept": "refine", "type": "mc", "prompt": "COMPANY 다듬기에서 PROJECT의 Controlling_department 속성은 어떤 관계 타입이 되나?", "choices": ["MANAGES", "WORKS_FOR", "CONTROLS", "WORKS_ON"], "answer": 2, "lesson": "L2-4", "unit": "U2", "prompt_en": "In refining the COMPANY design, which relationship type does PROJECT's Controlling_department attribute become?"}, {"id": "2-ref-2", "concept": "refine", "type": "mc", "prompt": "COMPANY의 WORKS_ON 관계에 대한 설명으로 옳은 것은?", "choices": ["1:N, 속성 없음", "1:1, StartDate", "M:N, 양쪽 부분 참여", "M:N, 양쪽 전체 참여, 속성 Hours"], "answer": 3, "lesson": "L2-4", "unit": "U2", "prompt_en": "Which statement about the WORKS_ON relationship in COMPANY is correct?", "choices_en": ["1:N, no attributes", "1:1, StartDate", "M:N, partial participation on both sides", "M:N, total participation on both sides, attribute Hours"]}, {"id": "2-ref-3", "concept": "refine", "type": "short", "prompt": "ER 스키마 설계 과정 3단계를 쓰시오.", "answer": "(1) 요구사항을 바탕으로 개체 타입과 속성을 기술한다. (2) 관계 타입과 그 제약조건(카디널리티 비, 참여 제약)을 지정한다. (3) 관계를 표현하던 속성을 관계 타입으로 바꾼다.", "keys": ["개체 타입·속성", "관계 타입·제약조건", "관계를 나타내던 속성 → 관계 타입"], "lesson": "L2-4", "unit": "U2", "prompt_en": "List the 3 steps of the ER schema design process.", "answer_en": "(1) Describe the entity types and their attributes based on the requirements. (2) Specify the relationship types and their constraints (cardinality ratio, participation constraint). (3) Change attributes that represent relationships into relationship types.", "keys_en": ["Entity types and attributes", "Relationship types and constraints", "Attributes that represent relationships → relationship types"]}, {"id": "2-ref-4", "concept": "refine", "type": "ox", "prompt": "MANAGES에서 EMPLOYEE는 부분 참여, DEPARTMENT는 전체 참여이다.", "answer": true, "lesson": "L2-4", "unit": "U2", "prompt_en": "In MANAGES, EMPLOYEE has partial participation and DEPARTMENT has total participation."}, {"id": "2-ref-5", "concept": "refine", "type": "calc", "prompt": "COMPANY 다듬은 설계의 관계 타입 6개를 쓰고, 각각의 카디널리티 비를 쓰시오.", "answer": "MANAGES 1:1 (EMPLOYEE–DEPARTMENT)\nWORKS_FOR 1:N (DEPARTMENT 1, EMPLOYEE N)\nCONTROLS 1:N (DEPARTMENT 1, PROJECT N)\nSUPERVISION 1:N (supervisor 1, supervisee N)\nWORKS_ON M:N (EMPLOYEE–PROJECT, 속성 Hours)\nDEPENDENTS_OF 1:N (EMPLOYEE 1, DEPENDENT N, 식별 관계)", "keys": ["MANAGES 1:1", "WORKS_FOR 1:N", "CONTROLS 1:N", "SUPERVISION 1:N", "WORKS_ON M:N", "DEPENDENTS_OF 1:N"], "slot": 10, "pts": 10, "lesson": "L2-4", "unit": "U2", "prompt_en": "List the six relationship types of the refined COMPANY design and the cardinality ratio of each.", "answer_en": "MANAGES 1:1 (EMPLOYEE–DEPARTMENT)\nWORKS_FOR 1:N (DEPARTMENT 1, EMPLOYEE N)\nCONTROLS 1:N (DEPARTMENT 1, PROJECT N)\nSUPERVISION 1:N (supervisor 1, supervisee N)\nWORKS_ON M:N (EMPLOYEE–PROJECT, attribute Hours)\nDEPENDENTS_OF 1:N (EMPLOYEE 1, DEPENDENT N, identifying relationship)"}, {"id": "2-ref-6", "concept": "refine", "type": "mc", "prompt": "DEPENDENTS_OF에서 EMPLOYEE와 DEPENDENT의 참여는?", "choices": ["둘 다 전체", "EMPLOYEE 부분, DEPENDENT 전체", "EMPLOYEE 전체, DEPENDENT 부분", "둘 다 부분"], "answer": 1, "explain": "사원은 부양가족이 없을 수 있고, 부양가족은 반드시 사원에 딸린다.", "lesson": "L2-4", "unit": "U2", "prompt_en": "What are the participations of EMPLOYEE and DEPENDENT in DEPENDENTS_OF?", "explain_en": "An employee may have no dependents, but a dependent must belong to an employee.", "choices_en": ["Both total", "EMPLOYEE partial, DEPENDENT total", "EMPLOYEE total, DEPENDENT partial", "Both partial"]}, {"id": "2-prac-1", "concept": "er-practice", "type": "mc", "prompt": "MOVIE DB에서 '각 영화는 제작사 하나가 만들고, 제작사는 영화 여러 편을 만든다'의 관계 PRODUCES는?", "choices": ["PRODUCTION 1 : MOVIE N, MOVIE 전체 참여", "M:N", "1:1", "MOVIE 1 : PRODUCTION N"], "answer": 0, "lesson": "L2-4", "unit": "U2", "prompt_en": "In the MOVIE DB, 'each movie is produced by one production company, and a production company produces many movies'. What is the PRODUCES relationship?", "choices_en": ["PRODUCTION 1 : MOVIE N, MOVIE total participation", "M:N", "1:1", "MOVIE 1 : PRODUCTION N"]}, {"id": "2-prac-2", "concept": "er-practice", "type": "mc", "prompt": "MOVIE DB의 ACTS 관계에서 Role과 {Quotes}는?", "choices": ["ACTOR의 속성", "MOVIE의 속성", "ACTS(M:N) 관계의 속성", "약한 개체"], "answer": 2, "explain": "배우가 그 영화에서 맡은 역할·대사는 배우–영화 조합으로 정해지므로 M:N 관계 속성.", "lesson": "L2-4", "unit": "U2", "prompt_en": "In the MOVIE DB's ACTS relationship, what are Role and {Quotes}?", "explain_en": "The role and quotes an actor has in a movie are determined by the actor–movie combination, so they are attributes of the M:N relationship.", "choices_en": ["Attributes of ACTOR", "Attributes of MOVIE", "Attributes of the ACTS (M:N) relationship", "Weak entities"]}, {"id": "2-prac-3", "concept": "er-practice", "type": "short", "prompt": "CONF_REVIEW DB에서 SUBMITS(AUTHOR–PAPER, M:N) 관계만으로는 어떤 요구사항을 표현할 수 없고, 어떻게 해결했는지 쓰시오.", "answer": "'논문마다 저자 중 한 명을 연락 저자(contact author)로 지정한다'는 요구. SUBMITS는 여러 저자를 연결할 뿐 그중 누가 연락 저자인지 못 나타낸다. 그래서 별도 관계 IS_CONTACT(AUTHOR (0,N) – PAPER (1,1))를 둔다. (또는 SUBMITS에 Is_contact 속성)", "keys": ["연락 저자 지정 요구", "IS_CONTACT 관계 추가, PAPER (1,1)"], "lesson": "L2-4", "unit": "U2", "prompt_en": "In the CONF_REVIEW DB, which requirement cannot be expressed by the SUBMITS (AUTHOR–PAPER, M:N) relationship alone, and how was it solved?", "answer_en": "The requirement 'for each paper, one of its authors is designated as the contact author'. SUBMITS only links multiple authors and cannot show which of them is the contact author. So a separate relationship IS_CONTACT (AUTHOR (0,N) – PAPER (1,1)) is added. (Alternatively, an Is_contact attribute on SUBMITS.)", "keys_en": ["Requirement to designate a contact author", "Add the IS_CONTACT relationship, PAPER (1,1)"]}, {"id": "2-prac-4", "concept": "er-practice", "type": "calc", "prompt": "다음 요구사항으로 REVIEWER–REVIEWS–PAPER 부분을 설계하시오. 개체 키, 관계의 (min, max), 관계 속성을 쓰시오.\n• 리뷰어는 e-mail로 식별, 리뷰를 최소 하나 해야 기록되고 여러 편을 리뷰할 수 있다.\n• 논문은 시스템이 준 id로 식별, 리뷰어가 최소 2명 최대 4명 배정된다.\n• 리뷰어는 배정된 논문마다 네 항목(기술성, 가독성, 독창성, 관련성)을 1~10점으로 평가하고, 종합 추천과, 위원회용·저자용 두 가지 코멘트를 남긴다.", "answer": "REVIEWER(키 R_email) —(1,N)— REVIEWS —(2,4)— PAPER(키 P_id)\nREVIEWS의 속성: Recommendation, Comments(For_committee, Feedback) 복합, Rating(C1 Technical_merit, C2 Readability, C3 Originality, C4 Relevance) 복합\n양쪽 모두 전체 참여(min ≥ 1).", "keys": ["REVIEWER 키 R_email, PAPER 키 P_id", "REVIEWER (1,N)", "PAPER (2,4)", "관계 속성: Recommendation, Comments 복합, Rating 복합"], "slot": 10, "pts": 10, "lesson": "L2-4", "unit": "U2", "prompt_en": "Design the REVIEWER–REVIEWS–PAPER part from the following requirements. Give the entity keys, the (min, max) of the relationship, and the relationship attributes.\n• A reviewer is identified by e-mail; a reviewer is recorded only after doing at least one review, and may review many papers.\n• A paper is identified by an id assigned by the system; at least 2 and at most 4 reviewers are assigned to it.\n• For each assigned paper, a reviewer rates four items (technical merit, readability, originality, relevance) on a 1–10 scale, gives an overall recommendation, and writes two kinds of comments: one for the committee and one for the authors.", "answer_en": "REVIEWER(key R_email) —(1,N)— REVIEWS —(2,4)— PAPER(key P_id)\nAttributes of REVIEWS: Recommendation, Comments(For_committee, Feedback) composite, Rating(C1 Technical_merit, C2 Readability, C3 Originality, C4 Relevance) composite\nTotal participation on both sides (min ≥ 1).", "keys_en": ["REVIEWER key R_email, PAPER key P_id", "REVIEWER (1,N)", "PAPER (2,4)", "Relationship attributes: Recommendation, composite Comments, composite Rating"]}, {"id": "2-prac-5", "concept": "er-practice", "type": "ox", "prompt": "MOVIE DB에서 MOVIE의 키는 (Title, Year)로 된 복합 키이다.", "answer": true, "lesson": "L2-4", "unit": "U2", "prompt_en": "In the MOVIE DB, the key of MOVIE is a composite key made of (Title, Year)."}, {"id": "2-prac-6", "concept": "er-practice", "type": "calc", "prompt": "다음 요구사항을 ER로 설계하시오 (개체, 키, 관계, 카디널리티, 참여).\n• 도서관 회원(MEMBER)은 회원 번호로 식별되고 이름이 있다.\n• 책(BOOK)은 ISBN으로 식별되고 제목, 저자(여러 명 가능)가 있다.\n• 회원은 책을 여러 권 빌릴 수 있고, 한 책은 여러 회원이 빌린 기록이 남는다. 대출마다 대출일과 반납일을 기록한다.\n• 책을 한 번도 안 빌린 회원도 있다.", "answer": "MEMBER(키 Member_no, Name) — BORROWS — BOOK(키 ISBN, Title, {Author} 다중값)\nBORROWS: M:N, 관계 속성 Borrow_date, Return_date\nMEMBER는 BORROWS에 부분 참여 (min 0), BOOK의 참여는 요구사항에 없으므로 부분으로 둠.", "keys": ["MEMBER 키 Member_no, BOOK 키 ISBN", "Author 다중값", "BORROWS M:N + 대출일·반납일은 관계 속성", "MEMBER 부분 참여"], "slot": 10, "pts": 10, "lesson": "L2-4", "unit": "U2", "prompt_en": "Design the following requirements as an ER schema (entities, keys, relationships, cardinality, participation).\n• A library member (MEMBER) is identified by a member number and has a name.\n• A book (BOOK) is identified by its ISBN and has a title and authors (possibly several).\n• A member can borrow many books, and a book keeps records of being borrowed by many members. For each loan, the borrow date and the return date are recorded.\n• Some members have never borrowed a book.", "answer_en": "MEMBER(key Member_no, Name) — BORROWS — BOOK(key ISBN, Title, {Author} multivalued)\nBORROWS: M:N, relationship attributes Borrow_date, Return_date\nMEMBER has partial participation in BORROWS (min 0); BOOK's participation is not stated in the requirements, so it is left partial.", "keys_en": ["MEMBER key Member_no, BOOK key ISBN", "Author is multivalued", "BORROWS M:N + borrow date and return date are relationship attributes", "MEMBER partial participation"]}, {"id": "3-rm-1", "concept": "rel-model", "type": "mc", "prompt": "관계 데이터 모델을 제안한 사람과 시기는?", "choices": ["Peter Chen, 1976", "Ted Codd (IBM), 1970", "Chamberlin & Boyce, 1974", "Elmasri, 1994"], "answer": 1, "lesson": "L3-1", "unit": "U3", "prompt_en": "Who proposed the relational data model, and when?"}, {"id": "3-rm-2", "concept": "rel-model", "type": "short", "prompt": "관계 데이터 모델의 장점 네 가지를 쓰시오.", "answer": "단순성(평평한 테이블 구조), 데이터 무결성(유효·일관·정확한 데이터 보장), 쉬운 데이터 조작(SQL 같은 고급 언어), 보안(인증, 권한, 암호화).", "keys": ["단순성", "데이터 무결성", "쉬운 데이터 조작 (SQL)", "보안"], "lesson": "L3-1", "unit": "U3", "prompt_en": "List the four advantages of the relational data model.", "answer_en": "Simplicity (flat table structure), data integrity (ensures valid, consistent and accurate data), ease of data manipulation (high-level languages such as SQL), security (authentication, authorization, encryption).", "keys_en": ["Simplicity", "Data integrity", "Ease of data manipulation (SQL)", "Security"]}, {"id": "3-rm-3", "concept": "rel-model", "type": "blank", "prompt": "관계 모델에서 릴레이션은 테이블, 투플은 (a), 속성은 (b) 에 해당한다.", "answer": "(a) 행 / (b) 열", "accept": [["행", "row", "레코드", "record"], ["열", "column", "열 헤더", "컬럼", "column header"]], "lesson": "L3-1", "unit": "U3", "prompt_en": "In the relational model, a relation corresponds to a table, a tuple to a (a) , and an attribute to a (b) .", "answer_en": "(a) row / (b) column"}, {"id": "3-dom-1", "concept": "domain-schema", "type": "mc", "prompt": "릴레이션 스키마의 '차수(degree)'는?", "choices": ["속성의 수", "투플의 수", "키의 수", "외래 키의 수"], "answer": 0, "lesson": "L3-1", "unit": "U3", "prompt_en": "What is the 'degree' of a relation schema?", "choices_en": ["The number of attributes", "The number of tuples", "The number of keys", "The number of foreign keys"]}, {"id": "3-dom-2", "concept": "domain-schema", "type": "mc", "prompt": "STUDENT(Name, Ssn, Home_phone, Address, Office_phone, Age, Gpa)에 투플이 5개 있다. 차수는?", "choices": ["5", "6", "7", "35"], "answer": 2, "lesson": "L3-1", "unit": "U3", "prompt_en": "STUDENT(Name, Ssn, Home_phone, Address, Office_phone, Age, Gpa) has 5 tuples. What is its degree?"}, {"id": "3-dom-3", "concept": "domain-schema", "type": "blank", "prompt": "도메인 = 데이터 (a) + (b) 이다. 예) Employee_ages: 15~80 사이의 정수.", "answer": "(a) 타입 / (b) 제약조건", "accept": [["타입", "type", "자료형", "데이터 타입", "data type"], ["제약조건", "제약", "constraint", "constraints"]], "lesson": "L3-1", "unit": "U3", "prompt_en": "Domain = data (a) + (b) . e.g., Employee_ages: integers between 15 and 80.", "answer_en": "(a) type / (b) constraints"}, {"id": "3-dom-4", "concept": "domain-schema", "type": "ox", "prompt": "투플은 n개 값의 순서 있는 리스트이며, 각 값은 해당 속성 도메인의 원소이거나 NULL이다.", "answer": true, "lesson": "L3-1", "unit": "U3", "prompt_en": "A tuple is an ordered list of n values, and each value is an element of the corresponding attribute's domain or NULL."}, {"id": "3-dom-5", "concept": "domain-schema", "type": "short", "prompt": "릴레이션 스키마와 릴레이션 인스턴스(상태)를 구별해서 설명하시오.", "answer": "릴레이션 스키마 R(A₁, …, Aₙ): 릴레이션 이름과 속성 리스트 (구조, 잘 안 바뀜). 릴레이션 인스턴스 r(R): 어느 시점의 n-투플들의 집합 {t₁, …, tₘ} (데이터, 갱신으로 계속 바뀜).", "keys": ["스키마 = 이름 + 속성 리스트", "인스턴스 = 투플의 집합 (시점에 따라 바뀜)"], "lesson": "L3-1", "unit": "U3", "prompt_en": "Explain the difference between a relation schema and a relation instance (state).", "answer_en": "Relation schema R(A₁, …, Aₙ): the relation name and a list of attributes (the structure; rarely changes). Relation instance r(R): the set of n-tuples {t₁, …, tₘ} at a given moment (the data; changes constantly with updates).", "keys_en": ["Schema = name + list of attributes", "Instance = a set of tuples (changes over time)"]}, {"id": "3-ch-1", "concept": "rel-chars", "type": "ox", "prompt": "관계 모델에서는 다중값 속성을 한 칸에 집합으로 저장할 수 있다.", "answer": false, "explain": "투플의 값은 원자 값이어야 한다. 다중값 속성은 별도 릴레이션으로.", "lesson": "L3-1", "unit": "U3", "prompt_en": "In the relational model, a multivalued attribute can be stored as a set in a single cell.", "explain_en": "Values in a tuple must be atomic. A multivalued attribute is represented by a separate relation."}, {"id": "3-ch-2", "concept": "rel-chars", "type": "mc", "prompt": "관계 모델에서 복합 속성 Address(Street, City, Zip)를 표현하는 방법은?", "choices": ["별도 릴레이션으로", "단순 구성 속성 Street, City, Zip으로", "문자열 하나로 합쳐서", "표현할 수 없다"], "answer": 1, "lesson": "L3-1", "unit": "U3", "prompt_en": "How is the composite attribute Address(Street, City, Zip) represented in the relational model?", "choices_en": ["As a separate relation", "By its simple component attributes Street, City, Zip", "Combined into a single string", "It cannot be represented"]}, {"id": "3-ch-3", "concept": "rel-chars", "type": "short", "prompt": "NULL 값이 쓰이는 경우를 쓰시오.", "answer": "속성 값을 모르거나(unknown), 얻을 수 없거나(unavailable), 그 투플에 적용되지 않는(undefined / not applicable) 경우.", "keys": ["모름 (unknown)", "얻을 수 없음 (unavailable)", "해당 없음 (not applicable)"], "lesson": "L3-1", "unit": "U3", "prompt_en": "When is a NULL value used?", "answer_en": "When the attribute value is unknown, unavailable, or does not apply to that tuple (undefined / not applicable).", "keys_en": ["Unknown", "Unavailable", "Not applicable"]}, {"id": "3-ch-4", "concept": "rel-chars", "type": "ox", "prompt": "릴레이션은 투플의 집합이므로 정의상 같은 투플이 두 번 나올 수 없다.", "answer": true, "lesson": "L3-1", "unit": "U3", "prompt_en": "A relation is a set of tuples, so by definition the same tuple cannot appear twice."}, {"id": "3-st-1", "concept": "db-schema-state", "type": "mc", "prompt": "관계 DB 스키마 S를 이루는 것은?", "choices": ["릴레이션 상태들의 집합", "투플들의 집합", "릴레이션 스키마들의 집합 + 무결성 제약조건 집합 IC", "카탈로그와 뷰"], "answer": 2, "lesson": "L3-1", "unit": "U3", "prompt_en": "What makes up a relational database schema S?", "choices_en": ["A set of relation states", "A set of tuples", "A set of relation schemas + a set of integrity constraints IC", "The catalog and views"]}, {"id": "3-st-2", "concept": "db-schema-state", "type": "ox", "prompt": "무결성 제약을 하나라도 어기는 DB 상태는 무효(invalid) 상태이다.", "answer": true, "lesson": "L3-1", "unit": "U3", "prompt_en": "A database state that violates even one integrity constraint is an invalid state."}, {"id": "3-st-3", "concept": "db-schema-state", "type": "mc", "prompt": "COMPANY 관계 DB 스키마 그림에서 화살표가 나타내는 것은?", "choices": ["기본 키", "참조 무결성 (FK → 참조되는 PK)", "함수 종속", "카디널리티 비"], "answer": 1, "lesson": "L3-1", "unit": "U3", "prompt_en": "In the COMPANY relational database schema diagram, what do the arrows represent?", "choices_en": ["Primary keys", "Referential integrity (FK → referenced PK)", "Functional dependencies", "Cardinality ratios"]}, {"id": "3-st-4", "concept": "db-schema-state", "type": "short", "prompt": "관계 DB 스키마와 관계 DB 상태를 정의하고, '유효한 상태'란 무엇인지 쓰시오.", "answer": "관계 DB 스키마: 릴레이션 스키마들의 집합 {R₁…Rₘ}과 무결성 제약조건 집합 IC. 관계 DB 상태: 각 Rᵢ의 상태 rᵢ들의 집합. 유효한 상태: IC에 있는 모든 무결성 제약조건을 만족하는 상태.", "keys": ["스키마 = 릴레이션 스키마 집합 + IC", "상태 = 릴레이션 상태들의 집합", "유효 = 모든 제약 만족"], "lesson": "L3-1", "unit": "U3", "prompt_en": "Define a relational database schema and a relational database state, and explain what a 'valid state' is.
