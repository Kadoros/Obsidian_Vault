<title>DB 중간 트레이너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: query notebook — faint ruled paper, teal accent, red-pen grading. Left course tree + right reading/quiz pane; stacks on phones. */
:root{
  --paper:#f2f5f5; --sheet:#ffffff; --ink:#152225; --muted:#56676b; --line:#d8e1e2;
  --rule:rgba(11,114,133,.06); --accent:#0b7285; --accent-weak:#e2f1f3; --accent-ink:#ffffff;
  --pen:#d1372b; --ok:#2b8a3e; --ok-weak:#e4f3e7; --warn:#a8670d; --warn-weak:#fbefd9; --bad:#c3352b; --bad-weak:#fbe6e4;
  --code-bg:#f0f4f4; --hl:#fff3bf;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-pen:"Nanum Pen Script","Apple SD Gothic Neo",cursive;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0d1416; --sheet:#141d20; --ink:#e3ecee; --muted:#93a6aa; --line:#24333a;
  --rule:rgba(102,205,222,.05); --accent:#5fc3d6; --accent-weak:#16303a; --accent-ink:#0d1416;
  --pen:#ff6d5f; --ok:#5cc278; --ok-weak:#15301d; --warn:#e2a84b; --warn-weak:#33270f; --bad:#ff6d5f; --bad-weak:#3a1a18;
  --code-bg:#10181b; --hl:#3a3410; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0d1416; --sheet:#141d20; --ink:#e3ecee; --muted:#93a6aa; --line:#24333a;
  --rule:rgba(102,205,222,.05); --accent:#5fc3d6; --accent-weak:#16303a; --accent-ink:#0d1416;
  --pen:#ff6d5f; --ok:#5cc278; --ok-weak:#15301d; --warn:#e2a84b; --warn-weak:#33270f; --bad:#ff6d5f; --bad-weak:#3a1a18;
  --code-bg:#10181b; --hl:#3a3410; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 28px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand .course{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{font-family:var(--f-mono);font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);color:var(--muted);white-space:nowrap}
.chip.dday{color:var(--pen);border-color:color-mix(in srgb,var(--pen) 40%,var(--line));font-weight:600}
.chip.live{color:var(--ok)} .chip.local{color:var(--warn)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font:inherit;font-size:14px;font-weight:500;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 12px 9px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.view{padding-top:20px}
h2{font-size:16px;margin:0 0 10px;font-weight:700;text-wrap:balance}
h3{font-size:15px;margin:0 0 8px;font-weight:700;text-wrap:balance}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .note{font-size:12.5px;color:var(--muted)} .err{font-size:13px;color:var(--bad)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
.btn{font:inherit;font-size:13.5px;font-weight:500;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.sm{font-size:12.5px;padding:4px 9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.st{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
.st.none{background:var(--line);color:var(--muted)} .st.weak{background:var(--bad-weak);color:var(--bad)}
.st.mid{background:var(--warn-weak);color:var(--warn)} .st.good{background:var(--ok-weak);color:var(--ok)}
.st.lock{background:none;color:var(--muted);border:1px dashed var(--line)}
.tag{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--accent-weak);color:var(--accent);font-weight:500}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
pre.code{margin:0;font-family:var(--f-mono);font-size:12.5px;line-height:1.55;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre}
code{font-family:var(--f-mono);font-size:.88em;background:var(--code-bg);border:1px solid var(--line);border-radius:4px;padding:0 4px}
select,input[type=text]{font:inherit;font-size:13.5px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);max-width:100%}
textarea{width:100%;min-height:150px;font-family:var(--f-mono);font-size:13px;line-height:1.55;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);resize:vertical}
/* learn layout */
.learn{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.learn{grid-template-columns:minmax(0,1fr)}}
.tree{position:sticky;top:118px;max-height:calc(100vh - 140px);overflow:auto;padding:10px 0}
@media (max-width:900px){.tree{position:static;max-height:none}}
.tree details{border-bottom:1px solid var(--line)} .tree details:last-child{border-bottom:0}
.tree summary{list-style:none;cursor:pointer;padding:9px 14px;display:flex;flex-direction:column;gap:4px}
.tree summary::-webkit-details-marker{display:none}
.tree .ut{font-size:13.5px;font-weight:600;line-height:1.35}
.ubar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}.ubar>b{display:block;height:100%;background:var(--accent)}
.lrow{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:6px 14px 6px 18px;border:0;background:none;color:inherit;font:inherit;font-size:13px;text-align:left;cursor:pointer;line-height:1.35}
.lrow:hover{background:var(--accent-weak)} .lrow.cur{background:var(--accent-weak);box-shadow:inset 3px 0 0 var(--accent)}
.lrow[disabled]{cursor:not-allowed;opacity:.55}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.dot.done{background:var(--ok);border-color:var(--ok)} .dot.weak{background:var(--bad-weak);border-color:var(--bad)} .dot.cur{border-color:var(--accent)}
.lnum{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
/* reader */
.reader{padding:22px 26px;min-width:0}
@media (max-width:600px){.reader{padding:16px}}
.rhead{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.rhead h2{font-size:21px;margin:0}
.body{max-width:72ch}
.sec{padding:14px 0 6px;border-bottom:1px dashed var(--line);scroll-margin-top:130px}
.sec:last-child{border-bottom:0}
.sec h3{font-size:16.5px;margin:0 0 10px;display:flex;gap:8px;align-items:baseline}
.sec h3::before{content:"§";font-family:var(--f-mono);color:var(--accent);font-weight:600}
.sec.review{background:linear-gradient(90deg,var(--hl),transparent 85%);margin-inline:-14px;padding-inline:14px;border-radius:8px}
.sec p,.sec ul,.sec ol{margin:0 0 10px} .sec ul,.sec ol{padding-left:20px} .sec li{margin:2px 0}
.sec .sub{font-size:14px;color:var(--muted)}
.sec pre.code{margin:4px 0 12px}
.tblw{overflow-x:auto;margin:4px 0 12px}
.tblw table{border-collapse:collapse;font-size:13.5px;min-width:100%}
.tblw th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:7px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.tblw td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.callout{font-size:14px;background:var(--accent-weak);border-radius:8px;padding:9px 12px;margin:4px 0 12px}
.callout.exam{background:var(--warn-weak)} .callout.exam::before{content:"시험 ";font-weight:700;color:var(--warn)}
.callout.trap{background:var(--bad-weak)}
.callout.prof{background:var(--sheet);border:1px solid var(--line);border-left:3px solid var(--accent)} .callout.prof b{color:var(--accent)} .callout.prof .src{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.rfoot{margin-top:20px;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-weak);border-radius:var(--r)}
.banner{position:sticky;top:112px;z-index:4;margin-bottom:14px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--warn-weak);border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-radius:var(--r);font-size:13.5px}
/* quiz */
.qwrap{padding:20px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:600px){.qwrap{padding:16px}}
.qtop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.pips{display:flex;gap:4px}.pips i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--accent)} .pips i.ok{background:var(--ok)} .pips i.no{background:var(--bad)}
.prompt{font-size:15.5px;white-space:pre-wrap;max-width:75ch}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{font:inherit;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);cursor:pointer;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
.choice:hover{border-color:var(--accent)} .choice.sel{border-color:var(--accent);background:var(--accent-weak)}
.choice.right{border-color:var(--ok);background:var(--ok-weak)} .choice.wrongc{border-color:var(--bad);background:var(--bad-weak)}
.choice .k{font-family:var(--f-mono);color:var(--muted)}
.ox{display:flex;gap:10px}.ox .choice{grid-template-columns:1fr;text-align:center;font-size:22px;font-weight:700;min-width:90px}
.blanks{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;align-items:center;max-width:520px}
.blanks label{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.result{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.mark{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pen{font-family:var(--f-pen);color:var(--pen);font-size:44px;line-height:1;transform:rotate(-4deg);display:inline-block;min-width:60px}
.pen small{font-size:26px}
.fb{font-size:14px;max-width:70ch}
.missed{margin:0;padding-left:18px;font-size:13.5px;color:var(--bad)}
.tip{font-size:13.5px;background:var(--warn-weak);border-radius:8px;padding:9px 12px;max-width:75ch;white-space:pre-wrap}
.tip b{color:var(--warn)}
.goto{font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sumrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sumrow:last-child{border-bottom:0}
.revcard{padding:14px 16px;display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--bad)}
/* home */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.stat{padding:12px 14px}.stat .v{font-family:var(--f-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}.stat .s{font-size:12px;color:var(--muted)}
.cta{padding:18px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:20px}
.cta .t{font-size:17px;font-weight:700}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ucard{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.ucard .ul{display:flex;flex-direction:column}
.ucard .li{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding:5px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font-family:inherit;text-align:left;cursor:pointer}
.ucard .li[disabled]{cursor:not-allowed;opacity:.55}
.weaklist{display:flex;flex-direction:column}
.wk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.wk:last-child{border-bottom:0}
/* practice etc */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.practice{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.practice{grid-template-columns:minmax(0,1fr)}}
.qlist{max-height:calc(100vh - 220px);overflow:auto;position:sticky;top:118px}
@media (max-width:900px){.qlist{max-height:260px;position:static}}
.qrow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:8px 12px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.qrow:hover{background:var(--accent-weak)} .qrow.cur{background:var(--accent-weak);box-shadow:inset 3px 0 0 var(--accent)}
.qrow .t{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd{width:9px;height:9px;border-radius:50%;background:var(--line)}
.sd.good{background:var(--ok)} .sd.mid{background:var(--warn)} .sd.weak{background:var(--bad)}
.yr{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.mockhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;margin-bottom:14px;position:sticky;top:112px;z-index:3}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}.timer.low{color:var(--pen)}
.mockq{margin-bottom:12px}
.chart{width:100%;height:auto;display:block}
.hist{width:100%;border-collapse:collapse;font-size:13px}
.hist td,.hist th{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
.hist th{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:700px){.cols{grid-template-columns:minmax(0,1fr)}}
.cols pre{white-space:pre-wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
figure.slide{margin:6px 0 14px;display:flex;flex-direction:column;gap:6px}
figure.slide .zoom{padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:zoom-in;overflow:hidden;display:block;max-width:100%}
figure.slide img{display:block;width:100%;height:auto}
figure.slide figcaption{font-size:12.5px;color:var(--muted)}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(8,14,16,.86);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px;background:#fff}
.lightbox .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:14px;font:inherit;font-size:13px;color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 10px;cursor:pointer}
.tbl-wrap{overflow-x:auto}
table.topics{width:100%;border-collapse:collapse;font-size:13.5px}
table.topics th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:10px 10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.topics td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.topics tr.ugrp td{background:var(--code-bg);font-weight:600;font-size:12.5px;color:var(--muted)}
table.topics tr.dim td{opacity:.55}
.tname{font-weight:500}.tsub{font-size:11.5px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:70px}.bar>b{display:block;height:100%;background:var(--accent);border-radius:4px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.pts{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--warn-weak);color:var(--warn);white-space:nowrap}
.recs{display:flex;flex-direction:column}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;font:inherit;color:inherit;text-align:left;width:100%}
.rec:last-child{border-bottom:0}.rec:hover{background:var(--accent-weak)}
.rec .q{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.why{font-size:11.5px;color:var(--muted);white-space:nowrap}
.prev{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.prev.ok{background:var(--ok-weak);color:var(--ok)} .prev.no{background:var(--bad-weak);color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>DB 중간 트레이너</h1>
      <div class="chips" hidden>
        <span class="chip dday" id="dday">중간고사 10/23 (금)</span>
        <span class="chip" id="store">저장소 연결 중…</span>
        <span class="chip" id="grader">채점: 확인 중…</span>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-v="dash" aria-selected="false">대시보드</button>
      <button role="tab" data-v="learn" aria-selected="true">학습</button>
      <button role="tab" data-v="practice" aria-selected="false">문제 풀기</button>
      <button role="tab" data-v="mock" aria-selected="false">모의고사</button>
      <button role="tab" data-v="wrong" aria-selected="false">오답노트</button>
      <button role="tab" data-v="hist" aria-selected="false">기록</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-dash" hidden></section>
  <section class="view" id="v-learn"></section>
  <section class="view" id="v-practice" hidden></section>
  <section class="view" id="v-mock" hidden></section>
  <section class="view" id="v-wrong" hidden></section>

<script id="db-data" type="application/json">{"units": [{"id": "U1", "title": "DB 시스템 개념 · 아키텍처", "src": "1_course_intro.pdf + 2_intro-ER.pdf p.3–10", "intro": "DB·DBMS·DB 시스템의 차이, DB 시스템의 4가지 특징, 3단계 스키마와 데이터 독립성. 정의 한 줄짜리 서술형으로 나오기 좋은 파트라 영어 키워드를 같이 외워.", "lessons": [{"id": "L1-1", "title": "DB · DBMS · DB 시스템", "src": "1_course_intro p.15–18, 24", "secs": [{"id": "db-def", "title": "DB, DBMS, DB 시스템"}, {"id": "why-dbms", "title": "왜 DBMS를 쓰나"}, {"id": "when-not", "title": "DBMS를 쓰지 않는 게 나을 때"}], "md": "## DB, DBMS, DB 시스템 {#db-def}\n\n| 용어 | 정의 |\n|---|---|\n| **Database (DB)** | 논리적으로 일관된(logically coherent), 서로 관련된 데이터의 모음. DBMS가 관리한다 |\n| **DBMS** | 데이터를 구조화된 방식으로 효율적으로 \"관리\"하는 소프트웨어. DB를 **정의(defining), 구축(constructing), 조작(manipulating), 공유(sharing)** 한다. 예) IBM DB2, Oracle, MS SQL Server, MySQL, SQLite |\n| **Database System** | **DB + DBMS 소프트웨어** |\n\n> 시험 포인트: DBMS의 기능 4가지 동사(define, construct, manipulate, share)와 \"DB 시스템 = DB + DBMS\"를 짝으로.\n\n## 왜 DBMS를 쓰나 {#why-dbms}\n\n교안 예: 메시지 앱 데이터(친구 정보, 메시지)를 **텍스트 파일**에 한 줄씩, 쉼표로 속성을 나눠 저장하면 생기는 문제 세 묶음.\n\n- **데이터 무결성 (Data Integrity)**: 메시지 길이 제한을 어떻게 지키나? 친구 정보를 실수로 중복 입력하면? 이름이 같은 친구는?\n- **데이터 관리 (Data Management)**: 특정 메시지를 빨리 찾으려면? 여러 사용자가 동시에 읽고 쓰면?\n- **데이터 지속성 (Data Durability)**: 앱이 쓰는 도중에 기계가 죽으면? 크래시 후 복구는?\n\n→ 이런 기술 문제를 매번 직접 풀 수 없으니 DBMS를 쓴다. 응용 예: 전자상거래, 은행, SNS, 대학/도서관, 항공·철도 예약.\n\n## DBMS를 쓰지 않는 게 나을 때 {#when-not}\n\n**DBMS의 오버헤드**\n- 하드웨어·소프트웨어·교육에 드는 **높은 초기 투자**\n- 데이터를 정의·처리하는 **범용성(generality)** 자체의 비용\n- 보안, 동시성 제어, 회복, 무결성 기능의 부담 → \"너무 무겁다\"\n\n**맞춤형(customized) DB가 나은 경우**\n- 단순하고 잘 정의되어 **절대 바뀌지 않을** 응용 (추가·삭제·갱신이 없음)\n- DBMS로는 맞출 수 없는 **엄격한 실시간 요구**\n- 저장 용량이 제한된 **임베디드 시스템**\n- **다중 사용자 접근이 없음**", "html": "<section class=\"sec\" id=\"s-db-def\"><h3>DB, DBMS, DB 시스템<\/h3><div class=\"tblw\"><table><thead><tr><th>용어<\/th><th>정의<\/th><\/tr><\/thead><tbody><tr><td><b>Database (DB)<\/b><\/td><td>논리적으로 일관된(logically coherent), 서로 관련된 데이터의 모음. DBMS가 관리한다<\/td><\/tr><tr><td><b>DBMS<\/b><\/td><td>데이터를 구조화된 방식으로 효율적으로 \"관리\"하는 소프트웨어. DB를 <b>정의(defining), 구축(constructing), 조작(manipulating), 공유(sharing)<\/b> 한다. 예) IBM DB2, Oracle, MS SQL Server, MySQL, SQLite<\/td><\/tr><tr><td><b>Database System<\/b><\/td><td><b>DB + DBMS 소프트웨어<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout exam\">시험 포인트: DBMS의 기능 4가지 동사(define, construct, manipulate, share)와 \"DB 시스템 = DB + DBMS\"를 짝으로.<\/div><\/section>\n<section class=\"sec\" id=\"s-why-dbms\"><h3>왜 DBMS를 쓰나<\/h3><p>교안 예: 메시지 앱 데이터(친구 정보, 메시지)를 <b>텍스트 파일<\/b>에 한 줄씩, 쉼표로 속성을 나눠 저장하면 생기는 문제 세 묶음.<\/p>\n<ul><li><b>데이터 무결성 (Data Integrity)<\/b>: 메시지 길이 제한을 어떻게 지키나? 친구 정보를 실수로 중복 입력하면? 이름이 같은 친구는?<\/li><li><b>데이터 관리 (Data Management)<\/b>: 특정 메시지를 빨리 찾으려면? 여러 사용자가 동시에 읽고 쓰면?<\/li><li><b>데이터 지속성 (Data Durability)<\/b>: 앱이 쓰는 도중에 기계가 죽으면? 크래시 후 복구는?<\/li><\/ul>\n<p>→ 이런 기술 문제를 매번 직접 풀 수 없으니 DBMS를 쓴다. 응용 예: 전자상거래, 은행, SNS, 대학/도서관, 항공·철도 예약.<\/p><\/section>\n<section class=\"sec\" id=\"s-when-not\"><h3>DBMS를 쓰지 않는 게 나을 때<\/h3><p><b>DBMS의 오버헤드<\/b><\/p>\n<ul><li>하드웨어·소프트웨어·교육에 드는 <b>높은 초기 투자<\/b><\/li><li>데이터를 정의·처리하는 <b>범용성(generality)<\/b> 자체의 비용<\/li><li>보안, 동시성 제어, 회복, 무결성 기능의 부담 → \"너무 무겁다\"<\/li><\/ul>\n<p><b>맞춤형(customized) DB가 나은 경우<\/b><\/p>\n<ul><li>단순하고 잘 정의되어 <b>절대 바뀌지 않을<\/b> 응용 (추가·삭제·갱신이 없음)<\/li><li>DBMS로는 맞출 수 없는 <b>엄격한 실시간 요구<\/b><\/li><li>저장 용량이 제한된 <b>임베디드 시스템<\/b><\/li><li><b>다중 사용자 접근이 없음<\/b><\/li><\/ul><\/section>"}, {"id": "L1-2", "title": "DB 시스템의 4가지 특징", "src": "1_course_intro p.19–25", "secs": [{"id": "self-desc", "title": "1) 자기 기술성 (Self-Describing Nature)"}, {"id": "abstraction", "title": "2) 데이터 추상화 (Data Abstraction)"}, {"id": "multi-views", "title": "3) 다중 뷰 지원 (Support of Multiple Views)"}, {"id": "sharing", "title": "4) 데이터 공유와 다중 사용자 트랜잭션 처리"}], "md": "## 1) 자기 기술성 (Self-Describing Nature) {#self-desc}\n\nDB 시스템은 DB 자체뿐 아니라 **메타데이터**도 담고 있다.\n- **메타데이터**: DB 구조와 제약조건의 정의\n- 메타데이터는 **DBMS 카탈로그(catalog)** 에 저장된다. DB를 유지하는 데 꼭 필요하다\n- 정의하는 방법 = SQL DDL (4–5주차)\n\n> 함정: 메타데이터가 저장되는 곳은 \"카탈로그\". 파일 시스템은 데이터 구조 정의가 응용 프로그램 안에 박혀 있다.\n\n## 2) 데이터 추상화 (Data Abstraction) {#abstraction}\n\n**프로그램과 데이터 사이의 절연 (insulation between programs and data)**\n- DB 시스템은 데이터의 **개념적 표현(논리 수준)** 을 제공한다: 객체, 속성, 상호 관계\n- 복잡한 **물리 수준** 구조(저장 방식, 연산 구현)는 드러내지 않는다\n- 데이터 구조가 바뀌어도 프로그램은 영향을 받지 않는다 → **프로그램-데이터 독립성 (program-data independence)**\n\n## 3) 다중 뷰 지원 (Support of Multiple Views) {#multi-views}\n\n사용자마다 필요한 데이터 관점이 다르다.\n- **뷰 (view)**: DB에서 파생됐지만 **명시적으로 저장되지 않은 가상 데이터**\n- 사용자는 그 데이터가 저장된 것인지 파생된 것인지 몰라도 된다\n- 예) 대학 DB에서 뷰 1 = 학생별 성적표 출력, 뷰 2 = 과목별 선수과목 확인\n\n## 4) 데이터 공유와 다중 사용자 트랜잭션 처리 {#sharing}\n\n- 여러 사용자가 **동시에** DB에 접근. 여러 앱의 데이터를 하나의 DB에 통합해 관리\n- 예) 좌석이 하나 남은 항공편에 예약 담당자 여러 명이 동시에 배정하려는 상황\n- **동시성 제어 (concurrency control)** 가 필요\n- **트랜잭션 (transaction)**: 하나의 논리적 기능을 수행하는 연산들의 모음\n- 트랜잭션은 **ACID** 를 만족해야 한다: **A**tomicity(원자성), **C**onsistency(일관성), **I**solation(고립성), **D**urability(지속성) → 14주차\n\n> 시험 포인트: 특징 4가지 이름을 영어로 정확히 + 각각 한 줄. \"self-describing / data abstraction / multiple views / sharing & multiuser transaction processing\".", "html": "<section class=\"sec\" id=\"s-self-desc\"><h3>1) 자기 기술성 (Self-Describing Nature)<\/h3><p>DB 시스템은 DB 자체뿐 아니라 <b>메타데이터<\/b>도 담고 있다.<\/p>\n<ul><li><b>메타데이터<\/b>: DB 구조와 제약조건의 정의<\/li><li>메타데이터는 <b>DBMS 카탈로그(catalog)<\/b> 에 저장된다. DB를 유지하는 데 꼭 필요하다<\/li><li>정의하는 방법 = SQL DDL (4–5주차)<\/li><\/ul>\n<div class=\"callout trap\">함정: 메타데이터가 저장되는 곳은 \"카탈로그\". 파일 시스템은 데이터 구조 정의가 응용 프로그램 안에 박혀 있다.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/INTRO-p20.jpg\" aria-label=\"크게 보기\"><img src=\"img/INTRO-p20.jpg\" alt=\"01 p.20 · DB 시스템 = 저장된 DB + 메타데이터(카탈로그). 카탈로그 예: RELATIONS, COLUMNS 테이블\" loading=\"lazy\"><\/button><figcaption>01 p.20 · DB 시스템 = 저장된 DB + 메타데이터(카탈로그). 카탈로그 예: RELATIONS, COLUMNS 테이블<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-abstraction\"><h3>2) 데이터 추상화 (Data Abstraction)<\/h3><p><b>프로그램과 데이터 사이의 절연 (insulation between programs and data)<\/b><\/p>\n<ul><li>DB 시스템은 데이터의 <b>개념적 표현(논리 수준)<\/b> 을 제공한다: 객체, 속성, 상호 관계<\/li><li>복잡한 <b>물리 수준<\/b> 구조(저장 방식, 연산 구현)는 드러내지 않는다<\/li><li>데이터 구조가 바뀌어도 프로그램은 영향을 받지 않는다 → <b>프로그램-데이터 독립성 (program-data independence)<\/b><\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-multi-views\"><h3>3) 다중 뷰 지원 (Support of Multiple Views)<\/h3><p>사용자마다 필요한 데이터 관점이 다르다.<\/p>\n<ul><li><b>뷰 (view)<\/b>: DB에서 파생됐지만 <b>명시적으로 저장되지 않은 가상 데이터<\/b><\/li><li>사용자는 그 데이터가 저장된 것인지 파생된 것인지 몰라도 된다<\/li><li>예) 대학 DB에서 뷰 1 = 학생별 성적표 출력, 뷰 2 = 과목별 선수과목 확인<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/INTRO-p22.jpg\" aria-label=\"크게 보기\"><img src=\"img/INTRO-p22.jpg\" alt=\"01 p.22 · 대학 DB의 두 뷰: 학생별 성적표(TRANSCRIPT), 과목별 선수과목(COURSE_PREREQUISITES)\" loading=\"lazy\"><\/button><figcaption>01 p.22 · 대학 DB의 두 뷰: 학생별 성적표(TRANSCRIPT), 과목별 선수과목(COURSE_PREREQUISITES)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-sharing\"><h3>4) 데이터 공유와 다중 사용자 트랜잭션 처리<\/h3><ul><li>여러 사용자가 <b>동시에<\/b> DB에 접근. 여러 앱의 데이터를 하나의 DB에 통합해 관리<\/li><li>예) 좌석이 하나 남은 항공편에 예약 담당자 여러 명이 동시에 배정하려는 상황<\/li><li><b>동시성 제어 (concurrency control)<\/b> 가 필요<\/li><li><b>트랜잭션 (transaction)<\/b>: 하나의 논리적 기능을 수행하는 연산들의 모음<\/li><li>트랜잭션은 <b>ACID<\/b> 를 만족해야 한다: <b>A<\/b>tomicity(원자성), <b>C<\/b>onsistency(일관성), <b>I<\/b>solation(고립성), <b>D<\/b>urability(지속성) → 14주차<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 특징 4가지 이름을 영어로 정확히 + 각각 한 줄. \"self-describing / data abstraction / multiple views / sharing &amp; multiuser transaction processing\".<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/INTRO-p23.jpg\" aria-label=\"크게 보기\"><img src=\"img/INTRO-p23.jpg\" alt=\"01 p.23 · 좌석 하나에 예약 담당자 셋 → 동시성 제어, 트랜잭션의 ACID\" loading=\"lazy\"><\/button><figcaption>01 p.23 · 좌석 하나에 예약 담당자 셋 → 동시성 제어, 트랜잭션의 ACID<\/figcaption><\/figure><\/section>"}, {"id": "L1-3", "title": "데이터 모델 · 3단계 스키마 · 데이터 독립성", "src": "2_intro-ER p.3–10", "secs": [{"id": "data-models", "title": "데이터 모델 3가지 범주"}, {"id": "three-schema", "title": "3단계 스키마 구조 (Three-Schema Architecture)"}, {"id": "schema-mapping", "title": "스키마 간 사상 (Mapping)"}, {"id": "data-indep", "title": "데이터 독립성 (Data Independence)"}], "md": "## 데이터 모델 3가지 범주 {#data-models}\n\n**데이터 모델**: DB 구조를 기술하는 개념들의 모음. 데이터 추상화를 위한 \"도구\" (데이터 타입, 관계, 제약조건, 검색·갱신 연산).\n- 추상화 = 데이터 이해에 필요한 본질은 강조하고, 데이터 조직·저장의 세부는 감추는 것\n\n| 범주 | 수준 | 내용 |\n|---|---|---|\n| **개념적 (conceptual)** | high-level | 사용자가 데이터를 인식하는 방식에 가까운 개념. 예) ER 모델 (EMPLOYEE, DEPARTMENT, PROJECT) |\n| **표현적 (representational)** | 중간 | DBMS가 데이터를 관리하는 방식. 물리 저장 세부는 숨기지만 컴퓨터에 바로 구현 가능. 예) 관계 데이터 모델 |\n| **물리적 (physical)** | low-level | 데이터가 컴퓨터에 저장되는 방식: 레코드 형식, 순서, 접근 경로. 일반 사용자가 아니라 전문가용 |\n\n## 3단계 스키마 구조 (Three-Schema Architecture) {#three-schema}\n\n**목표: 사용자 응용을 물리적 DB에서 분리** → 사용자 프로그램과 데이터의 독립.\n\n| 수준 | 스키마 | 기술하는 것 |\n|---|---|---|\n| **외부 (external)** | 외부 스키마 / 사용자 뷰 | 특정 사용자 그룹이 관심 있는 DB 구조의 일부 |\n| **개념 (conceptual)** | 개념 스키마 | 전체 DB의 논리 구조. **표현적 데이터 모델**로 기술. 엔티티, 데이터 타입, 관계, 연산, 제약조건. 물리 저장 구조는 숨김 |\n| **내부 (internal)** | 내부 스키마 | DB의 물리 저장 구조. **물리적 데이터 모델**로 기술. 저장·접근 경로의 세부 |\n\n> 함정: 실제 데이터는 **물리(내부) 수준에만** 저장된다. 외부·개념 스키마는 \"기술\"일 뿐.\n\n## 스키마 간 사상 (Mapping) {#schema-mapping}\n\n실제 데이터는 내부 수준에만 있으니, DBMS가 요청과 결과를 수준 사이에서 **변환**해야 한다.\n- 요청: 외부 스키마 → 개념 스키마 → 내부 스키마로 바꿔서 저장된 DB에서 처리\n- 결과: 저장된 DB에서 꺼낸 데이터를 사용자의 외부 뷰에 맞게 다시 형식화\n- **사상 정보도 카탈로그에 저장된다**\n\n## 데이터 독립성 (Data Independence) {#data-indep}\n\n**한 수준의 스키마를 바꿔도 바로 위 수준의 스키마를 바꿀 필요가 없는 능력.**\n\n| 종류 | 바꾸는 것 | 예 |\n|---|---|---|\n| **논리적 데이터 독립성** | **개념 스키마** | 새 데이터 추가, 데이터 제거 → 외부 스키마·응용 프로그램은 그대로 |\n| **물리적 데이터 독립성** | **내부 스키마** | 저장 구조 변경, 검색 속도를 위해 접근 경로(인덱스) 추가 → 개념 스키마 그대로 |\n\n→ 기존 응용 프로그램의 **유지보수 부담을 크게 줄인다**.\n\n> 시험 포인트: \"논리 = 개념 스키마 변경, 물리 = 내부 스키마 변경\"을 섞지 마. 물리적 독립성이 더 달성하기 쉽다 (인덱스 추가는 흔한 일).", "html": "<section class=\"sec\" id=\"s-data-models\"><h3>데이터 모델 3가지 범주<\/h3><p><b>데이터 모델<\/b>: DB 구조를 기술하는 개념들의 모음. 데이터 추상화를 위한 \"도구\" (데이터 타입, 관계, 제약조건, 검색·갱신 연산).<\/p>\n<ul><li>추상화 = 데이터 이해에 필요한 본질은 강조하고, 데이터 조직·저장의 세부는 감추는 것<\/li><\/ul>\n<div class=\"tblw\"><table><thead><tr><th>범주<\/th><th>수준<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td><b>개념적 (conceptual)<\/b><\/td><td>high-level<\/td><td>사용자가 데이터를 인식하는 방식에 가까운 개념. 예) ER 모델 (EMPLOYEE, DEPARTMENT, PROJECT)<\/td><\/tr><tr><td><b>표현적 (representational)<\/b><\/td><td>중간<\/td><td>DBMS가 데이터를 관리하는 방식. 물리 저장 세부는 숨기지만 컴퓨터에 바로 구현 가능. 예) 관계 데이터 모델<\/td><\/tr><tr><td><b>물리적 (physical)<\/b><\/td><td>low-level<\/td><td>데이터가 컴퓨터에 저장되는 방식: 레코드 형식, 순서, 접근 경로. 일반 사용자가 아니라 전문가용<\/td><\/tr><\/tbody><\/table><\/div><\/section>\n<section class=\"sec\" id=\"s-three-schema\"><h3>3단계 스키마 구조 (Three-Schema Architecture)<\/h3><p><b>목표: 사용자 응용을 물리적 DB에서 분리<\/b> → 사용자 프로그램과 데이터의 독립.<\/p>\n<div class=\"tblw\"><table><thead><tr><th>수준<\/th><th>스키마<\/th><th>기술하는 것<\/th><\/tr><\/thead><tbody><tr><td><b>외부 (external)<\/b><\/td><td>외부 스키마 / 사용자 뷰<\/td><td>특정 사용자 그룹이 관심 있는 DB 구조의 일부<\/td><\/tr><tr><td><b>개념 (conceptual)<\/b><\/td><td>개념 스키마<\/td><td>전체 DB의 논리 구조. <b>표현적 데이터 모델<\/b>로 기술. 엔티티, 데이터 타입, 관계, 연산, 제약조건. 물리 저장 구조는 숨김<\/td><\/tr><tr><td><b>내부 (internal)<\/b><\/td><td>내부 스키마<\/td><td>DB의 물리 저장 구조. <b>물리적 데이터 모델<\/b>로 기술. 저장·접근 경로의 세부<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout trap\">함정: 실제 데이터는 <b>물리(내부) 수준에만<\/b> 저장된다. 외부·개념 스키마는 \"기술\"일 뿐.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ER-p7.jpg\" aria-label=\"크게 보기\"><img src=\"img/ER-p7.jpg\" alt=\"02 p.7 · 3단계 스키마 구조 (외부·개념·내부 수준과 사상)\" loading=\"lazy\"><\/button><figcaption>02 p.7 · 3단계 스키마 구조 (외부·개념·내부 수준과 사상)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-schema-mapping\"><h3>스키마 간 사상 (Mapping)<\/h3><p>실제 데이터는 내부 수준에만 있으니, DBMS가 요청과 결과를 수준 사이에서 <b>변환<\/b>해야 한다.<\/p>\n<ul><li>요청: 외부 스키마 → 개념 스키마 → 내부 스키마로 바꿔서 저장된 DB에서 처리<\/li><li>결과: 저장된 DB에서 꺼낸 데이터를 사용자의 외부 뷰에 맞게 다시 형식화<\/li><li><b>사상 정보도 카탈로그에 저장된다<\/b><\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-data-indep\"><h3>데이터 독립성 (Data Independence)<\/h3><p><b>한 수준의 스키마를 바꿔도 바로 위 수준의 스키마를 바꿀 필요가 없는 능력.<\/b><\/p>\n<div class=\"tblw\"><table><thead><tr><th>종류<\/th><th>바꾸는 것<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td><b>논리적 데이터 독립성<\/b><\/td><td><b>개념 스키마<\/b><\/td><td>새 데이터 추가, 데이터 제거 → 외부 스키마·응용 프로그램은 그대로<\/td><\/tr><tr><td><b>물리적 데이터 독립성<\/b><\/td><td><b>내부 스키마<\/b><\/td><td>저장 구조 변경, 검색 속도를 위해 접근 경로(인덱스) 추가 → 개념 스키마 그대로<\/td><\/tr><\/tbody><\/table><\/div>\n<p>→ 기존 응용 프로그램의 <b>유지보수 부담을 크게 줄인다<\/b>.<\/p>\n<div class=\"callout exam\">시험 포인트: \"논리 = 개념 스키마 변경, 물리 = 내부 스키마 변경\"을 섞지 마. 물리적 독립성이 더 달성하기 쉽다 (인덱스 추가는 흔한 일).<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ER-p10.jpg\" aria-label=\"크게 보기\"><img src=\"img/ER-p10.jpg\" alt=\"02 p.10 · 논리적 데이터 독립성(개념 스키마 변경) vs 물리적 데이터 독립성(내부 스키마 변경)\" loading=\"lazy\"><\/button><figcaption>02 p.10 · 논리적 데이터 독립성(개념 스키마 변경) vs 물리적 데이터 독립성(내부 스키마 변경)<\/figcaption><\/figure><\/section>"}]}, {"id": "U2", "title": "ER 모델 (개념적 설계)", "src": "2_intro-ER.pdf p.11–47 + 2-2_ER_model-practices.pdf", "intro": "요구사항 → 개체·속성 → 관계와 제약조건 → 다듬기. 시험에서 요구사항 문장을 주고 ER 다이어그램이나 (min, max)를 쓰게 할 가능성이 크니, \"요구사항 문장 → 어떤 표기\"로 바꾸는 연습을 해.", "lessons": [{"id": "L2-1", "title": "설계 과정 · 개체와 속성", "src": "2_intro-ER p.12–21", "secs": [{"id": "design-process", "title": "DB 설계 과정"}, {"id": "entity-attr", "title": "개체와 속성"}, {"id": "attr-types", "title": "속성의 분류"}, {"id": "key-attr", "title": "키 속성"}, {"id": "er-notation", "title": "ER 다이어그램 표기법"}, {"id": "initial-design", "title": "초기 개념 설계: COMPANY"}], "md": "## DB 설계 과정 {#design-process}\n\n1. **요구사항 수집·분석 (Requirements Collection and Analysis)**: 예상 사용자의 데이터 요구를 파악. 결과물 = 사용자의 상세 요구사항\n2. **개념적 설계 (Conceptual Design)**: 데이터 모델을 고르고, 요구사항을 **개념 스키마**로 번역 (ER 모델)\n3. **구현 (Implementation)**: 개념 스키마로 DB를 구현\n   - **논리적 설계**: DB 스키마 (예: 관계 스키마, 3주차 ER→관계 매핑)\n   - **물리적 설계**: DB의 물리적 배치\n\nCOMPANY 요구사항: 회사는 **부서**(고유한 이름·번호, 여러 위치, 관리자와 관리 시작일)로 조직되고, 부서는 여러 **프로젝트**(고유한 이름·번호, 위치 하나)를 통제한다. **사원**은 이름·SSN·주소·급여·성별·생일·일하는 프로젝트가 있고, 보험 때문에 사원의 **부양가족**(이름, 성별, 생일, 관계)도 관리한다.\n\n## 개체와 속성 {#entity-attr}\n\n**ER (Entity-Relationship) 모델**: 데이터를 **개체(entity)와 관계(relationship)의 모음**으로 기술. ER 다이어그램으로 그린다.\n- **개체 (entity)**: 현실 세계에서 **독립적으로 존재**하고 다른 것과 구별되는 \"것\". 물리적 존재(사원)일 수도, 개념적 존재(회사)일 수도 있다\n- **속성 (attribute)**: 개체를 기술하는 특정 성질. 예) 사원: 이름, 주소, 나이, 집 전화\n- **관계 (relationship)**: 여러 개체 사이의 연관\n\n## 속성의 분류 {#attr-types}\n\n| 분류 | 짝 | 예 |\n|---|---|---|\n| ① 복합 vs 단순 | **복합 (composite)**: 더 작은 부분으로 나뉨 / **단순(원자, simple/atomic)**: 안 나뉨 | Address = (Street_address, City, State, Zip) / City, Zip |\n| ② 단일값 vs 다중값 | **단일값 (single-valued)**: 개체마다 값 하나 / **다중값 (multivalued)**: 값의 집합 | Age, SSN / Phone numbers, College degrees, 부서의 Locations |\n| ③ 저장 vs 유도 | **저장 (stored)**: DB에 실제 저장 / **유도 (derived)**: 다른 속성에서 계산 | Birth_date / Age (생일에서 유도) |\n\n> 함정: \"다중값\"과 \"복합\"을 섞지 마. 복합 = 한 값이 여러 부분으로 쪼개짐, 다중값 = 값이 여러 개. 둘 다일 수도 있다 (예: {Address_phone(Phone, Address)}).\n\n## 키 속성 {#key-attr}\n\n**키 속성 (key attribute)**: 개체마다 값이 **서로 다른** 속성 → 각 개체를 유일하게 식별.\n- 예) STUDENT의 학번, PERSON의 SSN\n- 여러 속성이 모여서 하나의 키가 될 수 있다 (예: CAR의 Registration = (Number, State) 복합 키)\n- 한 개체 타입이 키를 **둘 이상** 가질 수 있다 (예: CAR의 키 = Registration, Vehicle_id)\n- 다이어그램에서 **밑줄**로 표시\n\n## ER 다이어그램 표기법 {#er-notation}\n\n| 기호 | 의미 |\n|---|---|\n| 직사각형 | 개체 타입 |\n| **이중** 직사각형 | 약한 개체 타입 |\n| 마름모 | 관계 타입 |\n| **이중** 마름모 | 식별 관계 타입 |\n| 타원 | 속성 |\n| 밑줄 친 타원 | 키 속성 |\n| **이중** 타원 | 다중값 속성 |\n| 타원에 타원이 달림 | 복합 속성 |\n| **점선** 타원 | 유도 속성 |\n| E₁ — R **═** E₂ (이중선) | E₂가 R에 **전체 참여** |\n| E₁ ─1─ R ─N─ E₂ | 카디널리티 비 1:N |\n| R ─(min,max)─ E | E가 R에 참여하는 구조적 제약 |\n\n## 초기 개념 설계: COMPANY {#initial-design}\n\n- **DEPARTMENT**: Name, Number, {Locations}, Manager, Manager_start_date. Name과 Number가 각각 키 (둘 다 고유). Locations는 다중값\n- **PROJECT**: Name, Number, Location, Controlling_department. Name, Number가 키\n- **EMPLOYEE**: Name(Fname, Minit, Lname 복합), SSN(키), Address, Salary, Birth_date, Sex, Department, Supervisor, {Works_on(Project, Hours)}\n- **DEPENDENT**: Employee, Dependent_name, Sex, Birth_date, Relationship\n\n문제: Manager, Department, Supervisor, Works_on, Employee 같은 속성은 사실 **다른 개체를 참조**한다. 관계가 속성 형태로 **암묵적으로** 들어가 있음 → 이걸 명시적인 **관계 타입**으로 바꿔야 한다 (L2-4 다듬기).", "html": "<section class=\"sec\" id=\"s-design-process\"><h3>DB 설계 과정<\/h3><ol><li><b>요구사항 수집·분석 (Requirements Collection and Analysis)<\/b>: 예상 사용자의 데이터 요구를 파악. 결과물 = 사용자의 상세 요구사항<\/li><li><b>개념적 설계 (Conceptual Design)<\/b>: 데이터 모델을 고르고, 요구사항을 <b>개념 스키마<\/b>로 번역 (ER 모델)<\/li><li><b>구현 (Implementation)<\/b>: 개념 스키마로 DB를 구현<ul><li><b>논리적 설계<\/b>: DB 스키마 (예: 관계 스키마, 3주차 ER→관계 매핑)<\/li><li><b>물리적 설계<\/b>: DB의 물리적 배치<\/li><\/ul><\/li><\/ol>\n<p>COMPANY 요구사항: 회사는 <b>부서<\/b>(고유한 이름·번호, 여러 위치, 관리자와 관리 시작일)로 조직되고, 부서는 여러 <b>프로젝트<\/b>(고유한 이름·번호, 위치 하나)를 통제한다. <b>사원<\/b>은 이름·SSN·주소·급여·성별·생일·일하는 프로젝트가 있고, 보험 때문에 사원의 <b>부양가족<\/b>(이름, 성별, 생일, 관계)도 관리한다.<\/p><\/section>\n<section class=\"sec\" id=\"s-entity-attr\"><h3>개체와 속성<\/h3><p><b>ER (Entity-Relationship) 모델<\/b>: 데이터를 <b>개체(entity)와 관계(relationship)의 모음<\/b>으로 기술. ER 다이어그램으로 그린다.<\/p>\n<ul><li><b>개체 (entity)<\/b>: 현실 세계에서 <b>독립적으로 존재<\/b>하고 다른 것과 구별되는 \"것\". 물리적 존재(사원)일 수도, 개념적 존재(회사)일 수도 있다<\/li><li><b>속성 (attribute)<\/b>: 개체를 기술하는 특정 성질. 예) 사원: 이름, 주소, 나이, 집 전화<\/li><li><b>관계 (relationship)<\/b>: 여러 개체 사이의 연관<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-attr-types\"><h3>속성의 분류<\/h3><div class=\"tblw\"><table><thead><tr><th>분류<\/th><th>짝<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>① 복합 vs 단순<\/td><td><b>복합 (composite)<\/b>: 더 작은 부분으로 나뉨 / <b>단순(원자, simple/atomic)<\/b>: 안 나뉨<\/td><td>Address = (Street_address, City, State, Zip) / City, Zip<\/td><\/tr><tr><td>② 단일값 vs 다중값<\/td><td><b>단일값 (single-valued)<\/b>: 개체마다 값 하나 / <b>다중값 (multivalued)<\/b>: 값의 집합<\/td><td>Age, SSN / Phone numbers, College degrees, 부서의 Locations<\/td><\/tr><tr><td>③ 저장 vs 유도<\/td><td><b>저장 (stored)<\/b>: DB에 실제 저장 / <b>유도 (derived)<\/b>: 다른 속성에서 계산<\/td><td>Birth_date / Age (생일에서 유도)<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout trap\">함정: \"다중값\"과 \"복합\"을 섞지 마. 복합 = 한 값이 여러 부분으로 쪼개짐, 다중값 = 값이 여러 개. 둘 다일 수도 있다 (예: {Address_phone(Phone, Address)}).<\/div><\/section>\n<section class=\"sec\" id=\"s-key-attr\"><h3>키 속성<\/h3><p><b>키 속성 (key attribute)<\/b>: 개체마다 값이 <b>서로 다른<\/b> 속성 → 각 개체를 유일하게 식별.<\/p>\n<ul><li>예) STUDENT의 학번, PERSON의 SSN<\/li><li>여러 속성이 모여서 하나의 키가 될 수 있다 (예: CAR의 Registration = (Number, State) 복합 키)<\/li><li>한 개체 타입이 키를 <b>둘 이상<\/b> 가질 수 있다 (예: CAR의 키 = Registration, Vehicle_id)<\/li><li>다이어그램에서 <b>밑줄<\/b>로 표시<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ER-p17.jpg\" aria-label=\"크게 보기\"><img src=\"img/ER-p17.jpg\" alt=\"02 p.17 · CAR의 키 두 개: 복합 키 Registration(Number, State)과 Vehicle_id\" loading=\"lazy\"><\/button><figcaption>02 p.17 · CAR의 키 두 개: 복합 키 Registration(Number, State)과 Vehicle_id<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-er-notation\"><h3>ER 다이어그램 표기법<\/h3><div class=\"tblw\"><table><thead><tr><th>기호<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td>직사각형<\/td><td>개체 타입<\/td><\/tr><tr><td><b>이중<\/b> 직사각형<\/td><td>약한 개체 타입<\/td><\/tr><tr><td>마름모<\/td><td>관계 타입<\/td><\/tr><tr><td><b>이중<\/b> 마름모<\/td><td>식별 관계 타입<\/td><\/tr><tr><td>타원<\/td><td>속성<\/td><\/tr><tr><td>밑줄 친 타원<\/td><td>키 속성<\/td><\/tr><tr><td><b>이중<\/b> 타원<\/td><td>다중값 속성<\/td><\/tr><tr><td>타원에 타원이 달림<\/td><td>복합 속성<\/td><\/tr><tr><td><b>점선<\/b> 타원<\/td><td>유도 속성<\/td><\/tr><tr><td>E₁ — R <b>═<\/b> E₂ (이중선)<\/td><td>E₂가 R에 <b>전체 참여<\/b><\/td><\/tr><tr><td>E₁ ─1─ R ─N─ E₂<\/td><td>카디널리티 비 1:N<\/td><\/tr><tr><td>R ─(min,max)─ E<\/td><td>E가 R에 참여하는 구조적 제약<\/td><\/tr><\/tbody><\/table><\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ERP-p7.jpg\" aria-label=\"크게 보기\"><img src=\"img/ERP-p7.jpg\" alt=\"02-2 p.7 · ER 표기법 정리 (약한 개체, 식별 관계, 다중값·복합·유도 속성, 전체 참여, 1:N)\" loading=\"lazy\"><\/button><figcaption>02-2 p.7 · ER 표기법 정리 (약한 개체, 식별 관계, 다중값·복합·유도 속성, 전체 참여, 1:N)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-initial-design\"><h3>초기 개념 설계: COMPANY<\/h3><ul><li><b>DEPARTMENT<\/b>: Name, Number, {Locations}, Manager, Manager_start_date. Name과 Number가 각각 키 (둘 다 고유). Locations는 다중값<\/li><li><b>PROJECT<\/b>: Name, Number, Location, Controlling_department. Name, Number가 키<\/li><li><b>EMPLOYEE<\/b>: Name(Fname, Minit, Lname 복합), SSN(키), Address, Salary, Birth_date, Sex, Department, Supervisor, {Works_on(Project, Hours)}<\/li><li><b>DEPENDENT<\/b>: Employee, Dependent_name, Sex, Birth_date, Relationship<\/li><\/ul>\n<p>문제: Manager, Department, Supervisor, Works_on, Employee 같은 속성은 사실 <b>다른 개체를 참조<\/b>한다. 관계가 속성 형태로 <b>암묵적으로<\/b> 들어가 있음 → 이걸 명시적인 <b>관계 타입<\/b>으로 바꿔야 한다 (L2-4 다듬기).<\/p><\/section>"}, {"id": "L2-2", "title": "관계 타입 · 차수 · 역할 · 제약조건", "src": "2_intro-ER p.23–30, 36–37", "secs": [{"id": "rel-type", "title": "관계 타입, 차수, 역할 이름"}, {"id": "recursive", "title": "순환 관계 (Recursive Relationship)"}, {"id": "cardinality", "title": "제약조건 ① 카디널리티 비"}, {"id": "participation", "title": "제약조건 ② 참여 제약"}, {"id": "minmax", "title": "(min, max) 표기"}], "md": "## 관계 타입, 차수, 역할 이름 {#rel-type}\n\n**관계 타입**: 이름 + 참여하는 개체 타입들로 기술. 참여 개체들 사이의 연관 집합을 정의한다.\n- 예) WORKS_FOR: EMPLOYEE와 DEPARTMENT 사이. 각 사원을 그가 일하는 부서와 연관시킴\n- **차수 (degree)**: 참여하는 개체 타입의 수. 2진(binary), 3진(ternary)… 대부분은 2진\n  - 2진 예: rᵢ = (eⱼ, dₖ), 3진 예: SUPPLY의 rᵢ = (sⱼ, pₖ, jₗ) (SUPPLIER, PART, PROJECT)\n- **역할 이름 (role name)**: 참여 개체가 관계 인스턴스에서 맡는 역할. 관계의 의미를 이해하게 해줌. 예) WORKS_FOR에서 EMPLOYEE = worker, DEPARTMENT = employer\n\n## 순환 관계 (Recursive Relationship) {#recursive}\n\n**같은 개체 타입이 한 관계 타입에 두 번 이상 참여**하는 관계. 참여 개체를 구별하려면 **역할 이름이 필수**.\n- 예) SUPERVISION: EMPLOYEE가 supervisor 역할(선 '1')과 supervisee 역할(선 '2')로 참여\n- r₂ = (e₁, e₂): Kim이 Lee의 상사 / r₁ = (e₅, e₁): Kim은 Kang의 부하\n\n## 제약조건 ① 카디널리티 비 {#cardinality}\n\n**한 개체가 참여할 수 있는 관계 인스턴스의 최대 개수**. 2진 관계에서 1:1, 1:N, M:N.\n\n| 비 | 예 | 현실 제약 |\n|---|---|---|\n| **1:N** | WORKS_FOR (DEPARTMENT 1 : EMPLOYEE N) | 사원은 한 부서에서만 일하고, 부서는 사원을 몇 명이든 둘 수 있다 |\n| **1:1** | MANAGES (EMPLOYEE 1 : DEPARTMENT 1) | 사원은 최대 한 부서를 관리, 부서는 관리자가 최대 한 명 |\n| **M:N** | WORKS_ON (EMPLOYEE M : PROJECT N) | 사원은 프로젝트 여러 개, 프로젝트도 사원 여러 명 |\n\n> 함정: 1:N에서 **N쪽** 개체 하나는 1쪽 개체 **최대 하나**와 연결된다. \"사원 하나 → 부서 최대 하나\"니까 사원이 N쪽.\n\n## 제약조건 ② 참여 제약 {#participation}\n\n**개체의 존재가 다른 개체와의 관계에 의존하는지** 지정. 최소 참여 수와 관련.\n- **전체 참여 (total)**: **모든** 개체가 관계에 참여해야 함. 이중선. 예) 모든 사원은 어떤 부서에서 일해야 하므로 EMPLOYEE는 WORKS_FOR에 전체 참여 (= existence dependency)\n- **부분 참여 (partial)**: 모든 개체가 참여할 필요는 없음. 단일선. 예) 모든 사원이 부서를 관리하진 않으므로 EMPLOYEE는 MANAGES에 부분 참여\n\n## (min, max) 표기 {#minmax}\n\n각 참여에 **(min, max)** 를 붙여서 카디널리티와 참여를 함께 표시. 0 ≤ min ≤ max, max ≥ 1.\n- **min = 0 → 부분 참여, min ≥ 1 → 전체 참여**\n- max = 그 개체가 참여할 수 있는 관계 인스턴스 수의 최대\n- 예) MANAGES: EMPLOYEE (0,1), DEPARTMENT (1,1)\n\n> 함정: (min,max)는 **그 개체 쪽에 붙고, 그 개체 하나가** 관계에 몇 번 참여하는지를 뜻한다. 1:N 표기의 \"1\", \"N\"은 **반대편**에 붙는다 (DEPARTMENT ─1─ WORKS_FOR ─N─ EMPLOYEE). 그래서 WORKS_FOR는 (min,max)로 EMPLOYEE (1,1), DEPARTMENT (4,N)처럼 위치가 뒤집혀 보인다.\n\n교안 연습 1 (INSTRUCTOR–TEACHES–COURSE–USES–TEXT):\n- 강의는 교재를 쓸 수도 안 쓸 수도, 다섯 권 초과는 안 됨 → COURSE의 USES 참여 **(0, 5)**\n- 강의는 최소 1명, 최대 4명이 가르침 → COURSE의 TEACHES 참여 **(1, 4)**\n- 교재는 어떤 강의들에서 쓰임 → TEXT의 USES 참여 **(1, N)**\n- 강사는 2~4개 강의를 가르침 → INSTRUCTOR의 TEACHES 참여 **(2, 4)**", "html": "<section class=\"sec\" id=\"s-rel-type\"><h3>관계 타입, 차수, 역할 이름<\/h3><p><b>관계 타입<\/b>: 이름 + 참여하는 개체 타입들로 기술. 참여 개체들 사이의 연관 집합을 정의한다.<\/p>\n<ul><li>예) WORKS_FOR: EMPLOYEE와 DEPARTMENT 사이. 각 사원을 그가 일하는 부서와 연관시킴<\/li><li><b>차수 (degree)<\/b>: 참여하는 개체 타입의 수. 2진(binary), 3진(ternary)… 대부분은 2진<ul><li>2진 예: rᵢ = (eⱼ, dₖ), 3진 예: SUPPLY의 rᵢ = (sⱼ, pₖ, jₗ) (SUPPLIER, PART, PROJECT)<\/li><\/ul><\/li><li><b>역할 이름 (role name)<\/b>: 참여 개체가 관계 인스턴스에서 맡는 역할. 관계의 의미를 이해하게 해줌. 예) WORKS_FOR에서 EMPLOYEE = worker, DEPARTMENT = employer<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ER-p24.jpg\" aria-label=\"크게 보기\"><img src=\"img/ER-p24.jpg\" alt=\"02 p.24 · 2진 관계 WORKS_FOR (역할 worker/employer)와 3진 관계 SUPPLY\" loading=\"lazy\"><\/button><figcaption>02 p.24 · 2진 관계 WORKS_FOR (역할 worker/employer)와 3진 관계 SUPPLY<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-recursive\"><h3>순환 관계 (Recursive Relationship)<\/h3><p><b>같은 개체 타입이 한 관계 타입에 두 번 이상 참여<\/b>하는 관계. 참여 개체를 구별하려면 <b>역할 이름이 필수<\/b>.<\/p>\n<ul><li>예) SUPERVISION: EMPLOYEE가 supervisor 역할(선 '1')과 supervisee 역할(선 '2')로 참여<\/li><li>r₂ = (e₁, e₂): Kim이 Lee의 상사 / r₁ = (e₅, e₁): Kim은 Kang의 부하<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ER-p25.jpg\" aria-label=\"크게 보기\"><img src=\"img/ER-p25.jpg\" alt=\"02 p.25 · 순환 관계 SUPERVISION: 선 1 = supervisor, 선 2 = supervisee\" loading=\"lazy\"><\/button><figcaption>02 p.25 · 순환 관계 SUPERVISION: 선 1 = supervisor, 선 2 = supervisee<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-cardinality\"><h3>제약조건 ① 카디널리티 비<\/h3><p><b>한 개체가 참여할 수 있는 관계 인스턴스의 최대 개수<\/b>. 2진 관계에서 1:1, 1:N, M:N.<\/p>\n<div class=\"tblw\"><table><thead><tr><th>비<\/th><th>예<\/th><th>현실 제약<\/th><\/tr><\/thead><tbody><tr><td><b>1:N<\/b><\/td><td>WORKS_FOR (DEPARTMENT 1 : EMPLOYEE N)<\/td><td>사원은 한 부서에서만 일하고, 부서는 사원을 몇 명이든 둘 수 있다<\/td><\/tr><tr><td><b>1:1<\/b><\/td><td>MANAGES (EMPLOYEE 1 : DEPARTMENT 1)<\/td><td>사원은 최대 한 부서를 관리, 부서는 관리자가 최대 한 명<\/td><\/tr><tr><td><b>M:N<\/b><\/td><td>WORKS_ON (EMPLOYEE M : PROJECT N)<\/td><td>사원은 프로젝트 여러 개, 프로젝트도 사원 여러 명<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout trap\">함정: 1:N에서 <b>N쪽<\/b> 개체 하나는 1쪽 개체 <b>최대 하나<\/b>와 연결된다. \"사원 하나 → 부서 최대 하나\"니까 사원이 N쪽.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ER-p27.jpg\" aria-label=\"크게 보기\"><img src=\"img/ER-p27.jpg\" alt=\"02 p.27 · 1:N 관계 WORKS_FOR: N쪽 EMPLOYEE, 1쪽 DEPARTMENT\" loading=\"lazy\"><\/button><figcaption>02 p.27 · 1:N 관계 WORKS_FOR: N쪽 EMPLOYEE, 1쪽 DEPARTMENT<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-participation\"><h3>제약조건 ② 참여 제약<\/h3><p><b>개체의 존재가 다른 개체와의 관계에 의존하는지<\/b> 지정. 최소 참여 수와 관련.<\/p>\n<ul><li><b>전체 참여 (total)<\/b>: <b>모든<\/b> 개체가 관계에 참여해야 함. 이중선. 예) 모든 사원은 어떤 부서에서 일해야 하므로 EMPLOYEE는 WORKS_FOR에 전체 참여 (= existence dependency)<\/li><li><b>부분 참여 (partial)<\/b>: 모든 개체가 참여할 필요는 없음. 단일선. 예) 모든 사원이 부서를 관리하진 않으므로 EMPLOYEE는 MANAGES에 부분 참여<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ER-p30.jpg\" aria-label=\"크게 보기\"><img src=\"img/ER-p30.jpg\" alt=\"02 p.30 · EMPLOYEE는 WORKS_FOR에 전체 참여, MANAGES에 부분 참여\" loading=\"lazy\"><\/button><figcaption>02 p.30 · EMPLOYEE는 WORKS_FOR에 전체 참여, MANAGES에 부분 참여<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-minmax\"><h3>(min, max) 표기<\/h3><p>각 참여에 <b>(min, max)<\/b> 를 붙여서 카디널리티와 참여를 함께 표시. 0 ≤ min ≤ max, max ≥ 1.<\/p>\n<ul><li><b>min = 0 → 부분 참여, min ≥ 1 → 전체 참여<\/b><\/li><li>max = 그 개체가 참여할 수 있는 관계 인스턴스 수의 최대<\/li><li>예) MANAGES: EMPLOYEE (0,1), DEPARTMENT (1,1)<\/li><\/ul>\n<div class=\"callout trap\">함정: (min,max)는 <b>그 개체 쪽에 붙고, 그 개체 하나가<\/b> 관계에 몇 번 참여하는지를 뜻한다. 1:N 표기의 \"1\", \"N\"은 <b>반대편<\/b>에 붙는다 (DEPARTMENT ─1─ WORKS_FOR ─N─ EMPLOYEE). 그래서 WORKS_FOR는 (min,max)로 EMPLOYEE (1,1), DEPARTMENT (4,N)처럼 위치가 뒤집혀 보인다.<\/div>\n<p>교안 연습 1 (INSTRUCTOR–TEACHES–COURSE–USES–TEXT):<\/p>\n<ul><li>강의는 교재를 쓸 수도 안 쓸 수도, 다섯 권 초과는 안 됨 → COURSE의 USES 참여 <b>(0, 5)<\/b><\/li><li>강의는 최소 1명, 최대 4명이 가르침 → COURSE의 TEACHES 참여 <b>(1, 4)<\/b><\/li><li>교재는 어떤 강의들에서 쓰임 → TEXT의 USES 참여 <b>(1, N)<\/b><\/li><li>강사는 2~4개 강의를 가르침 → INSTRUCTOR의 TEACHES 참여 <b>(2, 4)<\/b><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ER-p36.jpg\" aria-label=\"크게 보기\"><img src=\"img/ER-p36.jpg\" alt=\"02 p.36 · 관계 표기와 (min,max): MANAGES에서 EMPLOYEE (0,1), DEPARTMENT (1,1)\" loading=\"lazy\"><\/button><figcaption>02 p.36 · 관계 표기와 (min,max): MANAGES에서 EMPLOYEE (0,1), DEPARTMENT (1,1)<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ER-p37.jpg\" aria-label=\"크게 보기\"><img src=\"img/ER-p37.jpg\" alt=\"02 p.37 · 연습 1: INSTRUCTOR–TEACHES–COURSE–USES–TEXT의 (min,max) 채우기\" loading=\"lazy\"><\/button><figcaption>02 p.37 · 연습 1: INSTRUCTOR–TEACHES–COURSE–USES–TEXT의 (min,max) 채우기<\/figcaption><\/figure><\/section>"}, {"id": "L2-3", "title": "관계 속성 · 약한 개체", "src": "2_intro-ER p.31–35", "secs": [{"id": "rel-attr", "title": "관계 타입의 속성"}, {"id": "weak-entity", "title": "약한 개체 타입"}], "md": "## 관계 타입의 속성 {#rel-attr}\n\n관계 타입도 속성을 가질 수 있다. 예) MANAGES의 StartDate, WORKS_ON의 Hours, WORKS_FOR의 StartDate.\n\n| 관계 | 속성을 옮길(migrate) 수 있는 곳 |\n|---|---|\n| **1:1** | **어느 쪽** 참여 개체로든 옮길 수 있음 (MANAGES.StartDate → DEPARTMENT 또는 EMPLOYEE) |\n| **1:N** | **N쪽 개체로만** 옮길 수 있음 (WORKS_FOR.StartDate → EMPLOYEE) |\n| **M:N** | **어느 개체로도 못 옮김**. 개체 조합에 의해서만 결정되기 때문 (WORKS_ON.Hours는 사원–프로젝트 조합으로 결정) |\n\n> 시험 포인트: \"1:N 관계의 속성은 왜 N쪽으로만?\" → N쪽 개체 하나는 관계 인스턴스에 최대 1번 참여하니까 값이 하나로 정해진다. 1쪽 개체는 여러 인스턴스에 참여하므로 값이 여러 개가 됨.\n\n## 약한 개체 타입 {#weak-entity}\n\n**약한 개체 타입 (weak entity type)**: 자기 자신의 **키 속성이 없는** 개체 타입. **식별(소유) 개체 타입**에 의존한다.\n- 약한 개체는 반드시 식별 개체와 연관되어야 함\n- **식별 관계 (identifying relationship)**: 약한 개체 타입과 소유자(owner) 개체 타입을 잇는 관계. 이중 마름모\n- 약한 개체 타입은 식별 관계에 **항상 전체 참여**\n- **부분 키 (partial key)**: 같은 소유자에 딸린 약한 개체들끼리 구별하는 속성. 점선 밑줄\n  - 예) DEPENDENT의 Dependent_name (같은 사원의 부양가족끼리는 이름이 안 겹친다고 가정)\n  - 부분 키만으로는 식별 못 함 (다른 사원의 부양가족 Tom이 또 있을 수 있음) → **소유자 키 + 부분 키**로 식별", "html": "<section class=\"sec\" id=\"s-rel-attr\"><h3>관계 타입의 속성<\/h3><p>관계 타입도 속성을 가질 수 있다. 예) MANAGES의 StartDate, WORKS_ON의 Hours, WORKS_FOR의 StartDate.<\/p>\n<div class=\"tblw\"><table><thead><tr><th>관계<\/th><th>속성을 옮길(migrate) 수 있는 곳<\/th><\/tr><\/thead><tbody><tr><td><b>1:1<\/b><\/td><td><b>어느 쪽<\/b> 참여 개체로든 옮길 수 있음 (MANAGES.StartDate → DEPARTMENT 또는 EMPLOYEE)<\/td><\/tr><tr><td><b>1:N<\/b><\/td><td><b>N쪽 개체로만<\/b> 옮길 수 있음 (WORKS_FOR.StartDate → EMPLOYEE)<\/td><\/tr><tr><td><b>M:N<\/b><\/td><td><b>어느 개체로도 못 옮김<\/b>. 개체 조합에 의해서만 결정되기 때문 (WORKS_ON.Hours는 사원–프로젝트 조합으로 결정)<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout exam\">시험 포인트: \"1:N 관계의 속성은 왜 N쪽으로만?\" → N쪽 개체 하나는 관계 인스턴스에 최대 1번 참여하니까 값이 하나로 정해진다. 1쪽 개체는 여러 인스턴스에 참여하므로 값이 여러 개가 됨.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ER-p33.jpg\" aria-label=\"크게 보기\"><img src=\"img/ER-p33.jpg\" alt=\"02 p.33 · M:N 관계 WORKS_ON의 Hours: 사원–프로젝트 조합으로만 정해짐\" loading=\"lazy\"><\/button><figcaption>02 p.33 · M:N 관계 WORKS_ON의 Hours: 사원–프로젝트 조합으로만 정해짐<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-weak-entity\"><h3>약한 개체 타입<\/h3><p><b>약한 개체 타입 (weak entity type)<\/b>: 자기 자신의 <b>키 속성이 없는<\/b> 개체 타입. <b>식별(소유) 개체 타입<\/b>에 의존한다.<\/p>\n<ul><li>약한 개체는 반드시 식별 개체와 연관되어야 함<\/li><li><b>식별 관계 (identifying relationship)<\/b>: 약한 개체 타입과 소유자(owner) 개체 타입을 잇는 관계. 이중 마름모<\/li><li>약한 개체 타입은 식별 관계에 <b>항상 전체 참여<\/b><\/li><li><b>부분 키 (partial key)<\/b>: 같은 소유자에 딸린 약한 개체들끼리 구별하는 속성. 점선 밑줄<ul><li>예) DEPENDENT의 Dependent_name (같은 사원의 부양가족끼리는 이름이 안 겹친다고 가정)<\/li><li>부분 키만으로는 식별 못 함 (다른 사원의 부양가족 Tom이 또 있을 수 있음) → <b>소유자 키 + 부분 키<\/b>로 식별<\/li><\/ul><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ER-p35.jpg\" aria-label=\"크게 보기\"><img src=\"img/ER-p35.jpg\" alt=\"02 p.35 · 약한 개체 DEPENDENT의 부분 키 Dependent_name (Tom이 두 사원에게 있음)\" loading=\"lazy\"><\/button><figcaption>02 p.35 · 약한 개체 DEPENDENT의 부분 키 Dependent_name (Tom이 두 사원에게 있음)<\/figcaption><\/figure><\/section>"}, {"id": "L2-4", "title": "COMPANY 설계 다듬기 · 실습 (MOVIE, CONF_REVIEW)", "src": "2_intro-ER p.38–47, 2-2 p.14–26", "secs": [{"id": "refine", "title": "COMPANY 설계 다듬기"}, {"id": "er-practice", "title": "실습: MOVIE / CONF_REVIEW"}], "md": "## COMPANY 설계 다듬기 {#refine}\n\n관계를 표현하던 속성을 **관계 타입으로** 바꾼다.\n\n| 관계 | 참여 | 카디널리티 | 참여 제약 | 속성 |\n|---|---|---|---|---|\n| **MANAGES** | EMPLOYEE, DEPARTMENT | 1:1 | EMPLOYEE 부분, DEPARTMENT 전체 | Start_date (Manager_start_date) |\n| **WORKS_FOR** | EMPLOYEE, DEPARTMENT | 1:N (DEPARTMENT 1, EMPLOYEE N) | 둘 다 전체 | 없음 |\n| **CONTROLS** | DEPARTMENT, PROJECT | 1:N (DEPARTMENT 1, PROJECT N) | PROJECT 전체, DEPARTMENT 부분 | 없음 |\n| **SUPERVISION** | EMPLOYEE (supervisor, supervisee) | 1:N (supervisor 1, supervisee N) | 둘 다 부분 | 없음 |\n| **WORKS_ON** | EMPLOYEE, PROJECT | M:N | 둘 다 전체 | Hours |\n| **DEPENDENTS_OF** | EMPLOYEE(식별), DEPENDENT(약한) | 1:N (EMPLOYEE 1) | EMPLOYEE 부분, DEPENDENT 전체 | 없음 (식별 관계) |\n\n옮겨진 것: DEPARTMENT의 Manager·Manager_start_date → MANAGES, PROJECT의 Controlling_department → CONTROLS, EMPLOYEE의 Department·Supervisor·Works_on → WORKS_FOR·SUPERVISION·WORKS_ON, DEPENDENT의 Employee → DEPENDENTS_OF.\n\n> 주의: 교안 p.42 SUPERVISION 설명은 1쪽/N쪽 역할이 뒤바뀌어 적혀 있어. 상사(supervisor) 한 명이 여러 부하(supervisee)를 두므로 **supervisor가 1쪽**이 맞고, 결과 다이어그램(p.45)의 (min,max)도 supervisor (0,N), supervisee (0,1)이야.\n\n**ER 스키마 설계 3단계 요약**: (1) 요구사항에서 개체 타입과 속성 기술 → (2) 관계 타입과 제약조건 지정 → (3) 관계를 표현하던 속성을 관계 타입으로 바꿈. 인스턴스가 아니라 **스키마**에 집중.\n\n## 실습: MOVIE / CONF_REVIEW {#er-practice}\n\n**MOVIE DB** (2-2 p.14–23)\n- MOVIE: 키 MKey(Title, Year) 복합, Length, Plot_outline, {Genre} 다중값\n- ACTOR, DIRECTOR: 키 (Name, Date_of_birth). PRODUCTION: 키 Name, Address\n- **PRODUCES** (PRODUCTION 1 : MOVIE N): 영화는 제작사 하나가 만든다. MOVIE 전체 참여\n- **ACTS** (ACTOR M : MOVIE N): 관계 속성 Role, {Quotes}(다중값). 양쪽 전체 참여\n- **DIRECTS** (DIRECTOR M : MOVIE N): MOVIE 전체 참여 (감독이 최소 1명)\n- **DIR_ACTS**: 감독도 영화에 출연할 수 있음 (Role, {Quotes})\n\n**CONF_REVIEW DB** (2-2 p.24–26, 풀이는 db-exercises)\n- AUTHOR(A_email 키, First_name, Last_name), PAPER(P_id 키, Title, Abstract, File_name), REVIEWER(R_email 키, 이름, Phone_no, Affiliation, {Interest_topic})\n- **SUBMITS** AUTHOR (1,N) – PAPER (1,M): 저자는 논문을 내야 기록되고, 논문은 여러 저자 가능 (M:N)\n- **IS_CONTACT** AUTHOR (0,N) – PAPER (1,1): 논문마다 연락 저자가 정확히 한 명. SUBMITS만으로는 이 요구를 못 나타내서 따로 둠\n- **REVIEWS** REVIEWER (1,N) – PAPER (2,4): 논문당 리뷰어 2~4명. 관계 속성 Recommendation, Comments(For_committee, Feedback) 복합, Rating(C1 Technical_merit, C2 Readability, C3 Originality, C4 Relevance) 복합\n\n> 시험 포인트: \"~마다 정확히 하나\" = (1,1), \"할 수도 안 할 수도\" = min 0, \"최소 a 최대 b\" = (a,b), \"여러 개\" = max N. 요구사항 문장에서 이 단어들을 찾아 표기로 옮기는 게 핵심.", "html": "<section class=\"sec\" id=\"s-refine\"><h3>COMPANY 설계 다듬기<\/h3><p>관계를 표현하던 속성을 <b>관계 타입으로<\/b> 바꾼다.<\/p>\n<div class=\"tblw\"><table><thead><tr><th>관계<\/th><th>참여<\/th><th>카디널리티<\/th><th>참여 제약<\/th><th>속성<\/th><\/tr><\/thead><tbody><tr><td><b>MANAGES<\/b><\/td><td>EMPLOYEE, DEPARTMENT<\/td><td>1:1<\/td><td>EMPLOYEE 부분, DEPARTMENT 전체<\/td><td>Start_date (Manager_start_date)<\/td><\/tr><tr><td><b>WORKS_FOR<\/b><\/td><td>EMPLOYEE, DEPARTMENT<\/td><td>1:N (DEPARTMENT 1, EMPLOYEE N)<\/td><td>둘 다 전체<\/td><td>없음<\/td><\/tr><tr><td><b>CONTROLS<\/b><\/td><td>DEPARTMENT, PROJECT<\/td><td>1:N (DEPARTMENT 1, PROJECT N)<\/td><td>PROJECT 전체, DEPARTMENT 부분<\/td><td>없음<\/td><\/tr><tr><td><b>SUPERVISION<\/b><\/td><td>EMPLOYEE (supervisor, supervisee)<\/td><td>1:N (supervisor 1, supervisee N)<\/td><td>둘 다 부분<\/td><td>없음<\/td><\/tr><tr><td><b>WORKS_ON<\/b><\/td><td>EMPLOYEE, PROJECT<\/td><td>M:N<\/td><td>둘 다 전체<\/td><td>Hours<\/td><\/tr><tr><td><b>DEPENDENTS_OF<\/b><\/td><td>EMPLOYEE(식별), DEPENDENT(약한)<\/td><td>1:N (EMPLOYEE 1)<\/td><td>EMPLOYEE 부분, DEPENDENT 전체<\/td><td>없음 (식별 관계)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>옮겨진 것: DEPARTMENT의 Manager·Manager_start_date → MANAGES, PROJECT의 Controlling_department → CONTROLS, EMPLOYEE의 Department·Supervisor·Works_on → WORKS_FOR·SUPERVISION·WORKS_ON, DEPENDENT의 Employee → DEPENDENTS_OF.<\/p>\n<div class=\"callout trap\">주의: 교안 p.42 SUPERVISION 설명은 1쪽/N쪽 역할이 뒤바뀌어 적혀 있어. 상사(supervisor) 한 명이 여러 부하(supervisee)를 두므로 <b>supervisor가 1쪽<\/b>이 맞고, 결과 다이어그램(p.45)의 (min,max)도 supervisor (0,N), supervisee (0,1)이야.<\/div>\n<p><b>ER 스키마 설계 3단계 요약<\/b>: (1) 요구사항에서 개체 타입과 속성 기술 → (2) 관계 타입과 제약조건 지정 → (3) 관계를 표현하던 속성을 관계 타입으로 바꿈. 인스턴스가 아니라 <b>스키마<\/b>에 집중.<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ER-p45.jpg\" aria-label=\"크게 보기\"><img src=\"img/ER-p45.jpg\" alt=\"02 p.45 · 다듬은 COMPANY ER 다이어그램 (관계 6개와 (min,max))\" loading=\"lazy\"><\/button><figcaption>02 p.45 · 다듬은 COMPANY ER 다이어그램 (관계 6개와 (min,max))<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-er-practice\"><h3>실습: MOVIE / CONF_REVIEW<\/h3><p><b>MOVIE DB<\/b> (2-2 p.14–23)<\/p>\n<ul><li>MOVIE: 키 MKey(Title, Year) 복합, Length, Plot_outline, {Genre} 다중값<\/li><li>ACTOR, DIRECTOR: 키 (Name, Date_of_birth). PRODUCTION: 키 Name, Address<\/li><li><b>PRODUCES<\/b> (PRODUCTION 1 : MOVIE N): 영화는 제작사 하나가 만든다. MOVIE 전체 참여<\/li><li><b>ACTS<\/b> (ACTOR M : MOVIE N): 관계 속성 Role, {Quotes}(다중값). 양쪽 전체 참여<\/li><li><b>DIRECTS<\/b> (DIRECTOR M : MOVIE N): MOVIE 전체 참여 (감독이 최소 1명)<\/li><li><b>DIR_ACTS<\/b>: 감독도 영화에 출연할 수 있음 (Role, {Quotes})<\/li><\/ul>\n<p><b>CONF_REVIEW DB<\/b> (2-2 p.24–26, 풀이는 db-exercises)<\/p>\n<ul><li>AUTHOR(A_email 키, First_name, Last_name), PAPER(P_id 키, Title, Abstract, File_name), REVIEWER(R_email 키, 이름, Phone_no, Affiliation, {Interest_topic})<\/li><li><b>SUBMITS<\/b> AUTHOR (1,N) – PAPER (1,M): 저자는 논문을 내야 기록되고, 논문은 여러 저자 가능 (M:N)<\/li><li><b>IS_CONTACT<\/b> AUTHOR (0,N) – PAPER (1,1): 논문마다 연락 저자가 정확히 한 명. SUBMITS만으로는 이 요구를 못 나타내서 따로 둠<\/li><li><b>REVIEWS<\/b> REVIEWER (1,N) – PAPER (2,4): 논문당 리뷰어 2~4명. 관계 속성 Recommendation, Comments(For_committee, Feedback) 복합, Rating(C1 Technical_merit, C2 Readability, C3 Originality, C4 Relevance) 복합<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: \"~마다 정확히 하나\" = (1,1), \"할 수도 안 할 수도\" = min 0, \"최소 a 최대 b\" = (a,b), \"여러 개\" = max N. 요구사항 문장에서 이 단어들을 찾아 표기로 옮기는 게 핵심.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ERP-p23.jpg\" aria-label=\"크게 보기\"><img src=\"img/ERP-p23.jpg\" alt=\"02-2 p.23 · MOVIE DB ER 다이어그램\" loading=\"lazy\"><\/button><figcaption>02-2 p.23 · MOVIE DB ER 다이어그램<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/EX-p9.jpg\" aria-label=\"크게 보기\"><img src=\"img/EX-p9.jpg\" alt=\"db-exercises p.36 · CONF_REVIEW DB ER 다이어그램 (SUBMITS, IS_CONTACT, REVIEWS)\" loading=\"lazy\"><\/button><figcaption>db-exercises p.36 · CONF_REVIEW DB ER 다이어그램 (SUBMITS, IS_CONTACT, REVIEWS)<\/figcaption><\/figure><\/section>"}]}, {"id": "U3", "title": "관계 데이터 모델 · ER→관계 매핑", "src": "3-1_RDB.pdf", "intro": "용어(릴레이션·투플·속성·도메인·차수), 키 계열(슈퍼키 ⊃ 키 = 후보 키 ∋ 기본 키), 무결성 제약 3가지, 삽입·삭제·갱신이 어떤 제약을 깨는지, 그리고 ER→관계 매핑. 매핑은 \"FK를 어디에 넣나\"만 정확하면 된다.", "lessons": [{"id": "L3-1", "title": "관계 모델 기본 개념", "src": "3-1 p.4–12", "secs": [{"id": "rel-model", "title": "관계 데이터 모델"}, {"id": "domain-schema", "title": "도메인 · 릴레이션 스키마 · 인스턴스"}, {"id": "rel-chars", "title": "릴레이션의 특성"}, {"id": "db-schema-state", "title": "관계 DB 스키마와 상태"}], "md": "## 관계 데이터 모델 {#rel-model}\n\n- 1970년 IBM의 **Ted Codd**가 제안\n- 데이터를 **릴레이션(relation, 테이블)** 으로 표현. 각 릴레이션은 **투플(tuple, 행)** 과 **속성(attribute, 열 헤더)** 으로 구성\n- 각 행 = 특정 개체에 대한 사실(관련된 데이터 값들의 모음), 속성 = 각 행의 값을 어떻게 해석할지 지정\n\n**장점 4가지**: **단순성** (평평한 테이블 구조), **데이터 무결성** (유효·일관·정확한 데이터 보장), **쉬운 데이터 조작** (SQL 같은 강력한 고급 언어로 복잡한 조건도 유연하게), **보안** (인증, 권한, 암호화)\n\n## 도메인 · 릴레이션 스키마 · 인스턴스 {#domain-schema}\n\n- **도메인 D**: 각 속성에 허용되는 **원자 값(atomic value)들의 집합**. 도메인 = 데이터 타입 + 제약조건\n  - 예) Usa_phone_numbers: (ddd)ddd-dddd 형식, Employee_ages: 15~80 사이 정수\n- **릴레이션 스키마 R(A₁, …, Aₙ)**: 릴레이션 이름 + 속성 리스트. 예) STUDENT(Name, Ssn, …, Gpa)\n- **차수 (degree)**: 릴레이션 스키마의 **속성 개수 n**. 예) STUDENT(Name, Ssn, Home_phone, Address, Office_phone, Age, Gpa)는 차수 7\n- **릴레이션 인스턴스(상태) r(R)**: n-투플들의 **집합** {t₁, …, tₘ}\n- **투플 t**: n개 값의 **순서 있는** 리스트 <v₁, …, vₙ>. 각 vᵢ는 dom(Aᵢ)의 원소이거나 특수값 **NULL**\n\n> 함정: 차수(degree) = 속성(열) 수. 투플(행) 수는 카디널리티(cardinality)라고 부른다. 섞지 마.\n\n## 릴레이션의 특성 {#rel-chars}\n\n- **투플의 값은 원자 값**이어야 함 (더 쪼개지지 않음)\n  - **복합 속성·다중값 속성은 허용 안 됨**\n  - 다중값 속성 → **별도 릴레이션**으로 표현\n  - 복합 속성 → **단순 구성 속성들**로만 표현\n- **NULL**: 값을 모르거나(unknown), 얻을 수 없거나(unavailable), 해당 투플에 적용되지 않는(undefined/not applicable) 경우\n- 릴레이션은 투플의 **집합**이므로 정의상 **투플끼리는 모두 달라야** 한다\n\n## 관계 DB 스키마와 상태 {#db-schema-state}\n\n- **관계 DB 스키마 S** = 릴레이션 스키마들의 집합 {R₁, …, Rₘ} + **무결성 제약조건 집합 IC**\n  - 예) COMPANY = {EMPLOYEE, DEPARTMENT, DEPT_LOCATIONS, PROJECT, WORKS_ON, DEPENDENT}\n  - 스키마 그림에서 **밑줄 = 기본 키**, **화살표 = 참조 무결성** (FK → 참조되는 PK)\n- **관계 DB 상태 DB** = 릴레이션 상태들의 집합 {r₁, …, rₘ}, rᵢ는 Rᵢ의 상태\n  - 모든 무결성 제약을 만족하면 **유효(valid) 상태**, 하나라도 어기면 **무효(invalid) 상태**", "html": "<section class=\"sec\" id=\"s-rel-model\"><h3>관계 데이터 모델<\/h3><ul><li>1970년 IBM의 <b>Ted Codd<\/b>가 제안<\/li><li>데이터를 <b>릴레이션(relation, 테이블)<\/b> 으로 표현. 각 릴레이션은 <b>투플(tuple, 행)<\/b> 과 <b>속성(attribute, 열 헤더)<\/b> 으로 구성<\/li><li>각 행 = 특정 개체에 대한 사실(관련된 데이터 값들의 모음), 속성 = 각 행의 값을 어떻게 해석할지 지정<\/li><\/ul>\n<p><b>장점 4가지<\/b>: <b>단순성<\/b> (평평한 테이블 구조), <b>데이터 무결성<\/b> (유효·일관·정확한 데이터 보장), <b>쉬운 데이터 조작<\/b> (SQL 같은 강력한 고급 언어로 복잡한 조건도 유연하게), <b>보안<\/b> (인증, 권한, 암호화)<\/p><\/section>\n<section class=\"sec\" id=\"s-domain-schema\"><h3>도메인 · 릴레이션 스키마 · 인스턴스<\/h3><ul><li><b>도메인 D<\/b>: 각 속성에 허용되는 <b>원자 값(atomic value)들의 집합<\/b>. 도메인 = 데이터 타입 + 제약조건<ul><li>예) Usa_phone_numbers: (ddd)ddd-dddd 형식, Employee_ages: 15~80 사이 정수<\/li><\/ul><\/li><li><b>릴레이션 스키마 R(A₁, …, Aₙ)<\/b>: 릴레이션 이름 + 속성 리스트. 예) STUDENT(Name, Ssn, …, Gpa)<\/li><li><b>차수 (degree)<\/b>: 릴레이션 스키마의 <b>속성 개수 n<\/b>. 예) STUDENT(Name, Ssn, Home_phone, Address, Office_phone, Age, Gpa)는 차수 7<\/li><li><b>릴레이션 인스턴스(상태) r(R)<\/b>: n-투플들의 <b>집합<\/b> {t₁, …, tₘ}<\/li><li><b>투플 t<\/b>: n개 값의 <b>순서 있는<\/b> 리스트 &lt;v₁, …, vₙ&gt;. 각 vᵢ는 dom(Aᵢ)의 원소이거나 특수값 <b>NULL<\/b><\/li><\/ul>\n<div class=\"callout trap\">함정: 차수(degree) = 속성(열) 수. 투플(행) 수는 카디널리티(cardinality)라고 부른다. 섞지 마.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p9.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p9.jpg\" alt=\"03 p.9 · 릴레이션 이름, 속성, 투플, 차수(7)\" loading=\"lazy\"><\/button><figcaption>03 p.9 · 릴레이션 이름, 속성, 투플, 차수(7)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-rel-chars\"><h3>릴레이션의 특성<\/h3><ul><li><b>투플의 값은 원자 값<\/b>이어야 함 (더 쪼개지지 않음)<ul><li><b>복합 속성·다중값 속성은 허용 안 됨<\/b><\/li><li>다중값 속성 → <b>별도 릴레이션<\/b>으로 표현<\/li><li>복합 속성 → <b>단순 구성 속성들<\/b>로만 표현<\/li><\/ul><\/li><li><b>NULL<\/b>: 값을 모르거나(unknown), 얻을 수 없거나(unavailable), 해당 투플에 적용되지 않는(undefined/not applicable) 경우<\/li><li>릴레이션은 투플의 <b>집합<\/b>이므로 정의상 <b>투플끼리는 모두 달라야<\/b> 한다<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-db-schema-state\"><h3>관계 DB 스키마와 상태<\/h3><ul><li><b>관계 DB 스키마 S<\/b> = 릴레이션 스키마들의 집합 {R₁, …, Rₘ} + <b>무결성 제약조건 집합 IC<\/b><ul><li>예) COMPANY = {EMPLOYEE, DEPARTMENT, DEPT_LOCATIONS, PROJECT, WORKS_ON, DEPENDENT}<\/li><li>스키마 그림에서 <b>밑줄 = 기본 키<\/b>, <b>화살표 = 참조 무결성<\/b> (FK → 참조되는 PK)<\/li><\/ul><\/li><li><b>관계 DB 상태 DB<\/b> = 릴레이션 상태들의 집합 {r₁, …, rₘ}, rᵢ는 Rᵢ의 상태<ul><li>모든 무결성 제약을 만족하면 <b>유효(valid) 상태<\/b>, 하나라도 어기면 <b>무효(invalid) 상태<\/b><\/li><\/ul><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p11.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p11.jpg\" alt=\"03 p.11 · COMPANY 관계 DB 스키마 (밑줄 = PK, 화살표 = 참조 무결성)\" loading=\"lazy\"><\/button><figcaption>03 p.11 · COMPANY 관계 DB 스키마 (밑줄 = PK, 화살표 = 참조 무결성)<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p12.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p12.jpg\" alt=\"03 p.12 · COMPANY DB 상태 (문제 풀이에 계속 쓰는 데이터)\" loading=\"lazy\"><\/button><figcaption>03 p.12 · COMPANY DB 상태 (문제 풀이에 계속 쓰는 데이터)<\/figcaption><\/figure><\/section>"}, {"id": "L3-2", "title": "키 · 무결성 제약조건", "src": "3-1 p.13–21", "secs": [{"id": "superkey-key", "title": "슈퍼키와 키"}, {"id": "candidate-pk", "title": "후보 키와 기본 키"}, {"id": "entity-integrity", "title": "개체 무결성 제약"}, {"id": "ref-integrity", "title": "참조 무결성 제약"}], "md": "## 슈퍼키와 키 {#superkey-key}\n\nDBMS는 제약조건을 정의하고 강제하는 기능을 제공해야 한다. 핵심 제약 3가지 = **키 제약, 개체 무결성, 참조 무결성**.\n\n**키 제약**: \"서로 다른 두 투플은 SK 속성들에 대해 같은 값을 가질 수 없다\" → 모든 상태 r에서 t₁[SK] ≠ t₂[SK].\n- **슈퍼키 (SK)**: 각 투플을 **유일하게 식별하는 속성 부분집합**. 모든 릴레이션은 최소 하나의 기본 슈퍼키(속성 전체)를 가진다\n- **키 (K)**: 슈퍼키이면서, 어떤 속성 A를 빼도 더 이상 슈퍼키가 아닌 것 = **최소(minimal) 슈퍼키**\n  - 최소성은 키에는 필수, 슈퍼키에는 선택\n  - 예) {Ssn, Home_phone}은 슈퍼키. Home_phone을 빼도 {Ssn}이 유일 → {Ssn, Home_phone}은 키가 아님, {Ssn}이 키\n\n> 함정: 키 ⊂ 슈퍼키. \"모든 키는 슈퍼키지만, 모든 슈퍼키가 키는 아니다\".\n\n## 후보 키와 기본 키 {#candidate-pk}\n\n- 릴레이션 스키마에 키가 여러 개면, 각각을 **후보 키 (candidate key)** 라고 부른다\n- 후보 키 중 하나를 **기본 키 (primary key)** 로 지정해 투플을 식별하는 데 쓴다. 스키마에서 **밑줄**\n- 예) CAR의 후보 키 = License_number, Engine_serial_number → License_number를 PK로 지정\n- 보통은 **속성 하나 또는 적은 수**로 된 키를 PK로 고르는 게 좋다\n\n## 개체 무결성 제약 {#entity-integrity}\n\n**\"기본 키 값은 NULL일 수 없다\"** → 모든 투플 t에 대해 t[PK] ≠ NULL.\n- 이유: PK가 NULL인 투플이 둘 이상이면, 다른 릴레이션에서 참조할 때 **서로 구별할 수 없다**\n- 예) Office_phone처럼 NULL이 있는 속성은 키가 될 수 없음\n- 복합 PK면 **PK의 어느 부분도** NULL이면 안 됨\n\n## 참조 무결성 제약 {#ref-integrity}\n\n**\"투플 t₁의 FK 값은 어떤 투플 t₂의 PK 값과 같거나, NULL이어야 한다\"**\n- **외래 키 (FK)**: 릴레이션 R₁의 속성 집합으로, R₂를 **참조**한다. t₁[FK] = t₂[PK]이면 t₁이 t₂를 참조\n- R₁의 FK는 R₂의 PK와 **같은 도메인**을 가진다\n- R₁ = **참조하는(referencing) 릴레이션**, R₂ = **참조되는(referenced) 릴레이션**\n- 예) EMPLOYEE.Dno → DEPARTMENT.Dnumber. 'John Smith'의 Dno=5 → 'Research' 부서 투플을 참조 = Smith는 Research에서 일함\n- 필요한 이유: 두 릴레이션 투플 사이의 **일관성** 유지. Dno=3인데 3번 부서가 없으면 그 값의 의미를 해석할 수 없다\n- FK는 **자기 자신의 릴레이션을 참조**할 수도 있다 (EMPLOYEE.Super_ssn → EMPLOYEE.Ssn)\n\n교안 연습 (FK 찾기):\n- SALESPERSON(Ssn, Name, Start_year, Dept_no), TRIP(Ssn, From_city, To_city, Departure_date, Return_date, Trip_id), EXPENSE(Trip_id, Account#, Amount)\n  → TRIP.Ssn → SALESPERSON, EXPENSE.Trip_id → TRIP\n- STUDENT(Ssn, …), COURSE(Course#, …), ENROLL(Ssn, Course#, Quarter, Grade), BOOK_ADOPTION(Course#, Quarter, Book_isbn), TEXT(Book_isbn, …)\n  → ENROLL.Ssn → STUDENT, ENROLL.Course# → COURSE, BOOK_ADOPTION.Course# → COURSE, BOOK_ADOPTION.Book_isbn → TEXT", "html": "<section class=\"sec\" id=\"s-superkey-key\"><h3>슈퍼키와 키<\/h3><p>DBMS는 제약조건을 정의하고 강제하는 기능을 제공해야 한다. 핵심 제약 3가지 = <b>키 제약, 개체 무결성, 참조 무결성<\/b>.<\/p>\n<p><b>키 제약<\/b>: \"서로 다른 두 투플은 SK 속성들에 대해 같은 값을 가질 수 없다\" → 모든 상태 r에서 t₁[SK] ≠ t₂[SK].<\/p>\n<ul><li><b>슈퍼키 (SK)<\/b>: 각 투플을 <b>유일하게 식별하는 속성 부분집합<\/b>. 모든 릴레이션은 최소 하나의 기본 슈퍼키(속성 전체)를 가진다<\/li><li><b>키 (K)<\/b>: 슈퍼키이면서, 어떤 속성 A를 빼도 더 이상 슈퍼키가 아닌 것 = <b>최소(minimal) 슈퍼키<\/b><ul><li>최소성은 키에는 필수, 슈퍼키에는 선택<\/li><li>예) {Ssn, Home_phone}은 슈퍼키. Home_phone을 빼도 {Ssn}이 유일 → {Ssn, Home_phone}은 키가 아님, {Ssn}이 키<\/li><\/ul><\/li><\/ul>\n<div class=\"callout trap\">함정: 키 ⊂ 슈퍼키. \"모든 키는 슈퍼키지만, 모든 슈퍼키가 키는 아니다\".<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p15.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p15.jpg\" alt=\"03 p.15 · 슈퍼키 {Ssn, Home_phone}에서 Home_phone을 빼면 키 {Ssn}\" loading=\"lazy\"><\/button><figcaption>03 p.15 · 슈퍼키 {Ssn, Home_phone}에서 Home_phone을 빼면 키 {Ssn}<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-candidate-pk\"><h3>후보 키와 기본 키<\/h3><ul><li>릴레이션 스키마에 키가 여러 개면, 각각을 <b>후보 키 (candidate key)<\/b> 라고 부른다<\/li><li>후보 키 중 하나를 <b>기본 키 (primary key)<\/b> 로 지정해 투플을 식별하는 데 쓴다. 스키마에서 <b>밑줄<\/b><\/li><li>예) CAR의 후보 키 = License_number, Engine_serial_number → License_number를 PK로 지정<\/li><li>보통은 <b>속성 하나 또는 적은 수<\/b>로 된 키를 PK로 고르는 게 좋다<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p16.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p16.jpg\" alt=\"03 p.16 · CAR의 후보 키 두 개 중 License_number를 PK로\" loading=\"lazy\"><\/button><figcaption>03 p.16 · CAR의 후보 키 두 개 중 License_number를 PK로<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-entity-integrity\"><h3>개체 무결성 제약<\/h3><p><b>\"기본 키 값은 NULL일 수 없다\"<\/b> → 모든 투플 t에 대해 t[PK] ≠ NULL.<\/p>\n<ul><li>이유: PK가 NULL인 투플이 둘 이상이면, 다른 릴레이션에서 참조할 때 <b>서로 구별할 수 없다<\/b><\/li><li>예) Office_phone처럼 NULL이 있는 속성은 키가 될 수 없음<\/li><li>복합 PK면 <b>PK의 어느 부분도<\/b> NULL이면 안 됨<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-ref-integrity\"><h3>참조 무결성 제약<\/h3><p><b>\"투플 t₁의 FK 값은 어떤 투플 t₂의 PK 값과 같거나, NULL이어야 한다\"<\/b><\/p>\n<ul><li><b>외래 키 (FK)<\/b>: 릴레이션 R₁의 속성 집합으로, R₂를 <b>참조<\/b>한다. t₁[FK] = t₂[PK]이면 t₁이 t₂를 참조<\/li><li>R₁의 FK는 R₂의 PK와 <b>같은 도메인<\/b>을 가진다<\/li><li>R₁ = <b>참조하는(referencing) 릴레이션<\/b>, R₂ = <b>참조되는(referenced) 릴레이션<\/b><\/li><li>예) EMPLOYEE.Dno → DEPARTMENT.Dnumber. 'John Smith'의 Dno=5 → 'Research' 부서 투플을 참조 = Smith는 Research에서 일함<\/li><li>필요한 이유: 두 릴레이션 투플 사이의 <b>일관성<\/b> 유지. Dno=3인데 3번 부서가 없으면 그 값의 의미를 해석할 수 없다<\/li><li>FK는 <b>자기 자신의 릴레이션을 참조<\/b>할 수도 있다 (EMPLOYEE.Super_ssn → EMPLOYEE.Ssn)<\/li><\/ul>\n<p>교안 연습 (FK 찾기):<\/p>\n<ul><li>SALESPERSON(Ssn, Name, Start_year, Dept_no), TRIP(Ssn, From_city, To_city, Departure_date, Return_date, Trip_id), EXPENSE(Trip_id, Account#, Amount)<div class=\"sub\">→ TRIP.Ssn → SALESPERSON, EXPENSE.Trip_id → TRIP<\/div><\/li><li>STUDENT(Ssn, …), COURSE(Course#, …), ENROLL(Ssn, Course#, Quarter, Grade), BOOK_ADOPTION(Course#, Quarter, Book_isbn), TEXT(Book_isbn, …)<div class=\"sub\">→ ENROLL.Ssn → STUDENT, ENROLL.Course# → COURSE, BOOK_ADOPTION.Course# → COURSE, BOOK_ADOPTION.Book_isbn → TEXT<\/div><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p18.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p18.jpg\" alt=\"03 p.18 · EMPLOYEE.Dno(FK) → DEPARTMENT.Dnumber(PK)\" loading=\"lazy\"><\/button><figcaption>03 p.18 · EMPLOYEE.Dno(FK) → DEPARTMENT.Dnumber(PK)<\/figcaption><\/figure><\/section>"}, {"id": "L3-3", "title": "갱신 연산과 제약 위반", "src": "3-1 p.23–30", "secs": [{"id": "op-insert", "title": "삽입 (Insert)"}, {"id": "op-delete", "title": "삭제 (Delete)"}, {"id": "op-update", "title": "수정 (Update)"}], "md": "## 삽입 (Insert) {#op-insert}\n\n연산 종류: **검색(retrieval)** 과 **갱신(update)**. 기본 갱신 연산 = Insert, Delete, Update(Modify). 적용할 때마다 제약이 깨질 수 있다.\n\n**Insert**: 릴레이션에 투플 하나 추가. 릴레이션 이름 + 값 리스트(속성 순서대로).\n\n**Insert는 세 가지 제약을 다 어길 수 있다.**\n\n| 위반 | 원인 | 교안 예 (COMPANY 상태) |\n|---|---|---|\n| **키 제약** | 새 투플의 키 값이 이미 다른 투플에 있음 | <'Alicia', …, **'999887777'**, …, 4> → Ssn 999887777은 이미 Zelaya |\n| **개체 무결성** | 새 투플의 PK(의 일부)가 NULL | <'Cecilia', …, **NULL**, …, 4> |\n| **참조 무결성** | FK가 참조하는 투플이 없음 | <'Cecilia', …, '677678989', …, **7**> → Dnumber=7인 부서 없음 |\n\n<'Cecilia', 'F', 'Kolonsky', '677678989', …, NULL, 4> 는 **모든 제약을 만족** (Super_ssn이 NULL인 건 FK니까 허용).\n\n## 삭제 (Delete) {#op-delete}\n\n**Delete**: 릴레이션 이름 + 지울 투플의 PK 값 지정.\n\n**Delete는 참조 무결성만 어길 수 있다** (지운 투플을 다른 투플이 참조하고 있을 때).\n- EMPLOYEE에서 Ssn='999887777' 삭제 → WORKS_ON 투플 2개가 참조 → **위반**\n- EMPLOYEE에서 Ssn='333445555' 삭제 → WORKS_ON 4개 + EMPLOYEE 2개(Super_ssn)가 참조 → **위반** (실제로는 DEPARTMENT.Mgr_ssn, DEPENDENT.Essn도 참조함)\n- WORKS_ON에서 Essn='999887777' AND Pno=10 삭제 → 아무도 참조 안 함 → 만족\n\n## 수정 (Update) {#op-update}\n\n**Update**: 바꿀 속성과 새 값 지정.\n\n**Update는 키 제약과 참조 무결성을 어길 수 있다. PK나 FK 속성을 바꿀 때만 문제가 된다.**\n- Ssn='999887777'인 사원의 Dno를 **7**로 → 7번 부서 없음 → **참조 무결성** 위반\n- Ssn='999887777'을 **'987654321'** 로 → 이미 Wallace의 Ssn(키 제약) + WORKS_ON 등에서 999887777을 참조하던 투플이 고아가 됨(참조 무결성) → **둘 다** 위반\n- PK를 NULL로 바꾸면 개체 무결성도 깨진다 (교안 요약엔 키·참조만 나옴)\n\n> 시험 포인트: 요약표 그대로 — Insert = 키·개체·참조 **전부 가능**, Delete = **참조만**, Update = **키·참조** (PK/FK를 바꿀 때만).", "html": "<section class=\"sec\" id=\"s-op-insert\"><h3>삽입 (Insert)<\/h3><p>연산 종류: <b>검색(retrieval)<\/b> 과 <b>갱신(update)<\/b>. 기본 갱신 연산 = Insert, Delete, Update(Modify). 적용할 때마다 제약이 깨질 수 있다.<\/p>\n<p><b>Insert<\/b>: 릴레이션에 투플 하나 추가. 릴레이션 이름 + 값 리스트(속성 순서대로).<\/p>\n<p><b>Insert는 세 가지 제약을 다 어길 수 있다.<\/b><\/p>\n<div class=\"tblw\"><table><thead><tr><th>위반<\/th><th>원인<\/th><th>교안 예 (COMPANY 상태)<\/th><\/tr><\/thead><tbody><tr><td><b>키 제약<\/b><\/td><td>새 투플의 키 값이 이미 다른 투플에 있음<\/td><td>&lt;'Alicia', …, <b>'999887777'<\/b>, …, 4&gt; → Ssn 999887777은 이미 Zelaya<\/td><\/tr><tr><td><b>개체 무결성<\/b><\/td><td>새 투플의 PK(의 일부)가 NULL<\/td><td>&lt;'Cecilia', …, <b>NULL<\/b>, …, 4&gt;<\/td><\/tr><tr><td><b>참조 무결성<\/b><\/td><td>FK가 참조하는 투플이 없음<\/td><td>&lt;'Cecilia', …, '677678989', …, <b>7<\/b>&gt; → Dnumber=7인 부서 없음<\/td><\/tr><\/tbody><\/table><\/div>\n<p>&lt;'Cecilia', 'F', 'Kolonsky', '677678989', …, NULL, 4&gt; 는 <b>모든 제약을 만족<\/b> (Super_ssn이 NULL인 건 FK니까 허용).<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p25.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p25.jpg\" alt=\"03 p.25 · Insert의 키 제약 위반, 개체 무결성 위반\" loading=\"lazy\"><\/button><figcaption>03 p.25 · Insert의 키 제약 위반, 개체 무결성 위반<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p26.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p26.jpg\" alt=\"03 p.26 · Insert의 참조 무결성 위반 (Dno=7)과 모든 제약을 만족하는 경우\" loading=\"lazy\"><\/button><figcaption>03 p.26 · Insert의 참조 무결성 위반 (Dno=7)과 모든 제약을 만족하는 경우<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-op-delete\"><h3>삭제 (Delete)<\/h3><p><b>Delete<\/b>: 릴레이션 이름 + 지울 투플의 PK 값 지정.<\/p>\n<p><b>Delete는 참조 무결성만 어길 수 있다<\/b> (지운 투플을 다른 투플이 참조하고 있을 때).<\/p>\n<ul><li>EMPLOYEE에서 Ssn='999887777' 삭제 → WORKS_ON 투플 2개가 참조 → <b>위반<\/b><\/li><li>EMPLOYEE에서 Ssn='333445555' 삭제 → WORKS_ON 4개 + EMPLOYEE 2개(Super_ssn)가 참조 → <b>위반<\/b> (실제로는 DEPARTMENT.Mgr_ssn, DEPENDENT.Essn도 참조함)<\/li><li>WORKS_ON에서 Essn='999887777' AND Pno=10 삭제 → 아무도 참조 안 함 → 만족<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p28.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p28.jpg\" alt=\"03 p.28 · Delete의 참조 무결성 위반\" loading=\"lazy\"><\/button><figcaption>03 p.28 · Delete의 참조 무결성 위반<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-op-update\"><h3>수정 (Update)<\/h3><p><b>Update<\/b>: 바꿀 속성과 새 값 지정.<\/p>\n<p><b>Update는 키 제약과 참조 무결성을 어길 수 있다. PK나 FK 속성을 바꿀 때만 문제가 된다.<\/b><\/p>\n<ul><li>Ssn='999887777'인 사원의 Dno를 <b>7<\/b>로 → 7번 부서 없음 → <b>참조 무결성<\/b> 위반<\/li><li>Ssn='999887777'을 <b>'987654321'<\/b> 로 → 이미 Wallace의 Ssn(키 제약) + WORKS_ON 등에서 999887777을 참조하던 투플이 고아가 됨(참조 무결성) → <b>둘 다<\/b> 위반<\/li><li>PK를 NULL로 바꾸면 개체 무결성도 깨진다 (교안 요약엔 키·참조만 나옴)<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 요약표 그대로 — Insert = 키·개체·참조 <b>전부 가능<\/b>, Delete = <b>참조만<\/b>, Update = <b>키·참조<\/b> (PK/FK를 바꿀 때만).<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p30.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p30.jpg\" alt=\"03 p.30 · Update의 참조 무결성 위반, 키 + 참조 무결성 동시 위반\" loading=\"lazy\"><\/button><figcaption>03 p.30 · Update의 참조 무결성 위반, 키 + 참조 무결성 동시 위반<\/figcaption><\/figure><\/section>"}, {"id": "L3-4", "title": "ER→관계 매핑 ① 개체 · 다중값 · 약한 개체", "src": "3-1 p.32–36", "secs": [{"id": "map-entity", "title": "정규 개체 타입 매핑"}, {"id": "map-multival", "title": "다중값 속성 매핑"}, {"id": "map-weak", "title": "약한 개체 타입 매핑"}], "md": "## 정규 개체 타입 매핑 {#map-entity}\n\n매핑 순서: 개체 타입(정규·약한) → 다중값 속성 → 관계 타입(1:1, 1:N, M:N, n진).\n\n**정규(regular) 개체 타입 E**\n1. E의 **단순 속성을 모두** 포함하는 릴레이션 R 생성. 복합 속성은 **단순 구성 속성만** 넣음 (Name → Fname, Minit, Lname)\n2. E의 키 속성 중 하나를 R의 **PK**로 지정 (나머지 키는 UNIQUE 후보 키)\n3. 다중값 속성은 여기서 넣지 않음 → 다음 단계\n\n예) DEPARTMENT(Dname, **Dnumber**) — Locations는 아직 빠짐.\n\n## 다중값 속성 매핑 {#map-multival}\n\n**다중값 속성 A** (릴레이션에서는 허용 안 됨)\n1. A마다 **별도 릴레이션 R** 생성\n2. R에 A와, 원래 릴레이션의 PK K를 넣는다. K는 R에서 **FK** (원래 릴레이션 참조). 키 값이 반복됨\n3. **(A, K) 조합을 PK**로\n\n예) DEPT_LOCATIONS(**Dnumber**, **Dlocation**), Dnumber → DEPARTMENT. (5, Seoul), (5, Incheon), (5, Suwon), (3, Seoul), (3, Daejeon)\n\n## 약한 개체 타입 매핑 {#map-weak}\n\n**약한 개체 타입 W**\n1. W의 단순 속성을 모두 포함하는 릴레이션 R 생성 (복합은 구성 속성만)\n2. **소유 개체 타입의 PK를 FK로** 포함 → 이게 **식별 관계 타입을 매핑**한 것\n3. **소유자 PK + 부분 키 조합을 PK**로\n\n예) DEPENDENT(**Essn**, **Dependent_name**, Sex, Bdate, Relationship), Essn → EMPLOYEE.Ssn\n\n> 함정: 식별 관계(DEPENDENTS_OF)는 별도 릴레이션을 만들지 않는다. 소유자 PK를 FK로 넣는 것 자체가 식별 관계의 매핑.", "html": "<section class=\"sec\" id=\"s-map-entity\"><h3>정규 개체 타입 매핑<\/h3><p>매핑 순서: 개체 타입(정규·약한) → 다중값 속성 → 관계 타입(1:1, 1:N, M:N, n진).<\/p>\n<p><b>정규(regular) 개체 타입 E<\/b><\/p>\n<ol><li>E의 <b>단순 속성을 모두<\/b> 포함하는 릴레이션 R 생성. 복합 속성은 <b>단순 구성 속성만<\/b> 넣음 (Name → Fname, Minit, Lname)<\/li><li>E의 키 속성 중 하나를 R의 <b>PK<\/b>로 지정 (나머지 키는 UNIQUE 후보 키)<\/li><li>다중값 속성은 여기서 넣지 않음 → 다음 단계<\/li><\/ol>\n<p>예) DEPARTMENT(Dname, <b>Dnumber<\/b>) — Locations는 아직 빠짐.<\/p><\/section>\n<section class=\"sec\" id=\"s-map-multival\"><h3>다중값 속성 매핑<\/h3><p><b>다중값 속성 A<\/b> (릴레이션에서는 허용 안 됨)<\/p>\n<ol><li>A마다 <b>별도 릴레이션 R<\/b> 생성<\/li><li>R에 A와, 원래 릴레이션의 PK K를 넣는다. K는 R에서 <b>FK<\/b> (원래 릴레이션 참조). 키 값이 반복됨<\/li><li><b>(A, K) 조합을 PK<\/b>로<\/li><\/ol>\n<p>예) DEPT_LOCATIONS(<b>Dnumber<\/b>, <b>Dlocation<\/b>), Dnumber → DEPARTMENT. (5, Seoul), (5, Incheon), (5, Suwon), (3, Seoul), (3, Daejeon)<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p35.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p35.jpg\" alt=\"03 p.35 · 다중값 속성 Locations → DEPT_LOCATIONS(Dnumber, Dlocation)\" loading=\"lazy\"><\/button><figcaption>03 p.35 · 다중값 속성 Locations → DEPT_LOCATIONS(Dnumber, Dlocation)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-map-weak\"><h3>약한 개체 타입 매핑<\/h3><p><b>약한 개체 타입 W<\/b><\/p>\n<ol><li>W의 단순 속성을 모두 포함하는 릴레이션 R 생성 (복합은 구성 속성만)<\/li><li><b>소유 개체 타입의 PK를 FK로<\/b> 포함 → 이게 <b>식별 관계 타입을 매핑<\/b>한 것<\/li><li><b>소유자 PK + 부분 키 조합을 PK<\/b>로<\/li><\/ol>\n<p>예) DEPENDENT(<b>Essn<\/b>, <b>Dependent_name<\/b>, Sex, Bdate, Relationship), Essn → EMPLOYEE.Ssn<\/p>\n<div class=\"callout trap\">함정: 식별 관계(DEPENDENTS_OF)는 별도 릴레이션을 만들지 않는다. 소유자 PK를 FK로 넣는 것 자체가 식별 관계의 매핑.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p36.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p36.jpg\" alt=\"03 p.36 · 약한 개체 DEPENDENT → PK (Essn, Dependent_name)\" loading=\"lazy\"><\/button><figcaption>03 p.36 · 약한 개체 DEPENDENT → PK (Essn, Dependent_name)<\/figcaption><\/figure><\/section>"}, {"id": "L3-5", "title": "ER→관계 매핑 ② 관계 타입", "src": "3-1 p.37–49", "secs": [{"id": "map-11", "title": "1:1 관계 매핑"}, {"id": "map-1n", "title": "1:N 관계 매핑"}, {"id": "map-mn", "title": "M:N 관계 매핑"}, {"id": "map-nary", "title": "n진 관계 매핑"}, {"id": "map-summary", "title": "ER ↔ 관계 모델 대응"}], "md": "## 1:1 관계 매핑 {#map-11}\n\n방법 3가지: **외래 키 방식** (가장 많이 쓰고 유용), **합병 릴레이션 방식** (두 개체를 한 릴레이션으로), **교차 참조(관계 릴레이션) 방식**.\n\n**외래 키 방식**\n1. 참여 개체 타입 S, T 확인\n2. 한쪽(S)을 골라 **상대(T)의 PK를 FK로** 넣는다. **전체 참여 쪽을 S로** 고르는 게 낫다\n3. 관계의 단순 속성도 S에 넣는다\n\n예) MANAGES: DEPARTMENT(전체 참여)를 S로 → DEPARTMENT(Dname, **Dnumber**, Mgr_ssn, Mgr_start_date), Mgr_ssn → EMPLOYEE.\n\n**왜 전체 참여 쪽?** 반대로 EMPLOYEE(부분 참여)를 S로 하면 EMPLOYEE에 D_managed, Mgr_start_date가 들어가는데, 부서를 관리하지 않는 대부분의 사원은 이 값이 **NULL**이 된다. 전체 참여 쪽에 넣으면 NULL이 생기지 않는다.\n\n## 1:N 관계 매핑 {#map-1n}\n\n방법 2가지: **외래 키 방식** (릴레이션 수가 줄어서 선호), 교차 참조 방식.\n\n**외래 키 방식**\n1. **N쪽** 개체 타입을 나타내는 릴레이션 S 확인\n2. S에 상대(1쪽) 릴레이션 T의 **PK를 FK로** 넣는다\n3. 관계의 단순 속성도 S에 넣는다\n\n이유: N쪽 개체 인스턴스 하나는 1쪽 개체 **최대 하나**와 연결 → FK 값 하나로 표현 가능.\n- WORKS_FOR → EMPLOYEE에 **Dno** (→ DEPARTMENT)\n- SUPERVISION → EMPLOYEE에 **Super_ssn** (→ EMPLOYEE, 자기 참조)\n- CONTROLS → PROJECT에 **Dnum** (→ DEPARTMENT)\n\n> 함정: 1쪽에 FK를 넣으면 다중값이 돼서 원자성을 어긴다. FK는 **항상 N쪽**.\n\n## M:N 관계 매핑 {#map-mn}\n\n방법 **하나뿐**: **교차 참조 (관계 릴레이션) 방식**. M:N은 FK 하나로 표현할 수 없다.\n1. 관계 타입 R을 나타내는 **별도 릴레이션 S** 생성\n2. 참여 개체 릴레이션들의 **PK를 FK로** S에 넣는다\n3. **FK들의 조합을 PK**로\n4. M:N 관계의 단순 속성도 S에 넣는다\n\n예) WORKS_ON(**Essn**, **Pno**, Hours), Essn → EMPLOYEE, Pno → PROJECT. 관계 릴레이션 = lookup table.\n\n## n진 관계 매핑 {#map-nary}\n\n**교차 참조 방식** (M:N과 같은 절차)\n1. 별도 릴레이션 S 생성\n2. 참여하는 n개 개체 릴레이션의 PK를 FK로 넣음\n3. FK 전부의 조합을 PK로 (보통. 어느 참여에 max가 1이면 그 FK는 PK에서 빠질 수 있다)\n4. 관계의 단순 속성 포함\n\n예) SUPPLY(**Sname**, **Proj_name**, **Part_no**, Quantity) — SUPPLIER, PROJECT, PART 참조.\n\n## ER ↔ 관계 모델 대응 {#map-summary}\n\n| ER 모델 | 관계 모델 |\n|---|---|\n| 개체 타입 | 개체 릴레이션 |\n| 1:1 또는 1:N 관계 타입 | 외래 키 (또는 관계 릴레이션) |\n| M:N 관계 타입 | 관계 릴레이션 + FK **2개** |\n| n진 관계 타입 | 관계 릴레이션 + FK **n개** |\n| 단순 속성 | 속성 |\n| 복합 속성 | 단순 구성 속성들의 집합 |\n| 다중값 속성 | 릴레이션 + 외래 키 |\n| 값 집합 (value set) | 도메인 |\n| 키 속성 | 기본 키 (또는 보조 키) |\n\n교안 연습 3 (UNIVERSITY: COLLEGE, INSTRUCTOR, DEPT, STUDENT, COURSE, SECTION) 풀이 순서:\n1. 정규 개체 → COLLEGE(CName, COffice, CPhone), INSTRUCTOR(Id, Rank, IName, IOffice, IPhone), DEPT(DName, DCode, DOffice, DPhone), COURSE(CCode, Credits, CoName, Level, CDesc), SECTION(SecId, SecNo, Sem, Year, Bldg, RoomNo, DaysTime), STUDENT(Sid, DOB, FName, MName, LName, Addr, Phone, Major)\n2. 1:1 → DEAN: COLLEGE에 DeanId (COLLEGE가 (1,1) 전체 참여), CHAIR: DEPT에 ChairId, CStartDate\n3. 1:N → INSTRUCTOR.Employed(EMPLOYS), DEPT.Admined(ADMINS), COURSE.Offered(OFFERS), SECTION.Taught(TEACHES), SECTION.Belongs(SECS), STUDENT.Dept(HAS)\n4. M:N → TAKES(**Sid**, **SecId**, Grade)", "html": "<section class=\"sec\" id=\"s-map-11\"><h3>1:1 관계 매핑<\/h3><p>방법 3가지: <b>외래 키 방식<\/b> (가장 많이 쓰고 유용), <b>합병 릴레이션 방식<\/b> (두 개체를 한 릴레이션으로), <b>교차 참조(관계 릴레이션) 방식<\/b
