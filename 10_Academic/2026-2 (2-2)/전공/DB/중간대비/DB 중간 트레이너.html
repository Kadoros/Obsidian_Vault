", "answer_en": "Relational database schema: a set of relation schemas {R₁…Rₘ} and a set of integrity constraints IC. Relational database state: a set of relation states rᵢ, one for each Rᵢ. Valid state: a state that satisfies all the integrity constraints in IC.", "keys_en": ["Schema = set of relation schemas + IC", "State = set of relation states", "Valid = satisfies all constraints"]}, {"id": "3-key-1", "concept": "superkey-key", "type": "mc", "prompt": "슈퍼키와 키의 차이는?", "choices": ["키는 속성이 하나뿐이다", "키는 최소성(어떤 속성을 빼도 슈퍼키가 아님)을 만족한다", "슈퍼키는 NULL을 허용한다", "차이가 없다"], "answer": 1, "lesson": "L3-2", "unit": "U3", "prompt_en": "What is the difference between a superkey and a key?", "choices_en": ["A key has only one attribute", "A key satisfies minimality (removing any attribute leaves a set that is not a superkey)", "A superkey allows NULL", "There is no difference"]}, {"id": "3-key-2", "concept": "superkey-key", "type": "ox", "prompt": "모든 키는 슈퍼키이지만, 모든 슈퍼키가 키인 것은 아니다.", "answer": true, "lesson": "L3-2", "unit": "U3", "prompt_en": "Every key is a superkey, but not every superkey is a key."}, {"id": "3-key-3", "concept": "superkey-key", "type": "mc", "prompt": "EMPLOYEE(Ssn, Fname, Lname, …)에서 Ssn이 키일 때 {Ssn, Lname}은?", "choices": ["슈퍼키지만 키는 아님", "키", "후보 키", "슈퍼키도 아님"], "answer": 0, "lesson": "L3-2", "unit": "U3", "prompt_en": "In EMPLOYEE(Ssn, Fname, Lname, …), if Ssn is a key, what is {Ssn, Lname}?", "choices_en": ["A superkey but not a key", "A key", "A candidate key", "Not even a superkey"]}, {"id": "3-key-4", "concept": "superkey-key", "type": "blank", "prompt": "키 제약: 서로 다른 두 투플 t₁, t₂에 대해 t₁[(a)] ≠ t₂[(a)] 이다. 키는 (b) 슈퍼키이다.", "answer": "(a) SK / (b) 최소", "accept": [["SK", "슈퍼키", "superkey", "키"], ["최소", "minimal", "최소한의", "minimum"]], "lesson": "L3-2", "unit": "U3", "prompt_en": "Key constraint: for any two distinct tuples t₁, t₂, t₁[(a)] ≠ t₂[(a)]. A key is a (b) superkey.", "answer_en": "(a) SK / (b) minimal"}, {"id": "3-key-5", "concept": "superkey-key", "type": "short", "prompt": "슈퍼키와 키를 정의하고, {Ssn, Home_phone}을 예로 차이를 설명하시오.", "answer": "슈퍼키: 각 투플을 유일하게 식별하는 속성 부분집합 (서로 다른 두 투플이 같은 값을 가질 수 없음). 키: 슈퍼키 중에서 어떤 속성을 빼도 더 이상 슈퍼키가 아닌 최소 슈퍼키. {Ssn, Home_phone}은 슈퍼키지만 Home_phone을 빼도 {Ssn}이 여전히 유일하므로 키가 아니고, {Ssn}이 키다.", "keys": ["슈퍼키 정의 (유일 식별)", "키 = 최소 슈퍼키", "예: Home_phone 빼도 유일 → {Ssn}이 키"], "slot": 3, "pts": 3, "lesson": "L3-2", "unit": "U3", "prompt_en": "Define superkey and key, and explain the difference using {Ssn, Home_phone} as an example.", "answer_en": "Superkey: a subset of attributes that uniquely identifies each tuple (no two distinct tuples can have the same value). Key: a minimal superkey, i.e., a superkey such that removing any attribute leaves a set that is no longer a superkey. {Ssn, Home_phone} is a superkey, but even after removing Home_phone, {Ssn} is still unique, so it is not a key; {Ssn} is a key.", "keys_en": ["Definition of superkey (uniquely identifies)", "Key = minimal superkey", "Example: still unique without Home_phone → {Ssn} is the key"]}, {"id": "3-key-6", "concept": "superkey-key", "type": "calc", "prompt": "R(A, B, C, D)의 상태가 다음과 같을 때, 이 상태에서 슈퍼키가 될 수 있는 속성 집합 중 '키(최소 슈퍼키)'를 모두 쓰시오.\n\nA | B | C | D\n1 | x | p | 10\n2 | x | q | 10\n3 | y | p | 20\n4 | y | q | 20", "answer": "{A}, {B, C}, {C, D}\n\nA는 값이 모두 달라 혼자 키. B, C, D는 각각 중복이 있음. {B,C}: (x,p),(x,q),(y,p),(y,q) 모두 다름 → 키. {C,D}: (p,10),(q,10),(p,20),(q,20) 모두 다름 → 키. {B,D}: (x,10),(x,10) 중복 → 아님.", "explain": "엄밀히 키는 스키마(모든 가능한 상태)에 대한 성질이라, 상태 하나만 보고는 '키일 수 있는 것'만 판단한다.", "keys": ["{A}", "{B, C}", "{C, D}", "{B, D}는 아님"], "lesson": "L3-2", "unit": "U3", "prompt_en": "Given the following state of R(A, B, C, D), list all the attribute sets that could be 'keys (minimal superkeys)' in this state.\n\nA | B | C | D\n1 | x | p | 10\n2 | x | q | 10\n3 | y | p | 20\n4 | y | q | 20", "answer_en": "{A}, {B, C}, {C, D}\n\nAll values of A are distinct, so A alone is a key. B, C and D each have duplicates. {B,C}: (x,p),(x,q),(y,p),(y,q) are all distinct → key. {C,D}: (p,10),(q,10),(p,20),(q,20) are all distinct → key. {B,D}: (x,10),(x,10) is duplicated → not a key.", "explain_en": "Strictly speaking, a key is a property of the schema (all possible states), so from a single state we can only decide what 'could be' a key.", "keys_en": ["{A}", "{B, C}", "{C, D}", "{B, D} is not a key"]}, {"id": "3-key-7", "concept": "superkey-key", "type": "ox", "prompt": "모든 릴레이션은 최소 하나의 슈퍼키를 가진다.", "answer": true, "explain": "투플은 서로 다르므로 속성 전체 집합이 기본 슈퍼키.", "lesson": "L3-2", "unit": "U3", "prompt_en": "Every relation has at least one superkey.", "explain_en": "Tuples are all distinct, so the set of all attributes is a default superkey."}, {"id": "3-ck-1", "concept": "candidate-pk", "type": "mc", "prompt": "CAR(License_number, Engine_serial_number, Make, Model, Year)에서 License_number와 Engine_serial_number가 각각 키라면 이 둘을 무엇이라 부르나?", "choices": ["슈퍼키", "외래 키", "후보 키", "부분 키"], "answer": 2, "lesson": "L3-2", "unit": "U3", "prompt_en": "In CAR(License_number, Engine_serial_number, Make, Model, Year), if License_number and Engine_serial_number are each keys, what are these two called?", "choices_en": ["Superkeys", "Foreign keys", "Candidate keys", "Partial keys"]}, {"id": "3-ck-2", "concept": "candidate-pk", "type": "ox", "prompt": "기본 키는 보통 속성 하나 또는 적은 수의 속성으로 된 후보 키를 고르는 것이 좋다.", "answer": true, "lesson": "L3-2", "unit": "U3", "prompt_en": "It is usually better to choose as the primary key a candidate key with a single attribute or a small number of attributes."}, {"id": "3-ck-3", "concept": "candidate-pk", "type": "short", "prompt": "후보 키와 기본 키의 관계를 설명하고, SQL에서 기본 키가 아닌 후보 키를 지정하는 절을 쓰시오.", "answer": "릴레이션 스키마의 키가 여러 개면 각각이 후보 키이고, 그중 하나를 투플 식별에 쓰는 기본 키로 지정한다(스키마에 밑줄). 나머지 후보 키는 SQL에서 UNIQUE 절로 지정한다.", "keys": ["키 여러 개 = 후보 키", "하나를 PK로 지정", "나머지는 UNIQUE"], "lesson": "L3-2", "unit": "U3", "prompt_en": "Explain the relationship between candidate keys and the primary key, and give the SQL clause used to specify a candidate key that is not the primary key.", "answer_en": "If a relation schema has more than one key, each is called a candidate key, and one of them is designated as the primary key used to identify tuples (underlined in the schema). The other candidate keys are specified with the UNIQUE clause in SQL.", "keys_en": ["More than one key = candidate keys", "One is designated as the PK", "The others are UNIQUE"]}, {"id": "3-ck-4", "concept": "candidate-pk", "type": "mc", "prompt": "릴레이션 스키마 그림에서 기본 키는 어떻게 표시하나?", "choices": ["밑줄", "굵은 글씨", "화살표", "이중선"], "answer": 0, "lesson": "L3-2", "unit": "U3", "prompt_en": "How is the primary key shown in a relation schema diagram?", "choices_en": ["Underlined", "In bold", "With an arrow", "With a double line"]}, {"id": "3-ei-1", "concept": "entity-integrity", "type": "mc", "prompt": "개체 무결성 제약은?", "choices": ["FK 값은 참조되는 PK 값이거나 NULL", "기본 키 값은 NULL일 수 없다", "두 투플의 키 값은 같을 수 없다", "모든 속성은 NULL일 수 없다"], "answer": 1, "lesson": "L3-2", "unit": "U3", "prompt_en": "What is the entity integrity constraint?", "choices_en": ["An FK value is a referenced PK value or NULL", "No primary key value can be NULL", "No two tuples can have the same key value", "No attribute can be NULL"]}, {"id": "3-ei-2", "concept": "entity-integrity", "type": "short", "prompt": "개체 무결성 제약이 왜 필요한지 쓰시오.", "answer": "PK가 NULL인 투플이 둘 이상 있으면, 다른 릴레이션에서 그 투플들을 참조하려 할 때 서로 구별할 수 없기 때문. PK는 투플을 식별하는 데 쓰이므로 NULL이면 안 된다.", "keys": ["PK가 NULL이면 투플을 구별·참조할 수 없음"], "slot": 3, "pts": 3, "lesson": "L3-2", "unit": "U3", "prompt_en": "Explain why the entity integrity constraint is needed.", "answer_en": "If two or more tuples had NULL primary keys, we could not distinguish them when referencing them from other relations. The PK is used to identify tuples, so it must not be NULL.", "keys_en": ["If the PK is NULL, tuples cannot be distinguished or referenced"]}, {"id": "3-ei-3", "concept": "entity-integrity", "type": "ox", "prompt": "복합 기본 키 (Essn, Pno)에서는 Essn만 NULL이 아니면 Pno는 NULL이어도 된다.", "answer": false, "explain": "PK의 어느 부분도 NULL이면 안 된다.", "lesson": "L3-2", "unit": "U3", "prompt_en": "In the composite primary key (Essn, Pno), Pno may be NULL as long as Essn is not NULL.", "explain_en": "No part of the PK may be NULL."}, {"id": "3-ei-4", "concept": "entity-integrity", "type": "mc", "prompt": "NULL이 들어 있는 Office_phone 속성에 대한 설명으로 옳은 것은?", "choices": ["후보 키가 될 수 있다", "기본 키가 될 수 있다", "외래 키여야 한다", "개체 무결성 때문에 기본 키가 될 수 없다"], "answer": 3, "lesson": "L3-2", "unit": "U3", "prompt_en": "Which statement about the Office_phone attribute, which contains NULLs, is correct?", "choices_en": ["It can be a candidate key", "It can be the primary key", "It must be a foreign key", "It cannot be the primary key because of entity integrity"]}, {"id": "3-ri-1", "concept": "ref-integrity", "type": "mc", "prompt": "참조 무결성 제약으로 옳은 것은?", "choices": ["FK 값은 참조되는 릴레이션의 어떤 투플의 PK 값과 같거나 NULL이다", "FK 값은 NULL일 수 없다", "PK 값은 NULL일 수 없다", "FK는 자기 릴레이션을 참조할 수 없다"], "answer": 0, "lesson": "L3-2", "unit": "U3", "prompt_en": "Which statement of the referential integrity constraint is correct?", "choices_en": ["An FK value either equals the PK value of some tuple in the referenced relation or is NULL", "An FK value cannot be NULL", "A PK value cannot be NULL", "An FK cannot reference its own relation"]}, {"id": "3-ri-2", "concept": "ref-integrity", "type": "ox", "prompt": "외래 키는 같은 릴레이션을 참조할 수도 있다.", "answer": true, "explain": "EMPLOYEE.Super_ssn → EMPLOYEE.Ssn.", "lesson": "L3-2", "unit": "U3", "prompt_en": "A foreign key may also reference its own relation."}, {"id": "3-ri-3", "concept": "ref-integrity", "type": "blank", "prompt": "EMPLOYEE.Dno가 DEPARTMENT.Dnumber를 참조할 때, EMPLOYEE는 (a) 릴레이션, DEPARTMENT는 (b) 릴레이션이다.", "answer": "(a) 참조하는 / (b) 참조되는", "accept": [["참조하는", "referencing", "참조"], ["참조되는", "referenced", "피참조"]], "lesson": "L3-2", "unit": "U3", "prompt_en": "When EMPLOYEE.Dno references DEPARTMENT.Dnumber, EMPLOYEE is the (a) relation and DEPARTMENT is the (b) relation.", "answer_en": "(a) referencing / (b) referenced"}, {"id": "3-ri-4", "concept": "ref-integrity", "type": "short", "prompt": "참조 무결성 제약을 정의하고, 이 제약이 없으면 생기는 문제를 예로 설명하시오.", "answer": "릴레이션 R₁의 FK 값은 R₂의 어떤 투플의 PK 값과 같거나 NULL이어야 한다 (FK와 PK는 같은 도메인). 없으면: EMPLOYEE.Dno = 3인데 3번 부서가 DEPARTMENT에 없으면 그 사원이 어느 부서에서 일하는지 해석할 수 없다. 두 릴레이션 투플 사이의 일관성을 지키려고 필요.", "keys": ["FK = 참조되는 PK 값 또는 NULL", "없는 투플을 참조하면 의미를 해석할 수 없음 (예)"], "slot": 3, "pts": 3, "lesson": "L3-2", "unit": "U3", "prompt_en": "Define the referential integrity constraint, and use an example to explain the problem that occurs without it.", "answer_en": "The FK value of relation R₁ must either equal the PK value of some tuple in R₂ or be NULL (the FK and the PK have the same domain). Without it: if EMPLOYEE.Dno = 3 but department 3 does not exist in DEPARTMENT, we cannot interpret which department that employee works for. It is needed to maintain consistency among tuples of the two relations.", "keys_en": ["FK = a referenced PK value or NULL", "Referencing a nonexistent tuple cannot be interpreted (example)"]}, {"id": "3-ri-5", "concept": "ref-integrity", "type": "calc", "prompt": "다음 스키마의 외래 키를 모두 쓰시오 (밑줄은 PK).\nSTUDENT(Ssn, Name, Major, Bdate)\nCOURSE(Course#, Cname, Dept)\nENROLL(Ssn, Course#, Quarter, Grade)  — PK (Ssn, Course#, Quarter)\nBOOK_ADOPTION(Course#, Quarter, Book_isbn)  — PK (Course#, Quarter)\nTEXT(Book_isbn, Book_title, Publisher, Author)", "answer": "ENROLL.Ssn → STUDENT.Ssn\nENROLL.Course# → COURSE.Course#\nBOOK_ADOPTION.Course# → COURSE.Course#\nBOOK_ADOPTION.Book_isbn → TEXT.Book_isbn", "keys": ["ENROLL.Ssn → STUDENT", "ENROLL.Course# → COURSE", "BOOK_ADOPTION.Course# → COURSE", "BOOK_ADOPTION.Book_isbn → TEXT"], "lesson": "L3-2", "unit": "U3", "prompt_en": "List all the foreign keys in the following schema (underline = PK).\nSTUDENT(Ssn, Name, Major, Bdate)\nCOURSE(Course#, Cname, Dept)\nENROLL(Ssn, Course#, Quarter, Grade)  — PK (Ssn, Course#, Quarter)\nBOOK_ADOPTION(Course#, Quarter, Book_isbn)  — PK (Course#, Quarter)\nTEXT(Book_isbn, Book_title, Publisher, Author)"}, {"id": "3-ri-6", "concept": "ref-integrity", "type": "calc", "prompt": "다음 스키마의 외래 키를 모두 쓰고, 각각 왜 필요한지 한 줄씩 쓰시오.\nSALESPERSON(Ssn, Name, Start_year, Dept_no)\nTRIP(Ssn, From_city, To_city, Departure_date, Return_date, Trip_id)  — PK Trip_id\nEXPENSE(Trip_id, Account#, Amount)  — PK (Trip_id, Account#)", "answer": "TRIP.Ssn → SALESPERSON.Ssn: 출장은 존재하는 영업사원에게 배정돼야 함\nEXPENSE.Trip_id → TRIP.Trip_id: 경비는 특정 출장에 대해 지급됨", "keys": ["TRIP.Ssn → SALESPERSON", "EXPENSE.Trip_id → TRIP", "이유 각각"], "lesson": "L3-2", "unit": "U3", "prompt_en": "List all the foreign keys in the following schema, and give a one-line reason why each is needed.\nSALESPERSON(Ssn, Name, Start_year, Dept_no)\nTRIP(Ssn, From_city, To_city, Departure_date, Return_date, Trip_id)  — PK Trip_id\nEXPENSE(Trip_id, Account#, Amount)  — PK (Trip_id, Account#)", "answer_en": "TRIP.Ssn → SALESPERSON.Ssn: a trip must be assigned to an existing salesperson\nEXPENSE.Trip_id → TRIP.Trip_id: an expense is paid for a specific trip", "keys_en": ["TRIP.Ssn → SALESPERSON", "EXPENSE.Trip_id → TRIP", "A reason for each"]}, {"id": "3-ri-7", "concept": "ref-integrity", "type": "ox", "prompt": "FK와 그것이 참조하는 PK는 같은 도메인을 가져야 한다.", "answer": true, "lesson": "L3-2", "unit": "U3", "prompt_en": "An FK and the PK it references must have the same domain."}, {"id": "3-ins-1", "concept": "op-insert", "type": "mc", "prompt": "Insert 연산이 어길 수 있는 제약은?", "choices": ["참조 무결성만", "키 제약만", "키 제약과 참조 무결성", "키 제약, 개체 무결성, 참조 무결성 모두"], "answer": 3, "lesson": "L3-3", "unit": "U3", "prompt_en": "Which constraints can an Insert operation violate?", "choices_en": ["Only referential integrity", "Only the key constraint", "The key constraint and referential integrity", "All of the key constraint, entity integrity and referential integrity"]}, {"id": "3-ins-2", "concept": "op-insert", "type": "mc", "prompt": "COMPANY 상태에서 EMPLOYEE에 <'Alicia', 'J', 'Zelaya', '999887777', …, '987654321', 4>를 삽입하면?", "choices": ["키 제약 위반 (Ssn 999887777이 이미 있음)", "개체 무결성 위반", "참조 무결성 위반", "위반 없음"], "answer": 0, "lesson": "L3-3", "unit": "U3", "prompt_en": "In the COMPANY state, what happens if <'Alicia', 'J', 'Zelaya', '999887777', …, '987654321', 4> is inserted into EMPLOYEE?", "choices_en": ["Key constraint violation (Ssn 999887777 already exists)", "Entity integrity violation", "Referential integrity violation", "No violation"]}, {"id": "3-ins-3", "concept": "op-insert", "type": "mc", "prompt": "EMPLOYEE에 <'Cecilia', 'F', 'Kolonsky', '677678989', …, '987654321', 7>을 삽입하면? (DEPARTMENT에 Dnumber=7 없음)", "choices": ["키 제약 위반", "개체 무결성 위반", "참조 무결성 위반", "위반 없음"], "answer": 2, "lesson": "L3-3", "unit": "U3", "prompt_en": "What happens if <'Cecilia', 'F', 'Kolonsky', '677678989', …, '987654321', 7> is inserted into EMPLOYEE? (There is no Dnumber=7 in DEPARTMENT.)", "choices_en": ["Key constraint violation", "Entity integrity violation", "Referential integrity violation", "No violation"]}, {"id": "3-ins-4", "concept": "op-insert", "type": "ox", "prompt": "EMPLOYEE에 <'Cecilia', 'F', 'Kolonsky', '677678989', …, NULL, 4>를 삽입하면 Super_ssn이 NULL이므로 참조 무결성을 어긴다.", "answer": false, "explain": "FK는 NULL이어도 된다. 이 삽입은 모든 제약을 만족.", "lesson": "L3-3", "unit": "U3", "prompt_en": "Inserting <'Cecilia', 'F', 'Kolonsky', '677678989', …, NULL, 4> into EMPLOYEE violates referential integrity because Super_ssn is NULL.", "explain_en": "An FK may be NULL. This insertion satisfies all constraints."}, {"id": "3-ins-5", "concept": "op-insert", "type": "calc", "prompt": "COMPANY 상태(교안 3-1 p.12)에서 다음 삽입 각각이 어기는 제약을 쓰시오 (없으면 '없음').\n(1) EMPLOYEE에 Ssn=NULL인 투플\n(2) EMPLOYEE에 Ssn='123456789'인 새 투플\n(3) WORKS_ON에 <'453453453', 10, 5.0>\n(4) WORKS_ON에 <'677678989', 1, 10.0>\n(5) DEPT_LOCATIONS에 <2, 'Seoul'>", "answer": "(1) 개체 무결성 (PK가 NULL)\n(2) 키 제약 (Smith가 이미 123456789)\n(3) 없음 (English는 있고 10번 프로젝트도 있고 (453453453, 10) 조합은 없음)\n(4) 참조 무결성 (Ssn 677678989인 사원 없음)\n(5) 참조 무결성 (Dnumber 2인 부서 없음)", "keys": ["(1) 개체 무결성", "(2) 키 제약", "(3) 없음", "(4) 참조 무결성", "(5) 참조 무결성"], "slot": 8, "pts": 5, "lesson": "L3-3", "unit": "U3", "prompt_en": "In the COMPANY state (lecture slides 3-1 p.12), state which constraint each of the following insertions violates ('none' if there is no violation).\n(1) A tuple with Ssn=NULL into EMPLOYEE\n(2) A new tuple with Ssn='123456789' into EMPLOYEE\n(3) <'453453453', 10, 5.0> into WORKS_ON\n(4) <'677678989', 1, 10.0> into WORKS_ON\n(5) <2, 'Seoul'> into DEPT_LOCATIONS", "answer_en": "(1) Entity integrity (the PK is NULL)\n(2) Key constraint (Smith already has 123456789)\n(3) None (English exists, project 10 exists, and the combination (453453453, 10) does not exist yet)\n(4) Referential integrity (there is no employee with Ssn 677678989)\n(5) Referential integrity (there is no department with Dnumber 2)", "keys_en": ["(1) Entity integrity", "(2) Key constraint", "(3) None", "(4) Referential integrity", "(5) Referential integrity"]}, {"id": "3-ins-6", "concept": "op-insert", "type": "blank", "prompt": "Insert에서 새 투플의 키 값이 이미 있으면 (a) 제약, PK의 일부가 NULL이면 (b) 제약, 참조하는 투플이 없으면 (c) 제약을 어긴다.", "answer": "(a) 키 / (b) 개체 무결성 / (c) 참조 무결성", "accept": [["키", "key", "키 제약", "key constraint"], ["개체 무결성", "개체", "entity", "entity integrity"], ["참조 무결성", "참조", "referential", "referential integrity"]], "lesson": "L3-3", "unit": "U3", "prompt_en": "In an Insert, if the new tuple's key value already exists, the (a) constraint is violated; if part of the PK is NULL, the (b) constraint is violated; and if the referenced tuple does not exist, the (c) constraint is violated.", "answer_en": "(a) key / (b) entity integrity / (c) referential integrity"}, {"id": "3-del-1", "concept": "op-delete", "type": "mc", "prompt": "Delete 연산이 어길 수 있는 제약은?", "choices": ["키 제약", "참조 무결성만", "개체 무결성", "세 가지 모두"], "answer": 1, "lesson": "L3-3", "unit": "U3", "prompt_en": "Which constraints can a Delete operation violate?", "choices_en": ["The key constraint", "Only referential integrity", "Entity integrity", "All three"]}, {"id": "3-del-2", "concept": "op-delete", "type": "ox", "prompt": "WORKS_ON에서 (Essn='999887777', Pno=10) 투플을 지우면 참조 무결성을 어긴다.", "answer": false, "explain": "WORKS_ON 투플을 참조하는 투플이 없다.", "lesson": "L3-3", "unit": "U3", "prompt_en": "Deleting the tuple (Essn='999887777', Pno=10) from WORKS_ON violates referential integrity.", "explain_en": "No tuple references the WORKS_ON tuple."}, {"id": "3-del-3", "concept": "op-delete", "type": "short", "prompt": "Delete가 참조 무결성 외의 제약을 어기지 않는 이유를 쓰시오.", "answer": "삭제는 새 값을 만들지 않으므로 키 중복(키 제약)이나 NULL PK(개체 무결성)가 생기지 않는다. 지운 투플을 다른 투플의 FK가 참조하고 있을 때만 그 FK가 존재하지 않는 투플을 가리키게 되어 참조 무결성이 깨진다.", "keys": ["새 값이 없어서 키·개체 무결성은 안 깨짐", "참조되던 투플을 지우면 참조 무결성 위반"], "lesson": "L3-3", "unit": "U3", "prompt_en": "Explain why Delete cannot violate any constraint other than referential integrity.", "answer_en": "A deletion does not create new values, so it cannot create a duplicate key (key constraint) or a NULL PK (entity integrity). Only when the deleted tuple is referenced by the FK of other tuples do those FKs point to a nonexistent tuple, which violates referential integrity.", "keys_en": ["No new values, so key and entity integrity cannot be violated", "Deleting a referenced tuple violates referential integrity"]}, {"id": "3-del-4", "concept": "op-delete", "type": "calc", "prompt": "COMPANY 상태에서 다음 삭제가 참조 무결성을 어기는지, 어긴다면 어느 릴레이션의 투플들이 참조하고 있는지 쓰시오.\n(1) EMPLOYEE에서 Ssn='999887777'\n(2) PROJECT에서 Pnumber=30\n(3) DEPENDENT에서 (Essn='123456789', Dependent_name='Michael')\n(4) DEPARTMENT에서 Dnumber=1", "answer": "(1) 위반: WORKS_ON 투플 2개 (Pno 30, 10)\n(2) 위반: WORKS_ON 투플 3개 (Zelaya, Jabbar, Wallace)\n(3) 위반 없음: DEPENDENT를 참조하는 릴레이션 없음\n(4) 위반: EMPLOYEE(Borg의 Dno=1), PROJECT(Reorganization의 Dnum=1), DEPT_LOCATIONS(1, Houston)", "keys": ["(1) WORKS_ON", "(2) WORKS_ON", "(3) 없음", "(4) EMPLOYEE, PROJECT, DEPT_LOCATIONS"], "slot": 8, "pts": 5, "lesson": "L3-3", "unit": "U3", "prompt_en": "In the COMPANY state, state whether each of the following deletions violates referential integrity, and if so, which relations' tuples reference it.\n(1) Ssn='999887777' from EMPLOYEE\n(2) Pnumber=30 from PROJECT\n(3) (Essn='123456789', Dependent_name='Michael') from DEPENDENT\n(4) Dnumber=1 from DEPARTMENT", "answer_en": "(1) Violation: 2 WORKS_ON tuples (Pno 30, 10)\n(2) Violation: 3 WORKS_ON tuples (Zelaya, Jabbar, Wallace)\n(3) No violation: no relation references DEPENDENT\n(4) Violation: EMPLOYEE (Borg's Dno=1), PROJECT (Reorganization's Dnum=1), DEPT_LOCATIONS (1, Houston)", "keys_en": ["(1) WORKS_ON", "(2) WORKS_ON", "(3) None", "(4) EMPLOYEE, PROJECT, DEPT_LOCATIONS"]}, {"id": "3-upd-1", "concept": "op-update", "type": "mc", "prompt": "Update 연산이 제약 문제를 일으키는 경우는?", "choices": ["어떤 속성을 바꿔도 항상", "비키 속성을 바꿀 때만", "PK나 FK 속성을 바꿀 때만", "절대 일으키지 않음"], "answer": 2, "lesson": "L3-3", "unit": "U3", "prompt_en": "When does an Update operation cause constraint problems?", "choices_en": ["Always, whatever attribute is changed", "Only when a non-key attribute is changed", "Only when a PK or FK attribute is changed", "Never"]}, {"id": "3-upd-2", "concept": "op-update", "type": "mc", "prompt": "EMPLOYEE에서 Ssn='999887777'인 투플의 Ssn을 '987654321'로 바꾸면?", "choices": ["위반 없음", "키 제약만", "참조 무결성만", "키 제약과 참조 무결성 둘 다"], "answer": 3, "explain": "987654321은 Wallace의 Ssn(키 중복)이고, WORKS_ON에서 999887777을 참조하던 투플이 존재하지 않는 사원을 가리키게 됨.", "lesson": "L3-3", "unit": "U3", "prompt_en": "What happens if the Ssn of the EMPLOYEE tuple with Ssn='999887777' is changed to '987654321'?", "explain_en": "987654321 is Wallace's Ssn (duplicate key), and the WORKS_ON tuples that referenced 999887777 now point to a nonexistent employee.", "choices_en": ["No violation", "Only the key constraint", "Only referential integrity", "Both the key constraint and referential integrity"]}, {"id": "3-upd-3", "concept": "op-update", "type": "mc", "prompt": "EMPLOYEE에서 Ssn='999887777'의 Dno를 7로 바꾸면? (7번 부서 없음)", "choices": ["키 제약", "참조 무결성", "개체 무결성", "위반 없음"], "answer": 1, "lesson": "L3-3", "unit": "U3", "prompt_en": "What happens if the Dno of the EMPLOYEE tuple with Ssn='999887777' is changed to 7? (There is no department 7.)", "choices_en": ["Key constraint", "Referential integrity", "Entity integrity", "No violation"]}, {"id": "3-upd-4", "concept": "op-update", "type": "ox", "prompt": "EMPLOYEE의 Salary를 바꾸는 갱신은 키·개체·참조 무결성 제약을 어기지 않는다.", "answer": true, "explain": "PK도 FK도 아닌 속성. (도메인 제약은 별개)", "lesson": "L3-3", "unit": "U3", "prompt_en": "An update that changes EMPLOYEE's Salary does not violate the key, entity integrity or referential integrity constraints.", "explain_en": "It is neither a PK nor an FK attribute. (Domain constraints are a separate matter.)"}, {"id": "3-upd-5", "concept": "op-update", "type": "calc", "prompt": "COMPANY 상태에서 다음 갱신이 어기는 제약을 쓰시오 (없으면 '없음').\n(1) PROJECT Pnumber=10의 Dnum을 5로\n(2) DEPARTMENT Dnumber=5의 Mgr_ssn을 '111111111'로\n(3) WORKS_ON (Essn='123456789', Pno=1)의 Pno를 2로\n(4) EMPLOYEE Ssn='888665555'의 Ssn을 NULL로", "answer": "(1) 없음 (5번 부서 있음)\n(2) 참조 무결성 (Ssn 111111111인 사원 없음)\n(3) 키 제약 ((123456789, 2) 투플이 이미 있음)\n(4) 개체 무결성 (PK를 NULL로) + 다른 투플이 888665555를 참조하므로 참조 무결성도", "keys": ["(1) 없음", "(2) 참조 무결성", "(3) 키 제약", "(4) 개체 무결성 (+참조)"], "slot": 8, "pts": 5, "lesson": "L3-3", "unit": "U3", "prompt_en": "In the COMPANY state, state which constraint each of the following updates violates ('none' if there is no violation).\n(1) Change Dnum of PROJECT Pnumber=10 to 5\n(2) Change Mgr_ssn of DEPARTMENT Dnumber=5 to '111111111'\n(3) Change Pno of WORKS_ON (Essn='123456789', Pno=1) to 2\n(4) Change Ssn of EMPLOYEE Ssn='888665555' to NULL", "answer_en": "(1) None (department 5 exists)\n(2) Referential integrity (there is no employee with Ssn 111111111)\n(3) Key constraint (the tuple (123456789, 2) already exists)\n(4) Entity integrity (the PK is set to NULL) + referential integrity as well, since other tuples reference 888665555", "keys_en": ["(1) None", "(2) Referential integrity", "(3) Key constraint", "(4) Entity integrity (+ referential)"]}, {"id": "3-upd-6", "concept": "op-update", "type": "short", "prompt": "Insert, Delete, Update가 각각 어길 수 있는 제약을 정리하시오.", "answer": "Insert: 키 제약, 개체 무결성, 참조 무결성 모두 가능. Delete: 참조 무결성만. Update: 키 제약과 참조 무결성 (PK나 FK를 바꿀 때만 문제).", "keys": ["Insert = 세 가지 모두", "Delete = 참조 무결성만", "Update = 키·참조 (PK/FK 변경 시)"], "lesson": "L3-3", "unit": "U3", "prompt_en": "Summarize which constraints Insert, Delete and Update can each violate.", "answer_en": "Insert: the key constraint, entity integrity and referential integrity are all possible. Delete: only referential integrity. Update: the key constraint and referential integrity (a problem only when a PK or FK is changed).", "keys_en": ["Insert = all three", "Delete = referential integrity only", "Update = key and referential (when a PK/FK is changed)"]}, {"id": "3-me-1", "concept": "map-entity", "type": "mc", "prompt": "정규 개체 타입을 매핑할 때 복합 속성 Name(Fname, Minit, Lname)은?", "choices": ["별도 릴레이션으로", "단순 구성 속성 Fname, Minit, Lname만 넣는다", "Name 하나로 넣는다", "FK로 넣는다"], "answer": 1, "lesson": "L3-4", "unit": "U3", "prompt_en": "When mapping a regular entity type, what happens to the composite attribute Name(Fname, Minit, Lname)?", "choices_en": ["It becomes a separate relation", "Only its simple component attributes Fname, Minit, Lname are included", "It is included as a single attribute Name", "It is included as an FK"]}, {"id": "3-me-2", "concept": "map-entity", "type": "ox", "prompt": "정규 개체 타입을 매핑할 때 다중값 속성도 같은 릴레이션에 넣는다.", "answer": false, "explain": "다중값 속성은 별도 릴레이션 (다음 단계).", "lesson": "L3-4", "unit": "U3", "prompt_en": "When mapping a regular entity type, multivalued attributes are also included in the same relation.", "explain_en": "A multivalued attribute becomes a separate relation (next step)."}, {"id": "3-me-3", "concept": "map-entity", "type": "short", "prompt": "정규 개체 타입 E를 릴레이션으로 매핑하는 절차를 쓰시오.", "answer": "E의 단순 속성을 모두 포함하는 릴레이션 R을 만든다. 복합 속성은 단순 구성 속성만 넣는다. E의 키 속성 중 하나를 R의 기본 키로 지정한다 (다중값 속성은 다음 단계에서 별도 릴레이션).", "keys": ["단순 속성 전부 포함", "복합 → 구성 속성", "키 하나를 PK로"], "lesson": "L3-4", "unit": "U3", "prompt_en": "Describe the procedure for mapping a regular entity type E to a relation.", "answer_en": "Create a relation R that includes all the simple attributes of E. For a composite attribute, include only its simple component attributes. Choose one of E's key attributes as the primary key of R (multivalued attributes become separate relations in the next step).", "keys_en": ["Include all simple attributes", "Composite → component attributes", "Choose one key as the PK"]}, {"id": "3-me-4", "concept": "map-entity", "type": "mc", "prompt": "DEPARTMENT(Name, Number 둘 다 키)를 매핑할 때 Number를 PK로 고르면 Name은?", "choices": ["버린다", "FK가 된다", "UNIQUE 후보 키로 둔다", "별도 릴레이션으로"], "answer": 2, "lesson": "L3-4", "unit": "U3", "prompt_en": "When mapping DEPARTMENT (Name and Number are both keys), if Number is chosen as the PK, what happens to Name?", "choices_en": ["It is discarded", "It becomes an FK", "It is kept as a UNIQUE candidate key", "It becomes a separate relation"]}, {"id": "3-mv-1", "concept": "map-multival", "type": "mc", "prompt": "DEPARTMENT의 다중값 속성 Locations를 매핑한 DEPT_LOCATIONS의 기본 키는?", "choices": ["Dnumber", "Dlocation", "(Dnumber, Dlocation)", "새로 만든 Loc_id"], "answer": 2, "lesson": "L3-4", "unit": "U3", "prompt_en": "What is the primary key of DEPT_LOCATIONS, the relation created by mapping DEPARTMENT's multivalued attribute Locations?", "choices_en": ["Dnumber", "Dlocation", "(Dnumber, Dlocation)", "A newly created Loc_id"]}, {"id": "3-mv-2", "concept": "map-multival", "type": "blank", "prompt": "다중값 속성 A는 별도 릴레이션 R로 만들고, 원래 릴레이션의 PK K를 R의 (a) 로 넣으며, (b) 조합을 R의 PK로 한다.", "answer": "(a) 외래 키 / (b) A와 K", "accept": [["외래 키", "FK", "foreign key", "외래키"], ["A와 K", "(A, K)", "A, K", "K와 A", "(K, A)", "A and K", "K and A"]], "lesson": "L3-4", "unit": "U3", "prompt_en": "A multivalued attribute A is mapped to a separate relation R; the PK K of the original relation is included in R as a(n) (a) , and the combination of (b) is the PK of R.", "answer_en": "(a) foreign key / (b) A and K"}, {"id": "3-mv-3", "concept": "map-multival", "type": "calc", "prompt": "EMPLOYEE(Ssn 키)에 다중값 속성 {Phone}과 {Skill}이 있다. 이 둘을 매핑한 릴레이션들을 PK, FK와 함께 쓰시오.", "answer": "EMP_PHONE(Ssn, Phone)  PK (Ssn, Phone), FK Ssn → EMPLOYEE\nEMP_SKILL(Ssn, Skill)  PK (Ssn, Skill), FK Ssn → EMPLOYEE\n(다중값 속성마다 별도 릴레이션)", "keys": ["다중값 속성마다 별도 릴레이션 2개", "PK = (Ssn, 속성)", "FK Ssn → EMPLOYEE"], "lesson": "L3-4", "unit": "U3", "prompt_en": "EMPLOYEE (key Ssn) has the multivalued attributes {Phone} and {Skill}. Write the relations that result from mapping these two, with their PKs and FKs.", "answer_en": "EMP_PHONE(Ssn, Phone)  PK (Ssn, Phone), FK Ssn → EMPLOYEE\nEMP_SKILL(Ssn, Skill)  PK (Ssn, Skill), FK Ssn → EMPLOYEE\n(a separate relation for each multivalued attribute)", "keys_en": ["Two separate relations, one per multivalued attribute", "PK = (Ssn, attribute)", "FK Ssn → EMPLOYEE"]}, {"id": "3-mv-4", "concept": "map-multival", "type": "ox", "prompt": "다중값 속성을 매핑한 릴레이션에서는 원래 개체의 키 값이 여러 투플에 반복된다.", "answer": true, "lesson": "L3-4", "unit": "U3", "prompt_en": "In a relation created by mapping a multivalued attribute, the key value of the original entity is repeated in several tuples."}, {"id": "3-mw-1", "concept": "map-weak", "type": "mc", "prompt": "약한 개체 DEPENDENT를 매핑한 릴레이션의 기본 키는?", "choices": ["Dependent_name", "(Essn, Dependent_name)", "Essn", "새 대리 키"], "answer": 1, "lesson": "L3-4", "unit": "U3", "prompt_en": "What is the primary key of the relation created by mapping the weak entity DEPENDENT?", "choices_en": ["Dependent_name", "(Essn, Dependent_name)", "Essn", "A new surrogate key"]}, {"id": "3-mw-2", "concept": "map-weak", "type": "ox", "prompt": "약한 개체를 매핑할 때 식별 관계 타입(DEPENDENTS_OF)은 별도 릴레이션으로 만든다.", "answer": false, "explain": "소유자 PK를 FK로 넣는 것 자체가 식별 관계의 매핑.", "lesson": "L3-4", "unit": "U3", "prompt_en": "When mapping a weak entity, the identifying relationship type (DEPENDENTS_OF) becomes a separate relation.", "explain_en": "Including the owner's PK as an FK is itself the mapping of the identifying relationship."}, {"id": "3-mw-3", "concept": "map-weak", "type": "short", "prompt": "약한 개체 타입 W를 매핑하는 절차를 쓰시오.", "answer": "W의 단순 속성(복합은 구성 속성)을 모두 포함하는 릴레이션 R을 만든다. 소유 개체 타입의 PK를 R에 FK로 넣는다(식별 관계의 매핑). 소유자 PK와 W의 부분 키를 합쳐 R의 PK로 한다.", "keys": ["단순 속성 포함", "소유자 PK를 FK로 (식별 관계 매핑)", "PK = 소유자 PK + 부분 키"], "lesson": "L3-4", "unit": "U3", "prompt_en": "Describe the procedure for mapping a weak entity type W.", "answer_en": "Create a relation R that includes all the simple attributes of W (component attributes for composites). Include the PK of the owner entity type in R as an FK (this is the mapping of the identifying relationship). The combination of the owner's PK and W's partial key is the PK of R.", "keys_en": ["Include the simple attributes", "Owner's PK as an FK (mapping of the identifying relationship)", "PK = owner's PK + partial key"]}, {"id": "3-mw-4", "concept": "map-weak", "type": "calc", "prompt": "BUILDING(Bname 키, Address)과 약한 개체 ROOM(부분 키 Room_no, Capacity, {Equipment})이 식별 관계 HAS로 연결되어 있다. 관계 스키마로 매핑하시오 (PK, FK 표시).", "answer": "BUILDING(Bname, Address)  PK Bname\nROOM(Bname, Room_no, Capacity)  PK (Bname, Room_no), FK Bname → BUILDING\nROOM_EQUIPMENT(Bname, Room_no, Equipment)  PK (Bname, Room_no, Equipment), FK (Bname, Room_no) → ROOM", "keys": ["ROOM PK (Bname, Room_no)", "ROOM.Bname FK", "다중값 Equipment는 별도 릴레이션, PK에 ROOM의 PK 전체 포함"], "slot": 11, "pts": 10, "lesson": "L3-4", "unit": "U3", "prompt_en": "BUILDING (key Bname, Address) and the weak entity ROOM (partial key Room_no, Capacity, {Equipment}) are related by the identifying relationship HAS. Map them to a relational schema (show PKs and FKs).", "keys_en": ["ROOM PK (Bname, Room_no)", "ROOM.Bname is an FK", "Multivalued Equipment becomes a separate relation whose PK includes ROOM's entire PK"]}, {"id": "3-m11-1", "concept": "map-11", "type": "mc", "prompt": "1:1 관계 MANAGES를 외래 키 방식으로 매핑할 때 FK를 넣기 좋은 쪽은?", "choices": ["부분 참여하는 EMPLOYEE", "전체 참여하는 DEPARTMENT", "어느 쪽이든 상관없음", "별도 릴레이션"], "answer": 1, "lesson": "L3-5", "unit": "U3", "prompt_en": "When mapping the 1:1 relationship MANAGES with the foreign key approach, which side is better for the FK?", "choices_en": ["EMPLOYEE, which has partial participation", "DEPARTMENT, which has total participation", "It does not matter", "A separate relation"]}, {"id": "3-m11-2", "concept": "map-11", "type": "short", "prompt": "1:1 관계를 외래 키 방식으로 매핑할 때 전체 참여 쪽에 FK를 넣는 게 나은 이유를 MANAGES 예로 쓰시오.", "answer": "전체 참여 쪽(DEPARTMENT)은 모든 투플이 관계에 참여하므로 FK(Mgr_ssn)에 항상 값이 있다. 반대로 부분 참여 쪽(EMPLOYEE)에 D_managed, Mgr_start_date를 넣으면 부서를 관리하지 않는 대부분의 사원이 NULL을 가져 낭비가 생긴다.", "keys": ["전체 참여 쪽은 NULL이 안 생김", "부분 참여 쪽에 넣으면 NULL이 많아짐"], "lesson": "L3-5", "unit": "U3", "prompt_en": "Using MANAGES as an example, explain why it is better to put the FK on the total-participation side when mapping a 1:1 relationship with the foreign key approach.", "answer_en": "On the total-participation side (DEPARTMENT), every tuple participates in the relationship, so the FK (Mgr_ssn) always has a value. Conversely, if D_managed and Mgr_start_date were put on the partial-participation side (EMPLOYEE), most employees, who do not manage a department, would have NULLs, which is wasteful.", "keys_en": ["No NULLs on the total-participation side", "Putting it on the partial-participation side causes many NULLs"]}, {"id": "3-m11-3", "concept": "map-11", "type": "mc", "prompt": "1:1 관계를 매핑하는 세 가지 방법이 아닌 것은?", "choices": ["외래 키 방식", "합병 릴레이션 방식", "교차 참조(관계 릴레이션) 방식", "다중값 속성 방식"], "answer": 3, "lesson": "L3-5", "unit": "U3", "prompt_en": "Which of the following is NOT one of the three approaches to mapping a 1:1 relationship?", "choices_en": ["Foreign key approach", "Merged relation approach", "Cross-reference (relationship relation) approach", "Multivalued attribute approach"]}, {"id": "3-m11-4", "concept": "map-11", "type": "ox", "prompt": "1:1 관계의 속성(예: Mgr_start_date)은 FK를 넣은 쪽 릴레이션에 함께 넣는다.", "answer": true, "lesson": "L3-5", "unit": "U3", "prompt_en": "An attribute of a 1:1 relationship (e.g., Mgr_start_date) is included in the same relation where the FK is placed."}, {"id": "3-m11-5", "concept": "map-11", "type": "calc", "prompt": "PERSON(Pid 키, Name)과 PASSPORT(Passport_no 키, Issue_date)가 1:1 관계 HOLDS로 연결된다. 모든 여권은 사람에게 속하지만(전체), 여권이 없는 사람도 있다(부분). 관계 속성 Since가 있다. 외래 키 방식으로 매핑하시오.", "answer": "PERSON(Pid, Name)\nPASSPORT(Passport_no, Issue_date, Pid, Since)  FK Pid → PERSON, Pid는 UNIQUE (1:1)\n전체 참여 쪽 PASSPORT에 FK를 넣어 NULL을 피한다.", "keys": ["FK를 PASSPORT(전체 참여)에", "관계 속성 Since도 PASSPORT에", "1:1이므로 FK에 UNIQUE"], "lesson": "L3-5", "unit": "U3", "prompt_en": "PERSON (key Pid, Name) and PASSPORT (key Passport_no, Issue_date) are related by the 1:1 relationship HOLDS. Every passport belongs to a person (total), but some people have no passport (partial). There is a relationship attribute Since. Map them using the foreign key approach.", "answer_en": "PERSON(Pid, Name)\nPASSPORT(Passport_no, Issue_date, Pid, Since)  FK Pid → PERSON, Pid is UNIQUE (1:1)\nThe FK is placed on PASSPORT, the total-participation side, to avoid NULLs.", "keys_en": ["FK on PASSPORT (total participation)", "Relationship attribute Since also on PASSPORT", "UNIQUE on the FK since it is 1:1"]}, {"id": "3-m11-6", "concept": "map-11", "type": "blank", "prompt": "1:1 관계 외래 키 방식: 한쪽 릴레이션 S를 골라 상대 T의 (a) 를 FK로 넣는다. S는 (b) 참여 쪽으로 고르는 게 좋다.", "answer": "(a) PK / (b) 전체", "accept": [["PK", "기본 키", "primary key", "기본키"], ["전체", "total", "전체 참여", "total participation"]], "lesson": "L3-5", "unit": "U3", "prompt_en": "1:1 relationship, foreign key approach: choose one relation S and include the (a) of the other relation T as an FK. It is better to choose the (b) participation side as S.", "answer_en": "(a) PK / (b) total"}, {"id": "3-m1n-1", "concept": "map-1n", "type": "mc", "prompt": "1:N 관계 WORKS_FOR(DEPARTMENT 1 : EMPLOYEE N)를 매핑하면 FK는 어디에?", "choices": ["EMPLOYEE에 Dno", "DEPARTMENT에 Essn", "별도 릴레이션에만", "둘 다"], "answer": 0, "lesson": "L3-5", "unit": "U3", "prompt_en": "When the 1:N relationship WORKS_FOR (DEPARTMENT 1 : EMPLOYEE N) is mapped, where does the FK go?", "choices_en": ["Dno in EMPLOYEE", "Essn in DEPARTMENT", "Only in a separate relation", "Both"]}, {"id": "3-m1n-2", "concept": "map-1n", "type": "short", "prompt": "1:N 관계를 매핑할 때 FK를 N쪽 릴레이션에 넣는 이유를 쓰시오.", "answer": "N쪽 개체 하나는 1쪽 개체 최대 하나와 연결되므로 FK 값 하나로 표현된다. 1쪽에 넣으면 한 투플이 여러 N쪽 개체를 참조해야 해서 다중값이 되고, 원자 값 원칙을 어긴다.", "keys": ["N쪽은 상대가 최대 하나 → FK 하나", "1쪽에 넣으면 다중값"], "lesson": "L3-5", "unit": "U3", "prompt_en": "Explain why the FK is placed in the N-side relation when mapping a 1:N relationship.", "answer_en": "One N-side entity is related to at most one 1-side entity, so it can be represented by a single FK value. If the FK were put on the 1-side, one tuple would have to reference several N-side entities, making it multivalued and violating the atomic-value rule.", "keys_en": ["The N-side has at most one partner → a single FK", "Putting it on the 1-side makes it multivalued"]}, {"id": "3-m1n-3", "concept": "map-1n", "type": "mc", "prompt": "SUPERVISION(순환 1:N)을 매핑한 결과는?", "choices": ["별도 릴레이션 SUPERVISION(Ssn, Super_ssn)이 꼭 필요", "DEPARTMENT에 Super_ssn", "EMPLOYEE에 Super_ssn (자기 참조 FK)", "매핑 불가"], "answer": 2, "lesson": "L3-5", "unit": "U3", "prompt_en": "What is the result of mapping SUPERVISION (recursive 1:N)?", "choices_en": ["A separate relation SUPERVISION(Ssn, Super_ssn) is required", "Super_ssn in DEPARTMENT", "Super_ssn in EMPLOYEE (a self-referencing FK)", "It cannot be mapped"]}, {"id": "3-m1n-4", "concept": "map-1n", "type": "ox", "prompt": "1:N 관계는 교차 참조(관계 릴레이션) 방식으로도 매핑할 수 있지만, 릴레이션 수가 줄어드는 외래 키 방식을 선호한다.", "answer": true, "lesson": "L3-5", "unit": "U3", "prompt_en": "A 1:N relationship can also be mapped with the cross-reference (relationship relation) approach, but the foreign key approach is preferred because it reduces the number of relations."}, {"id": "3-m1n-5", "concept": "map-1n", "type": "calc", "prompt": "DEPARTMENT(Dnumber 키)와 PROJECT(Pnumber 키)가 1:N 관계 CONTROLS(부서 1 : 프로젝트 N)로, PROJECT의 CONTROLS 참여는 전체이고 관계 속성 Since가 있다. 매핑 결과를 쓰시오.", "answer": "DEPARTMENT(Dname, Dnumber, …)\nPROJECT(Pname, Pnumber, Plocation, Dnum, Since)  FK Dnum → DEPARTMENT.Dnumber, Dnum NOT NULL (전체 참여)\n관계 속성 Since도 N쪽 PROJECT에.", "keys": ["FK Dnum을 PROJECT(N쪽)에", "Since도 PROJECT에", "전체 참여 → NOT NULL (선택)"], "lesson": "L3-5", "unit": "U3", "prompt_en": "DEPARTMENT (key Dnumber) and PROJECT (key Pnumber) are related by the 1:N relationship CONTROLS (department 1 : project N). PROJECT has total participation in CONTROLS, and there is a relationship attribute Since. Write the mapping result.", "answer_en": "DEPARTMENT(Dname, Dnumber, …)\nPROJECT(Pname, Pnumber, Plocation, Dnum, Since)  FK Dnum → DEPARTMENT.Dnumber, Dnum NOT NULL (total participation)\nThe relationship attribute Since also goes in PROJECT, the N-side.", "keys_en": ["FK Dnum in PROJECT (N-side)", "Since also in PROJECT", "Total participation → NOT NULL (optional)"]}, {"id": "3-m1n-6", "concept": "map-1n", "type": "blank", "prompt": "1:N 관계 외래 키 방식: (a) 쪽 릴레이션 S에 상대 릴레이션의 PK를 FK로 넣고, 관계의 단순 속성도 (b) 에 넣는다.", "answer": "(a) N / (b) S", "accept": [["N", "n", "N쪽", "다", "N-side", "many"], ["S", "N쪽", "N쪽 릴레이션", "s", "the N-side relation"]], "lesson": "L3-5", "unit": "U3", "prompt_en": "1:N relationship, foreign key approach: include the PK of the other relation as an FK in the relation S on the (a) side, and also include the simple attributes of the relationship in (b) ."}, {"id": "3-mmn-1", "concept": "map-mn", "type": "mc", "prompt": "M:N 관계를 매핑하는 방법은?", "choices": ["외래 키 방식", "합병 릴레이션 방식", "교차 참조(관계 릴레이션) 방식만", "다중값 속성으로"], "answer": 2, "lesson": "L3-5", "unit": "U3", "prompt_en": "How is an M:N relationship mapped?", "choices_en": ["Foreign key approach", "Merged relation approach", "Only the cross-reference (relationship relation) approach", "As a multivalued attribute"]}, {"id": "3-mmn-2", "concept": "map-mn", "type": "mc", "prompt": "WORKS_ON(EMPLOYEE M : PROJECT N, 속성 Hours)을 매핑한 릴레이션의 PK는?", "choices": ["Essn", "(Essn, Pno)", "(Essn, Pno, Hours)", "Pno"], "answer": 1, "lesson": "L3-5", "unit": "U3", "prompt_en": "What is the PK of the relation created by mapping WORKS_ON (EMPLOYEE M : PROJECT N, attribute Hours)?"}, {"id": "3-mmn-3", "concept": "map-mn", "type": "short", "prompt": "M:N 관계를 외래 키 하나로 표현할 수 없는 이유와 매핑 절차를 쓰시오.", "answer": "양쪽 개체 모두 상대 개체 여러 개와 연결되므로 어느 쪽에 FK를 넣어도 다중값이 된다. 그래서 별도 관계 릴레이션 S를 만들고, 참여 개체 릴레이션들의 PK를 FK로 넣고, FK들의 조합을 PK로 하며, 관계의 단순 속성도 S에 넣는다.", "keys": ["양쪽 다 여러 개 → FK 하나로 불가", "별도 관계 릴레이션", "PK = FK들의 조합", "관계 속성 포함"], "lesson": "L3-5", "unit": "U3", "prompt_en": "Explain why an M:N relationship cannot be represented by a single foreign key, and describe the mapping procedure.", "answer_en": "Entities on both sides are related to many entities on the other side, so whichever side the FK is put on, it becomes multivalued. Therefore, create a separate relationship relation S, include the PKs of the participating entity relations as FKs, make the combination of the FKs the PK, and also include the simple attributes of the relationship in S.", "keys_en": ["Both sides have many → a single FK is impossible", "Separate relationship relation", "PK = combination of the FKs", "Include the relationship attributes"]}, {"id": "3-mmn-4", "concept": "map-mn", "type": "calc", "prompt": "STUDENT(Sid 키)와 COURSE(Cid 키)가 M:N 관계 ENROLLS(속성 Grade, Semester)로 연결된다. 한 학생이 같은 과목을 다른 학기에 다시 들을 수 있다. 매핑하시오.", "answer": "STUDENT(Sid, …), COURSE(Cid, …)\nENROLLS(Sid, Cid, Semester, Grade)  FK Sid → STUDENT, FK Cid → COURSE\nPK (Sid, Cid, Semester): 재수강 때문에 (Sid, Cid)만으로는 유일하지 않아 Semester까지 포함", "keys": ["별도 릴레이션 ENROLLS", "FK 2개", "PK에 Semester 포함 (재수강)", "Grade 포함"], "slot": 11, "pts": 10, "lesson": "L3-5", "unit": "U3", "prompt_en": "STUDENT (key Sid) and COURSE (key Cid) are related by the M:N relationship ENROLLS (attributes Grade, Semester). A student may take the same course again in a different semester. Map them.", "answer_en": "STUDENT(Sid, …), COURSE(Cid, …)\nENROLLS(Sid, Cid, Semester, Grade)  FK Sid → STUDENT, FK Cid → COURSE\nPK (Sid, Cid, Semester): because of retakes, (Sid, Cid) alone is not unique, so Semester is included", "keys_en": ["Separate relation ENROLLS", "Two FKs", "Semester included in the PK (retakes)", "Grade included"]}, {"id": "3-mmn-5", "concept": "map-mn", "type": "ox", "prompt": "M:N 관계 릴레이션(예: WORKS_ON)을 lookup table이라고도 부른다.", "answer": true, "lesson": "L3-5", "unit": "U3", "prompt_en": "An M:N relationship relation (e.g., WORKS_ON) is also called a lookup table."}, {"id": "3-mmn-6", "concept": "map-mn", "type": "blank", "prompt": "M:N 관계 매핑: 별도 릴레이션 S를 만들고, 참여 릴레이션의 (a) 들을 FK로 넣으며, 그 FK들의 (b) 을 S의 PK로 한다.", "answer": "(a) PK / (b) 조합", "accept": [["PK", "기본 키", "기본키", "primary key"], ["조합", "combination", "결합"]], "lesson": "L3-5", "unit": "U3", "prompt_en": "M:N relationship mapping: create a separate relation S, include the (a) of the participating relations as FKs, and make the (b) of those FKs the PK of S.", "answer_en": "(a) PK / (b) combination"}, {"id": "3-mna-1", "concept": "map-nary", "type": "mc", "prompt": "3진 관계 SUPPLY(SUPPLIER, PROJECT, PART, 속성 Quantity)를 매핑한 결과는?", "choices": ["SUPPLIER에 FK 두 개", "SUPPLY(Sname, Proj_name, Part_no, Quantity), PK = 세 FK의 조합", "PART에 FK", "매핑 불가"], "answer": 1, "lesson": "L3-5", "unit": "U3", "prompt_en": "What is the result of mapping the ternary relationship SUPPLY (SUPPLIER, PROJECT, PART, attribute Quantity)?", "choices_en": ["Two FKs in SUPPLIER", "SUPPLY(Sname, Proj_name, Part_no, Quantity), PK = combination of the three FKs", "An FK in PART", "It cannot be mapped"]}, {"id": "3-mna-2", "concept": "map-nary", "type": "ox", "prompt": "n진 관계는 M:N과 같은 교차 참조 방식으로 매핑한다.", "answer": true, "lesson": "L3-5", "unit": "U3", "prompt_en": "An n-ary relationship is mapped with the same cross-reference approach as M:N."}, {"id": "3-mna-3", "concept": "map-nary", "type": "short", "prompt": "n진 관계 타입의 매핑 절차를 쓰시오.", "answer": "관계를 나타내는 별도 릴레이션 S를 만들고, n개 참여 개체 릴레이션의 PK를 FK로 넣으며, 보통 FK 전부의 조합을 PK로 하고, 관계의 단순 속성도 S에 넣는다.", "keys": ["별도 릴레이션", "n개 PK를 FK로", "FK 조합을 PK로", "관계 속성 포함"], "lesson": "L3-5", "unit": "U3", "prompt_en": "Describe the procedure for mapping an n-ary relationship type.", "answer_en": "Create a separate relation S to represent the relationship, include the PKs of the n participating entity relations as FKs, usually make the combination of all the FKs the PK, and also include the simple attributes of the relationship in S.", "keys_en": ["Separate relation", "n PKs as FKs", "Combination of the FKs as the PK", "Include the relationship attributes"]}, {"id": "3-mna-4", "concept": "map-nary", "type": "calc", "prompt": "DOCTOR(Did), PATIENT(Pid), DRUG(Drug_code)가 3진 관계 PRESCRIBES(속성 Date, Dosage)로 연결된다. 매핑하시오.", "answer": "PRESCRIBES(Did, Pid, Drug_code, Date, Dosage)\nFK Did → DOCTOR, Pid → PATIENT, Drug_code → DRUG\nPK (Did, Pid, Drug_code) (같은 처방을 여러 날 하면 Date까지 포함)", "keys": ["별도 릴레이션 PRESCRIBES", "FK 3개", "PK = 세 FK 조합", "Date, Dosage 포함"], "lesson": "L3-5", "unit": "U3", "prompt_en": "DOCTOR(Did), PATIENT(Pid) and DRUG(Drug_code) are related by the ternary relationship PRESCRIBES (attributes Date, Dosage). Map them.", "answer_en": "PRESCRIBES(Did, Pid, Drug_code, Date, Dosage)\nFK Did → DOCTOR, Pid → PATIENT, Drug_code → DRUG\nPK (Did, Pid, Drug_code) (include Date as well if the same prescription can be made on several days)", "keys_en": ["Separate relation PRESCRIBES", "Three FKs", "PK = combination of the three FKs", "Date, Dosage included"]}, {"id": "3-ms-1", "concept": "map-summary", "type": "mc", "prompt": "ER→관계 대응에서 '다중값 속성'에 해당하는 것은?", "choices": ["속성", "도메인", "릴레이션과 외래 키", "기본 키"], "answer": 2, "lesson": "L3-5", "unit": "U3", "prompt_en": "In the ER-to-relational correspondence, what does a 'multivalued attribute' correspond to?", "choices_en": ["Attribute", "Domain", "Relation and foreign key", "Primary key"]}, {"id": "3-ms-2", "concept": "map-summary", "type": "mc", "prompt": "ER→관계 대응에서 '값 집합(value set)'에 해당하는 것은?", "choices": ["릴레이션", "도메인", "외래 키", "후보 키"], "answer": 1, "lesson": "L3-5", "unit": "U3", "prompt_en": "In the ER-to-relational correspondence, what does a 'value set' correspond to?", "choices_en": ["Relation", "Domain", "Foreign key", "Candidate key"]}, {"id": "3-ms-3", "concept": "map-summary", "type": "blank", "prompt": "M:N 관계 타입은 관계 릴레이션과 FK (a) 개로, n진 관계 타입은 관계 릴레이션과 FK (b) 개로 대응된다.", "answer": "(a) 2 / (b) n", "accept": [["2", "두", "둘", "two"], ["n", "N", "n개"]], "lesson": "L3-5", "unit": "U3", "prompt_en": "An M:N relationship type corresponds to a relationship relation and (a) FKs, and an n-ary relationship type corresponds to a relationship relation and (b) FKs."}, {"id": "3-ms-4", "concept": "map-summary", "type": "calc", "prompt": "다음 ER 스키마를 관계 스키마로 매핑하시오 (PK, FK 표시).\n• COLLEGE(CName 키, COffice, CPhone)\n• INSTRUCTOR(Id 키, IName, Rank)\n• DEAN: COLLEGE (1,1) — INSTRUCTOR (0,1), 1:1\n• DEPT(DCode 키, DName)\n• ADMINS: COLLEGE (0,N) — DEPT (1,1), 1:N\n• EMPLOYS: DEPT (0,N) — INSTRUCTOR (1,1), 1:N\n• STUDENT(Sid 키, SName, {Phone})\n• TAKES: STUDENT M:N SECTION(SecId 키), 속성 Grade", "answer": "COLLEGE(CName, COffice, CPhone, DeanId)  FK DeanId → INSTRUCTOR.Id (1:1, 전체 참여 쪽 COLLEGE에)\nINSTRUCTOR(Id, IName, Rank, DCode)  FK DCode → DEPT (EMPLOYS, N쪽)\nDEPT(DCode, DName, CName)  FK CName → COLLEGE (ADMINS, N쪽)\nSTUDENT(Sid, SName)\nSTUDENT_PHONE(Sid, Phone)  PK (Sid, Phone), FK Sid → STUDENT\nSECTION(SecId, …)\nTAKES(Sid, SecId, Grade)  PK (Sid, SecId), FK Sid → STUDENT, SecId → SECTION", "keys": ["DEAN → COLLEGE에 FK", "EMPLOYS → INSTRUCTOR에 DCode", "ADMINS → DEPT에 CName", "Phone → 별도 릴레이션", "TAKES 관계 릴레이션, PK (Sid, SecId), Grade"], "slot": 11, "pts": 10, "lesson": "L3-5", "unit": "U3", "prompt_en": "Map the following ER schema to a relational schema (show PKs and FKs).\n• COLLEGE(CName key, COffice, CPhone)\n• INSTRUCTOR(Id key, IName, Rank)\n• DEAN: COLLEGE (1,1) — INSTRUCTOR (0,1), 1:1\n• DEPT(DCode key, DName)\n• ADMINS: COLLEGE (0,N) — DEPT (1,1), 1:N\n• EMPLOYS: DEPT (0,N) — INSTRUCTOR (1,1), 1:N\n• STUDENT(Sid key, SName, {Phone})\n• TAKES: STUDENT M:N SECTION(SecId key), attribute Grade", "answer_en": "COLLEGE(CName, COffice, CPhone, DeanId)  FK DeanId → INSTRUCTOR.Id (1:1, in COLLEGE, the total-participation side)\nINSTRUCTOR(Id, IName, Rank, DCode)  FK DCode → DEPT (EMPLOYS, N-side)\nDEPT(DCode, DName, CName)  FK CName → COLLEGE (ADMINS, N-side)\nSTUDENT(Sid, SName)\nSTUDENT_PHONE(Sid, Phone)  PK (Sid, Phone), FK Sid → STUDENT\nSECTION(SecId, …)\nTAKES(Sid, SecId, Grade)  PK (Sid, SecId), FK Sid → STUDENT, SecId → SECTION", "keys_en": ["DEAN → FK in COLLEGE", "EMPLOYS → DCode in INSTRUCTOR", "ADMINS → CName in DEPT", "Phone → separate relation", "TAKES relationship relation, PK (Sid, SecId), Grade"]}, {"id": "3-ms-5", "concept": "map-summary", "type": "calc", "prompt": "COMPANY ER 다이어그램(교안 2 p.45)을 관계 스키마로 매핑한 결과 6개 릴레이션을 쓰고, 각 관계 타입·다중값 속성·약한 개체가 어디로 갔는지 쓰시오.", "answer": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\n\nMANAGES(1:1) → DEPARTMENT.Mgr_ssn, Mgr_start_date / WORKS_FOR(1:N) → EMPLOYEE.Dno / SUPERVISION(1:N) → EMPLOYEE.Super_ssn / CONTROLS(1:N) → PROJECT.Dnum / WORKS_ON(M:N) → 관계 릴레이션 WORKS_ON / 다중값 Locations → DEPT_LOCATIONS / 약한 개체 DEPENDENT → PK (Essn, Dependent_name)", "keys": ["6개 릴레이션", "1:1, 1:N은 FK로 (Mgr_ssn, Dno, Super_ssn, Dnum)", "WORKS_ON 관계 릴레이션", "DEPT_LOCATIONS", "DEPENDENT PK (Essn, Dependent_name)"], "slot": 11, "pts": 10, "lesson": "L3-5", "unit": "U3", "prompt_en": "Map the COMPANY ER diagram (lecture slides 2 p.45) to a relational schema: write the resulting six relations, and state where each relationship type, the multivalued attribute and the weak entity went.", "answer_en": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\n\nMANAGES(1:1) → DEPARTMENT.Mgr_ssn, Mgr_start_date / WORKS_FOR(1:N) → EMPLOYEE.Dno / SUPERVISION(1:N) → EMPLOYEE.Super_ssn / CONTROLS(1:N) → PROJECT.Dnum / WORKS_ON(M:N) → relationship relation WORKS_ON / multivalued Locations → DEPT_LOCATIONS / weak entity DEPENDENT → PK (Essn, Dependent_name)", "keys_en": ["6 relations", "1:1 and 1:N become FKs (Mgr_ssn, Dno, Super_ssn, Dnum)", "WORKS_ON relationship relation", "DEPT_LOCATIONS", "DEPENDENT PK (Essn, Dependent_name)"]}, {"id": "3-ms-6", "concept": "map-summary", "type": "ox", "prompt": "ER 모델의 키 속성은 관계 모델에서 기본 키(또는 보조 키)가 된다.", "answer": true, "lesson": "L3-5", "unit": "U3", "prompt_en": "A key attribute in the ER model becomes a primary key (or secondary key) in the relational model."}, {"id": "4-int-1", "concept": "sql-intro", "type": "mc", "prompt": "SQL에 대한 설명으로 옳은 것은?", "choices": ["절차적 언어로, 데이터를 어떻게 가져올지 기술한다", "선언적 언어로, 원래 이름은 SEQUEL이다", "IBM이 아니라 Oracle이 처음 만들었다", "DDL만 제공한다"], "answer": 1, "lesson": "L4-1", "unit": "U4", "prompt_en": "Which statement about SQL is correct?", "choices_en": ["It is a procedural language that describes how to retrieve the data", "It is a declarative language, originally called SEQUEL", "It was first created by Oracle, not IBM", "It provides only DDL"]}, {"id": "4-int-2", "concept": "sql-intro", "type": "mc", "prompt": "다음 중 DML 명령이 '아닌' 것은?", "choices": ["SELECT", "INSERT", "ALTER TABLE", "UPDATE"], "answer": 2, "lesson": "L4-1", "unit": "U4", "prompt_en": "Which of the following is NOT a DML command?"}, {"id": "4-int-3", "concept": "sql-intro", "type": "short", "prompt": "NL2SQL이 무엇인지 쓰고, 어려운 점을 두 가지 이상 쓰시오.", "answer": "자연어 질의를 SQL 질의로 바꿔 DB에서 원하는 데이터를 가져오는 기술. 어려운 점: 자연어의 모호성, 스키마 이해와 연결(schema linking), 처음 보는 DB로의 일반화, 복잡한 질의 생성. (그래서 LLM 기반 방법도 완벽하지 않고 SQL을 이해하는 게 중요)", "keys": ["자연어 → SQL 변환", "모호성", "스키마 이해·연결", "일반화 / 복잡한 질의"], "lesson": "L4-1", "unit": "U4", "prompt_en": "Explain what NL2SQL is, and give at least two of its challenges.", "answer_en": "A technology that translates natural-language queries into SQL queries to retrieve the desired data from a database. Challenges: ambiguity of natural language, schema understanding and linking (schema linking), generalization to unseen databases, generating complex queries. (So even LLM-based methods are not perfect, and understanding SQL properly matters.)", "keys_en": ["Natural language → SQL translation", "Ambiguity", "Schema understanding and linking", "Generalization / complex queries"]}, {"id": "4-int-4", "concept": "sql-intro", "type": "blank", "prompt": "SQL에서 (a) 은 DB와 테이블에 대한 명령(CREATE, ALTER, DROP), (b) 은 투플에 대한 명령(SELECT, INSERT, DELETE, UPDATE)을 제공한다.", "answer": "(a) DDL / (b) DML", "accept": [["DDL", "데이터 정의어", "data definition language", "Data Definition Language"], ["DML", "데이터 조작어", "data manipulation language", "Data Manipulation Language"]], "lesson": "L4-1", "unit": "U4", "prompt_en": "In SQL, (a) provides commands on databases and tables (CREATE, ALTER, DROP), and (b) provides commands on tuples (SELECT, INSERT, DELETE, UPDATE)."}, {"id": "4-ct-1", "concept": "create-table", "type": "mc", "prompt": "CREATE SCHEMA COMPANY AUTHORIZATION 'Jsmith'; 에서 'Jsmith'는?", "choices": ["스키마를 소유한 사용자(권한 식별자)", "스키마 이름", "DB 이름", "비밀번호"], "answer": 0, "lesson": "L4-1", "unit": "U4", "prompt_en": "In CREATE SCHEMA COMPANY AUTHORIZATION 'Jsmith'; what is 'Jsmith'?", "choices_en": ["The user who owns the schema (authorization identifier)", "The schema name", "The database name", "A password"]}, {"id": "4-ct-2", "concept": "create-table", "type": "ox", "prompt": "CREATE TABLE COMPANY.EMPLOYEE 처럼 테이블 이름 앞에 스키마 이름을 붙일 수 있다.", "answer": true, "lesson": "L4-1", "unit": "U4", "prompt_en": "A table name can be prefixed with the schema name, as in CREATE TABLE COMPANY.EMPLOYEE."}, {"id": "4-ct-3", "concept": "create-table", "type": "calc", "prompt": "다음 릴레이션을 CREATE TABLE로 정의하시오. PK와 FK, NOT NULL을 지정할 것.\nPROJECT(Pname VARCHAR(15) 필수·고유, Pnumber INT 기본 키, Plocation VARCHAR(15), Dnum INT 필수, DEPARTMENT(Dnumber) 참조)", "answer": "CREATE TABLE PROJECT\n( Pname      VARCHAR(15)  NOT NULL,\n  Pnumber    INT          NOT NULL,\n  Plocation  VARCHAR(15),\n  Dnum       INT          NOT NULL,\n  PRIMARY KEY (Pnumber),\n  UNIQUE (Pname),\n  FOREIGN KEY (Dnum) REFERENCES DEPARTMENT(Dnumber) );", "keys": ["PRIMARY KEY (Pnumber)", "UNIQUE (Pname)", "FOREIGN KEY (Dnum) REFERENCES DEPARTMENT(Dnumber)", "NOT NULL"], "lesson": "L4-1", "unit": "U4", "prompt_en": "Define the following relation with CREATE TABLE. Specify the PK, FK and NOT NULL.\nPROJECT(Pname VARCHAR(15) required and unique, Pnumber INT primary key, Plocation VARCHAR(15), Dnum INT required, references DEPARTMENT(Dnumber))"}, {"id": "4-ct-4", "concept": "create-table", "type": "calc", "prompt": "WORKS_ON(Essn CHAR(9), Pno INT, Hours DECIMAL(3,1))을 CREATE TABLE로 정의하시오. PK는 (Essn, Pno), Essn은 EMPLOYEE(Ssn), Pno는 PROJECT(Pnumber)를 참조한다.", "answer": "CREATE TABLE WORKS_ON\n( Essn   CHAR(9)       NOT NULL,\n  Pno    INT           NOT NULL,\n  Hours  DECIMAL(3,1),\n  PRIMARY KEY (Essn, Pno),\n  FOREIGN KEY (Essn) REFERENCES EMPLOYEE(Ssn),\n  FOREIGN KEY (Pno)  REFERENCES PROJECT(Pnumber) );", "keys": ["복합 PK (Essn, Pno)", "FK 두 개", "PK 속성 NOT NULL (생략해도 암묵적)"], "lesson": "L4-1", "unit": "U4", "prompt_en": "Define WORKS_ON(Essn CHAR(9), Pno INT, Hours DECIMAL(3,1)) with CREATE TABLE. The PK is (Essn, Pno); Essn references EMPLOYEE(Ssn) and Pno references PROJECT(Pnumber).", "keys_en": ["Composite PK (Essn, Pno)", "Two FKs", "PK attributes NOT NULL (implicit even if omitted)"]}, {"id": "4-ac-1", "concept": "attr-constraints", "type": "mc", "prompt": "PK 속성에 대한 설명으로 옳은 것은?", "choices": ["NULL을 허용한다", "NOT NULL이 암묵적으로 적용된다", "DEFAULT가 반드시 필요하다", "UNIQUE를 따로 써야 한다"], "answer": 1, "lesson": "L4-1", "unit": "U4", "prompt_en": "Which statement about PK attributes is correct?", "choices_en": ["They allow NULL", "NOT NULL is applied implicitly", "A DEFAULT is always required", "UNIQUE must be written separately"]}, {"id": "4-ac-2", "concept": "attr-constraints", "type": "ox", "prompt": "DEFAULT 값은 INSERT에서 그 속성 값을 명시하지 않았을 때 새 투플에 들어간다.", "answer": true, "lesson": "L4-1", "unit": "U4", "prompt_en": "A DEFAULT value is placed in a new tuple when the INSERT does not specify a value for that attribute."}, {"id": "4-ac-3", "concept": "attr-constraints", "type": "blank", "prompt": "새 사원의 기본 부서를 1로 하려면 Dno INT NOT NULL (a) 1 이라고 쓴다. PK 속성에는 (b) 이 암묵적으로 적용된다.", "answer": "(a) DEFAULT / (b) NOT NULL", "accept": [["DEFAULT", "default"], ["NOT NULL", "not null", "notnull"]], "lesson": "L4-1", "unit": "U4", "prompt_en": "To make a new employee's default department 1, write Dno INT NOT NULL (a) 1. (b) is implicitly applied to PK attributes."}, {"id": "4-ac-4", "concept": "attr-constraints", "type": "short", "prompt": "NOT NULL과 DEFAULT 제약을 각각 설명하고, 둘의 관계가 INSERT에 어떤 영향을 주는지 쓰시오.", "answer": "NOT NULL: 그 속성 값은 NULL일 수 없음(PK에는 암묵적). DEFAULT <값>: 값을 명시하지 않으면 기본값이 들어감. 속성 이름을 명시하는 INSERT에서는 NOT NULL이면서 DEFAULT가 없는 속성은 반드시 값을 줘야 한다 (DEFAULT가 있으면 생략 가능).", "keys": ["NOT NULL 정의", "DEFAULT 정의", "NOT NULL + DEFAULT 없음 → INSERT에 반드시 포함"], "lesson": "L4-1", "unit": "U4", "prompt_en": "Explain the NOT NULL and DEFAULT constraints, and how the two together affect INSERT.", "answer_en": "NOT NULL: the attribute's value cannot be NULL (implicit for the PK). DEFAULT <value>: if no value is given, the default value is used. In an INSERT that lists attribute names, an attribute that is NOT NULL and has no DEFAULT must be given a value (it may be omitted if it has a DEFAULT).", "keys_en": ["Definition of NOT NULL", "Definition of DEFAULT", "NOT NULL + no DEFAULT → must be included in INSERT"]}, {"id": "4-kc-1", "concept": "key-clauses", "type": "mc", "prompt": "CREATE TABLE에서 후보 키(대체 키)를 지정하는 절은?", "choices": ["PRIMARY KEY", "FOREIGN KEY", "UNIQUE", "CHECK"], "answer": 2, "lesson": "L4-1", "unit": "U4", "prompt_en": "Which clause in CREATE TABLE specifies a candidate key (alternate key)?"}, {"id": "4-kc-2", "concept": "key-clauses", "type": "mc", "prompt": "참조되는 PK가 삭제·갱신되어 참조 무결성이 깨질 때 SQL의 기본 동작은?", "choices": ["그 연산을 거부(reject)", "FK를 NULL로", "참조하는 투플도 삭제", "FK를 기본값으로"], "answer": 0, "lesson": "L4-1", "unit": "U4", "prompt_en": "When a referenced PK is deleted or updated and referential integrity would be violated, what is SQL's default action?", "choices_en": ["Reject the operation", "Set the FK to NULL", "Delete the referencing tuples too", "Set the FK to its default value"]}, {"id": "4-kc-3", "concept": "key-clauses", "type": "ox", "prompt": "CONSTRAINT DEPTPK PRIMARY KEY (Dnumber) 처럼 제약에 이름을 붙이면 나중에 ALTER TABLE ... DROP CONSTRAINT로 지울 수 있다.", "answer": true, "lesson": "L4-1", "unit": "U4", "prompt_en": "If a constraint is given a name, as in CONSTRAINT DEPTPK PRIMARY KEY (Dnumber), it can later be dropped with ALTER TABLE ... DROP CONSTRAINT."}, {"id": "4-kc-4", "concept": "key-clauses", "type": "calc", "prompt": "DEPARTMENT를 CREATE TABLE로 정의하시오: Dname VARCHAR(15) 필수·고유, Dnumber INT 기본 키, Mgr_ssn CHAR(9) 필수, EMPLOYEE(Ssn) 참조, Mgr_start_date DATE. 제약마다 이름(DEPTPK, DEPTSK, DEPTMGRFK)을 붙일 것.", "answer": "CREATE TABLE DEPARTMENT\n( Dname           VARCHAR(15)  NOT NULL,\n  Dnumber         INT          NOT NULL,\n  Mgr_ssn         CHAR(9)      NOT NULL,\n  Mgr_start_date  DATE,\n  CONSTRAINT DEPTPK    PRIMARY KEY (Dnumber),\n  CONSTRAINT DEPTSK    UNIQUE (Dname),\n  CONSTRAINT DEPTMGRFK FOREIGN KEY (Mgr_ssn) REFERENCES EMPLOYEE(Ssn) );", "keys": ["CONSTRAINT 이름 PRIMARY KEY", "UNIQUE (Dname)", "FOREIGN KEY ... REFERENCES EMPLOYEE(Ssn)"], "lesson": "L4-1", "unit": "U4", "prompt_en": "Define DEPARTMENT with CREATE TABLE: Dname VARCHAR(15) required and unique, Dnumber INT primary key, Mgr_ssn CHAR(9) required, references EMPLOYEE(Ssn), Mgr_start_date DATE. Give each constraint a name (DEPTPK, DEPTSK, DEPTMGRFK).", "keys_en": ["CONSTRAINT name PRIMARY KEY", "UNIQUE (Dname)", "FOREIGN KEY ... REFERENCES EMPLOYEE(Ssn)"]}, {"id": "4-ra-1", "concept": "ref-actions", "type": "mc", "prompt": "EMPSUPERFK FOREIGN KEY (Super_ssn) REFERENCES EMPLOYEE(Ssn) ON DELETE SET NULL 일 때, 상사 Wong이 삭제되면?", "choices": ["Wong의 부하들도 삭제", "Wong의 부하들의 Super_ssn이 NULL로", "삭제가 거부됨", "Super_ssn이 기본값으로"], "answer": 1, "lesson": "L4-2", "unit": "U4", "prompt_en": "Given EMPSUPERFK FOREIGN KEY (Super_ssn) REFERENCES EMPLOYEE(Ssn) ON DELETE SET NULL, what happens when the supervisor Wong is deleted?", "choices_en": ["Wong's subordinates are deleted too", "The Super_ssn of Wong's subordinates is set to NULL", "The deletion is rejected", "Super_ssn is set to its default value"]}, {"id": "4-ra-2", "concept": "ref-actions", "type": "mc", "prompt": "ON UPDATE CASCADE의 동작은?", "choices": ["참조하는 투플을 삭제", "참조하는 FK를 NULL로", "참조하는 FK를 새 PK 값으로 바꿈", "갱신을 거부"], "answer": 2, "lesson": "L4-2", "unit": "U4", "prompt_en": "What does ON UPDATE CASCADE do?", "choices_en": ["Deletes the referencing tuples", "Sets the referencing FK to NULL", "Changes the referencing FK to the new PK value", "Rejects the update"]}, {"id": "4-ra-3", "concept": "ref-actions", "type": "ox", "prompt": "ON DELETE CASCADE는 참조되던 투플이 삭제되면 그것을 참조하던 투플도 삭제한다.", "answer": true, "lesson": "L4-2", "unit": "U4", "prompt_en": "ON DELETE CASCADE deletes the referencing tuples when the referenced tuple is deleted."}, {"id": "4-ra-4", "concept": "ref-actions", "type": "calc", "prompt": "EMPSUPERFK를 ON DELETE CASCADE로 바꾼 뒤(다른 FK는 고려하지 않음) COMPANY 상태에서\nDELETE FROM EMPLOYEE WHERE Lname = 'Borg';\n를 실행하면 EMPLOYEE에서 어떤 투플들이 어떤 순서로 삭제되는지 쓰시오.", "answer": "1) Borg(888665555) 삭제\n2) Super_ssn = 888665555인 Wong(333445555), Wallace(987654321) 연쇄 삭제\n3) Super_ssn = 333445555인 Smith, Narayan, English와 Super_ssn = 987654321인 Zelaya, Jabbar 연쇄 삭제\n→ EMPLOYEE 8개 투플 전부 삭제 (CASCADE는 재귀적으로 전파)", "explain": "실제 COMPANY에서는 WORKS_ON.Essn 등이 기본 동작(거부)이면 이 DELETE 자체가 거부된다.", "keys": ["Borg → Wong, Wallace", "→ Smith, Narayan, English, Zelaya, Jabbar", "결국 8개 전부 (재귀 전파)"], "slot": 9, "pts": 5, "lesson": "L4-2", "unit": "U4", "prompt_en": "Suppose EMPSUPERFK is changed to ON DELETE CASCADE (ignore the other FKs). On the COMPANY state, if\nDELETE FROM EMPLOYEE WHERE Lname = 'Borg';\nis executed, which EMPLOYEE tuples are deleted, and in what order?", "answer_en": "1) Borg (888665555) is deleted\n2) Wong (333445555) and Wallace (987654321), whose Super_ssn = 888665555, are deleted in a chain\n3) Smith, Narayan, English (Super_ssn = 333445555) and Zelaya, Jabbar (Super_ssn = 987654321) are deleted in a chain\n→ All 8 EMPLOYEE tuples are deleted (CASCADE propagates recursively)", "explain_en": "In the real COMPANY database, if WORKS_ON.Essn and the other FKs use the default action (reject), this DELETE itself is rejected.", "keys_en": ["Borg → Wong, Wallace", "→ Smith, Narayan, English, Zelaya, Jabbar", "In the end all 8 (recursive propagation)"]}, {"id": "4-ra-5", "concept": "ref-actions", "type": "short", "prompt": "LIBRARY DB에서 BOOK_LOANS.Card_no → BORROWER.Card_no의 ON DELETE, ON UPDATE 동작을 고르고 이유를 쓰시오.", "answer": "ON DELETE REJECT: 도서관은 보통 회원이 대출한 책을 다 반납(또는 변상)하기 전엔 탈퇴를 허용하지 않으므로, 대출 기록이 있는 회원 삭제를 거부. ON UPDATE CASCADE: 회원 카드 번호가 바뀌면 대출 기록도 따라 바꿔야 누가 빌렸는지 추적할 수 있음.", "keys": ["ON DELETE REJECT + 이유", "ON UPDATE CASCADE + 이유"], "slot": 9, "pts": 5, "lesson": "L4-2", "unit": "U4", "prompt_en": "In the LIBRARY database, choose the ON DELETE and ON UPDATE actions for BOOK_LOANS.Card_no → BORROWER.Card_no and give your reasons.", "answer_en": "ON DELETE REJECT: a library usually does not let a borrower leave until all borrowed books are returned (or paid for), so deleting a borrower who still has loan records is rejected. ON UPDATE CASCADE: if a borrower's card number changes, the loan records must follow it so we can still trace who borrowed each book.", "keys_en": ["ON DELETE REJECT + reason", "ON UPDATE CASCADE + reason"]}, {"id": "4-ra-6", "concept": "ref-actions", "type": "short", "prompt": "LIBRARY DB에서 BOOK_COPIES.Branch_id → LIBRARY_BRANCH.Branch_id에 ON DELETE CASCADE가 적절한 이유를 쓰시오.", "answer": "LIBRARY_BRANCH 투플 삭제는 실제로 그 지점이 문을 닫는 것을 뜻하므로, 그 지점의 책 사본들을 더 이상 추적할 필요가 없다. 따라서 참조하는 BOOK_COPIES 투플도 함께 삭제하는 CASCADE가 맞다.", "keys": ["지점 삭제 = 폐점", "사본 추적 불필요 → 함께 삭제"], "slot": 9, "pts": 5, "lesson": "L4-2", "unit": "U4", "prompt_en": "In the LIBRARY database, explain why ON DELETE CASCADE is appropriate for BOOK_COPIES.Branch_id → LIBRARY_BRANCH.Branch_id.", "answer_en": "Deleting a LIBRARY_BRANCH tuple actually means that the branch closes, so its book copies no longer need to be tracked. Therefore CASCADE, which also deletes the referencing BOOK_COPIES tuples, is appropriate.", "keys_en": ["Deleting a branch = the branch closes", "No need to track its copies → delete them too"]}, {"id": "4-ra-7", "concept": "ref-actions", "type": "blank", "prompt": "참조 트리거 동작에서 트리거는 ON DELETE와 ON (a), 동작은 SET NULL, (b), SET DEFAULT이다.", "answer": "(a) UPDATE / (b) CASCADE", "accept": [["UPDATE", "update"], ["CASCADE", "cascade"]], "lesson": "L4-2", "unit": "U4", "prompt_en": "In referential triggered actions, the triggers are ON DELETE and ON (a), and the actions are SET NULL, (b) and SET DEFAULT."}, {"id": "4-ra-8", "concept": "ref-actions", "type": "mc", "prompt": "EMPDEPTFK FOREIGN KEY (Dno) REFERENCES DEPARTMENT(Dnumber) ON DELETE SET DEFAULT 이고 Dno의 DEFAULT가 1일 때, 4번 부서가 삭제되면?", "choices": ["4번 부서 사원들도 삭제", "4번 부서 사원들의 Dno가 NULL", "삭제 거부", "4번 부서 사원들의 Dno가 1로"], "answer": 3, "lesson": "L4-2", "unit": "U4", "prompt_en": "Given EMPDEPTFK FOREIGN KEY (Dno) REFERENCES DEPARTMENT(Dnumber) ON DELETE SET DEFAULT, and the DEFAULT of Dno is 1, what happens when department 4 is deleted?", "choices_en": ["The employees of department 4 are deleted too", "The Dno of the employees of department 4 becomes NULL", "The deletion is rejected", "The Dno of the employees of department 4 becomes 1"]}, {"id": "4-dr-1", "concept": "drop", "type": "mc", "prompt": "DROP SCHEMA COMPANY RESTRICT; 의 동작은?", "choices": ["스키마의 모든 요소까지 삭제", "스키마에 요소가 하나도 없을 때만 삭제", "테이블만 삭제", "항상 거부"], "answer": 1, "lesson": "L4-2", "unit": "U4", "prompt_en": "What does DROP SCHEMA COMPANY RESTRICT; do?", "choices_en": ["Drops the schema together with all its elements", "Drops the schema only if it has no elements", "Drops only the tables", "Always rejects"]}, {"id": "4-dr-2", "concept": "drop", "type": "short", "prompt": "DROP TABLE EMPLOYEE와 DELETE FROM EMPLOYEE의 차이를 쓰시오.", "answer": "DROP TABLE은 모든 투플과 함께 카탈로그의 테이블 정의까지 제거한다(테이블이 없어짐). DELETE FROM은 투플만 지우고 테이블 정의는 남긴다.", "keys": ["DROP TABLE = 투플 + 정의 제거", "DELETE = 투플만, 정의는 남음"], "lesson": "L4-2", "unit": "U4", "prompt_en": "Explain the difference between DROP TABLE EMPLOYEE and DELETE FROM EMPLOYEE.", "answer_en": "DROP TABLE removes all tuples and also the table definition from the catalog (the table no longer exists). DELETE FROM removes only the tuples and keeps the table definition.", "keys_en": ["DROP TABLE = removes tuples + definition", "DELETE = tuples only; the definition remains"]}, {"id": "4-dr-3", "concept": "drop", "type": "ox", "prompt": "DROP TABLE ... CASCADE는 그 테이블을 참조하는 제약과 요소도 자동으로 삭제한다.", "answer": true, "lesson": "L4-2", "unit": "U4", "prompt_en": "DROP TABLE ... CASCADE also automatically drops the constraints and elements that reference the table."}, {"id": "4-alt-1", "concept": "alter", "type": "mc", "prompt": "EMPLOYEE에 새 열 Job을 추가하는 명령은?", "choices": ["ALTER TABLE COMPANY.EMPLOYEE ADD COLUMN Job VARCHAR(12);", "UPDATE EMPLOYEE ADD Job VARCHAR(12);", "INSERT INTO EMPLOYEE (Job) VALUES ('');", "CREATE COLUMN Job ON EMPLOYEE;"], "answer": 0, "lesson": "L4-2", "unit": "U4", "prompt_en": "Which command adds a new column Job to EMPLOYEE?"}, {"id": "4-alt-2", "concept": "alter", "type": "mc", "prompt": "ALTER TABLE COMPANY.EMPLOYEE DROP COLUMN Address RESTRICT; 의 동작은?", "choices": ["Address를 참조하는 제약도 같이 삭제", "항상 삭제", "Address를 참조하는 스키마 요소가 없을 때만 삭제", "Address 값을 NULL로"], "answer": 2, "lesson": "L4-2", "unit": "U4", "prompt_en": "What does ALTER TABLE COMPANY.EMPLOYEE DROP COLUMN Address RESTRICT; do?", "choices_en": ["Also drops the constraints that reference Address", "Always drops it", "Drops it only if no schema element references Address", "Sets the Address values to NULL"]}, {"id": "4-alt-3", "concept": "alter", "type": "ox", "prompt": "ALTER TABLE ... DROP CONSTRAINT EMPSUPERFK CASCADE; 로 이름 붙인 제약을 지울 수 있다.", "answer": true, "lesson": "L4-2", "unit": "U4", "prompt_en": "A named constraint can be dropped with ALTER TABLE ... DROP CONSTRAINT EMPSUPERFK CASCADE;."}, {"id": "4-alt-4", "concept": "alter", "type": "short", "prompt": "ALTER TABLE로 할 수 있는 일을 세 가지 쓰시오.", "answer": "속성(열) 추가·삭제, 제약조건 추가·삭제, 열 정의(데이터 타입이나 제약) 변경.", "keys": ["열 추가·삭제", "제약 추가·삭제", "열 정의 변경"], "lesson": "L4-2", "unit": "U4", "prompt_en": "Give three things that can be done with ALTER TABLE.", "answer_en": "Adding or dropping attributes (columns), adding or dropping constraints, and changing a column definition (data type or constraints).", "keys_en": ["Add/drop columns", "Add/drop constraints", "Change a column definition"]}, {"id": "4-ins-1", "concept": "dml-insert", "type": "mc", "prompt": "INSERT INTO EMPLOYEE (Fname, Lname, Dno) VALUES ('Robert', 'Hatcher', 5); 가 거부되는 이유는?", "choices": ["5번 부서가 없어서", "Ssn(PK, NOT NULL) 값이 없어서", "Fname이 중복이라서", "속성 순서가 틀려서"], "answer": 1, "lesson": "L4-3", "unit": "U4", "prompt_en": "Why is INSERT INTO EMPLOYEE (Fname, Lname, Dno) VALUES ('Robert', 'Hatcher', 5); rejected?", "choices_en": ["Because department 5 does not exist", "Because there is no value for Ssn (PK, NOT NULL)", "Because Fname is a duplicate", "Because the attribute order is wrong"]}, {"id": "4-ins-2", "concept": "dml-insert", "type": "mc", "prompt": "INSERT INTO EMPLOYEE (Fname, Lname, Ssn, Dno) VALUES ('Robert', 'Hatcher', '980760540', 2); 가 거부되는 이유는? (COMPANY 상태)", "choices": ["키 제약", "NOT NULL", "참조 무결성 (2번 부서 없음)", "위반 없음"], "answer": 2, "lesson": "L4-3", "unit": "U4", "prompt_en": "Why is INSERT INTO EMPLOYEE (Fname, Lname, Ssn, Dno) VALUES ('Robert', 'Hatcher', '980760540', 2); rejected? (COMPANY state)", "choices_en": ["Key constraint", "NOT NULL", "Referential integrity (no department 2)", "No violation"]}, {"id": "4-ins-3", "concept": "dml-insert", "type": "ox", "prompt": "속성 이름을 명시하지 않는 INSERT에서는 값을 테이블 정의의 속성 순서대로 모두 나열해야 한다.", "answer": true, "lesson": "L4-3", "unit": "U4", "prompt_en": "In an INSERT that does not list attribute names, values must be given for all attributes in the order of the attributes in the table definition."}, {"id": "4-ins-4", "concept": "dml-insert", "type": "calc", "prompt": "COMPANY에 새 프로젝트 'ProductW'(번호 40, 위치 'Houston', 5번 부서 통제)를 추가하고, Smith(123456789)가 이 프로젝트에 주 5시간 일한다는 사실을 추가하는 SQL을 쓰시오.", "answer": "INSERT INTO PROJECT VALUES ('ProductW', 40, 'Houston', 5);\nINSERT INTO WORKS_ON (Essn, Pno, Hours) VALUES ('123456789', 40, 5.0);\n(WORKS_ON은 PROJECT 40이 먼저 있어야 참조 무결성을 만족하므로 순서가 중요)", "keys": ["PROJECT INSERT", "WORKS_ON INSERT", "PROJECT를 먼저 (참조 무결성)"], "lesson": "L4-3", "unit": "U4", "prompt_en": "Write SQL that adds a new project 'ProductW' (number 40, location 'Houston', controlled by department 5) to COMPANY, and adds the fact that Smith (123456789) works 5 hours per week on this project.", "answer_en": "INSERT INTO PROJECT VALUES ('ProductW', 40, 'Houston', 5);\nINSERT INTO WORKS_ON (Essn, Pno, Hours) VALUES ('123456789', 40, 5.0);\n(The order matters: PROJECT 40 must exist first for WORKS_ON to satisfy referential integrity)", "keys_en": ["PROJECT INSERT", "WORKS_ON INSERT", "PROJECT first (referential integrity)"]}, {"id": "4-ins-5", "concept": "dml-insert", "type": "blank", "prompt": "속성 이름을 명시하는 INSERT에서는 (a) 이면서 (b) 이 없는 속성의 값은 반드시 포함해야 한다.", "answer": "(a) NOT NULL / (b) DEFAULT", "accept": [["NOT NULL", "not null", "널 불가"], ["DEFAULT", "default", "기본값", "default value"]], "lesson": "L4-3", "unit": "U4", "prompt_en": "In an INSERT that lists attribute names, values must be included for attributes that are (a) and have no (b)."}, {"id": "4-del-1", "concept": "dml-delete-update", "type": "mc", "prompt": "COMPANY 상태에서 DELETE FROM EMPLOYEE WHERE Dno = 5; 로 삭제되는 투플 수는? (참조 제약은 무시)", "choices": ["0", "1", "4", "8"], "answer": 2, "lesson": "L4-3", "unit": "U4", "prompt_en": "On the COMPANY state, how many tuples are deleted by DELETE FROM EMPLOYEE WHERE Dno = 5;? (Ignore referential constraints.)"}, {"id": "4-del-2", "concept": "dml-delete-update", "type": "ox", "prompt": "DELETE FROM EMPLOYEE; 는 EMPLOYEE 테이블 정의까지 없앤다.", "answer": false, "explain": "투플만 전부 지워지고 정의는 남는다. 정의까지 지우는 건 DROP TABLE.", "lesson": "L4-3", "unit": "U4", "prompt_en": "DELETE FROM EMPLOYEE; also removes the EMPLOYEE table definition.", "explain_en": "Only all the tuples are deleted; the definition remains. Removing the definition too is DROP TABLE."}, {"id": "4-del-3", "concept": "dml-delete-update", "type": "mc", "prompt": "DELETE 명령에 대한 설명으로 옳은 것은?", "choices": ["한 명령으로 여러 테이블에서 명시적으로 삭제할 수 있다", "한 번에 한 테이블에서만 명시적으로 삭제하지만, CASCADE로 다른 테이블에 전파될 수 있다", "WHERE가 없으면 아무것도 지우지 않는다", "PK 값으로만 지울 수 있다"], "answer": 1, "lesson": "L4-3", "unit": "U4", "prompt_en": "Which statement about the DELETE command is correct?", "choices_en": ["One command can explicitly delete from several tables", "It explicitly deletes from only one table at a time, but can propagate to other tables via CASCADE", "Without WHERE, it deletes nothing", "It can delete only by PK value"]}, {"id": "4-del-4", "concept": "dml-delete-update", "type": "calc", "prompt": "5번 부서 사원 전원의 급여를 10% 올리는 SQL을 쓰고, COMPANY 상태에서 바뀌는 사원과 새 급여를 쓰시오.", "answer": "UPDATE EMPLOYEE\nSET    Salary = Salary * 1.1\nWHERE  Dno = 5;\n\nSmith 30000 → 33000, Wong 40000 → 44000, Narayan 38000 → 41800, English 25000 → 27500 (4개 투플)", "keys": ["UPDATE ... SET Salary = Salary * 1.1", "WHERE Dno = 5", "4명과 새 급여"], "lesson": "L4-3", "unit": "U4", "prompt_en": "Write SQL that gives all employees in department 5 a 10% raise, and list the employees affected on the COMPANY state with their new salaries.", "answer_en": "UPDATE EMPLOYEE\nSET    Salary = Salary * 1.1\nWHERE  Dno = 5;\n\nSmith 30000 → 33000, Wong 40000 → 44000, Narayan 38000 → 41800, English 25000 → 27500 (4 tuples)", "keys_en": ["UPDATE ... SET Salary = Salary * 1.1", "WHERE Dno = 5", "The 4 employees and their new salaries"]}, {"id": "4-del-5", "concept": "dml-delete-update", "type": "calc", "prompt": "프로젝트 10번의 위치를 'Bellaire'로, 통제 부서를 5번으로 바꾸는 SQL을 쓰시오.", "answer": "UPDATE PROJECT\nSET    Plocation = 'Bellaire', Dnum = 5\nWHERE  Pnumber = 10;", "keys": ["UPDATE PROJECT", "SET 두 속성 (쉼표로)", "WHERE Pnumber = 10"], "lesson": "L4-3", "unit": "U4", "prompt_en": "Write SQL that changes the location of project 10 to 'Bellaire' and its controlling department to 5.", "keys_en": ["UPDATE PROJECT", "SET two attributes (separated by a comma)", "WHERE Pnumber = 10"]}, {"id": "4-del-6", "concept": "dml-delete-update", "type": "short", "prompt": "UPDATE 문에서 WHERE와 SET의 역할을 쓰고, UPDATE가 다른 테이블에 영향을 줄 수 있는 경우를 쓰시오.", "answer": "WHERE: 한 릴레이션에서 수정할 투플을 고름. SET: 수정할 속성과 새 값 지정. PK 값을 바꿀 때 FK에 ON UPDATE CASCADE가 지정돼 있으면 참조하는 다른 테이블의 투플도 바뀐다.", "keys": ["WHERE = 투플 선택", "SET = 속성과 새 값", "ON UPDATE CASCADE로 전파"], "lesson": "L4-3", "unit": "U4", "prompt_en": "Explain the roles of WHERE and SET in an UPDATE statement, and when an UPDATE can affect other tables.", "answer_en": "WHERE: selects the tuples to modify in one relation. SET: specifies the attributes to change and their new values. When a PK value is changed and the FK has ON UPDATE CASCADE, the referencing tuples in other tables are changed too.", "keys_en": ["WHERE = selects tuples", "SET = attributes and new values", "Propagation via ON UPDATE CASCADE"]}, {"id": "4-sfw-1", "concept": "sfw", "type": "mc", "prompt": "SELECT Fname, Lname, Address FROM EMPLOYEE, DEPARTMENT WHERE Dname = 'Research' AND Dnumber = Dno; 에서 Dnumber = Dno는?", "choices": ["선택 조건", "조인 조건", "투영 속성", "정렬 조건"], "answer": 1, "lesson": "L4-4", "unit": "U4", "prompt_en": "In SELECT Fname, Lname, Address FROM EMPLOYEE, DEPARTMENT WHERE Dname = 'Research' AND Dnumber = Dno; what is Dnumber = Dno?", "choices_en": ["Selection condition", "Join condition", "Projection attribute", "Sort condition"]}, {"id": "4-sfw-2", "concept": "sfw", "type": "blank", "prompt": "SELECT 절의 속성은 (a) 속성이고, WHERE 절에는 선택 조건과 (b) 조건이 들어간다.", "answer": "(a) 투영 / (b) 조인", "accept": [["투영", "projection", "프로젝션"], ["조인", "join"]], "lesson": "L4-4", "unit": "U4", "prompt_en": "The attributes in the SELECT clause are (a) attributes, and the WHERE clause contains selection conditions and (b) conditions.", "answer_en": "(a) projection / (b) join"}, {"id": "4-sfw-3", "concept": "sfw", "type": "calc", "prompt": "'John B. Smith'의 생일과 주소를 검색하시오.", "answer": "SELECT Bdate, Address\nFROM   EMPLOYEE\nWHERE  Fname = 'John' AND Minit = 'B' AND Lname = 'Smith';\n\n-- 교재 COMPANY 상태에서 실행 결과 (1행)\nBdate | Address\n1965-01-09 | 731 Fondren, Houston, TX", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["SELECT Bdate, Address", "세 이름 조건 AND"], "lesson": "L4-4", "unit": "U4", "prompt_en": "Retrieve the birth date and address of 'John B. Smith'.", "answer_en": "SELECT Bdate, Address\nFROM   EMPLOYEE\nWHERE  Fname = 'John' AND Minit = 'B' AND Lname = 'Smith';\n\n-- Result on the textbook COMPANY state (1 row)\nBdate | Address\n1965-01-09 | 731 Fondren, Houston, TX", "keys_en": ["SELECT Bdate, Address", "Three name conditions with AND"]}, {"id": "4-sfw-4", "concept": "sfw", "type": "calc", "prompt": "'Research' 부서에서 일하는 모든 사원의 이름(Fname, Lname)과 주소를 검색하시오.", "answer": "SELECT Fname, Lname, Address\nFROM   EMPLOYEE, DEPARTMENT\nWHERE  Dname = 'Research' AND Dnumber = Dno;\n\n-- 교재 COMPANY 상태에서 실행 결과 (4행)\nFname | Lname | Address\nJohn | Smith | 731 Fondren, Houston, TX\nFranklin | Wong | 638 Voss, Houston, TX\nRamesh | Narayan | 975 Fire Oak, Humble, TX\nJoyce | English | 5631 Rice, Houston, TX", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["EMPLOYEE, DEPARTMENT", "선택 조건 Dname = 'Research'", "조인 조건 Dnumber = Dno"], "lesson": "L4-4", "unit": "U4", "prompt_en": "Retrieve the name (Fname, Lname) and address of all employees who work for the 'Research' department.", "answer_en": "SELECT Fname, Lname, Address\nFROM   EMPLOYEE, DEPARTMENT\nWHERE  Dname = 'Research' AND Dnumber = Dno;\n\n-- Result on the textbook COMPANY state (4 rows)\nFname | Lname | Address\nJohn | Smith | 731 Fondren, Houston, TX\nFranklin | Wong | 638 Voss, Houston, TX\nRamesh | Narayan | 975 Fire Oak, Humble, TX\nJoyce | English | 5631 Rice, Houston, TX", "keys_en": ["EMPLOYEE, DEPARTMENT", "Selection condition Dname
