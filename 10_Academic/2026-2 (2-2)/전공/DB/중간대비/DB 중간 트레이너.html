*방법 2**: 연산을 **중첩**해서 하나의 식으로\n```\nπ Fname, Lname, Salary ( σ Dno=5 (EMPLOYEE) )\n```\n→ Smith 30000, Wong 40000, Narayan 38000, English 25000\n\n복잡한 질의는 하나의 식보다 **중간 결과 릴레이션으로 쪼개는 게 보통 더 쉽다**.", "html": "<section class=\"sec\" id=\"s-ra-select\"><h3>SELECT (σ)<\/h3><p><b>σ&lt;선택 조건&gt;(R)<\/b>: 릴레이션에서 <b>선택 조건을 만족하는 투플의 부분집합<\/b>을 고름 → <b>수평 필터링<\/b>.<\/p>\n<ul><li>조건은 투플 <b>각각에<\/b> 개별 적용<\/li><li>결과는 R과 <b>같은 속성<\/b> → <b>결과 차수 = R의 차수<\/b><\/li><li>조건 = <code>&lt;속성&gt; &lt;비교연산&gt; &lt;상수&gt;<\/code> 또는 <code>&lt;속성&gt; &lt;비교연산&gt; &lt;속성&gt;<\/code> 절들을 <b>AND, OR<\/b>로 연결<ul><li>비교 연산 {=, &lt;, ≤, &gt;, ≥, ≠}. 순서 있는 값(숫자, 날짜)은 전부, 순서 없는 값(색깔 등)은 {=, ≠}만<\/li><\/ul><\/li><li>예) σ Dno=4 (EMPLOYEE) → Zelaya, Wallace, Jabbar<\/li><li>예) σ (Dno=4 AND Salary&gt;25000) OR (Dno=5 AND Salary&gt;30000) (EMPLOYEE) → Wong, Wallace, Narayan<\/li><\/ul>\n<p><b>성질<\/b><\/p>\n<ul><li><b>교환 법칙<\/b>: σ c1(σ c2(R)) = σ c2(σ c1(R))<\/li><li>여러 σ는 AND로 <b>하나로 합칠 수 있음<\/b>: σ c1(σ c2(…σ cn(R))) = σ c1 AND c2 AND … AND cn(R)<\/li><\/ul>\n<div class=\"callout trap\">함정: 관계 대수의 SELECT(σ)는 SQL의 <b>SELECT 절이 아니라 WHERE 절<\/b>에 대응. <code>σ Dno=4 AND Salary&gt;25000 (EMPLOYEE)<\/code> = <code>SELECT * FROM EMPLOYEE WHERE Dno=4 AND Salary&gt;25000;<\/code><\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p9.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p9.jpg\" alt=\"06 p.9 · 선택 조건을 AND/OR로 연결한 σ\" loading=\"lazy\"><\/button><figcaption>06 p.9 · 선택 조건을 AND/OR로 연결한 σ<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-ra-project\"><h3>PROJECT (π)<\/h3><p><b>π&lt;속성 리스트&gt;(R)<\/b>: 원하는 <b>열만<\/b> 남기고 나머지 열은 버림 → <b>수직 필터링<\/b>.<\/p>\n<ul><li>결과 차수 = 속성 리스트의 속성 수<\/li><li><b>중복 제거<\/b>: 속성 리스트에 키가 없으면(비키 속성만) 중복 투플이 생길 수 있는데, <b>π는 중복을 제거<\/b> → 결과는 서로 다른 투플의 <b>집합<\/b><ul><li>예) π Sex, Salary (EMPLOYEE) → 8행이 아니라 <b>7행<\/b> ((F, 25000)이 두 번 → 한 번)<\/li><\/ul><\/li><li>SQL 대응: π 속성 리스트 = <b>SELECT 절<\/b>. 그런데 SQL은 중복을 안 지우므로 정확한 대응은 <code>SELECT DISTINCT Sex, Salary FROM EMPLOYEE;<\/code><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p12.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p12.jpg\" alt=\"06 p.12 · π Sex, Salary: 중복 제거 → SQL의 SELECT DISTINCT\" loading=\"lazy\"><\/button><figcaption>06 p.12 · π Sex, Salary: 중복 제거 → SQL의 SELECT DISTINCT<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-ra-rename\"><h3>RENAME (ρ)<\/h3><p><b>ρ<\/b>: 릴레이션 이름이나 속성 이름, 또는 둘 다 바꿈.<\/p>\n<ul><li>ρ S(B₁, …, Bₙ)(R): 둘 다 / ρ S(R): 릴레이션 이름만 / ρ (B₁, …, Bₙ)(R): 속성 이름만<\/li><li>대입 형태로도 씀: <code>R(First_name, Last_name, Salary) ← π Fname, Lname, Salary (TEMP)<\/code><\/li><li>SQL에서는 <b>AS (별칭)<\/b> 로 이름 바꾸기를 한다<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p13.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p13.jpg\" alt=\"06 p.13 · RENAME ρ의 세 가지 형태\" loading=\"lazy\"><\/button><figcaption>06 p.13 · RENAME ρ의 세 가지 형태<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-ra-sequence\"><h3>연산의 순서 (중간 릴레이션)<\/h3><p>여러 연산을 쓸 때 두 방법:<\/p>\n<ul><li><b>방법 1<\/b>: 중간 릴레이션에 이름을 붙여 순서를 명시<\/li><\/ul>\n<pre class=\"code\">DEP5_EMPS ← σ Dno=5 (EMPLOYEE)\nRESULT    ← π Fname, Lname, Salary (DEP5_EMPS)<\/pre>\n<ul><li><b>방법 2<\/b>: 연산을 <b>중첩<\/b>해서 하나의 식으로<\/li><\/ul>\n<pre class=\"code\">π Fname, Lname, Salary ( σ Dno=5 (EMPLOYEE) )<\/pre>\n<p>→ Smith 30000, Wong 40000, Narayan 38000, English 25000<\/p>\n<p>복잡한 질의는 하나의 식보다 <b>중간 결과 릴레이션으로 쪼개는 게 보통 더 쉽다<\/b>.<\/p><\/section>"}, {"id": "L6-3", "title": "집합 연산 · 카티션 곱", "src": "6-1 p.17–22", "secs": [{"id": "ra-setops", "title": "합 · 교 · 차"}, {"id": "ra-cartesian", "title": "카티션 곱 (×)"}], "md": "## 합 · 교 · 차 {#ra-setops}\n\n**합집합 R ∪ S**, **교집합 R ∩ S**, **차집합 R − S** (MINUS, EXCEPT). 결과에서 **중복 제거**.\n- **타입 호환 (type compatible, union compatible)** 인 릴레이션에만 적용: R(A₁…Aₙ)과 S(B₁…Bₙ)의 **속성 수가 같고**, 모든 i에 대해 **dom(Aᵢ) = dom(Bᵢ)**\n- 교안 예: 5번 부서에서 일하거나, 5번 부서 사원을 직접 감독하는 사원의 SSN\n```\nDEP5_EMPS ← σ Dno=5 (EMPLOYEE)\nRESULT1   ← π Ssn (DEP5_EMPS)\nRESULT2(Ssn) ← π Super_ssn (DEP5_EMPS)\nRESULT    ← RESULT1 ∪ RESULT2\n```\n→ RESULT1 = {123456789, 333445555, 666884444, 453453453}, RESULT2 = {333445555, 888665555}, RESULT = 5개 (333445555는 한 번만)\n\n**성질**\n- ∪와 ∩는 **교환** (R ∪ S = S ∪ R) **결합** (R ∪ (S ∪ T) = (R ∪ S) ∪ T)\n- **−는 교환 법칙이 성립하지 않는다**: R − S ≠ S − R (STUDENT − INSTRUCTOR와 INSTRUCTOR − STUDENT는 다름)\n- 결과 속성 이름은 관례상 **첫 번째 릴레이션**의 이름을 따름\n\n## 카티션 곱 (×) {#ra-cartesian}\n\n**R(A₁…Aₙ) × S(B₁…Bₘ) → Q(A₁…Aₙ, B₁…Bₘ)**: 두 릴레이션 투플의 **모든 가능한 조합**을 이어 붙임. CROSS PRODUCT, CROSS JOIN.\n- **타입 호환 아니어도** 적용 가능한 이항 집합 연산\n- 결과 속성 수 = **n + m**, 투플 수 = **|R| × |S|**\n- 그 자체로는 대개 의미 없음 → **뒤에 SELECT가 와서** 관련 있는 투플만 고를 때 유용\n\n교안 예: 여성 사원의 부양가족 이름\n```\nFEMALE_EMPS       ← σ Sex='F' (EMPLOYEE)\nEMPNAMES          ← π Fname, Lname, Ssn (FEMALE_EMPS)\nEMP_DEPENDENTS    ← EMPNAMES × DEPENDENT              -- 3 × 7 = 21행 (의미 없음)\nACTUAL_DEPENDENTS ← σ Ssn=Essn (EMP_DEPENDENTS)\nRESULT            ← π Fname, Lname, Dependent_name (ACTUAL_DEPENDENTS)\n```\n→ Jennifer Wallace – Abner 한 행. **× 다음 σ = JOIN** (다음 레슨).", "html": "<section class=\"sec\" id=\"s-ra-setops\"><h3>합 · 교 · 차<\/h3><p><b>합집합 R ∪ S<\/b>, <b>교집합 R ∩ S<\/b>, <b>차집합 R − S<\/b> (MINUS, EXCEPT). 결과에서 <b>중복 제거<\/b>.<\/p>\n<ul><li><b>타입 호환 (type compatible, union compatible)<\/b> 인 릴레이션에만 적용: R(A₁…Aₙ)과 S(B₁…Bₙ)의 <b>속성 수가 같고<\/b>, 모든 i에 대해 <b>dom(Aᵢ) = dom(Bᵢ)<\/b><\/li><li>교안 예: 5번 부서에서 일하거나, 5번 부서 사원을 직접 감독하는 사원의 SSN<\/li><\/ul>\n<pre class=\"code\">DEP5_EMPS ← σ Dno=5 (EMPLOYEE)\nRESULT1   ← π Ssn (DEP5_EMPS)\nRESULT2(Ssn) ← π Super_ssn (DEP5_EMPS)\nRESULT    ← RESULT1 ∪ RESULT2<\/pre>\n<p>→ RESULT1 = {123456789, 333445555, 666884444, 453453453}, RESULT2 = {333445555, 888665555}, RESULT = 5개 (333445555는 한 번만)<\/p>\n<p><b>성질<\/b><\/p>\n<ul><li>∪와 ∩는 <b>교환<\/b> (R ∪ S = S ∪ R) <b>결합<\/b> (R ∪ (S ∪ T) = (R ∪ S) ∪ T)<\/li><li><b>−는 교환 법칙이 성립하지 않는다<\/b>: R − S ≠ S − R (STUDENT − INSTRUCTOR와 INSTRUCTOR − STUDENT는 다름)<\/li><li>결과 속성 이름은 관례상 <b>첫 번째 릴레이션<\/b>의 이름을 따름<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p17.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p17.jpg\" alt=\"06 p.17 · RESULT1 ∪ RESULT2 (타입 호환)\" loading=\"lazy\"><\/button><figcaption>06 p.17 · RESULT1 ∪ RESULT2 (타입 호환)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-ra-cartesian\"><h3>카티션 곱 (×)<\/h3><p><b>R(A₁…Aₙ) × S(B₁…Bₘ) → Q(A₁…Aₙ, B₁…Bₘ)<\/b>: 두 릴레이션 투플의 <b>모든 가능한 조합<\/b>을 이어 붙임. CROSS PRODUCT, CROSS JOIN.<\/p>\n<ul><li><b>타입 호환 아니어도<\/b> 적용 가능한 이항 집합 연산<\/li><li>결과 속성 수 = <b>n + m<\/b>, 투플 수 = <b>|R| × |S|<\/b><\/li><li>그 자체로는 대개 의미 없음 → <b>뒤에 SELECT가 와서<\/b> 관련 있는 투플만 고를 때 유용<\/li><\/ul>\n<p>교안 예: 여성 사원의 부양가족 이름<\/p>\n<pre class=\"code\">FEMALE_EMPS       ← σ Sex=&#x27;F&#x27; (EMPLOYEE)\nEMPNAMES          ← π Fname, Lname, Ssn (FEMALE_EMPS)\nEMP_DEPENDENTS    ← EMPNAMES × DEPENDENT              -- 3 × 7 = 21행 (의미 없음)\nACTUAL_DEPENDENTS ← σ Ssn=Essn (EMP_DEPENDENTS)\nRESULT            ← π Fname, Lname, Dependent_name (ACTUAL_DEPENDENTS)<\/pre>\n<p>→ Jennifer Wallace – Abner 한 행. <b>× 다음 σ = JOIN<\/b> (다음 레슨).<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p21.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p21.jpg\" alt=\"06 p.21 · EMPNAMES × DEPENDENT = 3 × 7 = 21행\" loading=\"lazy\"><\/button><figcaption>06 p.21 · EMPNAMES × DEPENDENT = 3 × 7 = 21행<\/figcaption><\/figure><\/section>"}, {"id": "L6-4", "title": "JOIN · DIVISION · 완전 집합", "src": "6-1 p.24–34", "secs": [{"id": "ra-join", "title": "JOIN (⋈)"}, {"id": "join-variants", "title": "세타 · 동등 · 자연 조인"}, {"id": "join-size", "title": "조인 결과의 크기"}, {"id": "ra-division", "title": "DIVISION (÷)"}, {"id": "ra-complete", "title": "관계 대수 연산의 완전 집합"}], "md": "## JOIN (⋈) {#ra-join}\n\n**R ⋈<조인 조건> S**: 두 릴레이션의 **관련 있는 투플을 하나의 긴 투플로** 결합. 결과 Q(A₁…Aₙ, B₁…Bₘ)에는 **조인 조건을 만족하는 조합만**.\n- 예) 각 부서 관리자의 이름\n```\nDEPT_MGR ← DEPARTMENT ⋈ Mgr_ssn=Ssn EMPLOYEE\nRESULT   ← π Dname, Lname, Fname (DEPT_MGR)\n```\n→ Research–Wong, Administration–Wallace, Headquarters–Borg\n- **JOIN = 카티션 곱 + SELECT**: `EMP_DEPENDENTS ← EMPNAMES × DEPENDENT; ACTUAL ← σ Ssn=Essn (EMP_DEPENDENTS)` 두 줄을 `ACTUAL ← EMPNAMES ⋈ Ssn=Essn DEPENDENT` 한 줄로\n\n## 세타 · 동등 · 자연 조인 {#join-variants}\n\n- **세타 조인 (THETA JOIN)**: 일반 조인 조건. `<조건> AND <조건> AND …`, 각 조건은 **Aᵢ θ Bⱼ** (θ ∈ {=, <, ≤, >, ≥, ≠}). 조건을 모두 만족하는 투플만\n- **동등 조인 (EQUIJOIN)**: 비교 연산자가 **= 만** 쓰인 조인. 결과에 값이 똑같은 속성 쌍이 생김 (예: Mgr_ssn과 Ssn) → 하나는 불필요\n- **자연 조인 (NATURAL JOIN, * 로 표기)**: 동등 조인에서 **중복 속성 하나를 없앤 것**\n  - 조인 속성은 두 릴레이션에서 **이름이 같아야** 함. 다르면 **먼저 이름을 바꿈**\n  - `DEPT_LOCS ← DEPARTMENT * DEPT_LOCATIONS` (Dnumber가 같은 이름) → Dnumber 한 번만\n  - `DEPT ← ρ (Dname, Dnum, Mgr_ssn, Mgr_start_date) (DEPARTMENT); PROJ_DEPT ← PROJECT * DEPT` (Dnum으로 맞춤)\n\n> 함정: 자연 조인은 이름이 같은 속성 **전부**를 조인 조건으로 쓴다. 의도치 않게 이름이 같은 속성(예: 둘 다 Name)이 있으면 엉뚱한 조건이 붙는다.\n\n## 조인 결과의 크기 {#join-size}\n\n- **0 ≤ |R ⋈ S| ≤ |R| × |S|**\n- 최소: 조인 조건을 만족하는 조합이 하나도 없으면 → **빈 릴레이션**\n- 최대: 모든 조합이 조건을 만족하거나 조건이 없으면 → **카티션 곱**과 같음\n- **조인 선택도 (join selectivity)** = 예상 조인 결과 크기 / (|R| × |S|). 질의 최적화에서 질의 계획의 비용 추정에 씀\n\n## DIVISION (÷) {#ra-division}\n\n\"**모든** ~를 하는\" 질의를 위한 연산. 기본 연산으로 표현할 수 있지만 따로 둠.\n- 형식: **R(Z) ÷ S(X) = T(Y)**, X ⊆ Z (S의 속성은 R 속성의 부분집합), **Y = Z − X**\n- T에는 R에서 **S의 모든 값과 짝지어 나타나는** Y 값만 들어감 (분모 S가 분자 R을 제한)\n- 예) R(A, B) = {(a1,b1), (a2,b1), (a3,b1), (a4,b1), (a1,b2), (a3,b2), (a2,b3), (a3,b3), (a4,b3), (a1,b4), (a2,b4), (a3,b4)}, S(A) = {a1, a2, a3} → T(B) = {b1, b4}\n\n교안 예: 'John Smith'가 일하는 **모든** 프로젝트에서 일하는 사원의 이름\n```\nSMITH      ← σ Fname='John' AND Lname='Smith' (EMPLOYEE)\nSMITH_PNOS ← π Pno (WORKS_ON ⋈ Essn=Ssn SMITH)            -- {1, 2}\nSSN_PNOS   ← π Essn, Pno (WORKS_ON)\nSSNS(Ssn)  ← SSN_PNOS ÷ SMITH_PNOS                         -- {123456789, 453453453}\nRESULT     ← π Fname, Lname (SSNS * EMPLOYEE)\n```\n→ John Smith, Joyce English\n\n> 시험 포인트: 분자 R의 속성 순서·이름을 맞춰야 한다. SSN_PNOS(Essn, Pno) ÷ SMITH_PNOS(Pno) → 남는 속성 Essn. 결과를 EMPLOYEE와 자연 조인하려고 SSNS(Ssn)으로 이름을 바꿨다.\n\n## 관계 대수 연산의 완전 집합 {#ra-complete}\n\n**{σ, π, ∪, ρ, −, ×}** 6개가 완전 집합. 다른 모든 (원래의) 관계 대수 연산은 이 6개의 조합으로 표현 가능.\n- **교집합**: R ∩ S ≡ (R ∪ S) − ((R − S) ∪ (S − R))\n- **조인**: R ⋈<조건> S ≡ σ<조건>(R × S)\n- **자연 조인**: 카티션 곱 앞에 RENAME, 뒤에 SELECT와 PROJECT\n- 엄밀히는 ∩와 ⋈가 필요 없지만 **자주 쓰여서** 별도 연산으로 둔다", "html": "<section class=\"sec\" id=\"s-ra-join\"><h3>JOIN (⋈)<\/h3><p><b>R ⋈&lt;조인 조건&gt; S<\/b>: 두 릴레이션의 <b>관련 있는 투플을 하나의 긴 투플로<\/b> 결합. 결과 Q(A₁…Aₙ, B₁…Bₘ)에는 <b>조인 조건을 만족하는 조합만<\/b>.<\/p>\n<ul><li>예) 각 부서 관리자의 이름<\/li><\/ul>\n<pre class=\"code\">DEPT_MGR ← DEPARTMENT ⋈ Mgr_ssn=Ssn EMPLOYEE\nRESULT   ← π Dname, Lname, Fname (DEPT_MGR)<\/pre>\n<p>→ Research–Wong, Administration–Wallace, Headquarters–Borg<\/p>\n<ul><li><b>JOIN = 카티션 곱 + SELECT<\/b>: <code>EMP_DEPENDENTS ← EMPNAMES × DEPENDENT; ACTUAL ← σ Ssn=Essn (EMP_DEPENDENTS)<\/code> 두 줄을 <code>ACTUAL ← EMPNAMES ⋈ Ssn=Essn DEPENDENT<\/code> 한 줄로<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p24.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p24.jpg\" alt=\"06 p.24 · DEPARTMENT ⋈ Mgr_ssn=Ssn EMPLOYEE\" loading=\"lazy\"><\/button><figcaption>06 p.24 · DEPARTMENT ⋈ Mgr_ssn=Ssn EMPLOYEE<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-join-variants\"><h3>세타 · 동등 · 자연 조인<\/h3><ul><li><b>세타 조인 (THETA JOIN)<\/b>: 일반 조인 조건. <code>&lt;조건&gt; AND &lt;조건&gt; AND …<\/code>, 각 조건은 <b>Aᵢ θ Bⱼ<\/b> (θ ∈ {=, &lt;, ≤, &gt;, ≥, ≠}). 조건을 모두 만족하는 투플만<\/li><li><b>동등 조인 (EQUIJOIN)<\/b>: 비교 연산자가 <b>= 만<\/b> 쓰인 조인. 결과에 값이 똑같은 속성 쌍이 생김 (예: Mgr_ssn과 Ssn) → 하나는 불필요<\/li><li><b>자연 조인 (NATURAL JOIN, * 로 표기)<\/b>: 동등 조인에서 <b>중복 속성 하나를 없앤 것<\/b><ul><li>조인 속성은 두 릴레이션에서 <b>이름이 같아야<\/b> 함. 다르면 <b>먼저 이름을 바꿈<\/b><\/li><li><code>DEPT_LOCS ← DEPARTMENT * DEPT_LOCATIONS<\/code> (Dnumber가 같은 이름) → Dnumber 한 번만<\/li><li><code>DEPT ← ρ (Dname, Dnum, Mgr_ssn, Mgr_start_date) (DEPARTMENT); PROJ_DEPT ← PROJECT * DEPT<\/code> (Dnum으로 맞춤)<\/li><\/ul><\/li><\/ul>\n<div class=\"callout trap\">함정: 자연 조인은 이름이 같은 속성 <b>전부<\/b>를 조인 조건으로 쓴다. 의도치 않게 이름이 같은 속성(예: 둘 다 Name)이 있으면 엉뚱한 조건이 붙는다.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p28.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p28.jpg\" alt=\"06 p.28 · 자연 조인 (*): 이름이 같은 속성으로, 다르면 먼저 RENAME\" loading=\"lazy\"><\/button><figcaption>06 p.28 · 자연 조인 (*): 이름이 같은 속성으로, 다르면 먼저 RENAME<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-join-size\"><h3>조인 결과의 크기<\/h3><ul><li><b>0 ≤ |R ⋈ S| ≤ |R| × |S|<\/b><\/li><li>최소: 조인 조건을 만족하는 조합이 하나도 없으면 → <b>빈 릴레이션<\/b><\/li><li>최대: 모든 조합이 조건을 만족하거나 조건이 없으면 → <b>카티션 곱<\/b>과 같음<\/li><li><b>조인 선택도 (join selectivity)<\/b> = 예상 조인 결과 크기 / (|R| × |S|). 질의 최적화에서 질의 계획의 비용 추정에 씀<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-ra-division\"><h3>DIVISION (÷)<\/h3><p>\"<b>모든<\/b> ~를 하는\" 질의를 위한 연산. 기본 연산으로 표현할 수 있지만 따로 둠.<\/p>\n<ul><li>형식: <b>R(Z) ÷ S(X) = T(Y)<\/b>, X ⊆ Z (S의 속성은 R 속성의 부분집합), <b>Y = Z − X<\/b><\/li><li>T에는 R에서 <b>S의 모든 값과 짝지어 나타나는<\/b> Y 값만 들어감 (분모 S가 분자 R을 제한)<\/li><li>예) R(A, B) = {(a1,b1), (a2,b1), (a3,b1), (a4,b1), (a1,b2), (a3,b2), (a2,b3), (a3,b3), (a4,b3), (a1,b4), (a2,b4), (a3,b4)}, S(A) = {a1, a2, a3} → T(B) = {b1, b4}<\/li><\/ul>\n<p>교안 예: 'John Smith'가 일하는 <b>모든<\/b> 프로젝트에서 일하는 사원의 이름<\/p>\n<pre class=\"code\">SMITH      ← σ Fname=&#x27;John&#x27; AND Lname=&#x27;Smith&#x27; (EMPLOYEE)\nSMITH_PNOS ← π Pno (WORKS_ON ⋈ Essn=Ssn SMITH)            -- {1, 2}\nSSN_PNOS   ← π Essn, Pno (WORKS_ON)\nSSNS(Ssn)  ← SSN_PNOS ÷ SMITH_PNOS                         -- {123456789, 453453453}\nRESULT     ← π Fname, Lname (SSNS * EMPLOYEE)<\/pre>\n<p>→ John Smith, Joyce English<\/p>\n<div class=\"callout exam\">시험 포인트: 분자 R의 속성 순서·이름을 맞춰야 한다. SSN_PNOS(Essn, Pno) ÷ SMITH_PNOS(Pno) → 남는 속성 Essn. 결과를 EMPLOYEE와 자연 조인하려고 SSNS(Ssn)으로 이름을 바꿨다.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p32.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p32.jpg\" alt=\"06 p.32 · SSN_PNOS ÷ SMITH_PNOS\" loading=\"lazy\"><\/button><figcaption>06 p.32 · SSN_PNOS ÷ SMITH_PNOS<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p33.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p33.jpg\" alt=\"06 p.33 · R(Z) ÷ S(X) = T(Y), Y = Z − X\" loading=\"lazy\"><\/button><figcaption>06 p.33 · R(Z) ÷ S(X) = T(Y), Y = Z − X<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-ra-complete\"><h3>관계 대수 연산의 완전 집합<\/h3><p><b>{σ, π, ∪, ρ, −, ×}<\/b> 6개가 완전 집합. 다른 모든 (원래의) 관계 대수 연산은 이 6개의 조합으로 표현 가능.<\/p>\n<ul><li><b>교집합<\/b>: R ∩ S ≡ (R ∪ S) − ((R − S) ∪ (S − R))<\/li><li><b>조인<\/b>: R ⋈&lt;조건&gt; S ≡ σ&lt;조건&gt;(R × S)<\/li><li><b>자연 조인<\/b>: 카티션 곱 앞에 RENAME, 뒤에 SELECT와 PROJECT<\/li><li>엄밀히는 ∩와 ⋈가 필요 없지만 <b>자주 쓰여서<\/b> 별도 연산으로 둔다<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p34.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p34.jpg\" alt=\"06 p.34 · 완전 집합 {σ, π, ∪, ρ, −, ×}\" loading=\"lazy\"><\/button><figcaption>06 p.34 · 완전 집합 {σ, π, ∪, ρ, −, ×}<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p44.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p44.jpg\" alt=\"06 p.44 · 관계 대수 연산 요약표\" loading=\"lazy\"><\/button><figcaption>06 p.44 · 관계 대수 연산 요약표<\/figcaption><\/figure><\/section>"}, {"id": "L6-5", "title": "추가 연산: 집계 · 그룹 · 외부 조인", "src": "6-1 p.36–43", "secs": [{"id": "ra-aggregate", "title": "집계 함수와 그룹화 (ℑ)"}, {"id": "ra-agg-props", "title": "집계의 성질"}, {"id": "ra-outer", "title": "외부 조인"}], "md": "## 집계 함수와 그룹화 (ℑ) {#ra-aggregate}\n\n기본 연산만으로는 **집계(SUM, AVERAGE, MAXIMUM, MINIMUM, COUNT)**, **그룹별 집계**, **외부 조인**을 표현 못 함 → 추가 연산으로 **표현력 확장**.\n\n**<그룹화 속성> ℑ <함수 리스트> (R)** (ℑ = script F)\n- 그룹화 속성: R의 속성 중 그룹을 나눌 기준 (없어도 됨)\n- 함수 리스트: (<함수> <속성>) 쌍들. 함수 = SUM, AVERAGE, MAXIMUM, MINIMUM, COUNT\n- **결과**: 그룹화 속성 + 함수 리스트 원소마다 속성 하나\n\n예\n```\nρ R(Dno, No_of_employees, Average_sal) ( Dno ℑ COUNT Ssn, AVERAGE Salary (EMPLOYEE) )\n```\n→ (5, 4, 33250), (4, 3, 31000), (1, 1, 55000)\n- **이름을 안 바꾸면**: 속성 이름 = `<함수>_<속성>` → Dno, Count_ssn, Average_salary\n- **그룹화 속성이 없으면**: 함수를 **모든 투플에** 적용 → 결과는 **투플 하나** `ℑ COUNT Ssn, AVERAGE Salary (EMPLOYEE)` → (8, 35125)\n\n## 집계의 성질 {#ra-agg-props}\n\n- 집계 함수를 적용할 때 **중복은 제거하지 않는다** (급여 합·평균을 제대로 구해야 하니까)\n- **NULL은 집계에서 고려하지 않는다**\n- 관계 대수는 **닫힌 수학 체계**: 집계 결과도 스칼라 숫자가 아니라 **릴레이션** (값 하나, 투플 하나여도)\n\n## 외부 조인 {#ra-outer}\n\nEQUIJOIN·NATURAL JOIN(내부 조인)은 **조건을 만족하는 투플만** 결과에 넣고, 짝이 없는 투플은 버린다. 짝이 없어도 **한쪽(또는 양쪽) 릴레이션의 모든 투플을 남기고 싶을 때** 외부 조인을 쓴다.\n- 예) 모든 사원 이름과, 그 사원이 부서를 관리하면 그 부서 이름 (관리 안 하면 NULL)\n```\nTEMP   ← EMPLOYEE ⟕ Ssn=Mgr_ssn DEPARTMENT\nRESULT ← π Fname, Minit, Lname, Dname (TEMP)\n```\n→ 8행. Wong–Research, Wallace–Administration, Borg–Headquarters, 나머지 5명은 Dname = NULL\n- 종류: **LEFT OUTER JOIN ⟕** (왼쪽 모든 투플), **RIGHT OUTER JOIN ⟖** (오른쪽 모든 투플), **FULL OUTER JOIN ⟗** (양쪽 모두). 짝 없는 쪽 속성은 **NULL로 채움**", "html": "<section class=\"sec\" id=\"s-ra-aggregate\"><h3>집계 함수와 그룹화 (ℑ)<\/h3><p>기본 연산만으로는 <b>집계(SUM, AVERAGE, MAXIMUM, MINIMUM, COUNT)<\/b>, <b>그룹별 집계<\/b>, <b>외부 조인<\/b>을 표현 못 함 → 추가 연산으로 <b>표현력 확장<\/b>.<\/p>\n<p><b>&lt;그룹화 속성&gt; ℑ &lt;함수 리스트&gt; (R)<\/b> (ℑ = script F)<\/p>\n<ul><li>그룹화 속성: R의 속성 중 그룹을 나눌 기준 (없어도 됨)<\/li><li>함수 리스트: (&lt;함수&gt; &lt;속성&gt;) 쌍들. 함수 = SUM, AVERAGE, MAXIMUM, MINIMUM, COUNT<\/li><li><b>결과<\/b>: 그룹화 속성 + 함수 리스트 원소마다 속성 하나<\/li><\/ul>\n<p>예<\/p>\n<pre class=\"code\">ρ R(Dno, No_of_employees, Average_sal) ( Dno ℑ COUNT Ssn, AVERAGE Salary (EMPLOYEE) )<\/pre>\n<p>→ (5, 4, 33250), (4, 3, 31000), (1, 1, 55000)<\/p>\n<ul><li><b>이름을 안 바꾸면<\/b>: 속성 이름 = <code>&lt;함수&gt;_&lt;속성&gt;<\/code> → Dno, Count_ssn, Average_salary<\/li><li><b>그룹화 속성이 없으면<\/b>: 함수를 <b>모든 투플에<\/b> 적용 → 결과는 <b>투플 하나<\/b> <code>ℑ COUNT Ssn, AVERAGE Salary (EMPLOYEE)<\/code> → (8, 35125)<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p40.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p40.jpg\" alt=\"06 p.40 · 이름 안 바꾼 결과(Count_ssn, Average_salary)와 그룹화 속성 없는 경우\" loading=\"lazy\"><\/button><figcaption>06 p.40 · 이름 안 바꾼 결과(Count_ssn, Average_salary)와 그룹화 속성 없는 경우<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-ra-agg-props\"><h3>집계의 성질<\/h3><ul><li>집계 함수를 적용할 때 <b>중복은 제거하지 않는다<\/b> (급여 합·평균을 제대로 구해야 하니까)<\/li><li><b>NULL은 집계에서 고려하지 않는다<\/b><\/li><li>관계 대수는 <b>닫힌 수학 체계<\/b>: 집계 결과도 스칼라 숫자가 아니라 <b>릴레이션<\/b> (값 하나, 투플 하나여도)<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-ra-outer\"><h3>외부 조인<\/h3><p>EQUIJOIN·NATURAL JOIN(내부 조인)은 <b>조건을 만족하는 투플만<\/b> 결과에 넣고, 짝이 없는 투플은 버린다. 짝이 없어도 <b>한쪽(또는 양쪽) 릴레이션의 모든 투플을 남기고 싶을 때<\/b> 외부 조인을 쓴다.<\/p>\n<ul><li>예) 모든 사원 이름과, 그 사원이 부서를 관리하면 그 부서 이름 (관리 안 하면 NULL)<\/li><\/ul>\n<pre class=\"code\">TEMP   ← EMPLOYEE ⟕ Ssn=Mgr_ssn DEPARTMENT\nRESULT ← π Fname, Minit, Lname, Dname (TEMP)<\/pre>\n<p>→ 8행. Wong–Research, Wallace–Administration, Borg–Headquarters, 나머지 5명은 Dname = NULL<\/p>\n<ul><li>종류: <b>LEFT OUTER JOIN ⟕<\/b> (왼쪽 모든 투플), <b>RIGHT OUTER JOIN ⟖<\/b> (오른쪽 모든 투플), <b>FULL OUTER JOIN ⟗<\/b> (양쪽 모두). 짝 없는 쪽 속성은 <b>NULL로 채움<\/b><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p43.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p43.jpg\" alt=\"06 p.43 · EMPLOYEE ⟕ Ssn=Mgr_ssn DEPARTMENT\" loading=\"lazy\"><\/button><figcaption>06 p.43 · EMPLOYEE ⟕ Ssn=Mgr_ssn DEPARTMENT<\/figcaption><\/figure><\/section>"}, {"id": "L6-6", "title": "관계 대수 작성 연습", "src": "db-exercises Week 7 (p.55–59)", "secs": [{"id": "ra-practice-join", "title": "연습 1–2: 조인 경로"}, {"id": "ra-practice-union", "title": "연습 3: 합집합"}, {"id": "ra-practice-diff", "title": "연습 4–5: 차집합과 교집합"}], "md": "## 연습 1–2: 조인 경로 {#ra-practice-join}\n\n**연습 1**: 'Research' 부서에서 일하는 모든 사원의 이름과 주소\n```\nRESEARCH_DEPT ← σ Dname='Research' (DEPARTMENT)\nRESEARCH_EMPS ← RESEARCH_DEPT ⋈ Dnumber=Dno EMPLOYEE\nRESULT        ← π Fname, Lname, Address (RESEARCH_EMPS)\n```\n**연습 2**: 'Stafford'에 있는 프로젝트마다 프로젝트 번호, 통제 부서 번호, 관리자의 성·주소·생일\n```\nSTAFFORD_PROJS ← σ Plocation='Stafford' (PROJECT)\nCONTR_DEPTS    ← STAFFORD_PROJS ⋈ Dnum=Dnumber DEPARTMENT\nPROJ_DEPT_MGRS ← CONTR_DEPTS ⋈ Mgr_ssn=Ssn EMPLOYEE\nRESULT         ← π Pnumber, Dnum, Lname, Address, Bdate (PROJ_DEPT_MGRS)\n```\n→ (10, 4, Wallace, 291 Berry, Bellaire, TX, 1941-06-20), (30, 4, Wallace, …)\n\n요령: 조건이 있는 릴레이션에서 **σ를 먼저** → FK–PK를 따라 **⋈** → 마지막에 **π**.\n\n## 연습 3: 합집합 {#ra-practice-union}\n\n성이 'Smith'인 사원이 일꾼으로든, 프로젝트를 통제하는 부서의 관리자로든 관련된 프로젝트 번호\n```\nSMITHS(Essn)        ← π Ssn (σ Lname='Smith' (EMPLOYEE))\nSMITH_WORKER_PROJS  ← π Pno (WORKS_ON * SMITHS)\nMGRS                ← π Lname, Dnumber (EMPLOYEE ⋈ Ssn=Mgr_ssn DEPARTMENT)\nSMITH_MANAGED_DEPTS(Dnum) ← π Dnumber (σ Lname='Smith' (MGRS))\nSMITH_MGR_PROJS(Pno)      ← π Pnumber (SMITH_MANAGED_DEPTS * PROJECT)\nRESULT              ← SMITH_WORKER_PROJS ∪ SMITH_MGR_PROJS\n```\n- ∪를 하려고 두 결과의 속성 이름을 **Pno로 맞춤** (타입 호환)\n- SMITHS(Essn)으로 이름을 바꿔서 WORKS_ON과 **자연 조인**이 Essn으로 걸리게 함\n\n## 연습 4–5: 차집합과 교집합 {#ra-practice-diff}\n\n**연습 4**: 부양가족이 **없는** 사원의 이름\n```\nALL_EMPS             ← π Ssn (EMPLOYEE)\nEMPS_WITH_DEPS(Ssn)  ← π Essn (DEPENDENT)\nEMPS_WITHOUT_DEPS    ← ALL_EMPS − EMPS_WITH_DEPS\nRESULT               ← π Lname, Fname (EMPS_WITHOUT_DEPS * EMPLOYEE)\n```\n**연습 5**: 부양가족이 **하나 이상 있는 관리자**의 이름\n```\nMGRS(Ssn)            ← π Mgr_ssn (DEPARTMENT)\nEMPS_WITH_DEPS(Ssn)  ← π Essn (DEPENDENT)\nMGRS_WITH_DEPS       ← MGRS ∩ EMPS_WITH_DEPS\nRESULT               ← π Lname, Fname (MGRS_WITH_DEPS * EMPLOYEE)\n```\n→ Wong, Wallace\n\n> 시험 포인트: \"~가 없는\" = **차집합 (−)**, \"A이면서 B\" = **교집합 (∩)**, \"A이거나 B\" = **합집합 (∪)**, \"모든 ~\" = **나눗셈 (÷)**. SQL의 NOT EXISTS / EXISTS AND EXISTS / UNION / NOT EXISTS(EXCEPT)와 1:1로 대응시켜 외워.", "html": "<section class=\"sec\" id=\"s-ra-practice-join\"><h3>연습 1–2: 조인 경로<\/h3><p><b>연습 1<\/b>: 'Research' 부서에서 일하는 모든 사원의 이름과 주소<\/p>\n<pre class=\"code\">RESEARCH_DEPT ← σ Dname=&#x27;Research&#x27; (DEPARTMENT)\nRESEARCH_EMPS ← RESEARCH_DEPT ⋈ Dnumber=Dno EMPLOYEE\nRESULT        ← π Fname, Lname, Address (RESEARCH_EMPS)<\/pre>\n<p><b>연습 2<\/b>: 'Stafford'에 있는 프로젝트마다 프로젝트 번호, 통제 부서 번호, 관리자의 성·주소·생일<\/p>\n<pre class=\"code\">STAFFORD_PROJS ← σ Plocation=&#x27;Stafford&#x27; (PROJECT)\nCONTR_DEPTS    ← STAFFORD_PROJS ⋈ Dnum=Dnumber DEPARTMENT\nPROJ_DEPT_MGRS ← CONTR_DEPTS ⋈ Mgr_ssn=Ssn EMPLOYEE\nRESULT         ← π Pnumber, Dnum, Lname, Address, Bdate (PROJ_DEPT_MGRS)<\/pre>\n<p>→ (10, 4, Wallace, 291 Berry, Bellaire, TX, 1941-06-20), (30, 4, Wallace, …)<\/p>\n<p>요령: 조건이 있는 릴레이션에서 <b>σ를 먼저<\/b> → FK–PK를 따라 <b>⋈<\/b> → 마지막에 <b>π<\/b>.<\/p><\/section>\n<section class=\"sec\" id=\"s-ra-practice-union\"><h3>연습 3: 합집합<\/h3><p>성이 'Smith'인 사원이 일꾼으로든, 프로젝트를 통제하는 부서의 관리자로든 관련된 프로젝트 번호<\/p>\n<pre class=\"code\">SMITHS(Essn)        ← π Ssn (σ Lname=&#x27;Smith&#x27; (EMPLOYEE))\nSMITH_WORKER_PROJS  ← π Pno (WORKS_ON * SMITHS)\nMGRS                ← π Lname, Dnumber (EMPLOYEE ⋈ Ssn=Mgr_ssn DEPARTMENT)\nSMITH_MANAGED_DEPTS(Dnum) ← π Dnumber (σ Lname=&#x27;Smith&#x27; (MGRS))\nSMITH_MGR_PROJS(Pno)      ← π Pnumber (SMITH_MANAGED_DEPTS * PROJECT)\nRESULT              ← SMITH_WORKER_PROJS ∪ SMITH_MGR_PROJS<\/pre>\n<ul><li>∪를 하려고 두 결과의 속성 이름을 <b>Pno로 맞춤<\/b> (타입 호환)<\/li><li>SMITHS(Essn)으로 이름을 바꿔서 WORKS_ON과 <b>자연 조인<\/b>이 Essn으로 걸리게 함<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-ra-practice-diff\"><h3>연습 4–5: 차집합과 교집합<\/h3><p><b>연습 4<\/b>: 부양가족이 <b>없는<\/b> 사원의 이름<\/p>\n<pre class=\"code\">ALL_EMPS             ← π Ssn (EMPLOYEE)\nEMPS_WITH_DEPS(Ssn)  ← π Essn (DEPENDENT)\nEMPS_WITHOUT_DEPS    ← ALL_EMPS − EMPS_WITH_DEPS\nRESULT               ← π Lname, Fname (EMPS_WITHOUT_DEPS * EMPLOYEE)<\/pre>\n<p><b>연습 5<\/b>: 부양가족이 <b>하나 이상 있는 관리자<\/b>의 이름<\/p>\n<pre class=\"code\">MGRS(Ssn)            ← π Mgr_ssn (DEPARTMENT)\nEMPS_WITH_DEPS(Ssn)  ← π Essn (DEPENDENT)\nMGRS_WITH_DEPS       ← MGRS ∩ EMPS_WITH_DEPS\nRESULT               ← π Lname, Fname (MGRS_WITH_DEPS * EMPLOYEE)<\/pre>\n<p>→ Wong, Wallace<\/p>\n<div class=\"callout exam\">시험 포인트: \"~가 없는\" = <b>차집합 (−)<\/b>, \"A이면서 B\" = <b>교집합 (∩)<\/b>, \"A이거나 B\" = <b>합집합 (∪)<\/b>, \"모든 ~\" = <b>나눗셈 (÷)<\/b>. SQL의 NOT EXISTS / EXISTS AND EXISTS / UNION / NOT EXISTS(EXCEPT)와 1:1로 대응시켜 외워.<\/div><\/section>"}]}], "questions": [{"id": "1-def-1", "concept": "db-def", "type": "mc", "prompt": "'Database System'의 정의로 옳은 것은?", "choices": ["논리적으로 관련된 데이터의 모음", "데이터를 관리하는 소프트웨어", "DB + DBMS 소프트웨어", "DB를 설계하는 사람"], "answer": 2, "lesson": "L1-1", "unit": "U1"}, {"id": "1-def-2", "concept": "db-def", "type": "blank", "prompt": "DBMS는 DB를 (a) 하고, 구축(construct)하고, (b) 하고, 공유(share)하는 소프트웨어이다.", "answer": "(a) 정의 / (b) 조작", "accept": [["정의", "define", "defining", "정의하"], ["조작", "manipulate", "manipulating", "조작하"]], "lesson": "L1-1", "unit": "U1"}, {"id": "1-def-3", "concept": "db-def", "type": "ox", "prompt": "MySQL, SQLite, Oracle은 DB의 예이고, 그 안에 저장된 테이블들이 DBMS이다.", "answer": false, "explain": "MySQL, SQLite, Oracle은 DBMS(소프트웨어). 그 소프트웨어가 관리하는 데이터의 모음이 DB.", "lesson": "L1-1", "unit": "U1"}, {"id": "1-def-4", "concept": "db-def", "type": "short", "prompt": "DB, DBMS, DB 시스템을 각각 한 줄로 정의하시오.", "answer": "DB: 논리적으로 일관된, 서로 관련된 데이터의 모음(DBMS가 관리). DBMS: 데이터를 구조화된 방식으로 효율적으로 관리(정의·구축·조작·공유)하는 소프트웨어. DB 시스템: DB + DBMS 소프트웨어.", "keys": ["DB = 관련 데이터의 모음", "DBMS = 관리 소프트웨어 (정의·구축·조작·공유)", "DB 시스템 = DB + DBMS"], "lesson": "L1-1", "unit": "U1"}, {"id": "1-why-1", "concept": "why-dbms", "type": "mc", "prompt": "텍스트 파일로 메시지 앱 데이터를 관리할 때 '앱이 새 항목을 쓰는 중에 기계가 죽으면?'은 어떤 문제 묶음에 속하나?", "choices": ["데이터 무결성 (Integrity)", "데이터 관리 (Management)", "데이터 지속성 (Durability)", "데이터 추상화 (Abstraction)"], "answer": 2, "lesson": "L1-1", "unit": "U1"}, {"id": "1-why-2", "concept": "why-dbms", "type": "mc", "prompt": "다음 중 '데이터 무결성' 문제의 예는?", "choices": ["특정 메시지를 빨리 찾으려면?", "친구 정보를 실수로 중복 입력하면?", "여러 사용자가 동시에 쓰면?", "크래시 후 복구는?"], "answer": 1, "explain": "무결성: 메시지 길이 제한, 중복 친구, 같은 이름. 관리: 빠른 검색, 동시 접근. 지속성: 크래시, 복구.", "lesson": "L1-1", "unit": "U1"}, {"id": "1-when-1", "concept": "when-not", "type": "mc", "prompt": "DBMS 대신 맞춤형 DB를 쓰는 게 나은 경우가 '아닌' 것은?", "choices": ["절대 바뀌지 않는 단순한 응용", "엄격한 실시간 요구", "저장 용량이 제한된 임베디드 시스템", "여러 사용자가 동시에 같은 데이터를 갱신"], "answer": 3, "explain": "다중 사용자 동시 접근은 오히려 DBMS(동시성 제어)가 필요한 경우.", "lesson": "L1-1", "unit": "U1"}, {"id": "1-when-2", "concept": "when-not", "type": "short", "prompt": "DBMS를 쓰면 생기는 오버헤드를 두 가지 이상 쓰시오.", "answer": "하드웨어·소프트웨어·교육에 드는 높은 초기 투자, 데이터를 정의·처리하는 범용성의 비용, 보안·동시성 제어·회복·무결성 기능의 부담.", "keys": ["높은 초기 투자 (HW·SW·교육)", "범용성(generality) 비용", "보안·동시성 제어·회복·무결성 기능 부담"], "lesson": "L1-1", "unit": "U1"}, {"id": "1-char-1", "concept": "self-desc", "type": "mc", "prompt": "DB 구조와 제약조건의 정의(메타데이터)가 저장되는 곳은?", "choices": ["응용 프로그램 소스 코드", "DBMS 카탈로그", "외부 스키마", "트랜잭션 로그"], "answer": 1, "lesson": "L1-2", "unit": "U1"}, {"id": "1-char-2", "concept": "self-desc", "type": "short", "prompt": "DB 시스템의 '자기 기술성(self-describing nature)'이란 무엇인지 설명하시오.", "answer": "DB 시스템은 DB 자체뿐 아니라 DB의 구조와 제약조건을 정의한 메타데이터도 함께 담고 있다. 메타데이터는 DBMS 카탈로그에 저장되고 DB를 유지하는 데 필요하다.", "keys": ["DB + 메타데이터를 함께 포함", "메타데이터 = 구조·제약조건의 정의", "카탈로그에 저장"], "slot": 1, "pts": 3, "lesson": "L1-2", "unit": "U1"}, {"id": "1-char-3", "concept": "self-desc", "type": "ox", "prompt": "메타데이터는 SQL의 DDL로 정의한다.", "answer": true, "lesson": "L1-2", "unit": "U1"}, {"id": "1-char-4", "concept": "self-desc", "type": "blank", "prompt": "메타데이터는 DB의 (a) 와 제약조건에 대한 정의이며, DBMS (b) 에 저장된다.", "answer": "(a) 구조 / (b) 카탈로그", "accept": [["구조", "structure"], ["카탈로그", "catalog"]], "lesson": "L1-2", "unit": "U1"}, {"id": "1-abs-1", "concept": "abstraction", "type": "mc", "prompt": "'데이터 구조가 바뀌어도 프로그램은 영향을 받지 않는다'는 성질의 이름은?", "choices": ["프로그램-데이터 독립성", "자기 기술성", "다중 뷰", "동시성 제어"], "answer": 0, "lesson": "L1-2", "unit": "U1"}, {"id": "1-abs-2", "concept": "abstraction", "type": "ox", "prompt": "데이터 추상화는 데이터의 물리 수준(저장 방식, 연산 구현)을 사용자에게 보여주고 논리 수준은 숨기는 것이다.", "answer": false, "explain": "반대. 개념적(논리) 표현을 제공하고 물리 수준 세부를 숨긴다.", "lesson": "L1-2", "unit": "U1"}, {"id": "1-abs-3", "concept": "abstraction", "type": "short", "prompt": "DB 시스템의 '데이터 추상화' 특징을 설명하시오.", "answer": "프로그램과 데이터 사이를 절연한다. DB 시스템은 데이터의 개념적 표현(객체, 속성, 관계)을 제공하고, 저장 방식이나 연산 구현 같은 물리 수준의 복잡한 구조는 감춘다. 그래서 데이터 구조가 바뀌어도 프로그램이 영향을 받지 않는다(프로그램-데이터 독립성).", "keys": ["프로그램과 데이터의 절연", "개념적(논리) 표현 제공, 물리 세부 숨김", "프로그램-데이터 독립성"], "slot": 1, "pts": 3, "lesson": "L1-2", "unit": "U1"}, {"id": "1-abs-4", "concept": "abstraction", "type": "mc", "prompt": "다음 중 데이터 추상화에서 '숨기는' 것은?", "choices": ["객체", "객체의 속성", "객체 사이의 관계", "데이터가 디스크에 저장되는 방식"], "answer": 3, "lesson": "L1-2", "unit": "U1"}, {"id": "1-view-1", "concept": "multi-views", "type": "mc", "prompt": "뷰(view)에 대한 설명으로 옳은 것은?", "choices": ["DB에 명시적으로 저장된 기본 테이블", "사용자마다 따로 만든 DB 사본", "DB에서 파생됐지만 명시적으로 저장되지 않은 가상 데이터", "물리 저장 구조를 기술한 스키마"], "answer": 2, "lesson": "L1-2", "unit": "U1"}, {"id": "1-view-2", "concept": "multi-views", "type": "ox", "prompt": "다중 뷰 지원 덕분에 사용자는 보는 데이터가 저장된 것인지 파생된 것인지 알 필요가 없다.", "answer": true, "lesson": "L1-2", "unit": "U1"}, {"id": "1-view-3", "concept": "multi-views", "type": "short", "prompt": "대학 DB에서 '다중 뷰'의 예를 두 개 들고, 이 특징이 왜 필요한지 쓰시오.", "answer": "예: 학생별 성적표를 출력하는 뷰, 과목별 선수과목을 확인하는 뷰. 사용자마다 필요한 데이터 관점이 다르기 때문에, 같은 DB에서 각자에게 맞는 가상 데이터(뷰)를 제공한다.", "keys": ["예 2개 (성적표, 선수과목 등)", "사용자마다 필요한 관점이 다름"], "lesson": "L1-2", "unit": "U1"}, {"id": "1-view-4", "concept": "multi-views", "type": "blank", "prompt": "뷰는 DB에서 (a) 되었지만 명시적으로 (b) 되지 않은 가상 데이터이다.", "answer": "(a) 파생 / (b) 저장", "accept": [["파생", "유도", "derived", "derive"], ["저장", "stored", "store"]], "lesson": "L1-2", "unit": "U1"}, {"id": "1-share-1", "concept": "sharing", "type": "blank", "prompt": "트랜잭션이 만족해야 하는 ACID는 원자성(Atomicity), (a) (Consistency), 고립성(Isolation), (b) (Durability)이다.", "answer": "(a) 일관성 / (b) 지속성", "accept": [["일관성", "consistency"], ["지속성", "durability", "영속성"]], "lesson": "L1-2", "unit": "U1"}, {"id": "1-share-2", "concept": "sharing", "type": "mc", "prompt": "좌석이 하나 남은 항공편에 여러 예약 담당자가 동시에 배정하려 할 때 필요한 DBMS 기능은?", "choices": ["카탈로그", "동시성 제어", "뷰", "데이터 독립성"], "answer": 1, "lesson": "L1-2", "unit": "U1"}, {"id": "1-share-3", "concept": "sharing", "type": "short", "prompt": "'트랜잭션'을 정의하고, 다중 사용자 환경에서 트랜잭션이 지켜야 할 성질의 이름을 쓰시오.", "answer": "트랜잭션은 하나의 논리적 기능을 수행하는 연산들의 모음이다. ACID(원자성, 일관성, 고립성, 지속성)를 만족해야 한다.", "keys": ["하나의 논리적 기능을 하는 연산 모음", "ACID 네 가지"], "slot": 1, "pts": 3, "lesson": "L1-2", "unit": "U1"}, {"id": "1-share-4", "concept": "sharing", "type": "ox", "prompt": "데이터 공유 특징은 여러 응용의 데이터를 각자 별도의 DB에 나눠 관리하는 것을 말한다.", "answer": false, "explain": "여러 앱의 데이터를 '하나의 DB'에 통합해 관리하고 여러 사용자가 동시에 접근.", "lesson": "L1-2", "unit": "U1"}, {"id": "1-char-5", "concept": "sharing", "type": "short", "prompt": "DB 시스템의 네 가지 특징을 쓰고 각각 한 줄로 설명하시오.", "answer": "1) 자기 기술성: DB와 메타데이터(카탈로그)를 함께 담음. 2) 데이터 추상화: 개념적 표현을 제공하고 물리 세부를 숨김(프로그램-데이터 독립성). 3) 다중 뷰 지원: 사용자마다 다른 가상 데이터(뷰) 제공. 4) 데이터 공유와 다중 사용자 트랜잭션 처리: 여러 사용자가 동시에 접근, 동시성 제어·ACID.", "keys": ["자기 기술성", "데이터 추상화", "다중 뷰", "데이터 공유·다중 사용자 트랜잭션"], "slot": 1, "pts": 3, "lesson": "L1-2", "unit": "U1"}, {"id": "1-dm-1", "concept": "data-models", "type": "mc", "prompt": "ER 모델은 어느 범주의 데이터 모델인가?", "choices": ["개념적 (conceptual)", "표현적 (representational)", "물리적 (physical)", "외부적 (external)"], "answer": 0, "lesson": "L1-3", "unit": "U1"}, {"id": "1-dm-2", "concept": "data-models", "type": "mc", "prompt": "'레코드 형식, 순서, 접근 경로'를 표현하는 데이터 모델은?", "choices": ["개념적", "표현적", "물리적", "논리적"], "answer": 2, "lesson": "L1-3", "unit": "U1"}, {"id": "1-dm-3", "concept": "data-models", "type": "ox", "prompt": "표현적 데이터 모델은 물리 저장의 세부를 숨기지만 컴퓨터 시스템에 바로 구현할 수 있다.", "answer": true, "lesson": "L1-3", "unit": "U1"}, {"id": "1-dm-4", "concept": "data-models", "type": "short", "prompt": "데이터 모델의 세 범주를 쓰고 각각을 한 줄로 설명하시오.", "answer": "개념적(high-level): 사용자가 데이터를 인식하는 방식에 가까운 개념 (ER 모델). 표현적: DBMS가 데이터를 관리하는 방식, 물리 세부는 숨기지만 바로 구현 가능 (관계 모델). 물리적(low-level): 레코드 형식·순서·접근 경로 등 저장 방식, 전문가용.", "keys": ["개념적 = 사용자 관점", "표현적 = 개념과 물리 사이, DBMS가 관리", "물리적 = 저장 방식·접근 경로"], "slot": 2, "pts": 3, "lesson": "L1-3", "unit": "U1"}, {"id": "1-3s-1", "concept": "three-schema", "type": "mc", "prompt": "3단계 스키마 구조에서 '특정 사용자 그룹이 관심 있는 DB 구조의 일부'를 기술하는 것은?", "choices": ["외부 스키마", "개념 스키마", "내부 스키마", "카탈로그"], "answer": 0, "lesson": "L1-3", "unit": "U1"}, {"id": "1-3s-2", "concept": "three-schema", "type": "mc", "prompt": "3단계 스키마 구조에서 실제 데이터가 저장되는 수준은?", "choices": ["외부 수준", "개념 수준", "물리(내부) 수준만", "세 수준 모두"], "answer": 2, "lesson": "L1-3", "unit": "U1"}, {"id": "1-3s-3", "concept": "three-schema", "type": "blank", "prompt": "개념 스키마는 (a) 데이터 모델로 DB의 논리 구조를 기술하고, 내부 스키마는 (b) 데이터 모델로 물리 저장 구조를 기술한다.", "answer": "(a) 표현적 / (b) 물리적", "accept": [["표현적", "표현", "representational"], ["물리적", "물리", "physical"]], "lesson": "L1-3", "unit": "U1"}, {"id": "1-3s-4", "concept": "three-schema", "type": "short", "prompt": "3단계 스키마 구조의 목표와 세 수준(스키마)을 설명하시오.", "answer": "목표: 사용자 응용을 물리적 DB에서 분리해 프로그램과 데이터의 독립성을 얻는 것. 외부 수준(외부 스키마/뷰): 특정 사용자 그룹이 관심 있는 부분. 개념 수준(개념 스키마): 전체 DB의 논리 구조를 표현적 모델로 기술, 물리 저장은 숨김. 내부 수준(내부 스키마): 물리 저장 구조와 접근 경로를 물리적 모델로 기술.", "keys": ["목표: 응용과 물리 DB 분리 (독립성)", "외부: 사용자 그룹 관점", "개념: 전체 논리 구조", "내부: 물리 저장 구조"], "slot": 2, "pts": 3, "lesson": "L1-3", "unit": "U1"}, {"id": "1-3s-5", "concept": "three-schema", "type": "ox", "prompt": "개념 스키마는 엔티티, 데이터 타입, 관계, 사용자 연산, 제약조건 같은 고수준 개념을 다룬다.", "answer": true, "lesson": "L1-3", "unit": "U1"}, {"id": "1-3s-6", "concept": "three-schema", "type": "mc", "prompt": "대학 DB에서 '저장소의 모든 세부와 접근 경로'를 기술하는 수준은?", "choices": ["외부 수준", "개념 수준", "내부 수준", "응용 수준"], "answer": 2, "lesson": "L1-3", "unit": "U1"}, {"id": "1-map-1", "concept": "schema-mapping", "type": "short", "prompt": "실제 데이터는 내부 수준에만 있는데 DBMS는 외부 스키마로 들어온 요청을 어떻게 처리하는지 설명하시오.", "answer": "DBMS가 수준 사이의 사상(mapping)으로 요청을 변환한다. 외부 스키마의 요청을 개념 스키마로, 다시 내부 스키마의 요청으로 바꿔 저장된 DB에서 처리하고, 꺼낸 결과를 사용자의 외부 뷰에 맞게 다시 형식화한다. 사상 정보도 카탈로그에 저장된다.", "keys": ["외부→개념→내부로 요청 변환", "결과를 외부 뷰 형식으로 재구성", "사상 정보는 카탈로그에"], "lesson": "L1-3", "unit": "U1"}, {"id": "1-map-2", "concept": "schema-mapping", "type": "ox", "prompt": "스키마 사이의 사상(mapping) 정보도 카탈로그에 저장된다.", "answer": true, "lesson": "L1-3", "unit": "U1"}, {"id": "1-di-1", "concept": "data-indep", "type": "mc", "prompt": "개념 스키마에 새 데이터 항목을 추가해도 외부 스키마와 응용 프로그램을 바꿀 필요가 없는 성질은?", "choices": ["논리적 데이터 독립성", "물리적 데이터 독립성", "자기 기술성", "참조 무결성"], "answer": 0, "lesson": "L1-3", "unit": "U1"}, {"id": "1-di-2", "concept": "data-indep", "type": "mc", "prompt": "검색 속도를 높이려고 접근 경로(인덱스)를 추가해도 개념 스키마가 그대로인 성질은?", "choices": ["논리적 데이터 독립성", "물리적 데이터 독립성", "다중 뷰 지원", "데이터 공유"], "answer": 1, "lesson": "L1-3", "unit": "U1"}, {"id": "1-di-3", "concept": "data-indep", "type": "blank", "prompt": "데이터 독립성은 한 수준의 스키마를 바꿔도 바로 (a) 수준의 스키마를 바꿀 필요가 없는 능력이다. 논리적 독립성은 (b) 스키마를, 물리적 독립성은 (c) 스키마를 바꾸는 것과 관련된다.", "answer": "(a) 위 / (b) 개념 / (c) 내부", "accept": [["위", "상위", "higher", "윗"], ["개념", "conceptual"], ["내부", "internal", "물리"]], "lesson": "L1-3", "unit": "U1"}, {"id": "1-di-4", "concept": "data-indep", "type": "short", "prompt": "논리적 데이터 독립성과 물리적 데이터 독립성을 예와 함께 설명하시오.", "answer": "데이터 독립성: 한 수준의 스키마를 바꿔도 바로 위 수준 스키마를 바꿀 필요가 없는 능력. 논리적: 개념 스키마를 바꿔도(예: 새 데이터 추가·제거) 외부 스키마·응용 프로그램은 그대로. 물리적: 내부 스키마를 바꿔도(예: 저장 구조 변경, 인덱스 같은 접근 경로 추가) 개념 스키마는 그대로. 기존 응용 프로그램의 유지보수 부담을 줄인다.", "keys": ["정의: 하위 변경이 상위에 영향 없음", "논리 = 개념 스키마 변경 + 예", "물리 = 내부 스키마 변경 + 예"], "pts": 3, "slot": 2, "lesson": "L1-3", "unit": "U1"}, {"id": "1-di-5", "concept": "data-indep", "type": "ox", "prompt": "물리적 데이터 독립성은 개념 스키마를 바꿔도 내부 스키마를 바꿀 필요가 없는 능력이다.", "answer": false, "explain": "방향이 반대. 내부 스키마를 바꿔도 개념 스키마(바로 위)를 바꿀 필요가 없는 능력.", "lesson": "L1-3", "unit": "U1"}, {"id": "1-di-6", "concept": "data-indep", "type": "mc", "prompt": "데이터 독립성이 주는 가장 큰 이점은?", "choices": ["저장 공간 절약", "질의 속도 향상", "기존 응용 프로그램의 유지보수 부담 감소", "보안 강화"], "answer": 2, "lesson": "L1-3", "unit": "U1"}, {"id": "2-proc-1", "concept": "design-process", "type": "mc", "prompt": "DB 설계 과정에서 요구사항을 '개념 스키마'로 번역하는 단계는?", "choices": ["요구사항 수집·분석", "개념적 설계", "논리적 설계", "물리적 설계"], "answer": 1, "lesson": "L2-1", "unit": "U2"}, {"id": "2-proc-2", "concept": "design-process", "type": "mc", "prompt": "구현 단계에 속하는 두 설계는?", "choices": ["요구사항 분석, 개념적 설계", "개념적 설계, 논리적 설계", "논리적 설계(DB 스키마), 물리적 설계(물리적 배치)", "ER 설계, 뷰 설계"], "answer": 2, "lesson": "L2-1", "unit": "U2"}, {"id": "2-ent-1", "concept": "entity-attr", "type": "mc", "prompt": "ER 모델에서 '현실 세계에서 독립적으로 존재하며 다른 것과 구별되는 것'은?", "choices": ["개체 (entity)", "속성 (attribute)", "관계 (relationship)", "도메인 (domain)"], "answer": 0, "lesson": "L2-1", "unit": "U2"}, {"id": "2-ent-2", "concept": "entity-attr", "type": "ox", "prompt": "회사(company)처럼 개념적으로만 존재하는 것도 개체가 될 수 있다.", "answer": true, "explain": "개체는 물리적 존재(사원)일 수도 개념적 존재(회사, 강좌)일 수도 있다.", "lesson": "L2-1", "unit": "U2"}, {"id": "2-ent-3", "concept": "entity-attr", "type": "short", "prompt": "ER 모델에서 개체, 속성, 관계를 각각 정의하시오.", "answer": "개체: 현실 세계에서 독립적으로 존재하고 다른 것과 구별되는 것(물리적 또는 개념적 존재). 속성: 개체를 기술하는 특정 성질. 관계: 여러 개체 사이의 연관.", "keys": ["개체 = 독립적 존재, 구별 가능", "속성 = 개체를 기술하는 성질", "관계 = 개체들 사이의 연관"], "lesson": "L2-1", "unit": "U2"}, {"id": "2-ent-4", "concept": "entity-attr", "type": "mc", "prompt": "다음 중 '속성'이 아닌 것은?", "choices": ["사원의 이름", "사원의 주소", "회사의 본사 위치", "사원이 일하는 부서와의 연관"], "answer": 3, "explain": "부서와의 연관은 관계(WORKS_FOR). 초기 설계에선 속성처럼 넣었다가 다듬기에서 관계로 바꾼다.", "lesson": "L2-1", "unit": "U2"}, {"id": "2-attr-1", "concept": "attr-types", "type": "mc", "prompt": "Address = (Street_address, City, State, Zip)는 어떤 속성인가?", "choices": ["복합 속성", "다중값 속성", "유도 속성", "키 속성"], "answer": 0, "lesson": "L2-1", "unit": "U2"}, {"id": "2-attr-2", "concept": "attr-types", "type": "mc", "prompt": "한 사원이 학위를 여러 개 가질 때 College_degrees는 어떤 속성인가?", "choices": ["복합 속성", "다중값 속성", "유도 속성", "단순 속성"], "answer": 1, "lesson": "L2-1", "unit": "U2"}, {"id": "2-attr-3", "concept": "attr-types", "type": "mc", "prompt": "Birth_date에서 계산할 수 있는 Age는?", "choices": ["복합 속성", "다중값 속성", "유도 속성", "키 속성"], "answer": 2, "lesson": "L2-1", "unit": "U2"}, {"id": "2-attr-4", "concept": "attr-types", "type": "blank", "prompt": "ER 다이어그램에서 다중값 속성은 (a) 타원으로, 유도 속성은 (b) 타원으로 그린다.", "answer": "(a) 이중 / (b) 점선", "accept": [["이중", "두 줄", "이중선", "double"], ["점선", "dashed", "dotted"]], "lesson": "L2-1", "unit": "U2"}, {"id": "2-attr-5", "concept": "attr-types", "type": "short", "prompt": "속성의 세 가지 분류 기준을 쓰고 각각 예를 하나씩 드시오.", "answer": "1) 복합 vs 단순: 복합은 더 작은 부분으로 나뉨(Address = Street, City, State, Zip), 단순(원자)은 안 나뉨(City). 2) 단일값 vs 다중값: 개체마다 값 하나(Age, SSN) vs 값의 집합(Phone numbers, College degrees). 3) 저장 vs 유도: DB에 저장(Birth_date) vs 다른 속성에서 계산(Age).", "keys": ["복합/단순 + 예", "단일값/다중값 + 예", "저장/유도 + 예"], "lesson": "L2-1", "unit": "U2"}, {"id": "2-attr-6", "concept": "attr-types", "type": "ox", "prompt": "DEPARTMENT의 Locations는 부서마다 위치가 여러 개일 수 있어서 복합 속성이다.", "answer": false, "explain": "여러 값 = 다중값 속성. 복합은 한 값이 여러 부분으로 나뉘는 것.", "lesson": "L2-1", "unit": "U2"}, {"id": "2-attr-7", "concept": "attr-types", "type": "mc", "prompt": "EMPLOYEE의 Name = (Fname, Minit, Lname)은?", "choices": ["복합 속성", "다중값 속성", "유도 속성", "약한 속성"], "answer": 0, "lesson": "L2-1", "unit": "U2"}, {"id": "2-key-1", "concept": "key-attr", "type": "ox", "prompt": "한 개체 타입은 키 속성을 둘 이상 가질 수 있다.", "answer": true, "explain": "예: CAR의 키 = Registration, Vehicle_id.", "lesson": "L2-1", "unit": "U2"}, {"id": "2-key-2", "concept": "key-attr", "type": "mc", "prompt": "CAR의 Registration(Number, State)에 대한 설명으로 옳은 것은?", "choices": ["다중값 키", "두 속성이 모여 하나의 키를 이루는 복합 키", "유도 키", "부분 키"], "answer": 1, "lesson": "L2-1", "unit": "U2"}, {"id": "2-key-3", "concept": "key-attr", "type": "short", "prompt": "ER 모델의 키 속성이란 무엇이고 다이어그램에 어떻게 표시하는지 쓰시오.", "answer": "개체마다 값이 서로 다른 속성으로, 각 개체를 유일하게 식별한다. 여러 속성이 모여 키가 될 수도 있고 키가 여러 개일 수도 있다. 다이어그램에서는 속성 이름에 밑줄.", "keys": ["개체마다 값이 다름 → 유일 식별", "밑줄로 표시"], "lesson": "L2-1", "unit": "U2"}, {"id": "2-key-4", "concept": "key-attr", "type": "blank", "prompt": "키 속성은 다이어그램에서 (a) 로 표시하고, 약한 개체의 부분 키는 (b) 밑줄로 표시한다.", "answer": "(a) 밑줄 / (b) 점선", "accept": [["밑줄", "underline", "실선 밑줄"], ["점선", "dashed", "dotted"]], "lesson": "L2-1", "unit": "U2"}, {"id": "2-not-1", "concept": "er-notation", "type": "mc", "prompt": "ER 다이어그램에서 이중 마름모가 나타내는 것은?", "choices": ["약한 개체 타입", "다중값 속성", "식별 관계 타입", "M:N 관계"], "answer": 2, "lesson": "L2-1", "unit": "U2"}, {"id": "2-not-2", "concept": "er-notation", "type": "mc", "prompt": "E₁ — R ═ E₂ (E₂ 쪽만 이중선)의 의미는?", "choices": ["E₁이 R에 전체 참여", "E₂가 R에 전체 참여", "R이 1:N", "E₂가 약한 개체"], "answer": 1, "lesson": "L2-1", "unit": "U2"}, {"id": "2-not-3", "concept": "er-notation", "type": "ox", "prompt": "이중 직사각형은 약한 개체 타입을 나타낸다.", "answer": true, "lesson": "L2-1", "unit": "U2"}, {"id": "2-not-4", "concept": "er-notation", "type": "blank", "prompt": "ER 다이어그램에서 개체 타입은 (a), 관계 타입은 (b), 속성은 타원으로 그린다.", "answer": "(a) 직사각형 / (b) 마름모", "accept": [["직사각형", "사각형", "네모", "rectangle"], ["마름모", "diamond", "다이아몬드"]], "lesson": "L2-1", "unit": "U2"}, {"id": "2-init-1", "concept": "initial-design", "type": "short", "prompt": "COMPANY 초기 설계에서 EMPLOYEE의 Department, Supervisor, Works_on 같은 속성은 어떤 문제가 있고, 어떻게 고치는지 쓰시오.", "answer": "이 속성들은 사실 다른 개체(부서, 다른 사원, 프로젝트)를 참조한다. 관계가 속성 형태로 암묵적으로 들어가 있는 것이므로, 명시적인 관계 타입(WORKS_FOR, SUPERVISION, WORKS_ON)으로 바꿔야 한다.", "keys": ["다른 개체를 참조하는 속성 = 암묵적 관계", "관계 타입으로 바꿈"], "lesson": "L2-1", "unit": "U2"}, {"id": "2-init-2", "concept": "initial-design", "type": "mc", "prompt": "COMPANY 초기 설계에서 DEPARTMENT의 키 속성은?", "choices": ["Number만", "Name만", "Manager", "Name과 Number 둘 다 (각각 고유)"], "answer": 3, "lesson": "L2-1", "unit": "U2"}, {"id": "2-rel-1", "concept": "rel-type", "type": "mc", "prompt": "관계 타입의 '차수(degree)'란?", "choices": ["관계 인스턴스의 수", "참여하는 개체 타입의 수", "관계 속성의 수", "카디널리티 비의 최댓값"], "answer": 1, "lesson": "L2-2", "unit": "U2"}, {"id": "2-rel-2", "concept": "rel-type", "type": "mc", "prompt": "SUPPLY(SUPPLIER, PART, PROJECT)의 차수는?", "choices": ["1 (단항)", "2 (2진)", "3 (3진)", "M:N"], "answer": 2, "lesson": "L2-2", "unit": "U2"}, {"id": "2-rel-3", "concept": "rel-type", "type": "ox", "prompt": "DB 시스템에서 대부분의 관계는 2진 관계이다.", "answer": true, "lesson": "L2-2", "unit": "U2"}, {"id": "2-rel-4", "concept": "rel-type", "type": "short", "prompt": "관계 타입의 '역할 이름(role name)'이 무엇이고 언제 꼭 필요한지 쓰시오.", "answer": "참여 개체가 관계 인스턴스에서 맡는 역할(예: WORKS_FOR에서 EMPLOYEE = worker, DEPARTMENT = employer). 관계의 의미를 이해하게 해준다. 같은 개체 타입이 두 번 이상 참여하는 순환 관계에서는 참여 개체를 구별하려고 꼭 필요하다.", "keys": ["참여 개체가 맡는 역할", "순환 관계에서 필수"], "lesson": "L2-2", "unit": "U2"}, {"id": "2-rec-1", "concept": "recursive", "type": "mc", "prompt": "순환(recursive) 관계의 예는?", "choices": ["WORKS_FOR", "MANAGES", "SUPERVISION", "CONTROLS"], "answer": 2, "lesson": "L2-2", "unit": "U2"}, {"id": "2-rec-2", "concept": "recursive", "type": "ox", "prompt": "순환 관계에서는 같은 개체 타입이 두 번 이상 참여하므로 역할 이름을 명시해야 한다.", "answer": true, "lesson": "L2-2", "unit": "U2"}, {"id": "2-rec-3", "concept": "recursive", "type": "short", "prompt": "SUPERVISION 관계가 순환 관계인 이유와, 인스턴스 r = (e₁, e₂)를 해석하는 데 필요한 정보를 쓰시오.", "answer": "EMPLOYEE 개체 타입이 supervisor와 supervisee 두 역할로 한 관계에 참여하기 때문. r = (e₁, e₂)에서 어느 쪽이 supervisor 역할이고 어느 쪽이 supervisee 역할인지(역할 이름)를 알아야 '누가 누구의 상사인지' 해석할 수 있다.", "keys": ["같은 개체 타입이 두 역할로 참여", "역할 이름으로 상사/부하 구별"], "lesson": "L2-2", "unit": "U2"}, {"id": "2-rec-4", "concept": "recursive", "type": "blank", "prompt": "순환 관계 SUPERVISION에서 EMPLOYEE는 (a) 역할과 (b) 역할로 참여한다.", "answer": "(a) supervisor / (b) supervisee", "accept": [["supervisor", "상사", "감독자"], ["supervisee", "부하", "피감독자"]], "lesson": "L2-2", "unit": "U2"}, {"id": "2-card-1", "concept": "cardinality", "type": "mc", "prompt": "'사원은 한 부서에서만 일하고, 부서는 사원을 몇 명이든 둘 수 있다'의 카디널리티 비는?", "choices": ["1:1", "DEPARTMENT 1 : EMPLOYEE N", "EMPLOYEE 1 : DEPARTMENT N", "M:N"], "answer": 1, "lesson": "L2-2", "unit": "U2"}, {"id": "2-card-2", "concept": "cardinality", "type": "mc", "prompt": "WORKS_ON(사원은 여러 프로젝트, 프로젝트는 여러 사원)의 카디널리티 비는?", "choices": ["1:1", "1:N", "N:1", "M:N"], "answer": 3, "lesson": "L2-2", "unit": "U2"}, {"id": "2-card-3", "concept": "cardinality", "type": "mc", "prompt": "MANAGES(사원은 최대 한 부서를 관리, 부서는 관리자 최대 한 명)의 카디널리티 비는?", "choices": ["1:1", "1:N", "N:1", "M:N"], "answer": 0, "lesson": "L2-2", "unit": "U2"}, {"id": "2-card-4", "concept": "cardinality", "type": "blank", "prompt": "카디널리티 비는 한 개체가 참여할 수 있는 관계 인스턴스의 (a) 개수를 지정하고, 참여 제약은 개체의 존재가 관계에 (b) 하는지를 지정한다.", "answer": "(a) 최대 / (b) 의존", "accept": [["최대", "maximum", "max"], ["의존", "depend", "dependent"]], "lesson": "L2-2", "unit": "U2"}, {"id": "2-card-5", "concept": "cardinality", "type": "ox", "prompt": "1:N 관계 WORKS_FOR에서 N쪽 개체(EMPLOYEE) 하나는 1쪽 개체(DEPARTMENT) 최대 하나와 연결된다.", "answer": true, "lesson": "L2-2", "unit": "U2"}, {"id": "2-card-6", "concept": "cardinality", "type": "short", "prompt": "2진 관계의 카디널리티 비 세 가지를 COMPANY 예와 함께 설명하시오.", "answer": "1:1 — MANAGES: 사원은 최대 한 부서를 관리, 부서는 관리자가 최대 한 명. 1:N — WORKS_FOR: 부서(1)는 사원(N)을 몇 명이든, 사원은 한 부서에서만. M:N — WORKS_ON: 사원은 여러 프로젝트, 프로젝트도 여러 사원.", "keys": ["1:1 + MANAGES", "1:N + WORKS_FOR", "M:N + WORKS_ON"], "lesson": "L2-2", "unit": "U2"}, {"id": "2-part-1", "concept": "participation", "type": "mc", "prompt": "'모든 사원은 반드시 어떤 부서에서 일해야 한다'는 EMPLOYEE의 WORKS_FOR 참여는?", "choices": ["전체 참여", "부분 참여", "1:1 참여", "약한 참여"], "answer": 0, "lesson": "L2-2", "unit": "U2"}, {"id": "2-part-2", "concept": "participation", "type": "mc", "prompt": "EMPLOYEE의 MANAGES 참여가 부분 참여인 이유는?", "choices": ["부서마다 관리자가 한 명이라서", "관리자는 반드시 사원이라서", "모든 사원이 부서를 관리하지는 않아서", "MANAGES가 1:1이라서"], "answer": 2, "lesson": "L2-2", "unit": "U2"}, {"id": "2-part-3", "concept": "participation", "type": "ox", "prompt": "전체 참여는 ER 다이어그램에서 이중선으로 그린다.", "answer": true, "lesson": "L2-2", "unit": "U2"}, {"id": "2-part-4", "concept": "participation", "type": "short", "prompt": "전체 참여와 부분 참여를 정의하고 EMPLOYEE를 예로 각각 설명하시오.", "answer": "전체 참여: 모든 개체가 그 관계에 참여해야 함(존재 의존). 예) 모든 사원은 부서에서 일하므로 EMPLOYEE는 WORKS_FOR에 전체 참여. 부분 참여: 모든 개체가 참여할 필요는 없음. 예) 일부 사원만 부서를 관리하므로 EMPLOYEE는 MANAGES에 부분 참여.", "keys": ["전체 = 모든 개체 참여 + WORKS_FOR 예", "부분 = 일부만 + MANAGES 예"], "lesson": "L2-2", "unit": "U2"}, {"id": "2-part-5", "concept": "participation", "type": "mc", "prompt": "약한 개체 타입의 식별 관계 참여는 항상?", "choices": ["전체 참여", "부분 참여", "M:N", "1:1"], "answer": 0, "lesson": "L2-2", "unit": "U2"}, {"id": "2-part-6", "concept": "participation", "type": "ox", "prompt": "CONTROLS에서 DEPARTMENT는 전체 참여이고 PROJECT는 부분 참여이다.", "answer": false, "explain": "반대. 모든 프로젝트는 통제 부서가 있어야 하므로 PROJECT가 전체, 프로젝트가 없는 부서도 있으므로 DEPARTMENT가 부분.", "lesson": "L2-2", "unit": "U2"}, {"id": "2-mm-1", "concept": "minmax", "type": "mc", "prompt": "(min, max) 표기에서 min = 0이 뜻하는 것은?", "choices": ["전체 참여", "부분 참여", "1:1 관계", "약한 개체"], "answer": 1, "lesson": "L2-2", "unit": "U2"}, {"id": "2-mm-2", "concept": "minmax", "type": "mc", "prompt": "'강의는 교재를 쓸 수도 안 쓸 수도 있고, 다섯 권을 넘게 쓰지는 않는다'일 때 COURSE의 USES 참여는?", "choices": ["(1, 5)", "(0, N)", "(0, 5)", "(5, N)"], "answer": 2, "lesson": "L2-2", "unit": "U2"}, {"id": "2-mm-3", "concept": "minmax", "type": "mc", "prompt": "'강사는 2개 이상 4개 이하의 강의를 가르친다'일 때 INSTRUCTOR의 TEACHES 참여는?", "choices": ["(0, 4)", "(1, 4)", "(2, N)", "(2, 4)"], "answer": 3, "lesson": "L2-2", "unit": "U2"}, {"id": "2-mm-4", "concept": "minmax", "type": "blank", "prompt": "MANAGES 관계를 (min, max)로 나타내면 EMPLOYEE 쪽은 (a), DEPARTMENT 쪽은 (b) 이다.", "answer": "(a) (0,1) / (b) (1,1)", "accept": [["(0,1)", "0,1", "(0, 1)"], ["(1,1)", "1,1", "(1, 1)"]], "lesson": "L2-2", "unit": "U2"}, {"id": "2-mm-5", "concept": "minmax", "type": "calc", "prompt": "다음 요구사항을 보고 각 참여의 (min, max)를 쓰시오.\n• 강의(COURSE)는 교재를 쓸 수도 안 쓸 수도 있고, 다섯 권을 넘게 쓰지 않는다.\n• 강의는 최소 1명, 최대 4명의 강사가 가르친다.\n• 교재(TEXT)는 어떤 강의들에서 쓰인다 (안 쓰이는 교재는 기록 안 함).\n• 강사는 2~4개의 강의를 가르친다.\n\nINSTRUCTOR —(①)— TEACHES —(②)— COURSE —(③)— USES —(④)— TEXT", "answer": "① INSTRUCTOR의 TEACHES 참여: (2, 4)\n② COURSE의 TEACHES 참여: (1, 4)\n③ COURSE의 USES 참여: (0, 5)\n④ TEXT의 USES 참여: (1, N)", "explain": "(min,max)는 그 개체 하나가 관계에 몇 번 참여하는지. min 0 = 부분, min ≥ 1 = 전체.", "keys": ["① (2,4)", "② (1,4)", "③ (0,5)", "④ (1,N)"], "slot": 7, "pts": 5, "lesson": "L2-2", "unit": "U2"}, {"id": "2-mm-6", "concept": "minmax", "type": "ox", "prompt": "WORKS_FOR(DEPARTMENT 1 : EMPLOYEE N)를 (min, max)로 나타내면 EMPLOYEE 쪽에 (1, 1)이 붙는다.", "answer": true, "explain": "사원 하나는 WORKS_FOR 인스턴스에 정확히 1번 참여. 1:N 표기의 '1'이 DEPARTMENT 쪽에 붙는 것과 위치가 반대로 보이는 게 함정.", "lesson": "L2-2", "unit": "U2"}, {"id": "2-mm-7", "concept": "minmax", "type": "calc", "prompt": "COMPANY 다듬은 ER 다이어그램에서 다음 참여의 (min, max)를 쓰시오.\n(1) EMPLOYEE의 WORKS_FOR 참여  (2) EMPLOYEE의 MANAGES 참여  (3) PROJECT의 CONTROLS 참여  (4) supervisee 역할 EMPLOYEE의 SUPERVISION 참여  (5) DEPENDENT의 DEPENDENTS_OF 참여", "answer": "(1) (1, 1)  (2) (0, 1)  (3) (1, 1)  (4) (0, 1)  (5) (1, 1)", "explain": "사원은 정확히 한 부서, 관리는 최대 한 부서(안 할 수도), 프로젝트는 정확히 한 통제 부서, 상사는 최대 한 명(Borg는 없음), 부양가족은 정확히 한 사원에 딸림.", "keys": ["(1) (1,1)", "(2) (0,1)", "(3) (1,1)", "(4) (0,1)", "(5) (1,1)"], "slot": 7, "pts": 5, "lesson": "L2-2", "unit": "U2"}, {"id": "2-ra-1", "concept": "rel-attr", "type": "mc", "prompt": "M:N 관계 WORKS_ON의 속성 Hours를 개체 타입으로 옮길 수 없는 이유는?", "choices": ["Hours가 다중값이라서", "Hours는 사원–프로젝트 조합으로만 결정되어서", "Hours가 유도 속성이라서", "WORKS_ON이 식별 관계라서"], "answer": 1, "lesson": "L2-3", "unit": "U2"}, {"id": "2-ra-2", "concept": "rel-attr", "type": "mc", "prompt": "1:N 관계 WORKS_FOR의 속성 StartDate는 어디로 옮길 수 있나?", "choices": ["DEPARTMENT로만", "어느 쪽이든", "EMPLOYEE(N쪽)로만", "옮길 수 없음"], "answer": 2, "lesson": "L2-3", "unit": "U2"}, {"id": "2-ra-3", "concept": "rel-attr", "type": "ox", "prompt": "1:1 관계 MANAGES의 StartDate는 EMPLOYEE와 DEPARTMENT 중 어느 쪽으로든 옮길 수 있다.", "answer": true, "lesson": "L2-3", "unit": "U2"}, {"id": "2-ra-4", "concept": "rel-attr", "type": "short", "prompt": "관계 타입의 속성을 참여 개체로 옮길(migrate) 수 있는지를 1:1, 1:N, M:N 각각에 대해 설명하시오.", "answer": "1:1: 어느 참여 개체로든 옮길 수 있음 (MANAGES.StartDate). 1:N: N쪽 개체로만 옮길 수 있음. N쪽 개체 하나는 인스턴스에 최대 1번 참여해서 값이 하나로 정해지기 때문 (WORKS_FOR.StartDate → EMPLOYEE). M:N: 어느 개체로도 못 옮김. 속성 값이 참여 개체 조합으로만 결정되기 때문 (WORKS_ON.Hours).", "keys": ["1:1 = 어느 쪽이든", "1:N = N쪽만 (이유)", "M:N = 못 옮김 (조합으로 결정)"], "lesson": "L2-3", "unit": "U2"}, {"id": "2-ra-5", "concept": "rel-attr", "type": "blank", "prompt": "1:N 관계의 속성은 (a) 쪽 개체로만 옮길 수 있고, M:N 관계의 속성은 참여 개체의 (b) 으로 결정되어 옮길 수 없다.", "answer": "(a) N / (b) 조합", "accept": [["N", "n", "N쪽", "다(N)"], ["조합", "combination", "조합으로"]], "lesson": "L2-3", "unit": "U2"}, {"id": "2-weak-1", "concept": "weak-entity", "type": "mc", "prompt": "약한 개체 타입의 정의로 옳은 것은?", "choices": ["자신의 키 속성이 없는 개체 타입", "속성이 하나뿐인 개체 타입", "부분 참여만 하는 개체 타입", "다른 개체가 참조하지 않는 개체 타입"], "answer": 0, "lesson": "L2-3", "unit": "U2"}, {"id": "2-weak-2", "concept": "weak-entity", "type": "mc", "prompt": "DEPENDENT의 Dependent_name 같은, 같은 소유자에 딸린 약한 개체끼리 구별하는 속성은?", "choices": ["기본 키", "후보 키", "부분 키", "외래 키"], "answer": 2, "lesson": "L2-3", "unit": "U2"}, {"id": "2-weak-3", "concept": "weak-entity", "type": "ox", "prompt": "부분 키만으로 약한 개체를 유일하게 식별할 수 있다.", "answer": false, "explain": "다른 사원에게도 같은 이름의 부양가족(Tom)이 있을 수 있다. 소유자의 키 + 부분 키로 식별.", "lesson": "L2-3", "unit": "U2"}, {"id": "2-weak-4", "concept": "weak-entity", "type": "short", "prompt": "약한 개체 타입, 식별 관계, 부분 키를 DEPENDENT 예로 설명하시오.", "answer": "약한 개체 타입: 자기 키 속성이 없어 식별(소유) 개체 타입에 의존하는 개체 타입 (DEPENDENT는 EMPLOYEE에 의존). 식별 관계: 약한 개체와 소유 개체를 잇는 관계(DEPENDENTS_OF), 이중 마름모, 약한 개체는 항상 전체 참여. 부분 키: 같은 소유자에 딸린 약한 개체끼리 구별하는 속성(Dependent_name). 소유자 키(Ssn) + 부분 키로 식별.", "keys": ["약한 개체 = 자기 키 없음, 소유자에 의존", "식별 관계 = 소유자와 연결, 전체 참여", "부분 키 + 소유자 키로 식별"], "lesson": "L2-3", "unit": "U2"}, {"id": "2-weak-5", "concept": "weak-entity", "type": "blank", "prompt": "약한 개체는 (a) 관계를 통해 소유 개체와 연결되며, 이 관계에 항상 (b) 참여한다.", "answer": "(a) 식별 / (b) 전체", "accept": [["식별", "identifying"], ["전체", "total", "전체 참여"]], "lesson": "L2-3", "unit": "U2"}, {"id": "2-weak-6", "concept": "weak-entity", "type": "mc", "prompt": "약한 개체 타입을 ER 다이어그램에 그리는 방법은?", "choices": ["점선 직사각형", "이중 직사각형 + 이중 마름모(식별 관계)", "타원", "이중 타원"], "answer": 1, "lesson": "L2-3", "unit": "U2"}, {"id": "2-ref-1", "concept": "refine", "type": "mc", "prompt": "COMPANY 다듬기에서 PROJECT의 Controlling_department 속성은 어떤 관계 타입이 되나?", "choices": ["MANAGES", "WORKS_FOR", "CONTROLS", "WORKS_ON"], "answer": 2, "lesson": "L2-4", "unit": "U2"}, {"id": "2-ref-2", "concept": "refine", "type": "mc", "prompt": "COMPANY의 WORKS_ON 관계에 대한 설명으로 옳은 것은?", "choices": ["1:N, 속성 없음", "1:1, StartDate", "M:N, 양쪽 부분 참여", "M:N, 양쪽 전체 참여, 속성 Hours"], "answer": 3, "lesson": "L2-4", "unit": "U2"}, {"id": "2-ref-3", "concept": "refine", "type": "short", "prompt": "ER 스키마 설계 과정 3단계를 쓰시오.", "answer": "(1) 요구사항을 바탕으로 개체 타입과 속성을 기술한다. (2) 관계 타입과 그 제약조건(카디널리티 비, 참여 제약)을 지정한다. (3) 관계를 표현하던 속성을 관계 타입으로 바꾼다.", "keys": ["개체 타입·속성", "관계 타입·제약조건", "관계를 나타내던 속성 → 관계 타입"], "lesson": "L2-4", "unit": "U2"}, {"id": "2-ref-4", "concept": "refine", "type": "ox", "prompt": "MANAGES에서 EMPLOYEE는 부분 참여, DEPARTMENT는 전체 참여이다.", "answer": true, "lesson": "L2-4", "unit": "U2"}, {"id": "2-ref-5", "concept": "refine", "type": "calc", "prompt": "COMPANY 다듬은 설계의 관계 타입 6개를 쓰고, 각각의 카디널리티 비를 쓰시오.", "answer": "MANAGES 1:1 (EMPLOYEE–DEPARTMENT)\nWORKS_FOR 1:N (DEPARTMENT 1, EMPLOYEE N)\nCONTROLS 1:N (DEPARTMENT 1, PROJECT N)\nSUPERVISION 1:N (supervisor 1, supervisee N)\nWORKS_ON M:N (EMPLOYEE–PROJECT, 속성 Hours)\nDEPENDENTS_OF 1:N (EMPLOYEE 1, DEPENDENT N, 식별 관계)", "keys": ["MANAGES 1:1", "WORKS_FOR 1:N", "CONTROLS 1:N", "SUPERVISION 1:N", "WORKS_ON M:N", "DEPENDENTS_OF 1:N"], "slot": 10, "pts": 10, "lesson": "L2-4", "unit": "U2"}, {"id": "2-ref-6", "concept": "refine", "type": "mc", "prompt": "DEPENDENTS_OF에서 EMPLOYEE와 DEPENDENT의 참여는?", "choices": ["둘 다 전체", "EMPLOYEE 부분, DEPENDENT 전체", "EMPLOYEE 전체, DEPENDENT 부분", "둘 다 부분"], "answer": 1, "explain": "사원은 부양가족이 없을 수 있고, 부양가족은 반드시 사원에 딸린다.", "lesson": "L2-4", "unit": "U2"}, {"id": "2-prac-1", "concept": "er-practice", "type": "mc", "prompt": "MOVIE DB에서 '각 영화는 제작사 하나가 만들고, 제작사는 영화 여러 편을 만든다'의 관계 PRODUCES는?", "choices": ["PRODUCTION 1 : MOVIE N, MOVIE 전체 참여", "M:N", "1:1", "MOVIE 1 : PRODUCTION N"], "answer": 0, "lesson": "L2-4", "unit": "U2"}, {"id": "2-prac-2", "concept": "er-practice", "type": "mc", "prompt": "MOVIE DB의 ACTS 관계에서 Role과 {Quotes}는?", "choices": ["ACTOR의 속성", "MOVIE의 속성", "ACTS(M:N) 관계의 속성", "약한 개체"], "answer": 2, "explain": "배우가 그 영화에서 맡은 역할·대사는 배우–영화 조합으로 정해지므로 M:N 관계 속성.", "lesson": "L2-4", "unit": "U2"}, {"id": "2-prac-3", "concept": "er-practice", "type": "short", "prompt": "CONF_REVIEW DB에서 SUBMITS(AUTHOR–PAPER, M:N) 관계만으로는 어떤 요구사항을 표현할 수 없고, 어떻게 해결했는지 쓰시오.", "answer": "'논문마다 저자 중 한 명을 연락 저자(contact author)로 지정한다'는 요구. SUBMITS는 여러 저자를 연결할 뿐 그중 누가 연락 저자인지 못 나타낸다. 그래서 별도 관계 IS_CONTACT(AUTHOR (0,N) – PAPER (1,1))를 둔다. (또는 SUBMITS에 Is_contact 속성)", "keys": ["연락 저자 지정 요구", "IS_CONTACT 관계 추가, PAPER (1,1)"], "lesson": "L2-4", "unit": "U2"}, {"id": "2-prac-4", "concept": "er-practice", "type": "calc", "prompt": "다음 요구사항으로 REVIEWER–REVIEWS–PAPER 부분을 설계하시오. 개체 키, 관계의 (min, max), 관계 속성을 쓰시오.\n• 리뷰어는 e-mail로 식별, 리뷰를 최소 하나 해야 기록되고 여러 편을 리뷰할 수 있다.\n• 논문은 시스템이 준 id로 식별, 리뷰어가 최소 2명 최대 4명 배정된다.\n• 리뷰어는 배정된 논문마다 네 항목(기술성, 가독성, 독창성, 관련성)을 1~10점으로 평가하고, 종합 추천과, 위원회용·저자용 두 가지 코멘트를 남긴다.", "answer": "REVIEWER(키 R_email) —(1,N)— REVIEWS —(2,4)— PAPER(키 P_id)\nREVIEWS의 속성: Recommendation, Comments(For_committee, Feedback) 복합, Rating(C1 Technical_merit, C2 Readability, C3 Originality, C4 Relevance) 복합\n양쪽 모두 전체 참여(min ≥ 1).", "keys": ["REVIEWER 키 R_email, PAPER 키 P_id", "REVIEWER (1,N)", "PAPER (2,4)", "관계 속성: Recommendation, Comments 복합, Rating 복합"], "slot": 10, "pts": 10, "lesson": "L2-4", "unit": "U2"}, {"id": "2-prac-5", "concept": "er-practice", "type": "ox", "prompt": "MOVIE DB에서 MOVIE의 키는 (Title, Year)로 된 복합 키이다.", "answer": true, "lesson": "L2-4", "unit": "U2"}, {"id": "2-prac-6", "concept": "er-practice", "type": "calc", "prompt": "다음 요구사항을 ER로 설계하시오 (개체, 키, 관계, 카디널리티, 참여).\n• 도서관 회원(MEMBER)은 회원 번호로 식별되고 이름이 있다.\n• 책(BOOK)은 ISBN으로 식별되고 제목, 저자(여러 명 가능)가 있다.\n• 회원은 책을 여러 권 빌릴 수 있고, 한 책은 여러 회원이 빌린 기록이 남는다. 대출마다 대출일과 반납일을 기록한다.\n• 책을 한 번도 안 빌린 회원도 있다.", "answer": "MEMBER(키 Member_no, Name) — BORROWS — BOOK(키 ISBN, Title, {Author} 다중값)\nBORROWS: M:N, 관계 속성 Borrow_date, Return_date\nMEMBER는 BORROWS에 부분 참여 (min 0), BOOK의 참여는 요구사항에 없으므로 부분으로 둠.", "keys": ["MEMBER 키 Member_no, BOOK 키 ISBN", "Author 다중값", "BORROWS M:N + 대출일·반납일은 관계 속성", "MEMBER 부분 참여"], "slot": 10, "pts": 10, "lesson": "L2-4", "unit": "U2"}, {"id": "3-rm-1", "concept": "rel-model", "type": "mc", "prompt": "관계 데이터 모델을 제안한 사람과 시기는?", "choices": ["Peter Chen, 1976", "Ted Codd (IBM), 1970", "Chamberlin & Boyce, 1974", "Elmasri, 1994"], "answer": 1, "lesson": "L3-1", "unit": "U3"}, {"id": "3-rm-2", "concept": "rel-model", "type": "short", "prompt": "관계 데이터 모델의 장점 네 가지를 쓰시오.", "answer": "단순성(평평한 테이블 구조), 데이터 무결성(유효·일관·정확한 데이터 보장), 쉬운 데이터 조작(SQL 같은 고급 언어), 보안(인증, 권한, 암호화).", "keys": ["단순성", "데이터 무결성", "쉬운 데이터 조작 (SQL)", "보안"], "lesson": "L3-1", "unit": "U3"}, {"id": "3-rm-3", "concept": "rel-model", "type": "blank", "prompt": "관계 모델에서 릴레이션은 테이블, 투플은 (a), 속성은 (b) 에 해당한다.", "answer": "(a) 행 / (b) 열", "accept": [["행", "row", "레코드"], ["열", "column", "열 헤더", "컬럼"]], "lesson": "L3-1", "unit": "U3"}, {"id": "3-dom-1", "concept": "domain-schema", "type": "mc", "prompt": "릴레이션 스키마의 '차수(degree)'는?", "choices": ["속성의 수", "투플의 수", "키의 수", "외래 키의 수"], "answer": 0, "lesson": "L3-1", "unit": "U3"}, {"id": "3-dom-2", "concept": "domain-schema", "type": "mc", "prompt": "STUDENT(Name, Ssn, Home_phone, Address, Office_phone, Age, Gpa)에 투플이 5개 있다. 차수는?", "choices": ["5", "6", "7", "35"], "answer": 2, "lesson": "L3-1", "unit": "U3"}, {"id": "3-dom-3", "concept": "domain-schema", "type": "blank", "prompt": "도메인 = 데이터 (a) + (b) 이다. 예) Employee_ages: 15~80 사이의 정수.", "answer": "(a) 타입 / (b) 제약조건", "accept": [["타입", "type", "자료형", "데이터 타입"], ["제약조건", "제약", "constraint", "constraints"]], "lesson": "L3-1", "unit": "U3"}, {"id": "3-dom-4", "concept": "domain-schema", "type": "ox", "prompt": "투플은 n개 값의 순서 있는 리스트이며, 각 값은 해당 속성 도메인의 원소이거나 NULL이다.", "answer": true, "lesson": "L3-1", "unit": "U3"}, {"id": "3-dom-5", "concept": "domain-schema", "type": "short", "prompt": "릴레이션 스키마와 릴레이션 인스턴스(상태)를 구별해서 설명하시오.", "answer": "릴레이션 스키마 R(A₁, …, Aₙ): 릴레이션 이름과 속성 리스트 (구조, 잘 안 바뀜). 릴레이션 인스턴스 r(R): 어느 시점의 n-투플들의 집합 {t₁, …, tₘ} (데이터, 갱신으로 계속 바뀜).", "keys": ["스키마 = 이름 + 속성 리스트", "인스턴스 = 투플의 집합 (시점에 따라 바뀜)"], "lesson": "L3-1", "unit": "U3"}, {"id": "3-ch-1", "concept": "rel-chars", "type": "ox", "prompt": "관계 모델에서는 다중값 속성을 한 칸에 집합으로 저장할 수 있다.", "answer": false, "explain": "투플의 값은 원자 값이어야 한다. 다중값 속성은 별도 릴레이션으로.", "lesson": "L3-1", "unit": "U3"}, {"id": "3-ch-2", "concept": "rel-chars", "type": "mc", "prompt": "관계 모델에서 복합 속성 Address(Street, City, Zip)를 표현하는 방법은?", "choices": ["별도 릴레이션으로", "단순 구성 속성 Street, City, Zip으로", "문자열 하나로 합쳐서", "표현할 수 없다"], "answer": 1, "lesson": "L3-1", "unit": "U3"}, {"id": "3-ch-3", "concept": "rel-chars", "type": "short", "prompt": "NULL 값이 쓰이는 경우를 쓰시오.", "answer": "속성 값을 모르거나(unknown), 얻을 수 없거나(unavailable), 그 투플에 적용되지 않는(undefined / not applicable) 경우.", "keys": ["모름 (unknown)", "얻을 수 없음 (unavailable)", "해당 없음 (not applicable)"], "lesson": "L3-1", "unit": "U3"}, {"id": "3-ch-4", "concept": "rel-chars", "type": "ox", "prompt": "릴레이션은 투플의 집합이므로 정의상 같은 투플이 두 번 나올 수 없다.", "answer": true, "lesson": "L3-1", "unit": "U3"}, {"id": "3-st-1", "concept": "db-schema-state", "type": "mc", "prompt": "관계 DB 스키마 S를 이루는 것은?", "choices": ["릴레이션 상태들의 집합", "투플들의 집합", "릴레이션 스키마들의 집합 + 무결성 제약조건 집합 IC", "카탈로그와 뷰"], "answer": 2, "lesson": "L3-1", "unit": "U3"}, {"id": "3-st-2", "concept": "db-schema-state", "type": "ox", "prompt": "무결성 제약을 하나라도 어기는 DB 상태는 무효(invalid) 상태이다.", "answer": true, "lesson": "L3-1", "unit": "U3"}, {"id": "3-st-3", "concept": "db-schema-state", "type": "mc", "prompt": "COMPANY 관계 DB 스키마 그림에서 화살표가 나타내는 것은?", "choices": ["기본 키", "참조 무결성 (FK → 참조되는 PK)", "함수 종속", "카디널리티 비"], "answer": 1, "lesson": "L3-1", "unit": "U3"}, {"id": "3-st-4", "concept": "db-schema-state", "type": "short", "prompt": "관계 DB 스키마와 관계 DB 상태를 정의하고, '유효한 상태'란 무엇인지 쓰시오.", "answer": "관계 DB 스키마: 릴레이션 스키마들의 집합 {R₁…Rₘ}과 무결성 제약조건 집합 IC. 관계 DB 상태: 각 Rᵢ의 상태 rᵢ들의 집합. 유효한 상태: IC에 있는 모든 무결성 제약조건을 만족하는 상태.", "keys": ["스키마 = 릴레이션 스키마 집합 + IC", "상태 = 릴레이션 상태들의 집합", "유효 = 모든 제약 만족"], "lesson": "L3-1", "unit": "U3"}, {"id": "3-key-1", "concept": "superkey-key", "type": "mc", "prompt": "슈퍼키와 키의 차이는?", "choices": ["키는 속성이 하나뿐이다", "키는 최소성(어떤 속성을 빼도 슈퍼키가 아님)을 만족한다", "슈퍼키는 NULL을 허용한다", "차이가 없다"], "answer": 1, "lesson": "L3-2", "unit": "U3"}, {"id": "3-key-2", "concept": "superkey-key", "type": "ox", "prompt": "모든 키는 슈퍼키이지만, 모든 슈퍼키가 키인 것은 아니다.", "answer": true, "lesson": "L3-2", "unit": "U3"}, {"id": "3-key-3", "concept": "superkey-key", "type": "mc", "prompt": "EMPLOYEE(Ssn, Fname, Lname, …)에서 Ssn이 키일 때 {Ssn, Lname}은?", "choices": ["슈퍼키지만 키는 아님", "키", "후보 키", "슈퍼키도 아님"], "answer": 0, "lesson": "L3-2", "unit": "U3"}, {"id": "3-key-4", "concept": "superkey-key", "type": "blank", "prompt": "키 제약: 서로 다른 두 투플 t₁, t₂에 대해 t₁[(a)] ≠ t₂[(a)] 이다. 키는 (b) 슈퍼키이다.", "answer": "(a) SK / (b) 최소", "accept": [["SK", "슈퍼키", "superkey", "키"], ["최소", "minimal", "최소한의"]], "lesson": "L3-2", "unit": "U3"}, {"id": "3-key-5", "concept": "superkey-key", "type": "short", "prompt": "슈퍼키와 키를 정의하고, {Ssn, Home_phone}을 예로 차이를 설명하시오.", "answer": "슈퍼키: 각 투플을 유일하게 식별하는 속성 부분집합 (서로 다른 두 투플이 같은 값을 가질 수 없음). 키: 슈퍼키 중에서 어떤 속성을 빼도 더 이상 슈퍼키가 아닌 최소 슈퍼키. {Ssn, Home_phone}은 슈퍼키지만 Home_phone을 빼도 {Ssn}이 여전히 유일하므로 키가 아니고, {Ssn}이 키다.", "keys": ["슈퍼키 정의 (유일 식별)", "키 = 최소 슈퍼키", "예: Home_phone 빼도 유일 → {Ssn}이 키"], "slot": 3, "pts": 3, "lesson": "L3-2", "unit": "U3"}, {"id": "3-key-6", "concept": "superkey-key", "type": "calc", "prompt": "R(A, B, C, D)의 상태가 다음과 같을 때, 이 상태에서 슈퍼키가 될 수 있는 속성 집합 중 '키(최소 슈퍼키)'를 모두 쓰시오.\n\nA | B | C | D\n1 | x | p | 10\n2 | x | q | 10\n3 | y | p | 20\n4 | y | q | 20", "answer": "{A}, {B, C}, {C, D}\n\nA는 값이 모두 달라 혼자 키. B, C, D는 각각 중복이 있음. {B,C}: (x,p),(x,q),(y,p),(y,q) 모두 다름 → 키. {C,D}: (p,10),(q,10),(p,20),(q,20) 모두 다름 → 키. {B,D}: (x,10),(x,10) 중복 → 아님.", "explain": "엄밀히 키는 스키마(모든 가능한 상태)에 대한 성질이라, 상태 하나만 보고는 '키일 수 있는 것'만 판단한다.", "keys": ["{A}", "{B, C}", "{C, D}", "{B, D}는 아님"], "lesson": "L3-2", "unit": "U3"}, {"id": "3-key-7", "concept": "superkey-key", "type": "ox", "prompt": "모든 릴레이션은 최소 하나의 슈퍼키를 가진다.", "answer": true, "explain": "투플은 서로 다르므로 속성 전체 집합이 기본 슈퍼키.", "lesson": "L3-2", "unit": "U3"}, {"id": "3-ck-1", "concept": "candidate-pk", "type": "mc", "prompt": "CAR(License_number, Engine_serial_number, Make, Model, Year)에서 License_number와 Engine_serial_number가 각각 키라면 이 둘을 무엇이라 부르나?", "choices": ["슈퍼키", "외래 키", "후보 키", "부분 키"], "answer": 2, "lesson": "L3-2", "unit": "U3"}, {"id": "3-ck-2", "concept": "candidate-pk", "type": "ox", "prompt": "기본 키는 보통 속성 하나 또는 적은 수의 속성으로 된 후보 키를 고르는 것이 좋다.", "answer": true, "lesson": "L3-2", "unit": "U3"}, {"id": "3-ck-3", "concept": "candidate-pk", "type": "short", "prompt": "후보 키와 기본 키의 관계를 설명하고, SQL에서 기본 키가 아닌 후보 키를 지정하는 절을 쓰시오.", "answer": "릴레이션 스키마의 키가 여러 개면 각각이 후보 키이고, 그중 하나를 투플 식별에 쓰는 기본 키로 지정한다(스키마에 밑줄). 나머지 후보 키는 SQL에서 UNIQUE 절로 지정한다.", "keys": ["키 여러 개 = 후보 키", "하나를 PK로 지정", "나머지는 UNIQUE"], "lesson": "L3-2", "unit": "U3"}, {"id": "3-ck-4", "concept": "candidate-pk", "type": "mc", "prompt": "릴레이션 스키마 그림에서 기본 키는 어떻게 표시하나?", "choices": ["밑줄", "굵은 글씨", "화살표", "이중선"], "answer": 0, "lesson": "L3-2", "unit": "U3"}, {"id": "3-ei-1", "concept": "entity-integrity", "type": "mc", "prompt": "개체 무결성 제약은?", "choices": ["FK 값은 참조되는 PK 값이거나 NULL", "기본 키 값은 NULL일 수 없다", "두 투플의 키 값은 같을 수 없다", "모든 속성은 NULL일 수 없다"], "answer": 1, "lesson": "L3-2", "unit": "U3"}, {"id": "3-ei-2", "concept": "entity-integrity", "type": "short", "prompt": "개체 무결성 제약이 왜 필요한지 쓰시오.", "answer": "PK가 NULL인 투플이 둘 이상 있으면, 다른 릴레이션에서 그 투플들을 참조하려 할 때 서로 구별할 수 없기 때문. PK는 투플을 식별하는 데 쓰이므로 NULL이면 안 된다.", "keys": ["PK가 NULL이면 투플을 구별·참조할 수 없음"], "slot": 3, "pts": 3, "lesson": "L3-2", "unit": "U3"}, {"id": "3-ei-3", "concept": "entity-integrity", "type": "ox", "prompt": "복합 기본 키 (Essn, Pno)에서는 Essn만 NULL이 아니면 Pno는 NULL이어도 된다.", "answer": false, "explain": "PK의 어느 부분도 NULL이면 안 된다.", "lesson": "L3-2", "unit": "U3"}, {"id": "3-ei-4", "concept": "entity-integrity", "type": "mc", "prompt": "NULL이 들어 있는 Office_phone 속성에 대한 설명으로 옳은 것은?", "choices": ["후보 키가 될 수 있다", "기본 키가 될 수 있다", "외래 키여야 한다", "개체 무결성 때문에 기본 키가 될 수 없다"], "answer": 3, "lesson": "L3-2", "unit": "U3"}, {"id": "3-ri-1", "concept": "ref-integrity", "type": "mc", "prompt": "참조 무결성 제약으로 옳은 것은?", "choices": ["FK 값은 참조되는 릴레이션의 어떤 투플의 PK 값과 같거나 NULL이다", "FK 값은 NULL일 수 없다", "PK 값은 NULL일 수 없다", "FK는 자기 릴레이션을 참조할 수 없다"], "answer": 0, "lesson": "L3-2", "unit": "U3"}, {"id": "3-ri-2", "concept": "ref-integrity", "type": "ox", "prompt": "외래 키는 같은 릴레이션을 참조할 수도 있다.", "answer": true, "explain": "EMPLOYEE.Super_ssn → EMPLOYEE.Ssn.", "lesson": "L3-2", "unit": "U3"}, {"id": "3-ri-3", "concept": "ref-integrity", "type": "blank", "prompt": "EMPLOYEE.Dno가 DEPARTMENT.Dnumber를 참조할 때, EMPLOYEE는 (a) 릴레이션, DEPARTMENT는 (b) 릴레이션이다.", "answer": "(a) 참조하는 / (b) 참조되는", "accept": [["참조하는", "referencing", "참조"], ["참조되는", "referenced", "피참조"]], "lesson": "L3-2", "unit": "U3"}, {"id": "3-ri-4", "concept": "ref-integrity", "type": "short", "prompt": "참조 무결성 제약을 정의하고, 이 제약이 없으면 생기는 문제를 예로 설명하시오.", "answer": "릴레이션 R₁의 FK 값은 R₂의 어떤 투플의 PK 값과 같거나 NULL이어야 한다 (FK와 PK는 같은 도메인). 없으면: EMPLOYEE.Dno = 3인데 3번 부서가 DEPARTMENT에 없으면 그 사원이 어느 부서에서 일하는지 해석할 수 없다. 두 릴레이션 투플 사이의 일관성을 지키려고 필요.", "keys": ["FK = 참조되는 PK 값 또는 NULL", "없는 투플을 참조하면 의미를 해석할 수 없음 (예)"], "slot": 3, "pts": 3, "lesson": "L3-2", "unit": "U3"}, {"id": "3-ri-5", "concept": "ref-integrity", "type": "calc", "prompt": "다음 스키마의 외래 키를 모두 쓰시오 (밑줄은 PK).\nSTUDENT(Ssn, Name, Major, Bdate)\nCOURSE(Course#, Cname, Dept)\nENROLL(Ssn, Course#, Quarter, Grade)  — PK (Ssn, Course#, Quarter)\nBOOK_ADOPTION(Course#, Quarter, Book_isbn)  — PK (Course#, Quarter)\nTEXT(Book_isbn, Book_title, Publisher, Author)", "answer": "ENROLL.Ssn → STUDENT.Ssn\nENROLL.Course# → COURSE.Course#\nBOOK_ADOPTION.Course# → COURSE.Course#\nBOOK_ADOPTION.Book_isbn → TEXT.Book_isbn", "keys": ["ENROLL.Ssn → STUDENT", "ENROLL.Course# → COURSE", "BOOK_ADOPTION.Course# → COURSE", "BOOK_ADOPTION.Book_isbn → TEXT"], "lesson": "L3-2", "unit": "U3"}, {"id": "3-ri-6", "concept": "ref-integrity", "type": "calc", "prompt": "다음 스키마의 외래 키를 모두 쓰고, 각각 왜 필요한지 한 줄씩 쓰시오.\nSALESPERSON(Ssn, Name, Start_year, Dept_no)\nTRIP(Ssn, From_city, To_city, Departure_date, Return_date, Trip_id)  — PK Trip_id\nEXPENSE(Trip_id, Account#, Amount)  — PK (Trip_id, Account#)", "answer": "TRIP.Ssn → SALESPERSON.Ssn: 출장은 존재하는 영업사원에게 배정돼야 함\nEXPENSE.Trip_id → TRIP.Trip_id: 경비는 특정 출장에 대해 지급됨", "keys": ["TRIP.Ssn → SALESPERSON", "EXPENSE.Trip_id → TRIP", "이유 각각"], "lesson": "L3-2", "unit": "U3"}, {"id": "3-ri-7", "concept": "ref-integrity", "type": "ox", "prompt": "FK와 그것이 참조하는 PK는 같은 도메인을 가져야 한다.", "answer": true, "lesson": "L3-2", "unit": "U3"}, {"id": "3-ins-1", "concept": "op-insert", "type": "mc", "prompt": "Insert 연산이 어길 수 있는 제약은?", "choices": ["참조 무결성만", "키 제약만", "키 제약과 참조 무결성", "키 제약, 개체 무결성, 참조 무결성 모두"], "answer": 3, "lesson": "L3-3", "unit": "U3"}, {"id": "3-ins-2", "concept": "op-insert", "type": "mc", "prompt": "COMPANY 상태에서 EMPLOYEE에 <'Alicia', 'J', 'Zelaya', '999887777', …, '987654321', 4>를 삽입하면?", "choices": ["키 제약 위반 (Ssn 999887777이 이미 있음)", "개체 무결성 위반", "참조 무결성 위반", "위반 없음"], "answer": 0, "lesson": "L3-3", "unit": "U3"}, {"id": "3-ins-3", "concept": "op-insert", "type": "mc", "prompt": "EMPLOYEE에 <'Cecilia', 'F', 'Kolonsky', '677678989', …, '987654321', 7>을 삽입하면? (DEPARTMENT에 Dnumber=7 없음)", "choices": ["키 제약 위반", "개체 무결성 위반", "참조 무결성 위반", "위반 없음"], "answer": 2, "lesson": "L3-3", "unit": "U3"}, {"id": "3-ins-4", "concept": "op-insert", "type": "ox", "prompt": "EMPLOYEE에 <'Cecilia', 'F', 'Kolonsky', '677678989', …, NULL, 4>를 삽입하면 Super_ssn이 NULL이므로 참조 무결성을 어긴다.", "answer": false, "explain": "FK는 NULL이어도 된다. 이 삽입은 모든 제약을 만족.", "lesson": "L3-3", "unit": "U3"}, {"id": "3-ins-5", "concept": "op-insert", "type": "calc", "prompt": "COMPANY 상태(교안 3-1 p.12)에서 다음 삽입 각각이 어기는 제약을 쓰시오 (없으면 '없음').\n(1) EMPLOYEE에 Ssn=NULL인 투플\n(2) EMPLOYEE에 Ssn='123456789'인 새 투플\n(3) WORKS_ON에 <'453453453', 10, 5.0>\n(4) WORKS_ON에 <'677678989', 1, 10.0>\n(5) DEPT_LOCATIONS에 <2, 'Seoul'>", "answer": "(1) 개체 무결성 (PK가 NULL)\n(2) 키 제약 (Smith가 이미 123456789)\n(3) 없음 (English는 있고 10번 프로젝트도 있고 (453453453, 10) 조합은 없음)\n(4) 참조 무결성 (Ssn 677678989인 사원 없음)\n(5) 참조 무결성 (Dnumber 2인 부서 없음)", "keys": ["(1) 개체 무결성", "(2) 키 제약", "(3) 없음", "(4) 참조 무결성", "(5) 참조 무결성"], "slot": 8, "pts": 5, "lesson": "L3-3", "unit": "U3"}, {"id": "3-ins-6", "concept": "op-insert", "type": "blank", "prompt": "Insert에서 새 투플의 키 값이 이미 있으면 (a) 제약, PK의 일부가 NULL이면 (b) 제약, 참조하는 투플이 없으면 (c) 제약을 어긴다.", "answer": "(a) 키 / (b) 개체 무결성 / (c) 참조 무결성", "accept": [["키", "key", "키 제약"], ["개체 무결성", "개체", "entity", "entity integrity"], ["참조 무결성", "참조", "referential", "referential integrity"]], "lesson": "L3-3", "unit": "U3"}, {"id": "3-del-1", "concept": "op-delete", "type": "mc", "prompt": "Delete 연산이 어길 수 있는 제약은?", "choices": ["키 제약", "참조 무결성만", "개체 무결성", "세 가지 모두"], "answer": 1, "lesson": "L3-3", "unit": "U3"}, {"id": "3-del-2", "concept": "op-delete", "type": "ox", "prompt": "WORKS_ON에서 (Essn='999887777', Pno=10) 투플을 지우면 참조 무결성을 어긴다.", "answer": false, "explain": "WORKS_ON 투플을 참조하는 투플이 없다.", "lesson": "L3-3", "unit": "U3"}, {"id": "3-del-3", "concept": "op-delete", "type": "short", "prompt": "Delete가 참조 무결성 외의 제약을 어기지 않는 이유를 쓰시오.", "answer": "삭제는 새 값을 만들지 않으므로 키 중복(키 제약)이나 NULL PK(개체 무결성)가 생기지 않는다. 지운 투플을 다른 투플의 FK가 참조하고 있을 때만 그 FK가 존재하지 않는 투플을 가리키게 되어 참조 무결성이 깨진다.", "keys": ["새 값이 없어서 키·개체 무결성은 안 깨짐", "참조되던 투플을 지우면 참조 무결성 위반"], "lesson": "L3-3", "unit": "U3"}, {"id": "3-del-4", "concept": "op-delete", "type": "calc", "prompt": "COMPANY 상태에서 다음 삭제가 참조 무결성을 어기는지, 어긴다면 어느 릴레이션의 투플들이 참조하고 있는지 쓰시오.\n(1) EMPLOYEE에서 Ssn='999887777'\n(2) PROJECT에서 Pnumber=30\n(3) DEPENDENT에서 (Essn='123456789', Dependent_name='Michael')\n(4) DEPARTMENT에서 Dnumber=1", "answer": "(1) 위반: WORKS_ON 투플 2개 (Pno 30, 10)\n(2) 위반: WORKS_ON 투플 3개 (Zelaya, Jabbar, Wallace)\n(3) 위반 없음: DEPENDENT를 참조하는 릴레이션 없음\n(4) 위반: EMPLOYEE(Borg의 Dno=1), PROJECT(Reorganization의 Dnum=1), DEPT_LOCATIONS(1, Houston)", "keys": ["(1) WORKS_ON", "(2) WORKS_ON", "(3) 없음", "(4) EMPLOYEE, PROJECT, DEPT_LOCATIONS"], "slot": 8, "pts": 5, "lesson": "L3-3", "unit": "U3"}, {"id": "3-upd-1", "concept": "op-update", "type": "mc", "prompt": "Update 연산이 제약 문제를 일으키는 경우는?", "choices": ["어떤 속성을 바꿔도 항상", "비키 속성을 바꿀 때만", "PK나 FK 속성을 바꿀 때만", "절대 일으키지 않음"], "answer": 2, "lesson": "L3-3", "unit": "U3"}, {"id": "3-upd-2", "concept": "op-update", "type": "mc", "prompt": "EMPLOYEE에서 Ssn='999887777'인 투플의 Ssn을 '987654321'로 바꾸면?", "choices": ["위반 없음", "키 제약만", "참조 무결성만", "키 제약과 참조 무결성 둘 다"], "answer": 3, "explain": "987654321은 Wallace의 Ssn(키 중복)이고, WORKS_ON에서 999887777을 참조하던 투플이 존재하지 않는 사원을 가리키게 됨.", "lesson": "L3-3", "unit": "U3"}, {"id": "3-upd-3", "concept": "op-update", "type": "mc", "prompt": "EMPLOYEE에서 Ssn='999887777'의 Dno를 7로 바꾸면? (7번 부서 없음)", "choices": ["키 제약", "참조 무결성", "개체 무결성", "위반 없음"], "answer": 1, "lesson": "L3-3", "unit": "U3"}, {"id": "3-upd-4", "concept": "op-update", "type": "ox", "prompt": "EMPLOYEE의 Salary를 바꾸는 갱신은 키·개체·참조 무결성 제약을 어기지 않는다.", "answer": true, "explain": "PK도 FK도 아닌 속성. (도메인 제약은 별개)", "lesson": "L3-3", "unit": "U3"}, {"id": "3-upd-5", "concept": "op-update", "type": "calc", "prompt": "COMPANY 상태에서 다음 갱신이 어기는 제약을 쓰시오 (없으면 '없음').\n(1) PROJECT Pnumber=10의 Dnum을 5로\n(2) DEPARTMENT Dnumber=5의 Mgr_ssn을 '111111111'로\n(3) WORKS_ON (Essn='123456789', Pno=1)의 Pno를 2로\n(4) EMPLOYEE Ssn='888665555'의 Ssn을 NULL로", "answer": "(1) 없음 (5번 부서 있음)\n(2) 참조 무결성 (Ssn 111111111인 사원 없음)\n(3) 키 제약 ((123456789, 2) 투플이 이미 있음)\n(4) 개체 무결성 (PK를 NULL로) + 다른 투플이 888665555를 참조하므로 참조 무결성도", "keys": ["(1) 없음", "(2) 참조 무결성", "(3) 키 제약", "(4) 개체 무결성 (+참조)"], "slot": 8, "pts": 5, "lesson": "L3-3", "unit": "U3"}, {"id": "3-upd-6", "concept": "op-update", "type": "short", "prompt": "Insert, Delete, Update가 각각 어길 수 있는 제약을 정리하시오.", "answer": "Insert: 키 제약, 개체 무결성, 참조 무결성 모두 가능. Delete: 참조 무결성만. Update: 키 제약과 참조 무결성 (PK나 FK를 바꿀 때만 문제).", "keys": ["Insert = 세 가지 모두", "Delete = 참조 무결성만", "Update = 키·참조 (PK/FK 변경 시)"], "lesson": "L3-3", "unit": "U3"}, {"id": "3-me-1", "concept": "map-entity", "type": "mc", "prompt": "정규 개체 타입을 매핑할 때 복합 속성 Name(Fname, Minit, Lname)은?", "choices": ["별도 릴레이션으로", "단순 구성 속성 Fname, Minit, Lname만 넣는다", "Name 하나로 넣는다", "FK로 넣는다"], "answer": 1, "lesson": "L3-4", "unit": "U3"}, {"id": "3-me-2", "concept": "map-entity", "type": "ox", "prompt": "정규 개체 타입을 매핑할 때 다중값 속성도 같은 릴레이션에 넣는다.", "answer": false, "explain": "다중값 속성은 별도 릴레이션 (다음 단계).", "lesson": "L3-4", "unit": "U3"}, {"id": "3-me-3", "concept": "map-entity", "type": "short", "prompt": "정규 개체 타입 E를 릴레이션으로 매핑하는 절차를 쓰시오.", "answer": "E의 단순 속성을 모두 포함하는 릴레이션 R을 만든다. 복합 속성은 단순 구성 속성만 넣는다. E의 키 속성 중 하나를 R의 기본 키로 지정한다 (다중값 속성은 다음 단계에서 별도 릴레이션).", "keys": ["단순 속성 전부 포함", "복합 → 구성 속성", "키 하나를 PK로"], "lesson": "L3-4", "unit": "U3"}, {"id": "3-me-4", "concept": "map-entity", "type": "mc", "prompt": "DEPARTMENT(Name, Number 둘 다 키)를 매핑할 때 Number를 PK로 고르면 Name은?", "choices": ["버린다", "FK가 된다", "UNIQUE 후보 키로 둔다", "별도 릴레이션으로"], "answer": 2, "lesson": "L3-4", "unit": "U3"}, {"id": "3-mv-1", "concept": "map-multival", "type": "mc", "prompt": "DEPARTMENT의 다중값 속성 Locations를 매핑한 DEPT_LOCATIONS의 기본 키는?", "choices": ["Dnumber", "Dlocation", "(Dnumber, Dlocation)", "새로 만든 Loc_id"], "answer": 2, "lesson": "L3-4", "unit": "U3"}, {"id": "3-mv-2", "concept": "map-multival", "type": "blank", "prompt": "다중값 속성 A는 별도 릴레이션 R로 만들고, 원래 릴레이션의 PK K를 R의 (a) 로 넣으며, (b) 조합을 R의 PK로 한다.", "answer": "(a) 외래 키 / (b) A와 K", "accept": [["외래 키", "FK", "foreign key", "외래키"], ["A와 K", "(A, K)", "A, K", "K와 A", "(K, A)"]], "lesson": "L3-4", "unit": "U3"}, {"id": "3-mv-3", "concept": "map-multival", "type": "calc", "prompt": "EMPLOYEE(Ssn 키)에 다중값 속성 {Phone}과 {Skill}이 있다. 이 둘을 매핑한 릴레이션들을 PK, FK와 함께 쓰시오.", "answer": "EMP_PHONE(Ssn, Phone)  PK (Ssn, Phone), FK Ssn → EMPLOYEE\nEMP_SKILL(Ssn, Skill)  PK (Ssn, Skill), FK Ssn → EMPLOYEE\n(다중값 속성마다 별도 릴레이션)", "keys": ["다중값 속성마다 별도 릴레이션 2개", "PK = (Ssn, 속성)", "FK Ssn → EMPLOYEE"], "lesson": "L3-4", "unit": "U3"}, {"id": "3-mv-4", "concept": "map-multival", "type": "ox", "prompt": "다중값 속성을 매핑한 릴레이션에서는 원래 개체의 키 값이 여러 투플에 반복된다.", "answer": true, "lesson": "L3-4", "unit": "U3"}, {"id": "3-mw-1", "concept": "map-weak", "type": "mc", "prompt": "약한 개체 DEPENDENT를 매핑한 릴레이션의 기본 키는?", "choices": ["Dependent_name", "(Essn, Dependent_name)", "Essn", "새 대리 키"], "answer": 1, "lesson": "L3-4", "unit": "U3"}, {"id": "3-mw-2", "concept": "map-weak", "type": "ox", "prompt": "약한 개체를 매핑할 때 식별 관계 타입(DEPENDENTS_OF)은 별도 릴레이션으로 만든다.", "answer": false, "explain": "소유자 PK를 FK로 넣는 것 자체가 식별 관계의 매핑.", "lesson": "L3-4", "unit": "U3"}, {"id": "3-mw-3", "concept": "map-weak", "type": "short", "prompt": "약한 개체 타입 W를 매핑하는 절차를 쓰시오.", "answer": "W의 단순 속성(복합은 구성 속성)을 모두 포함하는 릴레이션 R을 만든다. 소유 개체 타입의 PK를 R에 FK로 넣는다(식별 관계의 매핑). 소유자 PK와 W의 부분 키를 합쳐 R의 PK로 한다.", "keys": ["단순 속성 포함", "소유자 PK를 FK로 (식별 관계 매핑)", "PK = 소유자 PK + 부분 키"], "lesson": "L3-4", "unit": "U3"}, {"id": "3-mw-4", "concept": "map-weak", "type": "calc", "prompt": "BUILDING(Bname 키, Address)과 약한 개체 ROOM(부분 키 Room_no, Capacity, {Equipment})이 식별 관계 HAS로 연결되어 있다. 관계 스키마로 매핑하시오 (PK, FK 표시).", "answer": "BUILDING(Bname, Address)  PK Bname\nROOM(Bname, Room_no, Capacity)  PK (Bname, Room_no), FK Bname → BUILDING\nROOM_EQUIPMENT(Bname, Room_no, Equipment)  PK (Bname, Room_no, Equipment), FK (Bname, Room_no) → ROOM", "keys": ["ROOM PK (Bname, Room_no)", "ROOM.Bname FK", "다중값 Equipment는 별도 릴레이션, PK에 ROOM의 PK 전체 포함"], "slot": 11, "pts": 10, "lesson": "L3-4", "unit": "U3"}, {"id": "3-m11-1", "concept": "map-11", "type": "mc", "prompt": "1:1 관계 MANAGES를 외래 키 방식으로 매핑할 때 FK를 넣기 좋은 쪽은?", "choices": ["부분 참여하는 EMPLOYEE", "전체 참여하는 DEPARTMENT", "어느 쪽이든 상관없음", "별도 릴레이션"], "answer": 1, "lesson": "L3-5", "unit": "U3"}, {"id": "3-m11-2", "concept": "map-11", "type": "short", "prompt": "1:1 관계를 외래 키 방식으로 매핑할 때 전체 참여 쪽에 FK를 넣는 게 나은 이유를 MANAGES 예로 쓰시오.", "answer": "전체 참여 쪽(DEPARTMENT)은 모든 투플이 관계에 참여하므로 FK(Mgr_ssn)에 항상 값이 있다. 반대로 부분 참여 쪽(EMPLOYEE)에 D_managed, Mgr_start_date를 넣으면 부서를 관리하지 않는 대부분의 사원이 NULL을 가져 낭비가 생긴다.", "keys": ["전체 참여 쪽은 NULL이 안 생김", "부분 참여 쪽에 넣으면 NULL이 많아짐"], "lesson": "L3-5", "unit": "U3"}, {"id": "3-m11-3", "concept": "map-11", "type": "mc", "prompt": "1:1 관계를 매핑하는 세 가지 방법이 아닌 것은?", "choices": ["외래 키 방식", "합병 릴레이션 방식", "교차 참조(관계 릴레이션) 방식", "다중값 속성 방식"], "answer": 3, "lesson": "L3-5", "unit": "U3"}, {"id": "3-m11-4", "concept": "map-11", "type": "ox", "prompt": "1:1 관계의 속성(예: Mgr_start_date)은 FK를 넣은 쪽 릴레이션에 함께 넣는다.", "answer": true, "lesson": "L3-5", "unit": "U3"}, {"id": "3-m11-5", "concept": "map-11", "type": "calc", "prompt": "PERSON(Pid 키, Name)과 PASSPORT(Passport_no 키, Issue_date)가 1:1 관계 HOLDS로 연결된다. 모든 여권은 사람에게 속하지만(전체), 여권이 없는 사람도 있다(부분). 관계 속성 Since가 있다. 외래 키 방식으로 매핑하시오.", "answer": "PERSON(Pid, Name)\nPASSPORT(Passport_no, Issue_date, Pid, Since)  FK Pid → PERSON, Pid는 UNIQUE (1:1)\n전체 참여 쪽 PASSPORT에 FK를 넣어 NULL을 피한다.", "keys": ["FK를 PASSPORT(전체 참여)에", "관계 속성 Since도 PASSPORT에", "1:1이므로 FK에 UNIQUE"], "lesson": "L3-5", "unit": "U3"}, {"id": "3-m11-6", "concept": "map-11", "type": "blank", "prompt": "1:1 관계 외래 키 방식: 한쪽 릴레이션 S를 골라 상대 T의 (a) 를 FK로 넣는다. S는 (b) 참여 쪽으로 고르는 게 좋다.", "answer": "(a) PK / (b) 전체", "accept": [["PK", "기본 키", "primary key", "기본키"], ["전체", "total", "전체 참여"]], "lesson": "L3-5", "unit": "U3"}, {"id": "3-m1n-1", "concept": "map-1n", "type": "mc", "prompt": "1:N 관계 WORKS_FOR(DEPARTMENT 1 : EMPLOYEE N)를 매핑하면 FK는 어디에?", "choices": ["EMPLOYEE에 Dno", "DEPARTMENT에 Essn", "별도 릴레이션에만", "둘 다"], "answer": 0, "lesson": "L3-5", "unit": "U3"}, {"id": "3-m1n-2", "concept": "map-1n", "type": "short", "prompt": "1:N 관계를 매핑할 때 FK를 N쪽 릴레이션에 넣는 이유를 쓰시오.", "answer": "N쪽 개체 하나는 1쪽 개체 최대 하나와 연결되므로 FK 값 하나로 표현된다. 1쪽에 넣으면 한 투플이 여러 N쪽 개체를 참조해야 해서 다중값이 되고, 원자 값 원칙을 어긴다.", "keys": ["N쪽은 상대가 최대 하나 → FK 하나", "1쪽에 넣으면 다중값"], "lesson": "L3-5", "unit": "U3"}, {"id": "3-m1n-3", "concept": "map-1n", "type": "mc", "prompt": "SUPERVISION(순환 1:N)을 매핑한 결과는?", "choices": ["별도 릴레이션 SUPERVISION(Ssn, Super_ssn)이 꼭 필요", "DEPARTMENT에 Super_ssn", "EMPLOYEE에 Super_ssn (자기 참조 FK)", "매핑 불가"], "answer": 2, "lesson": "L3-5", "unit": "U3"}, {"id": "3-m1n-4", "concept": "map-1n", "type": "ox", "prompt": "1:N 관계는 교차 참조(관계 릴레이션) 방식으로도 매핑할 수 있지만, 릴레이션 수가 줄어드는 외래 키 방식을 선호한다.", "answer": true, "lesson": "L3-5", "unit": "U3"}, {"id": "3-m1n-5", "concept": "map-1n", "type": "calc", "prompt": "DEPARTMENT(Dnumber 키)와 PROJECT(Pnumber 키)가 1:N 관계 CONTROLS(부서 1 : 프로젝트 N)로, PROJECT의 CONTROLS 참여는 전체이고 관계 속성 Since가 있다. 매핑 결과를 쓰시오.", "answer": "DEPARTMENT(Dname, Dnumber, …)\nPROJECT(Pname, Pnumber, Plocation, Dnum, Since)  FK Dnum → DEPARTMENT.Dnumber, Dnum NOT NULL (전체 참여)\n관계 속성 Since도 N쪽 PROJECT에.", "keys": ["FK Dnum을 PROJECT(N쪽)에", "Since도 PROJECT에", "전체 참여 → NOT NULL (선택)"], "lesson": "L3-5", "unit": "U3"}, {"id": "3-m1n-6", "concept": "map-1n", "type": "blank", "prompt": "1:N 관계 외래 키 방식: (a) 쪽 릴레이션 S에 상대 릴레이션의 PK를 FK로 넣고, 관계의 단순 속성도 (b) 에 넣는다.", "answer": "(a) N / (b) S", "accept": [["N", "n", "N쪽", "다"], ["S", "N쪽", "N쪽 릴레이션", "s"]], "lesson": "L3-5", "unit": "U3"}, {"id": "3-mmn-1", "concept": "map-mn", "type": "mc", "prompt": "M:N 관계를 매핑하는 방법은?", "choices": ["외래 키 방식", "합병 릴레이션 방식", "교차 참조(관계 릴레이션) 방식만", "다중값 속성으로"], "answer": 2, "lesson": "L3-5", "unit": "U3"}, {"id": "3-mmn-2", "concept": "map-mn", "type": "mc", "prompt": "WORKS_ON(EMPLOYEE M : PROJECT N, 속성 Hours)을 매핑한 릴레이션의 PK는?", "choices": ["Essn", "(Essn, Pno)", "(Essn, Pno, Hours)", "Pno"], "answer": 1, "lesson": "L3-5", "unit": "U3"}, {"id": "3-mmn-3", "concept": "map-mn", "type": "short", "prompt": "M:N 관계를 외래 키 하나로 표현할 수 없는 이유와 매핑 절차를 쓰시오.", "answer": "양쪽 개체 모두 상대 개체 여러 개와 연결되므로 어느 쪽에 FK를 넣어도 다중값이 된다. 그래서 별도 관계 릴레이션 S를 만들고, 참여 개체 릴레이션들의 PK를 FK로 넣고, FK들의 조합을 PK로 하며, 관계의 단순 속성도 S에 넣는다.", "keys": ["양쪽 다 여러 개 → FK 하나로 불가", "별도 관계 릴레이션", "PK = FK들의 조합", "관계 속성 포함"], "lesson": "L3-5", "unit": "U3"}, {"id": "3-mmn-4", "concept": "map-mn", "type": "calc", "prompt": "STUDENT(Sid 키)와 COURSE(Cid 키)가 M:N 관계 ENROLLS(속성 Grade, Semester)로 연결된다. 한 학생이 같은 과목을 다른 학기에 다시 들을 수 있다. 매핑하시오.", "answer": "STUDENT(Sid, …), COURSE(Cid, …)\nENROLLS(Sid, Cid, Semester, Grade)  FK Sid → STUDENT, FK Cid → COURSE\nPK (Sid, Cid, Semester): 재수강 때문에 (Sid, Cid)만으로는 유일하지 않아 Semester까지 포함", "keys": ["별도 릴레이션 ENROLLS", "FK 2
