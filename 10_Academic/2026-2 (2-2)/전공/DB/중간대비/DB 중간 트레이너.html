mpt_en": "Which employee is missing from the result of SELECT E.Lname, S.Lname FROM EMPLOYEE AS E, EMPLOYEE AS S WHERE E.Super_ssn = S.Ssn;? (COMPANY state)", "choices_en": ["Wong", "Wallace", "Smith", "Borg (Super_ssn is NULL)"]}, {"id": "5-io-2", "concept": "inner-outer", "type": "mc", "prompt": "LEFT OUTER JOIN의 결과에 반드시 들어가는 것은?", "choices": ["왼쪽 테이블의 모든 투플", "오른쪽 테이블의 모든 투플", "양쪽 모든 투플", "조건을 만족하는 쌍만"], "answer": 0, "lesson": "L5-3", "unit": "U5", "prompt_en": "What is always included in the result of a LEFT OUTER JOIN?", "choices_en": ["Every tuple of the left table", "Every tuple of the right table", "Every tuple of both tables", "Only pairs that satisfy the condition"]}, {"id": "5-io-3", "concept": "inner-outer", "type": "calc", "prompt": "모든 사원의 성과, 상사가 있다면 상사의 성을 검색하시오 (상사가 없으면 NULL).", "answer": "SELECT E.Lname AS Employee_name, S.Lname AS Supervisor_name\nFROM   (EMPLOYEE AS E LEFT OUTER JOIN EMPLOYEE AS S\n        ON E.Super_ssn = S.Ssn);\n\n-- 교재 COMPANY 상태에서 실행 결과 (8행)\nEmployee_name | Supervisor_name\nSmith | Wong\nWong | Borg\nZelaya | Wallace\nWallace | Borg\nNarayan | Wong\nEnglish | Wong\nJabbar | Wallace\nBorg | NULL", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["LEFT OUTER JOIN", "ON E.Super_ssn = S.Ssn", "Borg의 상사 NULL"], "lesson": "L5-3", "unit": "U5", "prompt_en": "Retrieve the last name of every employee and, if the employee has a supervisor, the supervisor's last name (NULL if there is no supervisor).", "answer_en": "SELECT E.Lname AS Employee_name, S.Lname AS Supervisor_name\nFROM   (EMPLOYEE AS E LEFT OUTER JOIN EMPLOYEE AS S\n        ON E.Super_ssn = S.Ssn);\n\n-- Result on the textbook COMPANY state (8 rows)\nEmployee_name | Supervisor_name\nSmith | Wong\nWong | Borg\nZelaya | Wallace\nWallace | Borg\nNarayan | Wong\nEnglish | Wong\nJabbar | Wallace\nBorg | NULL", "keys_en": ["LEFT OUTER JOIN", "ON E.Super_ssn = S.Ssn", "Borg's supervisor is NULL"]}, {"id": "5-io-4", "concept": "inner-outer", "type": "calc", "prompt": "모든 사원 이름과, 그 사원이 관리하는 부서가 있으면 그 부서 이름을 검색하시오.", "answer": "SELECT E.Fname, E.Lname, D.Dname\nFROM   (EMPLOYEE AS E LEFT OUTER JOIN DEPARTMENT AS D\n        ON E.Ssn = D.Mgr_ssn);\n\n-- 교재 COMPANY 상태에서 실행 결과 (8행)\nFname | Lname | Dname\nJohn | Smith | NULL\nFranklin | Wong | Research\nAlicia | Zelaya | NULL\nJennifer | Wallace | Administration\nRamesh | Narayan | NULL\nJoyce | English | NULL\nAhmad | Jabbar | NULL\nJames | Borg | Headquarters", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["EMPLOYEE LEFT OUTER JOIN DEPARTMENT", "ON E.Ssn = D.Mgr_ssn"], "lesson": "L5-3", "unit": "U5", "prompt_en": "Retrieve the names of all employees and, if an employee manages a department, the name of that department.", "answer_en": "SELECT E.Fname, E.Lname, D.Dname\nFROM   (EMPLOYEE AS E LEFT OUTER JOIN DEPARTMENT AS D\n        ON E.Ssn = D.Mgr_ssn);\n\n-- Result on the textbook COMPANY state (8 rows)\nFname | Lname | Dname\nJohn | Smith | NULL\nFranklin | Wong | Research\nAlicia | Zelaya | NULL\nJennifer | Wallace | Administration\nRamesh | Narayan | NULL\nJoyce | English | NULL\nAhmad | Jabbar | NULL\nJames | Borg | Headquarters"}, {"id": "5-io-5", "concept": "inner-outer", "type": "calc", "prompt": "모든 프로젝트의 이름과 그 프로젝트에서 일하는 사원 수를 검색하시오. 일하는 사원이 없는 프로젝트도 0으로 나와야 한다.", "answer": "SELECT   P.Pname, COUNT(W.Essn)\nFROM     (PROJECT AS P LEFT OUTER JOIN WORKS_ON AS W ON P.Pnumber = W.Pno)\nGROUP BY P.Pnumber, P.Pname;\n\n-- 교재 COMPANY 상태에서 실행 결과 (6행)\nPname | COUNT(W.Essn)\nProductX | 2\nProductY | 3\nProductZ | 2\nComputerization | 3\nReorganization | 3\nNewbenefits | 3\n\nCOUNT(*)를 쓰면 짝 없는 프로젝트도 1로 세진다. COMPANY 상태에선 모든 프로젝트에 사원이 있어 차이가 안 보인다.", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["LEFT OUTER JOIN", "COUNT(W.Essn) (NULL은 안 셈 → 0)", "GROUP BY"], "lesson": "L5-3", "unit": "U5", "prompt_en": "Retrieve the name of every project and the number of employees who work on it. Projects with no employees must also appear, with 0.", "answer_en": "SELECT   P.Pname, COUNT(W.Essn)\nFROM     (PROJECT AS P LEFT OUTER JOIN WORKS_ON AS W ON P.Pnumber = W.Pno)\nGROUP BY P.Pnumber, P.Pname;\n\n-- Result on the textbook COMPANY state (6 rows)\nPname | COUNT(W.Essn)\nProductX | 2\nProductY | 3\nProductZ | 2\nComputerization | 3\nReorganization | 3\nNewbenefits | 3\n\nWith COUNT(*), a project without a match would be counted as 1. On the COMPANY state every project has employees, so the difference does not show.", "keys_en": ["LEFT OUTER JOIN", "COUNT(W.Essn) (NULLs are not counted → 0)", "GROUP BY"]}, {"id": "5-io-6", "concept": "inner-outer", "type": "blank", "prompt": "외부 조인에서 짝이 없는 투플의 상대 속성은 (a) 로 채운다. 짝 없는 것만 고르려면 WHERE B.KEY (b) 를 쓴다.", "answer": "(a) NULL / (b) IS NULL", "accept": [["NULL", "null", "널"], ["IS NULL", "is null"]], "lesson": "L5-3", "unit": "U5", "prompt_en": "In an outer join, the other relation's attributes of an unmatched tuple are padded with (a). To select only the unmatched ones, write WHERE B.KEY (b)."}, {"id": "5-io-7", "concept": "inner-outer", "type": "short", "prompt": "내부 조인과 외부 조인(LEFT, RIGHT, FULL)의 차이를 쓰시오.", "answer": "내부 조인: 조인 조건을 만족하는(짝이 있는) 투플 쌍만 결과에. 외부 조인: 짝이 없는 투플도 결과에 넣고 상대 속성을 NULL로 채움. LEFT는 왼쪽 테이블의 모든 투플, RIGHT는 오른쪽 테이블의 모든 투플, FULL은 양쪽 모든 투플을 유지.", "keys": ["내부 = 짝 있는 것만", "외부 = 짝 없어도 NULL 채워 포함", "LEFT/RIGHT/FULL 구분"], "lesson": "L5-3", "unit": "U5", "prompt_en": "Explain the difference between an inner join and outer joins (LEFT, RIGHT, FULL).", "answer_en": "Inner join: only tuple pairs that satisfy the join condition (that have a match) are in the result. Outer join: tuples without a match are also included, with the other relation's attributes padded with NULL. LEFT keeps every tuple of the left table, RIGHT every tuple of the right table, and FULL every tuple of both tables.", "keys_en": ["Inner = only matched tuples", "Outer = unmatched tuples included, padded with NULL", "LEFT/RIGHT/FULL distinction"]}, {"id": "5-ag-1", "concept": "aggregate", "type": "mc", "prompt": "COMPANY 상태에서 SELECT AVG(Salary) FROM EMPLOYEE; 의 결과는?", "choices": ["33250", "31000", "35125", "40000"], "answer": 2, "lesson": "L5-4", "unit": "U5", "prompt_en": "On the COMPANY state, what is the result of SELECT AVG(Salary) FROM EMPLOYEE;?"}, {"id": "5-ag-2", "concept": "aggregate", "type": "calc", "prompt": "전체 사원 급여의 합, 최대, 최소, 평균을 검색하시오. (질의 19)", "answer": "SELECT SUM(Salary), MAX(Salary), MIN(Salary), AVG(Salary)\nFROM   EMPLOYEE;\n\n-- 교재 COMPANY 상태에서 실행 결과 (1행)\nSUM(Salary) | MAX(Salary) | MIN(Salary) | AVG(Salary)\n281000 | 55000 | 25000 | 35125", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["SUM, MAX, MIN, AVG(Salary)"], "lesson": "L5-4", "unit": "U5", "prompt_en": "Retrieve the sum, maximum, minimum and average salary of all employees. (Query 19)", "answer_en": "SELECT SUM(Salary), MAX(Salary), MIN(Salary), AVG(Salary)\nFROM   EMPLOYEE;\n\n-- Result on the textbook COMPANY state (1 row)\nSUM(Salary) | MAX(Salary) | MIN(Salary) | AVG(Salary)\n281000 | 55000 | 25000 | 35125"}, {"id": "5-ag-3", "concept": "aggregate", "type": "calc", "prompt": "'Research' 부서 사원 급여의 합, 최대, 최소, 평균을 검색하시오. (질의 20)", "answer": "SELECT SUM(Salary), MAX(Salary), MIN(Salary), AVG(Salary)\nFROM   (EMPLOYEE JOIN DEPARTMENT ON Dno = Dnumber)\nWHERE  Dname = 'Research';\n\n-- 교재 COMPANY 상태에서 실행 결과 (1행)\nSUM(Salary) | MAX(Salary) | MIN(Salary) | AVG(Salary)\n133000 | 40000 | 25000 | 33250", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["집계 함수 4개", "EMPLOYEE–DEPARTMENT 조인", "Dname = 'Research'"], "lesson": "L5-4", "unit": "U5", "prompt_en": "Retrieve the sum, maximum, minimum and average salary of the employees of the 'Research' department. (Query 20)", "answer_en": "SELECT SUM(Salary), MAX(Salary), MIN(Salary), AVG(Salary)\nFROM   (EMPLOYEE JOIN DEPARTMENT ON Dno = Dnumber)\nWHERE  Dname = 'Research';\n\n-- Result on the textbook COMPANY state (1 row)\nSUM(Salary) | MAX(Salary) | MIN(Salary) | AVG(Salary)\n133000 | 40000 | 25000 | 33250", "keys_en": ["Four aggregate functions", "EMPLOYEE–DEPARTMENT join", "Dname = 'Research'"]}, {"id": "5-ag-4", "concept": "aggregate", "type": "ox", "prompt": "집계 함수는 주로 SELECT 절이나 HAVING 절에서 쓴다.", "answer": true, "lesson": "L5-4", "unit": "U5", "prompt_en": "Aggregate functions are mostly used in the SELECT clause or the HAVING clause."}, {"id": "5-ag-5", "concept": "aggregate", "type": "calc", "prompt": "WORKS_ON에 기록된 근무 시간의 총합과 평균을 검색하시오.", "answer": "SELECT SUM(Hours), AVG(Hours)\nFROM   WORKS_ON;\n\n-- 교재 COMPANY 상태에서 실행 결과 (1행)\nSUM(Hours) | AVG(Hours)\n275 | 18.33\n\nBorg의 Hours가 NULL이라 AVG는 NULL을 뺀 15개로 나눈다 (275 / 15 ≈ 18.33).", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["SUM(Hours), AVG(Hours)"], "lesson": "L5-4", "unit": "U5", "prompt_en": "Retrieve the total and average of the hours recorded in WORKS_ON.", "answer_en": "SELECT SUM(Hours), AVG(Hours)\nFROM   WORKS_ON;\n\n-- Result on the textbook COMPANY state (1 row)\nSUM(Hours) | AVG(Hours)\n275 | 18.33\n\nBorg's Hours is NULL, so AVG divides by the 15 non-NULL values (275 / 15 ≈ 18.33)."}, {"id": "5-cn-1", "concept": "count-null", "type": "mc", "prompt": "COMPANY 상태에서 SELECT COUNT(Super_ssn) FROM EMPLOYEE; 의 결과는?", "choices": ["8", "7", "3", "1"], "answer": 1, "lesson": "L5-4", "unit": "U5", "prompt_en": "On the COMPANY state, what is the result of SELECT COUNT(Super_ssn) FROM EMPLOYEE;?"}, {"id": "5-cn-2", "concept": "count-null", "type": "mc", "prompt": "COMPANY 상태에서 SELECT COUNT(DISTINCT Salary) FROM EMPLOYEE; 의 결과는?", "choices": ["8", "7", "6", "5"], "answer": 2, "lesson": "L5-4", "unit": "U5", "prompt_en": "On the COMPANY state, what is the result of SELECT COUNT(DISTINCT Salary) FROM EMPLOYEE;?"}, {"id": "5-cn-3", "concept": "count-null", "type": "ox", "prompt": "COUNT(*)는 행 수를 세고, COUNT(속성)은 NULL이 아닌 값의 수를 센다.", "answer": true, "lesson": "L5-4", "unit": "U5", "prompt_en": "COUNT(*) counts rows, and COUNT(attribute) counts non-NULL values."}, {"id": "5-cn-4", "concept": "count-null", "type": "calc", "prompt": "부양가족이 2명 이상인 사원의 이름을 검색하시오.", "answer": "SELECT Lname, Fname\nFROM   EMPLOYEE\nWHERE  ( SELECT COUNT(*)\n         FROM   DEPENDENT\n         WHERE  Ssn = Essn ) >= 2;\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nLname | Fname\nSmith | John\nWong | Franklin", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["안쪽 COUNT(*) (사원마다 부양가족 수)", "Ssn = Essn (상관)", ">= 2"], "lesson": "L5-4", "unit": "U5", "prompt_en": "Retrieve the names of employees who have two or more dependents.", "answer_en": "SELECT Lname, Fname\nFROM   EMPLOYEE\nWHERE  ( SELECT COUNT(*)\n         FROM   DEPENDENT\n         WHERE  Ssn = Essn ) >= 2;\n\n-- Result on the textbook COMPANY state (2 rows)\nLname | Fname\nSmith | John\nWong | Franklin", "keys_en": ["Inner COUNT(*) (number of dependents per employee)", "Ssn = Essn (correlated)", ">= 2"]}, {"id": "5-cn-5", "concept": "count-null", "type": "calc", "prompt": "'Research' 부서의 사원 수를 검색하시오. (질의 22)", "answer": "SELECT COUNT(*)\nFROM   EMPLOYEE, DEPARTMENT\nWHERE  Dno = Dnumber AND Dname = 'Research';\n\n-- 교재 COMPANY 상태에서 실행 결과 (1행)\nCOUNT(*)\n4", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["COUNT(*)", "조인 + Dname 조건"], "lesson": "L5-4", "unit": "U5", "prompt_en": "Retrieve the number of employees in the 'Research' department. (Query 22)", "answer_en": "SELECT COUNT(*)\nFROM   EMPLOYEE, DEPARTMENT\nWHERE  Dno = Dnumber AND Dname = 'Research';\n\n-- Result on the textbook COMPANY state (1 row)\nCOUNT(*)\n4", "keys_en": ["COUNT(*)", "Join + Dname condition"]}, {"id": "5-cn-6", "concept": "count-null", "type": "short", "prompt": "COUNT(*), COUNT(A), COUNT(DISTINCT A)의 차이를 COMPANY의 EMPLOYEE.Super_ssn을 예로 설명하시오.", "answer": "COUNT(*): 행 수 → 8. COUNT(Super_ssn): NULL이 아닌 값의 수 → 7 (Borg는 NULL). COUNT(DISTINCT Super_ssn): 서로 다른 값의 수 → 3 (333445555, 888665555, 987654321).", "keys": ["COUNT(*) = 8 (행 수)", "COUNT(Super_ssn) = 7 (NULL 제외)", "COUNT(DISTINCT) = 3"], "lesson": "L5-4", "unit": "U5", "prompt_en": "Explain the difference between COUNT(*), COUNT(A) and COUNT(DISTINCT A), using EMPLOYEE.Super_ssn in COMPANY as an example.", "answer_en": "COUNT(*): number of rows → 8. COUNT(Super_ssn): number of non-NULL values → 7 (Borg's is NULL). COUNT(DISTINCT Super_ssn): number of distinct values → 3 (333445555, 888665555, 987654321).", "keys_en": ["COUNT(*) = 8 (number of rows)", "COUNT(Super_ssn) = 7 (NULL excluded)", "COUNT(DISTINCT) = 3"]}, {"id": "5-gb-1", "concept": "group-by", "type": "mc", "prompt": "GROUP BY Dno를 쓴 질의의 SELECT 절에 올 수 있는 것은?", "choices": ["Dno와 집계 함수", "모든 속성", "Lname", "Ssn"], "answer": 0, "lesson": "L5-4", "unit": "U5", "prompt_en": "In a query with GROUP BY Dno, what may appear in the SELECT clause?", "choices_en": ["Dno and aggregate functions", "Any attribute", "Lname", "Ssn"]}, {"id": "5-gb-2", "concept": "group-by", "type": "calc", "prompt": "부서마다 부서 번호, 사원 수, 평균 급여를 검색하시오. (질의 24)", "answer": "SELECT   Dno, COUNT(*), AVG(Salary)\nFROM     EMPLOYEE\nGROUP BY Dno;\n\n-- 교재 COMPANY 상태에서 실행 결과 (3행)\nDno | COUNT(*) | AVG(Salary)\n1 | 1 | 55000\n4 | 3 | 31000\n5 | 4 | 33250", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["GROUP BY Dno", "COUNT(*), AVG(Salary)"], "lesson": "L5-4", "unit": "U5", "prompt_en": "For each department, retrieve the department number, the number of employees and the average salary. (Query 24)", "answer_en": "SELECT   Dno, COUNT(*), AVG(Salary)\nFROM     EMPLOYEE\nGROUP BY Dno;\n\n-- Result on the textbook COMPANY state (3 rows)\nDno | COUNT(*) | AVG(Salary)\n1 | 1 | 55000\n4 | 3 | 31000\n5 | 4 | 33250"}, {"id": "5-gb-3", "concept": "group-by", "type": "calc", "prompt": "프로젝트마다 프로젝트 번호, 이름, 그 프로젝트에서 일하는 사원 수를 검색하시오. (질의 25)", "answer": "SELECT   Pnumber, Pname, COUNT(*)\nFROM     PROJECT, WORKS_ON\nWHERE    Pnumber = Pno\nGROUP BY Pnumber, Pname;\n\n-- 교재 COMPANY 상태에서 실행 결과 (6행)\nPnumber | Pname | COUNT(*)\n1 | ProductX | 2\n2 | ProductY | 3\n3 | ProductZ | 2\n10 | Computerization | 3\n20 | Reorganization | 3\n30 | Newbenefits | 3", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["PROJECT–WORKS_ON 조인", "GROUP BY Pnumber, Pname", "COUNT(*)"], "lesson": "L5-4", "unit": "U5", "prompt_en": "For each project, retrieve the project number, the project name and the number of employees who work on it. (Query 25)", "answer_en": "SELECT   Pnumber, Pname, COUNT(*)\nFROM     PROJECT, WORKS_ON\nWHERE    Pnumber = Pno\nGROUP BY Pnumber, Pname;\n\n-- Result on the textbook COMPANY state (6 rows)\nPnumber | Pname | COUNT(*)\n1 | ProductX | 2\n2 | ProductY | 3\n3 | ProductZ | 2\n10 | Computerization | 3\n20 | Reorganization | 3\n30 | Newbenefits | 3", "keys_en": ["PROJECT–WORKS_ON join", "GROUP BY Pnumber, Pname", "COUNT(*)"]}, {"id": "5-gb-4", "concept": "group-by", "type": "calc", "prompt": "부서마다 부서 이름과 그 부서가 통제하는 프로젝트 수를 검색하시오.", "answer": "SELECT   D.Dname, COUNT(*)\nFROM     DEPARTMENT AS D, PROJECT AS P\nWHERE    D.Dnumber = P.Dnum\nGROUP BY D.Dnumber, D.Dname;\n\n-- 교재 COMPANY 상태에서 실행 결과 (3행)\nDname | COUNT(*)\nHeadquarters | 1\nAdministration | 2\nResearch | 3", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["DEPARTMENT–PROJECT 조인", "GROUP BY 부서", "COUNT(*)"], "lesson": "L5-4", "unit": "U5", "prompt_en": "For each department, retrieve the department name and the number of projects it controls.", "answer_en": "SELECT   D.Dname, COUNT(*)\nFROM     DEPARTMENT AS D, PROJECT AS P\nWHERE    D.Dnumber = P.Dnum\nGROUP BY D.Dnumber, D.Dname;\n\n-- Result on the textbook COMPANY state (3 rows)\nDname | COUNT(*)\nHeadquarters | 1\nAdministration | 2\nResearch | 3", "keys_en": ["DEPARTMENT–PROJECT join", "GROUP BY department", "COUNT(*)"]}, {"id": "5-gb-5", "concept": "group-by", "type": "calc", "prompt": "사원마다 Ssn, 성, 일하는 프로젝트 수, 총 근무 시간을 검색하시오.", "answer": "SELECT   E.Ssn, E.Lname, COUNT(*), SUM(W.Hours)\nFROM     EMPLOYEE AS E, WORKS_ON AS W\nWHERE    E.Ssn = W.Essn\nGROUP BY E.Ssn, E.Lname;\n\n-- 교재 COMPANY 상태에서 실행 결과 (8행)\nSsn | Lname | COUNT(*) | SUM(W.Hours)\n123456789 | Smith | 2 | 40\n333445555 | Wong | 4 | 40\n453453453 | English | 2 | 40\n666884444 | Narayan | 1 | 40\n888665555 | Borg | 1 | NULL\n987654321 | Wallace | 2 | 35\n987987987 | Jabbar | 2 | 40\n999887777 | Zelaya | 2 | 40", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["EMPLOYEE–WORKS_ON 조인", "GROUP BY E.Ssn, E.Lname", "COUNT(*), SUM(Hours)"], "slot": 14, "pts": 10, "lesson": "L5-4", "unit": "U5", "prompt_en": "For each employee, retrieve the Ssn, last name, number of projects worked on and total hours.", "answer_en": "SELECT   E.Ssn, E.Lname, COUNT(*), SUM(W.Hours)\nFROM     EMPLOYEE AS E, WORKS_ON AS W\nWHERE    E.Ssn = W.Essn\nGROUP BY E.Ssn, E.Lname;\n\n-- Result on the textbook COMPANY state (8 rows)\nSsn | Lname | COUNT(*) | SUM(W.Hours)\n123456789 | Smith | 2 | 40\n333445555 | Wong | 4 | 40\n453453453 | English | 2 | 40\n666884444 | Narayan | 1 | 40\n888665555 | Borg | 1 | NULL\n987654321 | Wallace | 2 | 35\n987987987 | Jabbar | 2 | 40\n999887777 | Zelaya | 2 | 40", "keys_en": ["EMPLOYEE–WORKS_ON join", "GROUP BY E.Ssn, E.Lname", "COUNT(*), SUM(Hours)"]}, {"id": "5-gb-6", "concept": "group-by", "type": "ox", "prompt": "SELECT Dno, Lname, COUNT(*) FROM EMPLOYEE GROUP BY Dno; 는 표준 SQL에서 올바른 질의이다.", "answer": false, "explain": "Lname은 그룹마다 값이 하나로 정해지지 않는다. GROUP BY를 쓰면 SELECT엔 그룹화 속성과 집계만.", "lesson": "L5-4", "unit": "U5", "prompt_en": "SELECT Dno, Lname, COUNT(*) FROM EMPLOYEE GROUP BY Dno; is a valid query in standard SQL.", "explain_en": "Lname does not have a single value per group. With GROUP BY, SELECT may contain only grouping attributes and aggregates."}, {"id": "5-gb-7", "concept": "group-by", "type": "short", "prompt": "GROUP BY와 그룹화 속성을 설명하시오.", "answer": "GROUP BY는 릴레이션의 투플을 겹치지 않는 부분집합(그룹)으로 나눠서 그룹마다 집계 함수를 적용하게 한다. 그룹화 속성은 그룹을 나누는 기준으로, 같은 그룹의 투플은 그룹화 속성 값이 같다.", "keys": ["겹치지 않는 그룹으로 분할", "그룹마다 집계", "그룹화 속성 값이 같은 투플이 한 그룹"], "lesson": "L5-4", "unit": "U5", "prompt_en": "Explain GROUP BY and grouping attributes.", "answer_en": "GROUP BY partitions the tuples of a relation into nonoverlapping subsets (groups) so that aggregate functions are applied to each group. The grouping attributes are the basis for forming the groups; tuples in the same group have the same values of the grouping attributes.", "keys_en": ["Partition into nonoverlapping groups", "Aggregate per group", "Tuples with the same grouping attribute value form one group"]}, {"id": "5-hv-1", "concept": "having", "type": "mc", "prompt": "'평균 급여가 30000을 넘는 부서'의 조건을 쓰는 곳은?", "choices": ["WHERE AVG(Salary) > 30000", "SELECT 절", "HAVING AVG(Salary) > 30000", "ORDER BY"], "answer": 2, "lesson": "L5-4", "unit": "U5", "prompt_en": "Where is the condition 'departments whose average salary exceeds 30000' written?", "choices_en": ["WHERE AVG(Salary) > 30000", "SELECT clause", "HAVING AVG(Salary) > 30000", "ORDER BY"]}, {"id": "5-hv-2", "concept": "having", "type": "calc", "prompt": "사원이 두 명 넘게 일하는 프로젝트마다 번호, 이름, 사원 수를 검색하시오. (질의 26)", "answer": "SELECT   Pnumber, Pname, COUNT(*)\nFROM     PROJECT, WORKS_ON\nWHERE    Pnumber = Pno\nGROUP BY Pnumber, Pname\nHAVING   COUNT(*) > 2;\n\n-- 교재 COMPANY 상태에서 실행 결과 (4행)\nPnumber | Pname | COUNT(*)\n2 | ProductY | 3\n10 | Computerization | 3\n20 | Reorganization | 3\n30 | Newbenefits | 3", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["GROUP BY Pnumber, Pname", "HAVING COUNT(*) > 2"], "slot": 14, "pts": 10, "lesson": "L5-4", "unit": "U5", "prompt_en": "For each project on which more than two employees work, retrieve the project number, the project name and the number of employees. (Query 26)", "answer_en": "SELECT   Pnumber, Pname, COUNT(*)\nFROM     PROJECT, WORKS_ON\nWHERE    Pnumber = Pno\nGROUP BY Pnumber, Pname\nHAVING   COUNT(*) > 2;\n\n-- Result on the textbook COMPANY state (4 rows)\nPnumber | Pname | COUNT(*)\n2 | ProductY | 3\n10 | Computerization | 3\n20 | Reorganization | 3\n30 | Newbenefits | 3"}, {"id": "5-hv-3", "concept": "having", "type": "calc", "prompt": "평균 급여가 $30,000를 넘는 부서마다 부서 이름과 그 부서 사원 수를 검색하시오. (교안 연습 2)", "answer": "SELECT   D.Dname, COUNT(*)\nFROM     EMPLOYEE AS E, DEPARTMENT AS D\nWHERE    E.Dno = D.Dnumber\nGROUP BY D.Dname\nHAVING   AVG(E.Salary) > 30000;\n\n-- 교재 COMPANY 상태에서 실행 결과 (3행)\nDname | COUNT(*)\nAdministration | 3\nHeadquarters | 1\nResearch | 4", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["EMPLOYEE–DEPARTMENT 조인 (부서 이름 때문)", "GROUP BY 부서", "HAVING AVG(Salary) > 30000"], "slot": 14, "pts": 10, "lesson": "L5-4", "unit": "U5", "prompt_en": "For each department whose average salary is greater than $30,000, retrieve the department name and the number of employees in that department. (Slide exercise 2)", "answer_en": "SELECT   D.Dname, COUNT(*)\nFROM     EMPLOYEE AS E, DEPARTMENT AS D\nWHERE    E.Dno = D.Dnumber\nGROUP BY D.Dname\nHAVING   AVG(E.Salary) > 30000;\n\n-- Result on the textbook COMPANY state (3 rows)\nDname | COUNT(*)\nAdministration | 3\nHeadquarters | 1\nResearch | 4", "keys_en": ["EMPLOYEE–DEPARTMENT join (for the department name)", "GROUP BY department", "HAVING AVG(Salary) > 30000"]}, {"id": "5-hv-4", "concept": "having", "type": "calc", "prompt": "사원이 5명 이상인 부서마다 부서 번호와, 그 부서에서 급여가 40000 넘는 사원 수를 검색하시오. (WHERE와 HAVING의 차이에 주의)", "answer": "SELECT   Dno, COUNT(*)\nFROM     EMPLOYEE\nWHERE    Salary > 40000\n  AND    Dno IN ( SELECT   Dno\n                  FROM     EMPLOYEE\n                  GROUP BY Dno\n                  HAVING   COUNT(*) >= 5 )\nGROUP BY Dno;\n\n-- 교재 COMPANY 상태에서 실행 결과 (0행)\nDno | COUNT(*)\n\nWHERE Salary > 40000 ... GROUP BY Dno HAVING COUNT(*) >= 5 로 쓰면 '급여 40000 넘는 사원이 5명 이상'이 되어 뜻이 달라진다 (교재 질의 28의 함정). COMPANY 상태에는 5명 이상인 부서가 없어 결과가 비어 있다.", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["사원 5명 이상 조건은 그룹 전체 기준 → 중첩 질의에서 HAVING", "급여 > 40000은 WHERE", "바깥 GROUP BY Dno"], "lesson": "L5-4", "unit": "U5", "prompt_en": "For each department that has five or more employees, retrieve the department number and the number of its employees who earn more than 40000. (Watch the difference between WHERE and HAVING.)", "answer_en": "SELECT   Dno, COUNT(*)\nFROM     EMPLOYEE\nWHERE    Salary > 40000\n  AND    Dno IN ( SELECT   Dno\n                  FROM     EMPLOYEE\n                  GROUP BY Dno\n                  HAVING   COUNT(*) >= 5 )\nGROUP BY Dno;\n\n-- Result on the textbook COMPANY state (0 rows)\nDno | COUNT(*)\n\nWriting WHERE Salary > 40000 ... GROUP BY Dno HAVING COUNT(*) >= 5 would mean 'five or more employees earning more than 40000', which is different (the trap in textbook Query 28). On the COMPANY state no department has five or more employees, so the result is empty.", "keys_en": ["The five-or-more-employees condition is on the whole group → HAVING in a nested query", "Salary > 40000 goes in WHERE", "Outer GROUP BY Dno"]}, {"id": "5-hv-5", "concept": "having", "type": "calc", "prompt": "총 근무 시간이 50시간 이상인 프로젝트의 이름과 총 근무 시간을 검색하시오.", "answer": "SELECT   P.Pname, SUM(W.Hours)\nFROM     PROJECT AS P, WORKS_ON AS W\nWHERE    P.Pnumber = W.Pno\nGROUP BY P.Pnumber, P.Pname\nHAVING   SUM(W.Hours) >= 50;\n\n-- 교재 COMPANY 상태에서 실행 결과 (4행)\nPname | SUM(W.Hours)\nProductX | 52.5\nProductZ | 50\nComputerization | 55\nNewbenefits | 55", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["GROUP BY 프로젝트", "HAVING SUM(Hours) >= 50"], "slot": 14, "pts": 10, "lesson": "L5-4", "unit": "U5", "prompt_en": "Retrieve the names of projects whose total hours are 50 or more, together with the total hours.", "answer_en": "SELECT   P.Pname, SUM(W.Hours)\nFROM     PROJECT AS P, WORKS_ON AS W\nWHERE    P.Pnumber = W.Pno\nGROUP BY P.Pnumber, P.Pname\nHAVING   SUM(W.Hours) >= 50;\n\n-- Result on the textbook COMPANY state (4 rows)\nPname | SUM(W.Hours)\nProductX | 52.5\nProductZ | 50\nComputerization | 55\nNewbenefits | 55", "keys_en": ["GROUP BY project", "HAVING SUM(Hours) >= 50"]}, {"id": "5-hv-6", "concept": "having", "type": "blank", "prompt": "SQL 질의의 실행 순서: FROM → (a) → GROUP BY → (b) → SELECT → ORDER BY", "answer": "(a) WHERE / (b) HAVING", "accept": [["WHERE", "where"], ["HAVING", "having"]], "lesson": "L5-4", "unit": "U5", "prompt_en": "Order of execution of an SQL query: FROM → (a) → GROUP BY → (b) → SELECT → ORDER BY"}, {"id": "5-hv-7", "concept": "having", "type": "short", "prompt": "WHERE 절과 HAVING 절의 차이를 쓰시오.", "answer": "WHERE는 그룹을 만들기 전에 개별 투플에 대한 조건으로 투플을 거른다. HAVING은 GROUP BY로 만든 그룹의 요약 정보(집계)에 대한 조건으로 그룹을 거른다. 집계 함수 조건은 WHERE에 쓸 수 없고 HAVING에 쓴다.", "keys": ["WHERE = 투플 조건 (그룹 전)", "HAVING = 그룹 조건 (집계 후)", "집계 조건은 HAVING에"], "lesson": "L5-4", "unit": "U5", "prompt_en": "Explain the difference between the WHERE clause and the HAVING clause.", "answer_en": "WHERE filters tuples with conditions on individual tuples, before groups are formed. HAVING filters groups with conditions on the summary information (aggregates) of the groups formed by GROUP BY. A condition on an aggregate function cannot be written in WHERE; it goes in HAVING.", "keys_en": ["WHERE = tuple condition (before grouping)", "HAVING = group condition (after aggregation)", "Aggregate conditions go in HAVING"]}, {"id": "5-hv-8", "concept": "having", "type": "ox", "prompt": "HAVING은 GROUP BY와 함께 쓰여서 조건을 만족하는 그룹만 결과에 남긴다.", "answer": true, "lesson": "L5-4", "unit": "U5", "prompt_en": "HAVING is used with GROUP BY and keeps only the groups that satisfy the condition in the result."}, {"id": "5-as-1", "concept": "assertion", "type": "mc", "prompt": "CREATE ASSERTION이 필요한 경우는?", "choices": ["PK를 지정할 때", "키·개체·참조 무결성으로 표현할 수 없는 일반 제약을 지정할 때", "뷰를 만들 때", "인덱스를 만들 때"], "answer": 1, "lesson": "L5-5", "unit": "U5", "prompt_en": "When is CREATE ASSERTION needed?", "choices_en": ["To specify a PK", "To specify general constraints that cannot be expressed by key, entity integrity or referential integrity constraints", "To create a view", "To create an index"]}, {"id": "5-as-2", "concept": "assertion", "type": "short", "prompt": "CREATE ASSERTION에서 조건을 보통 NOT EXISTS로 쓰는 이유를 설명하시오.", "answer": "원하는 조건을 '위반하는 투플을 고르는 질의'로 쓰고 NOT EXISTS로 감싸면, 위반 투플이 없을 때(결과가 비었을 때) 참이 되어 제약이 만족되고, 하나라도 있으면 거짓이 되어 위반이다. CHECK 조건은 모든 DB 상태에서 참이어야 한다.", "keys": ["위반 투플을 찾는 질의", "NOT EXISTS → 비면 참(만족)", "CHECK는 모든 상태에서 참이어야"], "slot": 6, "pts": 3, "lesson": "L5-5", "unit": "U5", "prompt_en": "Explain why the condition in CREATE ASSERTION is usually written with NOT EXISTS.", "answer_en": "If you write a query that selects the tuples violating the desired condition and wrap it in NOT EXISTS, it is true when there are no violating tuples (the result is empty), so the constraint is satisfied; if there is even one, it is false, i.e., a violation. The CHECK condition must be true in every database state.", "keys_en": ["A query that finds violating tuples", "NOT EXISTS → true (satisfied) if empty", "CHECK must hold in every state"]}, {"id": "5-as-3", "concept": "assertion", "type": "calc", "prompt": "'사원의 급여는 그가 일하는 부서 관리자의 급여보다 많으면 안 된다'를 CREATE ASSERTION으로 쓰시오.", "answer": "CREATE ASSERTION SALARY_CONSTRAINT\nCHECK ( NOT EXISTS ( SELECT *\n                     FROM   EMPLOYEE E, EMPLOYEE M, DEPARTMENT D\n                     WHERE  E.Salary > M.Salary\n                       AND  E.Dno = D.Dnumber\n                       AND  D.Mgr_ssn = M.Ssn ) );", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["CREATE ASSERTION ... CHECK", "NOT EXISTS (위반 질의)", "E.Salary > M.Salary, E.Dno = D.Dnumber, D.Mgr_ssn = M.Ssn"], "lesson": "L5-5", "unit": "U5", "prompt_en": "Write 'the salary of an employee must not be greater than the salary of the manager of the department that the employee works for' as a CREATE ASSERTION.", "keys_en": ["CREATE ASSERTION ... CHECK", "NOT EXISTS (violation query)", "E.Salary > M.Salary, E.Dno = D.Dnumber, D.Mgr_ssn = M.Ssn"]}, {"id": "5-as-4", "concept": "assertion", "type": "calc", "prompt": "'모든 부서는 사원이 최소 1명 있어야 한다'를 CREATE ASSERTION으로 쓰시오.", "answer": "CREATE ASSERTION DEPT_HAS_EMP\nCHECK ( NOT EXISTS ( SELECT *\n                     FROM   DEPARTMENT D\n                     WHERE  NOT EXISTS ( SELECT *\n                                         FROM   EMPLOYEE E\n                                         WHERE  E.Dno = D.Dnumber ) ) );", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["CHECK ( NOT EXISTS (위반 = 사원 없는 부서) )", "안쪽 NOT EXISTS (그 부서 사원)"], "lesson": "L5-5", "unit": "U5", "prompt_en": "Write 'every department must have at least one employee' as a CREATE ASSERTION.", "keys_en": ["CHECK ( NOT EXISTS (violation = a department with no employees) )", "Inner NOT EXISTS (employees of that department)"]}, {"id": "5-as-5", "concept": "assertion", "type": "ox", "prompt": "Assertion의 CHECK 조건은 모든 DB 상태에서 참이어야 한다.", "answer": true, "lesson": "L5-5", "unit": "U5", "prompt_en": "The CHECK condition of an assertion must be true in every database state."}, {"id": "5-tr-1", "concept": "trigger-eca", "type": "mc", "prompt": "트리거의 ECA가 뜻하는 것은?", "choices": ["Event, Condition, Action", "Entity, Constraint, Attribute", "Execute, Check, Abort", "Event, Cascade, Assertion"], "answer": 0, "lesson": "L5-5", "unit": "U5", "prompt_en": "What does ECA stand for in triggers?"}, {"id": "5-tr-2", "concept": "trigger-eca", "type": "mc", "prompt": "트리거에서 조건(Condition)을 지정하는 절은?", "choices": ["CHECK", "IF", "WHEN", "WHERE"], "answer": 2, "lesson": "L5-5", "unit": "U5", "prompt_en": "Which clause specifies the C (Condition) of a trigger?"}, {"id": "5-tr-3", "concept": "trigger-eca", "type": "short", "prompt": "트리거의 세 구성 요소를 SALARY_VIOLATION 예로 설명하시오.", "answer": "Event: 조건을 깰 수 있는 갱신 연산 — 사원 삽입, 급여 변경, 상사 변경 (BEFORE INSERT OR UPDATE OF SALARY, SUPERVISOR_SSN ON EMPLOYEE). Condition: WHEN 절 — 새 급여가 직속 상사의 급여보다 큰가. Action: 조건이 참이면 실행 — 외부 프로시저 INFORM_SUPERVISOR로 상사에게 알림.", "keys": ["Event = 갱신 연산 (BEFORE/AFTER)", "Condition = WHEN 절", "Action = SQL/트랜잭션/외부 프로그램"], "slot": 6, "pts": 3, "lesson": "L5-5", "unit": "U5", "prompt_en": "Explain the three components of a trigger using the SALARY_VIOLATION example.", "answer_en": "Event: the update operations that could violate the condition — inserting an employee, changing a salary, changing a supervisor (BEFORE INSERT OR UPDATE OF SALARY, SUPERVISOR_SSN ON EMPLOYEE). Condition: the WHEN clause — is the new salary greater than the immediate supervisor's salary? Action: executed if the condition is true — notify the supervisor via the external procedure INFORM_SUPERVISOR.", "keys_en": ["Event = update operations (BEFORE/AFTER)", "Condition = WHEN clause", "Action = SQL / transaction / external program"]}, {"id": "5-tr-4", "concept": "trigger-eca", "type": "ox", "prompt": "트리거의 Condition은 선택 사항이며, 참일 때만 Action이 실행된다.", "answer": true, "lesson": "L5-5", "unit": "U5", "prompt_en": "The Condition of a trigger is optional, and the Action is executed only when it is true."}, {"id": "5-tr-5", "concept": "trigger-eca", "type": "short", "prompt": "Assertion과 Trigger의 차이를 쓰시오.", "answer": "Assertion은 항상 만족해야 하는 일반 제약을 선언하고, 위반하는 갱신을 막는다. Trigger는 특정 이벤트가 일어나고 조건이 맞으면 자동으로 실행할 동작(SQL, 트랜잭션, 외부 프로그램)을 지정한다 (예: 알림, 유도 데이터 갱신).", "keys": ["Assertion = 제약 (위반 막음)", "Trigger = 이벤트–조건–동작 (자동 실행)"], "slot": 6, "pts": 3, "lesson": "L5-5", "unit": "U5", "prompt_en": "Explain the difference between an assertion and a trigger.", "answer_en": "An assertion declares a general constraint that must always hold, and blocks updates that violate it. A trigger specifies actions (SQL statements, a transaction, an external program) to be executed automatically when a certain event occurs and a condition is met (e.g., notification, updating derived data).", "keys_en": ["Assertion = constraint (blocks violations)", "Trigger = event–condition–action (executed automatically)"]}, {"id": "5-tr-6", "concept": "trigger-eca", "type": "mc", "prompt": "트리거의 용도로 교안에 나온 것이 '아닌' 것은?", "choices": ["DB 일관성 유지", "DB 갱신 모니터링", "유도 데이터 자동 갱신", "질의 최적화"], "answer": 3, "lesson": "L5-5", "unit": "U5", "prompt_en": "Which is NOT a use of triggers given in the slides?", "choices_en": ["Maintaining database consistency", "Monitoring database updates", "Updating derived data automatically", "Query optimization"]}, {"id": "5-tr-7", "concept": "trigger-eca", "type": "blank", "prompt": "트리거의 Event는 (a) 또는 AFTER 키워드로 갱신 연산 전/후 실행을 지정하고, FOR EACH (b) 는 영향받은 투플마다 실행함을 뜻한다.", "answer": "(a) BEFORE / (b) ROW", "accept": [["BEFORE", "before"], ["ROW", "row"]], "lesson": "L5-5", "unit": "U5", "prompt_en": "The Event of a trigger uses the keyword (a) or AFTER to specify execution before/after the update operation, and FOR EACH (b) means it is executed for each affected tuple."}, {"id": "5-vd-1", "concept": "view-def", "type": "mc", "prompt": "뷰(view)에 대한 설명으로 옳은 것은?", "choices": ["항상 물리적으로 저장된 테이블", "기본 테이블에서 유도된 가상 테이블", "DB 사본", "인덱스의 한 종류"], "answer": 1, "lesson": "L5-6", "unit": "U5", "prompt_en": "Which statement about a view (VIEW) is correct?", "choices_en": ["A table that is always stored physically", "A virtual table derived from base tables", "A copy of the database", "A kind of index"]}, {"id": "5-vd-2", "concept": "view-def", "type": "ox", "prompt": "DROP VIEW로 뷰를 지우면 정의 테이블(기본 테이블)의 투플도 삭제된다.", "answer": false, "lesson": "L5-6", "unit": "U5", "prompt_en": "Dropping a view with DROP VIEW also deletes the tuples of its defining tables (base tables)."}, {"id": "5-vd-3", "concept": "view-def", "type": "calc", "prompt": "사원 이름(Fname, Lname), 프로젝트 이름, 근무 시간으로 된 뷰 WORKS_ON1을 정의하고, 그 뷰로 'ProductX'에서 일하는 사원의 이름을 검색하시오.", "answer": "CREATE VIEW WORKS_ON1\nAS SELECT Fname, Lname, Pname, Hours\n   FROM   EMPLOYEE, PROJECT, WORKS_ON\n   WHERE  Ssn = Essn AND Pno = Pnumber;\n\nSELECT Fname, Lname\nFROM   WORKS_ON1\nWHERE  Pname = 'ProductX';\n→ John Smith, Joyce English", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["CREATE VIEW ... AS SELECT", "세 테이블 조인", "뷰 질의는 단일 테이블처럼"], "lesson": "L5-6", "unit": "U5", "prompt_en": "Define a view WORKS_ON1 consisting of the employee name (Fname, Lname), project name and hours, and use the view to retrieve the names of employees who work on 'ProductX'.", "keys_en": ["CREATE VIEW ... AS SELECT", "Join of three tables", "Query the view like a single table"]}, {"id": "5-vd-4", "concept": "view-def", "type": "calc", "prompt": "부서 이름, 사원 수, 급여 합으로 된 뷰 DEPT_INFO(Dept_name, No_of_emps, Total_sal)를 정의하시오.", "answer": "CREATE VIEW DEPT_INFO (Dept_name, No_of_emps, Total_sal)\nAS SELECT   Dname, COUNT(*), SUM(Salary)\n   FROM     DEPARTMENT, EMPLOYEE\n   WHERE    Dnumber = Dno\n   GROUP BY Dname;", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["속성 이름 명시", "COUNT(*), SUM(Salary)", "GROUP BY Dname"], "lesson": "L5-6", "unit": "U5", "prompt_en": "Define a view DEPT_INFO(Dept_name, No_of_emps, Total_sal) consisting of the department name, number of employees and total salary.", "keys_en": ["Attribute names given explicitly", "COUNT(*), SUM(Salary)", "GROUP BY Dname"]}, {"id": "5-vd-5", "concept": "view-def", "type": "short", "prompt": "뷰를 쓰는 이유를 쓰시오.", "answer": "자주 쓰는 질의가 여러 테이블 조인이나 집계 같은 복잡한 조건을 포함할 때, 그걸 뷰로 정의해 두면 단일 테이블 질의처럼 간단하게 쓸 수 있다 (복잡한 질의 단순화). 또 특정 속성·투플만 보여주는 권한 부여에도 쓴다.", "keys": ["복잡한 질의 단순화 (단일 테이블처럼)", "권한 부여 (보안)"], "slot": 4, "pts": 3, "lesson": "L5-6", "unit": "U5", "prompt_en": "Why are views used?", "answer_en": "When a frequently used query involves complex conditions such as multi-table joins or aggregation, defining it as a view lets you use it simply, like a single-table query (simplifying complex queries). Views are also used for authorization, showing only certain attributes or tuples.", "keys_en": ["Simplifies complex queries (like a single table)", "Authorization (security)"]}, {"id": "5-vd-6", "concept": "view-def", "type": "calc", "prompt": "각 부서의 이름, 관리자의 이름과 급여로 된 뷰를 정의하고 쓸모를 쓰시오. (교안 연습 3)", "answer": "CREATE VIEW DEPT_INFO (DeptName, MgrFname, MgrLname, MgrSalary)\nAS SELECT D.Dname, E.Fname, E.Lname, E.Salary\n   FROM   DEPARTMENT AS D, EMPLOYEE AS E\n   WHERE  D.Mgr_ssn = E.Ssn;\n쓸모: 부서와 그 관리자 정보를 한 번에 보기 (Research–Franklin Wong 40000, …)", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["D.Mgr_ssn = E.Ssn 조인", "속성 이름 명시", "용도: 부서별 관리자 정보"], "lesson": "L5-6", "unit": "U5", "prompt_en": "Define a view with each department's name and its manager's name and salary, and explain what it is useful for. (Slide exercise 3)", "answer_en": "CREATE VIEW DEPT_INFO (DeptName, MgrFname, MgrLname, MgrSalary)\nAS SELECT D.Dname, E.Fname, E.Lname, E.Salary\n   FROM   DEPARTMENT AS D, EMPLOYEE AS E\n   WHERE  D.Mgr_ssn = E.Ssn;\nUse: see each department together with its manager's information at once (Research–Franklin Wong 40000, …)", "keys_en": ["Join D.Mgr_ssn = E.Ssn", "Attribute names given explicitly", "Use: manager information per department"]}, {"id": "5-vi-1", "concept": "view-impl", "type": "mc", "prompt": "뷰 질의를 기본 테이블에 대한 질의로 바꿔서 처리하고 뷰를 물리적으로 유지하지 않는 방식은?", "choices": ["질의 수정 (query modification)", "뷰 실체화 (view materialization)", "즉시 갱신", "지연 갱신"], "answer": 0, "lesson": "L5-6", "unit": "U5", "prompt_en": "Which approach processes a view query by transforming it into a query on the base tables, without keeping the view physically?", "choices_en": ["Query modification", "View materialization", "Immediate update", "Lazy update"]}, {"id": "5-vi-2", "concept": "view-impl", "type": "mc", "prompt": "실체화된 뷰를 '뷰 질의가 필요할 때' 갱신하는 방식은?", "choices": ["즉시 갱신", "주기적 갱신", "지연 갱신 (lazy)", "점진적 삭제"], "answer": 2, "lesson": "L5-6", "unit": "U5", "prompt_en": "Which strategy updates a materialized view 'when a view query needs it'?", "choices_en": ["Immediate update", "Periodic update", "Lazy update", "Incremental deletion"]}, {"id": "5-vi-3", "concept": "view-impl", "type": "short", "prompt": "뷰를 구현하는 두 방식(질의 수정, 뷰 실체화)을 비교하시오.", "answer": "질의 수정: 뷰 질의를 기본 테이블에 대한 질의로 변환해서 처리, 뷰를 물리적으로 유지하지 않음. 사용자는 편하지만 복잡한 뷰를 매번 다시 계산해서 비효율적. 뷰 실체화: 뷰가 처음 질의될 때 물리적인 뷰 테이블을 만들어 한동안 유지(이후 질의가 자주 올 거라 가정). 추가 저장 공간이 필요하고, 기본 테이블이 바뀌면 점진적 갱신으로 반영해야 한다.", "keys": ["질의 수정 = 변환, 저장 안 함, 매번 계산", "실체화 = 물리 테이블 유지, 저장 공간, 점진적 갱신"], "slot": 4, "pts": 3, "lesson": "L5-6", "unit": "U5", "prompt_en": "Compare the two approaches to implementing views (query modification and view materialization).", "answer_en": "Query modification: the view query is transformed into a query on the base tables; the view is not kept physically. Convenient for users, but inefficient because complex views are recomputed every time. View materialization: a physical view table is created when the view is first queried and kept for a while (assuming more queries on the view will follow). It needs extra storage space, and when the base tables change, the changes must be applied with incremental update.", "keys_en": ["Query modification = transformed, not stored, recomputed every time", "Materialization = physical table kept, storage space, incremental update"]}, {"id": "5-vi-4", "concept": "view-impl", "type": "short", "prompt": "실체화된 뷰의 갱신 시점 세 가지(즉시, 주기적, 지연)를 장단점과 함께 쓰시오.", "answer": "즉시 갱신: 기본 테이블이 바뀌자마자 갱신. 항상 최신이지만 불필요하고 비효율적일 수 있음. 주기적 갱신: 주기적으로 갱신. 뷰 질의가 최신이 아닌 결과를 받을 수 있음. 지연 갱신: 뷰 질의가 필요할 때 갱신. 질의가 오기 전까지는 최신이 아님.", "keys": ["즉시 = 항상 최신, 비효율", "주기적 = 최신 아닐 수 있음", "지연 = 필요할 때"], "lesson": "L5-6", "unit": "U5", "prompt_en": "Give the three times at which a materialized view can be updated (immediate, periodic, lazy), with their advantages and disadvantages.", "answer_en": "Immediate update: updated as soon as the base tables change. Always up to date, but may be unnecessary and inefficient. Periodic update: updated periodically. A view query may get a result that is not up to date. Lazy update: updated when a view query needs it. Not up to date until a query arrives.", "keys_en": ["Immediate = always up to date, inefficient", "Periodic = may not be up to date", "Lazy = when needed"]}, {"id": "5-vi-5", "concept": "view-impl", "type": "ox", "prompt": "DBMS는 정의 테이블이 바뀌면 뷰에 반영해서 뷰를 최신 상태로 유지할 책임이 있다.", "answer": true, "lesson": "L5-6", "unit": "U5", "prompt_en": "The DBMS is responsible for keeping a view up to date by reflecting changes in its defining tables."}, {"id": "5-vu-1", "concept": "view-update", "type": "mc", "prompt": "갱신이 허용되는 뷰는?", "choices": ["여러 테이블을 조인한 뷰", "단일 테이블에서 집계 없이 정의되고, PK와 DEFAULT 없는 NOT NULL 속성을 모두 포함한 뷰", "GROUP BY와 SUM을 쓴 뷰", "모든 뷰"], "answer": 1, "lesson": "L5-6", "unit": "U5", "prompt_en": "Which view allows updates?", "choices_en": ["A view that joins several tables", "A view defined on a single table without aggregates, including the PK and all NOT NULL attributes without a DEFAULT", "A view that uses GROUP BY and SUM", "Every view"]}, {"id": "5-vu-2", "concept": "view-update", "type": "short", "prompt": "UPDATE DEPT_INFO SET Total_sal = 100000 WHERE Dname = 'Research'; 가 불가능한 이유를 쓰시오.", "answer": "Total_sal은 SUM(Salary)로 계산된 집계 값이고 물리적으로 저장되지 않는다. 그 값을 100000으로 바꾸려면 Research 사원들의 급여를 어떻게 바꿔야 할지 정할 수 없으므로 의미가 없는 갱신이다.", "keys": ["집계로 계산된 값, 저장 안 됨", "기본 테이블 갱신으로 바꿀 방법이 없음 (의미 없음)"], "slot": 4, "pts": 3, "lesson": "L5-6", "unit": "U5", "prompt_en": "Explain why UPDATE DEPT_INFO SET Total_sal = 100000 WHERE Dname = 'Research'; is impossible.", "answer_en": "Total_sal is an aggregate value computed by SUM(Salary) and is not physically stored. To change it to 100000 there is no way to decide how the salaries of the Research employees should change, so the update does not make sense.", "keys_en": ["Computed by an aggregate, not stored", "No way to achieve it by updating the base tables (meaningless)"]}, {"id": "5-vu-3", "concept": "view-update", "type": "short", "prompt": "WORKS_ON1 뷰(EMPLOYEE, PROJECT, WORKS_ON 조인)에 UPDATE WORKS_ON1 SET Pname = 'ProductY' WHERE Lname = 'Smith' AND Fname = 'John' AND Pname = 'ProductX'; 를 하면 생기는 문제를 쓰시오.", "answer": "이 갱신은 기본 테이블 갱신으로 여러 가지로 해석된다. (a) Smith의 WORKS_ON 투플의 Pno를 ProductY의 번호로 바꾸기 (Smith가 일하는 프로젝트를 바꿈, 의도에 맞음). (b) PROJECT에서 'ProductX'의 이름을 'ProductY'로 바꾸기 (뷰 결과는 같아 보이지만 ProductX에서 일하던 다른 모든 투플까지 바뀌는 부작용). 어느 쪽이 맞는지 정할 수 없어서 조인 뷰는 일반적으로 갱신할 수 없다.", "keys": ["해석 a: WORKS_ON의 Pno 변경", "해석 b: PROJECT의 Pname 변경 (부작용)", "여러 해석 → 갱신 불가"], "slot": 4, "pts": 3, "lesson": "L5-6", "unit": "U5", "prompt_en": "Explain the problem that arises when UPDATE WORKS_ON1 SET Pname = 'ProductY' WHERE Lname = 'Smith' AND Fname = 'John' AND Pname = 'ProductX'; is applied to the view WORKS_ON1 (a join of EMPLOYEE, PROJECT and WORKS_ON).", "answer_en": "This update can be mapped to base-table updates in several ways. (a) Change Pno in Smith's WORKS_ON tuple to the number of ProductY (changes the project Smith works on, as intended). (b) Rename 'ProductX' to 'ProductY' in PROJECT (the view result looks the same, but with a side effect: every other tuple that worked on ProductX changes too). Since we cannot decide which is correct, join views are generally not updatable.", "keys_en": ["Interpretation a: change Pno in WORKS_ON", "Interpretation b: change Pname in PROJECT (side effect)", "Multiple interpretations → not updatable"]}, {"id": "5-vu-4", "concept": "view-update", "type": "ox", "prompt": "뷰 갱신은 그 갱신을 이루는 기본 릴레이션 갱신이 딱 하나뿐일 때 가능하다.", "answer": true, "lesson": "L5-6", "unit": "U5", "prompt_en": "A view update is possible when there is exactly one update on the base relations that accomplishes it."}, {"id": "5-vu-5", "concept": "view-update", "type": "mc", "prompt": "단일 테이블 뷰가 갱신 가능하려면 뷰 속성에 반드시 포함되어야 하는 것은?", "choices": ["모든 속성", "FK 속성", "집계 속성", "기본 키와, DEFAULT가 없는 NOT NULL 속성 전부"], "answer": 3, "lesson": "L5-6", "unit": "U5", "prompt_en": "For a single-table view to be updatable, what must the view's attributes include?", "choices_en": ["All attributes", "The FK attributes", "Aggregate attributes", "The primary key and all NOT NULL attributes without a DEFAULT"]}, {"id": "5-vu-6", "concept": "view-update", "type": "short", "prompt": "단일 테이블 뷰가 갱신 가능하려면 왜 기본 키와 DEFAULT 없는 NOT NULL 속성을 모두 포함해야 하는지 쓰시오.", "answer": "뷰를 통해 투플을 삽입하면 뷰에 없는 속성은 기본 테이블에서 NULL(또는 DEFAULT)이 된다. PK가 빠지면 개체 무결성을, DEFAULT 없는 NOT NULL 속성이 빠지면 NOT NULL 제약을 어기게 된다. 또 PK가 있어야 뷰의 투플이 기본 테이블의 어느 투플인지 하나로 정해진다.", "keys": ["뷰에 없는 속성은 NULL로 들어감", "PK·NOT NULL 위반 방지", "PK로 대응 투플을 하나로 특정"], "lesson": "L5-6", "unit": "U5", "prompt_en": "Explain why a single-table view must include the primary key and all NOT NULL attributes without a DEFAULT in order to be updatable.", "answer_en": "When a tuple is inserted through the view, the attributes not in the view become NULL (or the DEFAULT) in the base table. If the PK is missing, entity integrity is violated; if a NOT NULL attribute without a DEFAULT is missing, the NOT NULL constraint is violated. Also, the PK is needed to identify uniquely which base-table tuple a view tuple corresponds to.", "keys_en": ["Attributes not in the view are inserted as NULL", "Prevents PK / NOT NULL violations", "The PK identifies the corresponding tuple uniquely"]}, {"id": "5-vu-7", "concept": "view-update", "type": "mc", "prompt": "갱신이 일반적으로 불가능한 뷰가 '아닌' 것은?", "choices": ["두 테이블을 조인한 뷰", "AVG를 쓴 뷰", "SELECT Ssn, Fname, Lname, Dno FROM EMPLOYEE WHERE Dno = 5 로 정의한 뷰 (Ssn이 PK, 나머지 NOT NULL 속성 포함)", "GROUP BY를 쓴 뷰"], "answer": 2, "lesson": "L5-6", "unit": "U5", "prompt_en": "Which view is NOT one that is generally non-updatable?", "choices_en": ["A view that joins two tables", "A view that uses AVG", "A view defined as SELECT Ssn, Fname, Lname, Dno FROM EMPLOYEE WHERE Dno = 5 (Ssn is the PK; includes the other NOT NULL attributes)", "A view that uses GROUP BY"]}, {"id": "5-va-1", "concept": "view-auth", "type": "mc", "prompt": "5번 부서 관리자가 5번 부서 사원 정보만 보게 하는 방법은?", "choices": ["DEPT5EMP 뷰를 만들고 그 뷰에 대한 질의 권한만 부여", "EMPLOYEE에서 다른 부서 투플을 삭제", "EMPLOYEE 사본을 만듦", "트리거로 알림"], "answer": 0, "lesson": "L5-6", "unit": "U5", "prompt_en": "How can the manager of department 5 be allowed to see only the information of department 5 employees?", "choices_en": ["Create the DEPT5EMP view and grant query privileges only on that view", "Delete the tuples of other departments from EMPLOYEE", "Make a copy of EMPLOYEE", "Send a notification with a trigger"]}, {"id": "5-va-2", "concept": "view-auth", "type": "calc", "prompt": "일반 사원이 다른 사원의 이름과 주소만 볼 수 있게 하는 뷰 BASIC_EMP_DATA를 정의하시오.", "answer": "CREATE VIEW BASIC_EMP_DATA AS\nSELECT Fname, Lname, Address\nFROM   EMPLOYEE;\n(사용자에게 EMPLOYEE가 아니라 이 뷰에 대한 질의 권한만 준다)", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["CREATE VIEW", "이름, 주소만 (속성 제한)"], "lesson": "L5-6", "unit": "U5", "prompt_en": "Define a view BASIC_EMP_DATA that lets general employees see only the names and addresses of other employees.", "answer_en": "CREATE VIEW BASIC_EMP_DATA AS\nSELECT Fname, Lname, Address\nFROM   EMPLOYEE;\n(Users are granted query privileges only on this view, not on EMPLOYEE)", "keys_en": ["CREATE VIEW", "Names and addresses only (restricts attributes)"]}, {"id": "5-va-3", "concept": "view-auth", "type": "ox", "prompt": "뷰는 권한 없는 사용자에게 특정 속성이나 특정 투플을 숨기는 데 쓸 수 있다.", "answer": true, "lesson": "L5-6", "unit": "U5", "prompt_en": "Views can be used to hide certain attributes or certain tuples from unauthorized users."}, {"id": "6-in-1", "concept": "ra-intro", "type": "mc", "prompt": "관계 대수와 SQL의 차이로 옳은 것은?", "choices": ["관계 대수는 선언적, SQL은 절차적", "관계 대수는 절차적(어떻게), SQL은 선언적(무엇을)", "둘 다 절차적", "둘 다 선언적"], "answer": 1, "lesson": "L6-1", "unit": "U6", "prompt_en": "Which statement about the difference between relational algebra and SQL is correct?", "choices_en": ["Relational algebra is declarative, SQL is procedural", "Relational algebra is procedural (how), SQL is declarative (what)", "Both are procedural", "Both are declarative"]}, {"id": "6-in-2", "concept": "ra-intro", "type": "short", "prompt": "관계 대수가 중요한 이유 두 가지를 쓰시오.", "answer": "1) 관계 모델 연산(선택, 투영, 이름 바꾸기, 조인, 카티션 곱 등)의 형식적 기초이며 집합에 대한 수학 개념에 엄격하게 기반한다. 2) 결과를 얻기 위한 연산의 순서를 명시하므로 질의 처리와 최적화의 기반이 된다.", "keys": ["관계 모델 연산의 형식적 기초 (집합 기반)", "질의 처리·최적화의 기반 (연산 순서)"], "slot": 5, "pts": 3, "lesson": "L6-1", "unit": "U6", "prompt_en": "Give two reasons why relational algebra is important.", "answer_en": "1) It is the formal foundation for relational model operations (select, project, rename, join, Cartesian product, etc.) and is rigorously based on mathematical concepts of sets. 2) It specifies the sequence of operations that produces the result, so it is the basis for query processing and optimization.", "keys_en": ["Formal foundation of relational model operations (set-based)", "Basis for query processing and optimization (order of operations)"]}, {"id": "6-in-3", "concept": "ra-intro", "type": "ox", "prompt": "관계 대수 연산의 결과는 항상 릴레이션이다 (닫힌 체계).", "answer": true, "lesson": "L6-1", "unit": "U6", "prompt_en": "The result of a relational algebra operation is always a relation (a closed system)."}, {"id": "6-qt-1", "concept": "query-tree", "type": "mc", "prompt": "질의 트리에서 잎 노드와 내부 노드는 각각?", "choices": ["연산, 릴레이션", "SQL 절, 속성", "입력 릴레이션, 관계 대수 연산", "조건, 결과"], "answer": 2, "lesson": "L6-1", "unit": "U6", "prompt_en": "In a query tree, what are the leaf nodes and the internal nodes, respectively?", "choices_en": ["Operations, relations", "SQL clauses, attributes", "Input relations, relational algebra operations", "Conditions, results"]}, {"id": "6-qt-2", "concept": "query-tree", "type": "ox", "prompt": "질의 트리는 루트에서 시작해서 잎에서 끝나는 순서로 실행된다.", "answer": false, "explain": "잎(입력 릴레이션)에서 시작해 루트에서 끝난다.", "lesson": "L6-1", "unit": "U6", "prompt_en": "A query tree is executed starting at the root and ending at the leaves.", "explain_en": "It starts at the leaves (input relations) and ends at the root."}, {"id": "6-qt-3", "concept": "query-tree", "type": "short", "prompt": "질의 처리(query processing)란 무엇이고, 질의 트리와 어떤 관계인지 쓰시오.", "answer": "질의 처리는 SQL 질의를 실행할 수 있는 여러 전략(질의 트리, 실행 계획) 중 적절한 것을 고르는 과정이다. SQL 하나에 질의 트리가 여러 개 있을 수 있고, 그중 최선을 고르는 것이 질의 최적화다.", "keys": ["여러 실행 전략 중 선택", "SQL 하나에 질의 트리 여러 개", "최선 선택 = 최적화"], "slot": 5, "pts": 3, "lesson": "L6-1", "unit": "U6", "prompt_en": "Explain what query processing (in a DBMS) is and how it relates to query trees.", "answer_en": "Query processing is the process of choosing a suitable strategy among the possible strategies (query trees, execution plans) for executing an SQL query. One SQL query can have several query trees, and choosing the best one is query optimization.", "keys_en": ["Choosing among several execution strategies", "Several query trees for one SQL query", "Choosing the best = optimization"]}, {"id": "6-qt-4", "concept": "query-tree", "type": "calc", "prompt": "다음 SQL을 질의 트리의 실행 순서대로 관계 대수 단계(중간 릴레이션)로 쓰시오.\nSELECT P.Pnumber, P.Dnum, E.Lname, E.Address, E.Bdate\nFROM   PROJECT P, DEPARTMENT D, EMPLOYEE E\nWHERE  P.Dnum = D.Dnumber AND D.Mgr_ssn = E.Ssn AND P.Plocation = 'Stafford';", "answer": "STAFFORD_PROJS ← σ Plocation='Stafford' (PROJECT)\nCONTR_DEPTS    ← STAFFORD_PROJS ⋈ Dnum=Dnumber DEPARTMENT\nPROJ_DEPT_MGRS ← CONTR_DEPTS ⋈ Mgr_ssn=Ssn EMPLOYEE\nRESULT         ← π Pnumber, Dnum, Lname, Address, Bdate (PROJ_DEPT_MGRS)\n(잎: PROJECT, DEPARTMENT, EMPLOYEE / 루트: π)", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["σ Plocation 먼저 (잎 쪽)", "⋈ Dnum=Dnumber", "⋈ Mgr_ssn=Ssn", "π 루트"], "lesson": "L6-1", "unit": "U6", "prompt_en": "Write the following SQL as relational algebra steps (intermediate relations) in the execution order of its query tree.\nSELECT P.Pnumber, P.Dnum, E.Lname, E.Address, E.Bdate\nFROM   PROJECT P, DEPARTMENT D, EMPLOYEE E\nWHERE  P.Dnum = D.Dnumber AND D.Mgr_ssn = E.Ssn AND P.Plocation = 'Stafford';", "answer_en": "STAFFORD_PROJS ← σ Plocation='Stafford' (PROJECT)\nCONTR_DEPTS    ← STAFFORD_PROJS ⋈ Dnum=Dnumber DEPARTMENT\nPROJ_DEPT_MGRS ← CONTR_DEPTS ⋈ Mgr_ssn=Ssn EMPLOYEE\nRESULT         ← π Pnumber, Dnum, Lname, Address, Bdate (PROJ_DEPT_MGRS)\n(Leaves: PROJECT, DEPARTMENT, EMPLOYEE / root: π)", "keys_en": ["σ Plocation first (at the leaf side)", "⋈ Dnum=Dnumber", "⋈ Mgr_ssn=Ssn", "π at the root"]}, {"id": "6-sel-1", "concept": "ra-select", "type": "mc", "prompt": "σ Dno=4 (EMPLOYEE)의 결과 차수(속성 수)는?", "choices": ["1", "4", "EMPLOYEE와 같다 (10)", "조건을 만족하는 투플 수"], "answer": 2, "lesson": "L6-2", "unit": "U6", "prompt_en": "What is the degree (number of attributes) of the result of σ Dno=4 (EMPLOYEE)?", "choices_en": ["1", "4", "The same as EMPLOYEE (10)", "The number of tuples that satisfy the condition"]}, {"id": "6-sel-2", "concept": "ra-select", "type": "mc", "prompt": "관계 대수의 σ에 대응하는 SQL 부분은?", "choices": ["SELECT 절", "WHERE 절", "FROM 절", "GROUP BY 절"], "answer": 1, "lesson": "L6-2", "unit": "U6", "prompt_en": "Which part of SQL corresponds to σ in relational algebra?", "choices_en": ["SELECT clause", "WHERE clause", "FROM clause", "GROUP BY clause"]}, {"id": "6-sel-3", "concept": "ra-select", "type": "ox", "prompt": "σ c1(σ c2(R)) = σ c2(σ c1(R)) 이 성립한다 (교환 법칙).", "answer": true, "lesson": "L6-2", "unit": "U6", "prompt_en": "σ c1(σ c2(R)) = σ c2(σ c1(R)) holds (commutative property)."}, {"id": "6-sel-4", "concept": "ra-select", "type": "blank", "prompt": "σ는 릴레이션에서 조건을 만족하는 투플을 고르는 (a) 필터링이고, π는 원하는 열만 남기는 (b) 필터링이다.", "answer": "(a) 수평 / (b) 수직", "accept": [["수평", "horizontal", "가로"], ["수직", "vertical", "세로"]], "lesson": "L6-2", "unit": "U6", "prompt_en": "σ is (a) filtering, which selects the tuples of a relation that satisfy a condition, and π is (b) filtering, which keeps only the desired columns.", "answer_en": "(a) horizontal / (b) vertical"}, {"id": "6-sel-5", "concept": "ra-select", "type": "calc", "prompt": "4번 부서에서 급여가 25000을 넘거나, 5번 부서에서 급여가 30000을 넘는 사원 투플을 관계 대수로 쓰시오.", "answer": "σ (Dno=4 AND Salary>25000) OR (Dno=5 AND Salary>30000) (EMPLOYEE)\n\n-- COMPANY 상태에서의 결과 (3행)\nFname | Lname | Dno | Salary\nFranklin | Wong | 5 | 40000\nJennifer | Wallace | 4 | 43000\nRamesh | Narayan | 5 | 38000", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["σ 하나에 AND/OR 조건", "(Dno=4 AND Salary>25000) OR (Dno=5 AND Salary>30000)"], "lesson": "L6-2", "unit": "U6", "prompt_en": "In relational algebra, write the employee tuples who either work in department 4 and earn more than 25000, or work in department 5 and earn more than 30000.", "answer_en": "σ (Dno=4 AND Salary>25000) OR (Dno=5 AND Salary>30000) (EMPLOYEE)\n\n-- Result on the COMPANY state (3 rows)\nFname | Lname | Dno | Salary\nFranklin | Wong | 5 | 40000\nJennifer | Wallace | 4 | 43000\nRamesh | Narayan | 5 | 38000", "keys_en": ["AND/OR conditions in a single σ", "(Dno=4 AND Salary>25000) OR (Dno=5 AND Salary>30000)"]}, {"id": "6-sel-6", "concept": "ra-select", "type": "short", "prompt": "σ의 조건(selection condition)에 쓸 수 있는 절의 형태와 비교 연산자를 쓰고, 순서가 없는 값의 경우를 쓰시오.", "answer": "절의 형태: <속성> <비교연산> <상수> 또는 <속성> <비교연산> <속성>, 절들은 AND, OR로 연결. 비교 연산자: =, <, ≤, >, ≥, ≠. 순서가 있는 값(숫자, 날짜)은 모두 쓸 수 있지만 순서가 없는 값(예: 색깔)은 =, ≠만.", "keys": ["<속성> op <상수/속성>", "AND, OR 연결", "순서 없는 값은 =, ≠만"], "lesson": "L6-2", "unit": "U6", "prompt_en": "Give the form of the clauses and the comparison operators that can be used in the condition of σ (selection condition), and explain the case of unordered values.", "answer_en": "Clause form: <attribute> <comparison op> <constant> or <attribute> <comparison op> <attribute>; clauses are connected by AND, OR. Comparison operators: =, <, ≤, >, ≥, ≠. All of them can be used for ordered values (numbers, dates), but only =, ≠ for unordered values (e.g., colors).", "keys_en": ["<attribute> op <constant/attribute>", "Connected by AND, OR", "Only =, ≠ for unordered values"]}, {"id": "6-sel-7", "concept": "ra-select", "type": "calc", "prompt": "σ Dno=5 AND Salary>=30000 (EMPLOYEE) 와 같은 결과를 내는 SQL을 쓰고, 이 σ를 두 개의 σ로 나눠 쓰시오.", "answer": "SQL: SELECT * FROM EMPLOYEE WHERE Dno = 5 AND Salary >= 30000;\n두 개로: σ Dno=5 (σ Salary>=30000 (EMPLOYEE))  (또는 순서를 바꿔도 같음)\n결과: Smith, Wong, Narayan", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["SELECT * ... WHERE (σ = WHERE)", "σ를 중첩해 나눔 (교환 가능)"], "lesson": "L6-2", "unit": "U6", "prompt_en": "Write SQL that gives the same result as σ Dno=5 AND Salary>=30000 (EMPLOYEE), and split this σ into two σ operations.", "answer_en": "SQL: SELECT * FROM EMPLOYEE WHERE Dno = 5 AND Salary >= 30000;\nAs two: σ Dno=5 (σ Salary>=30000 (EMPLOYEE))  (the same in the other order)\nResult: Smith, Wong, Narayan", "keys_en": ["SELECT * ... WHERE (σ = WHERE)", "Split σ by nesting (commutative)"]}, {"id": "6-pro-1", "concept": "ra-project", "type": "mc", "prompt": "COMPANY 상태에서 π Sex, Salary (EMPLOYEE)의 결과 투플 수는?", "choices": ["8", "7", "6", "2"], "answer": 1, "lesson": "L6-2", "unit": "U6", "prompt_en": "On the COMPANY state, how many tuples are in the result of π Sex, Salary (EMPLOYEE)?"}, {"id": "6-pro-2", "concept": "ra-project", "type": "mc", "prompt": "π Sex, Salary (EMPLOYEE)와 정확히 같은 결과를 내는 SQL은?", "choices": ["SELECT Sex, Salary FROM EMPLOYEE;", "SELECT ALL Sex, Salary FROM EMPLOYEE;", "SELECT DISTINCT Sex, Salary FROM EMPLOYEE;", "SELECT * FROM EMPLOYEE;"], "answer": 2, "lesson": "L6-2", "unit": "U6", "prompt_en": "Which SQL gives exactly the same result as π Sex, Salary (EMPLOYEE)?"}, {"id": "6-pro-3", "concept": "ra-project", "type": "ox", "prompt": "π의 속성 리스트에 키 속성이 포함되면 결과에 중복 투플이 생기지 않는다.", "answer": true, "lesson": "L6-2", "unit": "U6", "prompt_en": "If the attribute list of π includes a key attribute, the result has no duplicate tuples."}, {"id": "6-pro-4", "concept": "ra-project", "type": "short", "prompt": "π 연산이 중복을 제거하는 이유와, 중복이 생기는 경우를 쓰시오.", "answer": "관계 대수는 집합에 기반하므로 π의 결과도 서로 다른 투플의 집합이어야 한다. 속성 리스트에 비키 속성만 있으면 서로 다른 투플이 같은 값 조합을 가질 수 있어 중복이 생기는데, π는 이를 제거한다.", "keys": ["결과는 집합 (중복 제거)", "비키 속성만 투영하면 중복 발생"], "lesson": "L6-2", "unit": "U6", "prompt_en": "Explain why the π operation eliminates duplicates and when duplicates arise.", "answer_en": "Relational algebra is based on sets, so the result of π must also be a set of distinct tuples. If the attribute list contains only nonkey attributes, different tuples may have the same combination of values, producing duplicates, which π removes.", "keys_en": ["The result is a set (duplicates eliminated)", "Projecting only nonkey attributes produces duplicates"]}, {"id": "6-pro-5", "concept": "ra-project", "type": "calc", "prompt": "모든 사원의 성, 이름, 급여를 관계 대수로 쓰시오.", "answer": "π Lname, Fname, Salary (EMPLOYEE)\n\n-- COMPANY 상태에서의 결과 (8행)\nLname | Fname | Salary\nSmith | John | 30000\nWong | Franklin | 40000\nZelaya | Alicia | 25000\nWallace | Jennifer | 43000\nNarayan | Ramesh | 38000\nEnglish | Joyce | 25000\nJabbar | Ahmad | 25000\nBorg | James | 55000", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["π Lname, Fname, Salary"], "lesson": "L6-2", "unit": "U6", "prompt_en": "In relational algebra, write the last name, first name and salary of all employees.", "answer_en": "π Lname, Fname, Salary (EMPLOYEE)\n\n-- Result on the COMPANY state (8 rows)\nLname | Fname | Salary\nSmith | John | 30000\nWong | Franklin | 40000\nZelaya | Alicia | 25000\nWallace | Jennifer | 43000\nNarayan | Ramesh | 38000\nEnglish | Joyce | 25000\nJabbar | Ahmad | 25000\nBorg | James | 55000"}, {"id": "6-pro-6", "concept": "ra-project", "type": "calc", "prompt": "5번 부서 사원들이 받는 급여 값들을 중복 없이 관계 대수로 쓰시오.", "answer": "π Salary (σ Dno=5 (EMPLOYEE))\n\n-- COMPANY 상태에서의 결과 (4행)\nSalary\n30000\n40000\n38000\n25000", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["σ Dno=5 먼저", "π Salary (중복 자동 제거)"], "lesson": "L6-2", "unit": "U6", "prompt_en": "In relational algebra, write the salary values earned by department 5 employees, without duplicates.", "answer_en": "π Salary (σ Dno=5 (EMPLOYEE))\n\n-- Result on the COMPANY state (4 rows)\nSalary\n30000\n40000\n38000\n25000", "keys_en": ["σ Dno=5 first", "π Salary (duplicates eliminated automatically)"]}, {"id": "6-pro-7", "concept": "ra-project", "type": "blank", "prompt": "π의 결과 차수는 (a) 에 있는 속성 수와 같고, σ의 결과 차수는 (b) 의 차수와 같다.", "answer": "(a) 속성 리스트 / (b) R", "accept": [["속성 리스트", "attribute list", "리스트", "속성 목록", "list"], ["R", "원래 릴레이션", "입력 릴레이션", "릴레이션", "the original relation", "the input relation", "relation"]], "lesson": "L6-2", "unit": "U6", "prompt_en": "The degree of the result of π equals the number of attributes in the (a), and the degree of the result of σ equals the degree of (b).", "answer_en": "(a) attribute list / (b) R"}, {"id": "6-ren-1", "concept": "ra-rename", "type": "mc", "prompt": "ρ S(B₁, …, Bₙ)(R) 의 뜻은?", "choices": ["릴레이션 이름을 S로, 속성 이름을 B₁…Bₙ으로 바꿈", "S와 R을 조인", "R에서 B₁…Bₙ만 투영", "S를 R로 바꿈"], "answer": 0, "lesson": "L6-2", "unit": "U6", "prompt_en": "What does ρ S(B₁, …, Bₙ)(R) mean?", "choices_en": ["Renames the relation to S and the attributes to B₁…Bₙ", "Joins S and R", "Projects only B₁…Bₙ from R", "Changes S to R"]}, {"id": "6-ren-2", "concept": "ra-rename", "type": "ox", "prompt": "SQL에서 이름 바꾸기는 AS(별칭)로 한다.", "answer": true, "lesson": "L6-2", "unit": "U6", "prompt_en": "In SQL, renaming is done with AS (aliasing)."}, {"id": "6-ren-3", "concept": "ra-rename", "type": "calc", "prompt": "5번 부서 사원의 이름, 성, 급여를 구하고 결과 속성 이름을 First_name, Last_name, Salary로 바꾸는 관계 대수를 쓰고, 같은 SQL을 쓰시오.", "answer": "TEMP ← σ Dno=5 (EMPLOYEE)\nR(First_name, Last_name, Salary) ← π Fname, Lname, Salary (TEMP)\n(또는 ρ (First_name, Last_name, Salary) (π Fname, Lname, Salary (TEMP)))\n\nSQL: SELECT E.Fname AS First_name, E.Lname AS Last_name, E.Salary AS Salary\n     FROM EMPLOYEE AS E WHERE E.Dno = 5;", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["σ Dno=5", "π 후 ρ (또는 R(속성들) ←)", "SQL은 AS"], "lesson": "L6-2", "unit": "U6", "prompt_en": "Write relational algebra that retrieves the first name, last name and salary of department 5 employees and renames the result attributes to First_name, Last_name, Salary, and write the equivalent SQL.", "answer_en": "TEMP ← σ Dno=5 (EMPLOYEE)\nR(First_name, Last_name, Salary) ← π Fname, Lname, Salary (TEMP)\n(or ρ (First_name, Last_name, Salary) (π Fname, Lname, Salary (TEMP)))\n\nSQL: SELECT E.Fname AS First_name, E.Lname AS Last_name, E.Salary AS Salary\n     FROM EMPLOYEE AS E WHERE E.Dno = 5;", "keys_en": ["σ Dno=5", "π then ρ (or R(attributes) ←)", "AS in SQL"]}, {"id": "6-ren-4", "concept": "ra-rename", "type": "short", "prompt": "관계 대수에서 RENAME이 필요한 경우를 두 가지 쓰시오.", "answer": "1) 자연 조인에서 조인할 속성의 이름이 서로 다를 때 이름을 맞추려고 (예: Dnumber → Dnum). 2) 합집합 등 집합 연산 결과나 중간 결과의 속성 이름을 원하는 대로 바꿀 때 (예: π Super_ssn을 Ssn으로). 같은 릴레이션을 두 번 쓸 때 구별하려고도 쓴다.", "keys": ["자연 조인 속성 이름 맞추기", "집합 연산·결과 이름 맞추기 / 자기 조인"], "lesson": "L6-2", "unit": "U6", "prompt_en": "Give two cases in which RENAME is needed in relational algebra.", "answer_en": "1) In a natural join, to make the names of the join attributes match when they differ (e.g., Dnumber → Dnum). 2) To give the desired attribute names to the result of a set operation such as union, or to an intermediate result (e.g., renaming π Super_ssn to Ssn). It is also used to distinguish the same relation when it is used twice.", "keys_en": ["Matching attribute names for a natural join", "Matching names for set operations / results; self-join"]}, {"id": "6-seq-1", "concept": "ra-sequence", "type": "mc", "prompt": "π Fname, Lname, Salary (σ Dno=5 (EMPLOYEE)) 를 중간 릴레이션으로 나눈 것은?", "choices": ["DEP5 ← π Fname (EMPLOYEE); RESULT ← σ Dno=5 (DEP5)", "DEP5_EMPS ← σ Dno=5 (EMPLOYEE); RESULT ← π Fname, Lname, Salary (DEP5_EMPS)", "RESULT ← EMPLOYEE × DEPARTMENT", "나눌 수 없다"], "answer": 1, "lesson": "L6-2", "unit": "U6", "prompt_en": "Which splits π Fname, Lname, Salary (σ Dno=5 (EMPLOYEE)) into intermediate relations?", "choices_en": ["DEP5 ← π Fname (EMPLOYEE); RESULT ← σ Dno=5 (DEP5)", "DEP5_EMPS ← σ Dno=5 (EMPLOYEE); RESULT ← π Fname, Lname, Salary (DEP5_EMPS)", "RESULT ← EMPLOYEE × DEPARTMENT", "It cannot be split"]}, {"id": "6-seq-2", "concept": "ra-sequence", "type": "ox", "prompt": "복잡한 질의는 하나의 식으로 쓰는 것보다 중간 결과 릴레이션에 이름을 붙여 단계별로 쓰는 것이 보통 더 쉽다.", "answer": true, "lesson": "L6-2", "unit": "U6", "prompt_en": "For complex queries, it is usually easier to write them step by step with named intermediate result relations than as a single expression."}, {"id": "6-seq-3", "concept": "ra-sequence", "type": "calc", "prompt": "급여가 30000 이상인 사원의 성과 급여를 (1) 하나의 중첩 식으로, (2) 중간 릴레이션으로 나눠서 쓰시오.", "answer": "(1) π Lname, Salary (σ Salary>=30000 (EMPLOYEE))\n(2) RICH ← σ Salary>=30000 (EMPLOYEE)\n    RESULT ← π Lname, Salary (RICH)\n\n-- COMPANY 상태에서의 결과 (5행)\nLname | Salary\nSmith | 30000\nWong | 40000\nWallace | 43000\nNarayan | 38000\nBorg | 55000", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["중첩 식", "중간 릴레이션 두 줄"], "lesson": "L6-2", "unit": "U6", "prompt_en": "Write the last name and salary of employees whose salary is 30000 or more (1) as a single nested expression and (2) split into intermediate relations.", "answer_en": "(1) π Lname, Salary (σ Salary>=30000 (EMPLOYEE))\n(2) RICH ← σ Salary>=30000 (EMPLOYEE)\n    RESULT ← π Lname, Salary (RICH)\n\n-- Result on the COMPANY state (5 rows)\nLname | Salary\nSmith | 30000\nWong | 40000\nWallace | 43000\nNarayan | 38000\nBorg | 55000", "keys_en": ["Nested expression", "Two lines with an intermediate relation"]}, {"id": "6-seq-4", "concept": "ra-sequence", "type": "short", "prompt": "관계 대수식을 여러 연산으로 쓸 때의 두 방법을 쓰시오.", "answer": "방법 1: 중간 릴레이션에 이름을 붙여 연산 순서를 명시한다 (DEP5_EMPS ← σ…; RESULT ← π…). 방법 2: 연산을 중첩해서 하나의 관계 대수식으로 쓴다 (π…(σ…(EMPLOYEE))).", "keys": ["중간 릴레이션 이름 붙이기", "중첩해서 한 식으로"], "lesson": "L6-2", "unit": "U6", "prompt_en": "Give the two ways of writing a relational algebra expression with several operations.", "answer_en": "Method 1: name the intermediate relations to make the sequence of operations explicit (DEP5_EMPS ← σ…; RESULT ← π…). Method 2: nest the operations into a single relational algebra expression (π…(σ…(EMPLOYEE))).", "keys_en": ["Naming intermediate relations", "Nesting into a single expression"]}, {"id": "6-set-1", "concept": "ra-setops", "type": "mc", "prompt": "두 릴레이션이 '타입 호환'이려면?", "choices": ["튜플 수가 같다", "속성 이름이 같다", "속성 수가 같고 대응 속성의 도메인이 같다", "같은 PK를 가진다"], "answer": 2, "lesson": "L6-3", "unit": "U6", "prompt_en": "When are t
