개", "PK에 Semester 포함 (재수강)", "Grade 포함"], "slot": 11, "pts": 10, "lesson": "L3-5", "unit": "U3"}, {"id": "3-mmn-5", "concept": "map-mn", "type": "ox", "prompt": "M:N 관계 릴레이션(예: WORKS_ON)을 lookup table이라고도 부른다.", "answer": true, "lesson": "L3-5", "unit": "U3"}, {"id": "3-mmn-6", "concept": "map-mn", "type": "blank", "prompt": "M:N 관계 매핑: 별도 릴레이션 S를 만들고, 참여 릴레이션의 (a) 들을 FK로 넣으며, 그 FK들의 (b) 을 S의 PK로 한다.", "answer": "(a) PK / (b) 조합", "accept": [["PK", "기본 키", "기본키", "primary key"], ["조합", "combination", "결합"]], "lesson": "L3-5", "unit": "U3"}, {"id": "3-mna-1", "concept": "map-nary", "type": "mc", "prompt": "3진 관계 SUPPLY(SUPPLIER, PROJECT, PART, 속성 Quantity)를 매핑한 결과는?", "choices": ["SUPPLIER에 FK 두 개", "SUPPLY(Sname, Proj_name, Part_no, Quantity), PK = 세 FK의 조합", "PART에 FK", "매핑 불가"], "answer": 1, "lesson": "L3-5", "unit": "U3"}, {"id": "3-mna-2", "concept": "map-nary", "type": "ox", "prompt": "n진 관계는 M:N과 같은 교차 참조 방식으로 매핑한다.", "answer": true, "lesson": "L3-5", "unit": "U3"}, {"id": "3-mna-3", "concept": "map-nary", "type": "short", "prompt": "n진 관계 타입의 매핑 절차를 쓰시오.", "answer": "관계를 나타내는 별도 릴레이션 S를 만들고, n개 참여 개체 릴레이션의 PK를 FK로 넣으며, 보통 FK 전부의 조합을 PK로 하고, 관계의 단순 속성도 S에 넣는다.", "keys": ["별도 릴레이션", "n개 PK를 FK로", "FK 조합을 PK로", "관계 속성 포함"], "lesson": "L3-5", "unit": "U3"}, {"id": "3-mna-4", "concept": "map-nary", "type": "calc", "prompt": "DOCTOR(Did), PATIENT(Pid), DRUG(Drug_code)가 3진 관계 PRESCRIBES(속성 Date, Dosage)로 연결된다. 매핑하시오.", "answer": "PRESCRIBES(Did, Pid, Drug_code, Date, Dosage)\nFK Did → DOCTOR, Pid → PATIENT, Drug_code → DRUG\nPK (Did, Pid, Drug_code) (같은 처방을 여러 날 하면 Date까지 포함)", "keys": ["별도 릴레이션 PRESCRIBES", "FK 3개", "PK = 세 FK 조합", "Date, Dosage 포함"], "lesson": "L3-5", "unit": "U3"}, {"id": "3-ms-1", "concept": "map-summary", "type": "mc", "prompt": "ER→관계 대응에서 '다중값 속성'에 해당하는 것은?", "choices": ["속성", "도메인", "릴레이션과 외래 키", "기본 키"], "answer": 2, "lesson": "L3-5", "unit": "U3"}, {"id": "3-ms-2", "concept": "map-summary", "type": "mc", "prompt": "ER→관계 대응에서 '값 집합(value set)'에 해당하는 것은?", "choices": ["릴레이션", "도메인", "외래 키", "후보 키"], "answer": 1, "lesson": "L3-5", "unit": "U3"}, {"id": "3-ms-3", "concept": "map-summary", "type": "blank", "prompt": "M:N 관계 타입은 관계 릴레이션과 FK (a) 개로, n진 관계 타입은 관계 릴레이션과 FK (b) 개로 대응된다.", "answer": "(a) 2 / (b) n", "accept": [["2", "두", "둘", "two"], ["n", "N", "n개"]], "lesson": "L3-5", "unit": "U3"}, {"id": "3-ms-4", "concept": "map-summary", "type": "calc", "prompt": "다음 ER 스키마를 관계 스키마로 매핑하시오 (PK, FK 표시).\n• COLLEGE(CName 키, COffice, CPhone)\n• INSTRUCTOR(Id 키, IName, Rank)\n• DEAN: COLLEGE (1,1) — INSTRUCTOR (0,1), 1:1\n• DEPT(DCode 키, DName)\n• ADMINS: COLLEGE (0,N) — DEPT (1,1), 1:N\n• EMPLOYS: DEPT (0,N) — INSTRUCTOR (1,1), 1:N\n• STUDENT(Sid 키, SName, {Phone})\n• TAKES: STUDENT M:N SECTION(SecId 키), 속성 Grade", "answer": "COLLEGE(CName, COffice, CPhone, DeanId)  FK DeanId → INSTRUCTOR.Id (1:1, 전체 참여 쪽 COLLEGE에)\nINSTRUCTOR(Id, IName, Rank, DCode)  FK DCode → DEPT (EMPLOYS, N쪽)\nDEPT(DCode, DName, CName)  FK CName → COLLEGE (ADMINS, N쪽)\nSTUDENT(Sid, SName)\nSTUDENT_PHONE(Sid, Phone)  PK (Sid, Phone), FK Sid → STUDENT\nSECTION(SecId, …)\nTAKES(Sid, SecId, Grade)  PK (Sid, SecId), FK Sid → STUDENT, SecId → SECTION", "keys": ["DEAN → COLLEGE에 FK", "EMPLOYS → INSTRUCTOR에 DCode", "ADMINS → DEPT에 CName", "Phone → 별도 릴레이션", "TAKES 관계 릴레이션, PK (Sid, SecId), Grade"], "slot": 11, "pts": 10, "lesson": "L3-5", "unit": "U3"}, {"id": "3-ms-5", "concept": "map-summary", "type": "calc", "prompt": "COMPANY ER 다이어그램(교안 2 p.45)을 관계 스키마로 매핑한 결과 6개 릴레이션을 쓰고, 각 관계 타입·다중값 속성·약한 개체가 어디로 갔는지 쓰시오.", "answer": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\n\nMANAGES(1:1) → DEPARTMENT.Mgr_ssn, Mgr_start_date / WORKS_FOR(1:N) → EMPLOYEE.Dno / SUPERVISION(1:N) → EMPLOYEE.Super_ssn / CONTROLS(1:N) → PROJECT.Dnum / WORKS_ON(M:N) → 관계 릴레이션 WORKS_ON / 다중값 Locations → DEPT_LOCATIONS / 약한 개체 DEPENDENT → PK (Essn, Dependent_name)", "keys": ["6개 릴레이션", "1:1, 1:N은 FK로 (Mgr_ssn, Dno, Super_ssn, Dnum)", "WORKS_ON 관계 릴레이션", "DEPT_LOCATIONS", "DEPENDENT PK (Essn, Dependent_name)"], "slot": 11, "pts": 10, "lesson": "L3-5", "unit": "U3"}, {"id": "3-ms-6", "concept": "map-summary", "type": "ox", "prompt": "ER 모델의 키 속성은 관계 모델에서 기본 키(또는 보조 키)가 된다.", "answer": true, "lesson": "L3-5", "unit": "U3"}, {"id": "4-int-1", "concept": "sql-intro", "type": "mc", "prompt": "SQL에 대한 설명으로 옳은 것은?", "choices": ["절차적 언어로, 데이터를 어떻게 가져올지 기술한다", "선언적 언어로, 원래 이름은 SEQUEL이다", "IBM이 아니라 Oracle이 처음 만들었다", "DDL만 제공한다"], "answer": 1, "lesson": "L4-1", "unit": "U4"}, {"id": "4-int-2", "concept": "sql-intro", "type": "mc", "prompt": "다음 중 DML 명령이 '아닌' 것은?", "choices": ["SELECT", "INSERT", "ALTER TABLE", "UPDATE"], "answer": 2, "lesson": "L4-1", "unit": "U4"}, {"id": "4-int-3", "concept": "sql-intro", "type": "short", "prompt": "NL2SQL이 무엇인지 쓰고, 어려운 점을 두 가지 이상 쓰시오.", "answer": "자연어 질의를 SQL 질의로 바꿔 DB에서 원하는 데이터를 가져오는 기술. 어려운 점: 자연어의 모호성, 스키마 이해와 연결(schema linking), 처음 보는 DB로의 일반화, 복잡한 질의 생성. (그래서 LLM 기반 방법도 완벽하지 않고 SQL을 이해하는 게 중요)", "keys": ["자연어 → SQL 변환", "모호성", "스키마 이해·연결", "일반화 / 복잡한 질의"], "lesson": "L4-1", "unit": "U4"}, {"id": "4-int-4", "concept": "sql-intro", "type": "blank", "prompt": "SQL에서 (a) 은 DB와 테이블에 대한 명령(CREATE, ALTER, DROP), (b) 은 투플에 대한 명령(SELECT, INSERT, DELETE, UPDATE)을 제공한다.", "answer": "(a) DDL / (b) DML", "accept": [["DDL", "데이터 정의어", "data definition language"], ["DML", "데이터 조작어", "data manipulation language"]], "lesson": "L4-1", "unit": "U4"}, {"id": "4-ct-1", "concept": "create-table", "type": "mc", "prompt": "CREATE SCHEMA COMPANY AUTHORIZATION 'Jsmith'; 에서 'Jsmith'는?", "choices": ["스키마를 소유한 사용자(권한 식별자)", "스키마 이름", "DB 이름", "비밀번호"], "answer": 0, "lesson": "L4-1", "unit": "U4"}, {"id": "4-ct-2", "concept": "create-table", "type": "ox", "prompt": "CREATE TABLE COMPANY.EMPLOYEE 처럼 테이블 이름 앞에 스키마 이름을 붙일 수 있다.", "answer": true, "lesson": "L4-1", "unit": "U4"}, {"id": "4-ct-3", "concept": "create-table", "type": "calc", "prompt": "다음 릴레이션을 CREATE TABLE로 정의하시오. PK와 FK, NOT NULL을 지정할 것.\nPROJECT(Pname VARCHAR(15) 필수·고유, Pnumber INT 기본 키, Plocation VARCHAR(15), Dnum INT 필수, DEPARTMENT(Dnumber) 참조)", "answer": "CREATE TABLE PROJECT\n( Pname      VARCHAR(15)  NOT NULL,\n  Pnumber    INT          NOT NULL,\n  Plocation  VARCHAR(15),\n  Dnum       INT          NOT NULL,\n  PRIMARY KEY (Pnumber),\n  UNIQUE (Pname),\n  FOREIGN KEY (Dnum) REFERENCES DEPARTMENT(Dnumber) );", "keys": ["PRIMARY KEY (Pnumber)", "UNIQUE (Pname)", "FOREIGN KEY (Dnum) REFERENCES DEPARTMENT(Dnumber)", "NOT NULL"], "lesson": "L4-1", "unit": "U4"}, {"id": "4-ct-4", "concept": "create-table", "type": "calc", "prompt": "WORKS_ON(Essn CHAR(9), Pno INT, Hours DECIMAL(3,1))을 CREATE TABLE로 정의하시오. PK는 (Essn, Pno), Essn은 EMPLOYEE(Ssn), Pno는 PROJECT(Pnumber)를 참조한다.", "answer": "CREATE TABLE WORKS_ON\n( Essn   CHAR(9)       NOT NULL,\n  Pno    INT           NOT NULL,\n  Hours  DECIMAL(3,1),\n  PRIMARY KEY (Essn, Pno),\n  FOREIGN KEY (Essn) REFERENCES EMPLOYEE(Ssn),\n  FOREIGN KEY (Pno)  REFERENCES PROJECT(Pnumber) );", "keys": ["복합 PK (Essn, Pno)", "FK 두 개", "PK 속성 NOT NULL (생략해도 암묵적)"], "lesson": "L4-1", "unit": "U4"}, {"id": "4-ac-1", "concept": "attr-constraints", "type": "mc", "prompt": "PK 속성에 대한 설명으로 옳은 것은?", "choices": ["NULL을 허용한다", "NOT NULL이 암묵적으로 적용된다", "DEFAULT가 반드시 필요하다", "UNIQUE를 따로 써야 한다"], "answer": 1, "lesson": "L4-1", "unit": "U4"}, {"id": "4-ac-2", "concept": "attr-constraints", "type": "ox", "prompt": "DEFAULT 값은 INSERT에서 그 속성 값을 명시하지 않았을 때 새 투플에 들어간다.", "answer": true, "lesson": "L4-1", "unit": "U4"}, {"id": "4-ac-3", "concept": "attr-constraints", "type": "blank", "prompt": "새 사원의 기본 부서를 1로 하려면 Dno INT NOT NULL (a) 1 이라고 쓴다. PK 속성에는 (b) 이 암묵적으로 적용된다.", "answer": "(a) DEFAULT / (b) NOT NULL", "accept": [["DEFAULT", "default"], ["NOT NULL", "not null", "notnull"]], "lesson": "L4-1", "unit": "U4"}, {"id": "4-ac-4", "concept": "attr-constraints", "type": "short", "prompt": "NOT NULL과 DEFAULT 제약을 각각 설명하고, 둘의 관계가 INSERT에 어떤 영향을 주는지 쓰시오.", "answer": "NOT NULL: 그 속성 값은 NULL일 수 없음(PK에는 암묵적). DEFAULT <값>: 값을 명시하지 않으면 기본값이 들어감. 속성 이름을 명시하는 INSERT에서는 NOT NULL이면서 DEFAULT가 없는 속성은 반드시 값을 줘야 한다 (DEFAULT가 있으면 생략 가능).", "keys": ["NOT NULL 정의", "DEFAULT 정의", "NOT NULL + DEFAULT 없음 → INSERT에 반드시 포함"], "lesson": "L4-1", "unit": "U4"}, {"id": "4-kc-1", "concept": "key-clauses", "type": "mc", "prompt": "CREATE TABLE에서 후보 키(대체 키)를 지정하는 절은?", "choices": ["PRIMARY KEY", "FOREIGN KEY", "UNIQUE", "CHECK"], "answer": 2, "lesson": "L4-1", "unit": "U4"}, {"id": "4-kc-2", "concept": "key-clauses", "type": "mc", "prompt": "참조되는 PK가 삭제·갱신되어 참조 무결성이 깨질 때 SQL의 기본 동작은?", "choices": ["그 연산을 거부(reject)", "FK를 NULL로", "참조하는 투플도 삭제", "FK를 기본값으로"], "answer": 0, "lesson": "L4-1", "unit": "U4"}, {"id": "4-kc-3", "concept": "key-clauses", "type": "ox", "prompt": "CONSTRAINT DEPTPK PRIMARY KEY (Dnumber) 처럼 제약에 이름을 붙이면 나중에 ALTER TABLE ... DROP CONSTRAINT로 지울 수 있다.", "answer": true, "lesson": "L4-1", "unit": "U4"}, {"id": "4-kc-4", "concept": "key-clauses", "type": "calc", "prompt": "DEPARTMENT를 CREATE TABLE로 정의하시오: Dname VARCHAR(15) 필수·고유, Dnumber INT 기본 키, Mgr_ssn CHAR(9) 필수, EMPLOYEE(Ssn) 참조, Mgr_start_date DATE. 제약마다 이름(DEPTPK, DEPTSK, DEPTMGRFK)을 붙일 것.", "answer": "CREATE TABLE DEPARTMENT\n( Dname           VARCHAR(15)  NOT NULL,\n  Dnumber         INT          NOT NULL,\n  Mgr_ssn         CHAR(9)      NOT NULL,\n  Mgr_start_date  DATE,\n  CONSTRAINT DEPTPK    PRIMARY KEY (Dnumber),\n  CONSTRAINT DEPTSK    UNIQUE (Dname),\n  CONSTRAINT DEPTMGRFK FOREIGN KEY (Mgr_ssn) REFERENCES EMPLOYEE(Ssn) );", "keys": ["CONSTRAINT 이름 PRIMARY KEY", "UNIQUE (Dname)", "FOREIGN KEY ... REFERENCES EMPLOYEE(Ssn)"], "lesson": "L4-1", "unit": "U4"}, {"id": "4-ra-1", "concept": "ref-actions", "type": "mc", "prompt": "EMPSUPERFK FOREIGN KEY (Super_ssn) REFERENCES EMPLOYEE(Ssn) ON DELETE SET NULL 일 때, 상사 Wong이 삭제되면?", "choices": ["Wong의 부하들도 삭제", "Wong의 부하들의 Super_ssn이 NULL로", "삭제가 거부됨", "Super_ssn이 기본값으로"], "answer": 1, "lesson": "L4-2", "unit": "U4"}, {"id": "4-ra-2", "concept": "ref-actions", "type": "mc", "prompt": "ON UPDATE CASCADE의 동작은?", "choices": ["참조하는 투플을 삭제", "참조하는 FK를 NULL로", "참조하는 FK를 새 PK 값으로 바꿈", "갱신을 거부"], "answer": 2, "lesson": "L4-2", "unit": "U4"}, {"id": "4-ra-3", "concept": "ref-actions", "type": "ox", "prompt": "ON DELETE CASCADE는 참조되던 투플이 삭제되면 그것을 참조하던 투플도 삭제한다.", "answer": true, "lesson": "L4-2", "unit": "U4"}, {"id": "4-ra-4", "concept": "ref-actions", "type": "calc", "prompt": "EMPSUPERFK를 ON DELETE CASCADE로 바꾼 뒤(다른 FK는 고려하지 않음) COMPANY 상태에서\nDELETE FROM EMPLOYEE WHERE Lname = 'Borg';\n를 실행하면 EMPLOYEE에서 어떤 투플들이 어떤 순서로 삭제되는지 쓰시오.", "answer": "1) Borg(888665555) 삭제\n2) Super_ssn = 888665555인 Wong(333445555), Wallace(987654321) 연쇄 삭제\n3) Super_ssn = 333445555인 Smith, Narayan, English와 Super_ssn = 987654321인 Zelaya, Jabbar 연쇄 삭제\n→ EMPLOYEE 8개 투플 전부 삭제 (CASCADE는 재귀적으로 전파)", "explain": "실제 COMPANY에서는 WORKS_ON.Essn 등이 기본 동작(거부)이면 이 DELETE 자체가 거부된다.", "keys": ["Borg → Wong, Wallace", "→ Smith, Narayan, English, Zelaya, Jabbar", "결국 8개 전부 (재귀 전파)"], "slot": 9, "pts": 5, "lesson": "L4-2", "unit": "U4"}, {"id": "4-ra-5", "concept": "ref-actions", "type": "short", "prompt": "LIBRARY DB에서 BOOK_LOANS.Card_no → BORROWER.Card_no의 ON DELETE, ON UPDATE 동작을 고르고 이유를 쓰시오.", "answer": "ON DELETE REJECT: 도서관은 보통 회원이 대출한 책을 다 반납(또는 변상)하기 전엔 탈퇴를 허용하지 않으므로, 대출 기록이 있는 회원 삭제를 거부. ON UPDATE CASCADE: 회원 카드 번호가 바뀌면 대출 기록도 따라 바꿔야 누가 빌렸는지 추적할 수 있음.", "keys": ["ON DELETE REJECT + 이유", "ON UPDATE CASCADE + 이유"], "slot": 9, "pts": 5, "lesson": "L4-2", "unit": "U4"}, {"id": "4-ra-6", "concept": "ref-actions", "type": "short", "prompt": "LIBRARY DB에서 BOOK_COPIES.Branch_id → LIBRARY_BRANCH.Branch_id에 ON DELETE CASCADE가 적절한 이유를 쓰시오.", "answer": "LIBRARY_BRANCH 투플 삭제는 실제로 그 지점이 문을 닫는 것을 뜻하므로, 그 지점의 책 사본들을 더 이상 추적할 필요가 없다. 따라서 참조하는 BOOK_COPIES 투플도 함께 삭제하는 CASCADE가 맞다.", "keys": ["지점 삭제 = 폐점", "사본 추적 불필요 → 함께 삭제"], "slot": 9, "pts": 5, "lesson": "L4-2", "unit": "U4"}, {"id": "4-ra-7", "concept": "ref-actions", "type": "blank", "prompt": "참조 트리거 동작에서 트리거는 ON DELETE와 ON (a), 동작은 SET NULL, (b), SET DEFAULT이다.", "answer": "(a) UPDATE / (b) CASCADE", "accept": [["UPDATE", "update"], ["CASCADE", "cascade"]], "lesson": "L4-2", "unit": "U4"}, {"id": "4-ra-8", "concept": "ref-actions", "type": "mc", "prompt": "EMPDEPTFK FOREIGN KEY (Dno) REFERENCES DEPARTMENT(Dnumber) ON DELETE SET DEFAULT 이고 Dno의 DEFAULT가 1일 때, 4번 부서가 삭제되면?", "choices": ["4번 부서 사원들도 삭제", "4번 부서 사원들의 Dno가 NULL", "삭제 거부", "4번 부서 사원들의 Dno가 1로"], "answer": 3, "lesson": "L4-2", "unit": "U4"}, {"id": "4-dr-1", "concept": "drop", "type": "mc", "prompt": "DROP SCHEMA COMPANY RESTRICT; 의 동작은?", "choices": ["스키마의 모든 요소까지 삭제", "스키마에 요소가 하나도 없을 때만 삭제", "테이블만 삭제", "항상 거부"], "answer": 1, "lesson": "L4-2", "unit": "U4"}, {"id": "4-dr-2", "concept": "drop", "type": "short", "prompt": "DROP TABLE EMPLOYEE와 DELETE FROM EMPLOYEE의 차이를 쓰시오.", "answer": "DROP TABLE은 모든 투플과 함께 카탈로그의 테이블 정의까지 제거한다(테이블이 없어짐). DELETE FROM은 투플만 지우고 테이블 정의는 남긴다.", "keys": ["DROP TABLE = 투플 + 정의 제거", "DELETE = 투플만, 정의는 남음"], "lesson": "L4-2", "unit": "U4"}, {"id": "4-dr-3", "concept": "drop", "type": "ox", "prompt": "DROP TABLE ... CASCADE는 그 테이블을 참조하는 제약과 요소도 자동으로 삭제한다.", "answer": true, "lesson": "L4-2", "unit": "U4"}, {"id": "4-alt-1", "concept": "alter", "type": "mc", "prompt": "EMPLOYEE에 새 열 Job을 추가하는 명령은?", "choices": ["ALTER TABLE COMPANY.EMPLOYEE ADD COLUMN Job VARCHAR(12);", "UPDATE EMPLOYEE ADD Job VARCHAR(12);", "INSERT INTO EMPLOYEE (Job) VALUES ('');", "CREATE COLUMN Job ON EMPLOYEE;"], "answer": 0, "lesson": "L4-2", "unit": "U4"}, {"id": "4-alt-2", "concept": "alter", "type": "mc", "prompt": "ALTER TABLE COMPANY.EMPLOYEE DROP COLUMN Address RESTRICT; 의 동작은?", "choices": ["Address를 참조하는 제약도 같이 삭제", "항상 삭제", "Address를 참조하는 스키마 요소가 없을 때만 삭제", "Address 값을 NULL로"], "answer": 2, "lesson": "L4-2", "unit": "U4"}, {"id": "4-alt-3", "concept": "alter", "type": "ox", "prompt": "ALTER TABLE ... DROP CONSTRAINT EMPSUPERFK CASCADE; 로 이름 붙인 제약을 지울 수 있다.", "answer": true, "lesson": "L4-2", "unit": "U4"}, {"id": "4-alt-4", "concept": "alter", "type": "short", "prompt": "ALTER TABLE로 할 수 있는 일을 세 가지 쓰시오.", "answer": "속성(열) 추가·삭제, 제약조건 추가·삭제, 열 정의(데이터 타입이나 제약) 변경.", "keys": ["열 추가·삭제", "제약 추가·삭제", "열 정의 변경"], "lesson": "L4-2", "unit": "U4"}, {"id": "4-ins-1", "concept": "dml-insert", "type": "mc", "prompt": "INSERT INTO EMPLOYEE (Fname, Lname, Dno) VALUES ('Robert', 'Hatcher', 5); 가 거부되는 이유는?", "choices": ["5번 부서가 없어서", "Ssn(PK, NOT NULL) 값이 없어서", "Fname이 중복이라서", "속성 순서가 틀려서"], "answer": 1, "lesson": "L4-3", "unit": "U4"}, {"id": "4-ins-2", "concept": "dml-insert", "type": "mc", "prompt": "INSERT INTO EMPLOYEE (Fname, Lname, Ssn, Dno) VALUES ('Robert', 'Hatcher', '980760540', 2); 가 거부되는 이유는? (COMPANY 상태)", "choices": ["키 제약", "NOT NULL", "참조 무결성 (2번 부서 없음)", "위반 없음"], "answer": 2, "lesson": "L4-3", "unit": "U4"}, {"id": "4-ins-3", "concept": "dml-insert", "type": "ox", "prompt": "속성 이름을 명시하지 않는 INSERT에서는 값을 테이블 정의의 속성 순서대로 모두 나열해야 한다.", "answer": true, "lesson": "L4-3", "unit": "U4"}, {"id": "4-ins-4", "concept": "dml-insert", "type": "calc", "prompt": "COMPANY에 새 프로젝트 'ProductW'(번호 40, 위치 'Houston', 5번 부서 통제)를 추가하고, Smith(123456789)가 이 프로젝트에 주 5시간 일한다는 사실을 추가하는 SQL을 쓰시오.", "answer": "INSERT INTO PROJECT VALUES ('ProductW', 40, 'Houston', 5);\nINSERT INTO WORKS_ON (Essn, Pno, Hours) VALUES ('123456789', 40, 5.0);\n(WORKS_ON은 PROJECT 40이 먼저 있어야 참조 무결성을 만족하므로 순서가 중요)", "keys": ["PROJECT INSERT", "WORKS_ON INSERT", "PROJECT를 먼저 (참조 무결성)"], "lesson": "L4-3", "unit": "U4"}, {"id": "4-ins-5", "concept": "dml-insert", "type": "blank", "prompt": "속성 이름을 명시하는 INSERT에서는 (a) 이면서 (b) 이 없는 속성의 값은 반드시 포함해야 한다.", "answer": "(a) NOT NULL / (b) DEFAULT", "accept": [["NOT NULL", "not null", "널 불가"], ["DEFAULT", "default", "기본값"]], "lesson": "L4-3", "unit": "U4"}, {"id": "4-del-1", "concept": "dml-delete-update", "type": "mc", "prompt": "COMPANY 상태에서 DELETE FROM EMPLOYEE WHERE Dno = 5; 로 삭제되는 투플 수는? (참조 제약은 무시)", "choices": ["0", "1", "4", "8"], "answer": 2, "lesson": "L4-3", "unit": "U4"}, {"id": "4-del-2", "concept": "dml-delete-update", "type": "ox", "prompt": "DELETE FROM EMPLOYEE; 는 EMPLOYEE 테이블 정의까지 없앤다.", "answer": false, "explain": "투플만 전부 지워지고 정의는 남는다. 정의까지 지우는 건 DROP TABLE.", "lesson": "L4-3", "unit": "U4"}, {"id": "4-del-3", "concept": "dml-delete-update", "type": "mc", "prompt": "DELETE 명령에 대한 설명으로 옳은 것은?", "choices": ["한 명령으로 여러 테이블에서 명시적으로 삭제할 수 있다", "한 번에 한 테이블에서만 명시적으로 삭제하지만, CASCADE로 다른 테이블에 전파될 수 있다", "WHERE가 없으면 아무것도 지우지 않는다", "PK 값으로만 지울 수 있다"], "answer": 1, "lesson": "L4-3", "unit": "U4"}, {"id": "4-del-4", "concept": "dml-delete-update", "type": "calc", "prompt": "5번 부서 사원 전원의 급여를 10% 올리는 SQL을 쓰고, COMPANY 상태에서 바뀌는 사원과 새 급여를 쓰시오.", "answer": "UPDATE EMPLOYEE\nSET    Salary = Salary * 1.1\nWHERE  Dno = 5;\n\nSmith 30000 → 33000, Wong 40000 → 44000, Narayan 38000 → 41800, English 25000 → 27500 (4개 투플)", "keys": ["UPDATE ... SET Salary = Salary * 1.1", "WHERE Dno = 5", "4명과 새 급여"], "lesson": "L4-3", "unit": "U4"}, {"id": "4-del-5", "concept": "dml-delete-update", "type": "calc", "prompt": "프로젝트 10번의 위치를 'Bellaire'로, 통제 부서를 5번으로 바꾸는 SQL을 쓰시오.", "answer": "UPDATE PROJECT\nSET    Plocation = 'Bellaire', Dnum = 5\nWHERE  Pnumber = 10;", "keys": ["UPDATE PROJECT", "SET 두 속성 (쉼표로)", "WHERE Pnumber = 10"], "lesson": "L4-3", "unit": "U4"}, {"id": "4-del-6", "concept": "dml-delete-update", "type": "short", "prompt": "UPDATE 문에서 WHERE와 SET의 역할을 쓰고, UPDATE가 다른 테이블에 영향을 줄 수 있는 경우를 쓰시오.", "answer": "WHERE: 한 릴레이션에서 수정할 투플을 고름. SET: 수정할 속성과 새 값 지정. PK 값을 바꿀 때 FK에 ON UPDATE CASCADE가 지정돼 있으면 참조하는 다른 테이블의 투플도 바뀐다.", "keys": ["WHERE = 투플 선택", "SET = 속성과 새 값", "ON UPDATE CASCADE로 전파"], "lesson": "L4-3", "unit": "U4"}, {"id": "4-sfw-1", "concept": "sfw", "type": "mc", "prompt": "SELECT Fname, Lname, Address FROM EMPLOYEE, DEPARTMENT WHERE Dname = 'Research' AND Dnumber = Dno; 에서 Dnumber = Dno는?", "choices": ["선택 조건", "조인 조건", "투영 속성", "정렬 조건"], "answer": 1, "lesson": "L4-4", "unit": "U4"}, {"id": "4-sfw-2", "concept": "sfw", "type": "blank", "prompt": "SELECT 절의 속성은 (a) 속성이고, WHERE 절에는 선택 조건과 (b) 조건이 들어간다.", "answer": "(a) 투영 / (b) 조인", "accept": [["투영", "projection", "프로젝션"], ["조인", "join"]], "lesson": "L4-4", "unit": "U4"}, {"id": "4-sfw-3", "concept": "sfw", "type": "calc", "prompt": "'John B. Smith'의 생일과 주소를 검색하시오.", "answer": "SELECT Bdate, Address\nFROM   EMPLOYEE\nWHERE  Fname = 'John' AND Minit = 'B' AND Lname = 'Smith';\n\n-- 교재 COMPANY 상태에서 실행 결과 (1행)\nBdate | Address\n1965-01-09 | 731 Fondren, Houston, TX", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["SELECT Bdate, Address", "세 이름 조건 AND"], "lesson": "L4-4", "unit": "U4"}, {"id": "4-sfw-4", "concept": "sfw", "type": "calc", "prompt": "'Research' 부서에서 일하는 모든 사원의 이름(Fname, Lname)과 주소를 검색하시오.", "answer": "SELECT Fname, Lname, Address\nFROM   EMPLOYEE, DEPARTMENT\nWHERE  Dname = 'Research' AND Dnumber = Dno;\n\n-- 교재 COMPANY 상태에서 실행 결과 (4행)\nFname | Lname | Address\nJohn | Smith | 731 Fondren, Houston, TX\nFranklin | Wong | 638 Voss, Houston, TX\nRamesh | Narayan | 975 Fire Oak, Humble, TX\nJoyce | English | 5631 Rice, Houston, TX", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["EMPLOYEE, DEPARTMENT", "선택 조건 Dname = 'Research'", "조인 조건 Dnumber = Dno"], "lesson": "L4-4", "unit": "U4"}, {"id": "4-sfw-5", "concept": "sfw", "type": "calc", "prompt": "5번 부서에서 일하고 'ProductX' 프로젝트에서 주 10시간 넘게 일하는 사원의 이름을 검색하시오. (교안 연습 2)", "answer": "SELECT E.Fname, E.Minit, E.Lname\nFROM   EMPLOYEE AS E, PROJECT AS P, WORKS_ON AS W\nWHERE  E.Dno = 5 AND P.Pname = 'ProductX' AND W.Hours > 10\n  AND  E.Ssn = W.Essn AND W.Pno = P.Pnumber;\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nFname | Minit | Lname\nJohn | B | Smith\nJoyce | A | English\n\n교안 풀이의 마지막 조인 조건은 E.Dno = P.Dnum으로 적혀 있지만, 사원이 그 프로젝트에서 일하는지를 잇는 조건은 W.Pno = P.Pnumber가 맞다.", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["세 테이블", "선택 조건 3개 (Dno=5, Pname, Hours>10)", "조인 조건 2개 (Ssn=Essn, Pno=Pnumber)"], "slot": 12, "pts": 10, "lesson": "L4-4", "unit": "U4"}, {"id": "4-sfw-6", "concept": "sfw", "type": "calc", "prompt": "'Stafford'에 있는 모든 프로젝트에 대해 프로젝트 번호, 통제 부서 번호, 부서 관리자의 성, 주소, 생일을 검색하시오.", "answer": "SELECT P.Pnumber, P.Dnum, E.Lname, E.Address, E.Bdate\nFROM   PROJECT AS P, DEPARTMENT AS D, EMPLOYEE AS E\nWHERE  P.Dnum = D.Dnumber AND D.Mgr_ssn = E.Ssn\n  AND  P.Plocation = 'Stafford';\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nPnumber | Dnum | Lname | Address | Bdate\n10 | 4 | Wallace | 291 Berry, Bellaire, TX | 1941-06-20\n30 | 4 | Wallace | 291 Berry, Bellaire, TX | 1941-06-20", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["조인 P.Dnum = D.Dnumber", "조인 D.Mgr_ssn = E.Ssn", "선택 Plocation = 'Stafford'"], "slot": 12, "pts": 10, "lesson": "L4-4", "unit": "U4"}, {"id": "4-sfw-7", "concept": "sfw", "type": "calc", "prompt": "Houston에 사는 사원 중 급여가 30000 이상인 사원의 이름과 급여를 검색하시오. (Address에 'Houston'이 들어 있으면 Houston에 사는 것으로 본다)", "answer": "SELECT Fname, Lname, Salary\nFROM   EMPLOYEE\nWHERE  Address LIKE '%Houston%' AND Salary >= 30000;\n\n-- 교재 COMPANY 상태에서 실행 결과 (3행)\nFname | Lname | Salary\nJohn | Smith | 30000\nFranklin | Wong | 40000\nJames | Borg | 55000", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["LIKE '%Houston%'", "Salary >= 30000"], "lesson": "L4-4", "unit": "U4"}, {"id": "4-sfw-8", "concept": "sfw", "type": "calc", "prompt": "'Administration' 부서가 통제하는 프로젝트의 이름과 위치를 검색하시오.", "answer": "SELECT P.Pname, P.Plocation\nFROM   PROJECT AS P, DEPARTMENT AS D\nWHERE  P.Dnum = D.Dnumber AND D.Dname = 'Administration';\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nPname | Plocation\nComputerization | Stafford\nNewbenefits | Stafford", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["조인 Dnum = Dnumber", "선택 Dname = 'Administration'"], "lesson": "L4-4", "unit": "U4"}, {"id": "4-qa-1", "concept": "qualify-alias", "type": "mc", "prompt": "같은 릴레이션을 한 질의에서 두 역할(사원, 상사)로 참조하려면?", "choices": ["DISTINCT를 쓴다", "테이블을 두 번 만든다", "별칭(투플 변수)을 두 개 쓴다", "UNION을 쓴다"], "answer": 2, "lesson": "L4-4", "unit": "U4"}, {"id": "4-qa-2", "concept": "qualify-alias", "type": "ox", "prompt": "SELECT E.Fname, E.Lname, E.Fname, E.Lname FROM EMPLOYEE AS E WHERE E.Super_ssn = E.Ssn; 은 사원과 그 상사의 이름을 검색한다.", "answer": false, "explain": "별칭이 하나라 '자기 자신이 자기 상사'인 사원을 찾는 질의가 된다(0행). 상사용 별칭 S가 따로 필요.", "lesson": "L4-4", "unit": "U4"}, {"id": "4-qa-3", "concept": "qualify-alias", "type": "calc", "prompt": "각 사원의 이름(Fname, Lname)과 그 사원의 직속 상사의 이름(Fname, Lname)을 검색하시오.", "answer": "SELECT E.Fname, E.Lname, S.Fname, S.Lname\nFROM   EMPLOYEE AS E, EMPLOYEE AS S\nWHERE  E.Super_ssn = S.Ssn;\n\n-- 교재 COMPANY 상태에서 실행 결과 (7행)\nFname | Lname | Fname | Lname\nJohn | Smith | Franklin | Wong\nFranklin | Wong | James | Borg\nAlicia | Zelaya | Jennifer | Wallace\nJennifer | Wallace | James | Borg\nRamesh | Narayan | Franklin | Wong\nJoyce | English | Franklin | Wong\nAhmad | Jabbar | Jennifer | Wallace\n\n상사가 없는(Super_ssn NULL) Borg는 결과에 없다.", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["EMPLOYEE 별칭 두 개 (E, S)", "E.Super_ssn = S.Ssn", "E.이름, S.이름"], "slot": 12, "pts": 10, "lesson": "L4-4", "unit": "U4"}, {"id": "4-qa-4", "concept": "qualify-alias", "type": "short", "prompt": "SQL에서 속성 이름에 릴레이션 이름을 붙여야(qualify) 하는 두 가지 경우를 쓰시오.", "answer": "1) 서로 다른 릴레이션에 같은 이름의 속성이 있을 때 (예: EMPLOYEE.Name과 DEPARTMENT.Name). 2) 같은 릴레이션을 한 질의에서 두 번 이상 참조할 때 → 별칭으로 구별 (EMPLOYEE AS E, EMPLOYEE AS S).", "keys": ["다른 릴레이션의 같은 이름 속성", "같은 릴레이션을 두 번 참조 (별칭)"], "lesson": "L4-4", "unit": "U4"}, {"id": "4-qa-5", "concept": "qualify-alias", "type": "calc", "prompt": "직속 상사와 다른 부서에서 일하는 사원의 성과 부서 번호, 그 상사의 성과 부서 번호를 검색하시오.", "answer": "SELECT E.Lname, E.Dno, S.Lname, S.Dno\nFROM   EMPLOYEE AS E, EMPLOYEE AS S\nWHERE  E.Super_ssn = S.Ssn AND E.Dno <> S.Dno;\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nLname | Dno | Lname | Dno\nWong | 5 | Borg | 1\nWallace | 4 | Borg | 1", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["별칭 E, S", "E.Super_ssn = S.Ssn", "E.Dno <> S.Dno"], "slot": 12, "pts": 10, "lesson": "L4-4", "unit": "U4"}, {"id": "4-mw-1", "concept": "missing-where-star", "type": "mc", "prompt": "SELECT Ssn, Dname FROM EMPLOYEE, DEPARTMENT; 의 결과 행 수는? (COMPANY 상태)", "choices": ["3", "8", "11", "24"], "answer": 3, "lesson": "L4-4", "unit": "U4"}, {"id": "4-mw-2", "concept": "missing-where-star", "type": "ox", "prompt": "FROM에 테이블이 둘 이상인데 조인 조건을 빠뜨리면 카티션 곱이 나와 결과가 틀리고 매우 커진다.", "answer": true, "lesson": "L4-4", "unit": "U4"}, {"id": "4-mw-3", "concept": "missing-where-star", "type": "calc", "prompt": "5번 부서에서 일하는 사원의 모든 속성을 검색하시오.", "answer": "SELECT *\nFROM   EMPLOYEE\nWHERE  Dno = 5;\n\n-- 교재 COMPANY 상태에서 실행 결과 (4행)\nFname | Minit | Lname | Ssn | Bdate | Address | Sex | Salary | Super_ssn | Dno\nJohn | B | Smith | 123456789 | 1965-01-09 | 731 Fondren, Houston, TX | M | 30000 | 333445555 | 5\nFranklin | T | Wong | 333445555 | 1955-12-08 | 638 Voss, Houston, TX | M | 40000 | 888665555 | 5\nRamesh | K | Narayan | 666884444 | 1962-09-15 | 975 Fire Oak, Humble, TX | M | 38000 | 333445555 | 5\nJoyce | A | English | 453453453 | 1972-07-31 | 5631 Rice, Houston, TX | F | 25000 | 333445555 | 5", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["SELECT *", "WHERE Dno = 5"], "lesson": "L4-4", "unit": "U4"}, {"id": "4-mw-4", "concept": "missing-where-star", "type": "short", "prompt": "SELECT 질의에서 WHERE 절을 생략하면 어떻게 되는지, FROM에 테이블이 하나일 때와 둘일 때로 나눠 쓰시오.", "answer": "투플 선택 조건이 없으므로 FROM에 있는 릴레이션의 투플을 모두 검색한다. 테이블이 하나면 그 테이블의 모든 투플, 둘 이상이면 가능한 모든 투플 조합(카티션 곱, 예: 8 × 3 = 24행)이 나온다.", "keys": ["조건 없음 → 모든 투플", "둘 이상이면 카티션 곱"], "lesson": "L4-4", "unit": "U4"}, {"id": "4-ms-1", "concept": "multiset-distinct", "type": "mc", "prompt": "SQL이 질의 결과에서 중복 투플을 자동으로 제거하지 않는 이유가 '아닌' 것은?", "choices": ["중복 제거는 비싼 연산이라서", "사용자가 중복을 보고 싶을 때가 있어서", "집계 함수에 중복이 필요해서", "SQL 테이블은 집합이라 중복이 원래 없어서"], "answer": 3, "lesson": "L4-5", "unit": "U4"}, {"id": "4-ms-2", "concept": "multiset-distinct", "type": "mc", "prompt": "COMPANY 상태에서 SELECT DISTINCT Salary FROM EMPLOYEE; 의 결과 행 수는?", "choices": ["5", "6", "7", "8"], "answer": 1, "lesson": "L4-5", "unit": "U4"}, {"id": "4-ms-3", "concept": "multiset-distinct", "type": "ox", "prompt": "SQL은 테이블을 집합이 아니라 다중집합으로 취급한다.", "answer": true, "lesson": "L4-5", "unit": "U4"}, {"id": "4-ms-4", "concept": "multiset-distinct", "type": "short", "prompt": "SQL이 테이블을 다중집합으로 다루는 이유를 세 가지 쓰시오.", "answer": "1) 중복 제거는 비싼 연산이다 (투플을 정렬한 뒤 중복을 지워야 함). 2) 사용자가 결과에서 중복 투플을 보고 싶을 때가 있다. 3) 집계 함수를 적용할 때 중복이 필요하다 (예: 급여 합·평균).", "keys": ["중복 제거 비용", "사용자가 중복을 원할 수 있음", "집계 함수"], "lesson": "L4-5", "unit": "U4"}, {"id": "4-ms-5", "concept": "multiset-distinct", "type": "calc", "prompt": "사원들이 일하는 프로젝트 번호를 중복 없이 검색하시오.", "answer": "SELECT DISTINCT Pno\nFROM   WORKS_ON;\n\n-- 교재 COMPANY 상태에서 실행 결과 (6행)\nPno\n1\n2\n3\n10\n20\n30", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["DISTINCT", "WORKS_ON"], "lesson": "L4-5", "unit": "U4"}, {"id": "4-ms-6", "concept": "multiset-distinct", "type": "blank", "prompt": "SELECT (a) Salary 는 중복을 유지하고(기본), SELECT (b) Salary 는 중복을 제거한다.", "answer": "(a) ALL / (b) DISTINCT", "accept": [["ALL", "all"], ["DISTINCT", "distinct"]], "lesson": "L4-5", "unit": "U4"}, {"id": "4-so-1", "concept": "set-ops", "type": "mc", "prompt": "UNION, EXCEPT, INTERSECT의 결과에 대한 설명으로 옳은 것은?", "choices": ["중복이 제거된 집합", "항상 중복이 유지된 다중집합", "정렬된 리스트", "타입 호환이 아니어도 된다"], "answer": 0, "lesson": "L4-5", "unit": "U4"}, {"id": "4-so-2", "concept": "set-ops", "type": "calc", "prompt": "R(A) = {a1, a2, a2, a3}, S(A) = {a1, a2, a4, a5}일 때 다음 결과를 쓰시오.\n(1) R UNION ALL S  (2) R EXCEPT ALL S  (3) R INTERSECT ALL S  (4) R UNION S  (5) R EXCEPT S", "answer": "(1) {a1, a1, a2, a2, a2, a3, a4, a5}\n(2) {a2, a3}\n(3) {a1, a2}\n(4) {a1, a2, a3, a4, a5}\n(5) {a3}", "keys": ["(1) 8개 다중집합", "(2) {a2, a3}", "(3) {a1, a2}", "(4) 중복 제거 합집합", "(5) {a3}"], "slot": 16, "pts": 7, "lesson": "L4-5", "unit": "U4"}, {"id": "4-so-3", "concept": "set-ops", "type": "calc", "prompt": "성이 'Smith'인 사원이 일꾼으로 일하거나, 그 프로젝트를 통제하는 부서의 관리자인 프로젝트의 번호를 UNION으로 검색하시오.", "answer": "( SELECT DISTINCT Pnumber\n  FROM   PROJECT, DEPARTMENT, EMPLOYEE\n  WHERE  Dnum = Dnumber AND Mgr_ssn = Ssn AND Lname = 'Smith' )\nUNION\n( SELECT DISTINCT Pnumber\n  FROM   PROJECT, WORKS_ON, EMPLOYEE\n  WHERE  Pnumber = Pno AND Essn = Ssn AND Lname = 'Smith' );\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nPnumber\n1\n2", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["관리자 블록 (PROJECT–DEPARTMENT–EMPLOYEE)", "일꾼 블록 (PROJECT–WORKS_ON–EMPLOYEE)", "UNION"], "lesson": "L4-5", "unit": "U4"}, {"id": "4-so-4", "concept": "set-ops", "type": "calc", "prompt": "프로젝트에서 일하기는 하지만 부양가족은 없는 사원의 Ssn을 EXCEPT로 검색하시오.", "answer": "( SELECT Essn FROM WORKS_ON )\nEXCEPT\n( SELECT Essn FROM DEPENDENT );\n\n-- 교재 COMPANY 상태에서 실행 결과 (5행)\nEssn\n453453453\n666884444\n888665555\n987987987\n999887777", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["WORKS_ON.Essn", "EXCEPT", "DEPENDENT.Essn"], "lesson": "L4-5", "unit": "U4"}, {"id": "4-so-5", "concept": "set-ops", "type": "ox", "prompt": "SELECT Ssn FROM EMPLOYEE UNION SELECT Dname FROM DEPARTMENT; 는 타입 호환이 아니라서 의미상 잘못된 질의이다.", "answer": true, "explain": "대응 속성의 도메인이 다르다 (사원 번호 vs 부서 이름).", "lesson": "L4-5", "unit": "U4"}, {"id": "4-ob-1", "concept": "order-arith", "type": "calc", "prompt": "사원과 그가 일하는 프로젝트 목록을 부서 이름 순, 같은 부서 안에서는 성·이름 순으로 정렬해 검색하시오 (부서 이름, 성, 이름, 프로젝트 이름).", "answer": "SELECT   D.Dname, E.Lname, E.Fname, P.Pname\nFROM     DEPARTMENT AS D, EMPLOYEE AS E, WORKS_ON AS W, PROJECT AS P\nWHERE    D.Dnumber = E.Dno AND E.Ssn = W.Essn AND W.Pno = P.Pnumber\nORDER BY D.Dname, E.Lname, E.Fname;\n\n-- 교재 COMPANY 상태에서 실행 결과 (16행)\nDname | Lname | Fname | Pname\nAdministration | Jabbar | Ahmad | Computerization\nAdministration | Jabbar | Ahmad | Newbenefits\nAdministration | Wallace | Jennifer | Reorganization\nAdministration | Wallace | Jennifer | Newbenefits\nAdministration | Zelaya | Alicia | Computerization\nAdministration | Zelaya | Alicia | Newbenefits\nHeadquarters | Borg | James | Reorganization\nResearch | English | Joyce | ProductX\nResearch | English | Joyce | ProductY\nResearch | Narayan | Ramesh | ProductZ\nResearch | Smith | John | ProductX\nResearch | Smith | John | ProductY\nResearch | Wong | Franklin | ProductY\nResearch | Wong | Franklin | ProductZ\nResearch | Wong | Franklin | Computerization\nResearch | Wong | Franklin | Reorganization", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["네 테이블 조인 조건 3개", "ORDER BY D.Dname, E.Lname, E.Fname"], "slot": 12, "pts": 10, "lesson": "L4-5", "unit": "U4"}, {"id": "4-ob-2", "concept": "order-arith", "type": "calc", "prompt": "'ProductX'에서 일하는 사원 모두에게 10% 인상을 해주면 급여가 얼마가 되는지 이름과 함께 보이시오 (릴레이션은 바꾸지 말 것).", "answer": "SELECT E.Fname, E.Lname, 1.1 * E.Salary AS Increased_sal\nFROM   EMPLOYEE AS E, WORKS_ON AS W, PROJECT AS P\nWHERE  E.Ssn = W.Essn AND W.Pno = P.Pnumber AND P.Pname = 'ProductX';\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nFname | Lname | Increased_sal\nJohn | Smith | 33000\nJoyce | English | 27500", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["1.1 * Salary (AS 별칭)", "조인 조건 2개 + Pname 조건", "UPDATE가 아니라 SELECT"], "lesson": "L4-5", "unit": "U4"}, {"id": "4-ob-3", "concept": "order-arith", "type": "calc", "prompt": "5번 부서에서 급여가 30000 이상 40000 이하인 사원을 BETWEEN으로 검색하시오.", "answer": "SELECT *\nFROM   EMPLOYEE\nWHERE  (Salary BETWEEN 30000 AND 40000) AND Dno = 5;\n\n-- 교재 COMPANY 상태에서 실행 결과 (3행)\nFname | Minit | Lname | Ssn | Bdate | Address | Sex | Salary | Super_ssn | Dno\nJohn | B | Smith | 123456789 | 1965-01-09 | 731 Fondren, Houston, TX | M | 30000 | 333445555 | 5\nFranklin | T | Wong | 333445555 | 1955-12-08 | 638 Voss, Houston, TX | M | 40000 | 888665555 | 5\nRamesh | K | Narayan | 666884444 | 1962-09-15 | 975 Fire Oak, Humble, TX | M | 38000 | 333445555 | 5", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["BETWEEN 30000 AND 40000 (양 끝 포함)", "AND Dno = 5"], "lesson": "L4-5", "unit": "U4"}, {"id": "4-ob-4", "concept": "order-arith", "type": "mc", "prompt": "ORDER BY의 기본 정렬 순서는?", "choices": ["오름차순 (ASC)", "내림차순 (DESC)", "삽입 순서", "PK 순서"], "answer": 0, "lesson": "L4-5", "unit": "U4"}, {"id": "4-ob-5", "concept": "order-arith", "type": "ox", "prompt": "SELECT 절에서 1.1 * Salary를 쓰면 EMPLOYEE 릴레이션의 Salary 값도 바뀐다.", "answer": false, "explain": "결과에만 반영되고 릴레이션 상태는 그대로. 바꾸려면 UPDATE.", "lesson": "L4-5", "unit": "U4"}, {"id": "4-ob-6", "concept": "order-arith", "type": "calc", "prompt": "급여가 가장 높은 사원부터 차례로 이름과 급여를 검색하시오. 급여가 같으면 성의 알파벳 순.", "answer": "SELECT   Fname, Lname, Salary\nFROM     EMPLOYEE\nORDER BY Salary DESC, Lname ASC;\n\n-- 교재 COMPANY 상태에서 실행 결과 (8행)\nFname | Lname | Salary\nJames | Borg | 55000\nJennifer | Wallace | 43000\nFranklin | Wong | 40000\nRamesh | Narayan | 38000\nJohn | Smith | 30000\nJoyce | English | 25000\nAhmad | Jabbar | 25000\nAlicia | Zelaya | 25000", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["ORDER BY Salary DESC", "두 번째 기준 Lname ASC"], "lesson": "L4-5", "unit": "U4"}, {"id": "5-in-1", "concept": "nested-in", "type": "mc", "prompt": "중첩 질의(nested query)에 대한 설명으로 옳은 것은?", "choices": ["FROM 절에만 올 수 있다", "다른 질의의 WHERE 절 안에 들어간 완전한 SELECT-FROM-WHERE 블록이다", "결과는 항상 값 하나다", "SQL에서는 지원하지 않는다"], "answer": 1, "lesson": "L5-1", "unit": "U5"}, {"id": "5-in-2", "concept": "nested-in", "type": "mc", "prompt": "v IN V 가 TRUE가 되는 경우는?", "choices": ["v가 V의 원소 중 하나일 때", "v가 V의 모든 원소와 같을 때", "V가 비어 있을 때", "v가 V의 최댓값보다 클 때"], "answer": 0, "lesson": "L5-1", "unit": "U5"}, {"id": "5-in-3", "concept": "nested-in", "type": "ox", "prompt": "= ANY는 IN과 같은 뜻이다.", "answer": true, "lesson": "L5-1", "unit": "U5"}, {"id": "5-in-4", "concept": "nested-in", "type": "calc", "prompt": "'Research' 부서에서 일하는 사원의 이름을 중첩 질의(IN)로 검색하시오.", "answer": "SELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  Dno IN ( SELECT Dnumber\n               FROM   DEPARTMENT\n               WHERE  Dname = 'Research' );\n\n-- 교재 COMPANY 상태에서 실행 결과 (4행)\nFname | Lname\nJohn | Smith\nFranklin | Wong\nRamesh | Narayan\nJoyce | English", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["바깥 EMPLOYEE", "Dno IN (안쪽 질의)", "안쪽: Dname = 'Research'인 Dnumber"], "lesson": "L5-1", "unit": "U5"}, {"id": "5-in-5", "concept": "nested-in", "type": "calc", "prompt": "성이 'Smith'인 사원이 일꾼으로 일하거나 관리자로 있는 부서가 통제하는 프로젝트의 번호를 IN 두 개와 OR로 검색하시오.", "answer": "SELECT DISTINCT Pnumber\nFROM   PROJECT\nWHERE  Pnumber IN ( SELECT Pnumber\n                    FROM   PROJECT, DEPARTMENT, EMPLOYEE\n                    WHERE  Dnum = Dnumber AND Mgr_ssn = Ssn AND Lname = 'Smith' )\n   OR  Pnumber IN ( SELECT Pno\n                    FROM   WORKS_ON, EMPLOYEE\n                    WHERE  Essn = Ssn AND Lname = 'Smith' );\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nPnumber\n1\n2", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["IN (관리자 블록)", "OR", "IN (일꾼 블록)"], "lesson": "L5-1", "unit": "U5"}, {"id": "5-in-6", "concept": "nested-in", "type": "calc", "prompt": "'Houston'에 위치한 프로젝트 중 하나라도 일하는 사원의 Ssn과 이름을 중첩 질의로 검색하시오.", "answer": "SELECT Ssn, Fname, Lname\nFROM   EMPLOYEE\nWHERE  Ssn IN ( SELECT W.Essn\n                FROM   WORKS_ON AS W, PROJECT AS P\n                WHERE  W.Pno = P.Pnumber AND P.Plocation = 'Houston' );\n\n-- 교재 COMPANY 상태에서 실행 결과 (4행)\nSsn | Fname | Lname\n333445555 | Franklin | Wong\n666884444 | Ramesh | Narayan\n888665555 | James | Borg\n987654321 | Jennifer | Wallace", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["Ssn IN (안쪽)", "안쪽: WORKS_ON–PROJECT 조인", "Plocation = 'Houston'"], "lesson": "L5-1", "unit": "U5"}, {"id": "5-in-7", "concept": "nested-in", "type": "calc", "prompt": "급여가 가장 높은 사원이 일하는 부서의 모든 사원 이름을 검색하시오. (db-exercises Q1)", "answer": "SELECT Fname, Minit, Lname\nFROM   EMPLOYEE\nWHERE  Dno = ( SELECT Dno\n               FROM   EMPLOYEE\n               WHERE  Salary = ( SELECT MAX(Salary)\n                                 FROM   EMPLOYEE ) );\n\n-- 교재 COMPANY 상태에서 실행 결과 (1행)\nFname | Minit | Lname\nJames | E | Borg", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["가장 안쪽: MAX(Salary)", "그 급여를 받는 사원의 Dno", "그 Dno의 사원들"], "lesson": "L5-1", "unit": "U5"}, {"id": "5-in-8", "concept": "nested-in", "type": "calc", "prompt": "상사의 상사의 Ssn이 '888665555'인 사원의 이름을 검색하시오. (db-exercises Q2)", "answer": "SELECT Fname, Minit, Lname\nFROM   EMPLOYEE\nWHERE  Super_ssn IN ( SELECT Ssn\n                      FROM   EMPLOYEE\n                      WHERE  Super_ssn = '888665555' );\n\n-- 교재 COMPANY 상태에서 실행 결과 (5행)\nFname | Minit | Lname\nJohn | B | Smith\nAlicia | J | Zelaya\nRamesh | K | Narayan\nJoyce | A | English\nAhmad | V | Jabbar\n\n교안 풀이는 = 로 썼지만 안쪽 결과가 두 명(Wong, Wallace)이라 IN이 맞다.", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["안쪽: Super_ssn = '888665555'인 사원들 (Wong, Wallace)", "바깥: 그들을 상사로 둔 사원"], "lesson": "L5-1", "unit": "U5"}, {"id": "5-aa-1", "concept": "all-any", "type": "mc", "prompt": "Salary > ALL (SELECT Salary FROM EMPLOYEE WHERE Dno = 5) 와 같은 뜻인 조건은?", "choices": ["Salary > (SELECT MIN(Salary) FROM EMPLOYEE WHERE Dno = 5)", "Salary > (SELECT AVG(Salary) FROM EMPLOYEE WHERE Dno = 5)", "Salary > (SELECT MAX(Salary) FROM EMPLOYEE WHERE Dno = 5)", "Salary IN (SELECT Salary FROM EMPLOYEE WHERE Dno = 5)"], "answer": 2, "lesson": "L5-1", "unit": "U5"}, {"id": "5-aa-2", "concept": "all-any", "type": "mc", "prompt": "Salary > ANY (SELECT Salary FROM EMPLOYEE WHERE Dno = 5) 가 참이 되는 조건은? (5번 부서 급여 = 30000, 40000, 38000, 25000)", "choices": ["Salary > 25000", "Salary > 40000", "Salary > 33250", "Salary = 30000"], "answer": 0, "lesson": "L5-1", "unit": "U5"}, {"id": "5-aa-3", "concept": "all-any", "type": "calc", "prompt": "5번 부서 모든 사원보다 급여가 많은 사원의 이름을 ALL로 검색하시오.", "answer": "SELECT Lname, Fname\nFROM   EMPLOYEE\nWHERE  Salary > ALL ( SELECT Salary\n                      FROM   EMPLOYEE\n                      WHERE  Dno = 5 );\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nLname | Fname\nWallace | Jennifer\nBorg | James\n\nSQLite에는 ALL이 없어서 검산은 > (SELECT MAX(...))로 돌렸다.", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["Salary > ALL", "안쪽: Dno = 5인 급여"], "lesson": "L5-1", "unit": "U5"}, {"id": "5-aa-4", "concept": "all-any", "type": "ox", "prompt": "실습 환경의 SQLite는 ALL과 ANY를 지원하지 않는다.", "answer": true, "lesson": "L5-1", "unit": "U5"}, {"id": "5-aa-5", "concept": "all-any", "type": "calc", "prompt": "4번 부서의 어떤 사원보다라도 급여가 많은 5번 부서 사원의 이름과 급여를 ANY로 검색하시오.", "answer": "SELECT Fname, Lname, Salary\nFROM   EMPLOYEE\nWHERE  Dno = 5\n  AND  Salary > ANY ( SELECT Salary FROM EMPLOYEE WHERE Dno = 4 );\n\n-- 교재 COMPANY 상태에서 실행 결과 (3행)\nFname | Lname | Salary\nJohn | Smith | 30000\nFranklin | Wong | 40000\nRamesh | Narayan | 38000\n\n> ANY = 최솟값(25000)보다 크면 참. SQLite 검산은 > (SELECT MIN(...)).", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["Dno = 5", "Salary > ANY (4번 부서 급여)"], "lesson": "L5-1", "unit": "U5"}, {"id": "5-aa-6", "concept": "all-any", "type": "blank", "prompt": "v > ALL V 는 v가 V의 (a) 보다 클 때, v > ANY V 는 v가 V의 (b) 보다 클 때 참이다.", "answer": "(a) 최댓값 / (b) 최솟값", "accept": [["최댓값", "최대", "max", "최대값"], ["최솟값", "최소", "min", "최소값"]], "lesson": "L5-1", "unit": "U5"}, {"id": "5-co-1", "concept": "correlated", "type": "mc", "prompt": "상관 중첩 질의(correlated nested query)란?", "choices": ["안쪽 질의가 바깥과 무관하게 한 번만 평가되는 질의", "안쪽 질의가 바깥 질의의 속성(별칭)을 참조하는 질의", "FROM 절에 있는 질의", "UNION으로 연결된 질의"], "answer": 1, "lesson": "L5-1", "unit": "U5"}, {"id": "5-co-2", "concept": "correlated", "type": "ox", "prompt": "중첩 질의에서 안쪽에서 자격 없이 쓴 속성 이름은 가장 가까운(안쪽) FROM의 테이블 속성으로 해석된다.", "answer": true, "lesson": "L5-1", "unit": "U5"}, {"id": "5-co-3", "concept": "correlated", "type": "short", "prompt": "중첩 질의에서 모호성이 생기는 경우와 해결 방법을 쓰시오.", "answer": "바깥 질의의 FROM과 안쪽 질의의 FROM에 같은 이름의 속성이 있으면 어느 테이블의 속성인지 모호해진다. 해결: 테이블마다 별칭(투플 변수)을 붙이고 E.Sex, D.Sex처럼 자격을 부여한다. 질의에 쓰는 모든 테이블에 별칭을 붙이는 것이 권장된다.", "keys": ["바깥·안쪽에 같은 이름 속성", "별칭으로 자격 부여", "모든 테이블에 별칭 권장"], "lesson": "L5-1", "unit": "U5"}, {"id": "5-co-4", "concept": "correlated", "type": "calc", "prompt": "부양가족 중에 사원 자신과 이름(first name)과 성별이 같은 사람이 있는 사원의 이름을 검색하시오. (질의 16)", "answer": "SELECT E.Fname, E.Lname\nFROM   EMPLOYEE AS E\nWHERE  E.Ssn IN ( SELECT D.Essn\n                  FROM   DEPENDENT AS D\n                  WHERE  E.Fname = D.Dependent_name\n                    AND  E.Sex = D.Sex );\n\n-- 교재 COMPANY 상태에서 실행 결과 (0행)\nFname | Lname\n\nCOMPANY 상태에는 그런 부양가족이 없어 결과는 비어 있다.", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["안쪽이 바깥 E를 참조 (상관)", "E.Fname = D.Dependent_name", "E.Sex = D.Sex"], "lesson": "L5-1", "unit": "U5"}, {"id": "5-co-5", "concept": "correlated", "type": "calc", "prompt": "자기 부서의 평균 급여보다 급여가 많은 사원의 이름, 부서 번호, 급여를 상관 중첩 질의로 검색하시오.", "answer": "SELECT E.Fname, E.Lname, E.Dno, E.Salary\nFROM   EMPLOYEE AS E\nWHERE  E.Salary > ( SELECT AVG(E2.Salary)\n                    FROM   EMPLOYEE AS E2\n                    WHERE  E2.Dno = E.Dno );\n\n-- 교재 COMPANY 상태에서 실행 결과 (3행)\nFname | Lname | Dno | Salary\nFranklin | Wong | 5 | 40000\nJennifer | Wallace | 4 | 43000\nRamesh | Narayan | 5 | 38000", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["별칭 두 개 (E, E2)", "안쪽 E2.Dno = E.Dno (상관)", "AVG와 비교"], "lesson": "L5-1", "unit": "U5"}, {"id": "5-ex-1", "concept": "exists", "type": "mc", "prompt": "NOT EXISTS (Q) 가 TRUE인 경우는?", "choices": ["Q 결과에 투플이 하나라도 있을 때", "Q 결과가 NULL을 포함할 때", "Q 결과가 비어 있을 때", "Q가 집계 함수를 쓸 때"], "answer": 2, "lesson": "L5-2", "unit": "U5"}, {"id": "5-ex-2", "concept": "exists", "type": "ox", "prompt": "EXISTS는 안쪽 질의 결과의 값이 무엇인지가 아니라 결과가 비었는지만 본다.", "answer": true, "lesson": "L5-2", "unit": "U5"}, {"id": "5-ex-3", "concept": "exists", "type": "calc", "prompt": "부양가족이 없는 사원의 이름을 NOT EXISTS로 검색하시오. (질의 6)", "answer": "SELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  NOT EXISTS ( SELECT *\n                    FROM   DEPENDENT\n                    WHERE  Ssn = Essn );\n\n-- 교재 COMPANY 상태에서 실행 결과 (5행)\nFname | Lname\nAlicia | Zelaya\nRamesh | Narayan\nJoyce | English\nAhmad | Jabbar\nJames | Borg", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["NOT EXISTS", "안쪽: DEPENDENT WHERE Ssn = Essn (상관)"], "slot": 13, "pts": 10, "lesson": "L5-2", "unit": "U5"}, {"id": "5-ex-4", "concept": "exists", "type": "calc", "prompt": "부양가족이 하나 이상 있는 관리자의 이름을 EXISTS로 검색하시오.", "answer": "SELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  EXISTS ( SELECT * FROM DEPENDENT  WHERE Ssn = Essn )\n  AND  EXISTS ( SELECT * FROM DEPARTMENT WHERE Ssn = Mgr_ssn );\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nFname | Lname\nFranklin | Wong\nJennifer | Wallace", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["EXISTS (부양가족)", "AND", "EXISTS (관리하는 부서)"], "slot": 13, "pts": 10, "lesson": "L5-2", "unit": "U5"}, {"id": "5-ex-5", "concept": "exists", "type": "calc", "prompt": "어떤 프로젝트에서도 일하지 않는 부서 관리자가 있다면 그 관리자의 이름을 검색하시오.", "answer": "SELECT E.Fname, E.Lname\nFROM   EMPLOYEE AS E\nWHERE  EXISTS ( SELECT * FROM DEPARTMENT AS D WHERE D.Mgr_ssn = E.Ssn )\n  AND  NOT EXISTS ( SELECT * FROM WORKS_ON AS W WHERE W.Essn = E.Ssn );\n\n-- 교재 COMPANY 상태에서 실행 결과 (0행)\nFname | Lname\n\n관리자 셋(Wong, Wallace, Borg) 모두 WORKS_ON에 있다 (Borg는 Hours가 NULL인 투플). 결과 0행.", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["EXISTS (관리자)", "NOT EXISTS (WORKS_ON)"], "lesson": "L5-2", "unit": "U5"}, {"id": "5-ex-6", "concept": "exists", "type": "calc", "prompt": "직접 감독하는 부하가 한 명이라도 있는 사원의 이름을 EXISTS로 검색하시오.", "answer": "SELECT S.Fname, S.Lname\nFROM   EMPLOYEE AS S\nWHERE  EXISTS ( SELECT *\n                FROM   EMPLOYEE AS E\n                WHERE  E.Super_ssn = S.Ssn );\n\n-- 교재 COMPANY 상태에서 실행 결과 (3행)\nFname | Lname\nFranklin | Wong\nJennifer | Wallace\nJames | Borg", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["EXISTS", "E.Super_ssn = S.Ssn (별칭 둘)"], "lesson": "L5-2", "unit": "U5"}, {"id": "5-ex-7", "concept": "exists", "type": "calc", "prompt": "A 학점이 하나도 없는 학생의 이름과 전공을 검색하시오. (UNIVERSITY, db-exercises Q2-2)", "answer": "SELECT S.Name, S.Major\nFROM   STUDENT AS S\nWHERE  NOT EXISTS ( SELECT *\n                    FROM   GRADE_REPORT AS G\n                    WHERE  G.Student_number = S.Student_number\n                      AND  G.Grade = 'A' );\n\n-- 교재 UNIVERSITY 상태에서 실행 결과 (1행)\nName | Major\nSmith | CS", "code": "STUDENT(Name, Student_number, Class, Major)\nCOURSE(Course_name, Course_number, Credit_hours, Department)\nSECTION(Section_identifier, Course_number, Semester, Year, Instructor)\nGRADE_REPORT(Student_number, Section_identifier, Grade)\nPREREQUISITE(Course_number, Prerequisite_number)", "keys": ["NOT EXISTS", "G.Student_number = S.Student_number", "G.Grade = 'A'"], "lesson": "L5-2", "unit": "U5"}, {"id": "5-ex-8", "concept": "exists", "type": "calc", "prompt": "모든 과목에서 A를 받은(A가 아닌 학점이 없는) 학생의 이름과 전공을 검색하시오. (UNIVERSITY, db-exercises Q2-1)", "answer": "SELECT S.Name, S.Major\nFROM   STUDENT AS S\nWHERE  NOT EXISTS ( SELECT *\n                    FROM   GRADE_REPORT AS G\n                    WHERE  G.Student_number = S.Student_number\n                      AND  G.Grade <> 'A' );\n\n-- 교재 UNIVERSITY 상태에서 실행 결과 (0행)\nName | Major\n\nBrown도 B가 하나 있어서 결과는 비어 있다. (성적이 하나도 없는 학생이 있다면 그 학생도 나온다는 점 주의)", "code": "STUDENT(Name, Student_number, Class, Major)\nCOURSE(Course_name, Course_number, Credit_hours, Department)\nSECTION(Section_identifier, Course_number, Semester, Year, Instructor)\nGRADE_REPORT(Student_number, Section_identifier, Grade)\nPREREQUISITE(Course_number, Prerequisite_number)", "keys": ["NOT EXISTS", "G.Grade <> 'A'"], "lesson": "L5-2", "unit": "U5"}, {"id": "5-div-1", "concept": "division-sql", "type": "mc", "prompt": "'5번 부서가 통제하는 모든 프로젝트에서 일하는 사원'을 찾는 SQL 패턴은?", "choices": ["IN", "= ANY", "EXISTS 하나", "NOT EXISTS ((5번 부서 프로젝트) EXCEPT (그 사원의 프로젝트))"], "answer": 3, "lesson": "L5-2", "unit": "U5"}, {"id": "5-div-2", "concept": "division-sql", "type": "short", "prompt": "NOT EXISTS ((SELECT Pnumber FROM PROJECT WHERE Dnum = 5) EXCEPT (SELECT Pno FROM WORKS_ON WHERE Ssn = Essn)) 가 무엇을 확인하는지 설명하시오.", "answer": "첫 집합은 5번 부서가 통제하는 프로젝트 전체, 둘째는 현재 사원이 일하는 프로젝트. 차집합은 5번 부서 프로젝트 중 이 사원이 안 하는 것. 이게 비어 있으면(NOT EXISTS가 참) 사원이 5번 부서 프로젝트를 전부 하고 있다는 뜻이다.", "keys": ["첫 집합 = 5번 부서 프로젝트 전체", "둘째 = 그 사원의 프로젝트", "차집합이 비면 전부 수행"], "lesson": "L5-2", "unit": "U5"}, {"id": "5-div-3", "concept": "division-sql", "type": "calc", "prompt": "5번 부서 프로젝트 = {1, 2, 3}이다. 사원 A는 {1, 2, 4}, B는 {1, 2, 3, 4}, C는 {3}에서 일한다. NOT EXISTS + EXCEPT 나눗셈 질의 결과에 들어가는 사원과 이유를 쓰시오.", "answer": "A: {1,2,3} − {1,2,4} = {3} ≠ ∅ → 탈락\nB: {1,2,3} − {1,2,3,4} = ∅ → 선택\nC: {1,2,3} − {3} = {1,2} ≠ ∅ → 탈락\n결과: B만", "keys": ["A 탈락 ({3})", "B 선택 (∅)", "C 탈락 ({1,2})"], "lesson": "L5-2", "unit": "U5"}, {"id": "5-div-4", "concept": "division-sql", "type": "calc", "prompt": "5번 부서가 통제하는 모든 프로젝트에서 일하는 사원의 이름을 검색하시오. (교안 연습 1)", "answer": "SELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  NOT EXISTS ( ( SELECT Pnumber FROM PROJECT WHERE Dnum = 5 )\n                    EXCEPT\n                    ( SELECT Pno FROM WORKS_ON WHERE Ssn = Essn ) );\n\n-- 교재 COMPANY 상태에서 실행 결과 (0행)\nFname | Lname\n\nCOMPANY 상태에서는 1, 2, 3을 모두 하는 사원이 없어서 결과가 비어 있다. NOT EXISTS 두 번 방식으로도 같은 결과.", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["NOT EXISTS", "(5번 부서 프로젝트) EXCEPT (그 사원의 프로젝트)", "안쪽 Ssn = Essn (상관)"], "slot": 13, "pts": 10, "lesson": "L5-2", "unit": "U5"}, {"id": "5-div-5", "concept": "division-sql", "type": "calc", "prompt": "'John Smith'가 일하는 모든 프로젝트에서 일하는 사원의 이름을 검색하시오 (Smith 본인 포함).", "answer": "SELECT E.Fname, E.Lname\nFROM   EMPLOYEE AS E\nWHERE  NOT EXISTS ( SELECT W1.Pno\n                    FROM   WORKS_ON AS W1, EMPLOYEE AS S\n                    WHERE  W1.Essn = S.Ssn AND S.Fname = 'John' AND S.Lname = 'Smith'\n                      AND  NOT EXISTS ( SELECT *\n                                        FROM   WORKS_ON AS W2\n                                        WHERE  W2.Essn = E.Ssn AND W2.Pno = W1.Pno ) );\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nFname | Lname\nJohn | Smith\nJoyce | English", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["바깥 NOT EXISTS: Smith의 프로젝트 중", "안쪽 NOT EXISTS: 그 사원이 안 하는 것", "상관 W2.Essn = E.Ssn, W2.Pno = W1.Pno"], "slot": 13, "pts": 10, "lesson": "L5-2", "unit": "U5"}, {"id": "5-div-6", "concept": "division-sql", "type": "calc", "prompt": "Stafford에 있는 모든 프로젝트에서 일하는 사원의 이름을 검색하시오.", "answer": "SELECT E.Fname, E.Lname\nFROM   EMPLOYEE AS E\nWHERE  NOT EXISTS ( SELECT *\n                    FROM   PROJECT AS P\n                    WHERE  P.Plocation = 'Stafford'\n                      AND  NOT EXISTS ( SELECT *\n                                        FROM   WORKS_ON AS W\n                                        WHERE  W.Essn = E.Ssn AND W.Pno = P.Pnumber ) );\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nFname | Lname\nAlicia | Zelaya\nAhmad | Jabbar\n\nStafford 프로젝트 = {10, 30}. 둘 다 하는 사원 = Zelaya, Jabbar.", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["이중 NOT EXISTS", "Plocation = 'Stafford'", "W.Essn = E.Ssn AND W.Pno = P.Pnumber"], "slot": 13, "pts": 10, "lesson": "L5-2", "unit": "U5"}, {"id": "5-jt-1", "concept": "joined-table", "type": "mc", "prompt": "조인 테이블(joined table)을 쓰는 곳은?", "choices": ["SELECT 절", "FROM 절", "WHERE 절", "GROUP BY 절"], "answer": 1, "lesson": "L5-3", "unit": "U5"}, {"id": "5-jt-2", "concept": "joined-table", "type": "ox", "prompt": "FROM (EMPLOYEE JOIN DEPARTMENT ON Dno = Dnumber) WHERE Dname = 'Research' 는 FROM EMPLOYEE, DEPARTMENT WHERE Dname = 'Research' AND Dnumber = Dno 와 결과가 같다.", "answer": true, "lesson": "L5-3", "unit": "U5"}, {"id": "5-jt-3", "concept": "joined-table", "type": "calc", "prompt": "각 프로젝트 이름과 그 프로젝트를 통제하는 부서 이름을 JOIN ... ON으로 검색하시오.", "answer": "SELECT P.Pname, D.Dname\nFROM   (PROJECT AS P JOIN DEPARTMENT AS D ON P.Dnum = D.Dnumber);\n\n-- 교재 COMPANY 상태에서 실행 결과 (6행)\nPname | Dname\nProductX | Research\nProductY | Research\nProductZ | Research\nComputerization | Administration\nReorganization | Headquarters\nNewbenefits | Administration", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["FROM (PROJECT JOIN DEPARTMENT ON ...)", "P.Dnum = D.Dnumber"], "lesson": "L5-3", "unit": "U5"}, {"id": "5-jt-4", "concept": "joined-table", "type": "calc", "prompt": "'Houston'에 있는 부서 위치를 가진 부서에서 일하는 사원의 이름과 부서 이름을 JOIN으로 검색하시오.", "answer": "SELECT E.Fname, E.Lname, D.Dname\nFROM   ((EMPLOYEE AS E JOIN DEPARTMENT AS D ON E.Dno = D.Dnumber)\n        JOIN DEPT_LOCATIONS AS L ON D.Dnumber = L.Dnumber)\nWHERE  L.Dlocation = 'Houston';\n\n-- 교재 COMPANY 상태에서 실행 결과 (5행)\nFname | Lname | Dname\nJohn | Smith | Research\nFranklin | Wong | Research\nRamesh | Narayan | Research\nJoyce | English | Research\nJames | Borg | Headquarters", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["JOIN 두 번 (중첩)", "E.Dno = D.Dnumber, D.Dnumber = L.Dnumber", "WHERE Dlocation = 'Houston'"], "lesson": "L5-3", "unit": "U5"}, {"id": "5-jt-5", "concept": "joined-table", "type": "short", "prompt": "조인 테이블을 쓰면 좋은 점을 쓰시오.", "answer": "조인 조건을 FROM 절에 명시해서, WHERE 절에 선택 조건과 조인 조건이 섞이는 것을 피할 수 있다. 질의 구조를 이해하기 쉬워지고 조인 조건을 빠뜨리는 실수가 줄어든다.", "keys": ["조인 조건을 FROM에 명시", "WHERE에 선택·조인 조건이 섞이지 않음"], "lesson": "L5-3", "unit": "U5"}, {"id": "5-nj-1", "concept": "natural-join-sql", "type": "mc", "prompt": "NATURAL JOIN의 조인 조건은?", "choices": ["직접 ON으로 써야 한다", "PK와 FK 쌍", "이름이 같은 속성 쌍마다 암묵적인 동등 조건", "조건 없이 카티션 곱"], "answer": 2, "lesson": "L5-3", "unit": "U5"}, {"id": "5-nj-2", "concept": "natural-join-sql", "type": "short", "prompt": "EMPLOYEE NATURAL JOIN DEPARTMENT를 바로 쓰면 Dno와 Dnumber가 조인되지 않는 이유와 해결 방법을 쓰시오.", "answer": "NATURAL JOIN은 이름이 같은 속성끼리만 조인하는데 EMPLOYEE는 Dno, DEPARTMENT는 Dnumber로 이름이 다르다. 그래서 DEPARTMENT AS DEPT (Dname, Dno, Mssn, Msdate)처럼 이름을 바꿔 Dno로 맞춘 뒤 NATURAL JOIN한다.", "keys": ["이름이 달라서 안 걸림", "별칭으로 속성 이름 바꾸기 (Dnumber → Dno)"], "lesson": "L5-3", "unit": "U5"}, {"id": "5-nj-3", "concept": "natural-join-sql", "type": "ox", "prompt": "NATURAL JOIN 결과에서 조인 속성은 한 번만 나온다.", "answer": true, "lesson": "L5-3", "unit": "U5"}, {"id": "5-nj-4", "concept": "natural-join-sql", "type": "calc", "prompt": "부서 이름과 그 부서의 위치를 NATURAL JOIN으로 검색하시오.", "answer": "SELECT Dname, Dlocation\nFROM   (DEPARTMENT NATURAL JOIN DEPT_LOCATIONS);\n\n-- 교재 COMPANY 상태에서 실행 결과 (5행)\nDname | Dlocation\nHeadquarters | Houston\nAdministration | Stafford\nResearch | Bellaire\nResearch | Sugarland\nResearch | Houston", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["DEPARTMENT NATURAL JOIN DEPT_LOCATIONS", "공통 속성 Dnumber로 조인"], "lesson": "L5-3", "unit": "U5"}, {"id": "5-io-1", "concept": "inner-outer", "type": "mc", "prompt": "SELECT E.Lname, S.Lname FROM EMPLOYEE AS E, EMPLOYEE AS S WHERE E.Super_ssn = S.Ssn; 결과에서 빠지는 사원은? (COMPANY 상태)", "choices": ["Wong", "Wallace", "Smith", "Borg (Super_ssn이 NULL)"], "answer": 3, "lesson": "L5-3", "unit": "U5"}, {"id": "5-io-2", "concept": "inner-outer", "type": "mc", "prompt": "LEFT OUTER JOIN의 결과에 반드시 들어가는 것은?", "choices": ["왼쪽 테이블의 모든 투플", "오른쪽 테이블의 모든 투플", "양쪽 모든 투플", "조건을 만족하는 쌍만"], "answer": 0, "lesson": "L5-3", "unit": "U5"}, {"id": "5-io-3", "concept": "inner-outer", "type": "calc", "prompt": "모든 사원의 성과, 상사가 있다면 상사의 성을 검색하시오 (상사가 없으면 NULL).", "answer": "SELECT E.Lname AS Employee_name, S.Lname AS Supervisor_name\nFROM   (EMPLOYEE AS E LEFT OUTER JOIN EMPLOYEE AS S\n        ON E.Super_ssn = S.Ssn);\n\n-- 교재 COMPANY 상태에서 실행 결과 (8행)\nEmployee_name | Supervisor_name\nSmith | Wong\nWong | Borg\nZelaya | Wallace\nWallace | Borg\nNarayan | Wong\nEnglish | Wong\nJabbar | Wallace\nBorg | NULL", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["LEFT OUTER JOIN", "ON E.Super_ssn = S.Ssn", "Borg의 상사 NULL"], "lesson": "L5-3", "unit": "U5"}, {"id": "5-io-4", "concept": "inner-outer", "type": "calc", "prompt": "모든 사원 이름과, 그 사원이 관리하는 부서가 있으면 그 부서 이름을 검색하시오.", "answer": "SELECT E.Fname, E.Lname, D.Dname\nFROM   (EMPLOYEE AS E LEFT OUTER JOIN DEPARTMENT AS D\n        ON E.Ssn = D.Mgr_ssn);\n\n-- 교재 COMPANY 상태에서 실행 결과 (8행)\nFname | Lname | Dname\nJohn | Smith | NULL\nFranklin | Wong | Research\nAlicia | Zelaya | NULL\nJennifer | Wallace | Administration\nRamesh | Narayan | NULL\nJoyce | English | NULL\nAhmad | Jabbar | NULL\nJames | Borg | Headquarters", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["EMPLOYEE LEFT OUTER JOIN DEPARTMENT", "ON E.Ssn = D.Mgr_ssn"], "lesson": "L5-3", "unit": "U5"}, {"id": "5-io-5", "concept": "inner-outer", "type": "calc", "prompt": "모든 프로젝트의 이름과 그 프로젝트에서 일하는 사원 수를 검색하시오. 일하는 사원이 없는 프로젝트도 0으로 나와야 한다.", "answer": "SELECT   P.Pname, COUNT(W.Essn)\nFROM     (PROJECT AS P LEFT OUTER JOIN WORKS_ON AS W ON P.Pnumber = W.Pno)\nGROUP BY P.Pnumber, P.Pname;\n\n-- 교재 COMPANY 상태에서 실행 결과 (6행)\nPname | COUNT(W.Essn)\nProductX | 2\nProductY | 3\nProductZ | 2\nComputerization | 3\nReorganization | 3\nNewbenefits | 3\n\nCOUNT(*)를 쓰면 짝 없는 프로젝트도 1로 세진다. COMPANY 상태에선 모든 프로젝트에 사원이 있어 차이가 안 보인다.", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["LEFT OUTER JOIN", "COUNT(W.Essn) (NULL은 안 셈 → 0)", "GROUP BY"], "lesson": "L5-3", "unit": "U5"}, {"id": "5-io-6", "concept": "inner-outer", "type": "blank", "prompt": "외부 조인에서 짝이 없는 투플의 상대 속성은 (a) 로 채운다. 짝 없는 것만 고르려면 WHERE B.KEY (b) 를 쓴다.", "answer": "(a) NULL / (b) IS NULL", "accept": [["NULL", "null", "널"], ["IS NULL", "is null"]], "lesson": "L5-3", "unit": "U5"}, {"id": "5-io-7", "concept": "inner-outer", "type": "short", "prompt": "내부 조인과 외부 조인(LEFT, RIGHT, FULL)의 차이를 쓰시오.", "answer": "내부 조인: 조인 조건을 만족하는(짝이 있는) 투플 쌍만 결과에. 외부 조인: 짝이 없는 투플도 결과에 넣고 상대 속성을 NULL로 채움. LEFT는 왼쪽 테이블의 모든 투플, RIGHT는 오른쪽 테이블의 모든 투플, FULL은 양쪽 모든 투플을 유지.", "keys": ["내부 = 짝 있는 것만", "외부 = 짝 없어도 NULL 채워 포함", "LEFT/RIGHT/FULL 구분"], "lesson": "L5-3", "unit": "U5"}, {"id": "5-ag-1", "concept": "aggregate", "type": "mc", "prompt": "COMPANY 상태에서 SELECT AVG(Salary) FROM EMPLOYEE; 의 결과는?", "choices": ["33250", "31000", "35125", "40000"], "answer": 2, "lesson": "L5-4", "unit": "U5"}, {"id": "5-ag-2", "concept": "aggregate", "type": "calc", "prompt": "전체 사원 급여의 합, 최대, 최소, 평균을 검색하시오. (질의 19)", "answer": "SELECT SUM(Salary), MAX(Salary), MIN(Salary), AVG(Salary)\nFROM   EMPLOYEE;\n\n-- 교재 COMPANY 상태에서 실행 결과 (1행)\nSUM(Salary) | MAX(Salary) | MIN(Salary) | AVG(Salary)\n281000 | 55000 | 25000 | 35125", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["SUM, MAX, MIN, AVG(Salary)"], "lesson": "L5-4", "unit": "U5"}, {"id": "5-ag-3", "concept": "aggregate", "type": "calc", "prompt": "'Research' 부서 사원 급여의 합, 최대, 최소, 평균을 검색하시오. (질의 20)", "answer": "SELECT SUM(Salary), MAX(Salary), MIN(Salary), AVG(Salary)\nFROM   (EMPLOYEE JOIN DEPARTMENT ON Dno = Dnumber)\nWHERE  Dname = 'Research';\n\n-- 교재 COMPANY 상태에서 실행 결과 (1행)\nSUM(Salary) | MAX(Salary) | MIN(Salary) | AVG(Salary)\n133000 | 40000 | 25000 | 33250", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["집계 함수 4개", "EMPLOYEE–DEPARTMENT 조인", "Dname = 'Research'"], "lesson": "L5-4", "unit": "U5"}, {"id": "5-ag-4", "concept": "aggregate", "type": "ox", "prompt": "집계 함수는 주로 SELECT 절이나 HAVING 절에서 쓴다.", "answer": true, "lesson": "L5-4", "unit": "U5"}, {"id": "5-ag-5", "concept": "aggregate", "type": "calc", "prompt": "WORKS_ON에 기록된 근무 시간의 총합과 평균을 검색하시오.", "answer": "SELECT SUM(Hours), AVG(Hours)\nFROM   WORKS_ON;\n\n-- 교재 COMPANY 상태에서 실행 결과 (1행)\nSUM(Hours) | AVG(Hours)\n275 | 18.33\n\nBorg의 Hours가 NULL이라 AVG는 NULL을 뺀 15개로 나눈다 (275 / 15 ≈ 18.33).", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["SUM(Hours), AVG(Hours)"], "lesson": "L5-4", "unit": "U5"}, {"id": "5-cn-1", "concept": "count-null", "type": "mc", "prompt": "COMPANY 상태에서 SELECT COUNT(Super_ssn) FROM EMPLOYEE; 의 결과는?", "choices": ["8", "7", "3", "1"], "answer": 1, "lesson": "L5-4", "unit": "U5"}, {"id": "5-cn-2", "concept": "count-null", "type": "mc", "prompt": "COMPANY 상태에서 SELECT COUNT(DISTINCT Salary) FROM EMPLOYEE; 의 결과는?", "choices": ["8", "7", "6", "5"], "answer": 2, "lesson": "L5-4", "unit": "U5"}, {"id": "5-cn-3", "concept": "count-null", "type": "ox", "prompt": "COUNT(*)는 행 수를 세고, COUNT(속성)은 NULL이 아닌 값의 수를 센다.", "answer": true, "lesson": "L5-4", "unit": "U5"}, {"id": "5-cn-4", "concept": "count-null", "type": "calc", "prompt": "부양가족이 2명 이상인 사원의 이름을 검색하시오.", "answer": "SELECT Lname, Fname\nFROM   EMPLOYEE\nWHERE  ( SELECT COUNT(*)\n         FROM   DEPENDENT\n         WHERE  Ssn = Essn ) >= 2;\n\n-- 교재 COMPANY 상태에서 실행 결과 (2행)\nLname | Fname\nSmith | John\nWong | Franklin", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["안쪽 COUNT(*) (사원마다 부양가족 수)", "Ssn = Essn (상관)", ">= 2"], "lesson": "L5-4", "unit": "U5"}, {"id": "5-cn-5", "concept": "count-null", "type": "calc", "prompt": "'Research' 부서의 사원 수를 검색하시오. (질의 22)", "answer": "SELECT COUNT(*)\nFROM   EMPLOYEE, DEPARTMENT\nWHERE  Dno = Dnumber AND Dname = 'Research';\n\n-- 교재 COMPANY 상태에서 실행 결과 (1행)\nCOUNT(*)\n4", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["COUNT(*)", "조인 + Dname 조건"], "lesson": "L5-4", "unit": "U5"}, {"id": "5-cn-6", "concept": "count-null", "type":
