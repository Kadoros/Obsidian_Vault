      <div class="actions"><span class="label">${esc(LES[q.lesson]?.id)} · ${TYPE[q.type]}</span><span class="tag">${esc(SEC[q.concept]?.title)}</span><span class="pen" style="font-size:30px;margin-left:auto">${Math.round(l.score*100)}</span></div>
      <div class="prompt">${esc(q.prompt)}</div>${l.feedback ? `<div class="fb">${esc(l.feedback)}</div>` : ""}
      <div class="cols"><div><div class="label">내 답</div><pre class="code">${esc(l.answer || "(기록 없음)")}</pre></div><div><div class="label">모범답안</div><pre class="code">${esc(q.type==="mc" ? (q.answer+1)+". "+q.choices[q.answer] : q.type==="ox" ? (q.answer?"O":"X") : q.answer)}</pre></div></div>
      <div class="actions"><button class="btn sm" data-go="${esc(q.id)}">다시 풀기 →</button><button class="btn sm ghost" data-read="${esc(q.concept)}">교안 읽기</button></div></div>`; }).join("")
    : `<div class="sheet empty">아직 틀린 문제가 없어.</div>`}`;
}
function renderHist(){
  const days = []; const d0 = new Date(); d0.setHours(0,0,0,0);
  for (let i = 13; i >= 0; i--){ const s = d0.getTime() - i*86400000, e = s + 86400000; const as = attempts.filter(a => a.at >= s && a.at < e);
    days.push({ s, n:as.length, avg: as.length ? as.reduce((x,a)=>x+a.score,0)/as.length : null }); }
  const W = 640, H = 170, pad = 28, bw = (W - pad*2)/14, maxN = Math.max(5, ...days.map(d=>d.n));
  const bars = days.map((d,i) => { const h = (H-50)*d.n/maxN, x = pad + i*bw + 4, y = H - 24 - h, dt = new Date(d.s);
    return `<rect x="${x}" y="${y}" width="${bw-8}" height="${Math.max(h, d.n?2:0)}" rx="3" fill="var(--accent)" opacity="${d.n?.85:0}"/>
      ${d.avg != null ? `<circle cx="${x+(bw-8)/2}" cy="${H-24-(H-50)*d.avg}" r="3.5" fill="var(--pen)"/>` : ""}
      ${d.n ? `<text x="${x+(bw-8)/2}" y="${y-5}" font-size="10" text-anchor="middle" fill="var(--muted)" font-family="JetBrains Mono, monospace">${d.n}</text>` : ""}
      <text x="${x+(bw-8)/2}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--muted)" font-family="JetBrains Mono, monospace">${dt.getMonth()+1}/${dt.getDate()}</text>`; }).join("");
  const rows = attempts.slice().sort((a,b)=>b.at-a.at).slice(0,60).map(a => { const q = qById(a.qid); const dt = new Date(a.at);
    return `<tr><td class="yr">${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,"0")}:${String(dt.getMinutes()).padStart(2,"0")}</td>
      <td><button class="btn ghost sm" data-go="${esc(a.qid)}">${esc(q ? SEC[q.concept]?.title : a.qid)}</button></td>
      <td class="note">${q ? TYPE[q.type] : ""}</td><td><span class="st ${level(a.score)}">${Math.round(a.score*100)}</span></td>
      <td class="note">${{auto:"자동",claude:"Claude",self:"자가","claude+self":"Claude→자가",blank:"빈칸"}[a.grader]||a.grader} · ${{check:"점검",practice:"연습",mock:"모의"}[a.mode]||""}</td></tr>`; }).join("");
  $("#v-hist").innerHTML = `<h2>최근 2주</h2><div class="sheet" style="padding:12px 14px;margin-bottom:22px;overflow-x:auto">
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="일별 채점 횟수와 평균 점수"><line x1="${pad}" x2="${W-pad}" y1="${H-24}" y2="${H-24}" stroke="var(--line)"/>
      <line x1="${pad}" x2="${W-pad}" y1="26" y2="26" stroke="var(--line)" stroke-dasharray="3 4"/>
      <text x="${W-pad}" y="20" font-size="10" text-anchor="end" fill="var(--muted)" font-family="JetBrains Mono, monospace">● 평균 점수 (점선 = 100)</text>${bars}</svg>
      <div class="note">막대: 그날 채점한 횟수 · 빨간 점: 그날 평균 점수</div></div>
    <h2>채점 기록</h2><div class="sheet" style="overflow-x:auto">${rows ? `<table class="hist"><thead><tr><th>시각</th><th>개념</th><th>유형</th><th>점수</th><th>방식</th></tr></thead><tbody>${rows}</tbody></table>` : `<div class="empty">아직 기록이 없어.</div>`}</div>`;
}

/* ── shell ───────────────────────── */
function renderAll(force){
  const d = Math.ceil((EXAM_DAY - new Date(new Date().toDateString()))/86400000);
  $("#dday").textContent = d > 0 ? `중간고사 D-${d} (10/23 금)` : d === 0 ? "오늘 중간고사" : "중간고사 끝";
  const ae = document.activeElement;
  if (!force && ae && (ae.tagName === "TEXTAREA" || ae.tagName === "INPUT")) return;  // don't clobber typing
  if (view === "dash") renderDash();
  else if (view === "learn") renderLearn();
  else if (view === "practice") renderPractice();
  else if (view === "mock"){ if (!mock || mock.done) renderMock(); }
  else if (view === "wrong") renderWrong();
  else if (view === "hist") renderHist();
}
function show(v){
  if (view === "mock" && mock && !mock.done) collectMock();
  view = v; ls.set("db-view", v);
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.v === v)));
  document.querySelectorAll("section.view").forEach(s => s.hidden = s.id !== "v-" + v);
  if (v === "mock") renderMock(); else renderAll(true);
  window.scrollTo({ top:0 });
}
function openRead(concept){
  const s = SEC[concept]; if (!s) return;
  L.lesson = s.lesson; L.mode = "read"; L.scrollTo = concept;
  if (!L.review || L.review.lessonId !== s.lesson) L.review = { lessonId:s.lesson, concepts:[concept] };
  else if (!L.review.concepts.includes(concept)) L.review.concepts.push(concept);
  saveL(); show("learn");
}

function closeZoom(){ document.querySelector(".lightbox")?.remove(); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeZoom(); });
document.addEventListener("click", async e => {
  if (e.target.closest(".lightbox")){ closeZoom(); return; }
  const t = e.target.closest("button"); if (!t) return;
  const ds = t.dataset;
  if (ds.zoom){ closeZoom(); const lb = document.createElement("div"); lb.className = "lightbox"; lb.setAttribute("role","dialog"); lb.setAttribute("aria-label","슬라이드 크게 보기");
    lb.innerHTML = `<button class="x" aria-label="닫기">닫기 ✕</button><img src="${esc(ds.zoom)}" alt="">`; document.body.appendChild(lb); return; }
  if (t.matches("nav.tabs button")) return show(ds.v);
  if (ds.tab) return show(ds.tab);
  if (ds.plesson){ filters = { unit:"", concept:"", type:"", status:"", lesson:ds.plesson }; ls.set("db-filters", filters); curId = null; return show("practice"); }
  if (ds.clearlesson){ filters.lesson = ""; ls.set("db-filters", filters); curId = null; return renderPractice(); }
  if (ds.home){ L.mode = "home"; L.lesson = null; saveL(); return renderLearn(); }
  if (ds.lesson){ if (!lessonUnlocked(ds.lesson)) return; L.lesson = ds.lesson; L.mode = "read"; if (L.review && L.review.lessonId !== ds.lesson) L.review = null; saveL(); if (view !== "learn") show("learn"); else { renderLearn(); window.scrollTo({ top:0 }); } return; }
  if (ds.read) return openRead(ds.read);
  if (ds.jump){ document.getElementById("s-" + ds.jump)?.scrollIntoView({ block:"start", behavior:"smooth" }); return; }
  if (ds.startquiz) return startQuiz(ds.startquiz, lessonConcepts(ds.startquiz), 1);
  if (ds.startretest){ const rv = L.review; if (!rv) return; return startQuiz(rv.lessonId, rv.concepts, (L.quiz?.lessonId === rv.lessonId ? L.quiz.round : 1) + 1); }
  if (ds.retest){ const c = ds.retest; const lid = SEC[c].lesson; L.review = { lessonId:lid, concepts:[c] }; return startQuiz(lid, [c], 2); }
  if (ds.goreview){ const rv = L.review; L.lesson = rv.lessonId; L.mode = "read"; L.scrollTo = rv.concepts[0]; saveL(); renderLearn(); return; }
  if (ds.pick != null){
    const key = ds.k; const v = ds.pick === "true" ? true : ds.pick === "false" ? false : Number(ds.pick);
    drafts[key] = v;
    if (key.startsWith("z")){ const z = L.quiz; z.drafts[z.items[z.idx].qid] = v; saveL(); return renderLearn(); }
    if (key.startsWith("p-")){ ls.set("db-draft-" + key.slice(2), v); return renderPractice(); }
    if (key.startsWith("m")){ const i = Number(key.slice(1)); mock.answers[mock.items[i].qid] = v; ls.set("db-mock", mock);
      t.parentElement.querySelectorAll(".choice").forEach(b => b.classList.toggle("sel", b === t)); return; }
  }
  if (ds.submit){ t.disabled = true; return quizSubmit(ds.submit); }
  if (ds.reveal){ const z = L.quiz; const it = z.items[z.idx]; const q = qById(it.qid); z.drafts[it.qid] = readDraft(q, ds.reveal); z.res[it.qid] = { score:null }; saveL(); return renderLearn(); }
  if (ds.skipq){ const z = L.quiz; const it = z.items[z.idx]; const q = qById(it.qid);
    const id = await saveAttempt({ qid:q.id, score:0, grader:"self", answer:"(모르겠음)", feedback:"", missed:[], mode:"check" });
    z.res[it.qid] = { score:0, feedback:"모른다고 표시했어. 모범답안 보고, 결과 화면에서 교안 위치로 가자.", attemptId:id }; saveL(); return renderLearn(); }
  if (ds.self != null){ const k = ds.k; if (k.startsWith("z")) return quizSelf(Number(ds.self)); if (k.startsWith("p-")) return practiceSelf(k.slice(2), Number(ds.self)); }
  if (ds.regrade){ const k = ds.regrade;
    if (k.startsWith("z")){ const z = L.quiz; const it = z.items[z.idx]; const q = qById(it.qid); const r0 = z.res[it.qid];
      t.disabled = true; try { const r = await claudeGrade(q, answerText(q, z.drafts[it.qid])); if (r0.attemptId) await updateAttempt(r0.attemptId, { score:r.score, grader:"claude" }); z.res[it.qid] = { ...r0, ...r, grader:"claude" }; } catch(err){ z.res[it.qid] = { ...r0, error:sampleErrMsg(err) }; }
      saveL(); return renderLearn(); }
    if (k.startsWith("p-")){ const qid = k.slice(2); const q = qById(qid); const r0 = results[qid];
      t.disabled = true; try { const r = await claudeGrade(q, answerText(q, drafts[k])); if (r0.attemptId) await updateAttempt(r0.attemptId, { score:r.score, grader:"claude" }); results[qid] = { ...r0, ...r, grader:"claude" }; } catch(err){ results[qid] = { ...r0, error:sampleErrMsg(err) }; }
      return renderPractice(); } }
  if (ds.qnext){ const z = L.quiz; const j = nextOpen(z, z.idx + 1); if (j >= 0){ z.idx = j; saveL(); renderLearn(); window.scrollTo({ top:0 }); } else quizFinish(); return; }
  if (ds.q && (t.classList.contains("qrow") || t.classList.contains("ghost"))){ curId = ds.q; ls.set("db-cur", curId); return renderPractice(); }
  if (ds.go){ curId = ds.go; ls.set("db-cur", curId); const q = qById(curId); if (q && !filteredQs().find(x => x.id === curId)){ filters = { unit:"", concept:"", type:"", status:"" }; ls.set("db-filters", filters); } return show("practice"); }
  if (ds.psubmit){ t.disabled = true; return practiceSubmit(ds.psubmit); }
  if (ds.preveal){ const q = qById(ds.preveal); drafts["p-"+q.id] = readDraft(q, "p-"+q.id); results[q.id] = { score:null }; return renderPractice(); }
  if (ds.pretry){ delete results[ds.pretry]; drafts["p-"+ds.pretry] = undefined; return renderPractice(); }
  if (ds.mockstart){ mock = buildMock(); ls.set("db-mock", mock); Object.keys(drafts).filter(k => /^m\d/.test(k)).forEach(k => delete drafts[k]); return renderMock(); }
  if (ds.mocksubmit) return submitMock();
  if (ds.mockexit){ mock = null; ls.set("db-mock", null); clearInterval(timerHandle); Object.keys(drafts).filter(k => /^m\d/.test(k)).forEach(k => delete drafts[k]); return renderMock(); }
});
document.addEventListener("input", e => {
  const t = e.target; const k = t.dataset.k; if (!k) return;
  if (k.startsWith("p-")){ const q = qById(k.slice(2)); if (q){ drafts[k] = readDraft(q, k); ls.set("db-draft-" + q.id, drafts[k]); } }
  else if (k.startsWith("z") && L.quiz){ const z = L.quiz; const q = qById(z.items[z.idx].qid); z.drafts[q.id] = readDraft(q, k); saveL(); }
  else if (k.startsWith("m") && mock){ const i = Number(k.slice(1)); const q = qById(mock.items[i].qid); mock.answers[q.id] = readDraft(q, k); ls.set("db-mock", mock); }
});
document.addEventListener("change", e => {
  const t = e.target; const map = { "f-unit":"unit", "f-concept":"concept", "f-type":"type", "f-status":"status" };
  if (!map[t.id]) return; filters[map[t.id]] = t.value; filters.lesson = ""; if (t.id === "f-unit") filters.concept = "";
  ls.set("db-filters", filters); curId = null; renderPractice();
});

/* ── boot ───────────────────────── */
async function boot(){
  attempts = ls.get("db-attempts", []).map(a => ({ ...a, _id:a._id || "local" }));
  progress = ls.get("db-progress", {});
  if (L.mode === "quiz" && !L.quiz) L.mode = "home";
  show(view); setStoreChip(); setGraderChip();
  if (!window.claude?.use) return;
  claude.use("sample").then(s => { sample = s; setGraderChip(); renderAll(); }).catch(() => {});
  const d = await claude.use("db").catch(() => null);
  if (!d) return;
  db = d; setStoreChip();
  db.collection("attempts").orderBy("at","desc").limit(2000).onSnapshot(snap => {
    const remote = snap.docs.map(x => ({ ...x.data(), _id:x.id }));
    const local = ls.get("db-attempts", []).map(a => ({ ...a, _id:a._id || "local" }));
    attempts = remote.concat(local.filter(l => !remote.find(r => r._id === l._id)));
    renderAll();
  }, () => { db = null; setStoreChip(); });
  db.collection("progress").onSnapshot(snap => {
    const remote = Object.fromEntries(snap.docs.map(x => [x.id, x.data()]));
    progress = { ...ls.get("db-progress", {}), ...remote };
    renderAll();
  }, () => {});
  db.collection("extra_questions").onSnapshot(snap => {
    extra = snap.docs.map(x => ({ id:x.id, type:"short", prompt:"", answer:"", ...x.data() }))
      .filter(q => SEC[q.concept]).map(q => ({ ...q, lesson:SEC[q.concept].lesson, unit:LES[SEC[q.concept].lesson].unit, extra:true }));
    renderAll();
  }, () => {});
}
boot();
})();
</script>
