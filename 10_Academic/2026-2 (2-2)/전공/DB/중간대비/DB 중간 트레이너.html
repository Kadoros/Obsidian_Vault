"short", "prompt": "COUNT(*), COUNT(A), COUNT(DISTINCT A)의 차이를 COMPANY의 EMPLOYEE.Super_ssn을 예로 설명하시오.", "answer": "COUNT(*): 행 수 → 8. COUNT(Super_ssn): NULL이 아닌 값의 수 → 7 (Borg는 NULL). COUNT(DISTINCT Super_ssn): 서로 다른 값의 수 → 3 (333445555, 888665555, 987654321).", "keys": ["COUNT(*) = 8 (행 수)", "COUNT(Super_ssn) = 7 (NULL 제외)", "COUNT(DISTINCT) = 3"], "lesson": "L5-4", "unit": "U5"}, {"id": "5-gb-1", "concept": "group-by", "type": "mc", "prompt": "GROUP BY Dno를 쓴 질의의 SELECT 절에 올 수 있는 것은?", "choices": ["Dno와 집계 함수", "모든 속성", "Lname", "Ssn"], "answer": 0, "lesson": "L5-4", "unit": "U5"}, {"id": "5-gb-2", "concept": "group-by", "type": "calc", "prompt": "부서마다 부서 번호, 사원 수, 평균 급여를 검색하시오. (질의 24)", "answer": "SELECT   Dno, COUNT(*), AVG(Salary)\nFROM     EMPLOYEE\nGROUP BY Dno;\n\n-- 교재 COMPANY 상태에서 실행 결과 (3행)\nDno | COUNT(*) | AVG(Salary)\n1 | 1 | 55000\n4 | 3 | 31000\n5 | 4 | 33250", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["GROUP BY Dno", "COUNT(*), AVG(Salary)"], "lesson": "L5-4", "unit": "U5"}, {"id": "5-gb-3", "concept": "group-by", "type": "calc", "prompt": "프로젝트마다 프로젝트 번호, 이름, 그 프로젝트에서 일하는 사원 수를 검색하시오. (질의 25)", "answer": "SELECT   Pnumber, Pname, COUNT(*)\nFROM     PROJECT, WORKS_ON\nWHERE    Pnumber = Pno\nGROUP BY Pnumber, Pname;\n\n-- 교재 COMPANY 상태에서 실행 결과 (6행)\nPnumber | Pname | COUNT(*)\n1 | ProductX | 2\n2 | ProductY | 3\n3 | ProductZ | 2\n10 | Computerization | 3\n20 | Reorganization | 3\n30 | Newbenefits | 3", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["PROJECT–WORKS_ON 조인", "GROUP BY Pnumber, Pname", "COUNT(*)"], "lesson": "L5-4", "unit": "U5"}, {"id": "5-gb-4", "concept": "group-by", "type": "calc", "prompt": "부서마다 부서 이름과 그 부서가 통제하는 프로젝트 수를 검색하시오.", "answer": "SELECT   D.Dname, COUNT(*)\nFROM     DEPARTMENT AS D, PROJECT AS P\nWHERE    D.Dnumber = P.Dnum\nGROUP BY D.Dnumber, D.Dname;\n\n-- 교재 COMPANY 상태에서 실행 결과 (3행)\nDname | COUNT(*)\nHeadquarters | 1\nAdministration | 2\nResearch | 3", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["DEPARTMENT–PROJECT 조인", "GROUP BY 부서", "COUNT(*)"], "lesson": "L5-4", "unit": "U5"}, {"id": "5-gb-5", "concept": "group-by", "type": "calc", "prompt": "사원마다 Ssn, 성, 일하는 프로젝트 수, 총 근무 시간을 검색하시오.", "answer": "SELECT   E.Ssn, E.Lname, COUNT(*), SUM(W.Hours)\nFROM     EMPLOYEE AS E, WORKS_ON AS W\nWHERE    E.Ssn = W.Essn\nGROUP BY E.Ssn, E.Lname;\n\n-- 교재 COMPANY 상태에서 실행 결과 (8행)\nSsn | Lname | COUNT(*) | SUM(W.Hours)\n123456789 | Smith | 2 | 40\n333445555 | Wong | 4 | 40\n453453453 | English | 2 | 40\n666884444 | Narayan | 1 | 40\n888665555 | Borg | 1 | NULL\n987654321 | Wallace | 2 | 35\n987987987 | Jabbar | 2 | 40\n999887777 | Zelaya | 2 | 40", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["EMPLOYEE–WORKS_ON 조인", "GROUP BY E.Ssn, E.Lname", "COUNT(*), SUM(Hours)"], "slot": 14, "pts": 10, "lesson": "L5-4", "unit": "U5"}, {"id": "5-gb-6", "concept": "group-by", "type": "ox", "prompt": "SELECT Dno, Lname, COUNT(*) FROM EMPLOYEE GROUP BY Dno; 는 표준 SQL에서 올바른 질의이다.", "answer": false, "explain": "Lname은 그룹마다 값이 하나로 정해지지 않는다. GROUP BY를 쓰면 SELECT엔 그룹화 속성과 집계만.", "lesson": "L5-4", "unit": "U5"}, {"id": "5-gb-7", "concept": "group-by", "type": "short", "prompt": "GROUP BY와 그룹화 속성을 설명하시오.", "answer": "GROUP BY는 릴레이션의 투플을 겹치지 않는 부분집합(그룹)으로 나눠서 그룹마다 집계 함수를 적용하게 한다. 그룹화 속성은 그룹을 나누는 기준으로, 같은 그룹의 투플은 그룹화 속성 값이 같다.", "keys": ["겹치지 않는 그룹으로 분할", "그룹마다 집계", "그룹화 속성 값이 같은 투플이 한 그룹"], "lesson": "L5-4", "unit": "U5"}, {"id": "5-hv-1", "concept": "having", "type": "mc", "prompt": "'평균 급여가 30000을 넘는 부서'의 조건을 쓰는 곳은?", "choices": ["WHERE AVG(Salary) > 30000", "SELECT 절", "HAVING AVG(Salary) > 30000", "ORDER BY"], "answer": 2, "lesson": "L5-4", "unit": "U5"}, {"id": "5-hv-2", "concept": "having", "type": "calc", "prompt": "사원이 두 명 넘게 일하는 프로젝트마다 번호, 이름, 사원 수를 검색하시오. (질의 26)", "answer": "SELECT   Pnumber, Pname, COUNT(*)\nFROM     PROJECT, WORKS_ON\nWHERE    Pnumber = Pno\nGROUP BY Pnumber, Pname\nHAVING   COUNT(*) > 2;\n\n-- 교재 COMPANY 상태에서 실행 결과 (4행)\nPnumber | Pname | COUNT(*)\n2 | ProductY | 3\n10 | Computerization | 3\n20 | Reorganization | 3\n30 | Newbenefits | 3", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["GROUP BY Pnumber, Pname", "HAVING COUNT(*) > 2"], "slot": 14, "pts": 10, "lesson": "L5-4", "unit": "U5"}, {"id": "5-hv-3", "concept": "having", "type": "calc", "prompt": "평균 급여가 $30,000를 넘는 부서마다 부서 이름과 그 부서 사원 수를 검색하시오. (교안 연습 2)", "answer": "SELECT   D.Dname, COUNT(*)\nFROM     EMPLOYEE AS E, DEPARTMENT AS D\nWHERE    E.Dno = D.Dnumber\nGROUP BY D.Dname\nHAVING   AVG(E.Salary) > 30000;\n\n-- 교재 COMPANY 상태에서 실행 결과 (3행)\nDname | COUNT(*)\nAdministration | 3\nHeadquarters | 1\nResearch | 4", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["EMPLOYEE–DEPARTMENT 조인 (부서 이름 때문)", "GROUP BY 부서", "HAVING AVG(Salary) > 30000"], "slot": 14, "pts": 10, "lesson": "L5-4", "unit": "U5"}, {"id": "5-hv-4", "concept": "having", "type": "calc", "prompt": "사원이 5명 이상인 부서마다 부서 번호와, 그 부서에서 급여가 40000 넘는 사원 수를 검색하시오. (WHERE와 HAVING의 차이에 주의)", "answer": "SELECT   Dno, COUNT(*)\nFROM     EMPLOYEE\nWHERE    Salary > 40000\n  AND    Dno IN ( SELECT   Dno\n                  FROM     EMPLOYEE\n                  GROUP BY Dno\n                  HAVING   COUNT(*) >= 5 )\nGROUP BY Dno;\n\n-- 교재 COMPANY 상태에서 실행 결과 (0행)\nDno | COUNT(*)\n\nWHERE Salary > 40000 ... GROUP BY Dno HAVING COUNT(*) >= 5 로 쓰면 '급여 40000 넘는 사원이 5명 이상'이 되어 뜻이 달라진다 (교재 질의 28의 함정). COMPANY 상태에는 5명 이상인 부서가 없어 결과가 비어 있다.", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["사원 5명 이상 조건은 그룹 전체 기준 → 중첩 질의에서 HAVING", "급여 > 40000은 WHERE", "바깥 GROUP BY Dno"], "lesson": "L5-4", "unit": "U5"}, {"id": "5-hv-5", "concept": "having", "type": "calc", "prompt": "총 근무 시간이 50시간 이상인 프로젝트의 이름과 총 근무 시간을 검색하시오.", "answer": "SELECT   P.Pname, SUM(W.Hours)\nFROM     PROJECT AS P, WORKS_ON AS W\nWHERE    P.Pnumber = W.Pno\nGROUP BY P.Pnumber, P.Pname\nHAVING   SUM(W.Hours) >= 50;\n\n-- 교재 COMPANY 상태에서 실행 결과 (4행)\nPname | SUM(W.Hours)\nProductX | 52.5\nProductZ | 50\nComputerization | 55\nNewbenefits | 55", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["GROUP BY 프로젝트", "HAVING SUM(Hours) >= 50"], "slot": 14, "pts": 10, "lesson": "L5-4", "unit": "U5"}, {"id": "5-hv-6", "concept": "having", "type": "blank", "prompt": "SQL 질의의 실행 순서: FROM → (a) → GROUP BY → (b) → SELECT → ORDER BY", "answer": "(a) WHERE / (b) HAVING", "accept": [["WHERE", "where"], ["HAVING", "having"]], "lesson": "L5-4", "unit": "U5"}, {"id": "5-hv-7", "concept": "having", "type": "short", "prompt": "WHERE 절과 HAVING 절의 차이를 쓰시오.", "answer": "WHERE는 그룹을 만들기 전에 개별 투플에 대한 조건으로 투플을 거른다. HAVING은 GROUP BY로 만든 그룹의 요약 정보(집계)에 대한 조건으로 그룹을 거른다. 집계 함수 조건은 WHERE에 쓸 수 없고 HAVING에 쓴다.", "keys": ["WHERE = 투플 조건 (그룹 전)", "HAVING = 그룹 조건 (집계 후)", "집계 조건은 HAVING에"], "lesson": "L5-4", "unit": "U5"}, {"id": "5-hv-8", "concept": "having", "type": "ox", "prompt": "HAVING은 GROUP BY와 함께 쓰여서 조건을 만족하는 그룹만 결과에 남긴다.", "answer": true, "lesson": "L5-4", "unit": "U5"}, {"id": "5-as-1", "concept": "assertion", "type": "mc", "prompt": "CREATE ASSERTION이 필요한 경우는?", "choices": ["PK를 지정할 때", "키·개체·참조 무결성으로 표현할 수 없는 일반 제약을 지정할 때", "뷰를 만들 때", "인덱스를 만들 때"], "answer": 1, "lesson": "L5-5", "unit": "U5"}, {"id": "5-as-2", "concept": "assertion", "type": "short", "prompt": "CREATE ASSERTION에서 조건을 보통 NOT EXISTS로 쓰는 이유를 설명하시오.", "answer": "원하는 조건을 '위반하는 투플을 고르는 질의'로 쓰고 NOT EXISTS로 감싸면, 위반 투플이 없을 때(결과가 비었을 때) 참이 되어 제약이 만족되고, 하나라도 있으면 거짓이 되어 위반이다. CHECK 조건은 모든 DB 상태에서 참이어야 한다.", "keys": ["위반 투플을 찾는 질의", "NOT EXISTS → 비면 참(만족)", "CHECK는 모든 상태에서 참이어야"], "slot": 6, "pts": 3, "lesson": "L5-5", "unit": "U5"}, {"id": "5-as-3", "concept": "assertion", "type": "calc", "prompt": "'사원의 급여는 그가 일하는 부서 관리자의 급여보다 많으면 안 된다'를 CREATE ASSERTION으로 쓰시오.", "answer": "CREATE ASSERTION SALARY_CONSTRAINT\nCHECK ( NOT EXISTS ( SELECT *\n                     FROM   EMPLOYEE E, EMPLOYEE M, DEPARTMENT D\n                     WHERE  E.Salary > M.Salary\n                       AND  E.Dno = D.Dnumber\n                       AND  D.Mgr_ssn = M.Ssn ) );", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["CREATE ASSERTION ... CHECK", "NOT EXISTS (위반 질의)", "E.Salary > M.Salary, E.Dno = D.Dnumber, D.Mgr_ssn = M.Ssn"], "lesson": "L5-5", "unit": "U5"}, {"id": "5-as-4", "concept": "assertion", "type": "calc", "prompt": "'모든 부서는 사원이 최소 1명 있어야 한다'를 CREATE ASSERTION으로 쓰시오.", "answer": "CREATE ASSERTION DEPT_HAS_EMP\nCHECK ( NOT EXISTS ( SELECT *\n                     FROM   DEPARTMENT D\n                     WHERE  NOT EXISTS ( SELECT *\n                                         FROM   EMPLOYEE E\n                                         WHERE  E.Dno = D.Dnumber ) ) );", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["CHECK ( NOT EXISTS (위반 = 사원 없는 부서) )", "안쪽 NOT EXISTS (그 부서 사원)"], "lesson": "L5-5", "unit": "U5"}, {"id": "5-as-5", "concept": "assertion", "type": "ox", "prompt": "Assertion의 CHECK 조건은 모든 DB 상태에서 참이어야 한다.", "answer": true, "lesson": "L5-5", "unit": "U5"}, {"id": "5-tr-1", "concept": "trigger-eca", "type": "mc", "prompt": "트리거의 ECA가 뜻하는 것은?", "choices": ["Event, Condition, Action", "Entity, Constraint, Attribute", "Execute, Check, Abort", "Event, Cascade, Assertion"], "answer": 0, "lesson": "L5-5", "unit": "U5"}, {"id": "5-tr-2", "concept": "trigger-eca", "type": "mc", "prompt": "트리거에서 조건(Condition)을 지정하는 절은?", "choices": ["CHECK", "IF", "WHEN", "WHERE"], "answer": 2, "lesson": "L5-5", "unit": "U5"}, {"id": "5-tr-3", "concept": "trigger-eca", "type": "short", "prompt": "트리거의 세 구성 요소를 SALARY_VIOLATION 예로 설명하시오.", "answer": "Event: 조건을 깰 수 있는 갱신 연산 — 사원 삽입, 급여 변경, 상사 변경 (BEFORE INSERT OR UPDATE OF SALARY, SUPERVISOR_SSN ON EMPLOYEE). Condition: WHEN 절 — 새 급여가 직속 상사의 급여보다 큰가. Action: 조건이 참이면 실행 — 외부 프로시저 INFORM_SUPERVISOR로 상사에게 알림.", "keys": ["Event = 갱신 연산 (BEFORE/AFTER)", "Condition = WHEN 절", "Action = SQL/트랜잭션/외부 프로그램"], "slot": 6, "pts": 3, "lesson": "L5-5", "unit": "U5"}, {"id": "5-tr-4", "concept": "trigger-eca", "type": "ox", "prompt": "트리거의 Condition은 선택 사항이며, 참일 때만 Action이 실행된다.", "answer": true, "lesson": "L5-5", "unit": "U5"}, {"id": "5-tr-5", "concept": "trigger-eca", "type": "short", "prompt": "Assertion과 Trigger의 차이를 쓰시오.", "answer": "Assertion은 항상 만족해야 하는 일반 제약을 선언하고, 위반하는 갱신을 막는다. Trigger는 특정 이벤트가 일어나고 조건이 맞으면 자동으로 실행할 동작(SQL, 트랜잭션, 외부 프로그램)을 지정한다 (예: 알림, 유도 데이터 갱신).", "keys": ["Assertion = 제약 (위반 막음)", "Trigger = 이벤트–조건–동작 (자동 실행)"], "slot": 6, "pts": 3, "lesson": "L5-5", "unit": "U5"}, {"id": "5-tr-6", "concept": "trigger-eca", "type": "mc", "prompt": "트리거의 용도로 교안에 나온 것이 '아닌' 것은?", "choices": ["DB 일관성 유지", "DB 갱신 모니터링", "유도 데이터 자동 갱신", "질의 최적화"], "answer": 3, "lesson": "L5-5", "unit": "U5"}, {"id": "5-tr-7", "concept": "trigger-eca", "type": "blank", "prompt": "트리거의 Event는 (a) 또는 AFTER 키워드로 갱신 연산 전/후 실행을 지정하고, FOR EACH (b) 는 영향받은 투플마다 실행함을 뜻한다.", "answer": "(a) BEFORE / (b) ROW", "accept": [["BEFORE", "before"], ["ROW", "row"]], "lesson": "L5-5", "unit": "U5"}, {"id": "5-vd-1", "concept": "view-def", "type": "mc", "prompt": "뷰(view)에 대한 설명으로 옳은 것은?", "choices": ["항상 물리적으로 저장된 테이블", "기본 테이블에서 유도된 가상 테이블", "DB 사본", "인덱스의 한 종류"], "answer": 1, "lesson": "L5-6", "unit": "U5"}, {"id": "5-vd-2", "concept": "view-def", "type": "ox", "prompt": "DROP VIEW로 뷰를 지우면 정의 테이블(기본 테이블)의 투플도 삭제된다.", "answer": false, "lesson": "L5-6", "unit": "U5"}, {"id": "5-vd-3", "concept": "view-def", "type": "calc", "prompt": "사원 이름(Fname, Lname), 프로젝트 이름, 근무 시간으로 된 뷰 WORKS_ON1을 정의하고, 그 뷰로 'ProductX'에서 일하는 사원의 이름을 검색하시오.", "answer": "CREATE VIEW WORKS_ON1\nAS SELECT Fname, Lname, Pname, Hours\n   FROM   EMPLOYEE, PROJECT, WORKS_ON\n   WHERE  Ssn = Essn AND Pno = Pnumber;\n\nSELECT Fname, Lname\nFROM   WORKS_ON1\nWHERE  Pname = 'ProductX';\n→ John Smith, Joyce English", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["CREATE VIEW ... AS SELECT", "세 테이블 조인", "뷰 질의는 단일 테이블처럼"], "lesson": "L5-6", "unit": "U5"}, {"id": "5-vd-4", "concept": "view-def", "type": "calc", "prompt": "부서 이름, 사원 수, 급여 합으로 된 뷰 DEPT_INFO(Dept_name, No_of_emps, Total_sal)를 정의하시오.", "answer": "CREATE VIEW DEPT_INFO (Dept_name, No_of_emps, Total_sal)\nAS SELECT   Dname, COUNT(*), SUM(Salary)\n   FROM     DEPARTMENT, EMPLOYEE\n   WHERE    Dnumber = Dno\n   GROUP BY Dname;", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["속성 이름 명시", "COUNT(*), SUM(Salary)", "GROUP BY Dname"], "lesson": "L5-6", "unit": "U5"}, {"id": "5-vd-5", "concept": "view-def", "type": "short", "prompt": "뷰를 쓰는 이유를 쓰시오.", "answer": "자주 쓰는 질의가 여러 테이블 조인이나 집계 같은 복잡한 조건을 포함할 때, 그걸 뷰로 정의해 두면 단일 테이블 질의처럼 간단하게 쓸 수 있다 (복잡한 질의 단순화). 또 특정 속성·투플만 보여주는 권한 부여에도 쓴다.", "keys": ["복잡한 질의 단순화 (단일 테이블처럼)", "권한 부여 (보안)"], "slot": 4, "pts": 3, "lesson": "L5-6", "unit": "U5"}, {"id": "5-vd-6", "concept": "view-def", "type": "calc", "prompt": "각 부서의 이름, 관리자의 이름과 급여로 된 뷰를 정의하고 쓸모를 쓰시오. (교안 연습 3)", "answer": "CREATE VIEW DEPT_INFO (DeptName, MgrFname, MgrLname, MgrSalary)\nAS SELECT D.Dname, E.Fname, E.Lname, E.Salary\n   FROM   DEPARTMENT AS D, EMPLOYEE AS E\n   WHERE  D.Mgr_ssn = E.Ssn;\n쓸모: 부서와 그 관리자 정보를 한 번에 보기 (Research–Franklin Wong 40000, …)", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["D.Mgr_ssn = E.Ssn 조인", "속성 이름 명시", "용도: 부서별 관리자 정보"], "lesson": "L5-6", "unit": "U5"}, {"id": "5-vi-1", "concept": "view-impl", "type": "mc", "prompt": "뷰 질의를 기본 테이블에 대한 질의로 바꿔서 처리하고 뷰를 물리적으로 유지하지 않는 방식은?", "choices": ["질의 수정 (query modification)", "뷰 실체화 (view materialization)", "즉시 갱신", "지연 갱신"], "answer": 0, "lesson": "L5-6", "unit": "U5"}, {"id": "5-vi-2", "concept": "view-impl", "type": "mc", "prompt": "실체화된 뷰를 '뷰 질의가 필요할 때' 갱신하는 방식은?", "choices": ["즉시 갱신", "주기적 갱신", "지연 갱신 (lazy)", "점진적 삭제"], "answer": 2, "lesson": "L5-6", "unit": "U5"}, {"id": "5-vi-3", "concept": "view-impl", "type": "short", "prompt": "뷰를 구현하는 두 방식(질의 수정, 뷰 실체화)을 비교하시오.", "answer": "질의 수정: 뷰 질의를 기본 테이블에 대한 질의로 변환해서 처리, 뷰를 물리적으로 유지하지 않음. 사용자는 편하지만 복잡한 뷰를 매번 다시 계산해서 비효율적. 뷰 실체화: 뷰가 처음 질의될 때 물리적인 뷰 테이블을 만들어 한동안 유지(이후 질의가 자주 올 거라 가정). 추가 저장 공간이 필요하고, 기본 테이블이 바뀌면 점진적 갱신으로 반영해야 한다.", "keys": ["질의 수정 = 변환, 저장 안 함, 매번 계산", "실체화 = 물리 테이블 유지, 저장 공간, 점진적 갱신"], "slot": 4, "pts": 3, "lesson": "L5-6", "unit": "U5"}, {"id": "5-vi-4", "concept": "view-impl", "type": "short", "prompt": "실체화된 뷰의 갱신 시점 세 가지(즉시, 주기적, 지연)를 장단점과 함께 쓰시오.", "answer": "즉시 갱신: 기본 테이블이 바뀌자마자 갱신. 항상 최신이지만 불필요하고 비효율적일 수 있음. 주기적 갱신: 주기적으로 갱신. 뷰 질의가 최신이 아닌 결과를 받을 수 있음. 지연 갱신: 뷰 질의가 필요할 때 갱신. 질의가 오기 전까지는 최신이 아님.", "keys": ["즉시 = 항상 최신, 비효율", "주기적 = 최신 아닐 수 있음", "지연 = 필요할 때"], "lesson": "L5-6", "unit": "U5"}, {"id": "5-vi-5", "concept": "view-impl", "type": "ox", "prompt": "DBMS는 정의 테이블이 바뀌면 뷰에 반영해서 뷰를 최신 상태로 유지할 책임이 있다.", "answer": true, "lesson": "L5-6", "unit": "U5"}, {"id": "5-vu-1", "concept": "view-update", "type": "mc", "prompt": "갱신이 허용되는 뷰는?", "choices": ["여러 테이블을 조인한 뷰", "단일 테이블에서 집계 없이 정의되고, PK와 DEFAULT 없는 NOT NULL 속성을 모두 포함한 뷰", "GROUP BY와 SUM을 쓴 뷰", "모든 뷰"], "answer": 1, "lesson": "L5-6", "unit": "U5"}, {"id": "5-vu-2", "concept": "view-update", "type": "short", "prompt": "UPDATE DEPT_INFO SET Total_sal = 100000 WHERE Dname = 'Research'; 가 불가능한 이유를 쓰시오.", "answer": "Total_sal은 SUM(Salary)로 계산된 집계 값이고 물리적으로 저장되지 않는다. 그 값을 100000으로 바꾸려면 Research 사원들의 급여를 어떻게 바꿔야 할지 정할 수 없으므로 의미가 없는 갱신이다.", "keys": ["집계로 계산된 값, 저장 안 됨", "기본 테이블 갱신으로 바꿀 방법이 없음 (의미 없음)"], "slot": 4, "pts": 3, "lesson": "L5-6", "unit": "U5"}, {"id": "5-vu-3", "concept": "view-update", "type": "short", "prompt": "WORKS_ON1 뷰(EMPLOYEE, PROJECT, WORKS_ON 조인)에 UPDATE WORKS_ON1 SET Pname = 'ProductY' WHERE Lname = 'Smith' AND Fname = 'John' AND Pname = 'ProductX'; 를 하면 생기는 문제를 쓰시오.", "answer": "이 갱신은 기본 테이블 갱신으로 여러 가지로 해석된다. (a) Smith의 WORKS_ON 투플의 Pno를 ProductY의 번호로 바꾸기 (Smith가 일하는 프로젝트를 바꿈, 의도에 맞음). (b) PROJECT에서 'ProductX'의 이름을 'ProductY'로 바꾸기 (뷰 결과는 같아 보이지만 ProductX에서 일하던 다른 모든 투플까지 바뀌는 부작용). 어느 쪽이 맞는지 정할 수 없어서 조인 뷰는 일반적으로 갱신할 수 없다.", "keys": ["해석 a: WORKS_ON의 Pno 변경", "해석 b: PROJECT의 Pname 변경 (부작용)", "여러 해석 → 갱신 불가"], "slot": 4, "pts": 3, "lesson": "L5-6", "unit": "U5"}, {"id": "5-vu-4", "concept": "view-update", "type": "ox", "prompt": "뷰 갱신은 그 갱신을 이루는 기본 릴레이션 갱신이 딱 하나뿐일 때 가능하다.", "answer": true, "lesson": "L5-6", "unit": "U5"}, {"id": "5-vu-5", "concept": "view-update", "type": "mc", "prompt": "단일 테이블 뷰가 갱신 가능하려면 뷰 속성에 반드시 포함되어야 하는 것은?", "choices": ["모든 속성", "FK 속성", "집계 속성", "기본 키와, DEFAULT가 없는 NOT NULL 속성 전부"], "answer": 3, "lesson": "L5-6", "unit": "U5"}, {"id": "5-vu-6", "concept": "view-update", "type": "short", "prompt": "단일 테이블 뷰가 갱신 가능하려면 왜 기본 키와 DEFAULT 없는 NOT NULL 속성을 모두 포함해야 하는지 쓰시오.", "answer": "뷰를 통해 투플을 삽입하면 뷰에 없는 속성은 기본 테이블에서 NULL(또는 DEFAULT)이 된다. PK가 빠지면 개체 무결성을, DEFAULT 없는 NOT NULL 속성이 빠지면 NOT NULL 제약을 어기게 된다. 또 PK가 있어야 뷰의 투플이 기본 테이블의 어느 투플인지 하나로 정해진다.", "keys": ["뷰에 없는 속성은 NULL로 들어감", "PK·NOT NULL 위반 방지", "PK로 대응 투플을 하나로 특정"], "lesson": "L5-6", "unit": "U5"}, {"id": "5-vu-7", "concept": "view-update", "type": "mc", "prompt": "갱신이 일반적으로 불가능한 뷰가 '아닌' 것은?", "choices": ["두 테이블을 조인한 뷰", "AVG를 쓴 뷰", "SELECT Ssn, Fname, Lname, Dno FROM EMPLOYEE WHERE Dno = 5 로 정의한 뷰 (Ssn이 PK, 나머지 NOT NULL 속성 포함)", "GROUP BY를 쓴 뷰"], "answer": 2, "lesson": "L5-6", "unit": "U5"}, {"id": "5-va-1", "concept": "view-auth", "type": "mc", "prompt": "5번 부서 관리자가 5번 부서 사원 정보만 보게 하는 방법은?", "choices": ["DEPT5EMP 뷰를 만들고 그 뷰에 대한 질의 권한만 부여", "EMPLOYEE에서 다른 부서 투플을 삭제", "EMPLOYEE 사본을 만듦", "트리거로 알림"], "answer": 0, "lesson": "L5-6", "unit": "U5"}, {"id": "5-va-2", "concept": "view-auth", "type": "calc", "prompt": "일반 사원이 다른 사원의 이름과 주소만 볼 수 있게 하는 뷰 BASIC_EMP_DATA를 정의하시오.", "answer": "CREATE VIEW BASIC_EMP_DATA AS\nSELECT Fname, Lname, Address\nFROM   EMPLOYEE;\n(사용자에게 EMPLOYEE가 아니라 이 뷰에 대한 질의 권한만 준다)", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["CREATE VIEW", "이름, 주소만 (속성 제한)"], "lesson": "L5-6", "unit": "U5"}, {"id": "5-va-3", "concept": "view-auth", "type": "ox", "prompt": "뷰는 권한 없는 사용자에게 특정 속성이나 특정 투플을 숨기는 데 쓸 수 있다.", "answer": true, "lesson": "L5-6", "unit": "U5"}, {"id": "6-in-1", "concept": "ra-intro", "type": "mc", "prompt": "관계 대수와 SQL의 차이로 옳은 것은?", "choices": ["관계 대수는 선언적, SQL은 절차적", "관계 대수는 절차적(어떻게), SQL은 선언적(무엇을)", "둘 다 절차적", "둘 다 선언적"], "answer": 1, "lesson": "L6-1", "unit": "U6"}, {"id": "6-in-2", "concept": "ra-intro", "type": "short", "prompt": "관계 대수가 중요한 이유 두 가지를 쓰시오.", "answer": "1) 관계 모델 연산(선택, 투영, 이름 바꾸기, 조인, 카티션 곱 등)의 형식적 기초이며 집합에 대한 수학 개념에 엄격하게 기반한다. 2) 결과를 얻기 위한 연산의 순서를 명시하므로 질의 처리와 최적화의 기반이 된다.", "keys": ["관계 모델 연산의 형식적 기초 (집합 기반)", "질의 처리·최적화의 기반 (연산 순서)"], "slot": 5, "pts": 3, "lesson": "L6-1", "unit": "U6"}, {"id": "6-in-3", "concept": "ra-intro", "type": "ox", "prompt": "관계 대수 연산의 결과는 항상 릴레이션이다 (닫힌 체계).", "answer": true, "lesson": "L6-1", "unit": "U6"}, {"id": "6-qt-1", "concept": "query-tree", "type": "mc", "prompt": "질의 트리에서 잎 노드와 내부 노드는 각각?", "choices": ["연산, 릴레이션", "SQL 절, 속성", "입력 릴레이션, 관계 대수 연산", "조건, 결과"], "answer": 2, "lesson": "L6-1", "unit": "U6"}, {"id": "6-qt-2", "concept": "query-tree", "type": "ox", "prompt": "질의 트리는 루트에서 시작해서 잎에서 끝나는 순서로 실행된다.", "answer": false, "explain": "잎(입력 릴레이션)에서 시작해 루트에서 끝난다.", "lesson": "L6-1", "unit": "U6"}, {"id": "6-qt-3", "concept": "query-tree", "type": "short", "prompt": "질의 처리(query processing)란 무엇이고, 질의 트리와 어떤 관계인지 쓰시오.", "answer": "질의 처리는 SQL 질의를 실행할 수 있는 여러 전략(질의 트리, 실행 계획) 중 적절한 것을 고르는 과정이다. SQL 하나에 질의 트리가 여러 개 있을 수 있고, 그중 최선을 고르는 것이 질의 최적화다.", "keys": ["여러 실행 전략 중 선택", "SQL 하나에 질의 트리 여러 개", "최선 선택 = 최적화"], "slot": 5, "pts": 3, "lesson": "L6-1", "unit": "U6"}, {"id": "6-qt-4", "concept": "query-tree", "type": "calc", "prompt": "다음 SQL을 질의 트리의 실행 순서대로 관계 대수 단계(중간 릴레이션)로 쓰시오.\nSELECT P.Pnumber, P.Dnum, E.Lname, E.Address, E.Bdate\nFROM   PROJECT P, DEPARTMENT D, EMPLOYEE E\nWHERE  P.Dnum = D.Dnumber AND D.Mgr_ssn = E.Ssn AND P.Plocation = 'Stafford';", "answer": "STAFFORD_PROJS ← σ Plocation='Stafford' (PROJECT)\nCONTR_DEPTS    ← STAFFORD_PROJS ⋈ Dnum=Dnumber DEPARTMENT\nPROJ_DEPT_MGRS ← CONTR_DEPTS ⋈ Mgr_ssn=Ssn EMPLOYEE\nRESULT         ← π Pnumber, Dnum, Lname, Address, Bdate (PROJ_DEPT_MGRS)\n(잎: PROJECT, DEPARTMENT, EMPLOYEE / 루트: π)", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["σ Plocation 먼저 (잎 쪽)", "⋈ Dnum=Dnumber", "⋈ Mgr_ssn=Ssn", "π 루트"], "lesson": "L6-1", "unit": "U6"}, {"id": "6-sel-1", "concept": "ra-select", "type": "mc", "prompt": "σ Dno=4 (EMPLOYEE)의 결과 차수(속성 수)는?", "choices": ["1", "4", "EMPLOYEE와 같다 (10)", "조건을 만족하는 투플 수"], "answer": 2, "lesson": "L6-2", "unit": "U6"}, {"id": "6-sel-2", "concept": "ra-select", "type": "mc", "prompt": "관계 대수의 σ에 대응하는 SQL 부분은?", "choices": ["SELECT 절", "WHERE 절", "FROM 절", "GROUP BY 절"], "answer": 1, "lesson": "L6-2", "unit": "U6"}, {"id": "6-sel-3", "concept": "ra-select", "type": "ox", "prompt": "σ c1(σ c2(R)) = σ c2(σ c1(R)) 이 성립한다 (교환 법칙).", "answer": true, "lesson": "L6-2", "unit": "U6"}, {"id": "6-sel-4", "concept": "ra-select", "type": "blank", "prompt": "σ는 릴레이션에서 조건을 만족하는 투플을 고르는 (a) 필터링이고, π는 원하는 열만 남기는 (b) 필터링이다.", "answer": "(a) 수평 / (b) 수직", "accept": [["수평", "horizontal", "가로"], ["수직", "vertical", "세로"]], "lesson": "L6-2", "unit": "U6"}, {"id": "6-sel-5", "concept": "ra-select", "type": "calc", "prompt": "4번 부서에서 급여가 25000을 넘거나, 5번 부서에서 급여가 30000을 넘는 사원 투플을 관계 대수로 쓰시오.", "answer": "σ (Dno=4 AND Salary>25000) OR (Dno=5 AND Salary>30000) (EMPLOYEE)\n\n-- COMPANY 상태에서의 결과 (3행)\nFname | Lname | Dno | Salary\nFranklin | Wong | 5 | 40000\nJennifer | Wallace | 4 | 43000\nRamesh | Narayan | 5 | 38000", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["σ 하나에 AND/OR 조건", "(Dno=4 AND Salary>25000) OR (Dno=5 AND Salary>30000)"], "lesson": "L6-2", "unit": "U6"}, {"id": "6-sel-6", "concept": "ra-select", "type": "short", "prompt": "σ의 조건(selection condition)에 쓸 수 있는 절의 형태와 비교 연산자를 쓰고, 순서가 없는 값의 경우를 쓰시오.", "answer": "절의 형태: <속성> <비교연산> <상수> 또는 <속성> <비교연산> <속성>, 절들은 AND, OR로 연결. 비교 연산자: =, <, ≤, >, ≥, ≠. 순서가 있는 값(숫자, 날짜)은 모두 쓸 수 있지만 순서가 없는 값(예: 색깔)은 =, ≠만.", "keys": ["<속성> op <상수/속성>", "AND, OR 연결", "순서 없는 값은 =, ≠만"], "lesson": "L6-2", "unit": "U6"}, {"id": "6-sel-7", "concept": "ra-select", "type": "calc", "prompt": "σ Dno=5 AND Salary>=30000 (EMPLOYEE) 와 같은 결과를 내는 SQL을 쓰고, 이 σ를 두 개의 σ로 나눠 쓰시오.", "answer": "SQL: SELECT * FROM EMPLOYEE WHERE Dno = 5 AND Salary >= 30000;\n두 개로: σ Dno=5 (σ Salary>=30000 (EMPLOYEE))  (또는 순서를 바꿔도 같음)\n결과: Smith, Wong, Narayan", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["SELECT * ... WHERE (σ = WHERE)", "σ를 중첩해 나눔 (교환 가능)"], "lesson": "L6-2", "unit": "U6"}, {"id": "6-pro-1", "concept": "ra-project", "type": "mc", "prompt": "COMPANY 상태에서 π Sex, Salary (EMPLOYEE)의 결과 투플 수는?", "choices": ["8", "7", "6", "2"], "answer": 1, "lesson": "L6-2", "unit": "U6"}, {"id": "6-pro-2", "concept": "ra-project", "type": "mc", "prompt": "π Sex, Salary (EMPLOYEE)와 정확히 같은 결과를 내는 SQL은?", "choices": ["SELECT Sex, Salary FROM EMPLOYEE;", "SELECT ALL Sex, Salary FROM EMPLOYEE;", "SELECT DISTINCT Sex, Salary FROM EMPLOYEE;", "SELECT * FROM EMPLOYEE;"], "answer": 2, "lesson": "L6-2", "unit": "U6"}, {"id": "6-pro-3", "concept": "ra-project", "type": "ox", "prompt": "π의 속성 리스트에 키 속성이 포함되면 결과에 중복 투플이 생기지 않는다.", "answer": true, "lesson": "L6-2", "unit": "U6"}, {"id": "6-pro-4", "concept": "ra-project", "type": "short", "prompt": "π 연산이 중복을 제거하는 이유와, 중복이 생기는 경우를 쓰시오.", "answer": "관계 대수는 집합에 기반하므로 π의 결과도 서로 다른 투플의 집합이어야 한다. 속성 리스트에 비키 속성만 있으면 서로 다른 투플이 같은 값 조합을 가질 수 있어 중복이 생기는데, π는 이를 제거한다.", "keys": ["결과는 집합 (중복 제거)", "비키 속성만 투영하면 중복 발생"], "lesson": "L6-2", "unit": "U6"}, {"id": "6-pro-5", "concept": "ra-project", "type": "calc", "prompt": "모든 사원의 성, 이름, 급여를 관계 대수로 쓰시오.", "answer": "π Lname, Fname, Salary (EMPLOYEE)\n\n-- COMPANY 상태에서의 결과 (8행)\nLname | Fname | Salary\nSmith | John | 30000\nWong | Franklin | 40000\nZelaya | Alicia | 25000\nWallace | Jennifer | 43000\nNarayan | Ramesh | 38000\nEnglish | Joyce | 25000\nJabbar | Ahmad | 25000\nBorg | James | 55000", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["π Lname, Fname, Salary"], "lesson": "L6-2", "unit": "U6"}, {"id": "6-pro-6", "concept": "ra-project", "type": "calc", "prompt": "5번 부서 사원들이 받는 급여 값들을 중복 없이 관계 대수로 쓰시오.", "answer": "π Salary (σ Dno=5 (EMPLOYEE))\n\n-- COMPANY 상태에서의 결과 (4행)\nSalary\n30000\n40000\n38000\n25000", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["σ Dno=5 먼저", "π Salary (중복 자동 제거)"], "lesson": "L6-2", "unit": "U6"}, {"id": "6-pro-7", "concept": "ra-project", "type": "blank", "prompt": "π의 결과 차수는 (a) 에 있는 속성 수와 같고, σ의 결과 차수는 (b) 의 차수와 같다.", "answer": "(a) 속성 리스트 / (b) R", "accept": [["속성 리스트", "attribute list", "리스트", "속성 목록"], ["R", "원래 릴레이션", "입력 릴레이션", "릴레이션"]], "lesson": "L6-2", "unit": "U6"}, {"id": "6-ren-1", "concept": "ra-rename", "type": "mc", "prompt": "ρ S(B₁, …, Bₙ)(R) 의 뜻은?", "choices": ["릴레이션 이름을 S로, 속성 이름을 B₁…Bₙ으로 바꿈", "S와 R을 조인", "R에서 B₁…Bₙ만 투영", "S를 R로 바꿈"], "answer": 0, "lesson": "L6-2", "unit": "U6"}, {"id": "6-ren-2", "concept": "ra-rename", "type": "ox", "prompt": "SQL에서 이름 바꾸기는 AS(별칭)로 한다.", "answer": true, "lesson": "L6-2", "unit": "U6"}, {"id": "6-ren-3", "concept": "ra-rename", "type": "calc", "prompt": "5번 부서 사원의 이름, 성, 급여를 구하고 결과 속성 이름을 First_name, Last_name, Salary로 바꾸는 관계 대수를 쓰고, 같은 SQL을 쓰시오.", "answer": "TEMP ← σ Dno=5 (EMPLOYEE)\nR(First_name, Last_name, Salary) ← π Fname, Lname, Salary (TEMP)\n(또는 ρ (First_name, Last_name, Salary) (π Fname, Lname, Salary (TEMP)))\n\nSQL: SELECT E.Fname AS First_name, E.Lname AS Last_name, E.Salary AS Salary\n     FROM EMPLOYEE AS E WHERE E.Dno = 5;", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["σ Dno=5", "π 후 ρ (또는 R(속성들) ←)", "SQL은 AS"], "lesson": "L6-2", "unit": "U6"}, {"id": "6-ren-4", "concept": "ra-rename", "type": "short", "prompt": "관계 대수에서 RENAME이 필요한 경우를 두 가지 쓰시오.", "answer": "1) 자연 조인에서 조인할 속성의 이름이 서로 다를 때 이름을 맞추려고 (예: Dnumber → Dnum). 2) 합집합 등 집합 연산 결과나 중간 결과의 속성 이름을 원하는 대로 바꿀 때 (예: π Super_ssn을 Ssn으로). 같은 릴레이션을 두 번 쓸 때 구별하려고도 쓴다.", "keys": ["자연 조인 속성 이름 맞추기", "집합 연산·결과 이름 맞추기 / 자기 조인"], "lesson": "L6-2", "unit": "U6"}, {"id": "6-seq-1", "concept": "ra-sequence", "type": "mc", "prompt": "π Fname, Lname, Salary (σ Dno=5 (EMPLOYEE)) 를 중간 릴레이션으로 나눈 것은?", "choices": ["DEP5 ← π Fname (EMPLOYEE); RESULT ← σ Dno=5 (DEP5)", "DEP5_EMPS ← σ Dno=5 (EMPLOYEE); RESULT ← π Fname, Lname, Salary (DEP5_EMPS)", "RESULT ← EMPLOYEE × DEPARTMENT", "나눌 수 없다"], "answer": 1, "lesson": "L6-2", "unit": "U6"}, {"id": "6-seq-2", "concept": "ra-sequence", "type": "ox", "prompt": "복잡한 질의는 하나의 식으로 쓰는 것보다 중간 결과 릴레이션에 이름을 붙여 단계별로 쓰는 것이 보통 더 쉽다.", "answer": true, "lesson": "L6-2", "unit": "U6"}, {"id": "6-seq-3", "concept": "ra-sequence", "type": "calc", "prompt": "급여가 30000 이상인 사원의 성과 급여를 (1) 하나의 중첩 식으로, (2) 중간 릴레이션으로 나눠서 쓰시오.", "answer": "(1) π Lname, Salary (σ Salary>=30000 (EMPLOYEE))\n(2) RICH ← σ Salary>=30000 (EMPLOYEE)\n    RESULT ← π Lname, Salary (RICH)\n\n-- COMPANY 상태에서의 결과 (5행)\nLname | Salary\nSmith | 30000\nWong | 40000\nWallace | 43000\nNarayan | 38000\nBorg | 55000", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["중첩 식", "중간 릴레이션 두 줄"], "lesson": "L6-2", "unit": "U6"}, {"id": "6-seq-4", "concept": "ra-sequence", "type": "short", "prompt": "관계 대수식을 여러 연산으로 쓸 때의 두 방법을 쓰시오.", "answer": "방법 1: 중간 릴레이션에 이름을 붙여 연산 순서를 명시한다 (DEP5_EMPS ← σ…; RESULT ← π…). 방법 2: 연산을 중첩해서 하나의 관계 대수식으로 쓴다 (π…(σ…(EMPLOYEE))).", "keys": ["중간 릴레이션 이름 붙이기", "중첩해서 한 식으로"], "lesson": "L6-2", "unit": "U6"}, {"id": "6-set-1", "concept": "ra-setops", "type": "mc", "prompt": "두 릴레이션이 '타입 호환'이려면?", "choices": ["튜플 수가 같다", "속성 이름이 같다", "속성 수가 같고 대응 속성의 도메인이 같다", "같은 PK를 가진다"], "answer": 2, "lesson": "L6-3", "unit": "U6"}, {"id": "6-set-2", "concept": "ra-setops", "type": "ox", "prompt": "R − S = S − R 이다.", "answer": false, "explain": "차집합은 교환 법칙이 성립하지 않는다.", "lesson": "L6-3", "unit": "U6"}, {"id": "6-set-3", "concept": "ra-setops", "type": "ox", "prompt": "R ∪ S = S ∪ R, R ∩ S = S ∩ R 이다.", "answer": true, "lesson": "L6-3", "unit": "U6"}, {"id": "6-set-4", "concept": "ra-setops", "type": "calc", "prompt": "5번 부서에서 일하거나, 5번 부서에서 일하는 사원을 직접 감독하는 사원의 Ssn을 관계 대수로 쓰시오.", "answer": "DEP5_EMPS    ← σ Dno=5 (EMPLOYEE)\nRESULT1      ← π Ssn (DEP5_EMPS)\nRESULT2(Ssn) ← π Super_ssn (DEP5_EMPS)\nRESULT       ← RESULT1 ∪ RESULT2\n\n-- COMPANY 상태에서의 결과 (5행)\nSsn\n123456789\n333445555\n453453453\n666884444\n888665555", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["σ Dno=5", "π Ssn과 π Super_ssn", "이름 맞추기 RESULT2(Ssn)", "∪"], "lesson": "L6-3", "unit": "U6"}, {"id": "6-set-5", "concept": "ra-setops", "type": "calc", "prompt": "프로젝트에서 일하는 사원 중 부양가족이 있는 사원의 Ssn을 교집합으로 쓰시오.", "answer": "WORKERS(Ssn)  ← π Essn (WORKS_ON)\nWITH_DEPS(Ssn) ← π Essn (DEPENDENT)\nRESULT        ← WORKERS ∩ WITH_DEPS\n\n-- COMPANY 상태에서의 결과 (3행)\nEssn\n123456789\n333445555\n987654321", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["π Essn (WORKS_ON)", "π Essn (DEPENDENT)", "∩"], "lesson": "L6-3", "unit": "U6"}, {"id": "6-set-6", "concept": "ra-setops", "type": "calc", "prompt": "STUDENT(Fn, Ln) = {(Susan, Yao), (Ramesh, Shah), (Johnny, Kohler), (Barbara, Jones), (Amy, Ford), (Jimmy, Wang), (Ernest, Gilbert)}, INSTRUCTOR(Fname, Lname) = {(John, Smith), (Ricardo, Browne), (Susan, Yao), (Francis, Johnson), (Ramesh, Shah)}일 때 다음 결과의 투플 수를 쓰시오.\n(1) STUDENT ∪ INSTRUCTOR  (2) STUDENT ∩ INSTRUCTOR  (3) STUDENT − INSTRUCTOR  (4) INSTRUCTOR − STUDENT", "answer": "(1) 10 (7 + 5 − 겹치는 2)\n(2) 2 (Susan Yao, Ramesh Shah)\n(3) 5 (Johnny Kohler, Barbara Jones, Amy Ford, Jimmy Wang, Ernest Gilbert)\n(4) 3 (John Smith, Ricardo Browne, Francis Johnson)", "keys": ["(1) 10", "(2) 2", "(3) 5", "(4) 3"], "slot": 16, "pts": 7, "lesson": "L6-3", "unit": "U6"}, {"id": "6-set-7", "concept": "ra-setops", "type": "blank", "prompt": "합집합·교집합·차집합의 결과 속성 이름은 관례상 (a) 릴레이션을 따르고, 결과에서 (b) 은 제거된다.", "answer": "(a) 첫 번째 / (b) 중복", "accept": [["첫 번째", "첫번째", "왼쪽", "R", "앞"], ["중복", "중복 투플", "duplicate", "duplicates"]], "lesson": "L6-3", "unit": "U6"}, {"id": "6-cp-1", "concept": "ra-cartesian", "type": "mc", "prompt": "R(3개 속성, 4개 투플) × S(2개 속성, 5개 투플)의 결과는?", "choices": ["5개 속성, 9개 투플", "6개 속성, 20개 투플", "3개 속성, 4개 투플", "5개 속성, 20개 투플"], "answer": 3, "lesson": "L6-3", "unit": "U6"}, {"id": "6-cp-2", "concept": "ra-cartesian", "type": "ox", "prompt": "카티션 곱은 타입 호환이 아닌 릴레이션에도 적용할 수 있다.", "answer": true, "lesson": "L6-3", "unit": "U6"}, {"id": "6-cp-3", "concept": "ra-cartesian", "type": "short", "prompt": "카티션 곱이 그 자체로는 대개 의미가 없는 이유와, 유용하게 쓰는 방법을 쓰시오.", "answer": "모든 투플 조합을 만들기 때문에 서로 관련 없는 투플까지 이어 붙여진다 (예: 여성 사원 3명 × 부양가족 7명 = 21행, 대부분 무관). 뒤에 SELECT로 관련 있는 투플(Ssn = Essn)만 고르면 유용하다 → 이것이 JOIN.", "keys": ["모든 조합 → 무관한 투플 포함", "뒤에 σ로 관련 투플 선택 = JOIN"], "lesson": "L6-3", "unit": "U6"}, {"id": "6-cp-4", "concept": "ra-cartesian", "type": "calc", "prompt": "여성 사원의 부양가족 이름을, 사원 이름과 함께 카티션 곱과 σ를 써서 관계 대수로 쓰시오.", "answer": "FEMALE_EMPS       ← σ Sex='F' (EMPLOYEE)\nEMPNAMES          ← swer": "ρ R(Dno, No_of_employees, Average_sal) ( Dno ℑ COUNT Ssn, AVERAGE Salary (EMPLOYEE) )\n\n-- COMPANY 상태에서의 결과 (3행)\nDno | COUNT(Ssn) | AVG(Salary)\n1 | 1 | 55000\n4 | 3 | 31000\n5 | 4 | 33250", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["그룹화 속성 Dno (ℑ 왼쪽)", "함수 리스트 COUNT Ssn, AVERAGE Salary", "ρ로 이름 바꾸기"], "lesson": "L6-5", "unit": "U6"}, {"id": "6-agg-4", "concept": "ra-aggregate", "type": "calc", "prompt": "프로젝트마다 프로젝트 번호와 총 근무 시간을 관계 대수로 쓰시오.", "answer": "Pno ℑ SUM Hours (WORKS_ON)\n\n-- COMPANY 상태에서의 결과 (6행)\nPno | SUM(Hours)\n1 | 52.5\n2 | 37.5\n3 | 50\n10 | 55\n20 | 25\n30 | 55", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["그룹화 속성 Pno", "SUM Hours"], "lesson": "L6-5", "unit": "U6"}, {"id": "6-agg-5", "concept": "ra-aggregate", "type": "short", "prompt": "기본 관계 대수 연산만으로 표현할 수 없는 요청 세 가지를 쓰시오.", "answer": "1) 집계 함수(SUM, AVERAGE, MAXIMUM, MINIMUM, COUNT)를 쓰는 요청. 2) 속성 값으로 투플을 그룹화하고 그룹마다 집계를 적용하는 요청. 3) 외부 조인 요청.", "keys": ["집계", "그룹별 집계", "외부 조인"], "lesson": "L6-5", "unit": "U6"}, {"id": "6-agg-6", "concept": "ra-aggregate", "type": "blank", "prompt": "<그룹화 속성> ℑ <함수 리스트> (R)의 결과는 (a) 속성과 함수 리스트 원소마다 속성 하나로 이루어진다. 그룹화 속성이 없으면 결과는 투플 (b) 개다.", "answer": "(a) 그룹화 / (b) 1", "accept": [["그룹화", "grouping", "그룹화 속성", "그룹"], ["1", "하나", "한", "one"]], "lesson": "L6-5", "unit": "U6"}, {"id": "6-ap-1", "concept": "ra-agg-props", "type": "ox", "prompt": "관계 대수의 집계 함수는 적용할 때 중복을 제거한다.", "answer": false, "explain": "중복을 제거하지 않는다 (급여 합·평균을 제대로 구하려고).", "lesson": "L6-5", "unit": "U6"}, {"id": "6-ap-2", "concept": "ra-agg-props", "type": "mc", "prompt": "관계 대수 집계에서 NULL 값은?", "choices": ["0으로 취급", "고려하지 않는다", "오류를 낸다", "가장 작은 값으로 취급"], "answer": 1, "lesson": "L6-5", "unit": "U6"}, {"id": "6-ap-3", "concept": "ra-agg-props", "type": "short", "prompt": "'관계 대수는 닫힌 수학 체계'라는 말이 집계 함수에 대해 뜻하는 바를 쓰시오.", "answer": "집계 결과도 스칼라 숫자가 아니라 릴레이션이다. 값이 하나, 투플이 하나뿐이어도 릴레이션이라서 다른 관계 대수 연산의 입력으로 쓸 수 있다.", "keys": ["결과도 릴레이션 (스칼라 아님)", "값·투플 하나여도"], "lesson": "L6-5", "unit": "U6"}, {"id": "6-oj-1", "concept": "ra-outer", "type": "mc", "prompt": "EMPLOYEE ⟕ Ssn=Mgr_ssn DEPARTMENT 결과에 대한 설명으로 옳은 것은? (COMPANY 상태)", "choices": ["관리자 3명만 나온다", "부서 3개만 나온다", "사원 8명 모두 나오고, 관리하지 않는 사원의 부서 속성은 NULL", "결과가 비어 있다"], "answer": 2, "lesson": "L6-5", "unit": "U6"}, {"id": "6-oj-2", "concept": "ra-outer", "type": "blank", "prompt": "⟕는 (a) 외부 조인, ⟖는 (b) 외부 조인, ⟗는 (c) 외부 조인이다.", "answer": "(a) LEFT / (b) RIGHT / (c) FULL", "accept": [["LEFT", "left", "왼쪽"], ["RIGHT", "right", "오른쪽"], ["FULL", "full", "완전", "양쪽"]], "lesson": "L6-5", "unit": "U6"}, {"id": "6-oj-3", "concept": "ra-outer", "type": "calc", "prompt": "모든 사원의 이름과, 그 사원이 부서를 관리하면 그 부서 이름(관리하지 않으면 NULL)을 관계 대수로 쓰시오.", "answer": "TEMP   ← EMPLOYEE ⟕ Ssn=Mgr_ssn DEPARTMENT\nRESULT ← π Fname, Minit, Lname, Dname (TEMP)\n\n-- COMPANY 상태에서의 결과 (8행)\nFname | Minit | Lname | Dname\nJohn | B | Smith | NULL\nFranklin | T | Wong | Research\nAlicia | J | Zelaya | NULL\nJennifer | S | Wallace | Administration\nRamesh | K | Na LOC * DEPARTMENT                    (공통 속성 Dnumber로 자연 조인)\nHMGR   ← HDEPT ⋈ Mgr_ssn=Ssn EMPLOYEE\nRESULT ← π Dname, Lname (HMGR)\n\n-- COMPANY 상태에서의 결과 (2행)\nDname | Lname\nHeadquarters | Borg\nResearch | Wong", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["σ Dlocation='Houston'", "* DEPARTMENT (Dnumber)", "⋈ Mgr_ssn=Ssn", "π Dname, Lname"], "lesson": "L6-6", "unit": "U6"}, {"id": "6-pj-5", "concept": "ra-practice-join", "type": "short", "prompt": "관계 대수 질의를 작성할 때의 일반적인 순서(요령)를 쓰시오.", "answer": "조건이 걸린 릴레이션에 먼저 σ를 적용해 투플 수를 줄이고, FK–PK 관계를 따라 ⋈로 필요한 릴레이션을 잇고, 마지막에 π로 원하는 속성만 남긴다. 각 단계를 중간 릴레이션 이름으로 나눠 쓴다.", "keys": ["σ 먼저", "FK–PK 따라 ⋈", "마지막에 π", "중간 릴레이션으로 나눔"], "lesson": "L6-6", "unit": "U6"}, {"id": "6-pj-6", "concept": "ra-practice-join", "type": "ox", "prompt": "관계 대수에서 σ를 조인보다 먼저 적용하면 중간 결과가 작아져 효율적이다.", "answer": true, "lesson": "L6-6", "unit": "U6"}, {"id": "6-pu-1", "concept": "ra-practice-union", "type": "calc", "prompt": "성이 'Smith'인 사원이 일꾼으로든, 그 프로젝트를 통제하는 부서의 관리자로든 관련된 프로젝트 번호를 관계 대수로 쓰시오. (연습 3)", "answer": "SMITHS(Essn)             ← π Ssn (σ Lname='Smith' (EMPLOYEE))\nSMITH_WORKER_PROJS       ← π Pno (WORKS_ON * SMITHS)\nMGRS                     ← π Lname, Dnumber (EMPLOYEE ⋈ Ssn=Mgr_ssn DEPARTMENT)\nSMITH_MANAGED_DEPTS(Dnum) ← π Dnumber (σ Lname='Smith' (MGRS))\nSMITH_MGR_PROJS(Pno)     ← π Pnumber (SMITH_MANAGED_DEPTS * PROJECT)\nRESULT                   ← SMITH_WORKER_PROJS ∪ SMITH_MGR_PROJS\n\n-- COMPANY 상태에서의 결과 (2행)\nPno\n1\n2", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["일꾼 쪽: SMITHS(Essn) * WORKS_ON", "관리자 쪽: Mgr_ssn 조인 → Dnum → PROJECT", "속성 이름을 Pno로 맞춤", "∪"], "slot": 15, "pts": 10, "lesson": "L6-6", "unit": "U6"}, {"id": "6-pu-2", "concept": "ra-practice-union", "type": "calc", "prompt": "4번 부서가 통제하는 프로젝트이거나, 'Wong'이 일하는 프로젝트의 번호를 관계 대수로 쓰시오.", "answer": "D4_PROJS(Pno) ← π Pnumber (σ Dnum=4 (PROJECT))\nWONG(Essn)    ← π Ssn (σ Lname='Wong' (EMPLOYEE))\nWONG_PROJS    ← π Pno (WORKS_ON * WONG)\nRESULT        ← D4_PROJS ∪ WONG_PROJS\n\n-- COMPANY 상태에서의 결과 (5행)\nPnumber\n2\n3\n10\n20\n30", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["σ Dnum=4 → π (이름 Pno)", "Wong의 프로젝트", "∪ (타입 호환)"], "lesson": "L6-6", "unit": "U6"}, {"id": "6-pu-3", "concept": "ra-practice-union", "type": "short", "prompt": "연습 3에서 SMITHS(Essn), SMITH_MGR_PROJS(Pno)처럼 속성 이름을 바꾸는 이유를 쓰시오.", "answer": "SMITHS(Essn)은 WORKS_ON과 자연 조인할 때 Essn으로 조인되게 하려고, SMITH_MGR_PROJS(Pno)는 SMITH_WORKER_PROJS(Pno)와 ∪할 때 두 결과의 속성 이름을 맞추려고(타입 호환, 결과 속성 이름 통일) 바꾼다.", "keys": ["자연 조인 속성 맞추기", "∪를 위한 이름 맞추기"], "lesson": "L6-6", "unit": "U6"}, {"id": "6-pu-4", "concept": "ra-practice-union", "type": "calc", "prompt": "Houston에 사는 사원이거나 Houston에 있는 프로젝트에서 일하는 사원의 Ssn을 관계 대수로 쓰시오.", "answer": "LIVE(Ssn)  ← π Ssn (σ Address LIKE '%Houston%' (EMPLOYEE))\nHP(Pno)    ← π Pnumber (σ Plocation='Houston' (PROJECT))\nWORK(Ssn)  ← π Essn (WORKS_ON * HP)\nRESULT     ← LIVE ∪ WORK\n\n-- COMPANY 상태에서의 결과 (7행)\nSsn\n123456789\n333445555\n453453453\n666884444\n888665555\n987654321\n987987987", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["사는 곳 σ → π Ssn", "Houston 프로젝트 → WORKS_ON → π Essn (이름 Ssn)", "∪"], "lesson": "L6-6", "unit": "U6"}, {"id": "6-pd-1", "concept": "ra-practice-diff", "type": "calc", "prompt": "부양가족이 없는 사원의 이름을 관계 대수로 쓰시오. (연습 4)", "answer": "ALL_EMPS            ← π Ssn (EMPLOYEE)\nEMPS_WITH_DEPS(Ssn) ← π Essn (DEPENDENT)\nEMPS_WITHOUT_DEPS   ← ALL_EMPS − EMPS_WITH_DEPS\nRESULT              ← π Lname, Fname (EMPS_WITHOUT_DEPS * EMPLOYEE)\n\n-- COMPANY 상태에서의 결과 (5행)\nLname | Fname\nZelaya | Alicia\nNarayan | Ramesh\nEnglish | Joyce\nJabbar | Ahmad\nBorg | James", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["π Ssn (EMPLOYEE)", "π Essn (DEPENDENT), 이름 Ssn", "−", "EMPLOYEE와 자연 조인 후 π"], "slot": 15, "pts": 10, "lesson": "L6-6", "unit": "U6"}, {"id": "6-pd-2", "concept": "ra-practice-diff", "type": "calc", "prompt": "부양가족이 하나 이상 있는 관리자의 이름을 관계 대수로 쓰시오. (연습 5)", "answer": "MGRS(Ssn)           ← π Mgr_ssn (DEPARTMENT)\nEMPS_WITH_DEPS(Ssn) ← π Essn (DEPENDENT)\nMGRS_WITH_DEPS      ← MGRS ∩ EMPS_WITH_DEPS\nRESULT              ← π Lname, Fname (MGRS_WITH_DEPS * EMPLOYEE)\n\n-- COMPANY 상태에서의 결과 (2행)\nLname | Fname\nWong | Franklin\nWallace | Jennifer", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEPENDENT(Essn, Dependent_name, Sex, Bdate, Relationship)\nPK: Ssn / Dnumber / (Dnumber, Dlocation) / Pnumber / (Essn, Pno) / (Essn, Dependent_name)\nFK: Super_ssn→EMPLOYEE, Dno→DEPARTMENT, Mgr_ssn→EMPLOYEE, Dnum→DEPARTMENT,\n    WORKS_ON.Essn→EMPLOYEE, Pno→PROJECT, DEPENDENT.Essn→EMPLOYEE", "keys": ["π Mgr_ssn → Ssn", "π Essn → Ssn", "∩", "자연 조인 후 π"], "slot": 15, "pts": 10, "lesson": "L6-6", "unit": "U6"}, {"id": "6-pd-3", "concept": "ra-practice-diff", "type": "calc", "prompt": "어떤 프로젝트에서도 일하지 않는 사원의 이름을 관계 대수로 쓰시오.", "answer": "ALL_EMPS     ← π Ssn (EMPLOYEE)\nWORKERS(Ssn) ← π Essn (WORKS_ON)\nIDLE         ← ALL_EMPS − WORKERS\nRESULT       ← π Fname, Lname (IDLE * EMPLOYEE)\n\n-- COMPANY 상태에서의 결과 (0행)\nFname | Lname\n\nCOMPANY 상태에선 모든 사원이 WORKS_ON에 있어 결과가 비어 있다.", "code": "EMPLOYEE(Fname, Minit, Lname, Ssn, Bdate, Address, Sex, Salary, Super_ssn, Dno)\nDEPARTMENT(Dname, Dnumber, Mgr_ssn, Mgr_start_date)\nDEPT_LOCATIONS(Dnumber, Dlocation)\nPROJECT(Pname, Pnumber, Plocation, Dnum)\nWORKS_ON(Essn, Pno, Hours)\nDEP y-alias": 2, "missing-where-star": 2, "multiset-distinct": 3, "set-ops": 2, "order-arith": 2, "nested-in": 3, "all-any": 2, "correlated": 2, "exists": 3, "division-sql": 3, "joined-table": 2, "natural-join-sql": 2, "inner-outer": 3, "aggregate": 2, "count-null": 2, "group-by": 3, "having": 3, "assertion": 2, "trigger-eca": 2, "view-def": 2, "view-impl": 2, "view-update": 3, "view-auth": 1, "ra-intro": 1, "query-tree": 2, "ra-select": 3, "ra-project": 3, "ra-rename": 2, "ra-sequence": 2, "ra-setops": 2, "ra-cartesian": 2, "ra-join": 3, "join-variants": 2, "join-size": 1, "ra-division": 3, "ra-complete": 2, "ra-aggregate": 2, "ra-agg-props": 1, "ra-outer": 2, "ra-practice-join": 3, "ra-practice-union": 2, "ra-practice-diff": 3}, "meta": {"mockMin": 75, "mockLabel": "예상 시험지 (기출 받기 전 임시)", "mockNote": "개념 서술 3점 6개 → (min,max)·제약 위반·참조 동작 5점 → ER 설계·매핑·SQL 3개·관계 대수 10점 → 계산 7점. 매번 안 푼 변형 위주로 뽑아.", "blueprint": [["L1-2", 1, 3], ["L1-3", 2, 3], ["L3-2", 3, 3], ["L5-6", 4, 3], ["L6-1", 5, 3], ["L5-5", 6, 3], ["L2-2", 7, 5], ["L3-3", 8, 5], ["L4-2", 9, 5], ["L2-4", 10, 10], ["L3-5", 11, 10], ["L4-4", 12, 10], ["L5-2", 13, 10], ["L5-4", 14, 10], ["L6-6", 15, 10], ["L6-4", 16, 7]], "dist": [[30, "SQL 작성: 기본 조인, 중첩·EXISTS·나눗셈, GROUP BY·HAVING (12–14번)"], [20, "ER 설계와 ER→관계 매핑 (10, 11번)"], [17, "관계 대수 작성과 나눗셈·집합 연산 계산 (15, 16번)"], [15, "(min,max), 제약 위반 판정, 참조 트리거 동작 (7–9번)"], [18, "개념 서술 3점 × 6: DB 특징, 3단계 스키마, 키·무결성, 뷰, 관계 대수, Assertion·Trigger (1–6번)"]], "notes": ["중간고사 <b>10/23(금)<\/b> (교안 일정표 기준). 범위는 교안 1~6 (Course Intro → Relational Algebra) + 실습 자료. 시험은 closed-book, 중간 40%.", "⚠️ 10/13(화) <b>Functional Dependencies and Normalization<\/b> 수업은 일정표상 중간 전 마지막 수업인데 교안이 폴더에 없어서 여기 안 들어 있어. 범위에 들어가는지 확인해 줘.", "기출이 아직 없어서 모의고사 구성과 '예상 배점'은 교안 비중으로 잡은 임시 구성이야. 기출을 받으면 그 형식에 맞춰 바꿀게.", "SQL·관계 대수 풀이 문제의 정답 결과표는 교재 COMPANY 상태(교안 3-1 p.12)를 SQLite에 올려서 실제로 돌린 결과야. 다른 풀이도 결과가 같으면 맞는 답.", "수업 녹음은 03주-2(실습 환경, 조교)와 05주-1(Advanced SQL)뿐이라 <b style=\"color:var(--accent)\">수업 메모<\/b>는 U4·U <script>
(() => {
const DATA = JSON.parse(document.getElementById("db-data").textContent);
const UNITS = DATA.units;
const LESSONS = UNITS.flatMap(u => u.lessons.map(l => ({ ...l, unit:u.id, unitTitle:u.title })));
const LES = Object.fromEntries(LESSONS.map(l => [l.id, l]));
const SEC = {};  // concept id -> {id,title,lesson}
for (const l of LESSONS) for (const s of l.secs) SEC[s.id] = { ...s, lesson:l.id };
const TYPE = { mc:"객관식", ox:"OX", blank:"빈칸", short:"서술", calc:"풀이" };
const PASS = 0.7;
const WEIGHT = DATA.weights || {};
const wOf = c => WEIGHT[c] || 2;
const QUICK = t => t === "mc" || t === "ox" || t === "blank";
const META = DATA.meta;
const EXAM_DAY = new Date(2026, 9, 23);
const MOCK_MIN = META.mockMin;
const BOOT = Date.now();  // 이 페이지를 연 시각: quiz.start가 없는 예전 퀴즈는 이 시각 이전 기록만 자동 통과
// 예상 시험지: [레슨, 슬롯, 배점]
const EXAM24 = META.blueprint;
const SLOT_PTS = Object.fromEntries(EXAM24.map(([,s,p]) => [s, p]));

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const norm = s => String(s ?? "").toLowerCase().replace(/[\s()（）.,'"“”‘’·\-_]/g, "");

let extra = [], attempts = [], progress = {};
let db = null, sample = null;
let view = ls.get("db-view", "learn");
let L = ls.get("db-learn", { lesson:null, mode:"home", quiz:null, review:null });  // learn state
let filters = ls.get("db-filters", { unit:"", concept:"", type:"", status:"" });
let curId = ls.get("db-cur", null);
let mock = ls.get("db-mock", null);
const results = {};   // practice: qid -> result
const saveL = () => ls.set("db-learn", L);

/* ── derived ───────────────────────── */
const allQ = () => DATA.questions.concat(extra);
const qById = id => allQ().find(q => q.id === id);
function latestBy(key){
  const m = {};
  for (const a of attempts){ const k = a[key]; if (k && (!m[k] || a.at > m[k].at)) m[k] = a; }
  return m;
}
const latestQ = () => latestBy("qid");
const latestC = () => latestBy("concept");
function level(score){ if (score == null) return "none"; return score >= .85 ? "good" : score >= PASS ? "mid" : "weak"; }
const LV = { none:"미시도", weak:"약점", mid:"보통", good:"숙달" };
const lessonConcepts = lid => LES[lid].secs.filter(s => allQ().some(q => q.concept === s.id)).map(s => s.id);
const lessonDone = lid => !!progress[lid]?.done;
function lessonUnlocked(lid){
  const i = LESSONS.findIndex(l => l.id === lid);
  return i <= 0 || lessonDone(LESSONS[i-1].id) || lessonDone(lid);
}
function lessonWeak(lid){ const lc = latestC(); return lessonConcepts(lid).filter(c => lc[c] && lc[c].score < PASS); }
function nextLesson(){ return LESSONS.find(l => !lessonDone(l.id)) || null; }
function srcOf(concept){ const s = SEC[concept]; if (!s) return ""; const l = LES[s.lesson]; return `${l.id} §${s.title} · ${l.src}`; }

/* ── storage ───────────────────────── */
function setStoreChip(){ const el = $("#store"); el.textContent = db ? "기록 저장: 클라우드" : "기록 저장: 이 브라우저만"; el.className = "chip " + (db ? "live" : "local"); }
function setGraderChip(){ $("#grader").textContent = sample ? "채점: Claude + 자동/자가" : "채점: 자동 + 자가채점"; }
function toastErr(msg){ const el = document.createElement("div"); el.className = "err"; el.textContent = msg; $("main").prepend(el); setTimeout(()=>el.remove(), 6000); }
async function saveAttempt(a){
  a.at = Date.now(); a.answer = String(a.answer || "").slice(0, 6000);
  const q = qById(a.qid); a.concept = q?.concept || ""; a.lesson = q?.lesson || "";
  const id = a.at + "-" + Math.random().toString(36).slice(2,8);
  if (db){
    try { await db.collection("attempts").doc(id).set(a); if (!attempts.find(x => x._id === id)) attempts.push({ ...a, _id:id }); return id; }
    catch(e){ toastErr("기록을 클라우드에 저장하지 못했어 (" + (e.code||"error") + "). 이 브라우저에만 남겨둘게."); }
  }
  const loc = ls.get("db-attempts", []); loc.push({ ...a, _id:id }); ls.set("db-attempts", loc);
  attempts.push({ ...a, _id:id }); return id;
}
async function updateAttempt(id, patch){
  const j = attempts.findIndex(x => x._id === id); if (j >= 0) Object.assign(attempts[j], patch);
  if (db){ try { await db.collection("attempts").doc(id).update(patch); return; } catch {} }
  const loc = ls.get("db-attempts", []); const i = loc.findIndex(x => x._id === id);
  if (i >= 0){ Object.assign(loc[i], patch); ls.set("db-attempts", loc); }
}
async function saveProgress(lid, passedPatch){
  const prev = progress[lid] || {};
  const passed = { ...(prev.passed || {}), ...passedPatch };
  const done = prev.done || lessonConcepts(lid).every(c => passed[c]);
  progress[lid] = { ...prev, passed, done, at:Date.now() };
  const loc = ls.get("db-progress", {}); loc[lid] = progress[lid]; ls.set("db-progress", loc);
  if (db){ try { await db.collection("progress").doc(lid).set(progress[lid]); } catch {} }
}

/* ── grading ───────────────────────── */
function autoGrade(q, ans){
  if (q.type === "mc"){ const ok = Number(ans) === q.answer; return { score: ok ? 1 : 0, feedback: ok ? "정답!" : `정답은 ${q.answer+1}번.` }; }
  if (q.type === "ox"){ const ok = ans === q.answer; return { score: ok ? 1 : 0, feedback: ok ? "정답!" : `정답은 ${q.answer ? "O" : "X"}.` }; }
  if (q.type === "blank"){
    const arr = Array.isArray(ans) ? ans : [];
    let hit = 0; const missed = [];
    q.accept.forEach((alts, i) => {
      const v = norm(arr[i]);
      if (v && alts.some(a => norm(a) === v)) hit++; else missed.push(`(${String.fromCharCode(97+i)}) 정답: ${alts[0]}`);
    });
    const score = hit / q.accept.length;
    return { score, missed, feedback: score === 1 ? "빈칸 전부 맞았어." : `${q.accept.length}칸 중 ${hit}칸 맞음. 표현이 달라서 틀린 거면 아래 버튼으로 고쳐.` };
  }
  return null;
}
function gradingPrompt(q, ans){
  return `You grade one answer from a midterm in Databases (데이터베이스, Chung-Ang University, Elmasri & Navathe "Fundamentals of Database Systems" 7th ed.). The course is taught in English; the student may answer in Korean or English.

Grade the student's answer against the model answer and key points.
- Accept synonyms and Korean/English term equivalents (e.g. 참조 무결성 = referential integrity, 개체 = entity, 투플 = tuple).
- Short answer: credit each key point proportionally. Brevity is fine.
- SQL: judge by whether the query returns the correct result on the given schema, not by matching the model text. Accept any equivalent formulation (JOIN ... ON vs WHERE join condition, IN vs EXISTS vs = ANY, aliases or none, keyword case, missing final semicolon). Deduct for: a missing join condition (Cartesian product), a wrong or missing selection condition, wrong attributes in SELECT, non-grouped attribute in SELECT with GROUP BY, a group condition put in WHERE instead of HAVING, missing DISTINCT only when the question explicitly asks for distinct values. Minor syntax slips that a reader would fix immediately lose little.
- Relational algebra: accept Greek symbols (σ π ⋈ ρ ∪ ∩ − × ÷ ℑ) or words (SELECT, PROJECT, JOIN, RENAME, UNION, MINUS, DIVISION, FUNCTION), either a single nested expression or a sequence of named intermediate relations (TEMP ← ...). Judge correctness of the operations and conditions; the order of independent selections does not matter.
- ER design / ER-to-relational mapping: judge entities, keys, relationship cardinality and participation, and where foreign keys go (FK on the N-side for 1:N, separate relation with composite PK for M:N and multivalued attributes, owner PK + partial key for weak entities). Accept reasonable alternatives that the textbook also allows (e.g. 1:1 FK on either side, though the total-participation side is preferred).
- Constraint-violation questions: the student must name the violated constraint(s) correctly; extra wrong constraints lose credit.
- An empty or "모르겠다"-style answer scores 0.

Question type: ${q.type}
Question: ${q.prompt}
${q.code ? "Schema/data given:\n" + q.code + "\n" : ""}
Model answer:
${q.answer}
${q.keys ? "Key points: " + q.keys.join(" | ") + "\n" : ""}${q.explain ? "Note: " + q.explain + "\n" : ""}
Student answer:
<<<
${ans}
>>>

Reply with only this JSON:
{"score": <number 0..1>, "verdict": "correct" | "partial" | "wrong", "feedback": "<Korean, casual 반말, 1-3 sentences, concrete: what was right/wrong>", "missed": ["<short Korean item the student missed or got wrong>", ...]}`;
}
async function claudeGrade(q, ans){
  const r = await sample.json(gradingPrompt(q, ans), { modelTier: q.type === "calc" ? "default" : "quick" });
  let score = Number(r?.score); if (!isFinite(score)) score = 0; score = Math.max(0, Math.min(1, score));
  return { score, feedback:String(r?.feedback || ""), missed: Array.isArray(r?.missed) ? r.missed.map(String).slice(0,6) : [] };
}
function sampleErrMsg(e){
  const c = e?.code;
  if (c === "not_granted") return "Claude 채점이 허용되지 않았어. 답 보고 자가채점해줘.";
  if (c === "rate_limited") return "채점 요청이 몰렸어. 잠깐 뒤에 다시 눌러줘.";

function rankQs(list){
  const lq = latestQ();
  return list.map(q => ({ q, k: attempts.filter(a => a.qid === q.id).length * 10 + (lq[q.id] ? lq[q.id].score * 3 : 0) + Math.random() * 2 }))
    .sort((a,b) => a.k - b.k).map(x => x.q);
}
// n questions for one concept: one written (short/calc) when n >= 2 and available, rest quick; quick ones first
function pickN(concept, n, avoid){
  const cand = allQ().filter(q => q.concept === concept);
  let pool = cand.filter(q => !avoid.has(q.id)); if (pool.length < n) pool = pool.concat(rankQs(cand.filter(q => avoid.has(q.id))));
  const quick = rankQs(pool.filter(q => QUICK(q.type))), written = rankQs(pool.filter(q => !QUICK(q.type)));
  let out = [];
  if (n === 1) out = rankQs(pool).slice(0, 1);
  else {
    const w = written.length ? 1 : 0;
    out = quick.slice(0, n - w).concat(written.slice(0, w));
    for (const q of rankQs(pool)) if (out.length < n && !out.includes(q)) out.push(q);
  }
  out = [...new Set(out)].slice(0, n);
  return out.filter(q => QUICK(q.type)).concat(out.filter(q => !QUICK(q.type)));
}
function quizCount(concepts){ return concepts.reduce((s,c) => s + Math.min(wOf(c), allQ().filter(q => q.concept === c).length), 0); }
function startQuiz(lid, concepts, round){

  const items = [];
  for (const c of concepts) for (const q of pickN(c, wOf(c), used)){ used.add(q.id); items.push({ qid:q.id, concept:c }); }
  L.quiz = { lessonId:lid, round, items, idx:0, res:{}, drafts:{}, used:[...used], start:Date.now() };
  L.mode = "quiz"; L.lesson = lid; saveL(); renderLearn(); window.scrollTo({ top:0 });
}

}
function prevBadge(qid, exclude){

function autoCarry(z){

function recommendations(n){
  const lq = latestQ();
  const studied = lid => lessonDone(lid) || attempts.some(a => a.lesson === lid);
  return allQ().map(q => {
    const l = lq[q.id];
    if (l && l.score >= .85) return null;
    const need = l ? 1 - l.score : 1.1;
    const s = need * (1 + wOf(q.concept)) * (q.slot ? 1.6 : 1) * (studied(q.lesson) ? 1 : .25) * (0.9 + Math.random() * 0.2);
    return { q, s };
  }).filter(Boolean).sort((a,b) => b.s - a.s).slice(0, n).map(x => x.q);
}

function filteredQs(){
  const lq = latestQ();
  return allQ().filter(q => {
    if (filters.lesson && q.lesson !== filters.lesson) return false;
    if (filters.unit && q.unit !== filters.unit) return false;
    if (filters.concept && q.concept !== filters.concept) return false;
    if (filters.type && q.type !== filters.type) return false;
    const l = lq[q.id];
    if (filters.status === "new" && l) return false;
    if (filters.status === "wrong" && !(l && l.score < PASS)) return false;
    if (filters.status === "notgood" && l && l.score >= .85) return false;
    if (filters.status === "exam" && !q.slot) return false;
    return true;
  });
}
