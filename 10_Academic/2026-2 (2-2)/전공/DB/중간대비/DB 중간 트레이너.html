요약. 연습 2 풀이 때 'EMPLOYEE만으로 안 되고 왜 DEPARTMENT가 필요하냐'고 물음 → EMPLOYEE엔 부서 번호만 있고 부서 '이름'이 없어서 조인해야 한다. 평균 조건(&gt; 30000)은 HAVING에.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p21.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p21.jpg\" alt=\"05 p.21 · 질의 26: HAVING COUNT(*) &gt; 2\" loading=\"lazy\"><\/button><figcaption>05 p.21 · 질의 26: HAVING COUNT(*) &gt; 2<\/figcaption><\/figure><\/section>", "title_en": "Aggregate Functions, GROUP BY, HAVING", "html_en": "<section class=\"sec\" id=\"s-aggregate\"><h3>Aggregate functions<\/h3><p><b>Aggregate function<\/b>: summarizes information from multiple tuples into a <b>single-tuple summary<\/b>. Mostly used in SELECT or HAVING.<\/p>\n<ul><li><b>COUNT<\/b>: the number of tuples or values<\/li><li><b>SUM, MAX, MIN, AVG<\/b>: applied to a (multi)set of numeric values<\/li><\/ul>\n<p><b>Query 19<\/b>: sum, maximum, minimum and average salary of all employees<\/p>\n<pre class=\"code\">SELECT SUM(Salary), MAX(Salary), MIN(Salary), AVG(Salary)\nFROM   EMPLOYEE;<\/pre>\n<p>→ 281000, 55000, 25000, 35125<\/p>\n<p><b>Query 20<\/b>: the Research department only<\/p>\n<pre class=\"code\">SELECT SUM(Salary), MAX(Salary), MIN(Salary), AVG(Salary)\nFROM   (EMPLOYEE JOIN DEPARTMENT ON Dno = Dnumber)\nWHERE  Dname = &#x27;Research&#x27;;<\/pre>\n<p>→ 133000, 40000, 25000, 33250<\/p><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 5-1<\/span><br>Without aggregate functions you would have to read all the salaries and compute the sum, maximum and average yourself with for/while loops in Python or C. Aggregate functions do it in one line. Results: maximum 55,000, minimum 25,000, average = sum ÷ 8.<\/div><\/section>\n<section class=\"sec\" id=\"s-count-null\"><h3>COUNT and NULL, aggregates in nested queries<\/h3><ul><li><b>COUNT(*)<\/b>: the <b>number of rows (tuples)<\/b> in the result. Query 21 <code>SELECT COUNT(*) FROM EMPLOYEE;<\/code> → 8; Query 22, Research only → 4<\/li><li><b>COUNT(attribute)<\/b>: the number of <b>values<\/b> of that attribute. <b>NULLs are not counted<\/b>. e.g., <code>COUNT(Super_ssn)<\/code> → 7<\/li><li><b>COUNT(DISTINCT Salary)<\/b>: the number of distinct salary values → 6 (Query 23)<\/li><li>An aggregate result is a single value, so it can be used as <b>part of a condition<\/b>:<\/li><\/ul>\n<pre class=\"code\">SELECT Lname, Fname\nFROM   EMPLOYEE\nWHERE  ( SELECT COUNT(*) FROM DEPENDENT WHERE Ssn = Essn ) &gt;= 2;<\/pre>\n<p>→ Two or more dependents: Smith (3), Wong (3)<\/p><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 5-1<\/span><br>Without COUNT(*) the 8 tuples come out as they are, but with COUNT(*) only a single number (8) comes out. Research gives 4. The number of distinct salary values is 6 because 25,000 repeats. An aggregate result is a single value, so it can be used as part of a condition such as 'two or more dependents': the inner query returns one dependent count per employee, which is compared with 2.<\/div><\/section>\n<section class=\"sec\" id=\"s-group-by\"><h3>GROUP BY<\/h3><p><b>Grouping<\/b>: partitions the tuples of a relation into <b>nonoverlapping subsets (groups)<\/b> and applies aggregate functions to each group.<\/p>\n<ul><li><b>Grouping attribute<\/b>: the basis for forming groups. Same group = tuples with the same value of the grouping attribute(s)<\/li><li>Specified in the <b>GROUP BY<\/b> clause. The grouping attributes should also appear in SELECT so the result shows which group each row is<\/li><\/ul>\n<p><b>Query 24<\/b>: for each department, the department number, number of employees and average salary<\/p>\n<pre class=\"code\">SELECT   Dno, COUNT(*), AVG(Salary)\nFROM     EMPLOYEE\nGROUP BY Dno;<\/pre>\n<p>→ (5, 4, 33250), (4, 3, 31000), (1, 1, 55000)<\/p>\n<p><b>Query 25<\/b>: for each project, its number, name and number of employees who work on it<\/p>\n<pre class=\"code\">SELECT   Pnumber, Pname, COUNT(*)\nFROM     PROJECT, WORKS_ON\nWHERE    Pnumber = Pno\nGROUP BY Pnumber, Pname;<\/pre>\n<p>→ ProductX 2, ProductY 3, ProductZ 2, Computerization 3, Reorganization 3, Newbenefits 3<\/p>\n<div class=\"callout trap\">Trap: with GROUP BY, SELECT may contain <b>only grouping attributes and aggregate functions<\/b>. Do not put an attribute that does not have a single value per group (e.g., Lname when grouping by Dno) in SELECT.<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 5-1<\/span><br>Grouping is used to summarize each group separately. Grouping by Dno creates three groups, departments 5, 4 and 1, and COUNT and AVG are computed for each group.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p19.jpg\" aria-label=\"Enlarge\"><img src=\"img/ADV-p19.jpg\" alt=\"05 p.19 · Query 24: grouping by Dno\" loading=\"lazy\"><\/button><figcaption>05 p.19 · Query 24: grouping by Dno<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p20.jpg\" aria-label=\"Enlarge\"><img src=\"img/ADV-p20.jpg\" alt=\"05 p.20 · Query 25: number of employees per project\" loading=\"lazy\"><\/button><figcaption>05 p.20 · Query 25: number of employees per project<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-having\"><h3>HAVING<\/h3><p><b>HAVING<\/b>: a <b>condition on the summary information<\/b> of groups. Used with GROUP BY. <b>Only groups<\/b> that satisfy the condition appear in the result.<\/p>\n<p><b>Query 26<\/b>: for each project on which <b>more than two<\/b> employees work, the project number, name and number of employees<\/p>\n<pre class=\"code\">SELECT   Pnumber, Pname, COUNT(*)\nFROM     PROJECT, WORKS_ON\nWHERE    Pnumber = Pno\nGROUP BY Pnumber, Pname\nHAVING   COUNT(*) &gt; 2;<\/pre>\n<p>→ ProductY, Computerization, Reorganization, Newbenefits (3 employees each)<\/p>\n<p><b>Exercise 2<\/b>: for each department whose average salary is greater than $30,000, the department name and number of employees<\/p>\n<pre class=\"code\">SELECT   D.Dname, COUNT(*)\nFROM     EMPLOYEE AS E, DEPARTMENT AS D\nWHERE    E.Dno = D.Dnumber\nGROUP BY D.Dname\nHAVING   AVG(E.Salary) &gt; 30000;<\/pre>\n<p>→ Research 4, Administration 3, Headquarters 1 (the slide solution groups by E.Dno; in standard SQL it is safer to also have D.Dname from SELECT in GROUP BY)<\/p>\n<div class=\"callout exam\">Exam point: <b>WHERE = tuple condition (before groups are formed)<\/b>, <b>HAVING = group condition (after aggregation)<\/b>. A condition on an aggregate, such as \"average above 30,000\", cannot go in WHERE.<\/div>\n<p><b>Order of execution<\/b>: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY<\/p><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 5-1<\/span><br>GROUP BY summarizes per group; HAVING summarizes only the groups that satisfy a condition. While solving Exercise 2 the professor asked 'why do we need DEPARTMENT and not just EMPLOYEE?' → EMPLOYEE has only the department number, not the department 'name', so a join is needed. The average condition (&gt; 30000) goes in HAVING.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p21.jpg\" aria-label=\"Enlarge\"><img src=\"img/ADV-p21.jpg\" alt=\"05 p.21 · Query 26: HAVING COUNT(*) &gt; 2\" loading=\"lazy\"><\/button><figcaption>05 p.21 · Query 26: HAVING COUNT(*) &gt; 2<\/figcaption><\/figure><\/section>"}, {"id": "L5-5", "title": "Assertion · Trigger", "src": "5-1 p.24–29", "secs": [{"id": "assertion", "title": "Assertion", "title_en": "Assertions"}, {"id": "trigger-eca", "title": "Trigger (ECA 규칙)", "title_en": "Triggers (ECA rules)"}], "md": "## Assertion {#assertion}\n\n**내장 제약(키, 개체 무결성, 참조 무결성)으로 표현할 수 없는 일반 제약**을 지정.\n- 예) 사원의 급여는 그 사원이 속한 부서 관리자의 급여보다 많으면 안 된다\n```\nCREATE ASSERTION SALARY_CONSTRAINT\nCHECK ( NOT EXISTS ( SELECT *\n                     FROM   EMPLOYEE E, EMPLOYEE M, DEPARTMENT D\n                     WHERE  E.Salary > M.Salary\n                       AND  E.Dno = D.Dnumber\n                       AND  D.Mgr_ssn = M.Ssn ) );\n```\n- **CHECK** 뒤 괄호 안의 조건은 **모든 DB 상태에서 참**이어야 한다\n- 관례: 원하는 조건을 **위반하는 투플을 고르는 질의**를 쓰고 **NOT EXISTS**로 감싼다 → 결과가 비면 TRUE(만족), 비지 않으면 FALSE(위반)\n\n## Trigger (ECA 규칙) {#trigger-eca}\n\n**특정 이벤트가 일어나고 조건이 맞을 때 자동으로 실행할 동작**을 지정. **ECA (Event, Condition, Action) 규칙**.\n```\nCREATE TRIGGER SALARY_VIOLATION\nBEFORE INSERT OR UPDATE OF SALARY, SUPERVISOR_SSN\n    ON EMPLOYEE\nFOR EACH ROW\n    WHEN ( NEW.SALARY > ( SELECT SALARY FROM EMPLOYEE\n                          WHERE SSN = NEW.SUPERVISOR_SSN ) )\n        INFORM_SUPERVISOR(NEW.Supervisor_ssn, NEW.Ssn);\n```\n- **Event**: DB에 명시적으로 적용되는 갱신 연산 (새 사원 삽입, 급여 변경, 상사 변경). **BEFORE / AFTER**로 그 연산 전/후에 실행. 가능한 이벤트를 **모두** 고려해야 함\n- **Condition**: 이벤트가 일어난 뒤 동작을 실행할지 결정. **WHEN 절**. 선택 사항. 참일 때만 동작 실행\n- **Action**: 자동 실행할 동작 = SQL 문장들, DB 트랜잭션, 또는 외부 프로그램 (예: 외부 저장 프로시저 INFORM_SUPERVISOR)\n- 용도: (1) DB 일관성 유지, (2) DB 갱신 모니터링, (3) 유도 데이터 자동 갱신\n- 예) 사원의 출장비가 한도를 넘으면 관리자에게 알림\n\n> 함정: Assertion = **제약** (위반하면 연산을 막음), Trigger = **동작** (조건이 맞으면 무언가를 실행). 교안 예는 둘 다 급여 비교지만 하나는 \"막기\", 하나는 \"알리기\".", "html": "<section class=\"sec\" id=\"s-assertion\"><h3>Assertion<\/h3><p><b>내장 제약(키, 개체 무결성, 참조 무결성)으로 표현할 수 없는 일반 제약<\/b>을 지정.<\/p>\n<ul><li>예) 사원의 급여는 그 사원이 속한 부서 관리자의 급여보다 많으면 안 된다<\/li><\/ul>\n<pre class=\"code\">CREATE ASSERTION SALARY_CONSTRAINT\nCHECK ( NOT EXISTS ( SELECT *\n                     FROM   EMPLOYEE E, EMPLOYEE M, DEPARTMENT D\n                     WHERE  E.Salary &gt; M.Salary\n                       AND  E.Dno = D.Dnumber\n                       AND  D.Mgr_ssn = M.Ssn ) );<\/pre>\n<ul><li><b>CHECK<\/b> 뒤 괄호 안의 조건은 <b>모든 DB 상태에서 참<\/b>이어야 한다<\/li><li>관례: 원하는 조건을 <b>위반하는 투플을 고르는 질의<\/b>를 쓰고 <b>NOT EXISTS<\/b>로 감싼다 → 결과가 비면 TRUE(만족), 비지 않으면 FALSE(위반)<\/li><\/ul><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>CREATE ASSERTION 이름 CHECK (조건). 관례는 '확인하고 싶은 조건을 위반하는 투플을 찾는 질의'를 쓰고 NOT EXISTS로 감싸는 것. 사원 급여가 관리자 급여보다 크면 위반 → 그 질의 결과가 비어 있지 않으면 문제가 있다는 뜻.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p25.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p25.jpg\" alt=\"05 p.25 · CREATE ASSERTION SALARY_CONSTRAINT (위반 질의를 NOT EXISTS로)\" loading=\"lazy\"><\/button><figcaption>05 p.25 · CREATE ASSERTION SALARY_CONSTRAINT (위반 질의를 NOT EXISTS로)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-trigger-eca\"><h3>Trigger (ECA 규칙)<\/h3><p><b>특정 이벤트가 일어나고 조건이 맞을 때 자동으로 실행할 동작<\/b>을 지정. <b>ECA (Event, Condition, Action) 규칙<\/b>.<\/p>\n<pre class=\"code\">CREATE TRIGGER SALARY_VIOLATION\nBEFORE INSERT OR UPDATE OF SALARY, SUPERVISOR_SSN\n    ON EMPLOYEE\nFOR EACH ROW\n    WHEN ( NEW.SALARY &gt; ( SELECT SALARY FROM EMPLOYEE\n                          WHERE SSN = NEW.SUPERVISOR_SSN ) )\n        INFORM_SUPERVISOR(NEW.Supervisor_ssn, NEW.Ssn);<\/pre>\n<ul><li><b>Event<\/b>: DB에 명시적으로 적용되는 갱신 연산 (새 사원 삽입, 급여 변경, 상사 변경). <b>BEFORE / AFTER<\/b>로 그 연산 전/후에 실행. 가능한 이벤트를 <b>모두<\/b> 고려해야 함<\/li><li><b>Condition<\/b>: 이벤트가 일어난 뒤 동작을 실행할지 결정. <b>WHEN 절<\/b>. 선택 사항. 참일 때만 동작 실행<\/li><li><b>Action<\/b>: 자동 실행할 동작 = SQL 문장들, DB 트랜잭션, 또는 외부 프로그램 (예: 외부 저장 프로시저 INFORM_SUPERVISOR)<\/li><li>용도: (1) DB 일관성 유지, (2) DB 갱신 모니터링, (3) 유도 데이터 자동 갱신<\/li><li>예) 사원의 출장비가 한도를 넘으면 관리자에게 알림<\/li><\/ul>\n<div class=\"callout trap\">함정: Assertion = <b>제약<\/b> (위반하면 연산을 막음), Trigger = <b>동작<\/b> (조건이 맞으면 무언가를 실행). 교안 예는 둘 다 급여 비교지만 하나는 \"막기\", 하나는 \"알리기\".<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>트리거 = Event, Condition, Action 세 요소. Event는 조건을 깰 가능성이 있는 갱신 연산(새 사원 삽입, 급여 변경, 상사 변경)이고 BEFORE/AFTER로 시점 지정. Condition은 WHEN 절, 참이 아니면 동작은 건너뜀. Action은 SQL 문장, 트랜잭션, 외부 프로그램 무엇이든 가능 (예: 메신저로 상사에게 알림).<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p26.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p26.jpg\" alt=\"05 p.26 · CREATE TRIGGER SALARY_VIOLATION (ECA)\" loading=\"lazy\"><\/button><figcaption>05 p.26 · CREATE TRIGGER SALARY_VIOLATION (ECA)<\/figcaption><\/figure><\/section>", "title_en": "Assertions, Triggers", "html_en": "<section class=\"sec\" id=\"s-assertion\"><h3>Assertions<\/h3><p>Specify <b>general constraints that cannot be expressed by the built-in constraints (key, entity integrity, referential integrity)<\/b>.<\/p>\n<ul><li>e.g., the salary of an employee must not be greater than the salary of the manager of the department the employee works for<\/li><\/ul>\n<pre class=\"code\">CREATE ASSERTION SALARY_CONSTRAINT\nCHECK ( NOT EXISTS ( SELECT *\n                     FROM   EMPLOYEE E, EMPLOYEE M, DEPARTMENT D\n                     WHERE  E.Salary &gt; M.Salary\n                       AND  E.Dno = D.Dnumber\n                       AND  D.Mgr_ssn = M.Ssn ) );<\/pre>\n<ul><li>The condition in parentheses after <b>CHECK<\/b> must be <b>true in every database state<\/b><\/li><li>Convention: write a <b>query that selects the tuples violating<\/b> the desired condition and wrap it in <b>NOT EXISTS<\/b> → if the result is empty, TRUE (satisfied); if not empty, FALSE (violated)<\/li><\/ul><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 5-1<\/span><br>CREATE ASSERTION name CHECK (condition). The convention is to write 'a query that finds the tuples violating the condition you want to check' and wrap it in NOT EXISTS. If an employee's salary is greater than the manager's salary it is a violation → if that query's result is not empty, there is a problem.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p25.jpg\" aria-label=\"Enlarge\"><img src=\"img/ADV-p25.jpg\" alt=\"05 p.25 · CREATE ASSERTION SALARY_CONSTRAINT (violation query wrapped in NOT EXISTS)\" loading=\"lazy\"><\/button><figcaption>05 p.25 · CREATE ASSERTION SALARY_CONSTRAINT (violation query wrapped in NOT EXISTS)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-trigger-eca\"><h3>Triggers (ECA rules)<\/h3><p>Specify <b>actions to be executed automatically when certain events occur and conditions are met<\/b>. <b>ECA (Event, Condition, Action) rules<\/b>.<\/p>\n<pre class=\"code\">CREATE TRIGGER SALARY_VIOLATION\nBEFORE INSERT OR UPDATE OF SALARY, SUPERVISOR_SSN\n    ON EMPLOYEE\nFOR EACH ROW\n    WHEN ( NEW.SALARY &gt; ( SELECT SALARY FROM EMPLOYEE\n                          WHERE SSN = NEW.SUPERVISOR_SSN ) )\n        INFORM_SUPERVISOR(NEW.Supervisor_ssn, NEW.Ssn);<\/pre>\n<ul><li><b>Event<\/b>: database update operations explicitly applied to the DB (inserting a new employee, changing a salary, changing a supervisor). <b>BEFORE / AFTER<\/b> runs the trigger before/after the operation. <b>All<\/b> possible events must be considered<\/li><li><b>Condition<\/b>: determines whether the action should be executed after the event occurs. The <b>WHEN clause<\/b>. Optional. The action runs only when it is true<\/li><li><b>Action<\/b>: what is executed automatically = a sequence of SQL statements, a database transaction, or an external program (e.g., the external stored procedure INFORM_SUPERVISOR)<\/li><li>Uses: (1) maintaining database consistency, (2) monitoring database updates, (3) updating derived data automatically<\/li><li>e.g., notify the manager when an employee's travel expenses exceed a limit<\/li><\/ul>\n<div class=\"callout trap\">Trap: Assertion = a <b>constraint<\/b> (blocks the operation if violated); Trigger = an <b>action<\/b> (does something when the condition holds). Both slide examples compare salaries, but one \"blocks\" and the other \"notifies\".<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 5-1<\/span><br>A trigger = three components: Event, Condition, Action. The Event is an update operation that could break the condition (inserting a new employee, changing a salary, changing a supervisor), with BEFORE/AFTER specifying the timing. The Condition is the WHEN clause; if it is not true, the action is skipped. The Action can be anything: SQL statements, a transaction, or an external program (e.g., notifying the supervisor via a messenger).<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p26.jpg\" aria-label=\"Enlarge\"><img src=\"img/ADV-p26.jpg\" alt=\"05 p.26 · CREATE TRIGGER SALARY_VIOLATION (ECA)\" loading=\"lazy\"><\/button><figcaption>05 p.26 · CREATE TRIGGER SALARY_VIOLATION (ECA)<\/figcaption><\/figure><\/section>"}, {"id": "L5-6", "title": "뷰 (View)", "src": "5-1 p.30–47", "secs": [{"id": "view-def", "title": "뷰의 정의와 쓰임", "title_en": "Definition and use of views"}, {"id": "view-impl", "title": "뷰 구현: 질의 수정 vs 실체화", "title_en": "View implementation: query modification vs materialization"}, {"id": "view-update", "title": "뷰 갱신", "title_en": "Updating views"}, {"id": "view-auth", "title": "뷰를 이용한 권한 부여", "title_en": "Views for authorization"}], "md": "## 뷰의 정의와 쓰임 {#view-def}\n\n**뷰 (view)**: 기본 테이블(base table)에서 유도된 **가상 테이블**. 물리적으로 존재하지 않을 수도 있다.\n- 검색: 제한 없음. 갱신: 보통 제한됨 (사실상 읽기 전용)\n- 쓰는 이유: **복잡한 질의를 단순화**. 여러 테이블 조인·집계를 자주 쓰면 뷰로 만들어 두고 **단일 테이블 질의**처럼 쓴다\n\n```\nCREATE VIEW WORKS_ON1\nAS SELECT Fname, Lname, Pname, Hours\n   FROM   EMPLOYEE, PROJECT, WORKS_ON\n   WHERE  Ssn = Essn AND Pno = Pnumber;\n\nCREATE VIEW DEPT_INFO (Dept_name, No_of_emps, Total_sal)\nAS SELECT   Dname, COUNT(*), SUM(Salary)\n   FROM     DEPARTMENT, EMPLOYEE\n   WHERE    Dnumber = Dno\n   GROUP BY Dname;\n```\n- 속성 이름을 안 주면 정의 질의의 속성 이름을 그대로 씀 (WORKS_ON1), 명시할 수도 있음 (DEPT_INFO)\n- 뷰 질의: `SELECT Fname, Lname FROM WORKS_ON1 WHERE Pname = 'ProductX';` → 매번 세 테이블을 조인할 필요 없음\n- **DROP VIEW WORKS_ON1;** → 정의 테이블에는 영향 없음\n\n## 뷰 구현: 질의 수정 vs 실체화 {#view-impl}\n\n뷰는 **항상 최신(up-to-date)** 이어야 한다 → 정의 테이블이 바뀌면 DBMS가 뷰에 반영할 책임.\n\n| 방식 | 내용 | 특징 |\n|---|---|---|\n| **질의 수정 (query modification)** | 뷰 질의를 **기본 테이블에 대한 질의로 변환**. 뷰를 물리적으로 유지하지 않음 | 사용자는 편하지만 DB 시스템엔 비효율 (복잡한 뷰를 매번 다시 계산) |\n| **뷰 실체화 (view materialization)** | 뷰가 처음 질의될 때 **물리적으로 뷰 테이블을 만들어** 한동안 유지 | 이후 뷰 질의가 자주 온다는 가정. **추가 저장 공간**. 정의 테이블이 바뀌면 **점진적 갱신(incremental update)** |\n\n실체화된 뷰를 **언제** 갱신하나:\n- **즉시 갱신 (immediate)**: 기본 테이블이 바뀌자마자. 항상 최신이지만 불필요하고 비효율적일 때가 있음\n- **주기적 갱신 (periodic)**: 주기적으로. 뷰 질의가 최신이 아닌 결과를 받을 수 있음\n- **지연 갱신 (lazy)**: 뷰 질의가 필요할 때. 질의가 오기 전까진 최신이 아님\n\n일정 기간 질의되지 않으면 실체화된 뷰를 지우고, 나중에 필요하면 처음부터 다시 계산.\n\n## 뷰 갱신 {#view-update}\n\n뷰에 대한 검색은 언제나 가능하지만, INSERT/DELETE/UPDATE는 많은 경우 불가능.\n\n**갱신 가능 조건: 뷰 갱신을 이루는 기본 릴레이션 갱신이 딱 하나뿐일 때.**\n- **단일 테이블 + 집계 없음** → 기본 테이블 갱신 하나로 매핑 → **허용**. 단 뷰 속성에 (1) 기본 릴레이션의 **PK**, (2) DEFAULT가 없는 **NOT NULL 속성 전부**가 들어 있어야 함 (뷰로 투플을 넣을 때 그 값들이 비면 안 되니까)\n- **조인 (여러 테이블)** → 여러 방식으로 매핑될 수 있어 **일반적으로 불가**\n- **그룹화·집계** → 그 갱신이 **말이 안 됨** → **불가**\n\n예 1 (여러 해석): `UPDATE WORKS_ON1 SET Pname = 'ProductY' WHERE Lname = 'Smith' AND Fname = 'John' AND Pname = 'ProductX';`\n- 해석 a: Smith가 일하는 프로젝트를 바꿈 → WORKS_ON의 Pno를 ProductY 번호로 (의도대로)\n- 해석 b: PROJECT의 'ProductX' 이름을 'ProductY'로 → 뷰 결과는 같아 보이지만 **부작용**: ProductX에서 일하던 모든 투플이 바뀜\n\n예 2 (불가능): `UPDATE DEPT_INFO SET Total_sal = 100000 WHERE Dname = 'Research';` → Total_sal은 SUM으로 **계산된 값**, 물리적으로 저장 안 됨 → 의미 없음\n\n## 뷰를 이용한 권한 부여 {#view-auth}\n\n뷰로 권한 없는 사용자에게 **특정 속성이나 투플을 숨길** 수 있다.\n```\nCREATE VIEW DEPT5EMP AS\nSELECT * FROM EMPLOYEE WHERE Dno = 5;            -- 투플 제한\n\nCREATE VIEW BASIC_EMP_DATA AS\nSELECT Fname, Lname, Address FROM EMPLOYEE;      -- 속성 제한\n```\n- DEPT5EMP: 5번 부서 관리자는 5번 부서 사원 정보만 보게 함. 사용자에게 EMPLOYEE가 아니라 **뷰에 대한 질의 권한만** 부여\n- BASIC_EMP_DATA: 일반 사원은 이름과 주소만\n\n교안 연습 3·4 풀이:\n```\nCREATE VIEW DEPT_INFO (DeptName, MgrFname, MgrLname, MgrSalary)\nAS SELECT D.Dname, E.Fname, E.Lname, E.Salary\n   FROM   DEPARTMENT AS D, EMPLOYEE AS E\n   WHERE  D.Mgr_ssn = E.Ssn;                      -- 부서와 관리자 정보\n\nCREATE VIEW ProjectInfo (Pname, Dname, NumEmployees, TotalHours)\nAS SELECT   P.Pname, D.Dname, COUNT(*), SUM(W.Hours)\n   FROM     PROJECT AS P, WORKS_ON AS W, DEPARTMENT AS D\n   WHERE    P.Pnumber = W.Pno AND D.Dnumber = P.Dnum\n   GROUP BY P.Pnumber, P.Pname, D.Dname;          -- 프로젝트 현황\n```", "html": "<section class=\"sec\" id=\"s-view-def\"><h3>뷰의 정의와 쓰임<\/h3><p><b>뷰 (view)<\/b>: 기본 테이블(base table)에서 유도된 <b>가상 테이블<\/b>. 물리적으로 존재하지 않을 수도 있다.<\/p>\n<ul><li>검색: 제한 없음. 갱신: 보통 제한됨 (사실상 읽기 전용)<\/li><li>쓰는 이유: <b>복잡한 질의를 단순화<\/b>. 여러 테이블 조인·집계를 자주 쓰면 뷰로 만들어 두고 <b>단일 테이블 질의<\/b>처럼 쓴다<\/li><\/ul>\n<pre class=\"code\">CREATE VIEW WORKS_ON1\nAS SELECT Fname, Lname, Pname, Hours\n   FROM   EMPLOYEE, PROJECT, WORKS_ON\n   WHERE  Ssn = Essn AND Pno = Pnumber;\n\nCREATE VIEW DEPT_INFO (Dept_name, No_of_emps, Total_sal)\nAS SELECT   Dname, COUNT(*), SUM(Salary)\n   FROM     DEPARTMENT, EMPLOYEE\n   WHERE    Dnumber = Dno\n   GROUP BY Dname;<\/pre>\n<ul><li>속성 이름을 안 주면 정의 질의의 속성 이름을 그대로 씀 (WORKS_ON1), 명시할 수도 있음 (DEPT_INFO)<\/li><li>뷰 질의: <code>SELECT Fname, Lname FROM WORKS_ON1 WHERE Pname = 'ProductX';<\/code> → 매번 세 테이블을 조인할 필요 없음<\/li><li><b>DROP VIEW WORKS_ON1;<\/b> → 정의 테이블에는 영향 없음<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p32.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p32.jpg\" alt=\"05 p.32 · CREATE VIEW WORKS_ON1, DEPT_INFO\" loading=\"lazy\"><\/button><figcaption>05 p.32 · CREATE VIEW WORKS_ON1, DEPT_INFO<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-view-impl\"><h3>뷰 구현: 질의 수정 vs 실체화<\/h3><p>뷰는 <b>항상 최신(up-to-date)<\/b> 이어야 한다 → 정의 테이블이 바뀌면 DBMS가 뷰에 반영할 책임.<\/p>\n<div class=\"tblw\"><table><thead><tr><th>방식<\/th><th>내용<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td><b>질의 수정 (query modification)<\/b><\/td><td>뷰 질의를 <b>기본 테이블에 대한 질의로 변환<\/b>. 뷰를 물리적으로 유지하지 않음<\/td><td>사용자는 편하지만 DB 시스템엔 비효율 (복잡한 뷰를 매번 다시 계산)<\/td><\/tr><tr><td><b>뷰 실체화 (view materialization)<\/b><\/td><td>뷰가 처음 질의될 때 <b>물리적으로 뷰 테이블을 만들어<\/b> 한동안 유지<\/td><td>이후 뷰 질의가 자주 온다는 가정. <b>추가 저장 공간<\/b>. 정의 테이블이 바뀌면 <b>점진적 갱신(incremental update)<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<p>실체화된 뷰를 <b>언제<\/b> 갱신하나:<\/p>\n<ul><li><b>즉시 갱신 (immediate)<\/b>: 기본 테이블이 바뀌자마자. 항상 최신이지만 불필요하고 비효율적일 때가 있음<\/li><li><b>주기적 갱신 (periodic)<\/b>: 주기적으로. 뷰 질의가 최신이 아닌 결과를 받을 수 있음<\/li><li><b>지연 갱신 (lazy)<\/b>: 뷰 질의가 필요할 때. 질의가 오기 전까진 최신이 아님<\/li><\/ul>\n<p>일정 기간 질의되지 않으면 실체화된 뷰를 지우고, 나중에 필요하면 처음부터 다시 계산.<\/p><\/section>\n<section class=\"sec\" id=\"s-view-update\"><h3>뷰 갱신<\/h3><p>뷰에 대한 검색은 언제나 가능하지만, INSERT/DELETE/UPDATE는 많은 경우 불가능.<\/p>\n<p><b>갱신 가능 조건: 뷰 갱신을 이루는 기본 릴레이션 갱신이 딱 하나뿐일 때.<\/b><\/p>\n<ul><li><b>단일 테이블 + 집계 없음<\/b> → 기본 테이블 갱신 하나로 매핑 → <b>허용<\/b>. 단 뷰 속성에 (1) 기본 릴레이션의 <b>PK<\/b>, (2) DEFAULT가 없는 <b>NOT NULL 속성 전부<\/b>가 들어 있어야 함 (뷰로 투플을 넣을 때 그 값들이 비면 안 되니까)<\/li><li><b>조인 (여러 테이블)<\/b> → 여러 방식으로 매핑될 수 있어 <b>일반적으로 불가<\/b><\/li><li><b>그룹화·집계<\/b> → 그 갱신이 <b>말이 안 됨<\/b> → <b>불가<\/b><\/li><\/ul>\n<p>예 1 (여러 해석): <code>UPDATE WORKS_ON1 SET Pname = 'ProductY' WHERE Lname = 'Smith' AND Fname = 'John' AND Pname = 'ProductX';<\/code><\/p>\n<ul><li>해석 a: Smith가 일하는 프로젝트를 바꿈 → WORKS_ON의 Pno를 ProductY 번호로 (의도대로)<\/li><li>해석 b: PROJECT의 'ProductX' 이름을 'ProductY'로 → 뷰 결과는 같아 보이지만 <b>부작용<\/b>: ProductX에서 일하던 모든 투플이 바뀜<\/li><\/ul>\n<p>예 2 (불가능): <code>UPDATE DEPT_INFO SET Total_sal = 100000 WHERE Dname = 'Research';<\/code> → Total_sal은 SUM으로 <b>계산된 값<\/b>, 물리적으로 저장 안 됨 → 의미 없음<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p42.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p42.jpg\" alt=\"05 p.42 · WORKS_ON1 갱신의 두 가지 해석\" loading=\"lazy\"><\/button><figcaption>05 p.42 · WORKS_ON1 갱신의 두 가지 해석<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p43.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p43.jpg\" alt=\"05 p.43 · DEPT_INFO의 Total_sal 갱신은 의미 없음\" loading=\"lazy\"><\/button><figcaption>05 p.43 · DEPT_INFO의 Total_sal 갱신은 의미 없음<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-view-auth\"><h3>뷰를 이용한 권한 부여<\/h3><p>뷰로 권한 없는 사용자에게 <b>특정 속성이나 투플을 숨길<\/b> 수 있다.<\/p>\n<pre class=\"code\">CREATE VIEW DEPT5EMP AS\nSELECT * FROM EMPLOYEE WHERE Dno = 5;            -- 투플 제한\n\nCREATE VIEW BASIC_EMP_DATA AS\nSELECT Fname, Lname, Address FROM EMPLOYEE;      -- 속성 제한<\/pre>\n<ul><li>DEPT5EMP: 5번 부서 관리자는 5번 부서 사원 정보만 보게 함. 사용자에게 EMPLOYEE가 아니라 <b>뷰에 대한 질의 권한만<\/b> 부여<\/li><li>BASIC_EMP_DATA: 일반 사원은 이름과 주소만<\/li><\/ul>\n<p>교안 연습 3·4 풀이:<\/p>\n<pre class=\"code\">CREATE VIEW DEPT_INFO (DeptName, MgrFname, MgrLname, MgrSalary)\nAS SELECT D.Dname, E.Fname, E.Lname, E.Salary\n   FROM   DEPARTMENT AS D, EMPLOYEE AS E\n   WHERE  D.Mgr_ssn = E.Ssn;                      -- 부서와 관리자 정보\n\nCREATE VIEW ProjectInfo (Pname, Dname, NumEmployees, TotalHours)\nAS SELECT   P.Pname, D.Dname, COUNT(*), SUM(W.Hours)\n   FROM     PROJECT AS P, WORKS_ON AS W, DEPARTMENT AS D\n   WHERE    P.Pnumber = W.Pno AND D.Dnumber = P.Dnum\n   GROUP BY P.Pnumber, P.Pname, D.Dname;          -- 프로젝트 현황<\/pre><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p45.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p45.jpg\" alt=\"05 p.45 · 권한 부여용 뷰 DEPT5EMP (투플 제한), BASIC_EMP_DATA (속성 제한)\" loading=\"lazy\"><\/button><figcaption>05 p.45 · 권한 부여용 뷰 DEPT5EMP (투플 제한), BASIC_EMP_DATA (속성 제한)<\/figcaption><\/figure><\/section>", "title_en": "Views", "html_en": "<section class=\"sec\" id=\"s-view-def\"><h3>Definition and use of views<\/h3><p><b>View<\/b>: a <b>virtual table<\/b> derived from base tables. It may not exist physically.<\/p>\n<ul><li>Retrieval: no restrictions. Update: usually limited (effectively read-only)<\/li><li>Why use it: <b>simplifies complex queries<\/b>. If you often use a multi-table join or aggregation, define it as a view and use it like a <b>single-table query<\/b><\/li><\/ul>\n<pre class=\"code\">CREATE VIEW WORKS_ON1\nAS SELECT Fname, Lname, Pname, Hours\n   FROM   EMPLOYEE, PROJECT, WORKS_ON\n   WHERE  Ssn = Essn AND Pno = Pnumber;\n\nCREATE VIEW DEPT_INFO (Dept_name, No_of_emps, Total_sal)\nAS SELECT   Dname, COUNT(*), SUM(Salary)\n   FROM     DEPARTMENT, EMPLOYEE\n   WHERE    Dnumber = Dno\n   GROUP BY Dname;<\/pre>\n<ul><li>If no attribute names are given, the view uses the attribute names of the defining query (WORKS_ON1); they can also be given explicitly (DEPT_INFO)<\/li><li>Querying a view: <code>SELECT Fname, Lname FROM WORKS_ON1 WHERE Pname = 'ProductX';<\/code> → no need to join three tables every time<\/li><li><b>DROP VIEW WORKS_ON1;<\/b> → the defining tables are not affected<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p32.jpg\" aria-label=\"Enlarge\"><img src=\"img/ADV-p32.jpg\" alt=\"05 p.32 · CREATE VIEW WORKS_ON1, DEPT_INFO\" loading=\"lazy\"><\/button><figcaption>05 p.32 · CREATE VIEW WORKS_ON1, DEPT_INFO<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-view-impl\"><h3>View implementation: query modification vs materialization<\/h3><p>A view must always be <b>up-to-date<\/b> → when the defining tables change, the DBMS is responsible for reflecting it in the view.<\/p>\n<div class=\"tblw\"><table><thead><tr><th>Approach<\/th><th>Description<\/th><th>Characteristics<\/th><\/tr><\/thead><tbody><tr><td><b>Query modification<\/b><\/td><td><b>Transforms the view query into a query on the base tables<\/b>. The view is not stored physically<\/td><td>Convenient for users but inefficient for the DB system (complex views are recomputed every time)<\/td><\/tr><tr><td><b>View materialization<\/b><\/td><td><b>Physically creates a temporary view table<\/b> when the view is first queried and keeps it for a while<\/td><td>Assumes more queries on the view will follow. <b>Extra storage space<\/b>. When defining tables change, use <b>incremental update<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>When<\/b> to update a materialized view:<\/p>\n<ul><li><b>Immediate update<\/b>: as soon as the base tables change. Always up to date, but sometimes unnecessary and inefficient<\/li><li><b>Periodic update<\/b>: periodically. A view query may get a result that is not up to date<\/li><li><b>Lazy update<\/b>: when a view query needs it. Not up to date until a query arrives<\/li><\/ul>\n<p>If a materialized view is not queried for a certain period, it is removed and recomputed from scratch when needed later.<\/p><\/section>\n<section class=\"sec\" id=\"s-view-update\"><h3>Updating views<\/h3><p>Retrieval from a view is always possible, but INSERT/DELETE/UPDATE is impossible in many cases.<\/p>\n<p><b>A view is updatable when the view update corresponds to exactly one update on the base relations.<\/b><\/p>\n<ul><li><b>Single table + no aggregates<\/b> → maps to one base-table update → <b>allowed<\/b>. But the view's attributes must include (1) the base relation's <b>PK<\/b> and (2) <b>all NOT NULL attributes<\/b> without a DEFAULT (when inserting a tuple through the view those values cannot be empty)<\/li><li><b>Join (multiple tables)<\/b> → can be mapped in several ways, so <b>generally not updatable<\/b><\/li><li><b>Grouping and aggregation<\/b> → the update <b>does not make sense<\/b> → <b>not updatable<\/b><\/li><\/ul>\n<p>Example 1 (multiple interpretations): <code>UPDATE WORKS_ON1 SET Pname = 'ProductY' WHERE Lname = 'Smith' AND Fname = 'John' AND Pname = 'ProductX';<\/code><\/p>\n<ul><li>Interpretation a: change the project Smith works on → set Pno in WORKS_ON to ProductY's number (as intended)<\/li><li>Interpretation b: rename 'ProductX' in PROJECT to 'ProductY' → the view result looks the same, but with a <b>side effect<\/b>: every tuple that worked on ProductX changes<\/li><\/ul>\n<p>Example 2 (impossible): <code>UPDATE DEPT_INFO SET Total_sal = 100000 WHERE Dname = 'Research';<\/code> → Total_sal is a <b>computed value<\/b> (SUM), not physically stored → meaningless<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p42.jpg\" aria-label=\"Enlarge\"><img src=\"img/ADV-p42.jpg\" alt=\"05 p.42 · Two interpretations of an update on WORKS_ON1\" loading=\"lazy\"><\/button><figcaption>05 p.42 · Two interpretations of an update on WORKS_ON1<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p43.jpg\" aria-label=\"Enlarge\"><img src=\"img/ADV-p43.jpg\" alt=\"05 p.43 · Updating Total_sal of DEPT_INFO is meaningless\" loading=\"lazy\"><\/button><figcaption>05 p.43 · Updating Total_sal of DEPT_INFO is meaningless<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-view-auth\"><h3>Views for authorization<\/h3><p>Views can <b>hide certain attributes or tuples<\/b> from unauthorized users.<\/p>\n<pre class=\"code\">CREATE VIEW DEPT5EMP AS\nSELECT * FROM EMPLOYEE WHERE Dno = 5;            -- restricts tuples\n\nCREATE VIEW BASIC_EMP_DATA AS\nSELECT Fname, Lname, Address FROM EMPLOYEE;      -- restricts attributes<\/pre>\n<ul><li>DEPT5EMP: lets the manager of department 5 see only department 5 employees. The user is granted <b>query privileges only on the view<\/b>, not on EMPLOYEE<\/li><li>BASIC_EMP_DATA: general employees see only names and addresses<\/li><\/ul>\n<p>Slide Exercises 3 and 4, solutions:<\/p>\n<pre class=\"code\">CREATE VIEW DEPT_INFO (DeptName, MgrFname, MgrLname, MgrSalary)\nAS SELECT D.Dname, E.Fname, E.Lname, E.Salary\n   FROM   DEPARTMENT AS D, EMPLOYEE AS E\n   WHERE  D.Mgr_ssn = E.Ssn;                      -- department and manager info\n\nCREATE VIEW ProjectInfo (Pname, Dname, NumEmployees, TotalHours)\nAS SELECT   P.Pname, D.Dname, COUNT(*), SUM(W.Hours)\n   FROM     PROJECT AS P, WORKS_ON AS W, DEPARTMENT AS D\n   WHERE    P.Pnumber = W.Pno AND D.Dnumber = P.Dnum\n   GROUP BY P.Pnumber, P.Pname, D.Dname;          -- project summary<\/pre><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p45.jpg\" aria-label=\"Enlarge\"><img src=\"img/ADV-p45.jpg\" alt=\"05 p.45 · Views for authorization: DEPT5EMP (restricts tuples), BASIC_EMP_DATA (restricts attributes)\" loading=\"lazy\"><\/button><figcaption>05 p.45 · Views for authorization: DEPT5EMP (restricts tuples), BASIC_EMP_DATA (restricts attributes)<\/figcaption><\/figure><\/section>"}], "title_en": "Advanced SQL (Nested Queries, Joins, Aggregation, Views)", "intro_en": "Nested queries (IN, ALL/ANY, EXISTS), joined tables (NATURAL, OUTER), aggregation with GROUP BY/HAVING, assertions and triggers, views. This is the core of the SQL-writing questions, so solve lots of problems — especially \"… who do ALL …\" queries (division) and GROUP BY + HAVING."}, {"id": "U6", "title": "관계 대수 (Relational Algebra)", "src": "6-1_relational-algebra.pdf + db-exercises Week 7", "intro": "σ π ρ, 집합 연산, ×, ⋈(세타·동등·자연), ÷, ℑ(집계), 외부 조인. 질의를 \"중간 릴레이션 이름 ← 연산\" 순서로 쪼개 쓰는 연습이 핵심. 답안에 기호 대신 SELECT, PROJECT, JOIN 같은 단어를 써도 채점돼.", "lessons": [{"id": "L6-1", "title": "관계 대수 소개 · 질의 트리", "src": "6-1 p.3–6", "secs": [{"id": "ra-intro", "title": "관계 대수란", "title_en": "What is relational algebra?"}, {"id": "query-tree", "title": "질의 (실행) 트리", "title_en": "Query (execution) tree"}], "md": "## 관계 대수란 {#ra-intro}\n\n- **관계 대수 (relational algebra)**: \"데이터를 **어떻게** 가져오나\"에 대한 이론적·수학적 모델 → **절차적 (procedural)**\n- **SQL**은 고급 **선언적 (declarative)** 언어 → \"**무슨** 데이터가 필요한가\"만 말하고 어떻게 가져올지는 신경 안 씀\n- 형식적 관계 모델의 **기본 연산 집합**. 집합에 대한 수학 개념에 엄격하게 기반\n\n왜 중요한가:\n- 관계 모델 연산(선택, 투영, 이름 바꾸기, 조인, 카티션 곱…)의 **형식적 기초**\n- **질의 처리와 최적화의 기반**: 결과를 얻기 위한 연산의 **순서(sequence)** 를 명시\n\n> 시험 포인트: \"SQL = what (선언적), 관계 대수 = how (절차적)\". 그리고 관계 대수는 **닫힌 체계**: 모든 연산의 결과가 다시 릴레이션.\n\n## 질의 (실행) 트리 {#query-tree}\n\n**질의 트리 (query tree)**: DBMS 내부에서 질의를 표현하는 트리 = 관계 대수 식.\n- **잎 노드 = 입력 릴레이션**, **내부 노드 = 관계 대수 연산**\n- **잎에서 시작해 루트에서 끝난다** (아래에서 위로 실행)\n- 연산 순서를 명시적으로 보여줘서 질의를 이해하기 좋음\n\n교안 예: 'Stafford'에 있는 프로젝트마다 프로젝트 번호, 통제 부서 번호, 부서 관리자의 성·주소·생일\n```\nSELECT P.Pnumber, P.Dnum, E.Lname, E.Address, E.Bdate\nFROM   PROJECT P, DEPARTMENT D, EMPLOYEE E\nWHERE  P.Dnum = D.Dnumber AND D.Mgr_ssn = E.Ssn AND P.Plocation = 'Stafford';\n```\n트리: (1) σ Plocation='Stafford' (P) → (2) ⋈ P.Dnum=D.Dnumber D → (3) ⋈ D.Mgr_ssn=E.Ssn E → 루트 π Pnumber, Dnum, Lname, Address, Bdate\n\n**질의 처리**: 가능한 실행 전략(질의 트리) 중 적절한 걸 고르는 과정. **SQL 하나에 질의 트리(계획)가 여러 개** 있을 수 있다 → 어느 게 최선인지는 질의 최적화 (13주차).", "html": "<section class=\"sec\" id=\"s-ra-intro\"><h3>관계 대수란<\/h3><ul><li><b>관계 대수 (relational algebra)<\/b>: \"데이터를 <b>어떻게<\/b> 가져오나\"에 대한 이론적·수학적 모델 → <b>절차적 (procedural)<\/b><\/li><li><b>SQL<\/b>은 고급 <b>선언적 (declarative)<\/b> 언어 → \"<b>무슨<\/b> 데이터가 필요한가\"만 말하고 어떻게 가져올지는 신경 안 씀<\/li><li>형식적 관계 모델의 <b>기본 연산 집합<\/b>. 집합에 대한 수학 개념에 엄격하게 기반<\/li><\/ul>\n<p>왜 중요한가:<\/p>\n<ul><li>관계 모델 연산(선택, 투영, 이름 바꾸기, 조인, 카티션 곱…)의 <b>형식적 기초<\/b><\/li><li><b>질의 처리와 최적화의 기반<\/b>: 결과를 얻기 위한 연산의 <b>순서(sequence)<\/b> 를 명시<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: \"SQL = what (선언적), 관계 대수 = how (절차적)\". 그리고 관계 대수는 <b>닫힌 체계<\/b>: 모든 연산의 결과가 다시 릴레이션.<\/div><\/section>\n<section class=\"sec\" id=\"s-query-tree\"><h3>질의 (실행) 트리<\/h3><p><b>질의 트리 (query tree)<\/b>: DBMS 내부에서 질의를 표현하는 트리 = 관계 대수 식.<\/p>\n<ul><li><b>잎 노드 = 입력 릴레이션<\/b>, <b>내부 노드 = 관계 대수 연산<\/b><\/li><li><b>잎에서 시작해 루트에서 끝난다<\/b> (아래에서 위로 실행)<\/li><li>연산 순서를 명시적으로 보여줘서 질의를 이해하기 좋음<\/li><\/ul>\n<p>교안 예: 'Stafford'에 있는 프로젝트마다 프로젝트 번호, 통제 부서 번호, 부서 관리자의 성·주소·생일<\/p>\n<pre class=\"code\">SELECT P.Pnumber, P.Dnum, E.Lname, E.Address, E.Bdate\nFROM   PROJECT P, DEPARTMENT D, EMPLOYEE E\nWHERE  P.Dnum = D.Dnumber AND D.Mgr_ssn = E.Ssn AND P.Plocation = &#x27;Stafford&#x27;;<\/pre>\n<p>트리: (1) σ Plocation='Stafford' (P) → (2) ⋈ P.Dnum=D.Dnumber D → (3) ⋈ D.Mgr_ssn=E.Ssn E → 루트 π Pnumber, Dnum, Lname, Address, Bdate<\/p>\n<p><b>질의 처리<\/b>: 가능한 실행 전략(질의 트리) 중 적절한 걸 고르는 과정. <b>SQL 하나에 질의 트리(계획)가 여러 개<\/b> 있을 수 있다 → 어느 게 최선인지는 질의 최적화 (13주차).<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p5.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p5.jpg\" alt=\"06 p.5 · &#x27;Stafford&#x27; 질의의 질의 트리 (잎 = 릴레이션, 내부 노드 = 연산)\" loading=\"lazy\"><\/button><figcaption>06 p.5 · &#x27;Stafford&#x27; 질의의 질의 트리 (잎 = 릴레이션, 내부 노드 = 연산)<\/figcaption><\/figure><\/section>", "title_en": "Introduction to Relational Algebra, Query Trees", "html_en": "<section class=\"sec\" id=\"s-ra-intro\"><h3>What is relational algebra?<\/h3><ul><li><b>Relational algebra<\/b>: a theoretical, mathematical model of \"<b>how<\/b> to retrieve data\" → <b>procedural<\/b><\/li><li><b>SQL<\/b> is a high-level <b>declarative<\/b> language → it states only \"<b>what<\/b> data is needed\", without caring how it is retrieved<\/li><li>The <b>basic set of operations<\/b> of the formal relational model. Rigorously based on mathematical concepts of sets<\/li><\/ul>\n<p>Why it matters:<\/p>\n<ul><li>The <b>formal foundation<\/b> for relational model operations (select, project, rename, join, Cartesian product, …)<\/li><li><b>The basis for query processing and optimization<\/b>: it specifies the <b>sequence<\/b> of operations that produces the result<\/li><\/ul>\n<div class=\"callout exam\">Exam point: \"SQL = what (declarative), relational algebra = how (procedural)\". Also, relational algebra is a <b>closed system<\/b>: the result of every operation is again a relation.<\/div><\/section>\n<section class=\"sec\" id=\"s-query-tree\"><h3>Query (execution) tree<\/h3><p><b>Query tree<\/b>: a tree used inside the DBMS to represent a query = a relational algebra expression.<\/p>\n<ul><li><b>Leaf nodes = input relations<\/b>, <b>internal nodes = relational algebra operations<\/b><\/li><li><b>Execution starts at the leaves and ends at the root<\/b> (executed bottom-up)<\/li><li>It shows the order of operations explicitly, which makes the query easy to understand<\/li><\/ul>\n<p>Slide example: for every project located in 'Stafford', the project number, the controlling department number, and the department manager's last name, address and birth date<\/p>\n<pre class=\"code\">SELECT P.Pnumber, P.Dnum, E.Lname, E.Address, E.Bdate\nFROM   PROJECT P, DEPARTMENT D, EMPLOYEE E\nWHERE  P.Dnum = D.Dnumber AND D.Mgr_ssn = E.Ssn AND P.Plocation = &#x27;Stafford&#x27;;<\/pre>\n<p>Tree: (1) σ Plocation='Stafford' (P) → (2) ⋈ P.Dnum=D.Dnumber D → (3) ⋈ D.Mgr_ssn=E.Ssn E → root π Pnumber, Dnum, Lname, Address, Bdate<\/p>\n<p><b>Query processing<\/b>: the process of choosing a suitable execution strategy (query tree) among the possible ones. <b>One SQL query can have several query trees (plans)<\/b> → which one is best is query optimization (week 13).<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p5.jpg\" aria-label=\"Enlarge\"><img src=\"img/RA-p5.jpg\" alt=\"06 p.5 · Query tree for the &#x27;Stafford&#x27; query (leaves = relations, internal nodes = operations)\" loading=\"lazy\"><\/button><figcaption>06 p.5 · Query tree for the &#x27;Stafford&#x27; query (leaves = relations, internal nodes = operations)<\/figcaption><\/figure><\/section>"}, {"id": "L6-2", "title": "단항 연산: SELECT · PROJECT · RENAME", "src": "6-1 p.8–15", "secs": [{"id": "ra-select", "title": "SELECT (σ)", "title_en": "SELECT (σ)"}, {"id": "ra-project", "title": "PROJECT (π)", "title_en": "PROJECT (π)"}, {"id": "ra-rename", "title": "RENAME (ρ)", "title_en": "RENAME (ρ)"}, {"id": "ra-sequence", "title": "연산의 순서 (중간 릴레이션)", "title_en": "Sequences of operations (intermediate relations)"}], "md": "## SELECT (σ) {#ra-select}\n\n**σ<선택 조건>(R)**: 릴레이션에서 **선택 조건을 만족하는 투플의 부분집합**을 고름 → **수평 필터링**.\n- 조건은 투플 **각각에** 개별 적용\n- 결과는 R과 **같은 속성** → **결과 차수 = R의 차수**\n- 조건 = `<속성> <비교연산> <상수>` 또는 `<속성> <비교연산> <속성>` 절들을 **AND, OR**로 연결\n  - 비교 연산 {=, <, ≤, >, ≥, ≠}. 순서 있는 값(숫자, 날짜)은 전부, 순서 없는 값(색깔 등)은 {=, ≠}만\n- 예) σ Dno=4 (EMPLOYEE) → Zelaya, Wallace, Jabbar\n- 예) σ (Dno=4 AND Salary>25000) OR (Dno=5 AND Salary>30000) (EMPLOYEE) → Wong, Wallace, Narayan\n\n**성질**\n- **교환 법칙**: σ c1(σ c2(R)) = σ c2(σ c1(R))\n- 여러 σ는 AND로 **하나로 합칠 수 있음**: σ c1(σ c2(…σ cn(R))) = σ c1 AND c2 AND … AND cn(R)\n\n> 함정: 관계 대수의 SELECT(σ)는 SQL의 **SELECT 절이 아니라 WHERE 절**에 대응. `σ Dno=4 AND Salary>25000 (EMPLOYEE)` = `SELECT * FROM EMPLOYEE WHERE Dno=4 AND Salary>25000;`\n\n## PROJECT (π) {#ra-project}\n\n**π<속성 리스트>(R)**: 원하는 **열만** 남기고 나머지 열은 버림 → **수직 필터링**.\n- 결과 차수 = 속성 리스트의 속성 수\n- **중복 제거**: 속성 리스트에 키가 없으면(비키 속성만) 중복 투플이 생길 수 있는데, **π는 중복을 제거** → 결과는 서로 다른 투플의 **집합**\n  - 예) π Sex, Salary (EMPLOYEE) → 8행이 아니라 **7행** ((F, 25000)이 두 번 → 한 번)\n- SQL 대응: π 속성 리스트 = **SELECT 절**. 그런데 SQL은 중복을 안 지우므로 정확한 대응은 `SELECT DISTINCT Sex, Salary FROM EMPLOYEE;`\n\n## RENAME (ρ) {#ra-rename}\n\n**ρ**: 릴레이션 이름이나 속성 이름, 또는 둘 다 바꿈.\n- ρ S(B₁, …, Bₙ)(R): 둘 다 / ρ S(R): 릴레이션 이름만 / ρ (B₁, …, Bₙ)(R): 속성 이름만\n- 대입 형태로도 씀: `R(First_name, Last_name, Salary) ← π Fname, Lname, Salary (TEMP)`\n- SQL에서는 **AS (별칭)** 로 이름 바꾸기를 한다\n\n## 연산의 순서 (중간 릴레이션) {#ra-sequence}\n\n여러 연산을 쓸 때 두 방법:\n- **방법 1**: 중간 릴레이션에 이름을 붙여 순서를 명시\n```\nDEP5_EMPS ← σ Dno=5 (EMPLOYEE)\nRESULT    ← π Fname, Lname, Salary (DEP5_EMPS)\n```\n- **방법 2**: 연산을 **중첩**해서 하나의 식으로\n```\nπ Fname, Lname, Salary ( σ Dno=5 (EMPLOYEE) )\n```\n→ Smith 30000, Wong 40000, Narayan 38000, English 25000\n\n복잡한 질의는 하나의 식보다 **중간 결과 릴레이션으로 쪼개는 게 보통 더 쉽다**.", "html": "<section class=\"sec\" id=\"s-ra-select\"><h3>SELECT (σ)<\/h3><p><b>σ&lt;선택 조건&gt;(R)<\/b>: 릴레이션에서 <b>선택 조건을 만족하는 투플의 부분집합<\/b>을 고름 → <b>수평 필터링<\/b>.<\/p>\n<ul><li>조건은 투플 <b>각각에<\/b> 개별 적용<\/li><li>결과는 R과 <b>같은 속성<\/b> → <b>결과 차수 = R의 차수<\/b><\/li><li>조건 = <code>&lt;속성&gt; &lt;비교연산&gt; &lt;상수&gt;<\/code> 또는 <code>&lt;속성&gt; &lt;비교연산&gt; &lt;속성&gt;<\/code> 절들을 <b>AND, OR<\/b>로 연결<ul><li>비교 연산 {=, &lt;, ≤, &gt;, ≥, ≠}. 순서 있는 값(숫자, 날짜)은 전부, 순서 없는 값(색깔 등)은 {=, ≠}만<\/li><\/ul><\/li><li>예) σ Dno=4 (EMPLOYEE) → Zelaya, Wallace, Jabbar<\/li><li>예) σ (Dno=4 AND Salary&gt;25000) OR (Dno=5 AND Salary&gt;30000) (EMPLOYEE) → Wong, Wallace, Narayan<\/li><\/ul>\n<p><b>성질<\/b><\/p>\n<ul><li><b>교환 법칙<\/b>: σ c1(σ c2(R)) = σ c2(σ c1(R))<\/li><li>여러 σ는 AND로 <b>하나로 합칠 수 있음<\/b>: σ c1(σ c2(…σ cn(R))) = σ c1 AND c2 AND … AND cn(R)<\/li><\/ul>\n<div class=\"callout trap\">함정: 관계 대수의 SELECT(σ)는 SQL의 <b>SELECT 절이 아니라 WHERE 절<\/b>에 대응. <code>σ Dno=4 AND Salary&gt;25000 (EMPLOYEE)<\/code> = <code>SELECT * FROM EMPLOYEE WHERE Dno=4 AND Salary&gt;25000;<\/code><\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p9.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p9.jpg\" alt=\"06 p.9 · 선택 조건을 AND/OR로 연결한 σ\" loading=\"lazy\"><\/button><figcaption>06 p.9 · 선택 조건을 AND/OR로 연결한 σ<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-ra-project\"><h3>PROJECT (π)<\/h3><p><b>π&lt;속성 리스트&gt;(R)<\/b>: 원하는 <b>열만<\/b> 남기고 나머지 열은 버림 → <b>수직 필터링<\/b>.<\/p>\n<ul><li>결과 차수 = 속성 리스트의 속성 수<\/li><li><b>중복 제거<\/b>: 속성 리스트에 키가 없으면(비키 속성만) 중복 투플이 생길 수 있는데, <b>π는 중복을 제거<\/b> → 결과는 서로 다른 투플의 <b>집합<\/b><ul><li>예) π Sex, Salary (EMPLOYEE) → 8행이 아니라 <b>7행<\/b> ((F, 25000)이 두 번 → 한 번)<\/li><\/ul><\/li><li>SQL 대응: π 속성 리스트 = <b>SELECT 절<\/b>. 그런데 SQL은 중복을 안 지우므로 정확한 대응은 <code>SELECT DISTINCT Sex, Salary FROM EMPLOYEE;<\/code><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p12.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p12.jpg\" alt=\"06 p.12 · π Sex, Salary: 중복 제거 → SQL의 SELECT DISTINCT\" loading=\"lazy\"><\/button><figcaption>06 p.12 · π Sex, Salary: 중복 제거 → SQL의 SELECT DISTINCT<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-ra-rename\"><h3>RENAME (ρ)<\/h3><p><b>ρ<\/b>: 릴레이션 이름이나 속성 이름, 또는 둘 다 바꿈.<\/p>\n<ul><li>ρ S(B₁, …, Bₙ)(R): 둘 다 / ρ S(R): 릴레이션 이름만 / ρ (B₁, …, Bₙ)(R): 속성 이름만<\/li><li>대입 형태로도 씀: <code>R(First_name, Last_name, Salary) ← π Fname, Lname, Salary (TEMP)<\/code><\/li><li>SQL에서는 <b>AS (별칭)<\/b> 로 이름 바꾸기를 한다<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p13.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p13.jpg\" alt=\"06 p.13 · RENAME ρ의 세 가지 형태\" loading=\"lazy\"><\/button><figcaption>06 p.13 · RENAME ρ의 세 가지 형태<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-ra-sequence\"><h3>연산의 순서 (중간 릴레이션)<\/h3><p>여러 연산을 쓸 때 두 방법:<\/p>\n<ul><li><b>방법 1<\/b>: 중간 릴레이션에 이름을 붙여 순서를 명시<\/li><\/ul>\n<pre class=\"code\">DEP5_EMPS ← σ Dno=5 (EMPLOYEE)\nRESULT    ← π Fname, Lname, Salary (DEP5_EMPS)<\/pre>\n<ul><li><b>방법 2<\/b>: 연산을 <b>중첩<\/b>해서 하나의 식으로<\/li><\/ul>\n<pre class=\"code\">π Fname, Lname, Salary ( σ Dno=5 (EMPLOYEE) )<\/pre>\n<p>→ Smith 30000, Wong 40000, Narayan 38000, English 25000<\/p>\n<p>복잡한 질의는 하나의 식보다 <b>중간 결과 릴레이션으로 쪼개는 게 보통 더 쉽다<\/b>.<\/p><\/section>", "title_en": "Unary Operations: SELECT, PROJECT, RENAME", "html_en": "<section class=\"sec\" id=\"s-ra-select\"><h3>SELECT (σ)<\/h3><p><b>σ&lt;selection condition&gt;(R)<\/b>: selects the <b>subset of tuples of a relation that satisfy the selection condition<\/b> → <b>horizontal filtering<\/b>.<\/p>\n<ul><li>The condition is applied to <b>each tuple individually<\/b><\/li><li>The result has the <b>same attributes<\/b> as R → <b>degree of the result = degree of R<\/b><\/li><li>Condition = clauses of the form <code>&lt;attribute&gt; &lt;comparison op&gt; &lt;constant&gt;<\/code> or <code>&lt;attribute&gt; &lt;comparison op&gt; &lt;attribute&gt;<\/code>, connected by <b>AND, OR<\/b><ul><li>Comparison operators {=, &lt;, ≤, &gt;, ≥, ≠}. All of them for ordered values (numbers, dates); only {=, ≠} for unordered values (e.g., colors)<\/li><\/ul><\/li><li>e.g., σ Dno=4 (EMPLOYEE) → Zelaya, Wallace, Jabbar<\/li><li>e.g., σ (Dno=4 AND Salary&gt;25000) OR (Dno=5 AND Salary&gt;30000) (EMPLOYEE) → Wong, Wallace, Narayan<\/li><\/ul>\n<p><b>Properties<\/b><\/p>\n<ul><li><b>Commutative<\/b>: σ c1(σ c2(R)) = σ c2(σ c1(R))<\/li><li>A cascade of σ operations <b>can be combined into one<\/b> with AND: σ c1(σ c2(…σ cn(R))) = σ c1 AND c2 AND … AND cn(R)<\/li><\/ul>\n<div class=\"callout trap\">Trap: the relational algebra SELECT (σ) corresponds to SQL's <b>WHERE clause, not the SELECT clause<\/b>. <code>σ Dno=4 AND Salary&gt;25000 (EMPLOYEE)<\/code> = <code>SELECT * FROM EMPLOYEE WHERE Dno=4 AND Salary&gt;25000;<\/code><\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p9.jpg\" aria-label=\"Enlarge\"><img src=\"img/RA-p9.jpg\" alt=\"06 p.9 · σ with selection conditions connected by AND/OR\" loading=\"lazy\"><\/button><figcaption>06 p.9 · σ with selection conditions connected by AND/OR<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-ra-project\"><h3>PROJECT (π)<\/h3><p><b>π&lt;attribute list&gt;(R)<\/b>: keeps <b>only the desired columns<\/b> and discards the rest → <b>vertical filtering<\/b>.<\/p>\n<ul><li>Degree of the result = number of attributes in the attribute list<\/li><li><b>Duplicate elimination<\/b>: if the attribute list contains no key (only nonkey attributes), duplicate tuples may appear, but <b>π removes duplicates<\/b> → the result is a <b>set<\/b> of distinct tuples<ul><li>e.g., π Sex, Salary (EMPLOYEE) → <b>7 rows<\/b>, not 8 ((F, 25000) appears twice → once)<\/li><\/ul><\/li><li>SQL counterpart: the π attribute list = the <b>SELECT clause<\/b>. But SQL does not remove duplicates, so the exact equivalent is <code>SELECT DISTINCT Sex, Salary FROM EMPLOYEE;<\/code><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p12.jpg\" aria-label=\"Enlarge\"><img src=\"img/RA-p12.jpg\" alt=\"06 p.12 · π Sex, Salary: duplicates removed → SQL&#x27;s SELECT DISTINCT\" loading=\"lazy\"><\/button><figcaption>06 p.12 · π Sex, Salary: duplicates removed → SQL&#x27;s SELECT DISTINCT<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-ra-rename\"><h3>RENAME (ρ)<\/h3><p><b>ρ<\/b>: renames the relation, its attributes, or both.<\/p>\n<ul><li>ρ S(B₁, …, Bₙ)(R): both / ρ S(R): relation name only / ρ (B₁, …, Bₙ)(R): attribute names only<\/li><li>Also written as an assignment: <code>R(First_name, Last_name, Salary) ← π Fname, Lname, Salary (TEMP)<\/code><\/li><li>In SQL, renaming is done with <b>AS (aliasing)<\/b><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p13.jpg\" aria-label=\"Enlarge\"><img src=\"img/RA-p13.jpg\" alt=\"06 p.13 · Three forms of RENAME ρ\" loading=\"lazy\"><\/button><figcaption>06 p.13 · Three forms of RENAME ρ<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-ra-sequence\"><h3>Sequences of operations (intermediate relations)<\/h3><p>Two ways to apply several operations:<\/p>\n<ul><li><b>Method 1<\/b>: name the intermediate relations to make the sequence explicit<\/li><\/ul>\n<pre class=\"code\">DEP5_EMPS ← σ Dno=5 (EMPLOYEE)\nRESULT    ← π Fname, Lname, Salary (DEP5_EMPS)<\/pre>\n<ul><li><b>Method 2<\/b>: <b>nest<\/b> the operations into a single expression<\/li><\/ul>\n<pre class=\"code\">π Fname, Lname, Salary ( σ Dno=5 (EMPLOYEE) )<\/pre>\n<p>→ Smith 30000, Wong 40000, Narayan 38000, English 25000<\/p>\n<p>For complex queries it is <b>usually easier to break them into intermediate result relations<\/b> than to write one expression.<\/p><\/section>"}, {"id": "L6-3", "title": "집합 연산 · 카티션 곱", "src": "6-1 p.17–22", "secs": [{"id": "ra-setops", "title": "합 · 교 · 차", "title_en": "Union, intersection, difference"}, {"id": "ra-cartesian", "title": "카티션 곱 (×)", "title_en": "Cartesian product (×)"}], "md": "## 합 · 교 · 차 {#ra-setops}\n\n**합집합 R ∪ S**, **교집합 R ∩ S**, **차집합 R − S** (MINUS, EXCEPT). 결과에서 **중복 제거**.\n- **타입 호환 (type compatible, union compatible)** 인 릴레이션에만 적용: R(A₁…Aₙ)과 S(B₁…Bₙ)의 **속성 수가 같고**, 모든 i에 대해 **dom(Aᵢ) = dom(Bᵢ)**\n- 교안 예: 5번 부서에서 일하거나, 5번 부서 사원을 직접 감독하는 사원의 SSN\n```\nDEP5_EMPS ← σ Dno=5 (EMPLOYEE)\nRESULT1   ← π Ssn (DEP5_EMPS)\nRESULT2(Ssn) ← π Super_ssn (DEP5_EMPS)\nRESULT    ← RESULT1 ∪ RESULT2\n```\n→ RESULT1 = {123456789, 333445555, 666884444, 453453453}, RESULT2 = {333445555, 888665555}, RESULT = 5개 (333445555는 한 번만)\n\n**성질**\n- ∪와 ∩는 **교환** (R ∪ S = S ∪ R) **결합** (R ∪ (S ∪ T) = (R ∪ S) ∪ T)\n- **−는 교환 법칙이 성립하지 않는다**: R − S ≠ S − R (STUDENT − INSTRUCTOR와 INSTRUCTOR − STUDENT는 다름)\n- 결과 속성 이름은 관례상 **첫 번째 릴레이션**의 이름을 따름\n\n## 카티션 곱 (×) {#ra-cartesian}\n\n**R(A₁…Aₙ) × S(B₁…Bₘ) → Q(A₁…Aₙ, B₁…Bₘ)**: 두 릴레이션 투플의 **모든 가능한 조합**을 이어 붙임. CROSS PRODUCT, CROSS JOIN.\n- **타입 호환 아니어도** 적용 가능한 이항 집합 연산\n- 결과 속성 수 = **n + m**, 투플 수 = **|R| × |S|**\n- 그 자체로는 대개 의미 없음 → **뒤에 SELECT가 와서** 관련 있는 투플만 고를 때 유용\n\n교안 예: 여성 사원의 부양가족 이름\n```\nFEMALE_EMPS       ← σ Sex='F' (EMPLOYEE)\nEMPNAMES          ← π Fname, Lname, Ssn (FEMALE_EMPS)\nEMP_DEPENDENTS    ← EMPNAMES × DEPENDENT              -- 3 × 7 = 21행 (의미 없음)\nACTUAL_DEPENDENTS ← σ Ssn=Essn (EMP_DEPENDENTS)\nRESULT            ← π Fname, Lname, Dependent_name (ACTUAL_DEPENDENTS)\n```\n→ Jennifer Wallace – Abner 한 행. **× 다음 σ = JOIN** (다음 레슨).", "html": "<section class=\"sec\" id=\"s-ra-setops\"><h3>합 · 교 · 차<\/h3><p><b>합집합 R ∪ S<\/b>, <b>교집합 R ∩ S<\/b>, <b>차집합 R − S<\/b> (MINUS, EXCEPT). 결과에서 <b>중복 제거<\/b>.<\/p>\n<ul><li><b>타입 호환 (type compatible, union compatible)<\/b> 인 릴레이션에만 적용: R(A₁…Aₙ)과 S(B₁…Bₙ)의 <b>속성 수가 같고<\/b>, 모든 i에 대해 <b>dom(Aᵢ) = dom(Bᵢ)<\/b><\/li><li>교안 예: 5번 부서에서 일하거나, 5번 부서 사원을 직접 감독하는 사원의 SSN<\/li><\/ul>\n<pre class=\"code\">DEP5_EMPS ← σ Dno=5 (EMPLOYEE)\nRESULT1   ← π Ssn (DEP5_EMPS)\nRESULT2(Ssn) ← π Super_ssn (DEP5_EMPS)\nRESULT    ← RESULT1 ∪ RESULT2<\/pre>\n<p>→ RESULT1 = {123456789, 333445555, 666884444, 453453453}, RESULT2 = {333445555, 888665555}, RESULT = 5개 (333445555는 한 번만)<\/p>\n<p><b>성질<\/b><\/p>\n<ul><li>∪와 ∩는 <b>교환<\/b> (R ∪ S = S ∪ R) <b>결합<\/b> (R ∪ (S ∪ T) = (R ∪ S) ∪ T)<\/li><li><b>−는 교환 법칙이 성립하지 않는다<\/b>: R − S ≠ S − R (STUDENT − INSTRUCTOR와 INSTRUCTOR − STUDENT는 다름)<\/li><li>결과 속성 이름은 관례상 <b>첫 번째 릴레이션<\/b>의 이름을 따름<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p17.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p17.jpg\" alt=\"06 p.17 · RESULT1 ∪ RESULT2 (타입 호환)\" loading=\"lazy\"><\/button><figcaption>06 p.17 · RESULT1 ∪ RESULT2 (타입 호환)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-ra-cartesian\"><h3>카티션 곱 (×)<\/h3><p><b>R(A₁…Aₙ) × S(B₁…Bₘ) → Q(A₁…Aₙ, B₁…Bₘ)<\/b>: 두 릴레이션 투플의 <b>모든 가능한 조합<\/b>을 이어 붙임. CROSS PRODUCT, CROSS JOIN.<\/p>\n<ul><li><b>타입 호환 아니어도<\/b> 적용 가능한 이항 집합 연산<\/li><li>결과 속성 수 = <b>n + m<\/b>, 투플 수 = <b>|R| × |S|<\/b><\/li><li>그 자체로는 대개 의미 없음 → <b>뒤에 SELECT가 와서<\/b> 관련 있는 투플만 고를 때 유용<\/li><\/ul>\n<p>교안 예: 여성 사원의 부양가족 이름<\/p>\n<pre class=\"code\">FEMALE_EMPS       ← σ Sex=&#x27;F&#x27; (EMPLOYEE)\nEMPNAMES          ← π Fname, Lname, Ssn (FEMALE_EMPS)\nEMP_DEPENDENTS    ← EMPNAMES × DEPENDENT              -- 3 × 7 = 21행 (의미 없음)\nACTUAL_DEPENDENTS ← σ Ssn=Essn (EMP_DEPENDENTS)\nRESULT            ← π Fname, Lname, Dependent_name (ACTUAL_DEPENDENTS)<\/pre>\n<p>→ Jennifer Wallace – Abner 한 행. <b>× 다음 σ = JOIN<\/b> (다음 레슨).<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p21.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p21.jpg\" alt=\"06 p.21 · EMPNAMES × DEPENDENT = 3 × 7 = 21행\" loading=\"lazy\"><\/button><figcaption>06 p.21 · EMPNAMES × DEPENDENT = 3 × 7 = 21행<\/figcaption><\/figure><\/section>", "title_en": "Set Operations, Cartesian Product", "html_en": "<section class=\"sec\" id=\"s-ra-setops\"><h3>Union, intersection, difference<\/h3><p><b>Union R ∪ S<\/b>, <b>intersection R ∩ S<\/b>, <b>set difference R − S<\/b> (MINUS, EXCEPT). <b>Duplicates are eliminated<\/b> in the result.<\/p>\n<ul><li>Applies only to <b>type compatible (union compatible)<\/b> relations: R(A₁…Aₙ) and S(B₁…Bₙ) have <b>the same number of attributes<\/b>, and <b>dom(Aᵢ) = dom(Bᵢ)<\/b> for all i<\/li><li>Slide example: SSNs of all employees who either work in department 5 or directly supervise an employee who works in department 5<\/li><\/ul>\n<pre class=\"code\">DEP5_EMPS ← σ Dno=5 (EMPLOYEE)\nRESULT1   ← π Ssn (DEP5_EMPS)\nRESULT2(Ssn) ← π Super_ssn (DEP5_EMPS)\nRESULT    ← RESULT1 ∪ RESULT2<\/pre>\n<p>→ RESULT1 = {123456789, 333445555, 666884444, 453453453}, RESULT2 = {333445555, 888665555}, RESULT = 5 SSNs (333445555 only once)<\/p>\n<p><b>Properties<\/b><\/p>\n<ul><li>∪ and ∩ are <b>commutative<\/b> (R ∪ S = S ∪ R) and <b>associative<\/b> (R ∪ (S ∪ T) = (R ∪ S) ∪ T)<\/li><li><b>− is not commutative<\/b>: R − S ≠ S − R (STUDENT − INSTRUCTOR differs from INSTRUCTOR − STUDENT)<\/li><li>By convention, the result's attribute names are those of the <b>first relation<\/b><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p17.jpg\" aria-label=\"Enlarge\"><img src=\"img/RA-p17.jpg\" alt=\"06 p.17 · RESULT1 ∪ RESULT2 (type compatible)\" loading=\"lazy\"><\/button><figcaption>06 p.17 · RESULT1 ∪ RESULT2 (type compatible)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-ra-cartesian\"><h3>Cartesian product (×)<\/h3><p><b>R(A₁…Aₙ) × S(B₁…Bₘ) → Q(A₁…Aₙ, B₁…Bₘ)<\/b>: concatenates <b>every possible combination<\/b> of tuples from the two relations. Also called CROSS PRODUCT or CROSS JOIN.<\/p>\n<ul><li>A binary set operation that applies <b>even when the relations are not type compatible<\/b><\/li><li>Number of attributes in the result = <b>n + m<\/b>, number of tuples = <b>|R| × |S|<\/b><\/li><li>Usually meaningless by itself → useful when <b>followed by a SELECT<\/b> that keeps only related tuples<\/li><\/ul>\n<p>Slide example: names of the dependents of female employees<\/p>\n<pre class=\"code\">FEMALE_EMPS       ← σ Sex=&#x27;F&#x27; (EMPLOYEE)\nEMPNAMES          ← π Fname, Lname, Ssn (FEMALE_EMPS)\nEMP_DEPENDENTS    ← EMPNAMES × DEPENDENT              -- 3 × 7 = 21 rows (meaningless)\nACTUAL_DEPENDENTS ← σ Ssn=Essn (EMP_DEPENDENTS)\nRESULT            ← π Fname, Lname, Dependent_name (ACTUAL_DEPENDENTS)<\/pre>\n<p>→ One row: Jennifer Wallace – Abner. <b>× followed by σ = JOIN<\/b> (next lesson).<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p21.jpg\" aria-label=\"Enlarge\"><img src=\"img/RA-p21.jpg\" alt=\"06 p.21 · EMPNAMES × DEPENDENT = 3 × 7 = 21 rows\" loading=\"lazy\"><\/button><figcaption>06 p.21 · EMPNAMES × DEPENDENT = 3 × 7 = 21 rows<\/figcaption><\/figure><\/section>"}, {"id": "L6-4", "title": "JOIN · DIVISION · 완전 집합", "src": "6-1 p.24–34", "secs": [{"id": "ra-join", "title": "JOIN (⋈)", "title_en": "JOIN (⋈)"}, {"id": "join-variants", "title": "세타 · 동등 · 자연 조인", "title_en": "Theta, equi and natural joins"}, {"id": "join-size", "title": "조인 결과의 크기", "title_en": "Size of a join result"}, {"id": "ra-division", "title": "DIVISION (÷)", "title_en": "DIVISION (÷)"}, {"id": "ra-complete", "title": "관계 대수 연산의 완전 집합", "title_en": "Complete set of relational algebra operations"}], "md": "## JOIN (⋈) {#ra-join}\n\n**R ⋈<조인 조건> S**: 두 릴레이션의 **관련 있는 투플을 하나의 긴 투플로** 결합. 결과 Q(A₁…Aₙ, B₁…Bₘ)에는 **조인 조건을 만족하는 조합만**.\n- 예) 각 부서 관리자의 이름\n```\nDEPT_MGR ← DEPARTMENT ⋈ Mgr_ssn=Ssn EMPLOYEE\nRESULT   ← π Dname, Lname, Fname (DEPT_MGR)\n```\n→ Research–Wong, Administration–Wallace, Headquarters–Borg\n- **JOIN = 카티션 곱 + SELECT**: `EMP_DEPENDENTS ← EMPNAMES × DEPENDENT; ACTUAL ← σ Ssn=Essn (EMP_DEPENDENTS)` 두 줄을 `ACTUAL ← EMPNAMES ⋈ Ssn=Essn DEPENDENT` 한 줄로\n\n## 세타 · 동등 · 자연 조인 {#join-variants}\n\n- **세타 조인 (THETA JOIN)**: 일반 조인 조건. `<조건> AND <조건> AND …`, 각 조건은 **Aᵢ θ Bⱼ** (θ ∈ {=, <, ≤, >, ≥, ≠}). 조건을 모두 만족하는 투플만\n- **동등 조인 (EQUIJOIN)**: 비교 연산자가 **= 만** 쓰인 조인. 결과에 값이 똑같은 속성 쌍이 생김 (예: Mgr_ssn과 Ssn) → 하나는 불필요\n- **자연 조인 (NATURAL JOIN, * 로 표기)**: 동등 조인에서 **중복 속성 하나를 없앤 것**\n  - 조인 속성은 두 릴레이션에서 **이름이 같아야** 함. 다르면 **먼저 이름을 바꿈**\n  - `DEPT_LOCS ← DEPARTMENT * DEPT_LOCATIONS` (Dnumber가 같은 이름) → Dnumber 한 번만\n  - `DEPT ← ρ (Dname, Dnum, Mgr_ssn, Mgr_start_date) (DEPARTMENT); PROJ_DEPT ← PROJECT * DEPT` (Dnum으로 맞춤)\n\n> 함정: 자연 조인은 이름이 같은 속성 **전부**를 조인 조건으로 쓴다. 의도치 않게 이름이 같은 속성(예: 둘 다 Name)이 있으면 엉뚱한 조건이 붙는다.\n\n## 조인 결과의 크기 {#join-size}\n\n- **0 ≤ |R ⋈ S| ≤ |R| × |S|**\n- 최소: 조인 조건을 만족하는 조합이 하나도 없으면 → **빈 릴레이션**\n- 최대: 모든 조합이 조건을 만족하거나 조건이 없으면 → **카티션 곱**과 같음\n- **조인 선택도 (join selectivity)** = 예상 조인 결과 크기 / (|R| × |S|). 질의 최적화에서 질의 계획의 비용 추정에 씀\n\n## DIVISION (÷) {#ra-division}\n\n\"**모든** ~를 하는\" 질의를 위한 연산. 기본 연산으로 표현할 수 있지만 따로 둠.\n- 형식: **R(Z) ÷ S(X) = T(Y)**, X ⊆ Z (S의 속성은 R 속성의 부분집합), **Y = Z − X**\n- T에는 R에서 **S의 모든 값과 짝지어 나타나는** Y 값만 들어감 (분모 S가 분자 R을 제한)\n- 예) R(A, B) = {(a1,b1), (a2,b1), (a3,b1), (a4,b1), (a1,b2), (a3,b2), (a2,b3), (a3,b3), (a4,b3), (a1,b4), (a2,b4), (a3,b4)}, S(A) = {a1, a2, a3} → T(B) = {b1, b4}\n\n교안 예: 'John Smith'가 일하는 **모든** 프로젝트에서 일하는 사원의 이름\n```\nSMITH      ← σ Fname='John' AND Lname='Smith' (EMPLOYEE)\nSMITH_PNOS ← π Pno (WORKS_ON ⋈ Essn=Ssn SMITH)            -- {1, 2}\nSSN_PNOS   ← π Essn, Pno (WORKS_ON)\nSSNS(Ssn)  ← SSN_PNOS ÷ SMITH_PNOS                         -- {123456789, 453453453}\nRESULT     ← π Fname, Lname (SSNS * EMPLOYEE)\n```\n→ John Smith, Joyce English\n\n> 시험 포인트: 분자 R의 속성 순서·이름을 맞춰야 한다. SSN_PNOS(Essn, Pno) ÷ SMITH_PNOS(Pno) → 남는 속성 Essn. 결과를 EMPLOYEE와 자연 조인하려고 SSNS(Ssn)으로 이름을 바꿨다.\n\n## 관계 대수 연산의 완전 집합 {#ra-complete}\n\n**{σ, π, ∪, ρ, −, ×}** 6개가 완전 집합. 다른 모든 (원래의) 관계 대수 연산은 이 6개의 조합으로 표현 가능.\n- **교집합**: R ∩ S ≡ (R ∪ S) − ((R − S) ∪ (S − R))\n- **조인**: R ⋈<조건> S ≡ σ<조건>(R × S)\n- **자연 조인**: 카티션 곱 앞에 RENAME, 뒤에 SELECT와 PROJECT\n- 엄밀히는 ∩와 ⋈가 필요 없지만 **자주 쓰여서** 별도 연산으로 둔다", "html": "<section class=\"sec\" id=\"s-ra-join\"><h3>JOIN (⋈)<\/h3><p><b>R ⋈&lt;조인 조건&gt; S<\/b>: 두 릴레이션의 <b>관련 있는 투플을 하나의 긴 투플로<\/b> 결합. 결과 Q(A₁…Aₙ, B₁…Bₘ)에는 <b>조인 조건을 만족하는 조합만<\/b>.<\/p>\n<ul><li>예) 각 부서 관리자의 이름<\/li><\/ul>\n<pre class=\"code\">DEPT_MGR ← DEPARTMENT ⋈ Mgr_ssn=Ssn EMPLOYEE\nRESULT   ← π Dname, Lname, Fname (DEPT_MGR)<\/pre>\n<p>→ Research–Wong, Administration–Wallace, Headquarters–Borg<\/p>\n<ul><li><b>JOIN = 카티션 곱 + SELECT<\/b>: <code>EMP_DEPENDENTS ← EMPNAMES × DEPENDENT; ACTUAL ← σ Ssn=Essn (EMP_DEPENDENTS)<\/code> 두 줄을 <code>ACTUAL ← EMPNAMES ⋈ Ssn=Essn DEPENDENT<\/code> 한 줄로<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p24.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p24.jpg\" alt=\"06 p.24 · DEPARTMENT ⋈ Mgr_ssn=Ssn EMPLOYEE\" loading=\"lazy\"><\/button><figcaption>06 p.24 · DEPARTMENT ⋈ Mgr_ssn=Ssn EMPLOYEE<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-join-variants\"><h3>세타 · 동등 · 자연 조인<\/h3><ul><li><b>세타 조인 (THETA JOIN)<\/b>: 일반 조인 조건. <code>&lt;조건&gt; AND &lt;조건&gt; AND …<\/code>, 각 조건은 <b>Aᵢ θ Bⱼ<\/b> (θ ∈ {=, &lt;, ≤, &gt;, ≥, ≠}). 조건을 모두 만족하는 투플만<\/li><li><b>동등 조인 (EQUIJOIN)<\/b>: 비교 연산자가 <b>= 만<\/b> 쓰인 조인. 결과에 값이 똑같은 속성 쌍이 생김 (예: Mgr_ssn과 Ssn) → 하나는 불필요<\/li><li><b>자연 조인 (NATURAL JOIN, * 로 표기)<\/b>: 동등 조인에서 <b>중복 속성 하나를 없앤 것<\/b><ul><li>조인 속성은 두 릴레이션에서 <b>이름이 같아야<\/b> 함. 다르면 <b>먼저 이름을 바꿈<\/b><\/li><li><code>DEPT_LOCS ← DEPARTMENT * DEPT_LOCATIONS<\/code> (Dnumber가 같은 이름) → Dnumber 한 번만<\/li><li><code>DEPT ← ρ (Dname, Dnum, Mgr_ssn, Mgr_start_date) (DEPARTMENT); PROJ_DEPT ← PROJECT * DEPT<\/code> (Dnum으로 맞춤)<\/li><\/ul><\/li><\/ul>\n<div class=\"callout trap\">함정: 자연 조인은 이름이 같은 속성 <b>전부<\/b>를 조인 조건으로 쓴다. 의도치 않게 이름이 같은 속성(예: 둘 다 Name)이 있으면 엉뚱한 조건이 붙는다.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p28.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p28.jpg\" alt=\"06 p.28 · 자연 조인 (*): 이름이 같은 속성으로, 다르면 먼저 RENAME\" loading=\"lazy\"><\/button><figcaption>06 p.28 · 자연 조인 (*): 이름이 같은 속성으로, 다르면 먼저 RENAME<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-join-size\"><h3>조인 결과의 크기<\/h3><ul><li><b>0 ≤ |R ⋈ S| ≤ |R| × |S|<\/b><\/li><li>최소: 조인 조건을 만족하는 조합이 하나도 없으면 → <b>빈 릴레이션<\/b><\/li><li>최대: 모든 조합이 조건을 만족하거나 조건이 없으면 → <b>카티션 곱<\/b>과 같음<\/li><li><b>조인 선택도 (join selectivity)<\/b> = 예상 조인 결과 크기 / (|R| × |S|). 질의 최적화에서 질의 계획의 비용 추정에 씀<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-ra-division\"><h3>DIVISION (÷)<\/h3><p>\"<b>모든<\/b> ~를 하는\" 질의를 위한 연산. 기본 연산으로 표현할 수 있지만 따로 둠.<\/p>\n<ul><li>형식: <b>R(Z) ÷ S(X) = T(Y)<\/b>, X ⊆ Z (S의 속성은 R 속성의 부분집합), <b>Y = Z − X<\/b><\/li><li>T에는 R에서 <b>S의 모든 값과 짝지어 나타나는<\/b> Y 값만 들어감 (분모 S가 분자 R을 제한)<\/li><li>예) R(A, B) = {(a1,b1), (a2,b1), (a3,b1), (a4,b1), (a1,b2), (a3,b2), (a2,b3), (a3,b3), (a4,b3), (a1,b4), (a2,b4), (a3,b4)}, S(A) = {a1, a2, a3} → T(B) = {b1, b4}<\/li><\/ul>\n<p>교안 예: 'John Smith'가 일하는 <b>모든<\/b> 프로젝트에서 일하는 사원의 이름<\/p>\n<pre class=\"code\">SMITH      ← σ Fname=&#x27;John&#x27; AND Lname=&#x27;Smith&#x27; (EMPLOYEE)\nSMITH_PNOS ← π Pno (WORKS_ON ⋈ Essn=Ssn SMITH)            -- {1, 2}\nSSN_PNOS   ← π Essn, Pno (WORKS_ON)\nSSNS(Ssn)  ← SSN_PNOS ÷ SMITH_PNOS                         -- {123456789, 453453453}\nRESULT     ← π Fname, Lname (SSNS * EMPLOYEE)<\/pre>\n<p>→ John Smith, Joyce English<\/p>\n<div class=\"callout exam\">시험 포인트: 분자 R의 속성 순서·이름을 맞춰야 한다. SSN_PNOS(Essn, Pno) ÷ SMITH_PNOS(Pno) → 남는 속성 Essn. 결과를 EMPLOYEE와 자연 조인하려고 SSNS(Ssn)으로 이름을 바꿨다.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p32.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p32.jpg\" alt=\"06 p.32 · SSN_PNOS ÷ SMITH_PNOS\" loading=\"lazy\"><\/button><figcaption>06 p.32 · SSN_PNOS ÷ SMITH_PNOS<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p33.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p33.jpg\" alt=\"06 p.33 · R(Z) ÷ S(X) = T(Y), Y = Z − X\" loading=\"lazy\"><\/button><figcaption>06 p.33 · R(Z) ÷ S(X) = T(Y), Y = Z − X<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-ra-complete\"><h3>관계 대수 연산의 완전 집합<\/h3><p><b>{σ, π, ∪, ρ, −, ×}<\/b> 6개가 완전 집합. 다른 모든 (원래의) 관계 대수 연산은 이 6개의 조합으로 표현 가능.<\/p>\n<ul><li><b>교집합<\/b>: R ∩ S ≡ (R ∪ S) − ((R − S) ∪ (S − R))<\/li><li><b>조인<\/b>: R ⋈&lt;조건&gt; S ≡ σ&lt;조건&gt;(R × S)<\/li><li><b>자연 조인<\/b>: 카티션 곱 앞에 RENAME, 뒤에 SELECT와 PROJECT<\/li><li>엄밀히는 ∩와 ⋈가 필요 없지만 <b>자주 쓰여서<\/b> 별도 연산으로 둔다<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p34.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p34.jpg\" alt=\"06 p.34 · 완전 집합 {σ, π, ∪, ρ, −, ×}\" loading=\"lazy\"><\/button><figcaption>06 p.34 · 완전 집합 {σ, π, ∪, ρ, −, ×}<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p44.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p44.jpg\" alt=\"06 p.44 · 관계 대수 연산 요약표\" loading=\"lazy\"><\/button><figcaption>06 p.44 · 관계 대수 연산 요약표<\/figcaption><\/figure><\/section>", "title_en": "JOIN, DIVISION, Complete Set", "html_en": "<section class=\"sec\" id=\"s-ra-join\"><h3>JOIN (⋈)<\/h3><p><b>R ⋈&lt;join condition&gt; S<\/b>: combines <b>related tuples from two relations into single longer tuples<\/b>. The result Q(A₁…Aₙ, B₁…Bₘ) contains <b>only the combinations that satisfy the join condition<\/b>.<\/p>\n<ul><li>e.g., the name of the manager of each department<\/li><\/ul>\n<pre class=\"code\">DEPT_MGR ← DEPARTMENT ⋈ Mgr_ssn=Ssn EMPLOYEE\nRESULT   ← π Dname, Lname, Fname (DEPT_MGR)<\/pre>\n<p>→ Research–Wong, Administration–Wallace, Headquarters–Borg<\/p>\n<ul><li><b>JOIN = Cartesian product + SELECT<\/b>: the two lines <code>EMP_DEPENDENTS ← EMPNAMES × DEPENDENT; ACTUAL ← σ Ssn=Essn (EMP_DEPENDENTS)<\/code> become the one line <code>ACTUAL ← EMPNAMES ⋈ Ssn=Essn DEPENDENT<\/code><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p24.jpg\" aria-label=\"Enlarge\"><img src=\"img/RA-p24.jpg\" alt=\"06 p.24 · DEPARTMENT ⋈ Mgr_ssn=Ssn EMPLOYEE\" loading=\"lazy\"><\/button><figcaption>06 p.24 · DEPARTMENT ⋈ Mgr_ssn=Ssn EMPLOYEE<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-join-variants\"><h3>Theta, equi and natural joins<\/h3><ul><li><b>THETA JOIN<\/b>: a general join condition. <code>&lt;condition&gt; AND &lt;condition&gt; AND …<\/code>, each condition of the form <b>Aᵢ θ Bⱼ<\/b> (θ ∈ {=, &lt;, ≤, &gt;, ≥, ≠}). Only tuples satisfying all conditions<\/li><li><b>EQUIJOIN<\/b>: a join that uses <b>only =<\/b> as the comparison operator. The result has pairs of attributes with identical values (e.g., Mgr_ssn and Ssn) → one of each pair is superfluous<\/li><li><b>NATURAL JOIN (denoted *)<\/b>: an equijoin with <b>one of each pair of duplicate attributes removed<\/b><ul><li>The join attributes must <b>have the same name<\/b> in both relations. If not, <b>rename them first<\/b><\/li><li><code>DEPT_LOCS ← DEPARTMENT * DEPT_LOCATIONS<\/code> (Dnumber has the same name) → Dnumber appears once<\/li><li><code>DEPT ← ρ (Dname, Dnum, Mgr_ssn, Mgr_start_date) (DEPARTMENT); PROJ_DEPT ← PROJECT * DEPT<\/code> (matched on Dnum)<\/li><\/ul><\/li><\/ul>\n<div class=\"callout trap\">Trap: a natural join uses <b>all<\/b> attributes with the same name as join conditions. If some attributes accidentally share a name (e.g., both have Name), an unintended condition is added.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p28.jpg\" aria-label=\"Enlarge\"><img src=\"img/RA-p28.jpg\" alt=\"06 p.28 · Natural join (*): on attributes with the same name; if names differ, RENAME first\" loading=\"lazy\"><\/button><figcaption>06 p.28 · Natural join (*): on attributes with the same name; if names differ, RENAME first<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-join-size\"><h3>Size of a join result<\/h3><ul><li><b>0 ≤ |R ⋈ S| ≤ |R| × |S|<\/b><\/li><li>Minimum: if no combination satisfies the join condition → an <b>empty relation<\/b><\/li><li>Maximum: if every combination satisfies the condition, or there is no condition → same as the <b>Cartesian product<\/b><\/li><li><b>Join selectivity<\/b> = expected size of the join result / (|R| × |S|). Used in query optimization to estimate the cost of query plans<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-ra-division\"><h3>DIVISION (÷)<\/h3><p>An operation for \"… who do <b>all<\/b> …\" queries. It can be expressed with basic operations but is defined separately.<\/p>\n<ul><li>Form: <b>R(Z) ÷ S(X) = T(Y)<\/b>, where X ⊆ Z (the attributes of S are a subset of those of R) and <b>Y = Z − X<\/b><\/li><li>T contains only the Y values that <b>appear in R in combination with every value in S<\/b> (the denominator S restricts the numerator R)<\/li><li>e.g., R(A, B) = {(a1,b1), (a2,b1), (a3,b1), (a4,b1), (a1,b2), (a3,b2), (a2,b3), (a3,b3), (a4,b3), (a1,b4), (a2,b4), (a3,b4)}, S(A) = {a1, a2, a3} → T(B) = {b1, b4}<\/li><\/ul>\n<p>Slide example: names of employees who work on <b>all<\/b> the projects that 'John Smith' works on<\/p>\n<pre class=\"code\">SMITH      ← σ Fname=&#x27;John&#x27; AND Lname=&#x27;Smith&#x27; (EMPLOYEE)\nSMITH_PNOS ← π Pno (WORKS_ON ⋈ Essn=Ssn SMITH)            -- {1, 2}\nSSN_PNOS   ← π Essn, Pno (WORKS_ON)\nSSNS(Ssn)  ← SSN_PNOS ÷ SMITH_PNOS                         -- {123456789, 453453453}\nRESULT     ← π Fname, Lname (SSNS * EMPLOYEE)<\/pre>\n<p>→ John Smith, Joyce English<\/p>\n<div class=\"callout exam\">Exam point: the attribute order and names of the numerator R must line up. SSN_PNOS(Essn, Pno) ÷ SMITH_PNOS(Pno) → the remaining attribute is Essn. It was renamed to SSNS(Ssn) so the result can be natural-joined with EMPLOYEE.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p32.jpg\" aria-label=\"Enlarge\"><img src=\"img/RA-p32.jpg\" alt=\"06 p.32 · SSN_PNOS ÷ SMITH_PNOS\" loading=\"lazy\"><\/button><figcaption>06 p.32 · SSN_PNOS ÷ SMITH_PNOS<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p33.jpg\" aria-label=\"Enlarge\"><img src=\"img/RA-p33.jpg\" alt=\"06 p.33 · R(Z) ÷ S(X) = T(Y), Y = Z − X\" loading=\"lazy\"><\/button><figcaption>06 p.33 · R(Z) ÷ S(X) = T(Y), Y = Z − X<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-ra-complete\"><h3>Complete set of relational algebra operations<\/h3><p>The six operations <b>{σ, π, ∪, ρ, −, ×}<\/b> form a complete set. Every other (original) relational algebra operation can be expressed as a combination of these six.<\/p>\n<ul><li><b>Intersection<\/b>: R ∩ S ≡ (R ∪ S) − ((R − S) ∪ (S − R))<\/li><li><b>Join<\/b>: R ⋈&lt;condition&gt; S ≡ σ&lt;condition&gt;(R × S)<\/li><li><b>Natural join<\/b>: RENAME before a Cartesian product, then SELECT and PROJECT after it<\/li><li>Strictly, ∩ and ⋈ are not needed, but they are kept as separate operations <b>because they are used so often<\/b><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p34.jpg\" aria-label=\"Enlarge\"><img src=\"img/RA-p34.jpg\" alt=\"06 p.34 · Complete set {σ, π, ∪, ρ, −, ×}\" loading=\"lazy\"><\/button><figcaption>06 p.34 · Complete set {σ, π, ∪, ρ, −, ×}<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p44.jpg\" aria-label=\"Enlarge\"><img src=\"img/RA-p44.jpg\" alt=\"06 p.44 · Summary table of relational algebra operations\" loading=\"lazy\"><\/button><figcaption>06 p.44 · Summary table of relational algebra operations<\/figcaption><\/figure><\/section>"}, {"id": "L6-5", "title": "추가 연산: 집계 · 그룹 · 외부 조인", "src": "6-1 p.36–43", "secs": [{"id": "ra-aggregate", "title": "집계 함수와 그룹화 (ℑ)", "title_en": "Aggregate functions and grouping (ℑ)"}, {"id": "ra-agg-props", "title": "집계의 성질", "title_en": "Properties of aggregation"}, {"id": "ra-outer", "title": "외부 조인", "title_en": "Outer joins"}], "md": "## 집계 함수와 그룹화 (ℑ) {#ra-aggregate}\n\n기본 연산만으로는 **집계(SUM, AVERAGE, MAXIMUM, MINIMUM, COUNT)**, **그룹별 집계**, **외부 조인**을 표현 못 함 → 추가 연산으로 **표현력 확장**.\n\n**<그룹화 속성> ℑ <함수 리스트> (R)** (ℑ = script F)\n- 그룹화 속성: R의 속성 중 그룹을 나눌 기준 (없어도 됨)\n- 함수 리스트: (<함수> <속성>) 쌍들. 함수 = SUM, AVERAGE, MAXIMUM, MINIMUM, COUNT\n- **결과**: 그룹화 속성 + 함수 리스트 원소마다 속성 하나\n\n예\n```\nρ R(Dno, No_of_employees, Average_sal) ( Dno ℑ COUNT Ssn, AVERAGE Salary (EMPLOYEE) )\n```\n→ (5, 4, 33250), (4, 3, 31000), (1, 1, 55000)\n- **이름을 안 바꾸면**: 속성 이름 = `<함수>_<속성>` → Dno, Count_ssn, Average_salary\n- **그룹화 속성이 없으면**: 함수를 **모든 투플에** 적용 → 결과는 **투플 하나** `ℑ COUNT Ssn, AVERAGE Salary (EMPLOYEE)` → (8, 35125)\n\n## 집계의 성질 {#ra-agg-props}\n\n- 집계 함수를 적용할 때 **중복은 제거하지 않는다** (급여 합·평균을 제대로 구해야 하니까)\n- **NULL은 집계에서 고려하지 않는다**\n- 관계 대수는 **닫힌 수학 체계**: 집계 결과도 스칼라 숫자가 아니라 **릴레이션** (값 하나, 투플 하나여도)\n\n## 외부 조인 {#ra-outer}\n\nEQUIJOIN·NATURAL JOIN(내부 조인)은 **조건을 만족하는 투플만** 결과에 넣고, 짝이 없는 투플은 버린다. 짝이 없어도 **한쪽(또는 양쪽) 릴레이션의 모든 투플을 남기고 싶을 때** 외부 조인을 쓴다.\n- 예) 모든 사원 이름과, 그 사원이 부서를 관리하면 그 부서 이름 (관리 안 하면 NULL)\n```\nTEMP   ← EMPLOYEE ⟕ Ssn=Mgr_ssn DEPARTMENT\nRESULT ← π Fname, Minit, Lname, Dname (TEMP)\n```\n→ 8행. Wong–Research, Wallace–Administration, Borg–Headquarters, 나머지 5명은 Dname = NULL\n- 종류: **LEFT OUTER JOIN ⟕** (왼쪽 모든 투플), **RIGHT OUTER JOIN ⟖** (오른쪽 모든 투플), **FULL OUTER JOIN ⟗** (양쪽 모두). 짝 없는 쪽 속성은 **NULL로 채움**", "html": "<section class=\"sec\" id=\"s-ra-aggregate\"><h3>집계 함수와 그룹화 (ℑ)<\/h3><p>기본 연산만으로는 <b>집계(SUM, AVERAGE, MAXIMUM, MINIMUM, COUNT)<\/b>, <b>그룹별 집계<\/b>, <b>외부 조인<\/b>을 표현 못 함 → 추가 연산으로 <b>표현력 확장<\/b>.<\/p>\n<p><b>&lt;그룹화 속성&gt; ℑ &lt;함수 리스트&gt; (R)<\/b> (ℑ = script F)<\/p>\n<ul><li>그룹화 속성: R의 속성 중 그룹을 나눌 기준 (없어도 됨)<\/li><li>함수 리스트: (&lt;함수&gt; &lt;속성&gt;) 쌍들. 함수 = SUM, AVERAGE, MAXIMUM, MINIMUM, COUNT<\/li><li><b>결과<\/b>: 그룹화 속성 + 함수 리스트 원소마다 속성 하나<\/li><\/ul>\n<p>예<\/p>\n<pre class=\"code\">ρ R(Dno, No_of_employees, Average_sal) ( Dno ℑ COUNT Ssn, AVERAGE Salary (EMPLOYEE) )<\/pre>\n<p>→ (5, 4, 33250), (4, 3, 31000), (1, 1, 55000)<\/p>\n<ul><li><b>이름을 안 바꾸면<\/b>: 속성 이름 = <code>&lt;함수&gt;_&lt;속성&gt;<\/code> → Dno, Count_ssn, Average_salary<\/li><li><b>그룹화 속성이 없으면<\/b>: 함수를 <b>모든 투플에<\/b> 적용 → 결과는 <b>투플 하나<\/b> <code>ℑ COUNT Ssn, AVERAGE Salary (EMPLOYEE)<\/code> → (8, 35125)<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p40.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p40.jpg\" alt=\"06 p.40 · 이름 안 바꾼 결과(Count_ssn, Average_salary)와 그룹화 속성 없는 경우\" loading=\"lazy\"><\/button><figcaption>06 p.40 · 이름 안 바꾼 결과(Count_ssn, Average_salary)와 그룹화 속성 없는 경우<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-ra-agg-props\"><h3>집계의 성질<\/h3><ul><li>집계 함수를 적용할 때 <b>중복은 제거하지 않는다<\/b> (급여 합·평균을 제대로 구해야 하니까)<\/li><li><b>NULL은 집계에서 고려하지 않는다<\/b><\/li><li>관계 대수는 <b>닫힌 수학 체계<\/b>: 집계 결과도 스칼라 숫자가 아니라 <b>릴레이션<\/b> (값 하나, 투플 하나여도)<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-ra-outer\"><h3>외부 조인<\/h3><p>EQUIJOIN·NATURAL JOIN(내부 조인)은 <b>조건을 만족하는 투플만<\/b> 결과에 넣고, 짝이 없는 투플은 버린다. 짝이 없어도 <b>한쪽(또는 양쪽) 릴레이션의 모든 투플을 남기고 싶을 때<\/b> 외부 조인을 쓴다.<\/p>\n<ul><li>예) 모든 사원 이름과, 그 사원이 부서를 관리하면 그 부서 이름 (관리 안 하면 NULL)<\/li><\/ul>\n<pre class=\"code\">TEMP   ← EMPLOYEE ⟕ Ssn=Mgr_ssn DEPARTMENT\nRESULT ← π Fname, Minit, Lname, Dname (TEMP)<\/pre>\n<p>→ 8행. Wong–Research, Wallace–Administration, Borg–Headquarters, 나머지 5명은 Dname = NULL<\/p>\n<ul><li>종류: <b>LEFT OUTER JOIN ⟕<\/b> (왼쪽 모든 투플), <b>RIGHT OUTER JOIN ⟖<\/b> (오른쪽 모든 투플), <b>FULL OUTER JOIN ⟗<\/b> (양쪽 모두). 짝 없는 쪽 속성은 <b>NULL로 채움<\/b><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p43.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p43.jpg\" alt=\"06 p.43 · EMPLOYEE ⟕ Ssn=Mgr_ssn DEPARTMENT\" loading=\"lazy\"><\/button><figcaption>06 p.43 · EMPLOYEE ⟕ Ssn=Mgr_ssn DEPARTMENT<\/figcaption><\/figure><\/section>", "title_en": "Additional Operations: Aggregation, Grouping, Outer Joins", "html_en": "<section class=\"sec\" id=\"s-ra-aggregate\"><h3>Aggregate functions and grouping (ℑ)<\/h3><p>The basic operations cannot express <b>aggregates (SUM, AVERAGE, MAXIMUM, MINIMUM, COUNT)<\/b>, <b>aggregates per group<\/b>, or <b>outer joins<\/b> → additional operations <b>enhance the expressive power<\/b>.<\/p>\n<p><b>&lt;grouping attributes&gt; ℑ &lt;function list&gt; (R)<\/b> (ℑ = script F)<\/p>\n<ul><li>Grouping attributes: attributes of R used to form groups (may be omitted)<\/li><li>Function list: pairs (&lt;function&gt; &lt;attribute&gt;). Function = SUM, AVERAGE, MAXIMUM, MINIMUM, COUNT<\/li><li><b>Result<\/b>: the grouping attributes + one attribute per element of the function list<\/li><\/ul>\n<p>Example<\/p>\n<pre class=\"code\">ρ R(Dno, No_of_employees, Average_sal) ( Dno ℑ COUNT Ssn, AVERAGE Salary (EMPLOYEE) )<\/pre>\n<p>→ (5, 4, 33250), (4, 3, 31000), (1, 1, 55000)<\/p>\n<ul><li><b>Without renaming<\/b>: attribute names = <code>&lt;function&gt;_&lt;attribute&gt;<\/code> → Dno, Count_ssn, Average_salary<\/li><li><b>Without grouping attributes<\/b>: the functions apply to <b>all tuples<\/b> → the result is <b>a single tuple<\/b>: <code>ℑ COUNT Ssn, AVERAGE Salary (EMPLOYEE)<\/code> → (8, 35125)<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p40.jpg\" aria-label=\"Enlarge\"><img src=\"img/RA-p40.jpg\" alt=\"06 p.40 · Result without renaming (Count_ssn, Average_salary) and the case with no grouping attributes\" loading=\"lazy\"><\/button><figcaption>06 p.40 · Result without renaming (Count_ssn, Average_salary) and the case with no grouping attributes<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-ra-agg-props\"><h3>Properties of aggregation<\/h3><ul><li><b>Duplicates are not eliminated<\/b> when an aggregate function is applied (so that sums and averages of salaries come out right)<\/li><li><b>NULL values are not considered<\/b> in aggregation<\/li><li>Relational algebra is a <b>closed mathematical system<\/b>: an aggregate result is also a <b>relation<\/b>, not a scalar number (even with one value in one tuple)<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-ra-outer\"><h3>Outer joins<\/h3><p>EQUIJOIN and NATURAL JOIN (inner joins) keep <b>only tuples that satisfy the condition<\/b> and drop tuples without a match. Use an outer join <b>when you want to keep all tuples of one (or both) relations<\/b> even without a match.<\/p>\n<ul><li>e.g., all employee names, plus the name of the department each one manages if they manage one (NULL if not)<\/li><\/ul>\n<pre class=\"code\">TEMP   ← EMPLOYEE ⟕ Ssn=Mgr_ssn DEPARTMENT\nRESULT ← π Fname, Minit, Lname, Dname (TEMP)<\/pre>\n<p>→ 8 rows. Wong–Research, Wallace–Administration, Borg–Headquarters; the other 5 have Dname = NULL<\/p>\n<ul><li>Kinds: <b>LEFT OUTER JOIN ⟕<\/b> (all tuples on the left), <b>RIGHT OUTER JOIN ⟖<\/b> (all tuples on the right), <b>FULL OUTER JOIN ⟗<\/b> (both). Attributes of the unmatched side are <b>padded with NULL<\/b><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p43.jpg\" aria-label=\"Enlarge\"><img src=\"img/RA-p43.jpg\" alt=\"06 p.43 · EMPLOYEE ⟕ Ssn=Mgr_ssn DEPARTMENT\" loading=\"lazy\"><\/button><figcaption>06 p.43 · EMPLOYEE ⟕ Ssn=Mgr_ssn DEPARTMENT<\/figcaption><\/figure><\/section>"}, {"id": "L6-6", "title": "관계 대수 작성 연습", "src": "db-exercises Week 7 (p.55–59)", "secs": [{"id": "ra-practice-join", "title": "연습 1–2: 조인 경로", "title_en": "Exercises 1–2: join paths"}, {"id": "ra-practice-union", "title": "연습 3: 합집합", "title_en": "Exercise 3: union"}, {"id": "ra-practice-diff", "title": "연습 4–5: 차집합과 교집합", "title_en": "Exercises 4–5: difference and intersection"}], "md": "## 연습 1–2: 조인 경로 {#ra-practice-join}\n\n**연습 1**: 'Research' 부서에서 일하는 모든 사원의 이름과 주소\n```\nRESEARCH_DEPT ← σ Dname='Research' (DEPARTMENT)\nRESEARCH_EMPS ← RESEARCH_DEPT ⋈ Dnumber=Dno EMPLOYEE\nRESULT        ← π Fname, Lname, Address (RESEARCH_EMPS)\n```\n**연습 2**: 'Stafford'에 있는 프로젝트마다 프로젝트 번호, 통제 부서 번호, 관리자의 성·주소·생일\n```\nSTAFFORD_PROJS ← σ Plocation='Stafford' (PROJECT)\nCONTR_DEPTS    ← STAFFORD_PROJS ⋈ Dnum=Dnumber DEPARTMENT\nPROJ_DEPT_MGRS ← CONTR_DEPTS ⋈ Mgr_ssn=Ssn EMPLOYEE\nRESULT         ← π Pnumber, Dnum, Lname, Address, Bdate (PROJ_DEPT_MGRS)\n```\n→ (10, 4, Wallace, 291 Berry, Bellaire, TX, 1941-06-20), (30, 4, Wallace, …)\n\n요령: 조건이 있는 릴레이션에서 **σ를 먼저** → FK–PK를 따라 **⋈** → 마지막에 **π**.\n\n## 연습 3: 합집합 {#ra-practice-union}\n\n성이 'Smith'인 사원이 일꾼으로든, 프로젝트를 통제하는 부서의 관리자로든 관련된 프로젝트 번호\n```\nSMITHS(Essn)        ← π Ssn (σ Lname='Smith' (EMPLOYEE))\nSMITH_WORKER_PROJS  ← π Pno (WORKS_ON * SMITHS)\nMGRS                ← π Lname, Dnumber (EMPLOYEE ⋈ Ssn=Mgr_ssn DEPARTMENT)\nSMITH_MANAGED_DEPTS(Dnum) ← π Dnumber (σ Lname='Smith' (MGRS))\nSMITH_MGR_PROJS(Pno)      ← π Pnumber (SMITH_MANAGED_DEPTS * PROJECT)\nRESULT              ← SMITH_WORKER_PROJS ∪ SMITH_MGR_PROJS\n```\n- ∪를 하려고 두 결과의 속성 이름을 **Pno로 맞춤** (타입 호환)\n- SMITHS(Essn)으로 이름을 바꿔서 WORKS_ON과 **자연 조인**이 Essn으로 걸리게 함\n\n## 연습 4–5: 차집합과 교집합 {#ra-practice-diff}\n\n**연습 4**: 부양가족이 **없는** 사원의 이름\n```\nALL_EMPS             ← π Ssn (EMPLOYEE)\nEMPS_WITH_DEPS(Ssn)  ← π Essn (DEPENDENT)\nEMPS_WITHOUT_DEPS    ← ALL_EMPS − EMPS_WITH_DEPS\nRESULT               ← π Lname, Fname (EMPS_WITHOUT_DEPS * EMPLOYEE)\n```\n**연습 5**: 부양가족이 **하나 이상 있는 관리자**의 이름\n```\nMGRS(Ssn)            ← π Mgr_ssn (DEPARTMENT)\nEMPS_WITH_DEPS(Ssn)  ← π Essn (DEPENDENT)\nMGRS_WITH_DEPS       ← MGRS ∩ EMPS_WITH_DEPS\nRESULT               ← π Lname, Fname (MGRS_WITH_DEPS * EMPLOYEE)\n```\n→ Wong, Wallace\n\n> 시험 포인트: \"~가 없는\" = **차집합 (−)**, \"A이면서 B\" = **교집합 (∩)**, \"A이거나 B\" = **합집합 (∪)**, \"모든 ~\" = **나눗셈 (÷)**. SQL의 NOT EXISTS / EXISTS AND EXISTS / UNION / NOT EXISTS(EXCEPT)와 1:1로 대응시켜 외워.", "html": "<section class=\"sec\" id=\"s-ra-practice-join\"><h3>연습 1–2: 조인 경로<\/h3
