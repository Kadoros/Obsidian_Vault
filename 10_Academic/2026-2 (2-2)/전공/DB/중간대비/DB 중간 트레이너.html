가 기본 동작(거부)이면, 지워질 사원을 그 투플들이 참조하고 있어서 DELETE 전체가 거부된다)\n\n**교안 연습 1 (LIBRARY)** 정답 예:\n| FK | ON DELETE | ON UPDATE | 이유 |\n|---|---|---|---|\n| BOOK_AUTHORS.Book_id → BOOK | CASCADE | CASCADE | 책이 지워지면 저자 정보도 필요 없음 |\n| BOOK.Publisher_name → PUBLISHER | REJECT | CASCADE | 그 출판사 책이 있으면 출판사 삭제 금지 |\n| BOOK_COPIES.Book_id → BOOK | CASCADE | CASCADE | 책 목록에서 빼면 사본도 관리 안 함 |\n| BOOK_COPIES.Branch_id → LIBRARY_BRANCH | CASCADE | CASCADE | 지점 삭제 = 폐점 |\n| BOOK_LOANS.Book_id → BOOK | REJECT (또는 CASCADE) | CASCADE | 목록에서 빼도 대출된 책은 돌려받아야 함 |\n| BOOK_LOANS.Branch_id → LIBRARY_BRANCH | CASCADE (또는 REJECT) | CASCADE | 폐점하면 대출을 탕감 |\n| BOOK_LOANS.Card_no → BORROWER | REJECT | CASCADE | 책을 다 반납해야 회원 탈퇴 가능 |\n\n> 시험 포인트: 정답이 하나가 아니라 **이유가 맞으면** 인정되는 유형. ON UPDATE는 거의 다 CASCADE (키가 바뀌면 참조도 따라가야 추적 가능).\n\n## DROP SCHEMA / DROP TABLE {#drop}\n\n스키마 수정 = 투플이 아니라 **스키마**를 바꾸는 것 (테이블·속성·제약 추가/삭제).\n\n- **DROP SCHEMA**: 스키마 전체 삭제\n  - `CASCADE`: 스키마의 모든 요소(테이블, 도메인 등)까지 삭제\n  - `RESTRICT`: 스키마에 **요소가 하나도 없을 때만** 삭제 (사용자가 요소를 하나씩 지워야 함)\n- **DROP TABLE**: 특정 테이블 삭제. 모든 투플 + **카탈로그의 테이블 정의까지** 제거\n  - 투플만 지우고 정의는 남기려면 **DELETE** 명령\n  - `CASCADE`: 그 테이블을 참조하는 제약과 요소도 자동으로 같이 삭제\n  - `RESTRICT`: 어떤 제약이나 요소도 그 테이블을 참조하지 않을 때만 삭제\n\n## ALTER TABLE {#alter}\n\n테이블 정의 변경: 속성·제약 추가/삭제, 열 정의(타입, 제약) 변경.\n```\nALTER TABLE COMPANY.EMPLOYEE ADD COLUMN Job VARCHAR(12);\nALTER TABLE COMPANY.EMPLOYEE DROP COLUMN Address CASCADE;\nALTER TABLE COMPANY.EMPLOYEE DROP CONSTRAINT EMPSUPERFK CASCADE;\n```\n- DROP COLUMN `CASCADE`: 그 열을 참조하는 제약도 자동으로 같이 삭제 / `RESTRICT`: 그 열을 참조하는 요소가 없을 때만\n- ADD COLUMN으로 추가된 열은 기존 투플에서 NULL (또는 DEFAULT 값). 그래서 새 열에 NOT NULL을 걸려면 DEFAULT가 필요", "html": "<section class=\"sec\" id=\"s-ref-actions\"><h3>참조 트리거 동작 (Referential Triggered Actions)<\/h3><p><b>\"다른 투플이 참조하는 투플이 삭제/갱신되면?\"<\/b> 에 대한 동작을 FK에 붙인다.<\/p>\n<ul><li><b>트리거<\/b>: <code>ON DELETE<\/code>, <code>ON UPDATE<\/code><\/li><li><b>동작<\/b>: <code>SET NULL<\/code>, <code>CASCADE<\/code>, <code>SET DEFAULT<\/code> (지정 안 하면 기본 = 거부, 교안 연습에서는 REJECT라고 부름)<\/li><\/ul>\n<div class=\"tblw\"><table><thead><tr><th>동작<\/th><th>참조되던 투플이 삭제될 때<\/th><th>갱신될 때<\/th><\/tr><\/thead><tbody><tr><td>SET NULL<\/td><td>참조하던 FK를 NULL로<\/td><td>FK를 NULL로<\/td><\/tr><tr><td>SET DEFAULT<\/td><td>FK를 기본값으로<\/td><td>FK를 기본값으로<\/td><\/tr><tr><td>CASCADE<\/td><td><b>참조하던 투플도 삭제<\/b><\/td><td>참조하던 FK를 <b>새 값으로<\/b> 바꿈<\/td><\/tr><\/tbody><\/table><\/div>\n<pre class=\"code\">CREATE TABLE EMPLOYEE\n( ...,\n  Dno INT NOT NULL DEFAULT 1,\n  CONSTRAINT EMPPK PRIMARY KEY (Ssn),\n  CONSTRAINT EMPSUPERFK FOREIGN KEY (Super_ssn) REFERENCES EMPLOYEE(Ssn)\n      ON DELETE SET NULL      ON UPDATE CASCADE,\n  CONSTRAINT EMPDEPTFK  FOREIGN KEY (Dno) REFERENCES DEPARTMENT(Dnumber)\n      ON DELETE SET DEFAULT   ON UPDATE CASCADE );<\/pre>\n<p><b>교안 토론 (p.13)<\/b>: EMPSUPERFK의 ON DELETE를 <b>CASCADE<\/b>로 바꾸고 <code>DELETE FROM EMPLOYEE WHERE Lname = 'Borg';<\/code> 를 실행하면?<\/p>\n<ul><li>Borg(888665555)를 상사로 둔 Wong, Wallace가 같이 삭제 → 그들을 상사로 둔 Smith, Narayan, English, Zelaya, Jabbar도 연쇄 삭제 → <b>EMPLOYEE 투플 8개가 전부 사라진다<\/b>. CASCADE는 재귀적으로 전파된다는 점이 핵심<\/li><li>(EMPSUPERFK만 봤을 때 얘기. 실제로는 WORKS_ON.Essn, DEPENDENT.Essn 같은 다른 FK가 기본 동작(거부)이면, 지워질 사원을 그 투플들이 참조하고 있어서 DELETE 전체가 거부된다)<\/li><\/ul>\n<p><b>교안 연습 1 (LIBRARY)<\/b> 정답 예:<\/p>\n<div class=\"tblw\"><table><thead><tr><th>FK<\/th><th>ON DELETE<\/th><th>ON UPDATE<\/th><th>이유<\/th><\/tr><\/thead><tbody><tr><td>BOOK_AUTHORS.Book_id → BOOK<\/td><td>CASCADE<\/td><td>CASCADE<\/td><td>책이 지워지면 저자 정보도 필요 없음<\/td><\/tr><tr><td>BOOK.Publisher_name → PUBLISHER<\/td><td>REJECT<\/td><td>CASCADE<\/td><td>그 출판사 책이 있으면 출판사 삭제 금지<\/td><\/tr><tr><td>BOOK_COPIES.Book_id → BOOK<\/td><td>CASCADE<\/td><td>CASCADE<\/td><td>책 목록에서 빼면 사본도 관리 안 함<\/td><\/tr><tr><td>BOOK_COPIES.Branch_id → LIBRARY_BRANCH<\/td><td>CASCADE<\/td><td>CASCADE<\/td><td>지점 삭제 = 폐점<\/td><\/tr><tr><td>BOOK_LOANS.Book_id → BOOK<\/td><td>REJECT (또는 CASCADE)<\/td><td>CASCADE<\/td><td>목록에서 빼도 대출된 책은 돌려받아야 함<\/td><\/tr><tr><td>BOOK_LOANS.Branch_id → LIBRARY_BRANCH<\/td><td>CASCADE (또는 REJECT)<\/td><td>CASCADE<\/td><td>폐점하면 대출을 탕감<\/td><\/tr><tr><td>BOOK_LOANS.Card_no → BORROWER<\/td><td>REJECT<\/td><td>CASCADE<\/td><td>책을 다 반납해야 회원 탈퇴 가능<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout exam\">시험 포인트: 정답이 하나가 아니라 <b>이유가 맞으면<\/b> 인정되는 유형. ON UPDATE는 거의 다 CASCADE (키가 바뀌면 참조도 따라가야 추적 가능).<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p11.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p11.jpg\" alt=\"04 p.11 · ON DELETE SET NULL / SET DEFAULT, ON UPDATE CASCADE\" loading=\"lazy\"><\/button><figcaption>04 p.11 · ON DELETE SET NULL / SET DEFAULT, ON UPDATE CASCADE<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p13.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p13.jpg\" alt=\"04 p.13 · 토론: EMPSUPERFK를 ON DELETE CASCADE로 바꾸고 Borg 삭제\" loading=\"lazy\"><\/button><figcaption>04 p.13 · 토론: EMPSUPERFK를 ON DELETE CASCADE로 바꾸고 Borg 삭제<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p14.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p14.jpg\" alt=\"04 p.14 · 연습 1: LIBRARY 스키마\" loading=\"lazy\"><\/button><figcaption>04 p.14 · 연습 1: LIBRARY 스키마<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-drop\"><h3>DROP SCHEMA / DROP TABLE<\/h3><p>스키마 수정 = 투플이 아니라 <b>스키마<\/b>를 바꾸는 것 (테이블·속성·제약 추가/삭제).<\/p>\n<ul><li><b>DROP SCHEMA<\/b>: 스키마 전체 삭제<ul><li><code>CASCADE<\/code>: 스키마의 모든 요소(테이블, 도메인 등)까지 삭제<\/li><li><code>RESTRICT<\/code>: 스키마에 <b>요소가 하나도 없을 때만<\/b> 삭제 (사용자가 요소를 하나씩 지워야 함)<\/li><\/ul><\/li><li><b>DROP TABLE<\/b>: 특정 테이블 삭제. 모든 투플 + <b>카탈로그의 테이블 정의까지<\/b> 제거<ul><li>투플만 지우고 정의는 남기려면 <b>DELETE<\/b> 명령<\/li><li><code>CASCADE<\/code>: 그 테이블을 참조하는 제약과 요소도 자동으로 같이 삭제<\/li><li><code>RESTRICT<\/code>: 어떤 제약이나 요소도 그 테이블을 참조하지 않을 때만 삭제<\/li><\/ul><\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-alter\"><h3>ALTER TABLE<\/h3><p>테이블 정의 변경: 속성·제약 추가/삭제, 열 정의(타입, 제약) 변경.<\/p>\n<pre class=\"code\">ALTER TABLE COMPANY.EMPLOYEE ADD COLUMN Job VARCHAR(12);\nALTER TABLE COMPANY.EMPLOYEE DROP COLUMN Address CASCADE;\nALTER TABLE COMPANY.EMPLOYEE DROP CONSTRAINT EMPSUPERFK CASCADE;<\/pre>\n<ul><li>DROP COLUMN <code>CASCADE<\/code>: 그 열을 참조하는 제약도 자동으로 같이 삭제 / <code>RESTRICT<\/code>: 그 열을 참조하는 요소가 없을 때만<\/li><li>ADD COLUMN으로 추가된 열은 기존 투플에서 NULL (또는 DEFAULT 값). 그래서 새 열에 NOT NULL을 걸려면 DEFAULT가 필요<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p20.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p20.jpg\" alt=\"04 p.20 · ALTER TABLE ADD COLUMN / DROP COLUMN / DROP CONSTRAINT\" loading=\"lazy\"><\/button><figcaption>04 p.20 · ALTER TABLE ADD COLUMN / DROP COLUMN / DROP CONSTRAINT<\/figcaption><\/figure><\/section>", "title_en": "Referential Triggered Actions, DROP, ALTER", "html_en": "<section class=\"sec\" id=\"s-ref-actions\"><h3>Referential triggered actions<\/h3><p>An action attached to an FK that answers <b>\"what happens when a tuple referenced by other tuples is deleted/updated?\"<\/b><\/p>\n<ul><li><b>Triggers<\/b>: <code>ON DELETE<\/code>, <code>ON UPDATE<\/code><\/li><li><b>Actions<\/b>: <code>SET NULL<\/code>, <code>CASCADE<\/code>, <code>SET DEFAULT<\/code> (if none is given, the default = reject; called REJECT in the slide exercise)<\/li><\/ul>\n<div class=\"tblw\"><table><thead><tr><th>Action<\/th><th>When the referenced tuple is deleted<\/th><th>When it is updated<\/th><\/tr><\/thead><tbody><tr><td>SET NULL<\/td><td>Set the referencing FK to NULL<\/td><td>Set the FK to NULL<\/td><\/tr><tr><td>SET DEFAULT<\/td><td>Set the FK to its default value<\/td><td>Set the FK to its default value<\/td><\/tr><tr><td>CASCADE<\/td><td><b>Delete the referencing tuples too<\/b><\/td><td>Change the referencing FK <b>to the new value<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<pre class=\"code\">CREATE TABLE EMPLOYEE\n( ...,\n  Dno INT NOT NULL DEFAULT 1,\n  CONSTRAINT EMPPK PRIMARY KEY (Ssn),\n  CONSTRAINT EMPSUPERFK FOREIGN KEY (Super_ssn) REFERENCES EMPLOYEE(Ssn)\n      ON DELETE SET NULL      ON UPDATE CASCADE,\n  CONSTRAINT EMPDEPTFK  FOREIGN KEY (Dno) REFERENCES DEPARTMENT(Dnumber)\n      ON DELETE SET DEFAULT   ON UPDATE CASCADE );<\/pre>\n<p><b>Slide discussion (p.13)<\/b>: what happens if EMPSUPERFK's ON DELETE is changed to <b>CASCADE<\/b> and <code>DELETE FROM EMPLOYEE WHERE Lname = 'Borg';<\/code> is executed?<\/p>\n<ul><li>Wong and Wallace, whose supervisor is Borg (888665555), are deleted too → then Smith, Narayan, English, Zelaya and Jabbar, whose supervisors are Wong and Wallace, are deleted in a chain → <b>all 8 EMPLOYEE tuples disappear<\/b>. The key point is that CASCADE propagates recursively<\/li><li>(This considers only EMPSUPERFK. In reality, if other FKs such as WORKS_ON.Essn and DEPENDENT.Essn use the default action (reject), those tuples reference employees that would be deleted, so the whole DELETE is rejected)<\/li><\/ul>\n<p><b>Slide Exercise 1 (LIBRARY)<\/b> sample answer:<\/p>\n<div class=\"tblw\"><table><thead><tr><th>FK<\/th><th>ON DELETE<\/th><th>ON UPDATE<\/th><th>Reason<\/th><\/tr><\/thead><tbody><tr><td>BOOK_AUTHORS.Book_id → BOOK<\/td><td>CASCADE<\/td><td>CASCADE<\/td><td>If a book is deleted, its author info is no longer needed<\/td><\/tr><tr><td>BOOK.Publisher_name → PUBLISHER<\/td><td>REJECT<\/td><td>CASCADE<\/td><td>Do not allow deleting a publisher that still has books<\/td><\/tr><tr><td>BOOK_COPIES.Book_id → BOOK<\/td><td>CASCADE<\/td><td>CASCADE<\/td><td>If a book is removed from the catalog, its copies are no longer managed<\/td><\/tr><tr><td>BOOK_COPIES.Branch_id → LIBRARY_BRANCH<\/td><td>CASCADE<\/td><td>CASCADE<\/td><td>Deleting a branch = the branch closes<\/td><\/tr><tr><td>BOOK_LOANS.Book_id → BOOK<\/td><td>REJECT (or CASCADE)<\/td><td>CASCADE<\/td><td>Even if removed from the catalog, loaned books must be returned<\/td><\/tr><tr><td>BOOK_LOANS.Branch_id → LIBRARY_BRANCH<\/td><td>CASCADE (or REJECT)<\/td><td>CASCADE<\/td><td>When a branch closes, its loans are forgiven<\/td><\/tr><tr><td>BOOK_LOANS.Card_no → BORROWER<\/td><td>REJECT<\/td><td>CASCADE<\/td><td>A borrower can leave only after returning all books<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout exam\">Exam point: there is no single right answer; an answer is accepted <b>if the reason is sound<\/b>. ON UPDATE is almost always CASCADE (when a key changes, references must follow it to stay traceable).<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p11.jpg\" aria-label=\"Enlarge\"><img src=\"img/SQL-p11.jpg\" alt=\"04 p.11 · ON DELETE SET NULL / SET DEFAULT, ON UPDATE CASCADE\" loading=\"lazy\"><\/button><figcaption>04 p.11 · ON DELETE SET NULL / SET DEFAULT, ON UPDATE CASCADE<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p13.jpg\" aria-label=\"Enlarge\"><img src=\"img/SQL-p13.jpg\" alt=\"04 p.13 · Discussion: change EMPSUPERFK to ON DELETE CASCADE and delete Borg\" loading=\"lazy\"><\/button><figcaption>04 p.13 · Discussion: change EMPSUPERFK to ON DELETE CASCADE and delete Borg<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p14.jpg\" aria-label=\"Enlarge\"><img src=\"img/SQL-p14.jpg\" alt=\"04 p.14 · Exercise 1: LIBRARY schema\" loading=\"lazy\"><\/button><figcaption>04 p.14 · Exercise 1: LIBRARY schema<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-drop\"><h3>DROP SCHEMA / DROP TABLE<\/h3><p>Schema modification = changing the <b>schema<\/b>, not tuples (adding/dropping tables, attributes, constraints).<\/p>\n<ul><li><b>DROP SCHEMA<\/b>: drops an entire schema<ul><li><code>CASCADE<\/code>: also drops all elements of the schema (tables, domains, etc.)<\/li><li><code>RESTRICT<\/code>: drops the schema <b>only if it has no elements<\/b> (the user must drop the elements one by one)<\/li><\/ul><\/li><li><b>DROP TABLE<\/b>: drops a specific table. Removes all tuples + <b>the table definition from the catalog<\/b><ul><li>To delete only the tuples and keep the definition, use the <b>DELETE<\/b> command<\/li><li><code>CASCADE<\/code>: automatically drops constraints and elements that reference the table too<\/li><li><code>RESTRICT<\/code>: drops the table only if no constraint or element references it<\/li><\/ul><\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-alter\"><h3>ALTER TABLE<\/h3><p>Changes a table definition: adding/dropping attributes and constraints, changing column definitions (type, constraints).<\/p>\n<pre class=\"code\">ALTER TABLE COMPANY.EMPLOYEE ADD COLUMN Job VARCHAR(12);\nALTER TABLE COMPANY.EMPLOYEE DROP COLUMN Address CASCADE;\nALTER TABLE COMPANY.EMPLOYEE DROP CONSTRAINT EMPSUPERFK CASCADE;<\/pre>\n<ul><li>DROP COLUMN <code>CASCADE<\/code>: automatically drops constraints that reference the column too / <code>RESTRICT<\/code>: only if no element references the column<\/li><li>A column added with ADD COLUMN is NULL (or the DEFAULT value) in existing tuples. So putting NOT NULL on a new column requires a DEFAULT<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p20.jpg\" aria-label=\"Enlarge\"><img src=\"img/SQL-p20.jpg\" alt=\"04 p.20 · ALTER TABLE ADD COLUMN / DROP COLUMN / DROP CONSTRAINT\" loading=\"lazy\"><\/button><figcaption>04 p.20 · ALTER TABLE ADD COLUMN / DROP COLUMN / DROP CONSTRAINT<\/figcaption><\/figure><\/section>"}, {"id": "L4-3", "title": "INSERT · DELETE · UPDATE", "src": "4-1 p.22–27", "secs": [{"id": "dml-insert", "title": "INSERT", "title_en": "INSERT"}, {"id": "dml-delete-update", "title": "DELETE와 UPDATE", "title_en": "DELETE and UPDATE"}], "md": "## INSERT {#dml-insert}\n\n**사용법 1: 모든 속성 값** — 테이블을 만들 때의 속성 **순서대로** 값을 나열\n```\nINSERT INTO EMPLOYEE\nVALUES ('Richard', 'K', 'Marini', '653298653', '1962-12-30',\n        '98 Oak Forest, Katy, TX', 'M', 37000, '653298653', 4);\n```\n**사용법 2: 속성 이름 명시** — **NOT NULL이면서 DEFAULT가 없는 속성은 반드시** 포함\n```\nINSERT INTO EMPLOYEE (Fname, Lname, Dno, Ssn)\nVALUES ('Richard', 'Marini', 4, '653298653');\n```\n**제약 위반 예 (거부됨)**\n- `INSERT INTO EMPLOYEE (Fname, Lname, Ssn, Dno) VALUES ('Robert', 'Hatcher', '980760540', 2);` → Dnumber=2인 부서 없음 → **참조 무결성**\n- `INSERT INTO EMPLOYEE (Fname, Lname, Dno) VALUES ('Robert', 'Hatcher', 5);` → Ssn 없음 → **NOT NULL** (PK라 개체 무결성)\n\n## DELETE와 UPDATE {#dml-delete-update}\n\n**DELETE**: WHERE로 **한 릴레이션**에서 지울 투플을 고름\n- 한 번에 한 테이블에서만 명시적으로 삭제. 참조 트리거 동작(ON DELETE CASCADE)이 있으면 다른 릴레이션으로 전파될 수 있다\n- 지워지는 투플 수는 경우마다 다름 (COMPANY 상태 기준):\n\n```\nDELETE FROM EMPLOYEE WHERE Lname = 'Brown';        -- 0개\nDELETE FROM EMPLOYEE WHERE Ssn = '123456789';      -- 1개\nDELETE FROM EMPLOYEE WHERE Dno = 5;                -- 4개\nDELETE FROM EMPLOYEE;                              -- 전부!\n```\n> 주의: **WHERE를 빼면 모든 투플이 삭제된다.** 테이블 정의는 남음 (DROP TABLE과 다름).\n\n**UPDATE**: WHERE로 **한 릴레이션**에서 고친 투플을 고르고, **SET**으로 바꿀 속성과 새 값 지정\n```\nUPDATE PROJECT  SET Plocation = 'Bellaire', Dnum = 5  WHERE Pnumber = 10;\nUPDATE EMPLOYEE SET Salary = Salary * 1.1             WHERE Dno = 5;\n```\n- UPDATE 하나로 여러 투플을 고칠 수 있다 (Dno=5인 4명이 한꺼번에 10% 인상)\n- ON UPDATE CASCADE가 있으면 다른 릴레이션으로 전파", "html": "<section class=\"sec\" id=\"s-dml-insert\"><h3>INSERT<\/h3><p><b>사용법 1: 모든 속성 값<\/b> — 테이블을 만들 때의 속성 <b>순서대로<\/b> 값을 나열<\/p>\n<pre class=\"code\">INSERT INTO EMPLOYEE\nVALUES (&#x27;Richard&#x27;, &#x27;K&#x27;, &#x27;Marini&#x27;, &#x27;653298653&#x27;, &#x27;1962-12-30&#x27;,\n        &#x27;98 Oak Forest, Katy, TX&#x27;, &#x27;M&#x27;, 37000, &#x27;653298653&#x27;, 4);<\/pre>\n<p><b>사용법 2: 속성 이름 명시<\/b> — <b>NOT NULL이면서 DEFAULT가 없는 속성은 반드시<\/b> 포함<\/p>\n<pre class=\"code\">INSERT INTO EMPLOYEE (Fname, Lname, Dno, Ssn)\nVALUES (&#x27;Richard&#x27;, &#x27;Marini&#x27;, 4, &#x27;653298653&#x27;);<\/pre>\n<p><b>제약 위반 예 (거부됨)<\/b><\/p>\n<ul><li><code>INSERT INTO EMPLOYEE (Fname, Lname, Ssn, Dno) VALUES ('Robert', 'Hatcher', '980760540', 2);<\/code> → Dnumber=2인 부서 없음 → <b>참조 무결성<\/b><\/li><li><code>INSERT INTO EMPLOYEE (Fname, Lname, Dno) VALUES ('Robert', 'Hatcher', 5);<\/code> → Ssn 없음 → <b>NOT NULL<\/b> (PK라 개체 무결성)<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p25.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p25.jpg\" alt=\"04 p.25 · INSERT의 참조 무결성 위반과 NOT NULL 위반\" loading=\"lazy\"><\/button><figcaption>04 p.25 · INSERT의 참조 무결성 위반과 NOT NULL 위반<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-dml-delete-update\"><h3>DELETE와 UPDATE<\/h3><p><b>DELETE<\/b>: WHERE로 <b>한 릴레이션<\/b>에서 지울 투플을 고름<\/p>\n<ul><li>한 번에 한 테이블에서만 명시적으로 삭제. 참조 트리거 동작(ON DELETE CASCADE)이 있으면 다른 릴레이션으로 전파될 수 있다<\/li><li>지워지는 투플 수는 경우마다 다름 (COMPANY 상태 기준):<\/li><\/ul>\n<pre class=\"code\">DELETE FROM EMPLOYEE WHERE Lname = &#x27;Brown&#x27;;        -- 0개\nDELETE FROM EMPLOYEE WHERE Ssn = &#x27;123456789&#x27;;      -- 1개\nDELETE FROM EMPLOYEE WHERE Dno = 5;                -- 4개\nDELETE FROM EMPLOYEE;                              -- 전부!<\/pre>\n<div class=\"callout trap\">주의: <b>WHERE를 빼면 모든 투플이 삭제된다.<\/b> 테이블 정의는 남음 (DROP TABLE과 다름).<\/div>\n<p><b>UPDATE<\/b>: WHERE로 <b>한 릴레이션<\/b>에서 고친 투플을 고르고, <b>SET<\/b>으로 바꿀 속성과 새 값 지정<\/p>\n<pre class=\"code\">UPDATE PROJECT  SET Plocation = &#x27;Bellaire&#x27;, Dnum = 5  WHERE Pnumber = 10;\nUPDATE EMPLOYEE SET Salary = Salary * 1.1             WHERE Dno = 5;<\/pre>\n<ul><li>UPDATE 하나로 여러 투플을 고칠 수 있다 (Dno=5인 4명이 한꺼번에 10% 인상)<\/li><li>ON UPDATE CASCADE가 있으면 다른 릴레이션으로 전파<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p26.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p26.jpg\" alt=\"04 p.26 · DELETE로 지워지는 투플 수 (0, 1, 4, 전부)\" loading=\"lazy\"><\/button><figcaption>04 p.26 · DELETE로 지워지는 투플 수 (0, 1, 4, 전부)<\/figcaption><\/figure><\/section>", "title_en": "INSERT, DELETE, UPDATE", "html_en": "<section class=\"sec\" id=\"s-dml-insert\"><h3>INSERT<\/h3><p><b>Form 1: values for all attributes<\/b> — list the values <b>in the same order<\/b> as the attributes were specified in CREATE TABLE<\/p>\n<pre class=\"code\">INSERT INTO EMPLOYEE\nVALUES (&#x27;Richard&#x27;, &#x27;K&#x27;, &#x27;Marini&#x27;, &#x27;653298653&#x27;, &#x27;1962-12-30&#x27;,\n        &#x27;98 Oak Forest, Katy, TX&#x27;, &#x27;M&#x27;, 37000, &#x27;653298653&#x27;, 4);<\/pre>\n<p><b>Form 2: explicit attribute names<\/b> — attributes that are <b>NOT NULL and have no DEFAULT must<\/b> be included<\/p>\n<pre class=\"code\">INSERT INTO EMPLOYEE (Fname, Lname, Dno, Ssn)\nVALUES (&#x27;Richard&#x27;, &#x27;Marini&#x27;, 4, &#x27;653298653&#x27;);<\/pre>\n<p><b>Constraint violation examples (rejected)<\/b><\/p>\n<ul><li><code>INSERT INTO EMPLOYEE (Fname, Lname, Ssn, Dno) VALUES ('Robert', 'Hatcher', '980760540', 2);<\/code> → no department with Dnumber=2 → <b>referential integrity<\/b><\/li><li><code>INSERT INTO EMPLOYEE (Fname, Lname, Dno) VALUES ('Robert', 'Hatcher', 5);<\/code> → no Ssn → <b>NOT NULL<\/b> (it is the PK, so entity integrity)<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p25.jpg\" aria-label=\"Enlarge\"><img src=\"img/SQL-p25.jpg\" alt=\"04 p.25 · INSERT violating referential integrity and NOT NULL\" loading=\"lazy\"><\/button><figcaption>04 p.25 · INSERT violating referential integrity and NOT NULL<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-dml-delete-update\"><h3>DELETE and UPDATE<\/h3><p><b>DELETE<\/b>: the WHERE clause selects the tuples to delete from <b>one relation<\/b><\/p>\n<ul><li>Explicitly deletes from only one table at a time. With a referential triggered action (ON DELETE CASCADE) it can propagate to other relations<\/li><li>The number of tuples deleted varies (on the COMPANY state):<\/li><\/ul>\n<pre class=\"code\">DELETE FROM EMPLOYEE WHERE Lname = &#x27;Brown&#x27;;        -- 0 tuples\nDELETE FROM EMPLOYEE WHERE Ssn = &#x27;123456789&#x27;;      -- 1 tuple\nDELETE FROM EMPLOYEE WHERE Dno = 5;                -- 4 tuples\nDELETE FROM EMPLOYEE;                              -- all of them!<\/pre>\n<div class=\"callout trap\">Caution: <b>if WHERE is omitted, all tuples are deleted.<\/b> The table definition remains (unlike DROP TABLE).<\/div>\n<p><b>UPDATE<\/b>: the WHERE clause selects the tuples to modify in <b>one relation<\/b>, and <b>SET<\/b> specifies the attributes to change and their new values<\/p>\n<pre class=\"code\">UPDATE PROJECT  SET Plocation = &#x27;Bellaire&#x27;, Dnum = 5  WHERE Pnumber = 10;\nUPDATE EMPLOYEE SET Salary = Salary * 1.1             WHERE Dno = 5;<\/pre>\n<ul><li>A single UPDATE can modify several tuples (the 4 employees with Dno=5 all get a 10% raise at once)<\/li><li>With ON UPDATE CASCADE it propagates to other relations<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p26.jpg\" aria-label=\"Enlarge\"><img src=\"img/SQL-p26.jpg\" alt=\"04 p.26 · Number of tuples deleted by DELETE (0, 1, 4, all)\" loading=\"lazy\"><\/button><figcaption>04 p.26 · Number of tuples deleted by DELETE (0, 1, 4, all)<\/figcaption><\/figure><\/section>"}, {"id": "L4-4", "title": "SELECT-FROM-WHERE · 별칭", "src": "4-1 p.28–34", "secs": [{"id": "sfw", "title": "SELECT-FROM-WHERE 블록", "title_en": "The SELECT-FROM-WHERE block"}, {"id": "qualify-alias", "title": "모호한 속성 이름과 별칭", "title_en": "Ambiguous attribute names and aliases"}, {"id": "missing-where-star", "title": "WHERE 생략과 *", "title_en": "Missing WHERE and *"}], "md": "## SELECT-FROM-WHERE 블록 {#sfw}\n\n```\nSELECT  <attribute list>      -- 투영 속성 (projection attributes)\nFROM    <table list>          -- 질의에 필요한 릴레이션\nWHERE   <condition>;          -- 선택 조건 + 조인 조건\n```\n**질의 1**: 'John B. Smith'의 생일과 주소\n```\nSELECT Bdate, Address\nFROM   EMPLOYEE\nWHERE  Fname = 'John' AND Minit = 'B' AND Lname = 'Smith';\n```\n→ 1965-01-09, 731 Fondren, Houston, TX\n\n**질의 2**: 'Research' 부서에서 일하는 모든 사원의 이름과 주소\n```\nSELECT Fname, Lname, Address\nFROM   EMPLOYEE, DEPARTMENT\nWHERE  Dname = 'Research' AND Dnumber = Dno;\n```\n- `Dname = 'Research'` = **선택 조건** (한 테이블에서 관심 있는 투플 고르기)\n- `Dnumber = Dno` = **조인 조건** (DEPARTMENT 투플과 EMPLOYEE 투플을 결합)\n- 결과: Smith, Wong, Narayan, English (4명)\n\n## 모호한 속성 이름과 별칭 {#qualify-alias}\n\n**자격 부여 (qualify)**: 다른 릴레이션에 같은 이름의 속성이 있으면 `릴레이션이름.속성`으로 구분.\n```\nSELECT Fname, EMPLOYEE.Name, Address\nFROM   EMPLOYEE, DEPARTMENT\nWHERE  DEPARTMENT.Name = 'Research' AND DEPARTMENT.Dnumber = EMPLOYEE.Dnumber;\n```\n**별칭 (alias, 투플 변수)**: 긴 이름 반복을 줄이고, **같은 릴레이션을 두 번** 참조할 때 필수.\n```\nSELECT E.Fname, E.Lname, S.Fname, S.Lname\nFROM   EMPLOYEE AS E, EMPLOYEE AS S\nWHERE  E.Super_ssn = S.Ssn;\n```\n→ 사원과 그 직속 상사의 이름. E = 사원 역할, S = 상사 역할. 상사가 없는 Borg는 결과에 없다 (7행).\n\n> 함정: 교안 p.32의 `FROM EMPLOYEE AS E WHERE E.Super_ssn = E.Ssn` 은 별칭이 하나라서 \"자기 자신이 자기 상사인 사원\"을 찾는 질의가 된다 (결과 0행). 같은 테이블을 두 역할로 쓰려면 별칭이 **두 개** 필요하다는 걸 보여주는 예.\n\n## WHERE 생략과 * {#missing-where-star}\n\n**WHERE 생략**: 투플 선택 조건이 없음 → FROM의 릴레이션 투플을 전부 검색.\n- 릴레이션이 둘 이상이면 **가능한 모든 투플 조합 (카티션 곱)** 이 나온다\n- `SELECT Ssn, Dname FROM EMPLOYEE, DEPARTMENT;` → 8 × 3 = **24행**\n- 조건 하나라도 빠뜨리면 틀리고 아주 큰 결과가 나오니 **WHERE에 모든 조건을 다 써야** 한다\n\n**별표 (*)**: 선택된 투플의 **모든 속성** 값. `SELECT * FROM EMPLOYEE WHERE Dno = 5;` → 4행, 10열.", "html": "<section class=\"sec\" id=\"s-sfw\"><h3>SELECT-FROM-WHERE 블록<\/h3><pre class=\"code\">SELECT  &lt;attribute list&gt;      -- 투영 속성 (projection attributes)\nFROM    &lt;table list&gt;          -- 질의에 필요한 릴레이션\nWHERE   &lt;condition&gt;;          -- 선택 조건 + 조인 조건<\/pre>\n<p><b>질의 1<\/b>: 'John B. Smith'의 생일과 주소<\/p>\n<pre class=\"code\">SELECT Bdate, Address\nFROM   EMPLOYEE\nWHERE  Fname = &#x27;John&#x27; AND Minit = &#x27;B&#x27; AND Lname = &#x27;Smith&#x27;;<\/pre>\n<p>→ 1965-01-09, 731 Fondren, Houston, TX<\/p>\n<p><b>질의 2<\/b>: 'Research' 부서에서 일하는 모든 사원의 이름과 주소<\/p>\n<pre class=\"code\">SELECT Fname, Lname, Address\nFROM   EMPLOYEE, DEPARTMENT\nWHERE  Dname = &#x27;Research&#x27; AND Dnumber = Dno;<\/pre>\n<ul><li><code>Dname = 'Research'<\/code> = <b>선택 조건<\/b> (한 테이블에서 관심 있는 투플 고르기)<\/li><li><code>Dnumber = Dno<\/code> = <b>조인 조건<\/b> (DEPARTMENT 투플과 EMPLOYEE 투플을 결합)<\/li><li>결과: Smith, Wong, Narayan, English (4명)<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p30.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p30.jpg\" alt=\"04 p.30 · 질의 2: 선택 조건 Dname=&#x27;Research&#x27; + 조인 조건 Dnumber=Dno\" loading=\"lazy\"><\/button><figcaption>04 p.30 · 질의 2: 선택 조건 Dname=&#x27;Research&#x27; + 조인 조건 Dnumber=Dno<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-qualify-alias\"><h3>모호한 속성 이름과 별칭<\/h3><p><b>자격 부여 (qualify)<\/b>: 다른 릴레이션에 같은 이름의 속성이 있으면 <code>릴레이션이름.속성<\/code>으로 구분.<\/p>\n<pre class=\"code\">SELECT Fname, EMPLOYEE.Name, Address\nFROM   EMPLOYEE, DEPARTMENT\nWHERE  DEPARTMENT.Name = &#x27;Research&#x27; AND DEPARTMENT.Dnumber = EMPLOYEE.Dnumber;<\/pre>\n<p><b>별칭 (alias, 투플 변수)<\/b>: 긴 이름 반복을 줄이고, <b>같은 릴레이션을 두 번<\/b> 참조할 때 필수.<\/p>\n<pre class=\"code\">SELECT E.Fname, E.Lname, S.Fname, S.Lname\nFROM   EMPLOYEE AS E, EMPLOYEE AS S\nWHERE  E.Super_ssn = S.Ssn;<\/pre>\n<p>→ 사원과 그 직속 상사의 이름. E = 사원 역할, S = 상사 역할. 상사가 없는 Borg는 결과에 없다 (7행).<\/p>\n<div class=\"callout trap\">함정: 교안 p.32의 <code>FROM EMPLOYEE AS E WHERE E.Super_ssn = E.Ssn<\/code> 은 별칭이 하나라서 \"자기 자신이 자기 상사인 사원\"을 찾는 질의가 된다 (결과 0행). 같은 테이블을 두 역할로 쓰려면 별칭이 <b>두 개<\/b> 필요하다는 걸 보여주는 예.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p32.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p32.jpg\" alt=\"04 p.32 · 별칭 (같은 테이블을 두 번 쓰는 사원–상사 질의)\" loading=\"lazy\"><\/button><figcaption>04 p.32 · 별칭 (같은 테이블을 두 번 쓰는 사원–상사 질의)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-missing-where-star\"><h3>WHERE 생략과 *<\/h3><p><b>WHERE 생략<\/b>: 투플 선택 조건이 없음 → FROM의 릴레이션 투플을 전부 검색.<\/p>\n<ul><li>릴레이션이 둘 이상이면 <b>가능한 모든 투플 조합 (카티션 곱)<\/b> 이 나온다<\/li><li><code>SELECT Ssn, Dname FROM EMPLOYEE, DEPARTMENT;<\/code> → 8 × 3 = <b>24행<\/b><\/li><li>조건 하나라도 빠뜨리면 틀리고 아주 큰 결과가 나오니 <b>WHERE에 모든 조건을 다 써야<\/b> 한다<\/li><\/ul>\n<p><b>별표 (*)<\/b>: 선택된 투플의 <b>모든 속성<\/b> 값. <code>SELECT * FROM EMPLOYEE WHERE Dno = 5;<\/code> → 4행, 10열.<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p33.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p33.jpg\" alt=\"04 p.33 · WHERE 생략 → 8 × 3 = 24개 조합\" loading=\"lazy\"><\/button><figcaption>04 p.33 · WHERE 생략 → 8 × 3 = 24개 조합<\/figcaption><\/figure><\/section>", "title_en": "SELECT-FROM-WHERE, Aliases", "html_en": "<section class=\"sec\" id=\"s-sfw\"><h3>The SELECT-FROM-WHERE block<\/h3><pre class=\"code\">SELECT  &lt;attribute list&gt;      -- projection attributes\nFROM    &lt;table list&gt;          -- relations needed by the query\nWHERE   &lt;condition&gt;;          -- selection conditions + join conditions<\/pre>\n<p><b>Query 1<\/b>: the birth date and address of 'John B. Smith'<\/p>\n<pre class=\"code\">SELECT Bdate, Address\nFROM   EMPLOYEE\nWHERE  Fname = &#x27;John&#x27; AND Minit = &#x27;B&#x27; AND Lname = &#x27;Smith&#x27;;<\/pre>\n<p>→ 1965-01-09, 731 Fondren, Houston, TX<\/p>\n<p><b>Query 2<\/b>: the name and address of all employees who work for the 'Research' department<\/p>\n<pre class=\"code\">SELECT Fname, Lname, Address\nFROM   EMPLOYEE, DEPARTMENT\nWHERE  Dname = &#x27;Research&#x27; AND Dnumber = Dno;<\/pre>\n<ul><li><code>Dname = 'Research'<\/code> = <b>selection condition<\/b> (picks the tuples of interest from one table)<\/li><li><code>Dnumber = Dno<\/code> = <b>join condition<\/b> (combines DEPARTMENT tuples with EMPLOYEE tuples)<\/li><li>Result: Smith, Wong, Narayan, English (4 employees)<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p30.jpg\" aria-label=\"Enlarge\"><img src=\"img/SQL-p30.jpg\" alt=\"04 p.30 · Query 2: selection condition Dname=&#x27;Research&#x27; + join condition Dnumber=Dno\" loading=\"lazy\"><\/button><figcaption>04 p.30 · Query 2: selection condition Dname=&#x27;Research&#x27; + join condition Dnumber=Dno<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-qualify-alias\"><h3>Ambiguous attribute names and aliases<\/h3><p><b>Qualifying<\/b>: if attributes in different relations have the same name, distinguish them as <code>RelationName.Attribute<\/code>.<\/p>\n<pre class=\"code\">SELECT Fname, EMPLOYEE.Name, Address\nFROM   EMPLOYEE, DEPARTMENT\nWHERE  DEPARTMENT.Name = &#x27;Research&#x27; AND DEPARTMENT.Dnumber = EMPLOYEE.Dnumber;<\/pre>\n<p><b>Alias (tuple variable)<\/b>: shortens repeated long names, and is required when referring to <b>the same relation twice<\/b>.<\/p>\n<pre class=\"code\">SELECT E.Fname, E.Lname, S.Fname, S.Lname\nFROM   EMPLOYEE AS E, EMPLOYEE AS S\nWHERE  E.Super_ssn = S.Ssn;<\/pre>\n<p>→ The names of employees and their immediate supervisors. E = employee role, S = supervisor role. Borg, who has no supervisor, is not in the result (7 rows).<\/p>\n<div class=\"callout trap\">Trap: on slide p.32, <code>FROM EMPLOYEE AS E WHERE E.Super_ssn = E.Ssn<\/code> has only one alias, so it becomes a query for \"employees who are their own supervisor\" (0 rows). It shows that using the same table in two roles requires <b>two<\/b> aliases.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p32.jpg\" aria-label=\"Enlarge\"><img src=\"img/SQL-p32.jpg\" alt=\"04 p.32 · Aliases (employee–supervisor query using the same table twice)\" loading=\"lazy\"><\/button><figcaption>04 p.32 · Aliases (employee–supervisor query using the same table twice)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-missing-where-star\"><h3>Missing WHERE and *<\/h3><p><b>Missing WHERE<\/b>: no tuple selection condition → all tuples of the relations in FROM are retrieved.<\/p>\n<ul><li>With two or more relations, <b>all possible tuple combinations (the Cartesian product)<\/b> are produced<\/li><li><code>SELECT Ssn, Dname FROM EMPLOYEE, DEPARTMENT;<\/code> → 8 × 3 = <b>24 rows<\/b><\/li><li>Leaving out even one condition gives a wrong and very large result, so <b>write every condition in WHERE<\/b><\/li><\/ul>\n<p><b>Asterisk (*)<\/b>: the values of <b>all attributes<\/b> of the selected tuples. <code>SELECT * FROM EMPLOYEE WHERE Dno = 5;<\/code> → 4 rows, 10 columns.<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p33.jpg\" aria-label=\"Enlarge\"><img src=\"img/SQL-p33.jpg\" alt=\"04 p.33 · WHERE omitted → 8 × 3 = 24 combinations\" loading=\"lazy\"><\/button><figcaption>04 p.33 · WHERE omitted → 8 × 3 = 24 combinations<\/figcaption><\/figure><\/section>"}, {"id": "L4-5", "title": "다중집합 · 집합 연산 · ORDER BY · 연산자", "src": "4-1 p.35–41", "secs": [{"id": "multiset-distinct", "title": "다중집합과 DISTINCT", "title_en": "Multisets and DISTINCT"}, {"id": "set-ops", "title": "집합 연산 UNION / EXCEPT / INTERSECT", "title_en": "Set operations UNION / EXCEPT / INTERSECT"}, {"id": "order-arith", "title": "ORDER BY · 산술 연산 · BETWEEN", "title_en": "ORDER BY, arithmetic operators, BETWEEN"}], "md": "## 다중집합과 DISTINCT {#multiset-distinct}\n\n**SQL은 테이블을 집합이 아니라 다중집합(multiset)으로 다룬다** → 테이블이나 질의 결과에 **중복 투플**이 있을 수 있고, SQL은 **중복을 자동으로 제거하지 않는다**.\n\n왜?\n- 중복 제거는 **비싼** 연산 (투플을 정렬한 다음 중복을 지워야 함)\n- 사용자가 중복을 보고 싶을 때도 있음\n- 집계 함수를 쓸 때 중복이 필요 (예: 급여 평균) → 5주차\n\n키워드\n- **ALL** (기본): 중복 유지. `SELECT ALL Salary FROM EMPLOYEE;` → 8행 (25000이 3번)\n- **DISTINCT**: 중복 제거. `SELECT DISTINCT Salary FROM EMPLOYEE;` → 6행\n\n## 집합 연산 UNION / EXCEPT / INTERSECT {#set-ops}\n\n- **UNION**(합), **EXCEPT**(차), **INTERSECT**(교). 결과는 투플의 **집합** → **중복 제거됨**\n- **타입 호환(type-compatible)** 되는 릴레이션에만 적용 (속성 수가 같고 대응 속성의 도메인이 같음)\n- 다중집합 버전: **UNION ALL, EXCEPT ALL, INTERSECT ALL** (중복 유지)\n  - R(A) = {a1, a2, a2, a3}, S(A) = {a1, a2, a4, a5}\n  - R UNION ALL S = {a1, a1, a2, a2, a2, a3, a4, a5}\n  - R EXCEPT ALL S = {a2, a3}\n  - R INTERSECT ALL S = {a1, a2}\n\n**질의 4**: 성이 'Smith'인 사원이 **일꾼**으로든 그 프로젝트를 통제하는 부서의 **관리자**로든 관련된 프로젝트 번호\n```\n( SELECT DISTINCT Pnumber\n  FROM   PROJECT, DEPARTMENT, EMPLOYEE\n  WHERE  Dnum = Dnumber AND Mgr_ssn = Ssn AND Lname = 'Smith' )\nUNION\n( SELECT DISTINCT Pnumber\n  FROM   PROJECT, WORKS_ON, EMPLOYEE\n  WHERE  Pnumber = Pno AND Essn = Ssn AND Lname = 'Smith' );\n```\n→ Smith는 관리자가 아니라 첫 블록은 비고, 일꾼으로 1, 2 → 결과 {1, 2}\n\n## ORDER BY · 산술 연산 · BETWEEN {#order-arith}\n\n**ORDER BY**: 결과 투플을 속성 값 기준으로 정렬. **기본은 오름차순(ASC)**, 내림차순은 DESC.\n```\nSELECT   D.Dname, E.Lname, E.Fname, P.Pname\nFROM     DEPARTMENT AS D, EMPLOYEE AS E, WORKS_ON AS W, PROJECT AS P\nWHERE    D.Dnumber = E.Dno AND E.Ssn = W.Essn AND W.Pno = P.Pnumber\nORDER BY D.Dname DESC, E.Lname ASC, E.Fname ASC;\n```\n**산술 연산자** + − * /: 숫자 속성에 적용. **릴레이션 상태는 바뀌지 않는다** (결과에만 반영)\n```\nSELECT E.Fname, E.Lname, 1.1 * E.Salary AS Increased_sal\nFROM   EMPLOYEE AS E, WORKS_ON AS W, PROJECT AS P\nWHERE  E.Ssn = W.Essn AND W.Pno = P.Pnumber AND P.Pname = 'ProductX';\n```\n→ Smith 33000, English 27500\n\n**BETWEEN**: 범위 조건. `(Salary BETWEEN 30000 AND 40000)` = `((Salary >= 30000) AND (Salary <= 40000))` → **양 끝 포함**\n```\nSELECT * FROM EMPLOYEE WHERE (Salary BETWEEN 30000 AND 40000) AND Dno = 5;\n```\n→ Smith(30000), Wong(40000), Narayan(38000)\n\n> 실습 메모 (3-2, week6 lab): 실습은 SQLite + Python(pandas, sqlglot). NL_queries.txt를 보고 mysql.py에 SQL을 쓰고 test.py로 결과 CSV를 만든다. 제출 압축 파일 이름은 반드시 학번. **SQLite는 ALL, ANY를 지원하지 않는다.**", "html": "<section class=\"sec\" id=\"s-multiset-distinct\"><h3>다중집합과 DISTINCT<\/h3><p><b>SQL은 테이블을 집합이 아니라 다중집합(multiset)으로 다룬다<\/b> → 테이블이나 질의 결과에 <b>중복 투플<\/b>이 있을 수 있고, SQL은 <b>중복을 자동으로 제거하지 않는다<\/b>.<\/p>\n<p>왜?<\/p>\n<ul><li>중복 제거는 <b>비싼<\/b> 연산 (투플을 정렬한 다음 중복을 지워야 함)<\/li><li>사용자가 중복을 보고 싶을 때도 있음<\/li><li>집계 함수를 쓸 때 중복이 필요 (예: 급여 평균) → 5주차<\/li><\/ul>\n<p>키워드<\/p>\n<ul><li><b>ALL<\/b> (기본): 중복 유지. <code>SELECT ALL Salary FROM EMPLOYEE;<\/code> → 8행 (25000이 3번)<\/li><li><b>DISTINCT<\/b>: 중복 제거. <code>SELECT DISTINCT Salary FROM EMPLOYEE;<\/code> → 6행<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p36.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p36.jpg\" alt=\"04 p.36 · ALL Salary (8행) vs DISTINCT Salary (6행)\" loading=\"lazy\"><\/button><figcaption>04 p.36 · ALL Salary (8행) vs DISTINCT Salary (6행)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-set-ops\"><h3>집합 연산 UNION / EXCEPT / INTERSECT<\/h3><ul><li><b>UNION<\/b>(합), <b>EXCEPT<\/b>(차), <b>INTERSECT<\/b>(교). 결과는 투플의 <b>집합<\/b> → <b>중복 제거됨<\/b><\/li><li><b>타입 호환(type-compatible)<\/b> 되는 릴레이션에만 적용 (속성 수가 같고 대응 속성의 도메인이 같음)<\/li><li>다중집합 버전: <b>UNION ALL, EXCEPT ALL, INTERSECT ALL<\/b> (중복 유지)<ul><li>R(A) = {a1, a2, a2, a3}, S(A) = {a1, a2, a4, a5}<\/li><li>R UNION ALL S = {a1, a1, a2, a2, a2, a3, a4, a5}<\/li><li>R EXCEPT ALL S = {a2, a3}<\/li><li>R INTERSECT ALL S = {a1, a2}<\/li><\/ul><\/li><\/ul>\n<p><b>질의 4<\/b>: 성이 'Smith'인 사원이 <b>일꾼<\/b>으로든 그 프로젝트를 통제하는 부서의 <b>관리자<\/b>로든 관련된 프로젝트 번호<\/p>\n<pre class=\"code\">( SELECT DISTINCT Pnumber\n  FROM   PROJECT, DEPARTMENT, EMPLOYEE\n  WHERE  Dnum = Dnumber AND Mgr_ssn = Ssn AND Lname = &#x27;Smith&#x27; )\nUNION\n( SELECT DISTINCT Pnumber\n  FROM   PROJECT, WORKS_ON, EMPLOYEE\n  WHERE  Pnumber = Pno AND Essn = Ssn AND Lname = &#x27;Smith&#x27; );<\/pre>\n<p>→ Smith는 관리자가 아니라 첫 블록은 비고, 일꾼으로 1, 2 → 결과 {1, 2}<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p38.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p38.jpg\" alt=\"04 p.38 · UNION ALL, EXCEPT ALL, INTERSECT ALL\" loading=\"lazy\"><\/button><figcaption>04 p.38 · UNION ALL, EXCEPT ALL, INTERSECT ALL<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-order-arith\"><h3>ORDER BY · 산술 연산 · BETWEEN<\/h3><p><b>ORDER BY<\/b>: 결과 투플을 속성 값 기준으로 정렬. <b>기본은 오름차순(ASC)<\/b>, 내림차순은 DESC.<\/p>\n<pre class=\"code\">SELECT   D.Dname, E.Lname, E.Fname, P.Pname\nFROM     DEPARTMENT AS D, EMPLOYEE AS E, WORKS_ON AS W, PROJECT AS P\nWHERE    D.Dnumber = E.Dno AND E.Ssn = W.Essn AND W.Pno = P.Pnumber\nORDER BY D.Dname DESC, E.Lname ASC, E.Fname ASC;<\/pre>\n<p><b>산술 연산자<\/b> + − * /: 숫자 속성에 적용. <b>릴레이션 상태는 바뀌지 않는다<\/b> (결과에만 반영)<\/p>\n<pre class=\"code\">SELECT E.Fname, E.Lname, 1.1 * E.Salary AS Increased_sal\nFROM   EMPLOYEE AS E, WORKS_ON AS W, PROJECT AS P\nWHERE  E.Ssn = W.Essn AND W.Pno = P.Pnumber AND P.Pname = &#x27;ProductX&#x27;;<\/pre>\n<p>→ Smith 33000, English 27500<\/p>\n<p><b>BETWEEN<\/b>: 범위 조건. <code>(Salary BETWEEN 30000 AND 40000)<\/code> = <code>((Salary &gt;= 30000) AND (Salary &lt;= 40000))<\/code> → <b>양 끝 포함<\/b><\/p>\n<pre class=\"code\">SELECT * FROM EMPLOYEE WHERE (Salary BETWEEN 30000 AND 40000) AND Dno = 5;<\/pre>\n<p>→ Smith(30000), Wong(40000), Narayan(38000)<\/p>\n<div class=\"callout\">실습 메모 (3-2, week6 lab): 실습은 SQLite + Python(pandas, sqlglot). NL_queries.txt를 보고 mysql.py에 SQL을 쓰고 test.py로 결과 CSV를 만든다. 제출 압축 파일 이름은 반드시 학번. <b>SQLite는 ALL, ANY를 지원하지 않는다.<\/b><\/div><\/section>", "title_en": "Multisets, Set Operations, ORDER BY, Operators", "html_en": "<section class=\"sec\" id=\"s-multiset-distinct\"><h3>Multisets and DISTINCT<\/h3><p><b>SQL treats a table not as a set but as a multiset<\/b> → a table or query result may contain <b>duplicate tuples<\/b>, and SQL <b>does not eliminate duplicates automatically<\/b>.<\/p>\n<p>Why?<\/p>\n<ul><li>Duplicate elimination is an <b>expensive<\/b> operation (sort the tuples first, then remove duplicates)<\/li><li>The user may want to see duplicates<\/li><li>Duplicates are needed when applying aggregate functions (e.g., average salary) → week 5<\/li><\/ul>\n<p>Keywords<\/p>\n<ul><li><b>ALL<\/b> (default): keeps duplicates. <code>SELECT ALL Salary FROM EMPLOYEE;<\/code> → 8 rows (25000 appears 3 times)<\/li><li><b>DISTINCT<\/b>: eliminates duplicates. <code>SELECT DISTINCT Salary FROM EMPLOYEE;<\/code> → 6 rows<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p36.jpg\" aria-label=\"Enlarge\"><img src=\"img/SQL-p36.jpg\" alt=\"04 p.36 · ALL Salary (8 rows) vs DISTINCT Salary (6 rows)\" loading=\"lazy\"><\/button><figcaption>04 p.36 · ALL Salary (8 rows) vs DISTINCT Salary (6 rows)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-set-ops\"><h3>Set operations UNION / EXCEPT / INTERSECT<\/h3><ul><li><b>UNION<\/b>, <b>EXCEPT<\/b> (difference), <b>INTERSECT<\/b>. The result is a <b>set<\/b> of tuples → <b>duplicates are eliminated<\/b><\/li><li>Applies only to <b>type-compatible<\/b> relations (same number of attributes, and corresponding attributes have the same domain)<\/li><li>Multiset versions: <b>UNION ALL, EXCEPT ALL, INTERSECT ALL<\/b> (keep duplicates)<ul><li>R(A) = {a1, a2, a2, a3}, S(A) = {a1, a2, a4, a5}<\/li><li>R UNION ALL S = {a1, a1, a2, a2, a2, a3, a4, a5}<\/li><li>R EXCEPT ALL S = {a2, a3}<\/li><li>R INTERSECT ALL S = {a1, a2}<\/li><\/ul><\/li><\/ul>\n<p><b>Query 4<\/b>: project numbers of projects that involve an employee whose last name is 'Smith', either as a <b>worker<\/b> or as a <b>manager<\/b> of the department that controls the project<\/p>\n<pre class=\"code\">( SELECT DISTINCT Pnumber\n  FROM   PROJECT, DEPARTMENT, EMPLOYEE\n  WHERE  Dnum = Dnumber AND Mgr_ssn = Ssn AND Lname = &#x27;Smith&#x27; )\nUNION\n( SELECT DISTINCT Pnumber\n  FROM   PROJECT, WORKS_ON, EMPLOYEE\n  WHERE  Pnumber = Pno AND Essn = Ssn AND Lname = &#x27;Smith&#x27; );<\/pre>\n<p>→ Smith is not a manager, so the first block is empty; as a worker, 1 and 2 → result {1, 2}<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p38.jpg\" aria-label=\"Enlarge\"><img src=\"img/SQL-p38.jpg\" alt=\"04 p.38 · UNION ALL, EXCEPT ALL, INTERSECT ALL\" loading=\"lazy\"><\/button><figcaption>04 p.38 · UNION ALL, EXCEPT ALL, INTERSECT ALL<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-order-arith\"><h3>ORDER BY, arithmetic operators, BETWEEN<\/h3><p><b>ORDER BY<\/b>: sorts result tuples by attribute values. <b>Default is ascending (ASC)<\/b>; DESC for descending.<\/p>\n<pre class=\"code\">SELECT   D.Dname, E.Lname, E.Fname, P.Pname\nFROM     DEPARTMENT AS D, EMPLOYEE AS E, WORKS_ON AS W, PROJECT AS P\nWHERE    D.Dnumber = E.Dno AND E.Ssn = W.Essn AND W.Pno = P.Pnumber\nORDER BY D.Dname DESC, E.Lname ASC, E.Fname ASC;<\/pre>\n<p><b>Arithmetic operators<\/b> + − * /: applied to numeric attributes. <b>The relation state does not change<\/b> (only the result reflects it)<\/p>\n<pre class=\"code\">SELECT E.Fname, E.Lname, 1.1 * E.Salary AS Increased_sal\nFROM   EMPLOYEE AS E, WORKS_ON AS W, PROJECT AS P\nWHERE  E.Ssn = W.Essn AND W.Pno = P.Pnumber AND P.Pname = &#x27;ProductX&#x27;;<\/pre>\n<p>→ Smith 33000, English 27500<\/p>\n<p><b>BETWEEN<\/b>: a range condition. <code>(Salary BETWEEN 30000 AND 40000)<\/code> = <code>((Salary &gt;= 30000) AND (Salary &lt;= 40000))<\/code> → <b>both ends inclusive<\/b><\/p>\n<pre class=\"code\">SELECT * FROM EMPLOYEE WHERE (Salary BETWEEN 30000 AND 40000) AND Dno = 5;<\/pre>\n<p>→ Smith (30000), Wong (40000), Narayan (38000)<\/p>\n<div class=\"callout\">Lab note (3-2, week 6 lab): the lab uses SQLite + Python (pandas, sqlglot). Read NL_queries.txt, write SQL in mysql.py, and run test.py to produce the result CSVs. The submitted zip file must be named with your student ID. <b>SQLite does not support ALL or ANY.<\/b><\/div><\/section>"}], "title_en": "Basic SQL (DDL, DML, SELECT)", "intro_en": "Constraint syntax in CREATE TABLE, referential triggered actions (ON DELETE/UPDATE), what INSERT, DELETE and UPDATE can violate, and SELECT-FROM-WHERE. You only get better at SQL by writing it. The practice answers include the actual results of running each query on the textbook COMPANY state (3-1 p.12)."}, {"id": "U5", "title": "Advanced SQL (중첩 · 조인 · 집계 · 뷰)", "src": "5-1_Advanced-SQL.pdf", "intro": "중첩 질의(IN, ALL/ANY, EXISTS), 조인 테이블(NATURAL, OUTER), 집계와 GROUP BY/HAVING, Assertion·Trigger, 뷰. SQL 작성 문제의 본체라서 문제를 많이 풀어봐. 특히 \"모든 ~를 하는\" 질의(나눗셈)와 GROUP BY + HAVING은 꼭.", "lessons": [{"id": "L5-1", "title": "중첩 질의 · IN · ALL/ANY", "src": "5-1 p.3–6", "secs": [{"id": "nested-in", "title": "중첩 질의와 IN", "title_en": "Nested queries and IN"}, {"id": "all-any", "title": "ALL / ANY (SOME)", "title_en": "ALL / ANY (SOME)"}, {"id": "correlated", "title": "중첩 질의의 모호성과 상관 질의", "title_en": "Ambiguity in nested queries and correlated queries"}], "md": "## 중첩 질의와 IN {#nested-in}\n\n**중첩 질의 (nested query)**: 다른 질의의 **WHERE 절 안에** 들어간 완전한 SELECT-FROM-WHERE 블록.\n- DB에 있는 값을 가져와서 WHERE 조건의 비교에 쓸 때 유용\n- 결과는 투플의 (다중)집합 → 바깥 질의 = outer query, 안쪽 = inner query\n\n**IN**: 값 v를 값의 (다중)집합 V와 비교. **v가 V의 원소 중 하나면 TRUE**.\n```\nSELECT DISTINCT Pnumber\nFROM   PROJECT\nWHERE  Pnumber IN ( SELECT Pnumber\n                    FROM   PROJECT, DEPARTMENT, EMPLOYEE\n                    WHERE  Dnum = Dnumber AND Mgr_ssn = Ssn AND Lname = 'Smith' )\n   OR  Pnumber IN ( SELECT Pno\n                    FROM   WORKS_ON, EMPLOYEE\n                    WHERE  Essn = Ssn AND Lname = 'Smith' );\n```\n→ 질의 4(UNION 버전)와 같은 결과 {1, 2}. 안쪽 질의 V1, V2가 각각 프로젝트 번호의 집합.\n\n## ALL / ANY (SOME) {#all-any}\n\n**= ANY (= SOME)**: v가 V의 **어떤** 값과 같으면 TRUE → **IN과 동치**. **= ALL**: **모든** 값과 같으면 TRUE.\n- = 말고 >, >=, <, <=, <> 와도 결합 가능\n\n```\nSELECT Lname, Fname\nFROM   EMPLOYEE\nWHERE  Salary > ALL ( SELECT Salary FROM EMPLOYEE WHERE Dno = 5 );\n```\n→ 5번 부서 **모든** 사원보다 급여가 많은 사원. 5번 부서 급여 = {30000, 40000, 38000, 25000} → 40000 초과 → Wallace(43000), Borg(55000)\n\n> 함정: `> ANY`는 \"어느 하나보다라도 크면\" = 최솟값보다 크면. `> ALL`은 최댓값보다 커야 함. 그리고 실습 환경 **SQLite는 ALL/ANY를 지원 안 하니** `> (SELECT MAX(Salary) ...)` 로 바꿔 써.\n\n## 중첩 질의의 모호성과 상관 질의 {#correlated}\n\n여러 단계 중첩에서 바깥 FROM과 안쪽 FROM에 **같은 이름의 속성**이 있으면 모호해진다 → **별칭**으로 해결.\n\n**질의 16**: 부양가족 중에 **이름(first name)과 성별이 사원 자신과 같은** 사람이 있는 사원\n```\nSELECT E.Fname, E.Lname\nFROM   EMPLOYEE AS E\nWHERE  E.Ssn IN ( SELECT D.Essn\n                  FROM   DEPENDENT AS D\n                  WHERE  E.Fname = D.Dependent_name AND E.Sex = D.Sex );\n```\n- 안쪽 질의가 바깥의 E를 참조 → **상관 중첩 질의 (correlated nested query)**: 바깥 투플마다 안쪽 질의를 다시 평가하는 것처럼 동작\n- 안쪽에서 별칭 없이 Sex라고 쓰면 가장 가까운(안쪽) 테이블의 속성으로 해석된다\n- COMPANY 상태에서는 결과 0행 (그런 부양가족이 없음)\n\n> 시험 포인트: \"질의에서 참조하는 **모든 테이블에 별칭을** 붙이는 게 일반적으로 권장된다\" (교안 문장 그대로).", "html": "<section class=\"sec\" id=\"s-nested-in\"><h3>중첩 질의와 IN<\/h3><p><b>중첩 질의 (nested query)<\/b>: 다른 질의의 <b>WHERE 절 안에<\/b> 들어간 완전한 SELECT-FROM-WHERE 블록.<\/p>\n<ul><li>DB에 있는 값을 가져와서 WHERE 조건의 비교에 쓸 때 유용<\/li><li>결과는 투플의 (다중)집합 → 바깥 질의 = outer query, 안쪽 = inner query<\/li><\/ul>\n<p><b>IN<\/b>: 값 v를 값의 (다중)집합 V와 비교. <b>v가 V의 원소 중 하나면 TRUE<\/b>.<\/p>\n<pre class=\"code\">SELECT DISTINCT Pnumber\nFROM   PROJECT\nWHERE  Pnumber IN ( SELECT Pnumber\n                    FROM   PROJECT, DEPARTMENT, EMPLOYEE\n                    WHERE  Dnum = Dnumber AND Mgr_ssn = Ssn AND Lname = &#x27;Smith&#x27; )\n   OR  Pnumber IN ( SELECT Pno\n                    FROM   WORKS_ON, EMPLOYEE\n                    WHERE  Essn = Ssn AND Lname = &#x27;Smith&#x27; );<\/pre>\n<p>→ 질의 4(UNION 버전)와 같은 결과 {1, 2}. 안쪽 질의 V1, V2가 각각 프로젝트 번호의 집합.<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>안쪽 질의의 결과가 무슨 형태인지 먼저 생각하라고 함: 'Pnumber들의 집합'이 나오고, IN은 지금 투플의 Pnumber가 그 집합에 들어 있는지 확인한다. 두 조건을 OR로 이어서 둘 중 하나만 만족해도 결과에 들어감.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p3.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p3.jpg\" alt=\"05 p.3 · 중첩 질의: 바깥 질의 안에 안쪽 질의 두 개\" loading=\"lazy\"><\/button><figcaption>05 p.3 · 중첩 질의: 바깥 질의 안에 안쪽 질의 두 개<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-all-any\"><h3>ALL / ANY (SOME)<\/h3><p><b>= ANY (= SOME)<\/b>: v가 V의 <b>어떤<\/b> 값과 같으면 TRUE → <b>IN과 동치<\/b>. <b>= ALL<\/b>: <b>모든<\/b> 값과 같으면 TRUE.<\/p>\n<ul><li>= 말고 &gt;, &gt;=, &lt;, &lt;=, &lt;&gt; 와도 결합 가능<\/li><\/ul>\n<pre class=\"code\">SELECT Lname, Fname\nFROM   EMPLOYEE\nWHERE  Salary &gt; ALL ( SELECT Salary FROM EMPLOYEE WHERE Dno = 5 );<\/pre>\n<p>→ 5번 부서 <b>모든<\/b> 사원보다 급여가 많은 사원. 5번 부서 급여 = {30000, 40000, 38000, 25000} → 40000 초과 → Wallace(43000), Borg(55000)<\/p>\n<div class=\"callout trap\">함정: <code>&gt; ANY<\/code>는 \"어느 하나보다라도 크면\" = 최솟값보다 크면. <code>&gt; ALL<\/code>은 최댓값보다 커야 함. 그리고 실습 환경 <b>SQLite는 ALL/ANY를 지원 안 하니<\/b> <code>&gt; (SELECT MAX(Salary) ...)<\/code> 로 바꿔 써.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p5.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p5.jpg\" alt=\"05 p.5 · Salary &gt; ALL (5번 부서 급여), = ANY는 IN과 동치\" loading=\"lazy\"><\/button><figcaption>05 p.5 · Salary &gt; ALL (5번 부서 급여), = ANY는 IN과 동치<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-correlated\"><h3>중첩 질의의 모호성과 상관 질의<\/h3><p>여러 단계 중첩에서 바깥 FROM과 안쪽 FROM에 <b>같은 이름의 속성<\/b>이 있으면 모호해진다 → <b>별칭<\/b>으로 해결.<\/p>\n<p><b>질의 16<\/b>: 부양가족 중에 <b>이름(first name)과 성별이 사원 자신과 같은<\/b> 사람이 있는 사원<\/p>\n<pre class=\"code\">SELECT E.Fname, E.Lname\nFROM   EMPLOYEE AS E\nWHERE  E.Ssn IN ( SELECT D.Essn\n                  FROM   DEPENDENT AS D\n                  WHERE  E.Fname = D.Dependent_name AND E.Sex = D.Sex );<\/pre>\n<ul><li>안쪽 질의가 바깥의 E를 참조 → <b>상관 중첩 질의 (correlated nested query)<\/b>: 바깥 투플마다 안쪽 질의를 다시 평가하는 것처럼 동작<\/li><li>안쪽에서 별칭 없이 Sex라고 쓰면 가장 가까운(안쪽) 테이블의 속성으로 해석된다<\/li><li>COMPANY 상태에서는 결과 0행 (그런 부양가족이 없음)<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: \"질의에서 참조하는 <b>모든 테이블에 별칭을<\/b> 붙이는 게 일반적으로 권장된다\" (교안 문장 그대로).<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>질의가 복잡해질수록 조건이 헷갈리니까, 모든 테이블에 E, D, S 같은 별칭(투플 변수)을 붙이는 관례를 '습관으로 만들라'고 강조.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p6.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p6.jpg\" alt=\"05 p.6 · 질의 16: 바깥 E를 참조하는 안쪽 질의 (별칭으로 모호성 제거)\" loading=\"lazy\"><\/button><figcaption>05 p.6 · 질의 16: 바깥 E를 참조하는 안쪽 질의 (별칭으로 모호성 제거)<\/figcaption><\/figure><\/section>", "title_en": "Nested Queries, IN, ALL/ANY", "html_en": "<section class=\"sec\" id=\"s-nested-in\"><h3>Nested queries and IN<\/h3><p><b>Nested query<\/b>: a complete SELECT-FROM-WHERE block <b>within the WHERE clause<\/b> of another query.<\/p>\n<ul><li>Useful when we need to fetch existing values from the database and use them in a comparison condition<\/li><li>The result is a (multi)set of tuples → the enclosing one = outer query, the inner one = inner query<\/li><\/ul>\n<p><b>IN<\/b>: compares a value v with a (multi)set of values V. <b>TRUE if v is one of the elements in V<\/b>.<\/p>\n<pre class=\"code\">SELECT DISTINCT Pnumber\nFROM   PROJECT\nWHERE  Pnumber IN ( SELECT Pnumber\n                    FROM   PROJECT, DEPARTMENT, EMPLOYEE\n                    WHERE  Dnum = Dnumber AND Mgr_ssn = Ssn AND Lname = &#x27;Smith&#x27; )\n   OR  Pnumber IN ( SELECT Pno\n                    FROM   WORKS_ON, EMPLOYEE\n                    WHERE  Essn = Ssn AND Lname = &#x27;Smith&#x27; );<\/pre>\n<p>→ Same result as Query 4 (UNION version): {1, 2}. The inner queries V1 and V2 each return a set of project numbers.<\/p><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 5-1<\/span><br>The professor said to first think about what form the inner query's result takes: it yields 'a set of Pnumbers', and IN checks whether the current tuple's Pnumber is in that set. The two conditions are joined with OR, so satisfying either one puts the tuple in the result.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p3.jpg\" aria-label=\"Enlarge\"><img src=\"img/ADV-p3.jpg\" alt=\"05 p.3 · Nested query: two inner queries inside the outer query\" loading=\"lazy\"><\/button><figcaption>05 p.3 · Nested query: two inner queries inside the outer query<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-all-any\"><h3>ALL / ANY (SOME)<\/h3><p><b>= ANY (= SOME)<\/b>: TRUE if v equals <b>some<\/b> value in V → <b>equivalent to IN<\/b>. <b>= ALL<\/b>: TRUE if v equals <b>every<\/b> value.<\/p>\n<ul><li>Can be combined with &gt;, &gt;=, &lt;, &lt;=, &lt;&gt; instead of =<\/li><\/ul>\n<pre class=\"code\">SELECT Lname, Fname\nFROM   EMPLOYEE\nWHERE  Salary &gt; ALL ( SELECT Salary FROM EMPLOYEE WHERE Dno = 5 );<\/pre>\n<p>→ Employees whose salary is greater than that of <b>all<\/b> employees in department 5. Dept 5 salaries = {30000, 40000, 38000, 25000} → above 40000 → Wallace (43000), Borg (55000)<\/p>\n<div class=\"callout trap\">Trap: <code>&gt; ANY<\/code> means \"greater than at least one\" = greater than the minimum. <code>&gt; ALL<\/code> must be greater than the maximum. Also, the lab's <b>SQLite does not support ALL/ANY<\/b>, so rewrite it as <code>&gt; (SELECT MAX(Salary) ...)<\/code>.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p5.jpg\" aria-label=\"Enlarge\"><img src=\"img/ADV-p5.jpg\" alt=\"05 p.5 · Salary &gt; ALL (salaries in department 5); = ANY is equivalent to IN\" loading=\"lazy\"><\/button><figcaption>05 p.5 · Salary &gt; ALL (salaries in department 5); = ANY is equivalent to IN<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-correlated\"><h3>Ambiguity in nested queries and correlated queries<\/h3><p>With several levels of nesting, if the outer FROM and the inner FROM have <b>attributes with the same name<\/b>, the query becomes ambiguous → resolve it with <b>aliases<\/b>.<\/p>\n<p><b>Query 16<\/b>: employees who have a dependent with the <b>same first name and the same sex<\/b> as the employee<\/p>\n<pre class=\"code\">SELECT E.Fname, E.Lname\nFROM   EMPLOYEE AS E\nWHERE  E.Ssn IN ( SELECT D.Essn\n                  FROM   DEPENDENT AS D\n                  WHERE  E.Fname = D.Dependent_name AND E.Sex = D.Sex );<\/pre>\n<ul><li>The inner query references the outer E → <b>correlated nested query<\/b>: behaves as if the inner query were evaluated once for each outer tuple<\/li><li>If you write Sex in the inner query without an alias, it refers to the attribute of the nearest (innermost) table<\/li><li>On the COMPANY state the result is 0 rows (no such dependent)<\/li><\/ul>\n<div class=\"callout exam\">Exam point: \"It is generally advisable to create tuple variables (aliases) for <b>all the tables referenced<\/b> in a query\" (the slide sentence as written).<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 5-1<\/span><br>As queries get more complex the conditions get confusing, so the professor stressed 'making it a habit' to give every table an alias (tuple variable) such as E, D, S.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p6.jpg\" aria-label=\"Enlarge\"><img src=\"img/ADV-p6.jpg\" alt=\"05 p.6 · Query 16: inner query referencing the outer E (ambiguity removed with aliases)\" loading=\"lazy\"><\/button><figcaption>05 p.6 · Query 16: inner query referencing the outer E (ambiguity removed with aliases)<\/figcaption><\/figure><\/section>"}, {"id": "L5-2", "title": "EXISTS / NOT EXISTS · 나눗셈 질의", "src": "5-1 p.7–9", "secs": [{"id": "exists", "title": "EXISTS와 NOT EXISTS", "title_en": "EXISTS and NOT EXISTS"}, {"id": "division-sql", "title": "\"모든 ~에 대해\" (나눗셈) 질의", "title_en": "\"For all …\" (division) queries"}], "md": "## EXISTS와 NOT EXISTS {#exists}\n\n**중첩 질의 결과가 비었는지** 검사하는 불리언 함수. 보통 WHERE에서 씀.\n- **EXISTS (Q)**: Q의 결과에 투플이 **하나라도 있으면** TRUE\n- **NOT EXISTS (Q)**: Q의 결과가 **비어 있으면** TRUE\n\n**질의 6**: 부양가족이 **없는** 사원\n```\nSELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  NOT EXISTS ( SELECT * FROM DEPENDENT WHERE Ssn = Essn );\n```\n→ Zelaya, Narayan, English, Jabbar, Borg (5명)\n\n**부양가족이 하나 이상 있는 관리자**: 두 조건을 AND\n```\nSELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  EXISTS ( SELECT * FROM DEPENDENT  WHERE Ssn = Essn )\n  AND  EXISTS ( SELECT * FROM DEPARTMENT WHERE Ssn = Mgr_ssn );\n```\n→ Franklin Wong, Jennifer Wallace\n\n## \"모든 ~에 대해\" (나눗셈) 질의 {#division-sql}\n\n**연습 1**: 5번 부서가 통제하는 **모든** 프로젝트에서 일하는 사원의 이름\n```\nSELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  NOT EXISTS ( ( SELECT Pnumber FROM PROJECT WHERE Dnum = 5 )\n                    EXCEPT\n                    ( SELECT Pno FROM WORKS_ON WHERE Ssn = Essn ) );\n```\n읽는 법: (5번 부서 프로젝트 전체) − (이 사원이 일하는 프로젝트) = **빠진 프로젝트**. 빠진 게 **없으면**(NOT EXISTS) 전부 하는 것.\n- 예: 5번 부서 프로젝트 = {1, 2, 3}. A는 {1, 2, 4} → 차집합 {3} ≠ ∅ → 탈락. B는 {1, 2, 3, 4} → 차집합 ∅ → 선택\n- COMPANY 상태에서 5번 부서 프로젝트 = {1, 2, 3}인데 세 개 다 하는 사원이 없어서 결과는 **0행**\n\nEXCEPT 없이 NOT EXISTS 두 번으로도 쓸 수 있다 (\"이 사원이 안 하는 5번 부서 프로젝트가 존재하지 않는다\"):\n```\nSELECT E.Fname, E.Lname\nFROM   EMPLOYEE AS E\nWHERE  NOT EXISTS ( SELECT * FROM PROJECT AS P\n                    WHERE  P.Dnum = 5\n                      AND  NOT EXISTS ( SELECT * FROM WORKS_ON AS W\n                                        WHERE W.Essn = E.Ssn AND W.Pno = P.Pnumber ) );\n```\n\n> 함정: \"어떤\" 프로젝트에서 일하는 사원(EXISTS, IN)과 \"모든\" 프로젝트에서 일하는 사원(NOT EXISTS + EXCEPT)을 구별해. 문장에 **all**이 나오면 나눗셈 패턴.", "html": "<section class=\"sec\" id=\"s-exists\"><h3>EXISTS와 NOT EXISTS<\/h3><p><b>중첩 질의 결과가 비었는지<\/b> 검사하는 불리언 함수. 보통 WHERE에서 씀.<\/p>\n<ul><li><b>EXISTS (Q)<\/b>: Q의 결과에 투플이 <b>하나라도 있으면<\/b> TRUE<\/li><li><b>NOT EXISTS (Q)<\/b>: Q의 결과가 <b>비어 있으면<\/b> TRUE<\/li><\/ul>\n<p><b>질의 6<\/b>: 부양가족이 <b>없는<\/b> 사원<\/p>\n<pre class=\"code\">SELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  NOT EXISTS ( SELECT * FROM DEPENDENT WHERE Ssn = Essn );<\/pre>\n<p>→ Zelaya, Narayan, English, Jabbar, Borg (5명)<\/p>\n<p><b>부양가족이 하나 이상 있는 관리자<\/b>: 두 조건을 AND<\/p>\n<pre class=\"code\">SELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  EXISTS ( SELECT * FROM DEPENDENT  WHERE Ssn = Essn )\n  AND  EXISTS ( SELECT * FROM DEPARTMENT WHERE Ssn = Mgr_ssn );<\/pre>\n<p>→ Franklin Wong, Jennifer Wallace<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>NOT EXISTS 읽는 법: 안쪽 질의 결과가 비어 있지 않으면 그 사원은 부양가족이 있다는 뜻. 결과가 비었을 때만 NOT EXISTS가 참이 되어 그 사원이 나온다. '부양가족 있는 관리자'는 조건을 '관리자인 사원'과 '부양가족이 하나 이상인 사원' 두 부분으로 쪼개서 EXISTS 두 개를 AND로.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p7.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p7.jpg\" alt=\"05 p.7 · EXISTS (질의 16)와 NOT EXISTS (질의 6, 부양가족 없는 사원)\" loading=\"lazy\"><\/button><figcaption>05 p.7 · EXISTS (질의 16)와 NOT EXISTS (질의 6, 부양가족 없는 사원)<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p8.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p8.jpg\" alt=\"05 p.8 · EXISTS 두 개: 부양가족 있는 관리자 → Wong, Wallace\" loading=\"lazy\"><\/button><figcaption>05 p.8 · EXISTS 두 개: 부양가족 있는 관리자 → Wong, Wallace<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-division-sql\"><h3>\"모든 ~에 대해\" (나눗셈) 질의<\/h3><p><b>연습 1<\/b>: 5번 부서가 통제하는 <b>모든<\/b> 프로젝트에서 일하는 사원의 이름<\/p>\n<pre class=\"code\">SELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  NOT EXISTS ( ( SELECT Pnumber FROM PROJECT WHERE Dnum = 5 )\n                    EXCEPT\n                    ( SELECT Pno FROM WORKS_ON WHERE Ssn = Essn ) );<\/pre>\n<p>읽는 법: (5번 부서 프로젝트 전체) − (이 사원이 일하는 프로젝트) = <b>빠진 프로젝트<\/b>. 빠진 게 <b>없으면<\/b>(NOT EXISTS) 전부 하는 것.<\/p>\n<ul><li>예: 5번 부서 프로젝트 = {1, 2, 3}. A는 {1, 2, 4} → 차집합 {3} ≠ ∅ → 탈락. B는 {1, 2, 3, 4} → 차집합 ∅ → 선택<\/li><li>COMPANY 상태에서 5번 부서 프로젝트 = {1, 2, 3}인데 세 개 다 하는 사원이 없어서 결과는 <b>0행<\/b><\/li><\/ul>\n<p>EXCEPT 없이 NOT EXISTS 두 번으로도 쓸 수 있다 (\"이 사원이 안 하는 5번 부서 프로젝트가 존재하지 않는다\"):<\/p>\n<pre class=\"code\">SELECT E.Fname, E.Lname\nFROM   EMPLOYEE AS E\nWHERE  NOT EXISTS ( SELECT * FROM PROJECT AS P\n                    WHERE  P.Dnum = 5\n                      AND  NOT EXISTS ( SELECT * FROM WORKS_ON AS W\n                                        WHERE W.Essn = E.Ssn AND W.Pno = P.Pnumber ) );<\/pre>\n<div class=\"callout trap\">함정: \"어떤\" 프로젝트에서 일하는 사원(EXISTS, IN)과 \"모든\" 프로젝트에서 일하는 사원(NOT EXISTS + EXCEPT)을 구별해. 문장에 <b>all<\/b>이 나오면 나눗셈 패턴.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>문제를 천천히 읽으라고 강조: 5번 부서가 프로젝트를 여러 개(예: 5~7개) 통제하는데, 그중 '일부'가 아니라 '전부'에서 일하는 사원만 찾아야 한다. 칠판 예: 5번 부서 프로젝트 = {1, 2, 3}, 사원 A = {1, 2, 4}, 사원 B = {1, 2, 3, 4} → {1,2,3} − A = {3} (비어 있지 않음, 탈락), {1,2,3} − B = ∅ (선택). 'NOT EXISTS + EXCEPT'가 한 가지 풀이.<\/div><\/section>", "title_en": "EXISTS / NOT EXISTS, Division Queries", "html_en": "<section class=\"sec\" id=\"s-exists\"><h3>EXISTS and NOT EXISTS<\/h3><p>Boolean functions that check <b>whether the result of a nested query is empty<\/b>. Usually used in WHERE.<\/p>\n<ul><li><b>EXISTS (Q)<\/b>: TRUE if there is <b>at least one tuple<\/b> in the result of Q<\/li><li><b>NOT EXISTS (Q)<\/b>: TRUE if the result of Q is <b>empty<\/b><\/li><\/ul>\n<p><b>Query 6<\/b>: employees who have <b>no<\/b> dependents<\/p>\n<pre class=\"code\">SELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  NOT EXISTS ( SELECT * FROM DEPENDENT WHERE Ssn = Essn );<\/pre>\n<p>→ Zelaya, Narayan, English, Jabbar, Borg (5 employees)<\/p>\n<p><b>Managers who have at least one dependent<\/b>: AND the two conditions<\/p>\n<pre class=\"code\">SELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  EXISTS ( SELECT * FROM DEPENDENT  WHERE Ssn = Essn )\n  AND  EXISTS ( SELECT * FROM DEPARTMENT WHERE Ssn = Mgr_ssn );<\/pre>\n<p>→ Franklin Wong, Jennifer Wallace<\/p><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 5-1<\/span><br>How to read NOT EXISTS: if the inner query's result is not empty, that employee has dependents. NOT EXISTS is true only when the result is empty, and then the employee appears. For 'managers who have dependents', split the condition into two parts, 'employees who are managers' and 'employees with at least one dependent', and combine two EXISTS with AND.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p7.jpg\" aria-label=\"Enlarge\"><img src=\"img/ADV-p7.jpg\" alt=\"05 p.7 · EXISTS (Query 16) and NOT EXISTS (Query 6, employees with no dependents)\" loading=\"lazy\"><\/button><figcaption>05 p.7 · EXISTS (Query 16) and NOT EXISTS (Query 6, employees with no dependents)<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p8.jpg\" aria-label=\"Enlarge\"><img src=\"img/ADV-p8.jpg\" alt=\"05 p.8 · Two EXISTS: managers with dependents → Wong, Wallace\" loading=\"lazy\"><\/button><figcaption>05 p.8 · Two EXISTS: managers with dependents → Wong, Wallace<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-division-sql\"><h3>\"For all …\" (division) queries<\/h3><p><b>Exercise 1<\/b>: names of employees who work on <b>all<\/b> the projects controlled by department 5<\/p>\n<pre class=\"code\">SELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  NOT EXISTS ( ( SELECT Pnumber FROM PROJECT WHERE Dnum = 5 )\n                    EXCEPT\n                    ( SELECT Pno FROM WORKS_ON WHERE Ssn = Essn ) );<\/pre>\n<p>How to read it: (all dept-5 projects) − (projects this employee works on) = <b>missing projects<\/b>. If <b>nothing<\/b> is missing (NOT EXISTS), the employee works on all of them.<\/p>\n<ul><li>e.g., dept-5 projects = {1, 2, 3}. A works on {1, 2, 4} → difference {3} ≠ ∅ → out. B works on {1, 2, 3, 4} → difference ∅ → selected<\/li><li>On the COMPANY state, dept-5 projects = {1, 2, 3}, but no employee works on all three, so the result is <b>0 rows<\/b><\/li><\/ul>\n<p>It can also be written without EXCEPT, using NOT EXISTS twice (\"there is no dept-5 project that this employee does not work on\"):<\/p>\n<pre class=\"code\">SELECT E.Fname, E.Lname\nFROM   EMPLOYEE AS E\nWHERE  NOT EXISTS ( SELECT * FROM PROJECT AS P\n                    WHERE  P.Dnum = 5\n                      AND  NOT EXISTS ( SELECT * FROM WORKS_ON AS W\n                                        WHERE W.Essn = E.Ssn AND W.Pno = P.Pnumber ) );<\/pre>\n<div class=\"callout trap\">Trap: distinguish employees who work on \"some\" project (EXISTS, IN) from employees who work on \"all\" projects (NOT EXISTS + EXCEPT). If the sentence says <b>all<\/b>, it is the division pattern.<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 5-1<\/span><br>The professor stressed reading the question slowly: department 5 controls several projects (e.g., 5 to 7), and we need employees who work on 'all' of them, not 'some'. Blackboard example: dept-5 projects = {1, 2, 3}, employee A = {1, 2, 4}, employee B = {1, 2, 3, 4} → {1,2,3} − A = {3} (not empty, rejected), {1,2,3} − B = ∅ (selected). 'NOT EXISTS + EXCEPT' is one solution.<\/div><\/section>"}, {"id": "L5-3", "title": "조인 테이블 · NATURAL · INNER/OUTER", "src": "5-1 p.10–14", "secs": [{"id": "joined-table", "title": "조인 테이블", "title_en": "Joined tables"}, {"id": "natural-join-sql", "title": "NATURAL JOIN", "title_en": "NATURAL JOIN"}, {"id": "inner-outer", "title": "INNER JOIN과 OUTER JOIN", "title_en": "INNER JOIN and OUTER JOIN"}], "md": "## 조인 테이블 {#joined-table}\n\n**조인 테이블 (joined table)**: **FROM 절에서** 조인 연산으로 만들어지는 테이블. WHERE에 선택 조건과 조인 조건이 섞이는 걸 피할 수 있다.\n```\nSELECT Fname, Lname, Address\nFROM   (EMPLOYEE JOIN DEPARTMENT ON Dno = Dnumber)\nWHERE  Dname = 'Research';\n```\n- 조인된 테이블 = 첫 테이블(EMPLOYEE)의 모든 속성 + 둘째 테이블(DEPARTMENT)의 모든 속성\n- WHERE에 `Dnumber = Dno`를 쓴 질의 2와 결과가 같다\n\n## NATURAL JOIN {#natural-join-sql}\n\n**같은 이름을 가진 속성 쌍마다 암묵적인 동등 조건**을 만든다 → 조인 조건을 쓰지 않음.\n- 이름이 다르면 먼저 **이름을 바꿔서** 맞춘다\n```\nSELECT Fname, Lname, Address\nFROM   (EMPLOYEE NATURAL JOIN\n        (DEPARTMENT AS DEPT (Dname, Dno, Mssn, Msdate)))\nWHERE  Dname = 'Research';\n```\n- DEPARTMENT의 Dnumber를 Dno로 바꿔서 EMPLOYEE.Dno와 이름을 맞춤\n- 조인 속성은 결과에 **한 번만** 나온다\n\n## INNER JOIN과 OUTER JOIN {#inner-outer}\n\n**내부 조인 (inner join)**: 기본 조인. **다른 릴레이션에 짝이 있는 투플만** 결과에 들어감.\n```\nSELECT E.Lname AS Employee_name, S.Lname AS Supervisor_name\nFROM   EMPLOYEE AS E, EMPLOYEE AS S\nWHERE  E.Super_ssn = S.Ssn;\n```\n→ 7행. Super_ssn이 **NULL인 Borg는 빠진다**.\n\n**외부 조인 (outer join)**: 짝이 없는 투플도 결과에 넣고, 상대 속성은 **NULL로 채움(padding)**.\n```\nSELECT E.Lname AS Employee_name, S.Lname AS Supervisor_name\nFROM   (EMPLOYEE AS E LEFT OUTER JOIN EMPLOYEE AS S ON E.Super_ssn = S.Ssn);\n```\n→ 8행. Borg의 Supervisor_name = NULL.\n\n| 조인 | 결과에 들어가는 투플 |\n|---|---|\n| INNER JOIN | 조인 조건을 만족하는 쌍만 |\n| LEFT OUTER JOIN | **왼쪽 테이블의 모든 투플** (짝 없으면 오른쪽 속성 NULL) |\n| RIGHT OUTER JOIN | **오른쪽 테이블의 모든 투플** |\n| FULL OUTER JOIN | 양쪽 모든 투플 |\n\n> 함정: OUTER JOIN에서 \"짝 없는 것만\" 고르려면 `WHERE B.KEY IS NULL`을 덧붙인다 (교안 p.14 벤다이어그램 아래줄). NULL 비교는 `= NULL`이 아니라 **IS NULL**.", "html": "<section class=\"sec\" id=\"s-joined-table\"><h3>조인 테이블<\/h3><p><b>조인 테이블 (joined table)<\/b>: <b>FROM 절에서<\/b> 조인 연산으로 만들어지는 테이블. WHERE에 선택 조건과 조인 조건이 섞이는 걸 피할 수 있다.<\/p>\n<pre class=\"code\">SELECT Fname, Lname, Address\nFROM   (EMPLOYEE JOIN DEPARTMENT ON Dno = Dnumber)\nWHERE  Dname = &#x27;Research&#x27;;<\/pre>\n<ul><li>조인된 테이블 = 첫 테이블(EMPLOYEE)의 모든 속성 + 둘째 테이블(DEPARTMENT)의 모든 속성<\/li><li>WHERE에 <code>Dnumber = Dno<\/code>를 쓴 질의 2와 결과가 같다<\/li><\/ul><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>Dname = 'Research'는 선택 조건, Dnumber = Dno는 조인 조건. 조인 조건을 FROM 절의 JOIN ... ON으로 명시적으로 쓸 수 있고, 결과는 WHERE에 쓴 것과 같다.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p10.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p10.jpg\" alt=\"05 p.10 · FROM 절의 EMPLOYEE JOIN DEPARTMENT ON Dno = Dnumber\" loading=\"lazy\"><\/button><figcaption>05 p.10 · FROM 절의 EMPLOYEE JOIN DEPARTMENT ON Dno = Dnumber<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-natural-join-sql\"><h3>NATURAL JOIN<\/h3><p><b>같은 이름을 가진 속성 쌍마다 암묵적인 동등 조건<\/b>을 만든다 → 조인 조건을 쓰지 않음.<\/p>\n<ul><li>이름이 다르면 먼저 <b>이름을 바꿔서<\/b> 맞춘다<\/li><\/ul>\n<pre class=\"code\">SELECT Fname, Lname, Address\nFROM   (EMPLOYEE NATURAL JOIN\n        (DEPARTMENT AS DEPT (Dname, Dno, Mssn, Msdate)))\nWHERE  Dname = &#x27;Research&#x27;;<\/pre>\n<ul><li>DEPARTMENT의 Dnumber를 Dno로 바꿔서 EMPLOYEE.Dno와 이름을 맞춤<\/li><li>조인 속성은 결과에 <b>한 번만<\/b> 나온다<\/li><\/ul><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>NATURAL JOIN은 이름이 같은 속성 쌍을 조인 속성으로 가정한다. DEPARTMENT를 DEPT(Dname, Dno, Mssn, Msdate)로 별칭을 주면서 Dnumber를 Dno로 바꿔야 EMPLOYEE.Dno와 이름이 맞아서 자연 조인이 된다.<\/div><\/section>\n<section class=\"sec\" id=\"s-inner-outer\"><h3>INNER JOIN과 OUTER JOIN<\/h3><p><b>내부 조인 (inner join)<\/b>: 기본 조인. <b>다른 릴레이션에 짝이 있는 투플만<\/b> 결과에 들어감.<\/p>\n<pre class=\"code\">SELECT E.Lname AS Employee_name, S.Lname AS Supervisor_name\nFROM   EMPLOYEE AS E, EMPLOYEE AS S\nWHERE  E.Super_ssn = S.Ssn;<\/pre>\n<p>→ 7행. Super_ssn이 <b>NULL인 Borg는 빠진다<\/b>.<\/p>\n<p><b>외부 조인 (outer join)<\/b>: 짝이 없는 투플도 결과에 넣고, 상대 속성은 <b>NULL로 채움(padding)<\/b>.<\/p>\n<pre class=\"code\">SELECT E.Lname AS Employee_name, S.Lname AS Supervisor_name\nFROM   (EMPLOYEE AS E LEFT OUTER JOIN EMPLOYEE AS S ON E.Super_ssn = S.Ssn);<\/pre>\n<p>→ 8행. Borg의 Supervisor_name = NULL.<\/p>\n<div class=\"tblw\"><table><thead><tr><th>조인<\/th><th>결과에 들어가는 투플<\/th><\/tr><\/thead><tbody><tr><td>INNER JOIN<\/td><td>조인 조건을 만족하는 쌍만<\/td><\/tr><tr><td>LEFT OUTER JOIN<\/td><td><b>왼쪽 테이블의 모든 투플<\/b> (짝 없으면 오른쪽 속성 NULL)<\/td><\/tr><tr><td>RIGHT OUTER JOIN<\/td><td><b>오른쪽 테이블의 모든 투플<\/b><\/td><\/tr><tr><td>FULL OUTER JOIN<\/td><td>양쪽 모든 투플<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout trap\">함정: OUTER JOIN에서 \"짝 없는 것만\" 고르려면 <code>WHERE B.KEY IS NULL<\/code>을 덧붙인다 (교안 p.14 벤다이어그램 아래줄). NULL 비교는 <code>= NULL<\/code>이 아니라 <b>IS NULL<\/b>.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>Super_ssn = Ssn 자기 조인에서 James Borg는 Super_ssn이 없어서(NULL) 내부 조인 결과에 안 나온다. 상사가 없는 사원까지 보고 싶으면 LEFT OUTER JOIN. 어떤 조인을 쓸지는 응용 상황에 따라 고른다.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p13.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p13.jpg\" alt=\"05 p.13 · LEFT OUTER JOIN: Borg도 결과에 (상사 NULL)\" loading=\"lazy\"><\/button><figcaption>05 p.13 · LEFT OUTER JOIN: Borg도 결과에 (상사 NULL)<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p14.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p14.jpg\" alt=\"05 p.14 · 내부·외부 조인 벤다이어그램\" loading=\"lazy\"><\/button><figcaption>05 p.14 · 내부·외부 조인 벤다이어그램<\/figcaption><\/figure><\/section>", "title_en": "Joined Tables, NATURAL, INNER/OUTER", "html_en": "<section class=\"sec\" id=\"s-joined-table\"><h3>Joined tables<\/h3><p><b>Joined table<\/b>: a table produced by a join operation <b>in the FROM clause<\/b>. It avoids mixing selection and join conditions in WHERE.<\/p>\n<pre class=\"code\">SELECT Fname, Lname, Address\nFROM   (EMPLOYEE JOIN DEPARTMENT ON Dno = Dnumber)\nWHERE  Dname = &#x27;Research&#x27;;<\/pre>\n<ul><li>The joined table = all attributes of the first table (EMPLOYEE) + all attributes of the second table (DEPARTMENT)<\/li><li>Same result as Query 2, which writes <code>Dnumber = Dno<\/code> in WHERE<\/li><\/ul><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 5-1<\/span><br>Dname = 'Research' is the selection condition and Dnumber = Dno is the join condition. The join condition can be written explicitly as JOIN ... ON in the FROM clause, and the result is the same as writing it in WHERE.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p10.jpg\" aria-label=\"Enlarge\"><img src=\"img/ADV-p10.jpg\" alt=\"05 p.10 · EMPLOYEE JOIN DEPARTMENT ON Dno = Dnumber in the FROM clause\" loading=\"lazy\"><\/button><figcaption>05 p.10 · EMPLOYEE JOIN DEPARTMENT ON Dno = Dnumber in the FROM clause<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-natural-join-sql\"><h3>NATURAL JOIN<\/h3><p>Creates an <b>implicit equality condition for each pair of attributes with the same name<\/b> → no join condition is written.<\/p>\n<ul><li>If the names differ, <b>rename<\/b> the attributes first to make them match<\/li><\/ul>\n<pre class=\"code\">SELECT Fname, Lname, Address\nFROM   (EMPLOYEE NATURAL JOIN\n        (DEPARTMENT AS DEPT (Dname, Dno, Mssn, Msdate)))\nWHERE  Dname = &#x27;Research&#x27;;<\/pre>\n<ul><li>DEPARTMENT's Dnumber is renamed to Dno so that it matches EMPLOYEE.Dno<\/li><li>The join attribute appears <b>only once<\/b> in the result<\/li><\/ul><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 5-1<\/span><br>NATURAL JOIN assumes each pair of attributes with the same name is a join attribute. DEPARTMENT must be aliased as DEPT(Dname, Dno, Mssn, Msdate), renaming Dnumber to Dno, so that the name matches EMPLOYEE.Dno and the natural join works.<\/div><\/section>\n<section class=\"sec\" id=\"s-inner-outer\"><h3>INNER JOIN and OUTER JOIN<\/h3><p><b>Inner join<\/b>: the default join. <b>Only tuples that have a match in the other relation<\/b> are included in the result.<\/p>\n<pre class=\"code\">SELECT E.Lname AS Employee_name, S.Lname AS Supervisor_name\nFROM   EMPLOYEE AS E, EMPLOYEE AS S\nWHERE  E.Super_ssn = S.Ssn;<\/pre>\n<p>→ 7 rows. <b>Borg, whose Super_ssn is NULL, is left out<\/b>.<\/p>\n<p><b>Outer join<\/b>: tuples without a match are also included, and the other relation's attributes are <b>padded with NULL<\/b>.<\/p>\n<pre class=\"code\">SELECT E.Lname AS Employee_name, S.Lname AS Supervisor_name\nFROM   (EMPLOYEE AS E LEFT OUTER JOIN EMPLOYEE AS S ON E.Super_ssn = S.Ssn);<\/pre>\n<p>→ 8 rows. Borg's Supervisor_name = NULL.<\/p>\n<div class=\"tblw\"><table><thead><tr><th>Join<\/th><th>Tuples in the result<\/th><\/tr><\/thead><tbody><tr><td>INNER JOIN<\/td><td>Only pairs that satisfy the join condition<\/td><\/tr><tr><td>LEFT OUTER JOIN<\/td><td><b>Every tuple of the left table<\/b> (right attributes NULL if no match)<\/td><\/tr><tr><td>RIGHT OUTER JOIN<\/td><td><b>Every tuple of the right table<\/b><\/td><\/tr><tr><td>FULL OUTER JOIN<\/td><td>Every tuple of both tables<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout trap\">Trap: to select \"only the unmatched ones\" with an OUTER JOIN, add <code>WHERE B.KEY IS NULL<\/code> (bottom row of the Venn diagrams on slide p.14). Compare with NULL using <b>IS NULL<\/b>, not <code>= NULL<\/code>.<\/div><div class=\"callout prof\"><b>Lecture note<\/b> <span class=\"src\">Week 5-1<\/span><br>In the Super_ssn = Ssn self-join, James Borg has no Super_ssn (NULL), so he does not appear in the inner join result. To also see employees without a supervisor, use LEFT OUTER JOIN. Which join to use depends on the application.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p13.jpg\" aria-label=\"Enlarge\"><img src=\"img/ADV-p13.jpg\" alt=\"05 p.13 · LEFT OUTER JOIN: Borg is in the result too (supervisor NULL)\" loading=\"lazy\"><\/button><figcaption>05 p.13 · LEFT OUTER JOIN: Borg is in the result too (supervisor NULL)<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p14.jpg\" aria-label=\"Enlarge\"><img src=\"img/ADV-p14.jpg\" alt=\"05 p.14 · Venn diagrams of inner and outer joins\" loading=\"lazy\"><\/button><figcaption>05 p.14 · Venn diagrams of inner and outer joins<\/figcaption><\/figure><\/section>"}, {"id": "L5-4", "title": "집계 함수 · GROUP BY · HAVING", "src": "5-1 p.15–22, 48", "secs": [{"id": "aggregate", "title": "집계 함수", "title_en": "Aggregate functions"}, {"id": "count-null", "title": "COUNT와 NULL · 중첩 질의에서의 집계", "title_en": "COUNT and NULL, aggregates in nested queries"}, {"id": "group-by", "title": "GROUP BY", "title_en": "GROUP BY"}, {"id": "having", "title": "HAVING", "title_en": "HAVING"}], "md": "## 집계 함수 {#aggregate}\n\n**집계 함수 (aggregate function)**: 여러 투플의 정보를 **투플 하나짜리 요약**으로. 주로 SELECT나 HAVING에서 씀.\n- **COUNT**: 투플 수 또는 값의 수\n- **SUM, MAX, MIN, AVG**: 숫자 값의 (다중)집합에 적용\n\n**질의 19**: 전체 사원의 급여 합·최대·최소·평균\n```\nSELECT SUM(Salary), MAX(Salary), MIN(Salary), AVG(Salary)\nFROM   EMPLOYEE;\n```\n→ 281000, 55000, 25000, 35125\n\n**질의 20**: Research 부서만\n```\nSELECT SUM(Salary), MAX(Salary), MIN(Salary), AVG(Salary)\nFROM   (EMPLOYEE JOIN DEPARTMENT ON Dno = Dnumber)\nWHERE  Dname = 'Research';\n```\n→ 133000, 40000, 25000, 33250\n\n## COUNT와 NULL · 중첩 질의에서의 집계 {#count-null}\n\n- **COUNT(*)**: 결과의 **행(투플) 수**. 질의 21 `SELECT COUNT(*) FROM EMPLOYEE;` → 8, 질의 22 Research만 → 4\n- **COUNT(속성)**: 그 속성의 **값** 수. **NULL은 세지 않는다**. 예) `COUNT(Super_ssn)` → 7\n- **COUNT(DISTINCT Salary)**: 서로 다른 급여 값의 수 → 6 (질의 23)\n- 집계 결과는 값 하나라서 **조건의 일부**로 쓸 수 있다:\n```\nSELECT Lname, Fname\nFROM   EMPLOYEE\nWHERE  ( SELECT COUNT(*) FROM DEPENDENT WHERE Ssn = Essn ) >= 2;\n```\n→ 부양가족이 2명 이상: Smith(3명), Wong(3명)\n\n## GROUP BY {#group-by}\n\n**그룹화**: 릴레이션의 투플을 **겹치지 않는 부분집합(그룹)** 으로 나눠서 그룹마다 집계 함수를 적용.\n- **그룹화 속성 (grouping attribute)**: 그룹을 나누는 기준. 같은 그룹 = 그룹화 속성 값이 같은 투플들\n- **GROUP BY** 절에 지정. 그룹화 속성은 SELECT에도 나와야 결과에서 어느 그룹인지 알 수 있다\n\n**질의 24**: 부서별 부서 번호, 사원 수, 평균 급여\n```\nSELECT   Dno, COUNT(*), AVG(Salary)\nFROM     EMPLOYEE\nGROUP BY Dno;\n```\n→ (5, 4, 33250), (4, 3, 31000), (1, 1, 55000)\n\n**질의 25**: 프로젝트별 번호, 이름, 일하는 사원 수\n```\nSELECT   Pnumber, Pname, COUNT(*)\nFROM     PROJECT, WORKS_ON\nWHERE    Pnumber = Pno\nGROUP BY Pnumber, Pname;\n```\n→ ProductX 2, ProductY 3, ProductZ 2, Computerization 3, Reorganization 3, Newbenefits 3\n\n> 함정: GROUP BY를 쓰면 SELECT에는 **그룹화 속성과 집계 함수만** 올 수 있다. 그룹마다 값이 하나로 정해지지 않는 속성(예: Dno로 묶었는데 Lname)을 SELECT에 쓰면 안 된다.\n\n## HAVING {#having}\n\n**HAVING**: 그룹의 **요약 정보에 대한 조건**. GROUP BY와 함께 씀. 조건을 만족하는 **그룹만** 결과에.\n\n**질의 26**: 사원이 **두 명 넘게** 일하는 프로젝트마다 번호, 이름, 사원 수\n```\nSELECT   Pnumber, Pname, COUNT(*)\nFROM     PROJECT, WORKS_ON\nWHERE    Pnumber = Pno\nGROUP BY Pnumber, Pname\nHAVING   COUNT(*) > 2;\n```\n→ ProductY, Computerization, Reorganization, Newbenefits (각 3명)\n\n**연습 2**: 평균 급여가 $30,000 넘는 부서마다 부서 이름과 사원 수\n```\nSELECT   D.Dname, COUNT(*)\nFROM     EMPLOYEE AS E, DEPARTMENT AS D\nWHERE    E.Dno = D.Dnumber\nGROUP BY D.Dname\nHAVING   AVG(E.Salary) > 30000;\n```\n→ Research 4, Administration 3, Headquarters 1 (교안 풀이는 GROUP BY E.Dno로 묶음. 표준 SQL에서는 SELECT의 D.Dname도 GROUP BY에 있어야 안전)\n\n> 시험 포인트: **WHERE = 투플 조건 (그룹 만들기 전)**, **HAVING = 그룹 조건 (집계 후)**. \"평균이 3만 넘는\"처럼 집계에 대한 조건은 WHERE에 못 쓴다.\n\n**실행 순서**: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY", "html": "<section class=\"sec\" id=\"s-aggregate\"><h3>집계 함수<\/h3><p><b>집계 함수 (aggregate function)<\/b>: 여러 투플의 정보를 <b>투플 하나짜리 요약<\/b>으로. 주로 SELECT나 HAVING에서 씀.<\/p>\n<ul><li><b>COUNT<\/b>: 투플 수 또는 값의 수<\/li><li><b>SUM, MAX, MIN, AVG<\/b>: 숫자 값의 (다중)집합에 적용<\/li><\/ul>\n<p><b>질의 19<\/b>: 전체 사원의 급여 합·최대·최소·평균<\/p>\n<pre class=\"code\">SELECT SUM(Salary), MAX(Salary), MIN(Salary), AVG(Salary)\nFROM   EMPLOYEE;<\/pre>\n<p>→ 281000, 55000, 25000, 35125<\/p>\n<p><b>질의 20<\/b>: Research 부서만<\/p>\n<pre class=\"code\">SELECT SUM(Salary), MAX(Salary), MIN(Salary), AVG(Salary)\nFROM   (EMPLOYEE JOIN DEPARTMENT ON Dno = Dnumber)\nWHERE  Dname = &#x27;Research&#x27;;<\/pre>\n<p>→ 133000, 40000, 25000, 33250<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>집계 함수가 없다면 급여를 전부 읽어 와서 Python이나 C로 for/while 루프를 돌려 합·최대·평균을 직접 계산해야 한다. 집계 함수로 한 줄에 해결. 결과: 최대 55,000, 최소 25,000, 평균 = 합 ÷ 8.<\/div><\/section>\n<section class=\"sec\" id=\"s-count-null\"><h3>COUNT와 NULL · 중첩 질의에서의 집계<\/h3><ul><li><b>COUNT(*)<\/b>: 결과의 <b>행(투플) 수<\/b>. 질의 21 <code>SELECT COUNT(*) FROM EMPLOYEE;<\/code> → 8, 질의 22 Research만 → 4<\/li><li><b>COUNT(속성)<\/b>: 그 속성의 <b>값<\/b> 수. <b>NULL은 세지 않는다<\/b>. 예) <code>COUNT(Super_ssn)<\/code> → 7<\/li><li><b>COUNT(DISTINCT Salary)<\/b>: 서로 다른 급여 값의 수 → 6 (질의 23)<\/li><li>집계 결과는 값 하나라서 <b>조건의 일부<\/b>로 쓸 수 있다:<\/li><\/ul>\n<pre class=\"code\">SELECT Lname, Fname\nFROM   EMPLOYEE\nWHERE  ( SELECT COUNT(*) FROM DEPENDENT WHERE Ssn = Essn ) &gt;= 2;<\/pre>\n<p>→ 부양가족이 2명 이상: Smith(3명), Wong(3명)<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>COUNT(*)를 안 쓰면 투플 8개가 그대로 나오지만, COUNT(*)를 쓰면 숫자 하나(8)만 나온다. Research는 4. 서로 다른 급여 값은 25,000이 겹쳐서 6. 집계 결과는 값 하나라서 '부양가족 2명 이상'처럼 조건의 일부로 쓸 수 있다: 안쪽 질의가 사원마다 부양가족 수 하나를 돌려주고 그걸 2와 비교.<\/div><\/section>\n<section class=\"sec\" id=\"s-group-by\"><h3>GROUP BY<\/h3><p><b>그룹화<\/b>: 릴레이션의 투플을 <b>겹치지 않는 부분집합(그룹)<\/b> 으로 나눠서 그룹마다 집계 함수를 적용.<\/p>\n<ul><li><b>그룹화 속성 (grouping attribute)<\/b>: 그룹을 나누는 기준. 같은 그룹 = 그룹화 속성 값이 같은 투플들<\/li><li><b>GROUP BY<\/b> 절에 지정. 그룹화 속성은 SELECT에도 나와야 결과에서 어느 그룹인지 알 수 있다<\/li><\/ul>\n<p><b>질의 24<\/b>: 부서별 부서 번호, 사원 수, 평균 급여<\/p>\n<pre class=\"code\">SELECT   Dno, COUNT(*), AVG(Salary)\nFROM     EMPLOYEE\nGROUP BY Dno;<\/pre>\n<p>→ (5, 4, 33250), (4, 3, 31000), (1, 1, 55000)<\/p>\n<p><b>질의 25<\/b>: 프로젝트별 번호, 이름, 일하는 사원 수<\/p>\n<pre class=\"code\">SELECT   Pnumber, Pname, COUNT(*)\nFROM     PROJECT, WORKS_ON\nWHERE    Pnumber = Pno\nGROUP BY Pnumber, Pname;<\/pre>\n<p>→ ProductX 2, ProductY 3, ProductZ 2, Computerization 3, Reorganization 3, Newbenefits 3<\/p>\n<div class=\"callout trap\">함정: GROUP BY를 쓰면 SELECT에는 <b>그룹화 속성과 집계 함수만<\/b> 올 수 있다. 그룹마다 값이 하나로 정해지지 않는 속성(예: Dno로 묶었는데 Lname)을 SELECT에 쓰면 안 된다.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>그룹화는 그룹마다 따로 요약할 때 쓴다. Dno로 묶으면 5번 부서, 4번 부서, 1번 부서 세 그룹이 생기고 그룹마다 COUNT, AVG를 계산.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p19.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p19.jpg\" alt=\"05 p.19 · 질의 24: Dno로 그룹화\" loading=\"lazy\"><\/button><figcaption>05 p.19 · 질의 24: Dno로 그룹화<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p20.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p20.jpg\" alt=\"05 p.20 · 질의 25: 프로젝트별 사원 수\" loading=\"lazy\"><\/button><figcaption>05 p.20 · 질의 25: 프로젝트별 사원 수<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-having\"><h3>HAVING<\/h3><p><b>HAVING<\/b>: 그룹의 <b>요약 정보에 대한 조건<\/b>. GROUP BY와 함께 씀. 조건을 만족하는 <b>그룹만<\/b> 결과에.<\/p>\n<p><b>질의 26<\/b>: 사원이 <b>두 명 넘게<\/b> 일하는 프로젝트마다 번호, 이름, 사원 수<\/p>\n<pre class=\"code\">SELECT   Pnumber, Pname, COUNT(*)\nFROM     PROJECT, WORKS_ON\nWHERE    Pnumber = Pno\nGROUP BY Pnumber, Pname\nHAVING   COUNT(*) &gt; 2;<\/pre>\n<p>→ ProductY, Computerization, Reorganization, Newbenefits (각 3명)<\/p>\n<p><b>연습 2<\/b>: 평균 급여가 $30,000 넘는 부서마다 부서 이름과 사원 수<\/p>\n<pre class=\"code\">SELECT   D.Dname, COUNT(*)\nFROM     EMPLOYEE AS E, DEPARTMENT AS D\nWHERE    E.Dno = D.Dnumber\nGROUP BY D.Dname\nHAVING   AVG(E.Salary) &gt; 30000;<\/pre>\n<p>→ Research 4, Administration 3, Headquarters 1 (교안 풀이는 GROUP BY E.Dno로 묶음. 표준 SQL에서는 SELECT의 D.Dname도 GROUP BY에 있어야 안전)<\/p>\n<div class=\"callout exam\">시험 포인트: <b>WHERE = 투플 조건 (그룹 만들기 전)<\/b>, <b>HAVING = 그룹 조건 (집계 후)<\/b>. \"평균이 3만 넘는\"처럼 집계에 대한 조건은 WHERE에 못 쓴다.<\/div>\n<p><b>실행 순서<\/b>: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>GROUP BY는 그룹별 요약, HAVING은 조건을 만족하는 그룹만
