>.<\/p>\n<p><b>외래 키 방식<\/b><\/p>\n<ol><li>참여 개체 타입 S, T 확인<\/li><li>한쪽(S)을 골라 <b>상대(T)의 PK를 FK로<\/b> 넣는다. <b>전체 참여 쪽을 S로<\/b> 고르는 게 낫다<\/li><li>관계의 단순 속성도 S에 넣는다<\/li><\/ol>\n<p>예) MANAGES: DEPARTMENT(전체 참여)를 S로 → DEPARTMENT(Dname, <b>Dnumber<\/b>, Mgr_ssn, Mgr_start_date), Mgr_ssn → EMPLOYEE.<\/p>\n<p><b>왜 전체 참여 쪽?<\/b> 반대로 EMPLOYEE(부분 참여)를 S로 하면 EMPLOYEE에 D_managed, Mgr_start_date가 들어가는데, 부서를 관리하지 않는 대부분의 사원은 이 값이 <b>NULL<\/b>이 된다. 전체 참여 쪽에 넣으면 NULL이 생기지 않는다.<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p38.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p38.jpg\" alt=\"03 p.38 · 1:1 MANAGES: 전체 참여 쪽 DEPARTMENT에 Mgr_ssn, Mgr_start_date\" loading=\"lazy\"><\/button><figcaption>03 p.38 · 1:1 MANAGES: 전체 참여 쪽 DEPARTMENT에 Mgr_ssn, Mgr_start_date<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p39.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p39.jpg\" alt=\"03 p.39 · 부분 참여 쪽 EMPLOYEE를 고르면 NULL이 많아짐\" loading=\"lazy\"><\/button><figcaption>03 p.39 · 부분 참여 쪽 EMPLOYEE를 고르면 NULL이 많아짐<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-map-1n\"><h3>1:N 관계 매핑<\/h3><p>방법 2가지: <b>외래 키 방식<\/b> (릴레이션 수가 줄어서 선호), 교차 참조 방식.<\/p>\n<p><b>외래 키 방식<\/b><\/p>\n<ol><li><b>N쪽<\/b> 개체 타입을 나타내는 릴레이션 S 확인<\/li><li>S에 상대(1쪽) 릴레이션 T의 <b>PK를 FK로<\/b> 넣는다<\/li><li>관계의 단순 속성도 S에 넣는다<\/li><\/ol>\n<p>이유: N쪽 개체 인스턴스 하나는 1쪽 개체 <b>최대 하나<\/b>와 연결 → FK 값 하나로 표현 가능.<\/p>\n<ul><li>WORKS_FOR → EMPLOYEE에 <b>Dno<\/b> (→ DEPARTMENT)<\/li><li>SUPERVISION → EMPLOYEE에 <b>Super_ssn<\/b> (→ EMPLOYEE, 자기 참조)<\/li><li>CONTROLS → PROJECT에 <b>Dnum<\/b> (→ DEPARTMENT)<\/li><\/ul>\n<div class=\"callout trap\">함정: 1쪽에 FK를 넣으면 다중값이 돼서 원자성을 어긴다. FK는 <b>항상 N쪽<\/b>.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p41.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p41.jpg\" alt=\"03 p.41 · 1:N WORKS_FOR: N쪽 EMPLOYEE에 Dno\" loading=\"lazy\"><\/button><figcaption>03 p.41 · 1:N WORKS_FOR: N쪽 EMPLOYEE에 Dno<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p42.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p42.jpg\" alt=\"03 p.42 · SUPERVISION → Super_ssn, CONTROLS → Dnum\" loading=\"lazy\"><\/button><figcaption>03 p.42 · SUPERVISION → Super_ssn, CONTROLS → Dnum<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-map-mn\"><h3>M:N 관계 매핑<\/h3><p>방법 <b>하나뿐<\/b>: <b>교차 참조 (관계 릴레이션) 방식<\/b>. M:N은 FK 하나로 표현할 수 없다.<\/p>\n<ol><li>관계 타입 R을 나타내는 <b>별도 릴레이션 S<\/b> 생성<\/li><li>참여 개체 릴레이션들의 <b>PK를 FK로<\/b> S에 넣는다<\/li><li><b>FK들의 조합을 PK<\/b>로<\/li><li>M:N 관계의 단순 속성도 S에 넣는다<\/li><\/ol>\n<p>예) WORKS_ON(<b>Essn<\/b>, <b>Pno<\/b>, Hours), Essn → EMPLOYEE, Pno → PROJECT. 관계 릴레이션 = lookup table.<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p44.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p44.jpg\" alt=\"03 p.44 · M:N WORKS_ON → 관계 릴레이션 WORKS_ON(Essn, Pno, Hours)\" loading=\"lazy\"><\/button><figcaption>03 p.44 · M:N WORKS_ON → 관계 릴레이션 WORKS_ON(Essn, Pno, Hours)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-map-nary\"><h3>n진 관계 매핑<\/h3><p><b>교차 참조 방식<\/b> (M:N과 같은 절차)<\/p>\n<ol><li>별도 릴레이션 S 생성<\/li><li>참여하는 n개 개체 릴레이션의 PK를 FK로 넣음<\/li><li>FK 전부의 조합을 PK로 (보통. 어느 참여에 max가 1이면 그 FK는 PK에서 빠질 수 있다)<\/li><li>관계의 단순 속성 포함<\/li><\/ol>\n<p>예) SUPPLY(<b>Sname<\/b>, <b>Proj_name<\/b>, <b>Part_no<\/b>, Quantity) — SUPPLIER, PROJECT, PART 참조.<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p45.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p45.jpg\" alt=\"03 p.45 · 3진 SUPPLY → SUPPLY(Sname, Proj_name, Part_no, Quantity)\" loading=\"lazy\"><\/button><figcaption>03 p.45 · 3진 SUPPLY → SUPPLY(Sname, Proj_name, Part_no, Quantity)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-map-summary\"><h3>ER ↔ 관계 모델 대응<\/h3><div class=\"tblw\"><table><thead><tr><th>ER 모델<\/th><th>관계 모델<\/th><\/tr><\/thead><tbody><tr><td>개체 타입<\/td><td>개체 릴레이션<\/td><\/tr><tr><td>1:1 또는 1:N 관계 타입<\/td><td>외래 키 (또는 관계 릴레이션)<\/td><\/tr><tr><td>M:N 관계 타입<\/td><td>관계 릴레이션 + FK <b>2개<\/b><\/td><\/tr><tr><td>n진 관계 타입<\/td><td>관계 릴레이션 + FK <b>n개<\/b><\/td><\/tr><tr><td>단순 속성<\/td><td>속성<\/td><\/tr><tr><td>복합 속성<\/td><td>단순 구성 속성들의 집합<\/td><\/tr><tr><td>다중값 속성<\/td><td>릴레이션 + 외래 키<\/td><\/tr><tr><td>값 집합 (value set)<\/td><td>도메인<\/td><\/tr><tr><td>키 속성<\/td><td>기본 키 (또는 보조 키)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>교안 연습 3 (UNIVERSITY: COLLEGE, INSTRUCTOR, DEPT, STUDENT, COURSE, SECTION) 풀이 순서:<\/p>\n<ol><li>정규 개체 → COLLEGE(CName, COffice, CPhone), INSTRUCTOR(Id, Rank, IName, IOffice, IPhone), DEPT(DName, DCode, DOffice, DPhone), COURSE(CCode, Credits, CoName, Level, CDesc), SECTION(SecId, SecNo, Sem, Year, Bldg, RoomNo, DaysTime), STUDENT(Sid, DOB, FName, MName, LName, Addr, Phone, Major)<\/li><li>1:1 → DEAN: COLLEGE에 DeanId (COLLEGE가 (1,1) 전체 참여), CHAIR: DEPT에 ChairId, CStartDate<\/li><li>1:N → INSTRUCTOR.Employed(EMPLOYS), DEPT.Admined(ADMINS), COURSE.Offered(OFFERS), SECTION.Taught(TEACHES), SECTION.Belongs(SECS), STUDENT.Dept(HAS)<\/li><li>M:N → TAKES(<b>Sid<\/b>, <b>SecId<\/b>, Grade)<\/li><\/ol><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p49.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p49.jpg\" alt=\"03 p.49 · ER 모델과 관계 모델의 대응표\" loading=\"lazy\"><\/button><figcaption>03 p.49 · ER 모델과 관계 모델의 대응표<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RDB-p46.jpg\" aria-label=\"크게 보기\"><img src=\"img/RDB-p46.jpg\" alt=\"03 p.46 · 연습 3: UNIVERSITY ER 스키마\" loading=\"lazy\"><\/button><figcaption>03 p.46 · 연습 3: UNIVERSITY ER 스키마<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/EX-p16.jpg\" aria-label=\"크게 보기\"><img src=\"img/EX-p16.jpg\" alt=\"db-exercises p.57 · 연습 3 매핑 결과 (M:N TAKES까지)\" loading=\"lazy\"><\/button><figcaption>db-exercises p.57 · 연습 3 매핑 결과 (M:N TAKES까지)<\/figcaption><\/figure><\/section>"}]}, {"id": "U4", "title": "Basic SQL (DDL · DML · SELECT)", "src": "4-1_SQL.pdf + 3-2_setup-for-sql.pdf + SQL-week6-lab.pdf", "intro": "CREATE TABLE의 제약조건 문법, 참조 트리거 동작(ON DELETE/UPDATE), INSERT·DELETE·UPDATE가 무엇을 어기는지, 그리고 SELECT-FROM-WHERE. SQL은 직접 써봐야 늘어. 풀이 문제는 교재 COMPANY 상태(3-1 p.12)에서 실제로 돌려본 결과를 정답에 붙여놨어.", "lessons": [{"id": "L4-1", "title": "SQL 소개 · CREATE SCHEMA/TABLE · 제약조건", "src": "4-1 p.3–10", "secs": [{"id": "sql-intro", "title": "SQL과 NL2SQL"}, {"id": "create-table", "title": "CREATE SCHEMA / CREATE TABLE"}, {"id": "attr-constraints", "title": "속성 제약: NOT NULL, DEFAULT"}, {"id": "key-clauses", "title": "키 제약: PRIMARY KEY, UNIQUE, FOREIGN KEY"}], "md": "## SQL과 NL2SQL {#sql-intro}\n\n- **SQL (Structured Query Language)**: 특수 목적 **선언적(declarative)** 언어. IBM의 첫 DBMS용으로 설계, 원래 이름 **SEQUEL** (Structured English Query Language). 'S-Q-L' 또는 'SEQUEL'로 읽음\n- **DDL (Data Definition Language)**: DB와 **테이블**에 대한 명령. CREATE / ALTER / DROP (schema, table)\n- **DML (Data Manipulation Language)**: 테이블 안 **투플**에 대한 명령. 검색 SELECT, 수정 INSERT / DELETE / UPDATE\n- **NL2SQL**: 자연어 질의를 SQL로 바꾸는 기술. 어려움 = 자연어의 모호성, 스키마 이해·연결(schema linking), 처음 보는 DB로의 일반화, 복잡한 질의 생성. LLM 기반 방법도 아직 완벽과 거리가 멀다 → **SQL을 제대로 이해하는 게 중요**\n\n## CREATE SCHEMA / CREATE TABLE {#create-table}\n\n**SQL 스키마**: 테이블, 타입, 제약조건, 뷰, 도메인 등 스키마를 기술하는 요소들. 스키마 이름으로 식별.\n\n```\nCREATE SCHEMA COMPANY AUTHORIZATION 'Jsmith';\n```\n- **권한 식별자 (authorization identifier)**: 스키마를 소유한 사용자\n\n**CREATE TABLE**: 이름, 속성, 초기 제약조건을 지정해 새 릴레이션 생성.\n- 테이블 이름에 스키마 이름을 붙일 수 있음: `CREATE TABLE COMPANY.EMPLOYEE`\n- 속성 = <속성 이름, 데이터 타입> 쌍의 리스트\n- 초기 제약조건 = 속성 제약, 무결성 제약\n\n```\nCREATE TABLE EMPLOYEE\n( Fname      VARCHAR(15)    NOT NULL,\n  Minit      CHAR,\n  Lname      VARCHAR(15)    NOT NULL,\n  Ssn        CHAR(9)        NOT NULL,\n  Bdate      DATE,\n  Address    VARCHAR(30),\n  Sex        CHAR,\n  Salary     DECIMAL(10,2),\n  Super_ssn  CHAR(9),\n  Dno        INT            NOT NULL,\n  PRIMARY KEY (Ssn) );\n```\n\n## 속성 제약: NOT NULL, DEFAULT {#attr-constraints}\n\n- **NOT NULL**: 그 속성 값은 NULL이 될 수 없다. **PK 속성에는 항상 암묵적으로** 적용 (= 개체 무결성)\n- **DEFAULT <값>**: 새 투플에 그 속성 값을 명시하지 않으면 기본값이 들어감\n  - 예) 새 사원의 기본 부서: `Dno INT NOT NULL DEFAULT 1`, DEPARTMENT의 `Mgr_ssn CHAR(9) NOT NULL DEFAULT '888665555'`\n\n## 키 제약: PRIMARY KEY, UNIQUE, FOREIGN KEY {#key-clauses}\n\n```\nCREATE TABLE DEPARTMENT\n( Dname           VARCHAR(15)  NOT NULL,\n  Dnumber         INT          NOT NULL,\n  Mgr_ssn         CHAR(9)      NOT NULL,\n  Mgr_start_date  DATE,\n  PRIMARY KEY (Dnumber),\n  UNIQUE (Dname),\n  FOREIGN KEY (Mgr_ssn) REFERENCES EMPLOYEE(Ssn) );\nCREATE TABLE DEPT_LOCATIONS\n( Dnumber    INT          NOT NULL,\n  Dlocation  VARCHAR(15)  NOT NULL,\n  PRIMARY KEY (Dnumber, Dlocation),\n  FOREIGN KEY (Dnumber) REFERENCES DEPARTMENT(Dnumber) );\n```\n- **PRIMARY KEY**: PK를 이루는 속성(들). 복합이면 괄호 안에 여러 개\n- **UNIQUE**: 대체(alternate) 키 = **후보 키**\n- **FOREIGN KEY ... REFERENCES 테이블(속성)**: 다른 릴레이션의 PK를 참조하는 FK\n- 제약에 이름 붙이기: `CONSTRAINT DEPTPK PRIMARY KEY (Dnumber)` → 나중에 ALTER로 지울 때 이름이 필요\n\n> 시험 포인트: 참조되는 PK가 갱신·삭제되면 참조 무결성이 깨질 수 있는데, **SQL의 기본 동작은 그 연산을 거부(reject)** 하는 것. 다른 방법 = 참조 트리거 동작 (L4-2).", "html": "<section class=\"sec\" id=\"s-sql-intro\"><h3>SQL과 NL2SQL<\/h3><ul><li><b>SQL (Structured Query Language)<\/b>: 특수 목적 <b>선언적(declarative)<\/b> 언어. IBM의 첫 DBMS용으로 설계, 원래 이름 <b>SEQUEL<\/b> (Structured English Query Language). 'S-Q-L' 또는 'SEQUEL'로 읽음<\/li><li><b>DDL (Data Definition Language)<\/b>: DB와 <b>테이블<\/b>에 대한 명령. CREATE / ALTER / DROP (schema, table)<\/li><li><b>DML (Data Manipulation Language)<\/b>: 테이블 안 <b>투플<\/b>에 대한 명령. 검색 SELECT, 수정 INSERT / DELETE / UPDATE<\/li><li><b>NL2SQL<\/b>: 자연어 질의를 SQL로 바꾸는 기술. 어려움 = 자연어의 모호성, 스키마 이해·연결(schema linking), 처음 보는 DB로의 일반화, 복잡한 질의 생성. LLM 기반 방법도 아직 완벽과 거리가 멀다 → <b>SQL을 제대로 이해하는 게 중요<\/b><\/li><\/ul><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">03주-2 (조교)<\/span><br>실습 환경: VS Code + Python(3.11 정도), pip install pandas sqlglot. pandas는 SQL 실행 결과를 CSV로 저장, sqlglot은 SQL 문법 검사. test.py에서 'change me'를 학번으로 바꾸는 것 말고는 코드를 고치지 말 것. NL_queries.txt를 보고 mysql.py에 SQL을 쓰고 test.py를 돌리면 학번 이름의 폴더가 생기고, 그걸 압축해 e-class에 제출. 압축 파일 이름은 반드시 학번.<\/div><\/section>\n<section class=\"sec\" id=\"s-create-table\"><h3>CREATE SCHEMA / CREATE TABLE<\/h3><p><b>SQL 스키마<\/b>: 테이블, 타입, 제약조건, 뷰, 도메인 등 스키마를 기술하는 요소들. 스키마 이름으로 식별.<\/p>\n<pre class=\"code\">CREATE SCHEMA COMPANY AUTHORIZATION &#x27;Jsmith&#x27;;<\/pre>\n<ul><li><b>권한 식별자 (authorization identifier)<\/b>: 스키마를 소유한 사용자<\/li><\/ul>\n<p><b>CREATE TABLE<\/b>: 이름, 속성, 초기 제약조건을 지정해 새 릴레이션 생성.<\/p>\n<ul><li>테이블 이름에 스키마 이름을 붙일 수 있음: <code>CREATE TABLE COMPANY.EMPLOYEE<\/code><\/li><li>속성 = &lt;속성 이름, 데이터 타입&gt; 쌍의 리스트<\/li><li>초기 제약조건 = 속성 제약, 무결성 제약<\/li><\/ul>\n<pre class=\"code\">CREATE TABLE EMPLOYEE\n( Fname      VARCHAR(15)    NOT NULL,\n  Minit      CHAR,\n  Lname      VARCHAR(15)    NOT NULL,\n  Ssn        CHAR(9)        NOT NULL,\n  Bdate      DATE,\n  Address    VARCHAR(30),\n  Sex        CHAR,\n  Salary     DECIMAL(10,2),\n  Super_ssn  CHAR(9),\n  Dno        INT            NOT NULL,\n  PRIMARY KEY (Ssn) );<\/pre><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p7.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p7.jpg\" alt=\"04 p.7 · CREATE TABLE EMPLOYEE, DEPARTMENT, DEPT_LOCATIONS\" loading=\"lazy\"><\/button><figcaption>04 p.7 · CREATE TABLE EMPLOYEE, DEPARTMENT, DEPT_LOCATIONS<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-attr-constraints\"><h3>속성 제약: NOT NULL, DEFAULT<\/h3><ul><li><b>NOT NULL<\/b>: 그 속성 값은 NULL이 될 수 없다. <b>PK 속성에는 항상 암묵적으로<\/b> 적용 (= 개체 무결성)<\/li><li><b>DEFAULT &lt;값&gt;<\/b>: 새 투플에 그 속성 값을 명시하지 않으면 기본값이 들어감<ul><li>예) 새 사원의 기본 부서: <code>Dno INT NOT NULL DEFAULT 1<\/code>, DEPARTMENT의 <code>Mgr_ssn CHAR(9) NOT NULL DEFAULT '888665555'<\/code><\/li><\/ul><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p8.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p8.jpg\" alt=\"04 p.8 · NOT NULL과 DEFAULT\" loading=\"lazy\"><\/button><figcaption>04 p.8 · NOT NULL과 DEFAULT<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-key-clauses\"><h3>키 제약: PRIMARY KEY, UNIQUE, FOREIGN KEY<\/h3><pre class=\"code\">CREATE TABLE DEPARTMENT\n( Dname           VARCHAR(15)  NOT NULL,\n  Dnumber         INT          NOT NULL,\n  Mgr_ssn         CHAR(9)      NOT NULL,\n  Mgr_start_date  DATE,\n  PRIMARY KEY (Dnumber),\n  UNIQUE (Dname),\n  FOREIGN KEY (Mgr_ssn) REFERENCES EMPLOYEE(Ssn) );\nCREATE TABLE DEPT_LOCATIONS\n( Dnumber    INT          NOT NULL,\n  Dlocation  VARCHAR(15)  NOT NULL,\n  PRIMARY KEY (Dnumber, Dlocation),\n  FOREIGN KEY (Dnumber) REFERENCES DEPARTMENT(Dnumber) );<\/pre>\n<ul><li><b>PRIMARY KEY<\/b>: PK를 이루는 속성(들). 복합이면 괄호 안에 여러 개<\/li><li><b>UNIQUE<\/b>: 대체(alternate) 키 = <b>후보 키<\/b><\/li><li><b>FOREIGN KEY ... REFERENCES 테이블(속성)<\/b>: 다른 릴레이션의 PK를 참조하는 FK<\/li><li>제약에 이름 붙이기: <code>CONSTRAINT DEPTPK PRIMARY KEY (Dnumber)<\/code> → 나중에 ALTER로 지울 때 이름이 필요<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 참조되는 PK가 갱신·삭제되면 참조 무결성이 깨질 수 있는데, <b>SQL의 기본 동작은 그 연산을 거부(reject)<\/b> 하는 것. 다른 방법 = 참조 트리거 동작 (L4-2).<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p9.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p9.jpg\" alt=\"04 p.9 · PRIMARY KEY, UNIQUE, FOREIGN KEY\" loading=\"lazy\"><\/button><figcaption>04 p.9 · PRIMARY KEY, UNIQUE, FOREIGN KEY<\/figcaption><\/figure><\/section>"}, {"id": "L4-2", "title": "참조 트리거 동작 · DROP · ALTER", "src": "4-1 p.11–20", "secs": [{"id": "ref-actions", "title": "참조 트리거 동작 (Referential Triggered Actions)"}, {"id": "drop", "title": "DROP SCHEMA / DROP TABLE"}, {"id": "alter", "title": "ALTER TABLE"}], "md": "## 참조 트리거 동작 (Referential Triggered Actions) {#ref-actions}\n\n**\"다른 투플이 참조하는 투플이 삭제/갱신되면?\"** 에 대한 동작을 FK에 붙인다.\n- **트리거**: `ON DELETE`, `ON UPDATE`\n- **동작**: `SET NULL`, `CASCADE`, `SET DEFAULT` (지정 안 하면 기본 = 거부, 교안 연습에서는 REJECT라고 부름)\n\n| 동작 | 참조되던 투플이 삭제될 때 | 갱신될 때 |\n|---|---|---|\n| SET NULL | 참조하던 FK를 NULL로 | FK를 NULL로 |\n| SET DEFAULT | FK를 기본값으로 | FK를 기본값으로 |\n| CASCADE | **참조하던 투플도 삭제** | 참조하던 FK를 **새 값으로** 바꿈 |\n\n```\nCREATE TABLE EMPLOYEE\n( ...,\n  Dno INT NOT NULL DEFAULT 1,\n  CONSTRAINT EMPPK PRIMARY KEY (Ssn),\n  CONSTRAINT EMPSUPERFK FOREIGN KEY (Super_ssn) REFERENCES EMPLOYEE(Ssn)\n      ON DELETE SET NULL      ON UPDATE CASCADE,\n  CONSTRAINT EMPDEPTFK  FOREIGN KEY (Dno) REFERENCES DEPARTMENT(Dnumber)\n      ON DELETE SET DEFAULT   ON UPDATE CASCADE );\n```\n\n**교안 토론 (p.13)**: EMPSUPERFK의 ON DELETE를 **CASCADE**로 바꾸고 `DELETE FROM EMPLOYEE WHERE Lname = 'Borg';` 를 실행하면?\n- Borg(888665555)를 상사로 둔 Wong, Wallace가 같이 삭제 → 그들을 상사로 둔 Smith, Narayan, English, Zelaya, Jabbar도 연쇄 삭제 → **EMPLOYEE 투플 8개가 전부 사라진다**. CASCADE는 재귀적으로 전파된다는 점이 핵심\n- (EMPSUPERFK만 봤을 때 얘기. 실제로는 WORKS_ON.Essn, DEPENDENT.Essn 같은 다른 FK가 기본 동작(거부)이면, 지워질 사원을 그 투플들이 참조하고 있어서 DELETE 전체가 거부된다)\n\n**교안 연습 1 (LIBRARY)** 정답 예:\n| FK | ON DELETE | ON UPDATE | 이유 |\n|---|---|---|---|\n| BOOK_AUTHORS.Book_id → BOOK | CASCADE | CASCADE | 책이 지워지면 저자 정보도 필요 없음 |\n| BOOK.Publisher_name → PUBLISHER | REJECT | CASCADE | 그 출판사 책이 있으면 출판사 삭제 금지 |\n| BOOK_COPIES.Book_id → BOOK | CASCADE | CASCADE | 책 목록에서 빼면 사본도 관리 안 함 |\n| BOOK_COPIES.Branch_id → LIBRARY_BRANCH | CASCADE | CASCADE | 지점 삭제 = 폐점 |\n| BOOK_LOANS.Book_id → BOOK | REJECT (또는 CASCADE) | CASCADE | 목록에서 빼도 대출된 책은 돌려받아야 함 |\n| BOOK_LOANS.Branch_id → LIBRARY_BRANCH | CASCADE (또는 REJECT) | CASCADE | 폐점하면 대출을 탕감 |\n| BOOK_LOANS.Card_no → BORROWER | REJECT | CASCADE | 책을 다 반납해야 회원 탈퇴 가능 |\n\n> 시험 포인트: 정답이 하나가 아니라 **이유가 맞으면** 인정되는 유형. ON UPDATE는 거의 다 CASCADE (키가 바뀌면 참조도 따라가야 추적 가능).\n\n## DROP SCHEMA / DROP TABLE {#drop}\n\n스키마 수정 = 투플이 아니라 **스키마**를 바꾸는 것 (테이블·속성·제약 추가/삭제).\n\n- **DROP SCHEMA**: 스키마 전체 삭제\n  - `CASCADE`: 스키마의 모든 요소(테이블, 도메인 등)까지 삭제\n  - `RESTRICT`: 스키마에 **요소가 하나도 없을 때만** 삭제 (사용자가 요소를 하나씩 지워야 함)\n- **DROP TABLE**: 특정 테이블 삭제. 모든 투플 + **카탈로그의 테이블 정의까지** 제거\n  - 투플만 지우고 정의는 남기려면 **DELETE** 명령\n  - `CASCADE`: 그 테이블을 참조하는 제약과 요소도 자동으로 같이 삭제\n  - `RESTRICT`: 어떤 제약이나 요소도 그 테이블을 참조하지 않을 때만 삭제\n\n## ALTER TABLE {#alter}\n\n테이블 정의 변경: 속성·제약 추가/삭제, 열 정의(타입, 제약) 변경.\n```\nALTER TABLE COMPANY.EMPLOYEE ADD COLUMN Job VARCHAR(12);\nALTER TABLE COMPANY.EMPLOYEE DROP COLUMN Address CASCADE;\nALTER TABLE COMPANY.EMPLOYEE DROP CONSTRAINT EMPSUPERFK CASCADE;\n```\n- DROP COLUMN `CASCADE`: 그 열을 참조하는 제약도 자동으로 같이 삭제 / `RESTRICT`: 그 열을 참조하는 요소가 없을 때만\n- ADD COLUMN으로 추가된 열은 기존 투플에서 NULL (또는 DEFAULT 값). 그래서 새 열에 NOT NULL을 걸려면 DEFAULT가 필요", "html": "<section class=\"sec\" id=\"s-ref-actions\"><h3>참조 트리거 동작 (Referential Triggered Actions)<\/h3><p><b>\"다른 투플이 참조하는 투플이 삭제/갱신되면?\"<\/b> 에 대한 동작을 FK에 붙인다.<\/p>\n<ul><li><b>트리거<\/b>: <code>ON DELETE<\/code>, <code>ON UPDATE<\/code><\/li><li><b>동작<\/b>: <code>SET NULL<\/code>, <code>CASCADE<\/code>, <code>SET DEFAULT<\/code> (지정 안 하면 기본 = 거부, 교안 연습에서는 REJECT라고 부름)<\/li><\/ul>\n<div class=\"tblw\"><table><thead><tr><th>동작<\/th><th>참조되던 투플이 삭제될 때<\/th><th>갱신될 때<\/th><\/tr><\/thead><tbody><tr><td>SET NULL<\/td><td>참조하던 FK를 NULL로<\/td><td>FK를 NULL로<\/td><\/tr><tr><td>SET DEFAULT<\/td><td>FK를 기본값으로<\/td><td>FK를 기본값으로<\/td><\/tr><tr><td>CASCADE<\/td><td><b>참조하던 투플도 삭제<\/b><\/td><td>참조하던 FK를 <b>새 값으로<\/b> 바꿈<\/td><\/tr><\/tbody><\/table><\/div>\n<pre class=\"code\">CREATE TABLE EMPLOYEE\n( ...,\n  Dno INT NOT NULL DEFAULT 1,\n  CONSTRAINT EMPPK PRIMARY KEY (Ssn),\n  CONSTRAINT EMPSUPERFK FOREIGN KEY (Super_ssn) REFERENCES EMPLOYEE(Ssn)\n      ON DELETE SET NULL      ON UPDATE CASCADE,\n  CONSTRAINT EMPDEPTFK  FOREIGN KEY (Dno) REFERENCES DEPARTMENT(Dnumber)\n      ON DELETE SET DEFAULT   ON UPDATE CASCADE );<\/pre>\n<p><b>교안 토론 (p.13)<\/b>: EMPSUPERFK의 ON DELETE를 <b>CASCADE<\/b>로 바꾸고 <code>DELETE FROM EMPLOYEE WHERE Lname = 'Borg';<\/code> 를 실행하면?<\/p>\n<ul><li>Borg(888665555)를 상사로 둔 Wong, Wallace가 같이 삭제 → 그들을 상사로 둔 Smith, Narayan, English, Zelaya, Jabbar도 연쇄 삭제 → <b>EMPLOYEE 투플 8개가 전부 사라진다<\/b>. CASCADE는 재귀적으로 전파된다는 점이 핵심<\/li><li>(EMPSUPERFK만 봤을 때 얘기. 실제로는 WORKS_ON.Essn, DEPENDENT.Essn 같은 다른 FK가 기본 동작(거부)이면, 지워질 사원을 그 투플들이 참조하고 있어서 DELETE 전체가 거부된다)<\/li><\/ul>\n<p><b>교안 연습 1 (LIBRARY)<\/b> 정답 예:<\/p>\n<div class=\"tblw\"><table><thead><tr><th>FK<\/th><th>ON DELETE<\/th><th>ON UPDATE<\/th><th>이유<\/th><\/tr><\/thead><tbody><tr><td>BOOK_AUTHORS.Book_id → BOOK<\/td><td>CASCADE<\/td><td>CASCADE<\/td><td>책이 지워지면 저자 정보도 필요 없음<\/td><\/tr><tr><td>BOOK.Publisher_name → PUBLISHER<\/td><td>REJECT<\/td><td>CASCADE<\/td><td>그 출판사 책이 있으면 출판사 삭제 금지<\/td><\/tr><tr><td>BOOK_COPIES.Book_id → BOOK<\/td><td>CASCADE<\/td><td>CASCADE<\/td><td>책 목록에서 빼면 사본도 관리 안 함<\/td><\/tr><tr><td>BOOK_COPIES.Branch_id → LIBRARY_BRANCH<\/td><td>CASCADE<\/td><td>CASCADE<\/td><td>지점 삭제 = 폐점<\/td><\/tr><tr><td>BOOK_LOANS.Book_id → BOOK<\/td><td>REJECT (또는 CASCADE)<\/td><td>CASCADE<\/td><td>목록에서 빼도 대출된 책은 돌려받아야 함<\/td><\/tr><tr><td>BOOK_LOANS.Branch_id → LIBRARY_BRANCH<\/td><td>CASCADE (또는 REJECT)<\/td><td>CASCADE<\/td><td>폐점하면 대출을 탕감<\/td><\/tr><tr><td>BOOK_LOANS.Card_no → BORROWER<\/td><td>REJECT<\/td><td>CASCADE<\/td><td>책을 다 반납해야 회원 탈퇴 가능<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout exam\">시험 포인트: 정답이 하나가 아니라 <b>이유가 맞으면<\/b> 인정되는 유형. ON UPDATE는 거의 다 CASCADE (키가 바뀌면 참조도 따라가야 추적 가능).<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p11.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p11.jpg\" alt=\"04 p.11 · ON DELETE SET NULL / SET DEFAULT, ON UPDATE CASCADE\" loading=\"lazy\"><\/button><figcaption>04 p.11 · ON DELETE SET NULL / SET DEFAULT, ON UPDATE CASCADE<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p13.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p13.jpg\" alt=\"04 p.13 · 토론: EMPSUPERFK를 ON DELETE CASCADE로 바꾸고 Borg 삭제\" loading=\"lazy\"><\/button><figcaption>04 p.13 · 토론: EMPSUPERFK를 ON DELETE CASCADE로 바꾸고 Borg 삭제<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p14.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p14.jpg\" alt=\"04 p.14 · 연습 1: LIBRARY 스키마\" loading=\"lazy\"><\/button><figcaption>04 p.14 · 연습 1: LIBRARY 스키마<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-drop\"><h3>DROP SCHEMA / DROP TABLE<\/h3><p>스키마 수정 = 투플이 아니라 <b>스키마<\/b>를 바꾸는 것 (테이블·속성·제약 추가/삭제).<\/p>\n<ul><li><b>DROP SCHEMA<\/b>: 스키마 전체 삭제<ul><li><code>CASCADE<\/code>: 스키마의 모든 요소(테이블, 도메인 등)까지 삭제<\/li><li><code>RESTRICT<\/code>: 스키마에 <b>요소가 하나도 없을 때만<\/b> 삭제 (사용자가 요소를 하나씩 지워야 함)<\/li><\/ul><\/li><li><b>DROP TABLE<\/b>: 특정 테이블 삭제. 모든 투플 + <b>카탈로그의 테이블 정의까지<\/b> 제거<ul><li>투플만 지우고 정의는 남기려면 <b>DELETE<\/b> 명령<\/li><li><code>CASCADE<\/code>: 그 테이블을 참조하는 제약과 요소도 자동으로 같이 삭제<\/li><li><code>RESTRICT<\/code>: 어떤 제약이나 요소도 그 테이블을 참조하지 않을 때만 삭제<\/li><\/ul><\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-alter\"><h3>ALTER TABLE<\/h3><p>테이블 정의 변경: 속성·제약 추가/삭제, 열 정의(타입, 제약) 변경.<\/p>\n<pre class=\"code\">ALTER TABLE COMPANY.EMPLOYEE ADD COLUMN Job VARCHAR(12);\nALTER TABLE COMPANY.EMPLOYEE DROP COLUMN Address CASCADE;\nALTER TABLE COMPANY.EMPLOYEE DROP CONSTRAINT EMPSUPERFK CASCADE;<\/pre>\n<ul><li>DROP COLUMN <code>CASCADE<\/code>: 그 열을 참조하는 제약도 자동으로 같이 삭제 / <code>RESTRICT<\/code>: 그 열을 참조하는 요소가 없을 때만<\/li><li>ADD COLUMN으로 추가된 열은 기존 투플에서 NULL (또는 DEFAULT 값). 그래서 새 열에 NOT NULL을 걸려면 DEFAULT가 필요<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p20.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p20.jpg\" alt=\"04 p.20 · ALTER TABLE ADD COLUMN / DROP COLUMN / DROP CONSTRAINT\" loading=\"lazy\"><\/button><figcaption>04 p.20 · ALTER TABLE ADD COLUMN / DROP COLUMN / DROP CONSTRAINT<\/figcaption><\/figure><\/section>"}, {"id": "L4-3", "title": "INSERT · DELETE · UPDATE", "src": "4-1 p.22–27", "secs": [{"id": "dml-insert", "title": "INSERT"}, {"id": "dml-delete-update", "title": "DELETE와 UPDATE"}], "md": "## INSERT {#dml-insert}\n\n**사용법 1: 모든 속성 값** — 테이블을 만들 때의 속성 **순서대로** 값을 나열\n```\nINSERT INTO EMPLOYEE\nVALUES ('Richard', 'K', 'Marini', '653298653', '1962-12-30',\n        '98 Oak Forest, Katy, TX', 'M', 37000, '653298653', 4);\n```\n**사용법 2: 속성 이름 명시** — **NOT NULL이면서 DEFAULT가 없는 속성은 반드시** 포함\n```\nINSERT INTO EMPLOYEE (Fname, Lname, Dno, Ssn)\nVALUES ('Richard', 'Marini', 4, '653298653');\n```\n**제약 위반 예 (거부됨)**\n- `INSERT INTO EMPLOYEE (Fname, Lname, Ssn, Dno) VALUES ('Robert', 'Hatcher', '980760540', 2);` → Dnumber=2인 부서 없음 → **참조 무결성**\n- `INSERT INTO EMPLOYEE (Fname, Lname, Dno) VALUES ('Robert', 'Hatcher', 5);` → Ssn 없음 → **NOT NULL** (PK라 개체 무결성)\n\n## DELETE와 UPDATE {#dml-delete-update}\n\n**DELETE**: WHERE로 **한 릴레이션**에서 지울 투플을 고름\n- 한 번에 한 테이블에서만 명시적으로 삭제. 참조 트리거 동작(ON DELETE CASCADE)이 있으면 다른 릴레이션으로 전파될 수 있다\n- 지워지는 투플 수는 경우마다 다름 (COMPANY 상태 기준):\n\n```\nDELETE FROM EMPLOYEE WHERE Lname = 'Brown';        -- 0개\nDELETE FROM EMPLOYEE WHERE Ssn = '123456789';      -- 1개\nDELETE FROM EMPLOYEE WHERE Dno = 5;                -- 4개\nDELETE FROM EMPLOYEE;                              -- 전부!\n```\n> 주의: **WHERE를 빼면 모든 투플이 삭제된다.** 테이블 정의는 남음 (DROP TABLE과 다름).\n\n**UPDATE**: WHERE로 **한 릴레이션**에서 고친 투플을 고르고, **SET**으로 바꿀 속성과 새 값 지정\n```\nUPDATE PROJECT  SET Plocation = 'Bellaire', Dnum = 5  WHERE Pnumber = 10;\nUPDATE EMPLOYEE SET Salary = Salary * 1.1             WHERE Dno = 5;\n```\n- UPDATE 하나로 여러 투플을 고칠 수 있다 (Dno=5인 4명이 한꺼번에 10% 인상)\n- ON UPDATE CASCADE가 있으면 다른 릴레이션으로 전파", "html": "<section class=\"sec\" id=\"s-dml-insert\"><h3>INSERT<\/h3><p><b>사용법 1: 모든 속성 값<\/b> — 테이블을 만들 때의 속성 <b>순서대로<\/b> 값을 나열<\/p>\n<pre class=\"code\">INSERT INTO EMPLOYEE\nVALUES (&#x27;Richard&#x27;, &#x27;K&#x27;, &#x27;Marini&#x27;, &#x27;653298653&#x27;, &#x27;1962-12-30&#x27;,\n        &#x27;98 Oak Forest, Katy, TX&#x27;, &#x27;M&#x27;, 37000, &#x27;653298653&#x27;, 4);<\/pre>\n<p><b>사용법 2: 속성 이름 명시<\/b> — <b>NOT NULL이면서 DEFAULT가 없는 속성은 반드시<\/b> 포함<\/p>\n<pre class=\"code\">INSERT INTO EMPLOYEE (Fname, Lname, Dno, Ssn)\nVALUES (&#x27;Richard&#x27;, &#x27;Marini&#x27;, 4, &#x27;653298653&#x27;);<\/pre>\n<p><b>제약 위반 예 (거부됨)<\/b><\/p>\n<ul><li><code>INSERT INTO EMPLOYEE (Fname, Lname, Ssn, Dno) VALUES ('Robert', 'Hatcher', '980760540', 2);<\/code> → Dnumber=2인 부서 없음 → <b>참조 무결성<\/b><\/li><li><code>INSERT INTO EMPLOYEE (Fname, Lname, Dno) VALUES ('Robert', 'Hatcher', 5);<\/code> → Ssn 없음 → <b>NOT NULL<\/b> (PK라 개체 무결성)<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p25.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p25.jpg\" alt=\"04 p.25 · INSERT의 참조 무결성 위반과 NOT NULL 위반\" loading=\"lazy\"><\/button><figcaption>04 p.25 · INSERT의 참조 무결성 위반과 NOT NULL 위반<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-dml-delete-update\"><h3>DELETE와 UPDATE<\/h3><p><b>DELETE<\/b>: WHERE로 <b>한 릴레이션<\/b>에서 지울 투플을 고름<\/p>\n<ul><li>한 번에 한 테이블에서만 명시적으로 삭제. 참조 트리거 동작(ON DELETE CASCADE)이 있으면 다른 릴레이션으로 전파될 수 있다<\/li><li>지워지는 투플 수는 경우마다 다름 (COMPANY 상태 기준):<\/li><\/ul>\n<pre class=\"code\">DELETE FROM EMPLOYEE WHERE Lname = &#x27;Brown&#x27;;        -- 0개\nDELETE FROM EMPLOYEE WHERE Ssn = &#x27;123456789&#x27;;      -- 1개\nDELETE FROM EMPLOYEE WHERE Dno = 5;                -- 4개\nDELETE FROM EMPLOYEE;                              -- 전부!<\/pre>\n<div class=\"callout trap\">주의: <b>WHERE를 빼면 모든 투플이 삭제된다.<\/b> 테이블 정의는 남음 (DROP TABLE과 다름).<\/div>\n<p><b>UPDATE<\/b>: WHERE로 <b>한 릴레이션<\/b>에서 고친 투플을 고르고, <b>SET<\/b>으로 바꿀 속성과 새 값 지정<\/p>\n<pre class=\"code\">UPDATE PROJECT  SET Plocation = &#x27;Bellaire&#x27;, Dnum = 5  WHERE Pnumber = 10;\nUPDATE EMPLOYEE SET Salary = Salary * 1.1             WHERE Dno = 5;<\/pre>\n<ul><li>UPDATE 하나로 여러 투플을 고칠 수 있다 (Dno=5인 4명이 한꺼번에 10% 인상)<\/li><li>ON UPDATE CASCADE가 있으면 다른 릴레이션으로 전파<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p26.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p26.jpg\" alt=\"04 p.26 · DELETE로 지워지는 투플 수 (0, 1, 4, 전부)\" loading=\"lazy\"><\/button><figcaption>04 p.26 · DELETE로 지워지는 투플 수 (0, 1, 4, 전부)<\/figcaption><\/figure><\/section>"}, {"id": "L4-4", "title": "SELECT-FROM-WHERE · 별칭", "src": "4-1 p.28–34", "secs": [{"id": "sfw", "title": "SELECT-FROM-WHERE 블록"}, {"id": "qualify-alias", "title": "모호한 속성 이름과 별칭"}, {"id": "missing-where-star", "title": "WHERE 생략과 *"}], "md": "## SELECT-FROM-WHERE 블록 {#sfw}\n\n```\nSELECT  <attribute list>      -- 투영 속성 (projection attributes)\nFROM    <table list>          -- 질의에 필요한 릴레이션\nWHERE   <condition>;          -- 선택 조건 + 조인 조건\n```\n**질의 1**: 'John B. Smith'의 생일과 주소\n```\nSELECT Bdate, Address\nFROM   EMPLOYEE\nWHERE  Fname = 'John' AND Minit = 'B' AND Lname = 'Smith';\n```\n→ 1965-01-09, 731 Fondren, Houston, TX\n\n**질의 2**: 'Research' 부서에서 일하는 모든 사원의 이름과 주소\n```\nSELECT Fname, Lname, Address\nFROM   EMPLOYEE, DEPARTMENT\nWHERE  Dname = 'Research' AND Dnumber = Dno;\n```\n- `Dname = 'Research'` = **선택 조건** (한 테이블에서 관심 있는 투플 고르기)\n- `Dnumber = Dno` = **조인 조건** (DEPARTMENT 투플과 EMPLOYEE 투플을 결합)\n- 결과: Smith, Wong, Narayan, English (4명)\n\n## 모호한 속성 이름과 별칭 {#qualify-alias}\n\n**자격 부여 (qualify)**: 다른 릴레이션에 같은 이름의 속성이 있으면 `릴레이션이름.속성`으로 구분.\n```\nSELECT Fname, EMPLOYEE.Name, Address\nFROM   EMPLOYEE, DEPARTMENT\nWHERE  DEPARTMENT.Name = 'Research' AND DEPARTMENT.Dnumber = EMPLOYEE.Dnumber;\n```\n**별칭 (alias, 투플 변수)**: 긴 이름 반복을 줄이고, **같은 릴레이션을 두 번** 참조할 때 필수.\n```\nSELECT E.Fname, E.Lname, S.Fname, S.Lname\nFROM   EMPLOYEE AS E, EMPLOYEE AS S\nWHERE  E.Super_ssn = S.Ssn;\n```\n→ 사원과 그 직속 상사의 이름. E = 사원 역할, S = 상사 역할. 상사가 없는 Borg는 결과에 없다 (7행).\n\n> 함정: 교안 p.32의 `FROM EMPLOYEE AS E WHERE E.Super_ssn = E.Ssn` 은 별칭이 하나라서 \"자기 자신이 자기 상사인 사원\"을 찾는 질의가 된다 (결과 0행). 같은 테이블을 두 역할로 쓰려면 별칭이 **두 개** 필요하다는 걸 보여주는 예.\n\n## WHERE 생략과 * {#missing-where-star}\n\n**WHERE 생략**: 투플 선택 조건이 없음 → FROM의 릴레이션 투플을 전부 검색.\n- 릴레이션이 둘 이상이면 **가능한 모든 투플 조합 (카티션 곱)** 이 나온다\n- `SELECT Ssn, Dname FROM EMPLOYEE, DEPARTMENT;` → 8 × 3 = **24행**\n- 조건 하나라도 빠뜨리면 틀리고 아주 큰 결과가 나오니 **WHERE에 모든 조건을 다 써야** 한다\n\n**별표 (*)**: 선택된 투플의 **모든 속성** 값. `SELECT * FROM EMPLOYEE WHERE Dno = 5;` → 4행, 10열.", "html": "<section class=\"sec\" id=\"s-sfw\"><h3>SELECT-FROM-WHERE 블록<\/h3><pre class=\"code\">SELECT  &lt;attribute list&gt;      -- 투영 속성 (projection attributes)\nFROM    &lt;table list&gt;          -- 질의에 필요한 릴레이션\nWHERE   &lt;condition&gt;;          -- 선택 조건 + 조인 조건<\/pre>\n<p><b>질의 1<\/b>: 'John B. Smith'의 생일과 주소<\/p>\n<pre class=\"code\">SELECT Bdate, Address\nFROM   EMPLOYEE\nWHERE  Fname = &#x27;John&#x27; AND Minit = &#x27;B&#x27; AND Lname = &#x27;Smith&#x27;;<\/pre>\n<p>→ 1965-01-09, 731 Fondren, Houston, TX<\/p>\n<p><b>질의 2<\/b>: 'Research' 부서에서 일하는 모든 사원의 이름과 주소<\/p>\n<pre class=\"code\">SELECT Fname, Lname, Address\nFROM   EMPLOYEE, DEPARTMENT\nWHERE  Dname = &#x27;Research&#x27; AND Dnumber = Dno;<\/pre>\n<ul><li><code>Dname = 'Research'<\/code> = <b>선택 조건<\/b> (한 테이블에서 관심 있는 투플 고르기)<\/li><li><code>Dnumber = Dno<\/code> = <b>조인 조건<\/b> (DEPARTMENT 투플과 EMPLOYEE 투플을 결합)<\/li><li>결과: Smith, Wong, Narayan, English (4명)<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p30.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p30.jpg\" alt=\"04 p.30 · 질의 2: 선택 조건 Dname=&#x27;Research&#x27; + 조인 조건 Dnumber=Dno\" loading=\"lazy\"><\/button><figcaption>04 p.30 · 질의 2: 선택 조건 Dname=&#x27;Research&#x27; + 조인 조건 Dnumber=Dno<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-qualify-alias\"><h3>모호한 속성 이름과 별칭<\/h3><p><b>자격 부여 (qualify)<\/b>: 다른 릴레이션에 같은 이름의 속성이 있으면 <code>릴레이션이름.속성<\/code>으로 구분.<\/p>\n<pre class=\"code\">SELECT Fname, EMPLOYEE.Name, Address\nFROM   EMPLOYEE, DEPARTMENT\nWHERE  DEPARTMENT.Name = &#x27;Research&#x27; AND DEPARTMENT.Dnumber = EMPLOYEE.Dnumber;<\/pre>\n<p><b>별칭 (alias, 투플 변수)<\/b>: 긴 이름 반복을 줄이고, <b>같은 릴레이션을 두 번<\/b> 참조할 때 필수.<\/p>\n<pre class=\"code\">SELECT E.Fname, E.Lname, S.Fname, S.Lname\nFROM   EMPLOYEE AS E, EMPLOYEE AS S\nWHERE  E.Super_ssn = S.Ssn;<\/pre>\n<p>→ 사원과 그 직속 상사의 이름. E = 사원 역할, S = 상사 역할. 상사가 없는 Borg는 결과에 없다 (7행).<\/p>\n<div class=\"callout trap\">함정: 교안 p.32의 <code>FROM EMPLOYEE AS E WHERE E.Super_ssn = E.Ssn<\/code> 은 별칭이 하나라서 \"자기 자신이 자기 상사인 사원\"을 찾는 질의가 된다 (결과 0행). 같은 테이블을 두 역할로 쓰려면 별칭이 <b>두 개<\/b> 필요하다는 걸 보여주는 예.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p32.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p32.jpg\" alt=\"04 p.32 · 별칭 (같은 테이블을 두 번 쓰는 사원–상사 질의)\" loading=\"lazy\"><\/button><figcaption>04 p.32 · 별칭 (같은 테이블을 두 번 쓰는 사원–상사 질의)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-missing-where-star\"><h3>WHERE 생략과 *<\/h3><p><b>WHERE 생략<\/b>: 투플 선택 조건이 없음 → FROM의 릴레이션 투플을 전부 검색.<\/p>\n<ul><li>릴레이션이 둘 이상이면 <b>가능한 모든 투플 조합 (카티션 곱)<\/b> 이 나온다<\/li><li><code>SELECT Ssn, Dname FROM EMPLOYEE, DEPARTMENT;<\/code> → 8 × 3 = <b>24행<\/b><\/li><li>조건 하나라도 빠뜨리면 틀리고 아주 큰 결과가 나오니 <b>WHERE에 모든 조건을 다 써야<\/b> 한다<\/li><\/ul>\n<p><b>별표 (*)<\/b>: 선택된 투플의 <b>모든 속성<\/b> 값. <code>SELECT * FROM EMPLOYEE WHERE Dno = 5;<\/code> → 4행, 10열.<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p33.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p33.jpg\" alt=\"04 p.33 · WHERE 생략 → 8 × 3 = 24개 조합\" loading=\"lazy\"><\/button><figcaption>04 p.33 · WHERE 생략 → 8 × 3 = 24개 조합<\/figcaption><\/figure><\/section>"}, {"id": "L4-5", "title": "다중집합 · 집합 연산 · ORDER BY · 연산자", "src": "4-1 p.35–41", "secs": [{"id": "multiset-distinct", "title": "다중집합과 DISTINCT"}, {"id": "set-ops", "title": "집합 연산 UNION / EXCEPT / INTERSECT"}, {"id": "order-arith", "title": "ORDER BY · 산술 연산 · BETWEEN"}], "md": "## 다중집합과 DISTINCT {#multiset-distinct}\n\n**SQL은 테이블을 집합이 아니라 다중집합(multiset)으로 다룬다** → 테이블이나 질의 결과에 **중복 투플**이 있을 수 있고, SQL은 **중복을 자동으로 제거하지 않는다**.\n\n왜?\n- 중복 제거는 **비싼** 연산 (투플을 정렬한 다음 중복을 지워야 함)\n- 사용자가 중복을 보고 싶을 때도 있음\n- 집계 함수를 쓸 때 중복이 필요 (예: 급여 평균) → 5주차\n\n키워드\n- **ALL** (기본): 중복 유지. `SELECT ALL Salary FROM EMPLOYEE;` → 8행 (25000이 3번)\n- **DISTINCT**: 중복 제거. `SELECT DISTINCT Salary FROM EMPLOYEE;` → 6행\n\n## 집합 연산 UNION / EXCEPT / INTERSECT {#set-ops}\n\n- **UNION**(합), **EXCEPT**(차), **INTERSECT**(교). 결과는 투플의 **집합** → **중복 제거됨**\n- **타입 호환(type-compatible)** 되는 릴레이션에만 적용 (속성 수가 같고 대응 속성의 도메인이 같음)\n- 다중집합 버전: **UNION ALL, EXCEPT ALL, INTERSECT ALL** (중복 유지)\n  - R(A) = {a1, a2, a2, a3}, S(A) = {a1, a2, a4, a5}\n  - R UNION ALL S = {a1, a1, a2, a2, a2, a3, a4, a5}\n  - R EXCEPT ALL S = {a2, a3}\n  - R INTERSECT ALL S = {a1, a2}\n\n**질의 4**: 성이 'Smith'인 사원이 **일꾼**으로든 그 프로젝트를 통제하는 부서의 **관리자**로든 관련된 프로젝트 번호\n```\n( SELECT DISTINCT Pnumber\n  FROM   PROJECT, DEPARTMENT, EMPLOYEE\n  WHERE  Dnum = Dnumber AND Mgr_ssn = Ssn AND Lname = 'Smith' )\nUNION\n( SELECT DISTINCT Pnumber\n  FROM   PROJECT, WORKS_ON, EMPLOYEE\n  WHERE  Pnumber = Pno AND Essn = Ssn AND Lname = 'Smith' );\n```\n→ Smith는 관리자가 아니라 첫 블록은 비고, 일꾼으로 1, 2 → 결과 {1, 2}\n\n## ORDER BY · 산술 연산 · BETWEEN {#order-arith}\n\n**ORDER BY**: 결과 투플을 속성 값 기준으로 정렬. **기본은 오름차순(ASC)**, 내림차순은 DESC.\n```\nSELECT   D.Dname, E.Lname, E.Fname, P.Pname\nFROM     DEPARTMENT AS D, EMPLOYEE AS E, WORKS_ON AS W, PROJECT AS P\nWHERE    D.Dnumber = E.Dno AND E.Ssn = W.Essn AND W.Pno = P.Pnumber\nORDER BY D.Dname DESC, E.Lname ASC, E.Fname ASC;\n```\n**산술 연산자** + − * /: 숫자 속성에 적용. **릴레이션 상태는 바뀌지 않는다** (결과에만 반영)\n```\nSELECT E.Fname, E.Lname, 1.1 * E.Salary AS Increased_sal\nFROM   EMPLOYEE AS E, WORKS_ON AS W, PROJECT AS P\nWHERE  E.Ssn = W.Essn AND W.Pno = P.Pnumber AND P.Pname = 'ProductX';\n```\n→ Smith 33000, English 27500\n\n**BETWEEN**: 범위 조건. `(Salary BETWEEN 30000 AND 40000)` = `((Salary >= 30000) AND (Salary <= 40000))` → **양 끝 포함**\n```\nSELECT * FROM EMPLOYEE WHERE (Salary BETWEEN 30000 AND 40000) AND Dno = 5;\n```\n→ Smith(30000), Wong(40000), Narayan(38000)\n\n> 실습 메모 (3-2, week6 lab): 실습은 SQLite + Python(pandas, sqlglot). NL_queries.txt를 보고 mysql.py에 SQL을 쓰고 test.py로 결과 CSV를 만든다. 제출 압축 파일 이름은 반드시 학번. **SQLite는 ALL, ANY를 지원하지 않는다.**", "html": "<section class=\"sec\" id=\"s-multiset-distinct\"><h3>다중집합과 DISTINCT<\/h3><p><b>SQL은 테이블을 집합이 아니라 다중집합(multiset)으로 다룬다<\/b> → 테이블이나 질의 결과에 <b>중복 투플<\/b>이 있을 수 있고, SQL은 <b>중복을 자동으로 제거하지 않는다<\/b>.<\/p>\n<p>왜?<\/p>\n<ul><li>중복 제거는 <b>비싼<\/b> 연산 (투플을 정렬한 다음 중복을 지워야 함)<\/li><li>사용자가 중복을 보고 싶을 때도 있음<\/li><li>집계 함수를 쓸 때 중복이 필요 (예: 급여 평균) → 5주차<\/li><\/ul>\n<p>키워드<\/p>\n<ul><li><b>ALL<\/b> (기본): 중복 유지. <code>SELECT ALL Salary FROM EMPLOYEE;<\/code> → 8행 (25000이 3번)<\/li><li><b>DISTINCT<\/b>: 중복 제거. <code>SELECT DISTINCT Salary FROM EMPLOYEE;<\/code> → 6행<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p36.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p36.jpg\" alt=\"04 p.36 · ALL Salary (8행) vs DISTINCT Salary (6행)\" loading=\"lazy\"><\/button><figcaption>04 p.36 · ALL Salary (8행) vs DISTINCT Salary (6행)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-set-ops\"><h3>집합 연산 UNION / EXCEPT / INTERSECT<\/h3><ul><li><b>UNION<\/b>(합), <b>EXCEPT<\/b>(차), <b>INTERSECT<\/b>(교). 결과는 투플의 <b>집합<\/b> → <b>중복 제거됨<\/b><\/li><li><b>타입 호환(type-compatible)<\/b> 되는 릴레이션에만 적용 (속성 수가 같고 대응 속성의 도메인이 같음)<\/li><li>다중집합 버전: <b>UNION ALL, EXCEPT ALL, INTERSECT ALL<\/b> (중복 유지)<ul><li>R(A) = {a1, a2, a2, a3}, S(A) = {a1, a2, a4, a5}<\/li><li>R UNION ALL S = {a1, a1, a2, a2, a2, a3, a4, a5}<\/li><li>R EXCEPT ALL S = {a2, a3}<\/li><li>R INTERSECT ALL S = {a1, a2}<\/li><\/ul><\/li><\/ul>\n<p><b>질의 4<\/b>: 성이 'Smith'인 사원이 <b>일꾼<\/b>으로든 그 프로젝트를 통제하는 부서의 <b>관리자<\/b>로든 관련된 프로젝트 번호<\/p>\n<pre class=\"code\">( SELECT DISTINCT Pnumber\n  FROM   PROJECT, DEPARTMENT, EMPLOYEE\n  WHERE  Dnum = Dnumber AND Mgr_ssn = Ssn AND Lname = &#x27;Smith&#x27; )\nUNION\n( SELECT DISTINCT Pnumber\n  FROM   PROJECT, WORKS_ON, EMPLOYEE\n  WHERE  Pnumber = Pno AND Essn = Ssn AND Lname = &#x27;Smith&#x27; );<\/pre>\n<p>→ Smith는 관리자가 아니라 첫 블록은 비고, 일꾼으로 1, 2 → 결과 {1, 2}<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/SQL-p38.jpg\" aria-label=\"크게 보기\"><img src=\"img/SQL-p38.jpg\" alt=\"04 p.38 · UNION ALL, EXCEPT ALL, INTERSECT ALL\" loading=\"lazy\"><\/button><figcaption>04 p.38 · UNION ALL, EXCEPT ALL, INTERSECT ALL<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-order-arith\"><h3>ORDER BY · 산술 연산 · BETWEEN<\/h3><p><b>ORDER BY<\/b>: 결과 투플을 속성 값 기준으로 정렬. <b>기본은 오름차순(ASC)<\/b>, 내림차순은 DESC.<\/p>\n<pre class=\"code\">SELECT   D.Dname, E.Lname, E.Fname, P.Pname\nFROM     DEPARTMENT AS D, EMPLOYEE AS E, WORKS_ON AS W, PROJECT AS P\nWHERE    D.Dnumber = E.Dno AND E.Ssn = W.Essn AND W.Pno = P.Pnumber\nORDER BY D.Dname DESC, E.Lname ASC, E.Fname ASC;<\/pre>\n<p><b>산술 연산자<\/b> + − * /: 숫자 속성에 적용. <b>릴레이션 상태는 바뀌지 않는다<\/b> (결과에만 반영)<\/p>\n<pre class=\"code\">SELECT E.Fname, E.Lname, 1.1 * E.Salary AS Increased_sal\nFROM   EMPLOYEE AS E, WORKS_ON AS W, PROJECT AS P\nWHERE  E.Ssn = W.Essn AND W.Pno = P.Pnumber AND P.Pname = &#x27;ProductX&#x27;;<\/pre>\n<p>→ Smith 33000, English 27500<\/p>\n<p><b>BETWEEN<\/b>: 범위 조건. <code>(Salary BETWEEN 30000 AND 40000)<\/code> = <code>((Salary &gt;= 30000) AND (Salary &lt;= 40000))<\/code> → <b>양 끝 포함<\/b><\/p>\n<pre class=\"code\">SELECT * FROM EMPLOYEE WHERE (Salary BETWEEN 30000 AND 40000) AND Dno = 5;<\/pre>\n<p>→ Smith(30000), Wong(40000), Narayan(38000)<\/p>\n<div class=\"callout\">실습 메모 (3-2, week6 lab): 실습은 SQLite + Python(pandas, sqlglot). NL_queries.txt를 보고 mysql.py에 SQL을 쓰고 test.py로 결과 CSV를 만든다. 제출 압축 파일 이름은 반드시 학번. <b>SQLite는 ALL, ANY를 지원하지 않는다.<\/b><\/div><\/section>"}]}, {"id": "U5", "title": "Advanced SQL (중첩 · 조인 · 집계 · 뷰)", "src": "5-1_Advanced-SQL.pdf", "intro": "중첩 질의(IN, ALL/ANY, EXISTS), 조인 테이블(NATURAL, OUTER), 집계와 GROUP BY/HAVING, Assertion·Trigger, 뷰. SQL 작성 문제의 본체라서 문제를 많이 풀어봐. 특히 \"모든 ~를 하는\" 질의(나눗셈)와 GROUP BY + HAVING은 꼭.", "lessons": [{"id": "L5-1", "title": "중첩 질의 · IN · ALL/ANY", "src": "5-1 p.3–6", "secs": [{"id": "nested-in", "title": "중첩 질의와 IN"}, {"id": "all-any", "title": "ALL / ANY (SOME)"}, {"id": "correlated", "title": "중첩 질의의 모호성과 상관 질의"}], "md": "## 중첩 질의와 IN {#nested-in}\n\n**중첩 질의 (nested query)**: 다른 질의의 **WHERE 절 안에** 들어간 완전한 SELECT-FROM-WHERE 블록.\n- DB에 있는 값을 가져와서 WHERE 조건의 비교에 쓸 때 유용\n- 결과는 투플의 (다중)집합 → 바깥 질의 = outer query, 안쪽 = inner query\n\n**IN**: 값 v를 값의 (다중)집합 V와 비교. **v가 V의 원소 중 하나면 TRUE**.\n```\nSELECT DISTINCT Pnumber\nFROM   PROJECT\nWHERE  Pnumber IN ( SELECT Pnumber\n                    FROM   PROJECT, DEPARTMENT, EMPLOYEE\n                    WHERE  Dnum = Dnumber AND Mgr_ssn = Ssn AND Lname = 'Smith' )\n   OR  Pnumber IN ( SELECT Pno\n                    FROM   WORKS_ON, EMPLOYEE\n                    WHERE  Essn = Ssn AND Lname = 'Smith' );\n```\n→ 질의 4(UNION 버전)와 같은 결과 {1, 2}. 안쪽 질의 V1, V2가 각각 프로젝트 번호의 집합.\n\n## ALL / ANY (SOME) {#all-any}\n\n**= ANY (= SOME)**: v가 V의 **어떤** 값과 같으면 TRUE → **IN과 동치**. **= ALL**: **모든** 값과 같으면 TRUE.\n- = 말고 >, >=, <, <=, <> 와도 결합 가능\n\n```\nSELECT Lname, Fname\nFROM   EMPLOYEE\nWHERE  Salary > ALL ( SELECT Salary FROM EMPLOYEE WHERE Dno = 5 );\n```\n→ 5번 부서 **모든** 사원보다 급여가 많은 사원. 5번 부서 급여 = {30000, 40000, 38000, 25000} → 40000 초과 → Wallace(43000), Borg(55000)\n\n> 함정: `> ANY`는 \"어느 하나보다라도 크면\" = 최솟값보다 크면. `> ALL`은 최댓값보다 커야 함. 그리고 실습 환경 **SQLite는 ALL/ANY를 지원 안 하니** `> (SELECT MAX(Salary) ...)` 로 바꿔 써.\n\n## 중첩 질의의 모호성과 상관 질의 {#correlated}\n\n여러 단계 중첩에서 바깥 FROM과 안쪽 FROM에 **같은 이름의 속성**이 있으면 모호해진다 → **별칭**으로 해결.\n\n**질의 16**: 부양가족 중에 **이름(first name)과 성별이 사원 자신과 같은** 사람이 있는 사원\n```\nSELECT E.Fname, E.Lname\nFROM   EMPLOYEE AS E\nWHERE  E.Ssn IN ( SELECT D.Essn\n                  FROM   DEPENDENT AS D\n                  WHERE  E.Fname = D.Dependent_name AND E.Sex = D.Sex );\n```\n- 안쪽 질의가 바깥의 E를 참조 → **상관 중첩 질의 (correlated nested query)**: 바깥 투플마다 안쪽 질의를 다시 평가하는 것처럼 동작\n- 안쪽에서 별칭 없이 Sex라고 쓰면 가장 가까운(안쪽) 테이블의 속성으로 해석된다\n- COMPANY 상태에서는 결과 0행 (그런 부양가족이 없음)\n\n> 시험 포인트: \"질의에서 참조하는 **모든 테이블에 별칭을** 붙이는 게 일반적으로 권장된다\" (교안 문장 그대로).", "html": "<section class=\"sec\" id=\"s-nested-in\"><h3>중첩 질의와 IN<\/h3><p><b>중첩 질의 (nested query)<\/b>: 다른 질의의 <b>WHERE 절 안에<\/b> 들어간 완전한 SELECT-FROM-WHERE 블록.<\/p>\n<ul><li>DB에 있는 값을 가져와서 WHERE 조건의 비교에 쓸 때 유용<\/li><li>결과는 투플의 (다중)집합 → 바깥 질의 = outer query, 안쪽 = inner query<\/li><\/ul>\n<p><b>IN<\/b>: 값 v를 값의 (다중)집합 V와 비교. <b>v가 V의 원소 중 하나면 TRUE<\/b>.<\/p>\n<pre class=\"code\">SELECT DISTINCT Pnumber\nFROM   PROJECT\nWHERE  Pnumber IN ( SELECT Pnumber\n                    FROM   PROJECT, DEPARTMENT, EMPLOYEE\n                    WHERE  Dnum = Dnumber AND Mgr_ssn = Ssn AND Lname = &#x27;Smith&#x27; )\n   OR  Pnumber IN ( SELECT Pno\n                    FROM   WORKS_ON, EMPLOYEE\n                    WHERE  Essn = Ssn AND Lname = &#x27;Smith&#x27; );<\/pre>\n<p>→ 질의 4(UNION 버전)와 같은 결과 {1, 2}. 안쪽 질의 V1, V2가 각각 프로젝트 번호의 집합.<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>안쪽 질의의 결과가 무슨 형태인지 먼저 생각하라고 함: 'Pnumber들의 집합'이 나오고, IN은 지금 투플의 Pnumber가 그 집합에 들어 있는지 확인한다. 두 조건을 OR로 이어서 둘 중 하나만 만족해도 결과에 들어감.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p3.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p3.jpg\" alt=\"05 p.3 · 중첩 질의: 바깥 질의 안에 안쪽 질의 두 개\" loading=\"lazy\"><\/button><figcaption>05 p.3 · 중첩 질의: 바깥 질의 안에 안쪽 질의 두 개<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-all-any\"><h3>ALL / ANY (SOME)<\/h3><p><b>= ANY (= SOME)<\/b>: v가 V의 <b>어떤<\/b> 값과 같으면 TRUE → <b>IN과 동치<\/b>. <b>= ALL<\/b>: <b>모든<\/b> 값과 같으면 TRUE.<\/p>\n<ul><li>= 말고 &gt;, &gt;=, &lt;, &lt;=, &lt;&gt; 와도 결합 가능<\/li><\/ul>\n<pre class=\"code\">SELECT Lname, Fname\nFROM   EMPLOYEE\nWHERE  Salary &gt; ALL ( SELECT Salary FROM EMPLOYEE WHERE Dno = 5 );<\/pre>\n<p>→ 5번 부서 <b>모든<\/b> 사원보다 급여가 많은 사원. 5번 부서 급여 = {30000, 40000, 38000, 25000} → 40000 초과 → Wallace(43000), Borg(55000)<\/p>\n<div class=\"callout trap\">함정: <code>&gt; ANY<\/code>는 \"어느 하나보다라도 크면\" = 최솟값보다 크면. <code>&gt; ALL<\/code>은 최댓값보다 커야 함. 그리고 실습 환경 <b>SQLite는 ALL/ANY를 지원 안 하니<\/b> <code>&gt; (SELECT MAX(Salary) ...)<\/code> 로 바꿔 써.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p5.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p5.jpg\" alt=\"05 p.5 · Salary &gt; ALL (5번 부서 급여), = ANY는 IN과 동치\" loading=\"lazy\"><\/button><figcaption>05 p.5 · Salary &gt; ALL (5번 부서 급여), = ANY는 IN과 동치<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-correlated\"><h3>중첩 질의의 모호성과 상관 질의<\/h3><p>여러 단계 중첩에서 바깥 FROM과 안쪽 FROM에 <b>같은 이름의 속성<\/b>이 있으면 모호해진다 → <b>별칭<\/b>으로 해결.<\/p>\n<p><b>질의 16<\/b>: 부양가족 중에 <b>이름(first name)과 성별이 사원 자신과 같은<\/b> 사람이 있는 사원<\/p>\n<pre class=\"code\">SELECT E.Fname, E.Lname\nFROM   EMPLOYEE AS E\nWHERE  E.Ssn IN ( SELECT D.Essn\n                  FROM   DEPENDENT AS D\n                  WHERE  E.Fname = D.Dependent_name AND E.Sex = D.Sex );<\/pre>\n<ul><li>안쪽 질의가 바깥의 E를 참조 → <b>상관 중첩 질의 (correlated nested query)<\/b>: 바깥 투플마다 안쪽 질의를 다시 평가하는 것처럼 동작<\/li><li>안쪽에서 별칭 없이 Sex라고 쓰면 가장 가까운(안쪽) 테이블의 속성으로 해석된다<\/li><li>COMPANY 상태에서는 결과 0행 (그런 부양가족이 없음)<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: \"질의에서 참조하는 <b>모든 테이블에 별칭을<\/b> 붙이는 게 일반적으로 권장된다\" (교안 문장 그대로).<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>질의가 복잡해질수록 조건이 헷갈리니까, 모든 테이블에 E, D, S 같은 별칭(투플 변수)을 붙이는 관례를 '습관으로 만들라'고 강조.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p6.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p6.jpg\" alt=\"05 p.6 · 질의 16: 바깥 E를 참조하는 안쪽 질의 (별칭으로 모호성 제거)\" loading=\"lazy\"><\/button><figcaption>05 p.6 · 질의 16: 바깥 E를 참조하는 안쪽 질의 (별칭으로 모호성 제거)<\/figcaption><\/figure><\/section>"}, {"id": "L5-2", "title": "EXISTS / NOT EXISTS · 나눗셈 질의", "src": "5-1 p.7–9", "secs": [{"id": "exists", "title": "EXISTS와 NOT EXISTS"}, {"id": "division-sql", "title": "\"모든 ~에 대해\" (나눗셈) 질의"}], "md": "## EXISTS와 NOT EXISTS {#exists}\n\n**중첩 질의 결과가 비었는지** 검사하는 불리언 함수. 보통 WHERE에서 씀.\n- **EXISTS (Q)**: Q의 결과에 투플이 **하나라도 있으면** TRUE\n- **NOT EXISTS (Q)**: Q의 결과가 **비어 있으면** TRUE\n\n**질의 6**: 부양가족이 **없는** 사원\n```\nSELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  NOT EXISTS ( SELECT * FROM DEPENDENT WHERE Ssn = Essn );\n```\n→ Zelaya, Narayan, English, Jabbar, Borg (5명)\n\n**부양가족이 하나 이상 있는 관리자**: 두 조건을 AND\n```\nSELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  EXISTS ( SELECT * FROM DEPENDENT  WHERE Ssn = Essn )\n  AND  EXISTS ( SELECT * FROM DEPARTMENT WHERE Ssn = Mgr_ssn );\n```\n→ Franklin Wong, Jennifer Wallace\n\n## \"모든 ~에 대해\" (나눗셈) 질의 {#division-sql}\n\n**연습 1**: 5번 부서가 통제하는 **모든** 프로젝트에서 일하는 사원의 이름\n```\nSELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  NOT EXISTS ( ( SELECT Pnumber FROM PROJECT WHERE Dnum = 5 )\n                    EXCEPT\n                    ( SELECT Pno FROM WORKS_ON WHERE Ssn = Essn ) );\n```\n읽는 법: (5번 부서 프로젝트 전체) − (이 사원이 일하는 프로젝트) = **빠진 프로젝트**. 빠진 게 **없으면**(NOT EXISTS) 전부 하는 것.\n- 예: 5번 부서 프로젝트 = {1, 2, 3}. A는 {1, 2, 4} → 차집합 {3} ≠ ∅ → 탈락. B는 {1, 2, 3, 4} → 차집합 ∅ → 선택\n- COMPANY 상태에서 5번 부서 프로젝트 = {1, 2, 3}인데 세 개 다 하는 사원이 없어서 결과는 **0행**\n\nEXCEPT 없이 NOT EXISTS 두 번으로도 쓸 수 있다 (\"이 사원이 안 하는 5번 부서 프로젝트가 존재하지 않는다\"):\n```\nSELECT E.Fname, E.Lname\nFROM   EMPLOYEE AS E\nWHERE  NOT EXISTS ( SELECT * FROM PROJECT AS P\n                    WHERE  P.Dnum = 5\n                      AND  NOT EXISTS ( SELECT * FROM WORKS_ON AS W\n                                        WHERE W.Essn = E.Ssn AND W.Pno = P.Pnumber ) );\n```\n\n> 함정: \"어떤\" 프로젝트에서 일하는 사원(EXISTS, IN)과 \"모든\" 프로젝트에서 일하는 사원(NOT EXISTS + EXCEPT)을 구별해. 문장에 **all**이 나오면 나눗셈 패턴.", "html": "<section class=\"sec\" id=\"s-exists\"><h3>EXISTS와 NOT EXISTS<\/h3><p><b>중첩 질의 결과가 비었는지<\/b> 검사하는 불리언 함수. 보통 WHERE에서 씀.<\/p>\n<ul><li><b>EXISTS (Q)<\/b>: Q의 결과에 투플이 <b>하나라도 있으면<\/b> TRUE<\/li><li><b>NOT EXISTS (Q)<\/b>: Q의 결과가 <b>비어 있으면<\/b> TRUE<\/li><\/ul>\n<p><b>질의 6<\/b>: 부양가족이 <b>없는<\/b> 사원<\/p>\n<pre class=\"code\">SELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  NOT EXISTS ( SELECT * FROM DEPENDENT WHERE Ssn = Essn );<\/pre>\n<p>→ Zelaya, Narayan, English, Jabbar, Borg (5명)<\/p>\n<p><b>부양가족이 하나 이상 있는 관리자<\/b>: 두 조건을 AND<\/p>\n<pre class=\"code\">SELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  EXISTS ( SELECT * FROM DEPENDENT  WHERE Ssn = Essn )\n  AND  EXISTS ( SELECT * FROM DEPARTMENT WHERE Ssn = Mgr_ssn );<\/pre>\n<p>→ Franklin Wong, Jennifer Wallace<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>NOT EXISTS 읽는 법: 안쪽 질의 결과가 비어 있지 않으면 그 사원은 부양가족이 있다는 뜻. 결과가 비었을 때만 NOT EXISTS가 참이 되어 그 사원이 나온다. '부양가족 있는 관리자'는 조건을 '관리자인 사원'과 '부양가족이 하나 이상인 사원' 두 부분으로 쪼개서 EXISTS 두 개를 AND로.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p7.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p7.jpg\" alt=\"05 p.7 · EXISTS (질의 16)와 NOT EXISTS (질의 6, 부양가족 없는 사원)\" loading=\"lazy\"><\/button><figcaption>05 p.7 · EXISTS (질의 16)와 NOT EXISTS (질의 6, 부양가족 없는 사원)<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p8.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p8.jpg\" alt=\"05 p.8 · EXISTS 두 개: 부양가족 있는 관리자 → Wong, Wallace\" loading=\"lazy\"><\/button><figcaption>05 p.8 · EXISTS 두 개: 부양가족 있는 관리자 → Wong, Wallace<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-division-sql\"><h3>\"모든 ~에 대해\" (나눗셈) 질의<\/h3><p><b>연습 1<\/b>: 5번 부서가 통제하는 <b>모든<\/b> 프로젝트에서 일하는 사원의 이름<\/p>\n<pre class=\"code\">SELECT Fname, Lname\nFROM   EMPLOYEE\nWHERE  NOT EXISTS ( ( SELECT Pnumber FROM PROJECT WHERE Dnum = 5 )\n                    EXCEPT\n                    ( SELECT Pno FROM WORKS_ON WHERE Ssn = Essn ) );<\/pre>\n<p>읽는 법: (5번 부서 프로젝트 전체) − (이 사원이 일하는 프로젝트) = <b>빠진 프로젝트<\/b>. 빠진 게 <b>없으면<\/b>(NOT EXISTS) 전부 하는 것.<\/p>\n<ul><li>예: 5번 부서 프로젝트 = {1, 2, 3}. A는 {1, 2, 4} → 차집합 {3} ≠ ∅ → 탈락. B는 {1, 2, 3, 4} → 차집합 ∅ → 선택<\/li><li>COMPANY 상태에서 5번 부서 프로젝트 = {1, 2, 3}인데 세 개 다 하는 사원이 없어서 결과는 <b>0행<\/b><\/li><\/ul>\n<p>EXCEPT 없이 NOT EXISTS 두 번으로도 쓸 수 있다 (\"이 사원이 안 하는 5번 부서 프로젝트가 존재하지 않는다\"):<\/p>\n<pre class=\"code\">SELECT E.Fname, E.Lname\nFROM   EMPLOYEE AS E\nWHERE  NOT EXISTS ( SELECT * FROM PROJECT AS P\n                    WHERE  P.Dnum = 5\n                      AND  NOT EXISTS ( SELECT * FROM WORKS_ON AS W\n                                        WHERE W.Essn = E.Ssn AND W.Pno = P.Pnumber ) );<\/pre>\n<div class=\"callout trap\">함정: \"어떤\" 프로젝트에서 일하는 사원(EXISTS, IN)과 \"모든\" 프로젝트에서 일하는 사원(NOT EXISTS + EXCEPT)을 구별해. 문장에 <b>all<\/b>이 나오면 나눗셈 패턴.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>문제를 천천히 읽으라고 강조: 5번 부서가 프로젝트를 여러 개(예: 5~7개) 통제하는데, 그중 '일부'가 아니라 '전부'에서 일하는 사원만 찾아야 한다. 칠판 예: 5번 부서 프로젝트 = {1, 2, 3}, 사원 A = {1, 2, 4}, 사원 B = {1, 2, 3, 4} → {1,2,3} − A = {3} (비어 있지 않음, 탈락), {1,2,3} − B = ∅ (선택). 'NOT EXISTS + EXCEPT'가 한 가지 풀이.<\/div><\/section>"}, {"id": "L5-3", "title": "조인 테이블 · NATURAL · INNER/OUTER", "src": "5-1 p.10–14", "secs": [{"id": "joined-table", "title": "조인 테이블"}, {"id": "natural-join-sql", "title": "NATURAL JOIN"}, {"id": "inner-outer", "title": "INNER JOIN과 OUTER JOIN"}], "md": "## 조인 테이블 {#joined-table}\n\n**조인 테이블 (joined table)**: **FROM 절에서** 조인 연산으로 만들어지는 테이블. WHERE에 선택 조건과 조인 조건이 섞이는 걸 피할 수 있다.\n```\nSELECT Fname, Lname, Address\nFROM   (EMPLOYEE JOIN DEPARTMENT ON Dno = Dnumber)\nWHERE  Dname = 'Research';\n```\n- 조인된 테이블 = 첫 테이블(EMPLOYEE)의 모든 속성 + 둘째 테이블(DEPARTMENT)의 모든 속성\n- WHERE에 `Dnumber = Dno`를 쓴 질의 2와 결과가 같다\n\n## NATURAL JOIN {#natural-join-sql}\n\n**같은 이름을 가진 속성 쌍마다 암묵적인 동등 조건**을 만든다 → 조인 조건을 쓰지 않음.\n- 이름이 다르면 먼저 **이름을 바꿔서** 맞춘다\n```\nSELECT Fname, Lname, Address\nFROM   (EMPLOYEE NATURAL JOIN\n        (DEPARTMENT AS DEPT (Dname, Dno, Mssn, Msdate)))\nWHERE  Dname = 'Research';\n```\n- DEPARTMENT의 Dnumber를 Dno로 바꿔서 EMPLOYEE.Dno와 이름을 맞춤\n- 조인 속성은 결과에 **한 번만** 나온다\n\n## INNER JOIN과 OUTER JOIN {#inner-outer}\n\n**내부 조인 (inner join)**: 기본 조인. **다른 릴레이션에 짝이 있는 투플만** 결과에 들어감.\n```\nSELECT E.Lname AS Employee_name, S.Lname AS Supervisor_name\nFROM   EMPLOYEE AS E, EMPLOYEE AS S\nWHERE  E.Super_ssn = S.Ssn;\n```\n→ 7행. Super_ssn이 **NULL인 Borg는 빠진다**.\n\n**외부 조인 (outer join)**: 짝이 없는 투플도 결과에 넣고, 상대 속성은 **NULL로 채움(padding)**.\n```\nSELECT E.Lname AS Employee_name, S.Lname AS Supervisor_name\nFROM   (EMPLOYEE AS E LEFT OUTER JOIN EMPLOYEE AS S ON E.Super_ssn = S.Ssn);\n```\n→ 8행. Borg의 Supervisor_name = NULL.\n\n| 조인 | 결과에 들어가는 투플 |\n|---|---|\n| INNER JOIN | 조인 조건을 만족하는 쌍만 |\n| LEFT OUTER JOIN | **왼쪽 테이블의 모든 투플** (짝 없으면 오른쪽 속성 NULL) |\n| RIGHT OUTER JOIN | **오른쪽 테이블의 모든 투플** |\n| FULL OUTER JOIN | 양쪽 모든 투플 |\n\n> 함정: OUTER JOIN에서 \"짝 없는 것만\" 고르려면 `WHERE B.KEY IS NULL`을 덧붙인다 (교안 p.14 벤다이어그램 아래줄). NULL 비교는 `= NULL`이 아니라 **IS NULL**.", "html": "<section class=\"sec\" id=\"s-joined-table\"><h3>조인 테이블<\/h3><p><b>조인 테이블 (joined table)<\/b>: <b>FROM 절에서<\/b> 조인 연산으로 만들어지는 테이블. WHERE에 선택 조건과 조인 조건이 섞이는 걸 피할 수 있다.<\/p>\n<pre class=\"code\">SELECT Fname, Lname, Address\nFROM   (EMPLOYEE JOIN DEPARTMENT ON Dno = Dnumber)\nWHERE  Dname = &#x27;Research&#x27;;<\/pre>\n<ul><li>조인된 테이블 = 첫 테이블(EMPLOYEE)의 모든 속성 + 둘째 테이블(DEPARTMENT)의 모든 속성<\/li><li>WHERE에 <code>Dnumber = Dno<\/code>를 쓴 질의 2와 결과가 같다<\/li><\/ul><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>Dname = 'Research'는 선택 조건, Dnumber = Dno는 조인 조건. 조인 조건을 FROM 절의 JOIN ... ON으로 명시적으로 쓸 수 있고, 결과는 WHERE에 쓴 것과 같다.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p10.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p10.jpg\" alt=\"05 p.10 · FROM 절의 EMPLOYEE JOIN DEPARTMENT ON Dno = Dnumber\" loading=\"lazy\"><\/button><figcaption>05 p.10 · FROM 절의 EMPLOYEE JOIN DEPARTMENT ON Dno = Dnumber<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-natural-join-sql\"><h3>NATURAL JOIN<\/h3><p><b>같은 이름을 가진 속성 쌍마다 암묵적인 동등 조건<\/b>을 만든다 → 조인 조건을 쓰지 않음.<\/p>\n<ul><li>이름이 다르면 먼저 <b>이름을 바꿔서<\/b> 맞춘다<\/li><\/ul>\n<pre class=\"code\">SELECT Fname, Lname, Address\nFROM   (EMPLOYEE NATURAL JOIN\n        (DEPARTMENT AS DEPT (Dname, Dno, Mssn, Msdate)))\nWHERE  Dname = &#x27;Research&#x27;;<\/pre>\n<ul><li>DEPARTMENT의 Dnumber를 Dno로 바꿔서 EMPLOYEE.Dno와 이름을 맞춤<\/li><li>조인 속성은 결과에 <b>한 번만<\/b> 나온다<\/li><\/ul><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>NATURAL JOIN은 이름이 같은 속성 쌍을 조인 속성으로 가정한다. DEPARTMENT를 DEPT(Dname, Dno, Mssn, Msdate)로 별칭을 주면서 Dnumber를 Dno로 바꿔야 EMPLOYEE.Dno와 이름이 맞아서 자연 조인이 된다.<\/div><\/section>\n<section class=\"sec\" id=\"s-inner-outer\"><h3>INNER JOIN과 OUTER JOIN<\/h3><p><b>내부 조인 (inner join)<\/b>: 기본 조인. <b>다른 릴레이션에 짝이 있는 투플만<\/b> 결과에 들어감.<\/p>\n<pre class=\"code\">SELECT E.Lname AS Employee_name, S.Lname AS Supervisor_name\nFROM   EMPLOYEE AS E, EMPLOYEE AS S\nWHERE  E.Super_ssn = S.Ssn;<\/pre>\n<p>→ 7행. Super_ssn이 <b>NULL인 Borg는 빠진다<\/b>.<\/p>\n<p><b>외부 조인 (outer join)<\/b>: 짝이 없는 투플도 결과에 넣고, 상대 속성은 <b>NULL로 채움(padding)<\/b>.<\/p>\n<pre class=\"code\">SELECT E.Lname AS Employee_name, S.Lname AS Supervisor_name\nFROM   (EMPLOYEE AS E LEFT OUTER JOIN EMPLOYEE AS S ON E.Super_ssn = S.Ssn);<\/pre>\n<p>→ 8행. Borg의 Supervisor_name = NULL.<\/p>\n<div class=\"tblw\"><table><thead><tr><th>조인<\/th><th>결과에 들어가는 투플<\/th><\/tr><\/thead><tbody><tr><td>INNER JOIN<\/td><td>조인 조건을 만족하는 쌍만<\/td><\/tr><tr><td>LEFT OUTER JOIN<\/td><td><b>왼쪽 테이블의 모든 투플<\/b> (짝 없으면 오른쪽 속성 NULL)<\/td><\/tr><tr><td>RIGHT OUTER JOIN<\/td><td><b>오른쪽 테이블의 모든 투플<\/b><\/td><\/tr><tr><td>FULL OUTER JOIN<\/td><td>양쪽 모든 투플<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout trap\">함정: OUTER JOIN에서 \"짝 없는 것만\" 고르려면 <code>WHERE B.KEY IS NULL<\/code>을 덧붙인다 (교안 p.14 벤다이어그램 아래줄). NULL 비교는 <code>= NULL<\/code>이 아니라 <b>IS NULL<\/b>.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>Super_ssn = Ssn 자기 조인에서 James Borg는 Super_ssn이 없어서(NULL) 내부 조인 결과에 안 나온다. 상사가 없는 사원까지 보고 싶으면 LEFT OUTER JOIN. 어떤 조인을 쓸지는 응용 상황에 따라 고른다.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p13.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p13.jpg\" alt=\"05 p.13 · LEFT OUTER JOIN: Borg도 결과에 (상사 NULL)\" loading=\"lazy\"><\/button><figcaption>05 p.13 · LEFT OUTER JOIN: Borg도 결과에 (상사 NULL)<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p14.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p14.jpg\" alt=\"05 p.14 · 내부·외부 조인 벤다이어그램\" loading=\"lazy\"><\/button><figcaption>05 p.14 · 내부·외부 조인 벤다이어그램<\/figcaption><\/figure><\/section>"}, {"id": "L5-4", "title": "집계 함수 · GROUP BY · HAVING", "src": "5-1 p.15–22, 48", "secs": [{"id": "aggregate", "title": "집계 함수"}, {"id": "count-null", "title": "COUNT와 NULL · 중첩 질의에서의 집계"}, {"id": "group-by", "title": "GROUP BY"}, {"id": "having", "title": "HAVING"}], "md": "## 집계 함수 {#aggregate}\n\n**집계 함수 (aggregate function)**: 여러 투플의 정보를 **투플 하나짜리 요약**으로. 주로 SELECT나 HAVING에서 씀.\n- **COUNT**: 투플 수 또는 값의 수\n- **SUM, MAX, MIN, AVG**: 숫자 값의 (다중)집합에 적용\n\n**질의 19**: 전체 사원의 급여 합·최대·최소·평균\n```\nSELECT SUM(Salary), MAX(Salary), MIN(Salary), AVG(Salary)\nFROM   EMPLOYEE;\n```\n→ 281000, 55000, 25000, 35125\n\n**질의 20**: Research 부서만\n```\nSELECT SUM(Salary), MAX(Salary), MIN(Salary), AVG(Salary)\nFROM   (EMPLOYEE JOIN DEPARTMENT ON Dno = Dnumber)\nWHERE  Dname = 'Research';\n```\n→ 133000, 40000, 25000, 33250\n\n## COUNT와 NULL · 중첩 질의에서의 집계 {#count-null}\n\n- **COUNT(*)**: 결과의 **행(투플) 수**. 질의 21 `SELECT COUNT(*) FROM EMPLOYEE;` → 8, 질의 22 Research만 → 4\n- **COUNT(속성)**: 그 속성의 **값** 수. **NULL은 세지 않는다**. 예) `COUNT(Super_ssn)` → 7\n- **COUNT(DISTINCT Salary)**: 서로 다른 급여 값의 수 → 6 (질의 23)\n- 집계 결과는 값 하나라서 **조건의 일부**로 쓸 수 있다:\n```\nSELECT Lname, Fname\nFROM   EMPLOYEE\nWHERE  ( SELECT COUNT(*) FROM DEPENDENT WHERE Ssn = Essn ) >= 2;\n```\n→ 부양가족이 2명 이상: Smith(3명), Wong(3명)\n\n## GROUP BY {#group-by}\n\n**그룹화**: 릴레이션의 투플을 **겹치지 않는 부분집합(그룹)** 으로 나눠서 그룹마다 집계 함수를 적용.\n- **그룹화 속성 (grouping attribute)**: 그룹을 나누는 기준. 같은 그룹 = 그룹화 속성 값이 같은 투플들\n- **GROUP BY** 절에 지정. 그룹화 속성은 SELECT에도 나와야 결과에서 어느 그룹인지 알 수 있다\n\n**질의 24**: 부서별 부서 번호, 사원 수, 평균 급여\n```\nSELECT   Dno, COUNT(*), AVG(Salary)\nFROM     EMPLOYEE\nGROUP BY Dno;\n```\n→ (5, 4, 33250), (4, 3, 31000), (1, 1, 55000)\n\n**질의 25**: 프로젝트별 번호, 이름, 일하는 사원 수\n```\nSELECT   Pnumber, Pname, COUNT(*)\nFROM     PROJECT, WORKS_ON\nWHERE    Pnumber = Pno\nGROUP BY Pnumber, Pname;\n```\n→ ProductX 2, ProductY 3, ProductZ 2, Computerization 3, Reorganization 3, Newbenefits 3\n\n> 함정: GROUP BY를 쓰면 SELECT에는 **그룹화 속성과 집계 함수만** 올 수 있다. 그룹마다 값이 하나로 정해지지 않는 속성(예: Dno로 묶었는데 Lname)을 SELECT에 쓰면 안 된다.\n\n## HAVING {#having}\n\n**HAVING**: 그룹의 **요약 정보에 대한 조건**. GROUP BY와 함께 씀. 조건을 만족하는 **그룹만** 결과에.\n\n**질의 26**: 사원이 **두 명 넘게** 일하는 프로젝트마다 번호, 이름, 사원 수\n```\nSELECT   Pnumber, Pname, COUNT(*)\nFROM     PROJECT, WORKS_ON\nWHERE    Pnumber = Pno\nGROUP BY Pnumber, Pname\nHAVING   COUNT(*) > 2;\n```\n→ ProductY, Computerization, Reorganization, Newbenefits (각 3명)\n\n**연습 2**: 평균 급여가 $30,000 넘는 부서마다 부서 이름과 사원 수\n```\nSELECT   D.Dname, COUNT(*)\nFROM     EMPLOYEE AS E, DEPARTMENT AS D\nWHERE    E.Dno = D.Dnumber\nGROUP BY D.Dname\nHAVING   AVG(E.Salary) > 30000;\n```\n→ Research 4, Administration 3, Headquarters 1 (교안 풀이는 GROUP BY E.Dno로 묶음. 표준 SQL에서는 SELECT의 D.Dname도 GROUP BY에 있어야 안전)\n\n> 시험 포인트: **WHERE = 투플 조건 (그룹 만들기 전)**, **HAVING = 그룹 조건 (집계 후)**. \"평균이 3만 넘는\"처럼 집계에 대한 조건은 WHERE에 못 쓴다.\n\n**실행 순서**: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY", "html": "<section class=\"sec\" id=\"s-aggregate\"><h3>집계 함수<\/h3><p><b>집계 함수 (aggregate function)<\/b>: 여러 투플의 정보를 <b>투플 하나짜리 요약<\/b>으로. 주로 SELECT나 HAVING에서 씀.<\/p>\n<ul><li><b>COUNT<\/b>: 투플 수 또는 값의 수<\/li><li><b>SUM, MAX, MIN, AVG<\/b>: 숫자 값의 (다중)집합에 적용<\/li><\/ul>\n<p><b>질의 19<\/b>: 전체 사원의 급여 합·최대·최소·평균<\/p>\n<pre class=\"code\">SELECT SUM(Salary), MAX(Salary), MIN(Salary), AVG(Salary)\nFROM   EMPLOYEE;<\/pre>\n<p>→ 281000, 55000, 25000, 35125<\/p>\n<p><b>질의 20<\/b>: Research 부서만<\/p>\n<pre class=\"code\">SELECT SUM(Salary), MAX(Salary), MIN(Salary), AVG(Salary)\nFROM   (EMPLOYEE JOIN DEPARTMENT ON Dno = Dnumber)\nWHERE  Dname = &#x27;Research&#x27;;<\/pre>\n<p>→ 133000, 40000, 25000, 33250<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>집계 함수가 없다면 급여를 전부 읽어 와서 Python이나 C로 for/while 루프를 돌려 합·최대·평균을 직접 계산해야 한다. 집계 함수로 한 줄에 해결. 결과: 최대 55,000, 최소 25,000, 평균 = 합 ÷ 8.<\/div><\/section>\n<section class=\"sec\" id=\"s-count-null\"><h3>COUNT와 NULL · 중첩 질의에서의 집계<\/h3><ul><li><b>COUNT(*)<\/b>: 결과의 <b>행(투플) 수<\/b>. 질의 21 <code>SELECT COUNT(*) FROM EMPLOYEE;<\/code> → 8, 질의 22 Research만 → 4<\/li><li><b>COUNT(속성)<\/b>: 그 속성의 <b>값<\/b> 수. <b>NULL은 세지 않는다<\/b>. 예) <code>COUNT(Super_ssn)<\/code> → 7<\/li><li><b>COUNT(DISTINCT Salary)<\/b>: 서로 다른 급여 값의 수 → 6 (질의 23)<\/li><li>집계 결과는 값 하나라서 <b>조건의 일부<\/b>로 쓸 수 있다:<\/li><\/ul>\n<pre class=\"code\">SELECT Lname, Fname\nFROM   EMPLOYEE\nWHERE  ( SELECT COUNT(*) FROM DEPENDENT WHERE Ssn = Essn ) &gt;= 2;<\/pre>\n<p>→ 부양가족이 2명 이상: Smith(3명), Wong(3명)<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>COUNT(*)를 안 쓰면 투플 8개가 그대로 나오지만, COUNT(*)를 쓰면 숫자 하나(8)만 나온다. Research는 4. 서로 다른 급여 값은 25,000이 겹쳐서 6. 집계 결과는 값 하나라서 '부양가족 2명 이상'처럼 조건의 일부로 쓸 수 있다: 안쪽 질의가 사원마다 부양가족 수 하나를 돌려주고 그걸 2와 비교.<\/div><\/section>\n<section class=\"sec\" id=\"s-group-by\"><h3>GROUP BY<\/h3><p><b>그룹화<\/b>: 릴레이션의 투플을 <b>겹치지 않는 부분집합(그룹)<\/b> 으로 나눠서 그룹마다 집계 함수를 적용.<\/p>\n<ul><li><b>그룹화 속성 (grouping attribute)<\/b>: 그룹을 나누는 기준. 같은 그룹 = 그룹화 속성 값이 같은 투플들<\/li><li><b>GROUP BY<\/b> 절에 지정. 그룹화 속성은 SELECT에도 나와야 결과에서 어느 그룹인지 알 수 있다<\/li><\/ul>\n<p><b>질의 24<\/b>: 부서별 부서 번호, 사원 수, 평균 급여<\/p>\n<pre class=\"code\">SELECT   Dno, COUNT(*), AVG(Salary)\nFROM     EMPLOYEE\nGROUP BY Dno;<\/pre>\n<p>→ (5, 4, 33250), (4, 3, 31000), (1, 1, 55000)<\/p>\n<p><b>질의 25<\/b>: 프로젝트별 번호, 이름, 일하는 사원 수<\/p>\n<pre class=\"code\">SELECT   Pnumber, Pname, COUNT(*)\nFROM     PROJECT, WORKS_ON\nWHERE    Pnumber = Pno\nGROUP BY Pnumber, Pname;<\/pre>\n<p>→ ProductX 2, ProductY 3, ProductZ 2, Computerization 3, Reorganization 3, Newbenefits 3<\/p>\n<div class=\"callout trap\">함정: GROUP BY를 쓰면 SELECT에는 <b>그룹화 속성과 집계 함수만<\/b> 올 수 있다. 그룹마다 값이 하나로 정해지지 않는 속성(예: Dno로 묶었는데 Lname)을 SELECT에 쓰면 안 된다.<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>그룹화는 그룹마다 따로 요약할 때 쓴다. Dno로 묶으면 5번 부서, 4번 부서, 1번 부서 세 그룹이 생기고 그룹마다 COUNT, AVG를 계산.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p19.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p19.jpg\" alt=\"05 p.19 · 질의 24: Dno로 그룹화\" loading=\"lazy\"><\/button><figcaption>05 p.19 · 질의 24: Dno로 그룹화<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p20.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p20.jpg\" alt=\"05 p.20 · 질의 25: 프로젝트별 사원 수\" loading=\"lazy\"><\/button><figcaption>05 p.20 · 질의 25: 프로젝트별 사원 수<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-having\"><h3>HAVING<\/h3><p><b>HAVING<\/b>: 그룹의 <b>요약 정보에 대한 조건<\/b>. GROUP BY와 함께 씀. 조건을 만족하는 <b>그룹만<\/b> 결과에.<\/p>\n<p><b>질의 26<\/b>: 사원이 <b>두 명 넘게<\/b> 일하는 프로젝트마다 번호, 이름, 사원 수<\/p>\n<pre class=\"code\">SELECT   Pnumber, Pname, COUNT(*)\nFROM     PROJECT, WORKS_ON\nWHERE    Pnumber = Pno\nGROUP BY Pnumber, Pname\nHAVING   COUNT(*) &gt; 2;<\/pre>\n<p>→ ProductY, Computerization, Reorganization, Newbenefits (각 3명)<\/p>\n<p><b>연습 2<\/b>: 평균 급여가 $30,000 넘는 부서마다 부서 이름과 사원 수<\/p>\n<pre class=\"code\">SELECT   D.Dname, COUNT(*)\nFROM     EMPLOYEE AS E, DEPARTMENT AS D\nWHERE    E.Dno = D.Dnumber\nGROUP BY D.Dname\nHAVING   AVG(E.Salary) &gt; 30000;<\/pre>\n<p>→ Research 4, Administration 3, Headquarters 1 (교안 풀이는 GROUP BY E.Dno로 묶음. 표준 SQL에서는 SELECT의 D.Dname도 GROUP BY에 있어야 안전)<\/p>\n<div class=\"callout exam\">시험 포인트: <b>WHERE = 투플 조건 (그룹 만들기 전)<\/b>, <b>HAVING = 그룹 조건 (집계 후)<\/b>. \"평균이 3만 넘는\"처럼 집계에 대한 조건은 WHERE에 못 쓴다.<\/div>\n<p><b>실행 순서<\/b>: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY<\/p><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>GROUP BY는 그룹별 요약, HAVING은 조건을 만족하는 그룹만 요약. 연습 2 풀이 때 'EMPLOYEE만으로 안 되고 왜 DEPARTMENT가 필요하냐'고 물음 → EMPLOYEE엔 부서 번호만 있고 부서 '이름'이 없어서 조인해야 한다. 평균 조건(&gt; 30000)은 HAVING에.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p21.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p21.jpg\" alt=\"05 p.21 · 질의 26: HAVING COUNT(*) &gt; 2\" loading=\"lazy\"><\/button><figcaption>05 p.21 · 질의 26: HAVING COUNT(*) &gt; 2<\/figcaption><\/figure><\/section>"}, {"id": "L5-5", "title": "Assertion · Trigger", "src": "5-1 p.24–29", "secs": [{"id": "assertion", "title": "Assertion"}, {"id": "trigger-eca", "title": "Trigger (ECA 규칙)"}], "md": "## Assertion {#assertion}\n\n**내장 제약(키, 개체 무결성, 참조 무결성)으로 표현할 수 없는 일반 제약**을 지정.\n- 예) 사원의 급여는 그 사원이 속한 부서 관리자의 급여보다 많으면 안 된다\n```\nCREATE ASSERTION SALARY_CONSTRAINT\nCHECK ( NOT EXISTS ( SELECT *\n                     FROM   EMPLOYEE E, EMPLOYEE M, DEPARTMENT D\n                     WHERE  E.Salary > M.Salary\n                       AND  E.Dno = D.Dnumber\n                       AND  D.Mgr_ssn = M.Ssn ) );\n```\n- **CHECK** 뒤 괄호 안의 조건은 **모든 DB 상태에서 참**이어야 한다\n- 관례: 원하는 조건을 **위반하는 투플을 고르는 질의**를 쓰고 **NOT EXISTS**로 감싼다 → 결과가 비면 TRUE(만족), 비지 않으면 FALSE(위반)\n\n## Trigger (ECA 규칙) {#trigger-eca}\n\n**특정 이벤트가 일어나고 조건이 맞을 때 자동으로 실행할 동작**을 지정. **ECA (Event, Condition, Action) 규칙**.\n```\nCREATE TRIGGER SALARY_VIOLATION\nBEFORE INSERT OR UPDATE OF SALARY, SUPERVISOR_SSN\n    ON EMPLOYEE\nFOR EACH ROW\n    WHEN ( NEW.SALARY > ( SELECT SALARY FROM EMPLOYEE\n                          WHERE SSN = NEW.SUPERVISOR_SSN ) )\n        INFORM_SUPERVISOR(NEW.Supervisor_ssn, NEW.Ssn);\n```\n- **Event**: DB에 명시적으로 적용되는 갱신 연산 (새 사원 삽입, 급여 변경, 상사 변경). **BEFORE / AFTER**로 그 연산 전/후에 실행. 가능한 이벤트를 **모두** 고려해야 함\n- **Condition**: 이벤트가 일어난 뒤 동작을 실행할지 결정. **WHEN 절**. 선택 사항. 참일 때만 동작 실행\n- **Action**: 자동 실행할 동작 = SQL 문장들, DB 트랜잭션, 또는 외부 프로그램 (예: 외부 저장 프로시저 INFORM_SUPERVISOR)\n- 용도: (1) DB 일관성 유지, (2) DB 갱신 모니터링, (3) 유도 데이터 자동 갱신\n- 예) 사원의 출장비가 한도를 넘으면 관리자에게 알림\n\n> 함정: Assertion = **제약** (위반하면 연산을 막음), Trigger = **동작** (조건이 맞으면 무언가를 실행). 교안 예는 둘 다 급여 비교지만 하나는 \"막기\", 하나는 \"알리기\".", "html": "<section class=\"sec\" id=\"s-assertion\"><h3>Assertion<\/h3><p><b>내장 제약(키, 개체 무결성, 참조 무결성)으로 표현할 수 없는 일반 제약<\/b>을 지정.<\/p>\n<ul><li>예) 사원의 급여는 그 사원이 속한 부서 관리자의 급여보다 많으면 안 된다<\/li><\/ul>\n<pre class=\"code\">CREATE ASSERTION SALARY_CONSTRAINT\nCHECK ( NOT EXISTS ( SELECT *\n                     FROM   EMPLOYEE E, EMPLOYEE M, DEPARTMENT D\n                     WHERE  E.Salary &gt; M.Salary\n                       AND  E.Dno = D.Dnumber\n                       AND  D.Mgr_ssn = M.Ssn ) );<\/pre>\n<ul><li><b>CHECK<\/b> 뒤 괄호 안의 조건은 <b>모든 DB 상태에서 참<\/b>이어야 한다<\/li><li>관례: 원하는 조건을 <b>위반하는 투플을 고르는 질의<\/b>를 쓰고 <b>NOT EXISTS<\/b>로 감싼다 → 결과가 비면 TRUE(만족), 비지 않으면 FALSE(위반)<\/li><\/ul><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>CREATE ASSERTION 이름 CHECK (조건). 관례는 '확인하고 싶은 조건을 위반하는 투플을 찾는 질의'를 쓰고 NOT EXISTS로 감싸는 것. 사원 급여가 관리자 급여보다 크면 위반 → 그 질의 결과가 비어 있지 않으면 문제가 있다는 뜻.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p25.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p25.jpg\" alt=\"05 p.25 · CREATE ASSERTION SALARY_CONSTRAINT (위반 질의를 NOT EXISTS로)\" loading=\"lazy\"><\/button><figcaption>05 p.25 · CREATE ASSERTION SALARY_CONSTRAINT (위반 질의를 NOT EXISTS로)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-trigger-eca\"><h3>Trigger (ECA 규칙)<\/h3><p><b>특정 이벤트가 일어나고 조건이 맞을 때 자동으로 실행할 동작<\/b>을 지정. <b>ECA (Event, Condition, Action) 규칙<\/b>.<\/p>\n<pre class=\"code\">CREATE TRIGGER SALARY_VIOLATION\nBEFORE INSERT OR UPDATE OF SALARY, SUPERVISOR_SSN\n    ON EMPLOYEE\nFOR EACH ROW\n    WHEN ( NEW.SALARY &gt; ( SELECT SALARY FROM EMPLOYEE\n                          WHERE SSN = NEW.SUPERVISOR_SSN ) )\n        INFORM_SUPERVISOR(NEW.Supervisor_ssn, NEW.Ssn);<\/pre>\n<ul><li><b>Event<\/b>: DB에 명시적으로 적용되는 갱신 연산 (새 사원 삽입, 급여 변경, 상사 변경). <b>BEFORE / AFTER<\/b>로 그 연산 전/후에 실행. 가능한 이벤트를 <b>모두<\/b> 고려해야 함<\/li><li><b>Condition<\/b>: 이벤트가 일어난 뒤 동작을 실행할지 결정. <b>WHEN 절<\/b>. 선택 사항. 참일 때만 동작 실행<\/li><li><b>Action<\/b>: 자동 실행할 동작 = SQL 문장들, DB 트랜잭션, 또는 외부 프로그램 (예: 외부 저장 프로시저 INFORM_SUPERVISOR)<\/li><li>용도: (1) DB 일관성 유지, (2) DB 갱신 모니터링, (3) 유도 데이터 자동 갱신<\/li><li>예) 사원의 출장비가 한도를 넘으면 관리자에게 알림<\/li><\/ul>\n<div class=\"callout trap\">함정: Assertion = <b>제약<\/b> (위반하면 연산을 막음), Trigger = <b>동작<\/b> (조건이 맞으면 무언가를 실행). 교안 예는 둘 다 급여 비교지만 하나는 \"막기\", 하나는 \"알리기\".<\/div><div class=\"callout prof\"><b>수업 메모<\/b> <span class=\"src\">05주-1<\/span><br>트리거 = Event, Condition, Action 세 요소. Event는 조건을 깰 가능성이 있는 갱신 연산(새 사원 삽입, 급여 변경, 상사 변경)이고 BEFORE/AFTER로 시점 지정. Condition은 WHEN 절, 참이 아니면 동작은 건너뜀. Action은 SQL 문장, 트랜잭션, 외부 프로그램 무엇이든 가능 (예: 메신저로 상사에게 알림).<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p26.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p26.jpg\" alt=\"05 p.26 · CREATE TRIGGER SALARY_VIOLATION (ECA)\" loading=\"lazy\"><\/button><figcaption>05 p.26 · CREATE TRIGGER SALARY_VIOLATION (ECA)<\/figcaption><\/figure><\/section>"}, {"id": "L5-6", "title": "뷰 (View)", "src": "5-1 p.30–47", "secs": [{"id": "view-def", "title": "뷰의 정의와 쓰임"}, {"id": "view-impl", "title": "뷰 구현: 질의 수정 vs 실체화"}, {"id": "view-update", "title": "뷰 갱신"}, {"id": "view-auth", "title": "뷰를 이용한 권한 부여"}], "md": "## 뷰의 정의와 쓰임 {#view-def}\n\n**뷰 (view)**: 기본 테이블(base table)에서 유도된 **가상 테이블**. 물리적으로 존재하지 않을 수도 있다.\n- 검색: 제한 없음. 갱신: 보통 제한됨 (사실상 읽기 전용)\n- 쓰는 이유: **복잡한 질의를 단순화**. 여러 테이블 조인·집계를 자주 쓰면 뷰로 만들어 두고 **단일 테이블 질의**처럼 쓴다\n\n```\nCREATE VIEW WORKS_ON1\nAS SELECT Fname, Lname, Pname, Hours\n   FROM   EMPLOYEE, PROJECT, WORKS_ON\n   WHERE  Ssn = Essn AND Pno = Pnumber;\n\nCREATE VIEW DEPT_INFO (Dept_name, No_of_emps, Total_sal)\nAS SELECT   Dname, COUNT(*), SUM(Salary)\n   FROM     DEPARTMENT, EMPLOYEE\n   WHERE    Dnumber = Dno\n   GROUP BY Dname;\n```\n- 속성 이름을 안 주면 정의 질의의 속성 이름을 그대로 씀 (WORKS_ON1), 명시할 수도 있음 (DEPT_INFO)\n- 뷰 질의: `SELECT Fname, Lname FROM WORKS_ON1 WHERE Pname = 'ProductX';` → 매번 세 테이블을 조인할 필요 없음\n- **DROP VIEW WORKS_ON1;** → 정의 테이블에는 영향 없음\n\n## 뷰 구현: 질의 수정 vs 실체화 {#view-impl}\n\n뷰는 **항상 최신(up-to-date)** 이어야 한다 → 정의 테이블이 바뀌면 DBMS가 뷰에 반영할 책임.\n\n| 방식 | 내용 | 특징 |\n|---|---|---|\n| **질의 수정 (query modification)** | 뷰 질의를 **기본 테이블에 대한 질의로 변환**. 뷰를 물리적으로 유지하지 않음 | 사용자는 편하지만 DB 시스템엔 비효율 (복잡한 뷰를 매번 다시 계산) |\n| **뷰 실체화 (view materialization)** | 뷰가 처음 질의될 때 **물리적으로 뷰 테이블을 만들어** 한동안 유지 | 이후 뷰 질의가 자주 온다는 가정. **추가 저장 공간**. 정의 테이블이 바뀌면 **점진적 갱신(incremental update)** |\n\n실체화된 뷰를 **언제** 갱신하나:\n- **즉시 갱신 (immediate)**: 기본 테이블이 바뀌자마자. 항상 최신이지만 불필요하고 비효율적일 때가 있음\n- **주기적 갱신 (periodic)**: 주기적으로. 뷰 질의가 최신이 아닌 결과를 받을 수 있음\n- **지연 갱신 (lazy)**: 뷰 질의가 필요할 때. 질의가 오기 전까진 최신이 아님\n\n일정 기간 질의되지 않으면 실체화된 뷰를 지우고, 나중에 필요하면 처음부터 다시 계산.\n\n## 뷰 갱신 {#view-update}\n\n뷰에 대한 검색은 언제나 가능하지만, INSERT/DELETE/UPDATE는 많은 경우 불가능.\n\n**갱신 가능 조건: 뷰 갱신을 이루는 기본 릴레이션 갱신이 딱 하나뿐일 때.**\n- **단일 테이블 + 집계 없음** → 기본 테이블 갱신 하나로 매핑 → **허용**. 단 뷰 속성에 (1) 기본 릴레이션의 **PK**, (2) DEFAULT가 없는 **NOT NULL 속성 전부**가 들어 있어야 함 (뷰로 투플을 넣을 때 그 값들이 비면 안 되니까)\n- **조인 (여러 테이블)** → 여러 방식으로 매핑될 수 있어 **일반적으로 불가**\n- **그룹화·집계** → 그 갱신이 **말이 안 됨** → **불가**\n\n예 1 (여러 해석): `UPDATE WORKS_ON1 SET Pname = 'ProductY' WHERE Lname = 'Smith' AND Fname = 'John' AND Pname = 'ProductX';`\n- 해석 a: Smith가 일하는 프로젝트를 바꿈 → WORKS_ON의 Pno를 ProductY 번호로 (의도대로)\n- 해석 b: PROJECT의 'ProductX' 이름을 'ProductY'로 → 뷰 결과는 같아 보이지만 **부작용**: ProductX에서 일하던 모든 투플이 바뀜\n\n예 2 (불가능): `UPDATE DEPT_INFO SET Total_sal = 100000 WHERE Dname = 'Research';` → Total_sal은 SUM으로 **계산된 값**, 물리적으로 저장 안 됨 → 의미 없음\n\n## 뷰를 이용한 권한 부여 {#view-auth}\n\n뷰로 권한 없는 사용자에게 **특정 속성이나 투플을 숨길** 수 있다.\n```\nCREATE VIEW DEPT5EMP AS\nSELECT * FROM EMPLOYEE WHERE Dno = 5;            -- 투플 제한\n\nCREATE VIEW BASIC_EMP_DATA AS\nSELECT Fname, Lname, Address FROM EMPLOYEE;      -- 속성 제한\n```\n- DEPT5EMP: 5번 부서 관리자는 5번 부서 사원 정보만 보게 함. 사용자에게 EMPLOYEE가 아니라 **뷰에 대한 질의 권한만** 부여\n- BASIC_EMP_DATA: 일반 사원은 이름과 주소만\n\n교안 연습 3·4 풀이:\n```\nCREATE VIEW DEPT_INFO (DeptName, MgrFname, MgrLname, MgrSalary)\nAS SELECT D.Dname, E.Fname, E.Lname, E.Salary\n   FROM   DEPARTMENT AS D, EMPLOYEE AS E\n   WHERE  D.Mgr_ssn = E.Ssn;                      -- 부서와 관리자 정보\n\nCREATE VIEW ProjectInfo (Pname, Dname, NumEmployees, TotalHours)\nAS SELECT   P.Pname, D.Dname, COUNT(*), SUM(W.Hours)\n   FROM     PROJECT AS P, WORKS_ON AS W, DEPARTMENT AS D\n   WHERE    P.Pnumber = W.Pno AND D.Dnumber = P.Dnum\n   GROUP BY P.Pnumber, P.Pname, D.Dname;          -- 프로젝트 현황\n```", "html": "<section class=\"sec\" id=\"s-view-def\"><h3>뷰의 정의와 쓰임<\/h3><p><b>뷰 (view)<\/b>: 기본 테이블(base table)에서 유도된 <b>가상 테이블<\/b>. 물리적으로 존재하지 않을 수도 있다.<\/p>\n<ul><li>검색: 제한 없음. 갱신: 보통 제한됨 (사실상 읽기 전용)<\/li><li>쓰는 이유: <b>복잡한 질의를 단순화<\/b>. 여러 테이블 조인·집계를 자주 쓰면 뷰로 만들어 두고 <b>단일 테이블 질의<\/b>처럼 쓴다<\/li><\/ul>\n<pre class=\"code\">CREATE VIEW WORKS_ON1\nAS SELECT Fname, Lname, Pname, Hours\n   FROM   EMPLOYEE, PROJECT, WORKS_ON\n   WHERE  Ssn = Essn AND Pno = Pnumber;\n\nCREATE VIEW DEPT_INFO (Dept_name, No_of_emps, Total_sal)\nAS SELECT   Dname, COUNT(*), SUM(Salary)\n   FROM     DEPARTMENT, EMPLOYEE\n   WHERE    Dnumber = Dno\n   GROUP BY Dname;<\/pre>\n<ul><li>속성 이름을 안 주면 정의 질의의 속성 이름을 그대로 씀 (WORKS_ON1), 명시할 수도 있음 (DEPT_INFO)<\/li><li>뷰 질의: <code>SELECT Fname, Lname FROM WORKS_ON1 WHERE Pname = 'ProductX';<\/code> → 매번 세 테이블을 조인할 필요 없음<\/li><li><b>DROP VIEW WORKS_ON1;<\/b> → 정의 테이블에는 영향 없음<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p32.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p32.jpg\" alt=\"05 p.32 · CREATE VIEW WORKS_ON1, DEPT_INFO\" loading=\"lazy\"><\/button><figcaption>05 p.32 · CREATE VIEW WORKS_ON1, DEPT_INFO<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-view-impl\"><h3>뷰 구현: 질의 수정 vs 실체화<\/h3><p>뷰는 <b>항상 최신(up-to-date)<\/b> 이어야 한다 → 정의 테이블이 바뀌면 DBMS가 뷰에 반영할 책임.<\/p>\n<div class=\"tblw\"><table><thead><tr><th>방식<\/th><th>내용<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td><b>질의 수정 (query modification)<\/b><\/td><td>뷰 질의를 <b>기본 테이블에 대한 질의로 변환<\/b>. 뷰를 물리적으로 유지하지 않음<\/td><td>사용자는 편하지만 DB 시스템엔 비효율 (복잡한 뷰를 매번 다시 계산)<\/td><\/tr><tr><td><b>뷰 실체화 (view materialization)<\/b><\/td><td>뷰가 처음 질의될 때 <b>물리적으로 뷰 테이블을 만들어<\/b> 한동안 유지<\/td><td>이후 뷰 질의가 자주 온다는 가정. <b>추가 저장 공간<\/b>. 정의 테이블이 바뀌면 <b>점진적 갱신(incremental update)<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<p>실체화된 뷰를 <b>언제<\/b> 갱신하나:<\/p>\n<ul><li><b>즉시 갱신 (immediate)<\/b>: 기본 테이블이 바뀌자마자. 항상 최신이지만 불필요하고 비효율적일 때가 있음<\/li><li><b>주기적 갱신 (periodic)<\/b>: 주기적으로. 뷰 질의가 최신이 아닌 결과를 받을 수 있음<\/li><li><b>지연 갱신 (lazy)<\/b>: 뷰 질의가 필요할 때. 질의가 오기 전까진 최신이 아님<\/li><\/ul>\n<p>일정 기간 질의되지 않으면 실체화된 뷰를 지우고, 나중에 필요하면 처음부터 다시 계산.<\/p><\/section>\n<section class=\"sec\" id=\"s-view-update\"><h3>뷰 갱신<\/h3><p>뷰에 대한 검색은 언제나 가능하지만, INSERT/DELETE/UPDATE는 많은 경우 불가능.<\/p>\n<p><b>갱신 가능 조건: 뷰 갱신을 이루는 기본 릴레이션 갱신이 딱 하나뿐일 때.<\/b><\/p>\n<ul><li><b>단일 테이블 + 집계 없음<\/b> → 기본 테이블 갱신 하나로 매핑 → <b>허용<\/b>. 단 뷰 속성에 (1) 기본 릴레이션의 <b>PK<\/b>, (2) DEFAULT가 없는 <b>NOT NULL 속성 전부<\/b>가 들어 있어야 함 (뷰로 투플을 넣을 때 그 값들이 비면 안 되니까)<\/li><li><b>조인 (여러 테이블)<\/b> → 여러 방식으로 매핑될 수 있어 <b>일반적으로 불가<\/b><\/li><li><b>그룹화·집계<\/b> → 그 갱신이 <b>말이 안 됨<\/b> → <b>불가<\/b><\/li><\/ul>\n<p>예 1 (여러 해석): <code>UPDATE WORKS_ON1 SET Pname = 'ProductY' WHERE Lname = 'Smith' AND Fname = 'John' AND Pname = 'ProductX';<\/code><\/p>\n<ul><li>해석 a: Smith가 일하는 프로젝트를 바꿈 → WORKS_ON의 Pno를 ProductY 번호로 (의도대로)<\/li><li>해석 b: PROJECT의 'ProductX' 이름을 'ProductY'로 → 뷰 결과는 같아 보이지만 <b>부작용<\/b>: ProductX에서 일하던 모든 투플이 바뀜<\/li><\/ul>\n<p>예 2 (불가능): <code>UPDATE DEPT_INFO SET Total_sal = 100000 WHERE Dname = 'Research';<\/code> → Total_sal은 SUM으로 <b>계산된 값<\/b>, 물리적으로 저장 안 됨 → 의미 없음<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p42.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p42.jpg\" alt=\"05 p.42 · WORKS_ON1 갱신의 두 가지 해석\" loading=\"lazy\"><\/button><figcaption>05 p.42 · WORKS_ON1 갱신의 두 가지 해석<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p43.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p43.jpg\" alt=\"05 p.43 · DEPT_INFO의 Total_sal 갱신은 의미 없음\" loading=\"lazy\"><\/button><figcaption>05 p.43 · DEPT_INFO의 Total_sal 갱신은 의미 없음<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-view-auth\"><h3>뷰를 이용한 권한 부여<\/h3><p>뷰로 권한 없는 사용자에게 <b>특정 속성이나 투플을 숨길<\/b> 수 있다.<\/p>\n<pre class=\"code\">CREATE VIEW DEPT5EMP AS\nSELECT * FROM EMPLOYEE WHERE Dno = 5;            -- 투플 제한\n\nCREATE VIEW BASIC_EMP_DATA AS\nSELECT Fname, Lname, Address FROM EMPLOYEE;      -- 속성 제한<\/pre>\n<ul><li>DEPT5EMP: 5번 부서 관리자는 5번 부서 사원 정보만 보게 함. 사용자에게 EMPLOYEE가 아니라 <b>뷰에 대한 질의 권한만<\/b> 부여<\/li><li>BASIC_EMP_DATA: 일반 사원은 이름과 주소만<\/li><\/ul>\n<p>교안 연습 3·4 풀이:<\/p>\n<pre class=\"code\">CREATE VIEW DEPT_INFO (DeptName, MgrFname, MgrLname, MgrSalary)\nAS SELECT D.Dname, E.Fname, E.Lname, E.Salary\n   FROM   DEPARTMENT AS D, EMPLOYEE AS E\n   WHERE  D.Mgr_ssn = E.Ssn;                      -- 부서와 관리자 정보\n\nCREATE VIEW ProjectInfo (Pname, Dname, NumEmployees, TotalHours)\nAS SELECT   P.Pname, D.Dname, COUNT(*), SUM(W.Hours)\n   FROM     PROJECT AS P, WORKS_ON AS W, DEPARTMENT AS D\n   WHERE    P.Pnumber = W.Pno AND D.Dnumber = P.Dnum\n   GROUP BY P.Pnumber, P.Pname, D.Dname;          -- 프로젝트 현황<\/pre><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/ADV-p45.jpg\" aria-label=\"크게 보기\"><img src=\"img/ADV-p45.jpg\" alt=\"05 p.45 · 권한 부여용 뷰 DEPT5EMP (투플 제한), BASIC_EMP_DATA (속성 제한)\" loading=\"lazy\"><\/button><figcaption>05 p.45 · 권한 부여용 뷰 DEPT5EMP (투플 제한), BASIC_EMP_DATA (속성 제한)<\/figcaption><\/figure><\/section>"}]}, {"id": "U6", "title": "관계 대수 (Relational Algebra)", "src": "6-1_relational-algebra.pdf + db-exercises Week 7", "intro": "σ π ρ, 집합 연산, ×, ⋈(세타·동등·자연), ÷, ℑ(집계), 외부 조인. 질의를 \"중간 릴레이션 이름 ← 연산\" 순서로 쪼개 쓰는 연습이 핵심. 답안에 기호 대신 SELECT, PROJECT, JOIN 같은 단어를 써도 채점돼.", "lessons": [{"id": "L6-1", "title": "관계 대수 소개 · 질의 트리", "src": "6-1 p.3–6", "secs": [{"id": "ra-intro", "title": "관계 대수란"}, {"id": "query-tree", "title": "질의 (실행) 트리"}], "md": "## 관계 대수란 {#ra-intro}\n\n- **관계 대수 (relational algebra)**: \"데이터를 **어떻게** 가져오나\"에 대한 이론적·수학적 모델 → **절차적 (procedural)**\n- **SQL**은 고급 **선언적 (declarative)** 언어 → \"**무슨** 데이터가 필요한가\"만 말하고 어떻게 가져올지는 신경 안 씀\n- 형식적 관계 모델의 **기본 연산 집합**. 집합에 대한 수학 개념에 엄격하게 기반\n\n왜 중요한가:\n- 관계 모델 연산(선택, 투영, 이름 바꾸기, 조인, 카티션 곱…)의 **형식적 기초**\n- **질의 처리와 최적화의 기반**: 결과를 얻기 위한 연산의 **순서(sequence)** 를 명시\n\n> 시험 포인트: \"SQL = what (선언적), 관계 대수 = how (절차적)\". 그리고 관계 대수는 **닫힌 체계**: 모든 연산의 결과가 다시 릴레이션.\n\n## 질의 (실행) 트리 {#query-tree}\n\n**질의 트리 (query tree)**: DBMS 내부에서 질의를 표현하는 트리 = 관계 대수 식.\n- **잎 노드 = 입력 릴레이션**, **내부 노드 = 관계 대수 연산**\n- **잎에서 시작해 루트에서 끝난다** (아래에서 위로 실행)\n- 연산 순서를 명시적으로 보여줘서 질의를 이해하기 좋음\n\n교안 예: 'Stafford'에 있는 프로젝트마다 프로젝트 번호, 통제 부서 번호, 부서 관리자의 성·주소·생일\n```\nSELECT P.Pnumber, P.Dnum, E.Lname, E.Address, E.Bdate\nFROM   PROJECT P, DEPARTMENT D, EMPLOYEE E\nWHERE  P.Dnum = D.Dnumber AND D.Mgr_ssn = E.Ssn AND P.Plocation = 'Stafford';\n```\n트리: (1) σ Plocation='Stafford' (P) → (2) ⋈ P.Dnum=D.Dnumber D → (3) ⋈ D.Mgr_ssn=E.Ssn E → 루트 π Pnumber, Dnum, Lname, Address, Bdate\n\n**질의 처리**: 가능한 실행 전략(질의 트리) 중 적절한 걸 고르는 과정. **SQL 하나에 질의 트리(계획)가 여러 개** 있을 수 있다 → 어느 게 최선인지는 질의 최적화 (13주차).", "html": "<section class=\"sec\" id=\"s-ra-intro\"><h3>관계 대수란<\/h3><ul><li><b>관계 대수 (relational algebra)<\/b>: \"데이터를 <b>어떻게<\/b> 가져오나\"에 대한 이론적·수학적 모델 → <b>절차적 (procedural)<\/b><\/li><li><b>SQL<\/b>은 고급 <b>선언적 (declarative)<\/b> 언어 → \"<b>무슨<\/b> 데이터가 필요한가\"만 말하고 어떻게 가져올지는 신경 안 씀<\/li><li>형식적 관계 모델의 <b>기본 연산 집합<\/b>. 집합에 대한 수학 개념에 엄격하게 기반<\/li><\/ul>\n<p>왜 중요한가:<\/p>\n<ul><li>관계 모델 연산(선택, 투영, 이름 바꾸기, 조인, 카티션 곱…)의 <b>형식적 기초<\/b><\/li><li><b>질의 처리와 최적화의 기반<\/b>: 결과를 얻기 위한 연산의 <b>순서(sequence)<\/b> 를 명시<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: \"SQL = what (선언적), 관계 대수 = how (절차적)\". 그리고 관계 대수는 <b>닫힌 체계<\/b>: 모든 연산의 결과가 다시 릴레이션.<\/div><\/section>\n<section class=\"sec\" id=\"s-query-tree\"><h3>질의 (실행) 트리<\/h3><p><b>질의 트리 (query tree)<\/b>: DBMS 내부에서 질의를 표현하는 트리 = 관계 대수 식.<\/p>\n<ul><li><b>잎 노드 = 입력 릴레이션<\/b>, <b>내부 노드 = 관계 대수 연산<\/b><\/li><li><b>잎에서 시작해 루트에서 끝난다<\/b> (아래에서 위로 실행)<\/li><li>연산 순서를 명시적으로 보여줘서 질의를 이해하기 좋음<\/li><\/ul>\n<p>교안 예: 'Stafford'에 있는 프로젝트마다 프로젝트 번호, 통제 부서 번호, 부서 관리자의 성·주소·생일<\/p>\n<pre class=\"code\">SELECT P.Pnumber, P.Dnum, E.Lname, E.Address, E.Bdate\nFROM   PROJECT P, DEPARTMENT D, EMPLOYEE E\nWHERE  P.Dnum = D.Dnumber AND D.Mgr_ssn = E.Ssn AND P.Plocation = &#x27;Stafford&#x27;;<\/pre>\n<p>트리: (1) σ Plocation='Stafford' (P) → (2) ⋈ P.Dnum=D.Dnumber D → (3) ⋈ D.Mgr_ssn=E.Ssn E → 루트 π Pnumber, Dnum, Lname, Address, Bdate<\/p>\n<p><b>질의 처리<\/b>: 가능한 실행 전략(질의 트리) 중 적절한 걸 고르는 과정. <b>SQL 하나에 질의 트리(계획)가 여러 개<\/b> 있을 수 있다 → 어느 게 최선인지는 질의 최적화 (13주차).<\/p><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/RA-p5.jpg\" aria-label=\"크게 보기\"><img src=\"img/RA-p5.jpg\" alt=\"06 p.5 · &#x27;Stafford&#x27; 질의의 질의 트리 (잎 = 릴레이션, 내부 노드 = 연산)\" loading=\"lazy\"><\/button><figcaption>06 p.5 · &#x27;Stafford&#x27; 질의의 질의 트리 (잎 = 릴레이션, 내부 노드 = 연산)<\/figcaption><\/figure><\/section>"}, {"id": "L6-2", "title": "단항 연산: SELECT · PROJECT · RENAME", "src": "6-1 p.8–15", "secs": [{"id": "ra-select", "title": "SELECT (σ)"}, {"id": "ra-project", "title": "PROJECT (π)"}, {"id": "ra-rename", "title": "RENAME (ρ)"}, {"id": "ra-sequence", "title": "연산의 순서 (중간 릴레이션)"}], "md": "## SELECT (σ) {#ra-select}\n\n**σ<선택 조건>(R)**: 릴레이션에서 **선택 조건을 만족하는 투플의 부분집합**을 고름 → **수평 필터링**.\n- 조건은 투플 **각각에** 개별 적용\n- 결과는 R과 **같은 속성** → **결과 차수 = R의 차수**\n- 조건 = `<속성> <비교연산> <상수>` 또는 `<속성> <비교연산> <속성>` 절들을 **AND, OR**로 연결\n  - 비교 연산 {=, <, ≤, >, ≥, ≠}. 순서 있는 값(숫자, 날짜)은 전부, 순서 없는 값(색깔 등)은 {=, ≠}만\n- 예) σ Dno=4 (EMPLOYEE) → Zelaya, Wallace, Jabbar\n- 예) σ (Dno=4 AND Salary>25000) OR (Dno=5 AND Salary>30000) (EMPLOYEE) → Wong, Wallace, Narayan\n\n**성질**\n- **교환 법칙**: σ c1(σ c2(R)) = σ c2(σ c1(R))\n- 여러 σ는 AND로 **하나로 합칠 수 있음**: σ c1(σ c2(…σ cn(R))) = σ c1 AND c2 AND … AND cn(R)\n\n> 함정: 관계 대수의 SELECT(σ)는 SQL의 **SELECT 절이 아니라 WHERE 절**에 대응. `σ Dno=4 AND Salary>25000 (EMPLOYEE)` = `SELECT * FROM EMPLOYEE WHERE Dno=4 AND Salary>25000;`\n\n## PROJECT (π) {#ra-project}\n\n**π<속성 리스트>(R)**: 원하는 **열만** 남기고 나머지 열은 버림 → **수직 필터링**.\n- 결과 차수 = 속성 리스트의 속성 수\n- **중복 제거**: 속성 리스트에 키가 없으면(비키 속성만) 중복 투플이 생길 수 있는데, **π는 중복을 제거** → 결과는 서로 다른 투플의 **집합**\n  - 예) π Sex, Salary (EMPLOYEE) → 8행이 아니라 **7행** ((F, 25000)이 두 번 → 한 번)\n- SQL 대응: π 속성 리스트 = **SELECT 절**. 그런데 SQL은 중복을 안 지우므로 정확한 대응은 `SELECT DISTINCT Sex, Salary FROM EMPLOYEE;`\n\n## RENAME (ρ) {#ra-rename}\n\n**ρ**: 릴레이션 이름이나 속성 이름, 또는 둘 다 바꿈.\n- ρ S(B₁, …, Bₙ)(R): 둘 다 / ρ S(R): 릴레이션 이름만 / ρ (B₁, …, Bₙ)(R): 속성 이름만\n- 대입 형태로도 씀: `R(First_name, Last_name, Salary) ← π Fname, Lname, Salary (TEMP)`\n- SQL에서는 **AS (별칭)** 로 이름 바꾸기를 한다\n\n## 연산의 순서 (중간 릴레이션) {#ra-sequence}\n\n여러 연산을 쓸 때 두 방법:\n- **방법 1**: 중간 릴레이션에 이름을 붙여 순서를 명시\n```\nDEP5_EMPS ← σ Dno=5 (EMPLOYEE)\nRESULT    ← π Fname, Lname, Salary (DEP5_EMPS)\n```\n- *
