27);<\/code><\/p>\n<ul><li><b>message receiver<\/b>: <code>aGame<\/code><\/li><li><b>message selector<\/b>: <code>displayCard<\/code><\/li><li><b>arguments<\/b> (optional): <code>aCard, 42, 27<\/code><\/li><\/ul><\/section>", "topics": ["encap"]}, {"id": "L4-3", "title": "public 데이터 피하기 · getter/setter · 불변식과 assert", "src": "L04 p.9–12", "secs": [{"id": "avoid-public", "title": "public 영역에 데이터 멤버를 두지 마라", "title_en": "Avoid Data Members in the Public Interface", "topic": "encap"}, {"id": "getter-setter", "title": "Accessor(getter)와 Mutator(setter)", "title_en": "Accessor (getter) and Mutator (setter)", "topic": "encap"}, {"id": "assert", "title": "클래스 불변식과 assert", "title_en": "Class Invariants and assert", "topic": "assert"}], "html": "<section class=\"sec\" id=\"s-avoid-public\"><h3>public 영역에 데이터 멤버를 두지 마라<\/h3><p>문법적으로는 문제없지만 OOP 관점에서 좋지 않다. 이유 3가지:<\/p>\n<ol><li><b>Consistency<\/b>: 멤버 변수에 접근할 때 <b>항상 인터페이스(함수)로<\/b> 한다는 일관된 정책<\/li><li><b>Precise control over the accessibility of data members<\/b>: no access, <b>read-only, read-write, write-only<\/b>를 정확히 제어<\/li><li><b>Functional abstraction<\/b>: 나중에 데이터 멤버를 <b>계산(computation)으로 바꿀 수 있다<\/b> (예: 접근 횟수 세기 같은 로직 추가)<\/li><\/ol>\n<pre class=\"code\">class AccessLevels {\npublic:\n  int  getReadOnly() const     { return readOnly; }\n  void setReadWrite(int value) { readWrite = value; }\n  int  getReadWrite() const    { return readWrite; }\n  void setWriteOnly(int value) { writeOnly = value; }\nprivate:\n  int noAccess;   // 접근 불가\n  int readOnly;\n  int readWrite;\n  int writeOnly;\n};<\/pre>\n<div class=\"callout exam\">시험 포인트: 2024·2022 빈칸 \"(i) (Consistency) (ii) precise (control) over the (accessibility) of data members (iii) functional (abstraction): you can later (replace) the data member with (a computation)\". 2024·2022 서술 \"every member private이면? → no interface, clients cannot use the object / every member public이면? → no encapsulation, clients can directly access and corrupt data\".<\/div><\/section>\n<section class=\"sec\" id=\"s-getter-setter\"><h3>Accessor(getter)와 Mutator(setter)<\/h3><ul><li><b>Accessor (getter)<\/b>: 내부 데이터 값을 <b>그냥 반환<\/b>하는 메서드. 쓰는 이유: 데이터를 <b>read-only<\/b>로, 데이터에 접근할 수 있다는 걸 <b>더 잘 문서화<\/b>(인터페이스만 봐도 알 수 있음), 나중에 접근 방식을 바꾸기 쉬움 (예: 접근 횟수 세기)<\/li><li><b>Mutator (setter)<\/b>: 객체의 변수를 <b>바꾸는<\/b> 메서드. getter보다 <b>덜 흔함<\/b> (쓰기는 위험하므로 가능하면 최소화)<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-assert\"><h3>클래스 불변식과 assert<\/h3><ul><li><b>Class invariant<\/b>: 객체 안에서 <b>항상 참이어야 하는 조건<\/b>. 모든 멤버 함수 코드가 이 조건을 검사하도록 조건을 추가<\/li><li>C/C++의 <b>assert 매크로<\/b> <code>assert(e)<\/code> (<code>#include &lt;assert.h&gt;<\/code> 또는 <code>&lt;cassert&gt;<\/code>)<ul><li><b>e가 참이면 그냥 계속<\/b><\/li><li><b>e가 거짓이면 프로그램이 assertion 실패 에러 메시지와 함께 멈춤<\/b><\/li><\/ul><\/li><li><b>목적: 더 신뢰할 수 있는(reliable) 프로그램<\/b> → 버그를 빨리 찾고 고치기<\/li><li>교수님: \"가능한 한 assert를 많이 넣어라\"<\/li><li>함정: <code>assert(x = 3)<\/code> 은 대입이라 항상 참 (3은 0이 아니니까). 비교는 <code>assert(x == 3)<\/code><\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2025 서술 \"(i) What does assert(e) do? (ii) main purpose? (iii)…\", 2022 빈칸 \"(An assertion) contains a boolean expression that you believe will be true when it executes… writing (assertions) helps find (bugs)\".<\/div><\/section>", "title_en": "Avoiding Public Data · Getters/Setters · Invariants and assert", "html_en": "<section class=\"sec\" id=\"s-avoid-public\"><h3>Avoid Data Members in the Public Interface<\/h3><p>Syntactically fine, but bad from an OOP point of view. Three reasons:<\/p>\n<ol><li><b>Consistency<\/b>: a consistent policy of <b>always accessing member variables through the interface (functions)<\/b><\/li><li><b>Precise control over the accessibility of data members<\/b>: precisely control no access, <b>read-only, read-write, write-only<\/b><\/li><li><b>Functional abstraction<\/b>: you can later <b>replace the data member with a computation<\/b> (e.g. add logic such as counting the number of accesses)<\/li><\/ol>\n<pre class=\"code\">class AccessLevels {\npublic:\n  int  getReadOnly() const     { return readOnly; }\n  void setReadWrite(int value) { readWrite = value; }\n  int  getReadWrite() const    { return readWrite; }\n  void setWriteOnly(int value) { writeOnly = value; }\nprivate:\n  int noAccess;   // no access to this int\n  int readOnly;\n  int readWrite;\n  int writeOnly;\n};<\/pre>\n<div class=\"callout exam\">Exam point: 2024·2022 blanks \"(i) (Consistency) (ii) precise (control) over the (accessibility) of data members (iii) functional (abstraction): you can later (replace) the data member with (a computation)\". 2024·2022 essay \"what if every member is private? → no interface, clients cannot use the object / what if every member is public? → no encapsulation, clients can directly access and corrupt data\".<\/div><\/section>\n<section class=\"sec\" id=\"s-getter-setter\"><h3>Accessor (getter) and Mutator (setter)<\/h3><ul><li><b>Accessor (getter)<\/b>: a method that <b>simply returns<\/b> an internal data value. Why use: makes the data field <b>read-only<\/b>, provides <b>better documentation<\/b> that the data field is accessible (visible from the interface alone), makes it easier to later change the access behavior (e.g. count # of accesses)<\/li><li><b>Mutator (setter)<\/b>: a method used to <b>change<\/b> a variable of an object. <b>Less common<\/b> than accessors (writing is risky, so keep it to a minimum where possible)<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-assert\"><h3>Class Invariants and assert<\/h3><ul><li><b>Class invariant<\/b>: a condition that <b>must always be true inside an object<\/b>. Add the condition so that every member function's code checks it<\/li><li>The C/C++ <b>assert macro<\/b> <code>assert(e)<\/code> (<code>#include &lt;assert.h&gt;<\/code> or <code>&lt;cassert&gt;<\/code>)<ul><li><b>If e is true, just continue<\/b><\/li><li><b>If e is false, the program is stopped with an error message indicating the failure of the assertion<\/b><\/li><\/ul><\/li><li><b>Purpose: more reliable programs<\/b> → find and fix bugs early<\/li><li>The professor: \"put in as many asserts as possible\"<\/li><li>Trap: <code>assert(x = 3)<\/code> is an assignment, so it is always true (3 is non-zero). Comparison is <code>assert(x == 3)<\/code><\/li><\/ul>\n<div class=\"callout exam\">Exam point: 2025 essay \"(i) What does assert(e) do? (ii) main purpose? (iii)…\", 2022 blank \"(An assertion) contains a boolean expression that you believe will be true when it executes… writing (assertions) helps find (bugs)\".<\/div><\/section>", "topics": ["assert", "encap"]}, {"id": "L4-4", "title": "PlayingCard 예제 · 가시성 · 생성자 · 기본 생성자", "src": "L04 p.13–16", "secs": [{"id": "visibility", "title": "PlayingCard 클래스와 가시성", "title_en": "The PlayingCard Class and Visibility", "topic": "encap"}, {"id": "constructor", "title": "생성자 (Constructor)", "title_en": "Constructor", "topic": "ctor"}, {"id": "default-ctor", "title": "기본 생성자와 소멸자", "title_en": "Default Constructor and Destructor", "topic": "ctor"}], "html": "<section class=\"sec\" id=\"s-visibility\"><h3>PlayingCard 클래스와 가시성<\/h3><pre class=\"code\">class PlayingCard {\npublic:\n  enum Suits {Spade, Diamond, Club, Heart};\n  enum Colors {Red, Black};\n  PlayingCard ();\n  PlayingCard (Suits is, int ir)                 // constructor\n    { suitValue = is; rankValue = ir; faceUp = true; }\n  ~PlayingCard () {}                             // destructor\n  Suits suit () const { return suitValue; }      // getter\n  int rank () const;                             // getter\n  void setFaceUp (bool up) { faceUp = up; }      // setter\n  Colors color ();\nprivate:\n  Suits suitValue;\n  int rankValue;\n  bool faceUp;\n};<\/pre>\n<ul><li>color는 데이터로 저장하지 않음 → suit에서 <b>계산<\/b> (Diamond·Heart면 Red)<\/li><li><b>Visibility modifier<\/b>: 인터페이스와 구현 관점을 구분<ul><li><b>public<\/b>: 외부(인터페이스, 서비스) 관점. 누구나(모든 클라이언트) 보고 조작<\/li><li><b>private<\/b>: 내부(구현) 관점. <b>클래스 안에서만<\/b> 접근 (그 클래스의 멤버 함수만)<\/li><li><b>protected<\/b>: 상속에서 다룸 (상속이 없으면 private과 같음)<\/li><\/ul><\/li><li>설계 순서: 필요한 <b>인터페이스(public)<\/b> 를 먼저 정하고 → 그걸 구현하는 데 필요한 함수·변수를 <b>private<\/b>에<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-constructor\"><h3>생성자 (Constructor)<\/h3><ul><li>새로 만든 객체의 <b>데이터 멤버를 초기화<\/b>하는 메서드<\/li><li>객체가 <b>생성될 때 자동으로(implicitly) 호출<\/b> (100%)<\/li><li><b>반환 타입·반환 값이 없다<\/b><\/li><li><b>클래스와 이름이 같다<\/b><\/li><li>여러 개 가능 (매개변수가 다르면)<\/li><li>초기화 자체가 자동인 건 아님 → 생성자 안에 초기화 코드를 써야 함. 안 하면 쓰레기 값 → 위험<\/li><\/ul>\n<p><b>멤버 초기화자 (member initializer)<\/b><\/p>\n<pre class=\"code\">PlayingCard (Suits is, int ir) : suitValue(is), rankValue(ir) { faceUp = true; }<\/pre>\n<div class=\"callout exam\">시험 포인트: 2019 빈칸 \"(2) automatically called when (an object is created) (3) should always have the same (name) as the class (4) does not have (return) type\", 2017 \"automatically called when (an object) is (created)… the name is the same as (the class)… used to (initialize) data members\".<\/div><\/section>\n<section class=\"sec\" id=\"s-default-ctor\"><h3>기본 생성자와 소멸자<\/h3><ul><li>클래스에 <b>생성자를 하나도 선언하지 않으면 컴파일러가 기본 생성자(default constructor)를 만든다<\/b><ul><li>모양: <code>TIntStack::TIntStack() { /* Empty */ }<\/code> (매개변수 없고 몸체가 빔)<\/li><li><b>생성자를 하나라도 만들면<\/b> 기본 생성자는 <b>자동 생성되지 않는다<\/b><\/li><\/ul><\/li><li><b>소멸자 (destructor)<\/b>: 객체가 메모리에서 삭제될 때 자동 호출. <code>~클래스이름()<\/code>, 하나뿐. 안 만들면 컴파일러가 빈 소멸자를 만듦<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2025·2024 빈칸 \"if we do not declare any constructor in a class, (the compiler) generates (a default constructor)\".<\/div><\/section>", "title_en": "PlayingCard Example · Visibility · Constructors · Default Constructor", "html_en": "<section class=\"sec\" id=\"s-visibility\"><h3>The PlayingCard Class and Visibility<\/h3><pre class=\"code\">class PlayingCard {\npublic:\n  enum Suits {Spade, Diamond, Club, Heart};\n  enum Colors {Red, Black};\n  PlayingCard ();\n  PlayingCard (Suits is, int ir)                 // constructor\n    { suitValue = is; rankValue = ir; faceUp = true; }\n  ~PlayingCard () {}                             // destructor\n  Suits suit () const { return suitValue; }      // getter\n  int rank () const;                             // getter\n  void setFaceUp (bool up) { faceUp = up; }      // setter\n  Colors color ();\nprivate:\n  Suits suitValue;\n  int rankValue;\n  bool faceUp;\n};<\/pre>\n<ul><li>color is not stored as data → it is <b>computed<\/b> from the suit (Red if Diamond or Heart)<\/li><li><b>Visibility modifier<\/b>: differentiates the interface and implementation views of a class<ul><li><b>public<\/b>: external (interface, service) view. Can be seen and manipulated by anybody (all clients)<\/li><li><b>private<\/b>: internal (implementation) view. Accessible <b>only within the class<\/b> (only that class's member functions)<\/li><li><b>protected<\/b>: discussed with inheritance (same as private when there is no inheritance)<\/li><\/ul><\/li><li>Design order: first decide the needed <b>interface (public)<\/b> → then put the functions and variables needed to implement it in <b>private<\/b><\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-constructor\"><h3>Constructor<\/h3><ul><li>A method that <b>initializes the data members<\/b> of a newly created object<\/li><li><b>Implicitly invoked when an object is created<\/b> (always)<\/li><li><b>No return type/value<\/b><\/li><li><b>Has the same name as the class<\/b><\/li><li>There can be several (with different parameters)<\/li><li>Initialization itself is not automatic → you must write initialization code in the constructor. Otherwise garbage values → dangerous<\/li><\/ul>\n<p><b>Member initializer<\/b><\/p>\n<pre class=\"code\">PlayingCard (Suits is, int ir) : suitValue(is), rankValue(ir) { faceUp = true; }<\/pre>\n<div class=\"callout exam\">Exam point: 2019 blanks \"(2) automatically called when (an object is created) (3) should always have the same (name) as the class (4) does not have (return) type\", 2017 \"automatically called when (an object) is (created)… the name is the same as (the class)… used to (initialize) data members\".<\/div><\/section>\n<section class=\"sec\" id=\"s-default-ctor\"><h3>Default Constructor and Destructor<\/h3><ul><li><b>If we do not declare any constructor in a class, the compiler generates a default constructor<\/b><ul><li>It looks like: <code>TIntStack::TIntStack() { /* Empty */ }<\/code> (no parameters, empty body)<\/li><li><b>If you write even one constructor<\/b>, the default constructor is <b>not generated automatically<\/b><\/li><\/ul><\/li><li><b>Destructor<\/b>: called automatically when the object is deleted from memory. <code>~ClassName()<\/code>, only one. If you don't write it, the compiler generates an empty destructor<\/li><\/ul>\n<div class=\"callout exam\">Exam point: 2025·2024 blank \"if we do not declare any constructor in a class, (the compiler) generates (a default constructor)\".<\/div><\/section>", "topics": ["ctor", "encap"]}, {"id": "L4-5", "title": "복사 생성자 · 얕은/깊은 복사", "src": "L04 p.17–18", "secs": [{"id": "copy-when", "title": "복사 생성자가 호출되는 때", "title_en": "When the Copy Constructor Is Called", "topic": "copy"}, {"id": "shallow-deep", "title": "얕은 복사와 깊은 복사", "title_en": "Shallow Copy and Deep Copy", "topic": "copy"}, {"id": "rule-of-three", "title": "복사 생성자가 필요하면 소멸자와 operator=도", "title_en": "If You Need a Copy Constructor, You Also Need a Destructor and operator=", "topic": "copy"}], "html": "<section class=\"sec\" id=\"s-copy-when\"><h3>복사 생성자가 호출되는 때<\/h3><p><b>새 객체가 같은 타입의 기존 객체로부터 만들어질 때<\/b> 호출된다.<\/p>\n<pre class=\"code\">Person q(&quot;Mickey&quot;);   // 일반 생성자로 q를 만듦\nPerson r(p);          // 복사 생성자로 r을 만듦\nPerson p = q;         // 선언에서 초기화 → 복사 생성자\nf(p);                 // 값 매개변수 초기화 → 복사 생성자\np = q;                // 대입 연산자! 생성자도 복사 생성자도 아님 → p.operator=(q)<\/pre>\n<ul><li>선언: <code>Person(const Person&amp; p) { … }<\/code><\/li><li>대입 연산자: <code>Person&amp; operator=(const Person&amp; p) { … }<\/code><\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2017 \"(a) Copy constructor is automatically called when (a new object is created from an existing object of the same type). (b) 세 경우의 예\" → <code>Person r(p);<\/code> / <code>Person p = q;<\/code> / <code>f(p);<\/code>. 그리고 <code>p = q;<\/code>는 아니라는 것.<\/div><\/section>\n<section class=\"sec\" id=\"s-shallow-deep\"><h3>얕은 복사와 깊은 복사<\/h3><ul><li>복사 생성자를 안 만들면 컴파일러가 <b>기본 복사 생성자, 기본 대입 연산자, 기본 소멸자<\/b>를 만든다 → <b>얕은 복사(shallow copy)<\/b>: 멤버 값을 그대로 복사 (<b>포인터면 주소만 복사<\/b>)<\/li><li>얕은 복사로 괜찮으면 복사 생성자를 쓰지 마라<\/li><li>동적 할당한 메모리를 가리키는 포인터 멤버가 있으면 <b>깊은 복사(deep copy)<\/b> 가 필요: <b>새 메모리를 new로 할당하고 내용을 복사<\/b><\/li><li>얕은 복사의 문제: 두 객체가 <b>같은 배열을 공유<\/b> → 한쪽을 바꾸면 다른 쪽도 바뀜, 둘 다 소멸될 때 <b>delete[]가 같은 메모리에 두 번<\/b> (double free, dangling pointer)<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-rule-of-three\"><h3>복사 생성자가 필요하면 소멸자와 operator=도<\/h3><ul><li><b>복사 생성자가 필요하면 소멸자와 operator=도 필요하다<\/b> (Why? 셋 다 같은 이유, 즉 동적 할당 자원을 소유하기 때문: 복사 때 깊은 복사, 소멸 때 delete[], 대입 때 기존 메모리 해제 후 깊은 복사)<\/li><li>예) Project 2의 <code>inf_int<\/code>: 자릿수를 동적 할당한 포인터로 가짐 → 깊은 복사를 하는 복사 생성자 필요. 안 쓰면 얕은 복사로 배열 공유, delete[] 두 번<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2016 \"Why do we generally need to write a copy constructor in class inf_int? What happens if we don't?\", 2017 TIntStack \"(4) What problems occur if the copy constructor is not provided?\".<\/div><\/section>", "title_en": "Copy Constructor · Shallow/Deep Copy", "html_en": "<section class=\"sec\" id=\"s-copy-when\"><h3>When the Copy Constructor Is Called<\/h3><p>Called <b>whenever a new object is created from an existing object of the same type<\/b>.<\/p>\n<pre class=\"code\">Person q(&quot;Mickey&quot;);   // q is built with a typical constructor\nPerson r(p);          // copy constructor is used to build r\nPerson p = q;         // initialization in a declaration → copy constructor\nf(p);                 // initializing a value parameter → copy constructor\np = q;                // assignment operator! no constructor or copy constructor → p.operator=(q)<\/pre>\n<ul><li>Declaration: <code>Person(const Person&amp; p) { … }<\/code><\/li><li>Assignment operator: <code>Person&amp; operator=(const Person&amp; p) { … }<\/code><\/li><\/ul>\n<div class=\"callout exam\">Exam point: 2017 \"(a) Copy constructor is automatically called when (a new object is created from an existing object of the same type). (b) examples of the three cases\" → <code>Person r(p);<\/code> / <code>Person p = q;<\/code> / <code>f(p);<\/code>. And know that <code>p = q;<\/code> is not one of them.<\/div><\/section>\n<section class=\"sec\" id=\"s-shallow-deep\"><h3>Shallow Copy and Deep Copy<\/h3><ul><li>If you don't provide them, the compiler automatically generates a <b>default copy constructor, default assignment operator, and default destructor<\/b> → <b>shallow copy<\/b>: member values are copied as they are (<b>for a pointer, only the address is copied<\/b>)<\/li><li>Don't write a copy constructor if shallow copies are OK<\/li><li>If a pointer member points to dynamically allocated memory, a <b>deep copy<\/b> is needed: <b>allocate new memory with new and copy the contents<\/b><\/li><li>Problems with shallow copy: the two objects <b>share the same array<\/b> → changing one changes the other; when both are destroyed, <b>delete[] runs twice on the same memory<\/b> (double free, dangling pointer)<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-rule-of-three\"><h3>If You Need a Copy Constructor, You Also Need a Destructor and operator=<\/h3><ul><li><b>If you need a copy constructor, you also need a destructor and operator=<\/b> (Why? All three exist for the same reason — the object owns dynamically allocated resources: deep copy when copying, delete[] when destroying, free the old memory then deep copy when assigning)<\/li><li>e.g. <code>inf_int<\/code> in Project 2: holds its digits through a dynamically allocated pointer → needs a copy constructor that does a deep copy. Without it, the shallow copy shares the array and delete[] runs twice<\/li><\/ul>\n<div class=\"callout exam\">Exam point: 2016 \"Why do we generally need to write a copy constructor in class inf_int? What happens if we don't?\", 2017 TIntStack \"(4) What problems occur if the copy constructor is not provided?\".<\/div><\/section>", "topics": ["copy"]}, {"id": "L4-6", "title": "객체 생성과 메모리 문제", "src": "L04 p.19", "secs": [{"id": "object-creation", "title": "객체 생성과 해제", "title_en": "Object Creation and Deallocation", "topic": "memory"}, {"id": "leak-dangling", "title": "메모리 누수 · 댕글링 포인터 · GC", "title_en": "Memory Leak · Dangling Pointer · GC", "topic": "memory"}], "html": "<section class=\"sec\" id=\"s-object-creation\"><h3>객체 생성과 해제<\/h3><pre class=\"code\">PlayingCard aCard(diamond, 3);                            // 정적 (지역 객체)\nPlayingCard* aCardPtr = new PlayingCard(diamond, 3);      // 동적\nPlayingCard* CardsPtr = new PlayingCard[100];             // 동적 배열 (기본 생성자 100번)\ndelete aCardPtr;      // 해제\ndelete [] CardsPtr;   // 배열 해제<\/pre>\n<ul><li>지역 객체는 <b>만든 역순<\/b>으로 소멸, <code>delete[]<\/code>는 배열 원소를 <b>뒤에서부터<\/b> 소멸<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-leak-dangling\"><h3>메모리 누수 · 댕글링 포인터 · GC<\/h3><ul><li><b>Memory leak<\/b>: 동적 할당한 메모리를 <b>해제하지 않아서<\/b> 다시 쓸 수 없게 되는 것 (가리키는 포인터를 잃어버림)<\/li><li><b>Dangling pointer<\/b>: <b>이미 해제된 메모리를 가리키는 포인터<\/b>. 접근하면 정의되지 않은 동작(undefined behavior) → 충돌, 다른 데이터가 쓰는 메모리를 망가뜨림<\/li><li><b>Garbage collection<\/b>: 안 쓰는 메모리를 자동으로 회수 (Java). C++에는 없음<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2025 서술 \"(i) What is a dangling pointer? (ii) Why dangerous?\", 2024 빈칸 \"A pointer pointing to a memory location that has been deallocated is called a (dangling) pointer\".<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L04-p19.jpg\" aria-label=\"크게 보기\"><img src=\"img/L04-p19.jpg\" alt=\"L04 p.19 · Object Creation (memory leak, dangling)\" loading=\"lazy\"><\/button><figcaption>L04 p.19 · Object Creation (memory leak, dangling)<\/figcaption><\/figure><\/section>", "title_en": "Object Creation and Memory Problems", "html_en": "<section class=\"sec\" id=\"s-object-creation\"><h3>Object Creation and Deallocation<\/h3><pre class=\"code\">PlayingCard aCard(diamond, 3);                            // static (local object)\nPlayingCard* aCardPtr = new PlayingCard(diamond, 3);      // dynamic\nPlayingCard* CardsPtr = new PlayingCard[100];             // dynamic array (default constructor 100 times)\ndelete aCardPtr;      // deallocation\ndelete [] CardsPtr;   // array deallocation<\/pre>\n<ul><li>Local objects are destroyed <b>in reverse order of creation<\/b>; <code>delete[]<\/code> destroys array elements <b>from the last one backwards<\/b><\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-leak-dangling\"><h3>Memory Leak · Dangling Pointer · GC<\/h3><ul><li><b>Memory leak<\/b>: dynamically allocated memory that is <b>never deallocated<\/b> and can no longer be used (the pointer to it has been lost)<\/li><li><b>Dangling pointer<\/b>: <b>a pointer pointing to memory that has already been deallocated<\/b>. Accessing it is undefined behavior → crashes, corrupts memory used by other data<\/li><li><b>Garbage collection<\/b>: automatically reclaims unused memory (Java). C++ has none<\/li><\/ul>\n<div class=\"callout exam\">Exam point: 2025 essay \"(i) What is a dangling pointer? (ii) Why dangerous?\", 2024 blank \"A pointer pointing to a memory location that has been deallocated is called a (dangling) pointer\".<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L04-p19.jpg\" aria-label=\"Enlarge\"><img src=\"img/L04-p19.jpg\" alt=\"L04 p.19 · Object Creation (memory leak, dangling pointer)\" loading=\"lazy\"><\/button><figcaption>L04 p.19 · Object Creation (memory leak, dangling pointer)<\/figcaption><\/figure><\/section>", "topics": ["memory"]}, {"id": "L4-7", "title": "static · const 멤버 함수 · inline · 정의와 구현 분리", "src": "L04 p.20–25 + 보충 자료", "secs": [{"id": "static-member", "title": "static 멤버", "title_en": "static Members", "topic": "static"}, {"id": "const-fn", "title": "const 멤버 함수", "title_en": "const Member Functions", "topic": "constfn"}, {"id": "inline", "title": "inline 함수", "title_en": "inline Functions", "topic": "inline"}, {"id": "separate-def", "title": "메서드 순서 · 정의와 구현 분리", "title_en": "Order of Methods · Separating Definition and Implementation", "topic": "trace"}], "html": "<section class=\"sec\" id=\"s-static-member\"><h3>static 멤버<\/h3><ul><li><b>static<\/b>: 모든 인스턴스가 <b>같은 값을 공유<\/b>. <b>클래스당 하나 (one per class)<\/b><\/li><li>static 멤버는 <b>클래스의 속성(property of the class)<\/b> 을 다룰 때 쓴다<\/li><li><b>static 멤버 변수<\/b>: 클래스당 하나, <b>객체가 하나도 없어도 접근 가능<\/b><\/li><li><b>static 멤버 함수<\/b>: 객체 없이 <code>클래스이름::함수()<\/code>로 호출 가능, <b>non-static 멤버 변수·함수에는 접근할 수 없다<\/b><\/li><li>클래스 밖에서 정의·초기화: <code>int File::open_files = 0;<\/code><\/li><li><code>static const int Spade = 1;<\/code> (const = 다시 대입하지 않음)<\/li><\/ul>\n<pre class=\"code\">class File {\n  static int open_files;\npublic:\n  File(const String&amp; filename, const String&amp; modes);\n  File(const File&amp;);\n  ~File();\n  static int existing() { return open_files; }   // 존재하는 File 객체 수\n};\nint File::open_files = 0;\nFile::File(const String&amp; filename, const String&amp; modes) { ++open_files; }\nFile::~File() { --open_files; }<\/pre>\n<div class=\"callout exam\">시험 포인트: 2025 빈칸 \"static members are used to represent the properties of (the class)… can be accessed even if there is no (created object)\", 2024 \"no matter how many (objects) are created, only one copy\", 2022 서술 File 예제 \"(3) What problem occurs without static?\" → 객체마다 자기 open_files를 가져서 각자 1이 되고, 전체 File 객체 수를 셀 수 없다.<\/div><\/section>\n<section class=\"sec\" id=\"s-const-fn\"><h3>const 멤버 함수<\/h3><ul><li><b>호출된 객체의 데이터 멤버를 바꾸지 않는<\/b> 멤버 함수 (읽기 전용 함수)<\/li><li>이 제한은 <b>컴파일러가 강제(enforced by the compiler)<\/b> 한다<\/li><li>이점: 클라이언트에게 <b>해가 없다는 것(benign nature)을 보장<\/b> → 안전성, 가독성<\/li><li>예: <code>int PlayingCard::rank () const { return rankValue; }<\/code><\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2025·2024·2023·2022 <b>4년 연속<\/b> 빈칸 \"(const) member function does not (modify) any data members of the object on which it is called. This restriction is enforced by (the compiler)\".<\/div><\/section>\n<section class=\"sec\" id=\"s-inline\"><h3>inline 함수<\/h3><p>(슬라이드는 질문만 있고 수업에서 설명하는 부분)<\/p>\n<ul><li><b>inline 함수<\/b>: 컴파일러가 <b>함수 호출을 함수 몸체로 바꿔 넣는(호출 위치에 코드를 펼치는)<\/b> 함수. 클래스 정의 안에서 몸체를 쓴 멤버 함수는 암묵적으로 inline<\/li><li>이득을 보는 상황: ① 몸체가 <b>작을 때<\/b> (getter/setter) ② <b>아주 자주 호출<\/b>될 때 (루프 안)<\/li><li>주 이점: <b>실행이 빠르다<\/b> — 함수 호출 오버헤드(인자 전달, 점프, 스택 프레임, 반환)가 없어지니까<\/li><li>단점: <b>코드 크기 증가 (code bloat)<\/b>, 특히 함수가 크거나 여러 곳에서 호출될 때<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2022 서술 4문항 (정의, 이득 상황 2개, 주 이점과 이유, 단점).<\/div><\/section>\n<section class=\"sec\" id=\"s-separate-def\"><h3>메서드 순서 · 정의와 구현 분리<\/h3><p><b>메서드 나열 지침<\/b>: 중요한 것 먼저, 생성자 먼저, <b>public을 private보다 먼저<\/b>, 긴 목록은 그룹으로, 찾기 쉽게 알파벳 순<\/p>\n<p><b>클래스 밖 정의<\/b><\/p>\n<pre class=\"code\">PlayingCard::Colors PlayingCard::color ( ) {\n  if ((suit == Diamond) || (suit == Heart)) return Red;\n  return Black;\n}<\/pre>\n<ul><li><code>클래스이름::<\/code> 을 붙인다. 반환 타입도 클래스 안의 타입이면 <code>PlayingCard::Colors<\/code>처럼<\/li><li>생성자·소멸자는 반환 타입 없이 <code>TIntStack::TIntStack(...)<\/code><\/li><\/ul><\/section>", "title_en": "static · const Member Functions · inline · Separating Definition and Implementation", "html_en": "<section class=\"sec\" id=\"s-static-member\"><h3>static Members<\/h3><ul><li><b>static<\/b>: all instances <b>share the same value<\/b>. <b>One per class<\/b><\/li><li>static members are used to represent <b>the properties of the class<\/b><\/li><li><b>static member variable<\/b>: one per class, <b>accessible even if no object exists<\/b><\/li><li><b>static member function<\/b>: can be called without an object as <code>ClassName::function()<\/code>; <b>cannot access non-static class data and functions<\/b><\/li><li>Defined and initialized outside the class: <code>int File::open_files = 0;<\/code><\/li><li><code>static const int Spade = 1;<\/code> (const = it will not be reassigned)<\/li><\/ul>\n<pre class=\"code\">class File {\n  static int open_files;\npublic:\n  File(const String&amp; filename, const String&amp; modes);\n  File(const File&amp;);\n  ~File();\n  static int existing() { return open_files; }   // number of existing File objects\n};\nint File::open_files = 0;\nFile::File(const String&amp; filename, const String&amp; modes) { ++open_files; }\nFile::~File() { --open_files; }<\/pre>\n<div class=\"callout exam\">Exam point: 2025 blank \"static members are used to represent the properties of (the class)… can be accessed even if there is no (created object)\", 2024 \"no matter how many (objects) are created, only one copy\", 2022 essay on the File example \"(3) What problem occurs without static?\" → each object has its own open_files, each becomes 1, and the total number of File objects cannot be counted.<\/div><\/section>\n<section class=\"sec\" id=\"s-const-fn\"><h3>const Member Functions<\/h3><ul><li>A member function that <b>does not modify any data members of the object on which it is called<\/b> (read-only function)<\/li><li>This restriction is <b>enforced by the compiler<\/b><\/li><li>Benefit: assures its clients of its <b>benign nature<\/b> → safety, readability<\/li><li>e.g. <code>int PlayingCard::rank () const { return rankValue; }<\/code><\/li><\/ul>\n<div class=\"callout exam\">Exam point: blank <b>four years in a row<\/b> (2025·2024·2023·2022) \"(const) member function does not (modify) any data members of the object on which it is called. This restriction is enforced by (the compiler)\".<\/div><\/section>\n<section class=\"sec\" id=\"s-inline\"><h3>inline Functions<\/h3><p>(The slide only has the questions; this part was explained in class)<\/p>\n<ul><li><b>inline function<\/b>: a function whose <b>calls the compiler replaces with the function body (expands the code at the call site)<\/b>. A member function whose body is written inside the class definition is implicitly inline<\/li><li>When it pays off: ① the body is <b>small<\/b> (getter/setter) ② it is <b>called very often<\/b> (inside a loop)<\/li><li>Main benefit: <b>faster execution<\/b> — because the function call overhead (passing arguments, jumping, stack frame, returning) disappears<\/li><li>Drawback: <b>larger code size (code bloat)<\/b>, especially when the function is large or called from many places<\/li><\/ul>\n<div class=\"callout exam\">Exam point: 2022 essay with 4 parts (definition, two situations where it helps, main benefit and why, drawback).<\/div><\/section>\n<section class=\"sec\" id=\"s-separate-def\"><h3>Order of Methods · Separating Definition and Implementation<\/h3><p><b>Guidelines for listing methods<\/b>: important topics first, constructors first, <b>public before private<\/b>, break long lists into groups, alphabetical order to make searching easier<\/p>\n<p><b>Definition outside the class<\/b><\/p>\n<pre class=\"code\">PlayingCard::Colors PlayingCard::color ( ) {\n  if ((suit == Diamond) || (suit == Heart)) return Red;\n  return Black;\n}<\/pre>\n<ul><li>Prefix with <code>ClassName::<\/code>. If the return type is a type declared inside the class, write it like <code>PlayingCard::Colors<\/code><\/li><li>Constructors and destructors have no return type: <code>TIntStack::TIntStack(...)<\/code><\/li><\/ul><\/section>", "topics": ["constfn", "inline", "static", "trace"]}, {"id": "L4-8", "title": "friend · 참조", "src": "L04 p.26–31 + ref.cpp", "secs": [{"id": "friend", "title": "friend", "title_en": "friend", "topic": "friend"}, {"id": "reference", "title": "참조 (Reference)", "title_en": "References", "topic": "passing"}, {"id": "ref-vs-pointer", "title": "참조 vs 포인터", "title_en": "Reference vs Pointer", "topic": "passing"}], "html": "<section class=\"sec\" id=\"s-friend\"><h3>friend<\/h3><ul><li>클래스의 <b>friend 함수는 그 클래스의 non-public 멤버에 접근할 권리<\/b>가 있다<\/li><li>ClassTwo의 모든 멤버 함수를 ClassOne의 friend로: ClassOne 정의 안에 <code>friend class ClassTwo;<\/code><\/li><\/ul>\n<pre class=\"code\">class Count {\n  friend void setX(Count&amp;, int);   // friend 선언 (public/private 어디든 가능)\npublic:\n  Count() : x(0) { }\nprivate:\n  int x;\n};\nvoid setX(Count &amp;c, int val) { c.x = val; }   // 비멤버지만 private x에 접근 OK<\/pre>\n<ul><li><b>멤버 함수<\/b>는 같은 클래스의 다른 객체의 private에도 접근 가능. 막히는 건 <b>비멤버 함수<\/b>뿐 → 고치려면 friend 선언 한 줄<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2023·2022 \"code contains one compile error… (a) Which line? (b) Why wrong? (c) Insert one line to fix\" → 비멤버 함수가 private에 접근 → <code>friend 반환형 함수이름(인자);<\/code>를 클래스 안에 추가.<\/div><\/section>\n<section class=\"sec\" id=\"s-reference\"><h3>참조 (Reference)<\/h3><ul><li><b>참조 = 객체의 별명 (alias for an object)<\/b><\/li><li>주로 <b>참조에 의한 전달 (pass-by-reference)<\/b>: 큰 인자를 값으로 전달하는 실행 시간 비용을 피함<\/li><li>매개변수, 반환 값, 변수 모두 참조로 정의 가능<\/li><\/ul>\n<pre class=\"code\">double square (double &amp;x) { return x *= x; }\ndouble foo = 10.0;\nsquare(foo);   cout &lt;&lt; foo;   // 100 (원본이 바뀜)<\/pre>\n<ul><li>함수가 참조를 반환 → lvalue: <code>v[3] = 100;<\/code> (= <code>v.operator[](3) = 100;<\/code>)<\/li><\/ul>\n<p><b>ref.cpp<\/b><\/p>\n<pre class=\"code\">int x=5;  int* y;  int&amp; z=x;\ny=&amp;x;  int w=*y;  x=9;\nz=*y*x;  x++;  z=x&amp;*y;\ncout &lt;&lt; x &lt;&lt; &quot; &quot; &lt;&lt; *y &lt;&lt; &quot; &quot; &lt;&lt; z &lt;&lt; &quot; &quot; &lt;&lt; w &lt;&lt; endl;   // 82 82 82 5<\/pre>\n<p>(z는 x의 별명, y는 x를 가리킴 → x=9 → z=9*9=81 → x++ = 82 → z = 82 &amp; 82 = 82, w는 처음 값 5)<\/p><\/section>\n<section class=\"sec\" id=\"s-ref-vs-pointer\"><h3>참조 vs 포인터<\/h3><ul><li>참조는 <b>const 포인터와 비슷하게 구현<\/b>된다<\/li><li>차이: <b>참조는 반드시 실제 객체를 가리켜야<\/b> 하지만, 포인터는 객체가 아닌 것도 가리킬 수 있다 (예: 0, NULL)<\/li><li>일반적으로 <b>참조가 더 안전하고, 덜 모호하고, 더 제한적<\/b><\/li><\/ul>\n<pre class=\"code\">void printDouble(const double&amp; rd) { cout &lt;&lt; rd; }          // 검사 필요 없음\nvoid printDouble(const double *pd) { if (pd) cout &lt;&lt; *pd; } // NULL 검사 필요<\/pre><\/section>", "title_en": "friend · References", "html_en": "<section class=\"sec\" id=\"s-friend\"><h3>friend<\/h3><ul><li><b>A friend function of a class has the right to access the non-public members<\/b> of the class<\/li><li>To make all member functions of ClassTwo friends of ClassOne: put <code>friend class ClassTwo;<\/code> in the definition of ClassOne<\/li><\/ul>\n<pre class=\"code\">class Count {\n  friend void setX(Count&amp;, int);   // friend declaration (may go in public or private)\npublic:\n  Count() : x(0) { }\nprivate:\n  int x;\n};\nvoid setX(Count &amp;c, int val) { c.x = val; }   // non-member, but may access private x<\/pre>\n<ul><li><b>A member function<\/b> can access the private members of other objects of the same class too. Only <b>non-member functions<\/b> are blocked → the fix is one friend declaration line<\/li><\/ul>\n<div class=\"callout exam\">Exam point: 2023·2022 \"code contains one compile error… (a) Which line? (b) Why wrong? (c) Insert one line to fix\" → a non-member function accesses a private member → add <code>friend ReturnType functionName(args);<\/code> inside the class.<\/div><\/section>\n<section class=\"sec\" id=\"s-reference\"><h3>References<\/h3><ul><li><b>reference = alias for an object<\/b><\/li><li>Mainly used for <b>pass-by-reference<\/b>: avoids the run-time cost of passing large arguments by value<\/li><li>Parameters, return values, and variables can all be defined as references<\/li><\/ul>\n<pre class=\"code\">double square (double &amp;x) { return x *= x; }\ndouble foo = 10.0;\nsquare(foo);   cout &lt;&lt; foo;   // 100 (the original is changed)<\/pre>\n<ul><li>A function returning a reference → an lvalue: <code>v[3] = 100;<\/code> (= <code>v.operator[](3) = 100;<\/code>)<\/li><\/ul>\n<p><b>ref.cpp<\/b><\/p>\n<pre class=\"code\">int x=5;  int* y;  int&amp; z=x;\ny=&amp;x;  int w=*y;  x=9;\nz=*y*x;  x++;  z=x&amp;*y;\ncout &lt;&lt; x &lt;&lt; &quot; &quot; &lt;&lt; *y &lt;&lt; &quot; &quot; &lt;&lt; z &lt;&lt; &quot; &quot; &lt;&lt; w &lt;&lt; endl;   // 82 82 82 5<\/pre>\n<p>(z is an alias of x, y points to x → x=9 → z=9*9=81 → x++ = 82 → z = 82 &amp; 82 = 82; w keeps the initial value 5)<\/p><\/section>\n<section class=\"sec\" id=\"s-ref-vs-pointer\"><h3>Reference vs Pointer<\/h3><ul><li>References are <b>implemented similarly to const pointers<\/b><\/li><li>Difference: <b>a reference must refer to an actual object<\/b>, but a pointer can refer to things that aren't objects (e.g. 0, NULL)<\/li><li>In general, <b>references are safer, less ambiguous, and more restricted<\/b> than pointers<\/li><\/ul>\n<pre class=\"code\">void printDouble(const double&amp; rd) { cout &lt;&lt; rd; }          // no need to test\nvoid printDouble(const double *pd) { if (pd) cout &lt;&lt; *pd; } // NULL check needed<\/pre><\/section>", "topics": ["friend", "passing"]}, {"id": "L4-9", "title": "인자 전달 방식 · 메모리 안전 · 지역 참조 반환", "src": "L04 p.32–37", "secs": [{"id": "pass-modes", "title": "인자 전달 모드 (클라이언트 관점)", "title_en": "Argument Passing Modes (The Client's View)", "topic": "passing"}, {"id": "pass-guide", "title": "올바른 모드 고르기", "title_en": "Selecting the Correct Mode", "topic": "passing"}, {"id": "memory-safe", "title": "메모리 안전한 클래스 · 클라이언트의 책임", "title_en": "Memory-Safe Classes · The Client's Responsibilities", "topic": "memory"}, {"id": "return-local", "title": "지역 객체의 참조를 반환하지 마라", "title_en": "Never Return a Reference to a Local Object", "topic": "passing"}], "html": "<section class=\"sec\" id=\"s-pass-modes\"><h3>인자 전달 모드 (클라이언트 관점)<\/h3><pre class=\"code\">1. void X::f(T arg)                // pass by value\n2. void X::f(const T arg)          // pass by value\n3. void X::f(T&amp; arg)               // pass by reference\n4. void X::f(const T&amp; arg)         // pass by reference\n5. void X::f(T* argp)              // pass by pointer\n6. void X::f(const T* argp)        // pass by pointer\n7. void X::f(T* const argp)        // pointer is constant\n8. void X::f(const T* const argp)<\/pre>\n<ul><li><b>읽기 전용 매개변수에 const 없는 참조 전달을 절대 쓰지 마라<\/b><\/li><li><code>T&amp;<\/code> vs <code>T<\/code>: ① <b>복사를 피함<\/b> (복사 생성자 호출 없음 → 큰 객체에 효율적) ② 함수가 <b>원본을 바꿀 수 있음<\/b><\/li><li><code>const T&amp;<\/code> vs <code>T&amp;<\/code>: 복사는 피하면서 <b>원본을 못 바꾸게<\/b> 보장 (안전)<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2022 기말 서술 \"(1) Two purposes of '&amp;' in (b) vs (a)? (2) Purpose of const in (c) vs (b)?\".<\/div><\/section>\n<section class=\"sec\" id=\"s-pass-guide\"><h3>올바른 모드 고르기<\/h3><ul><li><b>큰 객체를 값으로 넘기지 마라<\/b> — 왜? 객체 전체가 매개변수로 <b>복사<\/b>되므로 (복사 생성자 호출, 메모리 할당과 복사, 끝나면 소멸자) 오버헤드가 큼. 참조는 <b>주소만<\/b> 넘기므로 오버헤드가 아주 작다<\/li><li>기본 타입이나 작은 객체는 <b>값으로<\/b> (더 안전)<\/li><li>가능한 곳마다 <b>const<\/b> 를 인자와 함수에 → 더 견고한 프로그램<\/li><li>객체를 넘길 때 포인터를 넘기지 마라 <code>void f(T* object);<\/code> — 포인터는 NULL일 수 있지만 null 참조는 없다, 참조 전달은 객체의 소유권을 넘기지 않는다<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2017 서술 \"(a) Why does high overhead occur when passing large objects by value? (b) Why is the overhead very small with call-by-reference?\".<\/div><\/section>\n<section class=\"sec\" id=\"s-memory-safe\"><h3>메모리 안전한 클래스 · 클라이언트의 책임<\/h3><p><b>Writing memory safe classes<\/b><\/p>\n<ul><li>객체 복사를 피해라 (비쌈), 새 객체 생성을 피하고 재사용<\/li><li>const 참조 매개변수, const 멤버 함수를 써라<\/li><li>데이터 멤버로는 참조 대신 포인터를, 기본 생성자에서 저장소 할당을 미루기, 가능하면 참조 계수(reference counting)<\/li><li>초기에 트릭 쓰지 말기: <b>안전 먼저<\/b>(메모리 누수 없게), 최적화는 나중에<\/li><\/ul>\n<p><b>Client's responsibilities<\/b> (요약): 클래스의 목적을 이해, 구현자가 기대하는 것(계약)을 이해, 멤버 함수 특히 const 멤버 함수에 주의, 인자를 이해, 반환된 포인터·참조에 대한 책임 이해, 문서에 없는 세부에 의존하지 말기, const 포인터·참조를 받는 함수를 선호<\/p><\/section>\n<section class=\"sec\" id=\"s-return-local\"><h3>지역 객체의 참조를 반환하지 마라<\/h3><pre class=\"code\">int  f () { int i = 2; return i; }    // OK (값 복사)\nint* g () { int j = 2; return &amp;j; }   // 경고: 지역 변수 주소 반환\nint&amp; h () { int k = 2; return k; }    // 경고: 지역 변수 참조 반환<\/pre>\n<ul><li>함수가 반환되면 지역 변수는 사라진다 → 그 주소·참조는 <b>댕글링<\/b> → 정의되지 않은 동작<\/li><\/ul><\/section>", "title_en": "Argument Passing Modes · Memory Safety · Returning Local References", "html_en": "<section class=\"sec\" id=\"s-pass-modes\"><h3>Argument Passing Modes (The Client's View)<\/h3><pre class=\"code\">1. void X::f(T arg)                // pass by value\n2. void X::f(const T arg)          // pass by value\n3. void X::f(T&amp; arg)               // pass by reference\n4. void X::f(const T&amp; arg)         // pass by reference\n5. void X::f(T* argp)              // pass by pointer\n6. void X::f(const T* argp)        // pass by pointer\n7. void X::f(T* const argp)        // pointer is constant\n8. void X::f(const T* const argp)<\/pre>\n<ul><li><b>Do not ever use pass by reference (without const qualifier) mode for read-only parameters<\/b><\/li><li><code>T&amp;<\/code> vs <code>T<\/code>: ① <b>avoids copying<\/b> (no copy constructor call → efficient for large objects) ② the function <b>can modify the original<\/b><\/li><li><code>const T&amp;<\/code> vs <code>T&amp;<\/code>: avoids copying while guaranteeing <b>the original cannot be modified<\/b> (safe)<\/li><\/ul>\n<div class=\"callout exam\">Exam point: 2022 final essay \"(1) Two purposes of '&amp;' in (b) vs (a)? (2) Purpose of const in (c) vs (b)?\".<\/div><\/section>\n<section class=\"sec\" id=\"s-pass-guide\"><h3>Selecting the Correct Mode<\/h3><ul><li><b>Avoid passing large objects by value<\/b> — why? The whole object is <b>copied<\/b> into the parameter (copy constructor call, memory allocation and copying, destructor at the end), so the overhead is high. A reference passes <b>only the address<\/b>, so the overhead is very small<\/li><li>For primitive types or small objects, pass <b>by value<\/b> (safer)<\/li><li>Use <b>const<\/b> for arguments and functions wherever possible → a more robust program<\/li><li>Don't pass pointers when you mean to pass objects <code>void f(T* object);<\/code> — a pointer can be NULL but there is no null reference; passing a reference does not transfer ownership of the object<\/li><\/ul>\n<div class=\"callout exam\">Exam point: 2017 essay \"(a) Why does high overhead occur when passing large objects by value? (b) Why is the overhead very small with call-by-reference?\".<\/div><\/section>\n<section class=\"sec\" id=\"s-memory-safe\"><h3>Memory-Safe Classes · The Client's Responsibilities<\/h3><p><b>Writing memory safe classes<\/b><\/p>\n<ul><li>Avoid making copies of objects (expensive); avoid creating new objects and reuse existing ones<\/li><li>Use const reference parameters and const member functions<\/li><li>Use pointers instead of references as data members, delay storage allocation in the default constructor, use reference counting wherever possible<\/li><li>Resist tricks in the initial stage: <b>safety first<\/b> (no memory leaks), optimization later<\/li><\/ul>\n<p><b>Client's responsibilities<\/b> (summary): understand the purpose of the class, understand what the implementor expects (the contract), pay attention to member functions especially const ones, understand the arguments, understand your responsibility for returned pointers/references, don't rely on undocumented details, prefer functions that take const pointers/references<\/p><\/section>\n<section class=\"sec\" id=\"s-return-local\"><h3>Never Return a Reference to a Local Object<\/h3><pre class=\"code\">int  f () { int i = 2; return i; }    // OK (value is copied)\nint* g () { int j = 2; return &amp;j; }   // warning: address of local variable returned\nint&amp; h () { int k = 2; return k; }    // warning: reference to local variable returned<\/pre>\n<ul><li>When the function returns, its local variables are gone → that address/reference is <b>dangling<\/b> → undefined behavior<\/li><\/ul><\/section>", "topics": ["memory", "passing"]}, {"id": "L4-10", "title": "Copy-On-Write · TIntStack", "src": "L04 p.38–40 + 기출", "secs": [{"id": "cow", "title": "Copy-On-Write (TString)", "title_en": "Copy-On-Write (TString)", "topic": "copy"}, {"id": "tintstack", "title": "TIntStack (깊은 복사 구현)", "title_en": "TIntStack (Deep Copy Implementation)", "topic": "stack"}], "html": "<section class=\"sec\" id=\"s-cow\"><h3>Copy-On-Write (TString)<\/h3><ul><li>객체 생성·소멸은 비싸다. 큰 객체의 복사 생성자가 자주 불리면 동적 메모리 복사·삭제에 많은 시간<\/li><li><b>Copy-on-write<\/b>: <b>쓸 때만<\/b> 새 메모리를 할당. 그 전엔 원본과 새 객체가 데이터를 <b>공유<\/b><\/li><li><b>참조 계수(use_count)<\/b> 를 유지<\/li><li>예) s, k, m 세 TString이 \"ADD ONE TO COBOL\" 하나를 공유 (use_count=3) → <code>s.to_lower();<\/code> 로 s에 쓰는 순간 s만 새 메모리 (\"add one to cobol\", use_count=1), k와 m은 계속 공유 (use_count=2)<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L04-p39.jpg\" aria-label=\"크게 보기\"><img src=\"img/L04-p39.jpg\" alt=\"L04 p.39 · TString: 세 객체가 데이터 공유 (use_count=3)\" loading=\"lazy\"><\/button><figcaption>L04 p.39 · TString: 세 객체가 데이터 공유 (use_count=3)<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L04-p40.jpg\" aria-label=\"크게 보기\"><img src=\"img/L04-p40.jpg\" alt=\"L04 p.40 · s.to_lower() 뒤: s만 새 메모리\" loading=\"lazy\"><\/button><figcaption>L04 p.40 · s.to_lower() 뒤: s만 새 메모리<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-tintstack\"><h3>TIntStack (깊은 복사 구현)<\/h3><p>동적 배열로 만든 정수 스택. 기출에서 생성자·복사 생성자·소멸자·Push를 직접 쓰게 함 (2022, 2017).<\/p>\n<pre class=\"code\">class TIntStack {\npublic:\n  TIntStack(unsigned int stackSize = DEFAULT_SIZE);\n  TIntStack(const TIntStack&amp; that);\n  ~TIntStack();\n  bool Push(int thisValue);           // 꽉 찼으면 false\nprivate:\n  int* _sp;              // 생성자에서 동적 할당\n  unsigned int _count;   // 원소 수\n  unsigned int _size;    // 용량\n};\nTIntStack::TIntStack(unsigned int stackSize) { _size = stackSize; _count = 0; _sp = new int[_size]; }\nTIntStack::TIntStack(const TIntStack&amp; that) {          // 깊은 복사\n  _size = that._size; _count = that._count;\n  _sp = new int[_size];\n  for (unsigned int i = 0; i &lt; _count; i++) _sp[i] = that._sp[i];\n}\nTIntStack::~TIntStack() { delete[] _sp; }\nbool TIntStack::Push(int thisValue) {\n  if (_count &gt;= _size) return false;\n  _sp[_count++] = thisValue;\n  return true;\n}<\/pre>\n<ul><li>클래스 밖 정의: <b>반환 타입 없이<\/b>(생성자·소멸자), <code>TIntStack::<\/code> 붙이고, 다른 객체는 <code>that._size<\/code>처럼 <code>.<\/code><\/li><li><code>_sp = that._sp;<\/code> 만 하면 얕은 복사 → 감점<\/li><li>스택 = <b>LIFO<\/b> (last in, first out): 1, 3, 4 순서로 push하면 pop은 4, 3, 1<\/li><\/ul><\/section>", "title_en": "Copy-On-Write · TIntStack", "html_en": "<section class=\"sec\" id=\"s-cow\"><h3>Copy-On-Write (TString)<\/h3><ul><li>Object creation and destruction is expensive. If the copy constructor of a large object is called often, a lot of time goes into copying and deleting dynamic memory<\/li><li><b>Copy-on-write<\/b>: allocate new memory <b>only when writing<\/b>. Until then the original and the new object <b>share<\/b> the data<\/li><li>Maintain a <b>reference count (use_count)<\/b><\/li><li>e.g. three TStrings s, k, m share one \"ADD ONE TO COBOL\" (use_count=3) → the moment <code>s.to_lower();<\/code> writes to s, only s gets new memory (\"add one to cobol\", use_count=1); k and m keep sharing (use_count=2)<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L04-p39.jpg\" aria-label=\"Enlarge\"><img src=\"img/L04-p39.jpg\" alt=\"L04 p.39 · TString: three objects share one data block (use_count=3)\" loading=\"lazy\"><\/button><figcaption>L04 p.39 · TString: three objects share one data block (use_count=3)<\/figcaption><\/figure><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L04-p40.jpg\" aria-label=\"Enlarge\"><img src=\"img/L04-p40.jpg\" alt=\"L04 p.40 · After s.to_lower(): only s gets new memory\" loading=\"lazy\"><\/button><figcaption>L04 p.40 · After s.to_lower(): only s gets new memory<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-tintstack\"><h3>TIntStack (Deep Copy Implementation)<\/h3><p>An integer stack built on a dynamic array. Past exams asked you to write the constructor, copy constructor, destructor and Push yourself (2022, 2017).<\/p>\n<pre class=\"code\">class TIntStack {\npublic:\n  TIntStack(unsigned int stackSize = DEFAULT_SIZE);\n  TIntStack(const TIntStack&amp; that);\n  ~TIntStack();\n  bool Push(int thisValue);           // false if full\nprivate:\n  int* _sp;              // dynamically allocated in the constructor\n  unsigned int _count;   // number of elements\n  unsigned int _size;    // capacity\n};\nTIntStack::TIntStack(unsigned int stackSize) { _size = stackSize; _count = 0; _sp = new int[_size]; }\nTIntStack::TIntStack(const TIntStack&amp; that) {          // deep copy\n  _size = that._size; _count = that._count;\n  _sp = new int[_size];\n  for (unsigned int i = 0; i &lt; _count; i++) _sp[i] = that._sp[i];\n}\nTIntStack::~TIntStack() { delete[] _sp; }\nbool TIntStack::Push(int thisValue) {\n  if (_count &gt;= _size) return false;\n  _sp[_count++] = thisValue;\n  return true;\n}<\/pre>\n<ul><li>Definitions outside the class: <b>no return type<\/b> (constructors/destructor), prefix with <code>TIntStack::<\/code>, access the other object with <code>.<\/code> as in <code>that._size<\/code><\/li><li>Writing only <code>_sp = that._sp;<\/code> is a shallow copy → points deducted<\/li><li>Stack = <b>LIFO<\/b> (last in, first out): push 1, 3, 4 in that order and pop gives 4, 3, 1<\/li><\/ul><\/section>", "topics": ["copy", "stack"]}], "title_en": "C++ Data Abstraction: class", "intro_en": "The professor called this unit \"the most important part of this course\". Data abstraction, encapsulation and information hiding, the three benefits of encapsulation, the three reasons to avoid public data, constructors, copy constructors, static, const member functions, inline, friend, references, and argument passing modes. The 10/7 class got as far as constructors, and there is no transcript of the 10/14 class. The material after that is also a past-exam regular, so it is covered here too."}, {"id": "U5", "title": "연산자 오버로딩 (Project 2 참고)", "src": "Operator Overloading (Proj2 참고).pdf + Project2/src/complex.cpp", "intro": "Project 2(inf_int)용 자료. 프로젝트 마감(11/1)이 시험 뒤라 코딩 문제로 나올 가능성은 낮지만, 멤버 함수 방식과 friend(비멤버) 방식의 차이는 개념 문제로 나올 수 있어.", "lessons": [{"id": "L5-1", "title": "연산자 함수: 멤버 방식 vs 비멤버(friend) 방식", "src": "Operator Overloading p.1–3", "secs": [{"id": "opover-basic", "title": "연산자 함수와 두 가지 방식", "title_en": "Operator Functions and the Two Methods", "topic": "opover"}, {"id": "opover-complex", "title": "Complex 예제", "title_en": "Complex Example", "topic": "opover"}], "html": "<section class=\"sec\" id=\"s-opover-basic\"><h3>연산자 함수와 두 가지 방식<\/h3><ul><li><b>연산자 함수 (operator function)<\/b>: 연산자(<code>+ - * / [] &lt;&lt; &gt;&gt;<\/code> …)를 <b>함수로 다시 정의<\/b><\/li><li><b>멤버 함수 방식<\/b><ul><li><code>this<\/code>로 인자 하나를 암묵적으로 받음 → 이항 연산자의 <b>왼쪽 피연산자<\/b><\/li><li><b>가장 왼쪽 객체가 연산자와 같은 클래스<\/b>여야 함<\/li><li><code>c = a + b;<\/code> → <code>c = a.operator+(b);<\/code><\/li><\/ul><\/li><li><b>비멤버 함수 방식<\/b><ul><li><b>두 피연산자 모두 매개변수<\/b>로 받음<\/li><li>왼쪽 객체가 <b>다른 클래스<\/b>여도 됨 (예: <code>cout &lt;&lt; obj<\/code>)<\/li><li>private/protected 데이터에 접근하려면 <b>friend<\/b>여야 함<\/li><li><code>c = a + b;<\/code> → <code>c = operator+(a, b);<\/code><\/li><\/ul><\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: \"멤버 방식에서 왼쪽 피연산자는 무엇으로 받나 (this)\", \"비멤버 방식이 private에 접근하려면 (friend)\".<\/div><\/section>\n<section class=\"sec\" id=\"s-opover-complex\"><h3>Complex 예제<\/h3><p><b>비멤버(friend) 방식<\/b><\/p>\n<pre class=\"code\">class Complex {\nprivate:\n  double re, im;\npublic:\n  Complex(double r, double i) : re(r), im(i) {}\n  friend Complex operator+(Complex&amp;, Complex&amp;);\n  friend Complex operator-(Complex&amp;, Complex&amp;);\n  friend Complex operator*(Complex&amp;, Complex&amp;);\n  void Display() { ... }\n};\nComplex operator+(Complex&amp; i, Complex&amp; other) {\n  return Complex(i.re + other.re, i.im + other.im);\n}\nComplex operator*(Complex&amp; i, Complex&amp; other) {\n  return Complex(i.re*other.re - i.im*other.im, i.re*other.im + i.im*other.re);\n}<\/pre>\n<p><b>멤버 방식<\/b><\/p>\n<pre class=\"code\">class Complex {\n  ...\n  Complex operator+(Complex&amp; other);\n};\nComplex Complex::operator+(Complex&amp; other) {\n  return Complex(re + other.re, im + other.im);\n}<\/pre>\n<ul><li>a = 1.2+3.4i, b = 5.6+7.8i → a+b = 6.8+11.2i, a−b = −4.4−4.4i, a×b = −19.8+28.4i (두 방식 결과 같음)<\/li><li>Project 2의 <code>inf_int<\/code>도 같은 방식으로 <code>+ - * ( )<\/code>를 지원하는 무한 정수 계산기를 만든다. <code>inf_int<\/code>는 자릿수를 동적 할당하므로 <b>복사 생성자·소멸자·operator=<\/b> 가 필요 (L4-5)<\/li><\/ul><\/section>", "title_en": "Operator Functions: Member Method vs Non-Member (friend) Method", "html_en": "<section class=\"sec\" id=\"s-opover-basic\"><h3>Operator Functions and the Two Methods<\/h3><ul><li><b>Operator function<\/b>: <b>redefines an operator<\/b> (<code>+ - * / [] &lt;&lt; &gt;&gt;<\/code> …) <b>as a function<\/b><\/li><li><b>Member function method<\/b><ul><li>Uses <code>this<\/code> to implicitly get one argument → the <b>left operand<\/b> of a binary operator<\/li><li>The <b>leftmost object must be of the same class<\/b> as the operator<\/li><li><code>c = a + b;<\/code> → <code>c = a.operator+(b);<\/code><\/li><\/ul><\/li><li><b>Non-member function method<\/b><ul><li>Needs <b>parameters for both operands<\/b><\/li><li>The left object can be of a <b>different class<\/b> (e.g. <code>cout &lt;&lt; obj<\/code>)<\/li><li>Must be a <b>friend<\/b> to access private/protected data<\/li><li><code>c = a + b;<\/code> → <code>c = operator+(a, b);<\/code><\/li><\/ul><\/li><\/ul>\n<div class=\"callout exam\">Exam point: \"In the member method, what provides the left operand? (this)\", \"What must a non-member operator function be to access private data? (a friend)\".<\/div><\/section>\n<section class=\"sec\" id=\"s-opover-complex\"><h3>Complex Example<\/h3><p><b>Non-member (friend) method<\/b><\/p>\n<pre class=\"code\">class Complex {\nprivate:\n  double re, im;\npublic:\n  Complex(double r, double i) : re(r), im(i) {}\n  friend Complex operator+(Complex&amp;, Complex&amp;);\n  friend Complex operator-(Complex&amp;, Complex&amp;);\n  friend Complex operator*(Complex&amp;, Complex&amp;);\n  void Display() { ... }\n};\nComplex operator+(Complex&amp; i, Complex&amp; other) {\n  return Complex(i.re + other.re, i.im + other.im);\n}\nComplex operator*(Complex&amp; i, Complex&amp; other) {\n  return Complex(i.re*other.re - i.im*other.im, i.re*other.im + i.im*other.re);\n}<\/pre>\n<p><b>Member method<\/b><\/p>\n<pre class=\"code\">class Complex {\n  ...\n  Complex operator+(Complex&amp; other);\n};\nComplex Complex::operator+(Complex&amp; other) {\n  return Complex(re + other.re, im + other.im);\n}<\/pre>\n<ul><li>a = 1.2+3.4i, b = 5.6+7.8i → a+b = 6.8+11.2i, a−b = −4.4−4.4i, a×b = −19.8+28.4i (both methods give the same results)<\/li><li>Project 2's <code>inf_int<\/code> uses the same approach to build an infinite-precision integer calculator supporting <code>+ - * ( )<\/code>. Because <code>inf_int<\/code> allocates its digits dynamically, it needs a <b>copy constructor, destructor and operator=<\/b> (L4-5)<\/li><\/ul><\/section>", "topics": ["opover"]}], "title_en": "Operator Overloading (Project 2 reference)", "intro_en": "Material for Project 2 (inf_int). The project deadline (11/1) is after the exam, so a coding question is unlikely, but the difference between the member-function method and the friend (non-member) method may come up as a concept question."}], "checks": [{"id": "c-cri-1", "concept": "crisis", "type": "blank", "prompt": "(a) arose because computer hardware power grew rapidly and the (b) of software systems increased even faster than software technology could follow.", "accept": [["software crisis", "소프트웨어 위기"], ["complexity", "복잡도"]], "answer": "(a) software crisis / (b) complexity", "lesson": "L1-1"}, {"id": "c-cri-2", "concept": "crisis", "type": "mc", "prompt": "소프트웨어 위기의 '원인'으로 교안이 꼽은 것은?", "choices": ["프로그래머 부족", "하드웨어 가격", "복잡도 (complexity)", "유지보수 비용"], "answer": 2, "lesson": "L1-1"}, {"id": "c-cri-3", "concept": "crisis", "type": "ox", "prompt": "소프트웨어 위기의 증상에는 예산 초과(over-budget), 일정 초과(over-time), 요구사항 불충족이 있다.", "answer": true, "lesson": "L1-1"}, {"id": "c-lc-1", "concept": "lifecycle", "type": "blank", "prompt": "Fred Brooks: over 90% of (a) of a typical system arise in the (b) phase, and any successful piece of software will inevitably be (c).", "accept": [["the costs", "costs", "cost", "the cost", "비용"], ["maintenance", "the maintenance", "유지보수"], ["maintained", "유지보수된다"]], "answer": "(a) the costs / (b) maintenance / (c) maintained", "lesson": "L1-1"}, {"id": "c-lc-2", "concept": "lifecycle", "type": "mc", "prompt": "소프트웨어 생명주기 순서로 옳은 것은?", "choices": ["Design → Requirement → Test → Implementation → Maintenance", "Requirement Analysis → Design → Implementation → Test → Maintenance", "Implementation → Design → Test → Requirement → Maintenance", "Requirement → Implementation → Design → Maintenance → Test"], "answer": 1, "lesson": "L1-1"}, {"id": "c-lc-3", "concept": "lifecycle", "type": "ox", "prompt": "Test 단계에는 unit test와 integration test가 있다.", "answer": true, "lesson": "L1-1"}, {"id": "c-sed-1", "concept": "se-def", "type": "blank", "prompt": "Fritz Bauer: software engineering is the establishment and use of sound engineering principles in order to (a) obtain software that is (b) and works efficiently.", "accept": [["economically", "경제적으로"], ["reliable", "신뢰할 수 있는"]], "answer": "(a) economically / (b) reliable", "lesson": "L1-1"}, {"id": "c-sed-2", "concept": "se-def", "type": "mc", "prompt": "SE의 목표 중 '필요할 때 SW가 제대로 작동한다고 믿을 수 있는 능력'은?", "choices": ["Maintainability", "Dependability", "Efficiency", "Usability"], "answer": 1, "lesson": "L1-1"}, {"id": "c-sed-3", "concept": "se-def", "type": "blank", "prompt": "Goals of software engineering: (i) produce a correct, efficient, and reliable software (ii) minimize (a) of software development and maintenance.", "accept": [["the cost", "cost", "costs", "the costs", "비용"]], "answer": "(a) the cost", "lesson": "L1-1"}, {"id": "c-sed-4", "concept": "se-def", "type": "ox", "prompt": "IEEE 정의에 따르면 SE는 SW의 개발·운영·유지보수에 체계적이고 규율 있고 정량화 가능한 접근을 적용하는 것이다.", "answer": true, "lesson": "L1-1"}, {"id": "c-qual-1", "concept": "quality", "type": "mc", "prompt": "Handout 1에서 maintainability에 포함되지 '않는' 것은?", "choices": ["readability", "modifiability", "extensibility", "security"], "answer": 3, "lesson": "L1-2"}, {"id": "c-qual-2", "concept": "quality", "type": "blank", "prompt": "A program with high maintainability is easy to read, easy to (a), easy to (b), and easy to reuse.", "accept": [["modify", "change", "수정"], ["extend", "확장", "debug", "test"]], "answer": "(a) modify / (b) extend", "lesson": "L1-2"}, {"id": "c-qual-3", "concept": "quality", "type": "ox", "prompt": "correctness는 사용자 요구사항·명세를 오류 없이 만족하는 것이다.", "answer": true, "lesson": "L1-2"}, {"id": "c-rob-1", "concept": "robust", "type": "blank", "prompt": "(a) means the ability of the software to consistently perform its required functions without failure under specified conditions for a specified period.", "accept": [["reliability", "신뢰성"]], "answer": "(a) reliability", "lesson": "L1-2"}, {"id": "c-rob-2", "concept": "robust", "type": "mc", "prompt": "재해나 잘못된 입력 같은 예외 상황에서도 올바른 기능을 유지하는 성질은?", "choices": ["usability", "portability", "robustness", "conciseness"], "answer": 2, "lesson": "L1-2"}, {"id": "c-sp-1", "concept": "sw-props", "type": "mc", "prompt": "'divide and conquer'에 해당하는 SW 성질은?", "choices": ["Modularity", "Localization", "Uniformity", "Confirmability"], "answer": 0, "lesson": "L1-2"}, {"id": "c-sp-2", "concept": "sw-props", "type": "mc", "prompt": "'be able to prove that the software works properly'에 해당하는 SW 성질은?", "choices": ["Completeness", "Abstraction", "Encapsulation", "Confirmability"], "answer": 3, "lesson": "L1-2"}, {"id": "c-sp-3", "concept": "sw-props", "type": "ox", "prompt": "Localization은 비슷한 것들을 한곳에 모으는 것(collect similar things together)이다.", "answer": true, "lesson": "L1-2"}, {"id": "c-uns-1", "concept": "unstructured", "type": "blank", "prompt": "(a) programming makes extensive use of GOTO statements, and the program contains only a single code block with only (b) data.", "accept": [["unstructured", "비구조적"], ["global", "전역"]], "answer": "(a) unstructured / (b) global", "lesson": "L1-3"}, {"id": "c-uns-2", "concept": "unstructured", "type": "ox", "prompt": "스파게티 코드는 goto가 여기저기 점프해서 흐름을 따라가기 어렵고 수정하기 어려운 코드다.", "answer": true, "lesson": "L1-3"}, {"id": "c-pro-1", "concept": "procedural", "type": "blank", "prompt": "structured programming ≒ (a) approach ≒ (b) ≒ functional decomposition", "accept": [["top-down", "top down", "하향식"], ["divide and conquer", "분할 정복"]], "answer": "(a) top-down / (b) divide and conquer", "lesson": "L1-3"}, {"id": "c-pro-2", "concept": "procedural", "type": "mc", "prompt": "모듈 프로그래밍에서 '보이는 것'과 '숨겨지는 것'은?", "choices": ["interface는 visible, implementation은 hidden", "implementation은 visible, interface는 hidden", "둘 다 visible", "둘 다 hidden"], "answer": 0, "lesson": "L1-3"}, {"id": "c-pro-3", "concept": "procedural", "type": "ox", "prompt": "절차적 프로그래밍에서 프로그램은 프로시저 호출의 나열이다.", "answer": true, "lesson": "L1-3"}, {"id": "c-gv-1", "concept": "global-vars", "type": "blank", "prompt": "Using (a) variables is often unsafe because this makes all modules (b) on one another.", "accept": [["global", "전역"], ["dependent", "dependant", "의존"]], "answer": "(a) global / (b) dependent", "lesson": "L1-3"}, {"id": "c-gv-2", "concept": "global-vars", "type": "mc", "prompt": "전역 변수 문제의 해결책으로 교안이 제시한 것은?", "choices": ["전역 변수를 const로", "데이터를 모듈 안에 지역화 (modularized data)", "goto 사용", "전역 변수 이름을 길게"], "answer": 1, "lesson": "L1-3"}, {"id": "c-gv-3", "concept": "global-vars", "type": "ox", "prompt": "전역 변수를 쓰면 어떤 모듈도 독립적으로 개발·이해할 수 없게 된다.", "answer": true, "lesson": "L1-3"}, {"id": "c-ow-1", "concept": "oop-why", "type": "mc", "prompt": "절차적/모듈 프로그래밍 , {"id": "c-ei-1", "concept": "encap-intro", "type": "blank", "prompt": "In the concept of information hiding, (a) of an object can be modified only through (b).", "accept": [["internal data", "data", "내부 데이터"], ["an interface", "interface", "interfaces", "인터페이스"]], "answer": "(a) internal data / (b) an interface", "lesson": "L1-4"}, {"id": "c-ei-2", "concept": "encap-intro", "type": "ox", "prompt": "캡슐화는 메시지를 보내는 객체들로부터 클래스의 기능적 세부를 감춘다.", "answer": true, "lesson": "L1-4"}, {"id": "c-ip-1", "concept": "inherit-poly", "type": "mc", "prompt": "C++에서 다형성(polymorphism)을 지원하는 기능이 '아닌' 것은?", "choices": ["virtual function", "operator overloading", "template", "static member"], "answer": 3, "lesson": "L1-4"}, {"id": "c-ip-2", "concept": "inherit-poly", "type": "ox", "prompt": "상속의 목표는 객체(클래스)의 재사용이다.", "answer": true, "lesson": "L1-4"}, {"id": "c-io-1", "concept": "cpp-io", "type": "mc", "prompt": "cout << Hello; 가 출력하는 것은?", "choices": ["문자열 Hello", "변수 Hello의 값", "컴파일 오류가 항상 남", "아무것도 안 함"], "answer": 1, "lesson": "L2-1"}, {"id": "c-io-2", "concept": "cpp-io", "type": "blank", "prompt": "cout은 (a) 스트림 객체(standard output), cin은 (b) 스트림 객체(standard input)이다.", "accept": [["screen", "화면", "monitor"], ["keyboard", "키보드"]], "answer": "(a) screen / (b) keyboard", "lesson": "L2-1"}, {"id": "c-io-3", "concept": "cpp-io", "type": "ox", "prompt": "C++ 프로그램 안에서 C 코드(printf 등)를 써도 된다.", "answer": true, "lesson": "L2-1"}, {"id": "c-bas-1", "concept": "cpp-basics", "type": "mc", "prompt": "for (A; B; C) { body } 의 실행 순서는?", "choices": ["A → B → body → C → B → body → C …", "A → body → B → C …", "B → A → body → C …", "A → C → B → body …"], "answer": 0, "lesson": "L2-1"}, {"id": "c-bas-2", "concept": "cpp-basics", "type": "ox", "prompt": "C++ string은 C 문자열(char*)과 달리 메모리를 자동으로 관리한다.", "answer": true, "lesson": "L2-1"}, {"id": "c-bas-3", "concept": "cpp-basics", "type": "mc", "prompt": "함수의 지역 변수(매개변수 포함)는 언제 생성·삭제되나?", "choices": ["프로그램 시작·끝", "컴파일 때", "함수 호출 때 생성, 반환 때 삭제", "new·delete 때"], "answer": 2, "lesson": "L2-1"}, {"id": "c-ptr-1", "concept": "pointer", "type": "mc", "prompt": "int *x; 에서 *의 의미는?", "choices": ["곱셈", "가리키는 값 (dereference)", "포인터 타입 선언", "주소 연산자"], "answer": 2, "lesson": "L2-2"}, {"id": "c-ptr-2", "concept": "pointer", "type": "mc", "prompt": "x = &y; 에서 &의 의미는?", "choices": ["비트 AND", "주소 연산자 (address-of)", "참조 타입 선언", "논리 AND"], "answer": 1, "lesson": "L2-2"}, {"id": "c-ptr-3", "concept": "pointer", "type": "mc", "prompt": "int& y = x; 에서 &의 의미는?", "choices": ["비트 AND", "주소 연산자", "포인터 선언", "참조 타입 선언"], "answer": 3, "lesson": "L2-2"}, {"id": "c-ptr-4", "concept": "pointer", "type": "blank", "prompt": "int *xPtr, x; x = 5; xPtr = &x; *xPtr = 10; cout << x; 의 출력은 (a) 이다.", "accept": [["10"]], "answer": "(a) 10", "lesson": "L2-2"}, {"id": "c-nd-1", "concept": "new-delete", "type": "blank", "prompt": "Dynamic memory allocation means memory allocation occurs at (a). C의 malloc/free는 C++의 (b)/(c)에 대응한다.", "accept": [["run-time", "run time", "runtime", "execution time", "실행 시간"], ["new"], ["delete"]], "answer": "(a) run-time / (b) new / (c) delete", "lesson": "L2-2"}, {"id": "c-nd-2", "concept": "new-delete", "type": "mc", "prompt": "int* p = new int[10]; 으로 할당한 메모리를 해제하는 올바른 문장은?", "choices": ["delete p;", "delete[] p;", "free(p);", "p = NULL;"], "answer": 1, "lesson": "L2-2"}, {"id": "c-nd-3", "concept": "new-delete", "type": "ox", "prompt": "C++은 Java처럼 garbage collection이 있어서 delete를 안 해도 된다.", "answer": false, "lesson": "L2-2"}, {"id": "c-sd-1", "concept": "static-dynamic", "type": "mc", "prompt": "정적 할당 배열 int x[10]; 의 단점은?", "choices": ["크기가 컴파일 시간에 고정되어 실행 중 바꿀 수 없음", "직접 해제해야 함", "댕글링 포인터 위험", "느림"], "answer": 0, "lesson": "L2-2"}, {"id": "c-sd-2", "concept": "static-dynamic", "type": "mc", "prompt": "동적 할당 배열 new int[n]의 단점은?", "choices": ["크기를 실행 중 정할 수 없음", "컴파일 오류가 남", "프로그래머가 delete[]로 직접 해제해야 해서 메모리 누수·댕글링 위험", "스택에 할당됨"], "answer": 2, "lesson": "L2-2"}, {"id": "c-sd-3", "concept": "static-dynamic", "type": "ox", "prompt": "정적 할당 배열은 범위를 벗어나면 메모리가 자동으로 해제된다.", "answer": true, "lesson": "L2-2"}, {"id": "c-cb-1", "concept": "class-basic", "type": "ox", "prompt": "생성자와 소멸자는 객체가 생성·삭제될 때 자동으로 호출된다.", "answer": true, "lesson": "L2-3"}, {"id": "c-cb-2", "concept": "class-basic", "type": "mc", "prompt": "생성자에서 멤버 변수를 초기화하지 않으면?", "choices": ["컴파일 오류", "쓰레기 값(garbage)을 가져서 위험·불안정", "자동으로 0이 됨", "소멸자가 호출 안 됨"], "answer": 1, "lesson": "L2-3"}, {"id": "c-op-1", "concept": "obj-pointer", "type": "mc", "prompt": "Rectangle *foo; Rectangle obj(3,4); 일 때 foo가 obj를 가리키게 하는 문장은?", "choices": ["foo = obj;", "*foo = obj;", "foo = &obj;", "foo = new obj;"], "answer": 2, "lesson": "L2-3"}, {"id": "c-op-2", "concept": "obj-pointer", "type": "mc", "prompt": "bar = new Rectangle(5,6); 일 때 넓이를 호출하는 올바른 식은?", "choices": ["bar.area()", "bar->area()", "&bar.area()", "*bar->area()"], "answer": 1, "lesson": "L2-3"}, {"id": "c-op-3", "concept": "obj-pointer", "type": "blank", "prompt": "baz = new Rectangle[2]; 이면 기본 생성자(width=1, height=1)가 (a) 번 불리고, baz[0].area()의 값은 (b) 이다. 해제는 (c) baz; 로 한다.", "accept": [["2", "두", "two"], ["1", "one"], ["delete[]", "delete []"]], "answer": "(a) 2 / (b) 1 / (c) delete[]", "lesson": "L2-3"}, {"id": "c-op-4", "concept": "obj-pointer", "type": "ox", "prompt": "배열 원소 baz[0]은 객체이므로 baz[0].area()처럼 점(.)으로 멤버에 접근한다.", "answer": true, "lesson": "L2-3"}, {"id": "c-fs-1", "concept": "fstream", "type": "blank", "prompt": "ofstream: write on files / (a): read from files / (b): read and write from/to files", "accept": [["ifstream"], ["fstream"]], "answer": "(a) ifstream / (b) fstream", "lesson": "L2-4"}, {"id": "c-fs-2", "concept": "fstream", "type": "mc", "prompt": "파일이 제대로 열렸는지 확인하는 함수는?", "choices": ["is_open()", "eof()", "tellg()", "open_ok()"], "answer": 0, "lesson": "L2-4"}, {"id": "c-fs-3", "concept": "fstream", "type": "mc", "prompt": "스트림 상태 함수 중 '파일 끝에 도달했으면 true'인 것은?", "choices": ["bad()", "fail()", "eof()", "good()"], "answer": 2, "lesson": "L2-4"}, {"id": "c-om-1", "conc ).", "lesson": "L2-4"}, {"id": "c-bin-3", "concept": "binary", "type": "blank", "prompt": "바이너리 입출력 함수: file.(a)(memblock, size); out.(b)(memblock, size); 여기서 memblock의 타입은 char* 이다.", "accept": [["read"], ["write"]], "answer": "(a) read / (b) write", "lesson": "L2-4"}, {"id": "c-bin-4", "concept": "binary", "type": "mc", "prompt": "ios::ate로 열고 크기를 얻은 뒤, read 전에 해야 하는 것은?", "choices": ["seekg(0, ios::beg)로 처음으로 되감기", "close()", "seekp(0, ios::end)", "clear()"], "answer": 0, "lesson": "L2-4"}, {"id": "c-rdd-1", "concept": "rdd", "type": "mc", "prompt": "책임 주도 설계에서 한 객체 안의 책임들은?", "choices": ["서로 관련 없어야 함", "서로 밀접하게 관련되어야 함", "하나뿐이어야 함", "다른 객체와 겹쳐야 함"], "answer": 1, "lesson": "L3-1"}, {"id": "c-rdd-2", "concept": "rdd", "type": "ox", "prompt": "책임 주도 설계에서는 시스템이 수행할 활동(책임)을 시스템의 객체들에 분배한다.", "answer": true, "lesson": "L3-1"}, {"id": "c-dp-1", "concept": "dev-process", "type": "mc", "prompt": "개발 과정 9단계에서 CRC 카드를 쓰는 단계는?", "choices": ["1. Initial Description", "2. Refine Specification", "4. Identification of Components Responsibilities", "8. Integration"], "answer": 2, "lesson": "L3-1"}, {"id": "c-dp-2", "concept": "dev-process", "type": "mc", "prompt": "개발 과정 9단계에서 stub을 쓰는 단계는?", "choices": ["3. Identification of Components", "5. Formalize the Interface", "7. Implementing Components", "8. Integration of Components"], "answer": 3, "lesson": "L3-1"}, {"id": "c-dp-3", "concept": "dev-process", "type": "blank", "prompt": "개발 과정의 마지막 단계는 Maintenance & (a) 이고, 첫 단계는 Initial (b) (Specification) 이다.", "accept": [["evolution", "진화"], ["description"]], "answer": "(a) Evolution / (b) Description", "lesson": "L3-1"}, {"id": "c-sc-1", "concept": "scenario", "type": "mc", "prompt": "IIKH의 모호한 초기 명세를 다듬는 주요 도구는?", "choices": ["시나리오 따라가기 (walking through scenarios)", "UML 클래스 다이어그램", "단위 테스트", "stub"], "answer": 0, "lesson": "L3-1"}, {"id": "c-sc-2", "concept": "scenario", "type": "blank", "prompt": "다른 저자들은 시나리오를 개발하는 과정을 (a) 라고 부른다.", "accept": [["use-cases", "use cases", "use-case", "use case", "유스케이스"]], "answer": "(a) use-cases", "lesson": "L3-1"}, {"id": "c-sc-3", "concept": "scenario", "type": "ox", "prompt": "시나리오를 따라갈 때는 이미 동작하는 응용이 있다고 가정하고 사용 방법을 따라가 본다.", "answer": true, "lesson": "L3-1"}, {"id": "c-cmp-1", "concept": "component", "type": "mc", "prompt": "좋은 구성요소(component)의 조건이 '아닌' 것은?", "choices": ["작고 잘 정의된 책임 집합", "다른 구성요소와 상호작용 최소", "책임을 연결할 수 있는 추상적 설계 단위", "가능한 많은 책임을 가짐"], "answer": 3, "lesson": "L3-2"}, {"id": "c-cmp-2", "concept": "component", "type": "ox", "prompt": "구성요소는 다른 구성요소와 가능한 많이 상호작용해야 한다.", "answer": false, "lesson": "L3-2"}, {"id": "c-crc-1", "concept": "crc", "type": "blank", "prompt": "CRC 카드의 C-R-C는 Component, (a), (b) 이다.", "accept": [["responsibility", "responsibilities", "책임"], ["collaborators", "collaborator", "collaboration", "협력자"]], "answer": "(a) Responsibility / (b) Collaborators", "lesson": "L3-2"}, {"id": "c-crc-2", "concept": "crc", "type": "mc", "prompt": "IIKH의 Greeter 카드에서 협력자(Collaborators)는?", "choices": ["Recipe, Meal", "Database Manager, Plan Manager", "Date, Meal", "없음"], "answer": 1, "lesson": "L3-2"}, {"id": "c-ik-1", "concept": "iikh-components", "type": "mc", "prompt": "레시피 '하나'의 재료 목록을 유지하고 자기를 편집·표시·인쇄하는 IIKH 구성요소는?", "choices": ["Recipe Database", "Planner", "Recipe", "Greeter"], "answer": 2, "lesson": "L3-2"}, {"id": "c-ik-2", "concept": "iikh-components", "type": "mc", "prompt": "인원수를 설정하면 레시피를 자동 조절하고 한 끼 장보기 목록을 만드는 구성요소는?", "choices": ["Meal", "Date", "Recipe Database", "Greeter"], "answer": 0, "lesson": "L3-2"}, {"id": "c-ik-3", "concept": "iikh-components", "type": "blank", "prompt": "IIKH는 (a) 개의 SW 구성요소로 다 할 수 있고, 이 시점에 구성요소를 서로 다른 (b) 에게 나눠 개발시킬 수 있다.", "accept": [["6", "six", "여섯"], ["programmers", "programmer", "프로그래머", "개발자"]], "answer": "(a) 6 / (b) programmers", "lesson": "L3-2"}, {"id": "c-ik-4", "concept": "iikh-components", "type": "ox", "prompt": "RecipeDB(Recipe Database)는 레시피 모음을 관리해서 탐색·검색·추가·편집을 허용한다.", "answer": true, "lesson": "L3-2"}, {"id": "c-bs-1", "concept": "behavior-state", "type": "mc", "prompt": "구성요소 안에 있는 모든 정보(데이터 값)를 뜻하는 것은?", "choices": ["Behavior", "State", "Interface", "Responsibility"], "answer": 1, "lesson": "L3-3"}, {"id": "c-bs-2", "concept": "behavior-state", "type": "ox", "prompt": "Recipe 인스턴스는 많지만 모두 같은 방식으로 행동하므로 그 행동은 Recipe 클래스에 공통이다.", "answer": true, "lesson": "L3-3"}, {"id": "c-cc-1", "concept": "coupling-cohesion", "type": "blank", "prompt": "(a) is the degree to which each program module relies on each one of the other modules. (b) is a measure of how strongly-related the responsibilities of a single module are.", "accept": [["coupling", "결합도"], ["cohesion", "응집도"]], "answer": "(a) Coupling / (b) Cohesion", "lesson": "L3-3"}, {"id": "c-cc-2", "concept": "coupling-cohesion", "type": "blank", "prompt": "Good design: (a) cohesion and (b) coupling. We want to (c) coupling.", "accept": [["high", "tight", "strong", "높은"], ["low", "loose", "weak", "낮은"], ["minimize", "최소화"]], "answer": "(a) high / (b) low / (c) minimize", "lesson": "L3-3"}, {"id": "c-cc-3", "concept": "coupling-cohesion", "type": "mc", "prompt": "결합도가 높을 때의 문제는?", "choices": ["코드가 짧아짐", "응집도가 자동으로 높아짐", "한 모듈의 변경이 다른 모듈에 영향을 줘 유지보수·재사용이 어려움", "컴파일이 빨라짐"], "answer": 2, "lesson": "L3-3"}, {"id": "c-cc-4", "concept": "coupling-cohesion", "type": "ox", "prompt": "Coupling means the degree to which the ability to fulfill a certain responsibility depends upon the actions of another component, and it is desirable to maximize it.", "answer": false, "explain": "정의는 맞지만 결합도는 minimize.", "lesson": "L3-3"}, {"id": "c-ii-1", "concept": "interface-impl", "type": "mc", "prompt": "Two views of a software system에서 'text buffer, window pointer, ingredient list'는?", "choices": ["interface", "implementation", "scenario", "collaborator"], "answer": 1, "lesson": "L3-3"}, {"id": "c-ii-2", "concept": "interface-impl", "type": "blank", "prompt": "Information hiding is the (a) hiding of implementation details. The user of a software component need rated'의 뜻은?", "choices": ["천천히 코딩한다", "구성요소를 한꺼번에가 아니라 하나(몇 개)씩 추가하며 테스트한다", "통합을 마지막에 한 번에 한다", "stub을 쓰지 않는다"], "answer": 1, "lesson": "L3-4"}, {"id": "c-stub-3", "concept": "stub", "type": "ox", "prompt": "구성요소를 한꺼번에 통합하면 문제가 생겼을 때 어디서 생겼는지 찾기 어렵다.", "answer": true, "lesson": "L3-4"}, {"id": "c-mt-1", "concept": "maintenance", "type": "blank", "prompt": "Software maintenance: activities (a) to the delivery of the initial working version of the software system.", "accept": [["subsequent", "after", "이후"]], "answer": "(a) subsequent", "lesson": "L3-4"}, {"id": "c-mt-2", "concept": "maintenance", "type": "mc", "prompt": "흔한 설계 결함 중 '다른 구성요소의 데이터를 직접 수정'은 무엇을 위반하나?", "choices": ["코딩 규칙", "상속", "캡슐화 (encapsulation)", "다형성"], "answer": 2, "lesson": "L3-4"}, {"id": "c-mt-3", "concept": "maintenance", "type": "ox", "prompt": "좋은 설계는 변화가 불가피함을 인정하고 처음부터 그 변화에 대비한다.", "answer": true, "lesson": "L3-4"}, {"id": "c-ae-1", "concept": "abs-encap", "type": "blank", "prompt": "Data encapsulation: implementation is encapsulated by the (a), and the only way to get to the implementation legally is through the (a). Information hiding: implementation is (b) from the user.", "accept": [["interface", "인터페이스"], ["hidden", "숨겨"]], "answer": "(a) interface / (b) hidden", "lesson": "L4-1"}, {"id": "c-ae-2", "concept": "abs-encap", "type": "mc", "prompt": "데이터 추상화를 한 문장으로 가장 잘 표현한 것은?", "choices": ["Separation of interface and implementation", "Combining two classes", "Hiding all members", "Using inheritance"], "answer": 0, "lesson": "L4-1"}, {"id": "c-ae-3", "concept": "abs-encap", "type": "ox", "prompt": "교수님은 data abstraction, data encapsulation, information hiding을 거의 같은 개념으로 보라고 했다.", "answer": true, "lesson": "L4-1"}, {"id": "c-tv-1", "concept": "two-views", "type": "blank", "prompt": "Interface: the outside, or (a) view, describes (b) an object does. Implementation: the inside view describes (c) it does.", "accept": [["service", "서비스"], ["what"], ["how"]], "answer": "(a) service / (b)
