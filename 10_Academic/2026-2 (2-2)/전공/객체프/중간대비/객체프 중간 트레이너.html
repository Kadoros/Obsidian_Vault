quired<\/li><li><b>Confirmability<\/b> – be able to prove that the software works properly<\/li><\/ul><\/section>", "topics": ["quality", "se"]}, {"id": "L1-3", "title": "프로그래밍 패러다임", "src": "L02 p.8–15", "secs": [{"id": "unstructured", "title": "비구조적 프로그래밍 (Unstructured Programming)", "title_en": "Unstructured Programming", "topic": "paradigm"}, {"id": "procedural", "title": "절차적 · 모듈 프로그래밍", "title_en": "Procedural and Modular Programming", "topic": "paradigm"}, {"id": "global-vars", "title": "전역 변수를 쓰지 마라", "title_en": "Don't Use Global Variables", "topic": "paradigm"}, {"id": "oop-why", "title": "절차적/모듈 방식의 문제와 OOP", "title_en": "Problems of Procedural/Modular Programming and OOP", "topic": "paradigm"}], "html": "<section class=\"sec\" id=\"s-unstructured\"><h3>비구조적 프로그래밍 (Unstructured Programming)<\/h3><ul><li><b>main 프로그램 하나<\/b>로만 구성, 명령어들의 나열<\/li><li><b>전역 데이터만<\/b> 사용<\/li><li><b>goto 문<\/b>을 사용<\/li><li>단점: 같은 문장 시퀀스가 반복되면 다 다시 써야 함<\/li><li><b>스파게티 코드<\/b>: goto가 여기저기 점프해서 구조가 복잡하게 얽힘 → 이해·흐름 추적·수정이 거의 불가능<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2024 빈칸 \"(Unstructured programming) makes extensive use of GOTO statements… a program contains only a single code block\".<\/div><\/section>\n<section class=\"sec\" id=\"s-procedural\"><h3>절차적 · 모듈 프로그래밍<\/h3><p><b>절차적 프로그래밍 (Procedural)<\/b> — 스파게티 코드의 남용 때문에 구조적 언어가 등장<\/p>\n<ul><li>프로그램 = <b>프로시저 호출의 나열<\/b>, 프로시저 = 같은 문장 시퀀스를 묶은 것<\/li><li>반복이 줄고 오류가 줄어듦<\/li><li><b>구조적 프로그래밍 (Structured Programming)<\/b> ≒ <b>top-down approach<\/b> ≒ <b>divide and conquer<\/b> ≒ <b>functional decomposition<\/b><\/li><\/ul>\n<p><b>모듈 프로그래밍 (Modular)<\/b><\/p>\n<ul><li>SW가 분리된 부분(<b>module<\/b>)들로 구성. 공통 기능의 프로시저들을 모듈로 묶음<\/li><li>프로그램은 <b>인터페이스<\/b>로 모듈을 사용: <b>interface는 보이고(visible), implementation은 숨겨짐(hidden)<\/b><\/li><li>유지보수성 향상<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2022 빈칸 \"structured programming ≒ (top-down approach) ≒ (divide and conquer) ≒ functional decomposition\".<\/div><\/section>\n<section class=\"sec\" id=\"s-global-vars\"><h3>전역 변수를 쓰지 마라<\/h3><ul><li><b>전역 변수 사용은 위험(unsafe)<\/b><ul><li>데이터(전역 변수) 공유는 모듈 프로그래밍 원칙 위반<\/li><li>모든 모듈이 아무 제약 없이 모든 전역 변수에 접근 → 어떤 모듈도 독립적으로 개발·이해할 수 없음<\/li><li><b>모든 모듈이 서로 의존(dependent on one another)<\/b> 하게 만든다<\/li><\/ul><\/li><li>해결: <b>Modularized Data<\/b> — 데이터를 모듈 안에 <b>지역화(localize)<\/b> → 모듈끼리 더 독립적 → 안전<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2024·2022·2019·2017·2016 거의 매년! \"Using (global) variables is often unsafe because this makes all modules (dependent) on one another.\"<\/div><\/section>\n<section class=\"sec\" id=\"s-oop-why\"><h3>절차적/모듈 방식의 문제와 OOP<\/h3><p><b>절차적·모듈 방식의 문제<\/b><\/p>\n<ul><li>데이터와 연산이 <b>분리(decoupled)<\/b> 되어 있음<\/li><li>큰 시스템에서 잘 안 됨: 디버그·확장·유지보수 어려움, 코드 재사용 제한<\/li><li>명시적인 생성·소멸<\/li><\/ul>\n<p><b>OOP<\/b><\/p>\n<ul><li>프로그램 = <b>상호작용하는 객체들의 집합<\/b>, 각 객체가 자기 상태를 유지<\/li><li><b>데이터와 연산을 객체 하나로 결합<\/b><\/li><li>구조적 = \"data + function = program\", OOP = \"data + function = object, <b>object + object = program<\/b>\"<\/li><li>문제 영역을 처리의 흐름이 아니라, 서로 <b>메시지를 주고받는 객체들<\/b>로 본다<\/li><li>객체는 SW의 <b>부품(component)<\/b> 이고, 객체의 <b>인터페이스는 잘 정의<\/b>되어야 함<\/li><\/ul>\n<p><b>Why OO?<\/b> 큰 SW 개발에 좋음, 유지보수성, <b>재사용(reuse, not rewrite)<\/b> → 생산성·품질·이해도·확장성·수명 향상. 이미 잘 테스트된 재사용 모듈을 쓰므로 <b>신뢰성도 증가<\/b>.<\/p>\n<div class=\"callout exam\">시험 포인트: 2024 빈칸 \"(Object-oriented programming) is a programming paradigm based on the concept of (objects), which can contain data and code\".<\/div><\/section>", "title_en": "Programming Paradigms", "html_en": "<section class=\"sec\" id=\"s-unstructured\"><h3>Unstructured Programming<\/h3><ul><li>Consists of <b>only one main program<\/b>: a sequence of commands or statements<\/li><li><b>Only global data<\/b><\/li><li>Uses the <b>goto statement<\/b><\/li><li>Disadvantage: if the same statement sequence is repeated, it must be written out again every time<\/li><li><b>Spaghetti code<\/b>: code with a complex and tangled structure, with goto's jumping all over the place → almost impossible to understand, hard to follow the flow, difficult to modify<\/li><\/ul>\n<div class=\"callout exam\">Exam point: 2024 blank \"(Unstructured programming) makes extensive use of GOTO statements… a program contains only a single code block\".<\/div><\/section>\n<section class=\"sec\" id=\"s-procedural\"><h3>Procedural and Modular Programming<\/h3><p><b>Procedural programming<\/b> — the abuses of spaghetti code led to structured programming languages<\/p>\n<ul><li>Program = <b>a sequence of procedure calls<\/b>; procedure = a grouped sequence of statements<\/li><li>More structured (reduces repetition) and more error-free<\/li><li><b>Structured Programming<\/b> ≒ <b>top-down approach<\/b> ≒ <b>divide and conquer<\/b> ≒ <b>functional decomposition<\/b><\/li><\/ul>\n<p><b>Modular programming<\/b><\/p>\n<ul><li>SW is composed of separate parts (<b>modules<\/b>); procedures of a common functionality are grouped together into modules<\/li><li>The program uses modules through an <b>interface<\/b>: <b>interface is visible, implementation is hidden<\/b><\/li><li>Improves maintainability<\/li><\/ul>\n<div class=\"callout exam\">Exam point: 2022 blank \"structured programming ≒ (top-down approach) ≒ (divide and conquer) ≒ functional decomposition\".<\/div><\/section>\n<section class=\"sec\" id=\"s-global-vars\"><h3>Don't Use Global Variables<\/h3><ul><li><b>Using global variables is unsafe<\/b><ul><li>Sharing data (global variables) violates the principle of modular programming<\/li><li>Every module can access every global variable without restriction → no module can be developed or understood independently<\/li><li>It makes <b>all modules dependent on one another<\/b><\/li><\/ul><\/li><li>Solution: <b>Modularized Data<\/b> — <b>localize<\/b> data inside the modules → modules become more independent of one another → safe<\/li><\/ul>\n<div class=\"callout exam\">Exam point: almost every year (2024·2022·2019·2017·2016)! \"Using (global) variables is often unsafe because this makes all modules (dependent) on one another.\"<\/div><\/section>\n<section class=\"sec\" id=\"s-oop-why\"><h3>Problems of Procedural/Modular Programming and OOP<\/h3><p><b>Problems of procedural/modular programming<\/b><\/p>\n<ul><li><b>Decoupled<\/b> (separation of) data and operations<\/li><li>Doesn't work well in large systems: difficult to debug, extend, and maintain; code reuse limited<\/li><li>Explicit creation and destruction<\/li><\/ul>\n<p><b>OOP<\/b><\/p>\n<ul><li>Program = <b>a set of interacting objects<\/b>; each object keeps its own state<\/li><li><b>Combines data and operations into an object<\/b><\/li><li>Structured: \"data + function = program\"; OOP: \"data + function = object, <b>object + object = program<\/b>\"<\/li><li>OOP does not view the problem domain as a flow of processing, but as <b>objects that communicate with each other through message passing<\/b><\/li><li>An object works as a <b>component<\/b> of software, and <b>the interface of an object should be well defined<\/b><\/li><\/ul>\n<p><b>Why OO?<\/b> Good for developing large software, maintainability, <b>reuse software, not rewrite<\/b> → increases productivity, quality, understandability, scalability and lifetime. SW <b>reliability also increases<\/b> because reusable modules are already well tested.<\/p>\n<div class=\"callout exam\">Exam point: 2024 blank \"(Object-oriented programming) is a programming paradigm based on the concept of (objects), which can contain data and code\".<\/div><\/section>", "topics": ["paradigm"]}, {"id": "L1-4", "title": "OOP 개념: ADT · 객체 · 캡슐화 · 상속 · 다형성", "src": "L02 p.24–33", "secs": [{"id": "adt", "title": "추상 자료형 (ADT)", "title_en": "Abstract Data Type (ADT)", "topic": "encap"}, {"id": "class-object", "title": "클래스와 객체", "title_en": "Class and Object", "topic": "encap"}, {"id": "encap-intro", "title": "정보 은닉 · 캡슐화 (개요)", "title_en": "Information Hiding · Encapsulation (Overview)", "topic": "encap"}, {"id": "inherit-poly", "title": "상속과 다형성", "title_en": "Inheritance and Polymorphism", "topic": "inherit"}], "html": "<section class=\"sec\" id=\"s-adt\"><h3>추상 자료형 (ADT)<\/h3><ul><li><b>ADT<\/b>: 데이터 변수들과 관련 연산들의 집합으로, <b>특정 구현과 독립적으로 정밀하게 명세된<\/b> 것<\/li><li><b>ADT = data + operations (no implementation)<\/b><\/li><li>OOP에서는 프로시저를 정의하려고 데이터를 정의하는 게 아니라, <b>데이터를 정의하는 데 필요한 프로시저를 정의<\/b>한다<\/li><li>ADT는 데이터와 프로시저를 결합한 타입. C++에서는 <b>class<\/b>로 ADT를 정의<\/li><li>사용자는 ADT가 <b>무엇을 하는지(what)<\/b> 만 알면 되고 <b>어떻게 하는지(how)<\/b> 는 몰라도 됨 (예: stack의 push/pop)<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2025 서술 \"ADT is called abstract because … (its data and operations are specified independently of any particular implementation)\".<\/div><\/section>\n<section class=\"sec\" id=\"s-class-object\"><h3>클래스와 객체<\/h3><ul><li><b>class<\/b>: 객체의 속성(attributes = <b>member variables<\/b>)과 행동(behaviors = <b>member functions<\/b>)을 정의<\/li><li><b>object<\/b>: <b>클래스의 인스턴스(instance of a class)<\/b>. 내부 데이터, 내부 연산, <b>인터페이스 연산<\/b>으로 구성<ul><li>identity, attribute, behavior(method), 다른 객체와의 관계를 가짐<\/li><li><b>클래스의 메서드만<\/b> 객체의 내부 데이터에 접근 가능<\/li><li><b>메시지 전달 (message passing)<\/b>: 메서드를 호출해서 다른 객체에 작업을 요청<\/li><\/ul><\/li><li><b>Class vs Object<\/b><ul><li>같은 클래스로 만든 객체들은 서로 <b>다른 객체<\/b> (각자 다른 메모리 공간·주소)<\/li><li>같은 클래스의 객체들은 클래스의 <b>메서드를 공유<\/b><\/li><li>객체는 실행 시간에 동적으로 생성·소멸될 수 있다<\/li><\/ul><\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2016 빈칸 \"(An object) is an instance of a class\".<\/div><\/section>\n<section class=\"sec\" id=\"s-encap-intro\"><h3>정보 은닉 · 캡슐화 (개요)<\/h3><ul><li><b>캡슐화<\/b>는 메시지를 보내는 객체들로부터 클래스의 기능적 세부를 <b>감춘다 (conceals the functional details)<\/b><\/li><li>객체의 <b>내부 데이터는 인터페이스를 통해서만 수정<\/b>될 수 있다<\/li><li>객체 그림: 바깥에 interface operations(specification), 안에 data와 internal operations(implementation)<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2025 빈칸 \"In the concept of information hiding, (internal data) of an object can be modified only through (an interface)\". 자세한 건 U4.<\/div><\/section>\n<section class=\"sec\" id=\"s-inherit-poly\"><h3>상속과 다형성<\/h3><ul><li><b>상속 (Inheritance)<\/b>: 자식 클래스(sub class)가 부모 클래스(super class)의 속성·행동을 물려받고 자기 것을 추가. 자식의 속성은 부모와 대부분 비슷해야 함. <b>목표: 객체(클래스) 재사용<\/b> → 대형 SW 개발 비용 절감<\/li><li><b>다형성 (Polymorphism)<\/b>: 같은 메서드(메시지)가 다른 의미를 가질 수 있음. 서로 다른 타입의 객체가 같은 이름의 메서드 호출에 각자 타입에 맞게 반응<ul><li>C++에서: <b>virtual function, operator overloading, function overloading, template<\/b><\/li><\/ul><\/li><li>동적 바인딩 (dynamic binding)<\/li><li><b>객체 모델의 이점<\/b>: 시간이 지나며 진화하는 시스템(확장 가능, 안정적), 객체·클래스로 생각하는 게 사람에게 쉬움, 클라이언트와 구현자를 분리해 캡슐화로 실수로 인한 손상 방지, 재사용<\/li><\/ul>\n<div class=\"callout trap\">함정: 상속·virtual은 중간 이후 진도(교안 일정 6–7주차지만 올해는 아직). 대시보드의 '범위 밖' 표시와 같음.<\/div><\/section>", "title_en": "OOP Concepts: ADT · Object · Encapsulation · Inheritance · Polymorphism", "html_en": "<section class=\"sec\" id=\"s-adt\"><h3>Abstract Data Type (ADT)<\/h3><ul><li><b>ADT<\/b>: a set of data variables and associated operations that are <b>precisely specified independent of any particular implementation<\/b><\/li><li><b>ADT = data + operations (no implementation)<\/b><\/li><li>In OOP, we don't define data for defining procedures; we <b>define the procedures necessary for defining data<\/b><\/li><li>An ADT is a type that combines data and procedures. In C++, a <b>class<\/b> is used to define an ADT<\/li><li>The user only needs to know <b>what<\/b> an ADT does, not <b>how<\/b> it does it (e.g. push/pop of a stack)<\/li><\/ul>\n<div class=\"callout exam\">Exam point: 2025 essay \"ADT is called abstract because … (its data and operations are specified independently of any particular implementation)\".<\/div><\/section>\n<section class=\"sec\" id=\"s-class-object\"><h3>Class and Object<\/h3><ul><li><b>class<\/b>: defines the attributes (= <b>member variables<\/b>) and behaviors (= <b>member functions<\/b>) of an object<\/li><li><b>object<\/b>: <b>an instance of a class<\/b>. Consists of internal data, internal operations, and <b>interface operations<\/b><ul><li>Has identity, attributes, behavior (methods), and relationships with other objects<\/li><li><b>Only class methods<\/b> can access the internal data of an object<\/li><li><b>Message passing<\/b>: requesting some work from another object by calling a method<\/li><\/ul><\/li><li><b>Class vs Object<\/b><ul><li>Each object generated by the same class is a <b>different object<\/b> (each gets its own memory space and address)<\/li><li>Objects created by the same class <b>share the class's methods<\/b><\/li><li>An object can be dynamically constructed or destructed during run-time<\/li><\/ul><\/li><\/ul>\n<div class=\"callout exam\">Exam point: 2016 blank \"(An object) is an instance of a class\".<\/div><\/section>\n<section class=\"sec\" id=\"s-encap-intro\"><h3>Information Hiding · Encapsulation (Overview)<\/h3><ul><li><b>Encapsulation conceals the functional details<\/b> of a class from objects that send messages to it<\/li><li><b>Internal data of an object can be modified only through an interface<\/b><\/li><li>Object diagram: interface operations (specification) on the outside; data and internal operations (implementation) inside<\/li><\/ul>\n<div class=\"callout exam\">Exam point: 2025 blank \"In the concept of information hiding, (internal data) of an object can be modified only through (an interface)\". Details in U4.<\/div><\/section>\n<section class=\"sec\" id=\"s-inherit-poly\"><h3>Inheritance and Polymorphism<\/h3><ul><li><b>Inheritance<\/b>: a child class (sub class) inherits the attributes and behaviors of the parent class (super class) and can define its own. The child's properties should be mostly similar to the parent's. <b>Goal: object (class) reuse<\/b> → reduces the cost of large SW development<\/li><li><b>Polymorphism<\/b>: allows the same method (message) to have different meanings. The ability of objects of different types to respond to method calls of the same name, each according to an appropriate type-specific behavior<ul><li>In C++: <b>virtual function, operator overloading, function overloading, template<\/b><\/li><\/ul><\/li><li>Dynamic binding<\/li><li><b>Benefits of the object model<\/b>: builds a system that evolves over time (extendible, stable); thinking in objects and classes is easier for humans; separating the client and implementor prevents accidental damage through data encapsulation; reusability<\/li><\/ul>\n<div class=\"callout trap\">Trap: inheritance and virtual functions come after the midterm (weeks 6–7 in the course schedule, not yet covered this year). Same as the \"out of scope\" mark on the dashboard.<\/div><\/section>", "topics": ["encap", "inherit"]}], "title_en": "Intro to SW Engineering and OOP", "intro_en": "Software crisis → software engineering → factors of good software → programming paradigms → OOP concepts. Question 1's blanks (software crisis, complexity, maintenance, global/dependent) come from here almost every year. Memorizing the exact English words is what earns the points."}, {"id": "U2", "title": "C++ in Summary (문법 · 포인터 · 파일 입출력)", "src": "C++ in Summary.pdf + static vs dynamic 토론 자료", "intro": "C++ 문법 요약. 시험에 직접 나오는 건 포인터 *·&의 세 가지 뜻, 동적 할당과 정적 할당 비교, Rectangle 포인터 코드 빈칸, 그리고 파일 입출력(open mode, tellg/seekg, 바이너리 파일 복사)이야. 파일 복사 코드는 2024·2025 연속으로 통째로 썼어.", "lessons": [{"id": "L2-1", "title": "컴파일 · 입출력 · string", "src": "C++ in Summary p.2–14", "secs": [{"id": "cpp-io", "title": "컴파일과 표준 입출력", "title_en": "Compiling and Standard I/O", "topic": "trace"}, {"id": "cpp-basics", "title": "자료형 · string · 제어문 · 함수 · 배열", "title_en": "Data Types · string · Control Structures · Functions · Arrays", "topic": "trace"}], "html": "<section class=\"sec\" id=\"s-cpp-io\"><h3>컴파일과 표준 입출력<\/h3><ul><li><b>컴파일러<\/b>: 고급 언어 코드 → 기계어. C++ 컴파일러는 소스 파일에서 실행 파일(binary)을 만든다<ul><li><code>g++ -o TestProg TestProg.cpp<\/code> → <code>./TestProg<\/code><\/li><\/ul><\/li><li><code>#include &lt;iostream&gt;<\/code> (header file), <code>using namespace std;<\/code>. C++ 프로그램에서 C 코드를 써도 된다<\/li><li><b>cout<\/b>: 화면 스트림 객체 (standard output). <code>cout &lt;&lt; \"Hello\";<\/code> → 문자열 Hello 출력, <code>cout &lt;&lt; Hello;<\/code> → 변수 Hello의 값 출력<\/li><li><b>cin<\/b>: 키보드 스트림 객체 (standard input). <code>cin &gt;&gt; age;<\/code> → 키보드 입력이 변수로 (화살표 방향이 데이터 흐름)<\/li><li>서식: printf와 비슷하게 <code>std::format<\/code> (C++20), <code>std::print<\/code> (C++23)<\/li><\/ul>\n<pre class=\"code\">double pi = 3.141592; int age = 21;\nprintf(&quot;pi=%7.2f , age=%d\\n&quot;, pi, age);\ncout &lt;&lt; format(&quot;pi={:7.2f} , age={}\\n&quot;, pi, age);   // pi=   3.14 , age=21<\/pre><\/section>\n<section class=\"sec\" id=\"s-cpp-basics\"><h3>자료형 · string · 제어문 · 함수 · 배열<\/h3><ul><li>변수 = 값이 저장되는 <b>이름 붙은 메모리 위치<\/b>, 사용 전에 선언<\/li><li>char 1B, short 2B, int 4B (−2³¹ ~ 2³¹−1), float 4B, double 8B. 양수만이면 unsigned<\/li><li><b>string<\/b>: 표준 라이브러리 클래스. C 문자열(char*)과 달리 <b>메모리를 자동 관리<\/b>하고 편리한 함수 제공 (length, find, substr, replace, insert, erase, c_str, stoi, stod, to_string)<\/li><li><code>getline(cin, str)<\/code>: 한 줄 읽기<\/li><li>for문 실행 순서: (1) 초기화 → (2) 조건 → body → (3) 증감 → (2) → body → …<\/li><li>break = 루프 탈출, continue = 다음 반복의 조건 검사로<\/li><li>함수: 지역 변수(매개변수 포함)는 호출 때 생성, 반환 때 삭제. 쓰는 이유 = 반복 제거, 재사용, top-down, 디버그 쉬움, 수정·확장 쉬움, 가독성<\/li><li>배열: 같은 타입 원소의 <b>고정 크기<\/b> 모음, 메모리에 연속 저장, 빠른 임의 접근 <code>x[15]=3;<\/code><\/li><\/ul><\/section>", "title_en": "Compiling · I/O · string", "html_en": "<section class=\"sec\" id=\"s-cpp-io\"><h3>Compiling and Standard I/O<\/h3><ul><li><b>Compiler<\/b>: converts high-level language code to machine language code. The C++ compiler generates an executable file (binary code) from C++ source code<ul><li><code>g++ -o TestProg TestProg.cpp<\/code> → <code>./TestProg<\/code><\/li><\/ul><\/li><li><code>#include &lt;iostream&gt;<\/code> (header file), <code>using namespace std;<\/code>. C code may be used in a C++ program<\/li><li><b>cout<\/b>: screen stream object (standard output). <code>cout &lt;&lt; \"Hello\";<\/code> → prints the string Hello; <code>cout &lt;&lt; Hello;<\/code> → prints the value of the variable Hello<\/li><li><b>cin<\/b>: keyboard stream object (standard input). <code>cin &gt;&gt; age;<\/code> → keyboard input goes into the variable (the arrow shows the direction of data flow)<\/li><li>Formatting like printf: <code>std::format<\/code> (C++20), <code>std::print<\/code> (C++23)<\/li><\/ul>\n<pre class=\"code\">double pi = 3.141592; int age = 21;\nprintf(&quot;pi=%7.2f , age=%d\\n&quot;, pi, age);\ncout &lt;&lt; format(&quot;pi={:7.2f} , age={}\\n&quot;, pi, age);   // pi=   3.14 , age=21<\/pre><\/section>\n<section class=\"sec\" id=\"s-cpp-basics\"><h3>Data Types · string · Control Structures · Functions · Arrays<\/h3><ul><li>Variable = a <b>named memory location<\/b> where a value is stored; must be declared before use<\/li><li>char 1B, short 2B, int 4B (−2³¹ ~ 2³¹−1), float 4B, double 8B. Use unsigned for non-negative values only<\/li><li><b>string<\/b>: a standard library class. Unlike C-style strings (char*), string <b>automatically manages memory<\/b> and provides many convenient functions (length, find, substr, replace, insert, erase, c_str, stoi, stod, to_string)<\/li><li><code>getline(cin, str)<\/code>: reads a line of text<\/li><li>for-loop execution order: (1) initialization → (2) condition → body → (3) increment → (2) → body → …<\/li><li>break = exit the loop; continue = jump to the condition check of the next iteration<\/li><li>Functions: local variables (including parameters) are created when the function is called and destroyed when it returns. Why use functions: remove repetition, reuse, top-down design, easier debugging, easier modification/extension, readability<\/li><li>Array: a <b>fixed-size<\/b> collection of elements of the same type, stored contiguously in memory, fast random access <code>x[15]=3;<\/code><\/li><\/ul><\/section>", "topics": ["trace"]}, {"id": "L2-2", "title": "포인터 · 동적 할당 · 정적 vs 동적", "src": "C++ in Summary p.23–24 + 토론 자료", "secs": [{"id": "pointer", "title": "포인터", "title_en": "Pointers", "topic": "memory"}, {"id": "new-delete", "title": "동적 메모리 할당", "title_en": "Dynamic Memory Allocation", "topic": "memory"}, {"id": "static-dynamic", "title": "정적 할당 vs 동적 할당 (토론 자료)", "title_en": "Static vs Dynamic Allocation (discussion handout)", "topic": "memory"}], "html": "<section class=\"sec\" id=\"s-pointer\"><h3>포인터<\/h3><ul><li>포인터 = 메모리 <b>주소<\/b>를 저장하는 변수. 크기는 항상 8바이트(64비트)/4바이트(32비트)<\/li><\/ul>\n<pre class=\"code\">int *xPtr, x;   // xPtr은 포인터, x는 int\nx = 5;\nxPtr = &amp;x;      // xPtr이 x를 가리킴 (xPtr의 값 = x의 주소)\n*xPtr = 10;     // xPtr이 가리키는 값을 10으로 → x가 10\ncout &lt;&lt; x;      // 10<\/pre>\n<p><b><code>*<\/code>의 세 가지 뜻<\/b>: (i) 곱셈 (이항) <code>z=x*y;<\/code> (ii) 가리키는 값 (단항, the-value-of) <code>*x=5;<\/code> (iii) 포인터 타입 선언 <code>int *x;<\/code><br><b><code>&amp;<\/code>의 세 가지 뜻<\/b>: (i) 비트 AND (이항) <code>z=x&amp;y;<\/code> (ii) 주소 연산자 (단항, address-of) <code>x=&amp;y;<\/code> (iii) 참조 타입 선언 <code>int&amp; y=x;<\/code><\/p>\n<div class=\"callout exam\">시험 포인트: 2022 기말 \"Meaning of '*' in line 2? '&amp;' in line 3?\" 같은 유형. 줄마다 어느 뜻인지 영어로 답할 수 있어야 해 (pointer type declaration / reference type declaration / address-of / dereference / multiplication / bitwise AND).<\/div><\/section>\n<section class=\"sec\" id=\"s-new-delete\"><h3>동적 메모리 할당<\/h3><ul><li>\"dynamic\" = <b>실행 시간(run-time, execution-time)에 일어난다<\/b><\/li><li>C의 <code>malloc<\/code> ⇔ C++의 <code>new<\/code>, C의 <code>free<\/code> ⇔ C++의 <code>delete<\/code><\/li><\/ul>\n<pre class=\"code\">int *x = new int[10];   // C: x = (int*)malloc(10*sizeof(int));\n...\ndelete[] x;             // C: free(x);<\/pre>\n<ul><li>객체 하나는 <code>delete p;<\/code>, 배열은 <code>delete[] p;<\/code><\/li><li><b>Java와 달리 C++은 직접 해제<\/b>해야 함 (garbage collection 없음)<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2019 빈칸 \"Dynamic memory allocation means memory allocation occurs at (run-time)\".<\/div><\/section>\n<section class=\"sec\" id=\"s-static-dynamic\"><h3>정적 할당 vs 동적 할당 (토론 자료)<\/h3><p><code>int x[10];<\/code> (정적) vs <code>int* y = new int[n];<\/code> (동적)<\/p>\n<div class=\"tblw\"><table><thead><tr><th><\/th><th>장점<\/th><th>단점<\/th><\/tr><\/thead><tbody><tr><td><b>정적<\/b><\/td><td>간단하고 빠름, 메모리가 <b>자동으로 해제<\/b>됨 (스택, 범위를 벗어나면)<\/td><td>크기가 <b>컴파일 시간<\/b>에 고정 → 실행 중 바꿀 수 없음 (낭비 또는 부족)<\/td><\/tr><tr><td><b>동적<\/b><\/td><td>크기를 <b>실행 시간<\/b>에 정할 수 있음 → 메모리를 필요한 만큼 효율적으로<\/td><td>프로그래머가 <b>직접 해제(delete[])<\/b> 해야 함 → <b>memory leak, dangling pointer<\/b> 위험<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout exam\">시험 포인트: 2023 서술이 이 토론 자료 그대로 나옴 (장점·단점·이유 4칸). 핵심 단어 = <b>compile time vs run time<\/b>, <b>automatic vs manual deallocation<\/b>.<\/div><\/section>", "title_en": "Pointers · Dynamic Allocation · Static vs Dynamic", "html_en": "<section class=\"sec\" id=\"s-pointer\"><h3>Pointers<\/h3><ul><li>Pointer = a variable that stores a memory <b>address<\/b>. Its size is always 8 bytes (64-bit) / 4 bytes (32-bit)<\/li><\/ul>\n<pre class=\"code\">int *xPtr, x;   // xPtr is a pointer, x is an int\nx = 5;\nxPtr = &amp;x;      // xPtr points to x (value of xPtr = address of x)\n*xPtr = 10;     // set the value pointed to by xPtr to 10 → x becomes 10\ncout &lt;&lt; x;      // 10<\/pre>\n<p><b>Three meanings of <code>*<\/code><\/b>: (i) multiplication (binary) <code>z=x*y;<\/code> (ii) the value pointed to (unary, the-value-of / dereference) <code>*x=5;<\/code> (iii) pointer type declaration <code>int *x;<\/code><br><b>Three meanings of <code>&amp;<\/code><\/b>: (i) bitwise AND (binary) <code>z=x&amp;y;<\/code> (ii) address operator (unary, address-of) <code>x=&amp;y;<\/code> (iii) reference type declaration <code>int&amp; y=x;<\/code><\/p>\n<div class=\"callout exam\">Exam point: question type like the 2022 final \"Meaning of '*' in line 2? '&amp;' in line 3?\". Be able to answer in English which meaning each line uses (pointer type declaration / reference type declaration / address-of / dereference / multiplication / bitwise AND).<\/div><\/section>\n<section class=\"sec\" id=\"s-new-delete\"><h3>Dynamic Memory Allocation<\/h3><ul><li>\"dynamic\" means \"<b>… occurs at run-time (execution-time)<\/b>\"<\/li><li><code>malloc<\/code> in C ⇔ <code>new<\/code> in C++, <code>free<\/code> in C ⇔ <code>delete<\/code> in C++<\/li><\/ul>\n<pre class=\"code\">int *x = new int[10];   // C: x = (int*)malloc(10*sizeof(int));\n...\ndelete[] x;             // C: free(x);<\/pre>\n<ul><li>A single object: <code>delete p;<\/code>, an array: <code>delete[] p;<\/code><\/li><li><b>Unlike Java, C++ requires you to free memory yourself<\/b> (no garbage collection)<\/li><\/ul>\n<div class=\"callout exam\">Exam point: 2019 blank \"Dynamic memory allocation means memory allocation occurs at (run-time)\".<\/div><\/section>\n<section class=\"sec\" id=\"s-static-dynamic\"><h3>Static vs Dynamic Allocation (discussion handout)<\/h3><p><code>int x[10];<\/code> (static) vs <code>int* y = new int[n];<\/code> (dynamic)<\/p>\n<div class=\"tblw\"><table><thead><tr><th><\/th><th>Advantages<\/th><th>Disadvantages<\/th><\/tr><\/thead><tbody><tr><td><b>Static<\/b><\/td><td>simple and fast; memory is <b>deallocated automatically<\/b> (on the stack, when it goes out of scope)<\/td><td>size is fixed at <b>compile time<\/b> → cannot change while running (waste or shortage)<\/td><\/tr><tr><td><b>Dynamic<\/b><\/td><td>size can be decided at <b>run time<\/b> → uses exactly as much memory as needed<\/td><td>the programmer must <b>deallocate it manually (delete[])<\/b> → risk of <b>memory leak, dangling pointer<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"callout exam\">Exam point: the 2023 essay came straight from this handout (advantages, disadvantages, reasons — 4 boxes). Key words = <b>compile time vs run time<\/b>, <b>automatic vs manual deallocation<\/b>.<\/div><\/section>", "topics": ["memory"]}, {"id": "L2-3", "title": "C++ class 기초 · 객체 포인터", "src": "C++ in Summary p.25–28", "secs": [{"id": "class-basic", "title": "class · 생성자 · 소멸자 (요약)", "title_en": "class · Constructor · Destructor (summary)", "topic": "ctor"}, {"id": "obj-pointer", "title": "객체 포인터 (Rectangle 예제)", "title_en": "Pointers to Objects (Rectangle example)", "topic": "trace"}], "html": "<section class=\"sec\" id=\"s-class-basic\"><h3>class · 생성자 · 소멸자 (요약)<\/h3><ul><li><b>class<\/b>: 멤버 데이터와 멤버 함수를 담는 자료구조 타입. 새 데이터 타입을 정의<\/li><li><b>생성자/소멸자<\/b>: 객체가 <b>생성/삭제될 때 자동으로 호출<\/b>되는 멤버 함수<ul><li>지역 객체는 함수가 반환될 때 삭제 → 그때 소멸자 호출. 소멸자 이름은 <code>~클래스이름<\/code><\/li><li>생성자를 안 만들면 컴파일러가 빈 기본 생성자를 만듦. 소멸자도 마찬가지<\/li><li>멤버 변수를 초기화하지 않으면 <b>쓰레기 값(garbage)<\/b> → 위험·불안정. 생성자에서 초기화해야 함<\/li><\/ul><\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-obj-pointer\"><h3>객체 포인터 (Rectangle 예제)<\/h3><pre class=\"code\">class Rectangle {\n  private:\n    int width, height;\n  public:\n    Rectangle() { width=1; height=1; }\n    Rectangle(int x, int y) : width(x), height(y) {}\n    int area() { return width*height; }\n};\nint main() {\n  Rectangle obj(3,4);\n  Rectangle *foo, *bar, *baz;\n  foo = &amp;obj;                    // 주소 대입\n  bar = new Rectangle(5,6);      // 동적 생성: new는 주소를 반환\n  baz = new Rectangle[2];        // 배열: 기본 생성자 2번 → 각 1×1\n  cout &lt;&lt; &quot;obj&#x27;s area: &quot;    &lt;&lt; obj.area()    &lt;&lt; &#x27;\\n&#x27;;   // 12\n  cout &lt;&lt; &quot;*foo&#x27;s area: &quot;   &lt;&lt; foo-&gt;area()   &lt;&lt; &#x27;\\n&#x27;;   // 12\n  cout &lt;&lt; &quot;*bar&#x27;s area: &quot;   &lt;&lt; bar-&gt;area()   &lt;&lt; &#x27;\\n&#x27;;   // 30\n  cout &lt;&lt; &quot;baz[0]&#x27;s area: &quot; &lt;&lt; baz[0].area() &lt;&lt; &#x27;\\n&#x27;;   // 1\n  cout &lt;&lt; &quot;baz[1]&#x27;s area: &quot; &lt;&lt; baz[1].area() &lt;&lt; &#x27;\\n&#x27;;   // 1\n  delete bar;\n  delete[] baz;\n  return 0;\n}<\/pre>\n<ul><li><b>객체는 <code>.<\/code><\/b>, <b>포인터는 <code>-&gt;<\/code><\/b> (= <code>(*foo).area()<\/code>). 배열 원소 <code>baz[0]<\/code>은 객체라서 <code>.<\/code><\/li><li><code>foo = obj;<\/code> (X) → <code>foo = &amp;obj;<\/code> (O). <code>bar.area()<\/code> (X) → <code>bar-&gt;area()<\/code> (O)<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2025·2024·2023·2019·2017 매년 이 코드의 변형 (빈칸 채우기, 오류 5개 찾기, 출력 쓰기). <code>.<\/code>/<code>-&gt;<\/code>/<code>&amp;<\/code>/<code>new<\/code>/<code>delete[]<\/code>를 줄 단위로 정확히.<\/div><\/section>", "title_en": "C++ Class Basics · Pointers to Objects", "html_en": "<section class=\"sec\" id=\"s-class-basic\"><h3>class · Constructor · Destructor (summary)<\/h3><ul><li><b>class<\/b>: a data structure type that can contain member data and member functions. Defines a new data type<\/li><li><b>Constructor/destructor<\/b>: member functions that are <b>automatically called when an object is created/deleted<\/b><ul><li>A local object is deleted when the function returns → its destructor is called then. The destructor's name is <code>~ClassName<\/code><\/li><li>If you don't write a constructor, the compiler generates an empty default constructor. Same for the destructor<\/li><li>Uninitialized member variables hold <b>garbage values<\/b> → dangerous and unstable. Initialize them in the constructor<\/li><\/ul><\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-obj-pointer\"><h3>Pointers to Objects (Rectangle example)<\/h3><pre class=\"code\">class Rectangle {\n  private:\n    int width, height;\n  public:\n    Rectangle() { width=1; height=1; }\n    Rectangle(int x, int y) : width(x), height(y) {}\n    int area() { return width*height; }\n};\nint main() {\n  Rectangle obj(3,4);\n  Rectangle *foo, *bar, *baz;\n  foo = &amp;obj;                    // assign an address\n  bar = new Rectangle(5,6);      // dynamic creation: new returns an address\n  baz = new Rectangle[2];        // array: default constructor called twice → each 1×1\n  cout &lt;&lt; &quot;obj&#x27;s area: &quot;    &lt;&lt; obj.area()    &lt;&lt; &#x27;\\n&#x27;;   // 12\n  cout &lt;&lt; &quot;*foo&#x27;s area: &quot;   &lt;&lt; foo-&gt;area()   &lt;&lt; &#x27;\\n&#x27;;   // 12\n  cout &lt;&lt; &quot;*bar&#x27;s area: &quot;   &lt;&lt; bar-&gt;area()   &lt;&lt; &#x27;\\n&#x27;;   // 30\n  cout &lt;&lt; &quot;baz[0]&#x27;s area: &quot; &lt;&lt; baz[0].area() &lt;&lt; &#x27;\\n&#x27;;   // 1\n  cout &lt;&lt; &quot;baz[1]&#x27;s area: &quot; &lt;&lt; baz[1].area() &lt;&lt; &#x27;\\n&#x27;;   // 1\n  delete bar;\n  delete[] baz;\n  return 0;\n}<\/pre>\n<ul><li><b>Objects use <code>.<\/code><\/b>, <b>pointers use <code>-&gt;<\/code><\/b> (= <code>(*foo).area()<\/code>). The array element <code>baz[0]<\/code> is an object, so it uses <code>.<\/code><\/li><li><code>foo = obj;<\/code> (wrong) → <code>foo = &amp;obj;<\/code> (right). <code>bar.area()<\/code> (wrong) → <code>bar-&gt;area()<\/code> (right)<\/li><\/ul>\n<div class=\"callout exam\">Exam point: a variant of this code every year in 2025·2024·2023·2019·2017 (fill in the blanks, find 5 errors, write the output). Get <code>.<\/code>/<code>-&gt;<\/code>/<code>&amp;<\/code>/<code>new<\/code>/<code>delete[]<\/code> exactly right line by line.<\/div><\/section>", "topics": ["ctor", "trace"]}, {"id": "L2-4", "title": "파일 입출력", "src": "C++ in Summary p.29–39", "secs": [{"id": "fstream", "title": "파일 스트림 클래스와 open", "title_en": "File Stream Classes and open", "topic": "fileio"}, {"id": "open-modes", "title": "파일 열기 모드", "title_en": "File Open Modes", "topic": "fileio"}, {"id": "seek-tell", "title": "파일 위치: tellg / seekg", "title_en": "File Position: tellg / seekg", "topic": "fileio"}, {"id": "binary", "title": "바이너리 파일과 파일 복사", "title_en": "Binary Files and File Copy", "topic": "fileio"}], "html": "<section class=\"sec\" id=\"s-fstream\"><h3>파일 스트림 클래스와 open<\/h3><ul><li><b>ofstream<\/b>: 파일에 쓰기 / <b>ifstream<\/b>: 파일에서 읽기 / <b>fstream<\/b>: 읽기·쓰기 둘 다 (<code>#include &lt;fstream&gt;<\/code>)<\/li><li>파일 처리 순서: <b>open → read/write → close<\/b><\/li><li>열 때 정할 것: 텍스트 vs 바이너리, 쓰기라면 <b>추가(append) vs 덮어쓰기(truncate)<\/b>, 파일 위치(자동 vs 사용자 제어)<\/li><li><code>myfile.open(filename, mode);<\/code> 또는 생성자 <code>ofstream myfile(\"example.txt\");<\/code><\/li><li>열렸는지 확인 <code>if (myfile.is_open()) { ... }<\/code>, 닫기 <code>myfile.close();<\/code><\/li><li>텍스트 쓰기 <code>myfile &lt;&lt; \"This is a line.\\n\";<\/code>, 읽기 <code>while (getline(myfile, line)) cout &lt;&lt; line &lt;&lt; '\\n';<\/code><\/li><li>상태 검사: <code>bad()<\/code> 읽기/쓰기 실패, <code>fail()<\/code> bad + 형식 오류, <code>eof()<\/code> 파일 끝, <code>good()<\/code> 다 괜찮음, <code>clear()<\/code> 플래그 초기화<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2019 빈칸 \"ofstream: write on files / (ifstream): read from files / (fstream): read and write\".<\/div><\/section>\n<section class=\"sec\" id=\"s-open-modes\"><h3>파일 열기 모드<\/h3><div class=\"tblw\"><table><thead><tr><th>플래그<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td><code>ios::in<\/code><\/td><td>입력(읽기)용으로 열기<\/td><\/tr><tr><td><code>ios::out<\/code><\/td><td>출력(쓰기)용으로 열기<\/td><\/tr><tr><td><code>ios::binary<\/code><\/td><td>바이너리 모드<\/td><\/tr><tr><td><code>ios::ate<\/code><\/td><td>초기 위치를 <b>파일 끝<\/b>으로 (안 쓰면 처음)<\/td><\/tr><tr><td><code>ios::app<\/code><\/td><td><b>모든 출력을 파일 끝에<\/b> → 기존 내용에 <b>덧붙임(append)<\/b><\/td><\/tr><tr><td><code>ios::trunc<\/code><\/td><td>출력용으로 열 때 파일이 <b>이미 있으면<\/b> 기존 내용을 <b>지우고<\/b> 새 내용으로<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>여러 개는 <b>비트 OR <code>|<\/code><\/b> 로 결합: <code>myfile.open(\"example.bin\", ios::out | ios::app | ios::binary);<\/code><\/li><li><b>기본 모드<\/b>: ofstream = <code>ios::out<\/code>, ifstream = <code>ios::in<\/code>, fstream = <code>ios::in | ios::out<\/code><\/li><li>쓰기로 열면 기존 파일이 지워지고 처음부터 써짐 (교수님이 여러 번 경고)<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2023 빈칸 \"ios::app means all output operations are performed at the (end)\", \"(ios::trunc) means if the file is opened for output and already (existing), its previous content is deleted\". 2019도 app.<\/div><\/section>\n<section class=\"sec\" id=\"s-seek-tell\"><h3>파일 위치: tellg / seekg<\/h3><ul><li><b>get 위치<\/b>(읽기)와 <b>put 위치<\/b>(쓰기)가 따로 있다<\/li><li><code>tellg()<\/code> / <code>tellp()<\/code>: 현재 get/put 위치 반환<\/li><li><code>seekg(position)<\/code> / <code>seekp(position)<\/code>: 위치를 절대값으로 이동<\/li><li><code>seekg(offset, direction)<\/code>: <code>ios::beg<\/code> (처음부터), <code>ios::cur<\/code> (현재 위치부터), <code>ios::end<\/code> (끝부터)<\/li><\/ul>\n<p><b>파일 크기 구하기 (매년 빈칸)<\/b><\/p>\n<pre class=\"code\">streampos begin, end;\nifstream myfile(&quot;example.bin&quot;, ios::binary);\nbegin = myfile.tellg();          // 처음 위치\nmyfile.seekg(0, ios::end);       // 끝으로\nend = myfile.tellg();            // 끝 위치\nmyfile.close();\ncout &lt;&lt; &quot;size is: &quot; &lt;&lt; (end-begin) &lt;&lt; &quot; bytes.\\n&quot;;<\/pre>\n<div class=\"callout exam\">시험 포인트: 2024·2023·2019 \"Fill in the boxes to print the size\". <code>begin = myfile.tellg();<\/code> → <code>myfile.seekg(0, ios::end);<\/code> → <code>end = myfile.tellg();<\/code> 세 줄.<\/div><\/section>\n<section class=\"sec\" id=\"s-binary\"><h3>바이너리 파일과 파일 복사<\/h3><ul><li>텍스트 vs 바이너리: 253을 텍스트로 쓰면 문자 '2','5','3' (3바이트), 바이너리로 쓰면 11111101 (1바이트)<\/li><li>바이너리 입출력은 <code>write(memory_block, size);<\/code> / <code>read(memory_block, size);<\/code> (memory_block은 <code>char*<\/code>)<\/li><\/ul>\n<p><b>파일 전체 읽기 (교안)<\/b><\/p>\n<pre class=\"code\">ifstream file(&quot;example.bin&quot;, ios::in | ios::binary | ios::ate);\nif (file.is_open()) {\n    streampos size = file.tellg();     // ate라서 끝 위치 = 파일 크기\n    char* memblock = new char[size];\n    file.seekg(0, ios::beg);           // 처음으로 되감기\n    file.read(memblock, size);\n    file.close();\n    ...\n    delete[] memblock;\n}<\/pre>\n<p><b>파일 복사 (2024·2025 코드 작성)<\/b>: 위 코드 + <code>ofstream out(\"des.bin\", ios::out | ios::binary); out.write(memblock, size); out.close();<\/code><\/p>\n<div class=\"callout trap\">주의: getline으로 한 줄씩 복사하면 바이너리 파일이 깨지고 감점 (기출 해설). <code>ios::binary<\/code>, <code>ios::ate<\/code> → <code>tellg<\/code> → <code>seekg(0, ios::beg)<\/code> → <code>read<\/code> → <code>write<\/code> → <code>delete[]<\/code> 순서를 외워.<\/div><\/section>", "title_en": "File I/O", "html_en": "<section class=\"sec\" id=\"s-fstream\"><h3>File Stream Classes and open<\/h3><ul><li><b>ofstream<\/b>: stream class to write on files / <b>ifstream<\/b>: stream class to read from files / <b>fstream<\/b>: read and write from/to files (<code>#include &lt;fstream&gt;<\/code>)<\/li><li>File processing order: <b>open → read/write → close<\/b><\/li><li>Decide when opening: text vs binary; for writing, <b>append vs truncate (overwrite)<\/b>; file position (automatic vs user-controlled)<\/li><li><code>myfile.open(filename, mode);<\/code> or via the constructor <code>ofstream myfile(\"example.txt\");<\/code><\/li><li>Check that it opened: <code>if (myfile.is_open()) { ... }<\/code>; close: <code>myfile.close();<\/code><\/li><li>Write text: <code>myfile &lt;&lt; \"This is a line.\\n\";<\/code>; read: <code>while (getline(myfile, line)) cout &lt;&lt; line &lt;&lt; '\\n';<\/code><\/li><li>State checks: <code>bad()<\/code> read/write failed, <code>fail()<\/code> bad + format error, <code>eof()<\/code> end of file, <code>good()<\/code> everything OK, <code>clear()<\/code> reset the flags<\/li><\/ul>\n<div class=\"callout exam\">Exam point: 2019 blank \"ofstream: write on files / (ifstream): read from files / (fstream): read and write\".<\/div><\/section>\n<section class=\"sec\" id=\"s-open-modes\"><h3>File Open Modes<\/h3><div class=\"tblw\"><table><thead><tr><th>Flag<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>ios::in<\/code><\/td><td>open for input (reading)<\/td><\/tr><tr><td><code>ios::out<\/code><\/td><td>open for output (writing)<\/td><\/tr><tr><td><code>ios::binary<\/code><\/td><td>open in binary mode<\/td><\/tr><tr><td><code>ios::ate<\/code><\/td><td>set the initial position at the <b>end of the file<\/b> (otherwise at the beginning)<\/td><\/tr><tr><td><code>ios::app<\/code><\/td><td><b>all output operations are performed at the end of the file<\/b> → <b>appends<\/b> to the existing content<\/td><\/tr><tr><td><code>ios::trunc<\/code><\/td><td>if the file is opened for output and <b>already exists<\/b>, its previous content is <b>deleted<\/b> and replaced by the new content<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Combine several with <b>bitwise OR <code>|<\/code><\/b>: <code>myfile.open(\"example.bin\", ios::out | ios::app | ios::binary);<\/code><\/li><li><b>Default modes<\/b>: ofstream = <code>ios::out<\/code>, ifstream = <code>ios::in<\/code>, fstream = <code>ios::in | ios::out<\/code><\/li><li>Opening for writing erases the existing file and writes from the beginning (the professor warned about this several times)<\/li><\/ul>\n<div class=\"callout exam\">Exam point: 2023 blanks \"ios::app means all output operations are performed at the (end)\", \"(ios::trunc) means if the file is opened for output and already (existing), its previous content is deleted\". app also in 2019.<\/div><\/section>\n<section class=\"sec\" id=\"s-seek-tell\"><h3>File Position: tellg / seekg<\/h3><ul><li>There is a separate <b>get position<\/b> (reading) and <b>put position<\/b> (writing)<\/li><li><code>tellg()<\/code> / <code>tellp()<\/code>: return the current get/put position<\/li><li><code>seekg(position)<\/code> / <code>seekp(position)<\/code>: move to an absolute position<\/li><li><code>seekg(offset, direction)<\/code>: <code>ios::beg<\/code> (from the beginning), <code>ios::cur<\/code> (from the current position), <code>ios::end<\/code> (from the end)<\/li><\/ul>\n<p><b>Getting the file size (a blank every year)<\/b><\/p>\n<pre class=\"code\">streampos begin, end;\nifstream myfile(&quot;example.bin&quot;, ios::binary);\nbegin = myfile.tellg();          // beginning position\nmyfile.seekg(0, ios::end);       // go to the end\nend = myfile.tellg();            // end position\nmyfile.close();\ncout &lt;&lt; &quot;size is: &quot; &lt;&lt; (end-begin) &lt;&lt; &quot; bytes.\\n&quot;;<\/pre>\n<div class=\"callout exam\">Exam point: 2024·2023·2019 \"Fill in the boxes to print the size\". The three lines <code>begin = myfile.tellg();<\/code> → <code>myfile.seekg(0, ios::end);<\/code> → <code>end = myfile.tellg();<\/code>.<\/div><\/section>\n<section class=\"sec\" id=\"s-binary\"><h3>Binary Files and File Copy<\/h3><ul><li>Text vs binary: writing 253 as text gives the characters '2','5','3' (3 bytes); as binary it is 11111101 (1 byte)<\/li><li>Binary I/O uses <code>write(memory_block, size);<\/code> / <code>read(memory_block, size);<\/code> (memory_block is a <code>char*<\/code>)<\/li><\/ul>\n<p><b>Reading a whole file (from the slides)<\/b><\/p>\n<pre class=\"code\">ifstream file(&quot;example.bin&quot;, ios::in | ios::binary | ios::ate);\nif (file.is_open()) {\n    streampos size = file.tellg();     // because of ate, end position = file size\n    char* memblock = new char[size];\n    file.seekg(0, ios::beg);           // rewind to the beginning\n    file.read(memblock, size);\n    file.close();\n    ...\n    delete[] memblock;\n}<\/pre>\n<p><b>File copy (code writing in 2024·2025)<\/b>: the code above + <code>ofstream out(\"des.bin\", ios::out | ios::binary); out.write(memblock, size); out.close();<\/code><\/p>\n<div class=\"callout trap\">Caution: copying line by line with getline corrupts a binary file and loses points (per past-exam answer notes). Memorize the order <code>ios::binary<\/code>, <code>ios::ate<\/code> → <code>tellg<\/code> → <code>seekg(0, ios::beg)<\/code> → <code>read<\/code> → <code>write<\/code> → <code>delete[]<\/code>.<\/div><\/section>", "topics": ["fileio"]}], "title_en": "C++ in Summary (Syntax · Pointers · File I/O)", "intro_en": "A summary of C++ syntax. What shows up directly on the exam: the three meanings of pointer `*` and `&`, static vs dynamic allocation, fill-in-the-blank on the Rectangle pointer code, and file I/O (open modes, tellg/seekg, copying a binary file). The file-copy code had to be written in full in both 2024 and 2025."}, {"id": "U3", "title": "객체지향 설계 (IIKH)", "src": "L03 Object-Oriented Design.pdf (Budd Ch.3)", "intro": "책임 주도 설계와 개발 9단계, IIKH 예제, 구성요소의 특징(결합도·응집도, 인터페이스·구현), 통합과 stub, 유지보수. 결합도/응집도 빈칸은 2024·2023·2022·2019·2016에 다 나왔고, stub·slowly integrated 서술도 단골이야.", "lessons": [{"id": "L3-1", "title": "책임 주도 설계 · 개발 과정 · 시나리오", "src": "L03 p.2–9", "secs": [{"id": "rdd", "title": "책임 주도 설계 (Responsibility Driven Design)", "title_en": "Responsibility Driven Design", "topic": "design"}, {"id": "dev-process", "title": "개발 과정 9단계", "title_en": "The 9-Step Development Process", "topic": "design"}, {"id": "scenario", "title": "IIKH와 시나리오", "title_en": "IIKH and Scenarios", "topic": "design"}], "html": "<section class=\"sec\" id=\"s-rdd\"><h3>책임 주도 설계 (Responsibility Driven Design)<\/h3><ul><li>OOP = 상호작용하는 객체들의 집합<\/li><li>각 객체는 공동체(community) 안에서 <b>책임(responsibility)<\/b> 을 가진 구성요소<\/li><li>시스템이 수행할 활동들을 나누고, 그 활동(책임)을 시스템의 객체들에 <b>분배<\/b><\/li><li>책임 목록을 다 만든 뒤, 객체 집합을 정하고 어떤 책임을 어떤 객체에 줄지 결정<\/li><li><b>한 객체 안의 책임들은 서로 밀접하게 관련<\/b>되어야 함<\/li><li>설계 과정: 부정확하고 모호하고 불분명한 <b>명세(specification)<\/b> → 구체적 논리의 <b>SW 시스템 설계<\/b><\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-dev-process\"><h3>개발 과정 9단계<\/h3><ol><li><b>Initial Description<\/b> (Specification) — 초기 명세<\/li><li><b>Refine Specification<\/b> — 명세 다듬기 (시나리오)<\/li><li><b>Identification of Components<\/b> — 구성요소 식별<\/li><li><b>Identification of Components Responsibilities<\/b> — 구성요소의 책임 식별 (CRC 카드)<\/li><li><b>Formalize the Interface<\/b> — 인터페이스 정형화<\/li><li><b>Designing the Subsystem<\/b> — 설계<\/li><li><b>Implementing Components<\/b> — 구성요소 구현 (+ unit test)<\/li><li><b>Integration of Components<\/b> — 통합 (stub)<\/li><li><b>Maintenance &amp; Evolution<\/b> — 유지보수와 진화<\/li><\/ol><\/section>\n<section class=\"sec\" id=\"s-scenario\"><h3>IIKH와 시나리오<\/h3><ul><li><b>IIKH (Intelligent Interactive Kitchen Helper)<\/b>: 부엌의 레시피 색인 카드 상자를 대체하는 PC 응용. 레시피 DB 관리 + 일주일 같은 기간의 식사 계획, 인원수에 맞게 레시피 자동 조절(scale), 주간·일·끼니별 메뉴 출력, 통합 장보기 목록 출력<\/li><li>초기 명세는 <b>모호하고 불분명<\/b> (사장이 냅킨 뒤에 그려 옴) → 모호함을 없애야 함<\/li><li><b>명세 다듬기 = 시나리오 따라가기 (walking through scenarios)<\/b>: 이미 동작하는 응용이 있다고 <b>가정하고<\/b> 다양한 사용 방법을 따라가 본다<ul><li>look and feel 정하기, 의도한 용도를 빠짐없이 찾기, 설명 문서와 상위 설계 만들기<\/li><li>다른 저자들은 <b>use-cases<\/b>라고 부름 (시스템 사용 시나리오의 집합)<\/li><\/ul><\/li><li>IIKH 기능: 레시피 DB 탐색, 새 레시피 추가, 레시피 편집·주석, 여러 코스의 식사 계획, 인원수에 맞게 조절, 기간(일주일) 계획, 장보기 목록 생성<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L03-p8.jpg\" aria-label=\"크게 보기\"><img src=\"img/L03-p8.jpg\" alt=\"L03 p.8 · IIKH 시나리오 예\" loading=\"lazy\"><\/button><figcaption>L03 p.8 · IIKH 시나리오 예<\/figcaption><\/figure><\/section>", "title_en": "Responsibility-Driven Design · Development Process · Scenarios", "html_en": "<section class=\"sec\" id=\"s-rdd\"><h3>Responsibility Driven Design<\/h3><ul><li>OOP = a set of interacting objects<\/li><li>Each object is a component that has <b>responsibility<\/b> in a community<\/li><li>The system is divided into the various activities it has to perform; those activities (responsibilities) are then <b>distributed<\/b> among the objects in the system<\/li><li>After completing a list of responsibilities, decide on a set of objects and determine which responsibilities should be assigned to which object<\/li><li><b>Responsibilities in an object should be closely related<\/b><\/li><li>Design process: an imprecise, ambiguous, unclear <b>specification<\/b> → a <b>software system design<\/b> with concrete logic<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-dev-process\"><h3>The 9-Step Development Process<\/h3><ol><li><b>Initial Description<\/b> (Specification)<\/li><li><b>Refine Specification<\/b> (scenarios)<\/li><li><b>Identification of Components<\/b><\/li><li><b>Identification of Components Responsibilities<\/b> (CRC cards)<\/li><li><b>Formalize the Interface<\/b><\/li><li><b>Designing the Subsystem<\/b><\/li><li><b>Implementing Components<\/b> (+ unit test)<\/li><li><b>Integration of Components<\/b> (stubs)<\/li><li><b>Maintenance &amp; Evolution<\/b><\/li><\/ol><\/section>\n<section class=\"sec\" id=\"s-scenario\"><h3>IIKH and Scenarios<\/h3><ul><li><b>IIKH (Intelligent Interactive Kitchen Helper)<\/b>: a PC-based application that replaces the box of recipe index cards in the kitchen. Maintains a recipe database + plans meals for an extended period (say a week), automatically scales recipes to any number of servings, prints menus for the week/day/meal, prints an integrated grocery list<\/li><li>The initial description is <b>ambiguous and unclear<\/b> (the president drew it on the back of a dinner napkin) → the ambiguities must be clarified<\/li><li><b>Refining the specification = walking through scenarios<\/b>: <b>pretend<\/b> we already had a working application and walk through the various uses of the system<ul><li>Establish the \"look and feel\", make sure we have uncovered all the intended uses, develop descriptive documentation, create the high-level software design<\/li><li>Other authors use the term <b>use-cases<\/b> (a set of scenarios of system usage)<\/li><\/ul><\/li><li>IIKH abilities: browse the recipe database, add a new recipe, edit or annotate a recipe, plan a meal of several courses, scale a recipe for some number of people, plan a longer period (a week), generate a grocery list<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L03-p8.jpg\" aria-label=\"Enlarge\"><img src=\"img/L03-p8.jpg\" alt=\"L03 p.8 · IIKH scenario example\" loading=\"lazy\"><\/button><figcaption>L03 p.8 · IIKH scenario example<\/figcaption><\/figure><\/section>", "topics": ["design"]}, {"id": "L3-2", "title": "구성요소 식별 · CRC 카드 · IIKH의 6개 구성요소", "src": "L03 p.10–18", "secs": [{"id": "component", "title": "구성요소 (Component)", "title_en": "Component", "topic": "design"}, {"id": "crc", "title": "CRC 카드", "title_en": "CRC Cards", "topic": "design"}, {"id": "iikh-components", "title": "IIKH의 6개 구성요소", "title_en": "The Six IIKH Components", "topic": "design"}], "html": "<section class=\"sec\" id=\"s-component\"><h3>구성요소 (Component)<\/h3><ul><li><b>추상적 설계 단위<\/b>로, 서로 다른 작업에 대한 책임을 연결할 수 있는 것<\/li><li><b>작고 잘 정의된 책임 집합<\/b>을 가져야 함<\/li><li>다른 구성요소와의 상호작용은 <b>가능한 최소<\/b>로<\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-crc\"><h3>CRC 카드<\/h3><ul><li>구성요소는 <b>CRC 카드<\/b>로 가장 쉽게 기술한다: <b>C<\/b>omponent(이름), <b>R<\/b>esponsibility(맡은 책임 설명), <b>C<\/b>ollaborators(협력하는 다른 구성요소 목록)<\/li><li>예) <b>Greeter<\/b>: 책임 = 환영 메시지 표시, 사용자에게 선택지 제공, Recipe Database Manager나 Plan Manager로 제어 넘기기 / 협력자 = Database Manager, Plan Manager<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L03-p11.jpg\" aria-label=\"크게 보기\"><img src=\"img/L03-p11.jpg\" alt=\"L03 p.11 · CRC 카드 양식과 Greeter 카드\" loading=\"lazy\"><\/button><figcaption>L03 p.11 · CRC 카드 양식과 Greeter 카드<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-iikh-components\"><h3>IIKH의 6개 구성요소<\/h3><div class=\"tblw\"><table><thead><tr><th>구성요소<\/th><th>책임<\/th><\/tr><\/thead><tbody><tr><td><b>Greeter<\/b><\/td><td>시작 시 환영 창. 레시피 DB 탐색, 새 레시피 추가, 레시피 편집·주석, 식사 계획 검토·생성 선택<\/td><\/tr><tr><td><b>Recipe Database<\/b><\/td><td>레시피 DB 유지, 탐색 허용, 기존 레시피 편집·주석, 새 레시피 추가<\/td><\/tr><tr><td><b>Recipe<\/b><\/td><td>재료 목록과 변환 알고리즘 유지, 자기 데이터 편집, 화면에 자기 표시, 자기 인쇄<\/td><\/tr><tr><td><b>Planner<\/b> (Plan Manager)<\/td><td>계획할 날짜 범위 선택, 기존 계획 편집, Date 객체와 연관<\/td><\/tr><tr><td><b>Date<\/b><\/td><td>특정 끼니 편집, 날짜에 주석(\"Bob's Birthday\"), 전체 끼니의 장보기 목록 출력<\/td><\/tr><tr><td><b>Meal<\/b><\/td><td>한 끼 정보, 레시피 DB와 상호작용해 레시피 선택, 인원수 설정 → 레시피 자동 조절, 끼니 장보기 목록<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>6개 구성요소만으로 다 됨 → 이 시점에 구성요소를 <b>다른 프로그래머들에게 나눠<\/b> 개발시킬 수 있다<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2025 서술 \"In project 1 (IIKH), main difference between Recipe class and RecipeDB class?\" → Recipe = 레시피 <b>하나<\/b>의 데이터를 유지하고 자기를 편집·표시·인쇄, RecipeDB = 레시피 <b>모음<\/b>을 관리(탐색, 검색, 추가, 편집).<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L03-p12.jpg\" aria-label=\"크게 보기\"><img src=\"img/L03-p12.jpg\" alt=\"L03 p.12 · 첫 구성요소 Greeter\" loading=\"lazy\"><\/button><figcaption>L03 p.12 · 첫 구성요소 Greeter<\/figcaption><\/figure><\/section>", "title_en": "Identifying Components · CRC Cards · The Six IIKH Components", "html_en": "<section class=\"sec\" id=\"s-component\"><h3>Component<\/h3><ul><li><b>An abstract design entity<\/b> with which we can associate responsibilities for different tasks<\/li><li>Must have <b>a small well-defined set of responsibilities<\/b><\/li><li>Should interact with other components <b>to the minimal extent possible<\/b><\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-crc\"><h3>CRC Cards<\/h3><ul><li>Components are most easily described using <b>CRC cards<\/b>: <b>C<\/b>omponent (name), <b>R<\/b>esponsibility (description of its responsibilities), <b>C<\/b>ollaborators (list of other components it works with)<\/li><li>e.g. <b>Greeter<\/b>: responsibilities = display an informative welcome message, offer the user choices, pass control to the Recipe Database Manager or the Plan Manager / collaborators = Database Manager, Plan Manager<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L03-p11.jpg\" aria-label=\"Enlarge\"><img src=\"img/L03-p11.jpg\" alt=\"L03 p.11 · CRC card format and the Greeter card\" loading=\"lazy\"><\/button><figcaption>L03 p.11 · CRC card format and the Greeter card<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-iikh-components\"><h3>The Six IIKH Components<\/h3><div class=\"tblw\"><table><thead><tr><th>Component<\/th><th>Responsibilities<\/th><\/tr><\/thead><tbody><tr><td><b>Greeter<\/b><\/td><td>welcome window at startup; lets the user browse the recipe database, add a new recipe, edit/annotate a recipe, review or create a meal plan<\/td><\/tr><tr><td><b>Recipe Database<\/b><\/td><td>maintains the recipe database, allows browsing, permits editing/annotating existing recipes, adding new recipes<\/td><\/tr><tr><td><b>Recipe<\/b><\/td><td>maintains the list of ingredients and the transformation algorithm, edits its own data, displays itself on the screen, prints itself<\/td><\/tr><tr><td><b>Planner<\/b> (Plan Manager)<\/td><td>selects a sequence of dates for planning, edits an existing plan, associates with Date objects<\/td><\/tr><tr><td><b>Date<\/b><\/td><td>edits specific meals, annotates dates (\"Bob's Birthday\"), prints the grocery list for the entire set of meals<\/td><\/tr><tr><td><b>Meal<\/b><\/td><td>holds information about a single meal, interacts with the recipe database to select recipes, sets the number of people → recipes scaled automatically, grocery list for the meal<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Everything can be accomplished with only six components → at this point the components can be <b>assigned to different programmers<\/b> for development<\/li><\/ul>\n<div class=\"callout exam\">Exam point: 2025 essay \"In project 1 (IIKH), main difference between Recipe class and RecipeDB class?\" → Recipe maintains the data of <b>a single<\/b> recipe and edits/displays/prints itself; RecipeDB manages the <b>collection<\/b> of recipes (browse, search, add, edit).<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L03-p12.jpg\" aria-label=\"Enlarge\"><img src=\"img/L03-p12.jpg\" alt=\"L03 p.12 · The first component, the Greeter\" loading=\"lazy\"><\/button><figcaption>L03 p.12 · The first component, the Greeter<\/figcaption><\/figure><\/section>", "topics": ["design"]}, {"id": "L3-3", "title": "구성요소의 특징: 행동·상태, 결합도·응집도, 인터페이스·구현", "src": "L03 p.19–25", "secs": [{"id": "behavior-state", "title": "행동과 상태 · 인스턴스와 클래스", "title_en": "Behavior and State · Instances and Classes", "topic": "design"}, {"id": "coupling-cohesion", "title": "결합도와 응집도 (Coupling and Cohesion)", "title_en": "Coupling and Cohesion", "topic": "couple"}, {"id": "interface-impl", "title": "인터페이스와 구현 · 정보 은닉", "title_en": "Interface and Implementation · Information Hiding", "topic": "encap"}, {"id": "public-private", "title": "Public view와 Private view", "title_en": "Public View and Private View", "topic": "encap"}], "html": "<section class=\"sec\" id=\"s-behavior-state\"><h3>행동과 상태 · 인스턴스와 클래스<\/h3><ul><li><b>Behavior<\/b>: 구성요소가 수행할 수 있는 행동들의 집합<\/li><li><b>State<\/b>: 구성요소 안에 있는 모든 정보(데이터 값). 행동이 상태를 바꾸는 게 일반적<\/li><li><b>Instances and Classes<\/b>: Recipe 인스턴스는 많지만 모두 같은 방식으로 행동 → 그 행동은 <b>Recipe 클래스에 공통<\/b><\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-coupling-cohesion\"><h3>결합도와 응집도 (Coupling and Cohesion)<\/h3><div class=\"tblw\"><table><thead><tr><th><\/th><th>정의<\/th><th>목표<\/th><\/tr><\/thead><tbody><tr><td><b>Cohesion<\/b> (응집도)<\/td><td>한 구성요소에 배정된 작업들이 <b>의미 있는 하나의 단위<\/b>를 이루는 정도 (책임들이 얼마나 강하게 관련되어 있나)<\/td><td><b>최대화 (maximize)<\/b><\/td><\/tr><tr><td><b>Coupling<\/b> (결합도)<\/td><td>어떤 책임을 수행하는 능력이 <b>다른 구성요소의 행동에 의존하는<\/b> 정도 (모듈 간 상호 의존도)<\/td><td><b>최소화 (minimize)<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>좋은 설계 = <b>high cohesion, low (loose) coupling<\/b><\/li><li>결합도가 높으면: 한 모듈의 변경이 다른 모듈에 영향 → 유지보수·재사용이 어려움<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2024 \"(Coupling) and (Cohesion) are two key concepts used to measure design quality… good design = (high) cohesion, (low) coupling\", 2023 \"Coupling is the degree to which each module (relies/depends) on … (Cohesion) … (minimize) … (maximize)\", 2016 \"(depends upon) … desirable to (minimize)\". 영어 정의 문장을 그대로 외워.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L03-p22.jpg\" aria-label=\"크게 보기\"><img src=\"img/L03-p22.jpg\" alt=\"L03 p.22 · Coupling and Cohesion\" loading=\"lazy\"><\/button><figcaption>L03 p.22 · Coupling and Cohesion<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-interface-impl\"><h3>인터페이스와 구현 · 정보 은닉<\/h3><ul><li>구성요소를 <b>무엇을 할 수 있는지(what)<\/b> 로 특징지음<\/li><li>구성요소의 사용자는 <b>무엇을 하는지만 알면 되고 어떻게 하는지(how)는 몰라도 됨<\/b><\/li><li><b>Two views of a software system<\/b>: 인터페이스(edit a recipe, create new recipe, display on terminal) vs 구현(text buffer, window pointer, ingredient list)<\/li><li><b>information hiding<\/b>: 구현 세부를 <b>의도적으로(purposeful) 숨기는 것<\/b>. 덮개(cover)가 있어서 내부를 볼 수 없고, 덕분에 <b>보호(protection)<\/b> 도 됨<\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L03-p24.jpg\" aria-label=\"크게 보기\"><img src=\"img/L03-p24.jpg\" alt=\"L03 p.24 · Two views of a Software System\" loading=\"lazy\"><\/button><figcaption>L03 p.24 · Two views of a Software System<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-public-private\"><h3>Public view와 Private view<\/h3><ul><li><b>Public view<\/b>: 다른 구성요소가 보고 쓸 수 있는 특징(데이터 또는 행동) → 인터페이스<\/li><li><b>Private view<\/b>: 구성요소 <b>안에서만<\/b> 쓰는 특징 → 구현<\/li><li>public/private을 구분하는 것이 객체지향 프로그래밍의 핵심 특징 (교수님 강조)<\/li><\/ul><\/section>", "title_en": "Characteristics of Components: Behavior/State, Coupling/Cohesion, Interface/Implementation", "html_en": "<section class=\"sec\" id=\"s-behavior-state\"><h3>Behavior and State · Instances and Classes<\/h3><ul><li><b>Behavior<\/b>: the set of actions a component can perform<\/li><li><b>State<\/b>: all the information (data values) held within a component. It is common for behavior to change state<\/li><li><b>Instances and Classes<\/b>: there are many instances of Recipe, but they all behave the same way → we say the behavior is <b>common to the class Recipe<\/b><\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-coupling-cohesion\"><h3>Coupling and Cohesion<\/h3><div class=\"tblw\"><table><thead><tr><th><\/th><th>Definition<\/th><th>Goal<\/th><\/tr><\/thead><tbody><tr><td><b>Cohesion<\/b><\/td><td>the degree to which the tasks assigned to a component seem to form <b>a meaningful unit<\/b> (how strongly its responsibilities are related)<\/td><td><b>maximize<\/b><\/td><\/tr><tr><td><b>Coupling<\/b><\/td><td>the degree to which the ability to fulfill a certain responsibility <b>depends upon the actions of another component<\/b> (interdependence between modules)<\/td><td><b>minimize<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Good design = <b>high cohesion, low (loose) coupling<\/b><\/li><li>With high coupling, a change in one module affects other modules → hard to maintain and reuse<\/li><\/ul>\n<div class=\"callout exam\">Exam point: 2024 \"(Coupling) and (Cohesion) are two key concepts used to measure design quality… good design = (high) cohesion, (low) coupling\", 2023 \"Coupling is the degree to which each module (relies/depends) on … (Cohesion) … (minimize) … (maximize)\", 2016 \"(depends upon) … desirable to (minimize)\". Memorize the English definitions word for word.<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L03-p22.jpg\" aria-label=\"Enlarge\"><img src=\"img/L03-p22.jpg\" alt=\"L03 p.22 · Coupling and Cohesion\" loading=\"lazy\"><\/button><figcaption>L03 p.22 · Coupling and Cohesion<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-interface-impl\"><h3>Interface and Implementation · Information Hiding<\/h3><ul><li>We characterize software components by <b>what<\/b> they can do<\/li><li>The user of a software component <b>need only know what it does, not how it does it<\/b><\/li><li><b>Two views of a software system<\/b>: interface (edit a recipe, create new recipe, display on terminal) vs implementation (text buffer, window pointer, ingredient list)<\/li><li><b>information hiding<\/b>: the <b>purposeful hiding of implementation details<\/b>. A cover keeps you from seeing inside, which also gives <b>protection<\/b><\/li><\/ul><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L03-p24.jpg\" aria-label=\"Enlarge\"><img src=\"img/L03-p24.jpg\" alt=\"L03 p.24 · Two views of a Software System\" loading=\"lazy\"><\/button><figcaption>L03 p.24 · Two views of a Software System<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-public-private\"><h3>Public View and Private View<\/h3><ul><li><b>Public view<\/b>: those features (data or behavior) that other components can see and use → the interface<\/li><li><b>Private view<\/b>: those features (data or behavior) that are used <b>only within the component<\/b> → the implementation<\/li><li>Distinguishing public and private is a key feature of object-oriented programming (the professor stressed this)<\/li><\/ul><\/section>", "topics": ["couple", "design", "encap"]}, {"id": "L3-4", "title": "인터페이스 정형화 · 이름 · 구현 · 통합(stub) · 유지보수", "src": "L03 p.26–33", "secs": [{"id": "naming", "title": "인터페이스 정형화와 이름 짓기", "title_en": "Formalizing the Interface and Choosing Names", "topic": "design"}, {"id": "implement", "title": "설계 · 구현 · 단위 테스트", "title_en": "Design · Implementation · Unit Testing", "topic": "design"}, {"id": "stub", "title": "통합과 stub", "title_en": "Integration and Stubs", "topic": "design"}, {"id": "maintenance", "title": "유지보수와 진화 · 흔한 설계 결함", "title_en": "Maintenance and Evolution · Common Design Flaws", "topic": "se"}], "html": "<section class=\"sec\" id=\"s-naming\"><h3>인터페이스 정형화와 이름 짓기<\/h3><p><b>5. Formalize the Interface<\/b>: 구성요소 간 통신 채널을 정형화<\/p>\n<ul><li>각 구성요소의 일반 구조 식별. 행동이 <b>하나뿐인 구성요소는 함수<\/b>로, <b>여러 개면 클래스<\/b>로<\/li><li>책임마다 이름을 붙임 → 나중에 프로시저 이름이 됨. 함수 매개변수 식별, 정보를 구성요소에 배정, 시나리오를 다시 돌려 필요한 데이터가 다 있는지 확인<\/li><\/ul>\n<p><b>이름 선택 지침<\/b><\/p>\n<ul><li><b>evocative<\/b> (문제 맥락에서 의미를 떠올리게 하는) — 예: 의미 없는 이름보다 무엇을 세는지 드러나는 이름<\/li><li><b>short<\/b> (짧게)<\/li><li><b>pronounceable<\/b> (발음할 수 있게, 소리 내어 읽어 보기)<\/li><li><b>consistent<\/b> (프로젝트 안에서 일관되게, 예: 변수는 소문자로 시작·함수는 대문자로 시작 규칙을 정했으면 끝까지)<\/li><li><b>avoid digits<\/b> (이름에 숫자 피하기: count1, count2는 차이를 알 수 없음)<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2016 서술 \"What does 'evocative' mean?\" → The name should call to mind (suggest) the meaning/role of the thing in the problem domain.<\/div><\/section>\n<section class=\"sec\" id=\"s-implement\"><h3>설계 · 구현 · 단위 테스트<\/h3><ul><li><b>6. Design<\/b>: 설명을 SW 배치로 바꿈, 각 구성요소의 자료구조 설계, 행동 설명을 알고리즘으로<\/li><li><b>7. Implementing Components<\/b>: 각 구성요소의 활동 구현. 팀원에게 구성요소를 나눠 맡김<ul><li><b>Unit testing<\/b>: 서브시스템을 <b>개별적으로 검증(validate)<\/b>. 올바르게 동작하기 위한 조건을 찾고, 합법적인 입력 값으로 테스트<\/li><\/ul><\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-stub\"><h3>통합과 stub<\/h3><p><b>8. Integration of Components<\/b>: 구성요소들을 <b>천천히(slowly) 통합<\/b>해 완성 시스템으로, 아직 구현 안 된 부분은 <b>stub<\/b>으로<\/p>\n<ul><li><b>stub<\/b>: 행동이 없거나 아주 제한된 행동만 하는 <b>간단한 더미 루틴 (simple dummy routine)<\/b>. 아직 개발 안 된 구성요소의 임시 대체물<\/li><li><b>slowly integrated<\/b>: 한꺼번에(all at once) 통합하지 않고 <b>하나(또는 몇 개)씩 추가하며 테스트<\/b> → 문제가 생기면 방금 추가한 부분이 원인이라 찾고 고치기 쉬움. 한꺼번에 하면 어디서 생긴 문제인지 알 수 없음<\/li><li>통합 중 발견된 오류는 서브시스템 수준의 검증 기법을 다시 조사하게 만든다<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2025·2016 서술 \"Meaning of 'slowly integrated'? Meaning of 'stubs'?\", 2022 빈칸 \"(Stub) is a simple dummy routine with no behavior or with very limited behavior\".<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L03-p30.jpg\" aria-label=\"크게 보기\"><img src=\"img/L03-p30.jpg\" alt=\"L03 p.30 · 8. Integration of Components (stub)\" loading=\"lazy\"><\/button><figcaption>L03 p.30 · 8. Integration of Components (stub)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-maintenance\"><h3>유지보수와 진화 · 흔한 설계 결함<\/h3><p><b>9. Maintenance and Evolution<\/b><\/p>\n<ul><li><b>Software maintenance<\/b>: 초기 동작 버전을 <b>전달한 뒤에(subsequent to the delivery)<\/b> 하는 활동들<\/li><li>SW는 첫 버전 후에도 고정되지 않는다: 버그 발견·수정, 요구사항 변경(정부 규제, 표준화), 하드웨어 변경, 사용자 기대 변화(경쟁 제품 때문에 기능 추가), 더 나은 문서 요구<\/li><li><b>좋은 설계는 변화가 불가피함을 인정하고 처음부터 대비한다<\/b><\/li><li><b>Prepare for Change<\/b>: 가장 가능성 높은 변화 원인을 예측해 영향을 격리(인터페이스, 파일 형식, 통신 프로토콜), 바뀔 하드웨어 인터페이스 격리, <b>구성요소 간 의존 줄이기<\/b>, 주요 결정의 이유를 설계 문서에 기록<\/li><\/ul>\n<p><b>흔한 설계 결함 (Common Design Flaws)<\/b><\/p>\n<ul><li><b>Direct modification<\/b>: 다른 구성요소의 데이터를 직접 수정 → <b>캡슐화 위반<\/b><\/li><li><b>Too much responsibility<\/b>: 이해하고 쓰기 어려움<\/li><li><b>No responsibility<\/b>: 쓸모없음<\/li><li><b>Unused responsibility<\/b>: 어떻게 쓰일지 생각하지 않고 설계한 결과<\/li><li><b>Misleading names<\/b>: 이름은 짧고 책임을 모호하지 않게 드러내야 함<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2023 빈칸 \"(Software maintenance) is the process of changing, modifying, and updating software to keep up with customer needs. (It) is done after the product has launched\".<\/div><\/section>", "title_en": "Formalizing the Interface · Names · Implementation · Integration (Stubs) · Maintenance", "html_en": "<section class=\"sec\" id=\"s-naming\"><h3>Formalizing the Interface and Choosing Names<\/h3><p><b>5. Formalize the Interface<\/b>: formalize the channels of communication between the components<\/p>\n<ul><li>Identify the general structure of each component. Components with <b>only one behavior may be made into functions<\/b>; components with <b>many behaviors<\/b> are more easily implemented as <b>classes<\/b><\/li><li>Give a name to each responsibility → these eventually map onto procedure names. Identify function parameters, assign information to each component, replay the scenarios to ensure all data is available<\/li><\/ul>\n<p><b>Guidelines for selecting names<\/b><\/p>\n<ul><li><b>evocative<\/b> (in the context of the problem) — e.g. a name that reveals what is being counted rather than a meaningless name<\/li><li><b>short<\/b><\/li><li><b>pronounceable<\/b> (read them out loud)<\/li><li><b>consistent<\/b> (within the project; e.g. if you decide variables start lowercase and functions start uppercase, keep it to the end)<\/li><li><b>avoid digits<\/b> within a name (count1, count2 tell you nothing about the difference)<\/li><\/ul>\n<div class=\"callout exam\">Exam point: 2016 essay \"What does 'evocative' mean?\" → The name should call to mind (suggest) the meaning/role of the thing in the problem domain.<\/div><\/section>\n<section class=\"sec\" id=\"s-implement\"><h3>Design · Implementation · Unit Testing<\/h3><ul><li><b>6. Design<\/b>: transform the description into a SW layout, design the data structures of each component, transform behavior descriptions into algorithms<\/li><li><b>7. Implementing Components<\/b>: implement the desired activities in each component. Components are divided among team members<ul><li><b>Unit testing<\/b>: subsystems are <b>validated individually<\/b>. Identify the necessary conditions for correct functioning and test with legal input values<\/li><\/ul><\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-stub\"><h3>Integration and Stubs<\/h3><p><b>8. Integration of Components<\/b>: components are <b>slowly integrated<\/b> into the completed system, using <b>stubs<\/b> for as-yet unimplemented parts<\/p>\n<ul><li><b>stub<\/b>: a <b>simple dummy routine<\/b> with no behavior or with very limited behavior. A temporary stand-in for a component not yet developed<\/li><li><b>slowly integrated<\/b>: not integrated all at once, but <b>added one (or a few) at a time and tested<\/b> → if a problem appears, the part just added is the cause, so it is easy to find and fix. If everything is integrated at once, you cannot tell where the problem came from<\/li><li>Errors discovered during integration cause reinvestigation of the validation techniques performed at the subsystem level<\/li><\/ul>\n<div class=\"callout exam\">Exam point: 2025·2016 essay \"Meaning of 'slowly integrated'? Meaning of 'stubs'?\", 2022 blank \"(Stub) is a simple dummy routine with no behavior or with very limited behavior\".<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L03-p30.jpg\" aria-label=\"Enlarge\"><img src=\"img/L03-p30.jpg\" alt=\"L03 p.30 · 8. Integration of Components (stub)\" loading=\"lazy\"><\/button><figcaption>L03 p.30 · 8. Integration of Components (stub)<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-maintenance\"><h3>Maintenance and Evolution · Common Design Flaws<\/h3><p><b>9. Maintenance and Evolution<\/b><\/p>\n<ul><li><b>Software maintenance<\/b>: activities <b>subsequent to the delivery<\/b> of the initial working version<\/li><li>Software does not remain fixed after the first version: bugs are discovered and fixed, requirements change (government regulations, standardization), hardware changes, user expectations change (more features due to competing products), better documentation is required<\/li><li><b>Good design recognizes the inevitability of changes and plans an accommodation for them from the very beginning<\/b><\/li><li><b>Prepare for Change<\/b>: predict the most likely sources of change and isolate their effect (interfaces, file formats, communication protocols), isolate interfaces to hardware likely to change, <b>reduce dependency of one component on another<\/b>, record the reasoning behind every major decision in the design documentation<\/li><\/ul>\n<p><b>Common Design Flaws<\/b><\/p>\n<ul><li><b>Direct modification<\/b>: directly modifying the data of another component → <b>a direct violation of encapsulation<\/b><\/li><li><b>Too much responsibility<\/b>: difficult to understand and to use<\/li><li><b>No responsibility<\/b>: serves no purpose<\/li><li><b>Unused responsibility<\/b>: the result of designing components without thinking about how they will be used<\/li><li><b>Misleading names<\/b>: names should be short and unambiguously indicate the responsibilities<\/li><\/ul>\n<div class=\"callout exam\">Exam point: 2023 blank \"(Software maintenance) is the process of changing, modifying, and updating software to keep up with customer needs. (It) is done after the product has launched\".<\/div><\/section>", "topics": ["design", "se"]}], "title_en": "Object-Oriented Design (IIKH)", "intro_en": "Responsibility-driven design and the 9-step development process, the IIKH example, characteristics of components (coupling/cohesion, interface/implementation), integration and stubs, maintenance. Coupling/cohesion blanks appeared in 2024·2023·2022·2019·2016, and essays on stubs and \"slowly integrated\" are regulars too."}, {"id": "U4", "title": "C++ 데이터 추상화: class", "src": "L04 C++ Data Abstraction.pdf + Handout 2 + 보충 자료", "intro": "교수님이 \"이 수업에서 가장 중요한 부분\"이라고 한 단원. 데이터 추상화·캡슐화·정보 은닉, 캡슐화의 이점 3가지, public 데이터를 피하는 이유 3가지, 생성자, 복사 생성자, static, const 멤버 함수, inline, friend, 참조, 인자 전달 방식까지. 10/7 수업은 생성자까지 나갔고 10/14 수업은 녹음 전사가 없어. 그 뒤 내용도 기출 단골이라 같이 정리했어.", "lessons": [{"id": "L4-1", "title": "데이터 추상화 · 캡슐화 · 정보 은닉", "src": "L04 p.2–4 + Handout 2", "secs": [{"id": "abs-encap", "title": "세 용어", "title_en": "The Three Terms", "topic": "encap"}, {"id": "two-views", "title": "내부 관점과 외부 관점", "title_en": "Internal and External Views", "topic": "encap"}, {"id": "encap-benefits", "title": "데이터 캡슐화의 이점 3가지 (Handout 2)", "title_en": "Three Benefits of Data Encapsulation (Handout 2)", "topic": "encap"}], "html": "<section class=\"sec\" id=\"s-abs-encap\"><h3>세 용어<\/h3><div class=\"tblw\"><table><thead><tr><th>용어<\/th><th>정의<\/th><\/tr><\/thead><tbody><tr><td><b>Data Abstraction<\/b><\/td><td>불필요한 세부를 감추는, 적절한 기능을 가진 클래스를 만드는 것<\/td><\/tr><tr><td><b>Data Encapsulation<\/b><\/td><td>구현이 인터페이스로 <b>감싸여(encapsulated)<\/b> 있어서, 구현에 <b>합법적으로 접근하는 유일한 방법이 인터페이스<\/b>인 것<\/td><\/tr><tr><td><b>Information Hiding<\/b><\/td><td>구현이 사용자로부터 <b>숨겨져<\/b> 있는 것<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>세 용어는 <b>거의 같은 개념<\/b>, 강조점만 조금 다름 (추상화 = 핵심만 보여주기, 캡슐화 = 데이터와 함수를 묶어 인터페이스로만 접근, 은닉 = 숨기기)<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 교수님이 \"취업 면접에서도 나오는 질문, 이 슬라이드가 가장 중요하다\"고 함. 모범 답안 = <b>\"Separation of interface and implementation, such that the implementation is hidden from the user and the only way to access it is through the interface.\"<\/b><\/div><\/section>\n<section class=\"sec\" id=\"s-two-views\"><h3>내부 관점과 외부 관점<\/h3><ul><li><b>데이터 추상화 = 인터페이스와 구현의 분리 (separation of interface and implementation)<\/b><\/li><li><b>Interface<\/b>: 바깥, 즉 <b>서비스 관점(service view)<\/b>. 객체가 <b>무엇을(what)<\/b> 하는지 기술<\/li><li><b>Implementation<\/b>: 안쪽 관점. <b>어떻게(how)<\/b> 하는지 기술<\/li><li><b>Service view<\/b>: 객체가 <b>어떻게<\/b> 일을 수행하는지 몰라도 <b>제공하는 서비스<\/b>로 객체를 특징짓는 능력<\/li><li>예) 프로젝터: 버튼(화면 올리기·내리기, 켜기·끄기) = 인터페이스, 안의 회로 = 구현. 사용자는 버튼만 알면 됨<\/li><\/ul>\n<div class=\"callout exam\">시험 포인트: 2019·2016 빈칸 \"(Data abstraction) is a technique that relies on the separation of interface and implementation. Interface … describes (what) an object does. Implementation describes (how) it does\".<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L04-p3.jpg\" aria-label=\"크게 보기\"><img src=\"img/L04-p3.jpg\" alt=\"L04 p.3 · Internal and External Views\" loading=\"lazy\"><\/button><figcaption>L04 p.3 · Internal and External Views<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-encap-benefits\"><h3>데이터 캡슐화의 이점 3가지 (Handout 2)<\/h3><ol><li><b>Protection of implementation (safety)<\/b>: 클라이언트는 캡슐화된 데이터에 <b>직접 접근할 수 없다<\/b><\/li><li><b>Readability (understandability)<\/b>: 인터페이스를 쓰는 클라이언트는 인터페이스 함수들이 캡슐화된 정보를 <b>어떻게 쓰는지 알 필요가 없다<\/b><\/li><li><b>Implementation independence<\/b>: <b>구현의 변경이 클라이언트가 보는 인터페이스에 영향을 주지 않는다<\/b>. 캡슐화된 구현은 구현자가 인터페이스를 건드리지 않고 <b>자유롭게 바꿀 수 있게<\/b> 해준다 (클라이언트가 인터페이스를 쓰는 방식은 구현과 독립)<\/li><\/ol>\n<div class=\"callout exam\">시험 포인트: <b>최다 출제<\/b>. 2025·2022·2017 \"List three main benefits … explain each\", 2023 빈칸 \"(implementation independence) means (a change) in implementation should not affect (the interface) seen by clients\", 2019 \"(1) Clients cannot (directly access encapsulated data) (2) Clients of interface does not need to (know how …)\". 세 문장을 영어 그대로 외워.<\/div><\/section>", "title_en": "Data Abstraction · Encapsulation · Information Hiding", "html_en": "<section class=\"sec\" id=\"s-abs-encap\"><h3>The Three Terms<\/h3><div class=\"tblw\"><table><thead><tr><th>Term<\/th><th>Definition<\/th><\/tr><\/thead><tbody><tr><td><b>Data Abstraction<\/b><\/td><td>creating classes with appropriate functionality, which hide the unnecessary details<\/td><\/tr><tr><td><b>Data Encapsulation<\/b><\/td><td>the implementation is <b>encapsulated<\/b> by the interface and <b>the only way to get to the implementation legally is through the interface<\/b><\/td><\/tr><tr><td><b>Information Hiding<\/b><\/td><td>the implementation is <b>hidden<\/b> from the user<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>The three terms are <b>almost the same concept<\/b> with slightly different emphasis (abstraction = show only the essentials, encapsulation = bundle data and functions and allow access only through the interface, hiding = hide it)<\/li><\/ul>\n<div class=\"callout exam\">Exam point: the professor said \"this question also comes up in job interviews; this slide is the most important\". Model answer = <b>\"Separation of interface and implementation, such that the implementation is hidden from the user and the only way to access it is through the interface.\"<\/b><\/div><\/section>\n<section class=\"sec\" id=\"s-two-views\"><h3>Internal and External Views<\/h3><ul><li><b>Data abstraction = separation of interface and implementation<\/b><\/li><li><b>Interface<\/b>: the outside, or <b>service view<\/b>; describes <b>what<\/b> an object does<\/li><li><b>Implementation<\/b>: the inside view; describes <b>how<\/b> it does it<\/li><li><b>Service view<\/b>: the ability to characterize an object by <b>the service it provides<\/b>, without knowing <b>how<\/b> it performs its task<\/li><li>e.g. a projector: the buttons (screen up/down, on/off) = interface, the circuitry inside = implementation. The user only needs to know the buttons<\/li><\/ul>\n<div class=\"callout exam\">Exam point: 2019·2016 blanks \"(Data abstraction) is a technique that relies on the separation of interface and implementation. Interface … describes (what) an object does. Implementation describes (how) it does\".<\/div><figure class=\"slide\"><button class=\"zoom\" data-zoom=\"img/L04-p3.jpg\" aria-label=\"Enlarge\"><img src=\"img/L04-p3.jpg\" alt=\"L04 p.3 · Internal and External Views\" loading=\"lazy\"><\/button><figcaption>L04 p.3 · Internal and External Views<\/figcaption><\/figure><\/section>\n<section class=\"sec\" id=\"s-encap-benefits\"><h3>Three Benefits of Data Encapsulation (Handout 2)<\/h3><ol><li><b>Protection of implementation (safety)<\/b>: clients <b>cannot directly access<\/b> encapsulated data<\/li><li><b>Readability (understandability)<\/b>: clients of the interface <b>do not need to know how<\/b> the functions that describe the interface use the encapsulated information<\/li><li><b>Implementation independence<\/b>: <b>a change in implementation should not affect the interface seen by the clients<\/b> of a class. An encapsulated implementation gives the implementor <b>freedom to change it<\/b> without affecting the interface (how the clients use the interface is independent of the implementation)<\/li><\/ol>\n<div class=\"callout exam\">Exam point: <b>the most frequently asked<\/b>. 2025·2022·2017 \"List three main benefits … explain each\", 2023 blank \"(implementation independence) means (a change) in implementation should not affect (the interface) seen by clients\", 2019 \"(1) Clients cannot (directly access encapsulated data) (2) Clients of interface does not need to (know how …)\". Memorize the three sentences in English as they are.<\/div><\/section>", "topics": ["encap"]}, {"id": "L4-2", "title": "클래스의 행동과 상태 · 메서드 · 메시지 전달", "src": "L04 p.5–8", "secs": [{"id": "method", "title": "행동과 상태 · 메서드의 세 부분", "title_en": "Behavior and State · The Three Parts of a Method", "topic": "encap"}, {"id": "message-passing", "title": "메시지 전달 (Message Passing)", "title_en": "Message Passing", "topic": "encap"}], "html": "<section class=\"sec\" id=\"s-method\"><h3>행동과 상태 · 메서드의 세 부분<\/h3><ul><li><b>Class<\/b>: C++에서 데이터 추상화의 기본 단위<\/li><li><b>Behavior (method, member function)<\/b>: 요청에 응답해서 인스턴스가 수행할 수 있는 행동<\/li><li><b>State (variable)<\/b>: 행동을 성공적으로 완수하려고 객체가 유지해야 하는 데이터. 인스턴스 변수(data member, data field)에 저장<\/li><li><b>메서드의 세 부분<\/b><ul><li><b>Name<\/b>: 메시지와 매칭되어 언제 실행할지 결정<\/li><li><b>Signature<\/b>: <b>반환 타입과 인자 타입의 조합<\/b>. 이름이 같아도 시그니처가 다르면 구별됨<\/li><li><b>Body<\/b>: 메서드가 호출되면 실행되는 코드<\/li><\/ul><\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-message-passing\"><h3>메시지 전달 (Message Passing)<\/h3><p><b>메시지와 함수 호출의 차이<\/b><\/p>\n<ul><li>메시지는 항상 <b>어떤 객체(receiver)<\/b> 에게 주어진다<\/li><li>응답으로 하는 행동은 <b>수신자가 결정<\/b> → 수신자가 다르면 같은 메시지에도 다른 행동을 할 수 있다<\/li><\/ul>\n<p><b>메시지 전달 문법의 세 부분<\/b>: <code>aGame.displayCard(aCard, 42, 27);<\/code><\/p>\n<ul><li><b>message receiver<\/b>: <code>aGame<\/code><\/li><li><b>message selector<\/b>: <code>displayCard<\/code><\/li><li><b>arguments<\/b> (선택): <code>aCard, 42, 27<\/code><\/li><\/ul><\/section>", "title_en": "Behavior and State of a Class · Methods · Message Passing", "html_en": "<section class=\"sec\" id=\"s-method\"><h3>Behavior and State · The Three Parts of a Method<\/h3><ul><li><b>Class<\/b>: the fundamental unit of data abstraction in C++<\/li><li><b>Behavior (method, member function)<\/b>: the actions that an instance can perform in response to a request<\/li><li><b>State (variable)<\/b>: the data that an object must maintain in order to successfully complete its behavior. Stored in instance variables (data members, data fields)<\/li><li><b>The three parts of a method<\/b><ul><li><b>Name<\/b>: will be matched to a message to determine when the method should be executed<\/li><li><b>Signature<\/b>: <b>the combination of return type and argument types<\/b>. Methods with the same name can be distinguished by different signatures<\/li><li><b>Body<\/b>: the code that will be executed when the method is invoked<\/li><\/ul><\/li><\/ul><\/section>\n<section class=\"sec\" id=\"s-message-passing\"><h3>Message Passing<\/h3><p><b>Differences between a message and a function call<\/b><\/p>\n<ul><li>A message is always given to <b>some object, called the receiver<\/b><\/li><li>The action performed in response is <b>determined by the receiver<\/b> → different receivers can do different actions in response to the same message<\/li><\/ul>\n<p><b>Three parts of message passing syntax<\/b>: <code>aGame.displayCard(aCard, 42,
