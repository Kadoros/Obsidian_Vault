<script id="bank-data" type="application/json">{"version": 1, "questions": [{"id": "2025-1ab", "year": 2025, "no": "1(a)(b)", "pts": 4, "type": "blank", "topics": ["static"], "scope": "likely", "prompt": "In C++, static members are used to represent the properties of (a.        ). Unlike typical member variables, static member variables can be accessed even if there is no (b.        ).", "code": "", "answer": "(a) the class  (b) created object (instance)", "tip": "L04 보충 'Static Members': static members of a class can be used when handling property of the class / it can be accessed even if there is no created object.", "src": "L04 static"}, {"id": "2025-1c", "year": 2025, "no": "1(c)", "pts": 2, "type": "blank", "topics": ["quality"], "scope": "in", "prompt": "(c.        ) means the ability of the software to consistently perform its required functions without failure under specified conditions for a specified period of time.", "code": "", "answer": "(c) reliability", "tip": "dependability(믿고 쓸 수 있음)와 헷갈리기 쉬움. '고장 없이 지정된 기간 동안' = reliability.", "src": "L02, Handout1"}, {"id": "2025-1de", "year": 2025, "no": "1(d)(e)", "pts": 4, "type": "blank", "topics": ["se"], "scope": "in", "prompt": "(d.        ) arose because as computer hardware power grew rapidly, (e.        ) of the software systems increased even faster – beyond what existing development methods could manage. Increasing (e) is the main cause of (d).", "code": "", "answer": "(d) software crisis  (e) complexity", "tip": "L02: Software Crisis — Cause : complexity", "src": "L02"}, {"id": "2025-1fg", "year": 2025, "no": "1(f)(g)", "pts": 4, "type": "blank", "topics": ["ctor"], "scope": "in", "prompt": "In C++, if we do not declare any constructor in a class, (f.        ) generates (g.        ).", "code": "", "answer": "(f) the compiler  (g) a default constructor", "tip": "L04: If we did not declare any constructor in class, the compiler would generate a default constructor.", "src": "L04"}, {"id": "2025-1h", "year": 2025, "no": "1(h)", "pts": 2, "type": "blank", "topics": ["se"], "scope": "in", "prompt": "One of the main goals of software engineering is to minimize (h.        ) of software development and maintenance.", "code": "", "answer": "(h) the cost", "tip": "L02 Goals: minimize the cost of software development and maintenance", "src": "L02"}, {"id": "2025-1ijk", "year": 2025, "no": "1(i)(j)(k)", "pts": 6, "type": "blank", "topics": ["constfn"], "scope": "likely", "prompt": "In C++, (i.        ) member function does not (j.        ) any data members of the object on which it is called. This restriction is enforced by (k.        ). (i) member function assures its clients of its benign natures (i.e. safety and readability).", "code": "", "answer": "(i) const  (j) modify  (k) the compiler", "tip": "3년 연속 나온 문장. 통째로 외우기.", "src": "L04 const member functions"}, {"id": "2025-1lm", "year": 2025, "no": "1(l)(m)", "pts": 4, "type": "blank", "topics": ["encap"], "scope": "in", "prompt": "In the concept of information hiding, (l.        ) of an object can be modified only through (m.        ).", "code": "", "answer": "(l) internal data  (m) an interface", "tip": "L02: Internal data of an object can be modified only through an interface.", "src": "L02"}, {"id": "2025-2", "year": 2025, "no": "2", "pts": 9, "type": "short", "topics": ["encap"], "scope": "in", "prompt": "List three main benefits of data encapsulation and explain each benefit in sufficient detail. [(i) <10 words, (ii)(iii) <15 words]", "code": "", "answer": "(i) Protection of implementation (safety): clients cannot directly access encapsulated data.\n(ii) Readability (understandability): clients need not know how interface functions use encapsulated data.\n(iii) Implementation independence: a change in implementation should not affect the interface seen by clients.", "tip": "Handout 2 원문 그대로. 이름 + 한 줄 설명 세트로 외우기.", "src": "Handout 2"}, {"id": "2025-3", "year": 2025, "no": "3", "pts": 5, "type": "short", "topics": ["design"], "scope": "in", "prompt": "In the \"Integration of Components\" step, components are slowly integrated into a completed system, using stubs as yet unimplemented parts. What is the meaning of \"slowly integrated\"? (<15 words)", "code": "", "answer": "Components are added and tested one at a time (incrementally), not all at once.", "tip": "핵심: incrementally / one by one + test each step → 에러 위치를 좁힐 수 있음.", "src": "L03 8. Integration"}, {"id": "2025-4", "year": 2025, "no": "4", "pts": 6, "type": "short", "topics": ["memory"], "scope": "likely", "prompt": "(i) In C/C++, what is a dangling pointer? (<15 words)  (ii) Why can dangling pointers be a problem and dangerous? (<15 words)", "code": "", "answer": "(i) A pointer that points to memory that has already been deallocated (freed).\n(ii) Accessing it causes undefined behavior: crashes or corrupting memory reused by other data.", "tip": "", "src": "L04 Object Creation"}, {"id": "2025-5", "year": 2025, "no": "5", "pts": 9, "type": "short", "topics": ["assert"], "scope": "in", "prompt": "(i) What does the assert(e) function call do? (<15 words)  (ii) What is the main purpose of using assert()? (<7 words)  (iii) To achieve the purpose, e in assert(e) should be a condition that (<10 words).", "code": "", "answer": "(i) If e is true, execution continues; if false, the program stops with an error message.\n(ii) To make programs more reliable (detect bugs early).\n(iii) must always be true at that point (e.g. a class invariant).", "tip": "L04: class invariants and assertions — 'can be used to implement programs that are more reliable'.", "src": "L04"}, {"id": "2025-6", "year": 2025, "no": "6", "pts": 6, "type": "short", "topics": ["design"], "scope": "in", "prompt": "In project 1 (IIKH), what is the main difference between Recipe class and RecipeDB class? (i) Recipe class is supposed to (<10 words)  (ii) RecipeDB class is supposed to (<10 words)", "code": "", "answer": "(i) maintain one recipe's data (ingredients, steps) and edit/display/print itself.\n(ii) maintain the collection of recipes: browse, search, add, and edit recipes.", "tip": "단일 객체 vs 컬렉션 관리. Budd Ch3: Recipe Database = maintain/browse/edit/add; Recipe = ingredients + know how to edit/display/print itself.", "src": "L03 IIKH"}, {"id": "2025-7", "year": 2025, "no": "7", "pts": 6, "type": "short", "topics": ["encap"], "scope": "in", "prompt": "ADT (Abstract Data Type) is called abstract. Why? ADT is called abstract because (<12 words).", "code": "", "answer": "its data and operations are specified independently of any particular implementation.", "tip": "L02: A set of data variables and associated operations that are precisely specified independent of any particular implementation.", "src": "L02 ADT"}, {"id": "2025-8", "year": 2025, "no": "8", "pts": 15, "type": "code", "topics": ["fileio"], "scope": "in", "prompt": "Write a C++ program that performs file-copying from source binary file \"src.bin\" to destination file \"des.bin\". Do not use a file-copy function; read the entire data from src.bin and write it to des.bin.", "code": "#include <iostream>\n#include <fstream>\nusing namespace std;\nint main() {\n    // your code\n}", "answer": "#include <iostream>\n#include <fstream>\nusing namespace std;\nint main() {\n    ifstream in(\"src.bin\", ios::in | ios::binary | ios::ate);\n    if (!in.is_open()) return 1;\n    streampos size = in.tellg();          // ate: 끝에서 열었으니 tellg = 파일 크기\n    char* memblock = new char[size];\n    in.seekg(0, ios::beg);                // 처음으로 되감기\n    in.read(memblock, size);\n    in.close();\n\n    ofstream out(\"des.bin\", ios::out | ios::binary);\n    out.write(memblock, size);\n    out.close();\n    delete[] memblock;\n    return 0;\n}", "tip": "2024 5번과 거의 동일. ios::binary | ios::ate → tellg로 크기 → seekg(0, ios::beg) → read → write → delete[]. 실제로 컴파일해서 복사 확인함.", "src": "C++ in Summary 13"}, {"id": "2025-9", "year": 2025, "no": "9", "pts": 18, "type": "trace", "topics": ["trace", "copy"], "scope": "in", "prompt": "(1) The code has five errors. Which lines are wrong and how to correct them? Assume lines 16 and 17 are correct. (2) What is the screen output after the correction?", "code": " 1: #include <iostream>\n 2: using namespace std;\n 3: class Rect {\n 4: public:\n 5:     int w,h;\n 6:     Rect(int x, int y): w(x), h(y) { cout << \"c1\\n\"; }\n 7:     Rect(const Rect& x) { w=x.w; h=x.h; cout << \"c2\\n\"; }\n 8:     int area() { return w*h; }\n 9: };\n10:\n11: void func(Rect obj, int y) {\n12:     cout << \"f3\\n\";\n13:     obj.h = y;\n14: }\n15: int main() {\n16:     Rect a(5,6);\n17:     Rect *b, *c;\n18:     b = a;\n19:     c = new Rect(7,8);\n20:     func(a,9);\n21:     Rect d(a);\n22:     b.w = 9;\n23:     cout << \"=======\"<< endl;\n24:     cout << a.area() << endl;\n25:     cout << b.area() << endl;\n26:     cout << c.area() << endl;\n27:     cout << d.area() << endl;\n28:     delete b;\n29:     delete c;\n30:     return 0;\n31: }", "answer": "(1)\nline 18: b = &a;\nline 22: b->w = 9;\nline 25: cout << b->area() << endl;\nline 26: cout << c->area() << endl;\nline 28: delete b; 삭제 (b는 new로 만든 게 아니라 스택 객체 a를 가리킴)\n\n(2) 출력\nc1\nc1\nc2\nf3\nc2\n=======\n54\n54\n56\n30", "tip": "func(a,9)는 값 전달 → 복사생성자 c2가 f3보다 먼저 출력. obj.h=9는 복사본만 바뀌어서 a에 영향 없음. d는 b->w=9 하기 전에 복사돼서 5*6=30. g++로 실행해서 확인한 출력.", "src": "C++ in Summary 12, L04"}, {"id": "2024-1ab", "year": 2024, "no": "1(a)(b)", "pts": 3, "type": "blank", "topics": ["paradigm"], "scope": "in", "prompt": "(a.        ) is a programming paradigm based on the concept of (b.        ) which can contain data and code... computer programs are designed by making them out of (b) that interact with one another.", "code": "", "answer": "(a) Object-oriented programming (OOP)  (b) objects", "tip": "", "src": "L02"}, {"id": "2024-1c", "year": 2024, "no": "1(c)", "pts": 2, "type": "blank", "topics": ["paradigm"], "scope": "in", "prompt": "(c.        ) makes extensive use of GOTO statements... In (c), a program contains only a single code block.", "code": "", "answer": "(c) Unstructured programming", "tip": "L02: Unstructured Programming — only one main program, only global data, use goto.", "src": "L02"}, {"id": "2024-1de", "year": 2024, "no": "1(d)(e)", "pts": 3, "type": "blank", "topics": ["paradigm"], "scope": "in", "prompt": "Using (d.        ) variables is often unsafe because this makes all modules (e.        ) on one another.", "code": "", "answer": "(d) global  (e) dependent", "tip": "매년 나옴. 'dependent on one another'.", "src": "L02"}, {"id": "2024-1fg", "year": 2024, "no": "1(f)(g)", "pts": 3, "type": "blank", "topics": ["ctor"], "scope": "in", "prompt": "In C++, (f.        ) is a constructor that is automatically generated by (g.        ) if we do not define any constructor for a class.", "code": "", "answer": "(f) default constructor  (g) the compiler", "tip": "", "src": "L04"}, {"id": "2024-1h", "year": 2024, "no": "1(h)", "pts": 2, "type": "blank", "topics": ["memory"], "scope": "likely", "prompt": "A pointer pointing to a memory location that has been deallocated (or freed) is called a (h.        ) pointer.", "code": "", "answer": "(h) dangling", "tip": "", "src": "L04"}, {"id": "2024-1ij", "year": 2024, "no": "1(i)(j)", "pts": 3, "type": "blank", "topics": ["static"], "scope": "likely", "prompt": "We can define class members (i.        ) using (i) keyword... no matter how many (j.        ) of the class are created, there is only one copy of the (i) member. A (i) member is shared by all (j) of the class.", "code": "", "answer": "(i) static  (j) objects (instances)", "tip": "", "src": "L04"}, {"id": "2024-1klm", "year": 2024, "no": "1(k)(l)(m)", "pts": 4, "type": "blank", "topics": ["constfn"], "scope": "likely", "prompt": "In C++, (k.        ) member function does not (l.        ) any data members of the object on which it is called. This restriction is enforced by (m.        ).", "code": "", "answer": "(k) const  (l) modify  (m) the compiler", "tip": "", "src": "L04"}, {"id": "2024-1nopq", "year": 2024, "no": "1(n)~(q)", "pts": 6, "type": "blank", "topics": ["couple"], "scope": "in", "prompt": "(n.        ) and (o.        ) are two key concepts used to measure design quality. (n) refers to the degree of interdependence between modules. (p.        ) (n) means modules are closely connected... (q.        ) (n) means modules are independent... (o) refers to the degree to which elements within a module work together for a single purpose.", "code": "", "answer": "(n) Coupling  (o) Cohesion  (p) High (tight)  (q) Low (loose)", "tip": "", "src": "L03"}, {"id": "2024-1rst", "year": 2024, "no": "1(r)(s)(t)", "pts": 4, "type": "blank", "topics": ["se"], "scope": "in", "prompt": "Fred Brooks stated that over 90% of (r.        ) of a typical system arise in (s.        ) phase, and that any successful piece of software will inevitably be (t.        ).", "code": "", "answer": "(r) the costs  (s) the maintenance  (t) maintained", "tip": "L02 원문 그대로.", "src": "L02"}, {"id": "2024-2", "year": 2024, "no": "2", "pts": 10, "type": "blank", "topics": ["encap"], "scope": "in", "prompt": "It is often desirable to avoid data members in the public area of class. List three advantageous properties: (i) (a.        ): accessing a data member will be done always through a method. (ii) precise (b.        ) over the (c.        ) of data members. (iii) functional (d.        ): you can later (e.        ) the data member with a computation.", "code": "", "answer": "(a) Consistency  (b) control  (c) accessibility  (d) abstraction  (e) replace", "tip": "L04 'Avoid data members in the public interface': Consistency / Precise control over the accessibility / Functional abstraction.", "src": "L04"}, {"id": "2024-3", "year": 2024, "no": "3", "pts": 10, "type": "short", "topics": ["encap"], "scope": "in", "prompt": "(a) What is the most serious problem if you make every member private in a class? Why? (<15 words)  (b) ... every member public? Why? (<15 words)", "code": "", "answer": "(a) No interface: clients cannot use the object at all, since nothing is accessible.\n(b) No encapsulation: clients can directly modify internal data, breaking safety and implementation independence.", "tip": "private only → 쓸모없는 클래스. public only → 캡슐화 장점 3개 다 잃음.", "src": "L04"}, {"id": "2024-4", "year": 2024, "no": "4", "pts": 12, "type": "code", "topics": ["fileio"], "scope": "in", "prompt": "Write a program that calculates the size of the file \"in.bin\" (a general binary file) and prints it. Fill in the blanks.", "code": "int main() {\n    streampos begin, end;\n    ________________________;\n    begin = ________________;\n    myfile.________________;\n    end = __________________;\n    myfile.close();\n    cout << \"size: \" << (end-begin) << \" bytes\\n\";\n    return 0;\n}", "answer": "ifstream myfile(\"in.bin\", ios::binary);\nbegin = myfile.tellg();\nmyfile.seekg(0, ios::end);\nend = myfile.tellg();", "tip": "cplusplus.com 'File Position Example' 그대로. tellg/seekg는 get 위치, tellp/seekp는 put 위치.", "src": "C++ in Summary 13"}, {"id": "2024-5", "year": 2024, "no": "5", "pts": 16, "type": "code", "topics": ["fileio"], "scope": "in", "prompt": "Write a C++ program that copies the binary file \"src.bin\" to \"des.bin\" without a file-copy function (read the entire data and write it).", "code": "", "answer": "#include <iostream>\n#include <fstream>\nusing namespace std;\nint main() {\n    ifstream in(\"src.bin\", ios::in | ios::binary | ios::ate);\n    if (!in.is_open()) return 1;\n    streampos size = in.tellg();          // ate: 끝에서 열었으니 tellg = 파일 크기\n    char* memblock = new char[size];\n    in.seekg(0, ios::beg);                // 처음으로 되감기\n    in.read(memblock, size);\n    in.close();\n\n    ofstream out(\"des.bin\", ios::out | ios::binary);\n    out.write(memblock, size);\n    out.close();\n    delete[] memblock;\n    return 0;\n}", "tip": "2025 8번과 동일.", "src": "C++ in Summary 13"}, {"id": "2024-6", "year": 2024, "no": "6", "pts": 22, "type": "trace", "topics": ["trace", "copy", "ctor"], "scope": "in", "prompt": "Two lines contain compile errors (lines 16-18 are correct). (a) Which two lines? (b) Correct them. (c) Screen output after correction?", "code": " 1: #include <iostream>\n 2: using namespace std;\n 3: class X {\n 4: public:\n 5:     int w,h;\n 6:     X() { w=0; h=0; cout << \"c1\\n\"; }\n 7:     X(int a,int b) { w=a; h=b; cout << \"c2\\n\"; }\n 8:     X(const X& x) { w=x.w; h=x.h; cout << \"c3\\n\"; }\n 9:     ~X() { cout << \"d\\n\"; }\n10: };\n11: void func(X obj, int a, int b) {\n12:     cout << \"f1 called!\\n\";\n13:     obj.w = a; obj.h = b;\n14: }\n15: int main() {\n16:     X a(5,6);\n17:     X* b;\n18:     b = &a;\n19:     a.w = 2;\n20:     func(a,7,8);\n21:     X c(a);\n22:     b.h = 9;\n23:     c.w = 1;\n24:     cout << \"==========\"<< endl;\n25:     cout << a.w <<\" \"<< a.h << endl;\n26:     cout << b.w <<\" \"<< b.h << endl;\n27:     cout << c.w <<\" \"<< c.h << endl;\n28:     return 0;\n29: }", "answer": "(a) line 22, line 26\n(b) line 22 → b->h = 9;\n    line 26 → cout << b->w << \" \" << b->h << endl;\n(c)\nc2\nc3\nf1 called!\nd\nc3\n==========\n2 9\n2 9\n1 6\nd\nd", "tip": "func 값 전달 → c3, 함수 끝날 때 obj 소멸 → d. b는 a를 가리켜서 b->h=9가 a.h를 바꿈. c는 그 전에 복사돼서 (2,6) 상태에서 c.w=1 → 1 6. main 끝에 c, a 순서로 소멸 → d d. g++로 확인.", "src": "L04"}, {"id": "2023-1ab", "year": 2023, "no": "1(a)(b)", "pts": 4, "type": "blank", "topics": ["se"], "scope": "in", "prompt": "(a.        ) is a term used in the early days of computing science for the difficulty of writing correct, useful and efficient programs in the required time. (a) was due to the rapid increases in computer power and the (b.        ) of the problems...", "code": "", "answer": "(a) Software crisis  (b) complexity", "tip": "", "src": "L02"}, {"id": "2023-1c", "year": 2023, "no": "1(c)", "pts": 2, "type": "blank", "topics": ["fileio"], "scope": "in", "prompt": "In C++, the file open mode ios::app means that all output operations are performed at the (c.        ) of the file.", "code": "", "answer": "(c) end", "tip": "ios::app = append: 모든 출력이 파일 끝에 덧붙음.", "src": "C++ in Summary 13"}, {"id": "2023-1de", "year": 2023, "no": "1(d)(e)", "pts": 4, "type": "blank", "topics": ["fileio"], "scope": "in", "prompt": "In C++, the file open mode (d.        ) means that if the file is opened for output operations and the file is already (e.        ), its previous content is deleted and replaced by the new one.", "code": "", "answer": "(d) ios::trunc  (e) existing (it already existed)", "tip": "", "src": "C++ in Summary 13"}, {"id": "2023-1f", "year": 2023, "no": "1(f)", "pts": 2, "type": "blank", "topics": ["se"], "scope": "in", "prompt": "(f.        ) is the process of changing, modifying, and updating software to keep up with customer needs. (f) is done after the product has launched...", "code": "", "answer": "(f) Software maintenance", "tip": "", "src": "L02, L03"}, {"id": "2023-1ghij", "year": 2023, "no": "1(g)~(j)", "pts": 8, "type": "blank", "topics": ["couple"], "scope": "in", "prompt": "Coupling is the degree to which each program module (g.        ) on each one of the other modules. (h.        ) is a measure of how strongly-related and focused the responsibilities of a module are. It is often desirable to (i.        ) coupling and (j.        ) (h).", "code": "", "answer": "(g) relies (depends)  (h) Cohesion  (i) minimize  (j) maximize", "tip": "", "src": "L03"}, {"id": "2023-1klm", "year": 2023, "no": "1(k)(l)(m)", "pts": 6, "type": "blank", "topics": ["encap"], "scope": "in", "prompt": "One of the main benefits of data encapsulation is (k.        ). (k) means (l.        ) in implementation should not affect (m.        ) seen by clients of a class.", "code": "", "answer": "(k) implementation independence  (l) a change  (m) the interface", "tip": "", "src": "Handout 2"}, {"id": "2023-1nop", "year": 2023, "no": "1(n)(o)(p)", "pts": 6, "type": "blank", "topics": ["constfn"], "scope": "likely", "prompt": "(n.        ) member function does not (o.        ) any data members of the object on which it is called. This restriction is enforced by (p.        ).", "code": "", "answer": "(n) const  (o) modify  (p) the compiler", "tip": "", "src": "L04"}, {"id": "2023-2", "year": 2023, "no": "2", "pts": 20, "type": "short", "topics": ["memory"], "scope": "in", "prompt": "Describe the main advantage and disadvantage of static memory allocation (int x[10];) and dynamic memory allocation (int* x = new int[10];) for using an array, and why. (advantage/disadvantage <10 words, why <15 words each)", "code": "", "answer": "Static\n advantage: simple and fast; memory is freed automatically.\n   why: size is fixed at compile time; allocated on the stack and released at scope exit.\n disadvantage: size cannot change at run time (waste or shortage).\n   why: array size must be decided at compile time.\nDynamic\n advantage: size can be decided at run time; memory used efficiently.\n   why: memory is allocated with new during execution as needed.\n disadvantage: programmer must free it; risk of memory leak, dangling pointers.\n   why: heap memory is not released automatically; needs delete[].", "tip": "토론 자료 'static vs dynamic memory allocation' 그대로 출제됨. dynamic = 'occurs at run-time'.", "src": "static vs dynamic 토론"}, {"id": "2023-3", "year": 2023, "no": "3", "pts": 20, "type": "code", "topics": ["trace"], "scope": "in", "prompt": "Fill in empty boxes so that output is: Area Calculation: obj:12, foo:12, bar:30, baz[0]:1", "code": " 3: class Rectangle {\n 4:     int width, height;\n 5:     [        ]\n 6:     Rectangle() { width=1; height=1; }\n 7:     Rectangle(int x, int y) [        ] {}\n 8:     int area() { return width*height; }\n 9: };\n10: int main() {\n11:     Rectangle obj(3,4);\n12:     Rectangle *foo, [        ];\n13:     foo = [        ];\n14:     bar = new Rectangle (5,6);\n15:     baz = new Rectangle[2];\n16:     cout << \"Area Calculation: \";\n17:     cout << \"obj:\" << obj[        ] << \", \";\n18:     cout << \"foo:\" << foo[        ] << \", \";\n19:     cout << \"bar:\" << bar[        ] << \", \";\n20:     cout << \"baz[0]:\" << baz[0][        ] << \"\\n\";\n21:     delete bar; delete[] baz; return 0;\n22: }", "answer": "line 5 : public:\nline 7 : Rectangle(int x, int y) : width(x), height(y) {}\nline 12: Rectangle *foo, *bar, *baz;\nline 13: foo = &obj;\nline 17: obj.area()\nline 18: foo->area()\nline 19: bar->area()\nline 20: baz[0].area()", "tip": "baz[0]은 기본생성자(1,1) → 1. 포인터는 ->, 배열 원소는 객체라서 '.'", "src": "C++ in Summary 12"}, {"id": "2023-4", "year": 2023, "no": "4", "pts": 8, "type": "code", "topics": ["fileio"], "scope": "in", "prompt": "Fill in the boxes to print the size of \"example.bin\": line 9 myfile.[  ]; line 10 end = [  ];", "code": " 7: ifstream myfile(\"example.bin\", ios::binary);\n 8: begin = myfile.tellg();\n 9: myfile.[        ];\n10: end = [        ];\n11: myfile.close();", "answer": "line 9 : myfile.seekg(0, ios::end);\nline 10: end = myfile.tellg();", "tip": "", "src": "C++ in Summary 13"}, {"id": "2023-5", "year": 2023, "no": "5", "pts": 20, "type": "trace", "topics": ["trace", "friend", "copy"], "scope": "likely", "prompt": "The code contains one compile error (lines 1-7 correct). (a) Which line? (b) Why wrong? (c) Insert one line at line 12 to fix. (d) Screen output after correction?", "code": " 4: class X {\n 5: private:\n 6:    int w,h;\n 7: public:\n 8:    X() { cout << \"c1 called\\n\"; }\n 9:    X(int a,int b) { w=a; h=b; cout << \"c3 called\\n\"; }\n10:    X(const X& x) { w=x.w; h=x.h; cout << \"c5 called\\n\"; }\n11:    ~X() { cout << \"d called\\n\"; }\n12:\n13: };\n15: int f1(X obj)\n16: {\n17:     cout << \"f1 called!\\n\";\n18:     return obj.w*obj.h;\n19: }\n20: int main()\n21: {\n22:     int z;\n23:     X a(5,6), b;\n24:     X c = a;\n25:     b = c;\n26:     z = f1(b);\n27:     cout << \"area: \" << z << \"\\n\";\n28:     return 0;\n29: }", "answer": "(a) line 18 (obj.w*obj.h)\n(b) ar": 2022, "no": "2", "pts": 8, "type": "blank", "topics": ["encap"], "scope": "in", "prompt": "Avoid data members in the public interface. Three advantageous properties: (i) (a.        ), (ii) precise control over the (b.        ) of data members, (iii) functional (c.        ): you can later replace the data member with (d.        ).", "code": "", "answer": "(a) consistency  (b) accessibility  (c) abstraction  (d) a computation", "tip": "", "src": "L04"}, {"id": "2022-3", "year": 2022, "no": "3", "pts": 8, "type": "short", "topics": ["encap"], "scope": "in", "prompt": "(a) Most serious problem if every member is private? Why?  (b) ... if every member is public? Why?", "code": "", "answer": "(a) The class has no interface, so clients cannot use any of its functionality.\n(b) No encapsulation: clients can directly access/modify internal data, so safety and implementation independence are lost.", "tip": "", "src": "L04"}, {"id": "2022-4", "year": 2022, "no": "4", "pts": 14, "type": "short", "topics": ["inline"], "scope": "likely", "prompt": "(1) What is an inline function? (2) In which situations can we get benefits of using it? List two. (3) Main benefit and why? (4) Possible disadvantage, and especially when?", "code": "", "answer": "(1) A function whose call is replaced by its body (code expanded at the call site) by the compiler.\n(2) ① the function body is small (e.g. getters/setters)  ② the function is called very frequently (e.g. in a loop).\n(3) Faster execution — because function-call overhead (passing arguments, jump, stack frame, return) is removed.\n(4) Code size increases (code bloat) — especially when the function is large or called in many places.", "tip": "강의 슬라이드는 'What is inline function? / Why useful?' 질문만 있음 → 수업 설명으로 채워야 하는 부분.", "src": "L04 inline"}, {"id": "2022-5", "year": 2022, "no": "5", "pts": 9, "type": "short", "topics": ["static"], "scope": "likely", "prompt": "class File { static int open_files; ... File(...) { ++open_files; } ~File() { --open_files; } }; (1) Meaning of static in line 2 and the difference it makes? (2) Why is static necessary for open_files? (3) What problem occurs without static?", "code": "", "answer": "(1) open_files becomes one variable per class, shared by all File objects (exists even with no object). Without static, each object has its own copy.\n(2) It must count all File objects — a property of the class, not of one object — so it must be shared.\n(3) Each object gets its own open_files, incremented only in its own copy (always 1), so the total number of File objects cannot be counted.", "tip": "", "src": "L04 static example"}, {"id": "2022-6", "year": 2022, "no": "6", "pts": 9, "type": "trace", "topics": ["friend", "trace"], "scope": "likely", "prompt": "Code computes the area of a rectangle but has a compile error. (a) Which line? (b) Why wrong? (c) Insert one line at line 3 to fix.", "code": " 1: #include <iostream>\n 2: class Rectangle {\n 3:\n 4: public:\n 5:   Rectangle(int w, int h) { width=w; height=h; }\n 6: private:\n 7:   int width;\n 8:   int height;\n 9: };\n10: int get_area(Rectangle c) {\n11:       return c.width * c.height;\n12: }\n13: int main() {\n14:       Rectangle rect(5,6);\n15:       std::cout << get_area(rect) << \"\\n\";\n16:       return 0;\n17: }", "answer": "(a) line 11 (c.width * c.height)\n(b) width and height are private members; get_area is a non-member function, so it cannot access them.\n(c) friend int get_area(Rectangle c);", "tip": "", "src": "L04 friend"}, {"id": "2022-7", "year": 2022, "no": "7", "pts": 16, "type": "code", "topics": ["stack", "copy"], "scope": "likely", "prompt": "Write (1) the constructor TIntStack(unsigned int stackSize), (2) a deep-copy copy constructor, (3) the destructor, (4) bool Push(int thisValue).", "code": "#include <iostream>\nconst unsigned int DEFAULT_SIZE = 256;\nclass TIntStack {\npublic :\n    TIntStack(unsigned int stackSize = DEFAULT_SIZE);\n    TIntStack(const TIntStack& that);\n    ~TIntStack();\n    bool Push(int thisValue); // return true if successful, false if stack is full\n    unsigned int getCount() const { return _count; }\nprivate :\n    int* _sp;             // memory is dynamically allocated during constructor call\n    unsigned int _count;  // number of elements in stack\n    unsigned int _size;   // size (capacity) of stack\n};", "answer": "// (1)\nTIntStack::TIntStack(unsigned int stackSize) {\n    _size = stackSize;\n    _count = 0;\n    _sp = new int[_size];\n}\n// (2) deep copy\nTIntStack::TIntStack(const TIntStack& that) {\n    _size = that._size;\n    _count = that._count;\n    _sp = new int[_size];\n    for (unsigned int i = 0; i < _count; i++)\n        _sp[i] = that._sp[i];\n}\n// (3)\nTIntStack::~TIntStack() {\n    delete[] _sp;\n}\n// (4)\nbool TIntStack::Push(int thisValue) {\n    if (_count >= _size) return false;\n    _sp[_count++] = thisValue;\n    return true;\n}", "tip": "깊은 복사의 핵심: 새 배열 new + 원소 복사. 포인터만 복사(_sp = that._sp)하면 얕은 복사 → 감점. g++로 확인.", "src": "L04 TIntStack"}, {"id": "2019-1abc", "year": 2019, "no": "1(a)(b)(c)", "pts": 6, "type": "blank", "topics": ["couple"], "scope": "in", "prompt": "(a.        ) is the degree to which each module relies on each one of the other modules. (b.        ) is a measure of how strongly-related the responsibilities of a module are. It is often desirable to minimize (a) because (c.        ).", "code": "", "answer": "(a) Coupling  (b) Cohesion  (c) a change in one module can affect other modules (making the system hard to maintain/reuse)", "tip": "", "src": "L03"}, {"id": "2019-1d", "year": 2019, "no": "1(d)", "pts": 2, "type": "blank", "topics": ["memory"], "scope": "in", "prompt": "Dynamic memory allocation means memory allocation occurs at (d.        ).", "code": "", "answer": "(d) run-time (execution time)", "tip": "C++ in Summary 11: 'dynamic' means '… occurs at run-time (execution-time)'", "src": "C++ in Summary 11"}, {"id": "2019-1ef", "year": 2019, "no": "1(e)(f)", "pts": 4, "type": " s cannot (    ). (2) readability: Clients of interface does not need to (    ). (3) implementation independence: A change in implementation should not (    ).", "code": "", "answer": "(1) directly access encapsulated data.\n(2) know how the interface functions use the encapsulated information.\n(3) affect the interface seen by the clients of a class.", "tip": "", "src": "Handout 2"}, {"id": "2019-3", "year": 2019, "no": "3", "pts": 8, "type": "short", "topics": ["se", "quality"], "scope": "in", "prompt": "(1) Definition of maintenance? (2) A program with high maintainability is easy to (read/understand), easy to (a.  ), easy to (b.  ), easy to (c.  ).", "code": "", "answer": "(1) Activities after delivery of the initial working version: correcting errors, adapting to changed requirements/hardware, and improving the software.\n(2) (a) modify  (b) extend  (c) reuse  (debug/test, port도 인정)", "tip": "Handout 1 maintainability 하위항목: readability, modifiability, extensibility, reusability, testability, modularity, portability.", "src": "L03 9, Handout 1"}, {"id": "2019-4", "year": 2019, "no": "4", "pts": 8, "type": "blank", "topics": ["ctor"], "scope": "in", "prompt": "Properties of a constructor: (2) automatically called when (    ). (3) should always have the same (    ) as the class. (4) does not have (    ) type. (5) If you do not make any constructor, the compiler would generate (    ).", "code": "", "answer": "(2) an object is created  (3) name  (4) return  (5) a default constructor", "tip": "", "src": "L04"}, {"id": "2019-5", "year": 2019, "no": "5", "pts": 29, "type": "code", "topics": ["opover"], "scope": "low", "prompt": "Write (1) operator- and (2) operator<< for class Complex.", "code": "class Complex {\nprivate:\n    double re, im;\npublic :\n    Complex( double r, double i ) : re(r), im(i) {}\n    friend Complex operator-(Complex&, Complex&);\n    friend ostream& operator<<(ostream &o, Complex &x);\n    // prints \"a+bi\": re=3.2,im=2.3 → 3.2+2.3i ; im=-2.3 → 3.2-2.3i ; im=0 → 3.2\n};", "answer": "Complex operator-(Complex& x, Complex& y) {\n    return Complex(x.re - y.re, x.im - y.im);\n}\nostream& operator<<(ostream &o, Complex& x) {\n    o << x.re;\n    if (x.im > 0)      o << \"+\" << x.im << \"i\";\n    else if (x.im < 0) o << x.im << \"i\";   // 음수는 '-'가 자동으로 붙음\n    return o;\n}", "tip": "friend라서 private re, im에 접근 가능. return o; 빠뜨리면 감점. g++ 확인.", "src": "Operator Overloading"}, {"id": "2019-6", "year": 2019, "no": "6", "pts": 12, "type": "code", "topics": ["trace"], "scope": "in", "prompt": "Fill in the boxes so that output is: obj:12, foo:12, bar:30, baz[0]:10", "code": "10: Rectangle obj(3,4);\n11: Rectangle *foo, *bar, *baz;\n12: foo = &obj;\n13: bar = new Rectangle (5,6);\n14: baz = new Rectangle[2] { {2,5}, {3,6} };\n15: cout << \"Area Calculation Output\\n\";\n16: cout << \"obj:\" << [        ] << \", \";\n17: cout << \"foo:\" << [        ] << \", \";\n18: cout << \"bar:\" << [        ] << \", \";\n19: cout << \"baz[0]:\" << [        ] << \"\\n\";", "answer": "line 16: obj.area()\nline 17: foo->area()\nline 18: bar->area()\nline 19: baz[0].area()", "tip": "", "src": "C++ in Summary 12"}, {"id": "2019-7", "year": 2019, "no": "7", "pts": 9, "type": "code", "topics": ["fileio"], "scope": "in", "prompt": "Fill in the boxes to print the size of example.bin: line 8 begin = [ ]; line 9 myfile.[ ](0,ios::end); line 10 end = [ ];", "code": "", "answer": "line 8 : begin = myfile.tellg();\nline 9 : myfile.seekg(0, ios::end);\nline 10: end = myfile.tellg();", "tip": "", "src": "C++ in Summary 13"}, {"id": "2017-1ab", "year": 2017, "no": "1(a)(b)", "pts": 4, "type": "blank", "topics": ["se"], "scope": "in", "prompt": "Fred Brooks stated that over 90% of (a.        ) of a typical system arise in (b.        ) phase.", "code": "", "answer": "(a) the costs  (b) the maintenance", "tip": "", "src": "L02"}, {"id": "2017-1c", "year": 2017, "no": "1(c)", "pts": 2, "type": "blank", "topics": ["quality"], "scope": "in", "prompt" ) Only a reference (an alias, implemented like an address) is passed; no copy of the object is made.", "tip": "", "src": "L04 Argument passing"}, {"id": "2017-4", "year": 2017, "no": "4", "pts": 12, "type": "trace", "topics": ["trace"], "scope": "in", "prompt": "The code has four wrong parts (lines 10, 11 correct). Mark each, explain why wrong, and correct it.", "code": " 3: class Rectangle {\n 4:     int width, height;\n 5: public :\n 6:     Rectangle(int x,int y) : width(x),height(y){}\n 7:     int area() { return width*height; }\n 8: };\n 9: int main() {\n10:     Rectangle a(3,4);\n11:     Rectangle *b, *c;\n12:     b = a;\n13:     c = new Rectangle (5,6);\n14:     cout << \"area:\" << a.area() << \"\\n\";\n15:     cout << \"area:\" << b.area() << \"\\n\";\n16:     cout << \"area:\" << c.area() << \"\\n\";\n17:     delete b;\n18:     delete c;\n19:     return 0;\n20: }", "answer": "line 12: b = a; → b = &a;   (b is a pointer; must store the address of a)\nline 15: b.area() → b->area()   (b is a pointer; use ->)\nline 16: c.area() → c->area()   (c is a pointer)\nline 17: delete b; → remove it   (b points to a stack object not created by new)", "tip": "2025 9번의 원형.", "src": "C++ in Summary 12"}, {"id": "2017-5", "year": 2017, "no": "5", "pts": 33, "type": "code", "topics": ["stack", "copy"], "scope": "likely", "prompt": "TIntStack (with void Push, int Pop, operator=). Write (1) copy constructor, (2) destructor, (3) void Push(int). (4) What problems occur if the copy constructor is not provided? What happens, and why is it a problem?", "code": "", "answer": "// (1)\nTIntStack::TIntStack(const TIntStack& that) {\n    _size = that._size;  _count = that._count;\n    _sp = new int[_size];\n    for (unsigned int i = 0; i < _count; i++) _sp[i] = that._sp[i];\n}\n// (2)\nTIntStack::~TIntStack() { delete[] _sp; }\n// (3)\nvoid TIntStack::Push(int thisValue) {\n    assert(_count < _size);      // 또는 if (_count >= _size) return;\n    _sp[_count++] = thisValue;\n}\n(4) what happens: the compiler's default copy constructor does a shallow copy — only the pointer _sp is copied, so both stacks share the same array.\nwhy a problem: changing one stack changes the other, and when both are destroyed delete[] is called twice on the same memory (double free / dangling pointer).", "tip": "", "src": "L04"}, {"id": "2017-6", "year": 2017, "no": "6", "pts": 12, "type": "short", "topics": ["copy"], "scope": "likely", "prompt": "(a) Copy constructor is automatically called when (    ). (b) Write an example for each of the three cases where a copy constructor is called.", "code": "", "answer": "(a) a new object is created from an existing object of the same type.\n(b) case 1: Person r(p);\n    case 2: Person p = q;   (initialization in declaration)\n    case 3: f(p);            (passing an object by value)", "tip": "주의: p = q; (이미 있는 객체에 대입)는 operator=라서 복사생성자 아님.", "src": "L04 Copy Constructor (1)"}, {"id": "2016-1ab", "year": 2016, "no": "1(a)(b)", "pts": 4, "type": "blank", "topics": ["couple"], "scope": "in", "prompt": "Coupling means the degree to which the ability to fulfill a certain responsibility (a.        ) the actions of another component. It is desirable to (b.        ) coupling.", "code": "", "answer": "(a) depends upon  (b) minimize", "tip": "L03 원문.", "src": "L03"}, {"id": "2016-1c", "year": 2016, "no": "1(c)", "pts": 2, "type": "blank", "topics": ["encap"], "scope": "in", "prompt": "(c.        ) is an instance of a class.", "code": "", "answer": "(c) An object", "tip": "", "src": "L02"}, {"id": "2016-1d", "year": 2016, "no": "1(d)", "pts": 2, "type": "blank", "topics": ["paradigm"], "scope": "in", "prompt": "Using global variables can be dangerous because it can make all modules (d.        ) on one another.", "code": "", "answer": "(d) dependent", "tip": "", "src": "L02"}, {"id": "2016-1ef", "year": 2016, "no": "1(e)(f)", "pts": 4, "type": "blank", "topics": ["se"], "scope": "in", "prompt": "Goals of software engineering are (i) (e.        ), (ii) (f.        )", "code": "", "answer": "(e) produce correct, efficient, and reliable software  (f) minimize the cost of software development and maintenance", "tip": "", "src": "L02"}, {"id": "2016-1ghi", "year": 2016, "no": "1(g)(h)(i)", "pts": 6, "type": "blank", "topics": ["encap"], "scope": "in", "prompt": "(g.        ) relies on the separation of interface and implementation. Interface describes (h.        ) an object does. Implementation describes (i.        ) an object does.", "code": "", "answer": "(g) Data abstraction  (h) what  (i) how", "tip": "", "src": "L04"}, {"id": "2016-2a", "year": 2016, "no": "2(1)~(3)", "pts": 13, "type": "short", "topics": ["se", "quality"], "scope": "in", "prompt": "(1) Definition of maintenance? (2) High maintainability = easy to (read/understand), (a), (b), (c). (3) Why is maintenance so important?", "code": "", "answer": "(1) Activities after delivery of the initial working version: fixing bugs, adapting to changed requirements/hardware, improving the software.\n(2) (a) modify  (b) extend  (c) reuse\n(3) Over 90% of the costs of a typical system arise in maintenance (Brooks), and any successful software will inevitably be changed.", "tip": "", "src": "L02, L03"}, {"id": "2016-2b", "year": 2016, "no": "2(4)~(6)", "pts": 13, "type": "short", "topics": ["encap"], "scope": "in", "prompt": "(4) What is data encapsulation? (5) Why does it make a program more understandable? (6) Why does it make a program safer?", "code": "", "answer": "(4) Implementation is encapsulated by the interface, and the only legal way to get to the implementation is through the interface (internal data is hidden).\n(5) Clients only need to know the interface (what it does), not how it is implemented.\n(6) Clients cannot directly access/modify the internal data, so they cannot accidentally corrupt it.", "tip": "", "src": "L04, Handout 2"}, {"id": "2016-3", "year": 2016, "no": "3", "pts": 10, "type": "short", "topics": ["design"], "scope": "in", "prompt": "For integration, components are slowly integrated into a completed system using stubs. (1) Meaning of 'slowly integrated'? (2) Meaning of 'stubs'?", "code": "", "answer": "(1) Components are added and tested one (a few) at a time, incrementally, so errors can be located easily.\n(2) Simple dummy routines with no or very limited behavior, used temporarily for yet-unimplemented parts.", "tip": "", "src": "L03 8"}, {"id": "2016-4", "year": 2016, "no": "4", "pts": 6, "type": "short", "topics": ["design"], "scope": "in", "prompt": "Names should be evocative in the context of a problem. What does 'evocative' mean?", "code": "", "answer": "The name should call to mind (suggest) the meaning/role of the thing in the problem domain.", "tip": "L03 'The selection of names' 첫 항목.", "src": "L03"}, {"id": "2016-5code", "year": 2016, "no": "5(1)~(3)", "pts": 30, "type": "code", "topics": ["opover", "copy"], "scope": "low", "prompt": "inf_int: write (1) operator>, (2) copy constructor, (3) constructor inf_int(int n). Don't call other member functions.", "code": "class inf_int {\nprivate:\n    char* digits;         // string of digits, dynamically allocated\n    unsigned int length;  // number of actual digits\n    bool thesign;         // false if negative, true otherwise\n    // digits stored in reverse order\n    // ex) 15311111111111111 : digits -> \"11111111111111351\", length=17, thesign=true\npublic:\n    inf_int(int n);\n    inf_int(const inf_int& x);\n    friend bool operator>(const inf_int&, const inf_int&);\n};", "answer": "bool operator>(const inf_int& x, const inf_int& y) {\n    if (x.thesign != y.thesign) return x.thesign;     // 양수 > 음수\n    bool absGreater;\n    if (x.length != y.length) absGreater = x.length > y.length;\n    else {\n        int i = x.length - 1;                          // 최상위 자리부터 비교\n        while (i >= 0 && x.digits[i] == y.digits[i]) i--;\n        if (i < 0) return false;                       // 같음\n        absGreater = x.digits[i] > y.digits[i];\n    }\n    return x.thesign ? absGreater : !absGreater;       // 음수면 절댓값 큰 쪽이 작음\n}\ninf_int::inf_int(const inf_int& x) {\n    length = x.length;\n    thesign = x.thesign;\n    digits = new char[length + 1];   // deep copy\n    strcpy(digits, x.digits);\n}\ninf_int::inf_int(int n) {\n    char buf[100]; int i = 0;\n    long long m = n;               // INT_MIN 대비\n    thesign = (m >= 0);\n    if (m < 0) m = -m;\n    do { buf[i++] = '0' + m % 10; m /= 10; } while (m > 0);   // 역순 저장\n    buf[i] = '\\0';\n    length = i;\n    digits = new char[length + 1];\n    strcpy(digits, buf);\n}", "tip": "Project 2 범위(마감 11/1)라 올해 중간엔 가능성 낮음. g++ 확인.", "src": "Project 2"}, {"id": "2016-5why", "year": 2016, "no": "5(4)(5)", "pts": 10, "type": "short", "topics": ["copy"], "scope": "likely", "prompt": "(4) Why do we generally need to write a copy constructor in class inf_int? (5) What happens if we don't?", "code": "", "answer": "(4) inf_int holds a pointer to dynamically allocated memory (digits), so a deep copy is needed.\n(5) The default copy constructor does a shallow copy: both objects share the same digits array, so changing one changes the other, and the destructors delete[] the same memory twice (crash / dangling pointer).", "tip": "", "src": "L04"}, {"id": "2015-1a", "year": 2015, "no": "1(a)", "pts": 2, "type": "blank", "topics": ["ctor"], "scope": "in", "prompt": "In C++, if we do not (a.        ) in a class, the compiler would generate a default constructor.", "code": "", "answer": "(a) declare any constructor", "tip": "", "src": "L04"}, {"id": "2015-1bc", "year": 2015, "no": "1(b)(c)", "pts": 4, "type": "blank", "topics": ["se"], "scope": "in", "prompt": "Software engineering: ...sound engineering principles in order to (b.        ) obtain software... One of the main goals is to minimize (c.        ) of software development and maintenance.", "code": "", "answer": "(b) economically  (c) the cost", "tip": "", "src": "L02"}, {"id": "2015-1de", "year": 2015, "no": "1(d)(e)", "pts": 4, "type": "blank", "topics": ["encap"], "scope": "in", "prompt": "In the concept of information hiding, (d.        ) of an object can be modified only through (e.        ).", "code": "", "answer": "(d) internal data  (e) an interface", "tip": "2025 1(l)(m)과 동일.", "src": "L02"}, {"id": "2015-1f", "year": 2015, "no": "1(f)", "pts": 2, "type": "blank", "topics": ["design"], "scope": "in", "prompt": "Good SW design recognizes the inevitability of (f.        ) and plans an accommodation for them from the very beginning.", "code": "", "answer": "(f) changes", "tip": "L03 9. Maintenance and Evolution", "src": "L03"}, {"id": "2015-1g", "year": 2015, "no": "1(g)", "pts": 2, "type": "blank", "topics": ["couple"], "scope": "in", "prompt": "Coupling is the degree to which the ability to fulfill a certain responsibility (g.        ) upon the actions of another component.", "code": "", "answer": "(g) depends", "tip": "", "src": "L03"}, {"id": "2015-1h", "year": 2015, "no": "1(h)", "pts": 2, "type": "blank", "topics": ["friend"], "scope": "likely", "prompt": "friend function of a class has the right to access (h.        ) of the class while a typical function does not.", "code": "", "answer": "(h) the non-public (private) members", "tip": "", "src": "L04 friend"}, {"id": "2015-1i", "year": 2015, "no": "1(i)", "pts": 2, "type": "blank", "topics": ["copy"], "scope": "likely", "prompt": "(i.        ) is called when a new object is created and copied from an existing object with the same type.", "code": "", "answer": "(i) Copy constructor", "tip": "", "src": "L04"}, {"id": "2015-2", "year": 2015, "no": "2", "pts": 18, "type": "short", "topics": ["encap"], "scope": "in", "prompt": "List three main benefits of data encapsulation and explain each.", "code": "", "answer": "(i) Protection of implementation (safety): clients cannot directly access encapsulated data.\n(ii) Readability (understandability): clients need not know how interface functions use encapsulated information.\n(iii) Implementation independence: a change in implementation should not affect the interface seen by clients.", "tip": "", "src": "Handout 2"}, {"id": "2015-3", "year": 2015, "no": "3", "pts": 12, "type": "short", "topics": ["assert"], "scope": "in", "prompt": "For assert(e): (1) If e is true, (    ). (2) If e is false, (    ). (3) Goal of using assert(e)?", "code": "", "answer": "(1) the program just continues.\n(2) the program is stopped with an error message indicating the failure of the assertion.\n(3) To check that conditions (class invariants) always hold, making programs more reliable.", "tip": "L04 원문.", "src": "L04"}, {"id": "2015-4", "year": 2015, "no": "4", "pts": 12, "type": "short", "topics": ["static"], "scope": "likely", "prompt": "class File { static int open_files; int var; ... }. (1) Meaning of static in line 2? (2) Lifetime of open_files: creation/deletion time? (3) Lifetime of var?", "code": "", "answer": "(1) open_files is one variable per class, shared by all File objects.\n(2) Created when the program starts (before main, independent of objects); deleted when the program ends.\n(3) Created when a File object is created; deleted when that object is destroyed.", "tip": "", "src": "L04"}, {"id": "2015-5", "year": 2015, "no": "5", "pts": 40, "type": "code", "topics": ["opover", "copy"], "scope": "low", "prompt": "inf_int: write (1) operator==, (2) copy constructor, (3) constructor inf_int(int n).", "code": "", "answer": "bool operator==(const inf_int& x, const inf_int& y) {\n    return x.thesign == y.thesign && x.length == y.length\n        && strcmp(x.digits, y.digits) == 0;\n}\ninf_int::inf_int(const inf_int& x) {\n    length = x.length;\n    thesign = x.thesign;\n    digits = new char[length + 1];   // deep copy\n    strcpy(digits, x.digits);\n}\ninf_int::inf_int(int n) {\n    char buf[100]; int i = 0;\n    long long m = n;               // INT_MIN 대비\n    thesign = (m >= 0);\n    if (m < 0) m = -m;\n    do { buf[i++] = '0' + m % 10; m /= 10; } while (m > 0);   // 역순 저장\n    buf[i] = '\\0';\n    length = i;\n    digits = new char[length + 1];\n    strcpy(digits, buf);\n}", "tip": "", "src": "Project 2"}, {"id": "2014-1a", "year": 2014, "no": "1(a)", "pts": 2, "type": "blank", "topics": ["se"], "scope": "in", "prompt": "Fred Brooks states that over 90% of the costs of a typical system arise in the (a.        ) phase.", "code": "", "answer": "(a) maintenance", "tip": "", "src": "L02"}, {"id": "2014-1b", "year": 2014, "no": "1(b)", "pts": 2, "type": "blank", "topics": ["ctor"], "scope": "in", "prompt": "If we did not declare any constructor in class, the compiler would generate (b.        ).", "code": "", "answer": "(b) a default constructor", "tip": "", "src": "L04"}, {"id": "2014-1c", "year": 2014, "no": "1(c)", "pts": 2, "type": "blank", "topics": ["design"], "scope": "in", "prompt": "(c.        ) is a simple dummy routine with no behavior or very limited behavior, used when components are slowly integrated into completed system.", "code": "", "answer": "(c) Stub", "tip": "", "src": "L03"}, {"id": "2014-1d", "year": 2014, "no": "1(d)", "pts": 2, "type": "blank", "topics": ["constfn"], "scope": "likely", "prompt": "const member function does not (d.        ) any data members of the object on which it is called.", "code": "", "answer": "(d) modify", "tip": "", "src": "L04"}, {"id": "2014-1ef", "year": 2014, "no": "1(e)(f)", "pts": 4, "type": "blank", "topics": ["encap"], "scope": "in", "prompt": "One of the main benefits of data encapsulation is (e.        ) which means a change in (f.        ) should not affect interface seen by clients.", "code": "", "answer": "(e) implementation independence  (f) implementation", "tip": "", "src": "Handout 2"}, {"id": "2014-1g", "year": 2014, "no": "1(g)", "pts": 2, "type": "blank", "topics": ["couple"], "scope": "in", "prompt": "(g.        ) is the degree to which the tasks assigned to a component seem to form a meaningful unit.", "code": "", "answer": "(g) Cohesion", "tip": "", "src": "L03"}, {"id": "2014-1h", "year": 2014, "no": "1(h)", "pts": 2, "type": "blank", "topics": ["couple"], "scope": "in", "prompt": "Coupling is the degree to which the ability to fulfill a certain responsibility (h.        ) upon the actions of another component.", "code": "", "answer": "(h) depends", "tip": "", "src": "L03"}, {"id": "2014-1i", "year": 2014, "no": "1(i)", "pts": 2, "type": "blank", "topics": ["friend"], "scope": "likely", "prompt": "friend function of a class has the right to access (i.        ) members of the class.", "code": "", "answer": "(i) non-public (private)", "tip": "", "src": "L04"}, {"id": "2014-1j", "year": 2014, "no": "1(j)", "pts": 2, "type": "blank", "topics": ["se"], "scope": "in", "prompt": "One of the main goals of software engineering is to minimize (j.        ) of software development and maintenance.", "code": "", "answer": "(j) the cost", "tip": "", "src": "L02"}, {"id": "2014-2", "year": 2014, "no": "2", "pts": 18, "type": "short", "topics": ["inline"], "scope": "likely", "prompt": "(1) What is inline function? (2) In what situations can we benefit? List two. (3) What benefit and why?", "code": "", "answer": "(1) A function whose body the compiler inserts at each call site instead of performing a normal function call.\n(2) ① small functions (a few lines, e.g. getters)  ② functions called very frequently (e.g. inside loops)\n(3) Faster execution, because function-call overhead (argument passing, jump, stack frame, return) is eliminated.", "tip": "", "src": "L04"}, {"id": "2014-3", "year": 2014, "no": "3", "pts": 12, "type": "short", "topics": ["copy"], "scope": "likely", "prompt": "(1) What is shallow copy? (2) You don't need to write a copy constructor if shallow copies are OK. Why?", "code": "", "answer": "(1) Copying data members value by value (memberwise); for pointer members only the address is copied, so both objects point to the same memory.\n(2) The compiler automatically generates a default copy constructor that performs a shallow copy.", "tip": "L04: Compiler automatically generates default copy construct, default operator assignment and default destructor if we don't provide them.", "src": "L04"}, {"id": "2014-4", "year": 2014, "no": "4", "pts": 18, "type": "code", "topics": ["stack", "copy"], "scope": "likely", "prompt": "TIntStack: write the copy constructor TIntStack::TIntStack(const TIntStack& that).", "code": "#include <iostream>\nconst unsigned int DEFAULT_SIZE = 256;\nclass TIntStack {\npublic :\n    TIntStack(unsigned int stackSize = DEFAULT_SIZE);\n    TIntStack(const TIntStack& that);\n    ~TIntStack();\n    bool Push(int thisValue); // return true if successful, false if stack is full\n    unsigned int getCount() const { return _count; }\nprivate :\n    int* _sp;             // memory is dynamically allocated during constructor call\n    unsigned int _count;  // number of elements in stack\n    unsigned int _size;   // size (capacity) of stack\n};", "answer": "TIntStack::TIntStack(const TIntStack& that) {\n    _size = that._size;\n    _count = that._count;\n    _sp = new int[_size];\n    for (unsigned int i = 0; i < _count; i++)\n        _sp[i] = that._sp[i];\n}", "tip": "", "src": "L04"}, {"id": "2014-5", "year": 2014, "no": "5", "pts": 32, "type": "code", "topics": ["opover"], "scope": "low", "prompt": "Complex: write (1) friend Complex operator+(Complex&, Complex&) and (2) ostream& operator<<(ostream&, const Complex&) printing a+bi format.", "code": "", "answer": "Complex operator+(Complex& x, Complex& y) {\n    return Complex(x.re + y.re, x.im + y.im);\n}\nostream& operator<<(ostream &o, const Complex& x) {\n    o << x.re;\n    if (x.im > 0)      o << \"+\" << x.im << \"i\";\n    else if (x.im < 0) o << x.im << \"i\";   // 음수는 '-'가 자동으로 붙음\n    return o;\n}", "tip": "", "src": "Operator Overloading"}, {"id": "2013-1ab", "year": 2013, "no": "1(a)(b)", "pts": 4, "type": "blank", "topics": ["encap"], "scope": "in", "prompt": "One of the main benefits of data encapsulation is (a.        ) which means a change in implementation should not affect (b.        ) seen by clients of a class.", "code": "", "answer": "(a) implementation independence  (b) the interface", "tip": "", "src": "Handout 2"}, {"id": "2013-1c", "year": 2013, "no": "1(c)", "pts": 4, "type": "blank", "topics": ["design"], "scope": "in", "prompt": "(c.        ) is a simple dummy routine with no or very limited behavior, a temporary substitute for yet-to-be-developed code.", "code": "", "answer": "(c) Stub", "tip": "", "src": "L03"}, {"id": "2013-1d", "year": 2013, "no": "1(d)", "pts": 4, "type": "blank", "topics": ["se"], "scope": "in", "prompt": "(d.        ) is the modification of a software product after delivery to correct faults, to improve performance or other attributes.", "code": "", "answer": "(d) Maintenance", "tip": "", "src": "L03"}, {"id": "2013-1e", "year": 2013, "no": "1(e)", "pts": 4, "type": "blank", "topics": ["copy"], "scope": "likely", "prompt": "Don't write a copy constructor if (e.        ) are OK.", "code": "", "answer": "(e) shallow copies", "tip": "", "src": "L04"}, {"id": "2013-1f", "year": 2013, "no": "1(f)", "pts": 4, "type": "blank", "topics": ["copy"], "scope": "likely", "prompt": "If you need copy constructor, you also need (f.        ) and operator= function.", "code": "", "answer": "(f) a destructor", "tip": "", "src": "L04"}, {"id": "2013-2", "year": 2013, "no": "2", "pts": 14, "type": "short", "topics": ["passing"], "scope": "likely", "prompt": "Possible advantage and disadvantage of call-by-value (pass-by-value).", "code": "", "answer": "(1) advantage: safer — the function works on a copy, so the caller's original argument cannot be modified.\n(2) disadvantage: copying overhead — for large objects, copying (copy constructor/destructor calls, memory) costs time and space.", "tip": "L04: pass-by-value is safer / Avoid passing large objects by value.", "src": "L04"}, {"id": "2013-3", "year": 2013, "no": "3", "pts": 14, "type": "short", "topics": ["couple"], "scope": "in", "prompt": "(1) What is coupling? (2) Why is it desirable to minimize coupling?", "code": "", "answer": "(1) The degree to which the ability to fulfill a responsibility depends upon the actions of another component.\n(2) With low coupling, components are independent: a change in one component has little effect on others, so the system is easier to understand, modify, test and reuse.", "tip": "", "src": "L03"}, {"id": "2013-4", "year": 2013, "no": "4", "pts": 14, "type": "short", "topics": ["static"], "scope": "likely", "prompt": "(1) Meaning of static member variable open_files? (2) Meaning of static member function existing()?", "code": "", "answer": "(1) One variable per class shared by all File objects; it exists even if no object has been created.\n(2) A function of the class, callable without any object (File::existing()); it cannot access non-static members.", "tip": "", "src": "L04"}, {"id": "2013-5", "year": 2013, "no": "5", "pts": 34, "type": "code", "topics": ["opover", "copy"], "scope": "low", "prompt": "inf_int: write (1) operator==, (2) constructor inf_int(const char* str) (e.g. \"-12345\").", "code": "", "answer": "bool operator==(const inf_int& x, const inf_int& y) {\n    return x.thesign == y.thesign && x.length == y.length\n        && strcmp(x.digits, y.digits) == 0;\n}\ninf_int::inf_int(const char* str) {\n    thesign = true;\n    if (str[0] == '-') { thesign = false; str++; }\n    length = strlen(str);\n    digits = new char[length + 1];\n    for (unsigned int i = 0; i < length; i++)\n        digits[i] = str[length - 1 - i];   // 역순 저장\n    digits[length] = '\\0';\n}", "tip": "", "src": "Project 2"}, {"id": "2012-1abc", "year": 2012, "no": "1(a)(b)(c)", "pts": 12, "type": "blank", "topics": ["encap", "se"], "scope": "in", "prompt": "Implementation independence means (a.        ) in implementation should not affect (b.        ) seen by clients. Software engineering: ...in order to (c.        ) obtain software that is reliable...", "code": "", "answer": "(a) a change  (b) the interface  (c) economically", "tip": "", "src": "Handout 2, L02"}, {"id": "2012-1d", "year": 2012, "no": "1(d)", "pts": 4, "type": "blank", "topics": ["inherit"], "scope": "out", "prompt": "Abstract class is a class that contains at least one (d.        ).", "code": "", "answer": "(d) pure virtual function", "tip": "상속 파트 — 올해 중간 범위 밖일 가능성 큼.", "src": ""}, {"id": "2012-2a", "year": 2012, "no": "2(1)", "pts": 6, "type": "short", "topics": ["passing"], "scope": "likely", "prompt": "It is often desirable to avoid passing large objects by value. Why?", "code": "", "answer": "The whole object is copied (copy constructor, memory allocation, destructor), which wastes time and memory.", "tip": "", "src": "L04"}, {"id": "2012-2b", "year": 2012, "no": "2(2)", "pts": 6, "type": "short", "topics": ["quality"], "scope": "in", "prompt": "What is dependability?", "code": "", "answer": "The ability to rely on the software to function properly when needed.", "tip": "", "src": "L02"}, {"id": "2012-3a", "year": 2012, "no": "3(1)", "pts": 5, "type": "short", "topics": ["encap"], "scope": "in", "prompt": "Main difference between 'class' and 'object' in C++.", "code": "", "answer": "A class is a type (blueprint) defining attributes and behaviors; an object is an instance of a class created in memory with its own state.", "tip": "", "src": "L02"}, {"id": "2012-3b", "year": 2012, "no": "3(2)(3)", "pts": 10, "type": "short", "topics": ["constfn"], "scope": "likely", "prompt": "(2) Difference between const member function and a general member function? (3) Main benefits of const member function?", "code": "", "answer": "(2) A const member function cannot modify any data members of the object (read-only), enforced by the compiler; a general member function can.\n(3) It assures clients of its benign nature: safety (no accidental modification) and readability.", "tip": "", "src": "L04"}, {"id": "2012-4", "year": 2012, "no": "4", "pts": 12, "type": "short", "topics": ["copy"], "scope": "likely", "prompt": "(1) If you need to write a copy constructor, you also need a destructor. Why? (2) If shallow copies are OK, you don't need a copy constructor. Why?", "code": "", "answer": "(1) A copy constructor is needed when the class owns dynamically allocated memory; that memory must be released by a destructor (otherwise a memory leak).\n(2) The compiler-generated default copy constructor already does a shallow (memberwise) copy.", "tip": "", "src": "L04"}, {"id": "2012-5", "year": 2012, "no": "5", "pts": 15, "type": "short", "topics": ["assert"], "scope": "in", "prompt": "assert(x): (1) What should be put into x? (2) What does it do? (3) Why useful?", "code": "", "answer": "(1) A condition (boolean expression) that must always be true at that point, e.g. a class invariant.\n(2) If x is true, continue; if false, stop the program with an error message showing the failed assertion.\n(3) It detects bugs early and makes programs more reliable.", "tip": "", "src": "L04"}, {"id": "2012-6", "year": 2012, "no": "6", "pts": 30, "type": "code", "topics": ["opover", "copy"], "scope": "low", "prompt": "inf_int: write (1) default constructor (value 0), (2) copy constructor, (3) inf_int(int n).", "code": "", "answer": "inf_int::inf_int() {\n    digits = new char[2];\n    digits[0] = '0'; digits[1] = '\\0';\n    length = 1; thesign = true;\n}\ninf_int::inf_int(const inf_int& x) {\n    length = x.length;\n    thesign = x.thesign;\n    digits = new char[length + 1];   // deep copy\n    strcpy(digits, x.digits);\n}\ninf_int::inf_int(int n) {\n    char buf[100]; int i = 0;\n    long long m = n;               // INT_MIN 대비\n    thesign = (m >= 0);\n    if (m < 0) m = -m;\n    do { buf[i++] = '0' + m % 10; m /= 10; } while (m > 0);   // 역순 저장\n    buf[i] = '\\0';\n    length = i;\n    digits = new char[length + 1];\n    strcpy(digits, buf);\n}", "tip": "", "src": "Project 2"}, {"id": "2011-1ac", "year": 2011, "no": "1(a)(c)", "pts": 6, "type": "blank", "topics": ["se"], "scope": "in", "prompt": "Software crisis... rapid increases in computer power and the (a.        ) of the problems. / Fred Brooks: over 90% of costs arise in the (c.        ) phase.", "code": "", "answer": "(a) complexity  (c) maintenance", "tip": "", "src": "L02"}, {"id": "2011-1bd", "year": 2011, "no": "1(b)(d)", "pts": 6, "type": "blank", "topics": ["inherit"], "scope": "out", "prompt": "(b.        ) is a function whose behavior can be overridden within an inheriting class. / Dynamic binding means that binding occurs at (d.        ).", "code": "", "answer": "(b) virtual function  (d) run time", "tip": "범위 밖일 가능성 큼.", "src": ""}, {"id": "2011-2", "year": 2011, "no": "2", "pts": 12, "type": "short", "topics": ["quality"], "scope": "in", "prompt": "(1) What is portability? (2) What is dependability?", "code": "", "answer": "(1) The ability to run (reuse) the software on a different platform (HW, OS) with little or no modification.\n(2) The ability to rely on the software to function properly when needed.", "tip": "", "src": "Handout 1, L02"}, {"id": "2011-3", "year": 2011, "no": "3", "pts": 14, "type": "short", "topics": ["encap"], "scope": "in", "prompt": "(1) What is data encapsulation? (2) Two important benefits and why.", "code": "", "answer": "(1) Hiding the implementation behind the interface: the only legal way to access the implementation (internal data) is through the interface.\n(2) ① Safety: clients cannot directly access/corrupt internal data.  ② Implementation independence: the implementation can change without affecting clients that use the interface.", "tip": "", "src": "L04, Handout 2"}, {"id": "2011-4", "year": 2011, "no": "4", "pts": 12, "type": "short", "topics": ["inherit"], "scope": "out", "prompt": "(1) Meaning of 'protected'? (2) Why use protected only where really necessary?", "code": "", "answer": "(1) Members accessible within the class and its derived classes, but not by other clients.\n(2) It weakens encapsulation: derived classes depend on the implementation, so changes break them.", "tip": "상속 파트.", "src": ""}, {"id": "2011-5", "year": 2011, "no": "5", "pts": 15, "type": "short", "topics": ["inline"], "scope": "likely", "prompt": "(1) What is inline function? (2) Two situations where it helps. (3) What benefit and why?", "code": "", "answer": "(1) A function whose body is expanded at the call site by the compiler instead of a normal call.\n(2) ① small function body  ② frequently called (e.g. in loops)\n(3) Faster execution — function-call overhead is removed.", "tip": "", "src": "L04"}, {"id": "2011-6code", "year": 2011, "no": "6(1)(2)", "pts": 20, "type": "code", "topics": ["opover"], "scope": "low", "prompt": "Complex: write (1) member Complex Complex::operator+(const Complex& x), (2) friend operator<<.", "code": "", "answer": "Complex Complex::operator+(const Complex& x) {\n    return Complex(re + x.re, im + x.im);\n}\nostream& operator<<(ostream &o, const Complex& x) {\n    o << x.re;\n    if (x.im > 0)      o << \"+\" << x.im << \"i\";\n    else if (x.im < 0) o << x.im << \"i\";   // 음수는 '-'가 자동으로 붙음\n    return o;\n}", "tip": "", "src": "Operator Overloading"}, {"id": "2011-6theory", "year": 2011, "no": "6(3)(4)(5)", "pts": 15, "type": "short", "topics": ["friend", "copy", "passing"], "scope": "likely", "prompt": "(3) Why should operator<< be a friend of Complex? (4) Do we need a copy constructor for Complex? Why? (5) Benefits of parameter type const Complex& (two).", "code": "", "answer": "(3) Its left operand is an ostream, so it cannot be a member of Complex, yet it must access the private re and im.\n(4) No. Complex has no pointer/dynamic memory, so the default shallow copy is enough.\n(5) ① No copy of the object is made (efficient).  ② The argument cannot be modified (safe); temporaries/const objects can be passed.", "tip": "", "src": "L04"}, {"id": "2010-1ab", "year": 2010, "no": "1(a)(b)", "pts": 4, "type": "blank", "topics": ["se"], "scope": "in", "prompt": "(a.        ) is defined as modification of a software product after delivery... (a) is considered to be the most (b.        ) part of the software life cycle.", "code": "", "answer": "(a) Maintenance  (b) expensive (costly)", "tip": "", "src": "L02"}, {"id": "2010-1c", "year": 2010, "no": "1(c)", "pts": 2, "type": "blank", "topics": ["quality"], "scope": "in", "prompt": "(c.        ) is the software feature to be able to reuse existing code when moving software from one environment (platform) to another.", "code": "", "answer": "(c) Portability", "tip": "", "src": "Handout 1"}, {"id": "2010-1d", "year": 2010, "no": "1(d)", "pts": 2, "type": "blank", "topics": ["paradigm"], "scope": "in", "prompt": "(d.        ) involves splitting complex program tasks into smaller pieces with clear flow-control and interfaces between components.", "code": "", "answer": "(d) Structured (modular) programming", "tip": "", "src": "L02"}, {"id": "2010-1ef", "year": 2010, "no": "1(e)(f)", "pts": 4, "type": "blank", "topics": ["encap"], "scope": "in", "prompt": "The advantage of using data encapsulation comes when (e.        ) of the class changes but (f.        ) remains the same.", "code": "", "answer": "(e) the implementation  (f) the interface", "tip": "", "src": "Handout 2"}, {"id": "2010-1gh", "year": 2010, "no": "1(g)(h)", "pts": 4, "type": "blank", "topics": ["assert"], "scope": "in", "prompt": "(g.        ) contains a boolean expression that you believe will be true... writing (g) while programming is one of the quickest and most effective ways to detect (h.        ).", "code": "", "answer": "(g) An assertion  (h) bugs", "tip": "2022 1(l)(m)과 동일.", "src": "L04"}, {"id": "2010-1i", "year": 2010, "no": "1(i)", "pts": 2, "type": "blank", "topics": ["design"], "scope": "in", "prompt": "A good software design recognizes the inevitability of (i.        ) and plans an accommodation for them from the very beginning.", "code": "", "answer": "(i) changes", "tip": "", "src": "L03"}, {"id": "2010-1jkl", "year": 2010, "no": "1(j)(k)(l)", "pts": 8, "type": "short", "topics": ["copy"], "scope": "likely", "prompt": "If you need to write a copy constructor, you also need to write (j.        ) and (k.        ). Why? (l)", "code": "", "answer": "(j) a destructor  (k) operator= (assignment operator)\n(l) A copy constructor is needed when the class owns dynamically allocated memory (deep copy). The destructor must free that memory, and operator= must also deep-copy, since the default one does a shallow copy (sharing memory, double delete, leak).", "tip": "", "src": "L04"}, {"id": "2010-2", "year": 2010, "no": "2", "pts": 10, "type": "short", "topics": ["paradigm"], "scope": "in", "prompt": "(1) Why is overusing global variables not desirable? (2) Main advantage of OOP compared to structured programming?", "code": "", "answer": "(1) Any module can change a global variable, so all modules become dependent on one another: side effects are hard to track, and code is hard to debug, modify and reuse.\n(2) OOP combines data and operations into objects (encapsulation), so large software is easier to maintain, extend and reuse.", "tip": "", "src": "L02"}, {"id": "2010-4a", "year": 2010, "no": "4(1)(2)", "pts": 4, "type": "short", "topics": ["couple"], "scope": "in", "prompt": "Explain (1) Cohesion (2) Coupling.", "code": "", "answer": "(1) The degree to which the tasks assigned to a component form a meaningful unit (maximize).\n(2) The degree to which a component's ability to fulfill a responsibility depends on other components (minimize).", "tip": "", "src": "L03"}, {"id": "2010-4b", "year": 2010, "no": "4(3)(4)", "pts": 4, "type": "short", "topics": ["copy"], "scope": "likely", "prompt": "Explain (3) shallow copy (4) deep copy.", "code": "", "answer": "(3) Copying member values only; pointers are copied so both objects share the same memory.\n(4) Allocating new memory and copying the pointed-to data, so each object has its own copy.", "tip": "", "src": "L04"}, {"id": "2010-5", "year": 2010, "no": "5", "pts": 10, "type": "short", "topics": ["passing"], "scope": "likely", "prompt": "(1) Why is it inefficient to pass large objects by value? (2) One beneficial effect of pass-by-value and why.", "code": "", "answer": "(1) The whole object is copied (copy constructor, memory, destructor) on every call.\n(2) Safety: the function works on a copy, so the caller's original data cannot be modified accidentally.", "tip": "", "src": "L04"}, {"id": "2010-6", "year": 2010, "no": "6", "pts": 28, "type": "code", "topics": ["opover", "copy"], "scope": "low", "prompt": "inf_int: (1) copy constructor, (2) friend bool operator<, (3) maximum number it can represent and justification.", "code": "", "answer": "// (1) 2016 해설의 copy constructor와 동일 (digit 이름만 다름)\n// (2)\nbool operator<(const inf_int& l, const inf_int& r) {\n    return r > l;   // 시험에선 operator> 로직을 직접 써야 함 (다른 멤버 호출 금지)\n}\n(3) length is unsigned int, so up to 2^32 − 1 (4294967295) digits: max ≈ 10^4294967295 − 1 (all digits 9). In practice limited by available memory.", "tip": "", "src": "Project 2"}, {"id": "2010-7", "year": 2010, "no": "7", "pts": 7, "type": "short", "topics": ["friend"], "scope": "likely", "prompt": "Why should the use of friend function/class be minimized?", "code": "", "answer": "Friends can access private members, which breaks encapsulation and increases coupling: a change in the implementation can break friend code.", "tip": "", "src": "L04"}, {"id": "2010-8", "year": 2010, "no": "8", "pts": 9, "type": "short", "topics": ["quality"], "scope": "in", "prompt": "List at least six properties of good software.", "code": "", "answer": "correctness, efficiency, maintainability (readability, modifiability, extensibility, reusability), reliability (robustness), usability, portability  (+ security, completeness, consistency...)", "tip": "Handout 1 목록.", "src": "Handout 1"}, {"id": "2009-1-12", "year": 2009, "no": "1(1)(2)", "pts": 4, "type": "blank", "topics": ["se", "paradigm"], "scope": "in", "prompt": "(1) One goal of SE is to minimize the (c        ) of software development and maintenance. (2) OOP increases (programmer productivity), (    ), (    ), and (    ).", "code": "", "answer": "(1) cost  (2) quality, understandability, scalability (extensibility, reusability), lifetime (maintainability) of software", "tip": "L02 'Why Object Oriented?' 목록.", "src": "L02"}, {"id": "2009-1-345", "year": 2009, "no": "1(3)(4)(5)", "pts": 4, "type": "blank", "topics": ["couple", "constfn", "friend"], "scope": "likely", "prompt": "(3) (    ) is the degree to which each module relies on others. (    ) measures how strongly-related a module's responsibilities are. Maximize (    ) and minimize (    ). (4) (    ) member function does not modify any data members. (5) (    ) function of a class has the right to access the non-public members.", "code": "", "answer": "(3) Coupling, Cohesion, cohesion, coupling  (4) const  (5) friend", "tip": "", "src": "L03, L04"}, {"id": "2009-1-67", "year": 2009, "no": "1(6)(7)", "pts": 2, "type": "blank", "topics": ["inherit"], "scope": "out", "prompt": "(6) An abstract class should contain at least one (    ). (7) (    ) can check whether two classes have inheritance relationship.", "code": "", "answer": "(6) pure virtual function  (7) dynamic_cast", "tip": "", "src": ""}, {"id": "2009-2", "year": 2009, "no": "2", "pts": 6, "type": "short", "topics": ["encap"], "scope": "in", "prompt": "(1) What is encapsulation? (2) Two important benefits and why.", "code": "", "answer": "(1) Concealing the implementation (internal data) of a class so it can be accessed only through its interface.\n(2) ① Safety — clients cannot corrupt internal data directly. ② Implementation independence — implementation can change without affecting clients.", "tip": "", "src": "L02, Handout 2"}, {"id": "2009-3", "year": 2009, "no": "3", "pts": 6, "type": "short", "topics": ["passing"], "scope": "likely", "prompt": "(a) void X::f(T arg) (b) void X::f(T* argp) (c) void X::f(const T* argp). (1) Two purposes of using * in (b) vs (a)? (2) Purpose of const in (c) vs (b)?", "code": "", "answer": "(1) purpose1: avoid copying a large object (only an address is passed → efficient).\n    purpose2: allow the function to modify the caller's object.\n(2) Prevent the function from modifying the pointed-to object (read-only) while keeping the efficiency.", "tip": "2022 기말 4번과 같은 유형 (T& 버전).", "src": "L04 Argument Passing"}, {"id": "2009-4", "year": 2009, "no": "4", "pts": 6, "type": "trace", "topics": ["inherit"], "scope": "out", "prompt": "What is the output? (B with virtual get_val and non-virtual gv2; D1 overrides get_val; D2 declares virtual gv2; called via B* array)", "code": "", "answer": "0 : -1\n1 : -2\n2 : 2\n3 : -4", "tip": "gv2는 B에서 non-virtual이라 B*로 부르면 B::gv2. D2(4)는 B() 기본생성자 → z=-2 → -4. g++ 확인.", "src": ""}, {"id": "2009-5", "year": 2009, "no": "5", "pts": 2, "type": "short", "topics": ["se"], "scope": "in", "prompt": "What is software crisis?", "code": "", "answer": "The difficulty of writing correct, understandable, verifiable programs on time and budget, caused by rapid increases in computer power and the complexity of problems that software technology could not follow.", "tip": "", "src": "L02"}, {"id": "2022F-2", "year": 2022, "no": "기말 2", "pts": 18, "type": "trace", "topics": ["trace", "passing"], "scope": "likely", "prompt": "(1) Meaning of '*' in line 2? (2) '&' in line 3? (3) '&' in line 4? (4) first and second '*' in '*y*x' in line 7? (5) Output of line 9?", "code": "1: int x=5;\n2: int* y;\n3: int& z=x;\n4: y=&x;\n5: int w=*y;\n6: x=9;\n7: z=*y*x;\n8: x++;\n9: cout << x << \" \" << *y << \" \" << z << \" \" << w << endl;", "answer": "(1) pointer type declaration (y is a pointer to int)\n(2) reference type declaration (z is an alias of x)\n(3) address-of operator\n(4) first: the value-of (dereference) operator / second: multiplication\n(5) 82 82 82 5", "tip": "L04 ref.cpp와 거의 같은 코드! x=9 → z=*y*x=81 (z가 x라서 x=81) → x++ → 82. w는 5에서 고정.", "src": "L04 ref.cpp, C++ in Summary 10"}, {"id": "2022F-4", "year": 2022, "no": "기말 4", "pts": 12, "type": "short", "topics": ["passing"], "scope": "likely", "prompt": "(a) void X::f(T arg) (b) void X::f(T& argp) (c) void X::f(const T& argp). (1) Two purposes of '&' in (b) vs (a)? (2) Purpose of const in (c) vs (b)?", "code": "", "answer": "(1) purpose 1: avoid copying the argument (no copy constructor call) → efficient for large objects.\n    purpose 2: the function can modify the caller's original object.\n(2) The function cannot modify the argument (read-only) while still avoiding the copy → safe and efficient.", "tip": "L04: Do not ever use pass by reference (without const) for read-only parameters.", "src": "L04"}]}</script>
<title>객체프 중간 트레이너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: exam-sheet on faint graph paper; red-pen marks for grading. Top bar + tabs, two-pane practice view that stacks on phones. */
:root{
  --paper:#f3f5fa; --sheet:#ffffff; --ink:#1a2132; --muted:#5b6478; --line:#dde2ec;
  --grid:rgba(52,84,196,.07); --accent:#2d52cf; --accent-weak:#e7edfd; --accent-ink:#ffffff;
  --pen:#d1372b; --ok:#1d8656; --ok-weak:#e3f4ec; --warn:#a96d12; --warn-weak:#fbf0dc; --bad:#c3352b; --bad-weak:#fbe6e4;
  --code-bg:#f2f4f9;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-pen:"Nanum Pen Script","Apple SD Gothic Neo",cursive;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e121a; --sheet:#151b26; --ink:#e5e9f2; --muted:#97a0b4; --line:#262e3f;
  --grid:rgba(125,155,255,.05); --accent:#7b98ff; --accent-weak:#1c2643; --accent-ink:#0e121a;
  --pen:#ff6d5f; --ok:#4cc28d; --ok-weak:#143024; --warn:#e2a84b; --warn-weak:#33270f; --bad:#ff6d5f; --bad-weak:#3a1a18;
  --code-bg:#10151f; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0e121a; --sheet:#151b26; --ink:#e5e9f2; --muted:#97a0b4; --line:#262e3f;
  --grid:rgba(125,155,255,.05); --accent:#7b98ff; --accent-weak:#1c2643; --accent-ink:#0e121a;
  --pen:#ff6d5f; --ok:#4cc28d; --ok-weak:#143024; --warn:#e2a84b; --warn-weak:#33270f; --bad:#ff6d5f; --bad-weak:#3a1a18;
  --code-bg:#10151f; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand .course{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{font-family:var(--f-mono);font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);color:var(--muted);white-space:nowrap}
.chip.dday{color:var(--pen);border-color:color-mix(in srgb,var(--pen) 40%,var(--line));font-weight:600}
.chip.live{color:var(--ok)} .chip.local{color:var(--warn)}
